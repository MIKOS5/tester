<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Obvyris Storyteller</title>


<style>

body{
background:#09111d;
color:white;
font-family:Arial,sans-serif;
padding:20px;
}


.storybook{

max-width:900px;
margin:auto;
background:#101c2c;
border-radius:20px;
padding:30px;
box-shadow:0 0 30px #000;

}


h1{

text-align:center;
color:#2793ff;

}


#story{

font-size:20px;
line-height:1.8;

}


.controls{

display:flex;
gap:10px;
justify-content:center;
margin-top:25px;
flex-wrap:wrap;

}


button{

background:#2793ff;
color:white;
border:none;
padding:12px 20px;
border-radius:10px;
cursor:pointer;

}


button:hover{

opacity:.8;

}


input{

width:200px;

}

</style>

</head>


<body>


<div class="storybook">


<h1>📖 Obvyris Storyteller</h1>


<div id="date">
Loading chapter...
</div>


<hr>


<div id="story">
Loading story...
</div>



<div class="controls">


<button onclick="speakStory()">
🔊 Read Story
</button>


<button onclick="pauseStory()">
⏸ Pause
</button>


<button onclick="stopStory()">
⏹ Stop
</button>


<br>


<label>

Speed

<input 
id="speed"
type="range"
min="0.5"
max="2"
step="0.1"
value="1">

</label>


</div>


</div>




<script>


const API_BASE =
"https://script.google.com/macros/s/AKfycbxsknhRwXoQwP7KDGG6pOIIoSSPS9zwYtmMwwIJ14X2IuTSBki313hOpw-eCL7tmQPU/exec";


const STORY_API =
API_BASE+"?action=latest";


const VOICE_API =
API_BASE+"?action=voices";



let currentStory="";

let voiceSettings={};

let browserVoices=[];



// ==========================
// LOAD BROWSER VOICES
// ==========================


function loadBrowserVoices(){

browserVoices =
speechSynthesis.getVoices();

}


speechSynthesis.onvoiceschanged =
loadBrowserVoices;



loadBrowserVoices();




// ==========================
// LOAD STORY
// ==========================


async function loadStory(){


try{


let response =
await fetch(STORY_API);


let data =
await response.json();



if(data.status==="success"){


currentStory =
data.story;



document.getElementById("date")
.innerHTML =
"📅 "+
new Date(data.timestamp)
.toLocaleDateString();



document.getElementById("story")
.innerHTML =
formatStory(data.story);


}



}
catch(e){

document.getElementById("story")
.innerHTML="Story unavailable";

}


}



// ==========================
// LOAD VOICE SHEET
// ==========================


async function loadVoiceSettings(){


try{


let response =
await fetch(VOICE_API);


let data =
await response.json();



if(data.status==="success"){


voiceSettings =
data.voices;


console.log(
"Loaded voices:",
voiceSettings
);


}


}
catch(e){

console.log(
"Voice loading failed",
e
);

}


}





// ==========================
// FORMAT STORY
// ==========================


function formatStory(text){


return text

.replace(/^# (.*)$/gm,
"<h2>$1</h2>")

.replace(/\[(.*?)\]/g,
"<b>[$1]</b>")

.replace(/\n\n/g,
"<br><br>");


}





// ==========================
// FIND CHARACTER
// ==========================


function getCharacter(line){


let match =
line.match(/\[(.*?)\]/);



if(match){

return match[1];

}


return "Narrator";


}





// ==========================
// CLEAN TEXT
// ==========================


function cleanDialogue(text){


return text
.replace(/\[.*?\]/,"")
.trim();


}





// ==========================
// PICK BROWSER VOICE
// ==========================


function selectBrowserVoice(character){


if(!browserVoices.length)
return null;



// Robot voice

if(character==="Obvyris"){


return browserVoices.find(v=>

v.name.includes("David") ||

v.name.includes("Daniel") ||

v.name.includes("Google UK English Male")

)
||
browserVoices[0];


}



// High voice

if(character==="Pip-Squeak"){


return browserVoices.find(v=>

v.name.includes("Samantha") ||

v.name.includes("Google US English")

)
||
browserVoices[1]
||
browserVoices[0];


}


// Random future characters


if(character!=="Narrator"){


return browserVoices[
Math.floor(
Math.random()*browserVoices.length
)
];


}



return browserVoices[0];


}





// ==========================
// READ STORY
// ==========================


function speakStory(){


speechSynthesis.cancel();


let lines =
currentStory.split("\n");


speakLine(lines,0);


}





function speakLine(lines,index){


if(index>=lines.length)
return;



let line =
lines[index].trim();



if(line===""){

speakLine(lines,index+1);

return;

}



let character =
getCharacter(line);



let text =
cleanDialogue(line);



if(text===""){

speakLine(lines,index+1);

return;

}




let settings =
voiceSettings[character];



// fallback

if(!settings){


settings={

pitch:
Math.random()*1.5+0.5,

rate:
Math.random()*0.4+0.8,

volume:1

};


}



let speech =
new SpeechSynthesisUtterance(text);



speech.pitch =
settings.pitch;



speech.rate =
settings.rate *
Number(
document.getElementById("speed").value
);



speech.volume =
settings.volume;



speech.voice =
selectBrowserVoice(character);





speech.onend=function(){

speakLine(lines,index+1);

};



speechSynthesis.speak(speech);


}





// ==========================
// CONTROLS
// ==========================


function pauseStory(){

speechSynthesis.pause();

}



function stopStory(){

speechSynthesis.cancel();

}




loadVoiceSettings();

loadStory();


</script>


</body>

</html>
