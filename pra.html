<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Obvyris Storyteller</title>


<style>

body{
background:#09111d;
color:white;
font-family:Arial,sans-serif;
padding:20px;
}


.storybook{

max-width:900px;
margin:auto;
background:#101c2c;
border-radius:20px;
padding:30px;
box-shadow:0 0 30px #000;

}


h1{
text-align:center;
color:#2793ff;
}


#story{

font-size:20px;
line-height:1.8;

}


#debug{

margin-top:20px;
padding:10px;
background:#050b12;
border-radius:10px;
font-size:14px;
color:#7cff7c;

}


.controls{

display:flex;
gap:10px;
justify-content:center;
margin-top:25px;
flex-wrap:wrap;

}


button{

background:#2793ff;
color:white;
border:none;
padding:12px 20px;
border-radius:10px;
cursor:pointer;

}


button:hover{

opacity:.8;

}


input{

width:200px;

}

</style>


</head>



<body>


<div class="storybook">


<h1>📖 Obvyris Storyteller</h1>


<div id="date">
Loading chapter...
</div>


<hr>


<div id="story">
Loading story...
</div>


<div id="debug">
Voice debug waiting...
</div>



<div class="controls">


<button onclick="speakStory()">
🔊 Read Story
</button>


<button onclick="pauseStory()">
⏸ Pause
</button>


<button onclick="stopStory()">
⏹ Stop
</button>



<label>

Speed

<input 
id="speed"
type="range"
min="0.5"
max="2"
step="0.1"
value="1">

</label>


</div>


</div>





<script>


const API_BASE =
"https://script.google.com/macros/s/AKfycbwdWK9oxbkXE9Df8zv8nVLg1Jn-qQmZCEBGYd7hMV--jF2rk12KV0vM7lwBzo12DMZJ/exec";


const STORY_API =
API_BASE+"?action=latest";


const VOICE_API =
API_BASE+"?action=voices";



let currentStory="";

let voiceSettings={};

let browserVoices=[];




// =================================
// LOAD BROWSER VOICES
// =================================


function loadBrowserVoices(){

browserVoices =
speechSynthesis.getVoices();


console.log(
"Browser voices:",
browserVoices
);

}


speechSynthesis.onvoiceschanged =
loadBrowserVoices;



loadBrowserVoices();





// =================================
// LOAD VOICE SHEET DATA
// =================================


async function loadVoiceSettings(){


console.log(
"Loading voice settings..."
);



try{


let response =
await fetch(VOICE_API);



console.log(
"Voice API status:",
response.status
);



let data =
await response.json();



console.log(
"Voice API:",
data
);



if(data.status==="success"){


voiceSettings =
data.voices;


console.log(
"Loaded settings:",
voiceSettings
);


}



}
catch(e){


console.error(
"Voice load error:",
e
);


}


}





// =================================
// LOAD STORY
// =================================


async function loadStory(){


try{


let response =
await fetch(STORY_API);



let data =
await response.json();



console.log(
"Story:",
data
);



if(data.status==="success"){


currentStory =
data.story;



document.getElementById("date")
.innerHTML =
"📅 "+
new Date(data.timestamp)
.toLocaleDateString();



document.getElementById("story")
.innerHTML =
formatStory(data.story);



}



}
catch(e){


console.error(e);


document.getElementById("story")
.innerHTML =
"Story unavailable";


}


}





// =================================
// FORMAT DISPLAY
// =================================


function formatStory(text){


return text

.replace(/^# (.*)$/gm,
"<h2>$1</h2>")

.replace(/\[(.*?)\]/g,
"<b>[$1]</b>")

.replace(/\n\n/g,
"<br><br>");


}





// =================================
// GET CHARACTER
// =================================


function getCharacter(line){


let match =
line.match(/\[(.*?)\]/);



if(match){

return match[1];

}



return "Narrator";


}





// =================================
// CLEAN TEXT
// =================================


function cleanText(line){


return line
.replace(/\[.*?\]/,"")
.trim();


}





// =================================
// SELECT BROWSER VOICE
// =================================


function selectVoice(character){



if(!browserVoices.length)
return null;



if(character==="Obvyris"){


return browserVoices.find(v=>

v.name.includes("David") ||

v.name.includes("Daniel") ||

v.name.includes("Male")

)
||
browserVoices[0];


}




if(character==="Pip-Squeak"){


return browserVoices.find(v=>

v.name.includes("Samantha") ||

v.name.includes("Female")

)
||
browserVoices[1]
||
browserVoices[0];


}





return browserVoices[0];


}





// =================================
// READ STORY
// =================================


function speakStory(){

speechSynthesis.cancel();


let lines =
currentStory.split("\n");


speakLine(lines,0,"Narrator");

}





function speakLine(lines,index,currentCharacter){


if(index >= lines.length)
return;



let line =
lines[index].trim();



if(line===""){

speakLine(lines,index+1,currentCharacter);

return;

}



// Check if this line changes speaker

let match =
line.match(/\[(.*?)\]/);



if(match){

currentCharacter =
match[1];


// move to next line after tag

speakLine(
lines,
index+1,
currentCharacter
);

return;

}




let text =
line
.replace(/\[.*?\]/,"")
.trim();



if(text===""){

speakLine(
lines,
index+1,
currentCharacter
);

return;

}




let settings =
voiceSettings[currentCharacter];



if(!settings){

settings={

pitch:1,
rate:1,
volume:1

};

}



document.getElementById("debug").innerHTML =

"Speaking: "
+
currentCharacter
+
"<br>Pitch: "
+
settings.pitch
+
"<br>Rate: "
+
settings.rate;





let speech =
new SpeechSynthesisUtterance(text);



speech.pitch =
settings.pitch;



speech.rate =
settings.rate *
Number(
document.getElementById("speed").value
);



speech.volume =
settings.volume;



speech.voice =
selectVoice(currentCharacter);



console.log(
"Speaking:",
currentCharacter,
text,
settings
);



speech.onend=function(){

speakLine(
lines,
index+1,
currentCharacter
);

};



speechSynthesis.speak(speech);


}



// =================================
// CONTROLS
// =================================


function pauseStory(){

speechSynthesis.pause();

}



function stopStory(){

speechSynthesis.cancel();

}





loadVoiceSettings();

loadStory();


</script>


</body>

</html>
