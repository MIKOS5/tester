<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Obvyris Storyteller</title>

<style>

body{
    background:#09111d;
    color:white;
    font-family:Arial, sans-serif;
    padding:20px;
}

.storybook{

    max-width:900px;
    margin:auto;
    background:#101c2c;
    border-radius:20px;
    padding:30px;
    box-shadow:0 0 30px #000;

}


h1{

text-align:center;
color:#2793ff;

}


#story{

font-size:20px;
line-height:1.8;
white-space:normal;

}


.controls{

display:flex;
gap:10px;
justify-content:center;
margin-top:25px;
flex-wrap:wrap;

}


button{

background:#2793ff;
color:white;
border:none;
padding:12px 20px;
border-radius:10px;
cursor:pointer;
font-size:16px;

}


button:hover{

opacity:.8;

}


input{

width:200px;

}


</style>

</head>


<body>


<div class="storybook">


<h1>📖 Obvyris Storyteller</h1>


<div id="date">
Loading chapter...
</div>


<hr>


<div id="story">

Loading story...

</div>


<div class="controls">

<button onclick="speakStory()">
🔊 Read Story
</button>


<button onclick="pauseStory()">
⏸ Pause
</button>


<button onclick="stopStory()">
⏹ Stop
</button>


<br>


<label>
Speed

<input 
type="range"
min="0.5"
max="2"
step="0.1"
value="1"
id="speed">

</label>


</div>


</div>



<script>


const STORY_API =
"https://script.google.com/macros/s/AKfycbxsknhRwXoQwP7KDGG6pOIIoSSPS9zwYtmMwwIJ14X2IuTSBki313hOpw-eCL7tmQPU/exec?action=latest";



let currentStory="";



async function loadStory(){


try{


let response =
await fetch(STORY_API);


let data =
await response.json();



if(data.status==="success"){


currentStory =
data.story;



document.getElementById("date")
.innerHTML =
"📅 "+new Date(data.timestamp)
.toLocaleDateString();



document.getElementById("story")
.innerHTML =
formatStory(data.story);



}



}catch(e){


document.getElementById("story")
.innerHTML =
"Story unavailable";


}


}




function formatStory(text){


return text
.replace(/^# (.*)$/gm,"<h2>$1</h2>")
.replace(/\n\n/g,"<br><br>");

}





function speakStory(){


speechSynthesis.cancel();


let speech =
new SpeechSynthesisUtterance(currentStory);



speech.rate =
document.getElementById("speed").value;


speech.pitch=1;


speech.volume=1;


speechSynthesis.speak(speech);


}




function pauseStory(){

speechSynthesis.pause();

}



function stopStory(){

speechSynthesis.cancel();

}



loadStory();


</script>


</body>

</html>
