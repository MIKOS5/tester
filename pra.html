<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Obvyris Storyteller</title>


<style>

body{
background:#09111d;
color:white;
font-family:Arial,sans-serif;
padding:20px;
}


.storybook{

max-width:900px;
margin:auto;
background:#101c2c;
border-radius:20px;
padding:30px;
box-shadow:0 0 30px #000;

}


h1{
text-align:center;
color:#2793ff;
}


#story{

font-size:20px;
line-height:1.8;

}


#debug{

margin-top:20px;
padding:10px;
background:#050b12;
border-radius:10px;
font-size:14px;
color:#7cff7c;

}


.controls{

display:flex;
gap:10px;
justify-content:center;
margin-top:25px;
flex-wrap:wrap;

}


button{

background:#2793ff;
color:white;
border:none;
padding:12px 20px;
border-radius:10px;
cursor:pointer;

}


button:hover{

opacity:.8;

}


input{

width:200px;

}

</style>


</head>



<body>


<div class="storybook">


<h1>📖 Obvyris Storyteller</h1>


<div id="date">
Loading chapter...
</div>


<hr>


<div id="story">
Loading story...
</div>


<div id="debug">
Voice debug waiting...
</div>



<div class="controls">


<button onclick="speakStory()">
🔊 Read Story
</button>


<button onclick="pauseStory()">
⏸ Pause
</button>


<button onclick="stopStory()">
⏹ Stop
</button>



<label>

Speed

<input 
id="speed"
type="range"
min="0.5"
max="2"
step="0.1"
value="1">

</label>


</div>


</div>





<script>

const API_BASE =
"https://script.google.com/macros/s/AKfycbwdWK9oxbkXE9Df8zv8nVLg1Jn-qQmZCEBGYd7hMV--jF2rk12KV0vM7lwBzo12DMZJ/exec";


const STORY_API =
API_BASE+"?action=latest";


const VOICE_API =
API_BASE+"?action=voices";


let currentStory="";
let voiceSettings={};
let browserVoices=[];



// ===============================
// LOAD BROWSER VOICES
// ===============================

function loadBrowserVoices(){

browserVoices =
speechSynthesis.getVoices();

console.log(
"Available voices:",
browserVoices.map(v=>v.name)
);

}


speechSynthesis.onvoiceschanged =
loadBrowserVoices;


loadBrowserVoices();




// ===============================
// LOAD VOICE SETTINGS
// ===============================


async function loadVoiceSettings(){


try{


let response =
await fetch(VOICE_API);


let data =
await response.json();



console.log(
"VOICE API",
data
);



if(data.status==="success"){


voiceSettings =
data.voices;


console.log(
"VOICE SETTINGS LOADED",
voiceSettings
);


}


}
catch(e){

console.error(
"Voice API error",
e
);

}


}






// ===============================
// LOAD STORY
// ===============================


async function loadStory(){


try{


let response =
await fetch(STORY_API);


let data =
await response.json();



if(data.status==="success"){


currentStory =
data.story;



document.getElementById("date")
.innerHTML =
"📅 "+
new Date(data.timestamp)
.toLocaleDateString();



document.getElementById("story")
.innerHTML =
formatStory(data.story);


}



}
catch(e){

console.error(e);

}


}






// ===============================
// FORMAT
// ===============================


function formatStory(text){


return text

.replace(/^# (.*)$/gm,
"<h2>$1</h2>")

.replace(/\[(.*?)\]/g,
"<b>[$1]</b>")

.replace(/\n\n/g,
"<br><br>");


}







// ===============================
// SELECT VOICE
// ===============================


function selectVoice(character){


let data =
voiceSettings[character];


// Exact voice from sheet

if(data && data.voice){


let exact =
browserVoices.find(v =>
v.name === data.voice
);


if(exact)
return exact;


}


if(!data)
return browserVoices[0];



let type =
data.type;



console.log(
"Selecting:",
character,
type
);



// Narrator

if(type==="Female Narrator"){


return browserVoices.find(v=>

v.name.includes("Samantha") ||

v.name.includes("Zira") ||

v.name.includes("Hazel") ||

v.name.includes("Female")

)
||
browserVoices[0];


}




// Robot

if(type==="Robot"){


return browserVoices.find(v=>

v.name.includes("David") ||

v.name.includes("Daniel") ||

v.name.includes("Male")

)
||
browserVoices[0];


}




// High

if(type==="High"){


return browserVoices.find(v=>

v.name.includes("Samantha") ||

v.name.includes("Female")

)
||
browserVoices[0];


}





// Computer

if(type==="Computer"){


return browserVoices.find(v=>

v.name.includes("Google") ||

v.name.includes("Microsoft")

)
||
browserVoices[0];


}



return browserVoices[0];


}








// ===============================
// SPEAK STORY
// ===============================


function speakStory(){


speechSynthesis.cancel();


let lines =
currentStory.split("\n");


speakLine(
lines,
0,
"Narrator"
);


}







function speakLine(lines,index,currentCharacter){



if(index>=lines.length)
return;



let line =
lines[index].trim();



if(line===""){

speakLine(
lines,
index+1,
currentCharacter
);

return;

}



// speaker change

let tag =
line.match(/\[(.*?)\]/);



if(tag){


currentCharacter =
tag[1];


speakLine(
lines,
index+1,
currentCharacter
);


return;


}




let text =
line.trim();



if(!text){

speakLine(
lines,
index+1,
currentCharacter
);

return;

}





let voiceData =
voiceSettings[currentCharacter];



let settings =
voiceData
?
voiceData.settings
:
{
pitch:1,
rate:1,
volume:1
};





let speech =
new SpeechSynthesisUtterance(text);



speech.pitch =
settings.pitch;



speech.rate =
settings.rate *
Number(
document.getElementById("speed").value
);



speech.volume =
settings.volume;



speech.voice =
selectVoice(currentCharacter);





document.getElementById("debug").innerHTML =

"Speaking: "
+
currentCharacter
+
"<br>Type: "
+
(
voiceData?.type || "Default"
)
+
"<br>Pitch: "
+
settings.pitch
+
"<br>Rate: "
+
settings.rate
+
"<br>Voice: "
+
(
speech.voice
?
speech.voice.name
:
"Default"
);





console.log(
"PLAY",
currentCharacter,
voiceData,
speech.voice?.name
);





speech.onend=function(){


speakLine(
lines,
index+1,
currentCharacter
);


};





speechSynthesis.speak(speech);



}







// ===============================
// CONTROLS
// ===============================


function pauseStory(){

speechSynthesis.pause();

}


function stopStory(){

speechSynthesis.cancel();

}





loadVoiceSettings();

loadStory();
</script>


</body>

</html>
