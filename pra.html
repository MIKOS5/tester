<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Obvyris Storyteller</title>


<style>

body{
background:#09111d;
color:white;
font-family:Arial,sans-serif;
padding:20px;
}


.storybook{

max-width:900px;
margin:auto;
background:#101c2c;
border-radius:20px;
padding:30px;
box-shadow:0 0 30px #000;

}


h1{
text-align:center;
color:#2793ff;
}


#story{

font-size:20px;
line-height:1.8;

}


#debug{

margin-top:20px;
padding:10px;
background:#050b12;
border-radius:10px;
font-size:14px;
color:#7cff7c;

}


.controls{

display:flex;
gap:10px;
justify-content:center;
margin-top:25px;
flex-wrap:wrap;

}


button{

background:#2793ff;
color:white;
border:none;
padding:12px 20px;
border-radius:10px;
cursor:pointer;

}


button:hover{

opacity:.8;

}


input{

width:200px;

}

</style>


</head>



<body>


<div class="storybook">


<h1>📖 Obvyris Storyteller</h1>


<div id="date">
Loading chapter...
</div>


<hr>


<div id="story">
Loading story...
</div>


<div id="debug">
Voice debug waiting...
</div>



<div class="controls">


<button onclick="speakStory()">
🔊 Read Story
</button>


<button onclick="pauseStory()">
⏸ Pause
</button>


<button onclick="stopStory()">
⏹ Stop
</button>



<label>

Speed

<input 
id="speed"
type="range"
min="0.5"
max="2"
step="0.1"
value="1">

</label>


</div>


</div>


<script>

const API_BASE =
"https://script.google.com/macros/s/AKfycbwdWK9oxbkXE9Df8zv8nVLg1Jn-qQmZCEBGYd7hMV--jF2rk12KV0vM7lwBzo12DMZJ/exec";


const STORY_API =
API_BASE+"?action=latest";


const VOICE_API =
API_BASE+"?action=voices";


let currentStory="";
let voiceSettings={};
let browserVoices=[];



// ===============================
// LOAD VOICES
// ===============================

function loadBrowserVoices(){

browserVoices =
speechSynthesis.getVoices();


console.log(
"VOICE LIST",
browserVoices.map(v=>v.name)
);

}



loadBrowserVoices();


speechSynthesis.onvoiceschanged=function(){

loadBrowserVoices();

};



// wait until voices exist

function waitForVoices(){

return new Promise(resolve=>{


let check=setInterval(()=>{


if(browserVoices.length){

clearInterval(check);

resolve();

}


},100);



});


}






// ===============================
// LOAD VOICE SETTINGS
// ===============================


async function loadVoiceSettings(){

try{


let r =
await fetch(VOICE_API);


let data =
await r.json();


console.log(
"VOICE API",
data
);



if(data.status==="success"){

voiceSettings=data.voices;

console.log(
"SETTINGS",
voiceSettings
);

}


}
catch(e){

console.error(
"VOICE ERROR",
e
);

}


}







// ===============================
// LOAD STORY
// ===============================


async function loadStory(){

try{


let r =
await fetch(STORY_API);


let data =
await r.json();


if(data.status==="success"){


currentStory=data.story;


document.getElementById("date").innerHTML =
"📅 "+
new Date(data.timestamp)
.toLocaleDateString();


document.getElementById("story").innerHTML =
formatStory(data.story);


}



}
catch(e){

console.error(e);

}


}






function formatStory(text){

return text

.replace(/^# (.*)$/gm,"<h2>$1</h2>")

.replace(/\[(.*?)\]/g,"<b>[$1]</b>")

.replace(/\n\n/g,"<br><br>");

}







// ===============================
// SELECT VOICE
// ===============================


function selectVoice(character){


let data =
voiceSettings[character];



if(!data){

return browserVoices[0];

}




// EXACT SHEET VOICE

if(data.voice){


let exact =
browserVoices.find(v=>

v.name.trim() === data.voice.trim()

);



if(exact){

console.log(
"USING EXACT:",
exact.name
);


return exact;

}



console.log(
"VOICE NOT FOUND:",
data.voice
);

}




// TYPE FALLBACK


let type=data.type;



if(type==="Female Narrator" ||
type==="Female"){


return browserVoices.find(v=>

v.name.includes("Zira") ||

v.name.includes("Google UK English Female")

)
||
browserVoices[0];


}




if(type==="Robot"){


return browserVoices.find(v=>

v.name.includes("David")

)
||
browserVoices[0];


}





if(type==="High"){


return browserVoices.find(v=>

v.name.includes("Zira") ||

v.name.includes("Samantha")

)
||
browserVoices[0];


}





if(type==="Deep male"){


return browserVoices.find(v=>

v.name.includes("Mark") ||

v.name.includes("David")

)
||
browserVoices[0];


}




return browserVoices[0];


}









// ===============================
// START STORY
// ===============================


async function speakStory(){


speechSynthesis.cancel();


await waitForVoices();



let lines =
currentStory.split("\n");



speakLine(
lines,
0,
"Narrator"
);


}








function speakLine(lines,index,currentCharacter){



if(index>=lines.length){

document.getElementById("debug").innerHTML =
"Finished";

return;

}




let line =
lines[index].trim();



if(!line){

speakLine(
lines,
index+1,
currentCharacter
);

return;

}




let tag =
line.match(/\[(.*?)\]/);



if(tag){


currentCharacter =
tag[1];


speakLine(
lines,
index+1,
currentCharacter
);


return;


}





let voiceData =
voiceSettings[currentCharacter];



let settings =
voiceData?.settings ||
{
pitch:1,
rate:1,
volume:1
};




let voice =
selectVoice(currentCharacter);



let speech =
new SpeechSynthesisUtterance(line);



speech.voice=voice;

speech.pitch=settings.pitch;

speech.rate =
settings.rate *
Number(
document.getElementById("speed").value
);


speech.volume=settings.volume;




document.getElementById("debug").innerHTML =

`
Speaking: ${currentCharacter}<br>
Type: ${voiceData?.type}<br>
Voice: ${voice?.name}<br>
Pitch: ${speech.pitch}<br>
Rate: ${speech.rate}
`;



console.log(
"SPEAKING",
currentCharacter,
voice?.name,
line
);



speech.onerror=function(e){

console.error(
"TTS ERROR",
e
);

};



speech.onend=function(){

speakLine(
lines,
index+1,
currentCharacter
);

};



speechSynthesis.speak(speech);



}







function pauseStory(){

speechSynthesis.pause();

}



function stopStory(){

speechSynthesis.cancel();

}





loadVoiceSettings();

loadStory();


</script>


</body>

</html>
