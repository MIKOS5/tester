<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Video Obvyris TV</title>


<style>

html,body{

margin:0;
padding:0;
background:black;
width:100%;
height:100%;
overflow:hidden;

}


#player{

width:100%;
height:100vh;

}

</style>


</head>


<body>


<div id="player"></div>


<script src="https://www.youtube.com/iframe_api"></script>


<script>


const API =

"https://script.google.com/macros/s/AKfycbwA1FraODA7b2LLXhJfDzvdbK9TfNtSFVqcKQl67P0WjFg4ysOIGHGyq9JyeSN9axy2/exec?action=now";



let player;

let currentURL="";

let ready=false;





function onYouTubeIframeAPIReady(){


player = new YT.Player(
"player",
{

width:"100%",
height:"100%",


playerVars:{

autoplay:1,

controls:0,

rel:0,

playsinline:1

},


events:{

onReady:function(){

ready=true;

sync();

},


onStateChange:function(e){


if(
e.data === YT.PlayerState.PLAYING
){

checkSync();

}


}



}


});


}







async function sync(){


if(!ready)
return;



try{


let r =
await fetch(API);



let data =
await r.json();



if(data.error)
return;



let url=data.url;



if(!url)
return;



// Extract YouTube ID

let id =
extractID(url);





// New program

if(id !== currentURL){



currentURL=id;



player.loadVideoById({

videoId:id,

startSeconds:data.seek

});


}



else{


// Keep clock synced

let current =
player.getCurrentTime();



if(
Math.abs(current-data.seek)>5
){


player.seekTo(
data.seek,
true
);


}



}



}

catch(e){

console.log(e);

}


}








function extractID(url){


let reg =
/(?:youtube\.com\/.*v=|youtu\.be\/)([^&]+)/;



let match =
url.match(reg);



return match ? match[1] : url;


}







function checkSync(){


sync();


}





// station clock poll

setInterval(

sync,

5000

);



</script>


</body>

</html>
