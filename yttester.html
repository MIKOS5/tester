<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Video Obvyris TV</title>

<style>

html,body{

margin:0;
padding:0;
background:black;
width:100%;
height:100%;
overflow:hidden;

}


#player{

width:100%;
height:100vh;
pointer-events:none;

}


/* invisible protection layer */

#lock{

position:absolute;

top:0;
left:0;

width:100%;
height:100%;

z-index:10;

background:transparent;

cursor:none;

}


</style>

</head>


<body>


<div id="player"></div>

<div id="lock"></div>



<script src="https://www.youtube.com/iframe_api"></script>


<script>


const API =
"https://script.google.com/macros/s/AKfycbwA1FraODA7b2LLXhJfDzvdbK9TfNtSFVqcKQl67P0WjFg4ysOIGHGyq9JyeSN9axy2/exec?action=now";



let player;

let playerReady=false;

let currentVideo="";






function onYouTubeIframeAPIReady(){


player = new YT.Player(

"player",

{

height:"100%",
width:"100%",


videoId:"",



playerVars:{


autoplay:1,

controls:0,

disablekb:1,

playsinline:1,

rel:0,

modestbranding:1,

fs:0

},


events:{


onReady:function(){


playerReady=true;


player.mute();


sync();


},



onError:function(error){


console.log(
"YouTube Error",
error.data
);


}


}


});


}









async function sync(){


if(!playerReady)
return;


try{


let response =
await fetch(API);



let data =
await response.json();



if(!data.videoId)
return;





if(data.videoId !== currentVideo){



currentVideo=data.videoId;



player.loadVideoById({

videoId:data.videoId,

startSeconds:Number(data.seek)

});



setTimeout(()=>{


player.mute();

player.playVideo();



},1000);



}



else{


let current =
player.getCurrentTime();



let drift =
Math.abs(
current - Number(data.seek)
);



if(drift > 5){


player.seekTo(

Number(data.seek),

true

);


}


}



}

catch(e){

console.log(e);

}


}






// block keyboard shortcuts

document.addEventListener(
"keydown",
function(e){

e.preventDefault();

}
);



// station sync

setInterval(

sync,

5000

);



</script>


</body>

</html>
