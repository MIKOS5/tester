<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Video Obvyris TV</title>


<style>

html,body{

margin:0;
padding:0;

background:black;

width:100%;
height:100%;

overflow:hidden;

}


#player{

width:100%;
height:100vh;

pointer-events:none;

}


/* audio unlock screen */

#activate{


position:absolute;

z-index:20;


top:0;
left:0;


width:100%;
height:100%;


display:flex;

align-items:center;

justify-content:center;


background:black;


color:white;


font-family:Arial,sans-serif;

font-size:28px;


cursor:pointer;


}


#activate span{

padding:20px 40px;

border:2px solid white;

border-radius:10px;

}


</style>


</head>



<body>


<div id="player"></div>


<div id="activate">

<span>
START VIDEO OBVYRIS TV
</span>

</div>



<script src="https://www.youtube.com/iframe_api"></script>



<script>


const API =

"https://script.google.com/macros/s/AKfycbwA1FraODA7b2LLXhJfDzvdbK9TfNtSFVqcKQl67P0WjFg4ysOIGHGyq9JyeSN9axy2/exec?action=now";



let player;

let playerReady=false;

let currentVideo="";

let activated=false;





function onYouTubeIframeAPIReady(){



player = new YT.Player(

"player",

{


height:"100%",

width:"100%",


videoId:"",


playerVars:{


autoplay:1,

controls:0,

disablekb:1,

playsinline:1,

rel:0,

fs:0

},


events:{


onReady:function(){


playerReady=true;


player.mute();


player.playVideo();


sync();


},


onError:function(e){


console.log(
"YouTube Error",
e.data
);


}


}


});


}









/*
 Audio unlock
*/


document
.getElementById("activate")
.onclick=function(){


if(!playerReady)
return;



player.unMute();

player.setVolume(100);

player.playVideo();


activated=true;


this.style.display="none";


};









async function sync(){


if(!playerReady)
return;



try{


let response =

await fetch(API);



let data =

await response.json();



if(!data.videoId)
return;





if(data.videoId !== currentVideo){



currentVideo=data.videoId;



player.loadVideoById({


videoId:data.videoId,


startSeconds:Number(data.seek)


});



if(activated){

player.unMute();

}



}




else{


let current =

player.getCurrentTime();



let difference =

Math.abs(

current -

Number(data.seek)

);



if(difference > 5){


player.seekTo(

Number(data.seek),

true

);


}



}



}

catch(e){

console.log(e);

}


}







// station clock sync

setInterval(

sync,

5000

);



</script>


</body>

</html>
