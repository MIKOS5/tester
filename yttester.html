<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Video Obvyris TV</title>


<style>

html,body{

margin:0;
padding:0;
background:black;
width:100%;
height:100%;
overflow:hidden;

}


#player{

width:100%;
height:100vh;

}

</style>

</head>


<body>


<div id="player"></div>



<script src="https://www.youtube.com/iframe_api"></script>



<script>


const API =

"https://script.google.com/macros/s/AKfycbwA1FraODA7b2LLXhJfDzvdbK9TfNtSFVqcKQl67P0WjFg4ysOIGHGyq9JyeSN9axy2/exec?action=now";



let player;

let currentVideo="";

let playerReady=false;





function onYouTubeIframeAPIReady(){



player = new YT.Player(

"player",

{


width:"100%",

height:"100%",


playerVars:{


autoplay:1,

controls:1,

playsinline:1,

rel:0


},


events:{


onReady:function(){


playerReady=true;


syncStation();


},



onStateChange:function(e){


if(
e.data === YT.PlayerState.ENDED
){

syncStation();

}


}


}



});


}









async function syncStation(){



if(!playerReady)
return;



try{


let response =

await fetch(API);



let data =

await response.json();



if(data.error)
return;



let videoID =

getYoutubeID(
data.url
);





// new video

if(
videoID !== currentVideo
){



currentVideo = videoID;



player.loadVideoById({

videoId:videoID,

startSeconds:data.seek


});



}

else{


// sync clock


let current =

player.getCurrentTime();



let drift =

Math.abs(
current-data.seek
);



if(drift > 5){


player.seekTo(

data.seek,

true

);


}



}



}

catch(error){


console.log(error);


}



}







function getYoutubeID(url){


if(
url.includes("youtu.be")
){


return url.split("/")
.pop();


}



return new URL(url)
.searchParams
.get("v");


}








// check station clock

setInterval(

syncStation,

5000

);



</script>


</body>

</html>
