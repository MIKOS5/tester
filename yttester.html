<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Video Obvyris Station</title>


<style>

body{

background:#111;
color:white;
font-family:Arial;
margin:0;

}


.container{

max-width:800px;
margin:auto;
padding:20px;

}


h1{

text-align:center;
color:#2793ff;

}



#player{

width:100%;
aspect-ratio:16/9;
background:black;

}



.now{

display:flex;
gap:20px;
align-items:center;

background:#222;
padding:15px;
margin-top:20px;

border-radius:12px;

}



#thumb{

width:120px;
height:120px;

border-radius:10px;

}



button{

padding:12px 25px;

font-size:18px;

margin:20px 5px;

border-radius:10px;

cursor:pointer;

}



.controls{

text-align:center;

}


.status{

text-align:center;
color:#aaa;

}



</style>


</head>


<body>


<div class="container">


<h1>
📺 Video Obvyris Station
</h1>


<div id="player"></div>



<div class="now">


<img id="thumb">


<div>

<h2 id="title">
Connecting...
</h2>


<h3 id="artist"></h3>


<p id="timer"></p>


</div>


</div>




<div class="controls">

<button onclick="playVideo()">
▶ Play
</button>


<button onclick="mute()">
🔇 Mute
</button>


</div>



<p class="status" id="status">
Station connecting...
</p>



</div>





<script src="https://www.youtube.com/iframe_api"></script>



<script>



const STATION_API =

"https://script.google.com/macros/s/AKfycbwA1FraODA7b2LLXhJfDzvdbK9TfNtSFVqcKQl67P0WjFg4ysOIGHGyq9JyeSN9axy2/exec?action=station";





let player;

let currentVideo="";

let synced=false;




function onYouTubeIframeAPIReady(){



player = new YT.Player(
"player",
{

height:"360",

width:"640",

videoId:"",


playerVars:{

autoplay:1,

controls:1

},


events:{

onStateChange:onState

}


});


}







function onState(e){



if(
e.data===YT.PlayerState.PLAYING
){

document.getElementById("status")
.innerHTML=
"ON AIR";


}


}








async function updateStation(){



try{


let response =
await fetch(
STATION_API
);


let data =
await response.json();





let song =
data.current;



if(!song)
return;





document.getElementById("title")
.innerHTML=
song.Title;



document.getElementById("artist")
.innerHTML=
song.Artist;



document.getElementById("thumb")
.src=
song.Thumbnail;





// new song

if(
currentVideo !== song["Video ID"]
){



currentVideo =
song["Video ID"];



player.loadVideoById(
currentVideo
);



// sync station time

setTimeout(()=>{


player.seekTo(
data.position,
true
);


player.playVideo();



},2000);



}





document.getElementById("timer")
.innerHTML=

"Station time: "
+
data.position
+
" sec";





}

catch(e){


document.getElementById("status")
.innerHTML=
"Station offline";


console.log(e);


}



}









function playVideo(){

player.playVideo();

}





function mute(){

player.mute();

}







// sync every 5 seconds

setInterval(

updateStation,

5000

);



// initial load

updateStation();



</script>



</body>

</html>
