<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Video Obvyris TV</title>


<style>

html,body{

margin:0;
padding:0;
background:black;
width:100%;
height:100%;
overflow:hidden;

}


#player{

width:100%;
height:100vh;

}

</style>


</head>


<body>


<div id="player"></div>



<script src="https://www.youtube.com/iframe_api"></script>



<script>


const API = 
"https://script.google.com/macros/s/AKfycbwA1FraODA7b2LLXhJfDzvdbK9TfNtSFVqcKQl67P0WjFg4ysOIGHGyq9JyeSN9axy2/exec?action=now";



let player;

let ready=false;

let currentVideo="";





function onYouTubeIframeAPIReady(){


player = new YT.Player(

"player",

{

width:"100%",

height:"100%",


playerVars:{

autoplay:1,

controls:1,

playsinline:1,

rel:0

},


events:{


onReady:function(){


ready=true;


syncStation();


},


onError:function(e){


console.log(
"YouTube Error:",
e.data
);


}


}



});


}








async function syncStation(){


if(!ready)
return;



try{


let response = await fetch(API);



let data = await response.json();



if(!data.url)
return;




let videoId =
data.videoId;





// New video

if(videoId !== currentVideo){



currentVideo = videoId;



player.loadVideoById({

videoId:videoId,

startSeconds:data.seek


});



}

else{


// Keep synchronized


let localTime =
player.getCurrentTime();



let difference =
Math.abs(
localTime - data.seek
);



if(difference > 5){



player.seekTo(

data.seek,

true

);



}



}



}

catch(err){


console.log(err);


}



}







// station clock sync

setInterval(

syncStation,

5000

);



</script>


</body>

</html>
