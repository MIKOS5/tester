<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Video Obvyris TV</title>

<style>

html,body{
margin:0;
padding:0;
background:black;
width:100%;
height:100%;
overflow:hidden;
}

#player{
width:100%;
height:100vh;
}

</style>

</head>


<body>


<div id="player"></div>


<script src="https://www.youtube.com/iframe_api"></script>


<script>


const API =
"https://YOUR_SCRIPT_URL/exec?action=now";


let player;

let playerReady=false;

let currentVideo="";






function onYouTubeIframeAPIReady(){


player = new YT.Player(
"player",
{

height:"100%",
width:"100%",


videoId:"",


playerVars:{

autoplay:1,
controls:1,
playsinline:1,
rel:0

},


events:{

onReady:function(){


playerReady=true;


player.mute();


sync();


},


onError:function(error){


console.log(
"YouTube Error",
error.data
);


}



}


});


}








async function sync(){


if(!playerReady)
return;


try{


let response =
await fetch(API);



let data =
await response.json();



console.log(data);



if(!data.videoId)
return;



if(data.videoId !== currentVideo){


currentVideo =
data.videoId;



player.loadVideoById({

videoId:data.videoId,

startSeconds:Number(data.seek)

});



setTimeout(()=>{

player.mute();

player.playVideo();


},1000);



}

else{


let current =
player.getCurrentTime();



let difference =
Math.abs(
current - Number(data.seek)
);



if(difference > 5){


player.seekTo(
Number(data.seek),
true
);


}


}



}

catch(e){

console.log(e);

}


}







setInterval(
sync,
5000
);


</script>


</body>

</html>
