<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Video Obvyris TV</title>

<style>

html,body{
margin:0;
background:black;
width:100%;
height:100%;
overflow:hidden;
}

#player{
width:100%;
height:100vh;
}

</style>

</head>


<body>


<div id="player"></div>


<script src="https://www.youtube.com/iframe_api"></script>


<script>


const API =
"YOUR_API_URL?action=now";


let player;

let ready=false;

let currentVideo="";





function onYouTubeIframeAPIReady(){


player = new YT.Player(

"player",

{

width:"100%",

height:"100%",


playerVars:{

autoplay:1,

controls:1,

playsinline:1,

rel:0,

mute:1

},


events:{


onReady:function(){


ready=true;


// required for autoplay

player.mute();

player.playVideo();


syncStation();


},



onStateChange:function(e){


if(
e.data === YT.PlayerState.PLAYING
){

console.log("ON AIR");


}



}


}


});


}







async function syncStation(){


if(!ready)
return;



try{


let r =
await fetch(API);



let data =
await r.json();



if(!data.videoId)
return;



if(
data.videoId !== currentVideo
){



currentVideo=data.videoId;



player.loadVideoById({

videoId:data.videoId,

startSeconds:data.seek

});



player.mute();


player.playVideo();



}

else{


let current =
player.getCurrentTime();



let drift =
Math.abs(
current-data.seek
);



if(drift > 5){


player.seekTo(

data.seek,

true

);


}



}



}

catch(e){

console.log(e);

}


}







setInterval(

syncStation,

5000

);



</script>


</body>

</html>
