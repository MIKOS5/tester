<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Video Obvyris</title>

<style>

html,body{

margin:0;
padding:0;
background:black;
width:100%;
height:100%;
overflow:hidden;

}


#player{

width:100%;
height:100vh;

}

</style>


</head>


<body>


<div id="player"></div>


<script src="https://www.youtube.com/iframe_api"></script>


<script>


const STATION_API =

"https://script.google.com/macros/s/AKfycbwA1FraODA7b2LLXhJfDzvdbK9TfNtSFVqcKQl67P0WjFg4ysOIGHGyq9JyeSN9axy2/exec?action=station";



let player;

let currentVideo="";





function onYouTubeIframeAPIReady(){


player = new YT.Player(

"player",

{

width:"100%",

height:"100%",


videoId:"",


playerVars:{

autoplay:1,

controls:1,

rel:0

}


});


}







async function syncStation(){


try{


let r =
await fetch(STATION_API);



let data =
await r.json();



let video =
data.current;



if(!video)
return;



let id =
video["Video ID"];





if(id !== currentVideo){



currentVideo=id;



player.loadVideoById(id);



setTimeout(()=>{


player.seekTo(
data.position,
true
);



player.playVideo();



},2000);



}



}



catch(e){

console.log(e);

}


}







setInterval(

syncStation,

5000

);



syncStation();



</script>


</body>

</html>
