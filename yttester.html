<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Video Obvyris</title>

<style>

html,body{
margin:0;
padding:0;
background:black;
width:100%;
height:100%;
overflow:hidden;
}

#player{
width:100%;
height:100vh;
}

</style>

</head>


<body>


<div id="player"></div>


<script src="https://www.youtube.com/iframe_api"></script>


<script>


const STATION_API =
"https://script.google.com/macros/s/AKfycbwA1FraODA7b2LLXhJfDzvdbK9TfNtSFVqcKQl67P0WjFg4ysOIGHGyq9JyeSN9axy2/exec?action=station";


let player;

let currentVideo="";



function onYouTubeIframeAPIReady(){


player = new YT.Player(
"player",
{

width:"100%",
height:"100%",


playerVars:{

autoplay:1,
controls:1,
rel:0,
playsinline:1

},


events:{

onReady:function(){

player.mute();

syncStation();

},


onStateChange:function(e){


if(
e.data === YT.PlayerState.ENDED
){

syncStation();

}


}


}


});


}





async function syncStation(){


try{


let response =
await fetch(STATION_API);


let data =
await response.json();



if(!data.current)
return;



let id =
data.current["Video ID"];




if(id !== currentVideo){


currentVideo=id;



player.loadVideoById({

videoId:id,

startSeconds:data.position || 0

});



player.mute();

player.playVideo();



}



}


catch(err){

console.log(err);

}



}





setInterval(
syncStation,
5000
);



</script>


</body>

</html>
