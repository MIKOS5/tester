<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>News Obvyris</title>

<link rel="icon" href="https://mikos5.github.io/tester/navicon.png">


<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">


<style>


:root{

--bg:#070d18;
--panel:#101827;
--panel2:#162235;
--line:#26364d;

--text:#ffffff;
--muted:#93a4bb;

--blue:#2793ff;
--blue2:#1265d8;

--green:#25d366;

}



body.light{

--bg:#f4f7fb;
--panel:#ffffff;
--panel2:#eef3f8;

--line:#d5dfeb;

--text:#102030;
--muted:#60758b;

}



*{

box-sizing:border-box;

}



body{

margin:0;

height:100dvh;

display:flex;

overflow:hidden;

font-family:Inter,sans-serif;

background:var(--bg);

color:var(--text);

}



/* =========================
SIDEBAR
========================= */


.sidebar{

width:300px;

background:var(--panel);

border-right:1px solid var(--line);

padding:25px;

display:flex;

flex-direction:column;

}



.logo{

font-family:Orbitron;

font-size:38px;

font-weight:900;

cursor:pointer;

}



.logo span{

color:var(--blue);

}



.subtitle{

color:var(--muted);

margin-top:8px;

margin-bottom:30px;

font-size:14px;

}



.menu{

display:flex;

flex-direction:column;

gap:12px;

}



button{

background:linear-gradient(
180deg,
var(--blue),
var(--blue2)
);

border:0;

padding:12px 16px;

border-radius:12px;

color:white;

font-weight:800;

cursor:pointer;

font-size:14px;

}



button:hover{

opacity:.85;

}



.stats{

margin-top:auto;

padding:15px;

background:var(--panel2);

border-radius:15px;

font-size:13px;

color:var(--muted);

}



/* =========================
MAIN
========================= */


.main{

flex:1;

overflow:auto;

padding:25px;

}



.header{

display:flex;

justify-content:space-between;

align-items:center;

gap:20px;

flex-wrap:wrap;

}



.title{

font-size:42px;

font-weight:900;

font-family:Orbitron;

}



.search{

margin-top:20px;

width:100%;

max-width:700px;

padding:14px;

border-radius:14px;

border:1px solid var(--line);

background:var(--panel);

color:var(--text);

font-size:16px;

}



/* =========================
NEWS GRID
========================= */


#news{

margin-top:25px;

display:grid;

grid-template-columns:

repeat(auto-fit,minmax(330px,1fr));

gap:20px;

}



/* =========================
NEWS CARD
========================= */


.news-card{

background:var(--panel);

border:1px solid var(--line);

border-radius:22px;

overflow:hidden;

transition:.25s;

}



.news-card:hover{

transform:translateY(-4px);

border-color:var(--blue);

}



.news-image{

width:100%;

height:220px;

object-fit:cover;

display:block;

}



.news-content{

padding:18px;

}



.news-category{

display:inline-block;

background:var(--blue);

padding:5px 10px;

border-radius:20px;

font-size:12px;

font-weight:900;

margin-bottom:12px;

}



.news-title{

font-size:21px;

font-weight:900;

line-height:1.35;

}



.news-meta{

margin-top:12px;

font-size:13px;

color:var(--muted);

line-height:1.6;

}



.news-details{

margin-top:15px;

font-size:14px;

line-height:1.5;

}



.news-message{

margin-top:15px;

padding:12px;

background:var(--panel2);

border-radius:12px;

font-size:14px;

}



.actions{

display:flex;

gap:10px;

flex-wrap:wrap;

margin-top:18px;

}



.actions a{

text-decoration:none;

}



.secondary{

background:var(--panel2);

border:1px solid var(--line);

color:var(--text);

}





/* =========================
CHAT WINDOW
========================= */


.chat-popup{

position:fixed;

right:20px;

bottom:20px;

width:430px;

height:620px;

background:var(--panel);

border:1px solid var(--line);

border-radius:20px;

display:flex;

flex-direction:column;

overflow:hidden;

z-index:9999;

}



.hidden{

display:none;

}



.chat-header{

padding:15px;

background:var(--panel2);

display:flex;

justify-content:space-between;

font-weight:900;

}



.chat-log{

flex:1;

overflow:auto;

padding:15px;

}



.chat-msg{

background:var(--panel2);

padding:12px;

border-radius:12px;

margin-bottom:10px;

}



.chat-name{

color:var(--blue);

font-weight:900;

}



.chat-input{

display:flex;

gap:8px;

padding:10px;

border-top:1px solid var(--line);

}



.chat-input input{

flex:1;

padding:10px;

border-radius:10px;

border:1px solid var(--line);

background:var(--bg);

color:var(--text);

}




/* =========================
MOBILE
========================= */


@media(max-width:800px){


body{

flex-direction:column;

}



.sidebar{

width:100%;

padding:15px;

}



.logo{

font-size:30px;

}



.main{

padding:15px;

}



.title{

font-size:30px;

}



#news{

grid-template-columns:1fr;

}



.chat-popup{

inset:0;

width:100%;

height:100%;

border-radius:0;

}



}



</style>

</head>

<body>


<!-- =========================
SIDEBAR
========================= -->


<div class="sidebar">


<div onclick="window.location='index99.html'">


<div class="logo">

News <span>Obvyris</span>

</div>


<div class="subtitle">

Live News • Community • Discussions

</div>


</div>



<div class="menu">


<button onclick="loadNews()">

↻ Refresh News

</button>



<button onclick="toggleTheme()">

🌙 Toggle Theme

</button>



<button onclick="window.location='Chat_Obvyris.html'">

💬 Chat Obvyris

</button>



<button onclick="window.location='index99.html'">

🏠 Obvyris Hub

</button>



</div>




<div class="stats">


<div>

📰 Articles:

<span id="articleCount">

0

</span>

</div>


<div>

📡 Status:

<span id="apiStatus">

Checking...

</span>

</div>


</div>



</div>






<!-- =========================
MAIN
========================= -->


<div class="main">


<div class="header">


<div class="title">

Latest News

</div>



</div>



<input

class="search"

id="search"

placeholder="Search articles..."

oninput="renderNews()"



>



<div id="news"></div>


</div>







<!-- =========================
CHAT POPUP
========================= -->


<div id="chatPopup" class="chat-popup hidden">


<div class="chat-header">


<span id="chatTitle">

💬 News Discussion

</span>



<button onclick="toggleChat()">

✖

</button>



</div>





<div id="chatLog" class="chat-log">


</div>





<div class="chat-input">


<input

id="chatName"

placeholder="Name"

maxlength="15"


>




<input

id="chatMsg"

placeholder="Message"

maxlength="200"


>




<button onclick="sendChat()">

Send

</button>



</div>



</div>









<script>


const API_URL =

"https://script.google.com/macros/s/AKfycbzin84qDcZ9L1q4pTBtHZGKJSTDcZ_wnmgWmnmgPgf1jrc1nRprzbEBixKMSHcdkxiZBg/exec";





let news=[];


let activeRoom="";


let activeName="";


let chatTimer=null;







/* =========================
LOAD NEWS
========================= */


async function loadNews(){


try{


document.getElementById("apiStatus").innerHTML =
"Loading...";



const response = await fetch(API_URL,{


method:"POST",


body:JSON.stringify({


action:"get",


source:"news"


})


});




const data = await response.json();




console.log("NEWS API:",data);




news = data.map(n=>({


time:n.time || "",


station:n.station || "",


stationName:n.stationName || "",


name:n.name || "",


message:n.message || "",


link:n.link || "",


image:n.image || "",


sourceLink:n.sourceLink || "",


type:n.type || "",


details:n.details || "",


source:n.source || ""


}));




document.getElementById("articleCount").innerHTML =
news.length;



document.getElementById("apiStatus").innerHTML =
"Online";



renderNews();



}

catch(error){


console.error(
"NEWS ERROR",
error
);



document.getElementById("apiStatus").innerHTML =
"Offline";


}


}








/* =========================
RENDER NEWS
========================= */


function renderNews(){



let search =

document
.getElementById("search")
.value
.toLowerCase();




let html="";





news
.slice()
.reverse()
.filter(n=>{


let text = `

${n.stationName}

${n.details}

${n.type}

${n.message}

${n.source}

`

.toLowerCase();



return !search || text.includes(search);



})

.forEach(n=>{


console.log("IMAGE TEST:", n.image);


html += `


<div class="news-card">



${n.image ? `


<img

class="news-image"

src="${n.image}"

loading="lazy"

onerror="this.parentElement.querySelector('.news-image').style.display='none'"


>


`:""}





<div class="news-content">





<div class="news-category">

${n.type || "news"}

</div>





<div class="news-title">

${n.stationName}

</div>






<div class="news-meta">


🕒 ${new Date(n.time).toLocaleString()}


<br>


🤖 ${n.name}


<br>


🌐 ${n.source}


</div>






<div class="news-details">

${n.details || ""}

</div>







<div class="news-message">

${cleanMessage(n.message,n.link)}

</div>







<div class="actions">





<button onclick="openChat(

'${n.station}',

'${escapeJS(n.stationName)}'

)">

💬 Discuss

</button>





${n.link ? `


<a href="${n.link}" target="_blank">


<button>

📰 Article

</button>


</a>


`:""}






${n.sourceLink ? `


<a href="${fixURL(n.sourceLink)}" target="_blank">


<button class="secondary">

🔗 ${n.sourceLink}

</button>


</a>


`:""}





</div>





</div>



</div>



`;





});





document
.getElementById("news")
.innerHTML=html;



}







function cleanMessage(msg,url){


if(!msg)

return "";



return msg

.replace(url,"")

.replace("📰","")

.trim();


}




function fixURL(url){


if(!url)

return "";



return url.startsWith("http")

?

url

:

"https://"+url;


}





function escapeJS(text){


return (text||"")

.replaceAll("\\","\\\\")
.replaceAll("'","\\'");


}


/* =========================
CHAT OPEN
========================= */


function openChat(id,name){


activeRoom=id;

activeName=name;



document.getElementById("chatTitle").innerHTML =

"💬 " + name;



document

.getElementById("chatPopup")

.classList

.remove("hidden");



loadChat();



clearInterval(chatTimer);



chatTimer=setInterval(()=>{


loadChat();


},3000);



}







/* =========================
LOAD CHAT
========================= */


async function loadChat(){


if(!activeRoom)

return;



try{


const res = await fetch(API_URL,{


method:"POST",


body:JSON.stringify({


action:"get",


station:activeRoom


})


});




const data = await res.json();



let html="";



data.forEach(m=>{


html += `


<div class="chat-msg">


<div class="chat-name">

${m.name}

</div>


<div>

${m.message}

</div>


</div>


`;



});



document

.getElementById("chatLog")

.innerHTML=html;



const box =

document.getElementById("chatLog");



box.scrollTop=

box.scrollHeight;



}

catch(e){


console.error(

"Chat error",

e

);


}



}








/* =========================
SEND CHAT
========================= */


async function sendChat(){


let msg =

document

.getElementById("chatMsg")

.value;



if(!msg)

return;



await fetch(API_URL,{


method:"POST",


body:JSON.stringify({


action:"send",


station:activeRoom,


stationName:activeName,


name:

document

.getElementById("chatName")

.value || "Anon",


message:msg



})


});



document

.getElementById("chatMsg")

.value="";



loadChat();


}







/* =========================
CLOSE CHAT
========================= */


function toggleChat(){


document

.getElementById("chatPopup")

.classList

.add("hidden");



clearInterval(chatTimer);



}








/* =========================
ENTER SEND
========================= */


document

.getElementById("chatMsg")

.addEventListener(

"keydown",

function(e){


if(e.key==="Enter"){


e.preventDefault();


sendChat();


}


}

);








/* =========================
THEME
========================= */


function toggleTheme(){


document

.body

.classList

.toggle("light");



localStorage.setItem(

"obvyrisTheme",

document.body.classList.contains("light")

?

"light"

:

"dark"

);


}




function loadTheme(){


if(

localStorage.getItem("obvyrisTheme")

==="light"

){


document

.body

.classList

.add("light");


}


}








/* =========================
INIT
========================= */


loadTheme();


loadNews();



</script>


</body>

</html>
