<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>News Obvyris</title>

<link rel="icon" href="https://mikos5.github.io/tester/navicon.png">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">


<style>

:root{
--bg:#09111d;
--panel:#111827;
--line:#253347;
--text:#fff;
--muted:#93a4bb;
--blue:#2793ff;
--blue-dark:#1869d9;
}


body.light{

--bg:#f4f6f8;
--panel:#fff;
--line:#d9e2ec;
--text:#102a43;
--muted:#627d98;

}


*{
box-sizing:border-box;
}


body{

margin:0;
font-family:Inter,sans-serif;
background:var(--bg);
color:var(--text);

display:flex;

height:100vh;

overflow:hidden;

}



/* SIDEBAR */


.sidebar{

width:300px;

background:var(--panel);

border-right:1px solid var(--line);

padding:20px;

}



.logo{

font-family:Orbitron;
font-size:38px;
font-weight:900;

}


.logo span{

color:var(--blue);

}


.subtitle{

color:var(--muted);

font-size:13px;

margin-bottom:20px;

}


button{

background:linear-gradient(
180deg,
var(--blue),
var(--blue-dark)
);

border:0;

border-radius:12px;

padding:12px;

color:white;

font-weight:800;

cursor:pointer;

}



.player{

display:flex;

flex-direction:column;

gap:10px;

}



/* MAIN */


.main{

flex:1;

padding:20px;

overflow:auto;

}



.title{

font-size:40px;

font-weight:900;

margin-bottom:20px;

}



/* SEARCH */


input{

background:var(--bg);

color:var(--text);

border:1px solid var(--line);

border-radius:10px;

padding:10px;

font-size:16px;

width:100%;

margin-bottom:15px;

}



/* NEWS */


.news-card{

background:var(--panel);

border:1px solid var(--line);

border-radius:16px;

padding:16px;

margin-bottom:15px;

}



.news-card:hover{

border-color:var(--blue);

}



.news-title{

font-weight:900;

font-size:18px;

}



.news-details{

color:var(--muted);

margin-top:8px;

font-size:14px;

}



.news-image{

width:100%;

max-width:600px;

border-radius:12px;

margin-top:12px;

}



.news-actions{

display:flex;

gap:10px;

margin-top:12px;

}



/* CHAT */


.chat-popup{

position:fixed;

right:20px;

bottom:20px;

width:420px;

height:600px;

background:var(--panel);

border:1px solid var(--line);

border-radius:18px;

display:flex;

flex-direction:column;

overflow:hidden;

z-index:99999;

}



.hidden{

display:none;

}



.chat-header{

padding:12px;

background:var(--bg);

border-bottom:1px solid var(--line);

display:flex;

justify-content:space-between;

font-weight:800;

}



.chat-log{

flex:1;

overflow:auto;

padding:10px;

}



.chat-msg{

background:var(--bg);

border-radius:10px;

padding:10px;

margin-bottom:8px;

}



.chat-name{

color:var(--blue);

font-weight:800;

}



.chat-input{

display:flex;

gap:6px;

padding:10px;

border-top:1px solid var(--line);

}


.chat-input input{

margin:0;

}


@media(max-width:700px){


body{

flex-direction:column;

}


.sidebar{

width:100%;

}


.chat-popup{

inset:0;

width:100%;

height:100%;

border-radius:0;

}


.title{

font-size:28px;

}


}


</style>

</head>


<body>



<div class="sidebar">


<div onclick="window.location='index99.html'">

<div class="logo">

News <span>Obvyris</span>

</div>


<div class="subtitle">

Live News • Discussions • Community

</div>

</div>



<div class="player">


<button onclick="window.location='Chat_Obvyris.html'">

💬 Chat Obvyris

</button>


<button onclick="loadNews()">

↻ Refresh News

</button>


<button onclick="toggleTheme()">

🌙 Theme

</button>


</div>


</div>





<div class="main">


<div class="title">

Latest News

</div>


<input id="search"
placeholder="Search news..."
oninput="renderNews()">



<div id="news"></div>



</div>





<div id="chatPopup" class="chat-popup hidden">


<div class="chat-header">

<span id="chatTitle">
Discussion
</span>


<button onclick="toggleChat()">
✖
</button>


</div>



<div id="chatLog" class="chat-log"></div>



<div class="chat-input">


<input id="chatName"
placeholder="name"
maxlength="10">


<input id="chatMsg"
placeholder="message"
maxlength="120">


<button onclick="sendChat()">
Send
</button>


</div>



</div>





<script>



const API_URL =
"https://script.google.com/macros/s/AKfycbzin84qDcZ9L1q4pTBtHZGKJSTDcZ_wnmgWmnmgPgf1jrc1nRprzbEBixKMSHcdkxiZBg/exec";



let news=[];

let activeRoom="";

let activeName="";



async function loadNews(){


const res=await fetch(API_URL,{

method:"POST",

body:JSON.stringify({

action:"get",

source:"news"

})

});


news=await res.json();


renderNews();


}




function renderNews(){


let q=document
.getElementById("search")
.value
.toLowerCase();



let html="";



news
.slice()
.reverse()
.filter(n=>{


return !q ||
(n.stationName||"")
.toLowerCase()
.includes(q)

})

.forEach(n=>{


html+=`

<div class="news-card">


<div class="news-title">

${n.stationName || "News"}

</div>


<div class="news-details">

${n.message || ""}

</div>



${n["img link"] ? `

<img class="news-image"
src="${n["img link"]}">

`:''}



<div class="news-actions">


<button onclick="openChat(
'${n.station}',
'${escapeText(n.stationName)}'
)">

💬 Discuss

</button>



<a href="${n.Link || '#'}"
target="_blank">

<button>

Read

</button>

</a>


</div>


</div>


`;


});


document.getElementById("news").innerHTML=html;


}





function escapeText(t){

return (t||"")
.replaceAll("'","\\'");

}




function openChat(id,name){


activeRoom=id;

activeName=name;


document.getElementById("chatTitle")
.innerText="💬 "+name;


document
.getElementById("chatPopup")
.classList
.remove("hidden");


loadChat();


}





async function loadChat(){


const res=await fetch(API_URL,{

method:"POST",

body:JSON.stringify({

action:"get",

station:activeRoom

})

});


let data=await res.json();



document.getElementById("chatLog")
.innerHTML=data.map(m=>`

<div class="chat-msg">

<span class="chat-name">

${m.name}

</span>

<br>

${m.message}

</div>


`).join("");



}





async function sendChat(){


let msg=document.getElementById("chatMsg").value;


if(!msg)return;



await fetch(API_URL,{

method:"POST",

body:JSON.stringify({

action:"send",

station:activeRoom,

stationName:activeName,

name:
document.getElementById("chatName").value || "Anon",

message:msg


})

});



document.getElementById("chatMsg").value="";


loadChat();


}




function toggleChat(){

document
.getElementById("chatPopup")
.classList
.toggle("hidden");

}




function toggleTheme(){

document.body.classList.toggle("light");

}



setInterval(()=>{

if(!document
.getElementById("chatPopup")
.classList.contains("hidden"))

loadChat();


},3000);




loadNews();


</script>


</body>
</html>
