<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>News Obvyris</title>

<link rel="icon" href="https://mikos5.github.io/tester/navicon.png">


<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">


<style>


:root{

--bg:#070d18;
--panel:#101827;
--panel2:#162235;
--line:#26364d;

--text:#ffffff;
--muted:#93a4bb;

--blue:#2793ff;
--blue2:#1265d8;

--green:#25d366;

}



body.light{

--bg:#f4f7fb;
--panel:#ffffff;
--panel2:#eef3f8;

--line:#d5dfeb;

--text:#102030;
--muted:#60758b;

}



*{

box-sizing:border-box;

}



body{

margin:0;

height:100dvh;

display:flex;

overflow:hidden;

font-family:Inter,sans-serif;

background:var(--bg);

color:var(--text);

}



/* =========================
SIDEBAR
========================= */


.sidebar{

width:300px;

background:var(--panel);

border-right:1px solid var(--line);

padding:25px;

display:flex;

flex-direction:column;

}



.logo{

font-family:Orbitron;

font-size:38px;

font-weight:900;

cursor:pointer;

}



.logo span{

color:var(--blue);

}

/* =========================
FIXED MAIN HEADER
========================= */

/* =========================
MAIN SCROLLBAR THEME
========================= */

.main{
    scrollbar-width:thin;
    scrollbar-color:var(--line) var(--panel);
}


/* Chrome / Edge / Safari */

.main::-webkit-scrollbar{
    width:10px;
}


.main::-webkit-scrollbar-track{
    background:var(--panel);
}


.main::-webkit-scrollbar-thumb{
    background:var(--line);
    border-radius:20px;
}


.main::-webkit-scrollbar-thumb:hover{
    background:var(--blue);
}


/* Keep title/search locked while news scrolls */

.header{
    position:sticky;
    top:0;
    z-index:100;

    background:var(--bg);

    padding-bottom:15px;
}


/* Keep search attached to header */

.search{
    position:sticky;
    top:75px;
    z-index:99;

    background:var(--panel);
}

.subtitle{

color:var(--muted);

margin-top:8px;

margin-bottom:30px;

font-size:14px;

}



.menu{

display:flex;

flex-direction:column;

gap:12px;

}


/* NEWS TYPE FILTERS */


#typeFilters{

display:flex;

flex-direction:column;

gap:10px;

margin-top:10px;

}



.filter-title{

font-size:14px;

font-weight:900;

color:var(--muted);

margin-top:10px;

}



.filter-btn{

background:var(--panel2);

border:1px solid var(--line);

color:var(--text);

text-align:left;

}



.filter-btn.active{

background:var(--blue);

color:white;

border-color:var(--blue);

}




button{

background:linear-gradient(
180deg,
var(--blue),
var(--blue2)
);

border:0;

padding:12px 16px;

border-radius:12px;

color:white;

font-weight:800;

cursor:pointer;

font-size:14px;

}



button:hover{

opacity:.85;

}



.stats{

margin-top:auto;

padding:15px;

background:var(--panel2);

border-radius:15px;

font-size:13px;

color:var(--muted);

}



/* =========================
MAIN
========================= */


.main{

flex:1;

overflow:auto;

padding:25px;

}



.header{

display:flex;

justify-content:space-between;

align-items:center;

gap:20px;

flex-wrap:wrap;

}



.title{

font-size:42px;

font-weight:900;

font-family:Orbitron;

}



.search{

margin-top:20px;

width:100%;

max-width:700px;

padding:14px;

border-radius:14px;

border:1px solid var(--line);

background:var(--panel);

color:var(--text);

font-size:16px;

}

/* =========================
SCROLLABLE NEWS CATEGORIES
========================= */

/* =========================
HIDE NEWS CATEGORY SCROLLBAR
========================= */

#typeFilters{

    max-height:300px;

    overflow-y:auto;

    scrollbar-width:none; /* Firefox */

    -ms-overflow-style:none; /* IE/Edge */

}


/* Chrome / Android / Safari */

#typeFilters::-webkit-scrollbar{

    display:none;

}


#typeFilters::-webkit-scrollbar-thumb{

    background:var(--line);

    border-radius:10px;

}

/* =========================
NEWS GRID
========================= */


#news{

margin-top:25px;

display:grid;

grid-template-columns:

repeat(auto-fit,minmax(330px,1fr));

gap:20px;

}



/* =========================
NEWS CARD
========================= */


.news-card{

background:var(--panel);

border:1px solid var(--line);

border-radius:22px;

overflow:hidden;

transition:.25s;

}



.news-card:hover{

transform:translateY(-4px);

border-color:var(--blue);

}



.news-image{
    width:100%;
    aspect-ratio:16 / 7;
    height:auto;
    object-fit:cover;
    display:block;
}



.news-content{

padding:18px;

}



.news-category{

display:inline-block;

background:var(--blue);

padding:5px 10px;

border-radius:20px;

font-size:12px;

font-weight:900;

margin-bottom:12px;

}



.news-title{

font-size:21px;

font-weight:900;

line-height:1.35;

}



.news-meta{

margin-top:12px;

font-size:13px;

color:var(--muted);

line-height:1.6;

}



.news-details{

margin-top:15px;

font-size:14px;

line-height:1.5;

}



.news-message{

margin-top:15px;

padding:12px;

background:var(--panel2);

border-radius:12px;

font-size:14px;

}



.actions{

display:flex;

gap:10px;

flex-wrap:wrap;

margin-top:18px;

}



.actions a{

text-decoration:none;

}



.secondary{

background:var(--panel2);

border:1px solid var(--line);

color:var(--text);

}





/* =========================
CHAT WINDOW
========================= */


.chat-popup{

position:fixed;

right:20px;

bottom:20px;

width:430px;

height:620px;

background:var(--panel);

border:1px solid var(--line);

border-radius:20px;

display:flex;

flex-direction:column;

overflow:hidden;

z-index:9999;

}



.hidden{

display:none;

}



.chat-header{

padding:15px;

background:var(--panel2);

display:flex;

justify-content:space-between;

font-weight:900;

}



.chat-log{

flex:1;

overflow:auto;

padding:15px;

}



.chat-msg{

background:var(--panel2);

padding:12px;

border-radius:12px;

margin-bottom:10px;

}



.chat-name{

color:var(--blue);

font-weight:900;

}



.chat-input{

display:flex;

gap:8px;

padding:10px;

border-top:1px solid var(--line);

}



.chat-input input{

flex:1;

padding:10px;

border-radius:10px;

border:1px solid var(--line);

background:var(--bg);

color:var(--text);

}




/* =========================
MOBILE
========================= */


/* =====================================================
ANDROID / MOBILE OPTIMIZATION
===================================================== */

html{
    height:100%;
    -webkit-text-size-adjust:100%;
    text-size-adjust:100%;
    overscroll-behavior:none;
}

body{
    min-height:100dvh;
    min-height:100svh;
    overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
    touch-action:manipulation;
}

/* Better scrolling */

*{
    -webkit-overflow-scrolling:touch;
}

img{
    max-width:100%;
    display:block;
}

/* =====================================================
TABLETS
===================================================== */

@media (max-width:1000px){

.sidebar{
    width:240px;
}

#news{
    grid-template-columns:
    repeat(auto-fill,minmax(300px,1fr));
}

}

/* =====================================================
ANDROID PHONE
===================================================== */

@media (max-width:800px){

body{

    display:block;

    overflow-x:hidden;

    overflow-y:auto;

    background:var(--bg);

}

/* ---------- Sidebar ---------- */

.sidebar{

    width:100%;

    border-right:none;

    border-bottom:1px solid var(--line);

    padding:
        max(14px,env(safe-area-inset-top))
        14px
        14px
        14px;

    position:sticky;

    top:0;

    z-index:500;

}

.logo{

    font-size:28px;

    text-align:center;

}

.subtitle{

    text-align:center;

    margin-bottom:16px;

}

/* ---------- Menu ---------- */

.menu{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:10px;

}

.menu button{

    width:100%;

}

.filter-title{

    grid-column:1/-1;

    margin-top:6px;

}

/* ---------- Filters ---------- */

#typeFilters{

    display:flex;

    flex-direction:row;

    flex-wrap:wrap;

    gap:8px;

}

.filter-btn{

    flex:1 0 auto;

    min-height:44px;

    font-size:14px;

    text-align:center;

}

/* ---------- Stats ---------- */

.stats{

    margin-top:16px;

    padding:12px;

    display:flex;

    justify-content:space-between;

    gap:12px;

    flex-wrap:wrap;

}

/* ---------- Main ---------- */



.header{

    display:block;

}

.title{

    font-size:28px;

    text-align:center;

    margin-bottom:12px;

}

.search{

    width:100%;

    max-width:none;

    margin-top:0;

    padding:15px;

    font-size:16px;

    border-radius:14px;

}

/* ---------- News ---------- */

#news{

    margin-top:16px;

    display:grid;

    grid-template-columns:1fr;

    gap:16px;

}

.news-card{

    border-radius:18px;

}

.news-card:hover{

    transform:none;

}

.news-image{

    width:100%;

    aspect-ratio:16/9;

    height:auto;

}

.news-content{

    padding:15px;

}

.news-category{

    font-size:11px;

}

.news-title{

    font-size:20px;

    line-height:1.35;

}

.news-meta{

    font-size:13px;

}

.news-details{

    font-size:15px;

}

.news-message{

    font-size:15px;

    line-height:1.6;

}

/* ---------- Buttons ---------- */

button{

    min-height:48px;

    padding:14px 18px;

    font-size:15px;

}

.actions{

    display:grid;

    grid-template-columns:1fr;

    gap:10px;

}

.actions a{

    width:100%;

}

.actions button{

    width:100%;

}

/* ---------- Chat ---------- */

.chat-popup{

    position:fixed;

    inset:0;

    width:100%;

    height:100dvh;

    height:100svh;

    border-radius:0;

    border:none;

    padding-bottom:env(safe-area-inset-bottom);

}

.chat-header{

    min-height:60px;

    font-size:18px;

    align-items:center;

}

.chat-log{

    padding:12px;

}

.chat-msg{

    font-size:15px;

}

.chat-input{

    padding:10px;

    gap:8px;

    flex-wrap:wrap;

}

.chat-input input{

    width:100%;

    min-height:48px;

    font-size:16px;

}

.chat-input button{

    width:100%;

}

/* ---------- Links ---------- */

a{

    word-break:break-word;

}

/* ---------- Prevent Zoom ---------- */

input,
textarea,
select{

    font-size:16px;

}

/* ---------- Spacing ---------- */

.main:last-child{

    padding-bottom:
        calc(30px + env(safe-area-inset-bottom));

}

}

/* =====================================================
SMALL PHONES (Galaxy A15, Pixel, etc.)
===================================================== */

@media (max-width:430px){

.logo{

    font-size:24px;

}

.title{

    font-size:24px;

}

.news-title{

    font-size:18px;

}

.news-message{

    font-size:14px;

}

.news-details{

    font-size:14px;

}

button{

    font-size:14px;

}

.search{

    font-size:16px;

}

.chat-header{

    font-size:16px;

}

}

/* =====================================================
LANDSCAPE PHONE
===================================================== */

@media (max-height:500px) and (orientation:landscape){

.sidebar{

    position:relative;

}

.news-image{

    aspect-ratio:21/9;

}

.chat-popup{

    height:100vh;

}

}

@media(max-width:800px){

#typeFilters{

    overflow-x:auto;

    overflow-y:hidden;

    scrollbar-width:none;

    -ms-overflow-style:none;

}


#typeFilters::-webkit-scrollbar{

    display:none;

}

}
</style>

</head>


<body>


<!-- =========================
SIDEBAR
========================= -->


<div class="sidebar">


<div onclick="window.location='index99.html'">


<div class="logo">

News <span>Obvyris</span>

</div>


<div class="subtitle">

Live News • Community • Discussions

</div>


</div>



<div class="menu">


<button onclick="loadNews()">

↻ Refresh News

</button>



<button onclick="toggleTheme()">

🌙 Toggle Theme

</button>



<div class="filter-title">

📰 News Categories

</div>


<div id="typeFilters">

</div>


</div>





<div class="stats">


<div>

📰 Articles:

<span id="articleCount">

0

</span>

</div>


<div>

📡 Status:

<span id="apiStatus">

Checking...

</span>

</div>


</div>



</div>






<!-- =========================
MAIN
========================= -->


<div class="main">


<div class="header">

    <div class="title">
        Latest News
    </div>

    <input
    class="search"
    id="search"
    placeholder="Search articles..."
    oninput="renderNews()"
    >

</div>



<div id="news"></div>


</div>







<!-- =========================
CHAT POPUP
========================= -->


<div id="chatPopup" class="chat-popup hidden">

<div class="chat-header">

<span id="popupTitle">
💬 Discussion
</span>

<div>
<button onclick="toggleChatFullscreen()">⛶</button>
<button onclick="toggleChatPopup()">✖</button>
</div>

</div>


<div id="popupMessages" class="chat-log"></div>


<div class="chat-input">

<input id="popupName"
placeholder="Name"
maxlength="15">


<input id="popupMsg"
placeholder="Message"
maxlength="200">


<button onclick="sendPopupMsg()">
Send
</button>


</div>



</div>

<script>


const API_URL =

"https://script.google.com/macros/s/AKfycbzin84qDcZ9L1q4pTBtHZGKJSTDcZ_wnmgWmnmgPgf1jrc1nRprzbEBixKMSHcdkxiZBg/exec";



let news=[];

let activeRoom = "global";
let activeRoomName = "";
let popupRefreshTimer = null;
let lastPopupHash = "";
let messages = [];
let autoScroll = true;

let activeType="all";





/* =========================
LOAD NEWS
========================= */


async function loadNews(){


try{


document.getElementById("apiStatus").innerHTML =
"Loading...";



const response = await fetch(API_URL,{

method:"POST",

body:JSON.stringify({

action:"get",

source:"news"

})

});



const data = await response.json();



console.log("NEWS API:",data);



news = data.map(n=>({

time:n.time || "",
station:n.station || "",
stationName:n.stationName || "",
name:n.name || "",
message:n.message || "",
link:n.link || "",
image:n.image || "",
sourceLink:n.sourceLink || "",
type:n.type || "",
details:n.details || "",
source:n.source || ""

}));


// SORT NEWEST FIRST USING TIMESTAMP COLUMN A
news.sort((a,b)=>{

    return new Date(b.time) - new Date(a.time);

});





document.getElementById("articleCount").innerHTML =
news.length;



document.getElementById("apiStatus").innerHTML =
"Online";



buildTypeFilters();


renderNews();



}


catch(error){


console.error(
"NEWS ERROR",
error
);



document.getElementById("apiStatus").innerHTML =
"Offline";


}


}








/* =========================
BUILD TYPE FILTERS
========================= */


function buildTypeFilters(){


let types = new Set();



news.forEach(n=>{


if(n.type){


n.type

.split(",")

.forEach(t=>{


types.add(t.trim());


});


}


});



let html = `


<button class="filter-btn active"

onclick="filterType('all',this)">

📰 All News

</button>


`;




[...types]

.sort()

.forEach(type=>{


html += `


<button class="filter-btn"

onclick="filterType('${escapeJS(type)}',this)">

${type}

</button>


`;


});



document

.getElementById("typeFilters")

.innerHTML = html;



}








function filterType(type,btn){


activeType=type;



document

.querySelectorAll(".filter-btn")

.forEach(b=>{


b.classList.remove("active");


});



btn.classList.add("active");



renderNews();


}










/* =========================
RENDER NEWS
========================= */


function renderNews(){


let search =

document

.getElementById("search")

.value

.toLowerCase();




let html="";




news

.slice()

.filter(n=>{


let text = `

${n.stationName}

${n.details}

${n.type}

${n.message}

${n.source}

`

.toLowerCase();




let searchMatch =

!search || text.includes(search);





let typeMatch=true;



if(activeType!=="all"){


typeMatch = n.type

.toLowerCase()

.includes(activeType.toLowerCase());


}




return searchMatch && typeMatch;



})

.forEach(n=>{


html += `


<div class="news-card">



${n.image ? `

<img

class="news-image"

src="${n.image}"

loading="lazy"

onerror="this.style.display='none'"

>

`:""}





<div class="news-content">



<div class="news-category">

${n.type || "news"}

</div>





<div class="news-title">

${n.stationName}

</div>





<div class="news-meta">


🕒 ${new Date(n.time).toLocaleString()}

<br>

🤖 ${n.name}

<br>

🌐 ${n.source}


</div>





<div class="news-details">

${n.details || ""}

</div>





<div class="news-message">

${cleanMessage(n.message,n.link)}

</div>






<div class="actions">



<button onclick="openChat(

'${n.station}',

'${escapeJS(n.stationName)}'

)">

💬 Discuss

</button>





${n.link ? `

<a href="${n.link}" target="_blank">

<button>

📰 Article

</button>

</a>

`:""}





${n.sourceLink ? `

<a href="${fixURL(n.sourceLink)}" target="_blank">

<button class="secondary">

🔗 ${n.sourceLink}

</button>

</a>

`:""}



</div>



</div>



</div>



`;



});





document

.getElementById("news")

.innerHTML=html;


}







function cleanMessage(msg,url){


if(!msg)

return "";



return msg

.replace(url,"")

.replace("📰","")

.trim();


}






function fixURL(url){


if(!url)

return "";



return url.startsWith("http")

?

url

:

"https://"+url;


}







function escapeJS(text){


return (text||"")

.replaceAll("\\","\\\\")
.replaceAll("'","\\'");


}








/* =========================
CHAT
========================= */


function openChat(id,name){

activeRoom=id;

activeRoomName=name;

lastPopupHash="";


document.getElementById("popupTitle").innerHTML =
"💬 " + name;


toggleChatPopup();

loadPopup();


}

async function loadPopup(){

if(!activeRoom)
return;


const res = await fetch(API_URL,{
method:"POST",
body:JSON.stringify({

action:"get",

station:activeRoom

})

});


const data = await res.json();


let html="";


data.forEach(m=>{

html += `

<div class="chat-msg">

<div class="chat-name">
${m.name}
</div>

<div>
${m.message}
</div>

</div>

`;

});


document.getElementById("popupMessages").innerHTML=html;


const chat =
document.getElementById("popupMessages");


chat.scrollTop =
chat.scrollHeight;


}




async function loadChat(){


if(!activeRoom)

return;



try{


const res = await fetch(API_URL,{


method:"POST",


body:JSON.stringify({


action:"get",


station:activeRoom


})


});



const data = await res.json();



let html="";



data.forEach(m=>{


html += `


<div class="chat-msg">


<div class="chat-name">

${m.name}

</div>


<div>

${m.message}

</div>


</div>


`;


});



document.getElementById("chatLog").innerHTML=html;



document.getElementById("chatLog").scrollTop=

document.getElementById("chatLog").scrollHeight;



}


catch(e){


console.error("Chat error",e);


}


}

async function sendPopupMsg(){

const msg =
document.getElementById("popupMsg").value;


if(!msg)
return;


await fetch(API_URL,{

method:"POST",

body:JSON.stringify({

action:"send",

station:activeRoom,

stationName:activeRoomName,

name:
document.getElementById("popupName").value || "Anon",

message:msg

})

});


document.getElementById("popupMsg").value="";


loadPopup();

}

function toggleChatPopup(){

const popup =
document.getElementById("chatPopup");


popup.classList.toggle("hidden");


if(!popup.classList.contains("hidden")){


clearInterval(popupRefreshTimer);


popupRefreshTimer=setInterval(()=>{

loadPopup();

},2000);


}
else{

clearInterval(popupRefreshTimer);

}


}

function toggleChatFullscreen(){

document
.getElementById("chatPopup")
.classList.toggle("fullscreen");

}
    
/* =========================
THEME
========================= */


function toggleTheme(){


document

.body

.classList

.toggle("light");



localStorage.setItem(

"obvyrisTheme",

document.body.classList.contains("light")

?

"light"

:

"dark"

);


}





function loadTheme(){


if(localStorage.getItem("obvyrisTheme")==="light"){


document

.body

.classList

.add("light");


}


}






/* =========================
INIT
========================= */


loadTheme();

loadNews();

document
.getElementById("popupMsg")
.addEventListener("keydown",e=>{

if(e.key==="Enter"){

e.preventDefault();

sendPopupMsg();

}

});

</script>


</body>

</html>
