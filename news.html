<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>News Obvyris</title>

<link rel="icon" href="https://mikos5.github.io/tester/navicon.png">


<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">


<style>

:root{

--bg:#09111d;
--panel:#111827;
--panel2:#0b1220;
--line:#253347;
--text:#ffffff;
--muted:#93a4bb;
--blue:#2793ff;
--blue-dark:#1869d9;

}


body.light{

--bg:#f4f6f8;
--panel:#ffffff;
--panel2:#eef3f8;
--line:#d9e2ec;
--text:#102a43;
--muted:#627d98;

}


*{
box-sizing:border-box;
}



body{

margin:0;

font-family:Inter,sans-serif;

background:var(--bg);

color:var(--text);

height:100dvh;

display:flex;

overflow:hidden;

}



/* BUTTONS */

button{

background:linear-gradient(
180deg,
var(--blue),
var(--blue-dark)
);

border:none;

border-radius:12px;

padding:10px 14px;

color:white;

font-weight:800;

cursor:pointer;

}



button:hover{

opacity:.85;

}




/* SIDEBAR */

.sidebar{

width:320px;

background:var(--panel);

border-right:1px solid var(--line);

padding:20px;

flex-shrink:0;

}



.logo{

font-family:Orbitron;

font-size:40px;

font-weight:900;

cursor:pointer;

}



.logo span{

color:var(--blue);

}



.subtitle{

color:var(--muted);

font-size:13px;

margin-bottom:20px;

}



.side-buttons{

display:flex;

flex-direction:column;

gap:10px;

}



/* MAIN */

.main{

flex:1;

padding:20px;

overflow-y:auto;

}



.title{

font-size:42px;

font-weight:900;

margin-bottom:20px;

}



/* SEARCH */

.search{

width:100%;

max-width:600px;

padding:12px;

border-radius:12px;

border:1px solid var(--line);

background:var(--panel);

color:var(--text);

font-size:16px;

margin-bottom:20px;

}




/* NEWS CARDS */


.news-card{

background:var(--panel);

border:1px solid var(--line);

border-radius:18px;

padding:18px;

margin-bottom:18px;

}



.news-card:hover{

border-color:var(--blue);

}



.news-title{

font-size:22px;

font-weight:900;

line-height:1.3;

}



.news-meta{

margin-top:10px;

font-size:13px;

color:var(--muted);

line-height:1.7;

}



.news-image{

width:100%;

max-width:650px;

border-radius:14px;

margin-top:15px;

display:block;

object-fit:cover;

}



.news-details{

margin-top:15px;

font-size:15px;

line-height:1.5;

}



.news-message{

margin-top:12px;

padding:12px;

background:var(--panel2);

border-radius:12px;

font-size:14px;

}




.news-actions{

display:flex;

flex-wrap:wrap;

gap:10px;

margin-top:15px;

}



.news-actions a{

text-decoration:none;

}




/* CHAT POPUP */


.chat-popup{

position:fixed;

right:20px;

bottom:20px;

width:430px;

height:620px;

background:var(--panel);

border:1px solid var(--line);

border-radius:18px;

display:flex;

flex-direction:column;

overflow:hidden;

z-index:999999;

}



.hidden{

display:none;

}



.chat-header{

padding:12px;

background:var(--panel2);

border-bottom:1px solid var(--line);

display:flex;

justify-content:space-between;

align-items:center;

font-weight:800;

}




.chat-log{

flex:1;

overflow-y:auto;

padding:12px;

}




.chat-msg{

background:var(--panel2);

border-radius:12px;

padding:10px;

margin-bottom:10px;

}



.chat-name{

color:var(--blue);

font-weight:900;

}




.chat-input{

display:flex;

gap:6px;

padding:10px;

border-top:1px solid var(--line);

}



.chat-input input{

flex:1;

min-width:0;

padding:10px;

border-radius:10px;

border:1px solid var(--line);

background:var(--bg);

color:var(--text);

font-size:16px;

}




/* MOBILE */


@media(max-width:768px){


body{

flex-direction:column;

}



.sidebar{

width:100%;

border-right:none;

border-bottom:1px solid var(--line);

}



.main{

padding:10px;

}



.title{

font-size:28px;

}



.news-title{

font-size:18px;

}



.chat-popup{

inset:0;

width:100%;

height:100dvh;

border-radius:0;

}



}




</style>

</head>



<body>



<div class="sidebar">


<div onclick="window.location='index99.html'">


<div class="logo">

News <span>Obvyris</span>

</div>



<div class="subtitle">

Live News • Community Discussions

</div>


</div>




<div class="side-buttons">


<button onclick="window.location='Chat_Obvyris.html'">

💬 Chat Obvyris

</button>



<button onclick="loadNews()">

↻ Refresh News

</button>



<button onclick="toggleTheme()">

🌙 Theme

</button>


</div>


</div>





<div class="main">


<div class="title">

Latest News

</div>



<input

class="search"

id="search"

placeholder="Search news..."

oninput="renderNews()">


<div id="news"></div>


</div>




<!-- CHAT -->


<div id="chatPopup" class="chat-popup hidden">


<div class="chat-header">

<span id="chatTitle">

News Discussion

</span>


<button onclick="toggleChat()">

✖

</button>


</div>




<div id="chatLog" class="chat-log"></div>




<div class="chat-input">


<input

id="chatName"

placeholder="Name"

maxlength="10">



<input

id="chatMsg"

placeholder="Message"

maxlength="120">



<button onclick="sendChat()">

Send

</button>



</div>


</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbzin84qDcZ9L1q4pTBtHZGKJSTDcZ_wnmgWmnmgPgf1jrc1nRprzbEBixKMSHcdkxiZBg/exec";


let news = [];

let activeRoom = "";

let activeName = "";

let chatTimer = null;


/* =========================
   LOAD NEWS
========================= */

async function loadNews(){

try{

const res = await fetch(API_URL,{
method:"POST",
body:JSON.stringify({
action:"get",
source:"news"
})
});


const data = await res.json();


news = data.map(n=>({

time:n.time || "",

station:n.station || "",

stationName:n.stationName || "",

name:n.name || "",

message:n.message || "",

link:n.link || "",

image:n.image || "",

sourceLink:n.sourceLink || "",

type:n.type || "",

details:n.details || "",

source:n.source || ""

}));


renderNews();


}catch(e){

console.error(
"News loading failed:",
e
);

}

}




/* =========================
   RENDER NEWS
========================= */

function renderNews(){


const search =
document.getElementById("search")
.value
.toLowerCase();



let html = "";



news
.slice()
.reverse()
.filter(n=>{


const text = `

${n.stationName}

${n.details}

${n.type}

${n.source}

${n.message}

`

.toLowerCase();


return !search || text.includes(search);


})


.forEach(n=>{


html += `


<div class="news-card">


<div class="news-title">

${n.stationName}

</div>




<div class="news-meta">

🕒 ${n.time}

<br>

🤖 ${n.name}

<br>

🏷️ ${n.type}

<br>

📡 ${n.source}

</div>





${n.image ? `

<img

class="news-image"

src="${n.image}"

loading="lazy"

onerror="this.remove()">

`:""}





<div class="news-details">

${n.details}

</div>





<div class="news-message">

<b>${n.name}</b><br>

${cleanMessage(n.message,n.link)}

</div>






<div class="news-actions">


<button onclick="openChat(
'${n.station}',
'${escapeJS(n.stationName)}'
)">

💬 Discuss

</button>





${n.link ? `

<a href="${n.link}" target="_blank">

<button>

📰 Article

</button>

</a>

`:""}





${n.sourceLink ? `

<a href="${n.sourceLink}" target="_blank">

<button>

🔗 ${n.source || "Source"}

</button>

</a>

`:""}



</div>



</div>


`;

});


document
.getElementById("news")
.innerHTML = html;


}




function cleanMessage(msg,url){

return (msg || "")

.replace("📰","")

.replace(url || "","")

.replace("|","")

.trim();

}



function escapeJS(text){

return (text || "")

.replaceAll("\\","\\\\")
.replaceAll("'","\\'");

}




/* =========================
   CHAT CONNECTION
   Uses SAME station ID
   as Chat Obvyris
========================= */


function openChat(id,name){


activeRoom = id;

activeName = name;


document
.getElementById("chatTitle")
.innerHTML =
"💬 " + name;



document
.getElementById("chatPopup")
.classList
.remove("hidden");



loadChat();



clearInterval(chatTimer);


chatTimer = setInterval(()=>{

loadChat();

},3000);



}





async function loadChat(){


if(!activeRoom)
return;



const res = await fetch(API_URL,{

method:"POST",

body:JSON.stringify({

action:"get",

station:activeRoom

})

});



const data = await res.json();



let html = "";



data.forEach(m=>{


html += `


<div class="chat-msg">


<div class="chat-name">

${m.name}

</div>


${m.message}


</div>


`;


});



document
.getElementById("chatLog")
.innerHTML = html;



const log =
document.getElementById("chatLog");


log.scrollTop =
log.scrollHeight;


}






async function sendChat(){


const msg =
document
.getElementById("chatMsg")
.value;


if(!msg)
return;



await fetch(API_URL,{

method:"POST",

body:JSON.stringify({

action:"send",

station:activeRoom,

stationName:activeName,

name:
document
.getElementById("chatName")
.value ||
"Anon",

message:msg


})

});



document
.getElementById("chatMsg")
.value="";


loadChat();


}





function toggleChat(){


document
.getElementById("chatPopup")
.classList
.add("hidden");


clearInterval(chatTimer);


}





/* ENTER SEND */


document
.getElementById("chatMsg")
.addEventListener(
"keydown",
e=>{


if(e.key==="Enter"){

e.preventDefault();

sendChat();

}


});





/* THEME */


function toggleTheme(){

document
.body
.classList
.toggle("light");

}






/* START */


loadNews();


</script>


</body>

</html>
