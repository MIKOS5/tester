<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">


<title>
Obvyris Archive Explorer
</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:10px;

height:calc(100vh - 20px);

overflow:hidden;

background:#070d16;

color:#d8e1ec;

font-family:
Arial,
Helvetica,
sans-serif;

font-size:15px;

}



/* =====================
 HEADER
===================== */


h1{

color:#2793ff;

font-size:28px;

margin:5px 0 15px;

}



/* =====================
 SEARCH PANEL
===================== */


.controls{

background:#101923;

border:1px solid #26384f;

border-radius:12px;

padding:14px;

display:flex;

flex-wrap:wrap;

gap:10px;

}



input,
select,
button{


background:#17263a;

color:white;

border:1px solid #31465f;

border-radius:7px;

padding:11px 14px;

font-size:15px;

}



input{

width:260px;

}



button{

background:#2793ff;

border:none;

font-weight:bold;

cursor:pointer;

}



button:hover{

background:#55b5ff;

}



/* =====================
 STATUS
===================== */


#status{

margin-top:12px;

color:#9aaabd;

}



/* =====================
 RESULTS AREA
===================== */


#results{


height:calc(100vh - 250px);

overflow-y:auto;

padding-right:8px;


}



.card{


background:#101923;

border:1px solid #26384f;

border-radius:12px;

padding:16px;

margin-top:12px;


}



.card:hover{

border-color:#2793ff;

}




.title{


font-size:20px;

font-weight:bold;

color:#55b8ff;

margin-bottom:10px;


}




.meta{

line-height:25px;

color:#b8c5d6;

}




.tag{


display:inline-block;

background:#2793ff;

padding:4px 10px;

border-radius:20px;

font-size:12px;


}



/* =====================
 THUMBNAILS
===================== */


.archiveThumb{


width:140px;

height:140px;

object-fit:cover;

border-radius:10px;

float:right;

margin-left:15px;

border:1px solid #31465f;


}



/* =====================
 FILE BROWSER
===================== */


.files{


display:none;

margin-top:15px;

background:#0c1522;

border-radius:10px;

padding:10px;


}



.file{


padding:12px;

border-bottom:

1px solid #26384f;

cursor:pointer;


}



.file:hover{


background:#182b43;


}





/* =====================
 METADATA
===================== */


.metaPanel{


margin-top:10px;

padding:14px;

background:#0c1522;

border-left:

3px solid #2793ff;

border-radius:8px;


}





/* =====================
 VIDEO PLAYER
===================== */



#obvyrisVideoPlayer{


position:fixed;


left:50px;

top:100px;


width:520px;


height:620px;


background:

rgba(16,25,35,.65);


backdrop-filter:

blur(12px);



border:

2px solid rgba(39,147,255,.8);


border-radius:14px;


box-shadow:

0 0 35px rgba(0,0,0,.8);


z-index:99999;


resize:both;

overflow:hidden;


}




#videoHeader{


height:42px;


padding:10px;


background:

rgba(20,35,56,.7);


color:#55b8ff;


font-weight:bold;


display:flex;

justify-content:space-between;

align-items:center;


cursor:move;


}




.windowButtons button{


width:22px;

height:22px;

padding:0;

font-size:12px;


}




#videoDisplay{


padding:15px;

text-align:center;


background:

rgba(0,0,0,.25);


}




#videoTitle{


font-size:18px;

font-weight:bold;

color:#55b8ff;


}



#videoMeta{


color:#aaa;

margin-top:6px;


}



#archiveVideo{


width:100%;

height:300px;

background:black;


}





#videoProgress{


padding:10px;


}



#videoTime{


display:flex;

justify-content:space-between;

font-family:monospace;

color:#65c9ff;


}




#videoSeek{


width:100%;


}




#videoButtons{


display:flex;

justify-content:center;

gap:8px;

padding:10px;


}



#videoButtons button{


width:55px;

height:40px;


}




#videoPlaylist{


height:160px;

overflow:auto;

padding:10px;

border-top:

1px solid #26384f;


}



.videoItem{


padding:8px;

border-bottom:

1px solid #26384f;

cursor:pointer;


}



.videoItem:hover{


background:#182b43;


}



/* =====================
 MINIMIZE
===================== */


#obvyrisVideoPlayer.minimized{


height:45px;

resize:none;


}



#obvyrisVideoPlayer.minimized
#videoDisplay,

#obvyrisVideoPlayer.minimized
video,

#obvyrisVideoPlayer.minimized
#videoProgress,

#obvyrisVideoPlayer.minimized
#videoButtons,

#obvyrisVideoPlayer.minimized
#videoPlaylist{


display:none;


}



/* =====================
 RESTORE BUTTON
===================== */


#restorePlayer{


position:fixed;


bottom:20px;

right:20px;


display:none;


z-index:99999;


}




/* =====================
 FOOTER
===================== */


footer{


position:fixed;

bottom:0;

left:0;

right:0;


background:#101923;


border-top:

1px solid #26384f;


padding:10px;


text-align:center;


color:#8995a5;


font-size:13px;


}





/* =====================
 SCROLLBARS
===================== */


::-webkit-scrollbar{


width:10px;


}


::-webkit-scrollbar-track{


background:#070d16;


}



::-webkit-scrollbar-thumb{


background:#26384f;

border-radius:10px;


}



::-webkit-scrollbar-thumb:hover{


background:#2793ff;


}





/* =====================
 MOBILE
===================== */


@media(max-width:700px){


body{

margin:5px;

}



h1{

font-size:22px;

text-align:center;

}



.controls{


display:block;


}



.controls input,
.controls select,
.controls button{


width:100%;

height:55px;

margin-bottom:10px;


}



#results{


height:calc(100vh - 330px);


}



.archiveThumb{


float:none;

width:100%;

height:180px;

margin:0 0 10px 0;


}




#obvyrisVideoPlayer{


left:5px;

top:80px;

width:95%;


}



footer{


font-size:12px;


}



}



</style>

</head>


<body>


<h1>
🌐 Obvyris Archive Explorer
</h1>



<div class="controls">


<input 
id="search"
placeholder="Search Internet Archive">


<select id="type">

<option value="">
All Media
</option>


<option value="movies">
🎬 Video
</option>


<option value="texts">
📚 Documents
</option>


<option value="software">
💾 Software
</option>


<option value="audio">
🎵 Audio
</option>


<option value="image">
🖼 Images
</option>


</select>



<input
id="creator"
placeholder="Creator">



<select id="sort">


<option value="downloads desc">
Most Popular
</option>


<option value="date desc">
Newest
</option>


<option value="titleSorter asc">
A-Z
</option>


</select>



<button onclick="searchArchive(0)">
🔎 SEARCH
</button>


</div>



<div id="status">

Ready

</div>



<div id="results">

</div>





<!-- VIDEO PLAYER -->


<button id="restorePlayer"
onclick="showVideoPlayer()">

🎬 Player

</button>




<div id="obvyrisVideoPlayer">



<div id="videoHeader">


<span>

Obvyris Video Player

</span>



<div class="windowButtons">


<button onclick="minimizeVideoPlayer()">
−
</button>


<button onclick="hideVideoPlayer()">
×
</button>


</div>


</div>




<div id="videoDisplay">


<div id="videoTitle">

No Video Selected

</div>


<div id="videoMeta">

Archive Video

</div>


</div>




<video
id="archiveVideo"
controls>

</video>




<div id="videoProgress">


<div id="videoTime">

<span id="videoCurrent">

0:00

</span>


<span id="videoDuration">

0:00

</span>


</div>



<input
id="videoSeek"
type="range"
value="0"
min="0"
max="100">


</div>





<div id="videoButtons">


<button onclick="previousVideo()">
◀
</button>


<button onclick="toggleVideo()">
▶⏸
</button>


<button onclick="nextVideo()">
▶▶
</button>


<button onclick="fullscreenVideo()">
⛶
</button>


</div>




<div id="videoPlaylist">


<h3>
Playlist
</h3>


<div id="videoQueue">

</div>


</div>



</div>





<script>


let currentPage=0;

let pageSize=25;


let videoQueue=[];

let videoIndex=0;



// ===========================
// SEARCH ARCHIVE
// ===========================


async function searchArchive(page){


currentPage=page;



let text=

document.getElementById("search")
.value
.trim();



let type=

document.getElementById("type")
.value;



let creator=

document.getElementById("creator")
.value
.trim();



let sort=

document.getElementById("sort")
.value;




let query=text || "*";



if(type){

query +=
" AND mediatype:"+type;

}



if(creator){

query +=
' AND creator:"'+creator+'"';

}





let url=

"https://archive.org/advancedsearch.php?q="

+encodeURIComponent(query)

+"&fl[]=identifier,title,creator,description,mediatype,date"

+"&rows="+pageSize

+"&start="+(page*pageSize)

+"&sort[]="+encodeURIComponent(sort)

+"&output=json";





document.getElementById("status").innerHTML=

"Searching Archive...";





let response=

await fetch(url);



let data=

await response.json();





document.getElementById("status").innerHTML=

"Found "

+data.response.numFound

+" items";





renderResults(

data.response.docs

);



}





// ===========================
// RESULTS
// ===========================


function renderResults(items){


let box=

document.getElementById("results");



box.innerHTML="";




items.forEach(item=>{



let thumb=

"https://archive.org/services/img/"

+item.identifier;





box.innerHTML+=`


<div class="card">



<img

class="archiveThumb"

src="${thumb}"

onerror="this.style.display='none'">





<div class="title">

📦

${escapeHTML(item.title || "Unknown")}

</div>




<div class="meta">


<span class="tag">

${item.mediatype}

</span>



<br><br>



Creator:

${escapeHTML(item.creator || "Unknown")}



<br>


Date:

${escapeHTML(item.date || "")}



<br>


Collection:

${escapeHTML(item.collection || "")}



<br><br>



${escapeHTML(

(item.description || "No description")

.substring(0,300)

)}



</div>




<br>



<button onclick="loadFiles('${item.identifier}')">

📂 Browse Files

</button>



<button onclick="showMeta('${item.identifier}')">

⚙ Metadata

</button>



<div

class="files"

id="files-${item.identifier}">


</div>



<div

id="meta-${item.identifier}">


</div>



</div>


`;



});



}





// ===========================
// FILE LOADER
// ===========================


async function loadFiles(id){



let box=

document.getElementById(
"files-"+id
);



box.style.display="block";



box.innerHTML=

"Loading files...";





let response=

await fetch(

"https://archive.org/metadata/"+id

);



let data=

await response.json();



let html="";



videoQueue=[];




data.files.forEach(file=>{


let name=file.name || "";


let ext=

name.split(".").pop()

.toLowerCase();





let url=

"https://archive.org/download/"

+id+"/"

+encodeURIComponent(name);






if([

"mp4",

"webm",

"ogv",

"mkv"

].includes(ext)){



videoQueue.push({

name:name,

url:url

});



html+=`


<div class="file"

onclick="playVideo(${videoQueue.length-1})">


🎬

${escapeHTML(name)}


</div>


`;



}





else if([

"mp3",

"wav",

"ogg"

].includes(ext)){


html+=`


<div class="file">


🎵

<a href="${url}">

${escapeHTML(name)}

</a>


</div>


`;



}





else if([

"pdf",

"epub",

"txt"

].includes(ext)){


html+=`


<div class="file">


📚

<a href="${url}" target="_blank">

${escapeHTML(name)}

</a>


</div>


`;



}




else{


html+=`


<div class="file">


📄

<a href="${url}" target="_blank">

${escapeHTML(name)}

</a>


</div>


`;



}



});





box.innerHTML=html;



renderVideoQueue();



}





// ===========================
// VIDEO PLAYER
// ===========================



function playVideo(index){


if(!videoQueue[index])
return;



videoIndex=index;



let video=

document.getElementById(
"archiveVideo"
);



video.src=

videoQueue[index].url;



video.play();



document.getElementById(
"videoTitle"
).innerHTML=

videoQueue[index].name;



document.getElementById(
"videoMeta"
).innerHTML=

"Video "

+(index+1)

+" / "

+videoQueue.length;



showVideoPlayer();



}





function toggleVideo(){


let v=

document.getElementById(
"archiveVideo"
);



if(v.paused)

v.play();

else

v.pause();



}



function nextVideo(){


if(videoIndex < videoQueue.length-1){

videoIndex++;

playVideo(videoIndex);

}


}




function previousVideo(){


if(videoIndex>0){

videoIndex--;

playVideo(videoIndex);

}


}




function fullscreenVideo(){


document

.getElementById("archiveVideo")

.requestFullscreen();



}





function renderVideoQueue(){


let box=

document.getElementById(
"videoQueue"
);



box.innerHTML="";



videoQueue.forEach((v,i)=>{


box.innerHTML+=`


<div class="videoItem"

onclick="playVideo(${i})">


${i+1}. ${escapeHTML(v.name)}


</div>


`;



});



}




// ===========================
// PLAYER WINDOW
// ===========================


function minimizeVideoPlayer(){


document

.getElementById(
"obvyrisVideoPlayer"
)

.classList.toggle(

"minimized"

);


}




function hideVideoPlayer(){


document.getElementById(
"obvyrisVideoPlayer"
)

.style.display="none";



document.getElementById(
"restorePlayer"
)

.style.display="block";



}





function showVideoPlayer(){


document.getElementById(
"obvyrisVideoPlayer"
)

.style.display="block";



document.getElementById(
"restorePlayer"
)

.style.display="none";


}





// ===========================
// METADATA
// ===========================


async function showMeta(id){


let response=

await fetch(

"https://archive.org/metadata/"+id

);



let data=

await response.json();



let box=

document.getElementById(
"meta-"+id
);



box.innerHTML=`


<div class="metaPanel">


Identifier:

<br>

${id}



<br><br>


Files:

${data.files.length}



<br><br>


Title:

${escapeHTML(data.metadata.title || "")}



</div>


`;



}





// ===========================
// VIDEO TIME
// ===========================


let video=

document.getElementById(
"archiveVideo"
);



video.addEventListener(
"timeupdate",
()=>{


if(video.duration){


document.getElementById(
"videoSeek"
).value=

(video.currentTime/video.duration)*100;



document.getElementById(
"videoCurrent"
).innerHTML=

formatTime(video.currentTime);



document.getElementById(
"videoDuration"
).innerHTML=

formatTime(video.duration);



}


});





document.getElementById(
"videoSeek"
).oninput=function(){


video.currentTime=

(video.duration*this.value)/100;


};





function formatTime(t){


if(!t || isNaN(t))

return "0:00";



let m=Math.floor(t/60);

let s=Math.floor(t%60);



if(s<10)

s="0"+s;



return m+":"+s;


}





function escapeHTML(text){


return String(text)

.replaceAll("&","&amp;")

.replaceAll("<","&lt;")

.replaceAll(">","&gt;")

.replaceAll('"',"&quot;");


}





// =====================================
// DRAGGABLE VIDEO PLAYER
// =====================================


const videoWindow =
document.getElementById(
"obvyrisVideoPlayer"
);


const videoHeader =
document.getElementById(
"videoHeader"
);



let dragging=false;

let offsetX=0;

let offsetY=0;



videoHeader.addEventListener(
"mousedown",
function(e){


dragging=true;


offsetX =
e.clientX -
videoWindow.offsetLeft;


offsetY =
e.clientY -
videoWindow.offsetTop;



});





document.addEventListener(
"mousemove",
function(e){


if(!dragging)
return;



videoWindow.style.left =

(e.clientX-offsetX)

+"px";



videoWindow.style.top =

(e.clientY-offsetY)

+"px";



savePlayerPosition();



});





document.addEventListener(
"mouseup",
function(){


dragging=false;


});





// TOUCH DRAG


videoHeader.addEventListener(
"touchstart",
function(e){


let t=e.touches[0];


dragging=true;


offsetX=

t.clientX-

videoWindow.offsetLeft;



offsetY=

t.clientY-

videoWindow.offsetTop;


});





document.addEventListener(
"touchmove",
function(e){


if(!dragging)
return;



let t=e.touches[0];



videoWindow.style.left=

(t.clientX-offsetX)

+"px";



videoWindow.style.top=

(t.clientY-offsetY)

+"px";



savePlayerPosition();


});





document.addEventListener(
"touchend",
function(){

dragging=false;

});






// =====================================
// SAVE WINDOW POSITION
// =====================================


function savePlayerPosition(){


localStorage.setItem(

"obvyrisVideoPosition",

JSON.stringify({

left:videoWindow.style.left,

top:videoWindow.style.top

})

);


}




function loadPlayerPosition(){


let saved=

localStorage.getItem(

"obvyrisVideoPosition"

);



if(saved){


let pos=

JSON.parse(saved);



videoWindow.style.left=

pos.left;



videoWindow.style.top=

pos.top;


}



}



window.addEventListener(
"load",
()=>{


loadPlayerPosition();


});







// =====================================
// AUTO NEXT VIDEO
// =====================================


document

.getElementById(
"archiveVideo"
)

.addEventListener(

"ended",

()=>{


nextVideo();


}

);








// =====================================
// SAVE VIDEO QUEUE
// =====================================


function saveVideoQueue(){


localStorage.setItem(

"obvyrisVideoQueue",

JSON.stringify(videoQueue)

);


}





function loadVideoQueue(){


let saved=

localStorage.getItem(

"obvyrisVideoQueue"

);



if(saved){


videoQueue=

JSON.parse(saved);



renderVideoQueue();


}



}





window.addEventListener(

"load",

()=>{


loadVideoQueue();


});






// =====================================
// ENHANCED PLAYLIST DISPLAY
// =====================================



function renderVideoQueue(){



let box=

document.getElementById(
"videoQueue"
);



box.innerHTML="";





videoQueue.forEach(
(v,i)=>{


let active="";



if(i===videoIndex)

active="playing";



box.innerHTML+=`


<div class="videoItem ${active}"

onclick="playVideo(${i})">


🎬

${i+1}.

${escapeHTML(v.name)}


</div>


`;



});



saveVideoQueue();



}







// =====================================
// KEYBOARD SHORTCUTS
// =====================================


document.addEventListener(
"keydown",
function(e){

let active = document.activeElement;


// DO NOT TRIGGER SHORTCUTS WHILE TYPING
if(
active.tagName === "INPUT" ||
active.tagName === "TEXTAREA" ||
active.tagName === "SELECT"
){
    return;
}



if(e.code==="Space"){

e.preventDefault();

toggleVideo();

}



if(e.code==="ArrowRight"){

nextVideo();

}



if(e.code==="ArrowLeft"){

previousVideo();

}



if(e.code==="KeyF"){

fullscreenVideo();

}



if(e.code==="Escape"){

hideVideoPlayer();

}



});



// =====================================
// DOUBLE CLICK FULLSCREEN
// =====================================


document

.getElementById(
"archiveVideo"
)

.addEventListener(

"dblclick",

()=>{


fullscreenVideo();


}

);






// =====================================
// PLAYER START POSITION
// =====================================


loadPlayerPosition();



</script>


</body>

</html>
