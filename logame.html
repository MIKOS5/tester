<!DOCTYPE html>
<html>
<head>
<title>Obvyris Archive Search</title>

<style>
body{
    background:#09111d;
    color:white;
    font-family:Arial;
    padding:20px;
}

input{
    width:70%;
    padding:12px;
    font-size:18px;
}

button{
    padding:12px;
    background:#2793ff;
    color:white;
    border:0;
}

.card{
    background:#162235;
    margin:15px 0;
    padding:15px;
    border-radius:10px;
}

a{
    color:#4db3ff;
}
</style>

</head>

<body>

<h1>🎧 Obvyris Archive Search</h1>

<input id="search" placeholder="Search music, movies, books...">

<button onclick="searchArchive()">Search</button>

<div id="results"></div>


<script>

async function searchArchive(){

let query=document.getElementById("search").value;

let url =
"https://archive.org/advancedsearch.php?q="
+encodeURIComponent(query)
+"&fl[]=identifier,title,creator,mediatype"
+"&rows=20"
+"&output=json";


let response = await fetch(url);

let data = await response.json();


let results=document.getElementById("results");

results.innerHTML="";


data.response.docs.forEach(item=>{


let id=item.identifier;


results.innerHTML += `

<div class="card">

<h2>${item.title || "Untitled"}</h2>

<p>
Creator:
${item.creator || "Unknown"}
</p>

<p>
Type:
${item.mediatype}
</p>


<a target="_blank"
href="https://archive.org/details/${id}">
View Archive Page
</a>

<br><br>


<a target="_blank"
href="https://archive.org/metadata/${id}">
Metadata API
</a>


</div>

`;

});


}

</script>


</body>
</html>
