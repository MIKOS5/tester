<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Obvyris Archive Engine</title>


<style>

body{

background:#09111d;
color:white;
font-family:Arial,Helvetica,sans-serif;
padding:20px;

}


h1{

color:#2793ff;

}


.controls{

background:#111c2e;
padding:20px;
border-radius:15px;

}


input,select,button{

padding:12px;
font-size:16px;
margin:5px;
border-radius:8px;
border:none;

}


input{

width:55%;

}


button{

background:#2793ff;
color:white;
cursor:pointer;

}


button:hover{

background:#57b0ff;

}


.card{

background:#162235;
padding:20px;
margin-top:20px;
border-radius:15px;

}


.card h2{

color:#4db3ff;

}


.tag{

background:#2793ff;
padding:5px 12px;
border-radius:20px;

}


.info{

line-height:1.6;

}


.file{

background:#0b1525;
padding:12px;
margin-top:10px;
border-radius:10px;

}


.file audio{

width:100%;

}


.file a{

color:#7bd0ff;

}


a{

color:#7bd0ff;

}


</style>


</head>


<body>


<h1>
🔎 Obvyris Archive Engine
</h1>


<div class="controls">


<input id="search"
placeholder="Search Internet Archive...">


<select id="type">

<option value="">
Everything
</option>

<option value="audio">
🎵 Audio
</option>

<option value="movies">
🎬 Movies
</option>

<option value="texts">
📚 Books
</option>

<option value="software">
💾 Software
</option>

</select>



<select id="rows">

<option>5</option>

<option>10</option>

<option>25</option>

</select>



<button onclick="searchArchive()">

SEARCH

</button>


</div>



<h3 id="status"></h3>


<div id="results"></div>



<script>


async function searchArchive(){


let text =
document.getElementById("search").value || "*";


let type =
document.getElementById("type").value;


let rows =
document.getElementById("rows").value;



let query=text;



if(type){

query += " AND mediatype:" + type;

}



let url=

"https://archive.org/advancedsearch.php?q="
+
encodeURIComponent(query)
+
"&fl[]=identifier,title,mediatype"
+
"&rows="
+
rows
+
"&output=json";



document.getElementById("status").innerHTML =
"Searching...";



let response =
await fetch(url);


let data =
await response.json();



document.getElementById("results").innerHTML="";



document.getElementById("status").innerHTML=

"Found "
+
data.response.numFound
+
" results";



for(let item of data.response.docs){


await loadArchiveItem(item.identifier);


}



}



async function loadArchiveItem(id){


let response =
await fetch(
"https://archive.org/metadata/"+id
);


let data =
await response.json();



let meta =
data.metadata;



let files =
data.files || [];



let audioFiles = [];



files.forEach(file=>{


let name =
file.name.toLowerCase();



if(
name.endsWith(".mp3") ||
name.endsWith(".ogg") ||
name.endsWith(".flac") ||
name.endsWith(".wav")
){

audioFiles.push(file);

}


});




let fileHTML = "";



audioFiles.forEach(file=>{


let filename =
file.name.split("/").pop();



let fileURL =

"https://archive.org/download/"
+
id
+
"/"
+
encodeURIComponent(file.name);



fileHTML += `


<div class="file">


<h3>
🎵 ${filename}
</h3>


<audio controls preload="none">


<source src="${fileURL}">


Your browser does not support audio.


</audio>



<br>


<a target="_blank"
href="${fileURL}">

▶ Open File

</a>


</div>



`;



});





let icon="📁";



if(meta.mediatype=="audio")
icon="🎵";


if(meta.mediatype=="movies")
icon="🎬";


if(meta.mediatype=="texts")
icon="📚";


if(meta.mediatype=="software")
icon="💾";






let card = document.createElement("div");

card.className="card";



card.innerHTML = `



<h2>

${icon}

${meta.title || id}

</h2>



<span class="tag">

${meta.mediatype || "unknown"}

</span>





<div class="info">


<p>

<b>Description:</b><br>

${
meta.description
||
"No description"
}

</p>





<p>

<b>Genre:</b>

${
Array.isArray(meta.subject)
?
meta.subject.join(", ")
:
(meta.subject || "Unknown")
}

</p>





<p>

<b>Uploader:</b>

${
meta.uploader || "Unknown"
}

</p>





<p>

<b>Date:</b>

${
meta.publicdate || "Unknown"
}

</p>





<p>

<b>Files:</b>

${files.length}

</p>





<p>

<b>Playable Tracks:</b>

${audioFiles.length}

</p>





<h2>
🎧 Audio Files
</h2>



${

fileHTML ||

"No playable audio files found"

}




<br>



<a target="_blank"

href="https://archive.org/details/${id}">

🌐 Archive Page

</a>



<br><br>



<a target="_blank"

href="https://archive.org/download/${id}">

📂 All Files

</a>



<br><br>



<a target="_blank"

href="https://archive.org/metadata/${id}">

⚙ Metadata

</a>



</div>


`;




document
.getElementById("results")
.appendChild(card);



}



</script>


</body>

</html>
