<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Obvyris Archive Engine</title>

<style>

body{
background:#09111d;
color:white;
font-family:Arial,Helvetica,sans-serif;
padding:20px;
}

h1{
color:#2793ff;
}


.controls{

background:#111c2e;
padding:20px;
border-radius:15px;

}


input,select,button{

padding:12px;
font-size:16px;
margin:5px;
border-radius:8px;
border:none;

}


input{
width:60%;
}


button{

background:#2793ff;
color:white;
cursor:pointer;

}


button:hover{

background:#57b0ff;

}



.card{

background:#162235;
padding:20px;
margin-top:20px;
border-radius:15px;

}


.card h2{

color:#4db3ff;

}



.tag{

background:#2793ff;
padding:6px 12px;
border-radius:20px;

}



a{

color:#7bd0ff;

}



audio{

width:100%;
margin-top:10px;

}



.track{

background:#0d1726;
padding:10px;
margin-top:10px;
border-radius:10px;

}



.small{

color:#aaa;
font-size:14px;

}


</style>

</head>



<body>


<h1>🔎 Obvyris Archive Engine</h1>


<div class="controls">


<input id="search"
placeholder="Search music, concerts, audio...">


<select id="type">

<option value="audio">
🎵 Audio
</option>

<option value="movies">
🎬 Movies
</option>

<option value="texts">
📚 Books
</option>

<option value="">
🌐 Everything
</option>


</select>


<select id="rows">

<option value="10">10 Results</option>

<option value="25">25 Results</option>

<option value="50">50 Results</option>

</select>


<button onclick="searchArchive()">
SEARCH
</button>


</div>



<h3 id="status"></h3>


<div id="results"></div>



<script>



async function searchArchive(){


let text =
document.getElementById("search").value;


let type =
document.getElementById("type").value;


let rows =
document.getElementById("rows").value;



let query=text || "*";



if(type){

query += " AND mediatype:" + type;

}



let url=

"https://archive.org/advancedsearch.php?q="
+
encodeURIComponent(query)
+
"&fl[]=identifier,title,creator,mediatype"
+
"&rows="
+
rows
+
"&output=json";



document.getElementById("status").innerHTML=
"Searching...";



let response=
await fetch(url);


let data=
await response.json();



let box=
document.getElementById("results");


box.innerHTML="";



document.getElementById("status").innerHTML=
"Found "
+
data.response.numFound
+
" results";



for(let item of data.response.docs){


await loadItem(item,box);


}



}




async function loadItem(item,box){



let id=item.identifier;



let icon="📁";


if(item.mediatype=="audio")
icon="🎵";

if(item.mediatype=="movies")
icon="🎬";

if(item.mediatype=="texts")
icon="📚";



let meta={};

let tracks=[];



try{


let response=
await fetch(
"https://archive.org/metadata/"+id
);



meta=
await response.json();



tracks=
meta.files.filter(file=>


file.format &&

(
file.format.includes("MP3") ||
file.format.includes("Ogg") ||
file.format.includes("FLAC")
)


);



}

catch(e){}



let trackHTML="";



tracks.slice(0,8).forEach(track=>{


let fileURL=

"https://archive.org/download/"
+
id
+
"/"
+
encodeURIComponent(track.name);



trackHTML +=

`

<div class="track">

🎵 ${track.name}

<br>

<audio controls preload="none">

<source src="${fileURL}">

</audio>


</div>


`;



});




box.innerHTML +=


`

<div class="card">


<h2>

${icon}

${meta.metadata?.title || item.title || "Unknown"}

</h2>



<span class="tag">

${item.mediatype}

</span>



<p>

<b>Description:</b><br>

${meta.metadata?.description || "No description"}

</p>



<p>

<b>Genre:</b>

${meta.metadata?.subject || "Unknown"}

</p>



<p>

<b>Uploader:</b>

${meta.metadata?.uploader || "Unknown"}

</p>



<p>

<b>Date:</b>

${meta.metadata?.publicdate || "Unknown"}

</p>



<p>

<b>Files:</b>

${meta.files_count || tracks.length}

</p>



<p>

<b>Playable Tracks:</b>

${tracks.length}

</p>



${trackHTML}



<br>


<a target="_blank"

href="https://archive.org/details/${id}">

🌐 Archive Page

</a>



<br><br>



<a target="_blank"

href="https://archive.org/download/${id}">

📂 All Files

</a>



<br><br>



<a target="_blank"

href="https://archive.org/metadata/${id}">

⚙ Metadata

</a>



</div>


`;



}



</script>


</body>

</html>
