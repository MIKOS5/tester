<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Obvyris Archive Engine</title>

<style>

body{
background:#09111d;
color:white;
font-family:Arial,Helvetica,sans-serif;
padding:20px;
}


h1{
color:#2793ff;
}


.controls{

background:#111c2e;
padding:20px;
border-radius:15px;

}


input,select,button{

padding:12px;
font-size:16px;
margin:5px;
border-radius:8px;
border:none;

}


input{
width:55%;
}


button{

background:#2793ff;
color:white;
cursor:pointer;

}


button:hover{

background:#57b0ff;

}


.card{

background:#162235;
padding:20px;
margin-top:20px;
border-radius:15px;

}


.card h2{

color:#4db3ff;

}


.tag{

background:#2793ff;
padding:5px 10px;
border-radius:20px;
display:inline-block;

}


audio{

width:100%;
margin-top:15px;

}


.playlist{

background:#0b1525;
padding:10px;
border-radius:10px;
max-height:250px;
overflow:auto;

}


.track{

padding:8px;
cursor:pointer;
border-bottom:1px solid #27384d;

}


.track:hover{

background:#203550;

}


a{

color:#7bd0ff;

}


.info{

line-height:1.6;

}


</style>

</head>


<body>


<h1>🔎 Obvyris Archive Engine</h1>


<div class="controls">


<input id="search"
placeholder="Search Internet Archive...">


<select id="type">

<option value="">Everything</option>

<option value="audio">
🎵 Audio
</option>

<option value="movies">
🎬 Movies
</option>

<option value="texts">
📚 Books
</option>

<option value="software">
💾 Software
</option>


</select>


<select id="rows">

<option>5</option>
<option>10</option>
<option>25</option>

</select>


<button onclick="searchArchive()">
SEARCH
</button>


</div>



<h3 id="status"></h3>


<div id="results"></div>



<script>


let players={};



async function searchArchive(){


let text=document.getElementById("search").value || "*";

let type=document.getElementById("type").value;

let rows=document.getElementById("rows").value;



let query=text;


if(type){

query+=" AND mediatype:"+type;

}



let url=

"https://archive.org/advancedsearch.php?q="
+encodeURIComponent(query)
+
"&fl[]=identifier,title,mediatype"
+
"&rows="
+rows
+
"&output=json";



document.getElementById("status").innerHTML="Searching...";



let res=await fetch(url);

let data=await res.json();


let box=document.getElementById("results");

box.innerHTML="";


document.getElementById("status").innerHTML=
"Found "+data.response.numFound+" results";



for(let item of data.response.docs){

await loadItem(item.identifier);

}


}



async function loadItem(id){


let url=
"https://archive.org/metadata/"
+id;



let res=await fetch(url);

let data=await res.json();



let meta=data.metadata;


let tracks=[];


if(data.files){


data.files.forEach(file=>{


if(
file.name.toLowerCase().endsWith(".mp3") ||
file.name.toLowerCase().endsWith(".ogg") ||
file.name.toLowerCase().endsWith(".flac")
){

tracks.push(file);

}


});


}



let playable=tracks.length;



let box=document.getElementById("results");



let card=document.createElement("div");

card.className="card";



let playerID="player_"+id;


players[playerID]=tracks;



let playlist="";


tracks.forEach((t,i)=>{


let clean=t.name.split("/").pop();


playlist+=`

<div class="track"
onclick="playTrack('${playerID}',${i})">

🎵 ${clean}

</div>

`;



});



card.innerHTML=`

<h2>
🎵 ${meta.title || id}
</h2>


<span class="tag">
${meta.mediatype || "unknown"}
</span>



<div class="info">


<p>

<b>Description:</b><br>

${meta.description || "No description"}

</p>


<p>

<b>Genre:</b>

${meta.subject || "Unknown"}

</p>


<p>

<b>Uploader:</b>

${meta.uploader || "Unknown"}

</p>


<p>

<b>Date:</b>

${meta.publicdate || "Unknown"}

</p>


<p>

<b>Files:</b>

${data.files.length}

</p>


<p>

<b>Playable Tracks:</b>

${playable}

</p>



<a target="_blank"
href="https://archive.org/details/${id}">

🌐 Archive Page

</a>

<br><br>


<a target="_blank"
href="https://archive.org/download/${id}">

📂 All Files

</a>


<br><br>


<a target="_blank"
href="https://archive.org/metadata/${id}">

⚙ Metadata

</a>



<br><br>


<audio id="${playerID}"
controls>

</audio>



<h3>
Playlist
</h3>


<div class="playlist">

${playlist || "No playable tracks"}

</div>



</div>


`;



document.getElementById("results").appendChild(card);



}
