<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Obvyris Archive Database</title>

<style>

body{
background:#090f18;
color:#d8e2ef;
font-family:Arial,Helvetica,sans-serif;
font-size:13px;
padding:10px;
}


h1{
font-size:20px;
color:#2793ff;
margin:5px 0 10px;
}


.controls{

background:#111827;
border:1px solid #26364d;
padding:10px;
border-radius:6px;

}


input,select,button{

font-size:13px;
padding:6px 8px;
margin:2px;
border-radius:4px;
border:0;

}


input{

width:45%;

}


button{

background:#2793ff;
color:white;
cursor:pointer;

}


button:disabled{

background:#444;
cursor:not-allowed;

}


button:hover{

background:#57b0ff;

}


#pagebar{

margin:10px 0;

}


.card{

background:#111827;
border:1px solid #26364d;
padding:10px;
margin-top:8px;
border-radius:6px;

}


.card h2{

font-size:15px;
color:#57b0ff;
margin:0 0 5px;

}


.tag{

font-size:11px;
background:#2793ff;
padding:3px 6px;
border-radius:3px;

}


.info{

line-height:1.35;

}


.player{

width:300px;
height:32px;

}


.files{

margin-top:8px;
background:#0b1220;
border-top:1px solid #26364d;

}


.track{

padding:5px;
border-bottom:1px solid #26364d;
cursor:pointer;

}


.track:hover{

background:#1b3048;

}


audio{

width:300px;
height:30px;

}


a{

color:#7bd0ff;
font-size:12px;

}


.small{

font-size:12px;
color:#9aa9bb;

}


</style>

</head>


<body>


<h1>
Obvyris Archive Database
</h1>



<div class="controls">


<input id="search"
placeholder="Search Archive...">


<select id="type">

<option value="">
All
</option>

<option value="audio">
Audio
</option>

<option value="movies">
Movies
</option>

<option value="texts">
Texts
</option>

<option value="software">
Software
</option>

</select>



<select id="rows">

<option value="10">
10
</option>

<option value="25">
25
</option>

<option value="50">
50
</option>

</select>



<button onclick="searchArchive(1)">
Search
</button>


</div>



<div id="pagebar">


<button id="prevBtn"
onclick="previousPage()">

Previous

</button>


<span id="pageInfo">
Page 1
</span>


<button id="nextBtn"
onclick="nextPage()">

Next

</button>


</div>



<div id="status"></div>


<div id="results"></div>



<script>


let currentPage=1;

let totalPages=1;



async function searchArchive(page=1){


currentPage=page;



let text =
document.getElementById("search").value || "*";


let type =
document.getElementById("type").value;


let rows =
document.getElementById("rows").value;



let query=text;



if(type){

query += " AND mediatype:"+type;

}



let start =
(page-1)*rows;



let url=

"https://archive.org/advancedsearch.php?q="
+
encodeURIComponent(query)
+
"&fl[]=identifier,title,mediatype"
+
"&rows="
+
rows
+
"&start="
+
start
+
"&output=json";



document.getElementById("status").innerHTML=
"Loading...";



let response =
await fetch(url);


let data =
await response.json();



document.getElementById("results").innerHTML="";



totalPages =
Math.ceil(
data.response.numFound / rows
);



document.getElementById("status").innerHTML=

"Results: "
+
data.response.numFound;



document.getElementById("pageInfo").innerHTML=

"Page "
+
currentPage
+
" / "
+
totalPages;



document.getElementById("prevBtn").disabled =
currentPage<=1;


document.getElementById("nextBtn").disabled =
currentPage>=totalPages;



for(let item of data.response.docs){

await loadItem(item.identifier);

}


}


async function loadItem(id){


let response =
await fetch(
"https://archive.org/metadata/"+id
);


let data =
await response.json();



let meta =
data.metadata || {};



let files =
data.files || [];



let audioFiles=[];



files.forEach(file=>{


let name =
file.name.toLowerCase();



if(

name.endsWith(".mp3") ||
name.endsWith(".ogg") ||
name.endsWith(".flac") ||
name.endsWith(".wav")

){

audioFiles.push(file);

}


});



let playerID =
"audio_"+id;



let tracks="";



audioFiles.forEach((file,index)=>{


let filename =
file.name.split("/").pop();



let url =

"https://archive.org/download/"
+
id
+
"/"
+
encodeURIComponent(file.name);



tracks += `


<div class="track"
onclick="playFile('${playerID}','${url}')">


🎵 ${filename}


</div>


`;



});





let subjects =
Array.isArray(meta.subject)
?
meta.subject.join(", ")
:
(meta.subject || "Unknown");





let card=document.createElement("div");

card.className="card";



card.innerHTML=



`

<h2>
🎵 ${meta.title || id}
</h2>


<span class="tag">

${meta.mediatype || "unknown"}

</span>



<div class="info">


<p>
<b>Description:</b><br>

${

meta.description
?
String(meta.description).substring(0,300)
:
"No description"

}

</p>



<p>

<b>Genre:</b>
${subjects}

</p>



<p>

<b>Uploader:</b>
${meta.uploader || "Unknown"}

</p>



<p>

<b>Date:</b>
${meta.publicdate || "Unknown"}

</p>



<p class="small">

Files:
${files.length}

|

Playable:
${audioFiles.length}

</p>


</div>



<audio id="${playerID}"
controls
class="player">

</audio>



<div class="files">

${

tracks ||

"No playable audio files"

}

</div>



<br>


<a target="_blank"
href="https://archive.org/details/${id}">

Archive

</a>

|

<a target="_blank"
href="https://archive.org/download/${id}">

Files

</a>

|

<a target="_blank"
href="https://archive.org/metadata/${id}">

Metadata

</a>



`;




document
.getElementById("results")
.appendChild(card);



}




function playFile(player,url){


let audio =
document.getElementById(player);



audio.src=url;


audio.play();



}



function nextPage(){


if(currentPage < totalPages){

searchArchive(currentPage+1);

}


}



function previousPage(){


if(currentPage > 1){

searchArchive(currentPage-1);

}


}



</script>


</body>

</html>
