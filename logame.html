<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Obvyris Archive Data Engine</title>


<style>

body{

background:#070d16;

color:#d8e1ec;

font-family:Arial,Helvetica,sans-serif;

font-size:13px;

margin:12px;

}



h1{

font-size:20px;

color:#2793ff;

margin:5px 0 12px;

}



.controls{

background:#101a29;

border:1px solid #25384d;

padding:10px;

}



input,
select,
button{

background:#17263a;

color:white;

border:1px solid #31465f;

padding:6px;

font-size:13px;

}



input{

width:300px;

}



button{

background:#2793ff;

border:none;

cursor:pointer;

}



button:hover{

background:#55b5ff;

}



.nav{

margin-top:10px;

}



#pageInfo{

margin-left:10px;

color:#aaa;

}



#status{

font-size:12px;

color:#aaa;

}



.card{

background:#101923;

border:1px solid #25384d;

padding:10px;

margin-top:8px;

}



.title{

font-size:15px;

color:#55b8ff;

font-weight:bold;

}



.meta{

line-height:18px;

color:#b9c6d6;

}



.tag{

background:#2793ff;

padding:2px 7px;

border-radius:10px;

font-size:11px;

}



.file{

padding:5px;

border-bottom:1px solid #26384f;

cursor:pointer;

}



.file:hover{

background:#1b3048;

}



.files{

display:none;

margin-top:10px;

}



.small{

font-size:11px;

color:#8995a5;

}



audio{

width:100%;

height:35px;

}



a{

color:#65c9ff;

}


details{

margin-top:5px;

}


summary{

cursor:pointer;

color:#65c9ff;

font-size:12px;

}


details .small{

padding:6px;

background:#0c1522;

border-left:2px solid #2793ff;

margin-top:5px;

}

#playerBar{

position:fixed;

bottom:0;

left:0;

right:0;

background:#101923;

border-top:1px solid #25384d;

padding:8px;

font-size:12px;

z-index:9999;

}


#playerBar button{

padding:5px 12px;

margin:3px;

}


#npName{

color:#55b8ff;

font-weight:bold;

}


#npMeta{

color:#aaa;

font-size:11px;

}
  
</style>


</head>



<body>



<h1>
🔎 Obvyris Archive Data Engine
</h1>



<div class="controls">

<input id="search"
placeholder="Search Internet Archive...">


<select id="type">

<option value="">
All Media
</option>

<option value="audio">
🎵 Audio
</option>

<option value="movies">
🎬 Movies
</option>

<option value="texts">
📚 Texts
</option>

<option value="software">
💾 Software
</option>

<option value="etree">
🎸 Live Concerts
</option>

</select>


<input id="creator"
placeholder="Creator">


<input id="uploader"
placeholder="Uploader">


<input id="genre"
placeholder="Genre">


<select id="sort">

<option value="downloads desc">
Most Popular
</option>

<option value="date desc">
Newest
</option>

<option value="titleSorter asc">
Title A-Z
</option>

</select>


<button onclick="searchArchive(0)">
SEARCH
</button>


</div>




<div class="nav">


<button onclick="previousPage()">

◀ Previous

</button>



<button onclick="nextPage()">

Next ▶

</button>



<span id="pageInfo"></span>



</div>




<h3 id="status"></h3>



<div id="results"></div>


<!-- GLOBAL ARCHIVE PLAYER -->

<div id="playerBar">

<div id="npName">
No Track Playing
</div>

<div id="npMeta">
Archive Audio
</div>


<audio id="audio"></audio>


<div>

<button onclick="archivePrev()">
◀
</button>


<button onclick="archiveToggle()">
▶ / ⏸
</button>


<button onclick="archiveNext()">
▶
</button>

</div>


</div>

<script>


let currentPage = 0;


let pageSize = 500;


let currentQuery = "*";


let currentSort = "downloads desc";



let playlist = [];

let playlistIndex = 0;



async function searchArchive(page){


currentPage = page;



let text =
document.getElementById("search").value.trim();



let type =
document.getElementById("type").value;



currentSort =
document.getElementById("sort").value;



currentQuery =
text || "*";


// Media type filter

if(type){

currentQuery += 
" AND mediatype:" + type;

}


// Creator filter

let creator =
document.getElementById("creator")
.value
.trim();


if(creator){

currentQuery +=
' AND creator:"' + creator + '"';

}


// Uploader filter

let uploader =
document.getElementById("uploader")
.value
.trim();


if(uploader){

currentQuery +=
' AND uploader:"' + uploader + '"';

}


// Genre filter

let genre =
document.getElementById("genre")
.value
.trim();


if(genre){

currentQuery +=
' AND subject:"' + genre + '"';

}



let start =
page * pageSize;




let url =

"https://archive.org/advancedsearch.php?q="

+ encodeURIComponent(currentQuery)

+ "&fl[]=identifier,title,creator,uploader,description,mediatype,subject,date"

+ "&rows=" + pageSize

+ "&start=" + start

+ "&sort[]=" + encodeURIComponent(currentSort)

+ "&output=json";




document.getElementById("status").innerHTML =
"Loading 500 results...";




let response =
await fetch(url);



let data =
await response.json();




document.getElementById("pageInfo").innerHTML =

"Page " + (page + 1);



document.getElementById("status").innerHTML =

"Found "

+ data.response.numFound

+ " records";



displayResults(data.response.docs);



}


function nextPage(){

searchArchive(currentPage + 1);

}



function previousPage(){

if(currentPage > 0){

searchArchive(currentPage - 1);

}

}





function displayResults(items){


let box =
document.getElementById("results");


box.innerHTML="";



items.forEach(item=>{


let icon="📁";


if(item.mediatype=="audio")
icon="🎵";

if(item.mediatype=="movies")
icon="🎬";

if(item.mediatype=="texts")
icon="📚";

if(item.mediatype=="software")
icon="💾";




let subject = "";


if(Array.isArray(item.subject)){

subject=item.subject.join(", ");

}

else{

subject=item.subject || "";

}





box.innerHTML += `


<div class="card">



<div class="title">

${icon}

${escapeHTML(item.title || "Unknown")}

</div>



<div class="meta">


<span class="tag">

${item.mediatype}

</span>



<br>


Creator:

${escapeHTML(item.creator || "Unknown")}



<br>


Uploader:

${escapeHTML(item.uploader || "Unknown")}



<br>


Date:

${escapeHTML(item.date || "Unknown")}



<br>


<details>

<summary>
Genre
</summary>


<div class="small">

${escapeHTML(subject || "Unknown")}

</div>


</details>


<br>


Description:

<br>

${escapeHTML(

(item.description || "No description")

.substring(0,250)

)}



</div>




<br>



<button onclick="loadFiles('${item.identifier}',this)">

🎵 Load Tracks

</button>



<a target="_blank"

href="https://archive.org/details/${item.identifier}">

🌐 Archive Page

</a>



&nbsp;



<a target="_blank"

href="https://archive.org/download/${item.identifier}">

📂 All Files

</a>



&nbsp;



<button onclick="showMeta('${item.identifier}')">

⚙ Metadata

</button>




<div class="files"

id="files-${item.identifier}">


</div>



</div>


`;



});



}





async function loadFiles(id,btn){



let box =

document.getElementById("files-"+id);



if(box.style.display=="block"){


box.style.display="none";


return;


}



box.style.display="block";


box.innerHTML="Loading files...";




let response = await fetch(

"https://archive.org/metadata/"+id

);



let data = await response.json();



let tracks=[];



let totalFiles =
data.files.length;




data.files.forEach(file=>{


let name=file.name || "";



if(

name.toLowerCase().endsWith(".mp3")

||

name.toLowerCase().endsWith(".ogg")

||

name.toLowerCase().endsWith(".wav")

){



tracks.push({


name:name,


url:

"https://archive.org/download/"

+id+"/"

+encodeURIComponent(name)



});



}



});






let html = `


<div class="small">

Files:

${totalFiles}


<br>


Playable Tracks:

${tracks.length}


</div>



<div id="player">

</div>



`;





tracks.forEach((track,index)=>{


html += `


<div class="file"

onclick="playArchiveFile('${id}',${index})">


🎵

${escapeHTML(track.name)}



</div>


`;



});




archivePlaylist = tracks;

archiveIndex = 0;




box.innerHTML = html;



}



function playArchiveFile(id,index){

    if(id){

        loadFiles(id);

    }

    playTrack(index);

}

function archiveToggle(){

const audio=document.getElementById("audio");


if(audio.paused){

audio.play();

}else{

audio.pause();

}

}



function archiveNext(){

if(
archiveIndex <
archivePlaylist.length-1
){

archiveIndex++;

playTrack(archiveIndex);

}

}



function archivePrev(){

if(
archiveIndex>0
){

archiveIndex--;

playTrack(archiveIndex);

}

}
  
async function showMeta(id){



let response = await fetch(

"https://archive.org/metadata/"+id

);



let data = await response.json();



let m=data.metadata;



alert(

"Identifier:\n"

+id+



"\n\nTitle:\n"

+(m.title || "")



+"\n\nCreator:\n"

+(m.creator || "")



+"\n\nUploader:\n"

+(m.uploader || "")



+"\n\nCollection:\n"

+(m.collection || "")



+"\n\nDescription:\n"

+(m.description || "")



);




}




function escapeHTML(text){


return String(text)

.replaceAll("&","&amp;")

.replaceAll("<","&lt;")

.replaceAll(">","&gt;")

.replaceAll('"',"&quot;");

}

// =============================
// GLOBAL AUDIO PLAYER
// =============================


let archivePlaylist=[];
let archiveIndex=0;


function playTrack(index){


if(!archivePlaylist[index])
return;


archiveIndex=index;


const track=archivePlaylist[index];


const audio=document.getElementById("audio");


audio.src=track.url;


audio.play();



document.getElementById("npName").innerHTML =
"🎵 " + track.name;


document.getElementById("npMeta").innerHTML =
"Track " + (index+1) +
" / " +
archivePlaylist.length;


audio.onended=function(){

    archiveNext();

};


}



function nextTrack(){


if(playlistIndex < playlist.length-1){


playlistIndex++;


playTrack(playlistIndex);



}


}





function previousTrack(){


if(playlistIndex > 0){


playlistIndex--;


playTrack(playlistIndex);



}


}





</script>



</body>


</html>
