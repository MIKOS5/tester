<!DOCTYPE html>
<html>
<head>
  <title>QA AQL System (Auto Engine)</title>

  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #0f172a;
      color: white;
    }

    header {
      background: #1e293b;
      padding: 15px;
      font-size: 18px;
      font-weight: bold;
    }

    .container {
      display: grid;
      grid-template-columns: 260px 1fr;
      height: 100vh;
    }

    .sidebar {
      background: #111827;
      padding: 10px;
    }

    .sidebar button {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      background: #334155;
      color: white;
      border: none;
      cursor: pointer;
    }

    .sidebar button:hover {
      background: #475569;
    }

    .content {
      padding: 20px;
      overflow-y: auto;
    }

    .card {
      background: #1e293b;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin: 5px 0;
      background: #0f172a;
      color: white;
      border: 1px solid #334155;
    }

    button.action {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: #22c55e;
      border: none;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button.action:hover {
      background: #16a34a;
    }

    .fail {
      background: #ef4444;
      padding: 10px;
      border-radius: 8px;
      margin-top: 10px;
    }

    .pass {
      background: #22c55e;
      padding: 10px;
      border-radius: 8px;
      margin-top: 10px;
    }

  </style>
</head>

<body>

<header>
  QA AQL Inspection System (Auto Engine Enabled)
</header>

<div class="container">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <button onclick="loadInspection()">New Inspection</button>
    <button onclick="loadDashboard()">Dashboard</button>
    <button onclick="loadData()">Data View</button>
  </div>

  <!-- MAIN -->
  <div class="content" id="app"></div>

</div>

<script>

const API_BASE = "https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec";

// ---------------- INSPECTION UI ----------------
function loadInspection() {
  document.getElementById("app").innerHTML = `
    <div class="card">
      <h2>New QA Inspection</h2>

      <input id="inspector" placeholder="Inspector Name">
      <input id="brand" placeholder="Brand ID (B1)">
      <input id="merchant" placeholder="Merchant ID (M1)">
      <input id="product" placeholder="Product ID (P1)">

      <div class="card">
        <b>AQL Settings</b>
        <select id="inspectionLevel">
          <option value="I">Level I</option>
          <option value="II" selected>Level II</option>
          <option value="III">Level III</option>
        </select>

        <input id="aqlValue" placeholder="AQL Value (1.0 / 2.5 / 4.0)">
      </div>

      <input id="lot" placeholder="Lot Size">
      <input id="critical" placeholder="Critical Defects">
      <input id="major" placeholder="Major Defects">
      <input id="minor" placeholder="Minor Defects">

      <button class="action" onclick="submitInspection()">
        Run AQL Inspection
      </button>

      <div id="result"></div>
    </div>
  `;
}

// ---------------- SUBMIT INSPECTION ----------------
async function submitInspection() {

  const body = {
    inspector: document.getElementById("inspector").value,
    brand_id: document.getElementById("brand").value,
    merchant_id: document.getElementById("merchant").value,
    product_id: document.getElementById("product").value,

    inspection_level: document.getElementById("inspectionLevel").value,
    aql_value: parseFloat(document.getElementById("aqlValue").value),

    lot_size: parseInt(document.getElementById("lot").value),
    critical_count: parseInt(document.getElementById("critical").value),
    major_count: parseInt(document.getElementById("major").value),
    minor_count: parseInt(document.getElementById("minor").value)
  };

  let res = await fetch(API_BASE + "?action=createInspection", {
    method: "POST",
    body: JSON.stringify(body)
  });

  let data = await res.json();

  const r = data.aql_result;

  document.getElementById("result").innerHTML = `
    <div class="card">
      <h3>Inspection Result</h3>

      <div class="${r.decision === 'PASS' ? 'pass' : 'fail'}">
        <h2>${r.decision}</h2>
      </div>

      <p><b>Inspection ID:</b> ${data.inspection_id}</p>
      <p><b>Sample Size:</b> ${r.sampleSize}</p>
      <p><b>Total Defects:</b> ${r.defects}</p>
      <p><b>Accept Limit:</b> ${r.accept}</p>
      <p><b>Reject Limit:</b> ${r.reject}</p>
      <p><b>Reason:</b> ${r.reason}</p>
    </div>
  `;
}

// ---------------- DASHBOARD (placeholder) ----------------
function loadDashboard() {
  document.getElementById("app").innerHTML = `
    <div class="card">
      <h2>Dashboard</h2>
      <p>Connect stats endpoint for graphs next step</p>
    </div>
  `;
}

// ---------------- DATA VIEW ----------------
function loadData() {
  document.getElementById("app").innerHTML = `
    <div class="card">
      <h2>Data View</h2>
      <button class="action" onclick="loadBrands()">Load Brands</button>
      <div id="data"></div>
    </div>
  `;
}

async function loadBrands() {
  let res = await fetch(API_BASE + "?action=getBrands");
  let data = await res.json();

  let html = "<h3>Brands</h3>";

  data.forEach(b => {
    html += `<div class="card">${b.brand_id} - ${b.brand_name}</div>`;
  });

  document.getElementById("data").innerHTML = html;
}

// default
loadInspection();

</script>

</body>
</html>
