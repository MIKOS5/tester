<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Radiowave Hub</title>

<style>

/* =========================
   🎨 THEME (MATCH RADIOWAVE)
========================= */
:root{
  --bg:#09111d;
  --panel:#111827;
  --panel2:#0b1220;
  --line:#253347;

  --text:#fff;
  --muted:#93a4bb;

  --blue:#2793ff;
  --blue-dark:#1869d9;

  --green:#17c964;
  --green-dark:#0ea85a;

  --shadow:0 10px 30px rgba(0,0,0,.4);
}

*{
  box-sizing:border-box;
  font-family:Inter, Arial, sans-serif;
}

body{
  margin:0;
  height:100vh;
  display:flex;
  background:var(--bg);
  color:var(--text);
  overflow:hidden;
}

/* =========================
   SIDEBAR
========================= */
.sidebar{
  width:320px;
  background:var(--panel);
  border-right:1px solid var(--line);
  padding:16px;
  display:flex;
  flex-direction:column;
  gap:14px;
}

/* LOGO */
.logo{
  font-size:26px;
  font-weight:900;
  letter-spacing:.5px;
}
.logo span{
  color:var(--blue);
}

/* NOW PLAYING */
.player{
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px;
  box-shadow:var(--shadow);
}

.now{
  font-weight:800;
  font-size:16px;
}

.meta{
  font-size:12px;
  color:var(--muted);
  margin-top:4px;
}

/* CONTROLS */
.controls{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:10px;
}

button{
  border:none;
  border-radius:12px;
  padding:10px;
  font-weight:800;
  cursor:pointer;
  color:white;
  background:linear-gradient(180deg,var(--blue),var(--blue-dark));
  transition:.15s;
}

button:hover{
  transform:translateY(-1px);
  filter:brightness(1.1);
}

/* secondary buttons */
.btn-dark{
  background:var(--panel);
  border:1px solid var(--line);
}

/* =========================
   MAIN AREA
========================= */
.main{
  flex:1;
  display:flex;
  flex-direction:column;
}

header{
  background:var(--panel);
  border-bottom:1px solid var(--line);
  padding:12px 16px;
  font-weight:800;
  letter-spacing:.5px;
}

/* iframe browser */
iframe{
  flex:1;
  border:none;
  background:white;
}

/* =========================
   MINI STATUS BAR
========================= */
.statusbar{
  display:flex;
  gap:10px;
  margin-top:10px;
}

.pill{
  flex:1;
  padding:8px;
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:999px;
  font-size:12px;
  text-align:center;
  color:var(--muted);
}

/* =========================
   RESPONSIVE
========================= */
@media(max-width:900px){
  body{flex-direction:column;}
  .sidebar{width:100%;flex-direction:row;overflow:auto;}
  .main{height:100%;}
}

</style>
</head>

<body>

<!-- GLOBAL AUDIO ENGINE -->
<audio id="audio"></audio>

<!-- SIDEBAR -->
<div class="sidebar">

  <div class="logo">📻 Radiowave <span>Hub</span></div>

  <!-- PLAYER -->
  <div class="player">

    <div class="now" id="nowPlaying">Not Playing</div>
    <div class="meta" id="meta">Select a station</div>

    <div class="controls">
      <button onclick="prev()">⏮</button>
      <button onclick="toggle()">▶</button>
      <button onclick="next()">⏭</button>
    </div>

    <div style="margin-top:10px;display:grid;gap:6px;">
      <button class="btn-dark" onclick="send('showAll')">📻 All Stations</button>
      <button class="btn-dark" onclick="send('loadFavorites')">⭐ Favorites</button>
    </div>

  </div>

  <!-- STATUS -->
  <div class="statusbar">
    <div class="pill" id="status1">Live Browser</div>
    <div class="pill" id="status2">Audio Engine</div>
  </div>

</div>

<!-- MAIN BROWSER -->
<div class="main">

  <header>🎧 Station Browser</header>

  <iframe id="frame" src="RADIOWAVE9.html"></iframe>

</div>

<script>

/* =========================
   STATE
========================= */
let stations = [];
let index = 0;

/* =========================
   RECEIVE FROM RADIOWAVE
========================= */
window.addEventListener("message", (e) => {
  const msg = e.data;

  if (!msg) return;

  if (msg.type === "play") {
    play(msg.station, msg.list, msg.index);
  }
});

/* =========================
   PLAY ENGINE (GLOBAL)
========================= */
function play(station, list, i){

  const audio = document.getElementById("audio");

  stations = list || [];
  index = i || 0;

  audio.src = station.url;
  audio.play();

  document.getElementById("nowPlaying").innerText = station.name;
  document.getElementById("meta").innerText =
    `${station.genre} • ${station.country || ""}`;
}

/* =========================
   CONTROLS
========================= */
function next(){
  if(!stations.length) return;
  index = (index + 1) % stations.length;
  play(stations[index], stations, index);
}

function prev(){
  if(!stations.length) return;
  index = (index - 1 + stations.length) % stations.length;
  play(stations[index], stations, index);
}

function toggle(){
  const audio = document.getElementById("audio");
  if(audio.paused) audio.play();
  else audio.pause();
}

/* =========================
   SEND COMMANDS TO APP
========================= */
function send(cmd){
  document.getElementById("frame")
    .contentWindow
    .postMessage({ type: cmd }, "*");
}

</script>

</body>
</html>
