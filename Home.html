<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radiowave Hub</title>

<style>
body {
  margin:0;
  height:100vh;
  display:flex;
  font-family:Arial;
  overflow:hidden;
}

.sidebar {
  width:260px;
  background:#111;
  color:#fff;
  padding:10px;
}

.main {
  flex:1;
  display:flex;
  flex-direction:column;
}

header {
  background:#222;
  color:white;
  padding:10px;
}

iframe {
  flex:1;
  border:none;
}

/* PLAYER */
.player {
  background:#1a1a1a;
  padding:10px;
  border-radius:10px;
}

button {
  width:100%;
  margin-top:5px;
}
</style>
</head>

<body>

<!-- GLOBAL AUDIO (IMPORTANT) -->
<audio id="globalAudio"></audio>

<div class="sidebar">

  <h3>🎧 Radiowave</h3>

  <div class="player">
    <div id="nowPlaying">Not Playing</div>
    <div id="meta">Select station</div>

    <button onclick="togglePlay()">▶ Play / Pause</button>
    <button onclick="nextStation()">⏭ Next</button>
  </div>

  <hr>

  <button onclick="sendToApp('loadFavorites')">⭐ Favorites</button>
  <button onclick="sendToApp('showAll')">📻 All Stations</button>
</div>

<div class="main">
  <header>Radiowave Browser</header>

  <iframe id="appFrame" src="radiowave.html"></iframe>
</div>

<script>

let currentStation = null;
let stations = [];
let index = 0;

/* RECEIVE FROM IFRAME */
window.addEventListener("message", (e) => {
  const msg = e.data;

  if (msg.type === "play") {
    playStream(msg.station, msg.list, msg.index);
  }
});

/* SEND COMMANDS TO IFRAME */
function sendToApp(cmd) {
  document.getElementById("appFrame")
    .contentWindow
    .postMessage({ type: cmd }, "*");
}

/* GLOBAL PLAYER */
function playStream(station, list, i) {

  currentStation = station;
  stations = list || [];
  index = i || 0;

  const audio = document.getElementById("globalAudio");

  audio.src = station.url;
  audio.play();

  document.getElementById("nowPlaying").innerText = station.name;
  document.getElementById("meta").innerText =
    station.genre + " • " + station.country;

  sendToApp({
    type:"syncPlaying",
    index:i
  });
}

function togglePlay() {
  const audio = document.getElementById("globalAudio");
  if (audio.paused) audio.play();
  else audio.pause();
}

function nextStation() {
  if (!stations.length) return;

  index = (index + 1) % stations.length;
  playStream(stations[index], stations, index);
}

</script>

</body>
</html>
