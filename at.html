<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"> <title>ÆX-NULL // UNKNOWN NODE</title> <style> *{ box-sizing:border-box; } html, body{ margin:0; width:100%; height:100%; overflow:hidden; background:#020504; color:#b9ffe8; font-family:monospace; } body{ display:flex; align-items:center; justify-content:center; background: radial-gradient(circle at 50% 45%,#12352c 0%,#06120f 35%,#020504 75%); } /* ================================= STAR / PARTICLE FIELD ================================= */ .space{ position:fixed; inset:0; overflow:hidden; pointer-events:none; } .star{ position:absolute; width:2px; height:2px; background:#b9ffe8; border-radius:50%; opacity:.5; animation:drift linear infinite; } @keyframes drift{ from{ transform:translateY(0); opacity:.15; } 50%{ opacity:.8; } to{ transform:translateY(100vh); opacity:.05; } } /* ================================= TERMINAL ================================= */ .terminal{ position:relative; width:min(900px,94vw); height:min(720px,92vh); border:1px solid #3cffc4; background: linear-gradient( rgba(0,255,170,.035) 50%, transparent 50% ); background-size:100% 4px; box-shadow: 0 0 25px rgba(0,255,180,.15), inset 0 0 50px rgba(0,255,180,.04); overflow:hidden; } .terminal:before{ content:""; position:absolute; inset:0; background: repeating-linear-gradient( 0deg, transparent 0px, transparent 3px, rgba(255,255,255,.015) 4px ); pointer-events:none; } /* ================================= HEADER ================================= */ .header{ height:64px; display:flex; align-items:center; justify-content:space-between; padding:0 20px; border-bottom:1px solid rgba(60,255,196,.35); background:rgba(0,30,23,.7); } .logo{ font-size:18px; letter-spacing:4px; color:#63ffd1; } .status{ font-size:11px; color:#69ffbc; letter-spacing:2px; } /* ================================= CONTENT ================================= */ .content{ height:calc(100% - 64px); display:grid; grid-template-columns:190px 1fr; } /* ================================= NAV ================================= */ .nav{ border-right:1px solid rgba(60,255,196,.25); padding:15px; overflow:auto; } .navButton{ width:100%; margin-bottom:10px; padding:12px 8px; border:1px solid rgba(60,255,196,.25); background:rgba(0,255,170,.025); color:#75eac8; font-family:monospace; cursor:pointer; text-align:left; } .navButton:hover{ background:rgba(0,255,170,.1); border-color:#3cffc4; } .alien{ font-size:13px; letter-spacing:2px; } /* ================================= MAIN ================================= */ .main{ padding:25px; overflow:auto; } .warning{ border:1px solid #ff5577; color:#ff7993; padding:15px; margin-bottom:20px; box-shadow: 0 0 15px rgba(255,60,100,.08); } .title{ font-size:28px; letter-spacing:7px; margin-bottom:8px; color:#d2fff2; } .subtitle{ color:#5aa892; font-size:12px; margin-bottom:30px; } .dataGrid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; } .data{ border:1px solid rgba(60,255,196,.2); padding:15px; min-height:85px; background:rgba(0,255,170,.02); } .label{ font-size:10px; color:#4b9f89; margin-bottom:10px; letter-spacing:2px; } .value{ color:#baffea; font-size:14px; } /* ================================= CONSOLE ================================= */ .console{ margin-top:20px; min-height:170px; border:1px solid rgba(60,255,196,.2); padding:15px; background:#010807; color:#7dffcf; font-size:12px; line-height:1.7; overflow:auto; } .cursor{ display:inline-block; width:7px; height:13px; background:#69ffbc; animation:blink .8s infinite; } @keyframes blink{ 50%{ opacity:0; } } /* ================================= CONTROLS ================================= */ .controls{ display:flex; flex-wrap:wrap; gap:10px; margin-top:20px; } .control{ border:1px solid #2a9c7b; background:#03130f; color:#7dffcf; padding:12px 16px; font-family:monospace; cursor:pointer; } .control:hover{ background:#083126; border-color:#64ffd0; } /* ================================= MOBILE ================================= */ @media(max-width:650px){ .content{ grid-template-columns:1fr; } .nav{ display:flex; gap:8px; border-right:0; border-bottom:1px solid rgba(60,255,196,.25); height:70px; overflow-x:auto; } .navButton{ min-width:120px; margin:0; } .main{ padding:18px; } .dataGrid{ grid-template-columns:1fr; } .title{ font-size:20px; } } </style> </head> <body> <div class="space" id="space"></div> <div class="terminal">
