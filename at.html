<html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width,initial-scale=1"> <title>OBVYRIS // OFFWORLD</title> <style> @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&display=swap'); *{ box-sizing:border-box; } html, body{ margin:0; min-height:100%; background:#020308; color:#d9faff; font-family:Orbitron,sans-serif; overflow-x:hidden; } body{ background: radial-gradient( circle at 50% 35%, rgba(31,110,130,.18), transparent 35% ), radial-gradient( circle at 20% 80%, rgba(94,32,160,.12), transparent 35% ), #020308; } /* ================================ SPACE ================================ */ #space{ position:fixed; inset:0; overflow:hidden; pointer-events:none; } .star{ position:absolute; width:2px; height:2px; background:white; border-radius:50%; opacity:.7; animation: starMove linear infinite; } @keyframes starMove{ from{ transform:translateZ(0) scale(.5); } to{ transform: translateZ(0) scale(2); } } /* ================================ PLANET ================================ */ #planet{ position:fixed; width:55vw; height:55vw; max-width:650px; max-height:650px; min-width:280px; min-height:280px; border-radius:50%; right:-15vw; bottom:-25vw; background: radial-gradient( circle at 35% 30%, #3b8c8b, #183d4b 35%, #07131c 70%, #020308 ); box-shadow: inset -50px -30px 80px #000, 0 0 100px rgba(35,190,220,.18); opacity:.75; animation: planetRotate 80s linear infinite; } @keyframes planetRotate{ from{ transform:rotate(0deg); } to{ transform:rotate(360deg); } } /* ================================ MAIN ================================ */ #interface{ position:relative; z-index:5; min-height:100vh; padding:25px; display:flex; flex-direction:column; } /* ================================ TOP BAR ================================ */ .topbar{ display:flex; justify-content:space-between; align-items:center; gap:15px; padding:14px 18px; border: 1px solid rgba(87,225,255,.3); background: rgba(2,7,12,.75); backdrop-filter: blur(12px); box-shadow: 0 0 25px rgba(0,200,255,.08); } .system{ font-size:13px; color:#62eaff; letter-spacing:2px; } .status{ color:#7cff9b; font-size:11px; } /* ================================ SHIP WINDOW ================================ */ .window{ margin:25px auto; width:min(1200px,100%); height:330px; position:relative; overflow:hidden; border-radius:20px; border: 1px solid rgba(102,225,255,.5); background: radial-gradient( circle at center, rgba(26,91,120,.18), #010205 70% ); box-shadow: inset 0 0 80px #000, 0 0 50px rgba(0,190,255,.1); } /* window frame */ .window:before{ content:""; position:absolute; inset:0; border: 25px solid rgba(0,0,0,.65); border-radius:20px; z-index:10; pointer-events:none; } /* glass reflections */ .window:after{ content:""; position:absolute; inset:0; background: linear-gradient( 120deg, transparent 40%, rgba(255,255,255,.04) 50%, transparent 60% ); pointer-events:none; } #spaceView{ position:absolute; inset:0; } /* ================================ ALIEN SIGNAL ================================ */ .signal{ position:absolute; left:50%; top:50%; transform: translate(-50%,-50%); text-align:center; opacity:.8; } .signalSymbol{ font-size:55px; color:#63eaff; text-shadow: 0 0 20px #00eaff, 0 0 50px #00aaff; animation: signalPulse 2s infinite; } @keyframes signalPulse{ 0%,100%{ opacity:.35; transform:scale(.95); } 50%{ opacity:1; transform:scale(1.05); } } /* ================================ DATA AREA ================================ */ .grid{ width:min(1200px,100%); margin:auto; display:grid; grid-template-columns: 1fr 1fr; gap:20px; } .panel{ background: rgba(3,9,15,.82); border: 1px solid rgba(73,214,255,.25); padding:22px; box-shadow: 0 0 30px rgba(0,200,255,.05); } .panelTitle{ color:#60e8ff; font-size:12px; letter-spacing:2px; margin-bottom:18px; border-bottom: 1px solid rgba(96,232,255,.15); padding-bottom:10px; } .telemetry{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; } .telemetry div{ padding:12px; background: rgba(255,255,255,.025); border-left: 2px solid #287f96; } .telemetry span{ display:block; font-size:9px; color:#657f8c; margin-bottom:5px; } .telemetry strong{ font-size:13px; color:#c9f8ff; } /* ================================ ALIEN TEXT ================================ */ .alienText{ font-family:monospace; font-size:17px; line-height:1.8; color:#72edff; min-height:120px; text-shadow: 0 0 10px rgba(0,220,255,.4); } .translation{ margin-top:15px; color:#8b9da5; font-family:Arial,sans-serif; font-size:13px; line-height:1.6; } /* ================================ MEMORY ================================ */ .memory{ grid-column:1/-1; } .memoryTitle{ color:white; font-size:22px; margin-bottom:8px; } .memoryMeta{ color:#61dfff; font-size:10px; margin-bottom:18px; } .memoryText{ max-height:260px; overflow:auto; padding:18px; background:#02060a; border: 1px solid rgba(255,255,255,.08); font-family:Arial,sans-serif; color:#b9c9cf; line-height:1.7; } .memoryText::-webkit-scrollbar{ width:5px; } .memoryText::-webkit-scrollbar-thumb{ background:#236a7b; } /* ================================ BUTTONS ================================ */ .actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; } button{ background:#082d3a; color:#7beaff; border: 1px solid #1c839c; padding:12px 18px; border-radius:7px; cursor:pointer; font-family:Orbitron,sans-serif; font-size:11px; transition:.2s; } button:hover{ background:#0d5063; box-shadow: 0 0 15px rgba(0,220,255,.25); } button.danger{ border-color:#8c304e; color:#ff7099; } /* ================================ CONSOLE ================================ */ .console{ margin-top:20px; background:#000; border: 1px solid #183642; padding:15px; height:130px; overflow:auto; font-family:monospace; font-size:11px; color:#54e5a0; } .console div{ margin-bottom:5px; } /* ================================ FOOTER ================================ */ .footer{ text-align:center; padding:35px 10px; color:#344d56; font-size:9px; letter-spacing:2px; } /* ================================ MOBILE ================================ */ @media(max-width:700px){ #interface{ padding:12px; } .window{ height:250px; } .grid{ grid-template-columns:1fr; } .memory{ grid-column:auto; } .telemetry{ grid-template-columns:1fr 1fr; } .topbar{ flex-direction:column; align-items:flex-start; } } </style> </head> <body> <div id="space"></div> <div id="planet"></div> <div id="interface">
<div class="topbar">


            <button onclick="decodeSignal()">
                DECODE SIGNAL
            </button>


        </div>


    </div>




    <div class="panel memory">

            Memory extraction has not yet begun.

                OPEN MEMORY

        ></div>

</div>




<div class="footer">

</div>
</div> <script> /* ================================= OBVYRIS ARCHIVE CONNECTION ================================= */ const API_BASE = "https://script.google.com/macros/s/AKfycbwR9_-IIcd6yiJuQsrF9uDexBLTbYLw6sw2NlnFEGIlj83a6mY-K3x_F1czdIw3SEjX/exec"; const STORY_LIST_API = API_BASE + "?action=stories"; let chapters = []; let selectedMemory = null; /* ================================= STARS ================================= */ function createStars(){ const space = document.getElementById("space"); for(let i=0;i<180;i++){ const star = document.createElement("div"); star.className="star"; star.style.left = Math.random()*100+"%"; star.style.top = Math.random()*100+"%"; star.style.opacity = .2 + Math.random()*.8; star.style.animationDuration = (2 + Math.random()*8)+"s"; space.appendChild(star); } } createStars(); /* ================================= CONSOLE ================================= */ function log(message){ const consoleBox = document.getElementById("console"); const line = document.createElement("div"); const time = new Date() .toLocaleTimeString(); line.textContent = "["+time+"] "+message; consoleBox.appendChild(line); consoleBox.scrollTop = consoleBox.scrollHeight; } /* ================================= ALIEN DATA ================================= */ const alienMessages = [ "⟟∷⟁ 𐌗∷◈ ⟊𐌑∷", "𐌙∷⟁ 𐌑𐌗∷ 𐌚⟟◈", "⟁𐌑∷ 𐌗⟟𐌙∷", "◈∷⟁ 𐌚𐌑𐌗", "𐌗⟟∷𐌙 ⟁◈𐌑", "⟊𐌑𐌗∷ ⟁𐌙◈" ]; const translations = [ "Something is listening.", "The archive has crossed the boundary.", "Memory belongs to no world.", "You were not supposed to arrive here.", "The signal remembers you.", "Obvyris is not the origin point." ]; function randomSignal(){ const index = Math.floor( Math.random() * alienMessages.length ); document.getElementById( "alienText" ).textContent = alienMessages[index]; document.getElementById( "translation" ).textContent = translations[index]; } /* ================================= LOAD ARCHIVE ================================= */ async function loadArchive(){ log( "SEARCHING EXTERNAL MEMORY NETWORK..." ); try{ const response = await fetch( STORY_LIST_API + "&t=" + Date.now() ); const data = await response.json(); if( !data || data.status !== "success" || !Array.isArray(data.stories) ){ throw new Error( "Archive response invalid" ); } chapters = data.stories; document.getElementById( "status" ).textContent = "ARCHIVE SIGNAL ACQUIRED"; log( chapters.length + " MEMORY OBJECTS DETECTED" ); selectRandomMemory(); } catch(error){ console.error(error); document.getElementById( "status" ).textContent = "ARCHIVE SIGNAL LOST"; log( "MEMORY NETWORK CONNECTION FAILED" ); } } /* ================================= RANDOM MEMORY ================================= */ function selectRandomMemory(){ if(!chapters.length) return; const published = chapters.filter( item => !item.status || item.status === "Published" ); const source = published.length ? published : chapters; selectedMemory = source[ Math.floor( Math.random() * source.length ) ]; document.getElementById( "memoryTitle" ).textContent = selectedMemory.title || "UNKNOWN MEMORY"; document.getElementById( "memoryMeta" ).textContent = ( selectedMemory.storyId || "UNKNOWN-ID" ) + " // " + ( selectedMemory.chapter || "UNNUMBERED" ); document.getElementById( "memoryText" ).textContent = "MEMORY DETECTED.\n\n" + "Awaiting extraction."; log( "UNKNOWN MEMORY OBJECT SELECTED // " + ( selectedMemory.storyId || "UNKNOWN" ) ); } /* ================================= EXTRACT MEMORY ================================= */ async function extractMemory(){ if(!selectedMemory){ selectRandomMemory(); return; } log( "INITIATING MEMORY EXTRACTION..." ); document.getElementById( "memoryText" ).textContent = "EXTRACTING..."; try{ const response = await fetch( API_BASE + "?action=story&id=" + encodeURIComponent( selectedMemory.storyId ) + "&t=" + Date.now() ); const data = await response.json(); if( !data || data.status !== "success" ){ throw new Error( "Memory unavailable" ); } selectedMemory = data.story; document.getElementById( "memoryTitle" ).textContent = selectedMemory.title || "RECOVERED MEMORY"; document.getElementById( "memoryMeta" ).textContent = selectedMemory.storyId + " // MEMORY RECOVERED"; document.getElementById( "memoryText" ).textContent = selectedMemory.story || selectedMemory.text || "EMPTY MEMORY"; log( "MEMORY EXTRACTION COMPLETE" ); document.getElementById( "status" ).textContent = "MEMORY RECOVERED"; } catch(error){ log( "MEMORY EXTRACTION FAILED" ); document.getElementById( "memoryText" ).textContent = "The memory refused extraction."; } } /* ================================= OPEN ORIGINAL MEMORY ================================= */ function openArchiveMemory(){ if(!selectedMemory){ return; } /* Change this filename to your actual Archive HTML filename. */ window.location.href = "archive.html?id=" + encodeURIComponent( selectedMemory.storyId ); } /* ================================= WORLD SCAN ================================= */ function scanWorld(){ log( "SCANNING UNKNOWN PLANET..." ); document.getElementById( "atmosphere" ).textContent = "78% UNKNOWN"; document.getElementById( "world" ).textContent = "⟁-742"; document.getElementById( "sector" ).textContent = Math.floor( Math.random()*900 ) + ":" + Math.floor( Math.random()*999 ); document.getElementById( "orbit" ).textContent = "UNSTABLE"; document.getElementById( "threat" ).textContent = Math.random() > .7 ? "DETECTED" : "NONE"; log( "PLANETARY SCAN COMPLETE" ); } /* ================================= DECODE ================================= */ function decodeSignal(){ randomSignal(); log( "ALIEN TRANSMISSION PARTIALLY DECODED" ); } /* ================================= ALIEN CLOCK ================================= */ function updateAlienTime(){ const now = new Date(); const value = ( now.getHours()*97 + now.getMinutes()*13 + now.getSeconds() ) % 9999; document.getElementById( "alienTime" ).textContent = String(value) .padStart(4,"0"); } setInterval( updateAlienTime, 1000 ); updateAlienTime(); /* ================================= RETURN ================================= */ function returnToShip(){ window.history.back(); } /* ================================= INITIALIZATION ================================= */ randomSignal(); scanWorld(); loadArchive(); log( "OFFWORLD NODE INITIALIZED" ); log( "LOCAL COORDINATES UNKNOWN" ); log( "VESSEL CONNECTION: UNSTABLE" ); </script> </body> </html>
