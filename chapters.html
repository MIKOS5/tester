<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Obvyris Archive // Chapter Database
</title>


<style>


@import url(
'https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap'
);



*{
box-sizing:border-box;
}



body{

margin:0;

background:
radial-gradient(
circle at top,
#38215f,
#05060b 65%
);

color:#d9eaff;

font-family:
'Orbitron',
sans-serif;

}



/* HEADER */


.header{

padding:40px;

text-align:center;

background:
rgba(0,0,0,.55);

border-bottom:
1px solid #555;

}



.logo{

font-size:45px;

font-weight:900;

color:white;


text-shadow:

0 0 10px #8a2be2,
0 0 40px #8a2be2;

}



.subtitle{

margin-top:15px;

color:#9aa;

}





/* CONTROLS */


.controls{

position:fixed;

top:0;

left:0;

right:0;

z-index:9999;

background:

rgba(5,6,11,.95);

padding:15px;

display:flex;

justify-content:center;

gap:10px;

flex-wrap:wrap;

box-shadow:

0 5px 20px black;

}



button{

background:#651fff;

border:none;

padding:12px 20px;

border-radius:10px;

color:white;

cursor:pointer;

font-family:inherit;

}



button:hover{

background:#a855ff;

}



input{

width:150px;

}





#debug{


position:fixed;

top:80px;

left:20px;

right:20px;

z-index:9998;

background:#02050a;

padding:10px;

border-radius:10px;

text-align:center;

color:#7cff7c;

font-size:13px;

}





/* ARCHIVE */


.archive{

max-width:1400px;

margin:auto;

padding:40px;

}



.grid{

display:grid;

grid-template-columns:

repeat(
auto-fit,
minmax(300px,1fr)
);

gap:25px;

}




/* CARD */


.card{


background:

linear-gradient(
145deg,
rgba(255,255,255,.12),
rgba(0,0,0,.85)
);


border:

1px solid #566;


border-radius:18px;


padding:25px;


position:relative;


overflow:hidden;


transition:.3s;


}



.card:hover{


transform:
translateY(-10px);


border-color:#b26cff;


box-shadow:

0 0 30px #7b2cff;


}




.card:before{


content:"";


position:absolute;


right:-50px;

top:-50px;


width:150px;

height:150px;


background:#8a2be2;


filter:blur(60px);


opacity:.5;


}




.chapter{


font-size:12px;

color:#8fff8f;


}



.title{


font-size:22px;

color:white;

margin:15px 0;


}



.description{


font-family:Arial;

font-size:14px;

line-height:1.6;

color:#bbb;


}




.tags{

margin-top:20px;

}



.tag{


display:inline-block;


background:#24153f;


border:

1px solid #814cff;


padding:

5px 12px;


border-radius:20px;


font-size:11px;


margin:3px;


}



.button{


margin-top:20px;


padding:12px;


text-align:center;


background:#651fff;


border-radius:10px;


cursor:pointer;


position:relative;


z-index:2;


}




.locked{

opacity:.45;

border-color:#555;

}



.active{

border-color:#00ffff;

}





/* STORY VIEWER */


.storybook{


max-width:900px;


margin:

40px auto;


background:

rgba(10,20,35,.95);


padding:35px;


border-radius:20px;


box-shadow:

0 0 40px black;


}



.storybook h1{


text-align:center;


color:#2793ff;


}



.chapter-view{


margin-bottom:60px;


border-bottom:

1px solid #27384d;


padding-bottom:40px;


}



.chapter-view h2{


color:#2793ff;


}



.speech-line{


font-family:Arial;


font-size:20px;


line-height:1.8;


padding:8px;


transition:.3s;


}



.speech-active{


background:

#2793ff33;


border-left:

4px solid #2793ff;


padding-left:15px;


}





.footer{


text-align:center;


padding:40px;


color:#777;


}



</style>

</head>



<body>



<div class="controls">


<button onclick="speakChapter()">

🔊 Read Episode

</button>


<button onclick="pauseStory()">

⏸ Pause

</button>


<button onclick="stopStory()">

⏹ Stop

</button>



<label>

Speed

<input 
id="speed"
type="range"
min=".5"
max="2"
step=".1"
value="1">

</label>


</div>



<div id="debug">

VOICE SYSTEM INITIALIZING...

</div>



<div class="header">


<div class="logo">

OBVYRIS ARCHIVE

</div>


<div class="subtitle">

MINISTRY OF ARCHIVISTS // UNIT 00-NULL MEMORY DATABASE

</div>


</div>




<div class="archive">


<div id="chapters"
class="grid">

Loading Archive...

</div>



</div>




<div id="viewer"
class="storybook"
style="display:none">


<h1 id="episodeTitle">

</h1>


<div id="episodeStory">

</div>


</div>



<div class="footer">


UNIT 00-NULL // MEMORY ARCHIVE ACCESS


</div>

<script>


// =====================================
// OBVYRIS API
// =====================================


const API_BASE =

"https://script.google.com/macros/s/AKfycbzVxbM_g8K6mzstGdFt2F0u7NctZ1Qpg8APXGdSSS-l50SqVO4u5QXwzFzKWxQbGMoaBg/exec";



const STORY_API =

API_BASE+"?action=story";



const VOICE_API =

API_BASE+"?action=voices";





let chapters=[];

let selectedChapter=null;

let voiceSettings={};

let browserVoices=[];





// =====================================
// LOAD CHAPTER DATABASE
// =====================================


async function loadChapters(){

try{


let r = await fetch(
API_BASE+"?action=stories"
);


let data = await r.json();


console.log("STORY DATABASE",data);



if(data.status==="success"){


chapters=data.stories || data.chapters;


renderChapters();


}


}

catch(e){

console.error(e);

}


}






// =====================================
// RENDER CHAPTER SELECT
// =====================================



function renderChapters(){

let html="";


chapters.forEach(ch=>{


html+=`

<div class="card active">


<div class="chapter">

CHAPTER ${ch.chapter || ""}

</div>


<div class="title">

${ch.title || "Unknown Memory"}

</div>


<div class="description">

${ch.description || 
"Memory reconstruction unavailable."}

</div>



<div class="tags">

<span class="tag">
${ch.genre || "SCI-FI"}
</span>


<span class="tag">

${ch.storyId}

</span>


</div>



<div class="button"
onclick="openChapter('${ch.storyId}')">

ACCESS MEMORY

</div>


</div>


`;


});


document
.getElementById("chapters")
.innerHTML=html;


}

function displayStory(text){


let lines=text.split("\n");


let html="";


speechLineID=0;


lines.forEach(line=>{


if(line.trim()==""){
html+="<br>";
return;
}



if(line.startsWith("[")){


html+=`

<h3>
${line}
</h3>

`;

return;

}



speechLineID++;


html+=`

<div class="speech-line"
id="line-${speechLineID}">

${line}

</div>

`;


});



document
.getElementById("story")
.innerHTML=html;


}
// =====================================
// OPEN EPISODE
// =====================================



async function openChapter(id){


document.getElementById("story").innerHTML=
"ACCESSING MEMORY "+id;



let r =
await fetch(
API_BASE+
"?action=story&id="+id
);



let data =
await r.json();



console.log(data);



if(data.status==="success"){


selectedChapter=data.story;



displayStory(
data.story.story
);


}


}

// =====================================
// FORMAT STORY FOR TTS
// =====================================



let speechCounter=0;



function formatStory(text){


if(!text)

return "No recovered memory data.";



let html="";



let lines =
text.split("\n");




speechCounter=0;



lines.forEach(line=>{


if(
line.trim()===""
)

{


html+="<br>";

return;


}






if(
line.startsWith("#")
){


html+=`

<h2>

${line.replace("#","")}

</h2>


`;

return;


}






if(
line.match(/\[(.*?)\]/)
){


html+=`

<h3>

${line}

</h3>


`;

return;


}






speechCounter++;



html+=`

<div 

class="speech-line"

id="speech-${speechCounter}"

>


${line}


</div>


`;



});



return html;


}








// =====================================
// LOAD VOICES DATABASE
// =====================================



async function loadVoiceSettings(){


try{


let response=

await fetch(VOICE_API);



let data=

await response.json();



console.log(
"VOICE DATABASE",
data
);



if(data.status==="success"){


voiceSettings=data.voices;


}



}


catch(e){


console.error(
"VOICE ERROR",
e
);


}



}







// =====================================
// BROWSER VOICES
// =====================================



function loadBrowserVoices(){


browserVoices =
speechSynthesis.getVoices();



}



loadBrowserVoices();



speechSynthesis.onvoiceschanged=function(){

loadBrowserVoices();

};







// =====================================
// INITIALIZE ARCHIVE
// =====================================



loadVoiceSettings();

loadChapters();






// =====================================
// SELECT CHARACTER VOICE
// =====================================


function selectVoice(character){


let settings =
voiceSettings[character];



console.log(
"VOICE REQUEST:",
character,
settings
);




if(!settings)

return browserVoices[0];





let wanted =
settings.voice;



if(wanted){


let found =
browserVoices.find(v=>

v.name
.toLowerCase()
.includes(
wanted.toLowerCase()
)

);



if(found)

return found;


}






// ROBOT


if(
settings.type==="Robot"
){


return browserVoices.find(v=>

v.name.includes("David") ||

v.name.includes("Microsoft")

)

||

browserVoices[0];


}






// FEMALE


if(
settings.type==="Female" ||
settings.type==="Female Narrator"
){


return browserVoices.find(v=>

v.name.includes("Zira") ||

v.name.includes("Samantha") ||

v.name.includes("Google UK English Female")

)

||

browserVoices[0];


}







// COMPUTER


if(
settings.type==="Computer"
){


return browserVoices.find(v=>

v.name.includes("Google") ||

v.name.includes("Microsoft")

)

||

browserVoices[0];


}






// DEEP VOICE


if(
settings.type==="Deep male"
){


return browserVoices.find(v=>

v.name.includes("Mark") ||

v.name.includes("David")

)

||

browserVoices[0];


}







return browserVoices[0];


}









// =====================================
// READ CHAPTER
// =====================================



function speakChapter(){


if(!selectedChapter){


alert(
"Select a chapter first."
);


return;


}



speechSynthesis.cancel();



let lines =

selectedChapter.story
.split("\n");



readLine(

lines,

0,

"Narrator"

);


}







// =====================================
// READ LINE ENGINE
// =====================================


function readLine(

lines,

index,

currentCharacter

){



if(
index>=lines.length
){



document
.getElementById("debug")
.innerHTML=

"READING COMPLETE // MEMORY ARCHIVED";


return;


}




let line =
lines[index].trim();





if(line===""){


readLine(

lines,

index+1,

currentCharacter

);


return;


}






// CHARACTER DETECTION


let character =

line.match(
/\[(.*?)\]/
);





if(character){


currentCharacter =
character[1];



readLine(

lines,

index+1,

currentCharacter

);


return;


}







let elements =

document.querySelectorAll(
".speech-line"
);




elements.forEach(e=>{


e.classList.remove(
"speech-active"
);


});





let active =

[...elements].find(e=>

e.innerText.trim()==line

);





if(active){


active.classList.add(
"speech-active"
);



active.scrollIntoView({

behavior:"smooth",

block:"center"

});


}






let voice =

selectVoice(
currentCharacter
);





let data =

voiceSettings[currentCharacter];






let options = {


pitch:
data?.settings?.pitch || 1,


rate:
data?.settings?.rate || 1,


volume:
data?.settings?.volume || 1


};






let utterance =

new SpeechSynthesisUtterance(
line
);





utterance.voice =
voice;



utterance.pitch =
options.pitch;



utterance.rate =

options.rate *

Number(

document
.getElementById("speed")
.value

);



utterance.volume =
options.volume;







document
.getElementById("debug")
.innerHTML=

`

SPEAKING:

${currentCharacter}

<br>

VOICE:

${voice?.name || "Default"}

`;






console.log(

"TTS",

{

character:
currentCharacter,

voice:
voice?.name,

line

}

);







utterance.onend=function(){


readLine(

lines,

index+1,

currentCharacter

);


};






utterance.onerror=function(e){


console.error(
"TTS ERROR",
e
);



readLine(

lines,

index+1,

currentCharacter

);


};






speechSynthesis.speak(
utterance
);



}










// =====================================
// PLAYER CONTROLS
// =====================================



function pauseStory(){


if(
speechSynthesis.paused
){


speechSynthesis.resume();



document
.getElementById("debug")
.innerHTML=

"RESUMED";


}

else{


speechSynthesis.pause();



document
.getElementById("debug")
.innerHTML=

"PAUSED";


}


}







function stopStory(){


speechSynthesis.cancel();



document
.querySelectorAll(
".speech-active"
)

.forEach(e=>

e.classList.remove(
"speech-active"
)

);



document
.getElementById("debug")
.innerHTML=

"STOPPED";


}






</script>


</body>


</html>
