<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Obvyris Archive // Chapter Database
</title>


<style>


@import url(
'https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap'
);



*{
box-sizing:border-box;
}



body{

margin:0;

background:
radial-gradient(
circle at top,
#38215f,
#05060b 65%
);

color:#d9eaff;

font-family:
'Orbitron',
sans-serif;

}



/* HEADER */


.header{

padding:40px;

text-align:center;

background:
rgba(0,0,0,.55);

border-bottom:
1px solid #555;

}



.logo{

font-size:45px;

font-weight:900;

color:white;


text-shadow:

0 0 10px #8a2be2,
0 0 40px #8a2be2;

}



.subtitle{

margin-top:15px;

color:#9aa;

}





/* CONTROLS */


.controls{

position:fixed;

top:0;

left:0;

right:0;

z-index:9999;

background:

rgba(5,6,11,.95);

padding:15px;

display:flex;

justify-content:center;

gap:10px;

flex-wrap:wrap;

box-shadow:

0 5px 20px black;

}



button{

background:#651fff;

border:none;

padding:12px 20px;

border-radius:10px;

color:white;

cursor:pointer;

font-family:inherit;

}



button:hover{

background:#a855ff;

}



input{

width:150px;

}





#debug{


position:fixed;

top:80px;

left:20px;

right:20px;

z-index:9998;

background:#02050a;

padding:10px;

border-radius:10px;

text-align:center;

color:#7cff7c;

font-size:13px;

}





/* ARCHIVE */


.archive{

max-width:1400px;

margin:auto;

padding:40px;

}



.grid{

display:grid;

grid-template-columns:

repeat(
auto-fit,
minmax(300px,1fr)
);

gap:25px;

}




/* CARD */


.card{


background:

linear-gradient(
145deg,
rgba(255,255,255,.12),
rgba(0,0,0,.85)
);


border:

1px solid #566;


border-radius:18px;


padding:25px;


position:relative;


overflow:hidden;


transition:.3s;


}



.card:hover{


transform:
translateY(-10px);


border-color:#b26cff;


box-shadow:

0 0 30px #7b2cff;


}




.card:before{


content:"";


position:absolute;


right:-50px;

top:-50px;


width:150px;

height:150px;


background:#8a2be2;


filter:blur(60px);


opacity:.5;


}




.chapter{


font-size:12px;

color:#8fff8f;


}



.title{


font-size:22px;

color:white;

margin:15px 0;


}



.description{


font-family:Arial;

font-size:14px;

line-height:1.6;

color:#bbb;


}




.tags{

margin-top:20px;

}



.tag{


display:inline-block;


background:#24153f;


border:

1px solid #814cff;


padding:

5px 12px;


border-radius:20px;


font-size:11px;


margin:3px;


}



.button{


margin-top:20px;


padding:12px;


text-align:center;


background:#651fff;


border-radius:10px;


cursor:pointer;


position:relative;


z-index:2;


}




.locked{

opacity:.45;

border-color:#555;

}



.active{

border-color:#00ffff;

}





/* STORY VIEWER */


.storybook{


max-width:900px;


margin:

40px auto;


background:

rgba(10,20,35,.95);


padding:35px;


border-radius:20px;


box-shadow:

0 0 40px black;


}



.storybook h1{


text-align:center;


color:#2793ff;


}



.chapter-view{


margin-bottom:60px;


border-bottom:

1px solid #27384d;


padding-bottom:40px;


}



.chapter-view h2{


color:#2793ff;


}



.speech-line{


font-family:Arial;


font-size:20px;


line-height:1.8;


padding:8px;


transition:.3s;


}



.speech-active{


background:

#2793ff33;


border-left:

4px solid #2793ff;


padding-left:15px;


}





.footer{


text-align:center;


padding:40px;


color:#777;


}

.book-folder{

grid-column:1/-1;

background:

rgba(0,0,0,.35);

border:

1px solid #814cff;

border-radius:20px;

padding:25px;

margin-bottom:40px;

box-shadow:

0 0 25px #401080;

}



.book-title{

font-size:32px;

color:#fff;

margin-bottom:25px;

text-shadow:

0 0 15px #8a2be2;

}



.book-grid{

display:grid;

grid-template-columns:

repeat(
auto-fit,
minmax(300px,1fr)
);

gap:25px;

}

.book-folder{

grid-column:1/-1;

background:
rgba(0,0,0,.45);

border:
1px solid #814cff;

border-radius:20px;

padding:20px;

margin-bottom:30px;

}



.book-header{

display:flex;

justify-content:space-between;

align-items:center;

cursor:pointer;

padding:15px;

background:#160d2b;

border-radius:15px;

}



.book-title{

font-size:28px;

color:white;

text-shadow:
0 0 15px #8a2be2;

}



.book-actions button{

margin-left:10px;

}



.book-grid{

display:none;

margin-top:25px;

}



.book-grid.open{

display:grid;

}



.chapter-button{

margin-top:20px;

padding:12px;

background:#651fff;

border-radius:10px;

cursor:pointer;

text-align:center;

}
</style>

</head>



<body>



<div class="controls">


<button onclick="speakChapter()">

🔊 Read Episode

</button>


<button onclick="pauseStory()">

⏸ Pause

</button>


<button onclick="stopStory()">

⏹ Stop

</button>



<label>

Speed

<input 
id="speed"
type="range"
min=".5"
max="2"
step=".1"
value="1">

</label>


</div>



<div id="debug">

VOICE SYSTEM INITIALIZING...

</div>



<div class="header">


<div class="logo">

OBVYRIS ARCHIVE

</div>


<div class="subtitle">

MINISTRY OF ARCHIVISTS // UNIT 00-NULL MEMORY DATABASE

</div>


</div>




<div class="archive">


<div id="chapters"
class="grid">

Loading Archive...

</div>



</div>




<div id="viewer"
class="storybook"
style="display:none">


<h1 id="episodeTitle">

</h1>


<div id="episodeStory">

</div>


</div>



<div class="footer">


UNIT 00-NULL // MEMORY ARCHIVE ACCESS


</div>

<script>

// =====================================
// OBVYRIS API
// =====================================

const API_BASE =
"https://script.google.com/macros/s/AKfycbwR9_-IIcd6yiJuQsrF9uDexBLTbYLw6sw2NlnFEGIlj83a6mY-K3x_F1czdIw3SEjX/exec";


const STORY_LIST_API =
API_BASE+"?action=stories";


const VOICE_API =
API_BASE+"?action=voices";



// =====================================
// VARIABLES
// =====================================

let chapters=[];

let selectedChapter=null;

let voiceSettings={};

let browserVoices=[];

let speechCounter=0;
let playingBook=false;

let bookQueue=[];

let bookIndex=0;


// =====================================
// LOAD CHAPTERS
// =====================================


async function loadChapters(){

try{


let r = await fetch(
STORY_LIST_API
);


let data = await r.json();


console.log(
"ARCHIVE DATABASE",
data
);



if(data.status==="success"){


chapters=data.stories;


renderChapters();



document.getElementById("debug").innerHTML =
"ARCHIVE ONLINE // "
+
chapters.length
+
" CHAPTERS LOADED";


}



}

catch(e){


console.error(
"ARCHIVE ERROR",
e
);


document.getElementById("debug").innerHTML =
"ARCHIVE CONNECTION FAILED";


}


}




// =====================================
// RENDER CHAPTER CARDS
// =====================================


function renderChapters(){

let books={};


chapters.forEach(ch=>{

let book =
ch.storyId.split("-")[0];


if(!books[book]){
books[book]=[];
}


books[book].push(ch);


});



let html="";


Object.keys(books).forEach(book=>{


html+=`

<div class="book-folder">


<div class="book-header">


<div class="book-title"
onclick="toggleBook('${book}')">

📚 ${book} BOOK

</div>


<div class="book-actions">


<button onclick="playBook('${book}')">

▶ PLAY BOOK

</button>


</div>


</div>



<div 
id="book-${book}"
class="book-grid">

`;



books[book].forEach(ch=>{


html+=`

<div class="card active">


<div class="chapter">

${book} // CHAPTER ${ch.chapter}

</div>


<div class="title">

${ch.title}

</div>



<div class="description">

STATUS:
${ch.status}

</div>



<div class="tags">

<span class="tag">

${ch.storyId}

</span>

</div>



<div class="chapter-button"

onclick="openChapter('${ch.storyId}')">

📖 OPEN CHAPTER

</div>


</div>


`;


});



html+=`

</div>

</div>

`;


});



document
.getElementById("chapters")
.innerHTML=html;


}


function toggleBook(book){

let element =
document.getElementById(
"book-"+book
);


element.classList.toggle(
"open"
);


}




let bookQueue=[];
let currentBookIndex=0;



function playBook(book){


bookQueue =
chapters.filter(ch=>

ch.storyId.startsWith(book+"-")

);


bookIndex=0;

playingBook=true;


playNextBookChapter();


}



async function playNextBookChapter(){


if(bookIndex >= bookQueue.length){


playingBook=false;


document.getElementById("debug").innerHTML =
"BOOK COMPLETE";


return;


}



let chapter =
bookQueue[bookIndex];


document.getElementById("debug").innerHTML =
"LOADING "+chapter.storyId;



await openChapter(chapter.storyId);



setTimeout(()=>{


speakChapter();


},500);



bookIndex++;


}

  
// =====================================
// OPEN CHAPTER
// =====================================


async function openChapter(id){


try{


document.getElementById("debug").innerHTML =
"READING COMPLETE // MEMORY ARCHIVED";


if(bookQueue.length){

setTimeout(()=>{

playNextBookChapter();

},1500);

}



let r = await fetch(

API_BASE+
"?action=story&id="+id

);



let data = await r.json();



console.log(
"MEMORY DATA",
data
);



if(data.status==="success"){


selectedChapter=data.story;



document
.getElementById("viewer")
.style.display="block";



document
.getElementById("episodeTitle")
.innerHTML =
"📖 "+
data.story.title;



document
.getElementById("episodeStory")
.innerHTML =
formatStory(
data.story.story
);



document.getElementById("debug").innerHTML =
"MEMORY LOADED // "+
data.story.storyId;



window.scrollTo({

top:
document.getElementById("viewer").offsetTop,

behavior:"smooth"

});



return true;

}

else{


document.getElementById("debug").innerHTML =
"MEMORY NOT FOUND";


}



}

catch(e){


console.error(
"OPEN ERROR",
e
);


document.getElementById("debug").innerHTML =
"MEMORY ACCESS ERROR";

return false;
}


}






// =====================================
// FORMAT STORY
// =====================================


function formatStory(text){


let html="";


speechCounter=0;



text.split("\n")
.forEach(line=>{


if(line.trim()===""){


html+="<br>";

return;


}



if(line.match(/\[(.*?)\]/)){


html+=`

<h3>

${line}

</h3>

`;


return;


}



speechCounter++;


html+=`

<div class="speech-line"
id="speech-${speechCounter}">

${line}

</div>

`;


});



return html;


}






// =====================================
// LOAD VOICES
// =====================================


async function loadVoiceSettings(){


try{


let r =
await fetch(VOICE_API);


let data =
await r.json();



console.log(
"VOICE DATABASE",
data
);



if(data.status==="success"){


voiceSettings=data.voices;


}


}

catch(e){


console.error(
"VOICE ERROR",
e
);


}


}






// =====================================
// BROWSER VOICES
// =====================================


function loadBrowserVoices(){


browserVoices =
speechSynthesis.getVoices();


}


loadBrowserVoices();



speechSynthesis.onvoiceschanged=function(){

loadBrowserVoices();

};








// =====================================
// VOICE SELECT
// =====================================


function selectVoice(character){


let settings =
voiceSettings[character];



console.log(
"VOICE REQUEST",
character,
settings
);



if(!settings)
return browserVoices[0];



if(settings.voice){


let found =
browserVoices.find(v=>

v.name
.toLowerCase()
.includes(
settings.voice.toLowerCase()
)

);



if(found)
return found;


}



return browserVoices[0];


}






// =====================================
// READ CHAPTER
// =====================================


function speakChapter(){


console.log(
"CURRENT CHAPTER",
selectedChapter
);



if(!selectedChapter){


alert(
"Select a chapter first."
);


return;


}



speechSynthesis.cancel();



let lines =
selectedChapter.story.split("\n");



readLine(
lines,
0,
"Narrator"
);



}







// =====================================
// TTS ENGINE
// =====================================


function readLine(
lines,
index,
character
){


if(index>=lines.length){


document.getElementById("debug").innerHTML =
"READING COMPLETE // MEMORY ARCHIVED";


return;


}



let line =
lines[index].trim();



if(line===""){


readLine(
lines,
index+1,
character
);


return;


}



let tag =
line.match(/\[(.*?)\]/);



if(tag){


character =
tag[1];


readLine(
lines,
index+1,
character
);


return;


}




document
.querySelectorAll(".speech-active")
.forEach(e=>{

e.classList.remove(
"speech-active"
);

});



let active =
[...document.querySelectorAll(".speech-line")]
.find(e=>

e.innerText.trim()==line

);



if(active){


active.classList.add(
"speech-active"
);


active.scrollIntoView({

behavior:"smooth",

block:"center"

});


}




let settings =
voiceSettings[character];



let utterance =
new SpeechSynthesisUtterance(line);



utterance.voice =
selectVoice(character);



utterance.pitch =
settings?.settings?.pitch || 1;



utterance.rate =
(settings?.settings?.rate || 1)
*
Number(
document.getElementById("speed").value
);



utterance.volume =
settings?.settings?.volume || 1;




document.getElementById("debug").innerHTML=

`

SPEAKING:
${character}

<br>

VOICE:
${utterance.voice?.name || "Default"}

`;




utterance.onend=function(){


if(index + 1 >= lines.length){


if(playingBook){


setTimeout(()=>{

playNextBookChapter();

},1500);


return;


}


}



readLine(
lines,
index+1,
character
);


};



utterance.onerror=function(){


readLine(
lines,
index+1,
character
);


};



speechSynthesis.speak(
utterance
);



}






// =====================================
// CONTROLS
// =====================================


function pauseStory(){


if(speechSynthesis.paused){


speechSynthesis.resume();


document.getElementById("debug").innerHTML =
"RESUMED";


}

else{


speechSynthesis.pause();


document.getElementById("debug").innerHTML =
"PAUSED";


}


}




function stopStory(){


speechSynthesis.cancel();


document
.querySelectorAll(".speech-active")
.forEach(e=>{

e.classList.remove(
"speech-active"
);

});



document.getElementById("debug").innerHTML =
"STOPPED";


}






// =====================================
// START
// =====================================


loadVoiceSettings();

loadChapters();


</script>


</body>


</html>
