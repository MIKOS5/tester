body{

margin:0;

padding-top:150px;

background:
radial-gradient(circle at top,#38215f,#05060b 65%);

color:#d9eaff;

font-family:'Orbitron',sans-serif;

}

/* READING MODES */

body.story-mode #debug{
    display:none;
}


body.story-mode .storybook{
    display:block !important;
}


body.debug-mode .storybook{
    display:none !important;
}


/* EXPANDED TOP READER */

body.debug-mode #debug{

min-height:120px;

display:flex;

flex-direction:column;

justify-content:center;

}

    
/* ARCHIVE */


.archive{

max-width:1400px;

margin:auto;

padding:40px;

}



.grid{

display:grid;

grid-template-columns:

repeat(
auto-fit,
minmax(300px,1fr)
);

gap:25px;

}




/* CARD */


.card{


background:

linear-gradient(
145deg,
rgba(255,255,255,.12),
rgba(0,0,0,.85)
);


border:

1px solid #566;


border-radius:18px;


padding:25px;


position:relative;


overflow:hidden;


transition:.3s;


}



.card:hover{


transform:
translateY(-10px);


border-color:#b26cff;


box-shadow:

0 0 30px #7b2cff;


}




.card:before{


content:"";


position:absolute;


right:-50px;

top:-50px;


width:150px;

height:150px;


background:#8a2be2;


filter:blur(60px);


opacity:.5;


}




.chapter{


font-size:12px;

color:#8fff8f;


}



.title{


font-size:22px;

color:white;

margin:15px 0;


}



.description{


font-family:Arial;

font-size:14px;

line-height:1.6;

color:#bbb;


}




.tags{

margin-top:20px;

}



.tag{


display:inline-block;


background:#24153f;


border:

1px solid #814cff;


padding:

5px 12px;


border-radius:20px;


font-size:11px;


margin:3px;


}



.button{


margin-top:20px;


padding:12px;


text-align:center;


background:#651fff;


border-radius:10px;


cursor:pointer;


position:relative;


z-index:2;


}




.locked{

opacity:.45;

border-color:#555;

}



.active{

border-color:#00ffff;

}





/* STORY VIEWER */


.storybook{

max-width:1000px;

margin:50px auto;

padding:45px;

background:

linear-gradient(
180deg,
rgba(20,20,35,.96),
rgba(8,8,15,.98)
);

border-radius:24px;

border:1px solid #555;

box-shadow:

0 0 40px black,

0 0 30px #32105f;

}



.storybook h1{


text-align:center;


color:#2793ff;


}



.chapter-view{


margin-bottom:60px;


border-bottom:

1px solid #27384d;


padding-bottom:40px;


}



.chapter-view h2{


color:#2793ff;


}



.speech-line{

margin:14px 0;

padding:18px 22px;

border-radius:14px;

background:rgba(255,255,255,.05);

border-left:4px solid #555;

font-family:Arial,sans-serif;

font-size:22px;

line-height:1.8;

color:#eee;

transition:.3s;

}



.speech-active{

background:rgba(39,147,255,.18);

border-left:6px solid #27b7ff;

box-shadow:

0 0 18px rgba(39,147,255,.45);

transform:scale(1.02);

}





.footer{


text-align:center;


padding:40px;


color:#777;


}

.book-folder{

grid-column:1/-1;

background:

rgba(0,0,0,.35);

border:

1px solid #814cff;

border-radius:20px;

padding:25px;

margin-bottom:40px;

box-shadow:

0 0 25px #401080;

}



.book-title{

font-size:32px;

color:#fff;

margin-bottom:25px;

text-shadow:

0 0 15px #8a2be2;

}



.book-grid{

display:grid;

grid-template-columns:

repeat(
auto-fit,
minmax(300px,1fr)
);

gap:25px;

}

.book-folder{

grid-column:1/-1;

background:
rgba(0,0,0,.45);

border:
1px solid #814cff;

border-radius:20px;

padding:20px;

margin-bottom:30px;

}



.book-header{

display:flex;

justify-content:space-between;

align-items:center;

cursor:pointer;

padding:15px;

background:#160d2b;

border-radius:15px;

}



.book-title{

font-size:28px;

color:white;

text-shadow:
0 0 15px #8a2be2;

}



.book-actions button{

margin-left:10px;

}



.book-grid{

display:none;

margin-top:25px;

}



.book-grid.open{

display:grid;

}



.chapter-button{

margin-top:20px;

padding:12px;

background:#651fff;

border-radius:10px;

cursor:pointer;

}


/* HIDE TOP PLAYER BAR */
body.story-mode .controls{
    display:none;
}


body.debug-mode .controls{
    display:flex;
}

/* BACK TO TOP FLOAT BUTTON */

#topButton{

position:fixed;

right:25px;

bottom:25px;

z-index:9999;

width:55px;

height:55px;

border-radius:50%;

background:#651fff;

color:white;

font-size:24px;

font-weight:bold;

display:none;

align-items:center;

justify-content:center;

cursor:pointer;

box-shadow:

0 0 20px #8a2be2;

border:1px solid #b26cff;

transition:.3s;

}


#topButton:hover{

background:#a855ff;

transform:translateY(-5px);

box-shadow:

0 0 35px #b26cff;

}


.character-name{

margin-top:30px;

margin-bottom:8px;

padding:10px 18px;

display:inline-block;

background:#651fff;

border-radius:30px;

font-size:18px;

font-weight:bold;

color:white;

box-shadow:0 0 15px #651fff;

}

#storyProgress{

height:8px;

background:#222;

border-radius:20px;

margin:20px 0 35px;

overflow:hidden;

}

#storyProgressBar{

width:0%;

height:100%;

background:#27b7ff;

transition:.3s;

}
    
#debug button{
float:right;
margin-left:20px;
}

    
</style>

</head>

<body>

<div class="header">


<div class="logo">

OBVYRIS ARCHIVE

</div>


<div class="subtitle">

MINISTRY OF ARCHIVISTS // UNIT 00-NULL MEMORY DATABASE

</div>


</div>




<div class="archive">


<div id="chapters"
class="grid">

Loading Archive...

</div>



</div>




<div id="viewer"
class="storybook"
style="display:none">


<h1 id="episodeTitle">

</h1>

<div id="storyProgress">

<div id="storyProgressBar"></div>

</div>
<div id="episodeStory">

</div>


</div>



<div class="footer">


UNIT 00-NULL // MEMORY ARCHIVE ACCESS


</div>
<button onclick="toggleReadingMode()">
Toggle View
</button>
    
<button id="topButton" onclick="scrollTopArchive()">
⬆
</button>
    
<div id="debug">

VOICE SYSTEM INITIALIZING...

</div>


    
<script>

// =====================================
// OBVYRIS API
// =====================================

const API_BASE =
"https://script.google.com/macros/s/AKfycbwR9_-IIcd6yiJuQsrF9uDexBLTbYLw6sw2NlnFEGIlj83a6mY-K3x_F1czdIw3SEjX/exec";


const STORY_LIST_API =
API_BASE+"?action=stories";


const VOICE_API =
API_BASE+"?action=voices";



// =====================================
// VARIABLES
// =====================================

let chapters=[];

let selectedChapter=null;

let voiceSettings={};

let browserVoices=[];

let speechCounter=0;
let playingBook=false;

let bookQueue=[];

let bookIndex=0;
let readingMode = "debug";

document.body.classList.add("debug-mode");

// =====================================
// LOAD CHAPTERS
// =====================================


async function loadChapters(){

try{


let r = await fetch(
STORY_LIST_API
);


let data = await r.json();


console.log(
"ARCHIVE DATABASE",
data
);



if(data.status==="success"){


chapters=data.stories;


renderChapters();



document.getElementById("debug").innerHTML =
"ARCHIVE ONLINE // "
+
chapters.length
+
" CHAPTERS LOADED";


}



}

catch(e){


console.error(
"ARCHIVE ERROR",
e
);


document.getElementById("debug").innerHTML =
"ARCHIVE CONNECTION FAILED";


}


}




// =====================================
// RENDER CHAPTER CARDS
// =====================================


function renderChapters(){

let books={};


chapters.forEach(ch=>{

let book =
ch.storyId.split("-")[0];


if(!books[book]){
books[book]=[];
}


books[book].push(ch);


});



let html="";


Object.keys(books).forEach(book=>{


html+=`

<div class="book-folder">


<div class="book-header">


<div class="book-title"
onclick="toggleBook('${book}')">

📚 ${book} BOOK

</div>


<div class="book-actions">


<button onclick="playBook('${book}')">

▶ PLAY BOOK

</button>


</div>


</div>



<div 
id="book-${book}"
class="book-grid">

`;



books[book].forEach(ch=>{


html+=`

<div class="card active">


<div class="chapter">

${book} // CHAPTER ${ch.chapter}

</div>


<div class="title">

${ch.title}

</div>



<div class="description">

STATUS:
${ch.status}

</div>



<div class="tags">

<span class="tag">

${ch.storyId}

</span>

</div>



<div class="chapter-button"

onclick="playChapter('${ch.storyId}')">

▶ PLAY CHAPTER

</div>


</div>


`;


});



html+=`

</div>

</div>

`;


});



document
.getElementById("chapters")
.innerHTML=html;


}


function toggleBook(book){

let element =
document.getElementById(
"book-"+book
);


element.classList.toggle(
"open"
);


}


function playBook(book){


bookQueue =
chapters.filter(ch =>

ch.storyId.startsWith(book+"-")

);



bookIndex=0;

playingBook=true;



document.getElementById("debug").innerHTML =
"STARTING "+book+" BOOK";



playNextBookChapter();


}




async function playNextBookChapter(){


if(bookIndex >= bookQueue.length){


playingBook=false;


document.getElementById("debug").innerHTML =
"BOOK COMPLETE";


return;


}



let chapter =
bookQueue[bookIndex];



document.getElementById("debug").innerHTML =
"LOADING "+chapter.storyId;



let loaded =
await openChapter(chapter.storyId);



if(loaded){


bookIndex++;



setTimeout(()=>{


speakChapter();


},1000);



}


}

async function playChapter(id){


playingBook=false;


document.getElementById("debug").innerHTML =
"LOADING CHAPTER "+id;



let loaded =
await openChapter(id);



if(loaded){


setTimeout(()=>{


speakChapter();


},1000);



}


}

    
// =====================================
// OPEN CHAPTER
// =====================================


async function openChapter(id){


try{


document.getElementById("debug").innerHTML =
"ACCESSING MEMORY "+id;



let r = await fetch(

API_BASE+
"?action=story&id="+id

);



let data = await r.json();



console.log(
"MEMORY DATA",
data
);



if(data.status==="success"){


selectedChapter=data.story;



if(readingMode==="story"){

document
.getElementById("viewer")
.style.display="block";

}
else{

document
.getElementById("viewer")
.style.display="none";

}



document
.getElementById("episodeTitle")
.innerHTML =
"📖 "+
data.story.title;



document
.getElementById("episodeStory")
.innerHTML =
formatStory(
data.story.story
);



document.getElementById("debug").innerHTML =

`
<div class="episode">
📖 ${data.story.title}
</div>

<div class="speaker">
🎙 Ready
</div>

<div class="line">
Memory loaded // ${data.story.storyId}
</div>
`;



window.scrollTo({

top:
document.getElementById("viewer").offsetTop,

behavior:"smooth"

});



return true;


}


else{


document.getElementById("debug").innerHTML =
"MEMORY NOT FOUND";


return false;


}



}


catch(e){


console.error(
"OPEN ERROR",
e
);



document.getElementById("debug").innerHTML =
"MEMORY ACCESS ERROR";



return false;


}


}



function toggleReadingMode(){


if(readingMode==="debug"){


readingMode="story";


document.body.classList.remove(
"debug-mode"
);


document.body.classList.add(
"story-mode"
);



document
.querySelectorAll(".speech-active")
.forEach(e=>{

e.classList.remove(
"speech-active"
);

});



document.getElementById("debug").innerHTML="";


}


else{


readingMode="debug";


document.body.classList.remove(
"story-mode"
);


document.body.classList.add(
"debug-mode"
);



document.getElementById("debug").innerHTML =

`
<div class="episode">
📖 TOPBAR MODE
</div>

<div class="speaker">
🎙 Voice Tracking Active
</div>

<div class="line">
Storyboard disabled
</div>
`;

}


}
    
// =====================================
// FORMAT STORY
// =====================================


function formatStory(text){


let html="";


speechCounter=0;



text.split("\n")
.forEach(line=>{


if(line.trim()===""){


html += "<div style='height:20px'></div>";

return;


}



if(line.match(/\[(.*?)\]/)){


html += `
<div class="character-name">
${line}
</div>
`;


return;


}



if(readingMode==="debug"){
    return;
}


speechCounter++;


html+=`

<div class="speech-line"
id="speech-${speechCounter}">

${line}

</div>

`;


});



return html;


}






// =====================================
// LOAD VOICES
// =====================================


async function loadVoiceSettings(){


try{


let r =
await fetch(VOICE_API);


let data =
await r.json();



console.log(
"VOICE DATABASE",
data
);



if(data.status==="success"){


voiceSettings=data.voices;


}


}

catch(e){


console.error(
"VOICE ERROR",
e
);


}


}






// =====================================
// BROWSER VOICES
// =====================================


function loadBrowserVoices(){


browserVoices =
speechSynthesis.getVoices();


}


loadBrowserVoices();



speechSynthesis.onvoiceschanged=function(){

loadBrowserVoices();

};








// =====================================
// VOICE SELECT
// =====================================


function selectVoice(character){


let settings =
voiceSettings[character];



console.log(
"VOICE REQUEST",
character,
settings
);



if(!settings)
return browserVoices[0];



if(settings.voice){


let found =
browserVoices.find(v=>

v.name
.toLowerCase()
.includes(
settings.voice.toLowerCase()
)

);



if(found)
return found;


}



return browserVoices[0];


}






// =====================================
// READ CHAPTER
// =====================================


function speakChapter(){


console.log(
"CURRENT CHAPTER",
selectedChapter
);



if(!selectedChapter){


alert(
"Select a chapter first."
);


return;


}



speechSynthesis.cancel();



let lines =
selectedChapter.story.split("\n");



readLine(
lines,
0,
"Narrator"
);



}







// =====================================
// TTS ENGINE
// =====================================


function readLine(
lines,
index,
character
){


if(index>=lines.length){


document.getElementById("debug").innerHTML =

`
<div class="episode">
📖 ${selectedChapter.title}
</div>

<div class="speaker">
🎙 Archive System
</div>

<div class="line">
Reading complete // Memory archived
</div>
`;



if(playingBook){


setTimeout(()=>{


playNextBookChapter();


},1500);



}



return;


}



let line =
lines[index].trim();



if(line===""){


readLine(
lines,
index+1,
character
);


return;


}



let tag =
line.match(/\[(.*?)\]/);



if(tag){


character =
tag[1];


readLine(
lines,
index+1,
character
);


return;


}




document
.querySelectorAll(".speech-active")
.forEach(e=>{

e.classList.remove(
"speech-active"
);

});



let active =
[...document.querySelectorAll(".speech-line")]
.find(e=>

e.innerText.trim()==line

);



if(active && readingMode==="story"){

active.classList.add(
"speech-active"
);

active.scrollIntoView({

behavior:"smooth",

block:"center"

});

}

// Update chapter progress bar
let percent =
(index / (lines.length - 1)) * 100;

document.getElementById(
"storyProgressBar"
).style.width =
percent + "%";




let settings =
voiceSettings[character];



let utterance =
new SpeechSynthesisUtterance(line);



utterance.voice =
selectVoice(character);



utterance.pitch =
settings?.settings?.pitch || 1;



utterance.rate =
(settings?.settings?.rate || 1)
*
Number(
document.getElementById("speed").value
);



utterance.volume =
settings?.settings?.volume || 1;




if(readingMode==="debug"){


document.getElementById("debug").innerHTML =

`
<div class="episode">
📖 ${selectedChapter.title}
</div>

<div class="speaker">
🎙 ${character}
</div>

<div class="line">
${line}
</div>
`;


}




utterance.onend=function(){


if(index + 1 >= lines.length){


if(playingBook){


setTimeout(()=>{

playNextBookChapter();

},1500);


return;


}


}



readLine(
lines,
index+1,
character
);


};



utterance.onerror=function(){


readLine(
lines,
index+1,
character
);


};



speechSynthesis.speak(
utterance
);



}






// =====================================
// CONTROLS
// =====================================


function pauseStory(){


if(speechSynthesis.paused){


speechSynthesis.resume();


document.getElementById("debug").innerHTML =
"RESUMED";


}

else{


speechSynthesis.pause();


document.getElementById("debug").innerHTML =
"PAUSED";


}


}


// =====================================
// BACK TO TOP BUTTON
// =====================================

const topButton =
document.getElementById("topButton");


window.addEventListener("scroll",()=>{


if(window.scrollY > 500){

topButton.style.display="flex";

}
else{

topButton.style.display="none";

}


});


function scrollTopArchive(){

window.scrollTo({

top:0,

behavior:"smooth"

});

}

function stopStory(){


speechSynthesis.cancel();


document
.querySelectorAll(".speech-active")
.forEach(e=>{

e.classList.remove(
"speech-active"
);

});



document.getElementById("debug").innerHTML =
"STOPPED";


}


// =====================================
// SPACE BAR TTS PAUSE / RESUME
// =====================================

document.addEventListener("keydown", function(e){


    // Ignore if typing in an input
    if(
        e.target.tagName === "INPUT" ||
        e.target.tagName === "TEXTAREA"
    ){
        return;
    }


    if(e.code === "Space"){

        e.preventDefault();


        if(speechSynthesis.speaking){

            if(speechSynthesis.paused){

                speechSynthesis.resume();

                document.getElementById("debug").innerHTML =
                "RESUMED";


            }else{

                speechSynthesis.pause();

                document.getElementById("debug").innerHTML =
                "PAUSED";

            }

        }

    }


});



// =====================================
// START
// =====================================


loadVoiceSettings();

loadChapters();


</script>


</body>


</html>
