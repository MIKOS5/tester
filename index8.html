<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"

>

<title>Obvyris Server Map</title>

<style>

:root{

  --bg:#03070d;
  --panel:#08121d;
  --panel2:#0d1a27;
  --line:#29445c;

  --text:#edf6ff;
  --muted:#71879b;

  --green:#22c55e;
  --orange:#f59e0b;
  --blue:#2793ff;
  --purple:#a78bfa;
  --cyan:#22d3ee;
  --pink:#f472b6;
  --red:#ef4444;

}

*{
  box-sizing:border-box;
}

html,
body{

  width:100%;
  height:100%;

  margin:0;
  padding:0;

  overflow:hidden;

  background:var(--bg);

  color:var(--text);

  font-family:
    Arial,
    Helvetica,
    sans-serif;

}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{

  position:fixed;

  top:0;
  left:0;
  right:0;

  height:58px;

  z-index:1000;

  display:flex;

  align-items:center;

  justify-content:space-between;

  padding:0 14px;

  gap:10px;

  background:
    rgba(3,8,14,.97);

  border-bottom:
    1px solid #1d3347;

  backdrop-filter:
    blur(10px);

}


.brand{

  display:flex;

  align-items:center;

  gap:8px;

  min-width:0;

}


.brand-icon{

  font-size:20px;

}


.brand-name{

  font-size:14px;

  font-weight:900;

  white-space:nowrap;

  letter-spacing:.5px;

}


.brand-sub{

  color:#637b90;

  font-size:8px;

  white-space:nowrap;

}


.controls{

  display:flex;

  align-items:center;

  gap:5px;

}


input{

  width:190px;

  height:30px;

  padding:0 10px;

  outline:none;

  border:
    1px solid #29445c;

  border-radius:6px;

  background:#07121d;

  color:white;

  font-size:10px;

}


button{

  height:30px;

  padding:0 10px;

  border:
    1px solid #29445c;

  border-radius:6px;

  background:#091827;

  color:#a9c8df;

  font-size:9px;

  font-weight:800;

  cursor:pointer;

}


button:hover{

  background:#11283b;

  border-color:#47769b;

}


/* =========================================================
   MAP
========================================================= */

#map{

  position:absolute;

  top:58px;
  left:0;
  right:0;
  bottom:0;

  overflow:hidden;

  cursor:grab;

  background:

    radial-gradient(
      circle at center,
      rgba(39,147,255,.08),
      transparent 42%
    );

}


#map.dragging{

  cursor:grabbing;

}


#world{

  position:absolute;

  width:7000px;
  height:7000px;

  left:0;
  top:0;

  transform-origin:
    3500px 3500px;

}


/* =========================================================
   GRID
========================================================= */

#grid{

  position:absolute;

  left:0;
  top:0;

  width:7000px;
  height:7000px;

  opacity:.15;

  background-image:

    linear-gradient(
      #17334b 1px,
      transparent 1px
    ),

    linear-gradient(
      90deg,
      #17334b 1px,
      transparent 1px
    );

  background-size:
    50px 50px;

}


/* =========================================================
   SVG CONNECTIONS
========================================================= */

#connections{

  position:absolute;

  left:0;
  top:0;

  width:7000px;
  height:7000px;

  pointer-events:none;

}


/* =========================================================
   CONNECTION STYLES
========================================================= */

.flow-line{

  fill:none;

  stroke:#29455d;

  stroke-width:1.5;

  opacity:.7;

}


.flow-line.main{

  stroke:#3d6685;

}


.flow-line.frontend{

  stroke:var(--cyan);

  stroke-width:1.7;

}


.flow-line.external{

  stroke:var(--pink);

  stroke-width:1.6;

  stroke-dasharray:5 4;

}


.flow-line.shared{

  stroke:#ffffff;

  stroke-width:2;

  opacity:.9;

}


/* =========================================================
   ARROWS
========================================================= */

.arrow{

  fill:#55738b;

}


.arrow.frontend{

  fill:var(--cyan);

}


.arrow.external{

  fill:var(--pink);

}


/* =========================================================
   HUB
========================================================= */

.hub{

  position:absolute;

  left:3410px;
  top:3410px;

  width:180px;
  min-height:82px;

  z-index:300;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  padding:12px;

  text-align:center;

  background:
    radial-gradient(
      circle,
      #123c62,
      #07131e
    );

  border:
    2px solid var(--blue);

  border-radius:14px;

  box-shadow:
    0 0 50px
    rgba(39,147,255,.22);

}


.hub-icon{

  font-size:24px;

}


.hub-title{

  margin-top:3px;

  font-size:14px;

  font-weight:900;

}


.hub-file{

  margin-top:4px;

  color:#6db8ef;

  font-size:8px;

}


/* =========================================================
   WORKFLOW ROW
========================================================= */

.workflow-row{

  position:absolute;

  left:2450px;

  width:2050px;

  height:90px;

}


/* =========================================================
   NODE
========================================================= */

.node{

  position:absolute;

  width:145px;

  min-height:60px;

  padding:7px 8px;

  background:
    linear-gradient(
      145deg,
      #0d1b29,
      #07111b
    );

  border:
    1px solid #29445c;

  border-radius:7px;

  box-shadow:
    0 5px 16px
    rgba(0,0,0,.38);

  cursor:pointer;

  transition:
    .15s;

  z-index:20;

}


.node:hover{

  border-color:white;

  box-shadow:
    0 0 20px
    rgba(255,255,255,.14);

  transform:
    translateY(-2px);

}


.node.selected{

  border-color:white;

  box-shadow:
    0 0 25px
    rgba(255,255,255,.25);

}


.node.dim{

  opacity:.08;

}


/* =========================================================
   NODE TYPES
========================================================= */

.node.backend{

  border-top:
    3px solid var(--green);

}


.node.sheet{

  border-top:
    3px solid var(--orange);

}


.node.api{

  border-top:
    3px solid var(--blue);

}


.node.status{

  border-top:
    3px solid var(--purple);

}


.node.frontend{

  border-top:
    3px solid var(--cyan);

}


.node.external{

  border-top:
    3px solid var(--pink);

}


/* =========================================================
   NODE CONTENT
========================================================= */

.node-title{

  display:flex;

  align-items:center;

  gap:5px;

  font-size:9px;

  font-weight:900;

}


.node-icon{

  font-size:11px;

}


.node-value{

  margin-top:5px;

  color:#9eb3c6;

  font-size:8px;

  line-height:1.3;

  word-break:break-all;

}


.node-column{

  margin-top:6px;

  color:#5a7288;

  font-size:6px;

  text-transform:uppercase;

  letter-spacing:.5px;

}


/* =========================================================
   INFO PANEL
========================================================= */

#info{

  position:fixed;

  top:70px;
  right:12px;

  width:310px;

  max-height:
    calc(100vh - 90px);

  overflow:auto;

  z-index:900;

  display:none;

  background:
    rgba(4,11,18,.98);

  border:
    1px solid #29445c;

  border-radius:9px;

  box-shadow:
    0 20px 50px
    rgba(0,0,0,.6);

}


.info-head{

  display:flex;

  justify-content:space-between;

  align-items:center;

  padding:11px 12px;

  border-bottom:
    1px solid #1c3245;

}


.info-title{

  font-size:11px;

  font-weight:900;

}


.info-body{

  padding:12px;

}


.info-row{

  padding:8px 0;

  border-bottom:
    1px solid #172a3b;

}


.info-label{

  color:#5e758a;

  font-size:7px;

  text-transform:uppercase;

}


.info-value{

  margin-top:3px;

  color:#c4d4e1;

  font-size:9px;

  line-height:1.4;

  word-break:break-all;

}


.info-link{

  display:inline-block;

  margin-top:10px;

  color:#6ebcff;

  font-size:9px;

  text-decoration:none;

}


.info-link:hover{

  text-decoration:underline;

}


/* =========================================================
   LEGEND
========================================================= */

.legend{

  position:fixed;

  left:12px;
  bottom:12px;

  z-index:500;

  padding:9px 11px;

  background:
    rgba(4,11,18,.94);

  border:
    1px solid #20364a;

  border-radius:7px;

  font-size:8px;

}


.legend-title{

  margin-bottom:7px;

  color:#7d94a8;

  font-weight:900;

}


.legend-row{

  display:flex;

  align-items:center;

  gap:6px;

  margin:4px 0;

}


.legend-dot{

  width:7px;
  height:7px;

  border-radius:50%;

}


.green{
  background:var(--green);
}

.orange{
  background:var(--orange);
}

.blue{
  background:var(--blue);
}

.purple{
  background:var(--purple);
}

.cyan{
  background:var(--cyan);
}

.pink{
  background:var(--pink);
}


/* =========================================================
   STATUS
========================================================= */

#statusbar{

  position:fixed;

  right:12px;
  bottom:12px;

  z-index:500;

  padding:7px 10px;

  background:
    rgba(4,11,18,.94);

  border:
    1px solid #20364a;

  border-radius:6px;

  color:#6f879c;

  font-size:8px;

}


/* =========================================================
   LOADING
========================================================= */

#loading{

  position:fixed;

  inset:0;

  z-index:2000;

  display:flex;

  align-items:center;

  justify-content:center;

  background:#03070d;

  color:#7791a7;

  font-size:11px;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:800px){

  .brand-sub{

    display:none;

  }

  .brand-name{

    font-size:11px;

  }

  input{

    width:120px;

  }

  .controls button{

    display:none;

  }

  #info{

    width:
      calc(100vw - 24px);

  }

}

</style>

<body>

======================================================= -->

<div class="topbar">

<div id="map">

  <div id="world">

```
<div id="grid"></div>


<svg
  id="connections"
  viewBox="0 0 7000 7000"
  preserveAspectRatio="none"
></svg>


<div class="hub">

  <div class="hub-icon">
    🛰️
  </div>

  <div class="hub-title">

  </div>

  id="infoTitle"

```

  </div>

  ></div>

<!-- =======================================================
     LEGEND
======================================================= -->

<div class="legend">

  <div class="legend-title">
    SERVER FLOW
  </div>

  <div class="legend-row">
    <span class="legend-dot green"></span>
    Backend
  </div>

  <div class="legend-row">
    <span class="legend-dot orange"></span>
    Sheet
  </div>

  <div class="legend-row">
    <span class="legend-dot blue"></span>
    API
  </div>

  <div class="legend-row">
    <span class="legend-dot purple"></span>
    Status
  </div>

  <div class="legend-row">
    <span class="legend-dot cyan"></span>
    Frontend
  </div>

  <div class="legend-row">
    <span class="legend-dot pink"></span>
    External
  </div>

</div>

<div id="statusbar">
  Connecting to MAP API...
</div>

<div id="loading">
  🛰️ Loading Obvyris Server Map...
</div>

<script>


/* =========================================================
   MAP API
========================================================= */

const MAP_API =
  "https://script.google.com/macros/s/AKfycbxmet73uElazLhNTF6K9Ziizu4hbgq7VWbXJ8nKjSeXkn-tN4CyoBDjSdeK69A_J5XG/exec";


/* =========================================================
   GLOBALS
========================================================= */

let rows = [];

let allNodes = [];

let scale = 1;

let panX = 0;

let panY = 0;

let dragging = false;

let dragStartX = 0;

let dragStartY = 0;

let startPanX = 0;

let startPanY = 0;


/* =========================================================
   FLOW
========================================================= */

const FLOW = [

  {
    column:"Backends Sheet",
    type:"backend",
    icon:"🗄️"
  },

  {
    column:"Sheet",
    type:"sheet",
    icon:"📊"
  },

  {
    column:"Sheet API",
    type:"api",
    icon:"🔌"
  },

  {
    column:"Status",
    type:"status",
    icon:"●"
  },

  {
    column:"MAIN HTML FRONTEND",
    type:"frontend",
    icon:"🖥️"
  },

  {
    column:"HTML FRONTEND 2",
    type:"frontend",
    icon:"🖥️"
  },

  {
    column:"HTML FRONTEND 3",
    type:"frontend",
    icon:"🖥️"
  },

  {
    column:"HTML FRONTEND 4",
    type:"frontend",
    icon:"🖥️"
  },

  {
    column:"HTML FRONTEND 5",
    type:"frontend",
    icon:"🖥️"
  },

  {
    column:"EXTERNAL",
    type:"external",
    icon:"🌐"
  },

  {
    column:"EXTERNAL API",
    type:"api",
    icon:"🔗"
  },

  {
    column:"EXTERNAL API 2",
    type:"api",
    icon:"🔗"
  }

];


/* =========================================================
   ELEMENTS
========================================================= */

const map =
  document.getElementById(
    "map"
  );


const world =
  document.getElementById(
    "world"
  );


const svg =
  document.getElementById(
    "connections"
  );


/* =========================================================
   LOAD MAP
========================================================= */

function loadMap(){

  setStatus(
    "Loading MAP API..."
  );


  fetch(
    MAP_API,
    {
      method:"GET",
      cache:"no-store"
    }
  )

  .then(
    function(response){

      if(
        !response.ok
      ){

        throw new Error(
          "HTTP " +
          response.status
        );

      }


      return response.json();

    }
  )

  .then(
    function(data){

      if(
        !data ||
        data.success !== true
      ){

        throw new Error(
          "Invalid MAP API response"
        );

      }


      buildMap(
        data
      );

    }
  )

  .catch(
    function(error){

      console.error(
        "MAP API ERROR:",
        error
      );


      document.getElementById(
        "loading"
      ).style.display =
        "none";


      setStatus(
        "MAP API ERROR"
      );


      document.getElementById(
        "statusbar"
      ).style.color =
        "#ef4444";


      /*
        Don't use alert.
        Show the error in the
        map instead.
      */

      showMapError(
        error.message
      );

    }
  );

}


/* =========================================================
   BUILD MAP
========================================================= */

function buildMap(
  data
){

  rows =
    data.rows || [];


  /*
    Remove previous rows.
  */

  document
    .querySelectorAll(
      ".workflow-row"
    )
    .forEach(
      function(element){

        element.remove();

      }
    );


  allNodes = [];


  /*
    Build every MAP row.
  */

  rows.forEach(
    function(row,index){

      buildRow(
        row,
        index
      );

    }
  );


  /*
    Draw all connections.
  */

  drawConnections();


  /*
    Hide loading.
  */

  document.getElementById(
    "loading"
  ).style.display =
    "none";


  /*
    Center.
  */

  centerMap();


  /*
    Status.
  */

  setStatus(
    rows.length +
    " MAP rows • " +
    allNodes.length +
    " cards"
  );

}


/* =========================================================
   BUILD ROW
========================================================= */

function buildRow(
  row,
  rowIndex
){

  const workflow =
    document.createElement(
      "div"
    );


  workflow.className =
    "workflow-row";


  /*
    Vertical spacing.

    Rows surround the HUB.
  */

  const spacing = 135;

  const center =
    3500;

  const total =
    rows.length *
    spacing;


  const first =
    center -
    total / 2;


  const y =
    first +
    rowIndex *
    spacing;


  workflow.style.top =
    y + "px";


  workflow.dataset.row =
    rowIndex;


  /*
    Every populated cell
    becomes a card.
  */

  FLOW.forEach(
    function(config,index){

      const value =
        row[
          config.column
        ];


      if(
        !valid(value)
      ){

        return;

      }


      const node =
        createNode(
          row,
          rowIndex,
          config,
          value
        );


      /*
        Position cards.

        0 Backend
        1 Sheet
        2 Sheet API
        3 Status

        4-8 Frontends

        9 External
        10 External API
        11 External API 2
      */

      if(
        index <= 3
      ){

        node.style.left =
          (
            index *
            165
          ) +
          "px";

      }


      else if(
        index >= 4 &&
        index <= 8
      ){

        node.style.left =
          (
            580 +
            (
              index -
              4
            ) *
            160
          ) +
          "px";

      }


      else if(
        index === 9
      ){

        node.style.left =
          "1380px";

      }


      else if(
        index === 10
      ){

        node.style.left =
          "1545px";

      }


      else if(
        index === 11
      ){

        node.style.left =
          "1710px";

      }


      node.style.top =
        "0px";


      workflow.appendChild(
        node
      );

    }
  );


  world.appendChild(
    workflow
  );

}


/* =========================================================
   CREATE NODE
========================================================= */

function createNode(
  row,
  rowIndex,
  config,
  value
){

  const node =
    document.createElement(
      "div"
    );


  node.className =
    "node " +
    config.type;


  const text =
    String(value)
      .trim();


  node.innerHTML = `

    <div class="node-title">

      <span class="node-icon">
        ${config.icon}
      </span>

      <span>
        ${escapeHtml(
          shortValue(text)
        )}
      </span>

    </div>


    <div class="node-value">

      ${escapeHtml(text)}

    </div>


    <div class="node-column">

      ${escapeHtml(
        config.column
      )}

    </div>

  `;


  const data = {

    element:node,

    row:row,

    rowIndex:rowIndex,

    column:
      config.column,

    type:
      config.type,

    value:
      text

  };


  allNodes.push(
    data
  );


  node.addEventListener(
    "click",
    function(event){

      event.stopPropagation();

      selectNode(
        data
      );

    }
  );


  return node;

}


/* =========================================================
   DRAW CONNECTIONS
========================================================= */

function drawConnections(){

  svg.innerHTML = "";


  rows.forEach(
    function(row,rowIndex){

      const rowNodes =
        allNodes.filter(
          function(node){

            return node.rowIndex ===
              rowIndex;

          }
        );


      rowNodes.sort(
        function(a,b){

          return FLOW.findIndex(
            function(flow){

              return flow.column ===
                a.column;

            }
          )

          -

          FLOW.findIndex(
            function(flow){

              return flow.column ===
                b.column;

            }
          );

        }
      );


      for(
        let i=0;
        i<rowNodes.length-1;
        i++
      ){

        const from =
          rowNodes[i];


        const to =
          rowNodes[i+1];


        let lineType =
          "main";


        if(
          from.type ===
            "frontend"
        ){

          lineType =
            "frontend";

        }


        if(
          to.type ===
            "external"
        ){

          lineType =
            "external";

        }


        createConnection(
          from,
          to,
          lineType
        );

      }

    }
  );

}


/* =========================================================
   CREATE CONNECTION
========================================================= */

function createConnection(
  from,
  to,
  type
){

  const a =
    getWorldPosition(
      from.element
    );


  const b =
    getWorldPosition(
      to.element
    );


  let x1;
  let y1;
  let x2;
  let y2;


  /*
    Normal:

    A → B
  */

  if(
    to.type !==
      "external"
  ){

    x1 =
      a.right;

    y1 =
      a.centerY;

    x2 =
      b.left;

    y2 =
      b.centerY;

  }


  /*
    External:

    Frontend ← External
  */

  else{

    x1 =
      b.left;

    y1 =
      b.centerY;

    x2 =
      a.right;

    y2 =
      a.centerY;

  }


  const midpoint =
    (
      x1 +
      x2
    ) / 2;


  const path =
    document.createElementNS(
      "http://www.w3.org/2000/svg",
      "path"
    );


  path.setAttribute(
    "d",
    `
      M ${x1} ${y1}
      C ${midpoint} ${y1},
        ${midpoint} ${y2},
        ${x2} ${y2}
    `
  );


  path.classList.add(
    "flow-line",
    type
  );


  svg.appendChild(
    path
  );

}


/* =========================================================
   POSITION
========================================================= */

function getWorldPosition(
  element
){

  const row =
    element.parentElement;


  const left =
    row.offsetLeft +
    element.offsetLeft;


  const top =
    row.offsetTop +
    element.offsetTop;


  const width =
    element.offsetWidth;


  const height =
    element.offsetHeight;


  return {

    left:left,

    right:
      left +
      width,

    top:top,

    bottom:
      top +
      height,

    centerY:
      top +
      height / 2

  };

}


/* =========================================================
   SELECT NODE
========================================================= */

function selectNode(
  selected
){

  /*
    Dim everything.
  */

  allNodes.forEach(
    function(node){

      node.element.classList.add(
        "dim"
      );

      node.element.classList.remove(
        "selected"
      );

    }
  );


  /*
    Highlight same value.

    This is what creates the
    branching / spiderweb
    effect for shared URLs.
  */

  const matches =
    allNodes.filter(
      function(node){

        return node.value ===
          selected.value;

      }
    );


  matches.forEach(
    function(node){

      node.element.classList.remove(
        "dim"
      );

      node.element.classList.add(
        "selected"
      );

    }
  );


  /*
    Also show the entire row.
  */

  allNodes.forEach(
    function(node){

      if(
        node.rowIndex ===
          selected.rowIndex
      ){

        node.element.classList.remove(
          "dim"
        );

      }

    }
  );


  showInfo(
    selected,
    matches.length
  );

}


/* =========================================================
   INFO
========================================================= */

function showInfo(
  node,
  sharedCount
){

  const info =
    document.getElementById(
      "info"
    );


  const title =
    document.getElementById(
      "infoTitle"
    );


  const body =
    document.getElementById(
      "infoBody"
    );


  title.textContent =
    node.column;


  let html = `

    <div class="info-row">

      <div class="info-label">
        Backend
      </div>

      <div class="info-value">
        ${escapeHtml(
          node.row[
            "Backends Sheet"
          ] || "—"
        )}
      </div>

    </div>


    <div class="info-row">

      <div class="info-label">
        Column
      </div>

      <div class="info-value">
        ${escapeHtml(
          node.column
        )}
      </div>

    </div>


    <div class="info-row">

      <div class="info-label">
        Value
      </div>

      <div class="info-value">
        ${escapeHtml(
          node.value
        )}
      </div>

    </div>


    <div class="info-row">

      <div class="info-label">
        Status
      </div>

      <div class="info-value">
        ${escapeHtml(
          node.row.Status || "—"
        )}
      </div>

    </div>


    <div class="info-row">

      <div class="info-label">
        MAP Row
      </div>

      <div class="info-value">
        ${node.rowIndex + 2}
      </div>

    </div>

  `;


  if(
    sharedCount > 1
  ){

    html += `

      <div class="info-row">

        <div class="info-label">
          Shared Resource
        </div>

        <div class="info-value">
          This value appears in
          ${sharedCount}
          MAP cells.
        </div>

      </div>

    `;

  }


  if(
    /^https?:\/\//i.test(
      node.value
    )
  ){

    html += `

      <a
        class="info-link"
        href="${escapeHtml(
          node.value
        )}"
        target="_blank"
        rel="noopener noreferrer"
      >

        OPEN RESOURCE ↗

      </a>

    `;

  }


  body.innerHTML =
    html;


  info.style.display =
    "block";

}


/* =========================================================
   CLOSE INFO
========================================================= */

function closeInfo(){

  document.getElementById(
    "info"
  ).style.display =
    "none";


  allNodes.forEach(
    function(node){

      node.element.classList.remove(
        "dim",
        "selected"
      );

    }
  );

}


/* =========================================================
   SEARCH
========================================================= */

function searchMap(
  value
){

  const query =
    String(value || "")
      .toLowerCase()
      .trim();


  if(!query){

    closeInfo();

    setStatus(
      rows.length +
      " MAP rows • " +
      allNodes.length +
      " cards"
    );

    return;

  }


  let matches = 0;


  allNodes.forEach(
    function(node){

      const text =
        (
          node.value +
          " " +
          node.column +
          " " +
          (
            node.row[
              "Backends Sheet"
            ] || ""
          )
        )
        .toLowerCase();


      if(
        text.includes(
          query
        )
      ){

        node.element.classList.remove(
          "dim"
        );

        node.element.classList.add(
          "selected"
        );

        matches++;

      }

      else{

        node.element.classList.add(
          "dim"
        );

        node.element.classList.remove(
          "selected"
        );

      }

    }
  );


  setStatus(
    matches +
    " matching cards"
  );

}


/* =========================================================
   CENTER
========================================================= */

function centerMap(){

  const rect =
    map.getBoundingClientRect();


  scale = 1;


  panX =
    rect.width / 2 -
    3500;


  panY =
    rect.height / 2 -
    3500;


  applyTransform();

}


/* =========================================================
   ZOOM
========================================================= */

function zoomIn(){

  scale =
    Math.min(
      2.5,
      scale + .12
    );


  applyTransform();

}


function zoomOut(){

  scale =
    Math.max(
      .3,
      scale - .12
    );


  applyTransform();

}


/* =========================================================
   TRANSFORM
========================================================= */

function applyTransform(){

  world.style.transform =
    `
      translate(
        ${panX}px,
        ${panY}px
      )
      scale(
        ${scale}
      )
    `;

}


/* =========================================================
   DRAG
========================================================= */

map.addEventListener(
  "mousedown",
  function(event){

    if(
      event.target.closest(
        ".node"
      ) ||
      event.target.closest(
        ".hub"
      ) ||
      event.target.closest(
        "button"
      )
    ){

      return;

    }


    dragging = true;

    map.classList.add(
      "dragging"
    );


    dragStartX =
      event.clientX;


    dragStartY =
      event.clientY;


    startPanX =
      panX;


    startPanY =
      panY;

  }
);


window.addEventListener(
  "mousemove",
  function(event){

    if(!dragging){

      return;

    }


    panX =
      startPanX +
      event.clientX -
      dragStartX;


    panY =
      startPanY +
      event.clientY -
      dragStartY;


    applyTransform();

  }
);


window.addEventListener(
  "mouseup",
  function(){

    dragging = false;

    map.classList.remove(
      "dragging"
    );

  }
);


/* =========================================================
   TOUCH DRAG
========================================================= */

let touchStartX = 0;

let touchStartY = 0;

let touchPanX = 0;

let touchPanY = 0;


map.addEventListener(
  "touchstart",
  function(event){

    if(
      event.touches.length !== 1
    ){

      return;

    }


    touchStartX =
      event.touches[0].clientX;


    touchStartY =
      event.touches[0].clientY;


    touchPanX =
      panX;


    touchPanY =
      panY;

  },
  {
    passive:true
  }
);


map.addEventListener(
  "touchmove",
  function(event){

    if(
      event.touches.length !== 1
    ){

      return;

    }


    panX =
      touchPanX +
      event.touches[0].clientX -
      touchStartX;


    panY =
      touchPanY +
      event.touches[0].clientY -
      touchStartY;


    applyTransform();

  },
  {
    passive:true
  }
);


/* =========================================================
   WHEEL
========================================================= */

map.addEventListener(
  "wheel",
  function(event){

    event.preventDefault();


    if(
      event.deltaY < 0
    ){

      zoomIn();

    }

    else{

      zoomOut();

    }

  },
  {
    passive:false
  }
);


/* =========================================================
   HELPERS
========================================================= */

function valid(
  value
){

  if(
    value === null ||
    value === undefined
  ){

    return false;

  }


  const text =
    String(value)
      .trim();


  return (
    text !== "" &&
    text !== "#"
  );

}


function shortValue(
  value
){

  if(
    value.length <= 25
  ){

    return value;

  }


  return (
    value.substring(
      0,
      22
    ) +
    "..."
  );

}


function escapeHtml(
  value
){

  return String(
    value || ""
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


function setStatus(
  text
){

  document.getElementById(
    "statusbar"
  ).textContent =
    text;

}


/* =========================================================
   API ERROR
========================================================= */

function showMapError(
  message
){

  const loading =

      "loading"
    );


  loading.style.display =
    "flex";


  loading.innerHTML = `

    <div style="
      text-align:center;
      max-width:420px;
      padding:20px;
    ">

      <div style="
        font-size:30px;
        margin-bottom:12px;
      ">
        ⚠️
      </div>

      <div style="
        color:#ef4444;
        font-weight:900;

      ">
        MAP API ERROR
      </div>

      <div style="
        color:#8298aa;
        font-size:9px;

        ${escapeHtml(message)}

      <button

        "
      >

      </button>

    </div>

  `;

}

document
  .getElementById(

  )

  );


document
  .getElementById(

  )
  .addEventListener(

  );


document
  .getElementById(

  )
  .addEventListener(

  );


document
  .getElementById(

  )
  .addEventListener(
