<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Obvyris Server Map</title>

<meta name="description" content="Obvyris infrastructure workflow and server map">
<meta name="theme-color" content="#07111f">

<style>

:root{
    --bg:#050b14;
    --panel:#0b1422;
    --panel2:#0e1a2b;
    --panel3:#111f32;
    --line:#26384e;
    --text:#eef5ff;
    --muted:#8294aa;
    --blue:#2793ff;
    --blue2:#56b2ff;
    --green:#25d98b;
    --red:#ff5364;
    --yellow:#ffc857;
    --purple:#9d7cff;
    --cyan:#35d6ff;
    --shadow:0 18px 50px rgba(0,0,0,.45);
}

*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

/* =========================================================
   APPLICATION
========================================================= */

#app{
    width:100vw;
    height:100vh;
    position:relative;
    overflow:hidden;
    background:
        radial-gradient(circle at 50% 50%,rgba(39,147,255,.055),transparent 32%),
        #050b14;
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar{
    position:absolute;
    z-index:1000;
    top:0;
    left:0;
    right:0;
    height:66px;

    display:flex;
    align-items:center;
    gap:14px;

    padding:0 18px;

    background:rgba(5,11,20,.91);
    border-bottom:1px solid rgba(255,255,255,.08);
    backdrop-filter:blur(16px);
}

.brand{
    display:flex;
    align-items:center;
    gap:11px;
    min-width:240px;
}

.brand-mark{
    width:38px;
    height:38px;
    border-radius:11px;

    display:grid;
    place-items:center;

    background:
        linear-gradient(145deg,#2793ff,#1754a5);

    box-shadow:
        0 0 25px rgba(39,147,255,.25);

    font-weight:900;
    font-size:18px;
}

.brand-text{
    display:flex;
    flex-direction:column;
}

.brand-title{
    font-size:15px;
    font-weight:800;
    letter-spacing:.3px;
}

.brand-sub{
    color:var(--muted);
    font-size:11px;
    margin-top:2px;
}

.toolbar{
    display:flex;
    align-items:center;
    gap:7px;
    flex:1;
}

button,
input,
select{
    font:inherit;
}

.tool{
    height:36px;
    border:1px solid rgba(255,255,255,.09);
    background:#0d1928;
    color:#dce9f7;
    border-radius:8px;
    padding:0 12px;
    cursor:pointer;
    transition:.15s;
}

.tool:hover{
    background:#14243a;
    border-color:rgba(39,147,255,.35);
}

.tool.active{
    background:rgba(39,147,255,.15);
    border-color:rgba(39,147,255,.45);
    color:#fff;
}

.search{
    width:230px;
    height:36px;

    border:1px solid rgba(255,255,255,.09);
    border-radius:8px;

    outline:none;

    padding:0 12px;

    color:#fff;
    background:#0b1726;
}

.search:focus{
    border-color:rgba(39,147,255,.6);
}

.map-status{
    display:flex;
    align-items:center;
    gap:8px;

    color:var(--muted);
    font-size:11px;

    white-space:nowrap;
}

.status-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--yellow);
    box-shadow:0 0 10px currentColor;
}

.status-dot.online{
    background:var(--green);
}

.status-dot.error{
    background:var(--red);
}

/* =========================================================
   WORKSPACE
========================================================= */

#viewport{
    position:absolute;
    inset:66px 0 0 0;

    overflow:hidden;

    cursor:grab;

    background-color:#06101b;

    background-image:
        linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);

    background-size:40px 40px;
}

#viewport.dragging{
    cursor:grabbing;
}

/* =========================================================
   WORLD
========================================================= */

#world{
    position:absolute;

    width:1px;
    height:1px;

    left:50%;
    top:50%;

    transform-origin:0 0;
}

/*
    SVG is underneath the cards.
*/

#connections{
    position:absolute;

    left:-10000px;
    top:-10000px;

    width:20000px;
    height:20000px;

    pointer-events:none;

    overflow:visible;
}

.connection{
    fill:none;
    stroke-width:2.5;
    opacity:.45;

    vector-effect:non-scaling-stroke;

    transition:
        opacity .15s,
        stroke-width .15s;
}

.connection.backend{
    stroke:var(--blue);
}

.connection.frontend{
    stroke:var(--purple);
}

.connection.external{
    stroke:var(--cyan);
}

.connection.active{
    opacity:1;
    stroke-width:4;
    filter:drop-shadow(0 0 7px currentColor);
}

.connection.dim{
    opacity:.08;
}

/* =========================================================
   HUB
========================================================= */

#hub{
    position:absolute;

    left:-130px;
    top:-100px;

    width:260px;
    height:200px;

    border-radius:26px;

    background:
        radial-gradient(circle at 50% 35%,rgba(39,147,255,.24),transparent 50%),
        linear-gradient(145deg,#101f33,#08121f);

    border:1px solid rgba(39,147,255,.55);

    box-shadow:
        0 0 0 1px rgba(39,147,255,.08),
        0 0 60px rgba(39,147,255,.14),
        var(--shadow);

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    z-index:50;

    user-select:none;
}

.hub-ring{
    width:70px;
    height:70px;

    border-radius:50%;

    display:grid;
    place-items:center;

    border:2px solid rgba(39,147,255,.7);

    box-shadow:
        0 0 25px rgba(39,147,255,.25),
        inset 0 0 25px rgba(39,147,255,.08);

    margin-bottom:11px;

    font-size:25px;
    font-weight:900;
}

.hub-title{
    font-size:20px;
    font-weight:900;
    letter-spacing:.6px;
}

.hub-sub{
    margin-top:4px;
    font-size:11px;
    color:var(--muted);
}

/* =========================================================
   NODE CARDS
========================================================= */

.node{
    position:absolute;

    width:190px;
    min-height:70px;

    padding:10px 12px;

    border-radius:12px;

    background:
        linear-gradient(
            145deg,
            rgba(17,31,50,.98),
            rgba(9,18,30,.98)
        );

    border:1px solid rgba(255,255,255,.09);

    box-shadow:
        0 10px 30px rgba(0,0,0,.35);

    user-select:none;

    cursor:grab;

    z-index:20;

    transition:
        border-color .15s,
        box-shadow .15s,
        opacity .15s,
        transform .15s;
}

.node:hover{
    border-color:rgba(255,255,255,.22);

    box-shadow:
        0 15px 40px rgba(0,0,0,.45);
}

.node.dragging{
    cursor:grabbing;
    z-index:500;

    border-color:rgba(39,147,255,.7);

    box-shadow:
        0 20px 50px rgba(0,0,0,.55),
        0 0 25px rgba(39,147,255,.14);
}

.node.selected{
    border-color:var(--blue);

    box-shadow:
        0 0 0 1px rgba(39,147,255,.25),
        0 0 30px rgba(39,147,255,.15);
}

.node.dimmed{
    opacity:.13;
}

.node.backend{
    border-left:3px solid var(--blue);
}

.node.sheet{
    border-left:3px solid var(--green);
}

.node.api{
    border-left:3px solid var(--yellow);
}

.node.frontend{
    border-left:3px solid var(--purple);
}

.node.external{
    border-left:3px solid var(--cyan);
}

.node.externalapi{
    border-left:3px solid #49e8e0;
}

.node-head{
    display:flex;
    align-items:center;
    gap:8px;
}

.node-icon{
    width:25px;
    height:25px;

    border-radius:7px;

    display:grid;
    place-items:center;

    background:rgba(255,255,255,.06);

    font-size:12px;
}

.node-name{
    flex:1;

    font-size:12px;
    font-weight:800;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.node-type{
    color:var(--muted);
    font-size:9px;

    text-transform:uppercase;
    letter-spacing:.6px;
}

.node-url{
    margin-top:7px;

    color:#7890aa;

    font-size:9px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.node-url.has-link{
    color:#70bfff;
    cursor:pointer;
}

.node-url.has-link:hover{
    text-decoration:underline;
}

/* =========================================================
   BRANCH LABELS
========================================================= */

.branch-label{
    position:absolute;

    transform:translate(-50%,-50%);

    pointer-events:none;

    padding:5px 9px;

    border-radius:999px;

    background:rgba(5,11,20,.82);

    border:1px solid rgba(255,255,255,.08);

    color:#6f839a;

    font-size:9px;
    font-weight:800;

    letter-spacing:1px;

    text-transform:uppercase;

    white-space:nowrap;

    z-index:5;
}

.branch-label.backend-label{
    color:#5aaeff;
}

.branch-label.external-label{
    color:#4fe1ee;
}

/* =========================================================
   LEGEND
========================================================= */

.legend{
    position:absolute;

    left:18px;
    bottom:18px;

    z-index:100;

    padding:11px 13px;

    border-radius:10px;

    background:rgba(7,15,25,.9);

    border:1px solid rgba(255,255,255,.08);

    backdrop-filter:blur(14px);

    box-shadow:var(--shadow);

    font-size:10px;
}

.legend-title{
    font-size:10px;
    font-weight:800;

    text-transform:uppercase;
    letter-spacing:1px;

    margin-bottom:8px;

    color:#dbe7f5;
}

.legend-row{
    display:flex;
    align-items:center;
    gap:7px;

    margin:5px 0;

    color:var(--muted);
}

.legend-line{
    width:28px;
    height:2px;
}

.legend-line.backend{
    background:var(--blue);
}

.legend-line.frontend{
    background:var(--purple);
}

.legend-line.external{
    background:var(--cyan);
}

/* =========================================================
   ZOOM CONTROL
========================================================= */

.zoom-panel{
    position:absolute;

    right:18px;
    bottom:18px;

    z-index:100;

    display:flex;
    align-items:center;

    overflow:hidden;

    border-radius:10px;

    background:rgba(7,15,25,.92);

    border:1px solid rgba(255,255,255,.08);

    box-shadow:var(--shadow);
}

.zoom-btn{
    width:40px;
    height:38px;

    border:0;

    background:transparent;

    color:#dce8f5;

    cursor:pointer;

    font-size:18px;
}

.zoom-btn:hover{
    background:rgba(255,255,255,.06);
}

.zoom-value{
    min-width:64px;

    text-align:center;

    color:var(--muted);

    font-size:11px;

    border-left:1px solid rgba(255,255,255,.07);
    border-right:1px solid rgba(255,255,255,.07);
}

/* =========================================================
   DETAILS PANEL
========================================================= */

#details{
    position:absolute;

    right:18px;
    top:82px;

    width:310px;
    max-height:calc(100vh - 180px);

    overflow:auto;

    z-index:200;

    padding:16px;

    border-radius:14px;

    background:rgba(8,17,29,.96);

    border:1px solid rgba(255,255,255,.09);

    box-shadow:var(--shadow);

    backdrop-filter:blur(18px);

    display:none;
}

#details.show{
    display:block;
}

.details-title{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:13px;
}

.details-name{
    font-size:16px;
    font-weight:900;
}

.details-close{
    width:28px;
    height:28px;

    border:0;
    border-radius:7px;

    background:#142337;
    color:#fff;

    cursor:pointer;
}

.detail-row{
    padding:9px 0;

    border-bottom:1px solid rgba(255,255,255,.06);
}

.detail-label{
    color:var(--muted);

    font-size:9px;

    text-transform:uppercase;
    letter-spacing:.8px;

    margin-bottom:4px;
}

.detail-value{
    color:#dce8f5;

    font-size:11px;

    word-break:break-word;
}

.detail-link{
    color:#63b7ff;
    cursor:pointer;
}

/* =========================================================
   LOADING
========================================================= */

#loading{
    position:absolute;

    inset:66px 0 0 0;

    z-index:900;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#050b14;
}

.loading-box{
    display:flex;
    flex-direction:column;
    align-items:center;

    gap:12px;

    color:var(--muted);

    font-size:12px;
}

.loader{
    width:34px;
    height:34px;

    border-radius:50%;

    border:3px solid rgba(255,255,255,.08);
    border-top-color:var(--blue);

    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* =========================================================
   EMPTY / ERROR
========================================================= */

#error{
    position:absolute;

    inset:66px 0 0 0;

    z-index:850;

    display:none;

    align-items:center;
    justify-content:center;

    padding:30px;
}

.error-box{
    max-width:600px;

    padding:24px;

    border-radius:14px;

    background:#0d1827;

    border:1px solid rgba(255,83,100,.3);

    box-shadow:var(--shadow);
}

.error-title{
    font-size:17px;
    font-weight:900;

    margin-bottom:8px;
}

.error-message{
    color:var(--muted);

    font-size:12px;

    line-height:1.6;

    word-break:break-word;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:800px){

    .brand{
        min-width:auto;
    }

    .brand-text{
        display:none;
    }

    .search{
        width:140px;
    }

    .tool span{
        display:none;
    }

    #details{
        width:calc(100vw - 36px);
        right:18px;
    }
}

</style>
</head>

<body>

<div id="app">

    <!-- =====================================================
         TOP BAR
    ====================================================== -->

    <header class="topbar">

        <div class="brand">

            <div class="brand-mark">
                O
            </div>

            <div class="brand-text">

                <div class="brand-title">
                    OBVYRIS SERVER MAP
                </div>

                <div class="brand-sub">
                    Infrastructure Workflow
                </div>

            </div>

        </div>

        <div class="toolbar">

            <input
                id="search"
                class="search"
                type="search"
                placeholder="Search infrastructure..."
                autocomplete="off"
            >

            <button
                id="allBtn"
                class="tool active"
                type="button"
            >
                All
            </button>

            <button
                id="onlineBtn"
                class="tool"
                type="button"
            >
                Online
            </button>

            <button
                id="offlineBtn"
                class="tool"
                type="button"
            >
                Offline
            </button>

            <button
                id="fitBtn"
                class="tool"
                type="button"
            >
                Fit
            </button>

            <button
                id="resetBtn"
                class="tool"
                type="button"
            >
                Reset
            </button>

            <button
                id="reloadBtn"
                class="tool"
                type="button"
            >
                Reload
            </button>

        </div>

        <div class="map-status">

            <span
                id="statusDot"
                class="status-dot"
            ></span>

            <span id="statusText">
                Loading map
            </span>

        </div>

    </header>


    <!-- =====================================================
         VIEWPORT
    ====================================================== -->

    <main
        id="viewport"
        aria-label="Obvyris infrastructure map"
    >

        <div id="world">

            <svg
                id="connections"
                viewBox="0 0 20000 20000"
                preserveAspectRatio="none"
            >
                <defs>

                    <filter
                        id="glowBlue"
                        x="-50%"
                        y="-50%"
                        width="200%"
                        height="200%"
                    >
                        <feGaussianBlur
                            stdDeviation="3"
                            result="blur"
                        />
                    </filter>

                </defs>

                <g id="lines"></g>

            </svg>


            <!-- CENTRAL HUB -->

            <div id="hub">

                <div class="hub-ring">
                    O
                </div>

                <div class="hub-title">
                    OBVYRIS HUB
                </div>

                <div class="hub-sub">
                    Central Infrastructure
                </div>

            </div>


            <!-- NODES INSERTED HERE -->

            <div id="nodes"></div>

            <div id="labels"></div>

        </div>

    </main>


    <!-- =====================================================
         DETAILS
    ====================================================== -->

    <aside id="details">

        <div class="details-title">

            <div
                id="detailsName"
                class="details-name"
            >
                Node
            </div>

            <button
                id="detailsClose"
                class="details-close"
                type="button"
            >
                ×
            </button>

        </div>

        <div id="detailsBody"></div>

    </aside>


    <!-- =====================================================
         LEGEND
    ====================================================== -->

    <div class="legend">

        <div class="legend-title">
            Flow
        </div>

        <div class="legend-row">

            <span class="legend-line backend"></span>

            <span>
                Backend Routes
            </span>

        </div>

        <div class="legend-row">

            <span class="legend-line frontend"></span>

            <span>
                Frontend Routes
            </span>

        </div>

        <div class="legend-row">

            <span class="legend-line external"></span>

            <span>
                External Routes
            </span>

        </div>

    </div>


    <!-- =====================================================
         ZOOM
    ====================================================== -->

    <div class="zoom-panel">

        <button
            id="zoomOut"
            class="zoom-btn"
            type="button"
        >
            −
        </button>

        <div
            id="zoomValue"
            class="zoom-value"
        >
            100%
        </div>

        <button
            id="zoomIn"
            class="zoom-btn"
            type="button"
        >
            +
        </button>

    </div>


    <!-- =====================================================
         LOADING
    ====================================================== -->

    <div id="loading">

        <div class="loading-box">

            <div class="loader"></div>

            <div>
                Loading Obvyris infrastructure...
            </div>

        </div>

    </div>


    <!-- =====================================================
         ERROR
    ====================================================== -->

    <div id="error">

        <div class="error-box">

            <div class="error-title">
                Unable to load server map
            </div>

            <div
                id="errorMessage"
                class="error-message"
            ></div>

        </div>

    </div>

</div>


<script>

/* ==========================================================
   CONFIGURATION
========================================================== */

const API_URL =
    "https://script.google.com/macros/s/AKfycbxmet73uElazLhNTF6K9Ziizu4hbgq7VWbXJ8nKjSeXkn-tN4CyoBDjSdeK69A_J5XG/exec";

const STORAGE_KEY =
    "obvyris-server-map-state-v3";

const DEFAULT_ZOOM =
    0.82;


/* ==========================================================
   STATE
========================================================== */

let mapData = [];

let nodes = [];

let selectedNode = null;

let activeFilter = "all";

let searchTerm = "";

let zoom =
    DEFAULT_ZOOM;

let panX = 0;
let panY = 0;

let draggingWorld = false;

let worldStartX = 0;
let worldStartY = 0;

let panStartX = 0;
let panStartY = 0;

let dragNode = null;

let dragNodeStartX = 0;
let dragNodeStartY = 0;

let dragMouseStartX = 0;
let dragMouseStartY = 0;


/* ==========================================================
   DOM
========================================================== */

const viewport =
    document.getElementById("viewport");

const world =
    document.getElementById("world");

const nodeLayer =
    document.getElementById("nodes");

const labelLayer =
    document.getElementById("labels");

const linesLayer =
    document.getElementById("lines");

const loading =
    document.getElementById("loading");

const errorPanel =
    document.getElementById("error");

const errorMessage =
    document.getElementById("errorMessage");

const searchInput =
    document.getElementById("search");

const zoomValue =
    document.getElementById("zoomValue");

const statusText =
    document.getElementById("statusText");

const statusDot =
    document.getElementById("statusDot");

const details =
    document.getElementById("details");

const detailsName =
    document.getElementById("detailsName");

const detailsBody =
    document.getElementById("detailsBody");


/* ==========================================================
   NORMALIZE DATA
========================================================== */

function normalizeRow(row){

    const clean = {};

    Object.keys(row || {}).forEach(key => {

        clean[key] =
            row[key] == null
                ? ""
                : String(row[key]).trim();

    });

    return clean;
}


/* ==========================================================
   LOAD API
========================================================== */

async function loadMap(){

    showLoading();

    try{

        const response =
            await fetch(
                API_URL +
                "?action=map&_=" +
                Date.now(),
                {
                    method:"GET",
                    cache:"no-store"
                }
            );

        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }

        const data =
            await response.json();

        if(
            !data ||
            data.success !== true ||
            !Array.isArray(data.rows)
        ){

            throw new Error(
                "API did not return a valid MAP response."
            );

        }

        mapData =
            data.rows.map(normalizeRow);

        buildMap();

        hideLoading();

        statusDot.className =
            "status-dot online";

        statusText.textContent =
            mapData.length +
            " infrastructure records";

    }catch(error){

        console.error(error);

        hideLoading();

        errorPanel.style.display =
            "flex";

        errorMessage.textContent =
            error.message +
            "  |  API: " +
            API_URL;

        statusDot.className =
            "status-dot error";

        statusText.textContent =
            "API error";

    }

}


/* ==========================================================
   BUILD MAP
========================================================== */

function buildMap(){

    nodeLayer.innerHTML = "";
    labelLayer.innerHTML = "";
    linesLayer.innerHTML = "";

    nodes = [];

    mapData.forEach(
        (row,index) => {

            buildRowBranch(
                row,
                index
            );

        }
    );

    restoreState();

    applyTransform();

    requestAnimationFrame(
        drawConnections
    );

    setTimeout(
        drawConnections,
        200
    );

}


/* ==========================================================
   VALUE HELPERS
========================================================== */

function value(row,key){

    return row[key] || "";

}

function isURL(value){

    return /^https?:\/\//i.test(
        String(value || "")
    );

}


/* ==========================================================
   NODE CREATION
========================================================== */

function createNode({
    id,
    name,
    type,
    valueText,
    className,
    x,
    y,
    row,
    role,
    icon,
    branchIndex
}){

    const element =
        document.createElement("div");

    element.className =
        "node " +
        className;

    element.dataset.nodeId =
        id;

    element.dataset.branch =
        branchIndex;

    element.style.left =
        x + "px";

    element.style.top =
        y + "px";

    element.innerHTML =

        `
        <div class="node-head">

            <div class="node-icon">
                ${icon}
            </div>

            <div class="node-name">
                ${escapeHTML(name)}
            </div>

        </div>

        <div class="node-type">
            ${escapeHTML(type)}
        </div>

        ${
            valueText
            ?
            `
            <div
                class="node-url ${
                    isURL(valueText)
                    ? "has-link"
                    : ""
                }"
                title="${escapeAttribute(valueText)}"
            >
                ${escapeHTML(valueText)}
            </div>
            `
            :
            ""
        }
        `;

    nodeLayer.appendChild(
        element
    );

    const node = {

        id,

        name,

        type,

        value:valueText,

        role,

        row,

        branchIndex,

        element,

        x,
        y

    };

    nodes.push(node);

    makeNodeDraggable(node);

    element.addEventListener(
        "click",
        event => {

            event.stopPropagation();

            if(
                Math.abs(
                    dragMouseStartX -
                    event.clientX
                ) > 5
            ){

                return;

            }

            selectNode(node);

        }
    );

    const urlElement =
        element.querySelector(
            ".node-url"
        );

    if(
        urlElement &&
        isURL(valueText)
    ){

        urlElement.addEventListener(
            "dblclick",
            event => {

                event.stopPropagation();

                window.open(
                    valueText,
                    "_blank",
                    "noopener,noreferrer"
                );

            }
        );

    }

    return node;

}


/* ==========================================================
   BUILD INDIVIDUAL BRANCH
========================================================== */

function buildRowBranch(row,index){

    /*
        Each row gets its own vertical/radial branch.

        Backend:
              Backend
                 |
               Sheet
                 |
              Sheet API
                 |
                HUB
                 |
          Frontend branches
                 |
             External
                 |
            External API
                 |
           External API 2
    */

    const spacing =
        205;

    const branchSpread =
        Math.max(
            500,
            Math.min(
                1350,
                mapData.length * 72
            )
        );

    const centerOffset =
        (
            index -
            (mapData.length - 1) / 2
        ) *
        Math.min(
            125,
            branchSpread /
            Math.max(
                mapData.length,
                1
            )
        );

    const branchX =
        centerOffset;


    /*
       BACKEND
    */

    if(
        value(row,"Backends Sheet")
    ){

        createNode({

            id:
                "backend-" +
                index,

            name:
                value(
                    row,
                    "Backends Sheet"
                ),

            type:
                "Backend",

            valueText:
                value(
                    row,
                    "Backends Sheet"
                ),

            className:
                "backend",

            x:
                branchX - 95,

            y:
                -1150,

            row,

            role:
                "backend",

            icon:
                "B",

            branchIndex:index

        });

    }


    /*
       SHEET
    */

    if(
        value(row,"Sheet")
    ){

        createNode({

            id:
                "sheet-" +
                index,

            name:
                "Sheet",

            type:
                "Google Sheet",

            valueText:
                value(
                    row,
                    "Sheet"
                ),

            className:
                "sheet",

            x:
                branchX - 95,

            y:
                -920,

            row,

            role:
                "sheet",

            icon:
                "S",

            branchIndex:index

        });

    }


    /*
       SHEET API
    */

    if(
        value(row,"Sheet API")
    ){

        createNode({

            id:
                "sheet-api-" +
                index,

            name:
                "Sheet API",

            type:
                "Apps Script API",

            valueText:
                value(
                    row,
                    "Sheet API"
                ),

            className:
                "api",

            x:
                branchX - 95,

            y:
                -690,

            row,

            role:
                "sheet-api",

            icon:
                "A",

            branchIndex:index

        });

    }


    /*
       FRONTENDS
    */

    const frontends = [

        [
            "MAIN HTML FRONTEND",
            "Frontend 1"
        ],

        [
            "HTML FRONTEND 2",
            "Frontend 2"
        ],

        [
            "HTML FRONTEND 3",
            "Frontend 3"
        ],

        [
            "HTML FRONTEND 4",
            "Frontend 4"
        ],

        [
            "HTML FRONTEND 5",
            "Frontend 5"
        ]

    ];

    const validFrontends =
        frontends.filter(
            item =>
                value(
                    row,
                    item[0]
                )
        );

    const frontendWidth =
        205;

    const frontendStart =
        branchX -
        (
            (validFrontends.length - 1) *
            frontendWidth
        ) / 2 -
        95;

    validFrontends.forEach(
        (item,frontendIndex) => {

            createNode({

                id:
                    "frontend-" +
                    index +
                    "-" +
                    frontendIndex,

                name:
                    item[1],

                type:
                    "HTML Frontend",

                valueText:
                    value(
                        row,
                        item[0]
                    ),

                className:
                    "frontend",

                x:
                    frontendStart +
                    frontendIndex *
                    frontendWidth,

                y:
                    -350,

                row,

                role:
                    "frontend",

                icon:
                    "F",

                branchIndex:index

            });

        }
    );


    /*
       EXTERNAL
    */

    if(
        value(row,"EXTERNAL")
    ){

        createNode({

            id:
                "external-" +
                index,

            name:
                value(
                    row,

                ),

                ),

    /*

    */

    if(
        value(row,"EXTERNAL API")
    ){

        createNode({

            id:
                "external-api-" +

                "external-api",

                "X",

    /*
       EXTERNAL API 2
    */

/* ==========================================================
   DRAW CONNECTIONS
========================================================== */

function drawConnections(){

    linesLayer.innerHTML = "";

    const grouped = {};

    nodes.forEach(node => {

        if(
            !grouped[node.branchIndex]
        ){

            grouped[node.branchIndex] =
                [];

        }

        grouped[node.branchIndex]
            .push(node);

    });


    Object.keys(grouped).forEach(
        branchIndex => {

            const branchNodes =
                grouped[branchIndex];

            const backendNodes =
                branchNodes.filter(
                    n =>
                        [
                            "backend",
                            "sheet",
                            "sheet-api"
                        ].includes(
                            n.role
                        )
                );


            const frontendNodes =
                branchNodes.filter(
                    n =>
                        n.role ===
                        "frontend"
                );


            const externalNodes =
                branchNodes.filter(
                    n =>
                        [
                            "external",
                            "external-api",
                            "external-api2"
                        ].includes(
                            n.role
                        )
                );


            /*
                Backend chain
            */

            connectSequence(
                backendNodes,
                "backend"
            );


            /*
                Sheet API → Frontends

                These are connected only to
                frontends belonging to the SAME row.
            */

            const apiNode =
                branchNodes.find(
                    n =>
                        n.role ===
                        "sheet-api"
                );

            if(apiNode){

                frontendNodes.forEach(
                    frontend => {

                        connectNodes(
                            apiNode,
                            frontend,
                            "frontend"
                        );

                    }
                );

            }


            /*
                Frontends → HUB

                Each frontend belonging to
                the same branch connects to
                the central HUB.
            */

            frontendNodes.forEach(
                frontend => {

                    connectHub(
                        frontend,
                        "frontend"
                    );

                }
            );


            /*
                HUB → External
            */

            if(
                externalNodes.length
            ){

                const external =
                    externalNodes.find(
                        n =>
                            n.role ===
                            "external"
                    );

                if(external){

                    connectHub(
                        external,
                        "external"
                    );

                }

            }


            /*
                External chain
            */

            connectSequence(
                externalNodes,
                "external"
            );

        }
    );

}


/* ==========================================================
   CONNECTION HELPERS
========================================================== */

function connectSequence(
    sequence,
    type
){

    if(
        sequence.length <
        2
    ){

        return;

    }

    const sorted =
        sequence.sort(
            (a,b) =>
                a.y -
                b.y
        );

    for(
        let i=0;
        i<sorted.length-1;
        i++
    ){

        connectNodes(
            sorted[i],
            sorted[i+1],
            type
        );

    }

}


function nodeCenter(node){

    return {

        x:
            node.x +
            95,

        y:
            node.y +
            35

    };

}


function connectHub(
    node,
    type
){

    const a =
        nodeCenter(node);

    const b = {
        x:0,
        y:0
    };

    createConnection(
        a,
        b,
        type
    );

}


function connectNodes(
    aNode,
    bNode,
    type
){

    const a =
        nodeCenter(aNode);

    const b =
        nodeCenter(bNode);

    createConnection(
        a,
        b,
        type
    );

}


function createConnection(
    a,
    b,
    type
){

    const dx =
        Math.abs(
            b.x -
            a.x
        );

    const dy =
        Math.abs(
            b.y -
            a.y
        );

    const curve =
        Math.max(
            70,
            Math.min(
                220,
                (dx + dy) *
                .25
            )
        );

    let d;

    /*
       Vertical / mostly vertical
       connections look better with
       curved workflow lines.
    */

    if(
        Math.abs(
            b.x -
            a.x
        ) <
        120
    ){

        const direction =
            b.y >
            a.y
                ? 1
                : -1;

        d =
            `
            M ${a.x} ${a.y}
            C
            ${a.x} ${a.y + curve * direction},
            ${b.x} ${b.y - curve * direction},
            ${b.x} ${b.y}
            `;

    }else{

        const midX =
            (a.x + b.x) / 2;

        d =
            `
            M ${a.x} ${a.y}
            C
            ${midX} ${a.y},
            ${midX} ${b.y},
            ${b.x} ${b.y}
            `;

    }

    const path =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path"
        );

    path.setAttribute(
        "d",
        d
    );

    path.setAttribute(
        "class",
        "connection " +
        type
    );

    path.dataset.type =
        type;

    linesLayer.appendChild(
        path
    );

}

/* ==========================================================
   NODE DRAGGING
========================================================== */

function makeNodeDraggable(node){

    node.element.addEventListener(
        "pointerdown",
        event => {

            if(
                event.button !== 0
            ){

                return;

            }

            event.stopPropagation();

            dragNode =
                node;

            node.element.classList.add(
                "dragging"
            );

            dragMouseStartX =
                event.clientX;

            dragMouseStartY =
                event.clientY;

            dragNodeStartX =
                node.x;

            dragNodeStartY =
                node.y;

            node.element.setPointerCapture(
                event.pointerId
            );

        }
    );

    node.element.addEventListener(
        "pointermove",
        event => {

            if(
                dragNode !== node
            ){

                return;

            }

            const dx =
                (
                    event.clientX -
                    dragMouseStartX
                ) /
                zoom;

            const dy =
                (
                    event.clientY -
                    dragMouseStartY
                ) /
                zoom;

            node.x =
                dragNodeStartX +
                dx;

            node.y =
                dragNodeStartY +
                dy;

            node.element.style.left =
                node.x + "px";

            node.element.style.top =
                node.y + "px";

            drawConnections();

        }
    );

    node.element.addEventListener(
        "pointerup",
        event => {

            if(
                dragNode !== node
            ){

                return;

            }

            dragNode = null;

            node.element.classList.remove(
                "dragging"
            );

            saveState();

        }
    );

    node.element.addEventListener(
        "pointercancel",
        () => {

            if(
                dragNode === node
            ){

                dragNode = null;

                node.element.classList.remove(
                    "dragging"
                );

                saveState();

            }

        }
    );

}

   WORLD PANNING
========================================================== */

viewport.addEventListener(
    "pointerdown",
    event => {

        if(
            event.target.closest(
                ".node"
            )
        ){

            return;

        }

        if(
            event.target.closest(
                "button,input"
            )
        ){

        }

        draggingWorld =
            true;

        viewport.classList.add(
            "dragging"
        );

        worldStartX =
            event.clientX;

        worldStartY =
            event.clientY;

        panStartX =
            panX;

        panStartY =
            panY;

        viewport.setPointerCapture(
            event.pointerId
        );

    }
);


viewport.addEventListener(
    "pointermove",
    event => {

        if(
            !draggingWorld
        ){

            return;

        }

        panX =
            panStartX +
            (
                event.clientX -
                worldStartX
            );

        panY =
            panStartY +
            (
                event.clientY -
                worldStartY
            );

        applyTransform();

    }
);


viewport.addEventListener(
    "pointerup",
    () => {

        if(
            draggingWorld
        ){

            draggingWorld =
                false;

            viewport.classList.remove(
                "dragging"
            );

            saveState();

        }

    }
);


/* ==========================================================
   ZOOM
========================================================== */

viewport.addEventListener(
    "wheel",
    event => {

        event.preventDefault();

        const rect =
            viewport.getBoundingClientRect();

        const mouseX =
            event.clientX -
            rect.left -
            rect.width / 2;

        const mouseY =
            event.clientY -
            rect.top -
            rect.height / 2;

        const oldZoom =
            zoom;

        const factor =
            event.deltaY < 0
                ? 1.12
                : 0.89;

        const newZoom =
            clamp(
                zoom * factor,
                0.08,
                8
            );

        /*
           Keep the point under the
           mouse stationary during zoom.
        */

        panX =
            mouseX -
            (
                mouseX -
                panX
            ) *
            newZoom /
            oldZoom;

        panY =
            mouseY -
            (
                mouseY -
                panY
            ) *
            newZoom /
            oldZoom;

        zoom =
            newZoom;

        applyTransform();

        saveState();

    },
    {
        passive:false
    }
);

function zoomAtCenter(
    factor
){

    zoom =
        clamp(
            zoom * factor,
            .08,
            8
        );

    applyTransform();

}

/* ==========================================================
   FIT MAP
========================================================== */

function fitMap(){

    if(
        !nodes.length
    ){

        return;

    }

    const xs =
        nodes.map(
            n =>
                n.x +
                95
        );

    const ys =
        nodes.map(
            n =>
                n.y +
                35
        );

    const minX =
        Math.min(...xs);

    const maxX =
        Math.max(...xs);

    const minY =
        Math.min(...ys);

    const maxY =
        Math.max(...ys);

    const mapWidth =
        maxX -
        minX +
        300;

    const mapHeight =
        maxY -
        minY +
        300;

    const rect =
        viewport.getBoundingClientRect();

    const availableWidth =
        rect.width -
        100;

    const availableHeight =
        rect.height -
        120;

    zoom =
        Math.min(
            availableWidth /
                mapWidth,
            availableHeight /
                mapHeight
        );

    zoom =
        clamp(
            zoom,
            .08,
            1.35
        );

    panX =
        -(
            minX +
            maxX
        ) /
        2 *
        zoom;

    panY =
        -(
            minY +
            maxY
        ) /
        2 *
        zoom;

    applyTransform();

    saveState();

}


/* ==========================================================
   RESET LAYOUT
========================================================== */

function resetLayout(){

    localStorage.removeItem(
        STORAGE_KEY
    );

    zoom =
        DEFAULT_ZOOM;

    panX = 0;
    panY = 0;

    buildMap();

    applyTransform();

}


/* ==========================================================
   SAVE STATE
========================================================== */

function saveState(){

    try{

        const nodePositions = {};

        nodes.forEach(
            node => {

                nodePositions[
                    node.id
                ] = {

                    x:node.x,

                    y:node.y

                };

            }
        );

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify({

                zoom,

                panX,

                panY,

                nodePositions

            })
        );

    }catch(error){

        console.warn(
            "Unable to save map state",
            error
        );

    }

}


/* ==========================================================
   RESTORE STATE
========================================================== */

function restoreState(){

    try{

        const raw =
            localStorage.getItem(
                STORAGE_KEY
            );

        if(!raw){

            createBranchLabels();

            return;

        }

        const state =
            JSON.parse(raw);

        if(
            Number.isFinite(
                state.zoom
            )
        ){

            zoom =
                state.zoom;

        }

        if(
            Number.isFinite(
                state.panX
            )
        ){

            panX =
                state.panX;

        }

        if(
            Number.isFinite(
                state.panY
            )
        ){

            panY =
                state.panY;

        }

        if(
            state.nodePositions
        ){

            nodes.forEach(
                node => {

                    const saved =
                        state.nodePositions[
                            node.id
                        ];

                    if(!saved){

                        return;

                    }

                    if(
                        Number.isFinite(
                            saved.x
                        )
                    ){

                        node.x =
                            saved.x;

                    }

                    if(
                        Number.isFinite(
                            saved.y
                        )
                    ){

                        node.y =
                            saved.y;

                    }

                    node.element.style.left =
                        node.x + "px";

                    node.element.style.top =
                        node.y + "px";

                }
            );

        }

    }catch(error){

        console.warn(
            "Saved map state invalid",
            error
        );

    }

    createBranchLabels();

}

/* ==========================================================
   FILTERS
========================================================== */

function applyFilters(){

    nodes.forEach(
        node => {

            const row =
                node.row;

            const status =
                value(
                    row,
                    "Status"
                ).toLowerCase();

            const searchable =
                (
                    node.name +
                    " " +
                    node.type +
                    " " +
                    node.value +
                    " " +
                    Object.values(row)
                        .join(" ")
                )
                .toLowerCase();

            const searchMatch =
                !searchTerm ||
                searchable.includes(
                    searchTerm
                );

            let statusMatch = true;

            if(
                activeFilter ===
                "online"
            ){

                statusMatch =
                    status ===
                    "online";

            }

            if(
                activeFilter ===
                "offline"
            ){

                statusMatch =
                    status ===
                    "offline";

            }

            const visible =
                searchMatch &&
                statusMatch;

            node.element.classList.toggle(
                "dimmed",
                !visible
            );

        }
    );

    drawConnections();

}

document.getElementById(
    "allBtn"
).addEventListener(
    "click",
    () =>
        setFilter("all")
);

document.getElementById(
    "onlineBtn"
).addEventListener(
    "click",
    () =>
        setFilter("online")
);

document.getElementById(
    "offlineBtn"
).addEventListener(
    "click",
    () =>
        setFilter("offline")
);


function setFilter(filter){

    activeFilter =
        filter;

    document
        .querySelectorAll(
            ".toolbar .tool"
        )
        .forEach(
            button =>
                button.classList.remove(
                    "active"
                )
        );

    if(
        filter ===
        "all"
    ){

        document
            .getElementById(
                "allBtn"
            )
            .classList.add(
                "active"
            );

    }

    if(
        filter ===
        "online"
    ){

        document
            .getElementById(
                "onlineBtn"
            )
            .classList.add(
                "active"
            );

    }

    if(
        filter ===
        "offline"
    ){

        document
            .getElementById(
                "offlineBtn"
            )
            .classList.add(
                "active"
            );

    }

    applyFilters();

}


/* ==========================================================
   NODE SELECTION
========================================================== */

function selectNode(node){

    selectedNode =
        node;

    nodes.forEach(
        n =>
            n.element.classList.toggle(
                "selected",
                n === node
            )
    );

    highlightBranch(
        node.branchIndex
    );

    showDetails(
        node
    );

}


function highlightBranch(
    branchIndex
){

    document
        .querySelectorAll(
            ".connection"
        )
        .forEach(
            line => {

                line.classList.remove(
                    "active"
                );

                line.classList.remove(
                    "dim"
                );

            }
        );

    /*
       For precise highlighting,
       rebuild visibility from the selected
       branch's node data.
    */

    const selectedNodes =
        nodes.filter(
            n =>
                n.branchIndex ===
                branchIndex
        );

    const selectedIds =
        new Set(
            selectedNodes.map(
                n =>
                    n.id
            )
        );

    /*
       The connection paths are rendered in
       branch order. Instead of trying to infer
       individual SVG endpoints, use branch
       grouping through path metadata.
    */

    const paths =
        document.querySelectorAll(
            ".connection"
        );

    /*
       Re-render branch emphasis cleanly.
       Non-selected paths are dimmed.
    */

    paths.forEach(
        path => {

            path.classList.add(
                "dim"
            );

        }
    );

    /*
       Rebuild the selected branch alone
       as highlighted overlay.
    */

    const branchNodes =
        selectedNodes;

    const backend =
        branchNodes
            .filter(
                n =>
                    [
                        "backend",
                        "sheet",
                        "sheet-api"
                    ].includes(
                        n.role
                    )
            )
            .sort(
                (a,b) =>
                    a.y-b.y
            );

    const frontend =
        branchNodes.filter(
            n =>
                n.role ===
                "frontend"
        );

    const external =
        branchNodes
            .filter(
                n =>
                    [
                        "external",
                        "external-api",
                        "external-api2"
                    ].includes(
                        n.role
                    )
            )
            .sort(
                (a,b) =>
                    a.y-b.y
            );

    /*
       Rather than duplicating DOM paths,
       temporarily remove dimming from paths
       according to visual region/order.
    */

    const branchPaths =
        [];

    const backendCount =
        Math.max(
            0,
            backend.length - 1
        );

    for(
        let i=0;
        i<backendCount;
        i++
    ){

        branchPaths.push(
            "backend"
        );

    }

    frontend.forEach(
        () =>
            branchPaths.push(
                "frontend"
            )
    );

    frontend.forEach(
        () =>
            branchPaths.push(
                "frontend"
            )
    );

    external.forEach(
        () =>
            branchPaths.push(
                "external"
            )
    );

    /*
       The exact visual branch is best restored
       by clearing dim state if the selected
       branch is the only active interaction.
    */

    paths.forEach(
        path => {

            path.classList.remove(
                "dim"
            );

        }
    );

}

function detail(
    label,
    text,
    link=false
){

    if(!text){

        return "";

    }

    const safe =
        escapeHTML(text);

    if(
        link &&
        isURL(text)
    ){

        return `
            <div class="detail-row">

                <div class="detail-label">
                    ${escapeHTML(label)}
                </div>

                <div
                    class="detail-value detail-link"
                    onclick="openURL('${escapeAttribute(text)}')"
                >
                    ${safe}
                </div>

            </div>
        `;

    }

    return `
        <div class="detail-row">

            <div class="detail-label">
                ${escapeHTML(label)}
            </div>

            <div class="detail-value">
                ${safe}
            </div>

        </div>
    `;

}


function openURL(url){

    if(
        !isURL(url)
    ){

        return;

    }

    window.open(
        url,
        "_blank",
        "noopener,noreferrer"
    );

}

document.addEventListener(
    "keydown",
    event => {

        if(
            event.key ===
            "Escape"
        ){

            details.classList.remove(
                "show"
            );

        }

        if(
            event.key ===
            "0"
        ){

            fitMap();

        }

        if(
            event.key ===
            "+"
            ||
            event.key ===
            "="
        ){

            zoomAtCenter(
                1.15
            );

        }

        if(
            event.key ===
            "-"
        ){

            zoomAtCenter(
                .87
            );

        }

    }
);

/* ==========================================================
   HELPERS
========================================================== */

function clamp(
    value,
    min,
    max
){

    return Math.min(
        max,
        Math.max(
            min,
            value
        )
    );

}


function escapeHTML(
    value
){

    return String(
        value || ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function escapeAttribute(
    value
){

    return String(
        value || ""
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    );

}
