<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Obvyris Server Map</title>

<style>
:root{
    --bg:#07101c;
    --panel:#0d1827;
    --panel2:#111f31;
    --line:#263a52;
    --text:#f4f7fb;
    --muted:#8fa4bd;
    --blue:#2793ff;
    --green:#20c997;
    --red:#ff5d6c;
    --orange:#ffad42;
    --purple:#9b7bff;
    --cyan:#32d7ff;
}

*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,Arial,sans-serif;
}

body{
    display:flex;
    flex-direction:column;
}

/* =========================
   TOP BAR
========================= */

.topbar{
    height:64px;
    min-height:64px;
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 16px;
    background:#091522;
    border-bottom:1px solid var(--line);
    z-index:20;
}

.brand{
    font-size:20px;
    font-weight:800;
    letter-spacing:.4px;
    white-space:nowrap;
}

.brand span{
    color:var(--blue);
}

.search{
    width:300px;
    max-width:35vw;
    height:40px;
    border:1px solid var(--line);
    border-radius:9px;
    background:#0a1421;
    color:white;
    padding:0 13px;
    outline:none;
}

.search:focus{
    border-color:var(--blue);
}

.toolbar{
    margin-left:auto;
    display:flex;
    gap:7px;
}

button{
    border:1px solid var(--line);
    background:var(--panel);
    color:white;
    border-radius:8px;
    padding:9px 12px;
    cursor:pointer;
}

button:hover{
    background:var(--panel2);
    border-color:#3c5674;
}

.status{
    font-size:12px;
    color:var(--muted);
    white-space:nowrap;
}

/* =========================
   MAP
========================= */

#viewport{
    position:relative;
    flex:1;
    overflow:hidden;
    background:
        radial-gradient(circle at center,#112238 0%,#07101c 48%,#050b13 100%);
}

#world{
    position:absolute;
    left:50%;
    top:50%;
    width:1px;
    height:1px;
    transform-origin:0 0;
}

/* =========================
   GRID
========================= */

.grid{
    position:absolute;
    width:100000px;
    height:100000px;
    left:-50000px;
    top:-50000px;

    background-image:
        linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);

    background-size:50px 50px;
    pointer-events:none;
}

/* =========================
   CONNECTIONS
========================= */

#connections{
    position:absolute;
    left:-50000px;
    top:-50000px;
    width:100000px;
    height:100000px;
    pointer-events:none;
    overflow:visible;
}

.connection{
    fill:none;
    stroke:#314964;
    stroke-width:2;
    opacity:.75;
}

.connection.backend{
    stroke:var(--blue);
}

.connection.frontend{
    stroke:var(--green);
}

.connection.external{
    stroke:var(--orange);
}

/* =========================
   NODES
========================= */

.node{
    position:absolute;
    width:180px;
    min-height:72px;
    transform:translate(-50%,-50%);
    border:1px solid var(--line);
    border-radius:12px;
    background:rgba(13,24,39,.97);
    box-shadow:0 12px 35px rgba(0,0,0,.35);
    cursor:grab;
    user-select:none;
    z-index:5;
}

.node:active{
    cursor:grabbing;
}

.node:hover{
    border-color:#55708e;
    box-shadow:0 15px 45px rgba(0,0,0,.55);
}

.node.selected{
    border-color:white;
    box-shadow:0 0 0 2px rgba(39,147,255,.35),
               0 18px 50px rgba(0,0,0,.6);
}

.node-head{
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 11px 5px;
}

.dot{
    width:9px;
    height:9px;
    border-radius:50%;
    flex:none;
}

.dot.backend{
    background:var(--blue);
}

.dot.frontend{
    background:var(--green);
}

.dot.external{
    background:var(--orange);
}

.dot.hub{
    background:var(--purple);
}

.node-title{
    font-size:13px;
    font-weight:750;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.node-body{
    padding:2px 11px 10px;
    color:var(--muted);
    font-size:10px;
    line-height:1.4;
}

.node-type{
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:1px;
    color:#66819d;
}

/* =========================
   HUB
========================= */

#hub{
    position:absolute;
    width:190px;
    height:190px;
    left:0;
    top:0;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:
        radial-gradient(circle,#162d48 0%,#0c1c2f 55%,#081321 100%);
    border:2px solid var(--purple);
    box-shadow:
        0 0 0 10px rgba(155,123,255,.06),
        0 0 60px rgba(155,123,255,.25),
        0 25px 80px rgba(0,0,0,.6);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    z-index:10;
    pointer-events:none;
}

.hub-title{
    font-size:24px;
    font-weight:900;
    letter-spacing:1px;
}

.hub-sub{
    margin-top:5px;
    color:var(--muted);
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
}

/* =========================
   SIDE PANEL
========================= */

#details{
    position:absolute;
    right:16px;
    top:80px;
    width:330px;
    max-height:calc(100vh - 100px);
    overflow:auto;
    background:rgba(9,19,31,.96);
    border:1px solid var(--line);
    border-radius:12px;
    box-shadow:0 20px 70px rgba(0,0,0,.5);
    padding:16px;
    z-index:30;
    display:none;
}

#details.show{
    display:block;
}

.details-title{
    font-size:18px;
    font-weight:800;
    margin-bottom:4px;
}

.details-type{
    color:var(--muted);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1px;
    margin-bottom:16px;
}

.detail-row{
    border-top:1px solid #1d2d41;
    padding:10px 0;
}

.detail-label{
    color:#728aa4;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:.8px;
    margin-bottom:4px;
}

.detail-value{
    font-size:12px;
    line-height:1.45;
    word-break:break-word;
}

.detail-value a{
    color:var(--cyan);
    text-decoration:none;
}

.detail-value a:hover{
    text-decoration:underline;
}

.close{
    float:right;
    border:0;
    background:transparent;
    padding:2px 6px;
    font-size:20px;
}

/* =========================
   LEGEND
========================= */

.legend{
    position:absolute;
    left:16px;
    bottom:16px;
    background:rgba(9,19,31,.9);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 12px;
    z-index:20;
    font-size:11px;
}

.legend-row{
    display:flex;
    align-items:center;
    gap:7px;
    margin:5px 0;
}

/* =========================
   ZOOM
========================= */

.zoom{
    position:absolute;
    left:16px;
    top:80px;
    display:flex;
    flex-direction:column;
    gap:5px;
    z-index:20;
}

.zoom button{
    width:40px;
    height:40px;
    padding:0;
    font-size:20px;
}

/* =========================
   LOADING
========================= */

#loading{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#07101c;
    z-index:100;
}

.loader{
    text-align:center;
}

.loader strong{
    display:block;
    font-size:22px;
    margin-bottom:8px;
}

.loader span{
    color:var(--muted);
    font-size:12px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:800px){

    .search{
        width:170px;
    }

    .status{
        display:none;
    }

    #details{
        width:calc(100vw - 32px);
    }

    .node{
        width:160px;
    }

}
</style>

</head>

<body>

<header class="topbar">

```
<div class="brand">
    <span>OBVYRIS</span> SERVER MAP
</div>

<input
    id="search"
    class="search"
    type="search"
    placeholder="Search backend, frontend, API..."
>

<div class="toolbar">
    <button id="resetBtn">Reset View</button>
    <button id="fitBtn">Fit Map</button>
    <button id="reloadBtn">Reload</button>
</div>

<div id="statusText" class="status">
    Connecting...

</header>

<main id="viewport">

```
<div id="loading">
    <div class="loader">
        <strong>Obvyris Server Map</strong>

</div>

<div id="world">

    <svg id="connections"

         preserveAspectRatio="none">

</main>

<script>

/* ============================================================
   CONFIGURATION
============================================================ */

const MAP_API =
"https://script.google.com/macros/s/AKfycbxmet73uElazLhNTF6K9Ziizu4hbgq7VWbXJ8nKjSeXkn-tN4CyoBDjSdeK69A_J5XG/exec";


/* ============================================================
   STATE
============================================================ */

let data = {
    backends:[],
    frontends:[],
    externals:[],
    links:[]
};

let nodes = [];

let scale = 1;

let offsetX = 0;
let offsetY = 0;

let draggingWorld = false;

let panStartX = 0;
let panStartY = 0;

let startOffsetX = 0;
let startOffsetY = 0;

const STORAGE_KEY =
"obvyris-server-map-view";


/* ============================================================
   ELEMENTS
============================================================ */

const viewport =
document.getElementById("viewport");

const world =
document.getElementById("world");

const nodesContainer =
document.getElementById("nodes");

const connections =
document.getElementById("connections");

const loading =
document.getElementById("loading");

const statusText =
document.getElementById("statusText");

const details =
document.getElementById("details");

const detailsContent =
document.getElementById("detailsContent");


/* ============================================================
   INITIAL VIEW
============================================================ */

function loadView(){

    try{

        const saved =
            JSON.parse(
                localStorage.getItem(STORAGE_KEY)
            );

        if(saved){

            scale =
                Number(saved.scale) || 1;

            offsetX =
                Number(saved.offsetX) || 0;

            offsetY =
                Number(saved.offsetY) || 0;

            applyTransform();

            return;
        }

    }catch(e){}

    centerView();

}


function saveView(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify({
            scale,
            offsetX,
            offsetY
        })
    );

}


function centerView(){

    scale = 1;

    offsetX = 0;

    offsetY = 0;

    applyTransform();

    saveView();

}


function applyTransform(){

    world.style.transform =
        `translate(${offsetX}px,${offsetY}px) scale(${scale})`;

}


/* ============================================================
   FETCH MAP
============================================================ */

async function loadMap(){

    loading.style.display = "flex";

    statusText.textContent =
        "Loading map...";

    try{

        const response =
            await fetch(
                MAP_API +
                "?action=map&_=" +
                Date.now(),
                {
                    cache:"no-store"
                }
            );

        if(!response.ok){
            throw new Error(
                "HTTP " + response.status
            );
        }

        const json =
            await response.json();

        normalizeData(json);

        renderMap();

        loading.style.display = "none";

        statusText.textContent =
            `${nodes.length} nodes loaded`;

    }catch(error){

        console.error(error);

        statusText.textContent =
            "Map API error";

        loading.innerHTML = `
            <div class="loader">
                <strong>Unable to load map</strong>
                <span>${escapeHtml(error.message)}</span>
                <br><br>
                <button onclick="loadMap()">
                    Try Again
                </button>
            </div>
        `;

    }

}


/* ============================================================
   NORMALIZE API DATA
============================================================ */

function normalizeData(json){

    /*
       Supports either:

       {
          backends:[],
          frontends:[],
          externals:[],
          links:[]
       }

       OR a generic:

       {
          rows:[]
       }
    */

    if(
        json &&
        (
            json.backends ||
            json.frontends ||
            json.externals
        )
    ){

        data.backends =
            json.backends || [];

        data.frontends =
            json.frontends || [];

        data.externals =
            json.externals || [];

        data.links =
            json.links || [];

        return;
    }


    const rows =
        Array.isArray(json.rows)
            ? json.rows
            : Array.isArray(json)
                ? json
                : [];


    data.backends = [];

    data.frontends = [];

    data.externals = [];

    data.links = [];


    rows.forEach(row => {

        const backend =
            clean(row["Backends Sheet"]);

        if(backend){

            data.backends.push({
                id:"backend-" + clean(row.ID),
                name:backend,
                type:"backend",
                data:row
            });

        }


        const frontendFields = [
            "MAIN HTML FRONTEND",
            "HTML FRONTEND 2",
            "HTML FRONTEND 3",
            "HTML FRONTEND 4",
            "HTML FRONTEND 5"
        ];


        frontendFields.forEach(
            (field,index) => {

                const url =
                    clean(row[field]);

                if(!url) return;

                data.frontends.push({

                    id:
                        "frontend-" +
                        clean(row.ID) +
                        "-" +
                        index,

                    name:
                        getPageName(url),

                    url,

                    type:"frontend",

                    backend:
                        backend,

                    data:row

                });

            }
        );


        const external =
            clean(row.EXTERNAL);

        const api =
            clean(row["EXTERNAL API"]);

        const api2 =
            clean(row["EXTERNAL API 2"]);


        if(external || api || api2){

            if(external){

                data.externals.push({
                    id:
                        "external-" +
                        clean(row.ID),

                    name:external,

                    type:"external",

                    url:api,

                    data:row

                });

            }

            if(api && !external){

                data.externals.push({
                    id:
                        "external-api-" +
                        clean(row.ID),

                    name:
                        getPageName(api),

                    type:"external",

                    url:api,

                    data:row

                });

            }

            if(api2){

                data.externals.push({
                    id:
                        "external-api2-" +
                        clean(row.ID),

                    name:
                        getPageName(api2),

                    type:"external",

                    url:api2,

                    data:row

                });

            }

        }

    });

}


/* ============================================================
   RENDER
============================================================ */

function renderMap(){

    nodesContainer.innerHTML = "";

    while(
        connections.firstChild
    ){
        connections.removeChild(
            connections.firstChild
        );
    }


    nodes = [];


    /*
       BACKENDS
       North / upper arc
    */

    data.backends.forEach(
        (item,index) => {

            const pos =
                radialPosition(
                    index,
                    data.backends.length,
                    520,
                    Math.PI * 1.15,
                    Math.PI * 1.85
                );

            createNode(
                item,
                pos.x,
                pos.y
            );

        }
    );


    /*
       FRONTENDS
       Middle / outer branches
    */

    data.frontends.forEach(
        (item,index) => {

            const pos =
                radialPosition(
                    index,
                    data.frontends.length,
                    850,
                    Math.PI * .15,
                    Math.PI * .85
                );

            createNode(
                item,
                pos.x,
                pos.y
            );

        }
    );


    /*
       EXTERNALS
       South arc
    */

    data.externals.forEach(
        (item,index) => {

            const pos =
                radialPosition(
                    index,
                    data.externals.length,
                    850,
                    Math.PI * 1.15,
                    Math.PI * 1.85
                );

            createNode(
                item,
                pos.x,
                pos.y
            );

        }
    );


    /*
       Draw connections only AFTER
       every node has been created.
    */

    drawConnections();

}


/* ============================================================
   RADIAL POSITION
============================================================ */

function radialPosition(
    index,
    total,
    radius,
    startAngle,
    endAngle
){

    if(total <= 1){

        const angle =
            (startAngle + endAngle) / 2;

        return {
            x:Math.cos(angle) * radius,
            y:Math.sin(angle) * radius
        };

    }

    const angle =
        startAngle +
        (endAngle - startAngle) *
        (index / (total - 1));

    return {
        x:
            Math.cos(angle) *
            radius,

        y:
            Math.sin(angle) *
            radius
    };

}


/* ============================================================
   CREATE NODE
============================================================ */

function createNode(
    item,
    x,
    y
){

    const element =
        document.createElement("div");

    element.className =
        "node";

    element.dataset.id =
        item.id;

    element.dataset.type =
        item.type;


    element.style.left =
        x + "px";

    element.style.top =
        y + "px";


    element.innerHTML = `

        <div class="node-head">

            <span class="dot ${item.type}"></span>

            <div class="node-title">
                ${escapeHtml(item.name || "Unnamed")}
            </div>

        </div>

        <div class="node-body">

            <div class="node-type">
                ${escapeHtml(item.type)}
            </div>

            ${
                item.url
                ?
                escapeHtml(
                    shorten(item.url,55)
                )
                :
                ""
            }

        </div>

    `;


    nodesContainer.appendChild(
        element
    );


    const node = {

        id:item.id,

        type:item.type,

        item,

        element,

        x,

        y

    };


    nodes.push(node);


    makeDraggable(node);


    element.addEventListener(
        "click",
        event => {

            event.stopPropagation();

            selectNode(node);

        }
    );

}


/* ============================================================
   DRAG NODES
============================================================ */

function makeDraggable(node){

    let dragging = false;

    let startX = 0;

    let startY = 0;

    let originalX = 0;

    let originalY = 0;


    node.element.addEventListener(
        "pointerdown",
        event => {

            dragging = true;

            node.element.setPointerCapture(
                event.pointerId
            );

            startX =
                event.clientX;

            startY =
                event.clientY;

            originalX =
                node.x;

            originalY =
                node.y;

            node.element.style.cursor =
                "grabbing";

        }
    );


    node.element.addEventListener(
        "pointermove",
        event => {

            if(!dragging) return;

            const dx =
                (event.clientX - startX) /
                scale;

            const dy =
                (event.clientY - startY) /
                scale;

            node.x =
                originalX + dx;

            node.y =
                originalY + dy;


            node.element.style.left =
                node.x + "px";

            node.element.style.top =
                node.y + "px";


            drawConnections();

        }
    );


    node.element.addEventListener(
        "pointerup",
        () => {

            dragging = false;

            node.element.style.cursor =
                "grab";

        }
    );

}


/* ============================================================
   CONNECTIONS
============================================================ */

function drawConnections(){

    while(
        connections.firstChild
    ){
        connections.removeChild(
            connections.firstChild
        );
    }


    nodes.forEach(node => {

        if(node.type === "backend"){

            drawLine(
                0,
                0,
                node.x,
                node.y,
                "backend"
            );

        }

    });


    /*
       Frontends are connected to the
       backend that owns their row.
    */

    nodes
        .filter(
            node =>
                node.type === "frontend"
        )
        .forEach(frontend => {

            const backendName =
                clean(
                    frontend.item.backend
                );


            const backend =
                nodes.find(
                    node =>
                        node.type === "backend" &&
                        clean(node.item.name) ===
                        backendName
                );


            if(backend){

                drawLine(
                    backend.x,
                    backend.y,
                    frontend.x,
                    frontend.y,
                    "frontend"
                );

            }else{

                drawLine(
                    0,
                    0,
                    frontend.x,
                    frontend.y,
                    "frontend"
                );

            }

        });


    /*
       External connections belong to
       their corresponding backend row.
    */

    nodes
        .filter(
            node =>
                node.type === "external"
        )
        .forEach(external => {

            const backendName =
                clean(
                    external.item[
                        "Backends Sheet"
                    ]
                );


            const backend =
                nodes.find(
                    node =>
                        node.type === "backend" &&
                        clean(node.item.name) ===
                        backendName
                );


            if(backend){

                drawLine(
                    backend.x,
                    backend.y,
                    external.x,
                    external.y,
                    "external"
                );

            }else{

                drawLine(
                    0,
                    0,
                    external.x,
                    external.y,
                    "external"
                );

            }

        });

}


function drawLine(
    x1,
    y1,
    x2,
    y2,
    type
){

    const path =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path"
        );


    const bend =
        Math.max(
            80,
            Math.abs(x2-x1) * .25
        );


    const d =
        `
        M ${50000+x1} ${50000+y1}
        C
        ${50000+x1} ${50000+y1+bend}
        ${50000+x2} ${50000+y2-bend}
        ${50000+x2} ${50000+y2}
        `;


    path.setAttribute(
        "d",
        d
    );

    path.classList.add(
        "connection",
        type
    );


    connections.appendChild(
        path
    );

}


/* ============================================================
   NODE DETAILS
============================================================ */

function selectNode(node){

    document
        .querySelectorAll(".node.selected")
        .forEach(
            el =>
                el.classList.remove("selected")
        );


    node.element.classList.add(
        "selected"
    );


    const row =
        node.item.data || {};


    let html = `

        <div class="details-title">
            ${escapeHtml(
                node.item.name || "Unnamed"
            )}
        </div>

        <div class="details-type">
            ${escapeHtml(node.type)}
        </div>

    `;


    const entries =
        Object.entries(row);


    entries.forEach(
        ([key,value]) => {

            value =
                clean(value);

            if(!value) return;

            let rendered =
                escapeHtml(value);


            if(isUrl(value)){

                rendered =
                    `
                    <a
                        href="${escapeAttribute(value)}"
                        target="_blank"
                        rel="noopener"
                    >
                        ${escapeHtml(
                            shorten(value,120)
                        )}
                    </a>
                    `;

            }


            html += `

                <div class="detail-row">

                    <div class="detail-label">
                        ${escapeHtml(key)}
                    </div>

                    <div class="detail-value">
                        ${rendered}
                    </div>

                </div>

            `;

        }
    );


    if(node.item.url){

        html += `

            <div class="detail-row">

                <div class="detail-label">
                    Open Resource
                </div>

                <div class="detail-value">

                    <a
                        href="${escapeAttribute(node.item.url)}"
                        target="_blank"
                        rel="noopener"
                    >
                        Open
                    </a>

                </div>

            </div>

        `;

    }


    detailsContent.innerHTML =
        html;

    details.classList.add(
        "show"
    );

}


/* ============================================================
   SEARCH
============================================================ */

document
.getElementById("search")
.addEventListener(
    "input",
    function(){

        const term =
            this.value
                .trim()
                .toLowerCase();


        nodes.forEach(node => {

            const text =
                JSON.stringify(
                    node.item
                ).toLowerCase();


            const match =
                !term ||
                text.includes(term);


            node.element.style.opacity =
                match ? "1" : ".12";


            node.element.style.pointerEvents =
                match ? "auto" : "none";

        });

    }
);


/* ============================================================
   ZOOM
============================================================ */

function zoomAt(
    factor,
    clientX,
    clientY
){

    const rect =
        viewport.getBoundingClientRect();


    const mx =
        clientX - rect.left -
        rect.width / 2;

    const my =
        clientY - rect.top -
        rect.height / 2;


    const oldScale =
        scale;


    const newScale =
        Math.min(
            20,
            Math.max(
                .08,
                scale * factor
            )
        );


    const worldX =
        (mx - offsetX) /
        oldScale;

    const worldY =
        (my - offsetY) /
        oldScale;


    scale =
        newScale;


    offsetX =
        mx -
        worldX * scale;


    offsetY =
        my -
        worldY * scale;


    applyTransform();

    saveView();

}


document
.getElementById("zoomIn")
.addEventListener(
    "click",
    () =>
        zoomAt(
            1.25,
            viewport.clientWidth/2,
            viewport.clientHeight/2
        )
);


document
.getElementById("zoomOut")
.addEventListener(
    "click",
    () =>
        zoomAt(
            .8,
            viewport.clientWidth/2,
            viewport.clientHeight/2
        )
);


document
.getElementById("zoomReset")
.addEventListener(
    "click",
    () => {

        scale = 1;

        applyTransform();

        saveView();

    }
);


/* ============================================================
   MOUSE WHEEL ZOOM
============================================================ */

viewport.addEventListener(
    "wheel",
    event => {

        event.preventDefault();

        zoomAt(
            event.deltaY < 0
                ? 1.12
                : .89,
            event.clientX,
            event.clientY
        );

    },
    {
        passive:false
    }
);


/* ============================================================
   PAN
============================================================ */

viewport.addEventListener(
    "pointerdown",
    event => {

        if(
            event.target.closest(".node") ||
            event.target.closest("button") ||
            event.target.closest("#details")
        ){
            return;
        }


        draggingWorld = true;

        panStartX =
            event.clientX;

        panStartY =
            event.clientY;

        startOffsetX =
            offsetX;

        startOffsetY =
            offsetY;


        viewport.setPointerCapture(
            event.pointerId
        );

    }
);


viewport.addEventListener(
    "pointermove",
    event => {

        if(!draggingWorld) return;


        offsetX =
            startOffsetX +
            event.clientX -
            panStartX;


        offsetY =
            startOffsetY +
            event.clientY -
            panStartY;


        applyTransform();

    }
);


viewport.addEventListener(
    "pointerup",
    () => {

        if(!draggingWorld) return;

        draggingWorld = false;

        saveView();

    }
);

/* ============================================================
   FIT MAP
============================================================ */

function fitMap(){

    if(!nodes.length) return;


    let minX = 0;
    let maxX = 0;
    let minY = 0;
    let maxY = 0;


    nodes.forEach(node => {

        minX =
            Math.min(
                minX,
                node.x
            );

        maxX =
            Math.max(
                maxX,
                node.x
            );

        minY =
            Math.min(
                minY,
                node.y
            );

        maxY =
            Math.max(
                maxY,
                node.y
            );

    });


    const width =
        maxX - minX + 500;

    const height =
        maxY - minY + 500;


    const vw =
        viewport.clientWidth;

    const vh =
        viewport.clientHeight;


    scale =
        Math.min(
            1,
            Math.min(
                vw / width,
                vh / height
            )
        );


    offsetX =
        -(minX + maxX) / 2 * scale;


    offsetY =
        -(minY + maxY) / 2 * scale;


    applyTransform();

    saveView();

}


/* ============================================================
   HELPERS
============================================================ */

function clean(value){

    if(
        value === null ||
        value === undefined
    ){
        return "";
    }

    return String(value).trim();

}


function escapeHtml(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


function escapeAttribute(value){

    return escapeHtml(value);

}


function isUrl(value){

    return /^https?:\/\//i.test(
        String(value)
    );

}


function shorten(
    value,
    length
){

    value =
        String(value);

    if(
        value.length <= length
    ){
        return value;
    }

    return (
        value.substring(
            0,
            length - 3
        ) + "..."
    );

}


function getPageName(url){

    try{

        const parsed =
            new URL(url);

        let name =
            parsed.pathname
                .split("/")
                .filter(Boolean)
                .pop();


        if(!name){
            return parsed.hostname;
        }


        return decodeURIComponent(
            name
        );

    }catch(e){

        return shorten(
            url,
            35
        );

    }

}
