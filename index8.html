<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Obvyris Media OS v2.3</title>

<meta name="theme-color" content="#2793ff">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="https://mikos5.github.io/tester/navicon.png">

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root{
  --bg:#0b0f18;
  --panel:#111827;
  --text:#fff;
  --muted:#94a3b8;
  --blue:#2793ff;
}

body{
  margin:0;
  font-family:Arial;
  background:var(--bg);
  color:var(--text);
  display:flex;
  height:100vh;
  overflow:hidden;
}

/* SIDEBAR */
.sidebar{
  width:320px;
  background:var(--panel);
  overflow:auto;
  padding:10px;
}

.title{font-size:22px;font-weight:900}

button{
  padding:10px;
  border:none;
  border-radius:8px;
  background:var(--blue);
  color:#fff;
  font-weight:700;
  cursor:pointer;
}

.mode{display:flex;gap:10px;margin:10px 0}

/* MAIN */
.main{
  flex:1;
  overflow:auto;
}

video{
  width:100%;
  height:55vh;
  background:black;
}

/* CARD */
.card{
  background:var(--panel);
  margin:6px;
  padding:10px;
  border-radius:10px;
  cursor:pointer;
  border:1px solid #222;
}

/* INFINITE SCROLL BUFFER */
#sentinel{
  height:60px;
}
</style>
</head>

<body>

<div class="sidebar">
  <div class="title">📡 Obvyris OS v2.3</div>

  <div class="mode">
    <button onclick="setMode('video')">📺 Video</button>
    <button onclick="setMode('radio')">📻 Radio</button>
    <button onclick="setMode('sheet')">📡 Sheets</button>
  </div>

  <button onclick="toggleTheme()">🌙 Theme</button>

  <div id="list"></div>
</div>

<div class="main">

  <video id="video" controls autoplay></video>

  <div style="padding:10px;display:flex;gap:10px;">
    <button onclick="prev()">⏮</button>
    <button onclick="toggle()">▶</button>
    <button onclick="next()">⏭</button>
  </div>

</div>

<script>

/* ================= STATE ================= */
let mode="video";
let index=0;

let videoList=[];
let radioList=[];
let sheetList=[];
let feed=[];
let page=0;
const PAGE_SIZE=80;

const video=document.getElementById("video");

/* ================= M3U PARSER (FIXED NAMES) ================= */
async function loadVideo(){
  const res=await fetch("https://iptv-org.github.io/iptv/index.m3u");
  const text=await res.text();

  const lines=text.split("\n");
  let name="";

  videoList=[];

  for(let l of lines){
    if(l.startsWith("#EXTINF")){
      name=l.split(",")[1]||"Channel";
    }
    if(l.startsWith("http")){
      videoList.push({name,url:l.trim()});
    }
  }

  render();
}

/* ================= RADIO ================= */
async function loadRadio(){
  const res=await fetch("https://all.api.radio-browser.info/json/stations/search?limit=500");
  const data=await res.json();

  radioList=data.map(s=>({
    name:s.name,
    url:s.url_resolved,
    id:s.stationuuid
  }));

  render();
}

/* ================= SHEETS BLEND ================= */
const SHEET="https://script.google.com/macros/s/AKfycbzZ5MwOcYUY_bpsUKSxPd810xE8rV_Y3z2GwzPublb_4O60CP8L_lC_V2kqkCQ_JdF5/exec";

async function loadSheets(){
  const actions=[
    "get","mood","misc","international","undiscovered","international2","artistal","artistmz"
  ];

  sheetList=[];

  for(let a of actions){
    try{
      const res=await fetch(SHEET+"?action="+a);
      const json=await res.json();

      const arr=(json.data||json||[]).map(s=>({
        name:s.name,
        url:s.url,
        type:a,
        id:s.id
      }));

      sheetList.push(...arr);

    }catch(e){}
  }

  render();
}

/* ================= MODE ================= */
function setMode(m){
  mode=m;
  index=0;

  if(m==="video") loadVideo();
  if(m==="radio") loadRadio();
  if(m==="sheet") loadSheets();
}

/* ================= UNIFIED FEED ================= */
function getSource(){
  if(mode==="video") return videoList;
  if(mode==="radio") return radioList;
  return sheetList;
}

/* ================= VIRTUAL INFINITE RENDER ================= */
function render(reset=true){
  const el=document.getElementById("list");
  const arr=getSource();

  if(reset){
    el.innerHTML="";
    feed=[];
    page=0;
  }

  const start=page*PAGE_SIZE;
  const chunk=arr.slice(start,start+PAGE_SIZE);

  feed.push(...chunk);

  el.innerHTML="";

  feed.forEach((item,i)=>{
    const div=document.createElement("div");
    div.className="card";
    div.innerHTML=`${item.name}<br><small>${item.type||""}</small>`;
    div.onclick=()=>play(i);
    el.appendChild(div);
  });

  observeScroll();
}

/* ================= AUTO LOAD MORE ================= */
function observeScroll(){
  const main=document.querySelector(".main");

  main.onscroll=()=>{
    if(main.scrollTop+main.clientHeight>=main.scrollHeight-200){
      loadMore();
    }
  };
}

function loadMore(){
  const arr=getSource();

  if(feed.length>=arr.length) return;

  page++;
  const start=page*PAGE_SIZE;
  const chunk=arr.slice(start,start+PAGE_SIZE);

  feed.push(...chunk);
  render(false);
}

/* ================= PLAY ================= */
function play(i){
  index=i;

  const arr=getSource();
  const item=arr[i];
  if(!item) return;

  if(mode==="video"){
    if(item.url.includes(".m3u8") && Hls.isSupported()){
      const hls=new Hls();
      hls.loadSource(item.url);
      hls.attachMedia(video);
    }else{
      video.src=item.url;
    }
    video.play();
  }else{
    video.src=item.url;
    video.play();
  }
}

/* ================= CONTROLS ================= */
function next(){
  const arr=getSource();
  index=(index+1)%arr.length;
  play(index);
}

function prev(){
  const arr=getSource();
  index=(index-1+arr.length)%arr.length;
  play(index);
}

function toggle(){
  if(video.paused) video.play();
  else video.pause();
}

/* ================= THEME ================= */
function toggleTheme(){
  document.body.classList.toggle("light");
}
  
/* ================= INIT ================= */
loadVideo();

</script>

<!-- PWA SERVICE WORKER REGISTRATION (HERE) -->
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .then(() => console.log("PWA Ready"))
      .catch(err => console.error(err));
  });
}
</script>

</body>
</html>
