<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Obvyris Server Architecture Map</title>

<style>
:root{
    --bg:#050912;
    --panel:#0b1220;
    --panel2:#101a2b;
    --line:#26364f;
    --text:#f4f7fb;
    --muted:#91a0b7;
    --blue:#2793ff;
    --cyan:#36d9ff;
    --green:#38d996;
    --orange:#ffae42;
    --red:#ff5268;
    --purple:#a87cff;
    --shadow:0 14px 40px rgba(0,0,0,.45);
}

*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,
input{
    font:inherit;
}

/* =========================================================
   APP
========================================================= */

#app{
    width:100%;
    height:100%;
    position:relative;
    overflow:hidden;
}

/* =========================================================
   TOP BAR
========================================================= */

#topbar{
    position:absolute;
    z-index:1000;
    top:16px;
    left:16px;
    right:16px;
    height:62px;

    display:flex;
    align-items:center;
    gap:14px;

    padding:10px 14px;

    background:rgba(9,16,29,.94);
    border:1px solid #24334a;
    border-radius:16px;

    box-shadow:var(--shadow);
    backdrop-filter:blur(14px);
}

.brand{
    display:flex;
    align-items:center;
    gap:11px;
    min-width:230px;
}

.brandMark{
    width:38px;
    height:38px;
    border-radius:11px;

    display:grid;
    place-items:center;

    background:linear-gradient(145deg,#2793ff,#1454b8);
    box-shadow:0 0 24px rgba(39,147,255,.35);

    font-weight:900;
    font-size:17px;
}

.brandText strong{
    display:block;
    font-size:15px;
    letter-spacing:.7px;
}

.brandText span{
    display:block;
    margin-top:2px;
    color:var(--muted);
    font-size:11px;
}

.toolbar{
    display:flex;
    align-items:center;
    gap:7px;
    flex:1;
}

.tool{
    height:38px;
    padding:0 12px;

    color:#dce8f8;
    background:#101b2d;

    border:1px solid #293a53;
    border-radius:9px;

    cursor:pointer;
    transition:.15s;
}

.tool:hover{
    background:#17253b;
    border-color:#3d5a7e;
}

.tool.active{
    border-color:var(--blue);
    color:white;
    box-shadow:0 0 14px rgba(39,147,255,.18);
}

#search{
    width:220px;
    height:38px;

    padding:0 12px;

    color:white;
    background:#07101d;

    border:1px solid #293a53;
    border-radius:9px;

    outline:none;
}

#search:focus{
    border-color:var(--blue);
}

#stats{
    white-space:nowrap;
    color:var(--muted);
    font-size:12px;
}

/* =========================================================
   MAP
========================================================= */

#viewport{
    position:absolute;
    inset:0;

    overflow:hidden;

    cursor:grab;

    background:
        radial-gradient(circle at center,rgba(39,147,255,.055),transparent 34%),
        #050912;
}

#viewport.dragging{
    cursor:grabbing;
}

#world{
    position:absolute;
    left:0;
    top:0;

    width:10000px;
    height:10000px;

    transform-origin:0 0;
}

/* grid */

#grid{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    background-image:
        linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);

    background-size:80px 80px;
}

/* =========================================================
   CONNECTION SVG
========================================================= */

#connections{
    position:absolute;
    left:0;
    top:0;

    width:10000px;
    height:10000px;

    overflow:visible;

    pointer-events:none;
}

.connection{
    fill:none;
    stroke-width:2;
    opacity:.65;
    vector-effect:non-scaling-stroke;
}

.connection.backend{
    stroke:var(--blue);
}

.connection.frontend{
    stroke:var(--cyan);
    stroke-width:2.5;
}

.connection.external{
    stroke:var(--orange);
}

.connection.api{
    stroke:var(--purple);
}

.connection.highlight{
    stroke:white;
    stroke-width:4;
    opacity:1;
}

/* =========================================================
   NODE SYSTEM
========================================================= */

.node{
    position:absolute;

    width:190px;
    min-height:64px;

    padding:10px 12px;

    border-radius:12px;

    background:rgba(12,21,36,.97);
    border:1px solid #2b3d58;

    box-shadow:
        0 10px 28px rgba(0,0,0,.38),
        inset 0 1px rgba(255,255,255,.035);

    user-select:none;

    cursor:move;

    transition:
        border-color .15s,
        box-shadow .15s,
        opacity .15s;
}

.node:hover{
    border-color:#54739b;
    box-shadow:
        0 12px 32px rgba(0,0,0,.5),
        0 0 20px rgba(39,147,255,.08);
}

.node.selected{
    border-color:white;
    box-shadow:
        0 0 0 1px rgba(255,255,255,.15),
        0 0 25px rgba(39,147,255,.22);
}

.node.hidden{
    opacity:.12;
}

.nodeTitle{
    display:flex;
    align-items:center;
    gap:8px;

    font-size:12px;
    font-weight:800;

    line-height:1.3;
}

.nodeIcon{
    width:24px;
    height:24px;
    flex:none;

    display:grid;
    place-items:center;

    border-radius:7px;

    font-size:11px;
    font-weight:900;

    background:#17263c;
}

.nodeMeta{
    margin-top:5px;

    color:var(--muted);

    font-size:10px;
    line-height:1.35;

    word-break:break-word;
}

.nodeType{
    position:absolute;
    right:8px;
    top:8px;

    font-size:8px;
    text-transform:uppercase;
    letter-spacing:.7px;

    color:#6f819b;
}

/* node types */

.node.hub{
    width:230px;
    min-height:110px;

    border-radius:50%;

    padding:22px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;

    background:
        radial-gradient(circle at center,#143966,#09182c 68%);

    border:2px solid var(--blue);

    box-shadow:
        0 0 0 8px rgba(39,147,255,.035),
        0 0 45px rgba(39,147,255,.22),
        0 18px 50px rgba(0,0,0,.5);

    cursor:default;
}

.hub .nodeIcon{
    width:42px;
    height:42px;

    border-radius:50%;

    background:#2793ff;

    box-shadow:0 0 24px rgba(39,147,255,.5);

    font-size:15px;
}

.hub .nodeTitle{
    margin-top:8px;
    font-size:16px;
}

.hub .nodeMeta{
    color:#9ebce0;
}

.frontend{
    border-color:var(--cyan);
    background:
        linear-gradient(145deg,rgba(16,39,56,.98),rgba(9,20,34,.98));
}

.frontend .nodeIcon{
    background:#0e6178;
    color:#6fe9ff;
}

.backend{
    border-color:#356eb4;
}

.backend .nodeIcon{
    background:#12345d;
    color:#66adff;
}

.sheet{
    border-color:#39664e;
}

.sheet .nodeIcon{
    background:#123d2a;
    color:#59e09c;
}

.apiNode{
    border-color:#664f98;
}

.apiNode .nodeIcon{
    background:#322451;
    color:#c19dff;
}

.external{
    border-color:#876233;
}

.external .nodeIcon{
    background:#493316;
    color:#ffc36b;
}

/* =========================================================
   DETAILS PANEL
========================================================= */

#details{
    position:absolute;
    z-index:900;

    top:94px;
    right:16px;

    width:330px;
    max-height:calc(100vh - 110px);

    overflow:auto;

    padding:16px;

    background:rgba(8,15,27,.96);
    border:1px solid #263850;
    border-radius:16px;

    box-shadow:var(--shadow);
    backdrop-filter:blur(16px);

    transform:translateX(calc(100% + 30px));

    transition:.22s;
}

#details.open{
    transform:translateX(0);
}

.detailsHeader{
    display:flex;
    justify-content:space-between;
    gap:10px;

    margin-bottom:14px;
}

.detailsHeader strong{
    font-size:15px;
}

.close{
    width:28px;
    height:28px;

    border:1px solid #30435e;
    border-radius:7px;

    color:#b9c9dd;
    background:#101b2c;

    cursor:pointer;
}

.detailSection{
    margin-top:13px;
}

.detailLabel{
    color:#70839d;
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:1px;
    margin-bottom:5px;
}

.detailValue{
    color:#dce8f7;
    font-size:11px;
    line-height:1.45;
    word-break:break-word;
}

.detailLink{
    display:block;
    margin-top:5px;

    color:#63c7ff;
    text-decoration:none;

    font-size:10px;
}

.detailLink:hover{
    text-decoration:underline;
}

/* =========================================================
   LEGEND
========================================================= */

#legend{
    position:absolute;
    z-index:800;

    left:16px;
    bottom:16px;

    display:flex;
    flex-wrap:wrap;
    gap:7px;

    padding:9px 11px;

    background:rgba(8,15,27,.92);
    border:1px solid #263850;
    border-radius:11px;

    box-shadow:var(--shadow);
}

.legendItem{
    display:flex;
    align-items:center;
    gap:6px;

    color:#a9b9cc;
    font-size:10px;
}

.legendDot{
    width:8px;
    height:8px;
    border-radius:50%;
}

.legendDot.hub{
    background:var(--blue);
}

.legendDot.frontend{
    background:var(--cyan);
}

.legendDot.backend{
    background:var(--blue);
}

.legendDot.sheet{
    background:var(--green);
}

.legendDot.api{
    background:var(--purple);
}

.legendDot.external{
    background:var(--orange);
}

/* =========================================================
   ZOOM
========================================================= */

#zoomControls{
    position:absolute;
    z-index:800;

    right:16px;
    bottom:16px;

    display:flex;
    flex-direction:column;
    gap:5px;
}

.zoomBtn{
    width:40px;
    height:40px;

    border:1px solid #293b55;
    border-radius:9px;

    color:#d9e7f8;
    background:rgba(10,19,33,.95);

    cursor:pointer;

    font-size:17px;
}

.zoomBtn:hover{
    border-color:#4b6c94;
}

#zoomValue{
    width:40px;
    text-align:center;

    color:#7f91a9;

    font-size:9px;
}

/* =========================================================
   LOADING
========================================================= */

#loading{
    position:absolute;
    z-index:2000;
    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#050912;
}

.loadingBox{
    text-align:center;
}

.spinner{
    width:42px;
    height:42px;

    margin:0 auto 14px;

    border:3px solid #1c2b40;
    border-top-color:var(--blue);

    border-radius:50%;

    animation:spin .8s linear infinite;
}

.loadingBox strong{
    display:block;
    font-size:14px;
}

.loadingBox span{
    display:block;
    margin-top:5px;

    color:var(--muted);
    font-size:11px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* =========================================================
   ERROR
========================================================= */

#error{
    position:absolute;
    z-index:2100;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    width:min(520px,calc(100% - 30px));

    display:none;

    padding:22px;

    background:#101827;
    border:1px solid #663244;
    border-radius:15px;

    box-shadow:var(--shadow);
}

#error strong{
    display:block;
    color:#ff8798;
    margin-bottom:8px;
}

#error span{
    color:#aebbd0;
    font-size:12px;
    line-height:1.5;
}

#error button{
    margin-top:15px;

    padding:8px 12px;

    color:white;
    background:#17263b;

    border:1px solid #344c6d;
    border-radius:8px;

    cursor:pointer;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:800px){

    #topbar{
        height:auto;
        flex-wrap:wrap;
    }

    .brand{
        min-width:auto;
    }

    #search{
        width:150px;
    }

    #stats{
        display:none;
    }

    #details{
        width:calc(100% - 32px);
    }

    #legend{
        max-width:calc(100% - 90px);
    }
}
</style>
</head>

<body>

<div id="app">

    <div id="topbar">

        <div class="brand">
            <div class="brandMark">O</div>

            <div class="brandText">
                <strong>OBVYRIS SERVER MAP</strong>
                <span>Frontend Architecture & Connection Graph</span>
            </div>
        </div>

        <div class="toolbar">

            <button class="tool" id="resetView">
                Reset View
            </button>

            <button class="tool" id="fitMap">
                Fit Map
            </button>

            <button class="tool" id="centerHub">
                Center Hub
            </button>

            <button class="tool" id="toggleGrid">
                Grid
            </button>

            <input
                id="search"
                type="search"
                placeholder="Search server, frontend, API..."
            >

            <div id="stats">
                Loading architecture...
            </div>

        </div>

    </div>


    <div id="viewport">

        <div id="world">

            <div id="grid"></div>

            <svg id="connections"></svg>

        </div>

    </div>


    <div id="details">

        <div class="detailsHeader">
            <strong id="detailTitle">Node Details</strong>
            <button class="close" id="closeDetails">×</button>
        </div>

        <div id="detailContent"></div>

    </div>


    <div id="legend">

        <div class="legendItem">
            <i class="legendDot hub"></i>
            Hub
        </div>

        <div class="legendItem">
            <i class="legendDot frontend"></i>
            Frontend
        </div>

        <div class="legendItem">
            <i class="legendDot backend"></i>
            Backend
        </div>

        <div class="legendItem">
            <i class="legendDot sheet"></i>
            Sheet
        </div>

        <div class="legendItem">
            <i class="legendDot api"></i>
            API
        </div>

        <div class="legendItem">
            <i class="legendDot external"></i>
            External
        </div>

    </div>


    <div id="zoomControls">

        <button class="zoomBtn" id="zoomIn">+</button>
        <button class="zoomBtn" id="zoomOut">−</button>
        <button class="zoomBtn" id="zoomFit">⌂</button>

        <div id="zoomValue">100%</div>

    </div>


    <div id="loading">

        <div class="loadingBox">

            <div class="spinner"></div>

            <strong>Loading Obvyris Architecture</strong>

            <span>Building frontend branches and connections...</span>

        </div>

    </div>


    <div id="error">

        <strong>Unable to load server map</strong>

        <span id="errorText"></span>

        <br>

        <button onclick="location.reload()">
            Retry
        </button>

    </div>

</div>


<script>

/* =========================================================
   OBVYRIS MAP CONFIGURATION
========================================================= */

const MAP_API =
"https://script.google.com/macros/s/AKfycbxmet73uElazLhNTF6K9Ziizu4hbgq7VWbXJ8nKjSeXkn-tN4CyoBDjSdeK69A_J5XG/exec";


/* =========================================================
   GLOBAL STATE
========================================================= */

const state = {

    rows: [],

    nodes: new Map(),

    links: [],

    zoom: 1,

    panX: 0,

    panY: 0,

    draggingWorld: false,

    gridVisible: true,

    selectedNode: null,

    dragNode: null,

    dragOffsetX: 0,

    dragOffsetY: 0,

    worldWidth:10000,

    worldHeight:10000,

    hubX:5000,

    hubY:5000

};


/* =========================================================
   DOM
========================================================= */

const viewport =
document.getElementById("viewport");

const world =
document.getElementById("world");

const grid =
document.getElementById("grid");

const svg =
document.getElementById("connections");

const loading =
document.getElementById("loading");

const errorBox =
document.getElementById("error");

const errorText =
document.getElementById("errorText");

const stats =
document.getElementById("stats");

const search =
document.getElementById("search");

const details =
document.getElementById("details");

const detailTitle =
document.getElementById("detailTitle");

const detailContent =
document.getElementById("detailContent");


/* =========================================================
   NORMALIZATION
========================================================= */

function clean(value){

    if(value === null || value === undefined)
        return "";

    return String(value).trim();

}


function validURL(value){

    if(!value)
        return false;

    if(value === "#")
        return false;

    return /^https?:\/\//i.test(value);

}


function normalizeURL(value){

    return clean(value)
        .replace(/\/+$/,"")
        .toLowerCase();

}


function unique(values){

    const seen = new Set();

    return values.filter(value => {

        const key = normalizeURL(value);

        if(!key)
            return false;

        if(seen.has(key))
            return false;

        seen.add(key);

        return true;

    });

}


/* =========================================================
   API LOAD
========================================================= */

async function loadMap(){

    try{

        const response =
            await fetch(
                MAP_API +
                "?t=" +
                Date.now(),
                {
                    method:"GET",
                    cache:"no-store"
                }
            );

        if(!response.ok){

            throw new Error(
                "API returned HTTP " +
                response.status
            );

        }

        const data =
            await response.json();

        if(!data || !Array.isArray(data.rows)){

            throw new Error(
                "The MAP API did not return a rows array."
            );

        }

        state.rows =
            data.rows;

        buildArchitecture();

        loading.style.display="none";

    }
    catch(error){

        console.error(error);

        loading.style.display="none";

        errorBox.style.display="block";

        errorText.textContent =
            error.message +
            " Check that the Google Apps Script deployment is accessible to anyone with the link.";

    }

}


/* =========================================================
   ARCHITECTURE BUILDER
========================================================= */

function buildArchitecture(){

    state.nodes.clear();
    state.links=[];

    createHub();

    /*
       FRONTENDS ARE THE PRIMARY BRANCHES.

       Every unique MAIN HTML FRONTEND through
       HTML FRONTEND 5 becomes one frontend node.
    */

    const frontendMap =
        new Map();


    state.rows.forEach(row => {

        const frontendFields = [

            "MAIN HTML FRONTEND",
            "HTML FRONTEND 2",
            "HTML FRONTEND 3",
            "HTML FRONTEND 4",
            "HTML FRONTEND 5"

        ];


        frontendFields.forEach(field => {

            const url =
                clean(row[field]);

            if(!validURL(url))
                return;

            const key =
                normalizeURL(url);


            if(!frontendMap.has(key)){

                frontendMap.set(
                    key,
                    {
                        url:url,
                        rows:[]
                    }
                );

            }


            frontendMap
                .get(key)
                .rows
                .push(row);

        });

    });


    const frontends =
        [...frontendMap.values()];


    /*
       Create frontend branches around hub.
    */

    frontends.forEach(
        (frontend,index) => {

            const node =
                createFrontendNode(
                    frontend,
                    index,
                    frontends.length
                );

            frontend.nodeId =
                node.id;

        }
    );


    /*
       For each frontend, attach the backend
       rows that actually reference it.
    */

    frontendMap.forEach(
        (frontend) => {

            const frontendNode =
                state.nodes.get(
                    frontend.nodeId
                );

            if(!frontendNode)
                return;


            const connectedRows =
                uniqueRows(
                    frontend.rows
                );


            connectedRows.forEach(
                (row,rowIndex) => {

                    buildBackendBranch(
                        row,
                        frontendNode,
                        rowIndex,
                        connectedRows.length
                    );

                }
            );

        }
    );


    /*
       External APIs are attached to the
       appropriate backend/frontend branch.
    */

    buildExternalConnections();


    renderAll();

    updateStats();

}


/* =========================================================
   HUB
========================================================= */

function createHub(){

    const node = {

        id:"hub",

        type:"hub",

        title:"OBVYRIS HUB",

        subtitle:"Central Architecture",

        x:state.hubX - 115,

        y:state.hubY - 55,

        width:230,

        height:110,

        data:null,

        element:null

    };


    state.nodes.set(
        node.id,
        node
    );

}


/* =========================================================
   FRONTEND NODES
========================================================= */

function createFrontendNode(
    frontend,
    index,
    total
){

    const angle =
        (-Math.PI / 2) +
        (
            index /
            Math.max(total,1)
        ) *
        Math.PI *
        2;


    /*
       Large radius gives every frontend
       its own clearly visible branch.
    */

    const radius =
        Math.max(
            700,
            total * 80
        );


    const centerX =
        state.hubX +
        Math.cos(angle) * radius;


    const centerY =
        state.hubY +
        Math.sin(angle) * radius;


    const id =
        "frontend_" +
        index;


    const title =
        getFilename(
            frontend.url
        );


    const node = {

        id,

        type:"frontend",

        title,

        subtitle:frontend.url,

        x:centerX - 95,

        y:centerY - 40,

        width:190,

        height:80,

        data:{

            url:frontend.url,

            rows:frontend.rows

        },

        element:null

    };


    state.nodes.set(
        id,
        node
    );


    state.links.push({

        from:"hub",

        to:id,

        class:"frontend"

    });


    return node;

}


/* =========================================================
   BACKEND BRANCH
========================================================= */

function buildBackendBranch(
    row,
    frontendNode,
    rowIndex,
    rowCount
){

    const backendName =
        clean(row["Backends Sheet"]);


    /*
       Rows without a backend still remain
       attached to the frontend.
    */

    if(!backendName){

        buildExternalForRow(
            row,
            frontendNode
        );

        return;

    }


    const backendKey =
        "backend|" +
        backendName.toLowerCase();


    let backend =
        state.nodes.get(
            backendKey
        );


    if(!backend){

        const angle =
            angleFromFrontend(
                frontendNode,
                rowIndex,
                rowCount
            );


        const pos =
            pointFromNode(
                frontendNode,
                angle,
                280
            );


        backend = {

            id:backendKey,

            type:"backend",

            title:backendName,

            subtitle:"Backend",

            x:pos.x - 95,

            y:pos.y - 35,

            width:190,

            height:70,

            data:row,

            element:null

        };


        state.nodes.set(
            backendKey,
            backend
        );

    }


    if(
        !state.links.some(
            link =>
                link.from === frontendNode.id &&
                link.to === backend.id
        )
    ){

        state.links.push({

            from:frontendNode.id,

            to:backend.id,

            class:"backend"

        });

    }


    /*
       Sheet
    */

    const sheetURL =
        clean(row["Sheet"]);


    if(validURL(sheetURL)){

        const sheetId =
            backend.id +
            "|sheet";


        if(!state.nodes.has(sheetId)){

            const pos =
                pointFromNode(
                    backend,
                    0,
                    260
                );


            state.nodes.set(
                sheetId,
                {

                    id:sheetId,

                    type:"sheet",

                    title:"Google Sheet",

                    subtitle:shortURL(sheetURL),

                    x:pos.x - 95,

                    y:pos.y - 32,

                    width:190,

                    height:64,

                    data:{
                        url:sheetURL,
                        row
                    },

                    element:null

                }

            );

        }


        state.links.push({

            from:backend.id,

            to:sheetId,

            class:"backend"

        });

    }


    /*
       Sheet API
    */

    const sheetAPI =
        clean(row["Sheet API"]);


    if(validURL(sheetAPI)){

        const apiId =
            backend.id +
            "|sheetapi";


        if(!state.nodes.has(apiId)){

            const pos =
                pointFromNode(
                    backend,
                    Math.PI / 2,
                    260
                );


            state.nodes.set(
                apiId,
                {

                    id:apiId,

                    type:"apiNode",

                    title:"Sheet API",

                    subtitle:shortURL(sheetAPI),

                    x:pos.x - 95,

                    y:pos.y - 32,

                    width:190,

                    height:64,

                    data:{
                        url:sheetAPI,
                        row
                    },

                    element:null

                }

            );

        }


        state.links.push({

            from:backend.id,

            to:apiId,

            class:"api"

        });

    }


    buildExternalForRow(
        row,
        backend
    );

}

/* =========================================================
   EXTERNAL ROW DATA
========================================================= */

function buildExternalForRow(
    row,
    parent
){

    const external =
        clean(row["EXTERNAL"]);

    const api1 =
        clean(row["EXTERNAL API"]);

    const api2 =
        clean(row["EXTERNAL API 2"]);


    if(
        external &&
        external !== "#"
    ){

        const externalId =
            parent.id +
            "|external|" +
            hash(external);


        if(!state.nodes.has(externalId)){

            const pos =
                pointFromNode(
                    parent,
                    Math.PI / 2,
                    310
                );


            state.nodes.set(
                externalId,
                {

                    id:externalId,

                    type:"external",

                    title:external,

                    subtitle:"External Service",

                    x:pos.x - 95,

                    y:pos.y - 35,

                    width:190,

                    height:70,

                    data:{
                        name:external,
                        row
                    },

                    element:null

                }

            );


            state.links.push({

                from:parent.id,

                to:externalId,

                class:"external"

            });

        }


        const externalNode =
            state.nodes.get(
                externalId
            );


        if(validURL(api1)){

            createExternalAPI(
                externalNode,
                api1,
                1
            );

        }


        if(validURL(api2)){

            createExternalAPI(
                externalNode,
                api2,
                2
            );

        }

        return;

    }


    /*
       If there is no EXTERNAL label but
       an external API exists, attach it
       directly to the parent.
    */

    if(validURL(api1)){

        createExternalAPI(
            parent,
            api1,
            1
        );

    }


    if(validURL(api2)){

        createExternalAPI(
            parent,
            api2,
            2
        );

    }

}


/* =========================================================
   EXTERNAL API NODE
========================================================= */

function createExternalAPI(
    parent,
    url,
    number
){

    const id =
        parent.id +
        "|externalapi|" +
        hash(url);


    if(state.nodes.has(id))
        return;


    const angle =
        number === 1
        ? Math.PI / 3
        : 2 * Math.PI / 3;


    const pos =
        pointFromNode(
            parent,
            angle,
            260
        );


    const node = {

        id,

        type:"apiNode",

        title:
            "External API " +
            number,

        subtitle:
            shortURL(url),

        x:pos.x - 95,

        y:pos.y - 32,

        width:190,

        height:64,

        data:{
            url,
            external:true
        },

        element:null

    };


    state.nodes.set(
        id,
        node
    );


    state.links.push({

        from:parent.id,

        to:id,

        class:"api"

    });

}


/* =========================================================
   POSITION HELPERS
========================================================= */

function angleFromFrontend(
    node,
    index,
    total
){

    if(total <= 1)
        return Math.PI / 2;


    const spread =
        Math.PI * .9;


    return (
        Math.PI / 2 -
        spread / 2 +
        (index /
        (total - 1)) *
        spread
    );

}


function pointFromNode(
    node,
    angle,
    distance
){

    const cx =
        node.x +
        node.width / 2;

    const cy =
        node.y +
        node.height / 2;


    return {

        x:
            cx +
            Math.cos(angle) *
            distance,

        y:
            cy +
            Math.sin(angle) *
            distance

    };

}

function attachNodeEvents(
    element,
    node
){

        "mousedown",

                return;


            event.stopPropagation();

            state.dragNode =
                node;

                viewport.getBoundingClientRect();

                screenToWorld(
                    event.clientX,
                    event.clientY

                worldPoint.x -

                worldPoint.y -

            );

/* =========================================================
   CONNECTION RENDER
========================================================= */

function renderConnections(){

    svg.innerHTML="";


    state.links.forEach(
        link => {

            const from =
                state.nodes.get(
                    link.from
                );

            const to =
                state.nodes.get(
                    link.to
                );


            if(!from || !to)
                return;


            const a =
                getConnectionPoint(
                    from,
                    to
                );


            const b =
                getConnectionPoint(
                    to,
                    from
                );


            const dx =
                b.x - a.x;

            const dy =
                b.y - a.y;


            const distance =
                Math.sqrt(
                    dx*dx +
                    dy*dy
                );


            const curve =
                Math.min(
                    distance * .38,
                    180
                );


            const angle =
                Math.atan2(
                    dy,
                    dx
                );


            const c1 = {

                x:
                    a.x +
                    Math.cos(angle) *
                    curve,

                y:
                    a.y +
                    Math.sin(angle) *
                    curve

            };


            const c2 = {

                x:
                    b.x -
                    Math.cos(angle) *
                    curve,

                y:
                    b.y -
                    Math.sin(angle) *
                    curve

            };


            const path =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "path"
                );


            path.setAttribute(
                "d",
                `
                M ${a.x} ${a.y}
                C ${c1.x} ${c1.y},
                  ${c2.x} ${c2.y},
                  ${b.x} ${b.y}
                `
            );


            path.setAttribute(
                "class",
                "connection " +
                link.class
            );


            svg.appendChild(
                path
            );

        }
    );

}


/* =========================================================
   CONNECTION POINT
========================================================= */

function getConnectionPoint(
    from,
    to
){

    const fromX =
        from.x +
        from.width / 2;

    const fromY =
        from.y +
        from.height / 2;

    const toX =
        to.x +
        to.width / 2;

    const toY =
        to.y +
        to.height / 2;


    const dx =
        toX - fromX;

    const dy =
        toY - fromY;


    const halfW =
        from.width / 2;

    const halfH =
        from.height / 2;


    if(
        Math.abs(dx) *
        halfH >
        Math.abs(dy) *
        halfW
    ){

        return {

            x:
                fromX +
                (dx > 0
                    ? halfW
                    : -halfW),

            y:
                fromY +
                dy *
                (halfW /
                Math.abs(dx || 1))

        };

    }


    return {

        x:
            fromX +
            dx *
            (halfH /
            Math.abs(dy || 1)),

        y:
            fromY +
            (dy > 0
                ? halfH
                : -halfH)

    };

}

        if(node.data.row){

                node.data.row;


            const fields = [

                "MAIN HTML FRONTEND",

                "HTML FRONTEND 4",

                            );

                    else{

                        html +=
                            detailBlock(

                                value
                            );

/* =========================================================
   HIGHLIGHT CONNECTIONS
========================================================= */

function highlightConnections(node){

    const connected =
        new Set([
            node.id
        ]);


    state.links.forEach(
        link => {

            if(
                link.from === node.id
            )
                connected.add(
                    link.to
                );

            if(
                link.to === node.id
            )
                connected.add(
                    link.from
                );

        }
    );


    state.nodes.forEach(
        n => {

            if(!n.element)
                return;


            if(
                connected.has(n.id)
            ){

                n.element.classList.remove(
                    "hidden"
                );

            }
            else{

                n.element.classList.add(
                    "hidden"
                );

            }

        }
    );


    /*
       Redraw highlighted connection
       using the same graph geometry.
    */

    svg
        .querySelectorAll(
            ".connection"
        )
        .forEach(
            line => {

                line.classList.remove(
                    "highlight"
                );

            }
        );

}

);

    "mousemove",
    event => {

        if(
            state.dragNode
        ){

            const point =
                screenToWorld(

                    event.clientY
                );


            state.dragNode.x =
                point.x -
                state.dragOffsetX;


            state.dragNode.y =
                point.y -
                state.dragOffsetY;


            updateNodePosition(

            );


            renderConnections();

        )

        state.panX =

        state.panY =
            event.clientY -
            state.dragStartY;


        applyTransform();

    }
);

/* =========================================================
   SCREEN / WORLD COORDINATES
========================================================= */

function screenToWorld(
    screenX,
    screenY
){

    const rect =
        viewport.getBoundingClientRect();


    return {

        x:
            (
                screenX -
                rect.left -
                state.panX
            ) /
            state.zoom,

        y:
            (
                screenY -
                rect.top -
                state.panY
            ) /
            state.zoom

    };

}


/* =========================================================
   TRANSFORM
========================================================= */

function applyTransform(){

    world.style.transform =
        `
        translate(
            ${state.panX}px,
            ${state.panY}px
        )
        scale(
            ${state.zoom}
        )
        `;


    document.getElementById(
        "zoomValue"
    ).textContent =
        Math.round(
            state.zoom * 100
        ) +
        "%";

}


/* =========================================================
   ZOOM
========================================================= */

function zoomAt(
    factor,
    clientX,
    clientY
){

    const rect =
        viewport.getBoundingClientRect();


    const mouseX =
        clientX -
        rect.left;

    const mouseY =
        clientY -
        rect.top;


    const worldX =
        (
            mouseX -
            state.panX
        ) /
        state.zoom;


    const worldY =
        (
            mouseY -
            state.panY
        ) /
        state.zoom;


    const newZoom =
        Math.max(
            .05,
            Math.min(
                8,
                state.zoom *
                factor
            )
        );


    state.zoom =
        newZoom;


    state.panX =
        mouseX -
        worldX *
        newZoom;


    state.panY =
        mouseY -
        worldY *
        newZoom;


    applyTransform();

}


viewport.addEventListener(
    "wheel",
    event => {

        event.preventDefault();


        zoomAt(
            event.deltaY < 0
                ? 1.12
                : .89,

            event.clientX,

            event.clientY

        );

    },
    {
        passive:false
    }
);


document

            rect.height / 2
        );

    };


document
    .getElementById("zoomOut")

    () => {

        zoomAt(
            .8,
            rect.left +
            rect.width / 2,
            rect.top +
            rect.height / 2
        );

    };

/* =========================================================
   FIT MAP
========================================================= */

function fitMap(){

    if(
        state.nodes.size === 0
    )
        return;


    let minX=Infinity;
    let minY=Infinity;
    let maxX=-Infinity;
    let maxY=-Infinity;


    state.nodes.forEach(
        node => {

            minX =
                Math.min(
                    minX,
                    node.x
                );

            minY =
                Math.min(
                    minY,
                    node.y
                );

            maxX =
                Math.max(
                    maxX,
                    node.x +
                    node.width
                );

            maxY =
                Math.max(
                    maxY,
                    node.y +
                    node.height
                );

        }
    );


    const padding =
        250;


    const width =
        maxX -
        minX +
        padding * 2;


    const height =
        maxY -
        minY +
        padding * 2;


    const zoomX =
        viewport.clientWidth /
        width;


    const zoomY =
        viewport.clientHeight /
        height;


    state.zoom =
        Math.max(
            .05,
            Math.min(
                1.3,
                Math.min(
                    zoomX,
                    zoomY
                )
            )
        );


    state.panX =
        viewport.clientWidth / 2 -
        (
            minX +
            maxX
        ) /
        2 *
        state.zoom;


    state.panY =
        viewport.clientHeight / 2 -
        (
            minY +
            maxY
        ) /
        2 *
        state.zoom;


    applyTransform();

}

        details.classList.remove(
            "open"
        );

        state.nodes.forEach(
            node => {

                if(node.element){

                    node.element.classList.remove(
                        "hidden",
                        "selected"
                    );

                }

            }
        );

    };


/* =========================================================
   SEARCH
========================================================= */

search.addEventListener(
    "input",
    () => {

        const term =
            search.value
                .trim()
                .toLowerCase();


        state.nodes.forEach(
            node => {

                if(!node.element)
                    return;


                if(!term){

                    node.element.classList.remove(
                        "hidden"
                    );

                    return;

                }


                const text =
                    [
                        node.title,
                        node.subtitle,
                        node.data?.url
                    ]
                    .filter(Boolean)
                    .join(" ")
                    .toLowerCase();


                node.element.classList.toggle(
                    "hidden",
                    !text.includes(term)
                );

            }
        );

    }
);


/* =========================================================
   STATS
========================================================= */

function updateStats(){

    let frontend=0;
    let backend=0;
    let sheets=0;
    let apis=0;
    let external=0;


    state.nodes.forEach(
        node => {

            if(node.type==="frontend")
                frontend++;

            if(node.type==="backend")
                backend++;

            if(node.type==="sheet")
                sheets++;

            if(node.type==="apiNode")
                apis++;

            if(node.type==="external")
                external++;

        }
    );


    stats.textContent =
        frontend +
        " frontends • " +
        backend +
        " backends • " +
        sheets +
        " sheets • " +
        apis +
        " APIs • " +
        external +
        " external";

}


/* =========================================================
   UTILITIES
========================================================= */

function uniqueRows(rows){

    const seen =
        new Set();


    return rows.filter(
        row => {

            const id =
                clean(row.ID) +
                "|" +
                clean(row["Backends Sheet"]) +
                "|" +
                clean(row["Sheet API"]);


            if(seen.has(id))
                return false;


            seen.add(id);

            return true;

        }
    );

}


function getFilename(url){

    try{

        const parsed =
            new URL(url);


        let path =
            parsed.pathname;


        path =
            path
                .split("/")
                .filter(Boolean)
                .pop() ||
            parsed.hostname;


        return path;

    }
    catch{

        return url;

    }

}


function shortURL(url){

    if(!url)
        return "";


    try{

        const parsed =
            new URL(url);


        return (
            parsed.hostname +
            parsed.pathname
        );

    }
    catch{

        return url;

    }

}


function hash(value){

    let h=0;


    for(
        let i=0;
        i<value.length;
        i++
    ){

        h =
            (
                (
                    h << 5
                ) -
                h +
                value.charCodeAt(i)
            ) |
            0;

    }


    return Math.abs(h)
        .toString(36);

}


function escapeHTML(value){

    return String(value)
        .replace(
            /[&<>"']/g,
            character => ({

                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"

            })[character]
        );

}


function escapeAttribute(value){

    return escapeHTML(value);

}


/* =========================================================
   INITIAL VIEW
========================================================= */

function initializeView(){

    state.zoom=1;

    state.panX =
        viewport.clientWidth / 2 -
        state.hubX;

    state.panY =
        viewport.clientHeight / 2 -
        state.hubY;


    applyTransform();

}


/* =========================================================
   START

initializeView();

loadMap();
