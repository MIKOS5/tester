<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Obvyris TV</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#2793ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="icon" href="https://mikos5.github.io/tester/navicon.png">

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body{
  margin:0;
  background:#0b0f18;
  color:white;
  font-family:Inter, Arial;
  display:flex;
  height:100vh;
  overflow:hidden;
}

body.light{
  background:#f4f6f8;
  color:#111;
}

/* SIDEBAR */
.sidebar{
  width:360px;
  background:#111827;
  overflow:auto;
  padding:15px;
}

body.light .sidebar{
  background:#fff;
}

/* HEADER */
.logo{
  font-size:30px;
  font-weight:900;
}

/* VIDEO */
.main{
  flex:1;
  display:flex;
  flex-direction:column;
}

video{
  width:100%;
  height:65vh;
  background:black;
}

/* CHANNEL LIST */
.card{
  background:#1f2937;
  margin:8px 0;
  padding:10px;
  border-radius:10px;
  cursor:pointer;
}

body.light .card{
  background:#e5e7eb;
}

/* CONTROLS */
button{
  padding:10px;
  border:none;
  border-radius:8px;
  background:#2793ff;
  color:white;
  font-weight:700;
}

/* CHAT */
.chat-popup{
  position:fixed;
  right:20px;
  bottom:120px;
  width:340px;
  height:60vh;
  background:#111827;
  border:1px solid #333;
  display:flex;
  flex-direction:column;
}

.chat-log{
  flex:1;
  overflow:auto;
  padding:10px;
  font-size:12px;
}

.chat-input{
  display:flex;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

  <div class="logo">📺 Obvyris TV</div>

  <button onclick="toggleTheme()">🌙 Theme</button>

  <div id="list"></div>

</div>

<!-- MAIN -->
<div class="main">

  <video id="video" controls autoplay></video>

  <div style="padding:10px;display:flex;gap:10px;">
    <button onclick="prev()">⏮</button>
    <button onclick="toggle()">▶/⏸</button>
    <button onclick="next()">⏭</button>
    <button onclick="toggleChatPopup()">💬 Chat</button>
  </div>

</div>

<!-- CHAT -->
<div id="chatPopup" class="chat-popup" style="display:none;">
  <div style="padding:10px;background:#222;">💬 Channel Chat</div>

  <div id="chatLog" class="chat-log"></div>

  <div class="chat-input">
    <input id="chatName" placeholder="name" maxlength="8">
    <input id="chatMsg" placeholder="message" maxlength="100">
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script>

/* =====================
   IPTV ENGINE
===================== */

const IPTV =
"https://iptv-org.github.io/iptv/index.m3u";

let channels = [];
let index = 0;

const video = document.getElementById("video");

/* LOAD IPTV */
async function load(){
  const res = await fetch(IPTV);
  const text = await res.text();

  parse(text);
}

function parse(data){
  const lines = data.split("\n");

  let name = "";

  for(let i=0;i<lines.length;i++){
    if(lines[i].includes("#EXTINF")){
      name = lines[i].split(",")[1] || "Channel";
    }

    if(lines[i].startsWith("http")){
      channels.push({
        name,
        url: lines[i]
      });
    }
  }

  render();
}

/* RENDER */
function render(){
  const el = document.getElementById("list");
  el.innerHTML = "";

  channels.slice(0,200).forEach((c,i)=>{
    el.innerHTML += `
      <div class="card" onclick="play(${i})">
        ${c.name}
      </div>
    `;
  });
}

/* PLAY */
function play(i){
  index = i;
  const c = channels[i];

  if(c.url.includes(".m3u8") && Hls.isSupported()){
    const hls = new Hls();
    hls.loadSource(c.url);
    hls.attachMedia(video);
  } else {
    video.src = c.url;
  }

  video.play();

  loadChat();
}

/* CONTROLS */
function next(){
  index = (index+1)%channels.length;
  play(index);
}

function prev(){
  index = (index-1+channels.length)%channels.length;
  play(index);
}

function toggle(){
  if(video.paused) video.play();
  else video.pause();
}

/* THEME */
function toggleTheme(){
  document.body.classList.toggle("light");
}

/* CHAT SYSTEM */
const API_URL = "https://script.google.com/macros/s/AKfycbzin84qDcZ9L1q4pTBtHZGKJSTDcZ_wnmgWmnmgPgf1jrc1nRprzbEBixKMSHcdkxiZBg/exec";

let chatOpen = false;

function getRoom(){
  return channels[index]?.url || "global";
}

async function loadChat(){
  const res = await fetch(API_URL,{
    method:"POST",
    body: JSON.stringify({
      action:"get",
      station:getRoom()
    })
  });

  const data = await res.json();
  renderChat(data);
}

function renderChat(data){
  const box = document.getElementById("chatLog");
  box.innerHTML = "";

  (data || []).forEach(m=>{
    box.innerHTML += `
      <div><b>${m.name}:</b> ${m.message}</div>
    `;
  });

  box.scrollTop = box.scrollHeight;
}

async function sendMessage(){
  const name = document.getElementById("chatName").value;
  const msg = document.getElementById("chatMsg").value;

  await fetch(API_URL,{
    method:"POST",
    body: JSON.stringify({
      action:"send",
      station:getRoom(),
      name,
      message:msg
    })
  });

  loadChat();
}

/* CHAT TOGGLE */
function toggleChatPopup(){
  const p = document.getElementById("chatPopup");
  chatOpen = !chatOpen;
  p.style.display = chatOpen ? "flex" : "none";

  if(chatOpen) loadChat();
}

/* INIT */
load();

</script>

</body>
</html>
