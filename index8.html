<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Obvyris Server Map</title>

<style>

:root{
    --bg:#050911;
    --panel:#0a121c;
    --line:#263b4e;
    --text:#edf6ff;
    --muted:#71879a;

    --backend:#35d07f;
    --sheet:#ffb648;
    --api:#43a7ff;
    --status:#a78bfa;
    --frontend:#39d9ff;
    --external:#ff70bd;
    --offline:#ff5964;
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:
        radial-gradient(
            circle at 50% 50%,
            rgba(39,147,255,.09),
            transparent 30%
        ),
        #050911;
}

/* =========================
HEADER
========================= */

.topbar{
    position:fixed;
    top:0;
    left:0;
    right:0;

    height:60px;

    z-index:1000;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 14px;

    background:rgba(5,9,17,.97);

    border-bottom:1px solid #1c2d3d;
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo{
    width:31px;
    height:31px;

    display:grid;
    place-items:center;

    border:1px solid #3d83b5;
    border-radius:50%;

    color:#63bdff;

    box-shadow:
        0 0 20px rgba(39,147,255,.2);
}

.title{
    font-size:12px;
    font-weight:900;
    letter-spacing:1px;
}

.subtitle{
    margin-top:3px;

    color:#617789;

    font-size:6px;
    letter-spacing:1px;
}

.toolbar{
    display:flex;
    align-items:center;
    gap:6px;
}

.search{
    width:230px;
    height:31px;

    padding:0 10px;

    outline:none;

    border:1px solid #294256;
    border-radius:7px;

    background:#08131e;

    color:white;

    font-size:9px;
}

.search:focus{
    border-color:#4d91bf;
}

.button{
    height:31px;

    padding:0 10px;

    border:1px solid #294256;
    border-radius:7px;

    background:#091521;

    color:#a5b9c9;

    cursor:pointer;

    font-size:8px;
    font-weight:900;
}

.button:hover{
    background:#102536;
    color:white;
}

/* =========================
MAP
========================= */

#map{
    position:absolute;

    top:60px;
    left:0;
    right:0;
    bottom:0;

    overflow:hidden;

    cursor:grab;

    touch-action:none;
}

#map.dragging{
    cursor:grabbing;
}

#world{
    position:absolute;

    width:8000px;
    height:8000px;

    left:0;
    top:0;

    transform-origin:4000px 4000px;
}

/* =========================
GRID
========================= */

#grid{
    position:absolute;

    width:8000px;
    height:8000px;

    background-image:
        linear-gradient(
            rgba(35,58,76,.2) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(35,58,76,.2) 1px,
            transparent 1px
        );

    background-size:50px 50px;

    opacity:.2;
}

/* =========================
CONNECTIONS
========================= */

#connections{
    position:absolute;

    width:8000px;
    height:8000px;

    pointer-events:none;

    overflow:visible;
}

/* =========================
HUB
========================= */

.hub{
    position:absolute;

    left:3850px;
    top:3850px;

    width:300px;
    height:300px;

    z-index:100;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
}

.hub-core{
    width:130px;
    height:130px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    border:1px solid #48a8eb;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(39,147,255,.32),
            rgba(6,18,30,.95) 68%
        );

    box-shadow:
        0 0 35px rgba(39,147,255,.28),
        0 0 90px rgba(39,147,255,.1);

    z-index:10;
}

.hub-core-icon{
    font-size:27px;
}

.hub-title{
    margin-top:5px;

    font-size:14px;
    font-weight:950;

    letter-spacing:1px;
}

.hub-file{
    margin-top:4px;

    color:#6cbcff;

    font-size:7px;
}

.orbit{
    position:absolute;

    border:1px solid rgba(67,167,255,.13);

    border-radius:50%;

    pointer-events:none;
}

.orbit.one{
    width:330px;
    height:330px;
}

.orbit.two{
    width:600px;
    height:600px;
}

.orbit.three{
    width:950px;
    height:950px;
}

/* =========================
NODES
========================= */

.node{
    position:absolute;

    width:150px;
    min-height:72px;

    padding:8px;

    border:1px solid var(--line);
    border-radius:8px;

    background:
        linear-gradient(
            145deg,
            #0c1723,
            #071019
        );

    box-shadow:
        0 8px 24px rgba(0,0,0,.4);

    z-index:30;

    cursor:pointer;

    transition:
        transform .15s,
        opacity .15s,
        border-color .15s,
        box-shadow .15s;
}

.node:hover{
    transform:scale(1.04);

    border-color:#6b8ca2;

    box-shadow:
        0 12px 30px rgba(0,0,0,.55),
        0 0 22px rgba(67,167,255,.12);
}

.node.selected{
    border-color:white;

    box-shadow:
        0 0 0 1px rgba(255,255,255,.1),
        0 0 30px rgba(67,167,255,.24);
}

.node.dim{
    opacity:.05;
}

.backend{
    border-top:3px solid var(--backend);
}

.sheet{
    border-top:3px solid var(--sheet);
}

.api{
    border-top:3px solid var(--api);
}

.status{
    border-top:3px solid var(--status);
}

.frontend{
    border-top:3px solid var(--frontend);
}

.external{
    border-top:3px solid var(--external);
}

.node-head{
    display:flex;
    align-items:center;
    gap:6px;
}

.node-icon{
    width:18px;
    height:18px;

    display:grid;
    place-items:center;

    border-radius:4px;

    background:rgba(255,255,255,.05);

    font-size:9px;
}

.node-title{
    overflow:hidden;

    white-space:nowrap;
    text-overflow:ellipsis;

    font-size:8px;
    font-weight:900;
}

.node-value{
    margin-top:7px;

    color:#a0b2c1;

    font-size:7px;
    line-height:1.35;

    word-break:break-word;
}

.node-label{
    margin-top:6px;

    color:#526b7f;

    font-size:5px;
    letter-spacing:1px;
}

.online{
    color:var(--backend);
}

.offline{
    color:var(--offline);
}

.status-dot{
    display:inline-block;

    width:6px;
    height:6px;

    margin-right:3px;

    border-radius:50%;

    background:currentColor;

    box-shadow:
        0 0 8px currentColor;
}

/* =========================
DIRECTION LABELS
========================= */

.direction{
    position:absolute;

    z-index:15;

    color:#506b7f;

    font-size:7px;
    font-weight:900;

    letter-spacing:2px;

    pointer-events:none;
}

.direction.north{
    left:3935px;
    top:3150px;
}

.direction.south{
    left:3925px;
    top:4650px;
}

.direction-text{
    padding:5px 9px;

    border:1px solid #1e3548;
    border-radius:20px;

    background:rgba(5,11,18,.9);
}

/* =========================
INFO
========================= */

#info{
    position:fixed;

    top:72px;
    right:13px;

    width:330px;
    max-height:calc(100vh - 85px);

    overflow:auto;

    display:none;

    z-index:1000;

    border:1px solid #294356;
    border-radius:10px;

    background:rgba(5,12,19,.98);

    box-shadow:
        0 20px 60px rgba(0,0,0,.7);
}

.info-header{
    position:sticky;
    top:0;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:11px 13px;

    background:#08121d;

    border-bottom:1px solid #1e3243;
}

.info-title{
    font-size:10px;
    font-weight:900;
}

.close{
    width:25px;
    height:25px;

    border:1px solid #30495e;
    border-radius:5px;

    background:#0b1723;

    color:#9db1c1;

    cursor:pointer;
}

.info-body{
    padding:13px;
}

.info-section{
    margin-bottom:13px;
}

.info-label{
    color:#526a7e;

    font-size:6px;
    font-weight:900;

    letter-spacing:1px;
    text-transform:uppercase;
}

.info-value{
    margin-top:4px;

    color:#cbd9e4;

    font-size:9px;
    line-height:1.45;

    word-break:break-word;
}

.info-link{
    display:block;

    padding:9px;

    margin-top:7px;

    border:1px solid #28506d;
    border-radius:6px;

    background:#091827;

    color:#65baff;

    text-decoration:none;

    font-size:8px;
    font-weight:900;
}

.info-link:hover{
    background:#102536;
}

/* =========================
LEGEND
========================= */

.legend{
    position:fixed;

    left:13px;
    bottom:13px;

    z-index:500;

    padding:10px 12px;

    border:1px solid #1e3447;
    border-radius:8px;

    background:rgba(5,12,19,.95);

    font-size:7px;
}

.legend-title{
    margin-bottom:7px;

    color:#71879a;

    font-size:7px;
    font-weight:900;

    letter-spacing:1px;
}

.legend-row{
    display:flex;
    align-items:center;

    gap:7px;

    margin:5px 0;

    color:#91a6b7;
}

.legend-dot{
    width:7px;
    height:7px;

    border-radius:50%;
}

.green{
    background:var(--backend);
}

.orange{
    background:var(--sheet);
}

.blue{
    background:var(--api);
}

.purple{
    background:var(--status);
}

.cyan{
    background:var(--frontend);
}

.pink{
    background:var(--external);
}

/* =========================
STATUS
========================= */

#statusbar{
    position:fixed;

    right:13px;
    bottom:13px;

    z-index:500;

    padding:8px 11px;

    border:1px solid #1e3447;
    border-radius:7px;

    background:rgba(5,12,19,.95);

    color:#71879a;

    font-size:7px;
}

/* =========================
LOADING
========================= */

#loading{
    position:fixed;

    inset:0;

    z-index:2000;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#050911;
}

.loader{
    text-align:center;
}

.loader-ring{
    width:50px;
    height:50px;

    margin:auto;

    border:1px solid #286b98;
    border-top-color:#6ac3ff;

    border-radius:50%;

    animation:spin 1s linear infinite;
}

.loader-text{
    margin-top:12px;

    color:#71889b;

    font-size:9px;
    letter-spacing:1px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

@media(max-width:850px){

    .subtitle{
        display:none;
    }

    .search{
        width:130px;
    }

    .legend{
        display:none;
    }

    #info{
        left:8px;
        right:8px;
        width:auto;
    }
}

</style>
</head>

<body>

<header class="topbar">

    <div class="brand">

        <div class="logo">
            ◉
        </div>

        <div>

            <div class="title">
                OBVYRIS SERVER MAP
            </div>

            <div class="subtitle">
                RADIAL SYSTEM ARCHITECTURE
            </div>

        </div>

    </div>

    <div class="toolbar">

        <input
            id="search"
            class="search"
            placeholder="Search server or resource..."
        >

        <button
            class="button"
            id="refresh"
        >
            ↻ REFRESH
        </button>

        <button
            class="button"
            id="center"
        >
            CENTER
        </button>

        <button
            class="button"
            id="zoomOut"
        >
            −
        </button>

        <button
            class="button"
            id="zoomIn"
        >
            +
        </button>

    </div>

</header>

<div id="map">

    <div id="world">

        <div id="grid"></div>

        <svg
            id="connections"
            viewBox="0 0 8000 8000"
        ></svg>

        <div class="orbit one"></div>
        <div class="orbit two"></div>
        <div class="orbit three"></div>

        <div class="direction north">
            <div class="direction-text">
                ▲ BACKEND ROUTES
            </div>
        </div>

        <div class="direction south">
            <div class="direction-text">
                ▼ EXTERNAL ROUTES
            </div>
        </div>

        <div class="hub">

            <div class="hub-core">

                <div class="hub-core-icon">
                    🛰️
                </div>

                <div class="hub-title">
                    OBVYRIS HUB
                </div>

                <div class="hub-file">
                    index99.html
                </div>

            </div>

        </div>

    </div>

</div>

<div id="info">

    <div class="info-header">

        <div
            id="infoTitle"
            class="info-title"
        >
            NODE
        </div>

        <button
            class="close"
            id="close"
        >
            ×
        </button>

    </div>

    <div
        id="infoBody"
        class="info-body"
    ></div>

</div>

<div class="legend">

    <div class="legend-title">
        ARCHITECTURE
    </div>

    <div class="legend-row">
        <span class="legend-dot green"></span>
        Backend
    </div>

    <div class="legend-row">
        <span class="legend-dot orange"></span>
        Sheet
    </div>

    <div class="legend-row">
        <span class="legend-dot blue"></span>
        API
    </div>

    <div class="legend-row">
        <span class="legend-dot purple"></span>
        Status
    </div>

    <div class="legend-row">
        <span class="legend-dot cyan"></span>
        Frontend
    </div>

    <div class="legend-row">
        <span class="legend-dot pink"></span>
        External
    </div>

</div>

<div id="statusbar">
    Connecting...
</div>

<div id="loading">

    <div class="loader">

        <div class="loader-ring"></div>

        <div class="loader-text">
            BUILDING OBVYRIS SERVER MAP
        </div>

    </div>

</div>

<script>

const MAP_API =
"https://script.google.com/macros/s/AKfycbxmet73uElazLhNTF6K9Ziizu4hbgq7VWbXJ8nKjSeXkn-tN4CyoBDjSdeK69A_J5XG/exec";


const FLOW = [

    {
        column:"Backends Sheet",
        type:"backend",
        icon:"▣"
    },

    {
        column:"Sheet",
        type:"sheet",
        icon:"▤"
    },

    {
        column:"Sheet API",
        type:"api",
        icon:"⌘"
    },

    {
        column:"Status",
        type:"status",
        icon:"●"
    },

    {
        column:"MAIN HTML FRONTEND",
        type:"frontend",
        icon:"▣"
    },

    {
        column:"HTML FRONTEND 2",
        type:"frontend",
        icon:"▣"
    },

    {
        column:"HTML FRONTEND 3",
        type:"frontend",
        icon:"▣"
    },

    {
        column:"HTML FRONTEND 4",
        type:"frontend",
        icon:"▣"
    },

    {
        column:"HTML FRONTEND 5",
        type:"frontend",
        icon:"▣"
    },

    {
        column:"EXTERNAL",
        type:"external",
        icon:"◎"
    },

    {
        column:"EXTERNAL API",
        type:"api",
        icon:"↗"
    },

    {
        column:"EXTERNAL API 2",
        type:"api",
        icon:"↗"
    }

];


let rows=[];
let nodes=[];

let scale=1;

let panX=0;
let panY=0;

let dragging=false;

let dragStartX=0;
let dragStartY=0;

let startPanX=0;
let startPanY=0;


/* =========================
HELPERS
========================= */

function valid(value){

    if(
        value===null ||
        value===undefined
    ){
        return false;
    }

    value=String(value).trim();

    return value!=="" && value!=="#";
}


function escapeHtml(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function shortValue(value){

    if(value.length<=30){
        return value;
    }

    return value.substring(0,27)+"...";
}


function setStatus(text){

    document
        .getElementById("statusbar")
        .textContent=text;

}


/* =========================
LOAD
========================= */

function loadMap(){

    setStatus(
        "Loading MAP..."
    );

    fetch(
        MAP_API+
        "?t="+
        Date.now(),
        {
            cache:"no-store"
        }
    )
    .then(response=>{

        if(!response.ok){

            throw new Error(
                "HTTP "+response.status
            );

        }

        return response.json();

    })
    .then(data=>{

        if(
            !data ||
            data.success!==true
        ){

            throw new Error(
                "Invalid MAP response"
            );

        }

        rows=
            Array.isArray(data.rows)
            ? data.rows
            : [];

        render();

    })
    .catch(error=>{

        console.error(error);

        document
            .getElementById("loading")
            .innerHTML=`

                <div class="loader">

                    <div style="
                        color:#ff5964;
                        font-size:12px;
                        font-weight:900;
                    ">
                        MAP API ERROR
                    </div>

                    <div style="
                        color:#71889b;
                        font-size:8px;
                        margin-top:8px;
                    ">
                        ${escapeHtml(error.message)}
                    </div>

                    <button
                        class="button"
                        onclick="loadMap()"
                        style="margin-top:14px"
                    >
                        TRY AGAIN
                    </button>

                </div>
            `;

        setStatus(
            "API ERROR"
        );

    });

}


/* =========================
RENDER
========================= */

function render(){

    document
        .querySelectorAll(".node")
        .forEach(
            element=>
                element.remove()
        );

    nodes=[];

    /*
        IMPORTANT:

        HUB = 4000 / 4000

        Backend systems are placed
        NORTH of the Hub.

        External dependencies are
        placed SOUTH of the Hub.
    */

    const backendRows=
        rows.filter(
            row=>
                valid(
                    row["Backends Sheet"]
                )
        );


    const externalRows=
        rows.filter(
            row=>
                valid(
                    row["EXTERNAL"]
                ) ||
                valid(
                    row["EXTERNAL API"]
                ) ||
                valid(
                    row["EXTERNAL API 2"]
                )
        );


    /*
        BACKEND BRANCHES
    */

    backendRows.forEach(
        (row,index)=>{

            createBackendBranch(
                row,
                index,
                backendRows.length
            );

        }
    );


    /*
        EXTERNAL BRANCHES
    */

    externalRows.forEach(
        (row,index)=>{

            createExternalBranch(
                row,
                index,
                externalRows.length
            );

        }
    );


    drawConnections();

    document
        .getElementById("loading")
        .style.display="none";

    centerMap();

    setStatus(
        rows.length+
        " systems • "+
        nodes.length+
        " resources"
    );

}


/* =========================
BACKEND BRANCH
========================= */

function createBackendBranch(
    row,
    rowIndex,
    total
){

    /*
        Each backend gets a radial
        route pointing toward the Hub.

        Main backend path:

        BACKEND
            ↓
        SHEET
            ↓
        SHEET API
            ↓
        STATUS
            ↓
        FRONTENDS
            ↓
           HUB
    */

    const angle=
        getBackendAngle(
            rowIndex,
            total
        );


    const centerX=4000;
    const centerY=4000;


    const radians=
        angle*Math.PI/180;


    /*
        The backend route starts
        farthest north.
    */

    const radiusBackend=1500;

    const backendX=
        centerX+
        Math.cos(radians)*
        radiusBackend;


    const backendY=
        centerY+
        Math.sin(radians)*
        radiusBackend;


    const branch=[];


    FLOW.slice(
        0,
        9
    ).forEach(
        config=>{

            const value=
                row[config.column];

            if(!valid(value)){
                return;
            }

            const distance=
                getBackendDistance(
                    config.type
                );


            const x=
                centerX+
                Math.cos(radians)*
                distance;


            const y=
                centerY+
                Math.sin(radians)*
                distance;


            const node=
                createNode(
                    row,
                    rowIndex,
                    config,
                    String(value).trim()
                );


            positionNode(
                node,
                x,
                y
            );


            branch.push(node);

        }
    );


    /*
        Make sure every backend route
        connects back to the Hub.
    */

}


/* =========================
BACKEND ANGLE
========================= */

function getBackendAngle(
    index,
    total
){

    /*
        NORTH = -90°

        Spread the systems across
        approximately 150° of sky.

        This gives:

        ↖  ↑  ↗

        rather than stacking everything.
    */

    if(total===1){
        return -90;
    }


    const spread=150;

    const start=
        -90-
        spread/2;


    const step=
        spread/
        Math.max(
            total-1,
            1
        );


    return start+
        index*step;

}


/* =========================
BACKEND DISTANCE
========================= */

function getBackendDistance(
    type
){

    if(type==="backend"){
        return 1550;
    }

    if(type==="sheet"){
        return 1250;
    }

    if(type==="api"){
        return 950;
    }

    if(type==="status"){
        return 650;
    }

    if(type==="frontend"){
        return 400;
    }

    return 500;

}


/* =========================
EXTERNAL BRANCH
========================= */

function createExternalBranch(
    row,
    rowIndex,
    total
){

    /*
        External branch runs SOUTH.

        HUB
          ↓
       EXTERNAL
          ↓
       API
          ↓
       API 2
    */


    const angle=
        getExternalAngle(
            rowIndex,
            total
        );


    const radians=
        angle*Math.PI/180;


    const centerX=4000;
    const centerY=4000;


    const externalFlow=[

        {
            column:"EXTERNAL",
            type:"external",
            icon:"◎",
            distance:400
        },

        {
            column:"EXTERNAL API",
            type:"api",
            icon:"↗",
            distance:800
        },

        {
            column:"EXTERNAL API 2",
            type:"api",
            icon:"↗",
            distance:1200
        }

    ];


    externalFlow.forEach(
        config=>{

            const value=
                row[config.column];

            if(!valid(value)){
                return;
            }


            const x=
                centerX+
                Math.cos(radians)*
                config.distance;


            const y=
                centerY+
                Math.sin(radians)*
                config.distance;


            const node=
                createNode(
                    row,
                    rowIndex,
                    config,
                    String(value).trim()
                );


            positionNode(
                node,
                x,
                y
            );

        }
    );

}


/* =========================
EXTERNAL ANGLE
========================= */

function getExternalAngle(
    index,
    total
){

    /*
        SOUTH = 90°

        Spread external services
        across the southern arc.
    */

    if(total===1){
        return 90;
    }


    const spread=130;

    const start=
        90-
        spread/2;


    const step=
        spread/
        Math.max(
            total-1,
            1
        );


    return start+
        index*step;

}


/* =========================
CREATE NODE
========================= */

function createNode(
    row,
    rowIndex,
    config,
    value
){

    const node=
        document.createElement("div");


    node.className=
        "node "+
        config.type;


    let display=value;


    if(config.type==="status"){

        const status=
            value.toUpperCase();


        const className=
            status==="ONLINE"
            ? "online"
            : status==="OFFLINE"
            ? "offline"
            : "";


        display=`

            <span
                class="status-dot ${className}"
            ></span>

            ${escapeHtml(status)}

        `;

    }

    else{

        display=
            escapeHtml(
                shortValue(value)
            );

    }


    node.innerHTML=`

        <div class="node-head">

            <div class="node-icon">
                ${config.icon}
            </div>

            <div class="node-title">
                ${escapeHtml(config.column)}
            </div>

        </div>

        <div class="node-value">
            ${display}
        </div>

        <div class="node-label">
            RESOURCE
        </div>

    `;


    const data={

        element:node,

        row:row,

        rowIndex:rowIndex,

        column:config.column,

        type:config.type,

        value:value

    };


    nodes.push(data);


    node.addEventListener(
        "click",
        event=>{

            event.stopPropagation();

            selectNode(data);

        }
    );


    document
        .getElementById("world")
        .appendChild(node);


    return data;

}


/* =========================
POSITION NODE
========================= */

function positionNode(
    node,
    x,
    y
){

    node.element.style.left=
        (
            x-
            75
        )+
        "px";


    node.element.style.top=
        (
            y-
            36
        )+
        "px";

}


/* =========================
NODE POSITION
========================= */

function getNodePosition(node){

    return{

        x:
            parseFloat(
                node.element.style.left
            )+
            node.element.offsetWidth/2,

        y:
            parseFloat(
                node.element.style.top
            )+
            node.element.offsetHeight/2

    };

}


/* =========================
CONNECTIONS
========================= */

function drawConnections(){

    const svg=
        document.getElementById(
            "connections"
        );


    svg.innerHTML="";


    /*
        GROUP BACKENDS BY ROW.
    */

    rows.forEach(
        (row,rowIndex)=>{

            const branch=
                nodes.filter(
                    node=>
                        node.rowIndex===
                        rowIndex &&
                        (
                            node.type===
                            "backend" ||

                            node.type===
                            "sheet" ||

                            node.type===
                            "api" ||

                            node.type===
                            "status" ||

                            node.type===
                            "frontend"
                        )
                );


            branch.sort(
                (a,b)=>
                    getNodeRadius(a)-
                    getNodeRadius(b)
            );


            /*
                Connect every step
                toward the Hub.
            */

            for(
                let i=0;
                i<branch.length-1;
                i++
            ){

                connect(
                    branch[i],
                    branch[i+1],
                    "backend-line"
                );

            }


            /*
                Connect final frontend
                directly toward Hub.
            */

            if(branch.length){

                const closest=
                    branch.reduce(
                        (a,b)=>
                            getNodeRadius(a)<
                            getNodeRadius(b)
                            ? a
                            : b
                    );


                connectToHub(
                    closest,
                    "frontend-line"
                );

            }

        }
    );


    /*
        EXTERNAL ROUTES
    */

    rows.forEach(
        (row,rowIndex)=>{

            const branch=
                nodes.filter(
                    node=>
                        node.rowIndex===
                        rowIndex &&
                        (
                            node.type===
                            "external" ||

                            node.column===
                            "EXTERNAL API" ||

                            node.column===
                            "EXTERNAL API 2"
                        )
                );


            branch.sort(
                (a,b)=>
                    getNodeRadius(a)-
                    getNodeRadius(b)
            );


            if(!branch.length){
                return;
            }


            /*
                HUB → External
            */

            connectToHub(
                branch[0],
                "external-line"
            );


            /*
                External → API → API 2
            */

            for(
                let i=0;
                i<branch.length-1;
                i++
            ){

                connect(
                    branch[i],
                    branch[i+1],
                    "external-line"
                );

            }

        }
    );

}


/* =========================
RADIUS
========================= */

function getNodeRadius(node){

    const p=
        getNodePosition(node);


    return Math.sqrt(
        Math.pow(
            p.x-4000,
            2
        )+
        Math.pow(
            p.y-4000,
            2
        )
    );

}


/* =========================
CONNECT
========================= */

function connect(
    a,
    b,
    className
){

    const p1=
        getNodePosition(a);


    const p2=
        getNodePosition(b);


    const curve=
        createCurve(
            p1.x,
            p1.y,
            p2.x,
            p2.y
        );


    curve.classList.add(
        className
    );


    document
        .getElementById("connections")
        .appendChild(curve);

}


/* =========================
CONNECT HUB
========================= */

function connectToHub(
    node,
    className
){

    const p=
        getNodePosition(node);


    const curve=
        createCurve(
            p.x,
            p.y,
            4000,
            4000
        );


    curve.classList.add(
        className
    );


    document
        .getElementById("connections")
        .appendChild(curve);

}


/* =========================
CURVE
========================= */

function createCurve(
    x1,
    y1,
    x2,
    y2
){

    const path=
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path"
        );


    const dx=
        x2-x1;

    const dy=
        y2-y1;


    const distance=
        Math.sqrt(
            dx*dx+
            dy*dy
        );


    const bend=
        Math.min(
            120,
            distance*.2
        );


    const cx1=
        x1+
        dx*.35;

    const cy1=
        y1+
        dy*.35;

    const cx2=
        x2-
        dx*.35;

    const cy2=
        y2-
        dy*.35;


    path.setAttribute(
        "d",
        `
        M ${x1} ${y1}
        C ${cx1} ${cy1},
          ${cx2} ${cy2},
          ${x2} ${y2}
        `
    );


    path.setAttribute(
        "fill",
        "none"
    );


    path.setAttribute(
        "stroke",
        "#294254"
    );


    path.setAttribute(
        "stroke-width",
        "1.6"
    );


    path.setAttribute(
        "opacity",
        ".8"
    );


    return path;

}


/* =========================
SELECT
========================= */

function selectNode(selected){

    nodes.forEach(
        node=>{

            node.element.classList.add(
                "dim"
            );

            node.element.classList.remove(
                "selected"
            );

        }
    );


    nodes
        .filter(
            node=>
                node.rowIndex===
                selected.rowIndex
        )
        .forEach(
            node=>{

                node.element.classList.remove(
                    "dim"
                );

            }
        );


    selected.element.classList.remove(
        "dim"
    );


    selected.element.classList.add(
        "selected"
    );


    showInfo(
        selected
    );

}


/* =========================
INFO PANEL
========================= */

function showInfo(node){

    const info=
        document.getElementById(
            "info"
        );


    const title=
        document.getElementById(
            "infoTitle"
        );


    const body=
        document.getElementById(
            "infoBody"
        );


    title.textContent=
        node.column;


    let html="";


    html+=`

        <div class="info-section">

            <div class="info-label">
                Backend
            </div>

            <div class="info-value">
                ${escapeHtml(
                    node.row[
                        "Backends Sheet"
                    ] ||
                    "No backend"
                )}
            </div>

        </div>

    `;


    html+=`

        <div class="info-section">

            <div class="info-label">
                MAP CELL
            </div>

            <div class="info-value">
                ${escapeHtml(
                    node.column
                )}
            </div>

        </div>

    `;


    html+=`

        <div class="info-section">

            <div class="info-label">
                RESOURCE
            </div>

            <div class="info-value">
                ${escapeHtml(
                    node.value
                )}
            </div>

        </div>

    `;


    html+=`

        <div class="info-section">

            <div class="info-label">
                SYSTEM STATUS
            </div>

            <div class="info-value">
                ${escapeHtml(
                    node.row.Status ||
                    "UNKNOWN"
                )}
            </div>

        </div>

    `;


    if(
        /^https?:\/\//i.test(
            node.value
        )
    ){

        html+=`

            <a
                class="info-link"
                href="${escapeHtml(node.value)}"
                target="_blank"
                rel="noopener noreferrer"
            >
                OPEN RESOURCE ↗
            </a>

        `;

    }


    body.innerHTML=html;

    info.style.display="block";

}


/* =========================
CLOSE
========================= */

function closeInfo(){

    document
        .getElementById("info")
        .style.display="none";


    nodes.forEach(
        node=>{

            node.element.classList.remove(
                "dim",
                "selected"
            );

        }
    );

}


/* =========================
TRANSFORM
========================= */

function applyTransform(){

    document
        .getElementById("world")
        .style.transform=
        `
            translate(
                ${panX}px,
                ${panY}px
            )
            scale(${scale})
        `;

}


/* =========================
CENTER
========================= */

function centerMap(){

    const rect=
        document
            .getElementById("map")
            .getBoundingClientRect();


    scale=1;


    panX=
        rect.width/2-
        4000;


    panY=
        rect.height/2-
        4000;


    applyTransform();

}


/* =========================
ZOOM
========================= */

function zoomIn(){

    scale=
        Math.min(
            2.5,
            scale+.12
        );


    applyTransform();

}


function zoomOut(){

    scale=
        Math.max(
            .3,
            scale-.12
        );


    applyTransform();

}


/* =========================
SEARCH
========================= */

function searchMap(value){

    const query=
        String(value || "")
        .toLowerCase()
        .trim();


    if(!query){

        nodes.forEach(
            node=>{

                node.element.classList.remove(
                    "dim",
                    "selected"
                );

            }
        );


        setStatus(
            rows.length+
            " systems • "+
            nodes.length+
            " resources"
        );


        return;

    }


    let matches=0;


    nodes.forEach(
        node=>{

            const text=
                (
                    node.value+
                    " "+
                    node.column+
                    " "+
                    (
                        node.row[
                            "Backends Sheet"
                        ] ||
                        ""
                    )
                )
                .toLowerCase();


            if(
                text.includes(query)
            ){

                node.element.classList.remove(
                    "dim"
                );

                node.element.classList.add(
                    "selected"
                );

                matches++;

            }

            else{

                node.element.classList.add(
                    "dim"
                );

                node.element.classList.remove(
                    "selected"
                );

            }

        }
    );


    setStatus(
        matches+
        " matching resources"
    );

}


/* =========================
PAN
========================= */

const map=
    document.getElementById(
        "map"
    );


map.addEventListener(
    "mousedown",
    event=>{

        if(
            event.target.closest(".node") ||
            event.target.closest(".hub") ||
            event.target.closest("button") ||
            event.target.closest("input")
        ){
            return;
        }


        dragging=true;


        map.classList.add(
            "dragging"
        );


        dragStartX=
            event.clientX;

        dragStartY=
            event.clientY;


        startPanX=panX;
        startPanY=panY;

    }
);


window.addEventListener(
    "mousemove",
    event=>{

        if(!dragging){
            return;
        }


        panX=
            startPanX+
            event.clientX-
            dragStartX;


        panY=
            startPanY+
            event.clientY-
            dragStartY;


        applyTransform();

    }
);


window.addEventListener(
    "mouseup",
    ()=>{

        dragging=false;

        map.classList.remove(
            "dragging"
        );

    }
);


/* =========================
WHEEL
========================= */

map.addEventListener(
    "wheel",
    event=>{

        event.preventDefault();


        if(event.deltaY<0){
            zoomIn();
        }
        else{
            zoomOut();
        }

    },
    {
        passive:false
    }
);


/* =========================
BUTTONS
========================= */

document
    .getElementById("refresh")
    .onclick=
    loadMap;


document
    .getElementById("center")
    .onclick=
    centerMap;


document
    .getElementById("zoomIn")
    .onclick=
    zoomIn;


document
    .getElementById("zoomOut")
    .onclick=
    zoomOut;


document
    .getElementById("close")
    .onclick=
    closeInfo;


document
    .getElementById("search")
    .addEventListener(
        "input",
        event=>{
            searchMap(
                event.target.value
            );
        }
    );


/* =========================
START
========================= */

loadMap();

</script>
