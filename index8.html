<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Obvyris Control Center</title>

<meta name="theme-color" content="#09111d">

<style>

:root{
    --bg:#070d16;
    --panel:#0d1624;
    --panel2:#111d2d;
    --line:#24344a;
    --text:#f4f7fb;
    --muted:#8fa2b8;
    --blue:#2793ff;
    --green:#21d07a;
    --red:#ff4d5e;
    --yellow:#f5c451;
    --purple:#a66cff;
    --cyan:#25d9e8;
    --orange:#ff9f43;
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    background:
        radial-gradient(circle at top center,#13243a 0,#070d16 45%);
    color:var(--text);
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

/* =========================
   HEADER
========================= */

header{
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(7,13,22,.94);
    backdrop-filter:blur(14px);
    border-bottom:1px solid var(--line);
}

.header-inner{
    max-width:1500px;
    margin:auto;
    padding:18px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.brand{
    display:flex;
    align-items:center;
    gap:14px;
}

.brand-icon{
    width:46px;
    height:46px;
    border-radius:13px;
    background:linear-gradient(135deg,#2793ff,#1458c7);
    display:grid;
    place-items:center;
    font-size:24px;
    box-shadow:0 8px 25px rgba(39,147,255,.25);
}

.brand h1{
    margin:0;
    font-size:21px;
    letter-spacing:.5px;
}

.brand small{
    display:block;
    margin-top:3px;
    color:var(--muted);
}

.header-actions{
    display:flex;
    align-items:center;
    gap:9px;
}

button,
.btn{
    border:1px solid var(--line);
    background:var(--panel2);
    color:var(--text);
    padding:9px 13px;
    border-radius:9px;
    cursor:pointer;
    font-size:13px;
    transition:.18s;
}

button:hover,
.btn:hover{
    border-color:#416184;
    background:#17263a;
}

.btn-primary{
    background:#176ac7;
    border-color:#2789ed;
}

.btn-primary:hover{
    background:#2180e7;
}

button:disabled{
    opacity:.55;
    cursor:not-allowed;
}

/* =========================
   MAIN
========================= */

main{
    max-width:1500px;
    margin:auto;
    padding:22px;
}

/* =========================
   STATUS
========================= */

.status-bar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:15px;
    margin-bottom:18px;
    padding:11px 14px;
    border:1px solid var(--line);
    background:rgba(13,22,36,.8);
    border-radius:10px;
}

.status-left{
    display:flex;
    align-items:center;
    gap:9px;
    color:var(--muted);
    font-size:13px;
}

.status-dot{
    width:9px;
    height:9px;
    border-radius:50%;
    background:var(--yellow);
}

.status-dot.online{
    background:var(--green);
    box-shadow:0 0 10px rgba(33,208,122,.7);
}

.status-dot.offline{
    background:var(--red);
}

.status-dot.loading{
    animation:pulse 1s infinite;
}

@keyframes pulse{
    50%{opacity:.3}
}

/* =========================
   STATS
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:12px;
    margin-bottom:22px;
}

.stat{
    border:1px solid var(--line);
    background:linear-gradient(145deg,var(--panel),#0a1320);
    border-radius:13px;
    padding:17px;
}

.stat-label{
    color:var(--muted);
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.8px;
}

.stat-value{
    font-size:28px;
    font-weight:700;
    margin-top:7px;
}

.stat.online .stat-value{
    color:var(--green);
}

.stat.offline .stat-value{
    color:var(--red);
}

.stat.connections .stat-value{
    color:var(--blue);
}

/* =========================
   CONTROLS
========================= */

.controls{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:22px;
}

.search{
    flex:1;
    min-width:230px;
}

.search input{
    width:100%;
    padding:11px 13px;
    border-radius:9px;
    border:1px solid var(--line);
    background:#0a1320;
    color:white;
    outline:none;
    font-size:14px;
}

.search input:focus{
    border-color:var(--blue);
    box-shadow:0 0 0 3px rgba(39,147,255,.1);
}

.filter-btn.active{
    background:#176ac7;
    border-color:#2789ed;
}

/* =========================
   SECTION
========================= */

.section{
    margin-bottom:27px;
}

.section-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
}

.section-title{
    display:flex;
    align-items:center;
    gap:9px;
    font-size:15px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:1px;
}

.section-count{
    color:var(--muted);
    font-size:12px;
}

/* =========================
   CARDS
========================= */

.system-grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fill,minmax(245px,1fr));
    gap:12px;
}

.system-card{
    position:relative;
    border:1px solid var(--line);
    background:
        linear-gradient(
            145deg,
            rgba(17,29,45,.96),
            rgba(9,17,29,.96)
        );
    border-radius:13px;
    padding:15px;
    cursor:pointer;
    transition:
        transform .18s,
        border-color .18s,
        box-shadow .18s;
    overflow:hidden;
}

.system-card:hover{
    transform:translateY(-2px);
    border-color:#45617e;
    box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.system-card.selected{
    border-color:var(--blue);
    box-shadow:0 0 0 2px rgba(39,147,255,.13);
}

.card-status-line{
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:3px;
}

.card-status-line.online{
    background:var(--green);
}

.card-status-line.offline{
    background:var(--red);
}

.card-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:10px;
}

.system-icon{
    width:40px;
    height:40px;
    border-radius:10px;
    display:grid;
    place-items:center;
    font-size:20px;
    background:#18283b;
}

.system-name{
    flex:1;
    min-width:0;
}

.system-name h3{
    margin:0;
    font-size:15px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.system-id{
    color:var(--muted);
    font-size:11px;
    margin-top:4px;
}

.badge{
    padding:4px 7px;
    border-radius:20px;
    font-size:9px;
    font-weight:700;
    letter-spacing:.5px;
}

.badge.online{
    color:#07180f;
    background:var(--green);
}

.badge.offline{
    color:white;
    background:var(--red);
}

.card-description{
    color:var(--muted);
    font-size:12px;
    line-height:1.45;
    margin:13px 0;
    min-height:35px;
}

.card-footer{
    border-top:1px solid rgba(36,52,74,.7);
    padding-top:10px;
    display:flex;
    justify-content:space-between;
    color:var(--muted);
    font-size:11px;
}

/* =========================
   GROUP COLORS
========================= */

.group-sports .system-icon{
    color:#ff5d6d;
}

.group-video .system-icon{
    color:#b77aff;
}

.group-radio .system-icon{
    color:#37dc91;
}

.group-news .system-icon{
    color:#ffad50;
}

.group-chat .system-icon{
    color:#2de2ef;
}

.group-games .system-icon{
    color:#f5c451;
}

.group-story .system-icon{
    color:#46d9e7;
}

.group-core .system-icon{
    color:#9ba9ba;
}

/* =========================
   EMPTY
========================= */

.empty{
    padding:30px;
    text-align:center;
    color:var(--muted);
    border:1px dashed var(--line);
    border-radius:12px;
}

/* =========================
   DETAIL PANEL
========================= */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.62);
    backdrop-filter:blur(4px);
    z-index:200;
    display:none;
}

.overlay.open{
    display:block;
}

.detail-panel{
    position:absolute;
    top:0;
    right:0;
    width:min(500px,100%);
    height:100%;
    overflow-y:auto;
    background:#091321;
    border-left:1px solid var(--line);
    box-shadow:-20px 0 60px rgba(0,0,0,.4);
}

.detail-header{
    position:sticky;
    top:0;
    z-index:2;
    background:rgba(9,19,33,.96);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
    padding:18px;
    display:flex;
    justify-content:space-between;
    gap:15px;
}

.detail-title{
    display:flex;
    gap:12px;
    align-items:center;
}

.detail-icon{
    width:45px;
    height:45px;
    border-radius:11px;
    background:#18283b;
    display:grid;
    place-items:center;
    font-size:22px;
}

.detail-title h2{
    margin:0;
    font-size:18px;
}

.detail-title small{
    display:block;
    color:var(--muted);
    margin-top:4px;
}

.close{
    width:36px;
    height:36px;
    padding:0;
    font-size:20px;
}

.detail-body{
    padding:18px;
}

.detail-status{
    display:flex;
    align-items:center;
    gap:10px;
    padding:13px;
    border-radius:10px;
    background:var(--panel);
    border:1px solid var(--line);
    margin-bottom:15px;
}

.detail-status strong{
    margin-left:auto;
}

.detail-section{
    margin-top:20px;
}

.detail-section h3{
    margin:0 0 9px;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:.9px;
    color:var(--muted);
}

.info-row{
    padding:10px 12px;
    border-bottom:1px solid rgba(36,52,74,.6);
    display:flex;
    justify-content:space-between;
    gap:15px;
    font-size:13px;
}

.info-row span:first-child{
    color:var(--muted);
}

.url-list{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.url-item{
    border:1px solid var(--line);
    background:var(--panel);
    border-radius:10px;
    padding:11px;
}

.url-label{
    font-weight:600;
    font-size:13px;
}

.url-type{
    color:var(--muted);
    font-size:10px;
    margin-top:3px;
}

.url-actions{
    display:flex;
    gap:7px;
    margin-top:9px;
    flex-wrap:wrap;
}

.url-actions a{
    text-decoration:none;
    color:white;
    background:#17273b;
    border:1px solid var(--line);
    padding:6px 9px;
    border-radius:7px;
    font-size:11px;
}

.url-actions a:hover{
    background:#203650;
    border-color:#45617e;
}

.connection{
    padding:11px;
    border:1px solid var(--line);
    background:var(--panel);
    border-radius:9px;
    margin-bottom:8px;
}

.connection-main{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
}

.connection-arrow{
    color:var(--blue);
}

.connection-meta{
    color:var(--muted);
    font-size:10px;
    margin-top:6px;
}

.connection-status{
    margin-left:auto;
    font-size:9px;
    font-weight:700;
}

.connection-status.online{
    color:var(--green);
}

.connection-status.offline{
    color:var(--red);
}

/* =========================
   ERROR
========================= */

.error-box{
    display:none;
    margin-bottom:18px;
    padding:14px;
    border:1px solid rgba(255,77,94,.4);
    background:rgba(255,77,94,.08);
    border-radius:10px;
    color:#ff9ca6;
    font-size:13px;
}

.error-box.show{
    display:block;
}

/* =========================
   FOOTER
========================= */

footer{
    max-width:1500px;
    margin:auto;
    padding:10px 22px 30px;
    color:var(--muted);
    font-size:11px;
    text-align:center;
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:900px){

    .stats{
        grid-template-columns:
            repeat(2,1fr);
    }

}

@media(max-width:600px){

    .header-inner{
        padding:14px;
    }

    .header-actions .btn-text{
        display:none;
    }

    main{
        padding:14px;
    }

    .stats{
        grid-template-columns:
            repeat(2,1fr);
    }

    .stat:last-child{
        grid-column:span 2;
    }

    .system-grid{
        grid-template-columns:1fr;
    }

    .status-bar{
        align-items:flex-start;
        flex-direction:column;
    }

}

</style>

</head>

<script>

/* =========================================================
   OBVYRIS CONTROL CENTER
   ========================================================= */

const BACKEND_URL =
    "https://script.google.com/macros/s/AKfycbxmet73uElazLhNTF6K9Ziizu4hbgq7VWbXJ8nKjSeXkn-tN4CyoBDjSdeK69A_J5XG/exec";


let backendData = null;

let systems = [];
let connections = [];
let urls = [];
let nodes = [];

let currentFilter = "ALL";


/* =========================================================
   INITIAL LOAD
   ========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        document
            .getElementById("searchInput")
            .addEventListener(
                "input",
                renderSystems
            );

        loadBackend();

    }
);


/* =========================================================
   LOAD BACKEND
   ========================================================= */

async function loadBackend(){

    const refreshBtn =
        document.getElementById("refreshBtn");

    const dot =
        document.getElementById("connectionDot");

    const text =
        document.getElementById("connectionText");

    const errorBox =
        document.getElementById("errorBox");

    refreshBtn.disabled = true;

    dot.className =
        "status-dot loading";

    text.textContent =
        "Loading Obvyris backend...";

    errorBox.classList.remove("show");

    try{

        const response =
            await fetch(
                BACKEND_URL +
                "?action=all&_=" +
                Date.now(),
                {
                    cache:"no-store"
                }
            );

        if(!response.ok){

            throw new Error(
                "Backend returned HTTP " +
                response.status
            );

        }

        const json =
            await response.json();

        if(!json.success){

            throw new Error(
                json.error ||
                "Backend reported an error."
            );

        }

        backendData =
            json.data || {};

        systems =
            Array.isArray(
                backendData.systems
            )
            ? backendData.systems
            : [];

        connections =
            Array.isArray(
                backendData.connections
            )
            ? backendData.connections
            : [];

        urls =
            Array.isArray(
                backendData.urls
            )
            ? backendData.urls
            : [];

        nodes =
            Array.isArray(
                backendData.nodes
            )
            ? backendData.nodes
            : [];

        dot.className =
            "status-dot online";

        text.textContent =
            "Backend connected";

        document
            .getElementById("generatedText")
            .textContent =
                json.generated
                ? "Generated " +
                  formatDate(json.generated)
                : "";

        updateStats();

        renderSystems();

    }
    catch(error){

        console.error(error);

        dot.className =
            "status-dot offline";

        text.textContent =
            "Backend connection failed";

        errorBox.textContent =
            "Unable to load the Obvyris backend: " +
            error.message;

        errorBox.classList.add("show");

        document
            .getElementById("systemsContainer")
            .innerHTML = `
                <div class="empty">
                    Backend could not be loaded.<br><br>
                    Check the Apps Script deployment
                    and try Refresh.
                </div>
            `;

    }
    finally{

        refreshBtn.disabled = false;

    }

}


/* =========================================================
   STATS
   ========================================================= */

function updateStats(){

    const online =
        systems.filter(
            s =>
                String(s.Status)
                .toUpperCase() === "ONLINE"
        ).length;

    const offline =
        systems.filter(
            s =>
                String(s.Status)
                .toUpperCase() === "OFFLINE"
        ).length;

    document
        .getElementById("statSystems")
        .textContent =
            systems.length;

    document
        .getElementById("statOnline")
        .textContent =
            online;

    document
        .getElementById("statOffline")
        .textContent =
            offline;

    document
        .getElementById("statConnections")
        .textContent =
            connections.length;

    document
        .getElementById("statUrls")
        .textContent =
            urls.length;

}


/* =========================================================
   FILTER
   ========================================================= */

function setFilter(
    filter,
    button
){

    currentFilter =
        filter;

    document
        .querySelectorAll(".filter-btn")
        .forEach(
            b =>
                b.classList.remove("active")
        );

    button.classList.add("active");

    renderSystems();

}


/* =========================================================
   RENDER SYSTEMS
   ========================================================= */

function renderSystems(){

    const container =
        document.getElementById(
            "systemsContainer"
        );

    const search =
        document
            .getElementById("searchInput")
            .value
            .trim()
            .toLowerCase();


    let filtered =
        systems.filter(
            system => {

                const name =
                    String(
                        system["System Name"] || ""
                    );

                const description =
                    String(
                        system.Description || ""
                    );

                const type =
                    String(
                        system.Type || ""
                    );

                const status =
                    String(
                        system.Status || ""
                    );

                const systemId =
                    String(
                        system["System ID"] || ""
                    );

                const matchesSearch =
                    !search ||
                    (
                        name +
                        " " +
                        description +
                        " " +
                        type +
                        " " +
                        status +
                        " " +
                        systemId
                    )
                    .toLowerCase()
                    .includes(search);


                let matchesFilter = true;


                if(
                    currentFilter ===
                    "BACKEND"
                ){

                    matchesFilter =
                        type === "BACKEND";

                }
                else if(
                    currentFilter ===
                    "FRONTEND"
                ){

                    matchesFilter =
                        type === "FRONTEND";

                }
                else if(
                    currentFilter ===
                    "ONLINE"
                ){

                    matchesFilter =
                        status.toUpperCase()
                        === "ONLINE";

                }
                else if(
                    currentFilter ===
                    "OFFLINE"
                ){

                    matchesFilter =
                        status.toUpperCase()
                        === "OFFLINE";

                }


                return (
                    matchesSearch &&
                    matchesFilter
                );

            }
        );


    /*
       Group systems by their node group.
    */

    const groups = {};


    filtered.forEach(
        system => {

            const node =
                findNode(
                    system["System ID"]
                );

            const group =
                node?.Group ||
                inferGroup(
                    system["System Name"]
                );

            if(!groups[group]){
                groups[group] = [];
            }

            groups[group].push(system);

        }
    );


    const groupOrder = [
        "SPORTS",
        "VIDEO",
        "RADIO",
        "NEWS",
        "CHAT",
        "GAMES",
        "STORY",
        "CORE",
        "EXTERNAL"
    ];


    const sortedGroups =
        Object.keys(groups)
        .sort(
            (a,b) => {

                const ai =
                    groupOrder.indexOf(a);

                const bi =
                    groupOrder.indexOf(b);

                if(ai === -1) return 1;
                if(bi === -1) return -1;

                return ai - bi;

            }
        );


    if(!sortedGroups.length){

        container.innerHTML = `
            <div class="empty">
                No systems match your search or filter.
            </div>
        `;

        return;

    }


    container.innerHTML = "";


    sortedGroups.forEach(
        group => {

            const section =
                document.createElement("section");

            section.className =
                "section";


            const header =
                document.createElement("div");

            header.className =
                "section-header";

            header.innerHTML = `
                <div class="section-title">
                    ${groupIcon(group)}
                    ${escapeHtml(group)}
                </div>

                <div class="section-count">
                    ${groups[group].length}
                    system${groups[group].length === 1 ? "" : "s"}
                </div>
            `;


            const grid =
                document.createElement("div");

            grid.className =
                "system-grid";


            groups[group].forEach(
                system => {

                    grid.appendChild(
                        createSystemCard(
                            system,
                            group
                        )
                    );

                }
            );


            section.appendChild(header);
            section.appendChild(grid);

            container.appendChild(section);

        }
    );

}


/* =========================================================
   SYSTEM CARD
   ========================================================= */

function createSystemCard(
    system,
    group
){

    const card =
        document.createElement("article");

    const status =
        String(
            system.Status || "UNKNOWN"
        ).toUpperCase();

    const type =
        String(
            system.Type || ""
        );

    const id =
        system["System ID"];

    const name =
        system["System Name"] ||
        "Unnamed System";

    const description =
        system.Description ||
        "No description available.";


    const systemUrls =
        urls.filter(
            u =>
                String(
                    u["System ID"]
                ) === String(id)
        );


    const systemConnections =
        connections.filter(
            c =>
                String(
                    c["From ID"]
                ) === String(id)
        );


    card.className =
        "system-card " +
        "group-" +
        group.toLowerCase();


    card.innerHTML = `

        <div class="card-status-line ${status.toLowerCase()}"></div>

        <div class="card-top">

            <div class="system-icon">
                ${getIcon(
                    findNode(id)?.Icon,
                    type
                )}
            </div>

            <div class="system-name">

                <h3>
                    ${escapeHtml(name)}
                </h3>

                <div class="system-id">
                    ID: ${escapeHtml(id)}
                    ·
                    ${escapeHtml(type)}
                </div>

            </div>

            <span class="badge ${status.toLowerCase()}">
                ${escapeHtml(status)}
            </span>

        </div>

        <div class="card-description">
            ${escapeHtml(description)}
        </div>

        <div class="card-footer">

            <span>
                ${systemUrls.length}
                URL${systemUrls.length === 1 ? "" : "s"}
            </span>

            <span>
                ${systemConnections.length}
                connection${systemConnections.length === 1 ? "" : "s"}
            </span>

        </div>

    `;


    card.addEventListener(
        "click",
        () => openDetails(system)
    );


    return card;

}

/* =========================================================
   URL ITEM
   ========================================================= */

function createUrlItem(url){

    const value =
        cleanUrl(
            url.URL
        );

    const type =
        url["URL Type"] ||
        "URL";

    const label =
        url.Label ||
        type;


    return `

        <div class="url-item">

            <div class="url-label">
                ${escapeHtml(label)}
            </div>

            <div class="url-type">
                ${escapeHtml(type)}
            </div>

            <div class="url-actions">

                <a
                    href="${escapeAttribute(value)}"
                    target="_blank"
                    rel="noopener">
                    Open
                </a>

                <a
                    href="${escapeAttribute(value)}"
                    target="_blank"
                    rel="noopener">
                    ↗ Visit
                </a>

            </div>

        </div>

    `;

}


/* =========================================================
   CONNECTION ITEM
   ========================================================= */

function createConnectionItem(connection){

    const from =
        findSystem(
            connection["From ID"]
        );

    const to =
        findNode(
            connection["To ID"]
        );


    const fromName =
        from
        ? from["System Name"]
        : connection["From ID"];


    const toName =
        to
        ? to.Name
        : connection["To ID"];


    const status =
        String(
            connection.Status ||
            "UNKNOWN"
        ).toUpperCase();


    return `

        <div class="connection">

            <div class="connection-main">

                <span>
                    ${escapeHtml(
                        fromName
                    )}
                </span>

                <span class="connection-arrow">
                    →
                </span>

                <span>
                    ${escapeHtml(
                        toName
                    )}
                </span>

                <span
                    class="connection-status ${
                        status.toLowerCase()
                    }">

                    ${escapeHtml(status)}

                </span>

            </div>

            <div class="connection-meta">

                ${escapeHtml(
                    connection["Connection Type"] ||
                    "CONNECTION"
                )}

                ·

                ${escapeHtml(
                    connection.Direction ||
                    ""
                )}

                ·

                ${escapeHtml(
                    connection["Connection ID"] ||
                    ""
                )}

            </div>

        </div>

    `;

}


/* =========================================================
   CLOSE PANEL
   ========================================================= */

function closeDetails(){

    document
        .getElementById("overlay")
        .classList.remove("open");

    document.body.style.overflow =
        "";

}


function closePanel(event){

    if(
        event.target.id ===
        "overlay"
    ){

        closeDetails();

    }

}


document.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Escape"
        ){

        }

    }
);


/* =========================================================
   NODE / SYSTEM HELPERS
   ========================================================= */

function findSystem(id){

    return systems.find(
        s =>
            String(
                s["System ID"]
            ) === String(id)
    );

}


function findNode(id){

    return nodes.find(
        n =>
            String(
                n["Node ID"]
            ) === String(id)
    );

}


/* =========================================================
   GROUP INFERENCE
   ========================================================= */

function inferGroup(name){

    const n =
        String(
            name || ""
        ).toLowerCase();


    if(
        n.includes("mlb") ||
        n.includes("nba") ||
        n.includes("nfl") ||
        n.includes("nhl") ||
        n.includes("football")
    ){

        return "SPORTS";

    }

    if(
        n.includes("tv") ||
        n.includes("video")
    ){

        return "VIDEO";

    }

    if(
        n.includes("radio")
    ){

        return "RADIO";

    }

    if(
        n.includes("news")
    ){

        return "NEWS";

    }

    if(
        n.includes("chat")
    ){

        return "CHAT";

    }

    if(
        n.includes("game")
    ){

        return "GAMES";

    }

    if(
        n.includes("story")
    ){

        return "STORY";

    }

    return "CORE";

}


/* =========================================================
   ICONS
========================================================= */

function getIcon(
    icon,
    type
){

    const map = {

        sports:"⚾",
        tv:"📺",
        radio:"📻",
        news:"📰",
        chat:"💬",
        game:"🎮",
        book:"📖",
        server:"🖥️",
        page:"🌐",
        globe:"🌎",
        hub:"◈"

    };


    if(
        icon &&
        map[icon]
    ){

        return map[icon];

    }


    if(
        type === "BACKEND"
    ){

        return "⚙️";

    }


    return "🌐";

}


function groupIcon(group){

    const icons = {

        SPORTS:"⚾",
        VIDEO:"📺",
        RADIO:"📻",
        NEWS:"📰",
        CHAT:"💬",
        GAMES:"🎮",
        STORY:"📖",
        CORE:"◈",
        EXTERNAL:"🌎"

    };

    return icons[group] || "◈";

}


/* =========================================================
   URL CLEANING
========================================================= */

function cleanUrl(value){

    let url =
        String(
            value || ""
        ).trim();


    /*
       Your backend data may contain escaped
       characters such as:
       https\://
    */

    url =
        url.replace(
            /\\\//g,
            "/"
        );


    url =
        url.replace(
            /\\_/g,
            "_"
        );


    /*
       If the URL was accidentally wrapped in
       markdown, extract the actual URL.
    */

    const markdown =
        url.match(
            /\((https?:\/\/[^)]+)\)/
        );


    if(markdown){

        url =
            markdown[1];

    }


    /*
       Remove markdown brackets.
    */

    url =
        url.replace(
            /^\[/,
            ""
        )
        .replace(
            /\]$/,
            ""
        );


    return url;

}


/* =========================================================
   DATE
========================================================= */

function formatDate(value){

    try{

        return new Date(
            value
        ).toLocaleString(
            undefined,
            {
                dateStyle:"short",
                timeStyle:"medium"
            }
        );

    }
    catch(e){

        return value;

    }

}


/* =========================================================
   HTML SAFETY
========================================================= */

function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function escapeAttribute(value){

    return escapeHtml(
        cleanUrl(value)
    );

}
