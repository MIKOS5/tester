<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Obvyris Media OS</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#2793ff">
<meta name="apple-mobile-web-app-capable" content="yes">

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

/* =========================
   🎨 BASE THEME SYSTEM
========================= */
:root{
  --bg:#0b0f18;
  --panel:#111827;
  --text:#fff;
  --muted:#94a3b8;
  --blue:#2793ff;
}

body.light{
  --bg:#f4f6f8;
  --panel:#ffffff;
  --text:#111;
  --muted:#555;
  --blue:#3b82f6;
}

body{
  margin:0;
  font-family:Arial;
  background:var(--bg);
  color:var(--text);
  display:flex;
  height:100vh;
}

/* =========================
   SIDEBAR
========================= */
.sidebar{
  width:340px;
  background:var(--panel);
  overflow:auto;
  padding:10px;
}

.title{
  font-size:24px;
  font-weight:900;
}

/* MODE BUTTONS */
.mode{
  display:flex;
  gap:10px;
  margin:10px 0;
}

button{
  padding:10px;
  border:none;
  border-radius:8px;
  background:var(--blue);
  color:#fff;
  font-weight:700;
}

/* =========================
   MAIN
========================= */
.main{
  flex:1;
  display:flex;
  flex-direction:column;
}

video{
  width:100%;
  height:65vh;
  background:black;
}

/* CHANNEL LIST */
.card{
  background:var(--panel);
  margin:6px 0;
  padding:10px;
  border-radius:10px;
  cursor:pointer;
  border:1px solid #222;
}

/* =========================
   CHAT
========================= */
.chat{
  position:fixed;
  right:20px;
  bottom:120px;
  width:340px;
  height:60vh;
  background:var(--panel);
  border:1px solid #333;
  display:none;
  flex-direction:column;
}

.chat-log{
  flex:1;
  overflow:auto;
  padding:10px;
  font-size:12px;
}

.chat-input{
  display:flex;
}

</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

  <div class="title">📡 Obvyris Media OS</div>

  <button onclick="toggleTheme()">🌙 Theme</button>

  <div class="mode">
    <button onclick="setMode('video')">📺 Video</button>
    <button onclick="setMode('radio')">📻 Radio</button>
  </div>

  <div id="list"></div>

</div>

<!-- MAIN -->
<div class="main">

  <video id="video" controls autoplay></video>

  <div style="padding:10px;display:flex;gap:10px;">
    <button onclick="prev()">⏮</button>
    <button onclick="toggle()">▶</button>
    <button onclick="next()">⏭</button>
    <button onclick="toggleChat()">💬 Chat</button>
  </div>

</div>

<!-- CHAT -->
<div id="chat" class="chat">

  <div style="padding:10px;font-weight:700;">💬 Chat</div>

  <div id="chatLog" class="chat-log"></div>

  <div class="chat-input">
    <input id="name" placeholder="name" maxlength="8">
    <input id="msg" placeholder="message" maxlength="100">
    <button onclick="send()">Send</button>
  </div>

</div>

<script>

/* =========================
   🔥 STATE
========================= */
let mode = "video";
let index = 0;

let videoList = [];
let radioList = [];

const video = document.getElementById("video");

/* =========================
   📺 IPTV LOAD
========================= */
async function loadVideo(){
  const res = await fetch("https://iptv-org.github.io/iptv/index.m3u");
  const text = await res.text();

  const lines = text.split("\n");

  let name="";

  for(let l of lines){
    if(l.includes("#EXTINF")){
      name = l.split(",")[1] || "Channel";
    }
    if(l.startsWith("http")){
      videoList.push({name,url:l});
    }
  }

  render();
}

/* =========================
   📻 RADIO LOAD
========================= */
async function loadRadio(){
  const res = await fetch("https://all.api.radio-browser.info/json/stations/search?limit=200");
  const data = await res.json();

  radioList = data.map(s=>({
    name:s.name,
    url:s.url_resolved,
    id:s.stationuuid
  }));

  render();
}

/* =========================
   RENDER LIST
========================= */
function render(){

  const list = document.getElementById("list");
  list.innerHTML="";

  const arr = mode==="video" ? videoList : radioList;

  arr.slice(0,200).forEach((c,i)=>{
    list.innerHTML += `
      <div class="card" onclick="play(${i})">
        ${c.name}
      </div>
    `;
  });
}

/* =========================
   PLAY
========================= */
function play(i){

  index = i;
  const arr = mode==="video" ? videoList : radioList;
  const item = arr[i];

  if(!item) return;

  if(mode==="video"){

    if(item.url.includes(".m3u8") && Hls.isSupported()){
      const hls = new Hls();
      hls.loadSource(item.url);
      hls.attachMedia(video);
    } else {
      video.src = item.url;
    }

    video.play();

  } else {
    video.src = item.url;
    video.play();
  }

  loadChat();
}

/* =========================
   CONTROLS
========================= */
function next(){
  const arr = mode==="video" ? videoList : radioList;
  index = (index+1)%arr.length;
  play(index);
}

function prev(){
  const arr = mode==="video" ? videoList : radioList;
  index = (index-1+arr.length)%arr.length;
  play(index);
}

function toggle(){
  if(video.paused) video.play();
  else video.pause();
}

/* =========================
   MODE SWITCH
========================= */
function setMode(m){
  mode = m;
  index = 0;
  render();

  if(m==="video") loadVideo();
  else loadRadio();
}

/* =========================
   THEME
========================= */
function toggleTheme(){
  document.body.classList.toggle("light");
}

/* =========================
   CHAT SYSTEM
========================= */
const API =
"https://script.google.com/macros/s/AKfycbzin84qDcZ9L1q4pTBtHZGKJSTDcZ_wnmgWmnmgPgf1jrc1nRprzbEBixKMSHcdkxiZBg/exec";

function room(){
  const arr = mode==="video" ? videoList : radioList;
  return arr[index]?.url || "global";
}

async function loadChat(){
  const res = await fetch(API,{
    method:"POST",
    body: JSON.stringify({
      action:"get",
      station:room()
    })
  });

  const data = await res.json();
  renderChat(data);
}

function renderChat(data){
  const box = document.getElementById("chatLog");
  box.innerHTML="";

  (data||[]).forEach(m=>{
    box.innerHTML += `<div><b>${m.name}:</b> ${m.message}</div>`;
  });

  box.scrollTop = box.scrollHeight;
}

async function send(){
  const name = document.getElementById("name").value;
  const msg = document.getElementById("msg").value;

  await fetch(API,{
    method:"POST",
    body: JSON.stringify({
      action:"send",
      station:room(),
      name,
      message:msg
    })
  });

  loadChat();
}

/* =========================
   CHAT TOGGLE
========================= */
function toggleChat(){
  const c = document.getElementById("chat");
  c.style.display = c.style.display==="flex" ? "none":"flex";
  if(c.style.display==="flex") loadChat();
}

/* =========================
   INIT
========================= */
loadVideo();

</script>

</body>
</html>
