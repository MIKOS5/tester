<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Obvyris Media OS v2.2</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root{
  --bg:#0b0f18;
  --panel:#111827;
  --text:#fff;
  --muted:#9ca3af;
  --blue:#2793ff;
}

body{
  margin:0;
  font-family:Arial;
  background:var(--bg);
  color:var(--text);
  display:flex;
  height:100vh;
}

/* SIDEBAR */
.sidebar{
  width:320px;
  background:var(--panel);
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.header{
  padding:10px;
  font-weight:900;
  font-size:20px;
}

input{
  margin:10px;
  padding:10px;
  border-radius:8px;
  border:none;
}

/* LIST SCROLL AREA */
#list{
  flex:1;
  overflow:auto;
  padding:10px;
}

.card{
  background:#1f2937;
  padding:10px;
  margin:6px 0;
  border-radius:10px;
  cursor:pointer;
  transition:.2s;
}

.card:hover{
  transform:scale(1.02);
  background:#243041;
}

/* MAIN */
.main{
  flex:1;
  display:flex;
  flex-direction:column;
}

video{
  width:100%;
  height:70vh;
  background:black;
}

/* CONTROLS */
.controls{
  display:flex;
  gap:10px;
  padding:10px;
}

button{
  background:var(--blue);
  border:none;
  color:white;
  padding:10px;
  border-radius:8px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="sidebar">
  <div class="header">📡 Obvyris OS v2.2</div>

  <button onclick="setMode('video')">📺 Video</button>
  <button onclick="setMode('radio')">📻 Radio</button>

  <input id="search" placeholder="Search..." oninput="doSearch()"/>

  <div id="list"></div>
</div>

<div class="main">

  <video id="player" controls autoplay></video>

  <div class="controls">
    <button onclick="prev()">⏮</button>
    <button onclick="toggle()">▶</button>
    <button onclick="next()">⏭</button>
  </div>

</div>

<script>

/* ================= STATE ================= */
let mode = "video";
let list = [];
let filtered = [];
let startIndex = 0;

const VISIBLE = 16;
const player = document.getElementById("player");

/* ================= VIDEO LOAD ================= */
async function loadVideo(){

  const res = await fetch("https://iptv-org.github.io/iptv/index.m3u");
  const text = await res.text();

  const lines = text.split("\n");

  let temp = [];

  for(let l of lines){
    if(l.startsWith("http")){
      temp.push({
        name: l.split("/").pop(),
        url: l,
        type:"video"
      });
    }
  }

  list = temp;
  filtered = temp;

  renderVirtual(true);
}

/* ================= RADIO LOAD ================= */
async function loadRadio(){

  const res = await fetch("https://all.api.radio-browser.info/json/stations/search?limit=300");
  const data = await res.json();

  list = data.map(s => ({
    name: s.name,
    url: s.url_resolved,
    type:"radio"
  }));

  filtered = list;

  renderVirtual(true);
}

/* ================= VIRTUAL RENDER ================= */
function renderVirtual(reset=false){

  const el = document.getElementById("list");

  if(reset){
    el.innerHTML = "";
    startIndex = 0;
  }

  const q = (document.getElementById("search").value || "").toLowerCase();

  filtered = list.filter(i =>
    i.name.toLowerCase().includes(q)
  );

  el.innerHTML = "";

  const end = Math.min(startIndex + VISIBLE, filtered.length);

  for(let i=startIndex; i<end; i++){

    const item = filtered[i];

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div style="font-weight:700">${item.name}</div>
      <div style="font-size:11px;opacity:.6">${item.type}</div>
    `;

    div.onclick = () => play(i);

    el.appendChild(div);
  }
}

/* ================= SCROLL ENGINE ================= */
document.getElementById("list").addEventListener("scroll",(e)=>{

  const el = e.target;

  const nearBottom =
    el.scrollTop + el.clientHeight >= el.scrollHeight - 120;

  const nearTop =
    el.scrollTop < 80;

  if(nearBottom){
    startIndex += 6;
    renderVirtual();
  }

  if(nearTop && startIndex > 0){
    startIndex -= 6;
    renderVirtual();
  }
});

/* ================= PLAY ================= */
function play(i){

  const item = filtered[i];
  if(!item) return;

  if(item.url.includes(".m3u8") && Hls.isSupported()){
    const hls = new Hls();
    hls.loadSource(item.url);
    hls.attachMedia(player);
  } else {
    player.src = item.url;
  }

  player.play();
}

/* ================= CONTROLS ================= */
function next(){
  let i = filtered.findIndex(f => f.url === player.src);
  i = (i+1)%filtered.length;
  play(i);
}

function prev(){
  let i = filtered.findIndex(f => f.url === player.src);
  i = (i-1+filtered.length)%filtered.length;
  play(i);
}

function toggle(){
  player.paused ? player.play() : player.pause();
}

/* ================= MODE ================= */
function setMode(m){
  mode = m;
  if(m==="video") loadVideo();
  else loadRadio();
}

/* ================= SEARCH ================= */
function doSearch(){
  startIndex = 0;
  renderVirtual(true);
}

/* ================= INIT ================= */
loadVideo();

</script>

</body>
</html>
