<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
>

<title>Obvyris Server Map</title>

<style>

:root{
    --bg:#050912;
    --panel:#0a1220;
    --panel2:#0e1828;
    --panel3:#111d30;
    --line:#26364d;

    --text:#f4f7fb;
    --muted:#8192a8;

    --blue:#2793ff;
    --cyan:#29d7ff;
    --green:#26d98a;
    --red:#ff5d73;
    --yellow:#ffc857;
    --purple:#a77bff;
    --orange:#ff9d4d;

    --shadow:
        0 15px 45px rgba(0,0,0,.38);

    --radius:12px;
}

*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

/* =========================================================
   TOP BAR
========================================================= */

#topbar{
    position:fixed;
    z-index:1000;

    left:14px;
    right:14px;
    top:14px;

    height:64px;

    display:flex;
    align-items:center;
    gap:12px;

    padding:10px 14px;

    background:rgba(8,15,27,.94);
    border:1px solid #1e2d43;

    border-radius:14px;

    box-shadow:var(--shadow);

    backdrop-filter:blur(14px);
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;

    min-width:220px;
}

.brand-mark{
    width:38px;
    height:38px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:10px;

    background:
        linear-gradient(
            135deg,
            #2793ff,
            #8a55ff
        );

    font-weight:900;
    color:white;
}

.brand-text{
    display:flex;
    flex-direction:column;
}

.brand-title{
    font-size:15px;
    font-weight:800;
    letter-spacing:.5px;
}

.brand-sub{
    font-size:10px;
    color:var(--muted);
    letter-spacing:1px;
    text-transform:uppercase;
}

.toolbar{
    display:flex;
    align-items:center;
    gap:7px;
    flex:1;
}

button,
input,
select{
    font:inherit;
}

.tool-btn{
    height:38px;
    padding:0 12px;

    border:1px solid #26364d;
    border-radius:8px;

    background:#0d1727;
    color:#dce6f3;

    cursor:pointer;

    transition:
        background .15s,
        border .15s,
        transform .15s;
}

.tool-btn:hover{
    background:#142238;
    border-color:#365273;
}

.tool-btn:active{
    transform:translateY(1px);
}

.search{
    height:38px;
    width:220px;

    padding:0 12px;

    border-radius:8px;
    border:1px solid #26364d;

    background:#080f1b;
    color:white;

    outline:none;
}

.search:focus{
    border-color:var(--blue);
}

#apiState{
    margin-left:auto;

    display:flex;
    align-items:center;
    gap:7px;

    font-size:11px;
    color:var(--muted);

    white-space:nowrap;
}

.state-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--yellow);
}

.state-dot.online{
    background:var(--green);
    box-shadow:0 0 10px rgba(38,217,138,.6);
}

.state-dot.error{
    background:var(--red);
}

/* =========================================================
   WORKSPACE
========================================================= */

#workspace{
    position:absolute;
    inset:0;

    overflow:hidden;

    cursor:grab;

    background:
        radial-gradient(
            circle at center,
            rgba(39,147,255,.045),
            transparent 42%
        );
}

#workspace.dragging{
    cursor:grabbing;
}

/*
    Huge infinite-style canvas.
*/
#world{
    position:absolute;

    left:50%;
    top:50%;

    width:10000px;
    height:10000px;

    transform-origin:5000px 5000px;

    will-change:transform;
}

/* =========================================================
   GRID
========================================================= */

#grid{
    position:absolute;
    inset:0;

    background-image:
        linear-gradient(
            rgba(87,117,151,.09) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(87,117,151,.09) 1px,
            transparent 1px
        );

    background-size:80px 80px;

    pointer-events:none;
}

#grid::after{
    content:"";

    position:absolute;
    inset:0;

    background:
        radial-gradient(
            circle,
            transparent 45%,
            rgba(0,0,0,.42) 100%
        );
}

/* =========================================================
   SVG CONNECTION LAYER
========================================================= */

#connections{
    position:absolute;
    inset:0;

    width:100%;
    height:100%;

    overflow:visible;

    pointer-events:none;
}

.connection{
    fill:none;

    stroke:#31506f;
    stroke-width:2;

    opacity:.72;

    vector-effect:non-scaling-stroke;
}

.connection.backend{
    stroke:#278eff;
}

.connection.external{
    stroke:#a77bff;
}

.connection.frontend{
    stroke:#26d98a;
}

.connection.sheet{
    stroke:#29d7ff;
}

.connection.api{
    stroke:#ffc857;
}

.connection.ghost{
    stroke-dasharray:7 8;
    opacity:.38;
}

.connection-dot{
    fill:#6e8bab;
}

/* =========================================================
   HUB
========================================================= */

#hub{
    position:absolute;

    left:5000px;
    top:5000px;

    width:190px;
    min-height:130px;

    transform:
        translate(-50%,-50%);

    z-index:100;

    border-radius:20px;

    background:
        linear-gradient(
            145deg,
            #12243d,
            #091322
        );

    border:2px solid var(--blue);

    box-shadow:
        0 0 0 8px rgba(39,147,255,.05),
        0 0 55px rgba(39,147,255,.22),
        var(--shadow);

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    user-select:none;
}

.hub-ring{
    position:absolute;
    inset:-15px;

    border-radius:28px;

    border:1px dashed rgba(39,147,255,.3);

    pointer-events:none;
}

.hub-icon{
    width:42px;
    height:42px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#102d4d;

    color:#55b1ff;

    font-size:20px;
    font-weight:900;

    margin-bottom:8px;
}

.hub-title{
    font-size:18px;
    font-weight:900;
    letter-spacing:1px;
}

.hub-sub{
    margin-top:4px;

    color:#83a7ca;

    font-size:10px;
    text-transform:uppercase;
    letter-spacing:1.4px;
}

/* =========================================================
   NODE
========================================================= */

.node{
    position:absolute;

    width:170px;

    min-height:68px;

    transform:
        translate(-50%,-50%);

    z-index:20;

    padding:10px 12px;

    background:
        linear-gradient(
            145deg,
            rgba(17,29,48,.98),
            rgba(8,15,27,.98)
        );

    border:1px solid #293c55;

    border-radius:10px;

    box-shadow:
        0 8px 25px rgba(0,0,0,.35);

    cursor:move;

    user-select:none;

    transition:
        border-color .15s,
        box-shadow .15s;
}

.node:hover{
    border-color:#4d6d91;

    box-shadow:
        0 12px 32px rgba(0,0,0,.45),
        0 0 0 1px rgba(39,147,255,.12);
}

.node.selected{
    border-color:var(--blue);

    box-shadow:
        0 0 0 2px rgba(39,147,255,.18),
        0 12px 35px rgba(0,0,0,.5);
}

.node.offline{
    border-color:
        rgba(255,93,115,.6);
}

.node.online{
    border-color:
        rgba(38,217,138,.38);
}

.node.external-node{
    border-color:
        rgba(167,123,255,.42);
}

.node.backend-node{
    border-color:
        rgba(39,147,255,.45);
}

.node.sheet-node{
    border-color:
        rgba(41,215,255,.42);
}

.node.api-node{
    border-color:
        rgba(255,200,87,.42);
}

.node.frontend-node{
    border-color:
        rgba(38,217,138,.42);
}

.node-head{
    display:flex;
    align-items:center;

    gap:7px;

    margin-bottom:5px;
}

.node-icon{
    width:22px;
    height:22px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:6px;

    background:#17253a;

    color:#8ca5c1;

    font-size:11px;
    font-weight:900;

    flex:none;
}

.node-type{
    font-size:9px;

    text-transform:uppercase;

    letter-spacing:1px;

    color:#71869f;
}

.node-name{
    font-size:12px;

    font-weight:800;

    line-height:1.25;

    word-break:break-word;
}

.node-url{
    margin-top:5px;

    color:#6f839b;

    font-size:9px;

    overflow:hidden;

    white-space:nowrap;

    text-overflow:ellipsis;
}

.status-badge{
    position:absolute;

    right:8px;
    top:8px;

    width:7px;
    height:7px;

    border-radius:50%;

    background:#64748b;
}

.node.online .status-badge{
    background:var(--green);

    box-shadow:
        0 0 9px rgba(38,217,138,.6);
}

.node.offline .status-badge{
    background:var(--red);

    box-shadow:
        0 0 8px rgba(255,93,115,.5);
}

/* =========================================================
   LEGEND
========================================================= */

#legend{
    position:fixed;

    left:18px;
    bottom:18px;

    z-index:900;

    display:flex;
    flex-wrap:wrap;

    gap:12px;

    padding:10px 12px;

    border:
        1px solid #203148;

    background:
        rgba(7,14,25,.9);

    border-radius:10px;

    backdrop-filter:blur(10px);

    font-size:10px;

    color:#91a3b8;
}

.legend-item{
    display:flex;
    align-items:center;
    gap:6px;
}

.legend-line{
    width:20px;
    height:2px;

    background:#31506f;
}

.legend-line.backend{
    background:var(--blue);
}

.legend-line.external{
    background:var(--purple);
}

.legend-line.frontend{
    background:var(--green);
}

.legend-line.api{
    background:var(--yellow);
}

/* =========================================================
   ZOOM
========================================================= */

#zoomPanel{
    position:fixed;

    right:18px;
    bottom:18px;

    z-index:900;

    display:flex;
    flex-direction:column;

    gap:5px;
}

.zoom-btn{
    width:38px;
    height:38px;

    border:1px solid #26364d;

    background:
        rgba(8,15,27,.94);

    color:white;

    border-radius:8px;

    cursor:pointer;

    font-size:18px;
}

.zoom-btn:hover{
    border-color:#416487;
    background:#142238;
}

#zoomValue{
    width:38px;
    padding:4px 0;

    text-align:center;

    font-size:9px;

    color:#8295ab;

    background:
        rgba(8,15,27,.9);

    border-radius:5px;
}

/* =========================================================
   DETAILS PANEL
========================================================= */

#details{
    position:fixed;

    top:92px;
    right:18px;

    z-index:950;

    width:330px;
    max-height:
        calc(100vh - 120px);

    overflow:auto;

    display:none;

    background:
        rgba(8,15,27,.97);

    border:
        1px solid #26364d;

    border-radius:14px;

    box-shadow:var(--shadow);

    backdrop-filter:blur(16px);
}

#details.open{
    display:block;
}

.details-head{
    position:sticky;
    top:0;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:14px;

    background:
        rgba(8,15,27,.96);

    border-bottom:
        1px solid #1d2c40;
}

.details-title{
    font-size:14px;
    font-weight:900;
}

.close-details{
    width:28px;
    height:28px;

    border:1px solid #26364d;

    background:#101b2b;

    color:#cbd5e1;

    border-radius:7px;

    cursor:pointer;
}

.details-body{
    padding:14px;
}

.detail-row{
    margin-bottom:14px;
}

.detail-label{
    margin-bottom:4px;

    font-size:9px;

    color:#70839a;

    text-transform:uppercase;

    letter-spacing:1px;
}

.detail-value{
    color:#e3ebf5;

    font-size:11px;

    line-height:1.45;

    word-break:break-word;
}

.detail-value a{
    color:#4ea7ff;

    text-decoration:none;
}

.detail-value a:hover{
    text-decoration:underline;
}

/* =========================================================
   EMPTY / LOADING
========================================================= */

#loading{
    position:fixed;

    inset:0;

    z-index:2000;

    display:flex;

    align-items:center;
    justify-content:center;

    background:#050912;
}

.loader-box{
    text-align:center;
}

.loader{
    width:38px;
    height:38px;

    margin:0 auto 12px;

    border:
        3px solid #203149;

    border-top-color:
        var(--blue);

    border-radius:50%;

    animation:
        spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

.loader-text{
    color:#8da0b8;
    font-size:11px;
}

/* =========================================================
   ERROR
========================================================= */

#errorBox{
    position:fixed;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    z-index:1900;

    display:none;

    width:min(500px,90vw);

    padding:25px;

    background:#0c1625;

    border:1px solid #553040;

    border-radius:14px;

    box-shadow:var(--shadow);
}

#errorBox h2{
    margin:0 0 8px;
    font-size:17px;
}

#errorBox p{
    margin:0;

    color:#9aabba;

    font-size:12px;

    line-height:1.6;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:850px){

    #topbar{
        left:8px;
        right:8px;
        top:8px;

        height:auto;

        flex-wrap:wrap;
    }

    .brand{
        min-width:auto;
    }

    .toolbar{
        width:100%;
        flex-wrap:wrap;
    }

    .search{
        flex:1;
        min-width:140px;
    }

    #apiState{
        margin-left:0;
    }

    #details{
        left:10px;
        right:10px;

        width:auto;

        top:auto;
        bottom:70px;

        max-height:55vh;
    }

    #legend{
        left:8px;
        right:60px;
        bottom:8px;
    }

}

</style>
</head>

<body>

<!-- =======================================================
     TOP BAR
======================================================= -->

<header id="topbar">

    <div class="brand">

        <div class="brand-mark">
            O
        </div>

        <div class="brand-text">

            <div class="brand-title">
                OBVYRIS SERVER MAP
            </div>

            <div class="brand-sub">
                Infrastructure Workflow
            </div>

        </div>

    </div>

    <div class="toolbar">

        <input
            id="search"
            class="search"
            type="search"
            placeholder="Search server, API, frontend..."
        >

        <button
            id="fitBtn"
            class="tool-btn"
            title="Fit entire map"
        >
            Fit
        </button>

        <button
            id="resetBtn"
            class="tool-btn"
            title="Reset saved layout"
        >
            Reset
        </button>

        <button
            id="refreshBtn"
            class="tool-btn"
            title="Reload MAP API"
        >
            Refresh
        </button>

        <select
            id="filter"
            class="tool-btn"
            title="Filter map"
        >
            <option value="all">All</option>
            <option value="online">Online</option>
            <option value="offline">Offline</option>
        </select>

    </div>

    <div id="apiState">

        <span
            id="apiDot"
            class="state-dot"
        ></span>

        <span id="apiText">
            Loading MAP API
        </span>

    </div>

</header>


<!-- =======================================================
     WORKSPACE
======================================================= -->

<main id="workspace">

    <div id="world">

        <div id="grid"></div>

        <svg
            id="connections"
            viewBox="0 0 10000 10000"
            preserveAspectRatio="none"
        >
        </svg>

        <div id="nodes"></div>

        <div id="hub">

            <div class="hub-ring"></div>

            <div class="hub-icon">
                ◈
            </div>

            <div class="hub-title">
                OBVYRIS HUB
            </div>

            <div class="hub-sub">
                Central Routing Layer
            </div>

        </div>

    </div>

</main>


<!-- =======================================================
     DETAILS
======================================================= -->

<aside id="details">

    <div class="details-head">

        <div
            id="detailsTitle"
            class="details-title"
        >
            Node Details
        </div>

        <button
            id="closeDetails"
            class="close-details"
        >
            ×
        </button>

    </div>

    <div
        id="detailsBody"
        class="details-body"
    >
    </div>

</aside>


<!-- =======================================================
     LEGEND
======================================================= -->

<div id="legend">

    <div class="legend-item">
        <span class="legend-line backend"></span>
        Backend
    </div>

    <div class="legend-item">
        <span class="legend-line"></span>
        Sheet
    </div>

    <div class="legend-item">
        <span class="legend-line api"></span>
        Sheet API
    </div>

    <div class="legend-item">
        <span class="legend-line frontend"></span>
        Frontend
    </div>

    <div class="legend-item">
        <span class="legend-line external"></span>
        External
    </div>

</div>


<!-- =======================================================
     ZOOM
======================================================= -->

<div id="zoomPanel">

    <button
        id="zoomIn"
        class="zoom-btn"
    >
        +
    </button>

    <div id="zoomValue">
        100%
    </div>

    <button
        id="zoomOut"
        class="zoom-btn"
    >
        −
    </button>

</div>


<!-- =======================================================
     LOADING
======================================================= -->

<div id="loading">

    <div class="loader-box">

        <div class="loader"></div>

        <div class="loader-text">
            Loading Obvyris infrastructure...
        </div>

    </div>

</div>


<!-- =======================================================
     ERROR
======================================================= -->

<div id="errorBox">

    <h2>
        MAP API Error
    </h2>

    <p id="errorText"></p>

</div>


<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const MAP_API =
    "https://script.google.com/macros/s/AKfycbxmet73uElazLhNTF6K9Ziizu4hbgq7VWbXJ8nKjSeXkn-tN4CyoBDjSdeK69A_J5XG/exec";


const STORAGE_KEY =
    "obvyris_server_map_layout_v4";


/*
    Central point in our giant virtual world.
*/
const HUB_X = 5000;
const HUB_Y = 5000;


/*
    Infinite-style zoom range.
*/
const MIN_ZOOM = 0.08;
const MAX_ZOOM = 8;


/* =========================================================
   DOM
========================================================= */

const workspace =
    document.getElementById("workspace");

const world =
    document.getElementById("world");

const nodesLayer =
    document.getElementById("nodes");

const svg =
    document.getElementById("connections");

const searchInput =
    document.getElementById("search");

const filterSelect =
    document.getElementById("filter");

const details =
    document.getElementById("details");

const detailsTitle =
    document.getElementById("detailsTitle");

const detailsBody =
    document.getElementById("detailsBody");

const loading =
    document.getElementById("loading");

const errorBox =
    document.getElementById("errorBox");

const errorText =
    document.getElementById("errorText");

const apiDot =
    document.getElementById("apiDot");

const apiText =
    document.getElementById("apiText");

const zoomValue =
    document.getElementById("zoomValue");


/* =========================================================
   STATE
========================================================= */

let mapRows = [];

let nodeList = [];

let nodeMap = new Map();

let connections = [];

let selectedNode = null;


/*
    Camera:
    screen = world * zoom + pan
*/
let zoom = 1;

let panX = 0;

let panY = 0;


/*
    Workspace panning.
*/
let panning = false;

let panStartX = 0;

let panStartY = 0;

let initialPanX = 0;

let initialPanY = 0;


/*
    Node dragging.
*/
let draggingNode = null;

let nodeDragOffsetX = 0;

let nodeDragOffsetY = 0;


/*
    Used to distinguish clicking from dragging.
*/
let movedDuringPointer = false;


/* =========================================================
   UTILITIES
========================================================= */

function clean(value){

    if(
        value === null ||
        value === undefined
    ){
        return "";
    }

    return String(value).trim();

}


function validUrl(value){

    if(!value){
        return false;
    }

    if(
        value === "#" ||
        value === "javascript:void(0)"
    ){
        return false;
    }

    try{

        const u =
            new URL(value);

        return (
            u.protocol === "http:" ||
            u.protocol === "https:"
        );

    }catch(e){

        return false;

    }

}


function escapeHtml(value){

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function shortUrl(value){

    if(!value){
        return "";
    }

    return value
        .replace(/^https?:\/\//,"")
        .replace(/^www\./,"");

}


function getRowId(row,index){

    return (
        clean(row["ID"]) ||
        "row-" + index
    );

}


function isOnline(row){

    return (
        clean(row["Status"]).toUpperCase()
        ===
        "ONLINE"
    );

}


function isOffline(row){

    return (
        clean(row["Status"]).toUpperCase()
        ===
        "OFFLINE"
    );

}


/* =========================================================
   API STATUS
========================================================= */

function setApiState(
    state,
    text
){

    apiText.textContent = text;

    apiDot.className =
        "state-dot";

    if(state === "online"){

        apiDot.classList.add("online");

    }

    if(state === "error"){

        apiDot.classList.add("error");

    }

}


/* =========================================================
   LOAD API
========================================================= */

async function loadMap(){

    setApiState(
        "loading",
        "Loading MAP API"
    );

    loading.style.display =
        "flex";

    errorBox.style.display =
        "none";

    try{

        const response =
            await fetch(
                MAP_API +
                "?t=" +
                Date.now(),
                {
                    method:"GET",
                    cache:"no-store"
                }
            );

        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }

        const data =
            await response.json();

        if(
            !data ||
            !Array.isArray(data.rows)
        ){

            throw new Error(
                "The API did not return a rows array."
            );

        }

        mapRows =
            data.rows;

        setApiState(
            "online",
            mapRows.length +
            " MAP records"
        );

        buildMap();

        loading.style.display =
            "none";

    }catch(error){

        console.error(error);

        setApiState(
            "error",
            "MAP API unavailable"
        );

        loading.style.display =
            "none";

        errorText.textContent =
            "Unable to load the Obvyris MAP API. " +
            error.message;

        errorBox.style.display =
            "block";

    }

}


/* =========================================================
   NODE CREATION
========================================================= */

function createNode(
    id,
    type,
    name,
    url,
    row,
    rowIndex,
    field
){

    const node = {

        id,

        type,

        name,

        url,

        row,

        rowIndex,

        field,

        x: HUB_X,

        y: HUB_Y,

        element:null

    };

    nodeList.push(node);

    nodeMap.set(
        id,
        node
    );

    return node;

}


/* =========================================================
   NODE TYPES
========================================================= */

function typeClass(type){

    if(type === "BACKEND"){
        return "backend-node";
    }

    if(type === "SHEET"){
        return "sheet-node";
    }

    if(type === "SHEET API"){
        return "api-node";
    }

    if(type === "FRONTEND"){
        return "frontend-node";
    }

    if(type === "EXTERNAL"){
        return "external-node";
    }

    if(type === "EXTERNAL API"){
        return "external-node";
    }

    return "";

}


function typeIcon(type){

    switch(type){

        case "BACKEND":
            return "B";

        case "SHEET":
            return "S";

        case "SHEET API":
            return "A";

        case "FRONTEND":
            return "F";

        case "EXTERNAL":
            return "E";

        case "EXTERNAL API":
            return "X";

        default:
            return "•";

    }

}


/* =========================================================
   ADD CONNECTION
========================================================= */

function connect(
    from,
    to,
    className
){

    if(
        !from ||
        !to
    ){
        return;
    }

    connections.push({

        from,
        to,

        className:
            className || ""

    });

}


/* =========================================================
   BUILD ROW BRANCH
========================================================= */

function buildRow(
    row,
    index
){

    const rowId =
        getRowId(
            row,
            index
        );


    /*
        Every row gets its own isolated
        branch.

        NOTHING from one row connects
        to another row's data.
    */


    let previous =
        null;


    /* -----------------------------------------
       BACKEND
    ----------------------------------------- */

    const backendName =
        clean(
            row["Backends Sheet"]
        );

    let backend = null;

    if(backendName){

        backend =
            createNode(
                `${rowId}-backend`,
                "BACKEND",
                backendName,
                "",
                row,
                index,
                "Backends Sheet"
            );

        connect(
            "hub",
            backend.id,
            "backend"
        );

        previous =
            backend;

    }


    /* -----------------------------------------
       SHEET
    ----------------------------------------- */

    const sheetUrl =
        clean(
            row["Sheet"]
        );

    if(sheetUrl){

        const sheet =
            createNode(
                `${rowId}-sheet`,
                "SHEET",
                "Sheet",
                sheetUrl,
                row,
                index,
                "Sheet"
            );

        if(previous){

            connect(
                previous.id,
                sheet.id,
                "sheet"
            );

        }else{

            connect(
                "hub",
                sheet.id,
                "sheet"
            );

        }

        previous =
            sheet;

    }


    /* -----------------------------------------
       SHEET API
    ----------------------------------------- */

    const sheetApi =
        clean(
            row["Sheet API"]
        );

    if(sheetApi){

        const api =
            createNode(
                `${rowId}-sheetapi`,
                "SHEET API",
                "Sheet API",
                sheetApi,
                row,
                index,
                "Sheet API"
            );

        if(previous){

            connect(
                previous.id,
                api.id,
                "api"
            );

        }else{

            connect(
                "hub",
                api.id,
                "api"
            );

        }

        previous =
            api;

    }


    /*
        Status intentionally does NOT become
        a visual node.

        It remains attached to the row and
        is available in details/API data.
    */


    /* -----------------------------------------
       FRONTENDS 1-5
    ----------------------------------------- */

    const frontendFields = [

        "MAIN HTML FRONTEND",
        "HTML FRONTEND 2",
        "HTML FRONTEND 3",
        "HTML FRONTEND 4",
        "HTML FRONTEND 5"

    ];


    frontendFields.forEach(
        function(field){

            const url =
                clean(
                    row[field]
                );

            if(!url){
                return;
            }

            const frontend =
                createNode(
                    `${rowId}-${field}`,
                    "FRONTEND",
                    field
                        .replace(
                            "HTML FRONTEND",
                            "Frontend"
                        )
                        .replace(
                            "MAIN",
                            "1"
                        ),
                    url,
                    row,
                    index,
                    field
                );


            if(previous){

                connect(
                    previous.id,
                    frontend.id,
                    "frontend"
                );

            }else{

                connect(
                    "hub",
                    frontend.id,
                    "frontend"
                );

            }


            /*
                Frontends from the SAME row
                branch from the previous backend
                pipeline.

                They never connect to another
                row.
            */

        }
    );


    /* -----------------------------------------
       EXTERNAL
    ----------------------------------------- */

    const externalName =
        clean(
            row["EXTERNAL"]
        );

    const externalApi =
        clean(
            row["EXTERNAL API"]
        );

    const externalApi2 =
        clean(
            row["EXTERNAL API 2"]
        );


    /*
        External branch is routed toward
        the SOUTH of the hub.
    */

    let externalNode =
        null;


    if(externalName){

        externalNode =
            createNode(
                `${rowId}-external`,
                "EXTERNAL",
                externalName,
                "",
                row,
                index,
                "EXTERNAL"
            );

        connect(
            "hub",
            externalNode.id,
            "external"
        );

    }else if(externalApi){

        /*
            If the external description cell
            is empty, still create the API node.
        */

        externalNode =
            createNode(
                `${rowId}-external`,
                "EXTERNAL",
                "External",
                "",
                row,
                index,
                "EXTERNAL"
            );

        connect(
            "hub",
            externalNode.id,
            "external"
        );

    }


    if(externalApi){

        const apiNode =
            createNode(
                `${rowId}-external-api`,
                "EXTERNAL API",
                "External API",
                externalApi,
                row,
                index,
                "EXTERNAL API"
            );

        if(externalNode){

            connect(
                externalNode.id,
                apiNode.id,
                "external"
            );

        }else{

            connect(
                "hub",
                apiNode.id,
                "external"
            );

        }

    }


    if(externalApi2){

        const api2 =
            createNode(
                `${rowId}-external-api-2`,
                "EXTERNAL API",
                "External API 2",
                externalApi2,
                row,
                index,
                "EXTERNAL API 2"
            );


        if(externalApi){

            connect(
                `${rowId}-external-api`,
                api2.id,
                "external"
            );

        }else if(externalNode){

            connect(
                externalNode.id,
                api2.id,
                "external"
            );

        }else{

            connect(
                "hub",
                api2.id,
                "external"
            );

        }

    }

}


/* =========================================================
   BUILD COMPLETE MAP
========================================================= */

function buildMap(){

    nodeList = [];

    nodeMap =
        new Map();

    connections = [];

    nodesLayer.innerHTML =
        "";

    svg.innerHTML =
        "";


    mapRows.forEach(
        function(row,index){

            buildRow(
                row,
                index
            );

        }
    );


    applySavedLayout();

    createNodeElements();

    positionNewNodes();

    applyFilter();

    render();

}


/* =========================================================
   POSITION DEFAULT NODES
========================================================= */

function positionNewNodes(){

    const backendNodes =
        nodeList.filter(
            n =>
                n.type === "BACKEND"
        );

    const externalNodes =
        nodeList.filter(
            n =>
                n.type === "EXTERNAL" ||
                n.type === "EXTERNAL API"
        );


    /*
        BACKENDS NORTH
    */

    arrangeArc(
        backendNodes,
        HUB_X,
        HUB_Y - 850,
        1500,
        -Math.PI * .88,
        -Math.PI * .12
    );


    /*
        EXTERNALS SOUTH
    */

    arrangeArc(
        externalNodes,
        HUB_X,
        HUB_Y + 850,
        1700,
        Math.PI * .12,
        Math.PI * .88
    );


    /*
        Put remaining branch nodes around
        their row's backend/external structure.
    */

    mapRows.forEach(
        function(row,index){

            const rowId =
                getRowId(
                    row,
                    index
                );


            const branch =
                nodeList.filter(
                    n =>
                        n.rowIndex === index &&
                        n.type !== "BACKEND" &&
                        n.type !== "EXTERNAL" &&
                        n.type !== "EXTERNAL API"
                );


            const backend =
                nodeMap.get(
                    `${rowId}-backend`
                );


            const external =
                nodeMap.get(
                    `${rowId}-external`
                );


            /*
                If backend exists, place sheet,
                sheet API and frontends along
                its branch.
            */

            if(backend){

                arrangeBranch(
                    branch,
                    backend,
                    false
                );

            }else if(external){

                arrangeBranch(
                    branch,
                    external,
                    true
                );

            }

        }
    );

}


/* =========================================================
   ARC ARRANGEMENT
========================================================= */

function arrangeArc(
    nodes,
    centerX,
    centerY,
    radius,
    startAngle,
    endAngle
){

    if(!nodes.length){
        return;
    }


    nodes.forEach(
        function(node,index){

            let t;

            if(nodes.length === 1){

                t = .5;

            }else{

                t =
                    index /
                    (nodes.length - 1);

            }


            const angle =
                startAngle +
                (
                    endAngle -
                    startAngle
                ) *
                t;


            node.x =
                centerX +
                Math.cos(angle) *
                radius;

            node.y =
                centerY +
                Math.sin(angle) *
                radius;

        }
    );

}


/* =========================================================
   BRANCH ARRANGEMENT
========================================================= */

function arrangeBranch(
    nodes,
    anchor,
    south
){

    if(!nodes.length){
        return;
    }


    /*
        Group belongs to one MAP row.

        Place children progressively outward.
    */

    const distance =
        south ? 280 : 320;

    const vertical =
        south ? 190 : -190;


    nodes.forEach(
        function(node,index){

            const column =
                index % 5;

            const row =
                Math.floor(
                    index / 5
                );


            node.x =
                anchor.x +
                (
                    column - 2
                ) *
                distance;

            node.y =
                anchor.y +
                vertical +
                row *
                (
                    south ? 170 : -170
                );

        }
    );

}

                );

            );


            node.element =
                el;


            attachNodeEvents(

            );

        }
    );

/* =========================================================
   NODE EVENTS
========================================================= */

function attachNodeEvents(
    node
){

    const el =
        node.element;


    el.addEventListener(
        "pointerdown",
        function(event){

            event.stopPropagation();

            movedDuringPointer =
                false;

            draggingNode =
                node;

            const worldPoint =
                screenToWorld(
                    event.clientX,
                    event.clientY
                );


            nodeDragOffsetX =
                node.x -
                worldPoint.x;

            nodeDragOffsetY =
                node.y -
                worldPoint.y;


            el.setPointerCapture(
                event.pointerId
            );

        }
    );


    el.addEventListener(
        "pointermove",
        function(event){

            if(
                draggingNode !== node
            ){

                return;

            }


            movedDuringPointer =
                true;


            const point =
                screenToWorld(
                    event.clientX,
                    event.clientY
                );


            node.x =
                point.x +
                nodeDragOffsetX;


            node.y =
                point.y +
                nodeDragOffsetY;


            render();

        }
    );


    el.addEventListener(
        "pointerup",
        function(event){

            if(
                draggingNode !== node
            ){

                return;

            }


            draggingNode =
                null;


            try{

                el.releasePointerCapture(
                    event.pointerId
                );

            }catch(e){}


            saveLayout();


            if(
                !movedDuringPointer
            ){

                selectNode(
                    node
                );

            }

        }
    );


    el.addEventListener(
        "dblclick",
        function(event){

            event.stopPropagation();

            if(
                validUrl(
                    node.url
                )
            ){

                window.open(
                    node.url,
                    "_blank",
                    "noopener"
                );

            }

        }
    );

}

/* =========================================================
   WORLD TRANSFORM
========================================================= */

function updateWorldTransform(){

    world.style.transform =
        `
        translate(
            ${panX}px,
            ${panY}px
        )
        scale(
            ${zoom}
        )
        `;

    zoomValue.textContent =
        Math.round(
            zoom * 100
        ) +
        "%";

}


/* =========================================================
   SCREEN / WORLD CONVERSION
========================================================= */

function screenToWorld(
    screenX,
    screenY
){

    const rect =
        workspace.getBoundingClientRect();


    const x =
        screenX -
        rect.left -
        rect.width / 2;


    const y =
        screenY -
        rect.top -
        rect.height / 2;


    return {

        x:
            HUB_X +
            (
                x -
                panX
            ) /
            zoom,

        y:
            HUB_Y +
            (
                y -
                panY
            ) /
            zoom

    };

}


/* =========================================================
   WORLD / SCREEN
========================================================= */

function worldToScreen(
    x,
    y
){

    const rect =
        workspace.getBoundingClientRect();


    return {

        x:
            rect.width / 2 +
            panX +
            (
                x -
                HUB_X
            ) *
            zoom,

        y:
            rect.height / 2 +
            panY +
            (
                y -
                HUB_Y
            ) *
            zoom

    };

}


/* =========================================================
   RENDER
========================================================= */

function render(){

    updateWorldTransform();


    /*
        Nodes
    */

    nodeList.forEach(
        function(node){

            if(!node.element){
                return;
            }


            node.element.style.left =
                node.x +
                "px";


            node.element.style.top =
                node.y +
                "px";

        }
    );


    /*
        Connections
    */

    drawConnections();

}


/* =========================================================
   DRAW CONNECTIONS
========================================================= */

function drawConnections(){

    svg.innerHTML =
        "";


    connections.forEach(
        function(connection){

            const from =
                connection.from === "hub"
                    ? {
                        x:HUB_X,
                        y:HUB_Y
                    }
                    : nodeMap.get(
                        connection.from
                    );


            const to =
                nodeMap.get(
                    connection.to
                );


            if(!from || !to){
                return;
            }


            const path =
                document.createElementNS(
                    "http://www.w3.org/2000/svg",
                    "path"
                );


            const x1 =
                from.x;

            const y1 =
                from.y;

            const x2 =
                to.x;

            const y2 =
                to.y;


            const dx =
                Math.abs(
                    x2 -
                    x1
                );


            const control =
                Math.max(
                    80,
                    dx * .35
                );


            /*
                Smooth workflow curve.
            */

            const pathData =
                `
                M ${x1} ${y1}

                C
                ${x1 + control}
                ${y1}
                ${x2 - control}
                ${y2}
                ${x2}
                ${y2}
                `;


            path.setAttribute(
                "d",
                pathData
            );


            path.setAttribute(
                "class",
                "connection " +
                (
                    connection.className ||
                    ""
                )
            );


            svg.appendChild(
                path
            );

        }
    );

}


/* =========================================================
   WORKSPACE PAN
========================================================= */

workspace.addEventListener(
    "pointerdown",
    function(event){

        if(
            event.target.closest(".node")
        ){

            return;

        }


        if(
            event.target.closest("#hub")
        ){

            return;

        }


        panning =
            true;

        movedDuringPointer =
            false;

        workspace.classList.add(
            "dragging"
        );


        panStartX =
            event.clientX;

        panStartY =
            event.clientY;


        initialPanX =
            panX;

        initialPanY =
            panY;


        workspace.setPointerCapture(
            event.pointerId
        );

    }
);


workspace.addEventListener(
    "pointermove",
    function(event){

        if(!panning){
            return;
        }


        const dx =
            event.clientX -
            panStartX;

        const dy =
            event.clientY -
            panStartY;


        if(
            Math.abs(dx) > 2 ||
            Math.abs(dy) > 2
        ){

            movedDuringPointer =
                true;

        }


        panX =
            initialPanX +
            dx;

        panY =
            initialPanY +
            dy;


        render();

    }
);


workspace.addEventListener(
    "pointerup",
    function(event){

        if(!panning){
            return;
        }


        panning =
            false;

        workspace.classList.remove(
            "dragging"
        );


        try{

            workspace.releasePointerCapture(
                event.pointerId
            );

        }catch(e){}


        saveCamera();

    }
);


/* =========================================================
   MOUSE WHEEL ZOOM
========================================================= */

workspace.addEventListener(
    "wheel",
    function(event){

        event.preventDefault();


        const mouseBefore =
            screenToWorld(
                event.clientX,
                event.clientY
            );


        const factor =
            event.deltaY < 0
                ? 1.12
                : 0.89;


        const newZoom =
            Math.max(
                MIN_ZOOM,
                Math.min(
                    MAX_ZOOM,
                    zoom *
                    factor
                )
            );


        zoom =
            newZoom;


        const mouseAfter =
            screenToWorld(
                event.clientX,
                event.clientY
            );


        panX +=
            (
                mouseAfter.x -
                mouseBefore.x
            ) *
            zoom;


        panY +=
            (
                mouseAfter.y -
                mouseBefore.y
            ) *
            zoom;


        render();

        saveCamera();

    },
    {
        passive:false
    }
);


/* =========================================================
   ZOOM FUNCTION
========================================================= */

function zoomAtCenter(
    factor
){

    zoom =
        Math.max(
            MIN_ZOOM,
            Math.min(
                MAX_ZOOM,
                zoom *
                factor
            )
        );


    render();

    saveCamera();

}


document
    .getElementById("zoomIn")
    .addEventListener(
        "click",
        function(){

            zoomAtCenter(
                1.25
            );

        }
    );


document
    .getElementById("zoomOut")
    .addEventListener(
        "click",
        function(){

            zoomAtCenter(
                .8
            );

        }
    );


/* =========================================================
   KEYBOARD ZOOM / PAN
========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.target.tagName === "INPUT"
        ){

            return;

        }


        if(event.key === "+"){

            zoomAtCenter(
                1.2
            );

        }


        if(event.key === "-"){

            zoomAtCenter(
                .83
            );

        }


        if(event.key === "0"){

            fitMap();

        }

    }
);


/* =========================================================
   FIT MAP
========================================================= */

function fitMap(){

    if(
        nodeList.length === 0
    ){

        zoom =
            1;

        panX =
            0;

        panY =
            0;

        render();

        return;

    }


    const visibleNodes =
        nodeList.filter(
            n =>
                n.element &&
                n.element.style.display !== "none"
        );


    if(!visibleNodes.length){

        return;

    }


    let minX =
        HUB_X;

    let maxX =
        HUB_X;

    let minY =
        HUB_Y;

    let maxY =
        HUB_Y;


    visibleNodes.forEach(
        function(node){

            minX =
                Math.min(
                    minX,
                    node.x
                );

            maxX =
                Math.max(
                    maxX,
                    node.x
                );

            minY =
                Math.min(
                    minY,
                    node.y
                );

            maxY =
                Math.max(
                    maxY,
                    node.y
                );

        }
    );


    const rect =
        workspace.getBoundingClientRect();


    const width =
        maxX -
        minX +
        500;


    const height =
        maxY -
        minY +
        500;


    zoom =
        Math.min(
            rect.width /
                width,
            rect.height /
                height
        );


    zoom =
        Math.max(
            .12,
            Math.min(
                1.2,
                zoom
            )
        );


    const centerX =
        (
            minX +
            maxX
        ) / 2;


    const centerY =
        (
            minY +
            maxY
        ) / 2;


    panX =
        -(
            centerX -
            HUB_X
        ) *
        zoom;


    panY =
        -(
            centerY -
            HUB_Y
        ) *
        zoom;


    render();

    saveCamera();

}


/* =========================================================
   FILTER
========================================================= */

function applyFilter(){

    const term =
        searchInput.value
            .trim()
            .toLowerCase();


    const filter =
        filterSelect.value;


    nodeList.forEach(
        function(node){

            if(!node.element){
                return;
            }


            const row =
                node.row;


            const haystack =
                [

                    node.name,

                    node.type,

                    node.url,

                    ...Object.values(row)

                ]
                .join(" ")
                .toLowerCase();


            const matchesSearch =
                !term ||
                haystack.includes(
                    term
                );


            let matchesFilter =
                true;


            if(
                filter === "online"
            ){

                matchesFilter =
                    isOnline(row);

            }


            if(
                filter === "offline"
            ){

                matchesFilter =
                    isOffline(row);

            }


            node.element.style.display =
                matchesSearch &&
                matchesFilter
                    ? ""
                    : "none";

        }
    );


    render();

}


searchInput.addEventListener(
    "input",
    applyFilter
);


filterSelect.addEventListener(
    "change",
    applyFilter
);


/* =========================================================
   SAVE LAYOUT
========================================================= */

function saveLayout(){

    const positions = {};


    nodeList.forEach(
        function(node){

            positions[node.id] = {

                x:node.x,

                y:node.y

            };

        }
    );


    const data = {

        positions,

        zoom,

        panX,

        panY

    };


    try{

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(data)
        );

    }catch(error){

        console.warn(
            "Unable to save map layout",
            error
        );

    }

}


/* =========================================================
   SAVE CAMERA
========================================================= */

function saveCamera(){

    saveLayout();

}


/* =========================================================
   LOAD SAVED LAYOUT
========================================================= */

function applySavedLayout(){

    try{

        const raw =
            localStorage.getItem(
                STORAGE_KEY
            );


        if(!raw){
            return;
        }


        const data =
            JSON.parse(
                raw
            );


        if(
            data.zoom !== undefined
        ){

            zoom =
                Math.max(
                    MIN_ZOOM,
                    Math.min(
                        MAX_ZOOM,
                        Number(data.zoom)
                    )
                );

        }


        if(
            data.panX !== undefined
        ){

            panX =
                Number(
                    data.panX
                );

        }


        if(
            data.panY !== undefined
        ){

            panY =
                Number(
                    data.panY
                );

        }


        if(
            data.positions
        ){

            nodeList.forEach(
                function(node){

                    const saved =
                        data.positions[
                            node.id
                        ];


                    if(
                        saved &&
                        Number.isFinite(
                            Number(saved.x)
                        ) &&
                        Number.isFinite(
                            Number(saved.y)
                        )
                    ){

                        node.x =
                            Number(
                                saved.x
                            );

                        node.y =
                            Number(
                                saved.y
                            );

                    }

                }
            );

        }

    }catch(error){

        console.warn(
            "Saved map layout could not be restored.",
            error
        );

    }

}


/* =========================================================
   RESET
========================================================= */

document
    .getElementById("resetBtn")
    .addEventListener(
        "click",
        function(){

            const confirmed =
                confirm(
                    "Reset the Obvyris server map layout?"
                );


            if(!confirmed){
                return;
            }


            localStorage.removeItem(
                STORAGE_KEY
            );


            zoom =
                1;

            panX =
                0;

            panY =
                0;


            buildMap();

            fitMap();

        }
    );


/* =========================================================
   FIT BUTTON
========================================================= */

document
    .getElementById("fitBtn")
    .addEventListener(
        "click",
        function(){

            fitMap();

        }
    );


/* =========================================================
   REFRESH
========================================================= */

document
    .getElementById("refreshBtn")
    .addEventListener(
        "click",
        async function(){

            await loadMap();

        }
    );

========================================================= */

workspace.addEventListener(
    "dblclick",

        if(
            event.target.closest(".node") ||
            event.target.closest("#hub")
        ){

        }


        fitMap();

    }
);

   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    function(){

        render();

    }
);


/* =========================================================
   INITIALIZE
========================================================= */

loadMap();
