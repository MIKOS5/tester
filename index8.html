<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Obvyris Server Map</title>

<style>

:root{
    --bg:#040810;
    --bg2:#07111d;
    --panel:#0b1522;
    --panel2:#0e1b2b;

    --text:#edf6ff;
    --muted:#7f94aa;

    --blue:#2793ff;
    --blue2:#55b0ff;

    --backend:#318fe0;
    --sheet:#477da8;
    --sheetapi:#9b6bd6;

    --frontend:#48a8ff;

    --external:#a367d2;
    --externalapi:#c27be7;

    --line:#294158;
    --line-soft:rgba(75,130,175,.45);
}

*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
}

body{
    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 50%,
            #122944 0%,
            #081421 34%,
            #040810 72%,
            #02050a 100%
        );

    color:var(--text);

    font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;
}


/* =========================================================
   HEADER
========================================================= */

.header{

    position:fixed;

    top:0;
    left:0;
    right:0;

    height:64px;

    z-index:1000;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 18px;

    background:
        rgba(3,8,15,.94);

    border-bottom:
        1px solid #1c3044;

    backdrop-filter:
        blur(14px);

    box-shadow:
        0 8px 30px rgba(0,0,0,.25);
}

.brand{

    display:flex;

    align-items:center;

    gap:11px;
}

.logo{

    width:36px;
    height:36px;

    display:grid;

    place-items:center;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #5bb8ff,
            #2793ff 45%,
            #1454a0 100%
        );

    box-shadow:
        0 0 24px
        rgba(39,147,255,.35);

    font-weight:900;

    font-size:18px;
}

.brand h1{

    margin:0;

    font-size:17px;

    font-weight:800;

    letter-spacing:.3px;
}

.brand small{

    display:block;

    margin-top:2px;

    color:var(--muted);

    font-size:9px;

    letter-spacing:1px;
}

.actions{

    display:flex;

    gap:7px;
}

.action{

    border:
        1px solid #263c52;

    background:
        #0b1624;

    color:#dcecff;

    border-radius:8px;

    padding:8px 11px;

    font-size:11px;

    cursor:pointer;

    transition:.15s;
}

.action:hover{

    border-color:
        #3987c5;

    background:
        #102235;
}


/* =========================================================
   MAP
========================================================= */

#map{

    position:absolute;

    top:64px;
    left:0;
    right:0;
    bottom:0;

    overflow:hidden;
}


/* =========================================================
   MAP GRID
========================================================= */

#map::before{

    content:"";

    position:absolute;

    inset:0;

    opacity:.14;

    background-image:

        linear-gradient(
            rgba(70,120,165,.22) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(70,120,165,.22) 1px,
            transparent 1px
        );

    background-size:
        40px 40px;

    pointer-events:none;

    mask-image:
        radial-gradient(
            circle at center,
            black 0%,
            transparent 78%
        );
}


/* =========================================================
   CENTER GLOW
========================================================= */

#map::after{

    content:"";

    position:absolute;

    left:50%;
    top:50%;

    width:600px;
    height:600px;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(39,147,255,.09),
            transparent 68%
        );

    pointer-events:none;
}


/* =========================================================
   SVG CONNECTION LAYER
========================================================= */

#connections{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    z-index:5;

    pointer-events:none;

    overflow:visible;
}

.connection{

    fill:none;

    stroke-width:1.25;

    opacity:.62;

    vector-effect:
        non-scaling-stroke;
}

.connection.backend{

    stroke:
        var(--backend);
}

.connection.sheet{

    stroke:
        var(--sheet);
}

.connection.sheet-api{

    stroke:
        var(--sheetapi);
}

.connection.frontend{

    stroke:
        var(--frontend);
}

.connection.external{

    stroke:
        var(--external);
}

.connection.external-api{

    stroke:
        var(--externalapi);
}


/* =========================================================
   HUB
========================================================= */

#hub{

    position:absolute;

    left:50%;
    top:50%;

    width:158px;
    height:158px;

    transform:
        translate(-50%,-50%);

    z-index:100;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    border-radius:50%;

    background:
        radial-gradient(
            circle at 50% 38%,
            #19436d 0%,
            #102c49 38%,
            #091727 70%,
            #050b13 100%
        );

    border:
        2px solid
        rgba(60,166,255,.9);

    box-shadow:

        0 0 0 7px
        rgba(39,147,255,.045),

        0 0 0 18px
        rgba(39,147,255,.018),

        0 0 55px
        rgba(39,147,255,.28),

        inset 0 0 35px
        rgba(39,147,255,.12);
}

#hub::before{

    content:"";

    position:absolute;

    inset:-9px;

    border-radius:50%;

    border:
        1px solid
        rgba(68,164,235,.28);

    animation:
        hubPulse 3s ease-in-out infinite;
}

@keyframes hubPulse{

    0%,
    100%{
        transform:scale(1);
        opacity:.3;
    }

    50%{
        transform:scale(1.06);
        opacity:.8;
    }
}

.hub-symbol{

    font-size:30px;

    line-height:1;

    color:#8fd0ff;

    text-shadow:
        0 0 20px
        rgba(80,180,255,.8);
}

.hub-title{

    margin-top:7px;

    font-size:17px;

    font-weight:900;

    letter-spacing:3px;
}

.hub-sub{

    margin-top:4px;

    color:#79a9d1;

    font-size:8px;

    letter-spacing:2px;
}


/* =========================================================
   ZONES
========================================================= */

.zone{

    position:absolute;

    z-index:20;

    left:50%;

    transform:
        translateX(-50%);

    padding:
        5px 13px;

    border:
        1px solid #1d354d;

    border-radius:20px;

    background:
        rgba(4,10,17,.8);

    color:#718ca7;

    font-size:8px;

    font-weight:900;

    letter-spacing:3px;

    white-space:nowrap;
}

.zone.backend{

    top:14px;
}

.zone.external{

    bottom:14px;
}


/* =========================================================
   BRANCH LAYERS
========================================================= */

.layer{

    position:absolute;

    inset:0;

    z-index:20;

    pointer-events:none;
}

.branch{

    position:absolute;

    width:230px;

    transform:
        translate(-50%,-50%);

    pointer-events:auto;
}


/* =========================================================
   BRANCH TITLE
========================================================= */

.branch-label{

    margin-bottom:6px;

    text-align:center;

    color:#56748f;

    font-size:7px;

    font-weight:900;

    letter-spacing:2px;

    text-transform:uppercase;
}


/* =========================================================
   CHAIN
========================================================= */

.chain{

    display:flex;

    flex-direction:column;

    gap:5px;
}


/* =========================================================
   CARD
========================================================= */

.card{

    position:relative;

    min-height:38px;

    padding:
        7px 9px;

    border:
        1px solid #21374d;

    border-radius:8px;

    background:
        linear-gradient(
            145deg,
            rgba(13,26,42,.98),
            rgba(6,13,22,.98)
        );

    box-shadow:
        0 7px 18px
        rgba(0,0,0,.28);

    overflow:hidden;

    transition:
        transform .15s ease,
        border-color .15s ease,
        box-shadow .15s ease;
}

.card:hover{

    transform:
        translateY(-2px);

    border-color:
        #4c779d;

    box-shadow:
        0 10px 24px
        rgba(0,0,0,.42);
}

.card::before{

    content:"";

    position:absolute;

    left:0;
    top:0;
    bottom:0;

    width:3px;

    background:
        #31556f;
}

.card.backend::before{
    background:var(--backend);
}

.card.sheet::before{
    background:var(--sheet);
}

.card.sheet-api::before{
    background:var(--sheetapi);
}

.card.frontend::before{
    background:var(--frontend);
}

.card.external::before{
    background:var(--external);
}

.card.external-api::before{
    background:var(--externalapi);
}

.card-title{

    font-size:9px;

    font-weight:900;

    color:#e8f4ff;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.card-value{

    margin-top:3px;

    font-size:7px;

    line-height:1.3;

    color:#7e94aa;

    word-break:
        break-word;
}

.card-value a{

    color:#63b5ff;

    text-decoration:none;
}

.card-value a:hover{

    text-decoration:
        underline;
}


/* =========================================================
   FRONTEND GROUP
========================================================= */

.frontends{

    display:grid;

    grid-template-columns:
        repeat(5,1fr);

    gap:3px;
}

.frontend-card{

    min-width:0;

    min-height:46px;

    padding:
        6px 4px;

    text-align:center;
}

.frontend-card .card-title{

    font-size:6.5px;

    white-space:normal;

    line-height:1.15;
}

.frontend-card .card-value{

    font-size:5.8px;

    max-height:28px;

    overflow:hidden;
}


/* =========================================================
   EMPTY STATE
========================================================= */

.empty{

    position:absolute;

    inset:0;

    z-index:80;

    display:flex;

    align-items:center;

    justify-content:center;

    pointer-events:none;
}

.empty-box{

    padding:20px 25px;

    border:
        1px solid #263c52;

    border-radius:12px;

    background:
        rgba(8,17,28,.94);

    color:#8096ac;

    text-align:center;

    font-size:12px;
}


/* =========================================================
   LOADING
========================================================= */

#loading{

    position:absolute;

    inset:0;

    z-index:500;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        rgba(3,8,14,.92);

    backdrop-filter:
        blur(5px);
}

.loading-box{

    display:flex;

    flex-direction:column;

    align-items:center;

    gap:12px;

    color:#8ca2b8;

    font-size:11px;
}

.spinner{

    width:32px;
    height:32px;

    border-radius:50%;

    border:
        3px solid #1d3147;

    border-top-color:
        var(--blue);

    animation:
        spin .8s linear infinite;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }
}


/* =========================================================
   ERROR
========================================================= */

#error{

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    z-index:400;

    display:none;

    width:
        min(500px,90vw);

    padding:18px;

    border:
        1px solid #61313b;

    border-radius:11px;

    background:
        rgba(28,9,14,.96);

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.45);

    text-align:center;
}

.error-title{

    color:#ff8d9a;

    font-weight:900;

    font-size:13px;

    margin-bottom:7px;
}

.error-text{

    color:#a9828a;

    font-size:10px;

    line-height:1.5;

    word-break:break-word;
}


/* =========================================================
   INFO
========================================================= */

#info{

    position:fixed;

    right:12px;
    bottom:12px;

    z-index:1000;

    padding:
        6px 9px;

    border:
        1px solid #1b3045;

    border-radius:7px;

    background:
        rgba(3,8,14,.9);

    color:#647f99;

    font-size:8px;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:900px){

    .brand-text small{
        display:none;
    }

    .brand h1{
        font-size:14px;
    }

    .action{
        padding:7px 9px;
        font-size:10px;
    }

    #map{

        width:1500px;

        left:
            calc(50% - 750px);

        right:auto;
    }

}

</style>

</head>

<body>

<div class="brand">

    <div class="logo">

    <div>

        <h1>

        </small>

</div>

</div>

<div id="info">
    Connecting to MAP API...
</div>

<script>


/* =========================================================
   YOUR MAP API
========================================================= */

const MAP_API =
"https://script.google.com/macros/s/AKfycbxmet73uElazLhNTF6K9Ziizu4hbgq7VWbXJ8nKjSeXkn-tN4CyoBDjSdeK69A_J5XG/exec";


/* =========================================================
   GLOBAL DATA
========================================================= */

let mapRows = [];

let lastGenerated = "";


/* =========================================================
   START
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        loadMap();

    }
);


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        clearTimeout(
            window.resizeTimer
        );

        window.resizeTimer =
            setTimeout(
                drawConnections,
                150
            );

    }
);


/* =========================================================
   LOAD MAP
========================================================= */

async function loadMap(){

    showLoading();

    hideError();


    try{

        /*
         * Cache-busting parameter.
         */

        const url =
            MAP_API +
            "?t=" +
            Date.now();


        const response =
            await fetch(
                url,
                {
                    method:"GET",

                    cache:"no-store",

                    redirect:"follow"
                }
            );


        if(
            !response.ok
        ){

            throw new Error(
                "HTTP " +
                response.status +
                " " +
                response.statusText
            );

        }


        const text =
            await response.text();


        if(
            !text ||
            !text.trim()
        ){

            throw new Error(
                "The MAP API returned an empty response."
            );

        }


        let data;


        try{

            data =
                JSON.parse(
                    text
                );

        }catch(jsonError){

            console.error(
                "RAW API RESPONSE:",
                text
            );

            throw new Error(
                "The MAP API did not return valid JSON."
            );

        }


        if(
            data.success === false
        ){

            throw new Error(
                data.error ||
                "MAP API reported an error."
            );

        }


        if(
            !Array.isArray(
                data.rows
            )
        ){

            throw new Error(
                "MAP API JSON does not contain a rows array."
            );

        }


        /*
         * Keep ALL data.

         * Status is intentionally preserved here.
         *
         * It is available as:
         *
         * row["Status"]
         *
         * but is never drawn as a card.
         */

        mapRows =
            data.rows;


        lastGenerated =
            data.generated ||
            "";


        renderMap();


        updateInfo(
            mapRows.length,
            lastGenerated
        );


    }catch(error){

        console.error(
            "OBVYRIS MAP ERROR:",
            error
        );


        showError(
            error.message
        );


        updateInfo(
            0,
            ""
        );

    }finally{

        hideLoading();

    }

}


/* =========================================================
   RENDER
========================================================= */

function renderMap(){

    const backend =
        document.getElementById(
            "backendLayer"
        );

    const external =
        document.getElementById(
            "externalLayer"
        );


    backend.innerHTML = "";

    external.innerHTML = "";


    document
        .getElementById("empty")
        .style.display =
            mapRows.length
                ? "none"
                : "flex";


    /*
     * BACKEND DATA
     */

    const backendRows =
        mapRows.filter(
            row =>
                hasValue(
                    row["Backends Sheet"]
                ) ||
                hasValue(
                    row["Sheet"]
                ) ||
                hasValue(
                    row["Sheet API"]
                ) ||
                hasFrontend(
                    row
                )
        );


    /*
     * EXTERNAL DATA
     */

    const externalRows =
        mapRows.filter(
            row =>
                hasValue(
                    row["EXTERNAL"]
                ) ||
                hasValue(
                    row["EXTERNAL API"]
                ) ||
                hasValue(
                    row["EXTERNAL API 2"]
                )
        );


    placeBackendBranches(
        backendRows
    );


    placeExternalBranches(
        externalRows
    );


    requestAnimationFrame(
        () => {

            requestAnimationFrame(
                drawConnections
            );

        }
    );

}


/* =========================================================
   PLACE BACKEND
========================================================= */

function placeBackendBranches(
    rows
){

    const layer =
        document.getElementById(
            "backendLayer"
        );


    const map =
        document.getElementById(
            "map"
        );


    const width =
        map.clientWidth;


    const height =
        map.clientHeight;


    const centerX =
        width / 2;


    const centerY =
        height / 2;


    if(!rows.length){
        return;
    }


    /*
     * Spread across the upper
     * 360-degree-style arc.
     */

    const count =
        rows.length;


    const maxWidth =
        Math.min(
            width * .90,
            1450
        );


    rows.forEach(
        (
            row,
            index
        ) => {

            const branch =
                createBackendBranch(
                    row,
                    index
                );


            layer.appendChild(
                branch
            );


            let x;


            if(
                count === 1
            ){

                x =
                    centerX;

            }else{

                x =
                    centerX -
                    maxWidth / 2 +
                    (
                        maxWidth *
                        index /
                        (count - 1)
                    );

            }


            /*
             * Multiple vertical levels
             * create the spiderweb effect.
             */

            const level =
                index % 3;


            const y =
                centerY -
                210 -
                level * 72;


            branch.style.left =
                x + "px";


            branch.style.top =
                y + "px";

        }
    );

}


/* =========================================================
   PLACE EXTERNAL
========================================================= */

function placeExternalBranches(
    rows
){

    const layer =
        document.getElementById(
            "externalLayer"
        );


    const map =
        document.getElementById(
            "map"
        );


    const width =
        map.clientWidth;


    const height =
        map.clientHeight;


    const centerX =
        width / 2;


    const centerY =
        height / 2;


    if(!rows.length){
        return;
    }


    const count =
        rows.length;


    const maxWidth =
        Math.min(
            width * .90,
            1450
        );


    rows.forEach(
        (
            row,
            index
        ) => {

            const branch =
                createExternalBranch(
                    row,
                    index
                );


            layer.appendChild(
                branch
            );


            let x;


            if(
                count === 1
            ){

                x =
                    centerX;

            }else{

                x =
                    centerX -
                    maxWidth / 2 +
                    (
                        maxWidth *
                        index /
                        (count - 1)
                    );

            }


            const level =
                index % 3;


            const y =
                centerY +
                210 +
                level * 72;


            branch.style.left =
                x + "px";


            branch.style.top =
                y + "px";

        }
    );

}


/* =========================================================
   BACKEND BRANCH
========================================================= */

function createBackendBranch(
    row,
    index
){

    const branch =
        document.createElement(
            "div"
        );


    branch.className =
        "branch";


    branch.dataset.rowId =
        String(
            row["ID"] ||
            index
        );


    const label =
        document.createElement(
            "div"
        );


    label.className =
        "branch-label";


    label.textContent =
        row["Backends Sheet"] ||
        "Backend Route";


    branch.appendChild(
        label
    );


    const chain =
        document.createElement(
            "div"
        );


    chain.className =
        "chain";


    /*
     * BACKEND
     */

    addIfPresent(
        chain,
        row,
        "Backends Sheet",
        "Backend",
        "backend"
    );


    /*
     * SHEET
     */

    addIfPresent(
        chain,
        row,
        "Sheet",
        "Sheet",
        "sheet"
    );


    /*
     * SHEET API
     */

    addIfPresent(
        chain,
        row,
        "Sheet API",
        "Sheet API",
        "sheet-api"
    );


    /*
     * STATUS IS NOT DRAWN.

     * The value remains in row["Status"].
     */


    /*
     * FRONTENDS
     */

    const fields = [

        "MAIN HTML FRONTEND",

        "HTML FRONTEND 2",

        "HTML FRONTEND 3",

        "HTML FRONTEND 4",

        "HTML FRONTEND 5"

    ];


    const active =
        fields.filter(
            field =>
                hasValue(
                    row[field]
                )
        );


    if(active.length){

        const frontendGroup =
            document.createElement(
                "div"
            );


        frontendGroup.className =
            "frontends";


        active.forEach(
            (
                field,
                index
            ) => {

                const card =
                    createCard(
                        "Frontend " +
                        (
                            index + 1
                        ),
                        row[field],
                        "frontend",
                        row
                    );


                frontendGroup.appendChild(
                    card
                );

            }
        );


        chain.appendChild(
            frontendGroup
        );

    }


    branch.appendChild(
        chain
    );


    return branch;

}


/* =========================================================
   EXTERNAL BRANCH
========================================================= */

function createExternalBranch(
    row,
    index
){

    const branch =
        document.createElement(
            "div"
        );


    branch.className =
        "branch";


    branch.dataset.rowId =
        String(
            row["ID"] ||
            index
        );


    const label =
        document.createElement(
            "div"
        );


    label.className =
        "branch-label";


    label.textContent =
        row["Backends Sheet"] ||
        "External Route";


    branch.appendChild(
        label
    );


    const chain =
        document.createElement(
            "div"
        );


    chain.className =
        "chain";


    addIfPresent(
        chain,
        row,
        "EXTERNAL",
        "External",
        "external"
    );


    addIfPresent(
        chain,
        row,
        "EXTERNAL API",
        "External API",
        "external-api"
    );


    addIfPresent(
        chain,
        row,
        "EXTERNAL API 2",
        "External API 2",
        "external-api"
    );


    branch.appendChild(
        chain
    );


    return branch;

}


/* =========================================================
   ADD CARD IF PRESENT
========================================================= */

function addIfPresent(
    parent,
    row,
    field,
    title,
    type
){

    if(
        !hasValue(
            row[field]
        )
    ){

        return;

    }


    parent.appendChild(
        createCard(
            title,
            row[field],
            type,
            row
        )
    );

}


/* =========================================================
   CREATE CARD
========================================================= */

function createCard(
    title,
    value,
    type,
    row
){

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "card " +
        type;


    card.dataset.rowId =
        String(
            row["ID"] ||
            ""
        );


    card.dataset.type =
        type;


    const titleElement =
        document.createElement(
            "div"
        );


    titleElement.className =
        "card-title";


    titleElement.textContent =
        title;


    const valueElement =
        document.createElement(
            "div"
        );


    valueElement.className =
        "card-value";


    if(
        isURL(
            value
        )
    ){

        const link =
            document.createElement(
                "a"
            );


        link.href =
            value;


        link.target =
            "_blank";


        link.rel =
            "noopener noreferrer";


        link.textContent =
            shortenURL(
                value
            );


        link.title =
            value;


        valueElement.appendChild(
            link
        );

    }else{

        valueElement.textContent =
            value;

    }


    card.appendChild(
        titleElement
    );


    card.appendChild(
        valueElement
    );


    return card;

}


/* =========================================================
   CONNECTION ENGINE
========================================================= */

function drawConnections(){

    const svg =
        document.getElementById(
            "connections"
        );


    svg.innerHTML = "";


    const map =
        document.getElementById(
            "map"
        );


    const mapRect =
        map.getBoundingClientRect();


    const hub =
        document.getElementById(
            "hub"
        );


    const hubRect =
        hub.getBoundingClientRect();


    const hubPoint = {

        x:
            hubRect.left -
            mapRect.left +
            hubRect.width / 2,

        y:
            hubRect.top -
            mapRect.top +
            hubRect.height / 2

    };


    /*
     * IMPORTANT:
     *
     * We NEVER search for nearest
     * cards globally.
     *
     * Each branch owns its own
     * connection chain.
     */


    document
        .querySelectorAll(
            "#backendLayer .branch"
        )
        .forEach(
            branch => {

                connectBranch(
                    branch,
                    hubPoint,
                    "north"
                );

            }
        );


    document
        .querySelectorAll(
            "#externalLayer .branch"
        )
        .forEach(
            branch => {

                connectBranch(
                    branch,
                    hubPoint,
                    "south"
                );

            }
        );

}


/* =========================================================
   CONNECT ONE BRANCH
========================================================= */

function connectBranch(
    branch,
    hubPoint,
    direction
){

    const map =
        document.getElementById(
            "map"
        );


    const mapRect =
        map.getBoundingClientRect();


    const cards =
        Array.from(
            branch.querySelectorAll(
                ".card"
            )
        );


    if(
        !cards.length
    ){

        return;

    }


    /*
     * The frontend group contains
     * multiple small cards.

     * Treat them as one endpoint
     * for the main branch.
     */

    const endpoints = [];


    cards.forEach(
        card => {

            const rect =
                card.getBoundingClientRect();


            endpoints.push({

                element:card,

                x:
                    rect.left -
                    mapRect.left +
                    rect.width / 2,

                y:
                    rect.top -
                    mapRect.top +
                    rect.height / 2,

                type:
                    card.dataset.type

            });

        }
    );


    /*
     * HUB → first card
     */

    drawLine(
        hubPoint,
        endpoints[0],
        direction === "north"
            ? "backend"
            : "external"
    );


    /*
     * Sequential connections.

     * These can ONLY connect cards
     * belonging to this branch.
     */

    for(
        let i = 0;
        i < endpoints.length - 1;
        i++
    ){

        const a =
            endpoints[i];


        const b =
            endpoints[i + 1];


        let lineType =
            "sheet";


        if(
            a.type ===
            "backend"
        ){

            lineType =
                "backend";

        }
        else if(
            a.type ===
            "sheet"
        ){

            lineType =
                "sheet";

        }
        else if(
            a.type ===
            "sheet-api"
        ){

            lineType =
                "sheet-api";

        }
        else if(
            a.type ===
            "frontend"
        ){

            lineType =
                "frontend";

        }
        else if(
            a.type ===
            "external"
        ){

            lineType =
                "external";

        }
        else if(
            a.type ===
            "external-api"
        ){

            lineType =
                "external-api";

        }


        drawLine(
            a,
            b,
            lineType
        );

    }

}


/* =========================================================
   DRAW CURVE
========================================================= */

function drawLine(
    a,
    b,
    type
){

    const svg =
        document.getElementById(
            "connections"
        );


    const path =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path"
        );


    const dy =
        b.y -
        a.y;


    const bend =
        Math.max(
            35,
            Math.min(
                150,
                Math.abs(dy) * .45
            )
        );


    let d;


    if(
        dy < 0
    ){

        d =
            `M ${a.x} ${a.y}
             C ${a.x} ${a.y-bend},
               ${b.x} ${b.y+bend},
               ${b.x} ${b.y}`;

    }else{

        d =
            `M ${a.x} ${a.y}
             C ${a.x} ${a.y+bend},
               ${b.x} ${b.y-bend},
               ${b.x} ${b.y}`;

    }


    path.setAttribute(
        "d",
        d
    );


    path.setAttribute(
        "class",
        "connection " +
        type
    );


    svg.appendChild(
        path
    );

}


/* =========================================================
   HELPERS
========================================================= */

function hasValue(
    value
){

    if(
        value ===
        undefined ||
        value ===
        null
    ){

        return false;

    }


    const text =
        String(
            value
        ).trim();


    return (
        text !== "" &&
        text !== "#"
    );

}


function hasFrontend(
    row
){

    return [

        "MAIN HTML FRONTEND",

        "HTML FRONTEND 2",

        "HTML FRONTEND 3",

        "HTML FRONTEND 4",

        "HTML FRONTEND 5"

    ].some(
        field =>
            hasValue(
                row[field]
            )
    );

}


function isURL(
    value
){

    return /^https?:\/\//i.test(
        String(
            value
        )
    );

}


function shortenURL(
    value
){

    try{

        const url =
            new URL(
                value
            );


        let path =
            url.pathname;


        if(
            path.length > 38
        ){

            path =
                path.slice(
                    0,
                    35
                ) +
                "...";

        }


        return (
            url.hostname +
            path
        );

    }catch{

        return value;

    }

}


/* =========================================================
   LOADING
========================================================= */

function showLoading(){

    document
        .getElementById(
            "loading"
        )
        .style.display =
            "flex";

}


function hideLoading(){

    document
        .getElementById(
            "loading"
        )
        .style.display =
            "none";

}


/* =========================================================
   ERROR
========================================================= */

function showError(
    message
){

    const error =
        document.getElementById(
            "error"
        );


    document.getElementById(
        "errorText"
    ).textContent =
        message;


    error.style.display =
        "block";

}


function hideError(){

    document
        .getElementById(
            "error"
        )
        .style.display =
            "none";

}


/* =========================================================
   INFO
========================================================= */

function updateInfo(
    count,
    generated
){

    const info =
        document.getElementById(
            "info"
        );


    if(!count){

        info.textContent =
            "No MAP records";

        return;

    }


    let time =
        "";


    if(generated){

        const date =
            new Date(
                generated
            );


        if(
            !Number.isNaN(
                date.getTime()
            )
        ){

            time =
                " • " +
                date.toLocaleTimeString();

        }

    }


    info.textContent =
        count +
        " map records" +
        time;

}


/* =========================================================
   CENTER
========================================================= */

function resetView(){

    /*
     * The hub is already fixed at
     * the visual center.

     * This redraw simply guarantees
     * the lines are positioned correctly.
     */

    drawConnections();

}


/* =========================================================
   INITIAL REDRAW
========================================================= */

setTimeout(
    drawConnections,
    300
);

setTimeout(
    drawConnections,
    1000
);

setTimeout(
    drawConnections,
    2000
);


</script>
