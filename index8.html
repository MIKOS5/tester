<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obvyris Server Map</title>

<style>
:root{
    --bg:#050a11;
    --panel:#0b1420;
    --panel2:#101c29;
    --line:#24384b;
    --text:#edf6ff;
    --muted:#7890a4;

    --backend:#35d07f;
    --sheet:#ffb648;
    --api:#43a7ff;
    --status:#a78bfa;
    --frontend:#39d9ff;
    --external:#ff70bd;
    --offline:#ff5964;
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,Arial,Helvetica,sans-serif;
}

body{
    background:
        radial-gradient(
            circle at center,
            rgba(39,147,255,.08),
            transparent 38%
        ),
        #050a11;
}

/* =========================
   HEADER
========================= */

.topbar{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:62px;
    z-index:1000;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 15px;

    background:rgba(5,10,17,.97);
    border-bottom:1px solid #1d3042;

    backdrop-filter:blur(14px);
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo{
    width:32px;
    height:32px;

    display:grid;
    place-items:center;

    border:1px solid #367baa;
    border-radius:50%;

    color:#65bcff;

    box-shadow:
        0 0 20px rgba(39,147,255,.15);
}

.brand-title{
    font-size:13px;
    font-weight:900;
    letter-spacing:1px;
}

.brand-subtitle{
    margin-top:2px;

    color:#61788c;

    font-size:7px;
    letter-spacing:1px;
}

.toolbar{
    display:flex;
    align-items:center;
    gap:6px;
}

.search{
    width:220px;
    height:32px;

    padding:0 10px;

    border:1px solid #29445a;
    border-radius:7px;

    outline:none;

    background:#08131e;
    color:white;

    font-size:9px;
}

.search:focus{
    border-color:#4e8dbb;
}

.button{
    height:32px;

    padding:0 10px;

    border:1px solid #29445a;
    border-radius:7px;

    background:#091521;
    color:#a9c1d3;

    cursor:pointer;

    font-size:8px;
    font-weight:900;
}

.button:hover{
    background:#102335;
    color:white;
}

/* =========================
   MAP
========================= */

#map{
    position:absolute;

    top:62px;
    left:0;
    right:0;
    bottom:0;

    overflow:hidden;

    cursor:grab;

    touch-action:none;
}

#map.dragging{
    cursor:grabbing;
}

#world{
    position:absolute;

    width:7600px;
    height:7600px;

    left:0;
    top:0;

    transform-origin:3800px 3800px;
}

#grid{
    position:absolute;

    width:7600px;
    height:7600px;

    background-image:
        linear-gradient(
            rgba(40,67,88,.25) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(40,67,88,.25) 1px,
            transparent 1px
        );

    background-size:50px 50px;

    opacity:.25;
}

#connections{
    position:absolute;

    width:7600px;
    height:7600px;

    pointer-events:none;
}

/* =========================
   HUB
========================= */

.hub{
    position:absolute;

    left:3690px;
    top:3690px;

    width:220px;
    height:110px;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    border:1px solid #3d8bc7;
    border-radius:16px;

    background:
        radial-gradient(
            circle at center,
            rgba(39,147,255,.22),
            transparent 65%
        ),
        #08131f;

    box-shadow:
        0 0 60px rgba(39,147,255,.2),
        0 15px 45px rgba(0,0,0,.5);

    z-index:100;
}

.hub-ring{
    position:absolute;

    width:150px;
    height:150px;

    border:1px solid rgba(67,167,255,.12);
    border-radius:50%;
}

.hub-icon{
    font-size:24px;
}

.hub-title{
    margin-top:4px;

    font-size:15px;
    font-weight:950;
    letter-spacing:1px;
}

.hub-file{
    margin-top:5px;

    color:#6dbdff;

    font-size:8px;
}

/* =========================
   WORKFLOW ROW
========================= */

.workflow{
    position:absolute;

    left:2200px;

    width:3500px;
    height:100px;
}

/* =========================
   NODE
========================= */

.node{
    position:absolute;

    width:142px;
    min-height:70px;

    padding:8px;

    border:1px solid var(--line);
    border-radius:8px;

    background:
        linear-gradient(
            145deg,
            #0d1925,
            #071019
        );

    box-shadow:
        0 8px 22px rgba(0,0,0,.38);

    cursor:pointer;

    z-index:20;

    transition:
        transform .15s,
        border-color .15s,
        opacity .15s,
        box-shadow .15s;
}

.node:hover{
    transform:translateY(-3px);

    border-color:#66869e;

    box-shadow:
        0 12px 28px rgba(0,0,0,.5),
        0 0 22px rgba(67,167,255,.08);
}

.node.selected{
    border-color:white;

    box-shadow:
        0 0 0 1px rgba(255,255,255,.1),
        0 0 28px rgba(67,167,255,.2);
}

.node.dim{
    opacity:.06;
}

.node.backend{
    border-top:3px solid var(--backend);
}

.node.sheet{
    border-top:3px solid var(--sheet);
}

.node.api{
    border-top:3px solid var(--api);
}

.node.status{
    border-top:3px solid var(--status);
}

.node.frontend{
    border-top:3px solid var(--frontend);
}

.node.external{
    border-top:3px solid var(--external);
}

.node-head{
    display:flex;
    align-items:center;
    gap:6px;
}

.node-icon{
    width:17px;
    height:17px;

    display:grid;
    place-items:center;

    border-radius:4px;

    background:rgba(255,255,255,.05);

    font-size:9px;
}

.node-title{
    overflow:hidden;

    white-space:nowrap;
    text-overflow:ellipsis;

    font-size:8px;
    font-weight:950;
}

.node-value{
    margin-top:7px;

    color:#9bb0c1;

    font-size:7px;
    line-height:1.35;

    word-break:break-word;
}

.node-label{
    margin-top:6px;

    color:#526b7f;

    font-size:5px;
    letter-spacing:.8px;
    text-transform:uppercase;
}

/* =========================
   STATUS
========================= */

.online{
    color:var(--backend);
}

.offline{
    color:var(--offline);
}

.status-dot{
    display:inline-block;

    width:6px;
    height:6px;

    margin-right:3px;

    border-radius:50%;

    background:currentColor;

    box-shadow:
        0 0 7px currentColor;
}

/* =========================
   CONNECTIONS
========================= */

.flow-line{
    fill:none;

    stroke:#30485c;

    stroke-width:1.4;

    opacity:.75;
}

.flow-line.frontend{
    stroke:var(--frontend);

    stroke-width:1.7;
}

.flow-line.external{
    stroke:var(--external);

    stroke-width:1.5;

    stroke-dasharray:5 4;
}

.flow-line.shared{
    stroke:#ffffff;

    stroke-width:2;

    opacity:.85;
}

/* =========================
   INFO PANEL
========================= */

#info{
    position:fixed;

    top:74px;
    right:14px;

    width:330px;
    max-height:calc(100vh - 90px);

    overflow:auto;

    z-index:900;

    display:none;

    background:rgba(5,12,19,.98);

    border:1px solid #29445a;
    border-radius:10px;

    box-shadow:
        0 20px 60px rgba(0,0,0,.65);
}

.info-header{
    position:sticky;
    top:0;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:11px 13px;

    background:#08121d;

    border-bottom:1px solid #1d3041;
}

.info-title{
    font-size:10px;
    font-weight:950;
}

.close{
    width:25px;
    height:25px;

    border:1px solid #30485d;
    border-radius:5px;

    background:#0b1723;
    color:#9ab0c0;

    cursor:pointer;
}

.info-body{
    padding:13px;
}

.info-section{
    margin-bottom:13px;
}

.info-label{
    color:#526a7e;

    font-size:6px;
    font-weight:900;

    letter-spacing:1px;
    text-transform:uppercase;
}

.info-value{
    margin-top:4px;

    color:#c9d8e4;

    font-size:9px;
    line-height:1.45;

    word-break:break-word;
}

.info-link{
    display:block;

    margin-top:8px;
    padding:8px;

    border:1px solid #284a65;
    border-radius:6px;

    background:#091827;

    color:#67b8f8;

    text-decoration:none;

    font-size:8px;
    font-weight:900;
}

.info-link:hover{
    background:#0d2234;
}

/* =========================
   LEGEND
========================= */

.legend{
    position:fixed;

    left:14px;
    bottom:14px;

    z-index:500;

    padding:10px 12px;

    border:1px solid #1e3448;
    border-radius:8px;

    background:rgba(5,12,19,.95);

    box-shadow:
        0 10px 30px rgba(0,0,0,.45);

    font-size:7px;
}

.legend-title{
    margin-bottom:7px;

    color:#6d8498;

    font-size:7px;
    font-weight:950;
    letter-spacing:1px;
}

.legend-row{
    display:flex;
    align-items:center;

    gap:7px;

    margin:5px 0;

    color:#9aafc0;
}

.legend-dot{
    width:7px;
    height:7px;

    border-radius:50%;
}

.green{
    background:var(--backend);
}

.orange{
    background:var(--sheet);
}

.blue{
    background:var(--api);
}

.purple{
    background:var(--status);
}

.cyan{
    background:var(--frontend);
}

.pink{
    background:var(--external);
}

/* =========================
   STATUS BAR
========================= */

#statusbar{
    position:fixed;

    right:14px;
    bottom:14px;

    z-index:500;

    padding:8px 11px;

    border:1px solid #1e3448;
    border-radius:7px;

    background:rgba(5,12,19,.95);

    color:#71889b;

    font-size:7px;
}

/* =========================
   LOADING
========================= */

#loading{
    position:fixed;

    inset:0;

    z-index:2000;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#050a11;
}

.loading-box{
    text-align:center;
}

.loading-ring{
    width:52px;
    height:52px;

    margin:auto;

    border:1px solid #286b98;
    border-top-color:#67bfff;

    border-radius:50%;

    animation:spin 1s linear infinite;
}

.loading-text{
    margin-top:12px;

    color:#71899c;

    font-size:9px;
    letter-spacing:1px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* =========================
   MOBILE
========================= */

@media(max-width:850px){

    .topbar{
        height:58px;
        padding:0 8px;
    }

    .brand-subtitle{
        display:none;
    }

    .brand-title{
        font-size:10px;
    }

    .logo{
        width:27px;
        height:27px;
    }

    .search{
        width:125px;
    }

    .button{
        padding:0 7px;
    }

    .legend{
        display:none;
    }

    #info{
        left:8px;
        right:8px;

        width:auto;
    }

    #statusbar{
        right:8px;
        bottom:8px;
    }
}
</style>
</head>

<body>

<header class="topbar">

    <div class="brand">

        <div class="logo">
            ◉
        </div>

        <div>

            <div class="brand-title">
                OBVYRIS SERVER MAP
            </div>

            <div class="brand-subtitle">
                SYSTEM ARCHITECTURE • DATA FLOW • FRONTEND BRANCHES
            </div>

        </div>

    </div>

    <div class="toolbar">

        <input
            id="search"
            class="search"
            placeholder="Search server, URL, frontend..."
        >

        <button
            class="button"
            id="refresh"
        >
            ↻ REFRESH
        </button>

        <button
            class="button"
            id="center"
        >
            CENTER
        </button>

        <button
            class="button"
            id="zoomOut"
        >
            −
        </button>

        <button
            class="button"
            id="zoomIn"
        >
            +
        </button>

    </div>

</header>

<div id="map">

    <div id="world">

        <div id="grid"></div>

        <svg
            id="connections"
            viewBox="0 0 7600 7600"
            preserveAspectRatio="none"
        ></svg>

        <div class="hub">

            <div class="hub-ring"></div>

            <div class="hub-icon">
                🛰️
            </div>

            <div class="hub-title">
                OBVYRIS HUB
            </div>

            <div class="hub-file">
                index99.html
            </div>

        </div>

    </div>

</div>

<div id="info">

    <div class="info-header">

        <div
            id="infoTitle"
            class="info-title"
        >
            NODE
        </div>

        <button
            id="close"
            class="close"
        >
            ×
        </button>

    </div>

    <div
        id="infoBody"
        class="info-body"
    ></div>

</div>

<div class="legend">

    <div class="legend-title">
        SERVER FLOW
    </div>

    <div class="legend-row">
        <span class="legend-dot green"></span>
        Backend
    </div>

    <div class="legend-row">
        <span class="legend-dot orange"></span>
        Sheet
    </div>

    <div class="legend-row">
        <span class="legend-dot blue"></span>
        Sheet API
    </div>

    <div class="legend-row">
        <span class="legend-dot purple"></span>
        Status
    </div>

    <div class="legend-row">
        <span class="legend-dot cyan"></span>
        Frontend
    </div>

    <div class="legend-row">
        <span class="legend-dot pink"></span>
        External
    </div>

</div>

<div id="statusbar">
    Connecting...
</div>

<div id="loading">

    <div class="loading-box">

        <div class="loading-ring"></div>

        <div class="loading-text">
            LOADING OBVYRIS SERVER MAP
        </div>

    </div>

</div>

<script>

const MAP_API =
"https://script.google.com/macros/s/AKfycbxmet73uElazLhNTF6K9Ziizu4hbgq7VWbXJ8nKjSeXkn-tN4CyoBDjSdeK69A_J5XG/exec";

const FLOW = [

    {
        column:"Backends Sheet",
        type:"backend",
        icon:"▣"
    },

    {
        column:"Sheet",
        type:"sheet",
        icon:"▤"
    },

    {
        column:"Sheet API",
        type:"api",
        icon:"⌘"
    },

    {
        column:"Status",
        type:"status",
        icon:"●"
    },

    {
        column:"MAIN HTML FRONTEND",
        type:"frontend",
        icon:"▣"
    },

    {
        column:"HTML FRONTEND 2",
        type:"frontend",
        icon:"▣"
    },

    {
        column:"HTML FRONTEND 3",
        type:"frontend",
        icon:"▣"
    },

    {
        column:"HTML FRONTEND 4",
        type:"frontend",
        icon:"▣"
    },

    {
        column:"HTML FRONTEND 5",
        type:"frontend",
        icon:"▣"
    },

    {
        column:"EXTERNAL",
        type:"external",
        icon:"◎"
    },

    {
        column:"EXTERNAL API",
        type:"api",
        icon:"↗"
    },

    {
        column:"EXTERNAL API 2",
        type:"api",
        icon:"↗"
    }

];

let rows=[];
let nodes=[];

let scale=1;
let panX=0;
let panY=0;

let dragging=false;

let dragStartX=0;
let dragStartY=0;

let startPanX=0;
let startPanY=0;


/* =========================
   HELPERS
========================= */

function valid(value){

    if(
        value===null ||
        value===undefined
    ){
        return false;
    }

    value=String(value).trim();

    return value!=="" && value!=="#";
}


function escapeHtml(value){

    return String(value || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


function shortValue(value){

    if(value.length<=25){
        return value;
    }

    return value.substring(0,22)+"...";
}


function setStatus(text){

    document
        .getElementById("statusbar")
        .textContent=text;

}


/* =========================
   LOAD API
========================= */

function loadMap(){

    setStatus("Loading MAP API...");

    fetch(
        MAP_API+
        "?t="+
        Date.now(),
        {
            method:"GET",
            cache:"no-store"
        }
    )

    .then(response=>{

        if(!response.ok){

            throw new Error(
                "HTTP "+response.status
            );

        }

        return response.json();

    })

    .then(data=>{

        if(
            !data ||
            data.success!==true
        ){

            throw new Error(
                "Invalid MAP API response"
            );

        }

        rows=
            Array.isArray(data.rows)
            ? data.rows
            : [];

        renderMap();

    })

    .catch(error=>{

        console.error(error);

        document
            .getElementById("loading")
            .innerHTML=`

                <div class="loading-box">

                    <div style="
                        font-size:28px;
                        margin-bottom:10px;
                    ">
                        ⚠
                    </div>

                    <div style="
                        color:#ff5964;
                        font-size:11px;
                        font-weight:900;
                    ">
                        MAP API ERROR
                    </div>

                    <div style="
                        color:#71899c;
                        font-size:8px;
                        margin-top:8px;
                    ">
                        ${escapeHtml(error.message)}
                    </div>

                    <button
                        class="button"
                        onclick="loadMap()"
                        style="margin-top:14px"
                    >
                        TRY AGAIN
                    </button>

                </div>

            `;

        setStatus("API ERROR");

    });

}


/* =========================
   RENDER MAP
========================= */

function renderMap(){

    document
        .querySelectorAll(".workflow")
        .forEach(element=>{
            element.remove();
        });

    nodes=[];

    const center=3800;

    const spacing=145;

    const totalHeight=
        Math.max(rows.length,1)*
        spacing;

    rows.forEach(
        (row,rowIndex)=>{

            const workflow=
                document.createElement("div");

            workflow.className="workflow";

            workflow.style.top=
                (
                    center-
                    totalHeight/2+
                    rowIndex*spacing
                )+
                "px";

            FLOW.forEach(
                (config,index)=>{

                    const value=
                        row[config.column];

                    if(!valid(value)){
                        return;
                    }

                    const node=
                        createNode(
                            row,
                            rowIndex,
                            config,
                            String(value).trim()
                        );

                    node.style.left=
                        getNodeX(index)+
                        "px";

                    workflow.appendChild(node);

                }
            );

            document
                .getElementById("world")
                .appendChild(workflow);

        }
    );

    drawConnections();

    document
        .getElementById("loading")
        .style.display="none";

    centerMap();

    setStatus(
        rows.length+
        " systems • "+
        nodes.length+
        " resources"
    );

}


/* =========================
   NODE POSITION
========================= */

function getNodeX(index){

    if(index<=3){

        return index*160;

    }

    if(index<=8){

        return 650+
            (index-4)*160;

    }

    if(index===9){

        return 1500;

    }

    if(index===10){

        return 1660;

    }

    return 1820;

}


/* =========================
   CREATE NODE
========================= */

function createNode(
    row,
    rowIndex,
    config,
    value
){

    const node=
        document.createElement("div");

    node.className=
        "node "+
        config.type;

    let displayValue;

    if(config.type==="status"){

        const status=
            value.toUpperCase();

        let className="";

        if(status==="ONLINE"){

            className="online";

        }

        else if(status==="OFFLINE"){

            className="offline";

        }

        displayValue=`

            <span
                class="status-dot ${className}"
            ></span>

            ${escapeHtml(status)}

        `;

    }

    else{

        displayValue=
            escapeHtml(
                shortValue(value)
            );

    }

    node.innerHTML=`

        <div class="node-head">

            <div class="node-icon">
                ${config.icon}
            </div>

            <div class="node-title">
                ${escapeHtml(config.column)}
            </div>

        </div>

        <div class="node-value">
            ${displayValue}
        </div>

        <div class="node-label">
            RESOURCE
        </div>

    `;

    const data={

        element:node,

        row:row,

        rowIndex:rowIndex,

        column:config.column,

        type:config.type,

        value:value

    };

    nodes.push(data);

    node.addEventListener(
        "click",
        event=>{

            event.stopPropagation();

            selectNode(data);

        }
    );

    return node;

}


/* =========================
   POSITION
========================= */

function getPosition(node){

    const parent=
        node.element.parentElement;

    const left=
        parent.offsetLeft+
        node.element.offsetLeft;

    const top=
        parent.offsetTop+
        node.element.offsetTop;

    const width=
        node.element.offsetWidth;

    const height=
        node.element.offsetHeight;

    return{

        left:left,

        right:left+width,

        top:top,

        bottom:top+height,

        centerY:
            top+
            height/2

    };

}


/* =========================
   DRAW CONNECTIONS
========================= */

function drawConnections(){

    const svg=
        document.getElementById(
            "connections"
        );

    svg.innerHTML="";


    /* ROW FLOW */

    rows.forEach(
        (row,rowIndex)=>{

            const rowNodes=
                nodes
                .filter(
                    node=>
                        node.rowIndex===
                        rowIndex
                )
                .sort(
                    (a,b)=>
                        FLOW.findIndex(
                            f=>
                                f.column===
                                a.column
                        )
                        -
                        FLOW.findIndex(
                            f=>
                                f.column===
                                b.column
                        )
                );

            for(
                let i=0;
                i<rowNodes.length-1;
                i++
            ){

                connectNodes(
                    rowNodes[i],
                    rowNodes[i+1]
                );

            }

        }
    );


    /* SHARED RESOURCES */

    const groups={};

    nodes.forEach(node=>{

        if(!valid(node.value)){
            return;
        }

        const key=
            node.value.trim();

        if(!groups[key]){
            groups[key]=[];
        }

        groups[key].push(node);

    });


    Object
        .values(groups)
        .forEach(group=>{

            if(group.length<2){
                return;
            }

            for(
                let i=1;
                i<group.length;
                i++
            ){

                connectNodes(
                    group[0],
                    group[i],
                    "shared"
                );

            }

        });

}


/* =========================
   CONNECTION
========================= */

function connectNodes(
    from,
    to,
    special=""
){

    const a=
        getPosition(from);

    const b=
        getPosition(to);

    let x1=a.right;
    let y1=a.centerY;

    let x2=b.left;
    let y2=b.centerY;


    if(
        from.type==="external"
    ){

        x1=a.left;
        x2=b.right;

    }


    const middle=
        (x1+x2)/2;


    const path=
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path"
        );


    path.setAttribute(
        "d",
        `
            M ${x1} ${y1}
            C ${middle} ${y1},
              ${middle} ${y2},
              ${x2} ${y2}
        `
    );


    path.classList.add(
        "flow-line"
    );


    if(special){

        path.classList.add(
            special
        );

    }


    if(
        from.type==="frontend" ||
        to.type==="frontend"
    ){

        path.classList.add(
            "frontend"
        );

    }


    if(
        from.type==="external" ||
        to.type==="external"
    ){

        path.classList.add(
            "external"
        );

    }


    document
        .getElementById("connections")
        .appendChild(path);

}


/* =========================
   NODE SELECTION
========================= */

function selectNode(selected){

    nodes.forEach(node=>{

        node.element.classList.add(
            "dim"
        );

        node.element.classList.remove(
            "selected"
        );

    });


    nodes
        .filter(
            node=>
                node.rowIndex===
                selected.rowIndex
        )
        .forEach(node=>{

            node.element.classList.remove(
                "dim"
            );

        });


    const shared=
        nodes.filter(
            node=>
                node.value===
                selected.value
        );


    shared.forEach(node=>{

        node.element.classList.remove(
            "dim"
        );

        node.element.classList.add(
            "selected"
        );

    });


    showInfo(
        selected,
        shared.length
    );

}


/* =========================
   INFO
========================= */

function showInfo(
    node,
    sharedCount
){

    const info=
        document.getElementById("info");

    const title=
        document.getElementById("infoTitle");

    const body=
        document.getElementById("infoBody");


    title.textContent=
        node.column;


    let html="";


    html+=`

        <div class="info-section">

            <div class="info-label">
                Backend
            </div>

            <div class="info-value">
                ${escapeHtml(
                    node.row["Backends Sheet"] ||
                    "No backend"
                )}
            </div>

        </div>

    `;


    html+=`

        <div class="info-section">

            <div class="info-label">
                MAP Column
            </div>

            <div class="info-value">
                ${escapeHtml(
                    node.column
                )}
            </div>

        </div>

    `;


    html+=`

        <div class="info-section">

            <div class="info-label">
                Resource
            </div>

            <div class="info-value">
                ${escapeHtml(
                    node.value
                )}
            </div>

        </div>

    `;


    html+=`

        <div class="info-section">

            <div class="info-label">
                Status
            </div>

            <div class="info-value">
                ${escapeHtml(
                    node.row.Status ||
                    "UNKNOWN"
                )}
            </div>

        </div>

    `;


    if(sharedCount>1){

        html+=`

            <div class="info-section">

                <div class="info-label">
                    Shared Resource
                </div>

                <div class="info-value">
                    Connected to
                    ${sharedCount}
                    MAP cells.
                </div>

            </div>

        `;

    }


    if(
        /^https?:\/\//i.test(
            node.value
        )
    ){

        html+=`

            <a
                class="info-link"
                href="${escapeHtml(node.value)}"
                target="_blank"
                rel="noopener noreferrer"
            >
                OPEN RESOURCE ↗
            </a>

        `;

    }


    body.innerHTML=html;

    info.style.display="block";

}


/* =========================
   CLOSE INFO
========================= */

function closeInfo(){

    document
        .getElementById("info")
        .style.display="none";


    nodes.forEach(node=>{

        node.element.classList.remove(
            "dim",
            "selected"
        );

    });

}


/* =========================
   MAP TRANSFORM
========================= */

function applyTransform(){

    document
        .getElementById("world")
        .style.transform=
        `
            translate(
                ${panX}px,
                ${panY}px
            )
            scale(${scale})
        `;

}


function centerMap(){

    const rect=
        document
            .getElementById("map")
            .getBoundingClientRect();

    scale=1;

    panX=
        rect.width/2-
        3800;

    panY=
        rect.height/2-
        3800;

    applyTransform();

}


function zoomIn(){

    scale=
        Math.min(
            2.5,
            scale+.12
        );

    applyTransform();

}


function zoomOut(){

    scale=
        Math.max(
            .3,
            scale-.12
        );

    applyTransform();

}


/* =========================
   SEARCH
========================= */

function searchMap(value){

    const query=
        String(value || "")
            .toLowerCase()
            .trim();


    if(!query){

        nodes.forEach(node=>{

            node.element.classList.remove(
                "dim",
                "selected"
            );

        });

        setStatus(
            rows.length+
            " systems • "+
            nodes.length+
            " resources"
        );

        return;

    }


    let count=0;


    nodes.forEach(node=>{

        const text=
            (
                node.value+
                " "+
                node.column+
                " "+
                (
                    node.row[
                        "Backends Sheet"
                    ] ||
                    ""
                )
            )
            .toLowerCase();


        if(
            text.includes(query)
        ){

            node.element.classList.remove(
                "dim"
            );

            node.element.classList.add(
                "selected"
            );

            count++;

        }

        else{

            node.element.classList.add(
                "dim"
            );

            node.element.classList.remove(
                "selected"
            );

        }

    });


    setStatus(
        count+
        " matching resources"
    );

}


/* =========================
   MOUSE PAN
========================= */

const map=
    document.getElementById("map");


map.addEventListener(
    "mousedown",
    event=>{

        if(
            event.target.closest(".node") ||
            event.target.closest(".hub") ||
            event.target.closest("button") ||
            event.target.closest("input")
        ){

            return;

        }


        dragging=true;

        map.classList.add(
            "dragging"
        );


        dragStartX=
            event.clientX;

        dragStartY=
            event.clientY;


        startPanX=panX;
        startPanY=panY;

    }
);


window.addEventListener(
    "mousemove",
    event=>{

        if(!dragging){
            return;
        }


        panX=
            startPanX+
            event.clientX-
            dragStartX;


        panY=
            startPanY+
            event.clientY-
            dragStartY;


        applyTransform();

    }
);


window.addEventListener(
    "mouseup",
    ()=>{

        dragging=false;

        map.classList.remove(
            "dragging"
        );

    }
);


/* =========================
   WHEEL
========================= */

map.addEventListener(
    "wheel",
    event=>{

        event.preventDefault();


        if(event.deltaY<0){

            zoomIn();

        }

        else{

            zoomOut();

        }

    },
    {
        passive:false
    }
);


/* =========================
   BUTTONS
========================= */

document
    .getElementById("refresh")
    .addEventListener(
        "click",
        loadMap
    );


document
    .getElementById("center")
    .addEventListener(
        "click",
        centerMap
    );


document
    .getElementById("zoomIn")
    .addEventListener(
        "click",
        zoomIn
    );


document
    .getElementById("zoomOut")
    .addEventListener(
        "click",
        zoomOut
    );


document
    .getElementById("close")
    .addEventListener(
        "click",
        closeInfo
    );


document
    .getElementById("search")
    .addEventListener(
        "input",
        event=>{
            searchMap(
                event.target.value
            );
        }
    );


/* =========================
   START
========================= */

loadMap();

</script>
