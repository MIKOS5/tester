<!DOCTYPE html>

<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Obvyris System Map</title>

<style>

:root{
    --bg:#07101c;
    --panel:#0d1726;
    --panel2:#111e30;
    --line:#26374d;
    --text:#ffffff;
    --muted:#8fa2b9;

    --blue:#2793ff;
    --green:#20c878;
    --red:#ff4d5e;
    --orange:#ff9f43;
    --purple:#a66cff;
    --cyan:#28d7e8;
    --yellow:#f5c542;
    --gray:#7f8da0;
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Inter,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
}

/* =========================================================
   APP
========================================================= */

.app{
    display:flex;
    width:100%;
    height:100%;
}

/* =========================================================
   SIDEBAR
========================================================= */

.sidebar{
    width:330px;
    min-width:330px;
    height:100%;
    background:var(--panel);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
    z-index:20;
}

.brand{
    padding:18px;
    border-bottom:1px solid var(--line);
}

.brand-title{
    font-size:22px;
    font-weight:800;
}

.brand-sub{
    color:var(--muted);
    font-size:12px;
    margin-top:4px;
}

/* =========================================================
   STATS
========================================================= */

.stats{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:8px;
    padding:12px;
    border-bottom:1px solid var(--line);
}

.stat{
    background:var(--panel2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px;
}

.stat-label{
    color:var(--muted);
    font-size:11px;
}

.stat-value{
    font-size:20px;
    font-weight:800;
    margin-top:3px;
}

/* =========================================================
   CONTROLS
========================================================= */

.controls{
    padding:12px;
    border-bottom:1px solid var(--line);
}

.search{
    width:100%;
    background:#081321;
    border:1px solid var(--line);
    color:white;
    border-radius:8px;
    padding:10px;
    outline:none;
}

.search:focus{
    border-color:var(--blue);
}

.control-row{
    display:flex;
    gap:7px;
    margin-top:8px;
}

select,
button{
    background:#132236;
    color:white;
    border:1px solid var(--line);
    border-radius:7px;
    padding:8px 10px;
    cursor:pointer;
}

button:hover,
select:hover{
    border-color:var(--blue);
}

select{
    flex:1;
}

/* =========================================================
   NODE LIST
========================================================= */

.node-list{
    flex:1;
    overflow:auto;
    padding:10px;
}

.node-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px;
    margin-bottom:6px;
    border:1px solid transparent;
    border-radius:9px;
    cursor:pointer;
}

.node-item:hover{
    background:#132236;
    border-color:var(--line);
}

.node-item.selected{
    background:#162b45;
    border-color:var(--blue);
}

.node-dot{
    width:10px;
    height:10px;
    border-radius:50%;
    flex-shrink:0;
}

.node-name{
    font-size:13px;
    font-weight:700;
}

.node-meta{
    font-size:10px;
    color:var(--muted);
    margin-top:2px;
}

/* =========================================================
   MAIN
========================================================= */

.main{
    flex:1;
    position:relative;
    overflow:hidden;
}

/* =========================================================
   TOPBAR
========================================================= */

.topbar{
    position:absolute;
    top:0;
    left:0;
    right:0;
    height:62px;
    background:rgba(7,16,28,.92);
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    padding:0 15px;
    gap:8px;
    z-index:10;
    backdrop-filter:blur(10px);
}

.top-title{
    font-size:18px;
    font-weight:800;
    margin-right:auto;
}

.top-status{
    display:flex;
    align-items:center;
    gap:7px;
    color:var(--muted);
    font-size:12px;
}

.status-dot{
    width:9px;
    height:9px;
    border-radius:50%;
}

.online{
    background:var(--green);
    box-shadow:0 0 9px rgba(32,200,120,.7);
}

.offline{
    background:var(--red);
}

.unknown{
    background:var(--gray);
}

/* =========================================================
   MAP
========================================================= */

.map{
    position:absolute;
    inset:62px 0 0 0;
    overflow:hidden;
    background:
        linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
    background-size:40px 40px;
    cursor:grab;
}

.map.dragging{
    cursor:grabbing;
}

.map-world{
    position:absolute;
    width:2600px;
    height:1800px;
    left:50%;
    top:50%;
    transform-origin:center center;
}

/* =========================================================
   CONNECTION SVG
========================================================= */

.connections{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    pointer-events:none;
    overflow:visible;
}

.connection{
    stroke:#40556f;
    stroke-width:2;
    fill:none;
    opacity:.75;
}

.connection.online-line{
    stroke:#2879b9;
}

.connection.offline-line{
    stroke:#70333c;
    stroke-dasharray:7 7;
}

/* =========================================================
   NODES
========================================================= */

.node{
    position:absolute;
    width:180px;
    min-height:70px;
    transform:translate(-50%,-50%);
    border:2px solid var(--node-color);
    background:#0c1828;
    border-radius:12px;
    padding:10px 12px;
    cursor:pointer;
    box-shadow:0 8px 25px rgba(0,0,0,.35);
    user-select:none;
    transition:.15s;
    z-index:2;
}

.node:hover{
    transform:translate(-50%,-50%) scale(1.04);
    box-shadow:0 0 25px color-mix(in srgb,var(--node-color) 35%,transparent);
}

.node.selected{
    box-shadow:
        0 0 0 3px rgba(39,147,255,.25),
        0 0 30px color-mix(in srgb,var(--node-color) 40%,transparent);
}

.node-header{
    display:flex;
    align-items:center;
    gap:8px;
}

.node-icon{
    width:26px;
    height:26px;
    display:grid;
    place-items:center;
    border-radius:7px;
    background:color-mix(in srgb,var(--node-color) 18%,transparent);
    font-size:14px;
}

.node-title{
    font-weight:800;
    font-size:13px;
    line-height:1.15;
}

.node-type{
    color:var(--muted);
    font-size:9px;
    margin-top:2px;
}

.node-bottom{
    display:flex;
    align-items:center;
    gap:6px;
    margin-top:8px;
}

.node-status{
    width:7px;
    height:7px;
    border-radius:50%;
}

.node-status-text{
    font-size:10px;
    color:var(--muted);
}

/* =========================================================
   DETAIL PANEL
========================================================= */

.details{
    position:absolute;
    top:76px;
    right:15px;
    width:350px;
    max-height:calc(100% - 91px);
    overflow:auto;
    background:rgba(13,23,38,.96);
    border:1px solid var(--line);
    border-radius:13px;
    box-shadow:0 15px 45px rgba(0,0,0,.45);
    z-index:15;
    display:none;
    backdrop-filter:blur(12px);
}

.details.open{
    display:block;
}

.details-head{
    padding:15px;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    gap:10px;
}

.details-close{
    margin-left:auto;
}

.details-body{
    padding:15px;
}

.detail-title{
    font-size:20px;
    font-weight:800;
}

.detail-desc{
    color:var(--muted);
    font-size:12px;
    line-height:1.5;
    margin-top:6px;
}

.detail-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-top:15px;
}

.detail-box{
    background:#091523;
    border:1px solid var(--line);
    border-radius:8px;
    padding:9px;
}

.detail-box-label{
    color:var(--muted);
    font-size:9px;
}

.detail-box-value{
    font-size:12px;
    font-weight:700;
    margin-top:3px;
}

.section-title{
    margin-top:18px;
    margin-bottom:8px;
    font-size:12px;
    font-weight:800;
    color:#c5d3e4;
}

/* =========================================================
   URL LIST
========================================================= */

.url-item{
    background:#091523;
    border:1px solid var(--line);
    border-radius:8px;
    padding:9px;
    margin-bottom:7px;
}

.url-label{
    font-size:11px;
    font-weight:700;
}

.url-type{
    color:var(--blue);
    font-size:9px;
    margin-top:2px;
}

.url-link{
    display:block;
    margin-top:6px;
    color:#69b7ff;
    font-size:10px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    text-decoration:none;
}

.url-link:hover{
    text-decoration:underline;
}

/* =========================================================
   LEGEND
========================================================= */

.legend{
    position:absolute;
    left:15px;
    bottom:15px;
    background:rgba(13,23,38,.94);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px;
    z-index:10;
}

.legend-title{
    font-size:10px;
    color:var(--muted);
    margin-bottom:7px;
}

.legend-row{
    display:flex;
    align-items:center;
    gap:7px;
    font-size:10px;
    margin:5px 0;
}

.legend-dot{
    width:9px;
    height:9px;
    border-radius:50%;
}

/* =========================================================
   ZOOM
========================================================= */

.zoom{
    position:absolute;
    right:15px;
    bottom:15px;
    display:flex;
    flex-direction:column;
    gap:5px;
    z-index:10;
}

.zoom button{
    width:38px;
    height:38px;
    font-size:18px;
    padding:0;
}

/* =========================================================
   LOADING
========================================================= */

.loading{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(7,16,28,.85);
    z-index:50;
}

.loader{
    text-align:center;
}

.spinner{
    width:38px;
    height:38px;
    border:3px solid #26374d;
    border-top-color:var(--blue);
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin:auto;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:900px){

    .sidebar{
        width:260px;
        min-width:260px;
    }

    .details{
        width:300px;
        right:8px;
    }

}

@media(max-width:650px){

    .sidebar{
        position:absolute;
        left:-280px;
        width:280px;
        min-width:280px;
        transition:.2s;
        z-index:100;
    }

    .sidebar.open{
        left:0;
    }

    .menu-button{
        display:block !important;
    }

    .top-title{
        font-size:15px;
    }

    .details{
        left:10px;
        right:10px;
        width:auto;
    }

}

.menu-button{
    display:none;
}

</style>

</head>

</div>

<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbxmet73uElazLhNTF6K9Ziizu4hbgq7VWbXJ8nKjSeXkn-tN4CyoBDjSdeK69A_J5XG/exec";


/* =========================================================
   APPLICATION STATE
========================================================= */

let DATA = null;

let systems = [];
let nodes = [];
let connections = [];
let urls = [];
let settings = [];

let selectedNode = null;

let zoom = 1;

let panX = 0;
let panY = 0;

let dragging = false;

let dragStartX = 0;
let dragStartY = 0;

let originalPanX = 0;
let originalPanY = 0;


/* =========================================================
   COLOR MAP
========================================================= */

const COLORS = {

    blue:"#2793ff",
    red:"#ff4d5e",
    purple:"#a66cff",
    green:"#20c878",
    orange:"#ff9f43",
    cyan:"#28d7e8",
    yellow:"#f5c542",
    gray:"#7f8da0"

};


/* =========================================================
   ICON MAP
========================================================= */

const ICONS = {

    hub:"⌂",
    sports:"⚾",
    tv:"▣",
    radio:"◉",
    news:"📰",
    chat:"💬",
    game:"🎮",
    book:"📖",
    server:"▤",
    page:"▣",
    globe:"◎"

};


/* =========================================================
   LOAD DATA
========================================================= */

async function loadData(){

    showLoading(true);

    setApiStatus(
        "Connecting...",
        "unknown"
    );

    try{

        const response =
            await fetch(
                API_URL + "?action=all&t=" + Date.now(),
                {
                    cache:"no-store"
                }
            );

        if(!response.ok){

            throw new Error(
                "HTTP " + response.status
            );

        }

        const json =
            await response.json();

        if(!json.success){

            throw new Error(
                "Backend returned success=false"
            );

        }

        DATA = json.data;

        systems =
            DATA.systems || [];

        nodes =
            DATA.nodes || [];

        connections =
            DATA.connections || [];

        urls =
            DATA.urls || [];

        settings =
            DATA.settings || [];

        setApiStatus(
            "Backend Online",
            "online"
        );

        buildFilters();

        updateStats();

        autoLayout();

        render();

        showLoading(false);

    }catch(error){

        console.error(error);

        setApiStatus(
            "Backend Error",
            "offline"
        );

        showLoading(false);

        alert(
            "Unable to load the Obvyris backend.\n\n" +
            error.message
        );

    }

}


/* =========================================================
   API STATUS
========================================================= */

function setApiStatus(text,status){

    const label =
        document.getElementById("apiStatus");

    const dot =
        document.getElementById("apiStatusDot");

    label.textContent = text;

    dot.className =
        "status-dot " + status;

}


/* =========================================================
   FILTERS
========================================================= */

function buildFilters(){

    const select =
        document.getElementById("groupFilter");

    const groups =
        [...new Set(
            nodes
                .map(n => n.Group)
                .filter(Boolean)
        )]
        .sort();

    select.innerHTML =
        `<option value="ALL">All Groups</option>`;

    groups.forEach(group => {

        const option =
            document.createElement("option");

        option.value = group;
        option.textContent = group;

        select.appendChild(option);

    });

}


/* =========================================================
   STATISTICS
========================================================= */

function updateStats(){

    const backendCount =
        systems.filter(
            s => String(s.Type).toUpperCase() === "BACKEND"
        ).length;

    const frontendCount =
        systems.filter(
            s => String(s.Type).toUpperCase() === "FRONTEND"
        ).length;

    const onlineCount =
        systems.filter(
            s =>
                String(s.Status).toUpperCase()
                === "ONLINE"
        ).length;

    document.getElementById(
        "statSystems"
    ).textContent =
        systems.length;

    document.getElementById(
        "statOnline"
    ).textContent =
        onlineCount;

    document.getElementById(
        "statBackends"
    ).textContent =
        backendCount;

    document.getElementById(
        "statFrontends"
    ).textContent =
        frontendCount;

}


/* =========================================================
   NODE COLOR
========================================================= */

function getNodeColor(node){

    if(node.Color){

        return COLORS[node.Color]
            || node.Color;

    }

    switch(
        String(node.NodeType || node["Node Type"] || "")
            .toUpperCase()
    ){

        case "HUB":
            return COLORS.blue;

        case "BACKEND":
            return COLORS.red;

        case "FRONTEND":
            return COLORS.purple;

        case "EXTERNAL":
            return COLORS.orange;

        default:
            return COLORS.gray;

    }

}


/* =========================================================
   NODE ICON
========================================================= */

function getNodeIcon(node){

    const icon =
        node.Icon || "server";

    return ICONS[icon] || "●";

}


/* =========================================================
   STATUS
========================================================= */

function getStatusClass(status){

    status =
        String(status || "")
        .toUpperCase();

    if(status === "ONLINE")
        return "online";

    if(status === "OFFLINE")
        return "offline";

    return "unknown";

}


/* =========================================================
   NODE LOOKUP
========================================================= */

function nodeKey(id){

    return String(id);

}


function findNode(id){

    return nodes.find(
        n => nodeKey(
            n["Node ID"] ?? n.NodeID
        ) === nodeKey(id)
    );

}


/* =========================================================
   SYSTEM LOOKUP
========================================================= */

function findSystem(id){

    return systems.find(
        s =>
            nodeKey(s["System ID"])
            === nodeKey(id)
    );

}


/* =========================================================
   FILTERED NODES
========================================================= */

function getVisibleNodes(){

    const search =
        document.getElementById(
            "search"
        ).value
        .toLowerCase()
        .trim();

    const group =
        document.getElementById(
            "groupFilter"
        ).value;

    const status =
        document.getElementById(
            "statusFilter"
        ).value;

    return nodes.filter(node => {

        const name =
            String(
                node.Name || ""
            ).toLowerCase();

        const description =
            String(
                node.Description || ""
            ).toLowerCase();

        const nodeGroup =
            String(
                node.Group || ""
            );

        let nodeStatus =
            "";

        const system =
            findSystem(
                node["Node ID"]
            );

        if(system){

            nodeStatus =
                String(
                    system.Status || ""
                ).toUpperCase();

        }

        if(
            search &&
            !name.includes(search) &&
            !description.includes(search)
        ){

            return false;

        }

        if(
            group !== "ALL" &&
            nodeGroup !== group
        ){

            return false;

        }

        if(
            status !== "ALL" &&
            nodeStatus !== status
        ){

            return false;

        }

        return true;

    });

}


/* =========================================================
   RENDER
========================================================= */

function render(){

    renderNodes();

    renderConnections();

    renderNodeList();

}


/* =========================================================
   RENDER NODES
========================================================= */

function renderNodes(){

    const container =
        document.getElementById("nodes");

    container.innerHTML = "";

    const visible =
        getVisibleNodes();

    visible.forEach(node => {

        const el =
            document.createElement("div");

        el.className = "node";

        const id =
            node["Node ID"];

        if(
            selectedNode &&
            nodeKey(selectedNode) === nodeKey(id)
        ){

            el.classList.add("selected");

        }

        const color =
            getNodeColor(node);

        el.style.setProperty(
            "--node-color",
            color
        );

        const x =
            Number(node["Position X"]);

        const y =
            Number(node["Position Y"]);

        const position =
            getPosition(
                node,
                x,
                y
            );

        el.style.left =
            position.x + "px";

        el.style.top =
            position.y + "px";

        const status =
            getNodeStatus(node);

        el.innerHTML = `

            <div class="node-header">

                <div class="node-icon">

                    ${getNodeIcon(node)}

                </div>

                <div>

                    <div class="node-title">
                        ${escapeHTML(
                            node.Name || "Unnamed"
                        )}
                    </div>

                    <div class="node-type">
                        ${escapeHTML(
                            node["Node Type"] || ""
                        )}
                    </div>

                </div>

            </div>

            <div class="node-bottom">

                <span
                    class="node-status ${getStatusClass(status)}"
                ></span>

                <span class="node-status-text">
                    ${escapeHTML(status || "UNKNOWN")}
                </span>

            </div>

        `;

        el.addEventListener(
            "click",
            event => {

                event.stopPropagation();

                selectNode(id);

            }
        );

        container.appendChild(el);

    });

}


/* =========================================================
   NODE STATUS
========================================================= */

function getNodeStatus(node){

    const system =
        findSystem(
            node["Node ID"]
        );

    if(system){

        return system.Status
            || "UNKNOWN";

    }

    return node.Status
        || "UNKNOWN";

}


/* =========================================================
   POSITION
========================================================= */

function getPosition(node,x,y){

    if(
        Number.isFinite(x) &&
        Number.isFinite(y) &&
        !(x === 0 && y === 0)
    ){

        return {
            x:1300 + x,
            y:900 + y
        };

    }

    if(
        String(
            node["Node ID"]
        ) === "HUB"
    ){

        return {
            x:1300,
            y:900
        };

    }

    return calculatedPosition(node);

}


/* =========================================================
   AUTO POSITION
========================================================= */

function calculatedPosition(node){

    const type =
        String(
            node["Node Type"] || ""
        ).toUpperCase();

    const hub =
        nodeKey(
            node["Node ID"]
        ) === "HUB";

    if(hub){

        return {
            x:1300,
            y:900
        };

    }

    const sameType =
        nodes.filter(
            n =>
                String(
                    n["Node Type"] || ""
                ).toUpperCase()
                === type
                &&
                nodeKey(
                    n["Node ID"]
                ) !== "HUB"
        );

    const index =
        sameType.findIndex(
            n =>
                nodeKey(
                    n["Node ID"]
                ) === nodeKey(
                    node["Node ID"]
                )
        );

    const count =
        Math.max(
            sameType.length,
            1
        );

    const angle =
        (index / count) *
        Math.PI * 2;

    let radius = 450;

    if(type === "BACKEND")
        radius = 420;

    if(type === "FRONTEND")
        radius = 760;

    if(type === "EXTERNAL")
        radius = 1050;

    return {

        x:
            1300 +
            Math.cos(angle) * radius,

        y:
            900 +
            Math.sin(angle) * radius

    };

}


/* =========================================================
   RENDER CONNECTIONS
========================================================= */

function renderConnections(){

    const svg =
        document.getElementById(
            "connections"
        );

    svg.innerHTML = "";

    connections.forEach(connection => {

        const from =
            findNode(
                connection["From ID"]
            );

        const to =
            findNode(
                connection["To ID"]
            );

        if(!from || !to)
            return;

        const p1 =
            getNodePositionForConnection(
                from
            );

        const p2 =
            getNodePositionForConnection(
                to
            );

        const line =
            document.createElementNS(
                "http://www.w3.org/2000/svg",
                "line"
            );

        line.setAttribute(
            "x1",
            p1.x
        );

        line.setAttribute(
            "y1",
            p1.y
        );

        line.setAttribute(
            "x2",
            p2.x
        );

        line.setAttribute(
            "y2",
            p2.y
        );

        line.classList.add(
            "connection"
        );

        if(
            String(
                connection.Status
            ).toUpperCase()
            === "ONLINE"
        ){

            line.classList.add(
                "online-line"
            );

        }else{

            line.classList.add(
                "offline-line"
            );

        }

        svg.appendChild(line);

    });

}


/* =========================================================
   CONNECTION POSITION
========================================================= */

function getNodePositionForConnection(node){

    const x =
        Number(node["Position X"]);

    const y =
        Number(node["Position Y"]);

    return getPosition(
        node,
        x,
        y
    );

}


/* =========================================================
   NODE LIST
========================================================= */

function renderNodeList(){

    const list =
        document.getElementById(
            "nodeList"
        );

    list.innerHTML = "";

    getVisibleNodes()
        .forEach(node => {

            const item =
                document.createElement("div");

            item.className =
                "node-item";

            if(
                selectedNode &&
                nodeKey(selectedNode)
                === nodeKey(
                    node["Node ID"]
                )
            ){

                item.classList.add(
                    "selected"
                );

            }

            const color =
                getNodeColor(node);

            const status =
                getNodeStatus(node);

            item.innerHTML = `

                <span
                    class="node-dot"
                    style="background:${color}"
                ></span>

                <div>

                    <div class="node-name">
                        ${escapeHTML(
                            node.Name
                        )}
                    </div>

                    <div class="node-meta">

                        ${escapeHTML(
                            node.Group || ""
                        )}
                        ·
                        ${escapeHTML(
                            status
                        )}

                    </div>

                </div>

            `;

            item.onclick =
                () => {

                    selectNode(
                        node["Node ID"]
                    );

                };

            list.appendChild(item);

        });

}


/* =========================================================
   SELECT NODE
========================================================= */

function selectNode(id){

    selectedNode = id;

    const node =
        findNode(id);

    if(!node)
        return;

    const details =
        document.getElementById(
            "details"
        );

    details.classList.add(
        "open"
    );

    const color =
        getNodeColor(node);

    document.getElementById(
        "detailIcon"
    ).style.setProperty(
        "--node-color",
        color
    );

    document.getElementById(
        "detailIcon"
    ).textContent =
        getNodeIcon(node);

    document.getElementById(
        "detailName"
    ).textContent =
        node.Name || "Unnamed";

    document.getElementById(
        "detailDescription"
    ).textContent =
        node.Description || "";

    document.getElementById(
        "detailType"
    ).textContent =
        node["Node Type"] || "";

    document.getElementById(
        "detailGroup"
    ).textContent =
        node.Group || "";

    document.getElementById(
        "detailStatus"
    ).textContent =
        getNodeStatus(node);

    document.getElementById(
        "detailNodeId"
    ).textContent =
        node["Node ID"];

    renderDetailConnections(
        node
    );

    renderDetailUrls(
        node
    );

    render();

}


/* =========================================================
   DETAIL CONNECTIONS
========================================================= */

function renderDetailConnections(node){

    const box =
        document.getElementById(
            "detailConnections"
        );

    box.innerHTML = "";

    const id =
        nodeKey(
            node["Node ID"]
        );

    const related =
        connections.filter(
            c =>
                nodeKey(c["From ID"]) === id
                ||
                nodeKey(c["To ID"]) === id
        );

    if(!related.length){

        box.innerHTML =
            `<div class="detail-desc">
                No connections found.
            </div>`;

        return;

    }

    related.forEach(c => {

        const from =
            nodeKey(c["From ID"]) === id
                ? "THIS"
                : getNodeName(c["From ID"]);

        const to =
            nodeKey(c["To ID"]) === id
                ? "THIS"
                : getNodeName(c["To ID"]);

        const item =
            document.createElement("div");

        item.className =
            "url-item";

        item.innerHTML = `

            <div class="url-label">
                ${escapeHTML(from)}
                →
                ${escapeHTML(to)}
            </div>

            <div class="url-type">
                ${escapeHTML(
                    c["Connection Type"] || ""
                )}
                ·
                ${escapeHTML(
                    c.Status || ""
                )}
            </div>

        `;

        box.appendChild(item);

    });

}


/* =========================================================
   DETAIL URLS
========================================================= */

function renderDetailUrls(node){

    const box =
        document.getElementById(
            "detailUrls"
        );

    box.innerHTML = "";

    const id =
        nodeKey(
            node["Node ID"]
        );

    const related =
        urls.filter(
            u =>
                nodeKey(
                    u["System ID"]
                ) === id
        );

    if(!related.length){

        box.innerHTML =
            `<div class="detail-desc">
                No URLs registered.
            </div>`;

        return;

    }

    related.forEach(u => {

        const item =
            document.createElement("div");

        item.className =
            "url-item";

        const url =
            cleanUrl(
                u.URL || ""
            );

        item.innerHTML = `

            <div class="url-label">
                ${escapeHTML(
                    u.Label || "URL"
                )}
            </div>

            <div class="url-type">
                ${escapeHTML(
                    u["URL Type"] || ""
                )}
            </div>

            ${
                url
                ?
                `
                <a
                    class="url-link"
                    href="${escapeAttribute(url)}"
                    target="_blank"
                    rel="noopener"
                >
                    ${escapeHTML(url)}
                </a>
                `
                :
                ""
            }

        `;

        box.appendChild(item);

    });

}


/* =========================================================
   GET NODE NAME
========================================================= */

function getNodeName(id){

    const node =
        findNode(id);

    if(node){

        return node.Name
            || String(id);

    }

    return String(id);

}


/* =========================================================
   CLOSE DETAILS
========================================================= */

function closeDetails(){

    selectedNode = null;

    document.getElementById(
        "details"
    ).classList.remove(
        "open"
    );

    render();

}


/* =========================================================
   AUTO LAYOUT
========================================================= */

function autoLayout(){

    nodes.forEach(node => {

        const type =
            String(
                node["Node Type"] || ""
            ).toUpperCase();

        const id =
            nodeKey(
                node["Node ID"]
            );

        if(id === "HUB"){

            node["Position X"] = 0;
            node["Position Y"] = 0;

            return;

        }

        const sameType =
            nodes.filter(
                n =>
                    String(
                        n["Node Type"] || ""
                    ).toUpperCase()
                    === type
                    &&
                    nodeKey(
                        n["Node ID"]
                    ) !== "HUB"
            );

        const index =
            sameType.findIndex(
                n =>
                    nodeKey(
                        n["Node ID"]
                    ) === id
            );

        const count =
            Math.max(
                sameType.length,
                1
            );

        const angle =
            (index / count) *
            Math.PI * 2
            -
            Math.PI / 2;

        let radius = 420;

        if(type === "BACKEND")
            radius = 400;

        if(type === "FRONTEND")
            radius = 720;

        if(type === "EXTERNAL")
            radius = 1000;

        node["Position X"] =
            Math.cos(angle) * radius;

        node["Position Y"] =
            Math.sin(angle) * radius;

    });

    render();

}


/* =========================================================
   VIEW
========================================================= */

function applyTransform(){

    const world =
        document.getElementById(
            "world"
        );

    world.style.transform =
        `translate(
            calc(-50% + ${panX}px),
            calc(-50% + ${panY}px)
        )
        scale(${zoom})`;

}


/* =========================================================
   ZOOM
========================================================= */

function zoomIn(){

    zoom =
        Math.min(
            zoom + .1,
            2.5
        );

    applyTransform();

}


function zoomOut(){

    zoom =
        Math.max(
            zoom - .1,
            .35
        );

    applyTransform();

}


function resetView(){

    zoom = 1;

    panX = 0;
    panY = 0;

    applyTransform();

}


/* =========================================================
   PAN
========================================================= */

function startPan(event){

    if(
        event.target.closest(".node")
    ){

        return;

    }

    dragging = true;

    dragStartX =
        event.clientX;

    dragStartY =
        event.clientY;

    originalPanX =
        panX;

    originalPanY =
        panY;

    document
        .getElementById("map")
        .classList.add(
            "dragging"
        );

    document.addEventListener(
        "mousemove",
        movePan
    );

    document.addEventListener(
        "mouseup",
        stopPan
    );

}


function movePan(event){

    if(!dragging)
        return;

    panX =
        originalPanX +
        (
            event.clientX -
            dragStartX
        );

    panY =
        originalPanY +
        (
            event.clientY -
            dragStartY
        );

    applyTransform();

}


function stopPan(){

    dragging = false;

    document
        .getElementById("map")
        .classList.remove(
            "dragging"
        );

    document.removeEventListener(
        "mousemove",
        movePan
    );

    document.removeEventListener(
        "mouseup",
        stopPan
    );

}


/* =========================================================
   SEARCH / FILTER EVENTS
========================================================= */

document
    .getElementById("search")
    .addEventListener(
        "input",
        render
    );


document
    .getElementById("groupFilter")
    .addEventListener(
        "change",
        render
    );


document
    .getElementById("statusFilter")
    .addEventListener(
        "change",
        render
    );


/* =========================================================
   SIDEBAR
========================================================= */

function toggleSidebar(){

    document
        .getElementById("sidebar")
        .classList.toggle(
            "open"
        );

}


/* =========================================================
   LOADING
========================================================= */

function showLoading(show){

    document
        .getElementById("loading")
        .style.display =
        show
            ? "flex"
            : "none";

}


/* =========================================================
   HTML SAFETY
========================================================= */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function escapeAttribute(value){

    return String(
        value ?? ""
    )
    .replace(
        /"/g,
        "&quot;"
    );

}


/* =========================================================
   CLEAN BACKEND URL DATA
========================================================= */

function cleanUrl(url){

    return String(
        url || ""
    )
    .replace(
        /\\_/g,
        "_"
    )
    .replace(
        /\\:/g,
        ":"
    )
    .replace(
        /\\\//g,
        "/"
    );

}


/* =========================================================
   INITIALIZE
========================================================= */

resetView();

loadData();


/* =========================================================
   OPTIONAL AUTO REFRESH
========================================================= */

setInterval(
    () => {

        loadData();

    },
    60000
);

</script>
