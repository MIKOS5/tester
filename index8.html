<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Obvyris Server Architecture</title>

<style>

:root{
    --bg:#03070d;
    --bg2:#07111d;
    --panel:#0b1623;
    --panel2:#0f1d2d;

    --text:#edf7ff;
    --muted:#71879c;

    --blue:#2793ff;
    --blue-soft:#5db8ff;

    --backend:#2997ed;
    --sheet:#4d81aa;
    --sheetapi:#a46bdf;
    --frontend:#3da9ff;

    --external:#a16bd2;
    --externalapi:#c57be8;

    --border:#20364b;
    --border2:#29465e;

    --shadow:
        0 12px 30px rgba(0,0,0,.38);
}


/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
}

body{
    overflow:hidden;

    color:var(--text);

    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at 50% 50%,
            #102840 0%,
            #081522 30%,
            #040a11 67%,
            #02050a 100%
        );
}


/* =========================================================
   TOP BAR
========================================================= */

.header{

    position:fixed;

    left:0;
    right:0;
    top:0;

    height:64px;

    z-index:5000;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:
        0 18px;

    background:
        rgba(3,8,14,.94);

    border-bottom:
        1px solid #1b3044;

    box-shadow:
        0 8px 28px
        rgba(0,0,0,.28);

    backdrop-filter:
        blur(16px);
}

.brand{

    display:flex;

    align-items:center;

    gap:11px;

    min-width:0;
}

.brand-logo{

    width:36px;
    height:36px;

    flex:none;

    display:grid;

    place-items:center;

    border-radius:50%;

    font-size:17px;

    font-weight:900;

    color:white;

    background:
        radial-gradient(
            circle at 35% 30%,
            #72c5ff,
            #2793ff 45%,
            #124b8c
        );

    box-shadow:
        0 0 25px
        rgba(39,147,255,.4);
}

.brand-name{

    font-size:15px;

    font-weight:850;

    letter-spacing:.4px;
}

.brand-sub{

    margin-top:2px;

    color:#688198;

    font-size:8px;

    font-weight:700;

    letter-spacing:1.8px;
}

.toolbar{

    display:flex;

    align-items:center;

    gap:7px;
}

.tool{

    height:32px;

    padding:
        0 11px;

    border:
        1px solid #263d52;

    border-radius:7px;

    background:
        #0a1521;

    color:#dcecff;

    font-size:10px;

    font-weight:700;

    cursor:pointer;

    transition:
        .15s ease;
}

.tool:hover{

    border-color:
        #3987c5;

    background:
        #102338;

    color:white;
}

.tool:active{

    transform:
        translateY(1px);
}


/* =========================================================
   MAP
========================================================= */

#map{

    position:absolute;

    left:0;
    right:0;

    top:64px;
    bottom:0;

    overflow:hidden;

    touch-action:none;
}


/* =========================================================
   GRID
========================================================= */

#map::before{

    content:"";

    position:absolute;

    inset:0;

    pointer-events:none;

    opacity:.13;

    background-image:

        linear-gradient(
            rgba(83,132,169,.28) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(83,132,169,.28) 1px,
            transparent 1px
        );

    background-size:
        42px 42px;

    mask-image:
        radial-gradient(
            ellipse at center,
            black 0%,
            rgba(0,0,0,.7) 48%,
            transparent 82%
        );
}


/* =========================================================
   CENTER GLOW
========================================================= */

#map::after{

    content:"";

    position:absolute;

    left:50%;
    top:50%;

    width:700px;
    height:700px;

    transform:
        translate(-50%,-50%);

    pointer-events:none;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(39,147,255,.095),
            transparent 68%
        );
}


/* =========================================================
   CONNECTION SVG
========================================================= */

#connections{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    z-index:10;

    pointer-events:none;

    overflow:visible;
}

.connection{

    fill:none;

    stroke-width:1.15;

    stroke-linecap:round;

    opacity:.58;

    vector-effect:
        non-scaling-stroke;

    filter:
        drop-shadow(
            0 0 3px
            rgba(39,147,255,.14)
        );
}

.connection.backend{
    stroke:var(--backend);
}

.connection.sheet{
    stroke:var(--sheet);
}

.connection.sheet-api{
    stroke:var(--sheetapi);
}

.connection.frontend{
    stroke:var(--frontend);
}

.connection.external{
    stroke:var(--external);
}

.connection.external-api{
    stroke:var(--externalapi);
}


/* =========================================================
   ZONE LABELS
========================================================= */

.zone{

    position:absolute;

    left:50%;

    transform:
        translateX(-50%);

    z-index:30;

    padding:
        5px 13px;

    border:
        1px solid #1d354a;

    border-radius:20px;

    background:
        rgba(4,10,17,.78);

    color:#668199;

    font-size:7px;

    font-weight:900;

    letter-spacing:2.8px;

    pointer-events:none;
}

.zone.backend{

    top:13px;
}

.zone.external{

    bottom:13px;
}


/* =========================================================
   HUB
========================================================= */

#hub{

    position:absolute;

    left:50%;
    top:50%;

    width:164px;
    height:164px;

    transform:
        translate(-50%,-50%);

    z-index:3000;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    border-radius:50%;

    border:
        2px solid
        rgba(64,171,255,.92);

    background:
        radial-gradient(
            circle at 50% 34%,
            #1b4a75 0%,
            #113453 35%,
            #0a1b2c 67%,
            #040b13 100%
        );

    box-shadow:

        0 0 0 7px
        rgba(39,147,255,.035),

        0 0 0 17px
        rgba(39,147,255,.018),

        0 0 60px
        rgba(39,147,255,.28),

        inset 0 0 35px
        rgba(39,147,255,.14);

    user-select:none;

    pointer-events:none;
}

#hub::before{

    content:"";

    position:absolute;

    inset:-9px;

    border-radius:50%;

    border:
        1px solid
        rgba(77,180,255,.27);

    animation:
        hubPulse 3.2s ease-in-out infinite;
}

@keyframes hubPulse{

    0%,
    100%{
        transform:scale(1);
        opacity:.3;
    }

    50%{
        transform:scale(1.06);
        opacity:.75;
    }
}

.hub-icon{

    font-size:29px;

    line-height:1;

    color:#9bd7ff;

    text-shadow:
        0 0 20px
        rgba(85,185,255,.85);
}

.hub-title{

    margin-top:7px;

    font-size:17px;

    font-weight:950;

    letter-spacing:3px;
}

.hub-sub{

    margin-top:4px;

    color:#78a8cc;

    font-size:7px;

    font-weight:800;

    letter-spacing:2px;
}

.hub-lock{

    margin-top:7px;

    color:#4e7797;

    font-size:6px;

    letter-spacing:1.5px;
}


/* =========================================================
   BRANCH LAYERS
========================================================= */

.layer{

    position:absolute;

    inset:0;

    z-index:100;

    pointer-events:none;
}


/* =========================================================
   BRANCH
========================================================= */

.branch{

    position:absolute;

    width:235px;

    transform:
        translate(-50%,-50%);

    pointer-events:auto;

    cursor:grab;

    user-select:none;

    touch-action:none;

    transition:
        box-shadow .15s ease;
}

.branch.dragging{

    cursor:grabbing;

    z-index:2500;

    filter:
        drop-shadow(
            0 12px 25px
            rgba(0,0,0,.5)
        );
}


/* =========================================================
   BRANCH LABEL
========================================================= */

.branch-label{

    margin-bottom:6px;

    padding:
        3px 7px;

    overflow:hidden;

    text-align:center;

    color:#58748c;

    font-size:7px;

    font-weight:900;

    letter-spacing:1.7px;

    text-transform:uppercase;

    white-space:nowrap;

    text-overflow:ellipsis;
}


/* =========================================================
   CHAIN
========================================================= */

.chain{

    display:flex;

    flex-direction:column;

    gap:5px;
}


/* =========================================================
   CARD
========================================================= */

.card{

    position:relative;

    min-height:39px;

    padding:
        7px 9px 7px 11px;

    border:
        1px solid var(--border);

    border-radius:8px;

    background:
        linear-gradient(
            145deg,
            rgba(13,27,43,.98),
            rgba(6,13,22,.98)
        );

    box-shadow:
        var(--shadow);

    overflow:hidden;

    transition:
        border-color .15s ease,
        transform .15s ease;
}

.card:hover{

    border-color:
        var(--border2);

    transform:
        translateY(-1px);
}

.card::before{

    content:"";

    position:absolute;

    left:0;
    top:0;
    bottom:0;

    width:3px;

    background:#355168;
}

.card.backend::before{
    background:var(--backend);
}

.card.sheet::before{
    background:var(--sheet);
}

.card.sheet-api::before{
    background:var(--sheetapi);
}

.card.frontend::before{
    background:var(--frontend);
}

.card.external::before{
    background:var(--external);
}

.card.external-api::before{
    background:var(--externalapi);
}

.card-title{

    color:#e9f5ff;

    font-size:9px;

    font-weight:850;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}

.card-value{

    margin-top:3px;

    color:#7c91a5;

    font-size:7px;

    line-height:1.35;

    overflow:hidden;

    word-break:break-word;
}

.card-value a{

    color:#61b6ff;

    text-decoration:none;
}

.card-value a:hover{

    color:#9ad6ff;

    text-decoration:underline;
}


/* =========================================================
   FRONTEND GROUP
========================================================= */

.frontends{

    display:grid;

    grid-template-columns:
        repeat(5,1fr);

    gap:3px;
}

.frontend-card{

    min-width:0;

    min-height:48px;

    padding:
        6px 4px;

    text-align:center;
}

.frontend-card .card-title{

    font-size:6.5px;

    line-height:1.15;

    white-space:normal;
}

.frontend-card .card-value{

    max-height:28px;

    font-size:5.7px;

    line-height:1.25;
}


/* =========================================================
   EMPTY
========================================================= */

#empty{

    position:absolute;

    inset:0;

    z-index:2000;

    display:none;

    align-items:center;

    justify-content:center;

    pointer-events:none;
}

.empty-box{

    padding:
        20px 26px;

    border:
        1px solid #263c51;

    border-radius:12px;

    background:
        rgba(8,17,28,.95);

    color:#8097ac;

    text-align:center;

    font-size:11px;
}


/* =========================================================
   LOADING
========================================================= */

#loading{

    position:absolute;

    inset:0;

    z-index:4500;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        rgba(3,8,14,.94);

    backdrop-filter:
        blur(6px);
}

.loading-box{

    display:flex;

    flex-direction:column;

    align-items:center;

    gap:11px;

    color:#8298ad;

    font-size:10px;
}

.spinner{

    width:31px;
    height:31px;

    border:
        3px solid #1b2f43;

    border-top-color:
        var(--blue);

    border-radius:50%;

    animation:
        spin .75s linear infinite;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }
}


/* =========================================================
   ERROR
========================================================= */

#error{

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    z-index:4000;

    display:none;

    width:
        min(520px,90vw);

    padding:20px;

    border:
        1px solid #60313b;

    border-radius:12px;

    background:
        rgba(26,9,14,.97);

    box-shadow:
        0 20px 50px
        rgba(0,0,0,.55);

    text-align:center;
}

.error-title{

    color:#ff9aa5;

    font-size:13px;

    font-weight:900;
}

.error-text{

    margin-top:8px;

    color:#aa8189;

    font-size:9px;

    line-height:1.5;

    word-break:break-word;
}


/* =========================================================
   STATUS BAR
========================================================= */

#info{

    position:fixed;

    right:12px;
    bottom:11px;

    z-index:5000;

    padding:
        6px 9px;

    border:
        1px solid #1b3044;

    border-radius:7px;

    background:
        rgba(3,8,14,.9);

    color:#607c95;

    font-size:7px;

    font-weight:700;

    letter-spacing:.4px;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:850px){

    .brand-sub{
        display:none;
    }

    .brand-name{
        font-size:13px;
    }

    .tool{
        padding:
            0 8px;

        font-size:9px;
    }

    #hub{

        width:145px;
        height:145px;

    }

    .hub-title{
        font-size:15px;
    }

    .branch{
        width:215px;
    }
}

</style>
</head>


<body>


<!-- =======================================================
     HEADER
======================================================== -->

<header class="header">

    <div class="brand">

        <div class="brand-logo">
            O
        </div>

        <div>

            <div class="brand-name">
                Obvyris Server Architecture
            </div>

            <div class="brand-sub">
                LIVE INFRASTRUCTURE MAP
            </div>

        </div>

    </div>


    <div class="toolbar">

        <button
            class="tool"
            onclick="loadMap()">

            ↻ Refresh

        </button>


        <button
            class="tool"
            onclick="centerBranches()">

            ◎ Recenter

        </button>

    </div>

</header>


<!-- =======================================================
     MAP
======================================================== -->

<main id="map">


    <!-- CONNECTIONS -->

    <svg
        id="connections"
        aria-hidden="true">
    </svg>


    <!-- ZONES -->

    <div class="zone backend">
        BACKEND ROUTES
    </div>


    <div class="zone external">
        EXTERNAL API ROUTES
    </div>


    <!-- BACKEND BRANCHES -->

    <div
        id="backendLayer"
        class="layer">
    </div>


    <!-- EXTERNAL BRANCHES -->

    <div
        id="externalLayer"
        class="layer">
    </div>


    <!-- ===================================================
         CENTRAL HUB
    ==================================================== -->

    <div id="hub">

        <div class="hub-icon">
            ◉
        </div>

        <div class="hub-title">
            OBVYRIS
        </div>

        <div class="hub-sub">
            CENTRAL HUB
        </div>

        <div class="hub-lock">
            CENTER LOCKED
        </div>

    </div>


    <!-- EMPTY -->

    <div id="empty">

        <div class="empty-box">
            No server architecture records were returned.
        </div>

    </div>


    <!-- LOADING -->

    <div id="loading">

        <div class="loading-box">

            <div class="spinner"></div>

            <div>
                Loading Obvyris architecture...
            </div>

        </div>

    </div>


    <!-- ERROR -->

    <div id="error">

        <div class="error-title">
            Unable to Load Server Map
        </div>

        <div
            id="errorText"
            class="error-text">
        </div>

        <button
            class="tool"
            style="margin-top:13px"
            onclick="loadMap()">

            Try Again

        </button>

    </div>

</main>


<!-- INFO -->

<div id="info">
    Connecting to MAP API...
</div>


<script>


/* =========================================================
   MAP API
========================================================= */

const MAP_API =
"https://script.google.com/macros/s/AKfycbxmet73uElazLhNTF6K9Ziizu4hbgq7VWbXJ8nKjSeXkn-tN4CyoBDjSdeK69A_J5XG/exec";


/* =========================================================
   DATA
========================================================= */

let mapRows = [];

let savedPositions = {};


/* =========================================================
   START
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        loadMap();

    }
);


/* =========================================================
   LOAD MAP
========================================================= */

async function loadMap(){

    showLoading();

    hideError();


    try{

        const response =
            await fetch(
                MAP_API +
                "?t=" +
                Date.now(),
                {
                    method:"GET",
                    cache:"no-store",
                    redirect:"follow"
                }
            );


        if(
            !response.ok
        ){

            throw new Error(
                "HTTP " +
                response.status +
                " " +
                response.statusText
            );

        }


        const text =
            await response.text();


        if(
            !text.trim()
        ){

            throw new Error(
                "The MAP API returned an empty response."
            );

        }


        let data;


        try{

            data =
                JSON.parse(text);

        }catch(error){

            console.error(
                text
            );

            throw new Error(
                "The MAP API did not return valid JSON."
            );

        }


        if(
            data.success === false
        ){

            throw new Error(
                data.error ||
                "The MAP API reported an error."
            );

        }


        if(
            !Array.isArray(data.rows)
        ){

            throw new Error(
                "The API response does not contain a rows array."
            );

        }


        mapRows =
            data.rows;


        renderMap();


        updateInfo(
            data
        );


    }catch(error){

        console.error(
            "MAP ERROR:",
            error
        );

        showError(
            error.message
        );

    }finally{

        hideLoading();

    }

}


/* =========================================================
   RENDER MAP
========================================================= */

function renderMap(){

    const backendLayer =
        document.getElementById(
            "backendLayer"
        );


    const externalLayer =
        document.getElementById(
            "externalLayer"
        );


    backendLayer.innerHTML =
        "";


    externalLayer.innerHTML =
        "";


    if(
        !mapRows.length
    ){

        document.getElementById(
            "empty"
        ).style.display =
            "flex";

        return;

    }


    document.getElementById(
        "empty"
    ).style.display =
        "none";


    const backendRows =
        mapRows.filter(
            function(row){

                return (

                    hasValue(
                        row["Backends Sheet"]
                    )

                    ||

                    hasValue(
                        row["Sheet"]
                    )

                    ||

                    hasValue(
                        row["Sheet API"]
                    )

                    ||

                    hasFrontend(
                        row
                    )

                );

            }
        );


    const externalRows =
        mapRows.filter(
            function(row){

                return (

                    hasValue(
                        row["EXTERNAL"]
                    )

                    ||

                    hasValue(
                        row["EXTERNAL API"]
                    )

                    ||

                    hasValue(
                        row["EXTERNAL API 2"]
                    )

                );

            }
        );


    placeBackendBranches(
        backendRows
    );


    placeExternalBranches(
        externalRows
    );


    requestAnimationFrame(
        function(){

            drawConnections();

        }
    );

}


/* =========================================================
   BACKEND POSITIONING
========================================================= */

function placeBackendBranches(
    rows
){

    const layer =
        document.getElementById(
            "backendLayer"
        );


    const map =
        document.getElementById(
            "map"
        );


    const width =
        map.clientWidth;


    const height =
        map.clientHeight;


    const centerX =
        width / 2;


    const centerY =
        height / 2;


    const count =
        rows.length;


    const usableWidth =
        Math.min(
            width * .88,
            1500
        );


    rows.forEach(
        function(row,index){

            const branch =
                createBackendBranch(
                    row,
                    index
                );


            layer.appendChild(
                branch
            );


            const id =
                "B-" +
                (
                    row["ID"] ||
                    index
                );


            if(
                savedPositions[id]
            ){

                branch.style.left =
                    savedPositions[id].x +
                    "px";

                branch.style.top =
                    savedPositions[id].y +
                    "px";

                return;

            }


            let x;


            if(
                count === 1
            ){

                x =
                    centerX;

            }else{

                x =
                    centerX -
                    usableWidth / 2 +

                    usableWidth *
                    index /
                    (count - 1);

            }


            const rowLevel =
                index % 3;


            const y =
                centerY -
                205 -
                rowLevel * 76;


            branch.style.left =
                x +
                "px";


            branch.style.top =
                y +
                "px";

        }
    );

}


/* =========================================================
   EXTERNAL POSITIONING
========================================================= */

function placeExternalBranches(
    rows
){

    const layer =
        document.getElementById(
            "externalLayer"
        );


    const map =
        document.getElementById(
            "map"
        );


    const width =
        map.clientWidth;


    const height =
        map.clientHeight;


    const centerX =
        width / 2;


    const centerY =
        height / 2;


    const count =
        rows.length;


    const usableWidth =
        Math.min(
            width * .88,
            1500
        );


    rows.forEach(
        function(row,index){

            const branch =
                createExternalBranch(
                    row,
                    index
                );


            layer.appendChild(
                branch
            );


            const id =
                "E-" +
                (
                    row["ID"] ||
                    index
                );


            if(
                savedPositions[id]
            ){

                branch.style.left =
                    savedPositions[id].x +
                    "px";

                branch.style.top =
                    savedPositions[id].y +
                    "px";

                return;

            }


            let x;


            if(
                count === 1
            ){

                x =
                    centerX;

            }else{

                x =
                    centerX -
                    usableWidth / 2 +

                    usableWidth *
                    index /
                    (count - 1);

            }


            const rowLevel =
                index % 3;


            const y =
                centerY +
                205 +
                rowLevel * 76;


            branch.style.left =
                x +
                "px";


            branch.style.top =
                y +
                "px";

        }
    );

}


/* =========================================================
   BACKEND BRANCH
========================================================= */

function createBackendBranch(
    row,
    index
){

    const branch =
        document.createElement(
            "div"
        );


    branch.className =
        "branch";


    branch.dataset.rowId =
        String(
            row["ID"] ||
            index
        );


    branch.dataset.positionId =
        "B-" +
        String(
            row["ID"] ||
            index
        );


    const label =
        document.createElement(
            "div"
        );


    label.className =
        "branch-label";


    label.textContent =
        row["Backends Sheet"] ||
        "Backend Route";


    branch.appendChild(
        label
    );


    const chain =
        document.createElement(
            "div"
        );


    chain.className =
        "chain";


    addIfPresent(
        chain,
        row,
        "Backends Sheet",
        "Backend",
        "backend"
    );


    addIfPresent(
        chain,
        row,
        "Sheet",
        "Sheet",
        "sheet"
    );


    addIfPresent(
        chain,
        row,
        "Sheet API",
        "Sheet API",
        "sheet-api"
    );


    createFrontendGroup(
        chain,
        row
    );


    branch.appendChild(
        chain
    );


    enableDragging(
        branch
    );


    return branch;

}

function createExternalBranch(

/* =========================================================
   FRONTEND GROUP
========================================================= */

function createFrontendGroup(
    parent,
    row
){

    const fields = [

        "MAIN HTML FRONTEND",
        "HTML FRONTEND 2",
        "HTML FRONTEND 3",
        "HTML FRONTEND 4",
        "HTML FRONTEND 5"

    ];


    const active =
        fields.filter(
            function(field){

                return hasValue(
                    row[field]
                );

            }
        );


    if(
        !active.length
    ){

        return;

    }


    const group =
        document.createElement(
            "div"
        );


    group.className =
        "frontends";


    active.forEach(
        function(field,index){

            const card =
                createCard(
                    "Frontend " +
                    (index + 1),
                    row[field],
                    "frontend",
                    row
                );


            group.appendChild(
                card
            );

        }
    );


    parent.appendChild(
        group
    );

}


/* =========================================================
   ADD CARD
========================================================= */

function addIfPresent(
    parent,
    row,
    field,
    title,
    type
){

    if(
        !hasValue(
            row[field]
        )
    ){

        return;

    }


    parent.appendChild(
        createCard(
            title,
            row[field],
            type,
            row
        )
    );

}


/* =========================================================
   CREATE CARD
========================================================= */

function createCard(
    title,
    value,
    type,
    row
){

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "card " +
        type;


    card.dataset.type =
        type;


    card.dataset.rowId =
        String(
            row["ID"] ||
            ""
        );


    const titleElement =
        document.createElement(
            "div"
        );


    titleElement.className =
        "card-title";


    titleElement.textContent =
        title;


    const valueElement =
        document.createElement(
            "div"
        );


    valueElement.className =
        "card-value";


    if(
        isURL(value)
    ){

        const link =
            document.createElement(
                "a"
            );


        link.href =
            value;


        link.target =
            "_blank";


        link.rel =
            "noopener noreferrer";


        link.title =
            value;


        link.textContent =
            shortenURL(
                value
            );


        valueElement.appendChild(
            link
        );

    }else{

        valueElement.textContent =
            String(
                value
            );

    }


    card.appendChild(
        titleElement
    );


    card.appendChild(
        valueElement
    );


    return card;

}


/* =========================================================
   DRAG SYSTEM
========================================================= */

let drag = null;


function enableDragging(
    branch
){

    branch.addEventListener(
        "pointerdown",
        function(event){

            /*
             * Do not drag when clicking
             * a link.
             */

            if(
                event.target.closest("a")
            ){

                return;

            }


            const map =
                document.getElementById(
                    "map"
                );


            const mapRect =
                map.getBoundingClientRect();


            const branchRect =
                branch.getBoundingClientRect();


            const currentX =
                branchRect.left -
                mapRect.left +
                branchRect.width / 2;


            const currentY =
                branchRect.top -
                mapRect.top +
                branchRect.height / 2;


            drag = {

                branch:branch,

                pointerId:
                    event.pointerId,

                offsetX:
                    event.clientX -
                    mapRect.left -
                    currentX,

                offsetY:
                    event.clientY -
                    mapRect.top -
                    currentY

            };


            branch.classList.add(
                "dragging"
            );


            branch.setPointerCapture(
                event.pointerId
            );


            event.preventDefault();

        }
    );


    branch.addEventListener(
        "pointermove",
        function(event){

            if(
                !drag ||
                drag.branch !== branch
            ){

                return;

            }


            const map =
                document.getElementById(
                    "map"
                );


            const mapRect =
                map.getBoundingClientRect();


            let x =
                event.clientX -
                mapRect.left -
                drag.offsetX;


            let y =
                event.clientY -
                mapRect.top -
                drag.offsetY;


            const halfW =
                branch.offsetWidth /
                2;


            const halfH =
                branch.offsetHeight /
                2;


            const padding =
                15;


            x =
                Math.max(
                    halfW + padding,
                    Math.min(
                        map.clientWidth -
                        halfW -
                        padding,
                        x
                    )
                );


            y =
                Math.max(
                    halfH + padding,
                    Math.min(
                        map.clientHeight -
                        halfH -
                        padding,
                        y
                    )
                );


            branch.style.left =
                x +
                "px";


            branch.style.top =
                y +
                "px";


            saveBranchPosition(
                branch
            );


            drawConnections();

        }
    );


    branch.addEventListener(
        "pointerup",
        function(){

            finishDrag(
                branch
            );

        }
    );


    branch.addEventListener(
        "pointercancel",
        function(){

            finishDrag(
                branch
            );

        }
    );

}


function finishDrag(
    branch
){

    if(
        drag &&
        drag.branch === branch
    ){

        branch.classList.remove(
            "dragging"
        );


        drag =
            null;


        drawConnections();

    }

}


/* =========================================================
   SAVE LOCAL POSITION
========================================================= */

function saveBranchPosition(
    branch
){

    const id =
        branch.dataset.positionId;


    if(
        !id
    ){

        return;

    }


    savedPositions[id] = {

        x:
            parseFloat(
                branch.style.left
            ),

        y:
            parseFloat(
                branch.style.top
            )

    };


    try{

        localStorage.setItem(
            "obvyrisServerMapPositions",
            JSON.stringify(
                savedPositions
            )
        );

    }catch(error){

        console.warn(
            "Could not save map positions."
        );

    }

}


/* =========================================================
   LOAD SAVED POSITIONS
========================================================= */

function loadSavedPositions(){

    try{

        const saved =
            localStorage.getItem(
                "obvyrisServerMapPositions"
            );


        if(saved){

            savedPositions =
                JSON.parse(
                    saved
                ) || {};

        }

    }catch(error){

        savedPositions = {};

    }

}


loadSavedPositions();


/* =========================================================
   CONNECTION ENGINE
========================================================= */

function drawConnections(){

    const svg =
        document.getElementById(
            "connections"
        );


    svg.innerHTML =
        "";


    const map =
        document.getElementById(
            "map"
        );


    const mapRect =
        map.getBoundingClientRect();


    const hub =
        document.getElementById(
            "hub"
        );


    const hubRect =
        hub.getBoundingClientRect();


    const hubPoint = {

        x:
            hubRect.left -
            mapRect.left +
            hubRect.width / 2,

        y:
            hubRect.top -
            mapRect.top +
            hubRect.height / 2

    };


    /*
     * Each branch is processed
     * independently.

     * No global nearest-card
     * searching is used.
     */

    document
        .querySelectorAll(
            "#backendLayer .branch"
        )
        .forEach(
            function(branch){

                connectBranch(
                    branch,
                    hubPoint,
                    "north"
                );

            }
        );


    document
        .querySelectorAll(
            "#externalLayer .branch"
        )
        .forEach(
            function(branch){

                connectBranch(
                    branch,
                    hubPoint,
                    "south"
                );

            }
        );

}


/* =========================================================
   CONNECT BRANCH
========================================================= */

function connectBranch(
    branch,
    hubPoint,
    direction
){

    const map =
        document.getElementById(
            "map"
        );


    const mapRect =
        map.getBoundingClientRect();


    /*
     * Get only this branch's cards.
     */

    const cards =
        Array.from(
            branch.querySelectorAll(
                ".card"
            )
        );


    if(
        !cards.length
    ){

        return;

    }


    const points =
        cards.map(
            function(card){

                const rect =
                    card.getBoundingClientRect();


                return {

                    x:
                        rect.left -
                        mapRect.left +
                        rect.width / 2,

                    y:
                        rect.top -
                        mapRect.top +
                        rect.height / 2,

                    type:
                        card.dataset.type

                };

            }
        );


    /*
     * HUB → first card
     */

    drawLine(
        hubPoint,
        points[0],
        direction === "north"
            ? "backend"
            : "external"
    );


    /*
     * Card → card

     * ONLY within this branch.
     */

    for(
        let i = 0;
        i < points.length - 1;
        i++
    ){

        drawLine(
            points[i],
            points[i + 1],
            getLineType(
                points[i].type
            )
        );

    }

}


/* =========================================================
   LINE TYPE
========================================================= */

function getLineType(
    type
){

    switch(type){

        case "backend":
            return "backend";

        case "sheet":
            return "sheet";

        case "sheet-api":
            return "sheet-api";

        case "frontend":
            return "frontend";

        case "external":
            return "external";

        case "external-api":
            return "external-api";

        default:
            return "sheet";

    }

}


/* =========================================================
   DRAW CURVED LINE
========================================================= */

function drawLine(
    a,
    b,
    type
){

    const svg =
        document.getElementById(
            "connections"
        );


    const path =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path"
        );


    const dy =
        b.y -
        a.y;


    const distance =
        Math.abs(dy);


    const bend =
        Math.max(
            35,
            Math.min(
                160,
                distance * .42
            )
        );


    let d;


    if(
        dy < 0
    ){

        d =
            `M ${a.x} ${a.y}
             C ${a.x} ${a.y - bend},
               ${b.x} ${b.y + bend},
               ${b.x} ${b.y}`;

    }else{

        d =
            `M ${a.x} ${a.y}
             C ${a.x} ${a.y + bend},
               ${b.x} ${b.y - bend},
               ${b.x} ${b.y}`;

    }


    path.setAttribute(
        "d",
        d
    );


    path.setAttribute(
        "class",
        "connection " +
        type
    );


    svg.appendChild(
        path
    );

}


/* =========================================================
   HELPERS
========================================================= */

function hasValue(
    value
){

    if(
        value ===
        undefined ||
        value ===
        null
    ){

        return false;

    }


    const text =
        String(
            value
        ).trim();


    return (
        text !== "" &&
        text !== "#"
    );

}


function hasFrontend(
    row
){

    return [

        "MAIN HTML FRONTEND",
        "HTML FRONTEND 2",
        "HTML FRONTEND 3",
        "HTML FRONTEND 4",
        "HTML FRONTEND 5"

    ].some(
        function(field){

            return hasValue(
                row[field]
            );

        }
    );

}


function isURL(
    value
){

    return /^https?:\/\//i.test(
        String(value)
    );

}


function shortenURL(
    value
){

    try{

        const url =
            new URL(
                value
            );


        let result =
            url.hostname +
            url.pathname;


        if(
            result.length > 42
        ){

            result =
                result.substring(
                    0,
                    39
                ) +
                "...";

        }


        return result;

    }catch(error){

        return String(
            value
        );

    }

}

   CENTER BRANCHES
========================================================= */

function centerBranches(){

    savedPositions = {};

    try{

        localStorage.removeItem(
            "obvyrisServerMapPositions"
        );

    }catch(error){}


    renderMap();

}


/* =========================================================
   INFO
========================================================= */

function updateInfo(
    data
){

    const info =
        document.getElementById(
            "info"
        );


    const count =
        Array.isArray(
            data.rows
        )
            ? data.rows.length
            : 0;


    let generated =
        "";


    if(
        data.generated
    ){

        const date =
            new Date(
                data.generated
            );


        if(
            !Number.isNaN(
                date.getTime()
            )
        ){

            generated =
                " • " +
                date.toLocaleTimeString();

        }

    }


    info.textContent =
        count +
        " architecture records" +
        generated;

}
