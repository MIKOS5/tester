<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Obvyris Media OS v2</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2793ff">

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
:root{
  --bg:#0b0f18;
  --panel:#111827;
  --text:#fff;
  --muted:#94a3b8;
  --blue:#2793ff;
}

body{
  margin:0;
  font-family:Arial;
  background:var(--bg);
  color:var(--text);
  display:flex;
  height:100vh;
}

/* SIDEBAR */
.sidebar{
  width:320px;
  background:var(--panel);
  padding:10px;
  overflow:auto;
}

.title{font-size:20px;font-weight:900;}

button{
  background:var(--blue);
  color:#fff;
  border:none;
  padding:8px;
  margin:3px;
  border-radius:6px;
  cursor:pointer;
}

.card{
  background:#1f2937;
  padding:8px;
  margin:6px 0;
  border-radius:8px;
  cursor:pointer;
  border:1px solid #333;
}

/* MAIN */
.main{
  flex:1;
  display:flex;
  flex-direction:column;
}

video{
  width:100%;
  height:60vh;
  background:black;
}

.topbar{
  padding:8px;
  display:flex;
  gap:8px;
}

/* CHAT */
.chat{
  position:fixed;
  right:10px;
  bottom:100px;
  width:320px;
  height:50vh;
  background:var(--panel);
  display:none;
  flex-direction:column;
  border:1px solid #333;
}

.chat-log{flex:1;overflow:auto;padding:10px;font-size:12px;}
.chat-input{display:flex;}
</style>
</head>

<body>

<div class="sidebar">
  <div class="title">📡 Obvyris OS v2</div>

  <button onclick="setMode('video')">📺 Video</button>
  <button onclick="setMode('radio')">📻 Radio</button>
  <button onclick="toggleTheme()">🌙</button>
  <button onclick="showFavs()">⭐ Fav</button>

  <input id="search" placeholder="search..." oninput="render()"/>

  <div id="list"></div>
</div>

<div class="main">

  <video id="player" controls autoplay></video>

  <div class="topbar">
    <button onclick="prev()">⏮</button>
    <button onclick="toggle()">▶</button>
    <button onclick="next()">⏭</button>
    <button onclick="toggleChat()">💬</button>
  </div>

</div>

<div id="chat" class="chat">
  <div style="padding:8px;font-weight:700;">Chat</div>
  <div id="chatLog" class="chat-log"></div>

  <div class="chat-input">
    <input id="name" placeholder="name" maxlength="8"/>
    <input id="msg" placeholder="msg" maxlength="100"/>
    <button onclick="send()">Send</button>
  </div>
</div>

<script>

/* ================= STATE ================= */
let mode="video";
let index=0;
let list=[];
let favs=JSON.parse(localStorage.getItem("fav")||"[]");

const video=document.getElementById("player");

/* ================= LOAD VIDEO ================= */
async function loadVideo(){
  const res=await fetch("https://iptv-org.github.io/iptv/index.m3u");
  const text=await res.text();

  const lines=text.split("\n");

  let temp=[];

  for(let l of lines){
    if(l.startsWith("http")){
      temp.push({
        id:l,
        name:l.split("/").pop(),
        url:l,
        type:"video"
      });
    }
  }

  list=temp;
  render();
}

/* ================= LOAD RADIO ================= */
async function loadRadio(){
  const res=await fetch("https://all.api.radio-browser.info/json/stations/search?limit=200");
  const data=await res.json();

  list=data.map(s=>({
    id:s.stationuuid,
    name:s.name,
    url:s.url_resolved,
    type:"radio"
  }));

  render();
}

/* ================= RENDER ================= */
function render(){
  const el=document.getElementById("list");
  el.innerHTML="";

  const q=document.getElementById("search").value.toLowerCase();

  list
  .filter(i=>i.name.toLowerCase().includes(q))
  .forEach((c,i)=>{
    el.innerHTML+=`
      <div class="card" onclick="play(${i})">
        ${c.name}
      </div>
    `;
  });
}

/* ================= PLAY ================= */
function play(i){
  index=i;
  const item=list[i];

  if(!item) return;

  if(item.url.includes(".m3u8") && Hls.isSupported()){
    const hls=new Hls();
    hls.loadSource(item.url);
    hls.attachMedia(video);
  } else {
    video.src=item.url;
  }

  video.play();
  loadChat();
}

/* ================= CONTROLS ================= */
function next(){
  index=(index+1)%list.length;
  play(index);
}

function prev(){
  index=(index-1+list.length)%list.length;
  play(index);
}

function toggle(){
  video.paused?video.play():video.pause();
}

/* ================= MODE ================= */
function setMode(m){
  mode=m;
  index=0;
  if(m==="video") loadVideo();
  else loadRadio();
}

/* ================= FAVORITES ================= */
function toggleFav(item){
  const exists=favs.find(f=>f.id===item.id);

  if(exists){
    favs=favs.filter(f=>f.id!==item.id);
  }else{
    favs.push(item);
  }

  localStorage.setItem("fav",JSON.stringify(favs));
}

function showFavs(){
  list=favs;
  render();
}

/* ================= CHAT ================= */
const API="https://script.google.com/macros/s/AKfycbzin84qDcZ9L1q4pTBtHZGKJSTDcZ_wnmgWmnmgPgf1jrc1nRprzbEBixKMSHcdkxiZBg/exec";

function room(){
  return list[index]?.id || "global";
}

async function loadChat(){
  const res=await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"get",
      station:room()
    })
  });

  const data=await res.json();
  renderChat(data);
}

function renderChat(data){
  const box=document.getElementById("chatLog");
  box.innerHTML="";
  (data||[]).forEach(m=>{
    box.innerHTML+=`<div><b>${m.name}:</b> ${m.message}</div>`;
  });
  box.scrollTop=box.scrollHeight;
}

async function send(){
  const name=document.getElementById("name").value||"anon";
  const msg=document.getElementById("msg").value;

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"send",
      station:room(),
      name,
      message:msg
    })
  });

  loadChat();
}

/* ================= CHAT TOGGLE ================= */
function toggleChat(){
  const c=document.getElementById("chat");
  c.style.display=c.style.display==="flex"?"none":"flex";
  if(c.style.display==="flex") loadChat();
}

/* ================= THEME ================= */
function toggleTheme(){
  document.body.classList.toggle("light");
}

/* ================= INIT ================= */
loadVideo();

/* ================= KEYBOARD ================= */
document.addEventListener("keydown",(e)=>{
  if(e.key==="ArrowRight") next();
  if(e.key==="ArrowLeft") prev();
  if(e.key===" ") toggle();
});
</script>

</body>
</html>
