<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Obvyris Server Map</title>

<style>

:root{
    --bg:#050914;
    --panel:#0b1220;
    --panel2:#101a2c;
    --line:#26354d;
    --text:#eef5ff;
    --muted:#8494ad;
    --blue:#2793ff;
    --blue2:#58b1ff;
    --green:#28d17c;
    --red:#ff5364;
    --orange:#ffad42;
    --purple:#a978ff;
    --shadow:0 12px 35px rgba(0,0,0,.45);
}

*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

/* =========================================================
   HEADER
========================================================= */

.topbar{
    position:fixed;
    top:0;
    left:0;
    right:0;
    height:64px;
    z-index:1000;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 18px;

    background:rgba(5,9,20,.92);
    border-bottom:1px solid var(--line);
    backdrop-filter:blur(12px);
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.brandMark{
    width:38px;
    height:38px;
    border-radius:11px;

    display:grid;
    place-items:center;

    background:linear-gradient(
        135deg,
        #2793ff,
        #735cff
    );

    font-weight:900;
    box-shadow:
        0 0 20px rgba(39,147,255,.3);
}

.brandText{
    line-height:1.05;
}

.brandTitle{
    font-size:16px;
    font-weight:800;
}

.brandSub{
    color:var(--muted);
    font-size:11px;
    margin-top:4px;
}

.toolbar{
    display:flex;
    align-items:center;
    gap:7px;
}

.tool{
    height:34px;
    min-width:34px;

    border:1px solid var(--line);
    border-radius:8px;

    background:#0d1728;
    color:var(--text);

    cursor:pointer;
    font-weight:700;

    transition:.15s;
}

.tool:hover{
    background:#15243a;
    border-color:#3a5273;
}

.zoomValue{
    min-width:68px;
    text-align:center;
    color:var(--muted);
    font-size:12px;
}

.apiState{
    display:flex;
    align-items:center;
    gap:7px;

    margin-left:10px;

    color:var(--muted);
    font-size:12px;
}

.apiDot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--orange);
}

.apiDot.online{
    background:var(--green);
    box-shadow:0 0 10px rgba(40,209,124,.6);
}

.apiDot.error{
    background:var(--red);
}

/* =========================================================
   MAP
========================================================= */

#viewport{
    position:fixed;
    inset:64px 0 0 0;
    overflow:hidden;

    cursor:grab;

    background-color:#050914;

    background-image:
        linear-gradient(
            rgba(255,255,255,.025) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,255,255,.025) 1px,
            transparent 1px
        );

    background-size:40px 40px;
}

#viewport.dragging{
    cursor:grabbing;
}

#world{
    position:absolute;

    width:1px;
    height:1px;

    left:50%;
    top:50%;

    transform-origin:0 0;
}

/* =========================================================
   CONNECTION SVG
========================================================= */

#connections{
    position:absolute;

    left:-100000px;
    top:-100000px;

    width:200000px;
    height:200000px;

    pointer-events:none;

    overflow:visible;
}

.connection{
    fill:none;

    stroke-width:1.5;

    opacity:.52;

    vector-effect:non-scaling-stroke;
}

.connection.backend{
    stroke:#2793ff;
}

.connection.external{
    stroke:#a978ff;
}

.connection.frontend{
    stroke:#28d17c;
}

/* =========================================================
   HUB
========================================================= */

#hub{
    position:absolute;

    left:0;
    top:0;

    width:190px;
    height:110px;

    transform:
        translate(-50%,-50%);

    z-index:500;

    border:1px solid #397dc2;
    border-radius:18px;

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(39,147,255,.28),
            transparent 65%
        ),
        #0b1728;

    box-shadow:
        0 0 0 1px rgba(39,147,255,.08),
        0 0 50px rgba(39,147,255,.22),
        var(--shadow);

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    pointer-events:none;
}

.hubRing{
    position:absolute;

    width:220px;
    height:140px;

    border:1px solid rgba(39,147,255,.15);
    border-radius:50%;

    animation:pulse 3s infinite;
}

@keyframes pulse{
    0%,100%{
        transform:scale(.96);
        opacity:.5;
    }
    50%{
        transform:scale(1.05);
        opacity:1;
    }
}

.hubIcon{
    font-size:25px;
    margin-bottom:5px;
}

.hubTitle{
    font-size:18px;
    font-weight:900;
    letter-spacing:.5px;
}

.hubSub{
    color:var(--blue2);
    font-size:10px;
    letter-spacing:2px;
    margin-top:5px;
}

/* =========================================================
   CARDS
========================================================= */

.node{
    position:absolute;

    width:205px;

    transform:translate(-50%,-50%);

    z-index:200;

    cursor:grab;

    user-select:none;

    transition:
        box-shadow .15s,
        border-color .15s;
}

.node:active{
    cursor:grabbing;
}

.node:hover{
    z-index:600;
}

.card{
    min-height:76px;

    padding:11px 13px;

    border-radius:12px;

    background:
        linear-gradient(
            145deg,
            rgba(16,26,44,.98),
            rgba(8,15,27,.98)
        );

    border:1px solid var(--line);

    box-shadow:
        0 8px 22px rgba(0,0,0,.32);
}

.node:hover .card{
    border-color:#3e5b7e;

    box-shadow:
        0 12px 30px rgba(0,0,0,.5),
        0 0 20px rgba(39,147,255,.08);
}

.node.backend .card{
    border-left:3px solid var(--blue);
}

.node.sheet .card{
    border-left:3px solid #45a9ff;
}

.node.api .card{
    border-left:3px solid var(--green);
}

.node.frontend .card{
    border-left:3px solid var(--green);
}

.node.external .card{
    border-left:3px solid var(--purple);
}

.node.externalApi .card{
    border-left:3px solid #c49cff;
}

.nodeTitle{
    font-size:12px;
    font-weight:800;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.nodeValue{
    margin-top:6px;

    color:var(--muted);

    font-size:10px;
    line-height:1.35;

    word-break:break-all;

    max-height:29px;
    overflow:hidden;
}

.nodeType{
    display:inline-block;

    margin-top:7px;

    padding:2px 6px;

    border-radius:5px;

    background:#111d30;

    color:#7f94b1;

    font-size:8px;
    font-weight:800;

    text-transform:uppercase;
    letter-spacing:.7px;
}

/* =========================================================
   LEGEND
========================================================= */

.legend{
    position:fixed;

    left:16px;
    bottom:16px;

    z-index:1000;

    padding:10px 12px;

    border:1px solid var(--line);
    border-radius:10px;

    background:rgba(8,14,25,.9);

    backdrop-filter:blur(10px);

    display:flex;
    gap:13px;

    font-size:10px;
    color:var(--muted);
}

.legendItem{
    display:flex;
    align-items:center;
    gap:5px;
}

.legendDot{
    width:7px;
    height:7px;
    border-radius:50%;
}

.legendBackend{
    background:var(--blue);
}

.legendFrontend{
    background:var(--green);
}

.legendExternal{
    background:var(--purple);
}

/* =========================================================
   INFO PANEL
========================================================= */

.info{
    position:fixed;

    right:16px;
    bottom:16px;

    z-index:1000;

    padding:10px 12px;

    border:1px solid var(--line);
    border-radius:10px;

    background:rgba(8,14,25,.9);

    backdrop-filter:blur(10px);

    color:var(--muted);

    font-size:10px;

    text-align:right;

    line-height:1.6;
}

/* =========================================================
   LOADING
========================================================= */

.loading{
    position:fixed;

    inset:64px 0 0 0;

    z-index:900;

    display:flex;
    align-items:center;
    justify-content:center;

    pointer-events:none;
}

.loadingBox{
    padding:16px 20px;

    border:1px solid var(--line);
    border-radius:12px;

    background:#0b1220;

    box-shadow:var(--shadow);

    color:var(--muted);

    font-size:12px;
}

.hidden{
    display:none;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    .brandSub{
        display:none;
    }

    .apiState{
        display:none;
    }

    .legend{
        display:none;
    }

    .info{
        display:none;
    }

    .node{
        width:175px;
    }

    .toolbar{
        gap:4px;
    }

}

</style>

</head>

    </div>

<script>

/* =========================================================
   OBVYRIS MAP API
========================================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbxmet73uElazLhNTF6K9Ziizu4hbgq7VWbXJ8nKjSeXkn-tN4CyoBDjSdeK69A_J5XG/exec";


/* =========================================================
   MAP STATE
========================================================= */

const viewport =
    document.getElementById("viewport");

const world =
    document.getElementById("world");

const svg =
    document.getElementById("connections");

const zoomValue =
    document.getElementById("zoomValue");

const loading =
    document.getElementById("loading");

const apiDot =
    document.getElementById("apiDot");

const apiText =
    document.getElementById("apiText");


const STORAGE_KEY =
    "obvyris_server_map_v4";


let state = {

    scale:1,

    panX:0,

    panY:0,

    nodes:{}

};


let rows = [];


/* =========================================================
   LOAD SAVED STATE
========================================================= */

function loadState(){

    try{

        const saved =
            localStorage.getItem(STORAGE_KEY);

        if(saved){

            const parsed =
                JSON.parse(saved);

            state = {
                ...state,
                ...parsed,
                nodes:{
                    ...(parsed.nodes || {})
                }
            };

        }

    }catch(error){

        console.warn(
            "Could not load saved map state",
            error
        );

    }

}


/* =========================================================
   SAVE STATE
========================================================= */

let saveTimer = null;

function saveState(){

    clearTimeout(saveTimer);

    saveTimer =
        setTimeout(() => {

            try{

                localStorage.setItem(
                    STORAGE_KEY,
                    JSON.stringify(state)
                );

            }catch(error){

                console.warn(
                    "Could not save map",
                    error
                );

            }

        },100);

}


/* =========================================================
   WORLD TRANSFORM
========================================================= */

function updateTransform(){

    world.style.transform =
        `translate(${state.panX}px,${state.panY}px) scale(${state.scale})`;

    zoomValue.textContent =
        Math.round(state.scale * 100) + "%";

    saveState();

    requestAnimationFrame(
        drawConnections
    );

}


/* =========================================================
   ZOOM
========================================================= */

function setZoom(newScale, mouseX, mouseY){

    const oldScale =
        state.scale;

    newScale =
        Math.max(
            .08,
            Math.min(
                8,
                newScale
            )
        );

    if(mouseX === undefined){

        mouseX =
            viewport.clientWidth / 2;

    }

    if(mouseY === undefined){

        mouseY =
            viewport.clientHeight / 2;

    }

    const rect =
        viewport.getBoundingClientRect();

    const x =
        mouseX - rect.left;

    const y =
        mouseY - rect.top;


    /*
       Keep the point beneath the
       mouse stationary while zooming.
    */

    state.panX =
        x - (x - state.panX) *
        (newScale / oldScale);

    state.panY =
        y - (y - state.panY) *
        (newScale / oldScale);


    state.scale =
        newScale;

    updateTransform();

}


/* =========================================================
   MOUSE WHEEL
========================================================= */

viewport.addEventListener(
    "wheel",
    function(event){

        event.preventDefault();

        const direction =
            event.deltaY < 0
                ? 1.12
                : 0.89;

        setZoom(
            state.scale * direction,
            event.clientX,
            event.clientY
        );

    },
    {passive:false}
);


/* =========================================================
   BUTTONS
========================================================= */

document
.getElementById("zoomIn")
.addEventListener(
    "click",
    () => {

        setZoom(
            state.scale * 1.2
        );

    }
);


document
.getElementById("zoomOut")
.addEventListener(
    "click",
    () => {

        setZoom(
            state.scale * .833333
        );

    }
);


document
.getElementById("resetMap")
.addEventListener(
    "click",
    () => {

        state.scale = 1;

        state.panX = 0;

        state.panY = 0;

        state.nodes = {};

        saveState();

        render();

    }
);


/* =========================================================
   PAN
========================================================= */

let panning = false;

let panStartX = 0;
let panStartY = 0;

let originalPanX = 0;
let originalPanY = 0;


viewport.addEventListener(
    "pointerdown",
    function(event){

        if(
            event.target.closest(".node")
        ){
            return;
        }

        panning = true;

        viewport.classList.add(
            "dragging"
        );

        panStartX =
            event.clientX;

        panStartY =
            event.clientY;

        originalPanX =
            state.panX;

        originalPanY =
            state.panY;

        viewport.setPointerCapture(
            event.pointerId
        );

    }
);


viewport.addEventListener(
    "pointermove",
    function(event){

        if(!panning){
            return;
        }

        state.panX =
            originalPanX +
            (event.clientX - panStartX);

        state.panY =
            originalPanY +
            (event.clientY - panStartY);

        updateTransform();

    }
);


viewport.addEventListener(
    "pointerup",
    function(){

        panning = false;

        viewport.classList.remove(
            "dragging"
        );

    }
);


viewport.addEventListener(
    "pointercancel",
    function(){

        panning = false;

        viewport.classList.remove(
            "dragging"
        );

    }
);


/* =========================================================
   FETCH API
========================================================= */

async function loadMap(){

    loading.classList.remove(
        "hidden"
    );

    apiText.textContent =
        "Loading";

    apiDot.className =
        "apiDot";


    try{

        const response =
            await fetch(
                API_URL + "?action=map",
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        if(
            !data ||
            !Array.isArray(data.rows)
        ){

            throw new Error(
                "Invalid API response"
            );

        }


        rows =
            data.rows;


        apiDot.className =
            "apiDot online";

        apiText.textContent =
            rows.length +
            " systems";


        render();


    }catch(error){

        console.error(
            "Server map API error:",
            error
        );


        apiDot.className =
            "apiDot error";

        apiText.textContent =
            "API Error";


        showApiError(
            error.message
        );

    }finally{

        loading.classList.add(
            "hidden"
        );

    }

}


/* =========================================================
   API ERROR NODE
========================================================= */

function showApiError(message){

    const hub =
        document.getElementById("hub");

    const existing =
        document.getElementById(
            "apiError"
        );

    if(existing){
        existing.remove();
    }

    const error =
        document.createElement("div");

    error.id =
        "apiError";

    error.className =
        "node";

    error.style.left =
        "0px";

    error.style.top =
        "-190px";

    error.innerHTML = `

        <div class="card"
             style="
             border-left:3px solid var(--red);
             ">

            <div class="nodeTitle">
                MAP API ERROR
            </div>

            <div class="nodeValue">
                ${escapeHtml(message)}
            </div>

        </div>

    `;

    world.appendChild(
        error
    );

}


/* =========================================================
   NORMALIZE ROW
========================================================= */

function normalizeRow(row,index){

    return {

        id:
            String(
                row.ID ??
                index + 1
            ),

        backend:
            String(
                row["Backends Sheet"] ??
                ""
            ).trim(),

        sheet:
            String(
                row["Sheet"] ??
                ""
            ).trim(),

        sheetApi:
            String(
                row["Sheet API"] ??
                ""
            ).trim(),

        status:
            String(
                row["Status"] ??
                ""
            ).trim(),

        frontends:[
            row["MAIN HTML FRONTEND"],
            row["HTML FRONTEND 2"],
            row["HTML FRONTEND 3"],
            row["HTML FRONTEND 4"],
            row["HTML FRONTEND 5"]
        ]
        .map(
            value =>
                String(value || "").trim()
        )
        .filter(Boolean),

        external:
            String(
                row["EXTERNAL"] ??
                ""
            ).trim(),

        externalApi:
            String(
                row["EXTERNAL API"] ??
                ""
            ).trim(),

        externalApi2:
            String(
                row["EXTERNAL API 2"] ??
                ""
            ).trim()

    };

}


/* =========================================================
   NODE CREATION
========================================================= */

const nodeElements =
    new Map();


function makeNode(
    key,
    type,
    title,
    value,
    x,
    y
){

    const node =
        document.createElement("div");

    node.className =
        "node " + type;

    node.dataset.key =
        key;

    node.style.left =
        x + "px";

    node.style.top =
        y + "px";


    node.innerHTML = `

        <div class="card">

            <div class="nodeTitle">
                ${escapeHtml(title)}
            </div>

            <div class="nodeValue">
                ${escapeHtml(
                    value || "No data"
                )}
            </div>

            <div class="nodeType">
                ${escapeHtml(type)}
            </div>

        </div>

    `;


    world.appendChild(
        node
    );


    nodeElements.set(
        key,
        node
    );


    enableNodeDragging(
        node,
        key
    );


    return node;

}


/* =========================================================
   DEFAULT POSITIONS
========================================================= */

function defaultPosition(
    type,
    index,
    total
){

    const radiusBackend =
        440 +
        Math.floor(index / 6) * 230;

    const radiusExternal =
        440 +
        Math.floor(index / 6) * 230;


    const angle =
        total > 1
            ? (
                -Math.PI * .92 +
                (
                    index /
                    Math.max(1,total-1)
                ) *
                Math.PI * .84
            )
            : -Math.PI / 2;


    if(type === "backend"){

        return {

            x:
                Math.cos(angle) *
                radiusBackend,

            y:
                Math.sin(angle) *
                radiusBackend

        };

    }


    return {

        x:
            Math.cos(angle) *
            radiusExternal,

        y:
            Math.sin(angle) *
            radiusExternal

    };

}


/* =========================================================
   SAVED POSITION
========================================================= */

function getNodePosition(
    key,
    type,
    index,
    total
){

    if(
        state.nodes &&
        state.nodes[key] &&
        Number.isFinite(
            state.nodes[key].x
        ) &&
        Number.isFinite(
            state.nodes[key].y
        )
    ){

        return state.nodes[key];

    }


    return defaultPosition(
        type,
        index,
        total
    );

}


/* =========================================================
   RENDER MAP
========================================================= */

function render(){

    /*
       Remove all existing nodes
       except the Hub.
    */

    document
    .querySelectorAll(
        ".node"
    )
    .forEach(
        element =>
            element.remove()
    );


    nodeElements.clear();


    const normalized =
        rows.map(
            normalizeRow
        );


    /*
       Backend count determines
       north branch spacing.
    */

    const backendRows =
        normalized.filter(
            row =>
                row.backend
        );


    /*
       External rows determine
       south branch spacing.
    */

    const externalRows =
        normalized.filter(
            row =>
                row.external ||
                row.externalApi ||
                row.externalApi2
        );


    normalized.forEach(
        (row,index) => {

            const rowPrefix =
                "row-" +
                row.id;


            /*
               ==================================================
               BACKEND
               ==================================================
            */

            if(row.backend){

                const pos =
                    getNodePosition(
                        rowPrefix +
                        "-backend",

                        "backend",

                        backendRows.indexOf(
                            row
                        ),

                        backendRows.length
                    );


                makeNode(

                    rowPrefix +
                    "-backend",

                    "backend",

                    row.backend,

                    "Backend service",

                    pos.x,

                    pos.y

                );

            }


            /*
               ==================================================
               SHEET
               ==================================================
            */

            if(row.sheet){

                const pos =
                    getNodePosition(
                        rowPrefix +
                        "-sheet",

                        "sheet",

                        index,

                        normalized.length
                    );


                makeNode(

                    rowPrefix +
                    "-sheet",

                    "sheet",

                    "Google Sheet",

                    row.sheet,

                    pos.x,

                    pos.y

                );

            }


            /*
               ==================================================
               SHEET API
               ==================================================
            */

            if(row.sheetApi){

                const pos =
                    getNodePosition(
                        rowPrefix +
                        "-sheetapi",

                        "api",

                        index,

                        normalized.length
                    );


                makeNode(

                    rowPrefix +
                    "-sheetapi",

                    "api",

                    "Sheet API",

                    row.sheetApi,

                    pos.x,

                    pos.y

                );

            }


            /*
               ==================================================
               FRONTENDS
               ==================================================
            */

            row.frontends.forEach(
                (
                    frontend,
                    frontendIndex
                ) => {

                    const pos =
                        getNodePosition(

                            rowPrefix +
                            "-frontend-" +
                            frontendIndex,

                            "frontend",

                            frontendIndex,

                            row.frontends.length

                        );


                    makeNode(

                        rowPrefix +
                        "-frontend-" +
                        frontendIndex,

                        "frontend",

                        frontendIndex === 0
                            ? "Main Frontend"
                            : "Frontend " +
                              (
                                  frontendIndex + 1
                              ),

                        frontend,

                        pos.x,

                        pos.y

                    );

                }
            );


            /*
               ==================================================
               EXTERNAL
               ==================================================
            */

            if(row.external){

                const pos =
                    getNodePosition(

                        rowPrefix +
                        "-external",

                        "external",

                        externalRows.indexOf(
                            row
                        ),

                        externalRows.length

                    );


                makeNode(

                    rowPrefix +
                    "-external",

                    "external",

                    "External",

                    row.external,

                    pos.x,

                    pos.y

                );

            }


            /*
               ==================================================
               EXTERNAL API
               ==================================================
            */

            if(row.externalApi){

                const pos =
                    getNodePosition(

                        rowPrefix +
                        "-external-api",

                        "externalApi",

                        externalRows.indexOf(
                            row
                        ),

                        externalRows.length

                    );


                makeNode(

                    rowPrefix +
                    "-external-api",

                    "externalApi",

                    "External API",

                    row.externalApi,

                    pos.x,

                    pos.y

                );

            }


            /*
               ==================================================
               EXTERNAL API 2
               ==================================================
            */

            if(row.externalApi2){

                const pos =
                    getNodePosition(

                        rowPrefix +
                        "-external-api-2",

                        "externalApi",

                        externalRows.indexOf(
                            row
                        ),

                        externalRows.length

                    );


                makeNode(

                    rowPrefix +
                    "-external-api-2",

                    "externalApi",

                    "External API 2",

                    row.externalApi2,

                    pos.x,

                    pos.y

                );

            }

        }
    );


    updateTransform();


    requestAnimationFrame(
        drawConnections
    );

}


/* =========================================================
   NODE DRAGGING
========================================================= */

function enableNodeDragging(
    node,
    key
){

    let dragging = false;

    let startX = 0;
    let startY = 0;

    let originalX = 0;
    let originalY = 0;


    node.addEventListener(
        "pointerdown",
        function(event){

            event.stopPropagation();

            dragging = true;

            node.setPointerCapture(
                event.pointerId
            );


            const rect =
                node.getBoundingClientRect();


            /*
               Convert screen position
               back into world coordinates.
            */

            const worldX =
                (
                    rect.left +
                    rect.width / 2 -
                    viewport.getBoundingClientRect().left -
                    state.panX
                ) /
                state.scale;


            const worldY =
                (
                    rect.top +
                    rect.height / 2 -
                    viewport.getBoundingClientRect().top -
                    state.panY
                ) /
                state.scale;


            originalX =
                worldX;

            originalY =
                worldY;


            startX =
                event.clientX;

            startY =
                event.clientY;

        }
    );


    node.addEventListener(
        "pointermove",
        function(event){

            if(!dragging){
                return;
            }


            const dx =
                (
                    event.clientX -
                    startX
                ) /
                state.scale;


            const dy =
                (
                    event.clientY -
                    startY
                ) /
                state.scale;


            const x =
                originalX + dx;

            const y =
                originalY + dy;


            node.style.left =
                x + "px";

            node.style.top =
                y + "px";


            state.nodes[key] = {

                x:x,

                y:y

            };


            requestAnimationFrame(
                drawConnections
            );

        }
    );


    node.addEventListener(
        "pointerup",
        function(){

            dragging = false;

            saveState();

        }
    );


    node.addEventListener(
        "pointercancel",
        function(){

            dragging = false;

            saveState();

        }
    );

}


/* =========================================================
   CONNECTION SYSTEM
========================================================= */

function drawConnections(){

    svg.innerHTML = "";


    /*
       SVG uses world coordinates.
       Hub is always 0,0.
    */


    rows.forEach(
        (rawRow) => {

            const row =
                normalizeRow(
                    rawRow
                );


            const prefix =
                "row-" +
                row.id;


            /*
               BACKEND → HUB
            */

            connect(
                prefix + "-backend",
                "hub",
                "backend"
            );


            /*
               HUB → SHEET
            */

            connect(
                "hub",
                prefix + "-sheet",
                "backend"
            );


            /*
               SHEET → SHEET API
            */

            connect(
                prefix + "-sheet",
                prefix + "-sheetapi",
                "backend"
            );


            /*
               SHEET API → FRONTENDS
            */

            row.frontends.forEach(
                (
                    frontend,
                    frontendIndex
                ) => {

                    connect(

                        prefix +
                        "-sheetapi",

                        prefix +
                        "-frontend-" +
                        frontendIndex,

                        "frontend"

                    );

                }
            );


            /*
               FRONTENDS → EXTERNAL
            */

            if(row.external){

                row.frontends.forEach(
                    (
                        frontend,
                        frontendIndex
                    ) => {

                        connect(

                            prefix +
                            "-frontend-" +
                            frontendIndex,

                            prefix +
                            "-external",

                            "external"

                        );

                    }
                );

            }


            /*
               EXTERNAL → EXTERNAL API
            */

            connect(
                prefix + "-external",
                prefix + "-external-api",
                "external"
            );


            /*
               EXTERNAL API → EXTERNAL API 2
            */

            connect(
                prefix + "-external-api",
                prefix + "-external-api-2",
                "external"
            );

        }
    );

}


/* =========================================================
   CONNECT TWO NODES
========================================================= */

function connect(
    fromKey,
    toKey,
    type
){

    let from;

    let to;


    if(fromKey === "hub"){

        from = {
            x:0,
            y:0
        };

    }else{

        from =
            getElementWorldCenter(
                fromKey
            );

    }


    if(toKey === "hub"){

        to = {
            x:0,
            y:0
        };

    }else{

        to =
            getElementWorldCenter(
                toKey
            );

    }


    if(!from || !to){
        return;
    }


    /*
       Curved Bezier line.
    */

    const distance =
        Math.hypot(
            to.x - from.x,
            to.y - from.y
        );


    const curve =
        Math.min(
            160,
            Math.max(
                40,
                distance * .22
            )
        );


    const direction =
        to.y >= from.y
            ? 1
            : -1;


    const path =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path"
        );


    path.setAttribute(
        "d",

        `
        M ${from.x} ${from.y}

        C
        ${from.x}
        ${from.y + curve * direction},

        ${to.x}
        ${to.y - curve * direction},

        ${to.x}
        ${to.y}
        `
    );


    path.setAttribute(
        "class",
        "connection " + type
    );


    svg.appendChild(
        path
    );

}


/* =========================================================
   GET WORLD CENTER
========================================================= */

function getElementWorldCenter(
    key
){

    const element =
        nodeElements.get(
            key
        );


    if(!element){

        return null;

    }


    return {

        x:
            parseFloat(
                element.style.left
            ),

        y:
            parseFloat(
                element.style.top
            )

    };

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(
    value
){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}

   WINDOW RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        requestAnimationFrame(
            drawConnections
        );

    }
);

   INITIALIZE
========================================================= */

loadState();

updateTransform();

loadMap();


/* =========================================================

========================================================= */

setInterval(
    loadMap,
    60000
);
