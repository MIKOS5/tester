<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Obvyris Server Map — Data Explorer</title>

<style>
:root{
    --bg:#07101c;
    --panel:#0d1826;
    --panel2:#101f30;
    --panel3:#13263a;
    --border:#263b51;
    --text:#eaf2fb;
    --muted:#8fa5bb;
    --blue:#2793ff;
    --blue2:#176fd1;
    --green:#28d17c;
    --red:#ff5268;
    --yellow:#f4c95d;
    --purple:#9b7cff;
    --cyan:#37d9ff;
    --shadow:0 15px 45px rgba(0,0,0,.35);
}

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:Inter,Segoe UI,Arial,sans-serif;
}

body{
    overflow:hidden;
}

button,
input,
select,
textarea{
    font:inherit;
}

button{
    cursor:pointer;
}

.app{
    display:grid;
    grid-template-rows:auto auto 1fr;
    width:100%;
    height:100vh;
}

/* =========================================================
   HEADER
========================================================= */

.header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    padding:14px 18px;
    background:#091522;
    border-bottom:1px solid var(--border);
    box-shadow:0 5px 25px rgba(0,0,0,.25);
    z-index:20;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
    min-width:250px;
}

.logo{
    width:42px;
    height:42px;
    border-radius:12px;
    display:grid;
    place-items:center;
    background:linear-gradient(135deg,#2793ff,#7a55ff);
    color:white;
    font-weight:900;
    box-shadow:0 0 25px rgba(39,147,255,.25);
}

.brandText h1{
    margin:0;
    font-size:17px;
    letter-spacing:.5px;
}

.brandText span{
    display:block;
    margin-top:2px;
    color:var(--muted);
    font-size:11px;
}

.headerActions{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
    justify-content:flex-end;
}

.btn{
    border:1px solid var(--border);
    background:var(--panel2);
    color:var(--text);
    padding:8px 12px;
    border-radius:8px;
    transition:.15s;
}

.btn:hover{
    border-color:#3b6388;
    background:#152a40;
}

.btn.primary{
    background:var(--blue);
    border-color:var(--blue);
    color:white;
}

.btn.primary:hover{
    background:var(--blue2);
}

.btn.danger{
    color:#ff8795;
}

.btn.small{
    padding:5px 8px;
    font-size:11px;
}

/* =========================================================
   TOOLBAR
========================================================= */

.toolbar{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 14px;
    background:#0a1623;
    border-bottom:1px solid var(--border);
    z-index:15;
    flex-wrap:wrap;
}

.searchBox{
    position:relative;
    flex:1;
    min-width:220px;
}

.searchBox input{
    width:100%;
    height:36px;
    padding:0 12px 0 34px;
    background:#08131f;
    color:var(--text);
    border:1px solid var(--border);
    border-radius:8px;
    outline:none;
}

.searchBox input:focus{
    border-color:var(--blue);
}

.searchIcon{
    position:absolute;
    left:11px;
    top:9px;
    color:var(--muted);
}

select{
    height:36px;
    padding:0 10px;
    color:var(--text);
    background:#08131f;
    border:1px solid var(--border);
    border-radius:8px;
    outline:none;
}

.stats{
    display:flex;
    gap:7px;
    margin-left:auto;
}

.stat{
    min-width:70px;
    padding:6px 9px;
    border:1px solid var(--border);
    border-radius:8px;
    background:#0b1928;
    text-align:center;
}

.stat strong{
    display:block;
    font-size:15px;
}

.stat span{
    color:var(--muted);
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:.5px;
}

/* =========================================================
   WORKSPACE
========================================================= */

.workspace{
    display:grid;
    grid-template-columns:minmax(0,1fr) 360px;
    min-height:0;
}

.tableArea{
    min-width:0;
    min-height:0;
    overflow:auto;
    position:relative;
}

.tableWrap{
    min-width:max-content;
}

table{
    border-collapse:separate;
    border-spacing:0;
    width:max-content;
    min-width:100%;
}

thead{
    position:sticky;
    top:0;
    z-index:10;
}

th{
    position:sticky;
    top:0;
    padding:10px 12px;
    background:#102235;
    border-right:1px solid var(--border);
    border-bottom:1px solid #38506a;
    color:#bcd0e3;
    font-size:11px;
    text-align:left;
    white-space:nowrap;
    user-select:none;
}

th:first-child{
    position:sticky;
    left:0;
    z-index:12;
}

td{
    min-width:145px;
    max-width:320px;
    padding:9px 11px;
    background:#0b1724;
    border-right:1px solid #1d3043;
    border-bottom:1px solid #1d3043;
    vertical-align:top;
    font-size:12px;
}

tbody tr:hover td{
    background:#102235;
}

tbody tr.selected td{
    background:#132c43;
    border-bottom-color:#2e638d;
}

td:first-child{
    position:sticky;
    left:0;
    z-index:5;
    min-width:58px;
    width:58px;
    background:#0e1c2b;
    font-weight:700;
}

.cell{
    min-height:22px;
    line-height:1.35;
    cursor:text;
    outline:none;
    border-radius:4px;
    padding:2px;
    word-break:break-word;
}

.cell:hover{
    background:rgba(39,147,255,.07);
}

.cell:focus{
    background:#08131f;
    box-shadow:0 0 0 1px var(--blue);
}

.empty{
    color:#52687d;
    font-style:italic;
}

.url{
    color:#55b5ff;
    cursor:pointer;
    text-decoration:none;
}

.url:hover{
    text-decoration:underline;
}

.status{
    display:inline-flex;
    align-items:center;
    gap:6px;
    padding:4px 7px;
    border-radius:999px;
    font-size:10px;
    font-weight:800;
}

.status::before{
    content:"";
    width:6px;
    height:6px;
    border-radius:50%;
}

.status.online{
    color:#5ce69a;
    background:rgba(40,209,124,.09);
}

.status.online::before{
    background:var(--green);
    box-shadow:0 0 8px var(--green);
}

.status.offline{
    color:#ff7d8c;
    background:rgba(255,82,104,.09);
}

.status.offline::before{
    background:var(--red);
}

.status.unknown{
    color:#f5d36b;
    background:rgba(244,201,93,.08);
}

.status.unknown::before{
    background:var(--yellow);
}

/* =========================================================
   INSPECTOR
========================================================= */

.inspector{
    min-width:0;
    min-height:0;
    overflow:auto;
    border-left:1px solid var(--border);
    background:#091522;
    box-shadow:-10px 0 30px rgba(0,0,0,.15);
}

.inspectorHeader{
    position:sticky;
    top:0;
    z-index:5;
    padding:15px;
    background:#0c1927;
    border-bottom:1px solid var(--border);
}

.inspectorTitle{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
}

.inspectorTitle h2{
    margin:0;
    font-size:16px;
}

.inspectorSub{
    color:var(--muted);
    font-size:11px;
    margin-top:4px;
}

.detailBody{
    padding:12px;
}

.detailGroup{
    margin-bottom:14px;
}

.detailGroup h3{
    margin:0 0 7px;
    color:#9eb4c9;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:1px;
}

.detailCard{
    padding:10px;
    margin-bottom:6px;
    border:1px solid var(--border);
    border-radius:8px;
    background:#0d1b2a;
}

.detailLabel{
    color:#7890a7;
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:.7px;
    margin-bottom:4px;
}

.detailValue{
    font-size:12px;
    line-height:1.4;
    word-break:break-word;
}

.detailValue a{
    color:#55b5ff;
}

.detailActions{
    display:flex;
    gap:5px;
    margin-top:7px;
    flex-wrap:wrap;
}

/* =========================================================
   LOADING
========================================================= */

.loading{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    background:rgba(3,9,16,.78);
    backdrop-filter:blur(5px);
    z-index:100;
}

.loading.show{
    display:flex;
}

.loaderBox{
    padding:22px 28px;
    background:#0d1b2a;
    border:1px solid var(--border);
    border-radius:12px;
    box-shadow:var(--shadow);
    text-align:center;
}

.spinner{
    width:30px;
    height:30px;
    margin:0 auto 10px;
    border:3px solid #20384f;
    border-top-color:var(--blue);
    border-radius:50%;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* =========================================================
   TOAST
========================================================= */

.toast{
    position:fixed;
    right:20px;
    bottom:20px;
    z-index:200;
    padding:11px 14px;
    border:1px solid var(--border);
    border-radius:9px;
    background:#102235;
    box-shadow:var(--shadow);
    color:white;
    font-size:12px;
    transform:translateY(20px);
    opacity:0;
    pointer-events:none;
    transition:.2s;
}

.toast.show{
    transform:translateY(0);
    opacity:1;
}

/* =========================================================
   EMPTY
========================================================= */

.emptyState{
    padding:50px;
    text-align:center;
    color:var(--muted);
}

.emptyState strong{
    display:block;
    color:white;
    margin-bottom:5px;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:900px){

    body{
        overflow:auto;
    }

    .app{
        height:auto;
        min-height:100vh;
    }

    .workspace{
        grid-template-columns:1fr;
    }

    .inspector{
        border-left:0;
        border-top:1px solid var(--border);
        max-height:500px;
    }

    .stats{
        width:100%;
        margin-left:0;
    }

    .stat{
        flex:1;
    }

    .header{
        align-items:flex-start;
        flex-direction:column;
    }

    .headerActions{
        justify-content:flex-start;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="header">

        <div class="brand">

            <div class="logo">
                O
            </div>

            <div class="brandText">

                <h1>Obvyris Server Map</h1>

                <span>
                    MAP Sheet • Infrastructure Data Explorer
                </span>

            </div>

        </div>

        <div class="headerActions">

            <button class="btn primary" onclick="loadData()">
                ↻ Refresh API
            </button>

            <button class="btn" onclick="exportJSON()">
                Export JSON
            </button>

            <button class="btn" onclick="exportCSV()">
                Export CSV
            </button>

            <button class="btn" onclick="clearLocalEdits()">
                Clear Local Edits
            </button>

        </div>

    </header>


    <!-- =====================================================
         TOOLBAR
    ====================================================== -->

    <div class="toolbar">

        <div class="searchBox">

            <span class="searchIcon">⌕</span>

            <input
                id="search"
                type="search"
                placeholder="Search backend, frontend, API, sheet, URL..."
                oninput="renderTable()"
            >

        </div>

        <select id="statusFilter" onchange="renderTable()">

            <option value="ALL">
                All Status
            </option>

            <option value="ONLINE">
                Online
            </option>

            <option value="OFFLINE">
                Offline
            </option>

            <option value="UNKNOWN">
                Unknown
            </option>

        </select>


        <select id="backendFilter" onchange="renderTable()">

            <option value="ALL">
                All Backends
            </option>

        </select>


        <button class="btn small" onclick="resetFilters()">
            Reset
        </button>


        <div class="stats">

            <div class="stat">
                <strong id="rowCount">0</strong>
                <span>Rows</span>
            </div>

            <div class="stat">
                <strong id="onlineCount">0</strong>
                <span>Online</span>
            </div>

            <div class="stat">
                <strong id="offlineCount">0</strong>
                <span>Offline</span>
            </div>

            <div class="stat">
                <strong id="urlCount">0</strong>
                <span>Links</span>
            </div>

        </div>

    </div>


    <!-- =====================================================
         WORKSPACE
    ====================================================== -->

    <main class="workspace">

        <section class="tableArea">

            <div class="tableWrap">

                <table id="dataTable">

                    <thead id="tableHead"></thead>

                    <tbody id="tableBody"></tbody>

                </table>

            </div>

        </section>


        <!-- =================================================
             INSPECTOR
        ================================================== -->

        <aside class="inspector">

            <div class="inspectorHeader">

                <div class="inspectorTitle">

                    <h2 id="inspectorTitle">
                        Select a row
                    </h2>

                    <button
                        class="btn small"
                        onclick="closeInspector()"
                    >
                        ×
                    </button>

                </div>

                <div
                    class="inspectorSub"
                    id="inspectorSub"
                >
                    Click any row to inspect the complete infrastructure record.
                </div>

            </div>

            <div
                class="detailBody"
                id="detailBody"
            >

                <div class="emptyState">

                    <strong>
                        No record selected
                    </strong>

                    Select a row from the MAP table.

                </div>

            </div>

        </aside>

    </main>

</div>


<!-- =========================================================
     LOADING
========================================================= -->

<div
    class="loading"
    id="loading"
>

    <div class="loaderBox">

        <div class="spinner"></div>

        <div>
            Loading MAP API...
        </div>

    </div>

</div>


<!-- =========================================================
     TOAST
========================================================= -->

<div
    class="toast"
    id="toast"
></div>


<script>

/* =========================================================
   CONFIGURATION
========================================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbxmet73uElazLhNTF6K9Ziizu4hbgq7VWbXJ8nKjSeXkn-tN4CyoBDjSdeK69A_J5XG/exec";


/*
    Local browser storage.

    This allows you to make changes while working with
    the map without pretending the API supports writes.
*/

const STORAGE_KEY =
"obvyris_map_local_edits_v1";


/* =========================================================
   STATE
========================================================= */

let mapData = [];

let columns = [];

let selectedIndex = null;

let localEdits =
    loadLocalEdits();


/* =========================================================
   START
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        loadData();

    }
);


/* =========================================================
   LOAD API
========================================================= */

async function loadData(){

    showLoading(true);

    try{

        const response =
            await fetch(
                API_URL +
                "?t=" +
                Date.now(),
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        if(!data){

            throw new Error(
                "API returned no data."
            );

        }


        if(
            !Array.isArray(data.rows)
        ){

            throw new Error(
                "API response does not contain a rows array."
            );

        }


        mapData =
            data.rows.map(
                row => {

                    return {
                        ...row
                    };

                }
            );


        buildColumns();

        applyLocalEdits();

        buildBackendFilter();

        renderTable();

        updateStats();

        showToast(
            "MAP data loaded successfully."
        );


    }
    catch(error){

        console.error(error);

        showToast(
            "Unable to load MAP API: " +
            error.message
        );


        document.getElementById(
            "tableBody"
        ).innerHTML = `

            <tr>
                <td colspan="20">

                    <div class="emptyState">

                        <strong>
                            MAP API could not be loaded
                        </strong>

                        ${escapeHTML(error.message)}

                    </div>

                </td>
            </tr>

        `;

    }
    finally{

        showLoading(false);

    }

}


/* =========================================================
   BUILD COLUMN LIST
========================================================= */

function buildColumns(){

    const set =
        new Set();


    mapData.forEach(
        row => {

            Object.keys(row)
                .forEach(
                    key => set.add(key)
                );

        }
    );


    columns =
        Array.from(set);

}


/* =========================================================
   BACKEND FILTER
========================================================= */

function buildBackendFilter(){

    const select =
        document.getElementById(
            "backendFilter"
        );


    const current =
        select.value;


    const names =
        [
            ...new Set(
                mapData
                    .map(
                        row =>
                            row["Backends Sheet"]
                    )
                    .filter(Boolean)
            )
        ]
        .sort(
            (a,b) =>
                a.localeCompare(b)
        );


    select.innerHTML =
        `<option value="ALL">
            All Backends
        </option>`;


    names.forEach(
        name => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                name;

            option.textContent =
                name;

            select.appendChild(
                option
            );

        }
    );


    if(
        names.includes(current)
    ){

        select.value =
            current;

    }

}


/* =========================================================
   RENDER TABLE
========================================================= */

function renderTable(){

    const head =
        document.getElementById(
            "tableHead"
        );

    const body =
        document.getElementById(
            "tableBody"
        );


    const search =
        document.getElementById(
            "search"
        )
        .value
        .trim()
        .toLowerCase();


    const statusFilter =
        document.getElementById(
            "statusFilter"
        )
        .value;


    const backendFilter =
        document.getElementById(
            "backendFilter"
        )
        .value;


    head.innerHTML = "";

    body.innerHTML = "";


    /*
        Header
    */

    const trHead =
        document.createElement(
            "tr"
        );


    columns.forEach(
        column => {

            const th =
                document.createElement(
                    "th"
                );

            th.textContent =
                column;

            th.title =
                column;

            trHead.appendChild(
                th
            );

        }
    );


    head.appendChild(
        trHead
    );


    /*
        Filter records
    */

    const filtered =
        mapData
            .map(
                (row,index) => ({
                    row,
                    index
                })
            )
            .filter(
                item => {

                    const row =
                        item.row;


                    if(
                        statusFilter !== "ALL"
                    ){

                        const status =
                            String(
                                row.Status ||
                                "UNKNOWN"
                            )
                            .toUpperCase();


                        if(
                            status !==
                            statusFilter
                        ){

                            return false;

                        }

                    }


                    if(
                        backendFilter !==
                        "ALL"
                    ){

                        if(
                            String(
                                row["Backends Sheet"] ||
                                ""
                            ) !==
                            backendFilter
                        ){

                            return false;

                        }

                    }


                    if(search){

                        const searchable =
                            Object.values(row)
                                .join(" ")
                                .toLowerCase();


                        if(
                            !searchable.includes(
                                search
                            )
                        ){

                            return false;

                        }

                    }


                    return true;

                }
            );


    /*
        Rows
    */

    filtered.forEach(
        item => {

            const row =
                item.row;

            const originalIndex =
                item.index;


            const tr =
                document.createElement(
                    "tr"
                );


            if(
                selectedIndex ===
                originalIndex
            ){

                tr.classList.add(
                    "selected"
                );

            }


            tr.onclick =
                function(){

                    selectRow(
                        originalIndex
                    );

                };


            columns.forEach(
                column => {

                    const td =
                        document.createElement(
                            "td"
                        );


                    const cell =
                        document.createElement(
                            "div"
                        );


                    cell.className =
                        "cell";


                    cell.contentEditable =
                        "true";


                    cell.spellcheck =
                        false;


                    const value =
                        row[column] ?? "";


                    cell.innerHTML =
                        formatCell(
                            value,
                            column
                        );


                    /*
                        Save edits when leaving cell.
                    */

                    cell.addEventListener(
                        "blur",
                        function(){

                            const newValue =
                                cell.innerText.trim();


                            if(
                                String(
                                    mapData[
                                        originalIndex
                                    ][column] ??
                                    ""
                                ) !==
                                newValue
                            ){

                                mapData[
                                    originalIndex
                                ][column] =
                                    newValue;


                                saveLocalEdit(
                                    originalIndex,
                                    column,
                                    newValue
                                );


                                updateStats();

                                if(
                                    selectedIndex ===
                                    originalIndex
                                ){

                                    renderInspector(
                                        originalIndex
                                    );

                                }

                                showToast(
                                    "Local edit saved."
                                );

                            }

                        }
                    );


                    /*
                        Enter finishes editing.
                    */

                    cell.addEventListener(
                        "keydown",
                        function(event){

                            if(
                                event.key ===
                                "Enter"
                            ){

                                event.preventDefault();

                                cell.blur();

                            }

                        }
                    );


                    /*
                        Prevent row selection
                        when editing.
                    */

                    cell.addEventListener(
                        "click",
                        function(event){

                            event.stopPropagation();

                        }
                    );


                    td.appendChild(
                        cell
                    );


                    tr.appendChild(
                        td
                    );

                }
            );


            body.appendChild(
                tr
            );

        }
    );


    if(
        filtered.length === 0
    ){

        body.innerHTML = `

            <tr>

                <td colspan="${columns.length}">

                    <div class="emptyState">

                        <strong>
                            No matching records
                        </strong>

                        Change your filters or search.

                    </div>

                </td>

            </tr>

        `;

    }

}


/* =========================================================
   CELL FORMAT
========================================================= */

function formatCell(
    value,
    column
){

    const text =
        String(
            value ?? ""
        );


    if(!text){

        return `<span class="empty">empty</span>`;

    }


    /*
        Status
    */

    if(
        column === "Status"
    ){

        const status =
            text.toUpperCase();


        if(
            status === "ONLINE"
        ){

            return `
                <span class="status online">
                    ONLINE
                </span>
            `;

        }


        if(
            status === "OFFLINE"
        ){

            return `
                <span class="status offline">
                    OFFLINE
                </span>
            `;

        }


        return `
            <span class="status unknown">
                ${escapeHTML(text)}
            </span>
        `;

    }


    /*
        URLs
    */

    if(
        isURL(text)
    ){

        return `
            <a
                class="url"
                href="${escapeAttribute(text)}"
                target="_blank"
                rel="noopener noreferrer"
                onclick="event.stopPropagation()"
            >
                ${escapeHTML(shortURL(text))}
            </a>
        `;

    }


    return escapeHTML(text);

}


/* =========================================================
   SELECT ROW
========================================================= */

function selectRow(index){

    selectedIndex =
        index;


    renderTable();

    renderInspector(
        index
    );

}


/* =========================================================
   INSPECTOR
========================================================= */

function renderInspector(index){

    const row =
        mapData[index];


    if(!row){

        return;

    }


    document.getElementById(
        "inspectorTitle"
    ).textContent =
        row["Backends Sheet"] ||
        row["MAIN HTML FRONTEND"] ||
        "MAP Record";


    document.getElementById(
        "inspectorSub"
    ).textContent =
        "Record ID: " +
        (
            row.ID ||
            index + 1
        );


    const body =
        document.getElementById(
            "detailBody"
        );


    body.innerHTML = "";


    /*
        Organize columns into useful groups.
    */

    const backendColumns =
        [
            "ID",
            "Backends Sheet",
            "Sheet",
            "Sheet API",
            "Status"
        ];


    const frontendColumns =
        [
            "MAIN HTML FRONTEND",
            "HTML FRONTEND 2",
            "HTML FRONTEND 3",
            "HTML FRONTEND 4",
            "HTML FRONTEND 5"
        ];


    const externalColumns =
        [
            "EXTERNAL",
            "EXTERNAL API",
            "EXTERNAL API 2"
        ];


    createInspectorGroup(
        body,
        "Backend",
        backendColumns,
        row
    );


    createInspectorGroup(
        body,
        "Frontend",
        frontendColumns,
        row
    );


    createInspectorGroup(
        body,
        "External Connections",
        externalColumns,
        row
    );


    /*
        Any unexpected columns.
    */

    const known =
        new Set(
            [
                ...backendColumns,
                ...frontendColumns,
                ...externalColumns
            ]
        );


    const otherColumns =
        columns.filter(
            column =>
                !known.has(column)
        );


    if(
        otherColumns.length
    ){

        createInspectorGroup(
            body,
            "Other Data",
            otherColumns,
            row
        );

    }

}


/* =========================================================
   INSPECTOR GROUP
========================================================= */

function createInspectorGroup(
    parent,
    title,
    groupColumns,
    row
){

    const existing =
        groupColumns.filter(
            column =>
                columns.includes(column)
        );


    if(
        existing.length === 0
    ){

        return;

    }


    const group =
        document.createElement(
            "div"
        );


    group.className =
        "detailGroup";


    const heading =
        document.createElement(
            "h3"
        );


    heading.textContent =
        title;


    group.appendChild(
        heading
    );


    existing.forEach(
        column => {

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "detailCard";


            const label =
                document.createElement(
                    "div"
                );


            label.className =
                "detailLabel";


            label.textContent =
                column;


            card.appendChild(
                label
            );


            const value =
                document.createElement(
                    "div"
                );


            value.className =
                "detailValue";


            const raw =
                String(
                    row[column] ??
                    ""
                );


            if(
                isURL(raw)
            ){

                value.innerHTML = `

                    <a
                        href="${escapeAttribute(raw)}"
                        target="_blank"
                        rel="noopener noreferrer"
                    >
                        ${escapeHTML(raw)}
                    </a>

                `;

            }
            else{

                value.textContent =
                    raw ||
                    "empty";

            }


            card.appendChild(
                value
            );


            /*
                Actions for useful cells.
            */

            if(raw){

                const actions =
                    document.createElement(
                        "div"
                    );


                actions.className =
                    "detailActions";


                const copy =
                    document.createElement(
                        "button"
                    );


                copy.className =
                    "btn small";


                copy.textContent =
                    "Copy";


                copy.onclick =
                    function(){

                        copyText(
                            raw
                        );

                    };


                actions.appendChild(
                    copy
                );


                if(
                    isURL(raw)
                ){

                    const open =
                        document.createElement(
                            "button"
                        );


                    open.className =
                        "btn small";


                    open.textContent =
                        "Open";


                    open.onclick =
                        function(){

                            window.open(
                                raw,
                                "_blank",
                                "noopener"
                            );

                        };


                    actions.appendChild(
                        open
                    );

                }


                card.appendChild(
                    actions
                );

            }


            group.appendChild(
                card
            );

        }
    );


    parent.appendChild(
        group
    );

}


/* =========================================================
   CLOSE INSPECTOR
========================================================= */

function closeInspector(){

    selectedIndex =
        null;


    document.getElementById(
        "inspectorTitle"
    ).textContent =
        "Select a row";


    document.getElementById(
        "inspectorSub"
    ).textContent =
        "Click any row to inspect the complete infrastructure record.";


    document.getElementById(
        "detailBody"
    ).innerHTML = `

        <div class="emptyState">

            <strong>
                No record selected
            </strong>

            Select a row from the MAP table.

        </div>

    `;


    renderTable();

}


/* =========================================================
   STATISTICS
========================================================= */

function updateStats(){

    const rows =
        mapData;


    let online =
        0;

    let offline =
        0;

    let urls =
        0;


    rows.forEach(
        row => {

            const status =
                String(
                    row.Status ||
                    ""
                ).toUpperCase();


            if(
                status === "ONLINE"
            ){

                online++;

            }


            if(
                status === "OFFLINE"
            ){

                offline++;

            }


            Object.values(row)
                .forEach(
                    value => {

                        if(
                            isURL(
                                String(
                                    value ??
                                    ""
                                )
                            )
                        ){

                            urls++;

                        }

                    }
                );

        }
    );


    document.getElementById(
        "rowCount"
    ).textContent =
        rows.length;


    document.getElementById(
        "onlineCount"
    ).textContent =
        online;


    document.getElementById(
        "offlineCount"
    ).textContent =
        offline;


    document.getElementById(
        "urlCount"
    ).textContent =
        urls;

}


/* =========================================================
   SEARCH / FILTER RESET
========================================================= */

function resetFilters(){

    document.getElementById(
        "search"
    ).value = "";


    document.getElementById(
        "statusFilter"
    ).value =
        "ALL";


    document.getElementById(
        "backendFilter"
    ).value =
        "ALL";


    renderTable();

}


/* =========================================================
   LOCAL EDIT STORAGE
========================================================= */

function loadLocalEdits(){

    try{

        return JSON.parse(
            localStorage.getItem(
                STORAGE_KEY
            ) || "{}"
        );

    }
    catch{

        return {};

    }

}


function saveLocalEdit(
    rowIndex,
    column,
    value
){

    if(
        !localEdits[rowIndex]
    ){

        localEdits[rowIndex] =
            {};

    }


    localEdits[rowIndex][column] =
        value;


    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(
            localEdits
        )
    );

}


function applyLocalEdits(){

    Object.keys(
        localEdits
    ).forEach(
        rowIndex => {

            const index =
                Number(
                    rowIndex
                );


            if(
                !mapData[index]
            ){

                return;

            }


            Object.entries(
                localEdits[rowIndex]
            ).forEach(
                ([column,value]) => {

                    mapData[index][column] =
                        value;

                }
            );

        }
    );

}


function clearLocalEdits(){

    const confirmed =
        confirm(
            "Clear all locally saved MAP edits?"
        );


    if(!confirmed){

        return;

    }


    localStorage.removeItem(
        STORAGE_KEY
    );


    localEdits =
        {};


    loadData();

}


/* =========================================================
   EXPORT JSON
========================================================= */

function exportJSON(){

    const output = {

        success:true,

        sheet:"MAP",

        generated:
            new Date().toISOString(),

        count:
            mapData.length,

        rows:
            mapData

    };


    downloadFile(
        JSON.stringify(
            output,
            null,
            2
        ),
        "obvyris-map-export.json",
        "application/json"
    );


    showToast(
        "JSON exported."
    );

}


/* =========================================================
   EXPORT CSV
========================================================= */

function exportCSV(){

    if(
        !mapData.length
    ){

        return;

    }


    const header =
        columns
            .map(
                csvEscape
            )
            .join(",");


    const rows =
        mapData.map(
            row => {

                return columns
                    .map(
                        column =>
                            csvEscape(
                                row[column] ??
                                ""
                            )
                    )
                    .join(",");

            }
        );


    const csv =
        [
            header,
            ...rows
        ]
        .join("\n");


    downloadFile(
        csv,
        "obvyris-map-export.csv",
        "text/csv"
    );


    showToast(
        "CSV exported."
    );

}


/* =========================================================
   DOWNLOAD
========================================================= */

function downloadFile(
    content,
    filename,
    type
){

    const blob =
        new Blob(
            [content],
            {
                type
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href =
        url;


    link.download =
        filename;


    document.body.appendChild(
        link
    );


    link.click();


    link.remove();


    URL.revokeObjectURL(
        url
    );

}


/* =========================================================
   CSV ESCAPE
========================================================= */

function csvEscape(value){

    const text =
        String(
            value ?? ""
        );


    if(
        /[",\n]/.test(text)
    ){

        return '"' +
            text.replace(
                /"/g,
                '""'
            ) +
            '"';

    }


    return text;

}


/* =========================================================
   URL HELPERS
========================================================= */

function isURL(value){

    return /^https?:\/\/\S+$/i.test(
        value.trim()
    );

}


function shortURL(url){

    try{

        const parsed =
            new URL(url);


        let result =
            parsed.hostname;


        if(
            parsed.pathname &&
            parsed.pathname !== "/"
        ){

            result +=
                parsed.pathname;

        }


        if(
            result.length > 55
        ){

            result =
                result.substring(
                    0,
                    52
                ) +
                "...";

        }


        return result;

    }
    catch{

        return url;

    }

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function escapeAttribute(value){

    return escapeHTML(
        value
    );

}


/* =========================================================
   COPY
========================================================= */

async function copyText(
    text
){

    try{

        await navigator.clipboard.writeText(
            text
        );


        showToast(
            "Copied to clipboard."
        );

    }
    catch{

        showToast(
            "Clipboard access unavailable."
        );

    }

}


/* =========================================================
   LOADING
========================================================= */

function showLoading(
    visible
){

    const element =
        document.getElementById(
            "loading"
        );


    element.classList.toggle(
        "show",
        visible
    );

}


/* =========================================================
   TOAST
========================================================= */

let toastTimer;


function showToast(
    message
){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function(){

                toast.classList.remove(
                    "show"
                );

            },
            2500
        );

}


/* =========================================================
   KEYBOARD SHORTCUTS
========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        /*
            CTRL + F focuses search.
        */

        if(
            event.ctrlKey &&
            event.key.toLowerCase() === "f"
        ){

            event.preventDefault();

            document.getElementById(
                "search"
            ).focus();

        }


        /*
            ESC closes inspector.
        */

        if(
            event.key === "Escape"
        ){

            closeInspector();

        }

    }
);

</script>
