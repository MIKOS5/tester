<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
   
<title>Video Obvyris</title>

<link rel="icon" type="image/png" href="https://mikos5.github.io/tester/navicon.png">
<link rel="apple-touch-icon" href="https://mikos5.github.io/tester/navicon.png">
   
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet"/>
   
<style>

/* =========================
   🎨 DESIGN SYSTEM
========================= */

:root{

  --bg:#09111d;
  --panel:#111827;
  --border:#253347;

  --blue:#2793ff;
  --blue-dark:#1869d9;

  --text:#ffffff;
  --muted:#93a4bb;

}


/* =========================
   BASE
========================= */

*{
  box-sizing:border-box;
}

body{

  margin:0;

  display:flex;

  height:100vh;

  overflow:hidden;

  font-family:Inter,Arial,sans-serif;

  background:var(--bg);

  color:var(--text);

  user-select:none;
  -webkit-user-select:none;

}


/* =========================
   MAIN PLAYER
========================= */

#main{

  flex:1;

  height:100vh;

  display:flex;

  flex-direction:column;

  overflow:hidden;

}


video{

  width:100%;

  max-height:65vh;

  background:#000;

  border-bottom:1px solid var(--border);

}



/* =========================
   PLAYER BAR
========================= */


#bar{

  background:var(--panel);

  border-top:1px solid var(--border);

  border-bottom:1px solid var(--border);

  padding:8px;

  display:flex;

  flex-direction:column;

  align-items:center;

  gap:6px;

}



/* STATION INFO */

#stationInfo{

  width:100%;

  display:flex;

  justify-content:center;

  align-items:center;

  gap:10px;

}


#activeLogo{

  width:55px;

  height:40px;

  object-fit:contain;

  background:#111;

  border-radius:8px;

  border:1px solid var(--border);

  flex-shrink:0;

}



#now{

  font-size:16px;

  font-weight:800;

  max-width:400px;

  text-align:center;

  line-height:18px;

  overflow:hidden;

  display:-webkit-box;

  -webkit-line-clamp:2;

  -webkit-box-orient:vertical;

}



/* CONTROLS */


#controls{

  width:100%;

  display:flex;

  justify-content:center;

  align-items:center;

  gap:6px;

  flex-wrap:nowrap;

}



button{

  background:linear-gradient(
    180deg,
    var(--blue),
    var(--blue-dark)
  );

  border:none;

  color:white;

  padding:8px 10px;

  border-radius:10px;

  font-weight:700;

  cursor:pointer;

}


#controls button{

  width:38px;

  height:38px;

  padding:0;

  font-size:16px;

  flex-shrink:0;

}



#volumeSlider{

  width:80px;

}



/* =========================
   SIDEBAR
========================= */


#sidebar{

  width:180px;

  height:100vh;

  background:var(--panel);

  border-right:1px solid var(--border);

  display:flex;

  flex-direction:column;

  overflow-y:auto;

  flex-shrink:0;

}



.logo{

  font-family:Orbitron;

  font-size:21px;

  font-weight:900;

}


.logo span{

  color:var(--blue);

}



.subtitle{

  color:var(--muted);

  font-size:11px;

}



.brand{

  padding:8px;

}



.group{

  padding:6px;

  margin-bottom:6px;

  background:var(--bg);

  border:1px solid var(--border);

  border-radius:10px;

  cursor:pointer;

  font-size:11px;

}



.group:hover{

  border-color:var(--blue);

}



/* =========================
 SEARCH
========================= */


#search{

  width:100%;

  padding:10px;

  border:none;

  outline:none;

  background:var(--panel);

  color:white;

}



/* =========================
 CHANNEL LIST
========================= */


#list{

  flex:1;

  overflow-y:auto;

  background:var(--bg);

}



.card{

  display:flex;

  align-items:center;

  gap:12px;

  padding:12px;

  border-bottom:1px solid var(--border);

}



.card small{

  color:var(--muted);

}



.logoImg{

  width:70px;

  height:40px;

  object-fit:contain;

  border-radius:6px;

  background:#111;

}



/* =========================
 CHAT
========================= */


#chatFloatBtn{

  position:fixed;

  bottom:20px;

  right:20px;

  width:55px;

  height:55px;

  border-radius:50%;

  font-size:22px;

  z-index:99999;

}



.chat-popup{

  position:fixed;

  bottom:90px;

  right:20px;

  width:320px;

  height:420px;

  background:var(--panel);

  border:1px solid var(--border);

  border-radius:14px;

  display:flex;

  flex-direction:column;

  z-index:99999;

}



.chat-popup.hidden{

  display:none;

}



/* =========================
 FULLSCREEN
========================= */


video:fullscreen{

  width:100vw;

  height:100vh;

  background:black;

  object-fit:contain;

}



/* =========================
 ANDROID FIX
========================= */


@media(max-width:600px){


body{

  height:100dvh;

}



#sidebar{

  width:120px;

}



#bar{

  padding:4px;

  gap:3px;

}



#activeLogo{

  width:32px;

  height:28px;

}



#now{

  font-size:11px;

  line-height:13px;

  max-width:calc(100vw - 60px);

}



#controls{

  gap:2px;

}



#controls button{

  width:30px;

  height:30px;

  font-size:13px;

}



#volumeSlider{

  width:45px;

}



}



/* =========================
 SMALL ANDROID
========================= */


@media(max-width:360px){


#sidebar{

  width:100px;

}



#controls button{

  width:27px;

  height:27px;

  font-size:12px;

}



#volumeSlider{

  width:35px;

}



}


/* SCROLLBAR */

*::-webkit-scrollbar{

  width:8px;

}


*::-webkit-scrollbar-thumb{

  background:var(--border);

  border-radius:20px;

}


button:disabled{

  opacity:.4;

  filter:grayscale(100%);

}


</style>
</head>

<body>

<!-- LEFT SIDEBAR -->
<div id="sidebar">
   <div class="brand" onclick="toggleAppMenu()">

  <div class="logo">
    Video <span>Obvyris</span>
  </div>

  <div class="subtitle">
    Live TV stations
  </div>

</div>


<div id="appMenu" class="app-menu">

  <div onclick="navigateApp('index99.html')">

  </div>

  <div onclick="navigateApp('Video_Obvyris.html')">
    📺 Video Obvyris
  </div>

  <div onclick="navigateApp('Radio_Obvyris.html')">
    📻 Radio Obvyris
  </div>

  <div onclick="navigateApp('newschat.html')">

  </div>

</div>

  <input id="search" placeholder="Search..." oninput="applyFilters()"/>
  <div id="sourceList">

<div class="group" onclick="load()">
📺 Live Streams
</div>

<div class="group" onclick="loadStation()">
🎬 Video Obvyris TV
</div>

</div>

<div id="groupList"></div>

<div id="countryList"></div>

<div id="cityList"></div>

</div>

<!-- MAIN -->
<div id="main">

  <video 
 id="video"
 playsinline
 autoplay>
</video>

<div id="bar">

  <div id="stationInfo">

      <img 
      id="activeLogo"
      src="navicon.png"
      onerror="this.src='navicon.png'"
      >

      <div id="now">
        Loading...
      </div>

  </div>


  <div id="controls">

<button onclick="prev()">⏮</button>

<button id="playBtn" onclick="toggle()">⏯</button>

<button onclick="next()">⏭</button>

<button id="muteBtn" onclick="toggleMute()">🔇</button>

<input
 id="volumeSlider"
 type="range"
 min="0"
 max="100"
 value="100"
 oninput="setVolume(this.value)"
>

<button onclick="fullscreenPlayer()">⛶</button>

<button onclick="reportBadLink()">🚩</button>


</div>

  <div id="list"></div>

</div>

<!-- 💬 CHAT UI -->
<button id="chatFloatBtn" onclick="toggleChat()">💬</button>

<div id="chatPopup" class="chat-popup hidden">
  <div class="chat-popup-header">
    <span>💬 Chat</span>
    <button onclick="toggleChat()">✖</button>
  </div>

  <div id="chatLog" class="chat-popup-log"></div>

  <div class="chat-input">
    <input id="chatName" placeholder="name" maxlength="8"/>
    <input id="chatMsg" placeholder="message" maxlength="100"/>
    <button onclick="sendChat()">Send</button>
  </div>
</div>

<script>

const STREAM_API =
"https://script.google.com/macros/s/AKfycbynB1gx8xRVH4cNtulKZv3Kr5CUyV7rATcZgyCJ73JStoxOw0meB6vqCV3AkIAUMkqZ/exec";

const STATION_API =
"https://script.google.com/macros/s/AKfycbyasf7oke6ZAhjgD-j2HGcR9bBysso2M9RuUuOgXZUQ7UkQ6CAOMV4PfGM3ViLUz6bygg/exec";

const video = document.getElementById("video");
video.volume = 1;
document.getElementById("volumeSlider").value = 100;
   
let list=[];
let filtered=[];
let index=0;

let currentSource="";

let currentStationURL = "";
let stationWatcher = null;
let stationMode = false;
let streamList=[];
let renderIndex=0;
const CHUNK=120;

/* CHAT API */
const API_URL = "https://script.google.com/macros/s/AKfycbzin84qDcZ9L1q4pTBtHZGKJSTDcZ_wnmgWmnmgPgf1jrc1nRprzbEBixKMSHcdkxiZBg/exec";

let chatOpen=false;
let chatData=[];

/* ROOM ID (video stream based) */
function getRoom(){

  const stream = filtered[index];

  return stream?.url || "global-video";

}

/* TOGGLE CHAT */
function toggleChat(){
  const box=document.getElementById("chatPopup");
  chatOpen=!chatOpen;
  box.classList.toggle("hidden");
  if(chatOpen) loadChat();
}

/* LOAD CHAT */
async function loadChat(){
  const res=await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({
      action:"get",
      station:getRoom()
    })
  });

  const data=await res.json();
  chatData=Array.isArray(data)?data:[];
  renderChat();

  const title = document.querySelector(".chat-popup-header span");
  title.innerText = "💬 " + (document.getElementById("now").innerText || getRoom());
}

/* SEND CHAT */
async function sendChat(){
  let name=document.getElementById("chatName").value||"Anon";
  let msg=document.getElementById("chatMsg").value;

  if(!msg) return;

  name=name.trim().slice(0,8);
  msg=msg.trim().slice(0,100);

  document.getElementById("chatMsg").value="";

  const station = getRoom();
  const stationName = document.getElementById("now").innerText || station;

  await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({
      action:"send",
      station,
      stationName,   // ✅ THIS is what you were missing
      name,
      message:msg
    })
  });

  loadChat();
}

/* RENDER CHAT */
function renderChat(){
  const box=document.getElementById("chatLog");
  box.innerHTML="";

  const welcome={
    system:true,
    name:"System",
    message:`Chat for ${getRoom()}`
  };

  [welcome,...chatData].forEach(m=>{
    box.innerHTML+=`
      <div class="chat-msg" style="${m.system?"opacity:0.6;text-align:center;":""}">
        <span class="chat-name">${m.system?"":m.name+": "}</span>
        ${m.message}
      </div>
    `;
  });

  box.scrollTop=box.scrollHeight;
}

/* AUTO REFRESH */
setInterval(()=>{
  if(chatOpen && document.visibilityState==="visible"){
    loadChat();
  }
},3000);

/* =========================
   ORIGINAL VIDEO CODE (UNCHANGED)
========================= */

async function load(){

    document.getElementById("list").innerHTML =
    `<div class="card">Connecting to Video API...</div>`;


    try {

        console.log("API:", STREAM_API);


        const response = await fetch(STREAM_API, {
            method:"GET",
            redirect:"follow"
        });


        console.log("HTTP STATUS:", response.status);


        const text = await response.text();


        console.log("RAW API:", text.substring(0,500));


        const data = JSON.parse(text);


        console.log("JSON DATA:", data);



        if(!data.streams){
            throw new Error("No streams array found");
        }



        streamList = data.streams
        .filter(s=>{

            return (
                s.status &&
                s.status.toUpperCase()==="ONLINE" &&
                s.url
            );

        })
        .map(s=>({

    name:String(s.name || "Unknown"),

    group:String(s.group || "Other"),

    country:String(s.country || "Unknown"),

    city:String(s.language || "Unknown"),

    url:String(s.url || ""),

    logo:String(s.logo || "")

}))
.filter(s=>s.url);



        streamList.sort((a,b)=>
    String(a.name || "")
    .localeCompare(
        String(b.name || "")
    )
);



        list=[...streamList];


        console.log(
            "ONLINE CHANNELS:",
            list.length
        );


        buildGroups();

buildCountries();

buildCities();

filtered=[...list];

render(true);



        document.getElementById("now").innerText =
        list.length+" Channels Loaded";


    }
    catch(err){

        console.error(
            "VIDEO API ERROR:",
            err
        );


        document.getElementById("list").innerHTML =
        `
        <div class="card">
        ❌ API ERROR<br>
        ${err.message}
        </div>
        `;

    }

}


function setVolume(value){

    video.volume = value / 100;

    if(video.volume === 0){

        video.muted = true;

    }else{

        video.muted = false;

    }

    document.getElementById("muteBtn").innerText =
        video.muted ? "🔇" : "🔊";

}
   
function buildCities(){

    const citySet = new Set();

    list.forEach(s=>{

        if(s.city && s.city !== "Unknown"){

            citySet.add(s.city.trim());

        }

    });


    const cities=[...citySet].sort();


    const box=document.getElementById("cityList");

    box.innerHTML="";


    const all=document.createElement("div");

    all.className="group";
    all.textContent="🏙️ All Cities";

    all.onclick=()=>{

        filtered=[...list];
        render(true);

    };

    box.appendChild(all);



    cities.forEach(city=>{

        const d=document.createElement("div");

        d.className="group";
        d.textContent="🏙️ "+city;


        d.onclick=()=>{

            filtered=list.filter(s=>
                s.city === city
            );

            render(true);

        };


        box.appendChild(d);

    });

}

function toggleMute(){

    const video = document.getElementById("video");
    const btn = document.getElementById("muteBtn");

    video.muted = !video.muted;

    btn.innerText = video.muted ? "🔇" : "🔊";

}
   
function buildGroups(){

    const groupSet = new Set();

    list.forEach(s=>{

        s.group
        .split(";")
        .forEach(g=>{
            groupSet.add(g.trim());
        });

    });


    const groups=[...groupSet].sort((a,b)=>
    String(a).localeCompare(String(b))
);


    const box=document.getElementById("groupList");

    box.innerHTML="";


    const all=document.createElement("div");

    all.className="group";

    all.textContent="📺 All Channels";

    all.onclick=()=>{

        filtered=[...list];

        render(true);

    };

    box.appendChild(all);



    groups.forEach(g=>{

        const d=document.createElement("div");

        d.className="group";

        d.textContent="📂 "+g;


        d.onclick=()=>{


            filtered=list.filter(s=>

                s.group
                .split(";")
                .map(x=>x.trim())
                .includes(g)

            );


            filtered.sort((a,b)=>
                a.name.localeCompare(b.name)
            );


            render(true);

        };


        box.appendChild(d);

    });

}

function toggleAppMenu(){

  const menu=document.getElementById("appMenu");

  menu.classList.toggle("open");

}

async function loadStation(){

    try{

        console.log("Loading Video Obvyris TV");

        stationMode = true;


        // START STATION WATCHER
        if(stationWatcher){
            clearInterval(stationWatcher);
        }

        stationWatcher = setInterval(
            checkStationUpdate,
            5000
        );


        video.controls = false;

        document.getElementById("playBtn").disabled = true;


        // destroy live HLS
        if(window.hls){

            window.hls.destroy();
            window.hls = null;

        }


        const response = await fetch(
            STATION_API + "?action=now&t=" + Date.now()
        );


        const data = await response.json();


        console.log("STATION DATA:", data);



        if(!data.url){

            throw new Error(
                "No video URL returned"
            );

        }



        // clear previous handlers
        video.onloadedmetadata = null;


        video.pause();

        video.removeAttribute("src");

        video.load();



        currentStationURL = data.url;

        video.src = data.url;



        // station mode always starts muted
        video.muted = true;

        document.getElementById("muteBtn").innerText="🔇";



        video.onloadedmetadata = ()=>{


            if(data.seek){

                video.currentTime =
                Number(data.seek);

            }


            video.play()
            .catch(err=>{
                console.log(
                    "Autoplay blocked",
                    err
                );
            });


        };



        document.getElementById("now").innerText =
        data.program || "Video Obvyris TV";


        // Set Video Obvyris TV logo
        const activeLogo = document.getElementById("activeLogo");

        activeLogo.src =
        "https://mikos5.github.io/tester/navicon.png";


        activeLogo.onerror = function(){

            this.src =
            "https://mikos5.github.io/tester/navicon.png";

        };


    }
    catch(err){

        console.error(
            "Station Load Error:",
            err
        );


        document.getElementById("now").innerText =
        "Station Error";

    }

}


function navigateApp(page){

  window.location.href="./"+page;

}


// close dropdown when clicking outside
document.addEventListener("click",function(e){

  const menu=document.getElementById("appMenu");
  const brand=document.querySelector(".brand");


  if(menu && brand && !brand.contains(e.target)){

    menu.classList.remove("open");

  }

});
   
function applyFilters(){

  const q=document
  .getElementById("search")
  .value
  .toLowerCase();


  filtered=list.filter(s=>

    s.name.toLowerCase().includes(q) ||

    s.group.toLowerCase().includes(q) ||

    s.country.toLowerCase().includes(q) ||

    s.city.toLowerCase().includes(q)

);


  filtered.sort((a,b)=>
      a.name.localeCompare(b.name)
  );


  render(true);

}

function fullscreenPlayer(){

  const video=document.getElementById("video");

  if(video.requestFullscreen){
    video.requestFullscreen();
  }
  else if(video.webkitRequestFullscreen){
    video.webkitRequestFullscreen();
  }
  else if(video.msRequestFullscreen){
    video.msRequestFullscreen();
  }

}
   
function render(reset){
  const el=document.getElementById("list");

  if(reset){
    el.innerHTML="";
    renderIndex=0;
  }

  const slice=filtered.slice(renderIndex,renderIndex+CHUNK);

  slice.forEach((s,i)=>{
    const real=renderIndex+i;

    el.innerHTML+=`
<div class="card" onclick="play(${real})">

    <img 
    src="${s.logo || 'navicon.png'}"
    class="logoImg"
    onerror="this.src='navicon.png'"
    >

    <div>

        <b>${s.name}</b><br>

        <small>
📂 ${s.group}<br>
🌎 ${s.country}<br>
🏙️ ${s.city}
</small>

    </div>

</div>
`;
  });

  renderIndex+=CHUNK;
}

document.getElementById("list").onscroll=(e)=>{
  if(e.target.scrollTop+e.target.clientHeight>=e.target.scrollHeight-100){
    render(false);
  }
};

function playMedia(url){
  const v=document.getElementById("video");

  v.pause();
  v.removeAttribute("src");
  v.load();

  if(window.Hls && Hls.isSupported()){

    if(window.hls){
      window.hls.destroy();
    }

    window.hls = new Hls({
      enableWorker:true,

      // buffer settings
      maxBufferLength:30,
      maxMaxBufferLength:60,
      maxBufferSize:60 * 1000 * 1000,

      // faster recovery
      liveSyncDurationCount:3,
      liveMaxLatencyDurationCount:5,

      // reduce stalls
      fragLoadingTimeOut:20000,
      manifestLoadingTimeOut:20000,
      levelLoadingTimeOut:20000
    });


    window.hls.on(Hls.Events.ERROR,(event,data)=>{

      console.log("HLS ERROR:",data);

      if(data.fatal){

        switch(data.type){

          case Hls.ErrorTypes.NETWORK_ERROR:
            console.log("Retrying network...");
            window.hls.startLoad();
            break;


          case Hls.ErrorTypes.MEDIA_ERROR:
            console.log("Recovering media...");
            window.hls.recoverMediaError();
            break;


          default:
            window.hls.destroy();
            break;
        }

      }

    });


    window.hls.loadSource(url);
    window.hls.attachMedia(v);


    window.hls.on(Hls.Events.MANIFEST_PARSED,()=>{
      v.play().catch(e=>console.log(e));
    });


  }else{

    // Safari native HLS
    v.src=url;
    v.play();

  }
}

function play(i){

    // Exit station mode
    stationMode=false;

    // Stop Video Obvyris TV watcher
    if(stationWatcher){
        clearInterval(stationWatcher);
        stationWatcher=null;
    }

    currentStationURL = "";

    video.controls=true;

    document.getElementById("playBtn").disabled=false;

    index = i;

    const s = filtered[i];

    if(!s) return;


    // Update station name
    document.getElementById("now").innerText = s.name;


    // Update station logo
    const activeLogo = document.getElementById("activeLogo");

    if(s.logo && s.logo.trim() !== ""){

        activeLogo.src = s.logo;

    }else{

        activeLogo.src =
        "https://mikos5.github.io/tester/navicon.png";

    }


    // Fallback logo
    activeLogo.onerror = function(){

        this.src =
        "https://mikos5.github.io/tester/navicon.png";

    };


    // Start live stream
    playMedia(s.url);


    // Refresh chat for new station
    if(chatOpen){

        loadChat();

    }

}
   
function next(){
  index=(index+1)%filtered.length;
  play(index);
}

function prev(){
  index=(index-1+filtered.length)%filtered.length;
  play(index);
}

function buildCountries(){

    const countrySet = new Set();

    list.forEach(s=>{

        if(s.country && s.country !== "Unknown"){

            countrySet.add(
                s.country.trim()
            );

        }

    });


    const countries=[...countrySet].sort((a,b)=>
        a.localeCompare(b)
    );


    const box=document.getElementById("countryList");

    box.innerHTML="";


    const all=document.createElement("div");

    all.className="group";

    all.textContent="🌎 All Countries";

    all.onclick=()=>{

        filtered=[...list];

        render(true);

    };

    box.appendChild(all);



    countries.forEach(country=>{

        const d=document.createElement("div");

        d.className="group";

        d.textContent="🌎 "+country;


        d.onclick=()=>{


            filtered=list.filter(s=>

                s.country === country

            );


            filtered.sort((a,b)=>
                a.name.localeCompare(b.name)
            );


            render(true);

        };


        box.appendChild(d);


    });


}
   
function toggle(){

    // Live TV stations cannot be paused
    if(stationMode){
        return;
    }

    if(video.paused){

        video.play();

    }else{

        video.pause();

    }

}

async function reportBadLink(){

    const stream = filtered[index] || list[index];

    console.log("REPORT CLICKED", stream);

    if(!stream){
        alert("No channel selected");
        return;
    }


    if(!confirm(
        "Report this stream as broken?\n\n" +
        stream.name
    )){
        return;
    }


    try{

        const result = await fetch(STREAM_API,{
    method:"POST",
    body:JSON.stringify({
        action:"badLink",
        url:stream.url,
        name:stream.name
    })
});


        const text = await result.text();

        console.log(
            "BAD LINK RAW RESPONSE:",
            text
        );


        alert("Reported. Thank you.");

    }
    catch(err){

        console.error(
            "REPORT ERROR:",
            err
        );

        alert(
            "Report failed: " + err.message
        );

    }

}

async function checkStationUpdate(){

    if(!stationMode) return;

    try{

        const response = await fetch(
            STATION_API + "?action=now&t=" + Date.now()
        );

        const data = await response.json();


        if(!data.url) return;


        // Backend moved to next video
        if(data.url !== currentStationURL){

            console.log(
                "NEW VIDEO DETECTED",
                data.url
            );


            currentStationURL = data.url;


            video.pause();

            video.src = data.url;

            video.load();


            video.onloadedmetadata = ()=>{

                if(data.seek){

                    video.currentTime =
                    Number(data.seek);

                }


                video.play()
                .catch(e=>console.log(e));

            };


            document.getElementById("now").innerText =
            data.program || "Video Obvyris TV";

        }


    }
    catch(err){

        console.log(
            "Station watcher error:",
            err
        );

    }

}

// Anti DevTools detection
setInterval(()=>{

    if(
      window.outerWidth - window.innerWidth > 160 ||
      window.outerHeight - window.innerHeight > 160
    ){

        document.body.innerHTML =
        "<h2 style='color:white;background:black;text-align:center'>Developer tools detected</h2>";

    }

},1000);


load();

// Disable right click
document.addEventListener("contextmenu", function(e){
    e.preventDefault();
});

document.addEventListener("keydown", function(e){

    // F12
    if(e.key === "F12"){
        e.preventDefault();
    }

    // Ctrl + Shift + I (DevTools)
    if(
        e.ctrlKey &&
        e.shiftKey &&
        (e.key === "I" || e.key === "J" || e.key === "C")
    ){
        e.preventDefault();
    }

    // Ctrl + U (view source)
    if(e.ctrlKey && e.key === "u"){
        e.preventDefault();
    }

});
