const RENDER_CHUNK = 50;

/* API */

const GENRES = [

  { id:"News", label:"📰 News" },

  { id:"Sports", label:"⚽ Sports" },

  { id:"Movies", label:"🎬 Movies" },

  { id:"Entertainment", label:"📺 Entertainment" },

];

  function renderGenres(){

  const grid = document.getElementById("genreGrid");

  grid.innerHTML = GENRES.map(g => `
    <div class="genre" data-id="${g.id}">
      ${g.label}
    </div>
  `).join("");

  // prevent duplicate listeners
  if (!grid.dataset.bound) {
    grid.dataset.bound = "true";

    grid.addEventListener("click", (e) => {
      const item = e.target.closest(".genre");
      if (!item) return;

      document.querySelectorAll(".genre")
        .forEach(x => x.classList.remove("active"));

      item.classList.add("active");

      page = 0;
      currentGenre = id;
      load(id);
    });

  // actions panel
  const actions = document.getElementById("actionGrid");

  actions.innerHTML = `

}
/* =========================
   🔥 FIXED GENRE FUNCTION
========================= */
function getGenre(s){
  return (s.tags?.trim())
    || (s.genre?.trim())
    || "Genre not listed - Radio";
}

let minimized = false;

function toggleMinimize() {
  const bar = document.querySelector(".player-bar");
  minimized = !minimized;

  if (minimized) {
    bar.classList.add("minimized");
  } else {
    bar.classList.remove("minimized");
  }
}
  
function parseM3U(text){

    const lines = text.split("\n");

    const list = [];

    let item = null;

    for(const line of lines){

        if(line.startsWith("#EXTINF")){

            item = {};

            const name = line.split(",").pop();

            item.name = name.trim();

            const tagMatch = line.match(/group-title="([^"]+)"/);
            item.genre = tagMatch ? tagMatch[1] : "";

            const countryMatch = line.match(/tvg-country="([^"]+)"/);
            item.country = countryMatch ? countryMatch[1] : "";

        }

        else if(item && line.startsWith("http")){

            item.url = line.trim();

            item.id = item.name;

            list.push(item);

            item = null;
        }
    }

    return list;
}
  
/* LOAD */
async function load(){

  const res = await fetch(PLAYLIST);
  const text = await res.text();

  allChannels = parseM3U(text);

current = [...allChannels];

render();

  setTitle("📺 Live TV");
}

async function loadCountries(){
  const res = await fetch("https://all.api.radio-browser.info/json/countries");
  const data = await res.json();

  const select = document.getElementById("countryFilter");

  // keep "All Countries" first
  select.innerHTML = `
    <option value="">🌎 All Countries</option>
  `;

  // sort alphabetically
  data.sort((a,b) => a.name.localeCompare(b.name));

  for (let c of data){
    const opt = document.createElement("option");
    opt.value = c.name;
    opt.textContent = `${c.name} (${c.stationcount})`;
    select.appendChild(opt);
  }

  // ✅ set default AFTER loop
  select.value = currentCountry;
}

/* FAVORITE TOGGLE */
async function fav(s){

  const id = s.stationuuid || s.id;
  if(!id) return;

  const exists = favorites.has(id);

  if(exists){

    await fetch(SHEET,{
      method:"POST",
      body:new URLSearchParams({
        action:"delete",
        id:id
      })
    });

    favorites.delete(id);
    setTitle("Removed ⭐");
    render();
    return;
  }

  await fetch(SHEET,{
    method:"POST",
    body:new URLSearchParams({
      action:"save",
      id:id,
      name:s.name || "",
      url:s.url_resolved || s.url || "",
      country:s.country || "",
      genre:getGenre(s),
      time:new Date().toISOString()
    })
  });

  favorites.add(id);
  setTitle("Saved ⭐");
  render();
}

}


async function listenNowPlaying(streamUrl, callback){

    if(metadataAbort)
        metadataAbort.abort();

    metadataAbort = new AbortController();

    try{

        const response = await fetch(streamUrl,{
            headers:{
                "Icy-MetaData":"1"
            },
            signal:metadataAbort.signal
        });

        const metaInt =
            parseInt(response.headers.get("icy-metaint"));

        if(!metaInt)
            return;

        const reader = response.body.getReader();

        const decoder = new TextDecoder();

        while(true){

            // Skip audio bytes

            let remaining = metaInt;

            while(remaining>0){

                const {value,done}=await reader.read();

                if(done) return;

                remaining-=value.length;
            }

            // Metadata length

            const lenChunk=await reader.read();

            if(lenChunk.done) return;

            const metaLength=lenChunk.value[0]*16;

            if(metaLength===0)
                continue;

            let meta=new Uint8Array(metaLength);

            let offset=0;

            while(offset<metaLength){

                const chunk=await reader.read();

                if(chunk.done) return;

                meta.set(chunk.value.slice(0,metaLength-offset),offset);

                offset+=Math.min(
                    chunk.value.length,
                    metaLength-offset
                );
            }

            const text=decoder.decode(meta);

            const match=text.match(
                /StreamTitle='([^']*)'/
            );

            if(match){

                callback(match[1]);

            }

        }

    }catch(e){

        console.log("metadata stopped");

    }

}

function playMedia(url) {
  const audio = document.getElementById("audio");
  const video = document.getElementById("video");

  const isVideo =
    url.includes(".mp4") ||
    url.includes(".m3u8") ||
    url.includes("youtube");

  if (isVideo) {
    audio.pause();
    audio.src = "";

    video.style.display = "block";
    video.src = url;
    video.play();

  } else {
    video.pause();
    video.src = "";
    video.style.display = "none";

    audio.style.display = "block";
    audio.src = url;
    audio.play();
  }
}

function toggle() {
  const a = document.getElementById("audio");
  const v = document.getElementById("video");

  const isVideoVisible = v.style.display !== "none" && v.src;

  // 🎬 VIDEO MODE
  if (isVideoVisible) {
    if (v.paused) {
      v.play();
    } else {
      v.pause();
    }

    return;
  }

  // 🔊 AUDIO MODE
  if (a.paused) {
    a.play();

    if (playingIndex !== null) {
      const btn = document.getElementById(`playBtn-${playingIndex}`);
      if (btn) btn.innerText = "⏸ Pause";
    }

  } else {

    }
  }
}

function render(reset = true){

  const el = document.getElementById("list");

  const q =
    document.getElementById("searchBox")?.value
      .toLowerCase()
      .trim() || "";

  // STEP 1: filter
  renderedList = current.filter(s => {
    const text = `
      ${s.name || ""}
      ${getGenre(s)}
      ${s.country || ""}
    `.toLowerCase();

    return !q || text.includes(q);
  });

  window.filtered = renderedList;

  // STEP 2: reset render
  if (reset) {
    el.innerHTML = "";
    renderIndex = 0;
  }

  // STEP 3: render chunk
  const slice = renderedList.slice(renderIndex, renderIndex + RENDER_CHUNK);

  slice.forEach((s, i) => {
    const realIndex = renderIndex + i;

    el.innerHTML += `
      <div class="card">
        <div class="station">${s.name}</div>
        <div class="small">${getGenre(s)} • ${s.country || ""}</div>

        <div class="row">
          <button onclick="playById('${s.id}')">▶ Play</button>
        </div>
      </div>

  });

  renderIndex += RENDER_CHUNK;
}

document.addEventListener("keydown", (e) => {

  const tag = document.activeElement.tagName.toLowerCase();
  const isTyping = tag === "input" || tag === "textarea" || tag === "select";

  // Don't interfere while typing (except Esc and /)
  if (isTyping && e.key !== "Escape") return;

  switch (e.key.toLowerCase()) {

    // Playback
    case " ":
      e.preventDefault();
      toggle();
      break;

    case "arrowright":
    case "n":
      next();
      break;

    case "arrowleft":
    case "p":
      prev();
      break;

    // Search
    case "/":
    case "s":
      e.preventDefault();
      document.getElementById("searchBox").focus();
      break;

    // Favorites
    case "f":
      loadFavorites();
      break;

    // Escape
    case "escape":
      document.getElementById("searchBox").value = "";
      document.getElementById("searchBox").blur();
      render();
      break;

    // UI
    case "g":
      toggleGenres();
      break;

    case "a":
      showAll();
      break;

    case "m":
      loadMISC();
      break;

    case "i":
      loadInternational();
      break;

    case "c":
      document.getElementById("countryFilter").focus();
      break;

    case "home":
      scrollToTop();
      break;

    case "pagedown":
      nextPage();
      break;

    case "pageup":
      prevPage();
      break;

    // Help
    case "?":
      e.preventDefault();
      showKeyboardHelp();
      break;
  }
});
