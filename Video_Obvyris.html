<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Video Obvyris</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
/* =========================
   🎨 DESIGN SYSTEM THEME
========================= */

:root{
  --bg:#09111d;
  --panel:#111827;
  --border:#253347;

  --blue:#2793ff;
  --blue-dark:#1869d9;

  --green:#17c964;
  --green-dark:#0ea85a;

  --text:#ffffff;
  --muted:#93a4bb;
}

/* 🌙 DARK MODE BASE */
body{
  margin:0;
  display:flex;
  height:100vh;
  font-family:Inter, Arial, sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* =========================
   PLAYER + MAIN PANELS
========================= */

#main{
  flex:1;
  display:flex;
  flex-direction:column;
  background:var(--bg);
}

video{
  width:100%;
  background:#000;
  max-height:65vh;
  border-bottom:1px solid var(--border);
}

/* TOP BAR */
#bar{
  background:var(--panel);
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
  padding:10px;
  display:flex;
  gap:10px;
  align-items:center;
}

#now{
  color:var(--text);
  font-weight:700;
}

/* =========================
   SIDEBAR
========================= */

#sidebar{
  width:260px;
  background:var(--panel);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
}

.group{
  padding:9px;
  margin-bottom:6px;
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:10px;
  cursor:pointer;
  font-size:12px;
  color:var(--text);
  transition:.15s;
}

.group:hover{
  background:rgba(39,147,255,0.12);
  border-color:var(--blue);
}

.group:active{
  transform:scale(0.98);
}

/* =========================
   INPUT / SEARCH
========================= */

#search{
  width:100%;
  padding:10px;
  border:none;
  outline:none;
  background:var(--panel);
  color:var(--text);
  border-bottom:1px solid var(--border);
}

#search::placeholder{
  color:var(--muted);
}

/* =========================
   STATION LIST
========================= */

#list{
  flex:1;
  overflow:auto;
  background:var(--bg);
}

.card{
  padding:12px;
  border-bottom:1px solid var(--border);
  cursor:pointer;
  transition:.15s;
}

.card:hover{
  background:rgba(39,147,255,0.08);
}

.card b{
  color:var(--text);
}

.card small{
  color:var(--muted);
}

/* =========================
   BUTTONS
========================= */

button{
  background:linear-gradient(180deg,var(--blue),var(--blue-dark));
  border:none;
  color:white;
  padding:8px 10px;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
  transition:.15s;
}

button:hover{
  filter:brightness(1.1);
}

button:active{
  transform:scale(0.97);
}

/* =========================
   SCROLLBAR FIX (MATCH UI)
========================= */

*::-webkit-scrollbar{
  width:10px;
}

*::-webkit-scrollbar-track{
  background:var(--panel);
}

*::-webkit-scrollbar-thumb{
  background:var(--border);
  border-radius:999px;
  border:2px solid var(--panel);
}

*::-webkit-scrollbar-thumb:hover{
  background:var(--blue);
}

/* Firefox */
*{
  scrollbar-width:thin;
  scrollbar-color:var(--border) var(--panel);
}

/* =========================
   MOBILE CLEANUP
========================= */

@media(max-width:900px){
  #sidebar{
    width:200px;
  }
}
</style>
</head>

<body>

<!-- LEFT SIDEBAR -->
<div id="sidebar">
  <input id="search" placeholder="Search..." oninput="applyFilters()"/>
  <div id="groupList"></div>
</div>

<!-- MAIN -->
<div id="main">

  <video id="video" controls playsinline></video>

  <div id="bar">
    <div id="now">Loading...</div>
    <button onclick="prev()">⏮</button>
    <button onclick="toggle()">⏯</button>
    <button onclick="next()">⏭</button>
  </div>

  <div id="list"></div>

</div>

<script>

const PLAYLIST="https://iptv-org.github.io/iptv/index.m3u";

let list=[],filtered=[],index=0;
let renderIndex=0;
const CHUNK=120;

/* LOAD */
async function load(){
  const r=await fetch(PLAYLIST);
  const t=await r.text();

  list=parseM3U(t);

  buildGroups();
  applyFilters();
}

/* PARSE */
function parseM3U(t){
  const lines=t.split("\n");
  let out=[],item=null;

  for(let l of lines){
    if(l.startsWith("#EXTINF")){
      item={
        name:l.split(",").pop(),
        group:(l.match(/group-title="([^"]+)"/)||[])[1]||"Other"
      };
    }
    else if(item && l.startsWith("http")){
      item.url=l.trim();
      out.push(item);
      item=null;
    }
  }
  return out;
}

/* GROUP SIDEBAR */
function buildGroups(){
  const set=new Set();
  list.forEach(s=>set.add(s.group));

  const box=document.getElementById("groupList");
  box.innerHTML="";

  const all=document.createElement("div");
  all.className="group";
  all.textContent="📺 All Channels";
  all.onclick=()=>{
    filtered=list;
    render(true);
  };
  box.appendChild(all);

  [...set].sort().forEach(g=>{
    const d=document.createElement("div");
    d.className="group";
    d.textContent=g;

    d.onclick=()=>{
      filtered=list.filter(x=>x.group===g);
      render(true);
    };

    box.appendChild(d);
  });
}

/* SEARCH FILTER */
function applyFilters(){
  const q=document.getElementById("search").value.toLowerCase();

  filtered=list.filter(s=>
    s.name.toLowerCase().includes(q)
  );

  render(true);
}

/* RENDER */
function render(reset){
  const el=document.getElementById("list");

  if(reset){
    el.innerHTML="";
    renderIndex=0;
  }

  const slice=filtered.slice(renderIndex,renderIndex+CHUNK);

  slice.forEach((s,i)=>{
    const real=renderIndex+i;

    el.innerHTML+=`
      <div class="card" onclick="play(${real})">
        <b>${s.name}</b><br/>
        <small>${s.group}</small>
      </div>
    `;
  });

  renderIndex+=CHUNK;
}

/* INFINITE SCROLL */
document.getElementById("list").onscroll=(e)=>{
  if(e.target.scrollTop+e.target.clientHeight>=e.target.scrollHeight-100){
    render(false);
  }
};

/* HLS PLAY */
function playMedia(url){
  const v=document.getElementById("video");

  if(window.Hls && Hls.isSupported()){
    if(window.hls) window.hls.destroy();

    window.hls=new Hls();
    window.hls.loadSource(url);
    window.hls.attachMedia(v);
    v.play();
  }else{
    v.src=url;
    v.play();
  }
}

/* PLAY */
function play(i){
  index=i;
  const s=filtered[i];
  if(!s) return;

  document.getElementById("now").innerText=s.name;
  playMedia(s.url);
}

/* CONTROLS */
function next(){
  index=(index+1)%filtered.length;
  play(index);
}

function prev(){
  index=(index-1+filtered.length)%filtered.length;
  play(index);
}

function toggle(){
  const v=document.getElementById("video");
  v.paused?v.play():v.pause();
}

/* START */
load();

</script>
</body>
</html>
