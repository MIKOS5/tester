<script>

const STREAM_API =
"https://script.google.com/macros/s/AKfycbynB1gx8xRVH4cNtulKZv3Kr5CUyV7rATcZgyCJ73JStoxOw0meB6vqCV3AkIAUMkqZ/exec";

const STATION_API =
"https://script.google.com/macros/s/AKfycbyasf7oke6ZAhjgD-j2HGcR9bBysso2M9RuUuOgXZUQ7UkQ6CAOMV4PfGM3ViLUz6bygg/exec";

const STATION2_API =
"https://script.google.com/macros/s/AKfycbysfjhqpffSPuSrApR1UitbyuxGKBmdq0p7kD5C7qH6X391fl-RnSAnepjwLpeA6B80/exec";
   
const video = document.getElementById("video");
video.volume = 1;
document.getElementById("volumeSlider").value = 100;
   
let list=[];
let filtered=[];
let index=0;

const urlParams = new URLSearchParams(window.location.search);

const requestedStation = urlParams.get("station");
console.log("Requested Station:", requestedStation);
   
let currentSource="";

let currentStationURL = "";
let stationWatcher = null;
let stationMode = "";
let streamList=[];
let renderIndex=0;
const CHUNK=120;

/* CHAT API */
const API_URL = "https://script.google.com/macros/s/AKfycbzin84qDcZ9L1q4pTBtHZGKJSTDcZ_wnmgWmnmgPgf1jrc1nRprzbEBixKMSHcdkxiZBg/exec";

let chatOpen=false;
let chatData=[];

/* ROOM ID (video stream based) */
function getRoom(){

  const stream = filtered[index];

  return stream?.url || "global-video";

}

/* TOGGLE CHAT */
function toggleChat(){
  const box=document.getElementById("chatPopup");
  chatOpen=!chatOpen;
  box.classList.toggle("hidden");
  if(chatOpen) loadChat();
}

/* LOAD CHAT */
async function loadChat(){
  const res=await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({
      action:"get",
      station:getRoom()
    })
  });

  const data=await res.json();
  chatData=Array.isArray(data)?data:[];
  renderChat();

  const title = document.querySelector(".chat-popup-header span");
  title.innerText = "💬 " + (document.getElementById("now").innerText || getRoom());
}

/* SEND CHAT */
async function sendChat(){
  let name=document.getElementById("chatName").value||"Anon";
  let msg=document.getElementById("chatMsg").value;

  if(!msg) return;

  name=name.trim().slice(0,8);
  msg=msg.trim().slice(0,100);

  document.getElementById("chatMsg").value="";

  const station = getRoom();
  const stationName = document.getElementById("now").innerText || station;

  await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({
      action:"send",
      station,
      stationName,   // ✅ THIS is what you were missing
      name,
      message:msg
    })
  });

  loadChat();
}

/* RENDER CHAT */
function renderChat(){
  const box=document.getElementById("chatLog");
  box.innerHTML="";

  const welcome={
    system:true,
    name:"System",
    message:`Chat for ${getRoom()}`
  };

  [welcome,...chatData].forEach(m=>{
    box.innerHTML+=`
      <div class="chat-msg" style="${m.system?"opacity:0.6;text-align:center;":""}">
        <span class="chat-name">${m.system?"":m.name+": "}</span>
        ${m.message}
      </div>
    `;
  });

  box.scrollTop=box.scrollHeight;
}

/* AUTO REFRESH */
setInterval(()=>{
  if(chatOpen && document.visibilityState==="visible"){
    loadChat();
  }
},3000);

/* =========================
   ORIGINAL VIDEO CODE (UNCHANGED)
========================= */

async function load(){

    document.getElementById("list").innerHTML =
    `<div class="card">Connecting to Video API...</div>`;


    try {

        console.log("API:", STREAM_API);


        const response = await fetch(
    STREAM_API + "?t=" + Date.now(),
    {
        method:"GET",
        redirect:"follow",
        cache:"no-store"
    }
);


        console.log("HTTP STATUS:", response.status);


        const text = await response.text();


        console.log("RAW API:", text.substring(0,500));


        const data = JSON.parse(text);


        console.log("JSON DATA:", data);



        if(!data.streams){
            throw new Error("No streams array found");
        }



        streamList = data.streams
        .filter(s=>{

            return (
                s.status &&
                s.status.toUpperCase()==="ONLINE" &&
                s.url
            );

        })
        .map(s=>({

    id:String(s.id || ""),

    name:String(s.name || "Unknown"),

    group:String(s.group || "Other"),

    country:String(s.country || "Unknown"),

    city:String(s.language || "Unknown"),

    url:String(s.url || ""),

    logo:String(s.logo || ""),

    vote:Number(s.vote || 0)

}))
.filter(s=>s.url);



        streamList.sort((a,b)=>
    String(a.name || "")
    .localeCompare(
        String(b.name || "")
    )
);



        list=[...streamList];


        console.log(
            "ONLINE CHANNELS:",
            list.length
        );


        buildGroups();

buildCountries();

buildCities();

filtered=[...list];

render(true);



        document.getElementById("now").innerText =
        list.length+" Channels Loaded";


    }
    catch(err){

        console.error(
            "VIDEO API ERROR:",
            err
        );


        document.getElementById("list").innerHTML =
        `
        <div class="card">
        ❌ API ERROR<br>
        ${err.message}
        </div>
        `;

    }

}


function setVolume(value){

    video.volume = value / 100;

    if(video.volume === 0){

        video.muted = true;

    }else{

        video.muted = false;

    }

    document.getElementById("muteBtn").innerText =
        video.muted ? "🔇" : "🔊";

}
   
function buildCities(){

    const citySet = new Set();

    list.forEach(s=>{

        if(s.city && s.city !== "Unknown"){

            citySet.add(s.city.trim());

        }

    });


    const cities=[...citySet].sort();


    const box=document.getElementById("cityList");

    box.innerHTML="";


    const all=document.createElement("div");

    all.className="group";
    all.textContent="🏙️ All Cities";

    all.onclick=()=>{

        filtered=[...list];
        render(true);

    };

    box.appendChild(all);



    cities.forEach(city=>{

        const d=document.createElement("div");

        d.className="group";
        d.textContent="🏙️ "+city;


        d.onclick=()=>{

            filtered=list.filter(s=>
                s.city === city
            );

            render(true);

        };


        box.appendChild(d);

    });

}

function toggleMute(){

    const video = document.getElementById("video");
    const btn = document.getElementById("muteBtn");

    video.muted = !video.muted;

    btn.innerText = video.muted ? "🔇" : "🔊";

}
   
function buildGroups(){

    const groupSet = new Set();

    list.forEach(s=>{

        s.group
        .split(";")
        .forEach(g=>{
            groupSet.add(g.trim());
        });

    });


    const groups=[...groupSet].sort((a,b)=>
    String(a).localeCompare(String(b))
);


    const box=document.getElementById("groupList");

if(!box) return;

box.innerHTML="";


    const all=document.createElement("div");

    all.className="group";

    all.textContent="📺 All Channels";

    all.onclick=()=>{

        filtered=[...list];

        render(true);

    };

    box.appendChild(all);



    groups.forEach(g=>{

        const d=document.createElement("div");

        d.className="group";

        d.textContent="📂 "+g;


        d.onclick=()=>{


            filtered=list.filter(s=>

                s.group
                .split(";")
                .map(x=>x.trim())
                .includes(g)

            );


            filtered.sort((a,b)=>
                a.name.localeCompare(b.name)
            );


            render(true);

        };


        box.appendChild(d);

    });

}

function toggleAppMenu(){

  const menu=document.getElementById("appMenu");

  menu.classList.toggle("open");

}

async function loadStation(){

async function playMedia(url){

    const video = document.getElementById("video");

    console.clear();
    console.log("========== PLAY ==========");
    console.log("Original:", url);


    let finalUrl = url;


    // Resolve only redirect links
    if(url.includes("jmp2.uk")){

        try{

            const r = await fetch(
                STREAM_API +
                "?action=resolve&url=" +
                encodeURIComponent(url)
            );


            const data = await r.json();


            console.log("Resolver:", data);


            if(data.success && data.finalUrl){

                finalUrl = data.finalUrl;

            }


        }
        catch(e){

            console.log(
                "Resolve failed",
                e
            );

        }

    }


    console.log(
        "Final HLS URL:",
        finalUrl
    );



    // Destroy previous HLS instance
    if(window.hls){

        console.log(
            "Destroy old HLS"
        );

        window.hls.destroy();

        window.hls=null;

    }



    video.pause();

    video.removeAttribute("src");

    video.load();



    // ==========================
    // HLS.JS PLAYER
    // ==========================

    if(Hls.isSupported()){


        console.log(
            "Using HLS.js"
        );


        window.hls = new Hls({

            enableWorker:true,

            lowLatencyMode:false,

            backBufferLength:90,

            xhrSetup:function(xhr,url){

                xhr.withCredentials=false;

            }

        });



        window.hls.attachMedia(video);



        window.hls.on(
            Hls.Events.MEDIA_ATTACHED,
            function(){

                console.log(
                    "Media attached"
                );


                window.hls.loadSource(
                    finalUrl
                );


            }
        );



        window.hls.on(
            Hls.Events.MANIFEST_PARSED,
            function(event,data){

                console.log(
                    "Manifest parsed",
                    data
                );


                video.play()
                .catch(err=>{

                    console.log(
                        "Autoplay blocked",
                        err
                    );

                });


            }
        );



        window.hls.on(
            Hls.Events.ERROR,
            function(event,data){

                console.log(
                    "HLS ERROR:",
                    data
                );



                if(!data.fatal){

                    return;

                }



                switch(data.type){


                    case Hls.ErrorTypes.NETWORK_ERROR:

                        console.log(
                            "Network error - retry"
                        );


                        window.hls.startLoad();


                        break;



                    case Hls.ErrorTypes.MEDIA_ERROR:


                        console.log(
                            "Media error - recover"
                        );


                        window.hls.recoverMediaError();


                        break;



                    default:


                        console.log(
                            "Fatal error - destroy"
                        );


                        window.hls.destroy();


                        break;

                }


            }
        );


        return;

    }





    // ==========================
    // NATIVE HLS (Safari/iOS)
    // ==========================

    if(video.canPlayType(
        "application/vnd.apple.mpegurl"
    )){


        console.log(
            "Using native HLS"
        );


        video.src = finalUrl;



        video.addEventListener(
            "loadedmetadata",
            function(){

                video.play()
                .catch(err=>{

                    console.log(
                        "Playback blocked",
                        err
                    );

                });


            },
            {once:true}
        );


        return;

    }



    console.log(
        "No HLS support"
    );

}
   
function play(i){

    console.log("play() called", i);
    // Exit station mode
    stationMode=false;

    // Stop Video Obvyris TV watcher
    if(stationWatcher){
        clearInterval(stationWatcher);
        stationWatcher=null;
    }

    currentStationURL = "";

    video.controls=true;

    document.getElementById("playBtn").disabled=false;

    index = i;

    const s = filtered[i];

    if(!s) return;


    // Update station name
    document.getElementById("voteDisplay").innerText =
    "👍 " + (s.vote || 0) + " Votes";


    // Update station logo
    const activeLogo = document.getElementById("activeLogo");

    if(s.logo && s.logo.trim() !== ""){

        activeLogo.src = s.logo;

    }else{

        activeLogo.src =
        "https://mikos5.github.io/tester/navicon.png";

    }


    // Fallback logo
    activeLogo.onerror = function(){

        this.src =
        "https://mikos5.github.io/tester/navicon.png";

    };


    // Start live stream
    playMedia(s.url);

    console.log("Stream object:", s);
console.log("URL:", s.url);
   
    // Refresh chat for new station
    if(chatOpen){

        loadChat();

    }

}
   
function next(){

function prev(){
  index=(index-1+filtered.length)%filtered.length;

}

function buildCountries(){

    const countrySet = new Set();

    list.forEach(s=>{

        if(s.country && s.country !== "Unknown"){

            countrySet.add(
                s.country.trim()
            );

        }

    });


    const countries=[...countrySet].sort((a,b)=>
        a.localeCompare(b)
    );


    const box=document.getElementById("countryList");

    box.innerHTML="";


    const all=document.createElement("div");

    all.className="group";

    all.textContent="🌎 All Countries";

    all.onclick=()=>{

        filtered=[...list];

        render(true);

    };

    box.appendChild(all);



    countries.forEach(country=>{

        const d=document.createElement("div");

        d.className="group";

        d.textContent="🌎 "+country;


        d.onclick=()=>{


            filtered=list.filter(s=>

                s.country === country

            );


            filtered.sort((a,b)=>
                a.name.localeCompare(b.name)
            );


            render(true);

        };


        box.appendChild(d);


    });


}

            body:JSON.stringify({

            })
        });


        const data = await response.json();

    }

async function checkStationUpdate(){

    if(!stationMode) return;

    try{

        const apiURL =
            stationMode === "station2"
            ? STATION2_API
            : STATION_API;


        const response = await fetch(
            apiURL + "?action=now&t=" + Date.now()
        );


        const data = await response.json();


        if(!data.url) return;


        if(data.url !== currentStationURL){

            console.log(
                "NEW VIDEO DETECTED",
                stationMode,
                data.url
            );


            currentStationURL = data.url;


            video.pause();

            video.src = data.url;

            video.load();


            video.onloadedmetadata = ()=>{


                if(data.seek){

                    video.currentTime =
                    Number(data.seek);

                }


                video.play()
                .catch(e=>console.log(e));

            };


            document.getElementById("now").innerText =
                data.program || "Video Obvyris TV";

        }


    }
    catch(err){

        console.log(
            "Station watcher error:",
            err
        );

    }

}

function sortMostVotes(){

    filtered = list.filter(s => (Number(s.vote) || 0) > 0);

    filtered.sort((a,b)=>
        (Number(b.vote) || 0) - (Number(a.vote) || 0)
    );

    render(true);

    document.getElementById("now").innerText =
        "🔥 Most Voted Channels (" + filtered.length + ")";

}
