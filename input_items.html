<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Product Input</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;font-family:Inter,sans-serif;background:#0f172a;color:white}
.form-wrap{max-width:840px;margin:0 auto;background:#111827;border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:24px;box-shadow:0 20px 40px rgba(0,0,0,.35)}
h1{margin:0 0 6px;font-size:26px}.sub{color:#94a3b8;font-size:13px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px} @media(max-width:700px){.grid{grid-template-columns:1fr}}
label{display:block;margin:4px 0 6px;font-weight:600;font-size:12px;color:#cbd5e1;text-transform:uppercase;letter-spacing:.04em}
input,textarea,select{width:100%;padding:12px 14px;background:#1e293b;border:1px solid rgba(255,255,255,.1);border-radius:12px;color:white;font-size:14px;outline:none}
input:focus,textarea:focus,select:focus{border-color:#2563eb;box-shadow:0 0 0 4px rgba(37,99,235,.2)}
.combo{position:relative}.combo-dropdown{position:absolute;top:100%;left:0;right:0;max-height:320px;overflow:auto;background:#1e293b;border:1px solid rgba(255,255,255,.15);border-radius:12px;margin-top:6px;z-index:50;display:none}
.combo-dropdown.open{display:block}.opt{padding:10px 14px;cursor:pointer;font-size:13px;border-bottom:1px solid rgba(255,255,255,.05)}.opt:hover,.opt.active{background:#2563eb;color:white}.group-label{padding:8px 14px;font-weight:700;color:#60a5fa;background:#0b1220;font-size:11px;text-transform:uppercase;position:sticky;top:0}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}.pill{padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);font-size:12px;cursor:pointer}.pill.active{background:#2563eb;border-color:#2563eb;color:white}
button.submit{width:100%;margin-top:18px;padding:14px;background:#2563eb;border:none;color:white;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer}button.submit:hover{background:#3b82f6}
</style>
</head>
<body>
<div class="form-wrap">
<h1>New Product Input</h1><div class="sub">Add restored equipment — searchable category now</div>
<form id="newProductForm" action="https://script.google.com/macros/s/AKfycbzDCfZokdDHryVxtuVOuvTb6XUfnMR66_8Xwym3QzaSWgKooI0865_JPtTi0hJ_GDQr/exec" method="POST">
<div class="grid">
<div><label>Item Name</label><input name="Item Name" required placeholder="e.g. 1950s Emerson Fan"></div>
<div><label>Brand</label><input name="Brand" required></div>
</div>
<label style="margin-top:14px">Category</label>
<div class="pills" id="groupPills"></div>
<div class="combo"><input id="categorySearch" placeholder="Type to search categories... e.g. Tools, Fans, Kitchen" autocomplete="off"><input type="hidden" name="category" id="categoryValue" required><div class="combo-dropdown" id="catDropdown"></div></div>
<div class="grid" style="margin-top:14px">
<div><label>Model/Series</label><input name="Model/Series"></div>
<div><label>SKU/Item Number</label><input name="SKU/Item Number"></div>
<div><label>Condition</label><select name="Condition"><option>New</option><option>Used - Like New</option><option>Used - Good</option><option>Used - Fair</option></select></div>
<div><label>Purchase Price</label><input type="number" step="0.01" name="Purchase Price"></div>
<div><label>Purchase Date</label><input type="date" name="Purchase Date"></div>
<div><label>Source</label><input name="Source"></div>
</div>
<label style="margin-top:14px">Description</label><textarea name="Description" rows="4"></textarea>
<button class="submit" type="submit">Submit Product</button>
</form>
</div>
<script>
// Simplified category data grouped
const allCats=[
"Antiques & Collectibles//Antique & Collectible Appliances//Fans & Air Conditioners","Antiques & Collectibles//Antique & Collectible Appliances//Refrigerators & Freezers","Antiques & Collectibles//Antique & Collectible Decorative Arts//Lamps","Antiques & Collectibles//Antique & Collectible Kitchenware//Small Appliances",
"Tools & Home Improvement//Hand Tools","Tools & Home Improvement//Power Tools","Tools & Home Improvement//Electrical","Tools & Home Improvement//Lighting & Ceiling Fans","Tools & Home Improvement//Home Improvement","Tools & Home Improvement//Building Materials",
"Electronics//Audio & Headphones","Electronics//Cameras & Photography","Electronics//TV & Video","Home & Kitchen//Small Appliances","Home & Kitchen//Kitchen & Dining","Furniture//Living Room Furniture","Sporting Goods//Camping & Hiking"
 // add your full list here — JS will handle search
];
const groups=[...new Set(allCats.map(c=>c.split("//")[0]))];
const pills=document.getElementById("groupPills"),search=document.getElementById("categorySearch"),dropdown=document.getElementById("catDropdown"),hidden=document.getElementById("categoryValue");
let activeGroup=null,filtered=allCats;
function renderPills(){pills.innerHTML=groups.map(g=>`<div class="pill ${activeGroup===g?'active':''}" data-g="${g}">${g}</div>`).join("");pills.querySelectorAll(".pill").forEach(p=>p.onclick=()=>{activeGroup=p.dataset.g===activeGroup?null:p.dataset.g;renderPills();filterCats();});}
function filterCats(){let q=search.value.toLowerCase();filtered=allCats.filter(c=>{let ok=true;if(activeGroup)ok=c.startsWith(activeGroup);if(q)ok=ok&&c.toLowerCase().includes(q);return ok;});renderDropdown();}
function renderDropdown(){dropdown.innerHTML="";if(!filtered.length){dropdown.innerHTML='<div class="opt">No matches</div>';return;}let byGroup={};filtered.forEach(c=>{let g=c.split("//")[0];(byGroup[g]=byGroup[g]||[]).push(c);});Object.entries(byGroup).forEach(([g,items])=>{let gl=document.createElement("div");gl.className="group-label";gl.textContent=g;dropdown.appendChild(gl);items.forEach(v=>{let d=document.createElement("div");d.className="opt";d.textContent=v;d.onclick=()=>{search.value=v;hidden.value=v;dropdown.classList.remove("open");};dropdown.appendChild(d);});});}
search.addEventListener("focus",()=>{dropdown.classList.add("open");filterCats();});search.addEventListener("input",filterCats);
document.addEventListener("click",e=>{if(!e.target.closest(".combo"))dropdown.classList.remove("open");});
renderPills();filterCats();
</script>
</body>
</html>
