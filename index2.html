<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Buggsie Baking Co.</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Open Sans', sans-serif;
      background: #fffaf5;
      color: #333;
      text-align: center;
    }

    header {
      padding: 40px 20px;
    }

    .logo {
      width: 220px;
      height: 220px;
      margin: 0 auto;
      border-radius: 50%;
      background: #40cfcf;
      border: 10px solid #f5d742;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    }

    .logo h1 {
      font-family: 'Pacifico', cursive;
      color: white;
      font-size: 40px;
      margin: 0;
    }

    .logo span {
      color: white;
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 8px;
    }

    .tagline {
      margin-top: 25px;
      font-size: 18px;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }

    .instagram-section {
      margin: 50px auto;
      max-width: 900px;
      padding: 0 15px;
    }

    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      background: #f5d742;
      color: #333;
      text-decoration: none;
      border-radius: 30px;
      font-weight: 600;
      transition: 0.3s;
    }

    .btn:hover {
      background: #ffd84d;
    }

    iframe {
      width: 100%;
      height: 600px;
      border: none;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    }
  </style>
</head>

<body>

<header>
  <div class="logo">
    <h1>buggsie</h1>
    <span>Baking Co.</span>
  </div>

  <div class="tagline">
    Fresh, small-batch baked goods made with love.  
    Playful, handcrafted, and always delicious.
  </div>

  <a class="btn" href="https://www.instagram.com/buggsiebakingco" target="_blank">
    Follow on Instagram
  </a>
</header>

<section class="instagram-section">
  <h2>See What We're Baking</h2>

  <!-- Instagram Embed -->
  <iframe 
    src="https://www.instagram.com/buggsiebakingco/embed">
  </iframe>

</section>

</body>
</html>
