<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Buggsie Order Menu</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #fffaf5;
}

/* HEADER (BIG FOR QR USERS) */
header {
  text-align: center;
  padding: 20px 10px;
  background: linear-gradient(135deg, #40cfcf, #2fb3b3);
  color: white;
}

.logo {
  font-family: 'Pacifico', cursive;
  font-size: 38px;
}

.sub {
  font-size: 14px;
  opacity: 0.9;
}

/* MENU */
.menu {
  padding: 10px;
  max-width: 700px;
  margin: auto;
}

.item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px;
  margin: 10px 0;
  background: white;
  border-radius: 14px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.08);
  font-size: 18px;
  font-weight: 500;
}

.price {
  color: #40cfcf;
  font-weight: 700;
}

/* BIG TAP BUTTON STYLE */
.add-btn {
  background: #f5d742;
  border: none;
  padding: 10px 14px;
  border-radius: 12px;
  font-weight: 600;
}

/* CART BAR (STICKY) */
.cart {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: white;
  border-top: 2px solid #eee;
  padding: 12px;
  box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
}

.cart-items {
  font-size: 14px;
  max-height: 80px;
  overflow-y: auto;
}

.total {
  font-weight: 700;
  margin-top: 5px;
}

/* ORDER BUTTON */
.order-btn {
  display: block;
  margin-top: 10px;
  padding: 14px;
  text-align: center;
  background: #40cfcf;
  color: white;
  border-radius: 14px;
  text-decoration: none;
  font-weight: 700;
  font-size: 16px;
}
</style>
</head>

<body>

<header>
  <div class="logo">buggsie</div>
  <div class="sub">Tap items → Build your order → Send via Instagram</div>
</header>

<div class="menu">

  <div class="item">
    Chocolate Chip Cookie
    <span class="price">$3</span>
    <button class="add-btn" onclick="add('Chocolate Chip Cookie',3)">+</button>
  </div>

  <div class="item">
    Snickerdoodle
    <span class="price">$3</span>
    <button class="add-btn" onclick="add('Snickerdoodle',3)">+</button>
  </div>

  <div class="item">
    Double Chocolate
    <span class="price">$3.50</span>
    <button class="add-btn" onclick="add('Double Chocolate',3.5)">+</button>
  </div>

  <div class="item">
    6 Pack Cookies
    <span class="price">$16</span>
    <button class="add-btn" onclick="add('6 Pack Cookies',16)">+</button>
  </div>

  <div class="item">
    Fudge Brownie
    <span class="price">$4</span>
    <button class="add-btn" onclick="add('Fudge Brownie',4)">+</button>
  </div>

</div>

<!-- CART -->
<div class="cart">
  <div class="cart-items" id="cart"></div>
  <div class="total" id="total">Total: $0</div>
  <a class="order-btn" onclick="sendOrder()">Send Order to Instagram</a>
</div>

<script>
let cart = {};

function add(name, price) {
  if (!cart[name]) {
    cart[name] = { qty: 1, price };
  } else {
    cart[name].qty++;
  }
  update();
}

function update() {
  let text = "";
  let total = 0;

  for (let i in cart) {
    let item = cart[i];
    total += item.qty * item.price;
    text += `${i} x${item.qty} ($${item.qty * item.price})<br>`;
  }

  document.getElementById("cart").innerHTML = text;
  document.getElementById("total").innerText = "Total: $" + total.toFixed(2);
}

function sendOrder() {
  let msg = "Hi! I'd like to order:\n\n";

  for (let i in cart) {
    msg += `${i} x${cart[i].qty}\n`;
  }

  msg += "\nTotal: $" + document.getElementById("total").innerText.replace("Total: $","");

  let url = "https://www.instagram.com/direct/new/?text=" + encodeURIComponent(msg);

  window.open(url, "_blank");
}
</script>

</body>
</html>
