<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Buggsie Baking Co.</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: linear-gradient(135deg,#fffaf5,#fef3e7);
  color: #333;
}

/* HEADER */
header {
  text-align: center;
  padding: 50px 20px;
}

.logo {
  font-family: 'Pacifico', cursive;
  font-size: 42px;
  color: #40cfcf;
}

.btn {
  display: inline-block;
  margin-top: 15px;
  padding: 12px 24px;
  background: #f5d742;
  border-radius: 30px;
  text-decoration: none;
  color: #333;
  font-weight: 600;
}

/* IG GRID */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 10px;
  max-width: 900px;
  margin: 20px auto;
  padding: 10px;
}

.grid img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  border-radius: 12px;
  transition: 0.3s;
}

.grid img:hover {
  transform: scale(1.05);
}

/* MENU */
.menu {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

.category {
  margin-bottom: 40px;
}

.item {
  display: flex;
  justify-content: space-between;
  padding: 12px;
  border-bottom: 1px dashed #ddd;
  cursor: pointer;
  transition: 0.2s;
}

.item:hover {
  background: #fff3cc;
}

.price {
  color: #40cfcf;
  font-weight: 600;
}

/* CTA */
.cta {
  text-align: center;
  padding: 40px;
}
</style>
</head>

<body>

<header>
  <div class="logo">buggsie</div>
  <p>Fresh • Small Batch • Made with Love</p>

  <a class="btn" href="https://www.instagram.com/buggsiebakingco" target="_blank">
    View Instagram
  </a>
</header>

<!-- 📸 FAKE IG GRID (replace images with yours) -->
<section>
  <h2 style="text-align:center;">🍪 Fresh Bakes</h2>

  <div class="grid">
    <img src="https://source.unsplash.com/300x300/?cookies">
    <img src="https://source.unsplash.com/300x300/?brownies">
    <img src="https://source.unsplash.com/300x300/?cupcakes">
    <img src="https://source.unsplash.com/300x300/?dessert">
    <img src="https://source.unsplash.com/300x300/?chocolate">
    <img src="https://source.unsplash.com/300x300/?bakery">
  </div>
</section>

<!-- 🛒 MENU -->
<section class="menu">

  <div class="category">
    <h2>Cookies</h2>

    <div class="item" onclick="order('Chocolate Chip Cookie - $3')">
      <span>Chocolate Chip</span>
      <span class="price">$3</span>
    </div>

    <div class="item" onclick="order('Snickerdoodle - $3')">
      <span>Snickerdoodle</span>
      <span class="price">$3</span>
    </div>

    <div class="item" onclick="order('6 Pack Cookies - $16')">
      <span>6 Pack</span>
      <span class="price">$16</span>
    </div>

  </div>

  <div class="category">
    <h2>Brownies</h2>

    <div class="item" onclick="order('Fudge Brownie - $4')">
      <span>Fudge Brownie</span>
      <span class="price">$4</span>
    </div>

  </div>

</section>

<!-- CTA -->
<div class="cta">
  <h2>Tap any item to order</h2>
  <p>We’ll open Instagram DM with your order pre-filled</p>
</div>

<script>
function order(item) {
  const message = encodeURIComponent("Hi! I'd like to order: " + item);
  window.open("https://www.instagram.com/direct/new/?text=" + message, "_blank");
}
</script>

</body>
</html>
