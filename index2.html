<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Buggsie Order Menu</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body { margin:0; font-family:'Poppins',sans-serif; background:#fffaf5; }

header {
  text-align:center; padding:20px;
  background:linear-gradient(135deg,#40cfcf,#2fb3b3); color:white;
}
.logo { font-family:'Pacifico'; font-size:36px; }

.menu { padding:10px; max-width:700px; margin:auto; }

.item {
  display:flex; justify-content:space-between; align-items:center;
  padding:16px; margin:10px 0;
  background:white; border-radius:14px;
  box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

.controls button {
  margin:0 4px; padding:6px 10px;
  border:none; border-radius:8px;
  background:#f5d742; font-weight:bold;
}

.cart {
  position:fixed; bottom:0; left:0; right:0;
  background:white; padding:12px;
  box-shadow:0 -5px 20px rgba(0,0,0,0.1);
}

input, select {
  width:100%; padding:10px; margin:5px 0;
  border-radius:10px; border:1px solid #ddd;
}

.order-btn {
  display:block; margin-top:10px; padding:14px;
  background:#40cfcf; color:white;
  text-align:center; border-radius:14px;
  font-weight:700;
}

.clear-btn {
  margin-top:5px; text-align:center;
  color:red; font-size:14px;
}
</style>
</head>

<body>

<header>
  <div class="logo">buggsie</div>
  <div>Build order → Fill info → Text it</div>
</header>

<div class="menu" id="menu"></div>

<div class="cart">
  <input id="name" placeholder="Your name">
  
  <select id="time">
    <option value="">Pickup time</option>
    <option>ASAP</option>
    <option>In 30 mins</option>
    <option>In 1 hour</option>
    <option>Later (message us)</option>
  </select>

  <div id="cart"></div>
  <div id="total">Total: $0</div>

  <div class="order-btn" onclick="sendOrder()">Text Order</div>
  <div class="clear-btn" onclick="clearCart()">Clear Cart</div>
</div>

<script>
let items = [
  ["Chocolate Chip Cookie",3],
  ["Snickerdoodle",3],
  ["Double Chocolate",3.5],
  ["6 Pack Cookies",16],
  ["Fudge Brownie",4]
];

let cart = JSON.parse(localStorage.getItem("cart")) || {};

// 🔥 YOUR GOOGLE SHEETS WEBHOOK
const WEBHOOK = "https://script.google.com/macros/s/AKfycbz6PJIekdzsKOBXu6331-q78hFx9LyuQqQ5ZCdtzbKfjlfmI3rWHj5i3CR6fzlt813u/exec";

function renderMenu() {
  let html = "";
  items.forEach(i=>{
    html += `
    <div class="item">
      ${i[0]} ($${i[1]})
      <div class="controls">
        <button onclick="remove('${i[0]}')">-</button>
        <button onclick="add('${i[0]}',${i[1]})">+</button>
      </div>
    </div>`;
  });
  document.getElementById("menu").innerHTML = html;
}

function add(name, price) {
  if (!cart[name]) cart[name] = {qty:0, price};
  cart[name].qty++;
  update();
}

function remove(name) {
  if (!cart[name]) return;
  cart[name].qty--;
  if (cart[name].qty <= 0) delete cart[name];
  update();
}

function update() {
  let text = "";
  let total = 0;

  for (let i in cart) {
    let item = cart[i];
    let cost = item.qty * item.price;
    total += cost;
    text += `${i} x${item.qty} ($${cost.toFixed(2)})<br>`;
  }

  document.getElementById("cart").innerHTML = text || "No items yet";
  document.getElementById("total").innerText = "Total: $" + total.toFixed(2);

  localStorage.setItem("cart", JSON.stringify(cart));
}

function clearCart(){
  cart = {};
  update();
}

function sendOrder() {
  let name = document.getElementById("name").value.trim();
  let time = document.getElementById("time").value;

  if (!name) return alert("Enter your name");
  if (!time) return alert("Select pickup time");
  if (Object.keys(cart).length === 0) return alert("Cart empty");

  let itemsText = "";
  let total = 0;

  for (let i in cart) {
    let item = cart[i];
    let cost = item.qty * item.price;
    total += cost;
    itemsText += `${i} x${item.qty}, `;
  }

  let payload = {
    name: name,
    time: time,
    items: itemsText,
    total: total.toFixed(2)
  };

  // 🔥 SEND TO GOOGLE SHEETS
  fetch(WEBHOOK, {
    method: "POST",
    body: JSON.stringify(payload)
  })
  .then(()=>console.log("Saved to sheet"))
  .catch(()=>console.log("Sheet error"));

  // 📲 SMS MESSAGE
  let msg = `Buggsie Order\n\nName: ${name}\nPickup: ${time}\n\n${itemsText}\nTotal: $${total.toFixed(2)}`;

  let phone = "13105551234"; // 🔴 CHANGE THIS
  let sms = `sms:${phone}?&body=${encodeURIComponent(msg)}`;

  if (/Android|iPhone/i.test(navigator.userAgent)) {
    window.location.href = sms;
  } else {
    navigator.clipboard.writeText(msg);
    alert("Order copied! Paste into text/DM.");
  }

  clearCart();
}

renderMenu();
update();
</script>

</body>
</html>
