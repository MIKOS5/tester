<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Buggsie Baking Co.</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #fffaf5, #fef3e7);
    color: #333;
    overflow-x: hidden;
  }

  /* floating background blobs */
  .bg-blob {
    position: absolute;
    border-radius: 50%;
    opacity: 0.15;
    filter: blur(40px);
    z-index: 0;
  }

  .blob1 { width: 300px; height: 300px; background:#40cfcf; top: -50px; left: -50px; }
  .blob2 { width: 250px; height: 250px; background:#f5d742; bottom: -60px; right: -40px; }

  header {
    text-align: center;
    padding: 60px 20px 40px;
    position: relative;
    z-index: 1;
  }

  .logo-card {
    width: 240px;
    height: 240px;
    margin: 0 auto;
    border-radius: 50%;
    background: #40cfcf;
    border: 10px solid #f5d742;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    animation: float 4s ease-in-out infinite;
  }

  @keyframes float {
    0%,100% { transform: translateY(0px); }
    50% { transform: translateY(-12px); }
  }

  .logo-card h1 {
    font-family: 'Pacifico', cursive;
    color: white;
    font-size: 42px;
    margin: 0;
  }

  .logo-card span {
    color: white;
    font-size: 14px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 8px;
  }

  .tagline {
    margin-top: 30px;
    font-size: 18px;
    max-width: 520px;
    margin-left: auto;
    margin-right: auto;
    line-height: 1.6;
  }

  .btn {
    display: inline-block;
    margin-top: 25px;
    padding: 14px 28px;
    background: linear-gradient(45deg, #f5d742, #ffd84d);
    color: #333;
    text-decoration: none;
    border-radius: 40px;
    font-weight: 600;
    box-shadow: 0 6px 15px rgba(0,0,0,0.15);
    transition: 0.3s;
  }

  .btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 20px rgba(0,0,0,0.2);
  }

  .section {
    padding: 60px 20px;
    text-align: center;
  }

  .section h2 {
    font-size: 28px;
    margin-bottom: 25px;
  }

  .instagram-wrapper {
    max-width: 900px;
    margin: auto;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 15px 40px rgba(0,0,0,0.1);
  }

  iframe {
    width: 100%;
    height: 600px;
    border: none;
  }

  footer {
    text-align: center;
    padding: 30px;
    font-size: 14px;
    opacity: 0.7;
  }
</style>
</head>

<body>

<div class="bg-blob blob1"></div>
<div class="bg-blob blob2"></div>

<header>

  <div class="logo-card">
    <h1>buggsie</h1>
    <span>Baking Co.</span>
  </div>

  <div class="tagline">
    Fresh, small-batch baked goods made with love.  
    Playful, handcrafted, and always baked to perfection.
  </div>

  <a class="btn" href="https://www.instagram.com/buggsiebakingco" target="_blank">
    Follow Us 🍪
  </a>

</header>

<section class="section">
  <h2>From Our Kitchen</h2>

  <div class="instagram-wrapper">
    <iframe src="https://www.instagram.com/buggsiebakingco/embed"></iframe>
  </div>
</section>

<footer>
  © 2026 Buggsie Baking Co. • Small Batch • Big Flavor
</footer>

</body>
</html>
