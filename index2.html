<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Buggsie Baking Co.</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #fffaf5;
  color: #333;
}

/* HEADER */
header {
  text-align: center;
  padding: 40px;
}

.logo {
  font-family: 'Pacifico', cursive;
  font-size: 40px;
  color: #40cfcf;
}

/* MENU */
.menu {
  max-width: 800px;
  margin: auto;
  padding: 10px;
}

.item {
  display: flex;
  justify-content: space-between;
  padding: 15px;
  border-bottom: 1px dashed #ddd;
  cursor: pointer;
}

.item:hover {
  background: #fff3cc;
}

/* CART */
.cart {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: white;
  box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
  padding: 15px;
}

.cart-items {
  max-height: 120px;
  overflow-y: auto;
  font-size: 14px;
}

.total {
  font-weight: bold;
  margin-top: 10px;
}

.btn {
  display: block;
  margin-top: 10px;
  padding: 12px;
  background: #f5d742;
  text-align: center;
  border-radius: 25px;
  font-weight: 600;
  text-decoration: none;
  color: #333;
}
</style>
</head>

<body>

<header>
  <div class="logo">buggsie</div>
  <p>Tap to add • Build your order</p>
</header>

<div class="menu">

  <div class="item" onclick="addItem('Chocolate Chip Cookie',3)">
    <span>Chocolate Chip</span>
    <span>$3</span>
  </div>

  <div class="item" onclick="addItem('Snickerdoodle',3)">
    <span>Snickerdoodle</span>
    <span>$3</span>
  </div>

  <div class="item" onclick="addItem('Fudge Brownie',4)">
    <span>Fudge Brownie</span>
    <span>$4</span>
  </div>

  <div class="item" onclick="addItem('6 Pack Cookies',16)">
    <span>6 Pack</span>
    <span>$16</span>
  </div>

</div>

<!-- CART -->
<div class="cart">
  <div class="cart-items" id="cartItems"></div>
  <div class="total" id="total">$0</div>
  <a href="#" class="btn" onclick="sendOrder()">Send Order via Instagram</a>
</div>

<script>
let cart = {};

function addItem(name, price) {
  if (!cart[name]) {
    cart[name] = { qty: 1, price: price };
  } else {
    cart[name].qty++;
  }
  updateCart();
}

function updateCart() {
  let output = "";
  let total = 0;

  for (let item in cart) {
    let qty = cart[item].qty;
    let price = cart[item].price;
    total += qty * price;

    output += `${item} x${qty} - $${qty * price}<br>`;
  }

  document.getElementById("cartItems").innerHTML = output;
  document.getElementById("total").innerText = "Total: $" + total;
}

function sendOrder() {
  let message = "Hi! I'd like to order:\n";

  for (let item in cart) {
    message += `${item} x${cart[item].qty}\n`;
  }

  message += "\nTotal: $" + document.getElementById("total").innerText.replace('Total: $','');

  let url = "https://www.instagram.com/direct/new/?text=" + encodeURIComponent(message);
  window.open(url, "_blank");
}
</script>

</body>
</html>
