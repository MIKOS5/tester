<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Teams Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-bottom: 10px;
    }

    input {
      padding: 10px;
      width: 300px;
      margin-bottom: 15px;
      border-radius: 6px;
      border: none;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #1e293b;
      border-radius: 10px;
      overflow: hidden;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #334155;
      text-align: left;
      font-size: 14px;
    }

    th {
      background: #111827;
      cursor: pointer;
      position: sticky;
      top: 0;
    }

    tr:hover {
      background: #334155;
    }

    a {
      color: #38bdf8;
      text-decoration: none;
    }

    .win-high {
      color: #22c55e;
      font-weight: bold;
    }

    .win-low {
      color: #ef4444;
    }
  </style>
</head>

<body>

<h1>🏟️ Teams Dashboard</h1>

<input type="text" id="search" placeholder="Search teams..." />

<table id="teamsTable">
  <thead>
    <tr>
      <th>Team</th>
      <th>Sport</th>
      <th>League</th>
      <th>Division</th>
      <th>Country</th>
      <th>Stadium</th>
      <th>Conference</th>
      <th>W</th>
      <th>L</th>
      <th>Win %</th>
      <th>Website</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbybcVX6Lv8EdXnDocZxTPM2xFYO0Zda_EoqOQQA6s5Rts67mIGIGLlKmi7vuZo__9W1/exec";

let teamsData = [];

async function loadData() {
  const res = await fetch(API_URL);
  const json = await res.json();

  // Teams sheet comes as raw rows
  teamsData = json.teams || [];

  renderTable(teamsData);
}

function renderTable(data) {
  const tbody = document.querySelector("#teamsTable tbody");
  tbody.innerHTML = "";

  data.slice(1).forEach(row => {
    const [
      time, teamID, team, sport, league, country,
      stadium, website, division, description,
      conference, wins, losses, winPct
    ] = row;

    const winClass = parseFloat(winPct) >= 0.5 ? "win-high" : "win-low";

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td><strong>${team || ""}</strong></td>
      <td>${sport || ""}</td>
      <td>${league || ""}</td>
      <td>${division || ""}</td>
      <td>${country || ""}</td>
      <td>${stadium || ""}</td>
      <td>${conference || ""}</td>
      <td>${wins || 0}</td>
      <td>${losses || 0}</td>
      <td class="${winClass}">${winPct || ""}</td>
      <td>${website ? `<a href="${website}" target="_blank">Link</a>` : ""}</td>
    `;

    tbody.appendChild(tr);
  });
}

// Search filter
document.getElementById("search").addEventListener("input", function(e) {
  const q = e.target.value.toLowerCase();

  const filtered = teamsData.filter(row =>
    JSON.stringify(row).toLowerCase().includes(q)
  );

  renderTable(filtered);
});

loadData();
</script>

</body>
</html>
