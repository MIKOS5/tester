<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Sports xDashboard</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0b0b;
  color: white;
}

/* HEADER */
.header {
  background: #111;
  padding: 15px 20px;
  font-size: 22px;
  font-weight: bold;
  color: #ff3c3c;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

button {
  background: #222;
  color: white;
  border: 1px solid #333;
  padding: 8px 12px;
  border-radius: 6px;
  cursor: pointer;
}

/* LAYOUT */
.container {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 15px;
  padding: 15px;
}

/* CARD BASE */
.card {
  background: #151515;
  border-radius: 10px;
  padding: 10px;
  box-shadow: 0 0 10px rgba(0,0,0,0.4);
}

.title {
  font-size: 16px;
  color: #ff3c3c;
  margin-bottom: 10px;
}

/* NEWS */
.news-item {
  border-bottom: 1px solid #222;
  padding: 10px 0;
}

.news-title {
  font-weight: bold;
  font-size: 14px;
}

.news-meta {
  font-size: 11px;
  color: #aaa;
}

/* LIVE GAMES */
.game {
  background: #1c1c1c;
  padding: 10px;
  border-radius: 8px;
  margin-bottom: 10px;
}

.teams {
  display: flex;
  justify-content: space-between;
  font-size: 14px;
}

.score {
  font-size: 18px;
  font-weight: bold;
  color: #00ff88;
}

/* TEAMS */
.team {
  background: #1a1a1a;
  padding: 10px;
  margin-bottom: 10px;
  border-radius: 8px;
}

.team-name {
  font-weight: bold;
}

.small {
  font-size: 12px;
  color: #aaa;
}

/* RESPONSIVE */
@media (max-width: 900px) {
  .container {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="header">
  🏟 Sports Center
  <button onclick="loadData()">Refresh</button>
</div>

<div class="container">

  <!-- NEWS -->
  <div class="card">
    <div class="title">📰 Top News</div>
    <div id="news"></div>
  </div>

  <!-- LIVE -->
  <div class="card">
    <div class="title">📊 Live Games</div>
    <div id="live"></div>
  </div>

  <!-- TEAMS -->
  <div class="card">
    <div class="title">👥 Teams</div>
    <div id="teams"></div>
  </div>

</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbybcVX6Lv8EdXnDocZxTPM2xFYO0Zda_EoqOQQA6s5Rts67mIGIGLlKmi7vuZo__9W1/exec";

async function loadData() {
  const res = await fetch(API);
  const data = await res.json();

  renderNews(data.news);
  renderLive(data.live);
  renderTeams(data.teams);
}

/* ---------------- NEWS ---------------- */
function renderNews(news) {
  let html = "";

  if (!news || news.length === 0) {
    document.getElementById("news").innerHTML = "No news";
    return;
  }

  news.slice(1).forEach(n => {
    html += `
      <div class="news-item">
        <div class="news-title">${n[3] || ""}</div>
        <div class="news-meta">${n[4] || ""}</div>
      </div>
    `;
  });

  document.getElementById("news").innerHTML = html;
}

/* ---------------- LIVE GAMES ---------------- */
function renderLive(games) {
  let html = "";

  if (!games || games.length === 0) {
    document.getElementById("live").innerHTML = "No games";
    return;
  }

  games.forEach(g => {
    html += `
      <div class="game">
        <div class="teams">
          <div>${g.away.team}</div>
          <div class="score">${g.away.score}</div>
        </div>
        <div class="teams">
          <div>${g.home.team}</div>
          <div class="score">${g.home.score}</div>
        </div>
        <div class="small">${g.status} • ${g.sport}</div>
      </div>
    `;
  });

  document.getElementById("live").innerHTML = html;
}

/* ---------------- TEAMS ---------------- */
function renderTeams(teams) {
  let html = "";

  if (!teams || teams.length === 0) {
    document.getElementById("teams").innerHTML = "No teams";
    return;
  }

  // skip header row if sheet format
  teams.slice(1).forEach(t => {
    html += `
      <div class="team">
        <div class="team-name">${t[2]} (${t[3]})</div>
        <div class="small">
          League: ${t[4]}<br>
          Record: ${t[13]}-${t[14]} • Win% ${t[15]}
        </div>
      </div>
    `;
  });

  document.getElementById("teams").innerHTML = html;
}

loadData();
setInterval(loadData, 30000); // auto refresh every 30s
</script>

</body>
</html>
