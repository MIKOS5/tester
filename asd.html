<!DOCTYPE html>
<html>
<head>
  <title>Live Sports x Dashboard</title>
  <style>
    body { font-family: Arial; background:#0f172a; color:white; padding:20px; }
    h2 { margin-top:30px; color:#38bdf8; }
    .box { background:#1e293b; padding:10px; margin:5px 0; border-radius:8px; }
  </style>
</head>
<body>

<h1>⚡ LIVE SPORTS DASHBOARD</h1>

<h2>LIVE SCORES</h2>
<div id="live">Loading...</div>

<h2>GAMES</h2>
<div id="games">Loading...</div>

<h2>STANDINGS</h2>
<div id="standings">Loading...</div>

<h2>TEAMS</h2>
<div id="teams">Loading...</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbybcVX6Lv8EdXnDocZxTPM2xFYO0Zda_EoqOQQA6s5Rts67mIGIGLlKmi7vuZo__9W1/exec";

async function load() {
  const res = await fetch(API);
  const data = await res.json();

  renderLive(data.live);
  renderGames(data.games);
  renderStandings(data.standings);
  renderTeams(data.teams);
}

function renderLive(items) {
  const el = document.getElementById("live");
  if (!items.length) return el.innerHTML = "No data";

  el.innerHTML = items.map(i => `
    <div class="box">
      ${i.sport} | ${i.status} | ${i.clock}<br>
      ${i.away.team} ${i.away.score} vs ${i.home.team} ${i.home.score}
    </div>
  `).join("");
}

function renderGames(items) {
  const el = document.getElementById("games");
  if (!items.length) return el.innerHTML = "No data";

  el.innerHTML = items.map(i => `
    <div class="box">
      ${i.sport} | ${i.status}<br>
      ${i.away} ${i.awayScore} vs ${i.home} ${i.homeScore}
    </div>
  `).join("");
}

function renderStandings(items) {
  const el = document.getElementById("standings");
  if (!items.length) return el.innerHTML = "No data";

  el.innerHTML = items.map(i => `
    <div class="box">
      ${i.league} - ${i.team}<br>
      W:${i.wins} L:${i.losses} PCT:${i.winPct}
    </div>
  `).join("");
}

function renderTeams(items) {
  const el = document.getElementById("teams");
  if (!items.length) return el.innerHTML = "No data";

  el.innerHTML = items.map(i => `
    <div class="box">
      ${i.sport} - ${i.name}
    </div>
  `).join("");
}

load();
setInterval(load, 30000);
</script>

</body>
</html>
