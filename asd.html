<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Live Sports Dashboard</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
}

header {
  padding: 16px;
  background: #111827;
  font-size: 20px;
  font-weight: bold;
  text-align: center;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  padding: 12px;
}

.card {
  background: #1f2937;
  border-radius: 10px;
  padding: 12px;
  overflow: hidden;
}

h2 {
  margin: 0 0 10px 0;
  font-size: 14px;
  color: #38bdf8;
}

.item {
  font-size: 12px;
  padding: 6px 0;
  border-bottom: 1px solid #374151;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.badge {
  color: #22c55e;
}
</style>
</head>

<body>

<header>⚡ LIVE SPORTS DASHBOARD</header>

<div class="grid">

  <div class="card">
    <h2>LIVE SCORES</h2>
    <div id="live"></div>
  </div>

  <div class="card">
    <h2>GAMES</h2>
    <div id="games"></div>
  </div>

  <div class="card">
    <h2>STANDINGS</h2>
    <div id="standings"></div>
  </div>

  <div class="card">
    <h2>TEAMS</h2>
    <div id="teams"></div>
  </div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbybcVX6Lv8EdXnDocZxTPM2xFYO0Zda_EoqOQQA6s5Rts67mIGIGLlKmi7vuZo__9W1/exec";

async function load(section, elementId) {
  try {
    const res = await fetch(`${API_URL}?action=${section}`);
    const data = await res.json();

    const el = document.getElementById(elementId);
    el.innerHTML = "";

    if (!Array.isArray(data)) {
      el.innerHTML = "<div class='item'>No data</div>";
      return;
    }

    data.slice(0, 20).forEach(row => {
      const div = document.createElement("div");
      div.className = "item";

      // Clean display instead of raw JSON
      if (section === "live") {
        div.innerHTML = `
          <span class="badge">${row[2] || ""}</span> |
          ${row[3] || ""} vs ${row[4] || ""} |
          ${row[5] || ""} - ${row[6] || ""} |
          ${row[7] || ""}
        `;
      } else if (section === "games") {
        div.innerText = `${row[2]} | ${row[3]} | ${row[5]} vs ${row[6]}`;
      } else if (section === "standings") {
        div.innerText = `${row[2]} - W:${row[3]} L:${row[4]} PCT:${row[5]}`;
      } else {
        div.innerText = JSON.stringify(row);
      }

      el.appendChild(div);
    });

  } catch (e) {
    console.log("ERROR:", e);
  }
}

function refresh() {
  load("live", "live");
  load("games", "games");
  load("standings", "standings");
  load("teams", "teams");
}

refresh();
setInterval(refresh, 15000);

</script>

</body>
</html>
