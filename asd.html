<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Sports API Dashboard</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: #eee;
      margin: 0;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    h1 {
      color: #4dd0e1;
      margin: 0;
    }

    button {
      background: #222;
      color: white;
      border: 1px solid #444;
      padding: 10px 14px;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #333;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 25px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: #161616;
    }

    th, td {
      border: 1px solid #2a2a2a;
      padding: 6px;
      font-size: 13px;
      text-align: left;
    }

    th {
      background: #1f1f1f;
      color: #4dd0e1;
      position: sticky;
      top: 0;
    }

    tr:nth-child(even) {
      background: #141414;
    }

    .card {
      border: 1px solid #2a2a2a;
      padding: 10px;
      border-radius: 6px;
      background: #151515;
    }

    .title {
      font-size: 18px;
      margin-bottom: 8px;
      color: #4dd0e1;
    }
  </style>
</head>

<body>

<header>
  <h1>🏟 Sports Dashboard</h1>
  <button onclick="loadData()">Refresh</button>
</header>

<div class="grid">

  <div class="card">
    <div class="title">📰 News</div>
    <div id="news"></div>
  </div>

  <div class="card">
    <div class="title">📊 Sports</div>
    <div id="sports"></div>
  </div>

  <div class="card">
    <div class="title">👥 Teams</div>
    <div id="teams"></div>
  </div>

</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbybcVX6Lv8EdXnDocZxTPM2xFYO0Zda_EoqOQQA6s5Rts67mIGIGLlKmi7vuZo__9W1/exec";

async function loadData() {
  try {
    console.log("Fetching:", API);

    const res = await fetch(API);

    console.log("Status:", res.status);
    console.log("OK:", res.ok);

    const text = await res.text();

    console.log("RAW RESPONSE:");
    console.log(text);

    const data = JSON.parse(text);

    renderTable("news", data.news);
    renderTable("sports", data.sports);
    renderTable("teams", data.teams);

  } catch (err) {
    console.error("FULL ERROR:", err);
    alert("Failed to load data. Check console.");
  }
}

function renderTable(id, data) {
  if (!data || data.length === 0) {
    document.getElementById(id).innerHTML = "<p>No data</p>";
    return;
  }

  let html = "<table><tr>";

  // headers
  data[0].forEach(h => html += `<th>${h}</th>`);
  html += "</tr>";

  // rows
  for (let i = 1; i < data.length; i++) {
    html += "<tr>";
    data[i].forEach(cell => html += `<td>${cell ?? ""}</td>`);
    html += "</tr>";
  }

  html += "</table>";
  document.getElementById(id).innerHTML = html;
}

// auto-load on open
loadData();
</script>

</body>
</html>
