<body>

<header>

<div class="header-inner">

<h1>🩺 Obvyris Health</h1>

Live health check for Obvyris pages, scripts,

<div class="empty">
Press "Run Health Check" to begin.

</main>


<script>

/*
=========================================================
OBVYRIS HEALTH MONITOR
=========================================================

The monitor begins with index99.html.

It discovers:

HTML
JS
CSS
JSON
M3U
images
API URLs
other internal resources

Important:

External resources may be marked "External"
because browsers cannot inspect their response without
CORS permission.

=========================================================
*/


const ROOT =
    location.origin +
    "/tester/";

const START_PAGE =
    ROOT + "index99.html";


let resources = [];

let visited = new Set();

let checking = false;


/*
=========================================================
RESOURCE TYPE
=========================================================
*/

function getType(url){

    const clean =
        url.split("?")[0]
            .split("#")[0]
            .toLowerCase();

    if(clean.endsWith(".html") ||
       clean.endsWith(".htm"))
        return "HTML";

    if(clean.endsWith(".js"))
        return "JS";

    if(clean.endsWith(".css"))
        return "CSS";

    if(clean.endsWith(".json"))
        return "JSON";

    if(clean.endsWith(".m3u") ||
       clean.endsWith(".m3u8"))
        return "M3U";

    if(clean.endsWith(".png") ||
       clean.endsWith(".jpg") ||
       clean.endsWith(".jpeg") ||
       clean.endsWith(".webp") ||
       clean.endsWith(".gif") ||
       clean.endsWith(".svg") ||
       clean.endsWith(".ico"))
        return "IMAGE";

    if(
        url.includes("/api/") ||
        url.includes("script.google.com") ||
        url.includes("googleapis.com")
    )
        return "API";

    return "RESOURCE";
}


/*
=========================================================
INTERNAL URL
=========================================================
*/

function isInternal(url){

    try{

        const parsed =
            new URL(url, location.href);

        return parsed.origin === location.origin &&
               parsed.pathname.startsWith("/tester/");

    }catch{

        return false;

    }

}


/*
=========================================================
ADD RESOURCE
=========================================================
*/

function addResource(url, source){

    try{

        const absolute =
            new URL(url, source).href;

        if(
            !absolute.startsWith("http://") &&
            !absolute.startsWith("https://")
        )
            return;

        if(
            absolute.startsWith("data:") ||
            absolute.startsWith("javascript:")
        )
            return;

        const exists =
            resources.some(
                r => r.url === absolute
            );

        if(exists)
            return;

        resources.push({

            url:absolute,

            type:getType(absolute),

            source:source,

            status:"checking",

            message:"Waiting..."

        });

    }catch{

    }

}


/*
=========================================================
EXTRACT URLS FROM HTML
=========================================================
*/

function extractHTML(html, source){

    const parser =
        new DOMParser();

    const doc =
        parser.parseFromString(
            html,
            "text/html"
        );


    /*
    Links
    */

    doc.querySelectorAll(
        "a[href]"
    ).forEach(el => {

        addResource(
            el.getAttribute("href"),
            source
        );

    });


    /*
    Scripts
    */

    doc.querySelectorAll(
        "script[src]"
    ).forEach(el => {

        addResource(
            el.getAttribute("src"),
            source
        );

    });


    /*
    Stylesheets
    */

    doc.querySelectorAll(
        "link[href]"
    ).forEach(el => {

        addResource(
            el.getAttribute("href"),
            source
        );

    });


    /*
    Images
    */

    doc.querySelectorAll(
        "img[src]"
    ).forEach(el => {

        addResource(
            el.getAttribute("src"),
            source
        );

    });


    /*
    Video
    */

    doc.querySelectorAll(
        "video[src],source[src]"
    ).forEach(el => {

        addResource(
            el.getAttribute("src"),
            source
        );

    });


    /*
    Audio
    */

    doc.querySelectorAll(
        "audio[src]"
    ).forEach(el => {

        addResource(
            el.getAttribute("src"),
            source
        );

    });


    /*
    Search HTML source for API,
    JSON and M3U URLs.
    */

    const sourceText =
        html.match(
            /https?:\/\/[^\s"'<>]+/g
        ) || [];


    sourceText.forEach(url => {

        addResource(
            url,
            source
        );

    });

}


/*
=========================================================
CRAWL INTERNAL HTML
=========================================================
*/

async function crawlPage(url){

    if(visited.has(url))
        return;

    visited.add(url);

    try{

        const response =
            await fetch(
                url,
                {
                    cache:"no-store"
                }
            );

        if(!response.ok)
            return;

        const text =
            await response.text();

        extractHTML(
            text,
            url
        );

    }catch(error){

        console.warn(
            "Could not crawl:",
            url,
            error
        );

    }

}


/*
=========================================================
DISCOVER SITE
=========================================================
*/

async function discoverSite(){

    resources = [];

    visited.clear();


    addResource(
        START_PAGE,
        location.href
    );


    await crawlPage(
        START_PAGE
    );


    /*
    Keep crawling newly discovered
    internal HTML pages.
    */

    let changed = true;

    while(changed){

        changed = false;

        const htmlPages =
            resources.filter(
                r =>
                    r.type === "HTML" &&
                    isInternal(r.url)
            );


        for(const resource of htmlPages){

            if(!visited.has(resource.url)){

                const before =
                    resources.length;

                await crawlPage(
                    resource.url
                );

                if(
                    resources.length >
                    before
                )
                    changed = true;

            }

        }

    }

}


/*
=========================================================
CHECK RESOURCE
=========================================================
*/

async function checkResource(resource){

    /*
    External URLs

    Browser security may prevent reading
    their response.
    */

    if(!isInternal(resource.url)){

        resource.status =
            "external";

        resource.message =
            "External resource — browser CORS may prevent verification.";

        return;

    }


    try{

        const start =
            performance.now();


        const response =
            await fetch(
                resource.url,
                {
                    method:"GET",
                    cache:"no-store"
                }
            );


        const time =
            Math.round(
                performance.now() -
                start
            );


        if(response.ok){

            resource.status =
                "ok";

            resource.message =
                response.status +
                " OK • " +
                time +
                " ms";

        }else{

            resource.status =
                "error";

            resource.message =
                "HTTP " +
                response.status +
                " • " +
                response.statusText;

        }


    }catch(error){

        resource.status =
            "error";

        resource.message =
            error.message ||
            "Request failed";

    }

}


/*
=========================================================
RUN CHECK
=========================================================
*/

async function runHealthCheck(){

    if(checking)
        return;

    checking = true;


    document.getElementById(
        "results"
    ).innerHTML =
        '<div class="empty">Discovering Obvyris resources...</div>';


    /*
    Discover everything reachable
    from index99.html.
    */

    await discoverSite();


    /*
    Remove duplicates.
    */

    const map =
        new Map();

    resources.forEach(resource => {

        map.set(
            resource.url,
            resource
        );

    });

    resources =
        [...map.values()];


    render();


    /*
    Check each resource.
    */

    for(
        let i = 0;
        i < resources.length;
        i++
    ){

        await checkResource(
            resources[i]
        );


        const percent =
            Math.round(
                ((i + 1) /
                resources.length) *
                100
            );


        document.getElementById(
            "progressFill"
        ).style.width =
            percent + "%";


        render();

    }


    checking = false;

}


/*
=========================================================
RENDER
=========================================================
*/

function render(){

    const search =
        document.getElementById(
            "search"
        ).value
        .toLowerCase();


    const filter =
        document.getElementById(
            "filter"
        ).value;


    const filtered =
        resources.filter(resource => {

            const matchesSearch =
                !search ||
                resource.url
                    .toLowerCase()
                    .includes(search) ||
                resource.type
                    .toLowerCase()
                    .includes(search);


            const matchesFilter =
                filter === "all" ||
                resource.status === filter;


            return (
                matchesSearch &&
                matchesFilter
            );

        });


    /*
    Counters
    */

    const working =
        resources.filter(
            r => r.status === "ok"
        ).length;

    const broken =
        resources.filter(
            r => r.status === "error"
        ).length;

    const external =
        resources.filter(
            r => r.status === "external"
        ).length;


    document.getElementById(
        "totalCount"
    ).textContent =
        resources.length;


    document.getElementById(
        "workingCount"
    ).textContent =
        working;


    document.getElementById(
        "brokenCount"
    ).textContent =
        broken;


    document.getElementById(
        "externalCount"
    ).textContent =
        external;


    /*
    Results
    */

    const container =
        document.getElementById(
            "results"
        );


    if(!filtered.length){

        container.innerHTML =
            '<div class="empty">No resources found.</div>';

        return;

    }


    /*
    Group by type.
    */

    const groups = {};


    filtered.forEach(resource => {

        if(!groups[resource.type])
            groups[resource.type] = [];

        groups[resource.type]
            .push(resource);

    });


    let html = "";


    Object.keys(groups)
        .sort()
        .forEach(type => {

            html += `
                <div class="category">
                    ${type}
                </div>
            `;


            groups[type]
                .forEach(resource => {

                    const label =
                        resource.status === "ok"
                            ? "● WORKING"
                            :
                        resource.status === "error"
                            ? "● BROKEN"
                            :
                        resource.status === "external"
                            ? "● EXTERNAL"
                            :
                            "● CHECKING";


                    html += `

                        <div class="resource">

                            <div class="type">
                                ${resource.type}
                            </div>

                            <div class="name">
                                ${getName(resource.url)}
                            </div>

                            <div class="url">
                                ${escapeHTML(resource.url)}
                            </div>

                            <div class="status ${resource.status}">
                                ${label}
                            </div>

                            <div class="details">
                                ${escapeHTML(resource.message)}
                                <br>
                                Source:
                                ${escapeHTML(resource.source)}
                            </div>

                        </div>

                    `;

                });

        });


    container.innerHTML =
        html;

}


/*
=========================================================
NAME
=========================================================
*/

function getName(url){

    try{

        const parsed =
            new URL(url);

        const path =
            parsed.pathname;

        const last =
            path.split("/")
                .filter(Boolean)
                .pop();


        return last ||
               parsed.hostname;

    }catch{

        return url;

    }

}


/*
=========================================================
ESCAPE HTML
=========================================================
*/

function escapeHTML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/*
=========================================================
LIVE FILTERING
=========================================================
*/

document.getElementById(
    "search"
).addEventListener(
    "input",
    render
);


document.getElementById(
    "filter"
).addEventListener(
    "change",
    render
);


/*
=========================================================
AUTOMATIC CHECK

Uncomment this if you want the page
to automatically scan when opened.

=========================================================
*/

// runHealthCheck();

</script>

</body>
