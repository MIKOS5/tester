<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Obvyris Weather Test</title>

<style>

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #101820;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.weather {
    width: 90%;
    max-width: 600px;
    padding: 30px;
    border-radius: 20px;
    background: #182532;
    box-shadow: 0 10px 40px rgba(0,0,0,.4);
    text-align: center;
}

h1 {
    margin-top: 0;
}

.icon {
    font-size: 70px;
    margin: 15px;
}

.temperature {
    font-size: 64px;
    font-weight: bold;
}

.condition {
    font-size: 22px;
    margin-bottom: 20px;
}

.details {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.detail {
    padding: 15px;
    background: #223444;
    border-radius: 12px;
}

.label {
    font-size: 13px;
    opacity: .7;
}

.value {
    font-size: 20px;
    margin-top: 5px;
}

#status {
    margin-top: 20px;
    opacity: .7;
}

</style>

</head>

<body>

<div class="weather">

    <h1>🌤️ Obvyris Weather</h1>

    <div class="icon" id="icon">🌤️</div>

    <div class="temperature" id="temperature">
        --°
    </div>

    <div class="condition" id="condition">
        Loading weather...
    </div>

    <div class="details">

        <div class="detail">
            <div class="label">FEELS LIKE</div>
            <div class="value" id="feels">--°</div>
        </div>

        <div class="detail">
            <div class="label">HUMIDITY</div>
            <div class="value" id="humidity">--%</div>
        </div>

        <div class="detail">
            <div class="label">WIND</div>
            <div class="value" id="wind">-- mph</div>
        </div>

        <div class="detail">
            <div class="label">LOCATION</div>
            <div class="value" id="location">Detecting...</div>
        </div>

    </div>

    <div id="status">
        Getting your location...
    </div>

</div>


<script>

function weatherDescription(code) {

    const weather = {

        0: ["Clear Sky", "☀️"],

        1: ["Mainly Clear", "🌤️"],
        2: ["Partly Cloudy", "⛅"],
        3: ["Overcast", "☁️"],

        45: ["Fog", "🌫️"],
        48: ["Fog", "🌫️"],

        51: ["Light Drizzle", "🌦️"],
        53: ["Drizzle", "🌦️"],
        55: ["Heavy Drizzle", "🌧️"],

        61: ["Light Rain", "🌦️"],
        63: ["Rain", "🌧️"],
        65: ["Heavy Rain", "🌧️"],

        71: ["Light Snow", "🌨️"],
        73: ["Snow", "❄️"],
        75: ["Heavy Snow", "❄️"],

        80: ["Rain Showers", "🌦️"],
        81: ["Rain Showers", "🌧️"],
        82: ["Heavy Rain Showers", "🌧️"],

        85: ["Snow Showers", "🌨️"],
        86: ["Heavy Snow Showers", "❄️"],

        95: ["Thunderstorm", "⛈️"],
        96: ["Thunderstorm", "⛈️"],
        99: ["Thunderstorm", "⛈️"]

    };

    return weather[code] || ["Unknown", "🌤️"];
}


function getWeather(latitude, longitude) {

    const url =
        "https://api.open-meteo.com/v1/forecast" +
        "?latitude=" + latitude +
        "&longitude=" + longitude +
        "&current=" +
        "temperature_2m," +
        "apparent_temperature," +
        "relative_humidity_2m," +
        "wind_speed_10m," +
        "weather_code," +
        "is_day" +
        "&temperature_unit=fahrenheit" +
        "&wind_speed_unit=mph" +
        "&timezone=auto";


    fetch(url)

        .then(response => {

            if (!response.ok) {
                throw new Error("Weather API error");
            }

            return response.json();

        })

        .then(data => {

            const current = data.current;

            const weather =
                weatherDescription(current.weather_code);


            document.getElementById("temperature")
                .textContent =
                Math.round(current.temperature_2m) + "°";


            document.getElementById("feels")
                .textContent =
                Math.round(current.apparent_temperature) + "°";


            document.getElementById("humidity")
                .textContent =
                current.relative_humidity_2m + "%";


            document.getElementById("wind")
                .textContent =
                Math.round(current.wind_speed_10m) + " mph";


            document.getElementById("condition")
                .textContent =
                weather[0];


            document.getElementById("icon")
                .textContent =
                weather[1];


            document.getElementById("location")
                .textContent =
                current.timezone || "Local";


            document.getElementById("status")
                .textContent =
                "Weather updated";


        })

        .catch(error => {

            console.error(error);

            document.getElementById("condition")
                .textContent =
                "Weather unavailable";

            document.getElementById("status")
                .textContent =
                "Could not load weather";

        });

}


function getLocation() {

    if (!navigator.geolocation) {

        document.getElementById("status")
            .textContent =
            "Geolocation is not supported.";

        return;

    }


    navigator.geolocation.getCurrentPosition(

        position => {

            const latitude =
                position.coords.latitude;

            const longitude =
                position.coords.longitude;


            document.getElementById("status")
                .textContent =
                "Loading local weather...";


            getWeather(latitude, longitude);

        },

        error => {

            console.error(error);

            document.getElementById("status")
                .textContent =
                "Location permission denied.";

        }

    );

}


getLocation();

</script>

</body>
</html>
```
