<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">


<title>
Obvyris Universal Player
</title>


<link rel="stylesheet" href="css/winamp.css">


</head>


<body>


<header id="appHeader">

<h1>
🎵 Obvyris Media System
</h1>

<p>
Universal Archive / Radio / Video Player
</p>

</header>




<main>


<div id="player-container">

Loading Obvyris Player...

</div>



</main>





<!-- COMPONENT LOADER -->

<script>


async function loadPlayer(){


try{


let response = await fetch(
"components/player.html"
);



let html = await response.text();



document.getElementById(
"player-container"
).innerHTML = html;



console.log(
"Obvyris Player Loaded"
);



}

catch(error){


console.error(
"Player load failed:",
error
);



document.getElementById(
"player-container"
).innerHTML =

"Player failed to load";


}


}



loadPlayer();



</script>






<!-- CORE ENGINE -->

<script src="js/playlist.js"></script>

<script src="js/player.js"></script>

<script src="js/mp3-loader.js"></script>

<script src="js/archive-search.js"></script>





</body>


</html>
