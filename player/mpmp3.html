<script>


// ======================================
// ARCHIVE SEARCH ENGINE
// ======================================


let currentPage = 0;

let pageSize = 25;

let tracks = [];
let allTracks = [];

let currentCollection = "";


let currentPlayingIndex = -1;


// ======================================
// OBVYRIS PLAYLIST API
// ======================================

const PLAYLIST_API =
    "https://script.google.com/macros/s/AKfycbzmpHIXlzgUSe3VXqL2LjZMnNgas3ELjhrUjC1NMGvPciwx25jf6zLoR5pyoXTHnljN/exec";


// ======================================
// LOAD PLAYLIST LIST
// ======================================

async function loadPlaylistList(){

    const select =
        document.getElementById("playlistSelect");

    const status =
        document.getElementById("status");

    status.innerHTML =
        "Loading playlists...";

    try{

        const response =
            await fetch(
                PLAYLIST_API +
                "?action=playlists"
            );

        const data =
            await response.json();

        if(!data.success){

            throw new Error(
                data.error ||
                "Playlist API failed"
            );

        }

        select.innerHTML =
            '<option value="">Select Playlist</option>';

        data.playlists.forEach(function(playlist){

    const option =
        document.createElement("option");

    option.value =
        playlist.id;

    option.textContent =
        playlist.name;

    select.appendChild(option);

});

        status.innerHTML =
            "Found " +
            data.playlists.length +
            " playlists";

    }catch(error){

        console.error(
            "Playlist API error:",
            error
        );

        status.innerHTML =
            "Playlist loading failed: " +
            error.message;

    }

}


// ======================================
// LOAD SELECTED PLAYLIST
// ======================================

async function loadSelectedPlaylist(){

    const select =
        document.getElementById("playlistSelect");

    const playlistID =
        select.value.trim();

    const status =
        document.getElementById("status");

    if(!playlistID){

        status.innerHTML =
            "Select a playlist first";

        return;

    }

    status.innerHTML =
        "Loading Playlist " +
        playlistID +
        "...";

    try{

        const response =
            await fetch(
                PLAYLIST_API +
                "?action=playlist&id=" +
                encodeURIComponent(playlistID)
            );

        const data =
            await response.json();

        if(!data.success){

            throw new Error(
                data.error ||
                "Unable to load playlist"
            );

        }

        const playlistTracks =
            data.tracks.map(function(track){

                return {

                    name:
                        track.song ||
                        "Unknown Track",

                    artist:
                        track.artist ||
                        "Unknown Artist",

                    album:
                        track.album ||
                        "Unknown Album",

                    size:
                        "--",

                    url:
                        track.url ||
                        "",

                    playlistID:
                        track.playlistID,

                    position:
                        track.position,

                    source:
                        "Obvyris Playlist"

                };

            });

        allTracks =
            playlistTracks;

        tracks =
            [...playlistTracks];

        currentPlayingIndex = -1;

        queueIndex = 0;

        renderTracks();

        status.innerHTML =
            "Loaded Playlist " +
            playlistID +
            " — " +
            playlistTracks.length +
            " tracks";

    }catch(error){

        console.error(
            "Playlist load error:",
            error
        );

        status.innerHTML =
            "Playlist failed: " +
            error.message;

    }

}



async function replaceCurrentPlaylist(){

const select =
    document.getElementById("playlistSelect");

const playlistID =
    select.value.trim();

const playlistName =
    select.options[select.selectedIndex].textContent.trim();

const status =
    document.getElementById("status");

if(!playlistID){

    status.innerHTML =
        "Select a playlist first";

    return;

}

const confirmed =
    confirm(
        'Replace the current playlist with "' +
        playlistName +
        '"?'
    );

if(!confirmed)
    return;

status.innerHTML =
    "Replacing playlist: " +
    playlistName +
    "...";

try{

    const response =
        await fetch(
            PLAYLIST_API +
            "?action=playlist&id=" +
            encodeURIComponent(playlistID)
        );

    const data =
        await response.json();

    if(!data.success){

        throw new Error(
            data.error ||
            "Unable to load playlist"
        );

    }

    const newPlaylist =
        data.tracks.map(function(track){

            return {

                name:
                    track.song ||
                    "Unknown Track",

                artist:
                    track.artist ||
                    "Unknown Artist",

                album:
                    track.album ||
                    "Unknown Album",

                size:
                    "--",

                url:
                    track.url ||
                    "",

                playlistID:
                    track.playlistID ||
                    playlistID,

                position:
                    track.position,

                source:
                    "Obvyris Playlist"

            };

        });

    if(newPlaylist.length === 0){

        status.innerHTML =
            "Playlist is empty";

        return;

    }

    queue =
        [...newPlaylist];

    queueIndex = 0;

    currentPlayingIndex = -1;

    saveQueue();

    renderQueue();

    showWinamp();

    status.innerHTML =
        'Replaced current playlist with "' +
        playlistName +
        '" — ' +
        newPlaylist.length +
        ' tracks';

}catch(error){

    console.error(
        "Replace playlist error:",
        error
    );

    status.innerHTML =
        "Playlist replacement failed: " +
        error.message;

}

}


 
async function searchArchive(page){

    currentPage = page;

    let search =
        document.getElementById("search")
        .value
        .trim();

    let creator =
        document.getElementById("creator")
        .value
        .trim();

    let sort =
        document.getElementById("sort")
        .value;


    /*
    ======================================
    ARCHIVE SEARCH
    Creator is the PRIMARY search.
    The normal search field is NOT sent
    to Archive.
    ======================================
    */

    let query = "mediatype:audio";


    if(creator){

        query +=
        ' AND creator:"' +
        creator +
        '"';

    }


    let url =

        "https://archive.org/advancedsearch.php?q="

        +

        encodeURIComponent(query)

        +

        "&fl[]=identifier,title,creator,description,date"

        +

        "&rows="

        +

        pageSize

        +

        "&start="

        +

        (page * pageSize)

        +

        "&sort[]="

        +

        encodeURIComponent(sort)

        +

        "&output=json";


    document.getElementById("status").innerHTML =
        "Searching Archive...";


    try{

        let response = await fetch(url);

        let data = await response.json();


        document.getElementById("status").innerHTML =

            "Found "

            +

            data.response.numFound

            +

            " audio collections. Scanning MP3 files...";


        await loadMP3FromCollections(
            data.response.docs
        );


    }catch(err){

        console.error(err);

        document.getElementById("status").innerHTML =
            "Archive search failed.";

    }

}



// ======================================
// PLAYER FULLSCREEN
// ======================================

async function togglePlayerFullscreen(){

    const player =
        document.getElementById("winampPlayer");

    const button =
        document.getElementById("fullscreenButton");


    /*
    ======================================
    EXIT FULLSCREEN
    ======================================
    */

    if(document.fullscreenElement){

        try{

            await document.exitFullscreen();

        }catch(error){

            console.log(
                "Unable to exit fullscreen:",
                error
            );

        }

        return;

    }


    /*
    ======================================
    ENTER FULLSCREEN
    ======================================
    */

    try{

        if(player.requestFullscreen){

            await player.requestFullscreen();

        }else{

            /*
            Fallback for browsers
            without Fullscreen API
            */

            player.classList.add("playerFullscreen");

        }

    }catch(error){

async function loadMP3FromCollections(items){

    let foundTracks = [];

    document.getElementById("status").innerHTML =
        "Scanning collections for MP3 files...";


    for(const item of items){

        try{

            let response = await fetch(
                "https://archive.org/metadata/" +
                item.identifier
            );

            let data = await response.json();


            data.files.forEach(file=>{

                let name = file.name || "";


                if(name.toLowerCase().endsWith(".mp3")){

                    foundTracks.push({

                        name:name,

                        artist:
                            data.metadata.creator ||
                            "Unknown",

                        album:
                            data.metadata.title ||
                            "Unknown",

                        size:
                            formatSize(file.size),

                        url:
                            "https://archive.org/download/"
                            +
                            item.identifier
                            +
                            "/"
                            +
                            encodeURIComponent(name)

                    });

                }

            });


        }catch(err){

            console.log(err);

        }

    }


    /*
    ======================================
    SAVE COMPLETE CREATOR RESULTS
    ======================================
    */

    allTracks = foundTracks;


    /*
    ======================================
    APPLY SONG FILTER
    ======================================
    */

    filterTracks();


}

function filterTracks(){

    let filter =
        document.getElementById("search")
        .value
        .trim()
        .toLowerCase();


    /*
    No filter = show everything
    */

    if(!filter){

        tracks = [...allTracks];

    }else{

        /*
        Search ONLY the Song column
        */

        tracks = allTracks.filter(track=>{

            let song =
                String(track.name || "")
                .toLowerCase();

            return song.includes(filter);

        });

    }


    document.getElementById("status").innerHTML =

        "Showing "

        +

        tracks.length

        +

        " MP3 tracks"

        +

        (
            allTracks.length !== tracks.length
            ?
            " (" + allTracks.length + " total)"
            :
            ""
        );


    renderTracks();

}

function loadM3U(event){

    let file = event.target.files[0];

    if(!file) return;

    let reader = new FileReader();

    reader.onload = function(e){

        let lines = e.target.result.split(/\r?\n/);

        let newQueue = [];

        let info = "";

        lines.forEach(line=>{

            line = line.trim();

            if(!line) return;

            if(line.startsWith("#EXTINF:")){

                info = line.substring(line.indexOf(",")+1);

                return;

            }

            if(line.startsWith("#")) return;

            let artist = "Unknown";
            let name = decodeURIComponent(line.split("/").pop());

            if(info){

                if(info.includes(" - ")){

                    let parts = info.split(" - ");

                    artist = parts.shift();

                    name = parts.join(" - ");

                }else{

                    name = info;

                }

            }

            newQueue.push({

                name:name,
                artist:artist,
                album:"Loaded M3U",
                url:line

            });

            info="";

        });

        queue = newQueue;

        saveQueue();

        renderQueue();

    };

    reader.readAsText(file);

}

function formatSize(bytes){



if(!bytes)

return "--";



bytes=parseInt(bytes);



let sizes=[

"B",

"KB",

"MB",

"GB"

];



let i =

Math.floor(

Math.log(bytes)

/

Math.log(1024)

);



return (

bytes /

Math.pow(1024,i)

)

.toFixed(1)

+

" "

+

sizes[i];



}




function escapeHTML(text){


return String(text)

.replaceAll("&","&amp;")

.replaceAll("<","&lt;")

.replaceAll(">","&gt;")

.replaceAll('"',"&quot;");


}

        item.addEventListener(

        );


        item.addEventListener(
        "dragover",
        dragOver
        );


        item.addEventListener(
        "drop",
        dropItem
        );


        item.addEventListener(
        "dragend",
        dragEnd
        );



        box.appendChild(item);

let dragIndex = null;



function dragStart(e){

    dragIndex =
    Number(this.dataset.index);


    this.classList.add("dragging");


}



function dragOver(e){

    e.preventDefault();

}



function dropItem(e){

    e.preventDefault();


    let dropIndex =
    Number(this.dataset.index);



    if(dragIndex === null ||
       dragIndex === dropIndex)
       return;



    let moved =
    queue.splice(
        dragIndex,
        1
    )[0];



    queue.splice(
        dropIndex,
        0,
        moved
    );



    saveQueue();


    renderQueue();



}



function dragEnd(){

    this.classList.remove(
        "dragging"
    );


    dragIndex=null;

}

function nextTrack(){

    if(queue.length === 0)
        return;

    queueIndex++;

    if(queueIndex >= queue.length)
        queueIndex = 0;

    playQueue(queueIndex);

}


// ======================================
// PREVIOUS TRACK
// ======================================

function previousTrack(){

    if(queue.length === 0)
        return;

    queueIndex--;

    if(queueIndex < 0)
        queueIndex = queue.length - 1;

    playQueue(queueIndex);

}

// ======================================

    nextTrack();

};


// ======================================
// ANDROID / CAR / BLUETOOTH / PC CONTROLS
// ======================================

if("mediaSession" in navigator){

    navigator.mediaSession.setActionHandler(
        "play",
        function(){

            audio.play();

        }
    );


    navigator.mediaSession.setActionHandler(
        "pause",
        function(){

            audio.pause();

        }
    );


    navigator.mediaSession.setActionHandler(
        "nexttrack",
        function(){

            nextTrack();

        }
    );


    navigator.mediaSession.setActionHandler(
        "previoustrack",
        function(){

            previousTrack();

        }
    );


    try{

        navigator.mediaSession.setActionHandler(
            "seekbackward",
            function(details){

                const skip =
                    details.seekOffset || 10;

                audio.currentTime =
                    Math.max(
                        0,
                        audio.currentTime - skip
                    );

            }
        );

    }catch(e){}


    try{

        navigator.mediaSession.setActionHandler(
            "seekforward",
            function(details){

                const skip =
                    details.seekOffset || 10;

                audio.currentTime =
                    Math.min(
                        audio.duration || Infinity,
                        audio.currentTime + skip
                    );

            }
        );

    }catch(e){}

}

return "0:00";

let sec = Math.floor(seconds % 60);


if(sec < 10)
sec = "0" + sec;


return min + ":" + sec;

}

el.addEventListener("mousemove",(e)=>{

tooltip.style.left = e.clientX + "px";

tooltip.style.top = e.clientY - 15 + "px";

});


el.addEventListener("mouseleave",()=>{

tooltip.style.opacity="0";

});


});


document.getElementById("search").addEventListener(
    "input",
    filterTracks
);
 
</script>


</body>

</html>
