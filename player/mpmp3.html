Obvyris Archive MP3 Engine

<style>

*{
box-sizing:border-box;
}

body{

margin:10px;

background:#070d16;

color:#d8e1ec;

font-family:Arial,Helvetica,sans-serif;

font-size:15px;

height:calc(100vh - 20px);

overflow:hidden;

}


h1{

color:#2793ff;

font-size:26px;

margin:5px 0 15px;

}


/* =====================
 SEARCH
===================== */

.controls{

background:#101923;

border:1px solid #26384f;

border-radius:10px;

padding:12px;

display:flex;

gap:10px;

flex-wrap:wrap;

}


input,
select,
button{

background:#17263a;

color:white;

border:1px solid #31465f;

border-radius:6px;

padding:10px 14px;

font-size:15px;

}


input{

width:280px;

}


button{

background:#2793ff;

border:none;

cursor:pointer;

font-weight:bold;

}


button:hover{

background:#55b5ff;

}


#status{

margin-top:12px;

color:#9aaabd;

}


/* =====================
 TABLE
===================== */

.musicTable{

margin-top:15px;

border:1px solid #26384f;

border-radius:10px;

overflow:hidden;

height:calc(100vh - 300px);

display:flex;

flex-direction:column;

}


.tableHeader{

display:grid;

grid-template-columns:

40px
minmax(260px,2fr)
180px
220px
90px
90px
90px;

background:#142338;

padding:12px;

color:#65c9ff;

font-weight:bold;

flex-shrink:0;

}



#tracks{

flex:1;

min-height:0;

overflow-y:auto;

overflow-x:hidden;

}



.trackRow{

display:grid;

grid-template-columns:

40px
minmax(260px,2fr)
180px
220px
90px
90px
90px;


padding:10px 12px;

border-top:1px solid #26384f;

}

background:#182b43;

}

}


.info{

color:#b5c3d5;

overflow:hidden;

text-overflow:ellipsis;

}


.smallButton{

padding:6px 10px;

font-size:13px;

}


a{

color:#65c9ff;

text-decoration:none;

}


/* =====================
 QUEUE
===================== */

#queuePanel{

position:fixed;

right:15px;

top:80px;

width:330px;

max-height:70vh;

overflow:auto;

background:rgba(16,25,35,.85);

backdrop-filter:blur(10px);

-webkit-backdrop-filter:blur(10px);

border:1px solid #26384f;

border-radius:10px;

padding:12px;

display:none;

z-index:9000;

}


/* =====================
 WINAMP PLAYER
===================== */

#winampPlayer{

position:fixed;

left:50px;

top:100px;

width:360px;

height:520px;

background:rgba(16,25,35,.55);

backdrop-filter:blur(12px);

-webkit-backdrop-filter:blur(12px);

border:2px solid rgba(39,147,255,.8);

border-radius:12px;

z-index:99999;

overflow:hidden;

}


#winampHeader{

height:40px;

background:rgba(20,35,56,.55);

color:#55b8ff;

font-weight:bold;

padding:10px;

cursor:move;

display:flex;

justify-content:space-between;

align-items:center;

}


.windowButtons{

display:flex;

gap:4px;

}



#winampHeader button{

width:18px;

height:18px;

padding:0;

font-size:11px;

}


#winampHeader button:first-child{

background:#7d5c00;

}


#winampHeader button:last-child{

background:#7f2020;

}


/* DISPLAY */

#winampDisplay{

padding:15px;

background:rgba(5,11,18,.45);

text-align:center;

}


#winampSong{

font-size:18px;

color:#55b8ff;

font-weight:bold;

}


#winampArtist{

color:#ddd;

margin-top:8px;

}


audio{

width:100%;

height:40px;

}


#seekBar{

width:100%;

}


/* PLAYER BUTTONS */

#winampButtons{

display:flex;

justify-content:center;

gap:10px;

padding:10px;

background:rgba(0,0,0,.25);

}


#winampButtons button{

width:55px;

height:40px;

}


/* PLAYLIST */

#playlistWindow{

height:330px;

overflow:auto;

border-top:1px solid rgba(255,255,255,.15);

padding:10px;

background:rgba(0,0,0,.25);

}


.winampItem{

display:flex;

justify-content:space-between;

align-items:center;

padding:8px;

border-bottom:1px solid rgba(255,255,255,.15);

background:rgba(16,25,35,.35);

cursor:grab;

}


.winampItem.dragging{

opacity:.4;

background:#2793ff;

}


.playlistTitle{

flex:1;

cursor:pointer;

}


.playing{

background:rgba(39,147,255,.35);

border-left:5px solid #55b8ff;

}


.playing .playlistTitle{

color:#55b8ff;

font-weight:bold;

}


.removeSong{

background:#7f2020;

color:white;

width:18px;

height:18px;

padding:0;

font-size:11px;

}


/* MINI */

#winampPlayer.minimized{

width:360px;

height:45px;

resize:none;

overflow:hidden;

}


#winampPlayer.minimized #winampDisplay,
#winampPlayer.minimized #progressBox,
#winampPlayer.minimized #winampButtons,
#winampPlayer.minimized #playlistWindow{

display:none;

}


#miniStatus{

display:none;

color:#55b8ff;

margin-left:10px;

}


#winampPlayer.minimized #miniStatus{

display:inline;

}



/* =====================
 MOBILE
===================== */

}


h1{

text-align:center;

font-size:22px;

}

display:block;

}


.controls input,
.controls select,
.controls button{

width:100%;

margin-bottom:10px;

height:55px;

font-size:18px;

}

display:none;

}


.trackRow{

grid-template-columns:

35px
1fr;

gap:8px;

}


.trackRow div:nth-child(n+3){

}

right:10px;

   CUSTOM SCROLLBARS
===================== */

::-webkit-scrollbar{

===================== */

<script>


// ======================================
// ARCHIVE SEARCH ENGINE
// ======================================


let currentPage = 0;

let pageSize = 25;


let tracks = [];

let currentCollection = "";


let currentPlayingIndex = -1;


async function searchArchive(page){


currentPage = page;



let search =

document.getElementById("search")
.value
.trim();



let creator =

document.getElementById("creator")
.value
.trim();



let sort =

document.getElementById("sort")
.value;



let query = "mediatype:audio";


if(search){

query +=

' AND title:"'+

search+

'"';

}


if(creator){

query +=

' AND creator:"'+

creator+

'"';

}




let url =


"https://archive.org/advancedsearch.php?q="

+

encodeURIComponent(query)

+

"&fl[]=identifier,title,creator,description,date"

+

"&rows="

+

pageSize

+

"&start="

+

(page * pageSize)

+

"&sort[]="

+

encodeURIComponent(sort)

+

"&output=json";






document.getElementById("status").innerHTML =

"Searching Archive...";






let response =

await fetch(url);



let data =

await response.json();




document.getElementById("status").innerHTML =

"Found "

+

data.response.numFound

+

" audio collections";



loadMP3FromCollections(data.response.docs);



}





// ======================================
// DISPLAY COLLECTIONS
// ======================================

async function loadMP3FromCollections(items){

let foundTracks = [];

document.getElementById("status").innerHTML =
"Scanning collections for MP3 files...";


for(const item of items){


try{


let response = await fetch(
"https://archive.org/metadata/" + item.identifier
);


let data = await response.json();



data.files.forEach(file=>{


let name = file.name || "";


if(name.toLowerCase().endsWith(".mp3")){


foundTracks.push({


name:name,


artist:
data.metadata.creator || "Unknown",


album:
data.metadata.title || "Unknown",


size:
formatSize(file.size),


url:
"https://archive.org/download/"
+
item.identifier
+
"/"
+
encodeURIComponent(name)



});


}



});


}catch(err){

console.log(err);

}


}



tracks = foundTracks;


document.getElementById("status").innerHTML =

"Found "
+
tracks.length
+
" MP3 files";


renderTracks();


}

// ======================================
// LOAD MP3 FILES
// ======================================



async function loadMP3Tracks(id){



currentCollection=id;



document.getElementById("status").innerHTML =

"Loading MP3 files...";




let response =

await fetch(

"https://archive.org/metadata/"

+

id

);



let data =

await response.json();





let album =

data.metadata.title || "Unknown";



let artist =

data.metadata.creator || "Unknown";





let found=[];





data.files.forEach(file=>{


let name =

file.name || "";



if(

name.toLowerCase().endsWith(".mp3")

){


found.push({



name:name,



artist:artist,



album:album,



size:formatSize(file.size),



url:


"https://archive.org/download/"

+

id

+

"/"

+

encodeURIComponent(name),



archive:


"https://archive.org/details/"

+

id



});



}



});





tracks = found;




document.getElementById("status").innerHTML =

"Found "

+

tracks.length

+

" MP3 tracks";





renderTracks();




}






// ======================================
// MINIMIZE WINAMP
// ======================================

function minimizeWinamp(){

let player =
document.getElementById("winampPlayer");


player.classList.toggle("minimized");


}
  
// ======================================
// DISPLAY TRACK TABLE
// ======================================



function renderTracks(){



let box =

document.getElementById("tracks");



box.innerHTML="";





tracks.forEach((track,index)=>{



box.innerHTML += `



<div class="trackRow">


<div>


<button class="smallButton"

onclick="playTrack(${index})">


▶


</button>


</div>




<div class="song">


${escapeHTML(track.name)}


</div>




<div class="info">

${escapeHTML(track.artist)}

</div>



<div class="info">

${escapeHTML(track.album)}

</div>



<div class="info">

${track.size}

</div>




<div>


<button 
class="smallButton"
onclick="addQueue(${index})"
data-tip="Add to Playlist">

➕

</button>


</div>



<div>


<a class="smallButton"

href="${track.url}"

download>


⬇


</a>


</div>



</div>



`;



});



}




function exportM3U(){

    if(queue.length === 0){

        alert("Playlist is empty");

        return;

    }


    let m3u = "#EXTM3U\n\n";


    queue.forEach(track=>{


        m3u += 
        "#EXTINF:-1,"
        +
        track.artist
        +
        " - "
        +
        track.name
        +
        "\n";


        m3u += track.url + "\n\n";


    });



    let blob = new Blob(
        [m3u],
        {
            type:"audio/x-mpegurl"
        }
    );


    let url = URL.createObjectURL(blob);


    let a = document.createElement("a");

    a.href=url;

    a.download="obvyris_playlist.m3u";

    a.click();


    URL.revokeObjectURL(url);

}

// ======================================
// HELPERS
// ======================================

function loadM3U(event){

    let file = event.target.files[0];

    if(!file) return;

    let reader = new FileReader();

    reader.onload = function(e){

        let lines = e.target.result.split(/\r?\n/);

        let newQueue = [];

        let info = "";

        lines.forEach(line=>{

            line = line.trim();

            if(!line) return;

            if(line.startsWith("#EXTINF:")){

                info = line.substring(line.indexOf(",")+1);

                return;

            }

            if(line.startsWith("#")) return;

            let artist = "Unknown";
            let name = decodeURIComponent(line.split("/").pop());

            if(info){

                if(info.includes(" - ")){

                    let parts = info.split(" - ");

                    artist = parts.shift();

                    name = parts.join(" - ");

                }else{

                    name = info;

                }

            }

            newQueue.push({

                name:name,
                artist:artist,
                album:"Loaded M3U",
                url:line

            });

            info="";

        });

        queue = newQueue;

        saveQueue();

        renderQueue();

    };

    reader.readAsText(file);

}

function formatSize(bytes){



if(!bytes)

return "--";



bytes=parseInt(bytes);



let sizes=[

"B",

"KB",

"MB",

"GB"

];



let i =

Math.floor(

Math.log(bytes)

/

Math.log(1024)

);



return (

bytes /

Math.pow(1024,i)

)

.toFixed(1)

+

" "

+

sizes[i];



}




function escapeHTML(text){


return String(text)

.replaceAll("&","&amp;")

.replaceAll("<","&lt;")

.replaceAll(">","&gt;")

.replaceAll('"',"&quot;");


}





// ======================================
// QUEUE SYSTEM
// ======================================


let queue=[];

let queueIndex=0;



let audio =
document.getElementById("audio");






// LOAD SAVED QUEUE


window.addEventListener(
"load",
()=>{


let saved =
localStorage.getItem(
"obvyrisMP3Queue"
);



if(saved){


queue =
JSON.parse(saved);


renderQueue();


}


}

);







// ======================================
// ADD TO QUEUE
// ======================================


function addQueue(index){


let track =
tracks[index];



if(!track)
return;



queue.push(track);



saveQueue();



renderQueue();



document.getElementById("status").innerHTML =

"Added: "

+

track.name;



}





function saveQueue(){


localStorage.setItem(

"obvyrisMP3Queue",

JSON.stringify(queue)

);


}






// ======================================
// DISPLAY QUEUE
// ======================================
function renderQueue(){

    const box = document.getElementById("winampQueue");

    box.innerHTML = "";


    queue.forEach((track,index)=>{


        let item = document.createElement("div");

        item.className =
        "winampItem "
        +
        (index===currentPlayingIndex ? "playing":"");


        item.draggable = true;


        item.dataset.index = index;



        item.innerHTML = `

            <div class="playlistTitle"
                 onclick="playQueue(${index})">

                ${index+1}. ${escapeHTML(track.name)}

                <br>

                <span style="color:#9aaabd">

                ${escapeHTML(track.artist)}

                </span>

            </div>


            <button class="removeSong"
            onclick="event.stopPropagation();removeQueue(${index})">

            ✖

            </button>

        `;



        item.addEventListener(
        "dragstart",
        dragStart
        );


        item.addEventListener(
        "dragover",
        dragOver
        );


        item.addEventListener(
        "drop",
        dropItem
        );


        item.addEventListener(
        "dragend",
        dragEnd
        );



        box.appendChild(item);


    });


}

let dragIndex = null;



function dragStart(e){

    dragIndex =
    Number(this.dataset.index);


    this.classList.add("dragging");


}



function dragOver(e){

    e.preventDefault();

}



function dropItem(e){

    e.preventDefault();


    let dropIndex =
    Number(this.dataset.index);



    if(dragIndex === null ||
       dragIndex === dropIndex)
       return;



    let moved =
    queue.splice(
        dragIndex,
        1
    )[0];



    queue.splice(
        dropIndex,
        0,
        moved
    );



    saveQueue();


    renderQueue();



}



function dragEnd(){

    this.classList.remove(
        "dragging"
    );


    dragIndex=null;

}
 
function togglePlaylist(){

let p=document.getElementById(
"playlistWindow"
);


if(p.style.display=="none")

p.style.display="block";

else

p.style.display="none";


}



function hideWinamp(){

    document.getElementById("winampPlayer").style.display="none";

    document.getElementById("restorePlayer").style.display="block";

}


function showWinamp(){

    let player = document.getElementById("winampPlayer");

    player.style.display="block";

    player.classList.remove("minimized");

    document.getElementById("restorePlayer").style.display="none";

}
  

// ======================================
// PLAY QUEUE ITEM
// ======================================
function playQueue(index){

    if(!queue[index]) return;

    queueIndex = index;
    currentPlayingIndex = index;

    playTrackURL(queue[index]);

    renderQueue();

}






// ======================================
// PLAY TRACK
// ======================================


function playTrack(index){


if(!tracks[index])

return;



playTrackURL(
tracks[index]
);



}

const archiveChannel =
    "BroadcastChannel" in window
    ? new BroadcastChannel("obvyrisArchivePlayer")
    : null;

// ======================================
// SEND PLAYER STATUS TO OBBVYRIS HUB
// ======================================

const ARCHIVE_PLAYER_KEY = "obvyrisArchivePlayer";

function updateArchivePlayerStatus(track = null){

    const status = {

        playing: track ? !audio.paused : false,

        name: track ? track.name : "No Track Playing",

        artist: track ? track.artist : "Archive Audio",

        album: track ? track.album : "",

        url: track ? track.url : "",

        time: audio.currentTime || 0,

        duration: audio.duration || 0,

        updated: Date.now()

    };


    localStorage.setItem(
        ARCHIVE_PLAYER_KEY,
        JSON.stringify(status)
    );


    // Live communication between pages/tabs
    if("BroadcastChannel" in window){

        archiveChannel.postMessage(status);

    }

}


function playTrackURL(track){

    audio.src = track.url;

    audio.play();

    document.getElementById(
        "winampSong"
    ).innerHTML =
        escapeHTML(track.name);

    document.getElementById(
        "winampArtist"
    ).innerHTML =
        escapeHTML(track.artist)
        +
        "<br>"
        +
        escapeHTML(track.album);

    showWinamp();

    document.getElementById(
        "miniStatus"
    ).innerHTML =
        "▶ " + escapeHTML(track.name);

    currentPlayingIndex = queueIndex;

    renderQueue();


    // ======================================
    // SEND PLAYER STATUS TO OVBYRIS HUB
    // ======================================

    localStorage.setItem(
        "obvyrisMP3PlayerState",
        JSON.stringify({

            playing: true,

            song: track.name,

            artist: track.artist,

            album: track.album,

            url: track.url,

            time: audio.currentTime,

            duration: audio.duration || 0,

            updated: Date.now()

        })
    );

}




// ======================================
// PLAYER CONTROLS
// ======================================

function togglePlay(){

    if(audio.paused){

        audio.play();

    }

    else{

        audio.pause();

    }

}


// ======================================
// KEEP HUB UPDATED WITH PLAY/PAUSE
// ======================================

audio.addEventListener(
    "play",
    function(){

        let state =
            JSON.parse(
                localStorage.getItem(
                    "obvyrisMP3PlayerState"
                ) || "{}"
            );


        state.playing = true;

        state.time = audio.currentTime;

        state.duration = audio.duration || 0;

        state.updated = Date.now();


        localStorage.setItem(
            "obvyrisMP3PlayerState",
            JSON.stringify(state)
        );

    }
);


audio.addEventListener(
    "pause",
    function(){

        let state =
            JSON.parse(
                localStorage.getItem(
                    "obvyrisMP3PlayerState"
                ) || "{}"
            );


        state.playing = false;

        state.time = audio.currentTime;

        state.duration = audio.duration || 0;

        state.updated = Date.now();


        localStorage.setItem(
            "obvyrisMP3PlayerState",
            JSON.stringify(state)
        );

    }
);


audio.addEventListener(
"timeupdate",
()=>{


if(audio.duration){


document.getElementById("seekBar").value =

(audio.currentTime / audio.duration) * 100;



document.getElementById("currentTime").innerHTML =

formatTime(audio.currentTime);



document.getElementById("durationTime").innerHTML =

formatTime(audio.duration);


}


/* SEND CURRENT PLAYER TIME TO HUB */

const saved =
    localStorage.getItem(
        ARCHIVE_PLAYER_KEY
    );


if(saved){

    const status =
        JSON.parse(saved);


    status.playing =
        !audio.paused;


    status.time =
        audio.currentTime;


    status.duration =
        audio.duration || 0;


    status.updated =
        Date.now();


    localStorage.setItem(
        ARCHIVE_PLAYER_KEY,
        JSON.stringify(status)
    );

}


});

function nextTrack(){



if(queue.length===0)

return;



queueIndex++;



if(queueIndex >= queue.length)


queueIndex=0;




playQueue(queueIndex);



}







function previousTrack(){


if(queue.length===0)

return;



queueIndex--;



if(queueIndex<0)


queueIndex =
queue.length-1;




playQueue(queueIndex);



}








audio.onended=function(){


nextTrack();


};








// ======================================
// REMOVE QUEUE
// ======================================


function removeQueue(index){

    queue.splice(index,1);

    if(currentPlayingIndex==index){

        currentPlayingIndex=-1;

    }
    else if(currentPlayingIndex>index){

        currentPlayingIndex--;

    }

    if(queueIndex>=queue.length){

        queueIndex=0;

    }

    saveQueue();

    renderQueue();

}






function clearQueue(){



queue=[];


saveQueue();


renderQueue();



}


function formatTime(seconds){

if(!seconds || isNaN(seconds))
return "0:00";


let min = Math.floor(seconds / 60);

let sec = Math.floor(seconds % 60);


if(sec < 10)
sec = "0" + sec;


return min + ":" + sec;

}

// ======================================
// MOVABLE WINAMP PLAYER
// ======================================

const winamp = document.getElementById("winampPlayer");
const header = document.getElementById("winampHeader");

let isDragging = false;
let offsetX = 0;
let offsetY = 0;


header.addEventListener("mousedown", function(e){

    isDragging = true;

    offsetX = e.clientX - winamp.offsetLeft;
    offsetY = e.clientY - winamp.offsetTop;

    header.style.cursor="grabbing";

});



document.addEventListener("mousemove", function(e){

    if(!isDragging)
        return;


    winamp.style.left =
        (e.clientX - offsetX) + "px";


    winamp.style.top =
        (e.clientY - offsetY) + "px";


    winamp.style.right="auto";
    winamp.style.bottom="auto";


});



document.addEventListener("mouseup", function(){

    isDragging=false;

    header.style.cursor="move";

});





// MOBILE TOUCH DRAG

header.addEventListener("touchstart", function(e){

    let touch=e.touches[0];

    isDragging=true;


    offsetX =
    touch.clientX - winamp.offsetLeft;


    offsetY =
    touch.clientY - winamp.offsetTop;


});



document.addEventListener("touchmove",function(e){

    if(!isDragging)
        return;


    let touch=e.touches[0];


    winamp.style.left =
    (touch.clientX-offsetX)+"px";


    winamp.style.top =
    (touch.clientY-offsetY)+"px";


    winamp.style.right="auto";
    winamp.style.bottom="auto";


});



document.addEventListener("touchend",function(){

    isDragging=false;

});

const tooltip = document.getElementById("tooltipBubble");


document.querySelectorAll("[data-tip]").forEach(el=>{


el.addEventListener("mouseenter",()=>{

tooltip.innerHTML = el.dataset.tip;

tooltip.style.opacity = "1";

});


el.addEventListener("mousemove",(e)=>{

tooltip.style.left = e.clientX + "px";

tooltip.style.top = e.clientY - 15 + "px";

});


el.addEventListener("mouseleave",()=>{

tooltip.style.opacity="0";

});


});
