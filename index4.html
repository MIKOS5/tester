<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌍 Echo Shards RTS World</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0b0f14;
  color: white;
}

#map {
  height: 100vh;
  width: 100%;
}

#ui {
  position: absolute;
  top: 10px;
  left: 10px;
  width: 260px;
  background: #1a1f2a;
  padding: 12px;
  border-radius: 10px;
  z-index: 9999;
}

input, button, textarea {
  width: 100%;
  margin-top: 6px;
  padding: 8px;
  border: none;
  border-radius: 6px;
}

button {
  background: #2d6cdf;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

#log {
  position: absolute;
  bottom: 10px;
  left: 10px;
  width: 320px;
  height: 140px;
  overflow: auto;
  background: #1a1f2a;
  padding: 10px;
  border-radius: 10px;
  font-size: 12px;
  z-index: 9999;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="ui">
  <b>🌍 Echo Shards RTS</b>
  <input id="nick" placeholder="Player Name">
  <button onclick="join()">Join World</button>

  <div id="status">Offline</div>

  <textarea id="note" placeholder="Shard command / note"></textarea>

  <button onclick="spawnShard()">Spawn Shard Node</button>
</div>

<div id="log"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// ================= WORLD CONFIG =================
const API = "YOUR_GOOGLE_SCRIPT_URL_HERE";

let map = L.map('map').setView([33.8, -118.3], 11);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

// ================= STATE =================
let nick = "";
let nodes = {};
let selectedNode = null;

// ================= SHARD NODE COLORS =================
function ownerColor(name) {
  if (!name) return "#555";

  let hash = 0;
  for (let i = 0; i < name.length; i++) {
    hash = name.charCodeAt(i) + ((hash << 5) - hash);
  }

  return "#" + ((hash & 0xFFFFFF).toString(16).padStart(6, "0"));
}

// ================= JOIN =================
function join() {
  nick = document.getElementById("nick").value;
  if (!nick) return;

  document.getElementById("status").innerText = "Online";
  log("Joined Echo Shards World");

  sync();
  setInterval(sync, 3000);
}

// ================= NODE SYSTEM =================
function createNode(data) {
  if (nodes[data.id]) {
    map.removeLayer(nodes[data.id]);
  }

  let strength = data.level || 1;
  let radius = 30 + strength * 2;

  let circle = L.circle([data.lat, data.lng], {
    radius: radius * 20,
    color: ownerColor(data.owner),
    fillOpacity: 0.4
  }).addTo(map);

  circle.on("click", () => {
    selectedNode = data;

    circle.bindPopup(`
      <b>Shard Node</b><br>
      Owner: ${data.owner || "None"}<br>
      Level: ${strength}<br>
      Energy: ${data.energy || 0}<br>
      Control: ${data.control || "Neutral"}<br><br>

      <button onclick="attack('${data.id}')">⚔ Attack</button>
      <button onclick="upgrade('${data.id}')">⬆ Upgrade</button>
    `).openPopup();
  });

  nodes[data.id] = circle;
}

// ================= SPAWN SHARD =================
async function spawnShard() {
  if (!nick) return;

  let center = map.getCenter();

  await fetch(API, {
    method: "POST",
    body: JSON.stringify({
      action: "spawn",
      id: Math.random().toString(36).substr(2, 9),
      lat: center.lat + (Math.random() - 0.5) * 0.1,
      lng: center.lng + (Math.random() - 0.5) * 0.1,
      owner: nick,
      level: 1,
      energy: 50
    })
  });

  log("New shard node created");
  sync();
}

// ================= ATTACK =================
async function attack(id) {
  await fetch(API, {
    method: "POST",
    body: JSON.stringify({
      action: "attack",
      id,
      nick
    })
  });

  log("⚔ Attack launched");
  sync();
}

// ================= UPGRADE =================
async function upgrade(id) {
  await fetch(API, {
    method: "POST",
    body: JSON.stringify({
      action: "upgrade",
      id,
      nick
    })
  });

  log("⬆ Upgrade sent");
  sync();
}

// ================= SYNC WORLD =================
async function sync() {
  const res = await fetch(API, {
    method: "POST",
    body: JSON.stringify({ action: "getWorld" })
  });

  const data = await res.json();

  (data.nodes || []).forEach(createNode);
}

// ================= LOG =================
function log(msg) {
  document.getElementById("log").innerHTML += "• " + msg + "<br>";
}

</script>

</body>
</html>
