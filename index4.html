<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🌍 Echo Shards v11 — Living World Simulator</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

body{
  margin:0;
  overflow:hidden;
  font-family:Arial;
  background:#0b0f14;
  color:white;
}

#map{
  width:100vw;
  height:100vh;
}

#ui{
  position:absolute;
  top:10px;
  left:10px;
  width:300px;
  background:#151b26;
  padding:12px;
  border-radius:10px;
  z-index:9999;
  box-shadow:0 0 20px rgba(0,0,0,0.5);
}

input,button,select{
  width:100%;
  margin-top:6px;
  padding:10px;
  border:none;
  border-radius:6px;
}

button{
  cursor:pointer;
  background:#2d6cdf;
  color:white;
  font-weight:bold;
}

button:hover{
  filter:brightness(1.1);
}

#log{
  position:absolute;
  bottom:10px;
  left:10px;
  width:360px;
  height:180px;
  overflow:auto;
  background:#151b26;
  padding:10px;
  border-radius:10px;
  z-index:9999;
  font-size:12px;
}

#worldstats{
  margin-top:10px;
  font-size:13px;
  line-height:1.5;
}

.badge{
  display:inline-block;
  padding:3px 8px;
  border-radius:6px;
  font-size:11px;
  margin-right:4px;
}

</style>
</head>

<body>

<div id="map"></div>

<div id="ui">

  <h2>🌍 Echo Shards v11</h2>

  <input id="nick" placeholder="Commander Name">

  <select id="faction">
    <option>VOID</option>
    <option>ORDER</option>
    <option>CHAOS</option>
  </select>

  <button onclick="join()">Join World</button>
  <button onclick="spawn()">Spawn Capital</button>

  <div id="status">OFFLINE</div>

  <div id="worldstats">
    <div>🌎 Nodes: <span id="nodeCount">0</span></div>
    <div>⚔ Wars: <span id="warCount">0</span></div>
    <div>👑 Dominant: <span id="dominant">NONE</span></div>
  </div>

</div>

<div id="log"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// =====================================================
// API
// =====================================================

const API = "https://script.google.com/macros/s/AKfycbwfFHG9LeEzzYlVYCEXswjxeP_mVsevAqCtGybKBt9O5ww1Pn5d57S2yScP_2_rAinY/exec";

// =====================================================
// MAP
// =====================================================

const map = L.map('map').setView([34.05,-118.24], 5);

L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {
    maxZoom:19
  }
).addTo(map);

// =====================================================
// GAME STATE
// =====================================================

let nick = "";
let faction = "VOID";

let nodes = {};
let influenceLines = [];
let armies = [];

let syncLoop = null;

// =====================================================
// COLORS
// =====================================================

function factionColor(name){

  const colors = {
    "VOID":"#7a2cff",
    "ORDER":"#2cc7ff",
    "CHAOS":"#ff2c6d",
    "Neutral":"#777"
  };

  return colors[name] || "#999";
}

// =====================================================
// LOG
// =====================================================

function log(msg){

  const el = document.getElementById("log");

  el.innerHTML =
    "• " + msg + "<br>" + el.innerHTML;

  while(el.innerHTML.length > 10000){
    el.innerHTML = el.innerHTML.slice(0,9000);
  }
}

// =====================================================
// NETWORK
// =====================================================

async function post(data){

  try{

    const res = await fetch(API,{
      method:"POST",
      body:JSON.stringify(data)
    });

    const text = await res.text();

    return JSON.parse(text);

  }catch(err){

    console.log(err);
    log("❌ Network Error");

    return {};
  }
}

// =====================================================
// JOIN
// =====================================================

function join(){

  nick = document.getElementById("nick").value.trim();

  if(!nick){
    alert("Enter commander name");
    return;
  }

  faction =
    document.getElementById("faction").value;

  document.getElementById("status").innerHTML =
    "🟢 ONLINE";

  log("Commander joined: " + nick);

  sync();

  if(syncLoop) clearInterval(syncLoop);

  syncLoop = setInterval(sync,3000);
}

// =====================================================
// SPAWN
// =====================================================

async function spawn(){

  if(!nick){
    alert("Join first");
    return;
  }

  const c = map.getCenter();

  await post({
    action:"spawn",
    id:crypto.randomUUID(),
    lat:c.lat,
    lng:c.lng,
    owner:faction
  });

  log("🏰 Capital deployed");

  sync();
}

// =====================================================
// ATTACK
// =====================================================

async function attack(id){

  await post({
    action:"attack",
    id,
    nick:faction
  });

  log("⚔ Raid launched");

  animateAttack(id);

  sync();
}

// =====================================================
// UPGRADE
// =====================================================

async function upgrade(id){

  await post({
    action:"upgrade",
    id
  });

  log("⬆ Territory fortified");

  sync();
}

// =====================================================
// ATTACK EFFECT
// =====================================================

function animateAttack(id){

  const n = nodes[id];

  if(!n) return;

  const pulse = L.circle(
    n.getLatLng(),
    {
      radius:1000,
      color:"#ffffff",
      fillOpacity:0.1
    }
  ).addTo(map);

  let r = 1000;

  const fx = setInterval(()=>{

    r += 700;

    pulse.setRadius(r);

    if(r > 6000){
      map.removeLayer(pulse);
      clearInterval(fx);
    }

  },50);
}

// =====================================================
// DRAW NODE
// =====================================================

function drawNode(n){

  if(!n.id) return;

  if(nodes[n.id]){
    map.removeLayer(nodes[n.id]);
  }

  const lvl =
    Number(n.level || 1);

  const energy =
    Number(n.energy || 0);

  const radius =
    200 + (lvl * 120);

  const circle = L.circle(
    [Number(n.lat), Number(n.lng)],
    {
      radius:radius,
      color:factionColor(n.owner),
      fillColor:factionColor(n.owner),
      fillOpacity:0.30,
      weight:2
    }
  ).addTo(map);

  // influence ring

  const influence = L.circle(
    [Number(n.lat), Number(n.lng)],
    {
      radius:radius * 2.5,
      color:factionColor(n.owner),
      fillOpacity:0,
      opacity:0.15,
      dashArray:"6,8"
    }
  ).addTo(map);

  influenceLines.push(influence);

  circle.on("click",()=>{

    circle.bindPopup(`
      <div style="color:black">

      <h3>⚡ Territory Node</h3>

      <b>Faction:</b> ${n.owner}<br>
      <b>Level:</b> ${lvl}<br>
      <b>Energy:</b> ${energy}<br>

      <hr>

      <button onclick="attack('${n.id}')">
      ⚔ Raid
      </button>

      <button onclick="upgrade('${n.id}')">
      ⬆ Fortify
      </button>

      </div>
    `).openPopup();
  });

  nodes[n.id] = circle;
}

// =====================================================
// DRAW CONNECTIONS
// =====================================================

function drawConnections(data){

  for(let i=0;i<data.length;i++){

    const a = data[i];

    for(let j=i+1;j<data.length;j++){

      const b = data[j];

      const dist =
        Math.hypot(
          a.lat - b.lat,
          a.lng - b.lng
        );

      if(dist < 2){

        const line = L.polyline(
          [
            [a.lat,a.lng],
            [b.lat,b.lng]
          ],
          {
            color:
              a.owner === b.owner
              ? factionColor(a.owner)
              : "#666",
            weight:1,
            opacity:0.3
          }
        ).addTo(map);

        influenceLines.push(line);
      }
    }
  }
}

// =====================================================
// WORLD STATS
// =====================================================

function updateStats(data){

  document.getElementById("nodeCount").innerText =
    data.length;

  let counts = {};

  data.forEach(n=>{

    counts[n.owner] =
      (counts[n.owner] || 0) + 1;
  });

  let top = "NONE";
  let max = 0;

  Object.keys(counts).forEach(f=>{

    if(counts[f] > max){
      max = counts[f];
      top = f;
    }
  });

  document.getElementById("dominant").innerText =
    top;

  document.getElementById("warCount").innerText =
    Math.floor(data.length / 4);
}

// =====================================================
// CLEAN MAP
// =====================================================

function clearMap(){

  Object.keys(nodes).forEach(k=>{
    map.removeLayer(nodes[k]);
  });

  nodes = {};

  influenceLines.forEach(l=>{
    map.removeLayer(l);
  });

  influenceLines = [];
}

// =====================================================
// SYNC WORLD
// =====================================================

async function sync(){

  const data =
    await post({
      action:"getWorld"
    });

  if(!data.nodes) return;

  clearMap();

  data.nodes.forEach(drawNode);

  drawConnections(data.nodes);

  updateStats(data.nodes);

  log("🌎 World Synced");
}

// =====================================================
// RANDOM WORLD EVENTS
// =====================================================

const events = [

  "☄ Meteor Storm",
  "🌌 Void Rift",
  "⚡ Energy Surge",
  "🔥 Chaos Uprising",
  "🛡 Order Shield Pulse",
  "👾 Rogue AI Swarm",
  "🌊 Tidal Collapse",
  "🌍 Population Migration"

];

setInterval(()=>{

  if(Math.random() < 0.35){

    const e =
      events[
        Math.floor(Math.random()*events.length)
      ];

    log(e);
  }

},12000);

// =====================================================
// AUTO AI ACTIVITY
// =====================================================

setInterval(async ()=>{

  await post({
    action:"tick"
  });

},8000);

// =====================================================
// MAP CLICK SPAWN
// =====================================================

map.on("click", async (e)=>{

  if(!nick) return;

  if(Math.random() < 0.25){

    await post({
      action:"spawn",
      id:crypto.randomUUID(),
      lat:e.latlng.lat,
      lng:e.latlng.lng,
      owner:faction
    });

    log("📍 Forward Outpost Created");

    sync();
  }
});

</script>

</body>
</html>
