<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌍 Echo Shards RTS MMO v3 (FIXED)</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0b0f14;
  color:white;
}

#map {
  height:100vh;
  width:100%;
}

#ui {
  position:absolute;
  top:10px;
  left:10px;
  width:260px;
  background:#1a1f2a;
  padding:12px;
  border-radius:10px;
  z-index:9999;
}

input, button {
  width:100%;
  margin-top:6px;
  padding:8px;
  border:none;
  border-radius:6px;
}

button {
  background:#2d6cdf;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

#log {
  position:absolute;
  bottom:10px;
  left:10px;
  width:320px;
  height:120px;
  overflow:auto;
  background:#1a1f2a;
  padding:10px;
  font-size:12px;
  z-index:9999;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="ui">
  <b>🌍 Echo Shards RTS v3 FIXED</b>
  <input id="nick" placeholder="Player name">

  <button onclick="join()">Join World</button>
  <button onclick="spawn()">Spawn Shard</button>

  <div id="status">Offline</div>
</div>

<div id="log"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// ================= API =================
const API = "https://script.google.com/macros/s/AKfycbwfFHG9LeEzzYlVYCEXswjxeP_mVsevAqCtGybKBt9O5ww1Pn5d57S2yScP_2_rAinY/exec";

// ================= MAP =================
let map = L.map('map').setView([33.8,-118.3], 11);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19
}).addTo(map);

// ================= STATE =================
let nick = "";
let nodes = {};

// ================= COLOR =================
function color(name){
  if(!name) return "#555";

  let h = 0;
  for(let i=0;i<name.length;i++){
    h = name.charCodeAt(i) + ((h<<5) - h);
  }

  return "#" + ((h & 0xFFFFFF).toString(16).padStart(6,"0"));
}

// ================= JOIN =================
function join(){
  nick = document.getElementById("nick").value;
  if(!nick) return;

  document.getElementById("status").innerText = "Online";

  sync();
  setInterval(sync, 2500);
}

// ================= FETCH HELPER =================
async function postData(payload){
  return fetch(API,{
    method:"POST",
    headers:{
      "Content-Type":"application/json"
    },
    body: JSON.stringify(payload)
  });
}

// ================= SPAWN =================
async function spawn(){

  let c = map.getCenter();

  try {
    await postData({
      action:"spawn",
      id: crypto.randomUUID(),
      lat: c.lat,
      lng: c.lng,
      owner: nick
    });

    sync();
  } catch(e){
    console.log("SPAWN ERROR:", e);
  }
}

// ================= ATTACK =================
async function attack(id){

  try {
    await postData({
      action:"attack",
      id,
      nick
    });

    sync();
  } catch(e){
    console.log("ATTACK ERROR:", e);
  }
}

// ================= UPGRADE =================
async function upgrade(id){

  try {
    await postData({
      action:"upgrade",
      id,
      nick
    });

    sync();
  } catch(e){
    console.log("UPGRADE ERROR:", e);
  }
}

// ================= DRAW NODE =================
function draw(n){

  if(nodes[n.id]){
    map.removeLayer(nodes[n.id]);
  }

  let circle = L.circle([n.lat, n.lng],{
    radius: 200 + (Number(n.level || 1) * 50),
    color: color(n.owner),
    fillOpacity: 0.35
  }).addTo(map);

  circle.on("click", () => {

    circle.bindPopup(`
      <b>⚡ Shard Node</b><br>
      Owner: ${n.owner}<br>
      Level: ${n.level}<br>
      Energy: ${n.energy}<br>
      Control: ${n.control || "Neutral"}<br><br>

      <button onclick="attack('${n.id}')">⚔ Attack</button>
      <button onclick="upgrade('${n.id}')">⬆ Upgrade</button>
    `).openPopup();
  });

  nodes[n.id] = circle;
}

// ================= SYNC WORLD =================
async function sync(){

  try {
    const res = await postData({
      action:"getWorld"
    });

    const text = await res.text();
    console.log("RAW RESPONSE:", text);

    const data = JSON.parse(text);

    (data.nodes || []).forEach(draw);

  } catch(err) {
    console.log("SYNC ERROR:", err);
  }
}

</script>

</body>
</html>
