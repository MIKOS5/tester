<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Risk MMO v2 War System</title>

<style>
body {
  margin:0;
  background:#111;
  font-family:Arial;
  overflow:hidden;
  color:white;
}

#ui {
  position:fixed;
  top:10px;
  left:10px;
  background:rgba(0,0,0,0.75);
  padding:10px;
  border-radius:10px;
  z-index:10;
  width:180px;
}

input, button {
  width:100%;
  margin-top:5px;
  padding:6px;
}

canvas {
  display:block;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">
  Nick:<br>
  <input id="nick"><br>
  <button onclick="join()">Join War</button>

  <div id="stats">
    🪖 Troops: <span id="troops">0</span><br>
    🌍 Tiles: <span id="tiles">0</span>
  </div>

  <div id="status">offline</div>
</div>

<script>

const API = "YOUR_GOOGLE_SCRIPT_URL";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

window.onresize = () => {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
};

/* WORLD */
const SIZE = 40;
const W = 120;
const H = 80;

let nick = "";

/* STATE */
let grid = {};   // owner
let troops = {}; // troop count per tile
let cooldown = {};

/* CAMERA */
let camX = 0;
let camY = 0;
let scale = 8;

/* ---------------- JOIN ---------------- */
async function join(){
  nick = document.getElementById("nick").value;
  if(!nick) return;

  document.getElementById("status").innerText = "ONLINE: " + nick;

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"join",nick,channel:"world"})
  });

  loop();
}

/* ---------------- CELL ID ---------------- */
function id(x,y){
  return x + "_" + y;
}

/* ---------------- CLICK = ATTACK ---------------- */
canvas.addEventListener("click",(e)=>{

  if(!nick) return;

  const x = Math.floor((e.clientX - camX)/scale);
  const y = Math.floor((e.clientY - camY)/scale);

  const key = id(x,y);

  if(cooldown[key] && Date.now() < cooldown[key]) return;

  cooldown[key] = Date.now() + 1000; // 1 sec cooldown

  fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"attack",
      nick,
      x,y
    })
  });
});

/* ---------------- DRAW WORLD ---------------- */
function draw(){

  ctx.clearRect(0,0,canvas.width,canvas.height);

  let myTiles = 0;
  let myTroops = 0;

  for(let x=0;x<W;x++){
    for(let y=0;y<H;y++){

      const key = id(x,y);
      const owner = grid[key];
      const t = troops[key] || 0;

      const px = x*scale + camX;
      const py = y*scale + camY;

      if(px < -50 || py < -50 || px > canvas.width+50 || py > canvas.height+50)
        continue;

      // color
      ctx.fillStyle = owner ? color(owner) : "#222";
      ctx.fillRect(px,py,scale,scale);

      ctx.strokeStyle = "#000";
      ctx.strokeRect(px,py,scale,scale);

      // troop number
      if(t > 0){
        ctx.fillStyle = "white";
        ctx.font = "10px Arial";
        ctx.fillText(t, px+2, py+10);
      }

      if(owner === nick){
        myTiles++;
        myTroops += t;
      }
    }
  }

  document.getElementById("troops").innerText = myTroops;
  document.getElementById("tiles").innerText = myTiles;
}

/* ---------------- COLOR ---------------- */
function color(str){
  let h = 0;
  for(let i=0;i<str.length;i++){
    h = str.charCodeAt(i) + ((h<<5)-h);
  }

  return "#" + ((h>>16)&255).toString(16).padStart(2,'0')
             + ((h>>8)&255).toString(16).padStart(2,'0')
             + (h&255).toString(16).padStart(2,'0');
}

/* ---------------- SYNC ---------------- */
async function sync(){

  const res = await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"getWorld"})
  });

  const data = await res.json();

  grid = data.grid || {};
  troops = data.troops || {};
}

/* ---------------- ECONOMY ---------------- */
function economyTick(){

  for(let k in grid){
    if(grid[k] === nick){
      troops[k] = (troops[k] || 0) + 1;
    }
  }
}

/* ---------------- LOOP ---------------- */
function loop(){
  setInterval(sync, 1000);
  setInterval(draw, 16);
  setInterval(economyTick, 2000);
}

</script>

</body>
</html>
