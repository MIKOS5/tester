<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RTS MMO CORE v1</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body{margin:0;font-family:Arial;}
#map{height:100vh;width:100%;}
#ui{
  position:absolute;
  top:10px;
  left:10px;
  background:#222;
  color:white;
  padding:10px;
  border-radius:8px;
  z-index:999;
}
button,input{width:100%;margin-top:5px;padding:6px;}
#log{
  position:absolute;
  bottom:10px;
  left:10px;
  background:#111;
  color:white;
  padding:10px;
  width:250px;
  height:120px;
  overflow:auto;
  font-size:12px;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="ui">
  <b>RTS CORE v1</b>
  <input id="nick" placeholder="name">
  <button onclick="join()">Join</button>
  <div id="status">Offline</div>
</div>

<div id="log"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const API="YOUR_SCRIPT_URL";

let map;
let nick="";
let tiles={};

// ================= MAP =================
map=L.map("map").setView([33.8,-118.3],12);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

// ================= ID =================
function id(l){
  return Math.floor(l.lat*50)+"_"+Math.floor(l.lng*50);
}

// ================= CLICK =================
map.on("click",async e=>{

  if(!nick)return;

  const tileId=id(e.latlng);

  const r=await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"claim",
      id:tileId,
      lat:e.latlng.lat,
      lng:e.latlng.lng,
      nick
    })
  });

  const d=await r.json();
  log(d.result);

  sync();
});

// ================= JOIN =================
function join(){
  nick=document.getElementById("nick").value;
  document.getElementById("status").innerText="Online";
  sync();
  setInterval(sync,2000);
}

// ================= SYNC =================
async function sync(){

  const r=await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"getWorld"})
  });

  const d=await r.json();

  Object.values(tiles).forEach(t=>map.removeLayer(t));
  tiles={};

  d.tiles.forEach(draw);
}

// ================= DRAW =================
function draw(t){

  const color = hash(t.owner);

  const rect=L.rectangle([
    [t.lat,t.lng],
    [t.lat+0.02,t.lng+0.02]
  ],{
    color,
    fillColor:color,
    fillOpacity:0.4
  }).addTo(map);

  tiles[t.id]=rect;
}

// ================= COLOR =================
function hash(s){
  let h=0;
  for(let i=0;i<s.length;i++){
    h=s.charCodeAt(i)+((h<<5)-h);
  }
  return "#"+((h&0xffffff).toString(16).padStart(6,"0"));
}

// ================= LOG =================
function log(m){
  document.getElementById("log").innerHTML+="• "+m+"<br>";
}

</script>

</body>
</html>
