<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Echo Shards RTS MMO FIXED</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body { margin:0; font-family:Arial; background:#0b0f14; color:white; }
#map { height:100vh; width:100%; }

#ui {
  position:absolute;
  top:10px;
  left:10px;
  width:240px;
  background:#1a1f2a;
  padding:10px;
  border-radius:8px;
  z-index:9999;
}

button, input {
  width:100%;
  margin-top:6px;
  padding:8px;
  border-radius:6px;
  border:none;
}

button { background:#2d6cdf; color:white; font-weight:bold; }
</style>
</head>

<body>

<div id="map"></div>

<div id="ui">
  <input id="nick" placeholder="Name">
  <button onclick="join()">Join</button>
  <button onclick="spawn()">Spawn Shard</button>
  <div id="status">Offline</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const API = "YOUR_DEPLOYMENT_URL_HERE";

let map = L.map('map').setView([33.8,-118.3], 11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{ maxZoom:19 }).addTo(map);

let nick = "";
let nodes = {};

function join(){
  nick = document.getElementById("nick").value;
  if(!nick) return;

  document.getElementById("status").innerText = "Online";

  sync();
  setInterval(sync, 3000);
}

// ================= IMPORTANT FIX =================
// NO HEADERS → avoids CORS preflight completely

async function post(payload){
  return fetch(API, {
    method: "POST",
    body: JSON.stringify(payload)
  });
}

async function spawn(){
  let c = map.getCenter();

  await post({
    action:"spawn",
    id: crypto.randomUUID(),
    lat: c.lat,
    lng: c.lng,
    owner: nick
  });

  sync();
}

async function attack(id){
  await post({
    action:"attack",
    id,
    nick
  });

  sync();
}

async function upgrade(id){
  await post({
    action:"upgrade",
    id,
    nick
  });

  sync();
}

function draw(n){

  if(nodes[n.id]) map.removeLayer(nodes[n.id]);

  let c = L.circle([n.lat,n.lng],{
    radius: 200 + (Number(n.level||1)*50),
    color: "#44aaff",
    fillOpacity: 0.3
  }).addTo(map);

  c.on("click", ()=>{
    c.bindPopup(`
      <b>Shard</b><br>
      Owner: ${n.owner}<br>
      Level: ${n.level}<br><br>
      <button onclick="attack('${n.id}')">Attack</button>
      <button onclick="upgrade('${n.id}')">Upgrade</button>
    `).openPopup();
  });

  nodes[n.id] = c;
}

async function sync(){
  try {
    const res = await post({ action:"getWorld" });
    const data = JSON.parse(await res.text());

    (data.nodes || []).forEach(draw);

  } catch(e){
    console.log("SYNC FAIL", e);
  }
}

// AI tick
setInterval(()=>{
  post({ action:"tick" });
}, 8000);

</script>

</body>
</html>
