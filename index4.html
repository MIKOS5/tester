<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Marble Betting Arena</title>

<style>
body {
  margin:0;
  font-family:Tahoma;
  background:#0b6f6f;
  overflow:hidden;
}

/* LOGIN */
#login {
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
}

.box {
  background:#d4d0c8;
  padding:20px;
  border:3px outset white;
}

/* APP */
#app {
  display:none;
  height:100vh;
  display:flex;
}

/* SIDEBAR */
#sidebar {
  width:200px;
  background:#d4d0c8;
  border-right:2px solid gray;
  padding:6px;
  overflow-y:auto;
}

.btn {
  background:#d4d0c8;
  border:2px outset white;
  padding:5px;
  margin:3px 0;
  cursor:pointer;
}

/* CHAT AREA */
#chat {
  flex:1;
  display:flex;
  flex-direction:column;
}

#header {
  background:#d4d0c8;
  padding:6px;
  border-bottom:2px solid gray;
}

#status {
  font-size:11px;
  padding:4px;
  background:#ddd;
}

#messages {
  flex:1;
  overflow-y:auto;
  background:white;
  padding:8px;
}

/* ARENA */
#arena {
  height:260px;
  background:linear-gradient(#111,#222);
  position:relative;
  overflow:hidden;
  border-top:2px solid #333;
  border-bottom:2px solid #333;
}

/* track lines */
.track-line {
  position:absolute;
  width:100%;
  height:1px;
  background:#333;
  opacity:0.6;
}

/* finish line */
.finish {
  position:absolute;
  right:20px;
  top:0;
  width:4px;
  height:100%;
  background:lime;
  box-shadow:0 0 10px lime;
}

/* marbles */
.marble {
  position:absolute;
  width:18px;
  height:18px;
  border-radius:50%;
  box-shadow:0 0 6px rgba(0,0,0,0.5);
}

/* BET UI */
#betting {
  background:#111;
  color:white;
  padding:8px;
  font-size:12px;
  display:flex;
  gap:6px;
  align-items:center;
}

#bet {
  width:40px;
}

.winner {
  color:gold;
  font-weight:bold;
}

/* INPUT */
#inputBar {
  display:flex;
}

#msg {
  flex:1;
  padding:8px;
  border:none;
}

/* TEXT */
.nick { color:blue; font-weight:bold; }
.system { color:gray; }
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div class="box">
    Nickname<br>
    <input id="nick"><br><br>
    <button onclick="enter()">Enter Arena</button>
  </div>
</div>

<!-- APP -->
<div id="app">

  <div id="sidebar">
    <b>Channels</b>
    <div id="channels"></div>
    <hr>
    <b>Users</b>
    <div id="users"></div>
  </div>

  <div id="chat">

    <div id="header">#marble-arena</div>
    <div id="status">loading...</div>

    <div id="messages"></div>

    <!-- ARENA -->
    <div id="arena">
      <div class="finish"></div>
    </div>

    <!-- BETTING -->
    <div id="betting">
      Bet (1-4):
      <input id="bet">
      <button onclick="placeBet()">Place Bet</button>
      <span id="betStatus"></span>
    </div>

    <div id="inputBar">
      <input id="msg" onkeydown="if(event.key==='Enter') send()">
      <button onclick="send()">Send</button>
    </div>

  </div>
</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbyGqdSRP9n1O8Mr53B65hkl2P103xSAdVmKsqKf7MbZvg1KzB_3Z2VoFTTPPoI-vWSY/exec";

let nick="";
let channel="#marbles";

/* race state */
let marbles=[];
let bet=null;
let raceActive=false;
let winner=null;

/* ================= ENTER ================= */
async function enter(){
  nick=document.getElementById("nick").value.trim();
  if(!nick) return;

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"join",nick,channel})
  });

  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="flex";

  startLoop();
  startRace();
}

/* ================= LOOP ================= */
function startLoop(){
  setInterval(syncMessages,1200);
  setInterval(syncUsers,3000);
}

/* ================= CHAT ================= */
async function send(){
  const input=document.getElementById("msg");
  if(!input.value.trim()) return;

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"send",
      nick,
      channel,
      message:input.value
    })
  });

  input.value="";
}

async function syncMessages(){
  const res=await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"get",channel})
  });

  const data=await res.json();
  const box=document.getElementById("messages");

  box.innerHTML="";

  (data.messages||[]).forEach(m=>{
    const d=document.createElement("div");
    if(m.type==="system"){
      d.className="system";
      d.textContent="*** "+m.msg;
    } else {
      d.innerHTML=`<span class="nick">${m.nick}:</span> ${m.msg}`;
    }
    box.appendChild(d);
  });

  document.getElementById("status").textContent="live";
}

/* ================= USERS ================= */
async function syncUsers(){
  const res=await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"who",channel})
  });

  const data=await res.json();

  const box=document.getElementById("users");
  box.innerHTML="";

  (data.users||[]).forEach(u=>{
    const d=document.createElement("div");
    d.textContent=u;
    box.appendChild(d);
  });
}

/* ================= BETTING ================= */
function placeBet(){
  if(raceActive) return;

  const val=parseInt(document.getElementById("bet").value);
  if(val<1 || val>4) return;

  bet=val;
  document.getElementById("betStatus").textContent="Bet locked: "+bet;
}

/* ================= RACE SYSTEM ================= */

function startRace(){
  const arena=document.getElementById("arena");
  arena.querySelectorAll(".marble").forEach(m=>m.remove());

  marbles=[];
  winner=null;
  raceActive=true;

  for(let i=0;i<4;i++){
    const m=document.createElement("div");
    m.className="marble";
    m.style.background=randomColor();
    m.style.top=(40+i*50)+"px";
    m.style.left="0px";

    arena.appendChild(m);

    marbles.push({
      el:m,
      x:0,
      speed:1.5+Math.random()*2.5,
      id:i+1,
      boost:Math.random()*0.3
    });
  }

  requestAnimationFrame(updateRace);
}

/* smooth physics */
function updateRace(){

  if(!raceActive) return;

  const arenaWidth=document.getElementById("arena").offsetWidth;

  marbles.forEach(m=>{

    if(m.id===winner) return;

    m.speed += m.boost;
    m.speed *= 0.99; // friction feel

    m.x += m.speed;

    m.el.style.left=m.x+"px";

    if(m.x >= arenaWidth-25 && !winner){
      winner=m.id;
      raceActive=false;

      document.getElementById("betStatus").innerHTML =
        `<span class="winner">Winner: Marble ${winner}</span>`;

      if(bet===winner){
        document.getElementById("betStatus").innerHTML += " 🎉 YOU WON!";
      }

      setTimeout(startRace, 3000);
    }
  });

  requestAnimationFrame(updateRace);
}

/* ================= UTILS ================= */
function randomColor(){
  return `hsl(${Math.random()*360},80%,55%)`;
}

</script>

</body>
</html>
