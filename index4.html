<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>knkj⚔️ RTS MMO</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0b0f14;
  color:white;
}

#map {
  height:100vh;
  width:100%;
}

#ui {
  position:absolute;
  top:10px;
  left:10px;
  width:260px;
  background:#1a1f2a;
  padding:12px;
  border-radius:10px;
  z-index:999;
}

input, button, textarea {
  width:100%;
  margin-top:6px;
  padding:8px;
  border:none;
  border-radius:6px;
}

button {
  background:#2d6cdf;
  color:white;
  font-weight:bold;
}

#log {
  position:absolute;
  bottom:10px;
  left:10px;
  width:320px;
  height:160px;
  overflow:auto;
  background:#1a1f2a;
  padding:10px;
  border-radius:10px;
  font-size:12px;
  z-index:999;
}

.popup-btn {
  margin-top:6px;
  background:#ff4d4d;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="ui">
  <b>⚔️ RTS MMO</b>
  <input id="nick" placeholder="Commander name">
  <button onclick="join()">Join</button>

  <div id="status">Offline</div>

  <hr>

  <textarea id="noteInput" placeholder="Write territory note..."></textarea>
  <button onclick="saveNote()">Save Note</button>
</div>

<div id="log"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const API = "https://script.google.com/macros/s/AKfycbyGqdSRP9n1O8Mr53B65hkl2P103xSAdVmKsqKf7MbZvg1KzB_3Z2VoFTTPPoI-vWSY/exec";

let map;
let nick = "";
let bases = {};
let selected = null;

// FIX: prevent popup auto closing behavior issues
map = L.map('map', {
  closePopupOnClick: false
}).setView([33.8,-118.3],12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19
}).addTo(map);

// ---------------- TILE ID ----------------
function tileId(latlng){
  return Math.floor(latlng.lat*50)+"_"+Math.floor(latlng.lng*50);
}

// ---------------- CLICK ----------------
map.on('click', async (e)=>{

  if(!nick) return;

  const id = tileId(e.latlng);

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"claim",
      id,
      lat:e.latlng.lat,
      lng:e.latlng.lng,
      nick
    })
  });

  sync();
});

// ---------------- JOIN ----------------
async function join(){
  nick = document.getElementById("nick").value.trim();
  if(!nick) return;

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"join",nick})
  });

  document.getElementById("status").innerText="Online";

  sync();
  setInterval(sync,2500);
}

// ---------------- ATTACK ----------------
async function attack(id){
  await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"claim",
      id,
      nick
    })
  });

  sync();
}

// ---------------- NOTE ----------------
async function saveNote(){
  if(!selected) return;

  const note = document.getElementById("noteInput").value;

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"note",
      id:selected,
      note
    })
  });

  log("📝 Note saved");
  sync();
}

// ---------------- DRAW BASE ----------------
function draw(b){

  if(bases[b.id]){
    map.removeLayer(bases[b.id]);
  }

  const color = hash(b.owner);

  const rect = L.rectangle([
    [b.lat,b.lng],
    [b.lat+0.02,b.lng+0.02]
  ],{
    color,
    fillColor:color,
    fillOpacity:0.4,
    weight:1
  }).addTo(map);

  const popupHTML = `
    <b>${b.owner || "Neutral"}</b><br>
    🪖 Troops: ${b.strength}<br>
    📝 Note: ${b.note || "none"}<br><br>

    <button onclick="attack('${b.id}')" class="popup-btn">
      ⚔️ Attack
    </button>
  `;

  rect.bindPopup(popupHTML, {
    autoClose:false,
    closeOnClick:false
  });

  rect.on("click", ()=>{
    selected = b.id;
    document.getElementById("noteInput").value = b.note || "";
  });

  bases[b.id]=rect;
}

// ---------------- SYNC ----------------
async function sync(){

  const res = await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"getWorld"})
  });

  const data = await res.json();

  Object.values(bases).forEach(b=>map.removeLayer(b));
  bases={};

  (data.tiles || []).forEach(draw);
}

// ---------------- HASH COLOR ----------------
function hash(str){
  if(!str) return "#666";

  let h=0;
  for(let i=0;i<str.length;i++){
    h=str.charCodeAt(i)+((h<<5)-h);
  }

  return "#"+((h&0xffffff).toString(16).padStart(6,"0"));
}

// ---------------- LOG ----------------
function log(msg){
  const div=document.getElementById("log");
  div.innerHTML += "• "+msg+"<br>";
}

</script>

</body>
</html>
