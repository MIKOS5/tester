<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚔️ Territory RTS MMO</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0b0f14;
  color:white;
}

#map {
  height:100vh;
  width:100%;
}

#ui {
  position:absolute;
  top:10px;
  left:10px;
  width:260px;
  background:#1a1f2a;
  padding:12px;
  border-radius:10px;
  z-index:999;
}

input, button {
  width:100%;
  margin-top:6px;
  padding:8px;
  border:none;
  border-radius:6px;
}

button {
  background:#2d6cdf;
  color:white;
  cursor:pointer;
}

button:hover {
  background:#3d7cff;
}

#log {
  position:absolute;
  bottom:10px;
  left:10px;
  width:300px;
  height:140px;
  overflow:auto;
  background:#1a1f2a;
  padding:10px;
  border-radius:10px;
  font-size:12px;
  z-index:999;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="ui">
  <b>⚔️ RTS MMO</b>

  <input id="nick" placeholder="Name">

  <button onclick="join()">Join</button>

  <div id="status">Offline</div>
</div>

<div id="log"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const API = "https://script.google.com/macros/s/AKfycbyGqdSRP9n1O8Mr53B65hkl2P103xSAdVmKsqKf7MbZvg1KzB_3Z2VoFTTPPoI-vWSY/exec";

let map;
let nick="";
let tiles = {};
let current = {};

// ================= MAP =================
map = L.map('map').setView([33.8,-118.3],12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19
}).addTo(map);

// ================= TILE ID =================
function tileId(latlng){
  return Math.floor(latlng.lat*50)+"_"+Math.floor(latlng.lng*50);
}

// ================= CLICK =================
map.on('click', async (e)=>{

  if(!nick) return;

  const id = tileId(e.latlng);

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"claim",
      id,
      lat:e.latlng.lat,
      lng:e.latlng.lng,
      nick
    })
  });

  sync();
});

// ================= JOIN =================
async function join(){

  nick = document.getElementById("nick").value.trim();
  if(!nick) return;

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"join",nick})
  });

  document.getElementById("status").innerText = "Online";

  log("Joined as " + nick);

  sync();
  setInterval(sync,2000);
}

// ================= SYNC =================
async function sync(){

  const res = await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"getWorld"})
  });

  const data = await res.json();

  Object.values(tiles).forEach(t => map.removeLayer(t));
  tiles = {};
  current = {};

  (data.tiles || []).forEach(drawTile);
}

// ================= DRAW TILE =================
function drawTile(t){

  current[t.id] = t;

  const color = t.owner ? hash(t.owner) : "#666";

  const rect = L.rectangle([
    [t.lat, t.lng],
    [t.lat+0.02, t.lng+0.02]
  ],{
    color,
    fillColor:color,
    fillOpacity:0.4
  }).addTo(map);

  rect.bindPopup(`
    <b>Owner:</b> ${t.owner || "None"}<br>
    <b>Troops:</b> ${t.strength || 0}<br>
    <b>Notes:</b> <span id="note_${t.id}">${t.note || "none"}</span><br><br>

    <button onclick="attack('${t.id}')">⚔️ Attack</button><br><br>

    <input id="input_${t.id}" placeholder="Add note">
    <button onclick="addNote('${t.id}')">Add Note</button>
  `);

  tiles[t.id] = rect;
}

// ================= ATTACK =================
async function attack(id){

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"claim",
      id,
      nick
    })
  });

  log("Attack sent: " + id);
  sync();
}

// ================= ADD NOTE =================
async function addNote(id){

  const val = document.getElementById("input_"+id).value;

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"note",
      id,
      note:val,
      nick
    })
  });

  log("Note added");
  sync();
}

// ================= COLOR =================
function hash(str){
  let h=0;
  for(let i=0;i<str.length;i++){
    h=str.charCodeAt(i)+((h<<5)-h);
  }
  return "#"+((h&0xffffff).toString(16).padStart(6,"0"));
}

// ================= LOG =================
function log(msg){
  document.getElementById("log").innerHTML += "• "+msg+"<br>";
}

</script>

</body>
</html>
