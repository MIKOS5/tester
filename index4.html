<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌍 Echo Shards RTS MMO v2</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0b0f14;
  color:white;
}

#map {
  height:100vh;
  width:100%;
  filter: brightness(0.9);
}

#ui {
  position:absolute;
  top:10px;
  left:10px;
  width:280px;
  background:#1a1f2a;
  padding:12px;
  border-radius:10px;
  z-index:9999;
}

button, input, textarea {
  width:100%;
  margin-top:6px;
  padding:8px;
  border:none;
  border-radius:6px;
}

button {
  background:#2d6cdf;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

#log {
  position:absolute;
  bottom:10px;
  left:10px;
  width:340px;
  height:140px;
  overflow:auto;
  background:#1a1f2a;
  padding:10px;
  border-radius:10px;
  font-size:12px;
  z-index:9999;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="ui">
  <b>🌍 Echo Shards MMO v2</b>
  <input id="nick" placeholder="Player Name">

  <button onclick="join()">Join World</button>
  <button onclick="spawnShard()">Spawn Shard Node</button>

  <div id="status">Offline</div>

  <textarea id="note" placeholder="Shard command / lore imprint"></textarea>
</div>

<div id="log"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const API = "YOUR_GOOGLE_SCRIPT_URL_HERE";

let map = L.map('map').setView([33.8,-118.3], 11);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

// ---------------- STATE ----------------
let nick = "";
let nodes = {};
let fog = {};
let tick = 0;

// ---------------- COLORS ----------------
function ownerColor(name){
  if(!name) return "#444";

  let h = 0;
  for(let i=0;i<name.length;i++){
    h = name.charCodeAt(i) + ((h<<5) - h);
  }
  return "#" + ((h & 0xFFFFFF).toString(16).padStart(6,"0"));
}

// ---------------- JOIN ----------------
function join(){
  nick = document.getElementById("nick").value;
  if(!nick) return;

  document.getElementById("status").innerText = "Online";
  log("Connected to Echo Shards world");

  sync();
  setInterval(sync, 2500);
  setInterval(simulateWorld, 3000);
}

// ---------------- NODE CREATION ----------------
function drawNode(n){

  if(nodes[n.id]){
    map.removeLayer(nodes[n.id]);
  }

  let power = n.level || 1;
  let influence = power * 25;

  let circle = L.circle([n.lat, n.lng], {
    radius: influence,
    color: ownerColor(n.owner),
    fillOpacity: 0.35
  }).addTo(map);

  circle.on("click", () => {

    circle.bindPopup(`
      <b>⚡ Shard Node</b><br>
      Owner: ${n.owner || "Neutral"}<br>
      Level: ${n.level}<br>
      Energy: ${n.energy}<br>
      Control: ${n.control || "Neutral"}<br><br>

      <button onclick="attack('${n.id}')">⚔ Attack</button>
      <button onclick="upgrade('${n.id}')">⬆ Upgrade</button>
    `).openPopup();
  });

  nodes[n.id] = circle;
}

// ---------------- SPAWN ----------------
async function spawnShard(){

  let c = map.getCenter();

  await fetch(API,{
    method:"POST",
    body: JSON.stringify({
      action:"spawn",
      id: crypto.randomUUID(),
      lat: c.lat + (Math.random()-0.5)*0.1,
      lng: c.lng + (Math.random()-0.5)*0.1,
      owner: nick,
      level: 1,
      energy: 60
    })
  });

  log("Shard node deployed");
  sync();
}

// ---------------- ATTACK ----------------
async function attack(id){

  await fetch(API,{
    method:"POST",
    body: JSON.stringify({
      action:"attack",
      id,
      nick
    })
  });

  log("⚔ Conflict initiated");
  sync();
}

// ---------------- UPGRADE ----------------
async function upgrade(id){

  await fetch(API,{
    method:"POST",
    body: JSON.stringify({
      action:"upgrade",
      id,
      nick
    })
  });

  log("⬆ Node strengthened");
  sync();
}

// ---------------- WORLD SIMULATION (NEW v2 CORE) ----------------
function simulateWorld(){

  tick++;

  Object.values(nodes).forEach(layer => {

    let n = layer.options;

    // passive decay simulation idea (server would actually handle this)
    if(Math.random() < 0.05){
      layer.setStyle({ opacity: 0.7 });
    }

  });

  // Fog expansion (revealed areas persist)
  let bounds = map.getBounds();
  fog[tick] = bounds;
}

// ---------------- SYNC ----------------
async function sync(){

  const res = await fetch(API,{
    method:"POST",
    body: JSON.stringify({ action:"getWorld" })
  });

  const data = await res.json();

  (data.nodes || []).forEach(drawNode);
}

// ---------------- LOG ----------------
function log(msg){
  document.getElementById("log").innerHTML += "• " + msg + "<br>";
}

</script>

</body>
</html>
