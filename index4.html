<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Risk MMO Territory</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body { margin:0; font-family:Arial; }

#map {
  height:100vh;
  width:100%;
}

/* UI PANEL */
#ui {
  position:absolute;
  top:10px;
  left:10px;
  background:white;
  padding:10px;
  border-radius:8px;
  z-index:999;
  width:180px;
}

button {
  width:100%;
  margin-top:5px;
}

/* GRID STYLE OVERLAY */
.grid-cell {
  stroke: rgba(0,0,0,0.15);
  fill-opacity: 0.35;
}

#status {
  font-size:12px;
  margin-top:5px;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="ui">
  Nick:<br>
  <input id="nick"><br>
  <button onclick="join()">Join Game</button>

  <div id="status">Not connected</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const API = "https://script.google.com/macros/s/AKfycbyGqdSRP9n1O8Mr53B65hkl2P103xSAdVmKsqKf7MbZvg1KzB_3Z2VoFTTPPoI-vWSY/exec";

let nick = "";
let map;
let gridSize = 0.02; // territory size (bigger = fewer tiles)
let tiles = {};

// ---------------- INIT MAP ----------------
map = L.map('map').setView([33.8, -118.3], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom: 19
}).addTo(map);

// ---------------- CLICK TO CLAIM ----------------
map.on('click', async (e)=> {
  if(!nick) return;

  const id = getTileId(e.latlng);

  await fetch(API, {
    method:"POST",
    body: JSON.stringify({
      action:"claim",
      id,
      lat: e.latlng.lat,
      lng: e.latlng.lng,
      nick
    })
  });
});

// ---------------- GRID SYSTEM ----------------
function getTileId(latlng){
  const x = Math.floor(latlng.lat / gridSize);
  const y = Math.floor(latlng.lng / gridSize);
  return x + "_" + y;
}

function getTileBounds(id){
  const [x,y] = id.split("_").map(Number);

  return [
    [x * gridSize, y * gridSize],
    [(x+1) * gridSize, (y+1) * gridSize]
  ];
}

// ---------------- JOIN ----------------
function join(){
  nick = document.getElementById("nick").value.trim();
  if(!nick) return;

  document.getElementById("status").innerText = "Online: " + nick;

  sync();
  setInterval(sync, 2000);
}

// ---------------- DRAW TILE ----------------
function drawTile(t){

  if(tiles[t.id]){
    map.removeLayer(tiles[t.id]);
  }

  const color = hashColor(t.owner);

  const rect = L.rectangle(getTileBounds(t.id), {
    color: color,
    weight: 1,
    fillOpacity: 0.35
  }).addTo(map);

  rect.bindPopup(
    "Owner: " + (t.owner || "None")
  );

  tiles[t.id] = rect;
}

// ---------------- COLOR HASH ----------------
function hashColor(str){
  if(!str) return "#cccccc";

  let hash = 0;
  for(let i=0;i<str.length;i++){
    hash = str.charCodeAt(i) + ((hash<<5)-hash);
  }

  let c = (hash & 0x00FFFFFF).toString(16).toUpperCase();
  return "#" + "00000".substring(0,6-c.length) + c;
}

// ---------------- SYNC ----------------
async function sync(){

  try {
    const res = await fetch(API,{
      method:"POST",
      body: JSON.stringify({action:"getTerritories"})
    });

    const data = await res.json();

    (data.territories || []).forEach(drawTile);

  } catch(e){
    console.log("sync error", e);
  }
}

</script>

</body>
</html>
