<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeoRisk MMO War</title>

<style>
body {
  margin:0;
  font-family:Arial;
  overflow:hidden;
  background:#111;
  color:white;
}

/* UI */
#ui {
  position:fixed;
  top:10px;
  left:10px;
  background:rgba(0,0,0,0.7);
  padding:10px;
  border-radius:10px;
  z-index:10;
}

input, button {
  padding:5px;
  margin-top:5px;
}

/* CANVAS WORLD */
#world {
  position:absolute;
  top:0;
  left:0;
}
</style>
</head>

<body>

<canvas id="world"></canvas>

<div id="ui">
  Nick:<br>
  <input id="nick"><br>
  <button onclick="join()">Join War</button>
  <button onclick="resetView()">Reset View</button>

  <div id="status">offline</div>
</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbyGqdSRP9n1O8Mr53B65hkl2P103xSAdVmKsqKf7MbZvg1KzB_3Z2VoFTTPPoI-vWSY/exec";

let nick = "";

/* WORLD SETTINGS */
const GRID_SIZE = 40;
const WORLD_W = 200;
const WORLD_H = 200;

let scale = 6;
let offsetX = 0;
let offsetY = 0;

/* canvas */
const canvas = document.getElementById("world");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

/* TERRITORY MAP */
let grid = {}; // "x_y" => owner

/* =========================
   JOIN
========================= */
async function join(){
  nick = document.getElementById("nick").value;
  if(!nick) return;

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"join",
      nick,
      channel:"world"
    })
  });

  document.getElementById("status").innerText = "ONLINE: " + nick;

  loop();
}

/* =========================
   WORLD GRID ID
========================= */
function cellId(x,y){
  return x + "_" + y;
}

/* =========================
   CLICK TO CLAIM
========================= */
canvas.addEventListener("click",(e)=>{

  if(!nick) return;

  const x = Math.floor((e.clientX - offsetX) / scale);
  const y = Math.floor((e.clientY - offsetY) / scale);

  const id = cellId(x,y);

  fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"claim",
      nick,
      id,
      lat:x,
      lng:y
    })
  });
});

/* =========================
   PAN (drag world)
========================= */
let dragging = false;
let lastX, lastY;

canvas.addEventListener("mousedown",(e)=>{
  dragging = true;
  lastX = e.clientX;
  lastY = e.clientY;
});

canvas.addEventListener("mouseup",()=>dragging=false);

canvas.addEventListener("mousemove",(e)=>{
  if(!dragging) return;

  offsetX += e.clientX - lastX;
  offsetY += e.clientY - lastY;

  lastX = e.clientX;
  lastY = e.clientY;
});

/* =========================
   ZOOM
========================= */
canvas.addEventListener("wheel",(e)=>{
  scale += e.deltaY * -0.01;
  scale = Math.min(20, Math.max(2, scale));
});

/* =========================
   DRAW WORLD GRID
========================= */
function draw(){

  ctx.clearRect(0,0,canvas.width,canvas.height);

  for(let x=0;x<WORLD_W;x++){
    for(let y=0;y<WORLD_H;y++){

      const id = cellId(x,y);
      const owner = grid[id];

      const px = x * scale + offsetX;
      const py = y * scale + offsetY;

      if(px < -50 || py < -50 || px > canvas.width+50 || py > canvas.height+50)
        continue;

      ctx.fillStyle = owner ? color(owner) : "#222";

      ctx.fillRect(px,py,scale,scale);

      ctx.strokeStyle = "#000";
      ctx.strokeRect(px,py,scale,scale);
    }
  }
}

/* =========================
   COLOR HASH
========================= */
function color(str){
  let hash = 0;
  for(let i=0;i<str.length;i++){
    hash = str.charCodeAt(i) + ((hash<<5)-hash);
  }
  return "#" + ((hash>>16)&255).toString(16).padStart(2,'0')
               + ((hash>>8)&255).toString(16).padStart(2,'0')
               + (hash&255).toString(16).padStart(2,'0');
}

/* =========================
   SYNC FROM SERVER
========================= */
async function sync(){

  const res = await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"getPixels",
      channel:"world"
    })
  });

  const data = await res.json();

  grid = {};

  (data.pixels || []).forEach(p=>{
    const id = cellId(p.x,p.y);
    grid[id] = p.owner;
  });
}

/* =========================
   LOOP
========================= */
function loop(){
  setInterval(sync, 1000);
  setInterval(draw, 16); // smooth 60fps render
}

/* reset view */
function resetView(){
  scale = 6;
  offsetX = 0;
  offsetY = 0;
}

</script>

</body>
</html>
