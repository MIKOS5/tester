<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Territory Pixel War IRC</title>

<style>
body {
  margin:0;
  font-family:Tahoma;
  background:#008080;
  overflow:hidden;
}

/* LOGIN */
#login {
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
}

.box {
  background:#d4d0c8;
  padding:20px;
  border:3px outset white;
}

/* APP */
#app {
  display:none;
  height:100vh;
  display:flex;
}

/* SIDEBAR */
#sidebar {
  width:200px;
  background:#d4d0c8;
  border-right:2px solid gray;
  padding:6px;
  overflow-y:auto;
}

/* MAIN */
#main {
  flex:1;
  display:flex;
  flex-direction:column;
}

/* CANVAS */
#canvasWrap {
  flex:1;
  overflow:auto;
  background:#222;
}

canvas {
  image-rendering: pixelated;
  cursor:crosshair;
}

/* TOOLS */
#tools {
  background:#111;
  color:white;
  padding:6px;
  display:flex;
  gap:6px;
  align-items:center;
}

/* COLORS */
.color {
  width:20px;
  height:20px;
  border:2px solid white;
  cursor:pointer;
}

/* CHAT */
#chat {
  height:180px;
  background:white;
  overflow-y:auto;
  padding:6px;
}

.nick { color:blue; font-weight:bold; }

/* INPUT */
#inputBar {
  display:flex;
}

#msg {
  flex:1;
  padding:6px;
  border:none;
}

/* STATUS */
#status {
  font-size:11px;
}

/* LEADERBOARD */
#leaderboard {
  font-size:12px;
}
</style>
</head>

<body>

<div id="login">
  <div class="box">
    Nickname<br>
    <input id="nick"><br><br>
    <button onclick="enter()">Enter</button>
  </div>
</div>

<div id="app">

  <div id="sidebar">
    <b>Leaderboard</b>
    <div id="leaderboard"></div>
  </div>

  <div id="main">

    <div id="canvasWrap">
      <canvas id="canvas"></canvas>
    </div>

    <div id="tools">
      Color:
      <div class="color" style="background:red" onclick="setColor('red')"></div>
      <div class="color" style="background:blue" onclick="setColor('blue')"></div>
      <div class="color" style="background:green" onclick="setColor('green')"></div>
      <div class="color" style="background:black" onclick="setColor('black')"></div>

      <span id="status">ready</span>
    </div>

    <div id="chat"></div>

    <div id="inputBar">
      <input id="msg" onkeydown="if(event.key==='Enter') send()">
      <button onclick="send()">Send</button>
    </div>

  </div>

</div>

<script>

const API = "YOUR_APPS_SCRIPT_URL";

let nick="";
let channel="#territory";

const GRID = 200;
const SIZE = 4;

let lastPixelTime = 0;
let lastChatTime = 0;
let cooldown = 1000;

let color = "black";

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = GRID;
canvas.height = GRID;
canvas.style.width = (GRID * SIZE) + "px";
canvas.style.height = (GRID * SIZE) + "px";

const ownership = {}; // key = x,y

// ---------------- ENTER ----------------
async function enter(){
  nick = document.getElementById("nick").value.trim();
  if(!nick) return;

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"join",nick,channel})
  });

  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="flex";

  loop();
}

// ---------------- LOOP ----------------
function loop(){
  setInterval(syncPixels, 400);
  setInterval(syncChat, 1000);
  setInterval(updateScores, 2000);
}

// ---------------- PIXEL CLICK ----------------
canvas.addEventListener("click", async e => {

  const now = Date.now();

  if(now - lastPixelTime < cooldown){
    document.getElementById("status").textContent="cooldown...";
    return;
  }

  const rect = canvas.getBoundingClientRect();

  const x = Math.floor((e.clientX - rect.left)/SIZE);
  const y = Math.floor((e.clientY - rect.top)/SIZE);

  drawPixel(x,y,color,nick);

  lastPixelTime = now;

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"placePixel",
      channel,
      nick,
      x,
      y,
      color
    })
  });

});

// ---------------- DRAW ----------------
function drawPixel(x,y,color,owner){

  const key = x + "," + y;

  ownership[key] = owner;

  ctx.fillStyle = color;
  ctx.fillRect(x, y, 1, 1);
}

// ---------------- SYNC PIXELS ----------------
async function syncPixels(){

  const res = await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"getPixels",
      channel,
      since:lastPixelTime
    })
  });

  const data = await res.json();

  (data.pixels || []).forEach(p=>{
    drawPixel(p.x,p.y,p.color,p.owner);
    lastPixelTime = Math.max(lastPixelTime, new Date(p.time).getTime());
  });

  document.getElementById("status").textContent="live";
}

// ---------------- CHAT ----------------
async function send(){
  const input=document.getElementById("msg");
  const text=input.value.trim();
  if(!text) return;

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"send",nick,channel,message:text})
  });

  input.value="";
}

async function syncChat(){

  const res = await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"get",channel})
  });

  const data = await res.json();
  const box = document.getElementById("chat");

  box.innerHTML="";

  (data.messages || []).forEach(m=>{
    const d=document.createElement("div");

    if(m.type==="system"){
      d.textContent="*** "+m.msg;
    } else {
      d.innerHTML=`<span class="nick">${m.nick}:</span> ${m.msg}`;
    }

    box.appendChild(d);
  });
}

// ---------------- LEADERBOARD ----------------
async function updateScores(){

  const res = await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"getScores",channel})
  });

  const data = await res.json();

  const scores = Object.entries(data.scores || {})
    .sort((a,b)=>b[1]-a[1])
    .slice(0,10);

  const box = document.getElementById("leaderboard");

  box.innerHTML = "";

  scores.forEach(([name,score])=>{
    box.innerHTML += name + ": " + score + "<br>";
  });
}

// ---------------- COLOR ----------------
function setColor(c){
  color = c;
}

</script>

</body>
</html>
