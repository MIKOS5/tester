<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<div id="map"></div>

<style>
#map { height:100vh; width:100%; }
</style>

<script>
let map = L.map('map').setView([33.8, -118.3], 12);

// base map (free tiles)
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap'
}).addTo(map);

// click to claim territory
map.on('click', async (e) => {

  if (!nick) return;

  const id = Math.floor(e.latlng.lat*50) + "_" + Math.floor(e.latlng.lng*50);

  await fetch(API, {
    method:"POST",
    body:JSON.stringify({
      action:"claim",
      nick,
      id,
      lat:e.latlng.lat,
      lng:e.latlng.lng
    })
  });

});
</script>
