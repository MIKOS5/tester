<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌍 Echo Shards</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0b0f14;
  color:white;
}

#map {
  height:100vh;
  width:100%;
}

#ui {
  position:absolute;
  top:10px;
  left:10px;
  width:260px;
  background:#1a1f2a;
  padding:12px;
  border-radius:10px;
  z-index:9999;
}

input, button {
  width:100%;
  margin-top:6px;
  padding:8px;
  border:none;
  border-radius:6px;
}

button {
  background:#2d6cdf;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

#log {
  position:absolute;
  bottom:10px;
  left:10px;
  width:320px;
  height:120px;
  overflow:auto;
  background:#1a1f2a;
  padding:10px;
  font-size:12px;
  z-index:9999;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="ui">
  <b>🌍 Echo Shards RTS v3</b>

  <input id="nick" placeholder="Player name">

  <button onclick="join()">Join World</button>
  <button onclick="spawn()">Spawn Shard</button>

  <div id="status">Offline</div>
</div>

<div id="log"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

////////////////////////////////////////////////////////////////////////////////
// 🔥 YOUR LIVE API (EMBEDDED)
////////////////////////////////////////////////////////////////////////////////

const API = "https://script.google.com/macros/s/AKfycbwfFHG9LeEzzYlVYCEXswjxeP_mVsevAqCtGybKBt9O5ww1Pn5d57S2yScP_2_rAinY/exec";

////////////////////////////////////////////////////////////////////////////////
// MAP
////////////////////////////////////////////////////////////////////////////////

let map = L.map('map').setView([33.8,-118.3], 11);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19
}).addTo(map);

////////////////////////////////////////////////////////////////////////////////
// STATE
////////////////////////////////////////////////////////////////////////////////

let nick = "";
let nodes = {};

////////////////////////////////////////////////////////////////////////////////
// FETCH (CRITICAL FIX - NO HEADERS, NO CORS PRE-FLIGHT)
////////////////////////////////////////////////////////////////////////////////

async function post(payload){

  const form = new FormData();

  for (let k in payload){
    form.append(k, payload[k]);
  }

  return fetch(API, {
    method: "POST",
    body: form
  });
}

////////////////////////////////////////////////////////////////////////////////
// JOIN
////////////////////////////////////////////////////////////////////////////////

function join(){
  nick = document.getElementById("nick").value;
  if(!nick) return;

  document.getElementById("status").innerText = "Online";

  sync();
  setInterval(sync, 3000);
}

////////////////////////////////////////////////////////////////////////////////
// SPAWN
////////////////////////////////////////////////////////////////////////////////

async function spawn(){

  let c = map.getCenter();

  try {
    await post({
      action:"spawn",
      id: crypto.randomUUID(),
      lat: c.lat,
      lng: c.lng,
      owner: nick
    });

    sync();

  } catch(e){
    console.log("SPAWN ERROR:", e);
  }
}

////////////////////////////////////////////////////////////////////////////////
// ATTACK
////////////////////////////////////////////////////////////////////////////////

async function attack(id){

  await post({
    action:"attack",
    id,
    nick
  });

  sync();
}

////////////////////////////////////////////////////////////////////////////////
// UPGRADE
////////////////////////////////////////////////////////////////////////////////

async function upgrade(id){

  await post({
    action:"upgrade",
    id,
    nick
  });

  sync();
}

////////////////////////////////////////////////////////////////////////////////
// DRAW NODE
////////////////////////////////////////////////////////////////////////////////

function draw(n){

  if(nodes[n.id]){
    map.removeLayer(nodes[n.id]);
  }

  let intensity = 200 + (Number(n.level || 1) * 80);

  let colorMap = {
    "VOID": "#7a2cff",
    "ORDER": "#2cc7ff",
    "CHAOS": "#ff2c6d",
    "Neutral": "#555"
  };

  let circle = L.circle([Number(n.lat), Number(n.lng)], {
    radius: intensity,
    color: colorMap[n.owner] || "#888",
    fillOpacity: 0.35
  }).addTo(map);

  circle.on("click", () => {

    circle.bindPopup(`
      <b>⚡ Territory Node</b><br>
      Faction: ${n.owner}<br>
      Level: ${n.level}<br>
      Energy: ${n.energy}<br>
      <hr>
      <button onclick="attack('${n.id}')">⚔ Raid</button>
      <button onclick="upgrade('${n.id}')">⬆ Fortify</button>
    `).openPopup();
  });

  nodes[n.id] = circle;
}

////////////////////////////////////////////////////////////////////////////////
// SYNC WORLD
////////////////////////////////////////////////////////////////////////////////

async function sync(){

  try {
    const res = await post({
      action:"getWorld"
    });

    const text = await res.text();
    const data = JSON.parse(text);

    (data.nodes || []).forEach(draw);

  } catch(e){
    console.log("SYNC ERROR:", e);
  }
}

////////////////////////////////////////////////////////////////////////////////
// AI TICK (WORLD LIVES WITHOUT PLAYERS)
////////////////////////////////////////////////////////////////////////////////

setInterval(() => {
  post({ action:"tick" });
}, 8000);

</script>

</body>
</html>
