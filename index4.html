<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚔️ MMO WAR SYSTEM</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body { margin:0; font-family:Arial; background:#111; }

#map { height:100vh; width:100%; }

#ui {
  position:absolute;
  top:10px;
  left:10px;
  background:white;
  padding:12px;
  border-radius:10px;
  width:240px;
  z-index:999;
}

input, button {
  width:100%;
  margin-top:6px;
  padding:6px;
}

#log {
  position:absolute;
  bottom:10px;
  left:10px;
  background:rgba(0,0,0,0.8);
  color:white;
  padding:10px;
  width:300px;
  height:140px;
  overflow:auto;
  font-size:12px;
}

.stat {
  font-size:12px;
  margin-top:5px;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="ui">
  <b>⚔️ MMO WAR</b>

  <input id="nick" placeholder="Commander name">
  <button onclick="join()">Join Empire</button>

  <button onclick="collect()">💰 Collect</button>

  <div class="stat" id="status">Offline</div>
  <div class="stat">Coins: <span id="coins">0</span></div>
</div>

<div id="log"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const API = "https://script.google.com/macros/s/AKfycbyGqdSRP9n1O8Mr53B65hkl2P103xSAdVmKsqKf7MbZvg1KzB_3Z2VoFTTPPoI-vWSY/exec";

let map;
let nick="";
let tiles={};
let faction="";

// MAP
map = L.map('map').setView([33.8,-118.3],12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19
}).addTo(map);

// CLICK
map.on('click', async (e)=>{

  if(!nick) return;

  const id = Math.floor(e.latlng.lat*50)+"_"+Math.floor(e.latlng.lng*50);

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"claim",
      id,
      lat:e.latlng.lat,
      lng:e.latlng.lng,
      nick
    })
  });

  sync();
});

// JOIN
async function join(){

  nick = document.getElementById("nick").value;

  const res = await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"join",nick})
  });

  const data = await res.json();
  faction = data.faction;

  document.getElementById("status").innerText =
    "Faction: " + faction;

  sync();
  setInterval(sync,2000);
}

// COLLECT
async function collect(){
  const res = await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"collect",nick})
  });

  const data = await res.json();
  document.getElementById("coins").innerText = data.coins;
}

// DRAW TILE
function draw(t){

  if(tiles[t.id]){
    map.removeLayer(tiles[t.id]);
  }

  const color = hash(t.owner);

  const rect = L.rectangle([
    [t.lat,t.lng],
    [t.lat+0.02,t.lng+0.02]
  ],{
    color,
    fillOpacity:0.4
  }).addTo(map);

  tiles[t.id]=rect;
}

// COLOR
function hash(s){
  if(!s) return "#666";

  let h=0;
  for(let i=0;i<s.length;i++){
    h=s.charCodeAt(i)+((h<<5)-h);
  }

  return "#"+((h&0xffffff).toString(16).padStart(6,"0"));
}

// LOG
function addLog(msg){
  const div=document.getElementById("log");
  div.innerHTML += msg + "<br>";
  div.scrollTop=div.scrollHeight;
}

// SYNC
async function sync(){

  const res = await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"getTerritories"})
  });

  const data = await res.json();

  Object.values(tiles).forEach(t=>map.removeLayer(t));
  tiles={};

  data.territories.forEach(draw);
}

</script>

</body>
</html>
