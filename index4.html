<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>mPro IRC Marble Betting Room</title>

<style>
body {
  margin:0;
  font-family:Tahoma;
  background:#0a7f7f;
  overflow:hidden;
}

/* LOGIN */
#login {
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
}

.box {
  background:#d4d0c8;
  padding:20px;
  border:3px outset white;
}

/* APP */
#app {
  display:none;
  height:100vh;
  display:flex;
}

/* SIDEBAR */
#sidebar {
  width:220px;
  background:#d4d0c8;
  border-right:2px solid gray;
  padding:6px;
  overflow-y:auto;
}

.btn {
  background:#d4d0c8;
  border:2px outset white;
  padding:5px;
  margin:3px 0;
  cursor:pointer;
}

/* CHAT */
#chat {
  flex:1;
  display:flex;
  flex-direction:column;
}

#header {
  background:#d4d0c8;
  padding:6px;
  border-bottom:2px solid gray;
}

#status {
  font-size:11px;
  padding:4px;
  background:#ddd;
}

#messages {
  flex:1;
  overflow-y:auto;
  padding:8px;
  background:white;
}

/* MARBLE ARENA */
#arena {
  height:240px;
  background:#111;
  position:relative;
  overflow:hidden;
}

.marble {
  position:absolute;
  width:16px;
  height:16px;
  border-radius:50%;
}

/* BETTING */
#betting {
  background:#222;
  color:white;
  padding:6px;
  font-size:12px;
}

#inputBar {
  display:flex;
}

#msg {
  flex:1;
  padding:8px;
  border:none;
}

/* TEXT */
.nick { color:blue; font-weight:bold; }
.system { color:gray; }
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div class="box">
    Nickname<br>
    <input id="nick"><br><br>
    <button onclick="enter()">Enter</button>
  </div>
</div>

<!-- APP -->
<div id="app">

  <div id="sidebar">
    <b>Channels</b>
    <div id="channels"></div>
    <hr>
    <b>Users</b>
    <div id="users"></div>
  </div>

  <div id="chat">

    <div id="header">#marbles</div>
    <div id="status">connecting...</div>

    <div id="messages"></div>

    <!-- MARBLE ARENA -->
    <div id="arena"></div>

    <!-- BETTING PANEL -->
    <div id="betting">
      Bet on marble (1–4): 
      <input id="bet" style="width:40px">
      <button onclick="placeBet()">Bet</button>
      <span id="betStatus"></span>
    </div>

    <div id="inputBar">
      <input id="msg" onkeydown="if(event.key==='Enter') send()">
      <button onclick="send()">Send</button>
    </div>

  </div>
</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbyGqdSRP9n1O8Mr53B65hkl2P103xSAdVmKsqKf7MbZvg1KzB_3Z2VoFTTPPoI-vWSY/exec";

let nick = "";
let channel = "#marbles";

let lastMsgTime = 0;
let betChoice = null;

/* =========================
   ENTER
========================= */
async function enter(){
  nick = document.getElementById("nick").value.trim();
  if(!nick) return;

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"join",nick,channel})
  });

  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="flex";

  loop();
}

/* =========================
   LOOP (optimized)
========================= */
function loop(){
  setInterval(syncMessages, 1200);
  setInterval(syncUsers, 3000);
  setInterval(runMarbleSim, 150);
}

/* =========================
   CHAT
========================= */
async function send(){
  const input=document.getElementById("msg");
  const text=input.value.trim();
  if(!text) return;

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"send",
      nick,
      channel,
      message:text
    })
  });

  input.value="";
}

async function syncMessages(){
  const res = await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"get",channel})
  });

  const data = await res.json();
  const box = document.getElementById("messages");

  box.innerHTML="";

  (data.messages || []).forEach(m=>{
    const d=document.createElement("div");

    if(m.type==="system"){
      d.className="system";
      d.textContent="*** "+m.msg;
    } else {
      d.innerHTML = `<span class="nick">${m.nick}:</span> ${escapeHtml(m.msg)}`;
    }

    box.appendChild(d);
  });

  document.getElementById("status").textContent="live";
}

/* =========================
   USERS
========================= */
async function syncUsers(){
  const res=await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"who",channel})
  });

  const data=await res.json();

  const box=document.getElementById("users");
  box.innerHTML="";

  (data.users||[]).forEach(u=>{
    const d=document.createElement("div");
    d.textContent=u;
    box.appendChild(d);
  });
}

/* =========================
   BETTING
========================= */
function placeBet(){
  const val = document.getElementById("bet").value;
  betChoice = parseInt(val);

  document.getElementById("betStatus").textContent =
    "Bet placed on marble #" + betChoice;
}

/* =========================
   MARBLE RACE ENGINE
========================= */

let marbles = [];
let finishOrder = [];
let running = false;

function initRace(){
  const arena = document.getElementById("arena");
  arena.innerHTML = "";

  marbles = [];
  finishOrder = [];
  running = true;

  for(let i=0;i<4;i++){
    const m = document.createElement("div");
    m.className="marble";
    m.style.background = randomColor();
    m.style.left="0px";
    m.style.top = (40 + i*40) + "px";

    arena.appendChild(m);

    marbles.push({
      el:m,
      x:0,
      speed:2 + Math.random()*3,
      id:i+1
    });
  }
}

/* auto restart every ~15 sec */
setInterval(()=>{
  initRace();
},15000);

/* physics loop */
function runMarbleSim(){
  if(!running) return;

  const arenaWidth = document.getElementById("arena").offsetWidth;

  marbles.forEach(m=>{
    m.x += m.speed + Math.random()*1.5;
    m.el.style.left = m.x + "px";

    if(m.x >= arenaWidth - 20 && !m.finished){
      m.finished = true;
      finishOrder.push(m.id);

      if(finishOrder.length === 1){
        document.getElementById("betStatus").textContent =
          "Winner: Marble " + m.id;
      }

      if(betChoice === m.id && finishOrder.length === 1){
        document.getElementById("betStatus").textContent += " 🎉 YOU WON BET!";
      }
    }
  });
}

/* start first race */
initRace();

/* =========================
   CHANNEL SWITCH
========================= */
function switchChannel(ch){
  channel = ch;
  document.getElementById("header").textContent = ch;
  document.getElementById("messages").innerHTML="";
}

/* =========================
   CHANNELS
========================= */
async function channels(){
  const res=await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"channels"})
  });

  const data=await res.json();

  const box=document.getElementById("channels");
  box.innerHTML="";

  (data.channels||[]).forEach(ch=>{
    const b=document.createElement("div");
    b.className="btn";
    b.textContent=ch;
    b.onclick=()=>switchChannel(ch);
    box.appendChild(b);
  });
}

setInterval(channels,5000);

/* =========================
   UTIL
========================= */
function randomColor(){
  return `hsl(${Math.random()*360},80%,50%)`;
}

function escapeHtml(t){
  return t.replace(/[&<>"']/g,"m");
}

</script>

</body>
</html>
