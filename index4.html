<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚔️ RTS MMO FIXED</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0b0f14;
  color:white;
}

#map {
  height:100vh;
  width:100%;
}

#ui {
  position:absolute;
  top:10px;
  left:10px;
  width:260px;
  background:#1a1f2a;
  padding:12px;
  border-radius:10px;
  z-index:999;
}

input, button {
  width:100%;
  margin-top:6px;
  padding:8px;
  border-radius:6px;
}

button {
  background:#2d6cdf;
  color:white;
  border:none;
  cursor:pointer;
}

#log {
  position:absolute;
  bottom:10px;
  left:10px;
  width:320px;
  height:140px;
  overflow:auto;
  background:#1a1f2a;
  padding:10px;
  font-size:12px;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="ui">
  <b>⚔️ RTS MMO FIX</b>
  <input id="nick" placeholder="name">
  <button onclick="join()">Join</button>
  <div id="status">offline</div>
</div>

<div id="log"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const API = "YOUR_SCRIPT_URL_HERE";

let map;
let nick="";
let tiles={};

// ---------------- MAP ----------------
map = L.map('map').setView([33.8,-118.3],12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19
}).addTo(map);

// ---------------- TILE ID ----------------
function tileId(latlng){
  return Math.floor(latlng.lat*50)+"_"+Math.floor(latlng.lng*50);
}

// ---------------- CLICK ----------------
map.on('click', async (e)=>{

  if(!nick) return;

  const id = tileId(e.latlng);

  log("click "+id);

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"claim",
      id,
      lat:e.latlng.lat,
      lng:e.latlng.lng,
      nick
    })
  });

  // 🔥 FORCE REFRESH (THIS WAS MISSING)
  sync();
});

// ---------------- JOIN ----------------
async function join(){

  nick=document.getElementById("nick").value;
  if(!nick) return;

  document.getElementById("status").innerText="online";

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"join",nick})
  });

  sync();
  setInterval(sync,2000);
}

// ---------------- DRAW ----------------
function draw(t){

  if(tiles[t.id]){
    map.removeLayer(tiles[t.id]);
  }

  const color = hash(t.owner);

  const rect = L.rectangle([
    [t.lat,t.lng],
    [t.lat+0.02,t.lng+0.02]
  ],{
    color,
    fillColor:color,
    fillOpacity:0.4
  }).addTo(map);

  tiles[t.id]=rect;
}

// ---------------- SYNC ----------------
async function sync(){

  const res = await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"getWorld"})
  });

  const data = await res.json();

  // clear old
  Object.values(tiles).forEach(t=>map.removeLayer(t));
  tiles={};

  (data.tiles||[]).forEach(draw);

  log("sync "+(data.tiles?.length||0));
}

// ---------------- COLOR ----------------
function hash(s){
  if(!s) return "#666";
  let h=0;
  for(let i=0;i<s.length;i++){
    h=s.charCodeAt(i)+((h<<5)-h);
  }
  return "#"+(h&0xffffff).toString(16).padStart(6,"0");
}

// ---------------- LOG ----------------
function log(m){
  document.getElementById("log").innerHTML+="• "+m+"<br>";
}

</script>

</body>
</html>
