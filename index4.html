<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sheets IRC Messenger</title>

<style>
body {
  margin:0;
  font-family:Tahoma;
  background:#c0c0c0;
}

/* LOGIN */
#login {
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
}

.box {
  background:#d4d0c8;
  padding:20px;
  border:3px outset white;
}

/* MAIN */
#app {
  display:none;
  height:100vh;
  display:flex;
}

/* SIDEBAR */
#sidebar {
  width:200px;
  background:#d4d0c8;
  border-right:2px solid gray;
  padding:6px;
}

.section { margin-bottom:10px; }

.btn {
  background:#d4d0c8;
  border:2px outset white;
  padding:4px;
  margin:2px 0;
  cursor:pointer;
}

/* CHAT */
#chat {
  flex:1;
  display:flex;
  flex-direction:column;
}

#header {
  background:#d4d0c8;
  padding:5px;
  border-bottom:2px solid gray;
}

#messages {
  flex:1;
  overflow-y:auto;
  padding:8px;
  background:white;
}

#inputBar {
  display:flex;
}

#msg {
  flex:1;
  padding:6px;
  border:none;
}

/* MESSAGE STYLES */
.system { color:gray; }
.nick { color:blue; font-weight:bold; }
.me { color:purple; }
.mention { background:yellow; }

/* DISCORD COMMAND UI */
#slashUI {
  position:absolute;
  bottom:60px;
  left:220px;
  width:300px;
  background:#2b2d31;
  color:white;
  border-radius:8px;
  display:none;
  font-size:13px;
  box-shadow:0 0 10px rgba(0,0,0,.5);
}

.slashItem {
  padding:8px;
  cursor:pointer;
  border-bottom:1px solid #444;
}

.slashItem:hover {
  background:#404249;
}

.argBox {
  padding:6px;
}

.argInput {
  width:100%;
  margin:3px 0;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div class="box">
    Screen Name<br>
    <input id="nick"><br><br>
    <button class="btn" onclick="enter()">Sign On</button>
  </div>
</div>

<!-- APP -->
<div id="app">

  <div id="sidebar">
    <div class="section">
      <b>Channels</b>
      <div id="channelList"></div>
    </div>

    <div class="section">
      <b>Users</b>
      <div id="userList"></div>
    </div>
  </div>

  <div id="chat">
    <div id="header">#general</div>
    <div id="messages"></div>

    <div id="inputBar">
      <input id="msg" placeholder="/ to open commands"
        onkeydown="if(event.key==='Enter') send()">
      <button class="btn" onclick="send()">Send</button>
    </div>
  </div>

</div>

<div id="slashUI"></div>

<script>

const API = "https://script.google.com/macros/s/AKfycbyGqdSRP9n1O8Mr53B65hkl2P103xSAdVmKsqKf7MbZvg1KzB_3Z2VoFTTPPoI-vWSY/exec";

let nick="";
let channel="#general";

// ENTER
async function enter(){
  nick=document.getElementById("nick").value.trim();
  if(!nick) return;

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"join",nick,channel})
  });

  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="flex";

  loop();
}

// LOOP
function loop(){
  load();
  who();
  channels();

  setInterval(load,1500);
  setInterval(who,3000);
  setInterval(channels,5000);
}

// SEND
async function send(){
  const input=document.getElementById("msg");
  const text=input.value.trim();
  if(!text) return;

  if(text.startsWith("/")){
    handleCommand(text);
    input.value="";
    return;
  }

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"send",
      nick,
      channel,
      message:text
    })
  });

  input.value="";
}

// COMMAND HANDLER
async function handleCommand(cmd){

  if(cmd.startsWith("/join ")){
    channel=cmd.split(" ")[1];
    await fetch(API,{method:"POST",body:JSON.stringify({action:"join",nick,channel})});
  }

  if(cmd.startsWith("/create ")){
    const ch=cmd.split(" ")[1];
    await fetch(API,{method:"POST",body:JSON.stringify({action:"create",channel:ch})});
  }

  if(cmd==="/part"){
    await fetch(API,{method:"POST",body:JSON.stringify({action:"part",nick,channel})});
  }

  if(cmd.startsWith("/me ")){
    await fetch(API,{
      method:"POST",
      body:JSON.stringify({
        action:"me",
        nick,
        channel,
        message:cmd.substring(4)
      })
    });
  }

  if(cmd.startsWith("/msg ")){
    const parts=cmd.split(" ");
    await fetch(API,{
      method:"POST",
      body:JSON.stringify({
        action:"dm",
        from:nick,
        to:parts[1],
        message:parts.slice(2).join(" ")
      })
    });
  }
}

// LOAD
async function load(){
  const res=await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"get",channel,nick})
  });

  const data=await res.json();
  const box=document.getElementById("messages");

  box.innerHTML="";

  data.messages.forEach(m=>{
    const d=document.createElement("div");

    if(m.type==="system"){
      d.className="system";
      d.textContent="*** "+m.msg;
    }
    else if(m.type==="me"){
      d.className="me";
      d.textContent="* "+m.nick+" "+m.msg;
    }
    else{
      d.className=m.msg.includes(nick)?"mention":"";
      d.innerHTML=`<span class="nick">${m.nick}:</span> ${m.msg}`;
    }

    box.appendChild(d);
  });

  box.scrollTop=box.scrollHeight;
}

// USERS
async function who(){
  const res=await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"who",channel})
  });

  const data=await res.json();
  const box=document.getElementById("userList");

  box.innerHTML="";
  data.users.forEach(u=>{
    const d=document.createElement("div");
    d.textContent=u;
    box.appendChild(d);
  });
}

// CHANNELS
async function channels(){
  const res=await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"channels"})
  });

  const data=await res.json();
  const box=document.getElementById("channelList");

  box.innerHTML="";
  data.channels.forEach(ch=>{
    const b=document.createElement("div");
    b.className="btn";
    b.textContent=ch;
    b.onclick=()=>{channel=ch;};
    box.appendChild(b);
  });
}

</script>

</body>
</html>
