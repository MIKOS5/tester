<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pixel Wall IRC</title>

<style>
body {
  margin:0;
  font-family:Tahoma;
  background:#008080;
  overflow:hidden;
}

/* LOGIN */
#login {
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
}

.box {
  background:#d4d0c8;
  padding:20px;
  border:3px outset white;
}

/* APP */
#app {
  display:none;
  height:100vh;
  display:flex;
}

/* SIDEBAR */
#sidebar {
  width:200px;
  background:#d4d0c8;
  border-right:2px solid gray;
  padding:6px;
}

/* MAIN */
#main {
  flex:1;
  display:flex;
  flex-direction:column;
}

/* CANVAS */
#canvasWrap {
  flex:1;
  background:#222;
  overflow:auto;
}

canvas {
  image-rendering: pixelated;
  cursor:crosshair;
}

/* TOOLS */
#tools {
  background:#111;
  color:white;
  padding:6px;
  display:flex;
  gap:6px;
  align-items:center;
}

.color {
  width:20px;
  height:20px;
  cursor:pointer;
  border:2px solid white;
}

/* STATUS */
#status {
  font-size:12px;
}
</style>
</head>

<body>

<div id="login">
  <div class="box">
    Nickname<br>
    <input id="nick"><br><br>
    <button onclick="enter()">Enter</button>
  </div>
</div>

<div id="app">

  <div id="sidebar">
    <b>Pixel Wall</b><br>
    Shared Canvas
  </div>

  <div id="main">

    <div id="canvasWrap">
      <canvas id="canvas"></canvas>
    </div>

    <div id="tools">
      Color:
      <div class="color" style="background:red" onclick="setColor('red')"></div>
      <div class="color" style="background:blue" onclick="setColor('blue')"></div>
      <div class="color" style="background:green" onclick="setColor('green')"></div>
      <div class="color" style="background:black" onclick="setColor('black')"></div>

      <span id="status">ready</span>
    </div>

  </div>

</div>

<script>

const API = "YOUR_APPS_SCRIPT_URL";

let nick="";
let channel="#pixel";

const GRID = 200; // size
const SIZE = 4;   // pixel size

let lastTime = 0;
let cooldown = 1000; // 1 sec

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

canvas.width = GRID;
canvas.height = GRID;

canvas.style.width = (GRID * SIZE) + "px";
canvas.style.height = (GRID * SIZE) + "px";

let color = "black";

/* ENTER */
async function enter(){
  nick = document.getElementById("nick").value.trim();
  if(!nick) return;

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"join",nick,channel})
  });

  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="flex";

  loop();
}

/* LOOP */
function loop(){
  setInterval(sync, 400);
}

/* CLICK PLACE PIXEL */
canvas.addEventListener("click", async e => {

  const now = Date.now();
  if(now - lastTime < cooldown){
    document.getElementById("status").textContent="cooldown...";
    return;
  }

  const rect = canvas.getBoundingClientRect();

  const x = Math.floor((e.clientX - rect.left) / SIZE);
  const y = Math.floor((e.clientY - rect.top) / SIZE);

  drawPixel(x,y,color);

  lastTime = now;

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"draw",
      channel,
      nick,
      x,
      y,
      color
    })
  });

});

/* DRAW LOCAL */
function drawPixel(x,y,color){
  ctx.fillStyle=color;
  ctx.fillRect(x, y, 1, 1);
}

/* SYNC */
async function sync(){

  const res = await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"getDraw",
      channel,
      since:lastTime
    })
  });

  const data = await res.json();

  (data.points || []).forEach(p=>{
    drawPixel(p.x, p.y, p.color);
    lastTime = Math.max(lastTime, new Date(p.time).getTime());
  });

  document.getElementById("status").textContent="live";
}

/* COLOR */
function setColor(c){
  color = c;
}

</script>

</body>
</html>
