<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚔️ Clash of Nations MMO RTS</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0b0f14;
  color:white;
}

/* MAP */
#map {
  height:100vh;
  width:100%;
}

/* UI PANEL */
#ui {
  position:absolute;
  top:10px;
  left:10px;
  width:260px;
  background:#1a1f2a;
  padding:12px;
  border-radius:10px;
  z-index:999;
  box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

input, button {
  width:100%;
  margin-top:6px;
  padding:8px;
  border:none;
  border-radius:6px;
}

button {
  background:#2d6cdf;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

button:hover {
  background:#3d7cff;
}

#status {
  margin-top:8px;
  font-size:12px;
  opacity:0.8;
}

/* INFO PANEL */
#info {
  margin-top:10px;
  font-size:12px;
  line-height:1.4;
}

/* WAR LOG */
#log {
  position:absolute;
  bottom:10px;
  left:10px;
  width:320px;
  height:160px;
  overflow:auto;
  background:#1a1f2a;
  padding:10px;
  border-radius:10px;
  font-size:12px;
  z-index:999;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="ui">
  <b>⚔️ Clash of Nations</b>

  <input id="nick" placeholder="Commander name">

  <button onclick="join()">Join Empire</button>
  <button onclick="collect()">💰 Collect Income</button>

  <div id="status">Offline</div>

  <div id="info">
    Coins: <span id="coins">0</span><br>
    Faction: <span id="faction">None</span>
  </div>
</div>

<div id="log"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const API = "https://script.google.com/macros/s/AKfycbyGqdSRP9n1O8Mr53B65hkl2P103xSAdVmKsqKf7MbZvg1KzB_3Z2VoFTTPPoI-vWSY/exec";

let map;
let nick="";
let faction="";
let bases={};
let armies=[];

// =========================
// MAP INIT
// =========================
map = L.map('map').setView([33.8,-118.3],12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19
}).addTo(map);

// =========================
// TILE SYSTEM
// =========================
function tileId(latlng){
  return Math.floor(latlng.lat*50)+"_"+Math.floor(latlng.lng*50);
}

function tileToLatLng(id){
  const [x,y]=id.split("_").map(Number);
  return [x/50, y/50];
}

// =========================
// CLICK ACTION
// =========================
map.on('click', async (e)=>{

  if(!nick) return;

  const id = tileId(e.latlng);

  const res = await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"claim",
      id,
      lat:e.latlng.lat,
      lng:e.latlng.lng,
      nick
    })
  });

  const data = await res.json();

  log("Action: "+data.result);

  sync();
});

// =========================
// JOIN
// =========================
async function join(){

  nick=document.getElementById("nick").value.trim();
  if(!nick) return;

  const res=await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"join",nick})
  });

  const data=await res.json();

  faction=data.faction || "Unknown";

  document.getElementById("status").innerText="Online";
  document.getElementById("faction").innerText=faction;

  log("Joined faction: "+faction);

  sync();

  setInterval(sync,2000);

  // RTS loop
  setInterval(()=>{
    fetch(API,{
      method:"POST",
      body:JSON.stringify({action:"tick"})
    });
  },3000);
}

// =========================
// ECONOMY
// =========================
async function collect(){

  const res=await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"collect",nick})
  });

  const data=await res.json();

  document.getElementById("coins").innerText=data.coins||0;

  log("Collected coins: "+data.coins);
}

// =========================
// DRAW BASE
// =========================
function drawBase(b){

  if(bases[b.id]){
    map.removeLayer(bases[b.id]);
  }

  const color = hash(b.owner);

  const rect = L.rectangle([
    [b.lat,b.lng],
    [b.lat+0.02,b.lng+0.02]
  ],{
    color,
    fillColor:color,
    fillOpacity:0.4,
    weight:1
  }).addTo(map);

  rect.bindPopup(
    "<b>"+(b.owner||"Neutral")+"</b><br>"+
    "Troops: "+b.troops+"<br>"+
    "Level: "+b.level
  );

  bases[b.id]=rect;
}

// =========================
// DRAW ARMIES
// =========================
function drawArmies(data){

  // clear old
  armies.forEach(a=>{
    map.removeLayer(a.line);
    map.removeLayer(a.dot);
  });

  armies=[];

  data.forEach(a=>{

    const from = tileToLatLng(a.from);
    const to = tileToLatLng(a.to);

    const lat = from[0] + (to[0]-from[0])*(a.progress/100);
    const lng = from[1] + (to[1]-from[1])*(a.progress/100);

    const color = hash(a.owner);

    const line = L.polyline([from,[lat,lng]],{
      color,
      weight:3
    }).addTo(map);

    const dot = L.circleMarker([lat,lng],{
      radius:5,
      color,
      fillColor:color,
      fillOpacity:1
    }).addTo(map);

    armies.push({line,dot});
  });
}

// =========================
// COLOR
// =========================
function hash(str){
  if(!str) return "#666";

  let h=0;
  for(let i=0;i<str.length;i++){
    h=str.charCodeAt(i)+((h<<5)-h);
  }

  return "#"+((h&0xffffff).toString(16).padStart(6,"0"));
}

// =========================
// SYNC
// =========================
async function sync(){

  try{

    const res=await fetch(API,{
      method:"POST",
      body:JSON.stringify({action:"getWorld"})
    });

    const data=await res.json();

    // bases
    Object.values(bases).forEach(b=>map.removeLayer(b));
    bases={};

    data.bases.forEach(drawBase);

    // armies
    if(data.armies){
      drawArmies(data.armies);
    }

  }catch(e){
    console.log(e);
  }
}

// =========================
// LOG
// =========================
function log(msg){

  const div=document.getElementById("log");

  div.innerHTML+="• "+msg+"<br>";
  div.scrollTop=div.scrollHeight;
}

</script>

</body>
</html>
