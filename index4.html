<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sheets IRC - Fast Sync</title>

<style>
body {
  margin:0;
  font-family:Tahoma;
  background:#008080;
  overflow:hidden;
}

/* LOGIN */
#login {
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
}

.box {
  background:#d4d0c8;
  padding:20px;
  border:3px outset white;
}

/* CHAT */
#app {
  display:none;
  height:100vh;
  display:flex;
}

#sidebar {
  width:200px;
  background:#d4d0c8;
  border-right:2px solid gray;
  padding:6px;
}

.btn {
  background:#d4d0c8;
  border:2px outset white;
  padding:4px;
  margin:2px 0;
  cursor:pointer;
}

#chat {
  flex:1;
  display:flex;
  flex-direction:column;
}

#header {
  background:#d4d0c8;
  padding:6px;
  border-bottom:2px solid gray;
}

#messages {
  flex:1;
  overflow-y:auto;
  padding:8px;
  background:white;
}

#inputBar {
  display:flex;
}

#msg {
  flex:1;
  padding:8px;
  border:none;
}

.nick { color:blue; font-weight:bold; }
.me { color:purple; }
.system { color:gray; }

</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div class="box">
    Nickname<br>
    <input id="nick"><br><br>
    <button onclick="enter()">Enter IRC</button>
  </div>
</div>

<!-- APP -->
<div id="app">

  <div id="sidebar">
    <b>Channels</b>
    <div id="channels"></div>
    <hr>
    <b>Users</b>
    <div id="users"></div>
  </div>

  <div id="chat">

    <div id="header">#general</div>

    <div id="messages"></div>

    <div id="inputBar">
      <input id="msg" onkeydown="if(event.key==='Enter') send()">
      <button onclick="send()">Send</button>
    </div>

  </div>

</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbyGqdSRP9n1O8Mr53B65hkl2P103xSAdVmKsqKf7MbZvg1KzB_3Z2VoFTTPPoI-vWSY/exec";

let nick="";
let channel="#general";
let lastTime=0;

// ---------------- LOGIN ----------------
async function enter(){
  nick=document.getElementById("nick").value.trim();
  if(!nick) return;

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"join",nick,channel})
  });

  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="flex";

  loop();
}

// ---------------- LOOP ----------------
function loop(){
  sync();

  setInterval(sync,500);   // FAST SYNC (key upgrade)
  setInterval(who,3000);
  setInterval(channels,5000);
}

// ---------------- SEND ----------------
async function send(){
  const input=document.getElementById("msg");
  const text=input.value.trim();
  if(!text) return;

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"send",
      nick,
      channel,
      message:text
    })
  });

  input.value="";
}

// ---------------- SMART SYNC ----------------
async function sync(){
  const res=await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"get",
      channel,
      nick,
      lastTime
    })
  });

  const data=await res.json();
  const box=document.getElementById("messages");

  data.messages.forEach(m=>{
    const d=document.createElement("div");

    if(m.type==="system"){
      d.className="system";
      d.textContent="*** "+m.msg;
    }
    else if(m.type==="me"){
      d.className="me";
      d.textContent="* "+m.nick+" "+m.msg;
    }
    else{
      d.innerHTML=`<span class="nick">${m.nick}:</span> ${m.msg}`;
    }

    box.appendChild(d);

    // update cursor
    lastTime = Math.max(lastTime, new Date(m.time).getTime());
  });

  const nearBottom =
    box.scrollTop + box.clientHeight >= box.scrollHeight - 50;

  if(nearBottom){
    box.scrollTop=box.scrollHeight;
  }
}

// ---------------- USERS ----------------
async function who(){
  const res=await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"who",channel})
  });

  const data=await res.json();

  const box=document.getElementById("users");
  box.innerHTML="";

  data.users.forEach(u=>{
    const d=document.createElement("div");
    d.textContent=u;
    box.appendChild(d);
  });
}

// ---------------- CHANNELS ----------------
async function channels(){
  const res=await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"channels"})
  });

  const data=await res.json();

  const box=document.getElementById("channels");
  box.innerHTML="";

  data.channels.forEach(ch=>{
    const b=document.createElement("div");
    b.className="btn";
    b.textContent=ch;
    b.onclick=()=>switchChannel(ch);
    box.appendChild(b);
  });
}

// ---------------- SWITCH CHANNEL ----------------
async function switchChannel(ch){
  channel=ch;
  document.getElementById("header").textContent=ch;
  document.getElementById("messages").innerHTML="";
  lastTime=0;
}

</script>

</body>
</html>
