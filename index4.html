<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>xPro Collaborative Whiteboard IRC</title>

<style>
body {
  margin:0;
  font-family:Tahoma;
  background:#008080;
  overflow:hidden;
}

/* LOGIN */
#login {
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
}

.box {
  background:#d4d0c8;
  padding:20px;
  border:3px outset white;
}

/* APP */
#app {
  display:none;
  height:100vh;
  display:flex;
}

/* SIDEBAR */
#sidebar {
  width:200px;
  background:#d4d0c8;
  border-right:2px solid gray;
  padding:6px;
  overflow-y:auto;
}

.btn {
  background:#d4d0c8;
  border:2px outset white;
  padding:4px;
  margin:2px 0;
  cursor:pointer;
}

/* CHAT */
#chat {
  flex:1;
  display:flex;
  flex-direction:column;
}

#header {
  background:#d4d0c8;
  padding:6px;
  border-bottom:2px solid gray;
}

#status {
  font-size:11px;
  padding:4px;
  background:#ddd;
}

#messages {
  flex:1;
  overflow-y:auto;
  padding:8px;
  background:white;
}

/* DRAW */
#drawBox {
  height:260px;
  border-top:2px solid gray;
  background:white;
  position:relative;
}

canvas {
  width:100%;
  height:100%;
  cursor:crosshair;
}

/* CURSOR */
.cursor {
  position:absolute;
  font-size:11px;
  pointer-events:none;
  transform: translate(-2px, -2px);
  font-weight:bold;
}

/* TOOLBAR */
#toolbar {
  padding:4px;
  background:#eee;
  border-bottom:1px solid gray;
  display:flex;
  gap:6px;
  align-items:center;
}

/* INPUT */
#inputBar {
  display:flex;
}

#msg {
  flex:1;
  padding:8px;
  border:none;
}

/* TEXT */
.nick { color:blue; font-weight:bold; }
.me { color:purple; }
.system { color:gray; }
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div class="box">
    Nickname<br>
    <input id="nick"><br><br>
    <button onclick="enter()">Enter</button>
  </div>
</div>

<!-- APP -->
<div id="app">

  <div id="sidebar">
    <b>Channels</b>
    <div id="channels"></div>
    <hr>
    <b>Users</b>
    <div id="users"></div>
  </div>

  <div id="chat">

    <div id="header">#general</div>
    <div id="status">connecting...</div>

    <div id="messages"></div>

    <!-- TOOLBAR -->
    <div id="toolbar">
      🎨 <input type="color" id="color" value="#000000">
      ✏️ <input type="range" id="size" min="1" max="10" value="2">

      <button onclick="tool='draw'">Draw</button>
      <button onclick="tool='erase'">Erase</button>
      <button onclick="clearBoard()">Clear</button>
    </div>

    <!-- CANVAS -->
    <div id="drawBox">
      <canvas id="canvas"></canvas>
    </div>

    <!-- CHAT INPUT -->
    <div id="inputBar">
      <input id="msg" onkeydown="if(event.key==='Enter') send()">
      <button onclick="send()">Send</button>
    </div>

  </div>
</div>

<script>

const API = "YOUR_SCRIPT_URL_HERE";

let nick = "";
let channel = "#general";
let lastStrokeTime = 0;

let tool = "draw";
let color = "#000000";
let size = 2;

/* CANVAS */
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;
}
resize();
window.addEventListener("resize", resize);

/* TOOL SETTINGS */
document.getElementById("color").oninput = e => color = e.target.value;
document.getElementById("size").oninput = e => size = e.target.value;

/* ENTER */
async function enter(){
  nick = document.getElementById("nick").value.trim();
  if(!nick) return;

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"join",nick,channel})
  });

  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="flex";

  loop();
}

/* LOOP */
function loop(){
  setInterval(syncMessages, 1000);
  setInterval(syncStrokes, 250);
  setInterval(syncCursors, 150);
  setInterval(who, 2000);
  setInterval(channels, 5000);
}

/* CHAT */
async function send(){
  const input=document.getElementById("msg");
  const text=input.value.trim();
  if(!text) return;

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"send",nick,channel,message:text})
  });

  input.value="";
}

/* MESSAGES */
async function syncMessages(){
  const res = await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"get",channel})
  });

  const data = await res.json();
  const box=document.getElementById("messages");

  box.innerHTML="";

  (data.messages||[]).forEach(m=>{
    const d=document.createElement("div");

    if(m.type==="system"){
      d.className="system";
      d.textContent="*** "+m.msg;
    } else {
      d.innerHTML=`<span class="nick">${m.nick}:</span> ${m.msg}`;
    }

    box.appendChild(d);
  });

  document.getElementById("status").textContent="live";
}

/* DRAWING */
let drawing=false;
let stroke=[];

canvas.addEventListener("mousedown",()=>{
  drawing=true;
  stroke=[];
});

canvas.addEventListener("mouseup",sendStroke);
canvas.addEventListener("mouseleave",sendStroke);

canvas.addEventListener("mousemove",(e)=>{

  const rect=canvas.getBoundingClientRect();
  const x=e.clientX-rect.left;
  const y=e.clientY-rect.top;

  // cursor update (throttled)
  fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"cursor",
      channel,
      nick,
      x,y
    })
  });

  if(!drawing) return;

  stroke.push({x,y});
  drawLocal(stroke);

});

/* SEND STROKE */
function sendStroke(){
  if(stroke.length<2) return;

  drawing=false;

  fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"drawStroke",
      channel,
      nick,
      points:stroke,
      color: tool==="erase" ? "#ffffff" : color,
      size:size
    })
  });

  stroke=[];
}

/* LOCAL DRAW */
function drawLocal(p){
  if(p.length<2) return;

  ctx.beginPath();
  ctx.moveTo(p[p.length-2].x, p[p.length-2].y);
  ctx.lineTo(p[p.length-1].x, p[p.length-1].y);

  ctx.strokeStyle = tool==="erase" ? "#fff" : color;
  ctx.lineWidth = size;
  ctx.lineCap = "round";
  ctx.stroke();
}

/* SYNC STROKES */
async function syncStrokes(){

  const res=await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"getStrokes",
      channel,
      since:lastStrokeTime
    })
  });

  const data=await res.json();

  (data.strokes||[]).forEach(s=>{
    drawStroke(s.points, s.color, s.size);
    lastStrokeTime = Math.max(lastStrokeTime, new Date(s.time).getTime());
  });
}

function drawStroke(points,color,size=2){
  if(points.length<2) return;

  ctx.beginPath();
  ctx.moveTo(points[0].x, points[0].y);

  for(let i=1;i<points.length;i++){
    ctx.lineTo(points[i].x, points[i].y);
  }

  ctx.strokeStyle=color;
  ctx.lineWidth=size;
  ctx.lineCap="round";
  ctx.stroke();
}

/* CLEAR BOARD */
async function clearBoard(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"clearDraw",
      channel
    })
  });
}

/* CURSORS */
async function syncCursors(){

  const res=await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"getCursors",channel})
  });

  const data=await res.json();

  document.querySelectorAll(".cursor").forEach(e=>e.remove());

  (data.cursors||[]).forEach(c=>{

    if(c.nick===nick) return;

    const el=document.createElement("div");
    el.className="cursor";
    el.textContent=c.nick;
    el.style.left=c.x+"px";
    el.style.top=c.y+"px";
    el.style.color="hsl("+(c.nick.length*70%360)+",100%,40%)";

    document.getElementById("drawBox").appendChild(el);
  });
}

/* USERS */
async function who(){
  const res=await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"who",channel})
  });

  const data=await res.json();

  const box=document.getElementById("users");
  box.innerHTML="";

  (data.users||[]).forEach(u=>{
    const d=document.createElement("div");
    d.textContent=u;
    box.appendChild(d);
  });
}

/* CHANNELS */
async function channels(){
  const res=await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"channels"})
  });

  const data=await res.json();

  const box=document.getElementById("channels");
  box.innerHTML="";

  (data.channels||[]).forEach(ch=>{
    const b=document.createElement("div");
    b.className="btn";
    b.textContent=ch;
    b.onclick=()=>switchChannel(ch);
    box.appendChild(b);
  });
}

/* SWITCH CHANNEL */
function switchChannel(ch){
  channel=ch;
  document.getElementById("header").textContent=ch;
  document.getElementById("messages").innerHTML="";
  ctx.clearRect(0,0,canvas.width,canvas.height);
  lastStrokeTime=0;
}

</script>
</body>
</html>
