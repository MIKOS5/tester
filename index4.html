<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚔️x RTS MMO BASE</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body { margin:0; font-family:Arial; background:#0b0f14; color:white; }
#map { height:100vh; width:100%; }

#ui {
  position:absolute;
  top:10px;
  left:10px;
  background:#1a1f2a;
  padding:10px;
  z-index:999;
  border-radius:8px;
  width:220px;
}
button, input { width:100%; margin-top:6px; padding:6px; }
#log {
  position:absolute;
  bottom:10px;
  left:10px;
  background:#1a1f2a;
  padding:10px;
  width:300px;
  height:140px;
  overflow:auto;
  font-size:12px;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="ui">
  <input id="nick" placeholder="name">
  <button onclick="join()">Join</button>
  <div>Status: <span id="status">offline</span></div>
</div>

<div id="log"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const API = "https://script.google.com/macros/s/AKfycbyGqdSRP9n1O8Mr53B65hkl2P103xSAdVmKsqKf7MbZvg1KzB_3Z2VoFTTPPoI-vWSY/exec";

let map;
let nick="";
let tiles={};
const GRID = 0.02;

// ---------------- MAP ----------------
map = L.map('map').setView([33.8,-118.3],12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19
}).addTo(map);

// ---------------- TILE ID ----------------
function id(latlng){
  const x = Math.floor(latlng.lat / GRID);
  const y = Math.floor(latlng.lng / GRID);
  return x + "_" + y;
}

function bounds(tile){
  const [x,y]=tile.split("_").map(Number);
  return [
    [x*GRID, y*GRID],
    [(x+1)*GRID, (y+1)*GRID]
  ];
}

// ---------------- CLICK ----------------
map.on('click', async (e)=>{

  if(!nick) return;

  const tileId = id(e.latlng);

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"claim",
      id:tileId,
      lat:e.latlng.lat,
      lng:e.latlng.lng,
      nick
    })
  });

  sync();
});

// ---------------- JOIN ----------------
async function join(){

  nick=document.getElementById("nick").value;
  if(!nick) return;

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"join",nick})
  });

  document.getElementById("status").innerText="online";

  sync();
  setInterval(sync,3000);
}

// ---------------- DRAW ----------------
function draw(t){

  if(tiles[t.id]) map.removeLayer(tiles[t.id]);

  const color = hash(t.owner);

  const r = L.rectangle(bounds(t.id),{
    color,
    fillColor:color,
    fillOpacity:0.4
  }).addTo(map);

  r.bindPopup(
    `Owner: ${t.owner || "none"}<br>Troops: ${t.troops}`
  );

  tiles[t.id]=r;
}

// ---------------- SYNC ----------------
async function sync(){

  const res = await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"getWorld"})
  });

  const data = await res.json();

  Object.values(tiles).forEach(t=>map.removeLayer(t));
  tiles={};

  (data.bases||[]).forEach(draw);
}

// ---------------- COLOR ----------------
function hash(str){
  if(!str) return "#555";

  let h=0;
  for(let i=0;i<str.length;i++){
    h=str.charCodeAt(i)+((h<<5)-h);
  }

  return "#"+((h&0xffffff).toString(16).padStart(6,"0"));
}

// ---------------- LOG ----------------
function log(m){
  document.getElementById("log").innerHTML+="• "+m+"<br>";
}

</script>

</body>
</html>
