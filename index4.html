<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sheets IRC Network</title>

<style>
body {
  margin:0;
  font-family:Tahoma;
  background:#008080;
  overflow:hidden;
}

/* LOGIN */
#login {
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
}

.box {
  background:#d4d0c8;
  padding:20px;
  border:3px outset white;
}

/* APP */
#app {
  display:none;
  height:100vh;
  display:flex;
}

/* SIDEBAR */
#sidebar {
  width:200px;
  background:#d4d0c8;
  border-right:2px solid gray;
  padding:6px;
  overflow-y:auto;
}

.btn {
  background:#d4d0c8;
  border:2px outset white;
  padding:4px;
  margin:2px 0;
  cursor:pointer;
}

/* CHAT */
#chat {
  flex:1;
  display:flex;
  flex-direction:column;
}

#header {
  background:#d4d0c8;
  padding:6px;
  border-bottom:2px solid gray;
}

#messages {
  flex:1;
  overflow-y:auto;
  padding:8px;
  background:white;
}

/* CANVAS PANEL */
#canvasWrap {
  height:200px;
  background:#eee;
  border-top:2px solid gray;
}

#drawCanvas {
  width:100%;
  height:100%;
  touch-action:none;
  cursor:crosshair;
}

/* INPUT */
#inputBar {
  display:flex;
}

#msg {
  flex:1;
  padding:8px;
  border:none;
}

/* TEXT */
.nick { color:blue; font-weight:bold; }
.me { color:purple; }
.system { color:gray; }

#status {
  font-size:11px;
  padding:4px;
  background:#ddd;
}
</style>
</head>

<body>

<div id="login">
  <div class="box">
    Nickname<br>
    <input id="nick"><br><br>
    <button onclick="enter()">Enter IRC</button>
  </div>
</div>

<div id="app">

  <div id="sidebar">
    <b>Channels</b>
    <div id="channels"></div>

    <hr>

    <b>Users</b>
    <div id="users"></div>
  </div>

  <div id="chat">

    <div id="header">#general</div>

    <div id="status">connecting...</div>

    <div id="messages"></div>

    <!-- 🎨 DRAW AREA -->
    <div id="canvasWrap">
      <canvas id="drawCanvas"></canvas>
    </div>

    <div id="inputBar">
      <input id="msg" placeholder="type /clearcanvas..." onkeydown="if(event.key==='Enter') send()">
      <button onclick="send()">Send</button>
    </div>

  </div>

</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbyGqdSRP9n1O8Mr53B65hkl2P103xSAdVmKsqKf7MbZvg1KzB_3Z2VoFTTPPoI-vWSY/exec";

let nick = "";
let channel = "#general";
let lastTime = 0;

// ---------------- ENTER ----------------
async function enter(){
  nick=document.getElementById("nick").value.trim();
  if(!nick) return;

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"join",nick,channel})
  });

  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="flex";

  initCanvas();
  loop();
}

// ---------------- LOOP ----------------
function loop(){
  setInterval(()=>{
    smartSync();
    who();
    channels();
    syncDraw();
  },800);
}

// ---------------- SEND ----------------
async function send(){
  const input=document.getElementById("msg");
  const text=input.value.trim();
  if(!text) return;

  if(text === "/clearcanvas"){
    await fetch(API,{
      method:"POST",
      body:JSON.stringify({action:"clearDraw",channel})
    });
    ctx.clearRect(0,0,canvas.width,canvas.height);
    input.value="";
    return;
  }

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"send",
      nick,
      channel,
      message:text
    })
  });

  input.value="";
}

// ---------------- CHAT ----------------
async function smartSync(){
  const res = await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"get",channel})
  });

  const data = await res.json();
  const box = document.getElementById("messages");
  box.innerHTML="";

  data.messages.forEach(m=>{
    const d=document.createElement("div");

    if(m.type==="system"){
      d.className="system";
      d.textContent="*** "+m.msg;
    }
    else if(m.type==="me"){
      d.className="me";
      d.textContent="* "+m.nick+" "+m.msg;
    }
    else{
      d.innerHTML=`<span class="nick">${m.nick}:</span> ${m.msg}`;
    }

    box.appendChild(d);
  });

  box.scrollTop = box.scrollHeight;
}

// ---------------- USERS ----------------
async function who(){
  const res=await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"who",channel})
  });

  const data=await res.json();
  const box=document.getElementById("users");
  box.innerHTML="";

  data.users.forEach(u=>{
    const d=document.createElement("div");
    d.textContent=u;
    box.appendChild(d);
  });
}

// ---------------- CHANNELS ----------------
async function channels(){
  const res=await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"channels"})
  });

  const data=await res.json();
  const box=document.getElementById("channels");
  box.innerHTML="";

  data.channels.forEach(ch=>{
    const b=document.createElement("div");
    b.className="btn";
    b.textContent=ch;
    b.onclick=()=>switchChannel(ch);
    box.appendChild(b);
  });
}

// ---------------- SWITCH ----------------
function switchChannel(ch){
  channel=ch;
  document.getElementById("header").textContent=ch;
  document.getElementById("messages").innerHTML="";
  ctx.clearRect(0,0,canvas.width,canvas.height);
}

// ---------------- 🎨 DRAW SYSTEM ----------------
let canvas, ctx, drawing=false;

function initCanvas(){
  canvas=document.getElementById("drawCanvas");
  ctx=canvas.getContext("2d");

  resizeCanvas();

  canvas.addEventListener("mousedown",startDraw);
  canvas.addEventListener("mousemove",draw);
  canvas.addEventListener("mouseup",()=>drawing=false);

  canvas.addEventListener("touchstart",startDraw);
  canvas.addEventListener("touchmove",drawTouch);
  canvas.addEventListener("touchend",()=>drawing=false);
}

function resizeCanvas(){
  canvas.width=canvas.offsetWidth;
  canvas.height=canvas.offsetHeight;
}

function startDraw(e){
  drawing=true;
}

async function draw(e){
  if(!drawing) return;

  const rect=canvas.getBoundingClientRect();
  const x=e.clientX-rect.left;
  const y=e.clientY-rect.top;

  ctx.fillRect(x,y,2,2);

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"draw",
      channel,
      nick,
      x,y,
      color:"#000"
    })
  });
}

async function drawTouch(e){
  if(!drawing) return;
  const t=e.touches[0];
  draw({clientX:t.clientX,clientY:t.clientY});
}

// ---------------- SYNC DRAW ----------------
async function syncDraw(){
  const res = await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"getDraw",channel})
  });

  const data = await res.json();

  ctx.clearRect(0,0,canvas.width,canvas.height);

  data.points.forEach(p=>{
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x,p.y,2,2);
  });
}

</script>

</body>
</html>
