<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>j⚔️ Territory RTS</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0b0f14;
  color:white;
}

#map {
  height:100vh;
  width:100%;
}

#ui {
  position:absolute;
  top:10px;
  left:10px;
  width:240px;
  background:#1a1f2a;
  padding:10px;
  border-radius:10px;
  z-index:999;
}

input, button {
  width:100%;
  padding:8px;
  margin-top:6px;
  border:none;
  border-radius:6px;
}

button {
  background:#2d6cdf;
  color:white;
  font-weight:bold;
}

#log {
  position:absolute;
  bottom:10px;
  left:10px;
  width:300px;
  height:150px;
  overflow:auto;
  background:#1a1f2a;
  padding:10px;
  font-size:12px;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="ui">
  <b>⚔️ RTS MMO</b>
  <input id="nick" placeholder="name">
  <button onclick="join()">Join</button>
  <div id="status">Offline</div>
</div>

<div id="log"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const API = "https://script.google.com/macros/s/AKfycbyGqdSRP9n1O8Mr53B65hkl2P103xSAdVmKsqKf7MbZvg1KzB_3Z2VoFTTPPoI-vWSY/exec";

let map;
let nick="";
let tiles = {};
let selectedTile = null;

// ---------------- MAP ----------------
map = L.map('map').setView([33.8,-118.3], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19
}).addTo(map);

// ---------------- TILE ID ----------------
function tileId(latlng){
  return Math.floor(latlng.lat*50)+"_"+Math.floor(latlng.lng*50);
}

// ---------------- JOIN ----------------
async function join(){
  nick = document.getElementById("nick").value;
  if(!nick) return;

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"join",nick})
  });

  document.getElementById("status").innerText = "Online";

  sync();
  setInterval(sync, 3000);
}

// ---------------- CLICK MAP (CLAIM OR SELECT) ----------------
map.on('click', async (e)=>{

  if(!nick) return;

  const id = tileId(e.latlng);

  // If tile exists → show popup info
  const tile = tiles[id];

  if(tile){
    tile.openPopup();
    return;
  }

  // otherwise claim
  await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"claim",
      id,
      lat:e.latlng.lat,
      lng:e.latlng.lng,
      nick
    })
  });

  log("Tile action sent");
  sync();
});

// ---------------- ATTACK BUTTON ----------------
async function attack(id){

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"claim",
      id,
      nick
    })
  });

  log("⚔️ Attack sent");
  sync();
}

// ---------------- DRAW TILE ----------------
function drawTile(t){

  if(tiles[t.id]){
    map.removeLayer(tiles[t.id]);
  }

  const color = hash(t.owner);

  const rect = L.rectangle([
    [t.lat,t.lng],
    [t.lat+0.02,t.lng+0.02]
  ],{
    color,
    fillColor:color,
    fillOpacity:0.4,
    weight:1
  }).addTo(map);

  const popupHtml = `
    <b>Territory</b><br>
    Owner: ${t.owner || "None"}<br>
    Strength: ${t.strength}<br>
    Level: 1<br><br>

    <button onclick="attack('${t.id}')">
      ⚔️ Attack / 🛡️ Reinforce
    </button>
  `;

  rect.bindPopup(popupHtml);

  tiles[t.id] = rect;
}

// ---------------- COLOR ----------------
function hash(str){
  if(!str) return "#666";

  let h=0;
  for(let i=0;i<str.length;i++){
    h=str.charCodeAt(i)+((h<<5)-h);
  }

  return "#"+((h&0xffffff).toString(16).padStart(6,"0"));
}

// ---------------- SYNC ----------------
async function sync(){

  const res = await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"getWorld"})
  });

  const data = await res.json();

  Object.values(tiles).forEach(t=>map.removeLayer(t));
  tiles = {};

  (data.tiles || []).forEach(drawTile);
}

// ---------------- LOG ----------------
function log(msg){
  document.getElementById("log").innerHTML += "• " + msg + "<br>";
}

</script>

</body>
</html>
