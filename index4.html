<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚔️ RTS MMO WAR WORLD</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0f1115;
  color:white;
}

/* MAP */
#map {
  height:100vh;
  width:100%;
  z-index:1;
}

/* UI */
#ui {
  position:absolute;
  top:10px;
  left:10px;
  width:240px;
  background:#1c1f26;
  padding:12px;
  border-radius:10px;
  z-index:999;
  box-shadow:0 5px 20px rgba(0,0,0,0.5);
}

input, button {
  width:100%;
  margin-top:6px;
  padding:8px;
  border:none;
  border-radius:6px;
}

button {
  cursor:pointer;
  background:#2d6cdf;
  color:white;
  font-weight:bold;
}

button:hover {
  background:#3c7cff;
}

#status {
  margin-top:8px;
  font-size:12px;
  opacity:0.8;
}

/* WAR LOG */
#log {
  position:absolute;
  bottom:10px;
  left:10px;
  width:280px;
  height:140px;
  overflow:auto;
  background:#1c1f26;
  padding:10px;
  border-radius:10px;
  font-size:12px;
  z-index:999;
}

/* TILE POPUP FIX */
.leaflet-popup-content {
  color:black;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="ui">
  <b>⚔️ RTS MMO</b>

  <input id="nick" placeholder="Commander name">

  <button onclick="join()">Join Empire</button>

  <button onclick="collect()">💰 Collect Income</button>

  <div id="status">Offline</div>
  <div>Coins: <span id="coins">0</span></div>
</div>

<div id="log"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const API = "https://script.google.com/macros/s/AKfycbyGqdSRP9n1O8Mr53B65hkl2P103xSAdVmKsqKf7MbZvg1KzB_3Z2VoFTTPPoI-vWSY/exec";

let map;
let nick = "";
let faction = "";
let tiles = {};
let lastSync = 0;

// =========================
// MAP
// =========================
map = L.map('map').setView([33.8, -118.3], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom: 19
}).addTo(map);

// =========================
// CLICK TILE (CLAIM / ATTACK)
// =========================
map.on('click', async (e)=>{

  if(!nick) return;

  const id = tileId(e.latlng);

  await fetch(API,{
    method:"POST",
    body: JSON.stringify({
      action:"claim",
      id,
      lat:e.latlng.lat,
      lng:e.latlng.lng,
      nick
    })
  });

  sync();
});

// =========================
// TILE SYSTEM
// =========================
function tileId(latlng){
  return Math.floor(latlng.lat*50)+"_"+Math.floor(latlng.lng*50);
}

// =========================
// JOIN
// =========================
async function join(){

  nick = document.getElementById("nick").value.trim();
  if(!nick) return;

  const res = await fetch(API,{
    method:"POST",
    body: JSON.stringify({action:"join", nick})
  });

  const data = await res.json();
  faction = data.faction || "";

  document.getElementById("status").innerText =
    "Online • " + faction;

  log("Joined as " + nick + " (" + faction + ")");

  sync();
  setInterval(sync, 2500);
}

// =========================
// COLLECT INCOME
// =========================
async function collect(){

  const res = await fetch(API,{
    method:"POST",
    body: JSON.stringify({action:"collect", nick})
  });

  const data = await res.json();
  document.getElementById("coins").innerText = data.coins || 0;

  log("Collected " + (data.coins || 0) + " coins");
}

// =========================
// DRAW TILE
// =========================
function draw(t){

  const id = t.id;

  if(tiles[id]){
    map.removeLayer(tiles[id]);
  }

  const color = colorHash(t.owner);

  const bounds = [
    [t.lat, t.lng],
    [t.lat+0.02, t.lng+0.02]
  ];

  const rect = L.rectangle(bounds,{
    color: color,
    fillColor: color,
    fillOpacity: 0.35,
    weight: 1
  }).addTo(map);

  rect.bindPopup(
    "Owner: " + (t.owner || "None") +
    "<br>Troops: " + (t.troops || 0)
  );

  tiles[id] = rect;
}

// =========================
// COLOR FACTIONS
// =========================
function colorHash(str){

  if(!str) return "#666";

  let h = 0;
  for(let i=0;i<str.length;i++){
    h = str.charCodeAt(i) + ((h<<5)-h);
  }

  const c = (h & 0xffffff).toString(16).padStart(6,"0");
  return "#" + c;
}

// =========================
// SYNC WORLD
// =========================
async function sync(){

  try {

    const res = await fetch(API,{
      method:"POST",
      body: JSON.stringify({
        action:"getTerritories",
        since:lastSync
      })
    });

    const data = await res.json();

    lastSync = data.serverTime || Date.now();

    if(data.territories){

      for(const t of data.territories){
        draw(t);
      }
    }

  } catch(e){
    console.log("sync error", e);
  }
}

// =========================
// LOG SYSTEM
// =========================
function log(msg){

  const div = document.getElementById("log");
  div.innerHTML += "• " + msg + "<br>";
  div.scrollTop = div.scrollHeight;
}

</script>

</body>
</html>
