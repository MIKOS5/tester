<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>xRetro Messenger</title>

<link rel="manifest" href="manifest.json">

<style>
body {
  margin:0;
  font-family:Tahoma;
  background:#008080;
  overflow:hidden;
}

/* LOGIN */
#login {
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
}

.box {
  background:#d4d0c8;
  padding:20px;
  border:3px outset white;
}

/* DESKTOP */
#desktop {
  display:none;
  width:100%;
  height:100vh;
  position:relative;
}

/* MAIN CHAT */
#main {
  position:absolute;
  top:20px;
  left:20px;
  width:420px;
  height:400px;
  background:#d4d0c8;
  border:3px outset white;
  display:flex;
  flex-direction:column;
}

.title {
  background:linear-gradient(to right,#000080,#1084d0);
  color:white;
  padding:4px;
  cursor:move;
  display:flex;
  justify-content:space-between;
}

.messages {
  flex:1;
  background:white;
  overflow-y:auto;
  padding:5px;
}

.inputBar {
  display:flex;
}

input {
  flex:1;
  border:none;
  padding:5px;
}

/* IM WINDOWS */
.im {
  position:absolute;
  width:300px;
  height:260px;
  background:#d4d0c8;
  border:3px outset white;
  display:flex;
  flex-direction:column;
}

/* MESSAGE STYLES */
.nick { color:blue; font-weight:bold; }
.me { color:purple; }
.system { color:gray; }

/* TYPING */
.typing {
  font-size:11px;
  color:green;
  padding:2px 5px;
}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div class="box">
    Screen Name<br>
    <input id="nick"><br><br>
    <button onclick="enter()">Sign On</button>
  </div>
</div>

<!-- DESKTOP -->
<div id="desktop">

  <div id="main">
    <div class="title">#general</div>
    <div class="messages" id="mainMsgs"></div>

    <div class="typing" id="typing"></div>

    <div class="inputBar">
      <input id="mainInput"
        onkeydown="if(event.key==='Enter') sendChannel()"
        oninput="sendTyping()">
      <button onclick="sendChannel()">Send</button>
    </div>
  </div>

</div>

<audio id="ping" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>

<script>

const API = "https://script.google.com/macros/s/AKfycbyGqdSRP9n1O8Mr53B65hkl2P103xSAdVmKsqKf7MbZvg1KzB_3Z2VoFTTPPoI-vWSY/exec";

let nick="";
let ims={};
let lastMsgCount=0;

// LOGIN
async function enter(){
  nick=document.getElementById("nick").value.trim();
  if(!nick) return;

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"join",nick,channel:"#general"})
  });

  document.getElementById("login").style.display="none";
  document.getElementById("desktop").style.display="block";

  loop();
}

// LOOP
function loop(){
  loadChannel();
  loadDMs();

  setInterval(loadChannel,1500);
  setInterval(loadDMs,1500);
}

// SEND CHANNEL
async function sendChannel(){
  const input=document.getElementById("mainInput");
  const text=input.value.trim();
  if(!text) return;

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"send",
      nick,
      channel:"#general",
      message:text
    })
  });

  input.value="";
}

// LOAD CHANNEL
async function loadChannel(){
  const res=await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"get",channel:"#general"})
  });

  const data=await res.json();
  const box=document.getElementById("mainMsgs");

  if(data.messages.length > lastMsgCount){
    document.getElementById("ping").play();
  }

  lastMsgCount = data.messages.length;

  box.innerHTML="";
  data.messages.forEach(m=>{
    const d=document.createElement("div");

    if(m.type==="me"){
      d.className="me";
      d.textContent="* "+m.nick+" "+m.msg;
    } else {
      d.innerHTML=`<span class="nick">${m.nick}:</span> ${m.msg}`;
    }

    box.appendChild(d);
  });

  box.scrollTop=box.scrollHeight;
}

// LOAD DMs
async function loadDMs(){
  const res=await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"get",channel:"@"+nick})
  });

  const data=await res.json();

  data.messages.forEach(m=>{
    openIM(m.nick);
    addIM(m.nick, m.nick+": "+m.msg);
  });
}

// OPEN IM WINDOW
function openIM(user){
  if(ims[user]) return;

  const win=document.createElement("div");
  win.className="im";
  win.style.top=50+Object.keys(ims).length*20+"px";
  win.style.left=200+Object.keys(ims).length*20+"px";

  win.innerHTML=`
    <div class="title">${user}
      <span onclick="this.closest('.im').remove()">X</span>
    </div>
    <div class="messages"></div>
    <div class="inputBar">
      <input onkeydown="if(event.key==='Enter') sendIM('${user}',this)">
      <button onclick="sendIM('${user}',this.previousElementSibling)">Send</button>
    </div>
  `;

  makeDraggable(win);

  document.getElementById("desktop").appendChild(win);
  ims[user]=win;
}

// SEND IM
async function sendIM(user,input){
  const text=input.value.trim();
  if(!text) return;

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"dm",
      from:nick,
      to:user,
      message:text
    })
  });

  addIM(user,"me: "+text);
  input.value="";
}

// ADD IM MSG
function addIM(user,msg){
  const box=ims[user].querySelector(".messages");
  const d=document.createElement("div");
  d.textContent=msg;
  box.appendChild(d);
  box.scrollTop=box.scrollHeight;
}

// DRAG WINDOWS
function makeDraggable(el){
  const bar=el.querySelector(".title");
  let offsetX, offsetY, drag=false;

  bar.onmousedown=(e)=>{
    drag=true;
    offsetX=e.clientX - el.offsetLeft;
    offsetY=e.clientY - el.offsetTop;
  };

  document.onmouseup=()=>drag=false;

  document.onmousemove=(e)=>{
    if(!drag) return;
    el.style.left=(e.clientX-offsetX)+"px";
    el.style.top=(e.clientY-offsetY)+"px";
  };
}

// TYPING INDICATOR
let typingTimer;

function sendTyping(){
  clearTimeout(typingTimer);

  document.getElementById("typing").textContent="typing...";

  typingTimer=setTimeout(()=>{
    document.getElementById("typing").textContent="";
  },1000);
}

</script>

</body>
</html>
