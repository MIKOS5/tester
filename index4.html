<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>xGeoRisk MMO (Polished)</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body {
  margin:0;
  font-family:Arial;
  overflow:hidden;
}

#map {
  height:100vh;
  width:100%;
}

#ui {
  position:absolute;
  top:10px;
  left:10px;
  background:white;
  padding:10px;
  border-radius:10px;
  z-index:9999;
  width:180px;
  box-shadow:0 3px 12px rgba(0,0,0,0.25);
}

input, button {
  width:100%;
  margin-top:5px;
  padding:5px;
}

#status {
  font-size:12px;
  margin-top:6px;
}

small {
  display:block;
  margin-top:6px;
  color:#555;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="ui">
  Nick:
  <input id="nick">
  <button onclick="join()">Join Game</button>

  <div id="status">Offline</div>

  <small>Click tiles to capture/attack</small>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const API = "YOUR_GOOGLE_SCRIPT_URL_HERE";

let nick = "";
let map;

// store tiles
const territories = {};
const gridLines = [];

// ---------------- MAP ----------------
map = L.map('map', {
  zoomControl: true
}).setView([33.8, -118.3], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap'
}).addTo(map);

// ---------------- GRID SYSTEM ----------------
const STEP = 0.02;

// draw fixed grid (polished + clean)
function drawGrid() {

  // remove old lines
  gridLines.forEach(l => map.removeLayer(l));
  gridLines.length = 0;

  const b = map.getBounds();

  const north = b.getNorth();
  const south = b.getSouth();
  const east  = b.getEast();
  const west  = b.getWest();

  // vertical lines
  for (let lng = west; lng < east; lng += STEP) {
    const line = L.polyline([[south,lng],[north,lng]], {
      color:"#999",
      weight:1,
      opacity:0.3
    }).addTo(map);

    gridLines.push(line);
  }

  // horizontal lines
  for (let lat = south; lat < north; lat += STEP) {
    const line = L.polyline([[lat,west],[lat,east]], {
      color:"#999",
      weight:1,
      opacity:0.3
    }).addTo(map);

    gridLines.push(line);
  }
}

// refresh grid on movement
map.on("moveend", drawGrid);
map.on("zoomend", drawGrid);
drawGrid();

// ---------------- JOIN ----------------
function join(){
  nick = document.getElementById("nick").value.trim();
  if(!nick) return;

  document.getElementById("status").innerText =
    "Online as " + nick;
}

// ---------------- SNAP GRID ----------------
function snap(lat, lng){
  return {
    lat: Math.round(lat / STEP) * STEP,
    lng: Math.round(lng / STEP) * STEP
  };
}

// ---------------- TILE ID ----------------
function tileId(lat, lng){
  return Math.floor(lat * 50) + "_" + Math.floor(lng * 50);
}

// ---------------- CLICK ACTION ----------------
map.on("click", async (e) => {

  if (!nick) return;

  const s = snap(e.latlng.lat, e.latlng.lng);
  const id = tileId(s.lat, s.lng);

  await fetch(API, {
    method:"POST",
    body:JSON.stringify({
      action:"claim",
      nick,
      id,
      lat:s.lat,
      lng:s.lng
    })
  });
});

// ---------------- RENDER TILE ----------------
function renderTile(t){

  const key = t.id;

  const color = hashColor(t.owner);

  const bounds = [
    [t.lat - STEP/2, t.lng - STEP/2],
    [t.lat + STEP/2, t.lng + STEP/2]
  ];

  if (territories[key]) {
    map.removeLayer(territories[key]);
  }

  const rect = L.rectangle(bounds, {
    color: color,
    weight: 1,
    fillColor: color,
    fillOpacity: 0.45
  }).addTo(map);

  territories[key] = rect;
}

// ---------------- COLOR ----------------
function hashColor(str){
  if(!str) return "#ccc";

  let h = 0;
  for(let i=0;i<str.length;i++){
    h = str.charCodeAt(i) + ((h<<5)-h);
  }

  let c = "#";
  for(let i=0;i<3;i++){
    c += ("00" + ((h>>(i*8)) & 255).toString(16)).slice(-2);
  }

  return c;
}

// ---------------- SYNC WORLD ----------------
async function sync(){

  try {

    const res = await fetch(API,{
      method:"POST",
      body:JSON.stringify({action:"getTerritories"})
    });

    const data = await res.json();

    (data.territories || []).forEach(renderTile);

  } catch(e){
    console.log("sync error", e);
  }
}

// ---------------- LOOP ----------------
setInterval(sync, 2000);

</script>

</body>
</html>
