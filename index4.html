<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
   
<title>Video Obvyris</title>

<link rel="icon" type="image/png" href="https://mikos5.github.io/tester/navicon.png">
<link rel="apple-touch-icon" href="https://mikos5.github.io/tester/navicon.png">
   
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet"/>
   
<style>
/* =========================
   🎨 DESIGN SYSTEM THEME
========================= */

:root{
  --bg:#09111d;
  --panel:#111827;
  --border:#253347;

  --blue:#2793ff;
  --blue-dark:#1869d9;

  --green:#17c964;
  --green-dark:#0ea85a;

  --text:#ffffff;
  --muted:#93a4bb;
}

/* 🌙 DARK MODE BASE */
body{
  margin:0;
  display:flex;
  height:100vh;
  overflow:hidden; /* stops whole page scrolling */
  font-family:Inter, Arial, sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* =========================
   PLAYER + MAIN PANELS
========================= */

#main{
  flex:1;
  height:100vh;
  display:flex;
  flex-direction:column;
  background:var(--bg);
  overflow:hidden;
}

video{
  width:100%;
  background:#000;
  max-height:65vh;
  border-bottom:1px solid var(--border);
}

/* TOP BAR */
#bar{
  background:var(--panel);
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
  padding:8px;
  display:flex;
  flex-direction:column;
  gap:6px;
}

/* NOW PLAYING */
#now{
  width:100%;
  color:var(--text);
  font-weight:700;
  text-align:center;

  white-space:normal;
  overflow:hidden;
  text-overflow:ellipsis;

  line-height:18px;
  min-height:18px;
}

/* BUTTON ROW */
#controls{
  display:flex;
  justify-content:center;
  gap:6px;
}

#controls button{
  width:45px;
  padding:6px 8px;
  font-size:14px;
}

/* keeps buttons together */
#bar button:first-of-type{
  margin-left:0;
}
   
/* =========================
   SIDEBAR
========================= */

#sidebar{
  width:260px;
  height:100vh;
  background:var(--panel);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  overflow-y:auto; /* sidebar scroll */
  flex-shrink:0;
}

.group{
  padding:9px;
  margin-bottom:6px;
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:10px;
  cursor:pointer;
  font-size:12px;
  color:var(--text);
  transition:.15s;
}

.group:hover{
  background:rgba(39,147,255,0.12);
  border-color:var(--blue);
}

.group:active{
  transform:scale(0.98);
}

.logo{
  font-family:Orbitron;
  font-size:42px;
  font-weight:900;
  cursor:pointer;
  user-select:none;
  transition:.2s;
}

.logo span{
  color:var(--blue);
}

.logo:hover{
  opacity:.85;
}

.logo:active{
  transform:scale(.98);
}

.subtitle{
  color:var(--muted);
  font-size:13px;
  margin-bottom:20px;
}

.brand{
  cursor:pointer;
  user-select:none;
  padding:8px;
  border-radius:12px;
  transition:.2s;
}

.brand:hover{
  background:rgba(255,255,255,.08);
}


.app-menu{

  position:absolute;

  top:90px;
  left:20px;

  width:240px;

  background:var(--panel);

  border:1px solid var(--border);

  border-radius:16px;

  overflow:hidden;

  z-index:999999;

  display:none;

  box-shadow:0 20px 40px rgba(0,0,0,.5);

}


.app-menu div{

  padding:14px;

  font-weight:800;

  cursor:pointer;

}


.app-menu div:hover{

  background:var(--blue);

  color:white;

}


.app-menu.open{

  display:block;

}
   
/* =========================
   INPUT / SEARCH
========================= */

#search{
  width:100%;
  padding:10px;
  border:none;
  outline:none;
  background:var(--panel);
  color:var(--text);
  border-bottom:1px solid var(--border);
}

#search::placeholder{
  color:var(--muted);
}

/* =========================
   STATION LIST
========================= */

#list{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  background:var(--bg);
  min-height:0;
}

.card{
  padding:12px;
  border-bottom:1px solid var(--border);
  cursor:pointer;
  transition:.15s;
}

.card:hover{
  background:rgba(39,147,255,0.08);
}

.card b{
  color:var(--text);
}

.card small{
  color:var(--muted);
}

/* =========================
   BUTTONS
========================= */

button{
  background:linear-gradient(180deg,var(--blue),var(--blue-dark));
  border:none;
  color:white;
  padding:8px 10px;
  border-radius:10px;
  font-weight:700;
  cursor:pointer;
  transition:.15s;
}

button:hover{ filter:brightness(1.1); }
button:active{ transform:scale(0.97); }

/* =========================
   SCROLLBAR FIX
========================= */

*::-webkit-scrollbar{ width:10px; }
*::-webkit-scrollbar-track{ background:var(--panel); }
*::-webkit-scrollbar-thumb{
  background:var(--border);
  border-radius:999px;
  border:2px solid var(--panel);
}
*::-webkit-scrollbar-thumb:hover{ background:var(--blue); }

*{ scrollbar-width:thin; scrollbar-color:var(--border) var(--panel); }

@media(max-width:900px){
  #sidebar{ width:200px; }
}

/* =========================
   💬 CHAT SYSTEM (ADDED)
========================= */

#chatFloatBtn{
  position: fixed;
  bottom: 20px;
  right: 20px;
  width: 55px;
  height: 55px;
  border-radius: 50%;
  font-size: 22px;
  z-index: 99999;
  box-shadow: 0 10px 25px rgba(0,0,0,.4);
  background: linear-gradient(180deg,var(--blue),var(--blue-dark));
  border:none;
  color:white;
  cursor:pointer;
}

.chat-popup{
  position: fixed;
  bottom: 90px;
  right: 20px;
  width: 320px;
  height: 420px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  z-index: 99999;
}

.chat-popup.hidden{ display:none; }

.chat-popup-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px;
  font-weight:700;
  border-bottom:1px solid var(--border);
}

.chat-popup-log{
  flex:1;
  overflow-y:auto;
  padding:10px;
  font-size:12px;
}

.chat-msg{
  margin-bottom:6px;
  padding:6px;
  border-radius:8px;
  background: rgba(255,255,255,0.04);
}

.chat-name{
  color:var(--blue);
  font-weight:700;
}

.chat-input{
  display:flex;
  gap:6px;
  padding:8px;
  border-top:1px solid var(--border);
}

.chat-input input{
  flex:1;
  padding:6px;
  border-radius:8px;
  border:1px solid var(--border);
  background:var(--bg);
  color:var(--text);
}

video:fullscreen{
  width:100vw;
  height:100vh;
  background:black;
  object-fit:contain;
}


.card{
    display:flex;
    align-items:center;
    gap:12px;
}

.logoImg{
    width:70px;
    height:40px;
    object-fit:contain;
    border-radius:6px;
    background:#111;
}
   
</style>
</head>

<body>

<!-- LEFT SIDEBAR -->
<div id="sidebar">
   <div class="brand" onclick="toggleAppMenu()">

  <div class="logo">
    Video <span>Obvyris</span>
  </div>

  <div class="subtitle">
    Live TV stations
  </div>

</div>


<div id="appMenu" class="app-menu">

  <div onclick="navigateApp('index99.html')">
    🏠 Obvyris Home
  </div>

  <div onclick="navigateApp('Video_Obvyris.html')">
    📺 Video Obvyris
  </div>

  <div onclick="navigateApp('Radio_Obvyris.html')">
    📻 Radio Obvyris
  </div>

  <div onclick="navigateApp('newschat.html')">
    💬 Chat Obvyris
  </div>

</div>

  <input id="search" placeholder="Search..." oninput="applyFilters()"/>
  <div id="sourceList">

  <div class="group" onclick="loadIPTV()">
    🌐 IPTV Channels
  </div>

  <div class="group" onclick="loadPlutoSource()">
    🪐 Pluto TV
  </div>

</div>

<div id="groupList"></div>
</div>

<!-- MAIN -->
<div id="main">

  <video 
 id="video" 
 controls 
 playsinline
 autoplay
 muted>
</video>

<div id="bar">

  <div id="now">Loading...</div>

  <div id="controls">
    <button onclick="prev()">⏮</button>
    <button onclick="toggle()">⏯</button>
    <button onclick="next()">⏭</button>
    <button onclick="fullscreenPlayer()">⛶</button>
  </div>

</div>

  <div id="list"></div>

</div>

<!-- 💬 CHAT UI -->
<button id="chatFloatBtn" onclick="toggleChat()">💬</button>

<div id="chatPopup" class="chat-popup hidden">
  <div class="chat-popup-header">
    <span>💬 Chat</span>
    <button onclick="toggleChat()">✖</button>
  </div>

  <div id="chatLog" class="chat-popup-log"></div>

  <div class="chat-input">
    <input id="chatName" placeholder="name" maxlength="8"/>
    <input id="chatMsg" placeholder="message" maxlength="100"/>
    <button onclick="sendChat()">Send</button>
  </div>
</div>

<script>

const PLAYLIST="https://iptv-org.github.io/iptv/index.m3u";
const PLUTO_API="https://script.google.com/macros/s/AKfycbynB1gx8xRVH4cNtulKZv3Kr5CUyV7rATcZgyCJ73JStoxOw0meB6vqCV3AkIAUMkqZ/exec";

let list=[];
let filtered=[];
let index=0;

let currentSource="";

let iptvList=[];
let plutoList=[];
let renderIndex=0;
const CHUNK=120;

/* CHAT API */
const API_URL = "https://script.google.com/macros/s/AKfycbzin84qDcZ9L1q4pTBtHZGKJSTDcZ_wnmgWmnmgPgf1jrc1nRprzbEBixKMSHcdkxiZBg/exec";

let chatOpen=false;
let chatData=[];

/* ROOM ID (video stream based) */
function getRoom(){
  return filtered?.[index]?.url || "global-video";
}

/* TOGGLE CHAT */
function toggleChat(){
  const box=document.getElementById("chatPopup");
  chatOpen=!chatOpen;
  box.classList.toggle("hidden");
  if(chatOpen) loadChat();
}

/* LOAD CHAT */
async function loadChat(){
  const res=await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({
      action:"get",
      station:getRoom()
    })
  });

  const data=await res.json();
  chatData=Array.isArray(data)?data:[];
  renderChat();

  const title = document.querySelector(".chat-popup-header span");
  title.innerText = "💬 " + (document.getElementById("now").innerText || getRoom());
}

/* SEND CHAT */
async function sendChat(){
  let name=document.getElementById("chatName").value||"Anon";
  let msg=document.getElementById("chatMsg").value;

  if(!msg) return;

  name=name.trim().slice(0,8);
  msg=msg.trim().slice(0,100);

  document.getElementById("chatMsg").value="";

  const station = getRoom();
  const stationName = document.getElementById("now").innerText || station;

  await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({
      action:"send",
      station,
      stationName,   // ✅ THIS is what you were missing
      name,
      message:msg
    })
  });

  loadChat();
}

/* RENDER CHAT */
function renderChat(){
  const box=document.getElementById("chatLog");
  box.innerHTML="";

  const welcome={
    system:true,
    name:"System",
    message:`Chat for ${getRoom()}`
  };

  [welcome,...chatData].forEach(m=>{
    box.innerHTML+=`
      <div class="chat-msg" style="${m.system?"opacity:0.6;text-align:center;":""}">
        <span class="chat-name">${m.system?"":m.name+": "}</span>
        ${m.message}
      </div>
    `;
  });

  box.scrollTop=box.scrollHeight;
}

/* AUTO REFRESH */
setInterval(()=>{
  if(chatOpen && document.visibilityState==="visible"){
    loadChat();
  }
},3000);

/* =========================
   ORIGINAL VIDEO CODE (UNCHANGED)
========================= */

async function load(){

    const iptvText = await fetch(PLAYLIST)
        .then(r=>r.text());

    iptvList=parseM3U(iptvText);

    list=iptvList;

    currentSource="IPTV";

    buildGroups();
    applyFilters();

}

async function loadPluto(){

    return await fetch(PLUTO_API)
        .then(r=>r.json());

}

async function loadPlutoSource(){

    currentSource="Pluto";

    if(plutoList.length===0){

        console.log("Loading Pluto TV...");

        plutoList=await fetch(PLUTO_API)
            .then(r=>r.json());

    }


    list=plutoList;

    buildGroups();

    filtered=list;

    render(true);

}

function loadIPTV(){

    currentSource="IPTV";

    list=iptvList;

    buildGroups();

    filtered=list;

    render(true);

}
  
async function filterWorkingStreams(channels){

  const good=[];
  const max=50;

  for(let i=0;i<channels.length;i+=max){

    const batch=channels.slice(i,i+max);

    const results=await Promise.all(
      batch.map(async s=>{

        return new Promise(resolve=>{

          let test=document.createElement("video");

          let done=false;

          let timer=setTimeout(()=>{
            if(!done){
              done=true;
              resolve(null);
            }
          },5000);


          test.src=s.url;
          test.muted=true;


          test.onloadedmetadata=()=>{
            if(!done){
              done=true;
              clearTimeout(timer);
              resolve(s);
            }
          };


          test.onerror=()=>{
            if(!done){
              done=true;
              clearTimeout(timer);
              resolve(null);
            }
          };


        });

      })
    );


    results.forEach(x=>{
      if(x) good.push(x);
    });


    console.log(
      "Checked:",
      Math.min(i+max,channels.length),
      "/",
      channels.length,
      "Working:",
      good.length
    );

  }


  return good;
}

function parseM3U(t){
  const lines=t.split("\n");
  let out=[],item=null;

  for(let l of lines){
    if(l.startsWith("#EXTINF")){
      item={
        name:l.split(",").pop(),
        group:(l.match(/group-title="([^"]+)"/)||[])[1]||"Other"
      };
    }
    else if(item && l.startsWith("http")){
      item.url=l.trim();
      out.push(item);
      item=null;
    }
  }
  return out;
}

function buildGroups(){
  const set=new Set();
  list.forEach(s=>set.add(s.group));

  const box=document.getElementById("groupList");
  box.innerHTML="";

  const all=document.createElement("div");
  all.className="group";
  all.textContent="📺 All Channels";
  all.onclick=()=>{
    filtered=list;
    render(true);
  };
  box.appendChild(all);

  [...set].sort().forEach(g=>{
    const d=document.createElement("div");
    d.className="group";
    d.textContent=g;

    d.onclick=()=>{
      filtered=list.filter(x=>x.group===g);
      render(true);
    };

    box.appendChild(d);
  });
}

function toggleAppMenu(){

  const menu=document.getElementById("appMenu");

  menu.classList.toggle("open");

}


function navigateApp(page){

  window.location.href="./"+page;

}


// close dropdown when clicking outside
document.addEventListener("click",function(e){

  const menu=document.getElementById("appMenu");
  const brand=document.querySelector(".brand");


  if(menu && brand && !brand.contains(e.target)){

    menu.classList.remove("open");

  }

});
   
function applyFilters(){
  const q=document.getElementById("search").value.toLowerCase();
  filtered=list.filter(s=>s.name.toLowerCase().includes(q));
  render(true);
}

function fullscreenPlayer(){

  const video=document.getElementById("video");

  if(video.requestFullscreen){
    video.requestFullscreen();
  }
  else if(video.webkitRequestFullscreen){
    video.webkitRequestFullscreen();
  }
  else if(video.msRequestFullscreen){
    video.msRequestFullscreen();
  }

}
   
function render(reset){
  const el=document.getElementById("list");

  if(reset){
    el.innerHTML="";
    renderIndex=0;
  }

  const slice=filtered.slice(renderIndex,renderIndex+CHUNK);

  slice.forEach((s,i)=>{
    const real=renderIndex+i;

    el.innerHTML+=`
<div class="card" onclick="play(${real})">

    ${s.logo ? `<img src="${s.logo}" class="logoImg">` : ""}

    <div>

        <b>${s.name}</b><br>

        <small>${s.group}</small>

    </div>

</div>
`;
  });

  renderIndex+=CHUNK;
}

document.getElementById("list").onscroll=(e)=>{
  if(e.target.scrollTop+e.target.clientHeight>=e.target.scrollHeight-100){
    render(false);
  }
};

function playMedia(url){
  const v=document.getElementById("video");

  v.pause();
  v.removeAttribute("src");
  v.load();

  if(window.Hls && Hls.isSupported()){

    if(window.hls){
      window.hls.destroy();
    }

    window.hls = new Hls({
      enableWorker:true,

      // buffer settings
      maxBufferLength:30,
      maxMaxBufferLength:60,
      maxBufferSize:60 * 1000 * 1000,

      // faster recovery
      liveSyncDurationCount:3,
      liveMaxLatencyDurationCount:5,

      // reduce stalls
      fragLoadingTimeOut:20000,
      manifestLoadingTimeOut:20000,
      levelLoadingTimeOut:20000
    });


    window.hls.on(Hls.Events.ERROR,(event,data)=>{

      console.log("HLS ERROR:",data);

      if(data.fatal){

        switch(data.type){

          case Hls.ErrorTypes.NETWORK_ERROR:
            console.log("Retrying network...");
            window.hls.startLoad();
            break;


          case Hls.ErrorTypes.MEDIA_ERROR:
            console.log("Recovering media...");
            window.hls.recoverMediaError();
            break;


          default:
            window.hls.destroy();
            break;
        }

      }

    });


    window.hls.loadSource(url);
    window.hls.attachMedia(v);


    window.hls.on(Hls.Events.MANIFEST_PARSED,()=>{
      v.play().catch(e=>console.log(e));
    });


  }else{

    // Safari native HLS
    v.src=url;
    v.play();

  }
}

function play(i){
  index=i;
  const s=filtered[i];
  if(!s) return;

  document.getElementById("now").innerText=s.name;
  playMedia(s.url);

  if(chatOpen) loadChat();
}

function next(){
  index=(index+1)%filtered.length;
  play(index);
}

function prev(){
  index=(index-1+filtered.length)%filtered.length;
  play(index);
}

function toggle(){
  const v=document.getElementById("video");
  v.paused?v.play():v.pause();
}

function goHome(){
  window.location.href = "./index99.html";
}
   
load();

</script>
</body>
</html>
