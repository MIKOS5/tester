<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro IRC Whiteboard Battle</title>

<style>
body {
  margin:0;
  font-family:Tahoma;
  background:#008080;
  overflow:hidden;
}

#login {
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
}

.box {
  background:#d4d0c8;
  padding:20px;
  border:3px outset white;
}

#app {
  display:none;
  height:100vh;
  display:flex;
}

#sidebar {
  width:220px;
  background:#d4d0c8;
  border-right:2px solid gray;
  padding:6px;
  overflow-y:auto;
}

.btn {
  background:#d4d0c8;
  border:2px outset white;
  padding:4px;
  margin:2px 0;
  cursor:pointer;
}

#chat {
  flex:1;
  display:flex;
  flex-direction:column;
}

#header {
  background:#d4d0c8;
  padding:6px;
  border-bottom:2px solid gray;
}

#status {
  font-size:11px;
  padding:4px;
  background:#ddd;
}

#messages {
  flex:1;
  overflow-y:auto;
  padding:8px;
  background:white;
}

#drawBox {
  height:280px;
  border-top:2px solid gray;
  background:white;
  position:relative;
}

canvas {
  width:100%;
  height:100%;
  cursor:crosshair;
}

.cursor {
  position:absolute;
  font-size:11px;
  pointer-events:none;
  color:red;
  font-weight:bold;
}

#inputBar {
  display:flex;
}

#msg {
  flex:1;
  padding:8px;
  border:none;
}

.nick { color:blue; font-weight:bold; }
.system { color:gray; }
.me { color:purple; }

/* HP BAR */
.hp {
  font-size:11px;
  color:green;
}
</style>
</head>

<body>

<div id="login">
  <div class="box">
    Nickname<br>
    <input id="nick"><br><br>
    <button onclick="enter()">Enter</button>
  </div>
</div>

<div id="app">

  <div id="sidebar">
    <b>Channels</b>
    <div id="channels"></div>
    <hr>
    <b>Users</b>
    <div id="users"></div>
    <hr>
    <b>Battle HP</b>
    <div id="hp"></div>
  </div>

  <div id="chat">

    <div id="header">#general</div>
    <div id="status">connecting...</div>

    <div id="messages"></div>

    <div id="drawBox">
      <canvas id="canvas"></canvas>
    </div>

    <div id="inputBar">
      <input id="msg" onkeydown="if(event.key==='Enter') send()">
      <button onclick="send()">Send</button>
    </div>

  </div>

</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbyGqdSRP9n1O8Mr53B65hkl2P103xSAdVmKsqKf7MbZvg1KzB_3Z2VoFTTPPoI-vWSY/exec";

let nick = "";
let channel = "#general";

let lastStroke = 0;
let lastCursorSend = 0;

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resize(){
  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;
}
resize();
window.addEventListener("resize", resize);

// ---------------- ENTER ----------------
async function enter(){
  nick = document.getElementById("nick").value.trim();
  if(!nick) return;

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"join",nick,channel})
  });

  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="flex";

  loop();
}

// ---------------- LOOP ----------------
function loop(){
  setInterval(getMessages, 800);
  setInterval(getStrokes, 250);
  setInterval(getCursors, 200);
  setInterval(getUsers, 2000);
  setInterval(getChannels, 5000);
  setInterval(getHP, 2000);
}

// ---------------- CHAT ----------------
async function send(){
  const input=document.getElementById("msg");
  if(!input.value.trim()) return;

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"send",
      nick,
      channel,
      message:input.value
    })
  });

  input.value="";
}

// ---------------- CHAT RENDER ----------------
async function getMessages(){
  const r=await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"get",channel})
  });

  const d=await r.json();
  const box=document.getElementById("messages");

  box.innerHTML="";

  (d.messages||[]).forEach(m=>{
    const div=document.createElement("div");

    if(m.type==="system"){
      div.className="system";
      div.textContent=m.msg;
    } else {
      div.innerHTML=`<span class="nick">${m.nick}</span>: ${m.msg}`;
    }

    box.appendChild(div);
  });
}

// ---------------- DRAWING ----------------
let drawing=false;
let stroke=[];

canvas.addEventListener("mousedown",()=>{drawing=true; stroke=[]});
canvas.addEventListener("mouseup",sendStroke);
canvas.addEventListener("mouseleave",sendStroke);

canvas.addEventListener("mousemove",(e)=>{

  const r=canvas.getBoundingClientRect();
  const x=e.clientX-r.left;
  const y=e.clientY-r.top;

  sendCursor(x,y);

  if(!drawing) return;

  stroke.push({x,y});

  if(stroke.length>1){
    ctx.beginPath();
    ctx.moveTo(stroke[stroke.length-2].x,stroke[stroke.length-2].y);
    ctx.lineTo(x,y);
    ctx.stroke();
  }
});

// ---------------- SEND STROKE ----------------
async function sendStroke(){
  if(stroke.length<2) return;
  drawing=false;

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"drawStroke",
      channel,
      nick,
      points:stroke,
      color:"#000"
    })
  });

  stroke=[];
}

// ---------------- SYNC STROKES ----------------
async function getStrokes(){

  const r=await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"getStrokes",
      channel,
      since:lastStroke
    })
  });

  const d=await r.json();

  (d.strokes||[]).forEach(s=>{
    drawStroke(s.points);
    lastStroke=Math.max(lastStroke,new Date(s.time).getTime());
  });
}

function drawStroke(p){
  if(!p||p.length<2) return;

  ctx.beginPath();
  ctx.moveTo(p[0].x,p[0].y);

  for(let i=1;i<p.length;i++){
    ctx.lineTo(p[i].x,p[i].y);
  }

  ctx.stroke();
}

// ---------------- CURSORS ----------------
async function sendCursor(x,y){

  const now=Date.now();
  if(now-lastCursorSend<100) return;
  lastCursorSend=now;

  fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"cursor",nick,channel,x,y})
  });
}

async function getCursors(){

  const r=await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"getCursors",channel})
  });

  const d=await r.json();

  document.querySelectorAll(".cursor").forEach(e=>e.remove());

  (d.cursors||[]).forEach(c=>{
    if(c.nick===nick) return;

    const el=document.createElement("div");
    el.className="cursor";
    el.textContent=c.nick;
    el.style.left=c.x+"px";
    el.style.top=c.y+"px";
    document.getElementById("drawBox").appendChild(el);
  });
}

// ---------------- USERS + HP BATTLE ----------------
async function getUsers(){

  const r=await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"who",channel})
  });

  const d=await r.json();

  const box=document.getElementById("users");
  box.innerHTML="";

  (d.users||[]).forEach(u=>{
    const div=document.createElement("div");
    div.textContent=u;
    box.appendChild(div);
  });
}

// ---------------- HP SYSTEM ----------------
async function getHP(){
  const r=await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"getHP",channel})
  });

  const d=await r.json();

  const box=document.getElementById("hp");
  box.innerHTML="";

  (d.hp||[]).forEach(p=>{
    const div=document.createElement("div");
    div.className="hp";
    div.textContent=`${p.nick}: ${p.hp}`;
    box.appendChild(div);
  });
}

// ---------------- CHANNELS ----------------
async function getChannels(){

  const r=await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"channels"})
  });

  const d=await r.json();

  const box=document.getElementById("channels");
  box.innerHTML="";

  (d.channels||[]).forEach(ch=>{
    const b=document.createElement("div");
    b.className="btn";
    b.textContent=ch;
    b.onclick=()=>switchChannel(ch);
    box.appendChild(b);
  });
}

function switchChannel(ch){
  channel=ch;
  document.getElementById("header").textContent=ch;
  document.getElementById("messages").innerHTML="";
  ctx.clearRect(0,0,canvas.width,canvas.height);
  lastStroke=0;
}

</script>

</body>
</html>
