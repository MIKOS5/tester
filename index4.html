<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GeoRisk (Leaflet Edition)</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body { margin:0; font-family:Arial; }

#map {
  height:100vh;
  width:100%;
}

#ui {
  position:absolute;
  top:10px;
  left:10px;
  background:white;
  padding:10px;
  border-radius:10px;
  z-index:9999;
  box-shadow:0 2px 8px rgba(0,0,0,0.2);
}

input, button {
  width:140px;
  margin-top:4px;
}

#status {
  font-size:12px;
  margin-top:5px;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="ui">
  Nick:<br>
  <input id="nick"><br>
  <button onclick="join()">Join Game</button>
  <div id="status">Offline</div>
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const API = "https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec";

let nick = "";
let map;

// store territory rectangles
const tiles = {};

// ---------------- INIT MAP ----------------
map = L.map('map').setView([33.8, -118.3], 12);

// OpenStreetMap tiles (FREE)
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

// ---------------- JOIN ----------------
function join(){
  nick = document.getElementById("nick").value.trim();
  if(!nick) return;

  document.getElementById("status").innerText = "Online as " + nick;
}

// ---------------- GRID SYSTEM ----------------
function tileId(lat, lng){
  return Math.floor(lat*50) + "_" + Math.floor(lng*50);
}

// ---------------- CLICK TO CLAIM ----------------
map.on("click", async (e)=>{

  if(!nick) return;

  const id = tileId(e.latlng.lat, e.latlng.lng);

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"claim",
      nick,
      id,
      lat:e.latlng.lat,
      lng:e.latlng.lng
    })
  });
});

// ---------------- RENDER TILE ----------------
function drawTile(t){

  const color = hashColor(t.owner);

  const bounds = [
    [t.lat - 0.01, t.lng - 0.01],
    [t.lat + 0.01, t.lng + 0.01]
  ];

  if(tiles[t.id]){
    map.removeLayer(tiles[t.id]);
  }

  const rect = L.rectangle(bounds, {
    color: color,
    weight: 1,
    fillOpacity: 0.4
  }).addTo(map);

  tiles[t.id] = rect;
}

// ---------------- COLOR ----------------
function hashColor(str){
  if(!str) return "#ccc";

  let hash = 0;
  for(let i=0;i<str.length;i++){
    hash = str.charCodeAt(i) + ((hash<<5)-hash);
  }

  let color = "#";
  for(let i=0;i<3;i++){
    let value = (hash >> (i*8)) & 255;
    color += ("00" + value.toString(16)).substr(-2);
  }

  return color;
}

// ---------------- SYNC ----------------
async function sync(){

  const res = await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"getTerritories"})
  });

  const data = await res.json();

  (data.territories || []).forEach(drawTile);
}

// refresh loop
setInterval(sync, 2000);

</script>

</body>
</html>
