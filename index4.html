<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pro Collaborative Whiteboard IRC</title>

<style>
body {
  margin:0;
  font-family:Tahoma;
  background:#008080;
  overflow:hidden;
}

/* LOGIN */
#login {
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
}

.box {
  background:#d4d0c8;
  padding:20px;
  border:3px outset white;
}

/* APP */
#app {
  display:none;
  height:100vh;
  display:flex;
}

/* SIDEBAR */
#sidebar {
  width:200px;
  background:#d4d0c8;
  border-right:2px solid gray;
  padding:6px;
  overflow-y:auto;
}

.btn {
  background:#d4d0c8;
  border:2px outset white;
  padding:4px;
  margin:2px 0;
  cursor:pointer;
}

/* CHAT */
#chat {
  flex:1;
  display:flex;
  flex-direction:column;
}

#header {
  background:#d4d0c8;
  padding:6px;
  border-bottom:2px solid gray;
}

#status {
  font-size:11px;
  padding:4px;
  background:#ddd;
}

#messages {
  flex:1;
  overflow-y:auto;
  padding:8px;
  background:white;
}

/* DRAW AREA */
#drawBox {
  height:260px;
  border-top:2px solid gray;
  background:white;
  position:relative;
}

canvas {
  width:100%;
  height:100%;
  cursor:crosshair;
}

/* CURSORS */
.cursor {
  position:absolute;
  font-size:11px;
  pointer-events:none;
  transform: translate(-2px, -2px);
  color:red;
  font-weight:bold;
}

/* INPUT */
#inputBar {
  display:flex;
}

#msg {
  flex:1;
  padding:8px;
  border:none;
}

/* TEXT */
.nick { color:blue; font-weight:bold; }
.me { color:purple; }
.system { color:gray; }
</style>
</head>

<body>

<div id="login">
  <div class="box">
    Nickname<br>
    <input id="nick"><br><br>
    <button onclick="enter()">Enter</button>
  </div>
</div>

<div id="app">

  <div id="sidebar">
    <b>Channels</b>
    <div id="channels"></div>
    <hr>
    <b>Users</b>
    <div id="users"></div>
  </div>

  <div id="chat">

    <div id="header">#general</div>
    <div id="status">connecting...</div>

    <div id="messages"></div>

    <div id="drawBox">
      <canvas id="canvas"></canvas>
    </div>

    <div id="inputBar">
      <input id="msg" onkeydown="if(event.key==='Enter') send()">
      <button onclick="send()">Send</button>
    </div>

  </div>

</div>

<script>

const API = "YOUR_SCRIPT_URL";

let nick = "";
let channel = "#general";
let lastDrawTime = 0;
let lastCursorTime = 0;

// ---------------- CANVAS ----------------
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

function resizeCanvas(){
  canvas.width = canvas.offsetWidth;
  canvas.height = canvas.offsetHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

// ---------------- ENTER ----------------
async function enter(){
  nick=document.getElementById("nick").value.trim();
  if(!nick) return;

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"join",nick,channel})
  });

  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="flex";
  document.getElementById("status").textContent="online";

  loop();
}

// ---------------- LOOP ----------------
function loop(){
  setInterval(syncMessages, 1000);
  setInterval(syncDraw, 250);
  setInterval(syncCursors, 120);
  setInterval(who, 2000);
  setInterval(channels, 5000);
}

// ---------------- SEND CHAT ----------------
async function send(){
  const input=document.getElementById("msg");
  const text=input.value.trim();
  if(!text) return;

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"send",nick,channel,message:text})
  });

  input.value="";
}

// ---------------- MESSAGES ----------------
async function syncMessages(){
  const res = await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"get",channel})
  });

  const data = await res.json();
  const box=document.getElementById("messages");

  box.innerHTML="";

  (data.messages || []).forEach(m=>{
    const d=document.createElement("div");

    if(m.type==="system"){
      d.className="system";
      d.textContent="*** "+m.msg;
    } else {
      d.innerHTML=`<span class="nick">${m.nick}:</span> ${m.msg}`;
    }

    box.appendChild(d);
  });

  document.getElementById("status").textContent="live";
}

// ---------------- DRAW ----------------
let drawing=false;

canvas.addEventListener("mousedown",()=>drawing=true);
canvas.addEventListener("mouseup",()=>drawing=false);
canvas.addEventListener("mouseleave",()=>drawing=false);

canvas.addEventListener("mousemove", async (e)=>{

  const rect=canvas.getBoundingClientRect();
  const x=e.clientX-rect.left;
  const y=e.clientY-rect.top;

  // send cursor
  fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"cursor",
      channel,
      nick,
      x,y
    })
  });

  if(!drawing) return;

  draw(x,y,"black");

  fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"draw",
      channel,
      nick,
      x,y,
      color:"black"
    })
  });
});

function draw(x,y,color){
  ctx.fillStyle=color;
  ctx.fillRect(x,y,2,2);
}

// ---------------- SYNC DRAW ----------------
async function syncDraw(){
  const res=await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"getDraw",
      channel,
      since:lastDrawTime
    })
  });

  const data=await res.json();

  (data.points || []).forEach(p=>{
    draw(p.x,p.y,p.color);
    lastDrawTime=Math.max(lastDrawTime, new Date(p.time).getTime());
  });
}

// ---------------- LIVE CURSORS ----------------
async function syncCursors(){

  const res=await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"getCursors",
      channel
    })
  });

  const data=await res.json();

  document.querySelectorAll(".cursor").forEach(e=>e.remove());

  (data.cursors || []).forEach(c=>{
    const el=document.createElement("div");
    el.className="cursor";
    el.textContent=c.nick;
    el.style.left=c.x+"px";
    el.style.top=c.y+"px";
    document.getElementById("drawBox").appendChild(el);
  });
}

// ---------------- USERS ----------------
async function who(){
  const res=await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"who",channel})
  });

  const data=await res.json();

  const box=document.getElementById("users");
  box.innerHTML="";

  (data.users || []).forEach(u=>{
    const d=document.createElement("div");
    d.textContent=u;
    box.appendChild(d);
  });
}

// ---------------- CHANNELS ----------------
async function channels(){
  const res=await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"channels"})
  });

  const data=await res.json();

  const box=document.getElementById("channels");
  box.innerHTML="";

  (data.channels || []).forEach(ch=>{
    const b=document.createElement("div");
    b.className="btn";
    b.textContent=ch;
    b.onclick=()=>switchChannel(ch);
    box.appendChild(b);
  });
}

// ---------------- SWITCH ----------------
function switchChannel(ch){
  channel=ch;
  document.getElementById("header").textContent=ch;
  document.getElementById("messages").innerHTML="";
  ctx.clearRect(0,0,canvas.width,canvas.height);
  lastDrawTime=0;
}

</script>

</body>
</html>
