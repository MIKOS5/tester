<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🌍 Echo Shards v12 — WAR VISUAL SYSTEM</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>

body{
  margin:0;
  overflow:hidden;
  font-family:Arial;
  background:#0b0f14;
  color:white;
}

#map{
  width:100vw;
  height:100vh;
}

/* ================= UI ================= */
#ui{
  position:absolute;
  top:10px;
  left:10px;
  width:320px;
  background:#151b26;
  padding:12px;
  border-radius:10px;
  z-index:9999;
  box-shadow:0 0 20px rgba(0,0,0,0.5);
}

input,button,select{
  width:100%;
  margin-top:6px;
  padding:10px;
  border:none;
  border-radius:6px;
}

button{
  cursor:pointer;
  background:#2d6cdf;
  color:white;
  font-weight:bold;
}

#log{
  position:absolute;
  bottom:10px;
  left:10px;
  width:360px;
  height:200px;
  overflow:auto;
  background:#151b26;
  padding:10px;
  border-radius:10px;
  font-size:12px;
  z-index:9999;
}

/* ================= WAR UI ================= */
#warbar{
  margin-top:10px;
  font-size:13px;
  line-height:1.6;
}

.bar{
  height:8px;
  background:#222;
  border-radius:5px;
  overflow:hidden;
  margin-bottom:6px;
}

.fill{
  height:100%;
  width:0%;
}

</style>
</head>

<body>

<div id="map"></div>

<div id="ui">

  <h2>🌍 Echo Shards v12</h2>

  <input id="nick" placeholder="Commander Name">

  <select id="faction">
    <option>VOID</option>
    <option>ORDER</option>
    <option>CHAOS</option>
  </select>

  <button onclick="join()">Join War</button>
  <button onclick="spawn()">Deploy Capital</button>

  <div id="status">OFFLINE</div>

  <div id="warbar">
    ⚔ WAR INTENSITY
    <div class="bar"><div id="warFill" class="fill" style="background:#ff2c2c"></div></div>

    🌍 GLOBAL BALANCE
    <div id="balance"></div>
  </div>

</div>

<div id="log"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const API = "https://script.google.com/macros/s/AKfycbwfFHG9LeEzzYlVYCEXswjxeP_mVsevAqCtGybKBt9O5ww1Pn5d57S2yScP_2_rAinY/exec";

const map = L.map('map').setView([34.05,-118.24], 5);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

let nick="";
let faction="VOID";

let nodes={};
let heatLayers=[];
let attackLines=[];

/* ================= COLORS ================= */
function col(f){
  return {
    VOID:"#7a2cff",
    ORDER:"#2cc7ff",
    CHAOS:"#ff2c6d"
  }[f] || "#777";
}

/* ================= LOG ================= */
function log(m){
  const el=document.getElementById("log");
  el.innerHTML="• "+m+"<br>"+el.innerHTML;
}

/* ================= FETCH ================= */
async function post(d){
  const r=await fetch(API,{method:"POST",body:JSON.stringify(d)});
  return await r.json();
}

/* ================= JOIN ================= */
function join(){
  nick=document.getElementById("nick").value;
  faction=document.getElementById("faction").value;

  document.getElementById("status").innerText="🟢 WAR ACTIVE";

  setInterval(sync,3000);
  sync();

  log("Commander "+nick+" entered war");
}

/* ================= SPAWN ================= */
async function spawn(){

  const c=map.getCenter();

  await post({
    action:"spawn",
    id:crypto.randomUUID(),
    lat:c.lat,
    lng:c.lng,
    owner:faction
  });

  sync();
}

/* ================= ATTACK EFFECT ================= */
function attackFX(a,b,f){

  const line=L.polyline([a,b],{
    color:col(f),
    weight:2,
    opacity:0.7
  }).addTo(map);

  attackLines.push(line);

  setTimeout(()=>map.removeLayer(line),1200);
}

/* ================= NODE DRAW ================= */
function draw(n){

  if(nodes[n.id]) map.removeLayer(nodes[n.id]);

  const lvl=Number(n.level||1);
  const energy=Number(n.energy||0);

  const r=200+(lvl*120);

  /* CORE ZONE */
  const circle=L.circle([n.lat,n.lng],{
    radius:r,
    color:col(n.owner),
    fillOpacity:0.35
  }).addTo(map);

  /* WAR HEAT GLOW */
  const heat=L.circle([n.lat,n.lng],{
    radius:r*2.2,
    color:col(n.owner),
    fillOpacity:0.05,
    opacity:0.2
  }).addTo(map);

  heatLayers.push(heat);

  /* FRONTLINE AURA */
  if(energy>80){
    const front=L.circle([n.lat,n.lng],{
      radius:r*3,
      color:"#ffcc00",
      fillOpacity:0,
      opacity:0.15,
      dashArray:"5,6"
    }).addTo(map);

    heatLayers.push(front);
  }

  circle.on("click",()=>{

    circle.bindPopup(`
      <b>⚔ WAR NODE</b><br>
      Faction: ${n.owner}<br>
      Level: ${lvl}<br>
      Energy: ${energy}<br><br>

      <button onclick="attack('${n.id}')">⚔ Strike</button>
      <button onclick="upgrade('${n.id}')">⬆ Fortify</button>
    `).openPopup();

  });

  nodes[n.id]=circle;
}

/* ================= ATTACK ================= */
async function attack(id){

  const n=nodes[id];
  if(!n) return;

  const target=n.getLatLng();

  await post({
    action:"attack",
    id,
    nick:faction
  });

  attackFX(map.getCenter(),target,faction);

  log("⚔ attack launched");
}

/* ================= UPGRADE ================= */
async function upgrade(id){
  await post({action:"upgrade",id});
  sync();
}

/* ================= SYNC ================= */
async function sync(){

  const data=await post({action:"getWorld"});

  if(!data.nodes) return;

  Object.values(nodes).forEach(n=>map.removeLayer(n));
  heatLayers.forEach(h=>map.removeLayer(h));

  nodes={};
  heatLayers=[];

  let counts={};

  data.nodes.forEach(n=>{
    draw(n);
    counts[n.owner]=(counts[n.owner]||0)+1;
  });

  /* WAR INTENSITY */
  const total=data.nodes.length;
  const chaos=(counts["CHAOS"]||0)/total;
  const order=(counts["ORDER"]||0)/total;
  const voidf=(counts["VOID"]||0)/total;

  const war=Math.abs(chaos-order)+voidf;

  document.getElementById("warFill").style.width=(war*100)+"%";

  document.getElementById("balance").innerHTML=
    `VOID ${Math.round(voidf*100)}% | ORDER ${Math.round(order*100)}% | CHAOS ${Math.round(chaos*100)}%`;

  log("🌍 war sync");
}

/* ================= AUTO WAR ================= */
setInterval(async ()=>{
  await post({action:"tick"});
},7000);

</script>

</body>
</html>
