<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌍 Echo Shards RTS v1</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0b0f14;
  color:white;
}

#map {
  height:100vh;
  width:100%;
}

#ui {
  position:absolute;
  top:10px;
  left:10px;
  width:260px;
  background:#1a1f2a;
  padding:12px;
  border-radius:10px;
  z-index:9999;
}

input, button {
  width:100%;
  margin-top:6px;
  padding:8px;
  border:none;
  border-radius:6px;
}

button {
  background:#2d6cdf;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

#log {
  position:absolute;
  bottom:10px;
  left:10px;
  width:300px;
  height:120px;
  overflow:auto;
  background:#1a1f2a;
  padding:10px;
  font-size:12px;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="ui">
  <b>🌍 Echo Shards RTS</b>
  <input id="nick" placeholder="Player name">
  <button onclick="join()">Join</button>
  <button onclick="spawn()">Spawn Shard</button>
  <div id="status">Offline</div>
</div>

<div id="log"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const API = "PASTE_YOUR_SCRIPT_URL_HERE";

let map = L.map('map').setView([33.8,-118.3], 11);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19
}).addTo(map);

let nick = "";
let nodes = {};

function color(name){
  if(!name) return "#555";
  let h = 0;
  for(let i=0;i<name.length;i++){
    h = name.charCodeAt(i)+((h<<5)-h);
  }
  return "#" + ((h & 0xFFFFFF).toString(16).padStart(6,"0"));
}

function join(){
  nick = document.getElementById("nick").value;
  if(!nick) return;

  document.getElementById("status").innerText = "Online";

  sync();
  setInterval(sync, 3000);
}

async function spawn(){

  let c = map.getCenter();

  await fetch(API,{
    method:"POST",
    body: JSON.stringify({
      action:"spawn",
      id: crypto.randomUUID(),
      lat: c.lat,
      lng: c.lng,
      owner: nick
    })
  });

  sync();
}

async function attack(id){
  await fetch(API,{
    method:"POST",
    body: JSON.stringify({
      action:"attack",
      id,
      nick
    })
  });

  sync();
}

async function upgrade(id){
  await fetch(API,{
    method:"POST",
    body: JSON.stringify({
      action:"upgrade",
      id,
      nick
    })
  });

  sync();
}

function draw(n){

  if(nodes[n.id]){
    map.removeLayer(nodes[n.id]);
  }

  let circle = L.circle([n.lat,n.lng],{
    radius: 200 + (n.level*30),
    color: color(n.owner),
    fillOpacity:0.4
  }).addTo(map);

  circle.on("click",()=>{
    circle.bindPopup(`
      <b>Shard</b><br>
      Owner: ${n.owner}<br>
      Level: ${n.level}<br><br>

      <button onclick="attack('${n.id}')">Attack</button>
      <button onclick="upgrade('${n.id}')">Upgrade</button>
    `).openPopup();
  });

  nodes[n.id] = circle;
}

async function sync(){

  const res = await fetch(API,{
    method:"POST",
    body: JSON.stringify({ action:"getWorld" })
  });

  const data = await res.json();

  (data.nodes || []).forEach(draw);
}

</script>

</body>
</html>
