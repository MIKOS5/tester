<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌍 Echo Shards RTS v10</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0b0f14;
  color:white;
}

#map {
  height:100vh;
  width:100%;
}

#ui {
  position:absolute;
  top:10px;
  left:10px;
  width:260px;
  background:#1a1f2a;
  padding:12px;
  border-radius:10px;
  z-index:9999;
}

input, button {
  width:100%;
  margin-top:6px;
  padding:8px;
  border:none;
  border-radius:6px;
}

button {
  background:#2d6cdf;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

#log {
  position:absolute;
  bottom:10px;
  left:10px;
  width:320px;
  height:130px;
  overflow:auto;
  background:#1a1f2a;
  padding:10px;
  font-size:12px;
  z-index:9999;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="ui">
  <b>🌍 Echo Shards v10 RTS</b>
  <input id="nick" placeholder="Player name">
  <button onclick="join()">Join World</button>
  <button onclick="spawn()">Spawn Node</button>
  <div id="status">Offline</div>
</div>

<div id="log"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

// ================= API =================
const API = "https://script.google.com/macros/s/AKfycbwfFHG9LeEzzYlVYCEXswjxeP_mVsevAqCtGybKBt9O5ww1Pn5d57S2yScP_2_rAinY/exec";

// ================= MAP =================
const map = L.map('map').setView([33.8,-118.3], 11);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
  maxZoom:19
}).addTo(map);

// ================= STATE =================
let nick = "";
let nodes = {};

// ================= COLOR SYSTEM =================
function color(owner){
  if(!owner) return "#555";
  const mapc = {
    "VOID":"#7a2cff",
    "ORDER":"#2cc7ff",
    "CHAOS":"#ff2c6d",
    "Neutral":"#444"
  };
  return mapc[owner] || "#999";
}

// ================= LOG =================
function log(msg){
  const el = document.getElementById("log");
  el.innerHTML = "• " + msg + "<br>" + el.innerHTML;
}

// ================= SAFE FETCH =================
async function post(data){
  const res = await fetch(API, {
    method:"POST",
    body: JSON.stringify(data)
  });

  const text = await res.text();

  try {
    return JSON.parse(text);
  } catch (e) {
    log("⚠ JSON parse error");
    console.log(text);
    return {};
  }
}

// ================= JOIN =================
function join(){
  nick = document.getElementById("nick").value;
  if(!nick) return;

  document.getElementById("status").innerText = "Online";

  sync();
  setInterval(sync, 3000);
  log("Joined world: " + nick);
}

// ================= SPAWN =================
async function spawn(){

  const c = map.getCenter();

  await post({
    action:"spawn",
    id: crypto.randomUUID(),
    lat:c.lat,
    lng:c.lng,
    owner:nick
  });

  sync();
  log("Spawned node");
}

// ================= ATTACK =================
async function attack(id){

  await post({
    action:"attack",
    id,
    nick
  });

  sync();
  log("Raid sent");
}

// ================= UPGRADE =================
async function upgrade(id){

  await post({
    action:"upgrade",
    id,
    nick
  });

  sync();
  log("Fortified node");
}

// ================= DRAW NODE =================
function draw(n){

  if(!n.id) return;

  if(nodes[n.id]){
    map.removeLayer(nodes[n.id]);
  }

  let intensity = 200 + (Number(n.level || 1) * 80);

  let circle = L.circle([Number(n.lat), Number(n.lng)], {
    radius:intensity,
    color:color(n.owner),
    fillOpacity:0.35
  }).addTo(map);

  circle.on("click", () => {

    circle.bindPopup(`
      <b>⚡ Node</b><br>
      Owner: ${n.owner}<br>
      Level: ${n.level}<br>
      Energy: ${n.energy}<br><br>

      <button onclick="attack('${n.id}')">⚔ Raid</button>
      <button onclick="upgrade('${n.id}')">⬆ Fortify</button>
    `).openPopup();

  });

  nodes[n.id] = circle;
}

// ================= SYNC WORLD =================
async function sync(){

  const data = await post({ action:"getWorld" });

  if(!data || !data.nodes) return;

  // optional cleanup (prevents ghost nodes)
  Object.keys(nodes).forEach(k => {
    map.removeLayer(nodes[k]);
  });
  nodes = {};

  data.nodes.forEach(draw);

  log("World synced");
}

// ================= AI TICK =================
setInterval(async () => {
  await post({ action:"tick" });
}, 8000);

</script>

</body>
</html>
