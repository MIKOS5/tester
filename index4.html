<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚔️ RTS MMO (Stable UI)</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0b0f14;
  color:white;
}

#map {
  height:100vh;
  width:100%;
}

#ui {
  position:absolute;
  top:10px;
  left:10px;
  width:260px;
  background:#1a1f2a;
  padding:12px;
  border-radius:10px;
  z-index:9999;
}

input, button, textarea {
  width:100%;
  margin-top:6px;
  padding:8px;
  border:none;
  border-radius:6px;
}

button {
  background:#2d6cdf;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

#log {
  position:absolute;
  bottom:10px;
  left:10px;
  width:320px;
  height:140px;
  overflow:auto;
  background:#1a1f2a;
  padding:10px;
  border-radius:10px;
  font-size:12px;
  z-index:9999;
}

.popupBtn {
  margin-top:6px;
  background:#444;
  color:white;
  padding:5px;
  cursor:pointer;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="ui">
  <b>⚔️ RTS MMO</b>
  <input id="nick" placeholder="Name">
  <button onclick="join()">Join</button>

  <div id="status">Offline</div>

  <textarea id="noteInput" placeholder="Write territory note..."></textarea>
</div>

<div id="log"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const API = "https://script.google.com/macros/s/AKfycbyGqdSRP9n1O8Mr53B65hkl2P103xSAdVmKsqKf7MbZvg1KzB_3Z2VoFTTPPoI-vWSY/exec";

let map;
let nick = "";
let tiles = {};   // IMPORTANT: persistent
let selectedTile = null;

// ================= MAP =================
map = L.map('map').setView([33.8,-118.3], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

// ================= TILE ID =================
function tileId(latlng){
  return Math.floor(latlng.lat*50)+"_"+Math.floor(latlng.lng*50);
}

function bounds(id){
  let [x,y] = id.split("_").map(Number);
  return [
    [x/50, y/50],
    [(x+1)/50, (y+1)/50]
  ];
}

// ================= JOIN =================
async function join(){
  nick = document.getElementById("nick").value;
  if(!nick) return;

  document.getElementById("status").innerText = "Online";

  sync();
  setInterval(sync, 3000);
}

// ================= CLICK =================
map.on("click", async (e)=>{

  if(!nick) return;

  let id = tileId(e.latlng);

  let note = document.getElementById("noteInput").value;

  await fetch(API,{
    method:"POST",
    body: JSON.stringify({
      action:"claim",
      id,
      lat:e.latlng.lat,
      lng:e.latlng.lng,
      nick,
      note
    })
  });

  sync();
});

// ================= DRAW TILE =================
function drawTile(t){

  if(tiles[t.id]){
    map.removeLayer(tiles[t.id]);
  }

  let rect = L.rectangle(bounds(t.id), {
    color: color(t.owner),
    weight: 1,
    fillOpacity: 0.35
  }).addTo(map);

  // FIX: persistent popup with manual reopen
  rect.on("click", ()=>{

    selectedTile = t;

    rect.bindPopup(`
      <b>Owner:</b> ${t.owner || "None"}<br>
      <b>Troops:</b> ${t.strength}<br>
      <b>Note:</b> ${t.note || "none"}<br><br>

      <button onclick="attack('${t.id}')">⚔ Attack</button>
    `).openPopup();
  });

  tiles[t.id] = rect;
}

// ================= ATTACK =================
async function attack(id){

  await fetch(API,{
    method:"POST",
    body: JSON.stringify({
      action:"claim",
      id,
      nick
    })
  });

  log("⚔ Attack sent");
  sync();
}

// ================= COLOR =================
function color(name){
  if(!name) return "#555";
  let h = 0;
  for(let i=0;i<name.length;i++) h = name.charCodeAt(i)+((h<<5)-h);
  return "#"+((h & 0xFFFFFF).toString(16).padStart(6,"0"));
}

// ================= SYNC =================
async function sync(){

  const res = await fetch(API,{
    method:"POST",
    body: JSON.stringify({action:"getWorld"})
  });

  const data = await res.json();

  // IMPORTANT: DO NOT CLEAR EVERYTHING → prevents popup flicker
  (data.tiles || []).forEach(drawTile);
}

// ================= LOG =================
function log(msg){
  document.getElementById("log").innerHTML += "• "+msg+"<br>";
}

</script>

</body>
</html>
