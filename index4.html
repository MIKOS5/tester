<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>xRisk RTS MMO v3</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body { margin:0; font-family:Arial; }

/* MAP */
#map {
  height:100vh;
  width:100%;
}

/* UI */
#ui {
  position:absolute;
  top:10px;
  left:10px;
  background:white;
  padding:12px;
  border-radius:10px;
  z-index:999;
  width:230px;
  box-shadow:0 4px 14px rgba(0,0,0,0.25);
}

input, button {
  width:100%;
  margin-top:6px;
  padding:8px;
  border-radius:6px;
  border:1px solid #ccc;
}

button {
  background:#2d6cdf;
  color:white;
  border:none;
  cursor:pointer;
}

button:hover {
  background:#1f56b8;
}

#status {
  font-size:12px;
  margin-top:8px;
  color:#333;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="ui">
  <b>🌍 RTS MMO v3</b>

  <input id="nick" placeholder="Enter nickname">
  <button onclick="join()">Join Game</button>

  <div id="status">Offline</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const API = "https://script.google.com/macros/s/AKfycbyGqdSRP9n1O8Mr53B65hkl2P103xSAdVmKsqKf7MbZvg1KzB_3Z2VoFTTPPoI-vWSY/exec";

let nick = "";
let map;
let gridSize = 0.02;

// store tiles
let tiles = {};

// last sync timestamp (IMPORTANT FOR DELTA SYNC)
let lastSync = 0;

// ---------------- MAP INIT ----------------
map = L.map('map').setView([33.8, -118.3], 12);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19
}).addTo(map);

// ---------------- CLICK TO CLAIM ----------------
map.on('click', async (e) => {
  if (!nick) return;

  const id = getTileId(e.latlng);

  await fetch(API, {
    method: "POST",
    body: JSON.stringify({
      action: "claim",
      id,
      lat: e.latlng.lat,
      lng: e.latlng.lng,
      nick
    })
  });

  sync(true);
});

// ---------------- GRID SYSTEM ----------------
function getTileId(latlng){
  return Math.floor(latlng.lat / gridSize) + "_" + Math.floor(latlng.lng / gridSize);
}

function getBounds(id){
  const [x,y] = id.split("_").map(Number);

  return [
    [x * gridSize, y * gridSize],
    [(x + 1) * gridSize, (y + 1) * gridSize]
  ];
}

// ---------------- JOIN ----------------
function join(){
  nick = document.getElementById("nick").value.trim();
  if(!nick) return;

  document.getElementById("status").innerText = "Online: " + nick;

  sync(true);
  setInterval(sync, 2500);
}

// ---------------- DRAW TILE ----------------
function drawTile(t){

  const id = t.id;
  const color = hashColor(t.owner);

  // update existing tile
  if (tiles[id]) {
    tiles[id].setStyle({
      color: color,
      fillColor: color
    });

    tiles[id].bindPopup(
      `<b>Territory</b><br>
       Owner: ${t.owner || "None"}<br>
       Troops: ${t.troops}<br>
       Level: ${t.level || 1}`
    );

    return;
  }

  // create new tile
  const rect = L.rectangle(getBounds(id), {
    color: color,
    weight: 1,
    fillColor: color,
    fillOpacity: 0.45
  }).addTo(map);

  rect.bindPopup(
    `<b>Territory</b><br>
     Owner: ${t.owner || "None"}<br>
     Troops: ${t.troops}<br>
     Level: ${t.level || 1}`
  );

  tiles[id] = rect;
}

// ---------------- COLOR SYSTEM ----------------
function hashColor(str){
  if(!str) return "#cccccc";

  let h = 0;
  for (let i=0;i<str.length;i++){
    h = str.charCodeAt(i) + ((h<<5)-h);
  }

  let hex = (h & 0x00FFFFFF).toString(16).toUpperCase();
  return "#" + "000000".substring(0,6-hex.length) + hex;
}

// ---------------- SYNC (DELTA SYSTEM) ----------------
async function sync(force=false){

  const now = Date.now();
  if (!force && now - lastSync < 1500) return;
  lastSync = now;

  try {
    const res = await fetch(API, {
      method: "POST",
      body: JSON.stringify({
        action: "getTerritories",
        since: lastSync
      })
    });

    const data = await res.json();

    (data.territories || []).forEach(drawTile);

  } catch (e) {
    console.log("sync error", e);
  }
}

</script>

</body>
</html>
