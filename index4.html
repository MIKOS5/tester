<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeoRisk</title>

<style>
body { margin:0; font-family:Arial; }
#map { height:100vh; width:100%; }
#ui {
  position:absolute;
  top:10px;
  left:10px;
  background:white;
  padding:10px;
  border-radius:8px;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="ui">
  Nick: <input id="nick"><br>
  <button onclick="join()">Join</button><br><br>
  <b id="status">Not connected</b>
</div>

<script>

const API = "YOUR_SCRIPT_URL";
let nick = "";

let map;
let territories = {};

// ---------------- INIT MAP ----------------
function initMap() {

  map = new google.maps.Map(document.getElementById("map"), {
    center: { lat: 33.8, lng: -118.3 },
    zoom: 12
  });

  map.addListener("click", (e)=>{
    if (!nick) return;

    const id = gridId(e.latLng);

    claim(id, e.latLng.lat(), e.latLng.lng());
  });

  loop();
}

// ---------------- GRID ID ----------------
function gridId(latlng){
  return Math.floor(latlng.lat()*50) + "_" + Math.floor(latlng.lng()*50);
}

// ---------------- JOIN ----------------
function join(){
  nick = document.getElementById("nick").value;
  document.getElementById("status").textContent = "Online as " + nick;
}

// ---------------- CLAIM ----------------
async function claim(id, lat, lng){

  const res = await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"claim",
      nick,
      id,
      lat,
      lng
    })
  });

  const data = await res.json();
  console.log(data);
}

// ---------------- DRAW TERRITORIES ----------------
function drawTerritory(t){

  if (territories[t.id]) {
    territories[t.id].setMap(null);
  }

  const color = stringColor(t.owner);

  const rect = new google.maps.Rectangle({
    strokeColor: color,
    fillColor: color,
    fillOpacity: 0.35,
    map,
    bounds: {
      north: t.lat + 0.01,
      south: t.lat - 0.01,
      east: t.lng + 0.01,
      west: t.lng - 0.01
    }
  });

  territories[t.id] = rect;
}

// ---------------- COLOR HASH ----------------
function stringColor(str){
  if(!str) return "#ccc";
  let hash = 0;
  for (let i=0;i<str.length;i++){
    hash = str.charCodeAt(i) + ((hash<<5)-hash);
  }
  return "#"+((hash>>24)&255).toString(16).padStart(2,'0')+
              ((hash>>16)&255).toString(16).padStart(2,'0')+
              ((hash>>8)&255).toString(16).padStart(2,'0');
}

// ---------------- SYNC ----------------
async function sync(){

  const res = await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"getTerritories"})
  });

  const data = await res.json();

  data.territories.forEach(drawTerritory);
}

// ---------------- LOOP ----------------
function loop(){
  setInterval(sync, 2000);
}

</script>

<script async
src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap">
</script>

</body>
</html>
