<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Territory MMO War</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#111;
  color:white;
}

#ui {
  position:fixed;
  top:10px;
  left:10px;
  background:#222;
  padding:10px;
  border-radius:10px;
  z-index:10;
}

#grid {
  display:grid;
  grid-template-columns: repeat(30, 20px);
  grid-template-rows: repeat(30, 20px);
  width:600px;
  height:600px;
  margin:80px auto;
  border:2px solid #555;
}

.cell {
  width:20px;
  height:20px;
  border:1px solid #222;
  box-sizing:border-box;
}

.cell:hover {
  outline:1px solid white;
  cursor:pointer;
}
</style>
</head>

<body>

<div id="ui">
  Nick: <input id="nick"><br><br>
  <button onclick="join()">Join War</button><br><br>
  <b id="status">Offline</b>
</div>

<div id="grid"></div>

<script>

const API = "YOUR_SCRIPT_URL_HERE";

let nick = "";
let world = {};

// ---------------- INIT GRID ----------------
const grid = document.getElementById("grid");

for(let y=0;y<30;y++){
  for(let x=0;x<30;x++){
    const cell = document.createElement("div");
    cell.className = "cell";
    cell.dataset.id = x + "_" + y;

    cell.onclick = ()=> claim(x,y);

    grid.appendChild(cell);
  }
}

// ---------------- JOIN ----------------
function join(){
  nick = document.getElementById("nick").value;
  document.getElementById("status").innerText = "Online as " + nick;
}

// ---------------- CLAIM TILE ----------------
async function claim(x,y){

  if(!nick) return;

  const id = x + "_" + y;

  const res = await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"claim",
      id,
      x,
      y,
      nick
    })
  });

  const data = await res.json();
  console.log("claim:",data);

  sync();
}

// ---------------- SYNC WORLD ----------------
async function sync(){

  const res = await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"getWorld"
    })
  });

  const data = await res.json();

  world = {};

  data.tiles.forEach(t=>{
    world[t.id] = t.owner;
  });

  render();
}

// ---------------- RENDER ----------------
function render(){

  document.querySelectorAll(".cell").forEach(cell=>{
    const id = cell.dataset.id;
    const owner = world[id];

    if(!owner){
      cell.style.background = "#222";
    } else {
      cell.style.background = color(owner);
    }
  });
}

// ---------------- COLOR ----------------
function color(str){
  let hash = 0;
  for(let i=0;i<str.length;i++){
    hash = str.charCodeAt(i) + ((hash<<5)-hash);
  }

  return "hsl(" + (hash % 360) + ",70%,50%)";
}

// ---------------- LOOP ----------------
setInterval(sync, 2000);
sync();

</script>

</body>
</html>
