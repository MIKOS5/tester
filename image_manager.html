<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Manager v4.3</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;padding:18px;font-family:Inter;background:#0f172a;color:white;min-height:100vh}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.stat{background:#111827;border:1px solid #ffffff14;border-radius:12px;padding:10px 14px;min-width:120px}.l{font-size:10px;color:#94a3b8;text-transform:uppercase}.v{font-size:20px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.card{background:#111827;border:1px solid #ffffff14;border-radius:16px;overflow:hidden}
.thumb{height:160px;background:#0b1220;display:grid;place-items:center;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}
.info{padding:12px}.title{font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:11px;color:#94a3b8}.btn{padding:8px;border-radius:8px;border:none;font-weight:700;cursor:pointer;width:100%;margin-top:6px}
.btn-up{background:#2563eb;color:white}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#22c55e;color:white;padding:12px 18px;border-radius:999px;display:none}.toast.show{display:block}.toast.err{background:#dc2626}
#debug{background:#0b1220;border:1px solid #ffffff14;border-radius:10px;padding:10px;font-size:11px;color:#94a3b8;white-space:pre-wrap;margin-bottom:12px}
</style>
</head>
<body>
<h2>🖼 Image Manager v4.3 — <span id="cnt">loading</span></h2>
<div id="debug">Init...</div>
<div class="stats"><div class="stat"><div class="l">Total</div><div class="v" id="sTotal">0</div></div><div class="stat"><div class="l">With</div><div class="v" id="sWith">0</div></div><div class="stat"><div class="l">Missing</div><div class="v" id="sMiss">0</div></div></div>
<div style="margin:10px 0"><input id="search" placeholder="Search GH-..." style="padding:10px;background:#1e293b;border:1px solid #ffffff14;border-radius:10px;color:white;width:300px"> <button onclick="fixAll()" style="padding:8px 12px;border-radius:999px;background:#22c55e;color:white;border:none;font-weight:700">Fix All Old URLs</button></div>
<div class="grid" id="grid"></div>
<div class="toast" id="toast"></div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbzDCfZokdDHryVxtuVOuvTb6XUfnMR66_8Xwym3QzaSWgKooI0865_JPtTi0hJ_GDQr/exec";
function log(m){ document.getElementById("debug").textContent+= "\n"+m; console.log(m); }
function toThumb(u){
  if(!u) return "";
  let id=null;
  let a=u.match(/id=([^&]+)/); if(a) id=a[1];
  let b=u.match(/\/d\/([^\/]+)/); if(!id&&b) id=b[1];
  if(id) return "https://drive.google.com/thumbnail?id="+id+"&sz=w1000";
  return u;
}
let ALL=[];
async function load(){
  try{
    log("Fetching "+API_URL+"?action=read");
    let res=await fetch(API_URL+"?action=read");
    log("Status "+res.status);
    let txt=await res.text();
    log("Length "+txt.length+" first 200: "+txt.slice(0,200));
    let j=JSON.parse(txt);
    ALL=j.data||[];
    log("Parsed "+ALL.length+" items");
    if(ALL.length===0){ document.getElementById("grid").innerHTML="No data"; return; }
    render();
  }catch(e){ log("ERROR "+e.message); document.getElementById("grid").innerHTML="<div style=color:#ef4444>ERROR: "+e.message+"</div>"; }
}
function render(){
  let q=(document.getElementById("search").value||"").toLowerCase();
  let list=ALL.filter(o=>!q||JSON.stringify(o).toLowerCase().includes(q));
  document.getElementById("cnt").textContent=list.length+"/"+ALL.length;
  document.getElementById("sTotal").textContent=ALL.length;
  let withImg=ALL.filter(o=>(o["Image"]||"").trim()).length;
  document.getElementById("sWith").textContent=withImg;
  document.getElementById("sMiss").textContent=ALL.length-withImg;
  let grid=document.getElementById("grid");
  grid.innerHTML="";
  list.forEach(item=>{
    let raw=(item["Image"]||"").trim();
    let thumb=toThumb(raw);
    let has=!!raw;
    let div=document.createElement("div"); div.className="card";
    div.innerHTML=`<div class=thumb>${has?`<img src="${thumb}" onerror="this.parentElement.innerHTML='❌<br><small>${raw.slice(0,30)}</small>'">`:"📷 No Image"}</div><div class=info><div class=title>${item["Item Name"]||""}</div><div class=meta>${item["Unique ID"]||""} • ${item["Brand"]||""}</div><button class="btn btn-up" onclick="upload('${item["Unique ID"]}')">📤 Upload / Replace</button><button class="btn" style="background:#ffffff14;color:#cbd5e1" onclick="setUrl('${item["Unique ID"]}')">🔗 Set Thumbnail URL</button></div>`;
    grid.appendChild(div);
  });
}
async function upload(uid){
  let input=document.createElement("input"); input.type="file"; input.accept="image/*";
  input.onchange=async e=>{
    let file=e.target.files[0]; if(!file) return;
    log("Uploading "+file.name+" for "+uid);
    let b64=await new Promise(r=>{ let fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(file); });
    let payload={"action":"uploadImage","Unique ID":uid,"fileName":file.name,"mimeType":file.type,"data":b64};
    let res=await fetch(API_URL+"?action=uploadImage",{method:"POST",body:JSON.stringify(payload),headers:{"Content-Type":"text/plain;charset=utf-8"}});
    let j=await res.json();
    log("Upload resp "+JSON.stringify(j).slice(0,200));
    if(j.ok){
      let item=ALL.find(o=>o["Unique ID"]===uid); if(item) item["Image"]=toThumb(j.url);
      render(); showToast("Uploaded ✓");
    } else showToast(j.error,true);
  };
  input.click();
}
async function setUrl(uid){
  let url=prompt("Paste thumbnail URL (or uc?export=view will auto-convert)");
  if(!url) return;
  url=toThumb(url);
  let payload={"action":"setImageUrl","Unique ID":uid,"url":url};
  let res=await fetch(API_URL+"?action=setImageUrl",{method:"POST",body:JSON.stringify(payload),headers:{"Content-Type":"text/plain;charset=utf-8"}});
  let j=await res.json();
  if(j.ok){ let it=ALL.find(o=>o["Unique ID"]===uid); if(it) it["Image"]=url; render(); showToast("Linked ✓"); } else showToast(j.error,true);
}
async function fixAll(){
  let old=ALL.filter(o=>(o["Image"]||"").includes("uc?export=view"));
  if(old.length===0){ showToast("No old URLs"); return; }
  for(let o of old){
    let fixed=toThumb(o["Image"]);
    let payload={"action":"setImageUrl","Unique ID":o["Unique ID"],"url":fixed};
    await fetch(API_URL+"?action=setImageUrl",{method:"POST",body:JSON.stringify(payload),headers:{"Content-Type":"text/plain;charset=utf-8"}});
    o["Image"]=fixed;
  }
  render(); showToast("Fixed "+old.length);
}
function showToast(m,err){ let t=document.getElementById("toast"); t.textContent=m; t.className="toast show"+(err?" err":""); setTimeout(()=>t.classList.remove("show"),3000); }
document.getElementById("search").addEventListener("input",render);
load();
</script>
</body>
</html>
