<!DOCTYPE html>
<html>
<head>
<title>ESPN API Structure Tester</title>

<style>

body{
    background:#111;
    color:white;
    font-family:Arial;
    padding:20px;
}

button{
    padding:10px;
    margin:5px;
    cursor:pointer;
}

.card{
    background:#222;
    padding:15px;
    margin:10px 0;
    border-radius:8px;
}

.good{
    color:#00ff88;
}

.bad{
    color:#ff5555;
}

pre{
    background:#000;
    padding:10px;
    overflow:auto;
    max-height:500px;
}

</style>

</head>

<body>


<h1>ESPN API Structure Tester</h1>


<button onclick="runAll()">
Run All Tests
</button>


<button onclick="copyResults()">
Copy Results
</button>


<div id="output"></div>



<script>


const SPORTS={


MLB:{
name:"MLB",
path:"baseball/mlb"
},


NBA:{
name:"NBA",
path:"basketball/nba"
},


NFL:{
name:"NFL",
path:"football/nfl"
},


NHL:{
name:"NHL",
path:"hockey/nhl"
},


SOCCER:{
name:"Soccer",
path:"soccer/eng.1"
}


};



const ENDPOINTS=[

"scoreboard",
"teams",
"news",
"standings",
"schedule",
"statistics",
"athletes",
"transactions",
"injuries"

];





const SPECIAL={


"MLB-standings":
"https://site.api.espn.com/apis/v2/sports/baseball/mlb/standings",


"NBA-standings":
"https://site.api.espn.com/apis/v2/sports/basketball/nba/standings",


"NFL-standings":
"https://site.api.espn.com/apis/v2/sports/football/nfl/standings",


"NHL-standings":
"https://site.api.espn.com/apis/v2/sports/hockey/nhl/standings"


};




let results=[];



async function runAll(){


document.getElementById("output").innerHTML="";


results=[];



for(let s in SPORTS){


let sport=SPORTS[s];


add(`

<div class="card">

<h2>${sport.name}</h2>

</div>

`);



for(let endpoint of ENDPOINTS){


await testAPI(
sport.name,
sport.path,
endpoint
);


}



}


alert("Finished");

}




async function testAPI(
sport,
path,
endpoint
){



let key=sport+"-"+endpoint;


let apiURL;



if(SPECIAL[key]){


apiURL=SPECIAL[key];


}

else{


apiURL=
`https://site.api.espn.com/apis/site/v2/sports/${path}/${endpoint}`;


}



let url=
`https://api.allorigins.win/raw?url=${encodeURIComponent(apiURL)}`;




let box=document.createElement("div");

box.className="card";


document
.getElementById("output")
.appendChild(box);



box.innerHTML=`

<h3>
${sport} - ${endpoint}
</h3>

<p>${apiURL}</p>

<p>Loading...</p>

`;




try{


let response=
await fetch(url);



if(!response.ok){


box.innerHTML+=`

<p class="bad">

FAILED HTTP ${response.status}

</p>

`;


return;

}



let json=
await response.json();



let paths=[];


scan(
json,
"",
paths
);



let unique=[
...new Set(paths)
];



let id=results.length;



results.push({

sport,
endpoint,
url:apiURL,
keys:unique.length,
paths:unique,
json

});





box.innerHTML=

`

<h3>
${sport} - ${endpoint}
</h3>


<p class="good">

SUCCESS

</p>


<p>
Keys Found:
<b>${unique.length}</b>

</p>


<button onclick="showJSON(${id})">
Show JSON
</button>


<button onclick="showPaths(${id})">
Show Paths
</button>


`;



}

catch(e){


box.innerHTML+=`

<p class="bad">

ERROR:

${e.message}

</p>

`;

}



}







function scan(obj,path,list){


if(obj===null)
return;



if(Array.isArray(obj)){


list.push(path+"[]");


if(obj.length){

scan(
obj[0],
path+"[]",
list
);

}


return;

}




if(typeof obj==="object"){



for(let key in obj){


let p=
path+"."+key;


list.push(p);


scan(
obj[key],
p,
list
);


}


}



}





function showJSON(id){


let r=results[id];


let w=window.open();


w.document.write(

"<pre>"+
JSON.stringify(
r.json,
null,
2
)+
"</pre>"

);


}





function showPaths(id){


let r=results[id];


let w=window.open();


w.document.write(

"<pre>"+
r.paths.join("\n")
+
"</pre>"

);


}






function copyResults(){


navigator.clipboard.writeText(

JSON.stringify(
results,
null,
2
)

);


alert(
"Copied JSON"
);


}





function add(html){


document
.getElementById("output")
.innerHTML+=html;


}



</script>


</body>
</html>
