<!DOCTYPE html>
<html>
<head>
<title>ESPN API Structure Tester</title>

<style>
body{
    font-family:Arial;
    background:#111;
    color:#eee;
    padding:20px;
}

button{
    padding:10px;
    margin:5px;
    cursor:pointer;
}

.card{
    background:#222;
    padding:15px;
    margin:15px 0;
    border-radius:8px;
}

pre{
    background:#000;
    padding:10px;
    overflow:auto;
    max-height:400px;
    white-space:pre-wrap;
}

.good{
    color:#00ff99;
}

.bad{
    color:#ff5555;
}
</style>

</head>

<body>

<h1>ESPN API Structure Tester</h1>

<button onclick="runAll()">Run All Tests</button>

<button onclick="copyResults()">Copy Results</button>

<div id="output"></div>


<script>


const SPORTS = {


MLB:{
    name:"MLB",
    path:"baseball/mlb"
},

NBA:{
    name:"NBA",
    path:"basketball/nba"
},

NFL:{
    name:"NFL",
    path:"football/nfl"
},

NHL:{
    name:"NHL",
    path:"hockey/nhl"
},

SOCCER:{
    name:"Soccer",
    path:"soccer/eng.1"
}


};



const ENDPOINTS=[

"scoreboard",
"teams",
"news",
"standings",
"leaders",
"rankings"

];



let results=[];



async function runAll(){

document.getElementById("output").innerHTML="Running...";

results=[];


for(const sport in SPORTS){

let s=SPORTS[sport];


add(
`
<div class="card">
<h2>${s.name}</h2>
</div>
`
);


for(const endpoint of ENDPOINTS){

await testAPI(
s.name,
s.path,
endpoint
);


}

}


console.log(results);

}



async function testAPI(name,path,endpoint){


let url=
`https://site.api.espn.com/apis/site/v2/sports/${path}/${endpoint}`;


let box=document.createElement("div");
box.className="card";


document
.getElementById("output")
.appendChild(box);



box.innerHTML=
`
<h3>
${name} - ${endpoint}
</h3>

<p>${url}</p>

<p>Loading...</p>
`;



try{


let res=await fetch(url);


if(!res.ok){

box.innerHTML+=
`
<p class="bad">
FAILED ${res.status}
</p>
`;

return;

}



let json=await res.json();


let paths=[];


scan(
json,
"",
paths
);



let unique=[...new Set(paths)];



let sample=
JSON.stringify(
json,
null,
2
)
.substring(0,5000);



results.push({

sport:name,
endpoint:endpoint,
keys:unique.length,
paths:unique,
sample:json

});



box.innerHTML=
`

<h3>${name} - ${endpoint}</h3>

<p class="good">
SUCCESS
</p>

<p>
Keys Found:
${unique.length}
</p>


<button onclick="showJSON(${results.length-1})">
Show JSON
</button>


<button onclick="showPaths(${results.length-1})">
Show Paths
</button>


`;


}
catch(e){

box.innerHTML+=
`
<p class="bad">
ERROR ${e}
</p>
`;

}


}




function scan(obj,path,output){


if(obj===null)
return;



if(Array.isArray(obj)){


output.push(path+"[]");


if(obj.length>0){

scan(
obj[0],
path+"[]",
output
);

}

return;

}



if(typeof obj==="object"){


for(let key in obj){


let newPath=
path+"."+key;


output.push(newPath);


scan(
obj[key],
newPath,
output
);


}

}


}




function showJSON(id){

let r=results[id];


let win=
window.open();


win.document.write(

"<pre>"+
JSON.stringify(
r.sample,
null,
2
)+
"</pre>"

);


}



function showPaths(id){

let r=results[id];


let win=
window.open();


win.document.write(

"<pre>"+
r.paths.join("\n")+
"</pre>"

);


}




function copyResults(){


let text=
JSON.stringify(
results,
null,
2
);


navigator.clipboard.writeText(text);


alert(
"Copied JSON Results"
);


}




function add(html){

document
.getElementById("output")
.innerHTML+=html;

}



</script>


</body>
</html>
