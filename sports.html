<!DOCTYPE html>
<html>

<head>

<title>ESPN API Tester</title>

<style>

body{

background:#05070d;
color:white;
font-family:Arial;
padding:20px;

}

select,button{

padding:10px;
margin:5px;

background:#111827;
color:white;
border:1px solid #334155;
border-radius:8px;

}


pre{

background:#111827;
padding:20px;
border-radius:10px;
overflow:auto;
max-height:700px;

white-space:pre-wrap;

}

h1{

color:#38bdf8;

}

</style>

</head>


<body>


<h1>ESPN API Structure Tester</h1>


<select id="sport">

<option value="baseball/mlb">
⚾ MLB
</option>

<option value="football/nfl">
🏈 NFL
</option>

<option value="basketball/nba">
🏀 NBA
</option>

<option value="basketball/wnba">
🏀 WNBA
</option>

<option value="hockey/nhl">
🏒 NHL
</option>

<option value="soccer/usa.1">
⚽ MLS
</option>

<option value="soccer/eng.1">
⚽ Premier League
</option>

<option value="soccer/esp.1">
⚽ La Liga
</option>

</select>



<select id="endpoint">


<option value="scoreboard">
Scoreboard
</option>


<option value="standings">
Standings
</option>


<option value="teams">
Teams
</option>


<option value="news">
News
</option>


</select>



<button onclick="loadAPI()">

Load ESPN JSON

</button>


<button onclick="copyJSON()">

Copy

</button>


<h3 id="url"></h3>


<pre id="output">

Waiting...

</pre>



<script>


const SITE =
"https://site.api.espn.com/apis/site/v2/sports";


const V2 =
"https://site.api.espn.com/apis/v2/sports";



let lastJSON="";



async function loadAPI(){


const sport =
document.getElementById("sport").value;


const endpoint =
document.getElementById("endpoint").value;



let url;



if(endpoint==="standings"){


url =
`${V2}/${sport}/standings`;


}

else{


url =
`${SITE}/${sport}/${endpoint}`;


}



document.getElementById("url").innerHTML =
url;



try{


const response =
await fetch(url);



const json =
await response.json();



lastJSON =
JSON.stringify(
json,
null,
2
);



/*
 Limit display

 Shows first 8000 characters
*/

document.getElementById("output").textContent =

lastJSON.substring(0,8000);



}

catch(error){


document.getElementById("output").textContent =

"ERROR\n\n"+error;


}


}




function copyJSON(){


navigator.clipboard.writeText(
lastJSON
);


alert(
"Copied full JSON"
);


}



</script>


</body>

</html>
