<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gear & Tools Hub</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:"Inter",sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e293b,#111827);
    color:white;
    display:flex;
    height:100vh;
    overflow:hidden;
}

/* Sidebar */

.sidebar{
    width:260px;
    background:rgba(17,24,39,.88);
    backdrop-filter:blur(18px);
    border-right:1px solid rgba(255,255,255,.08);
    display:flex;
    flex-direction:column;
    padding:22px 16px;
    box-shadow:0 0 30px rgba(0,0,0,.35);
}

.logo{
    text-align:center;
    margin-bottom:30px;
}

.logo h2{
    font-size:24px;
    font-weight:700;
}

.logo p{
    color:#9ca3af;
    font-size:13px;
    margin-top:6px;
}

.nav{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.nav a{
    text-decoration:none;
    color:#d1d5db;
    padding:14px 16px;
    border-radius:12px;
    transition:.25s;
    font-weight:600;
    display:flex;
    align-items:center;
    gap:12px;
}

.nav a:hover{
    background:#2563eb;
    color:white;
    transform:translateX(5px);
    box-shadow:0 10px 25px rgba(37,99,235,.35);
}

.nav a.active{
    background:#2563eb;
    color:white;
    box-shadow:0 10px 30px rgba(37,99,235,.4);
}

/* Main */

.main{
    flex:1;
    display:flex;
    flex-direction:column;
    padding:25px;
    overflow:hidden;
}

/* Header */

.header{
    background:rgba(255,255,255,.06);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
    padding:22px 28px;
    margin-bottom:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header h1{
    font-size:30px;
    font-weight:700;
}

.header p{
    margin-top:6px;
    color:#9ca3af;
}

.badge{
    background:#2563eb;
    color:white;
    padding:10px 18px;
    border-radius:999px;
    font-size:14px;
    font-weight:600;
}

/* Window */

.window{
    flex:1;
    background:rgba(255,255,255,.05);
    border-radius:18px;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.08);
    box-shadow:0 20px 45px rgba(0,0,0,.4);
}

.window-bar{
    height:46px;
    background:#1f2937;
    display:flex;
    align-items:center;
    padding:0 18px;
    gap:10px;
    border-bottom:1px solid rgba(255,255,255,.08);
}

.dot{
    width:12px;
    height:12px;
    border-radius:50%;
}

.red{background:#ff5f57;}
.yellow{background:#ffbd2f;}
.green{background:#28c840;}

iframe{
    width:100%;
    height:calc(100% - 46px);
    border:none;
    background:white;
}

/* Mobile */

@media(max-width:850px){

body{
    flex-direction:column;
}

.sidebar{
    width:100%;
    height:auto;
    border-right:none;
    border-bottom:1px solid rgba(255,255,255,.1);
}

.logo{
    margin-bottom:18px;
}

.nav{
    flex-direction:row;
    overflow-x:auto;
}

.nav a{
    white-space:nowrap;
    flex:0 0 auto;
}

.header{
    flex-direction:column;
    align-items:flex-start;
    gap:15px;
}

.main{
    padding:12px;
}

}

</style>
</head>

<body>

<div class="sidebar">

<div class="logo">
<h2>🧰 Gear Hub</h2>
<p>Inventory Dashboard</p>
</div>

<div class="nav">

<a class="active" href="inventory.html" target="contentFrame">
📦 Gear Inventory
</a>

<a href="Front.html" target="contentFrame">
🏷️ For Sale
</a>

<a href="inventorydetails.html" target="contentFrame">
📋 Inventory Details
</a>

<a href="input_items.html" target="contentFrame">
➕ Input Items
</a>

</div>

</div>

<div class="main">

<div class="header">

<div>
<h1>Gear & Tools Hub</h1>
<p>Manage inventory, sales, and equipment from one dashboard.</p>
</div>

<div class="badge">
Online
</div>

</div>

<div class="window">

<div class="window-bar">
<div class="dot red"></div>
<div class="dot yellow"></div>
<div class="dot green"></div>
</div>

<iframe
name="contentFrame"
src="inventory.html">
</iframe>

</div>

</div>

<script>

const links=document.querySelectorAll(".nav a");

links.forEach(link=>{

link.addEventListener("click",function(){

links.forEach(l=>l.classList.remove("active"));

this.classList.add("active");

});

});

</script>

</body>
</html>
