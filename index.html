<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gear & Tools Hub — Inventory Dashboard</title>
<meta name="description" content="Manage inventory, sales, and equipment from one dashboard.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1220;--bg2:#111d33;--panel:rgba(17,24,39,.86);--panel2:rgba(255,255,255,.06);--border:rgba(255,255,255,.09);--text:#f8fafc;--muted:#94a3b8;--blue:#2563eb;--radius:18px;--sidebar:280px}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,system-ui,sans-serif;background:radial-gradient(1200px 600px at 15% -10%,rgba(37,99,235,.22),transparent 60%),radial-gradient(900px 500px at 90% 10%,rgba(124,58,237,.18),transparent 60%),linear-gradient(180deg,var(--bg),var(--bg2) 40%,#0f172a);color:var(--text);display:flex;min-height:100vh;overflow:hidden}
.sidebar{width:var(--sidebar);background:var(--panel);backdrop-filter:blur(20px);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:22px 16px;z-index:20;transition:transform.28s}
.logo{display:flex;gap:12px;align-items:center;padding:6px 8px 22px;border-bottom:1px solid var(--border);margin-bottom:18px}
.logo-icon{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--blue),#7c3aed);display:grid;place-items:center;font-weight:700;box-shadow:0 8px 20px rgba(37,99,235,.35)}
.logo h2{font-size:18px;font-weight:700}.logo p{color:var(--muted);font-size:12.5px;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:6px;flex:1}
.nav a{text-decoration:none;color:#cbd5e1;padding:12px 14px;border-radius:12px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:12px;border:1px solid transparent;transition:.2s}
.nav a:hover{background:rgba(255,255,255,.06);color:white;transform:translateX(3px);border-color:var(--border)}
.nav a.active{background:var(--blue);color:white;box-shadow:0 10px 24px rgba(37,99,235,.35);border-color:rgba(255,255,255,.15)}
.sidebar-footer{margin-top:auto;padding-top:18px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:12px}
.storage{background:rgba(255,255,255,.05);border:1px solid var(--border);border-radius:14px;padding:12px 14px}
.storage.bar{height:6px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden;margin-top:8px}.storage.fill{height:100%;width:68%;background:linear-gradient(90deg,var(--blue),#22d3ee);border-radius:999px}
.main{flex:1;display:flex;flex-direction:column;padding:22px;overflow:hidden;min-width:0}
.header{background:var(--panel2);backdrop-filter:blur(18px);border:1px solid var(--border);border-radius:var(--radius);padding:18px 22px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.header h1{font-size:24px;font-weight:700;letter-spacing:-.02em}.header p{margin-top:4px;color:var(--muted);font-size:13.5px}
.header-actions{display:flex;align-items:center;gap:10px}
.badge{display:inline-flex;align-items:center;gap:8px;background:rgba(37,99,235,.15);border:1px solid rgba(37,99,235,.35);color:#bfdbfe;padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600}
.badge i{width:8px;height:8px;background:#22c55e;border-radius:50%;box-shadow:0 0 0 4px rgba(34,197,94,.18);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 4px rgba(34,197,94,.18)}50%{box-shadow:0 0 0 8px rgba(34,197,94,.08)}100%{box-shadow:0 0 0 4px rgba(34,197,94,.18)}}
.icon-btn{background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:9px 11px;cursor:pointer;transition:.2s}.icon-btn:hover{background:rgba(255,255,255,.1)}
.window{flex:1;background:rgba(255,255,255,.045);border-radius:var(--radius);overflow:hidden;border:1px solid var(--border);box-shadow:0 20px 50px rgba(0,0,0,.45);display:flex;flex-direction:column;min-height:0}
.window-bar{height:48px;background:#151d2f;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--border)}
.dots{display:flex;gap:8px}.dot{width:11px;height:11px;border-radius:50%}.red{background:#ff5f57}.yellow{background:#ffbd2e}.green{background:#28c840}
.file-pill{background:rgba(255,255,255,.07);border:1px solid var(--border);padding:6px 12px;border-radius:999px;font-size:12px;color:#cbd5e1;font-weight:500;max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iframe-wrap{position:relative;flex:1;background:white;min-height:0}.loader{position:absolute;inset:0;display:grid;place-items:center;background:white;color:#475569;font-size:14px;font-weight:500;z-index:2;transition:opacity.25s}.loader.hidden{opacity:0;pointer-events:none}
iframe{width:100%;height:100%;border:none;display:block}
.mobile-top{display:none;background:var(--panel);border-bottom:1px solid var(--border);padding:14px 16px;align-items:center;justify-content:space-between}
.hamburger{background:transparent;border:1px solid var(--border);color:white;border-radius:10px;padding:9px 11px;cursor:pointer}
@media(max-width:900px){body{flex-direction:column;overflow:auto;height:auto}.mobile-top{display:flex;position:sticky;top:0;z-index:30;backdrop-filter:blur(18px)}.sidebar{position:fixed;inset:0 auto 0 0;transform:translateX(-100%);width:min(300px,85vw);height:100dvh}.sidebar.open{transform:translateX(0);box-shadow:0 0 0 100vmax rgba(0,0,0,.5)}.main{padding:14px;height:auto}.header{flex-direction:column;align-items:flex-start}.window{height:72vh}}
</style>
</head>
<body>
<div class="mobile-top"><div style="display:flex;align-items:center;gap:10px"><div class="logo-icon">🧰</div><strong>Gear Hub</strong></div><button class="hamburger" id="hamburger" aria-label="Open menu">☰</button></div>
<aside class="sidebar" id="sidebar">
<div class="logo"><div class="logo-icon">🧰</div><div><h2>Gear Hub</h2><p>Inventory Dashboard</p></div></div>
<nav class="nav">
<a class="active" href="inventory.html" target="contentFrame" data-title="Gear Inventory" data-sub="Browse, search, and manage restored equipment">📦 Gear Inventory</a>
<a href="Front.html" target="contentFrame" data-title="For Sale" data-sub="Manage listings and pricing">🏷️ For Sale</a>
<a href="inventorydetails.html" target="contentFrame" data-title="Inventory Details" data-sub="Complete equipment database and history">📋 Inventory Details</a>
<a href="input_items.html" target="contentFrame" data-title="Input Items" data-sub="Add new gear and tools">➕ Input Items</a>
</nav>
<div class="sidebar-footer"><div class="storage"><div style="display:flex;justify-content:space-between;font-size:12px;color:#cbd5e1;font-weight:600"><span>Storage</span><span>68%</span></div><div class="bar"><div class="fill"></div></div><div style="margin-top:8px;font-size:11px;color:var(--muted)">1.2k items · Updated now</div></div><div style="display:flex;gap:10px;align-items:center;padding:4px 2px"><div style="width:32px;height:32px;border-radius:50%;background:#1e293b;display:grid;place-items:center;font-weight:700;font-size:12px;border:1px solid var(--border)">HD</div><div><div style="font-size:13px;font-weight:600">Harvey Draper</div><div style="font-size:11px;color:var(--muted)">Admin</div></div></div></div>
</aside>
<main class="main">
<div class="header"><div><h1 id="pageTitle">Gear Inventory</h1><p id="pageSub">Browse, search, and manage restored equipment</p></div><div class="header-actions"><div class="badge"><i></i>Online</div><button class="icon-btn" id="reloadBtn" title="Reload">↻</button><button class="icon-btn" id="fsBtn" title="Fullscreen">⤢</button></div></div>
<div class="window" id="window"><div class="window-bar"><div class="dots"><div class="dot red"></div><div class="dot yellow"></div><div class="dot green"></div></div><div class="file-pill" id="filePill">inventory.html</div><div><button class="icon-btn" id="newTabBtn" title="Open in new tab">↗</button></div></div><div class="iframe-wrap"><div class="loader" id="loader">Loading…</div><iframe name="contentFrame" id="contentFrame" src="inventory.html" loading="lazy" sandbox="allow-same-origin allow-scripts allow-forms allow-popups allow-downloads"></iframe></div></div>
</main>
<script>
const links=document.querySelectorAll(".nav a"),titleEl=document.getElementById("pageTitle"),subEl=document.getElementById("pageSub"),filePill=document.getElementById("filePill"),iframe=document.getElementById("contentFrame"),loader=document.getElementById("loader"),sidebar=document.getElementById("sidebar"),hamburger=document.getElementById("hamburger");
const last=localStorage.getItem("gearhub:lastPage");if(last){const m=[...links].find(l=>l.getAttribute("href")===last);if(m){setActive(m);iframe.src=last;}}
links.forEach(l=>l.addEventListener("click",function(){setActive(this);localStorage.setItem("gearhub:lastPage",this.getAttribute("href"));loader.classList.remove("hidden");if(innerWidth<=900)sidebar.classList.remove("open");}));
function setActive(el){links.forEach(a=>a.classList.remove("active"));el.classList.add("active");titleEl.textContent=el.dataset.title;subEl.textContent=el.dataset.sub;filePill.textContent=el.getAttribute("href");el.setAttribute("aria-current","page");}
iframe.addEventListener("load",()=>{loader.classList.add("hidden");});
document.getElementById("reloadBtn").onclick=()=>{loader.classList.remove("hidden");iframe.contentWindow.location.reload();};
document.getElementById("newTabBtn").onclick=()=>window.open(iframe.src,"_blank");
document.getElementById("fsBtn").onclick=()=>{const w=document.getElementById("window");if(!document.fullscreenElement)w.requestFullscreen().catch(()=>{});else document.exitFullscreen();};
hamburger.onclick=()=>sidebar.classList.toggle("open");
document.addEventListener("click",e=>{if(innerWidth<=900&&sidebar.classList.contains("open")&&!sidebar.contains(e.target)&&!hamburger.contains(e.target))sidebar.classList.remove("open");});
document.addEventListener("keydown",e=>{if(e.key>="1"&&e.key<="4"&&!e.metaKey&&!e.ctrlKey){const i=parseInt(e.key)-1;if(links[i])links[i].click();}if(e.key==="Escape")sidebar.classList.remove("open");});
</script>
</body>
</html>
