<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Movie Obvyris</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;700&display=swap" rel="stylesheet">

<style>

:root{
--bg:#09111d;
--panel:#111827;
--line:#253347;
--blue:#2793ff;
--text:white;
}

*{
box-sizing:border-box;
}

body{

margin:0;
background:var(--bg);
color:var(--text);
font-family:Inter;
height:100vh;

display:flex;

}


.sidebar{

width:300px;
padding:20px;
background:var(--panel);
border-right:1px solid var(--line);

}


.logo{

font-family:Orbitron;
font-size:35px;

}

.logo span{

color:var(--blue);

}


.card{

background:var(--panel);
border:1px solid var(--line);
border-radius:16px;
padding:15px;
margin-bottom:12px;

}


input{

width:100%;
padding:12px;
margin-top:8px;

background:#09111d;
color:white;

border:1px solid var(--line);
border-radius:10px;

}


button{

width:100%;
margin-top:10px;

padding:12px;

border:0;
border-radius:12px;

background:linear-gradient(#2793ff,#1869d9);

color:white;
font-weight:bold;

cursor:pointer;

}


.main{

flex:1;
padding:20px;
overflow:auto;

}


.player{

background:black;
border-radius:15px;
overflow:hidden;

}


iframe{

width:100%;
height:450px;
border:0;

}


.movie{

background:var(--panel);
border:1px solid var(--line);

border-radius:15px;

padding:15px;
margin-top:10px;

cursor:pointer;

}


.movie:hover{

border-color:var(--blue);

}


@media(max-width:700px){

body{

display:block;

}

.sidebar{

width:100%;

}

iframe{

height:250px;

}

}


</style>

</head>


<body>


<div class="sidebar">

<div class="logo">
Movie <span>Obvyris</span>
</div>


<div class="card">

<h3>
🎬 Add Movie
</h3>


<input id="movieName"
placeholder="Movie Name">


<input id="movieURL"
placeholder="Paste YouTube URL">


<button onclick="addMovie()">
Add To Queue
</button>


</div>


<div class="card">

<h3>
🍿 Theater
</h3>

<div id="queue">

Loading...

</div>


</div>


</div>



<div class="main">


<h1>
🎥 Now Playing
</h1>


<div class="player">

<iframe

id="player"

allow="autoplay; fullscreen"

allowfullscreen>

</iframe>


</div>


<h2 id="now">

Waiting for movie...

</h2>


</div>



<script>


const API = 
"https://script.google.com/macros/s/AKfycbxahk4JfuYYg6-yDF0POZpr-4truaVUB9_OmxAZGEJcja765omyB31WC0X7G2Xe0ETLxQ/exec";



let movies=[];



async function loadMovies(){


try{


let res =
await fetch(API,{

method:"POST",

body:JSON.stringify({

action:"getMovies"

})

});


movies =
await res.json();



renderQueue();


if(movies.length){

playMovie(movies[0]);

}



}catch(e){

console.log(e);

}


}




function renderQueue(){


document.getElementById("queue").innerHTML =

movies.map((m,i)=>`

<div class="movie"
onclick="playMovie(movies[${i}])">

🎬 ${m.name || "Unknown"}

<br>

<small>
${m.status || "Queued"}
</small>

</div>

`).join("");

}




function getID(url){


if(url.includes("youtu.be")){

return url.split("youtu.be/")[1].split("?")[0];

}


if(url.includes("v=")){

return url.split("v=")[1].split("&")[0];

}


return url;


}




async function addMovie(){


let name =
document.getElementById("movieName").value;


let url =
document.getElementById("movieURL").value;


if(!url)return;



await fetch(API,{

method:"POST",

body:JSON.stringify({

action:"addMovie",

name:name,

url:url,

videoId:getID(url),

user:"Guest"

})

});



document.getElementById("movieName").value="";

document.getElementById("movieURL").value="";


loadMovies();


}




function playMovie(movie){


let id =
movie.videoId ||
getID(movie.url);



document.getElementById("player").src =

"https://www.youtube.com/embed/"+id+
"?autoplay=1";



document.getElementById("now").innerHTML=

"🎬 "+movie.name;


}




loadMovies();

setInterval(loadMovies,10000);


</script>


</body>
</html>
