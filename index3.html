<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sheets IRC Network</title>

<style>
  body {
    margin: 0;
    background: #000;
    color: #00ff99;
    font-family: monospace;
    height: 100vh;
    display: flex;
    overflow: hidden;
  }

  /* LOGIN */
  #login {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  #login input {
    padding: 10px;
    width: 200px;
    background: black;
    border: 1px solid #00ff99;
    color: #00ff99;
    text-align: center;
    outline: none;
  }

  #login button {
    margin-top: 10px;
    padding: 8px 14px;
    background: black;
    border: 1px solid #00ff99;
    color: #00ff99;
    cursor: pointer;
  }

  /* APP */
  #app {
    display: none;
    width: 100%;
    height: 100%;
  }

  /* SIDEBAR */
  #sidebar {
    width: 200px;
    border-right: 1px solid #00ff99;
    padding: 10px;
    overflow-y: auto;
  }

  h3 {
    margin: 10px 0;
    font-size: 13px;
    color: #00ff99;
  }

  .user {
    color: #00ff99;
    padding: 2px 0;
  }

  .channel {
    color: #ffcc00;
    cursor: pointer;
    padding: 2px 0;
  }

  .channel:hover {
    color: #fff;
  }

  /* CHAT */
  #chat {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  #header {
    padding: 8px 10px;
    border-bottom: 1px solid #00ff99;
    background: #000;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
  }

  /* INPUT */
  #inputBar {
    display: flex;
    border-top: 1px solid #00ff99;
  }

  #msg {
    flex: 1;
    padding: 10px;
    background: black;
    border: none;
    color: #00ff99;
    outline: none;
  }

  button.send {
    background: black;
    border-left: 1px solid #00ff99;
    color: #00ff99;
    padding: 10px 15px;
    cursor: pointer;
  }

  /* MESSAGE TYPES */
  .system { color: #888; }
  .me { color: #ffcc00; }
  .msg-line { color: #ddd; }
  .nick { color: #00ff99; }

  #hint {
    font-size: 12px;
    color: #555;
    padding: 4px 10px;
  }
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div>Enter Nickname</div>
  <input id="nick" placeholder="nick"/>
  <button onclick="enter()">Enter IRC</button>
</div>

<!-- APP -->
<div id="app">

  <!-- SIDEBAR -->
  <div id="sidebar">

    <h3>Online</h3>
    <div id="userList"></div>

    <h3>Channels</h3>
    <div id="channelList"></div>

  </div>

  <!-- CHAT -->
  <div id="chat">

    <div id="header">#general</div>

    <div id="messages"></div>

    <div id="hint">/nick /join /create /me /part /channels /help</div>

    <div id="inputBar">
      <input id="msg" placeholder="type message..." onkeydown="if(event.key==='Enter') send()"/>
      <button class="send" onclick="send()">Send</button>
    </div>

  </div>

</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbyGqdSRP9n1O8Mr53B65hkl2P103xSAdVmKsqKf7MbZvg1KzB_3Z2VoFTTPPoI-vWSY/exec";

let nick = "";
let channel = "#general";

// =========================
// ENTER IRC
// =========================
async function enter() {
  nick = document.getElementById("nick").value.trim();
  if (!nick) return;

  document.getElementById("login").style.display = "none";
  document.getElementById("app").style.display = "flex";

  await join(channel);

  load();
  who();
  loadChannels();

  setInterval(load, 2000);
  setInterval(who, 4000);
  setInterval(loadChannels, 5000);
}

// =========================
// JOIN CHANNEL
// =========================
async function join(ch) {
  channel = ch;
  document.getElementById("header").textContent = ch;

  await fetch(API, {
    method: "POST",
    body: JSON.stringify({
      action: "join",
      nick,
      channel
    })
  });
}

// =========================
// SEND + COMMANDS
// =========================
async function send() {
  const input = document.getElementById("msg");
  const text = input.value.trim();
  if (!text) return;

  // HELP
  if (text === "/help") {
    addSystem("Commands: /nick /join /create /me /part /channels");
    input.value = "";
    return;
  }

  // CHANNEL LIST REFRESH
  if (text === "/channels") {
    loadChannels();
    input.value = "";
    return;
  }

  // CREATE CHANNEL
  if (text.startsWith("/create ")) {
    const ch = text.split(" ")[1];

    await fetch(API, {
      method: "POST",
      body: JSON.stringify({
        action: "create",
        channel: ch
      })
    });

    await join(ch);
    input.value = "";
    return;
  }

  // JOIN
  if (text.startsWith("/join ")) {
    await join(text.split(" ")[1]);
    input.value = "";
    return;
  }

  // NICK
  if (text.startsWith("/nick ")) {
    nick = text.split(" ")[1];
    addSystem("Nick changed to " + nick);
    input.value = "";
    return;
  }

  // PART
  if (text === "/part") {
    await fetch(API, {
      method: "POST",
      body: JSON.stringify({
        action: "part",
        nick,
        channel
      })
    });

    input.value = "";
    return;
  }

  // ME
  if (text.startsWith("/me ")) {
    await fetch(API, {
      method: "POST",
      body: JSON.stringify({
        action: "me",
        nick,
        channel,
        message: text.substring(4)
      })
    });

    input.value = "";
    load();
    return;
  }

  // NORMAL MESSAGE
  await fetch(API, {
    method: "POST",
    body: JSON.stringify({
      action: "send",
      nick,
      channel,
      message: text
    })
  });

  input.value = "";
  load();
}

// =========================
// LOAD MESSAGES
// =========================
async function load() {
  const res = await fetch(API, {
    method: "POST",
    body: JSON.stringify({
      action: "get",
      channel
    })
  });

  const data = await res.json();

  const box = document.getElementById("messages");
  const nearBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 40;

  box.innerHTML = "";

  data.messages.forEach(m => {
    const div = document.createElement("div");

    if (m.type === "system") {
      div.className = "system";
      div.textContent = "*** " + m.msg;
    }
    else if (m.type === "me") {
      div.className = "me";
      div.textContent = `* ${m.nick} ${m.msg}`;
    }
    else {
      div.className = "msg-line";
      div.innerHTML = `<span class="nick">&lt;${m.nick}&gt;</span> ${m.msg}`;
    }

    box.appendChild(div);
  });

  if (nearBottom) box.scrollTop = box.scrollHeight;
}

// =========================
// USERS
// =========================
async function who() {
  const res = await fetch(API, {
    method: "POST",
    body: JSON.stringify({
      action: "who",
      channel
    })
  });

  const data = await res.json();

  const box = document.getElementById("userList");
  box.innerHTML = "";

  data.users.forEach(u => {
    const div = document.createElement("div");
    div.className = "user";
    div.textContent = u;
    box.appendChild(div);
  });
}

// =========================
// CHANNELS
// =========================
async function loadChannels() {
  const res = await fetch(API, {
    method: "POST",
    body: JSON.stringify({
      action: "channels"
    })
  });

  const data = await res.json();

  const box = document.getElementById("channelList");
  box.innerHTML = "";

  data.channels.forEach(ch => {
    const div = document.createElement("div");
    div.className = "channel";
    div.textContent = ch;

    div.onclick = () => join(ch);

    box.appendChild(div);
  });
}

// =========================
// SYSTEM MESSAGE
// =========================
function addSystem(msg) {
  const box = document.getElementById("messages");
  const div = document.createElement("div");
  div.className = "system";
  div.textContent = "*** " + msg;
  box.appendChild(div);
}

</script>

</body>
</html>
