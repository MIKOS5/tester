<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IRC Style Chat Room (Google Sheets Powered)</title>
  <style>
    body {
      margin: 0;
      background: #000;
      color: #00ff99;
      font-family: "Courier New", monospace;
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 200px;
      border-right: 1px solid #00ff99;
      padding: 10px;
    }

    .sidebar h2 {
      font-size: 14px;
      margin-bottom: 10px;
    }

    .channel {
      padding: 5px;
      cursor: pointer;
    }

    .channel:hover {
      background: #003322;
    }

    .chat {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 10px;
      border-bottom: 1px solid #00ff99;
    }

    .messages {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
    }

    .msg {
      margin-bottom: 5px;
    }

    .input-bar {
      display: flex;
      border-top: 1px solid #00ff99;
      padding: 10px;
    }

    input {
      flex: 1;
      background: black;
      color: #00ff99;
      border: 1px solid #00ff99;
      padding: 8px;
      font-family: monospace;
      outline: none;
    }

    button {
      margin-left: 10px;
      background: black;
      color: #00ff99;
      border: 1px solid #00ff99;
      padding: 8px 12px;
      cursor: pointer;
    }

    button:hover {
      background: #003322;
    }

    .login {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: black;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
  </style>
</head>
<body>

<div class="login" id="loginBox">
  <h2>Enter Nickname</h2>
  <input id="nickInput" placeholder="nick" />
  <button onclick="enterChat()">Enter</button>
</div>

<div class="sidebar">
  <h2>Channels</h2>
  <div class="channel" onclick="switchChannel('#general')">#general</div>
  <div class="channel" onclick="switchChannel('#dev')">#dev</div>
  <div class="channel" onclick="switchChannel('#random')">#random</div>
</div>

<div class="chat">
  <div class="header" id="channelName">#general</div>
  <div class="messages" id="messages"></div>

  <div class="input-bar">
    <input id="msgInput" placeholder="type message..." />
    <button onclick="sendMsg()">send</button>
  </div>
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbzvOsbFEgRoPVwFgwkCkaMVag6mQWs3UCLiuixTgZXDraQzyPUgKn87E6kM8q0hX-wN/exec";

let nick = "";
let channel = "#general";

function switchChannel(ch) {
  channel = ch;
  document.getElementById("channelName").textContent = ch;
  loadMsgs();
}

async function enterChat() {
  const n = document.getElementById("nickInput").value.trim();
  if (!n) return;

  const res = await fetch(API, {
    method: "POST",
    body: JSON.stringify({ action: "checkNick", nick: n })
  });

  const data = await res.json();

  if (data.exists) {
    alert("Nickname already taken (IRC rule)");
    return;
  }

  nick = n;
  document.getElementById("loginBox").style.display = "none";

  loadMsgs();
  setInterval(loadMsgs, 3000);
}

async function sendMsg() {
  const input = document.getElementById("msgInput");
  const text = input.value.trim();
  if (!text || !nick) return;

  await fetch(API, {
    method: "POST",
    body: JSON.stringify({
      action: "sendMessage",
      nick,
      channel,
      message: text
    })
  });

  input.value = "";
  loadMsgs();
}

async function loadMsgs() {
  const box = document.getElementById("messages");

  const res = await fetch(API, {
    method: "POST",
    body: JSON.stringify({ action: "getMessages", channel })
  });

  const data = await res.json();

  box.innerHTML = "";

  data.messages.forEach(m => {
    const div = document.createElement("div");
    div.className = "msg";
    div.textContent = m;
    box.appendChild(div);
  });

  box.scrollTop = box.scrollHeight;
}
</script>

</body>
</html>
