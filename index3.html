<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>vSheets IRC Network</title>

<style>
body {
  margin:0;
  background:#000;
  color:#00ff99;
  font-family:monospace;
  height:100vh;
  display:flex;
  overflow:hidden;
}

/* LOGIN */
#login {
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:black;
}

#login input, #login button {
  padding:12px;
  margin-top:10px;
  width:220px;
  background:black;
  border:1px solid #00ff99;
  color:#00ff99;
}

/* APP */
#app { display:none; width:100%; height:100%; flex-direction:column; }

/* TABS */
#tabs {
  display:flex;
  border-bottom:1px solid #00ff99;
  overflow-x:auto;
}

.tab {
  padding:8px 12px;
  cursor:pointer;
  border-right:1px solid #00ff99;
}

.tab.active { background:#002200; }
.tab.dm { color:#ffcc00; }

/* CHAT */
#messages {
  flex:1;
  overflow-y:auto;
  padding:10px;
}

#inputBar {
  display:flex;
  border-top:1px solid #00ff99;
}

#msg {
  flex:1;
  padding:12px;
  background:black;
  border:none;
  color:#00ff99;
}

/* MESSAGE */
.system { color:#888; }
.me { color:#ffcc00; }
.msg-line { color:#ddd; }
.nick { color:#00ff99; }
.mention { background:#002200; }

</style>
</head>

<body>

<div id="login">
  <div>Enter Nickname</div>
  <input id="nick"/>
  <button onclick="enter()">Enter IRC</button>
</div>

<div id="app">

  <div id="tabs"></div>
  <div id="messages"></div>

  <div id="inputBar">
    <input id="msg" placeholder="type /help..." onkeydown="if(event.key==='Enter') send()"/>
    <button onclick="send()">Send</button>
  </div>

</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbyGqdSRP9n1O8Mr53B65hkl2P103xSAdVmKsqKf7MbZvg1KzB_3Z2VoFTTPPoI-vWSY/exec";

let nick = "";
let current = "#general";
let tabs = {};

// ENTER
async function enter() {
  nick = document.getElementById("nick").value.trim();
  if (!nick) return;

  const res = await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"join",nick,channel:"#general"})
  });

  const data = await res.json();

  if (data.error) {
    alert(data.error);
    return;
  }

  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="flex";

  addTab("#general");
  switchTab("#general");

  setInterval(load,2000);
}

// ADD TAB
function addTab(name, isDM=false){
  if(tabs[name]) return;

  tabs[name] = [];

  const tab=document.createElement("div");
  tab.className="tab"+(isDM?" dm":"");
  tab.textContent=name;
  tab.onclick=()=>switchTab(name);
  tab.id="tab_"+name;

  document.getElementById("tabs").appendChild(tab);
}

// SWITCH TAB
function switchTab(name){
  current = name;

  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  document.getElementById("tab_"+name).classList.add("active");

  load();
}

// SEND
async function send() {
  const input = document.getElementById("msg");
  const text = input.value.trim();
  if (!text) return;

  // HELP
  if (text === "/help") {
    addSystem("Commands: /join /msg /part /nick /me");
    input.value="";
    return;
  }

  // DM
  if (text.startsWith("/msg ")) {
    const parts = text.split(" ");
    const to = parts[1];
    const message = parts.slice(2).join(" ");

    const tabName = "@"+to;
    addTab(tabName, true);

    await fetch(API,{
      method:"POST",
      body:JSON.stringify({
        action:"dm",
        from:nick,
        to:to,
        message
      })
    });

    switchTab(tabName);
    input.value="";
    return;
  }

  // JOIN
  if (text.startsWith("/join ")) {
    const ch = text.split(" ")[1];
    addTab(ch);

    await fetch(API,{
      method:"POST",
      body:JSON.stringify({action:"join",nick,channel:ch})
    });

    switchTab(ch);
    input.value="";
    return;
  }

  // PART
  if (text === "/part") {
    await fetch(API,{
      method:"POST",
      body:JSON.stringify({action:"part",nick,channel:current})
    });

    delete tabs[current];
    document.getElementById("tab_"+current).remove();

    switchTab(Object.keys(tabs)[0]);
    input.value="";
    return;
  }

  // ME
  if (text.startsWith("/me ")) {
    await fetch(API,{
      method:"POST",
      body:JSON.stringify({
        action:"me",
        nick,
        channel:current,
        message:text.substring(4)
      })
    });

    input.value="";
    return;
  }

  // NORMAL
  await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"send",
      nick,
      channel:current,
      message:text
    })
  });

  input.value="";
}

// LOAD
async function load() {
  const res = await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"get",
      channel:current,
      nick
    })
  });

  const data = await res.json();

  tabs[current] = data.messages;

  render();
}

// RENDER
function render(){
  const box = document.getElementById("messages");
  box.innerHTML="";

  tabs[current].forEach(m=>{
    const div=document.createElement("div");

    if (m.type==="system") {
      div.className="system";
      div.textContent="*** "+m.msg;
    }
    else if (m.type==="me") {
      div.className="me";
      div.textContent="* "+m.nick+" "+m.msg;
    }
    else {
      let msg = m.msg;

      if (msg.includes(nick)) {
        div.className="mention";
      } else {
        div.className="msg-line";
      }

      div.innerHTML=`<span class="nick">&lt;${m.nick}&gt;</span> ${msg}`;
    }

    box.appendChild(div);
  });

  box.scrollTop = box.scrollHeight;
}

// SYSTEM
function addSystem(msg){
  const box=document.getElementById("messages");
  const div=document.createElement("div");
  div.className="system";
  div.textContent="*** "+msg;
  box.appendChild(div);
}

</script>

</body>
</html>
