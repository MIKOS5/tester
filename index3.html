<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Sheets IRC Network</title>

<style>
body {
  margin:0;
  background:#000;
  color:#00ff99;
  font-family:monospace;
  height:100vh;
  display:flex;
}

/* LOGIN */
#login {
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:black;
}

#login input, #login button {
  padding:12px;
  margin-top:10px;
  width:220px;
  background:black;
  border:1px solid #00ff99;
  color:#00ff99;
}

/* APP */
#app {
  display:none;
  width:100%;
  height:100%;
  flex-direction:column;
}

/* TABS */
#tabs {
  display:flex;
  border-bottom:1px solid #00ff99;
  overflow-x:auto;
}

.tab {
  padding:8px 12px;
  cursor:pointer;
  border-right:1px solid #00ff99;
  white-space:nowrap;
  position:relative;
}

.tab.active { background:#003300; }
.tab.dm { color:#ffcc00; }

.badge {
  position:absolute;
  top:2px;
  right:4px;
  background:red;
  color:white;
  font-size:10px;
  padding:2px 4px;
  border-radius:10px;
  display:none;
}

/* CHAT */
#messages {
  flex:1;
  overflow-y:auto;
  padding:10px;
  font-size:14px;
}

#inputBar {
  display:flex;
  border-top:1px solid #00ff99;
}

#msg {
  flex:1;
  padding:12px;
  background:black;
  border:none;
  color:#00ff99;
  font-size:16px;
}

/* MESSAGE TYPES */
.system { color:#888; }
.me { color:#ffcc00; }
.msg-line { color:#ddd; }
.nick { color:#00ff99; }
.mention { background:#002200; }

/* MOBILE */
@media (max-width:700px){
  #messages { font-size:13px; }
  #msg { font-size:15px; }
}
</style>
</head>

<body>

<div id="login">
  <div>Enter Nickname</div>
  <input id="nick"/>
  <button onclick="enter()">Enter IRC</button>
</div>

<div id="app">
  <div id="tabs"></div>
  <div id="messages"></div>

  <div id="inputBar">
    <input id="msg" placeholder="type /help..." onkeydown="if(event.key==='Enter') send()"/>
    <button onclick="send()">Send</button>
  </div>
</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbyGqdSRP9n1O8Mr53B65hkl2P103xSAdVmKsqKf7MbZvg1KzB_3Z2VoFTTPPoI-vWSY/exec";

let nick = "";
let current = "#general";

// tabs: { name: {msgs:[], unread:0, dm:false} }
let tabs = {};

// ======================
// ENTER
// ======================
async function enter() {
  nick = document.getElementById("nick").value.trim();
  if (!nick) return;

  await fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"join",nick,channel:"#general"})
  });

  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="flex";

  openTab("#general", false);
  switchTab("#general");

  setInterval(load,1500);
  setInterval(heartbeat,20000);
}

// ======================
// HEARTBEAT
// ======================
function heartbeat(){
  fetch(API,{
    method:"POST",
    body:JSON.stringify({action:"ping",nick})
  });
}

// ======================
// TAB SYSTEM
// ======================
function openTab(name, dm=false){
  if(tabs[name]) return;

  tabs[name] = { msgs:[], unread:0, dm };

  const tab=document.createElement("div");
  tab.className="tab"+(dm?" dm":"");
  tab.id="tab_"+name;
  tab.innerHTML=`${name}<span class="badge"></span>`;
  tab.onclick=()=>switchTab(name);

  document.getElementById("tabs").appendChild(tab);
}

function switchTab(name){
  current=name;
  document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
  document.getElementById("tab_"+name).classList.add("active");

  tabs[name].unread=0;
  updateBadge(name);

  render();
}

// ======================
// SEND
// ======================
async function send(){
  const input=document.getElementById("msg");
  const text=input.value.trim();
  if(!text) return;

  // HELP
  if(text==="/help"){
    addSystem("Commands: /join /msg /part /me");
    input.value="";
    return;
  }

  // DM
  if(text.startsWith("/msg ")){
    const parts=text.split(" ");
    const to=parts[1];
    const msg=parts.slice(2).join(" ");

    openTab("@"+to,true);

    await fetch(API,{
      method:"POST",
      body:JSON.stringify({action:"dm",from:nick,to,message:msg})
    });

    switchTab("@"+to);
    input.value="";
    return;
  }

  // JOIN
  if(text.startsWith("/join ")){
    const ch=text.split(" ")[1];

    openTab(ch);

    await fetch(API,{
      method:"POST",
      body:JSON.stringify({action:"join",nick,channel:ch})
    });

    switchTab(ch);
    input.value="";
    return;
  }

  // PART
  if(text==="/part"){
    await fetch(API,{
      method:"POST",
      body:JSON.stringify({action:"part",nick,channel:current})
    });

    document.getElementById("tab_"+current).remove();
    delete tabs[current];

    switchTab(Object.keys(tabs)[0]);
    input.value="";
    return;
  }

  // ME
  if(text.startsWith("/me ")){
    await fetch(API,{
      method:"POST",
      body:JSON.stringify({
        action:"me",
        nick,
        channel:current,
        message:text.substring(4)
      })
    });

    input.value="";
    return;
  }

  // NORMAL
  await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"send",
      nick,
      channel:current,
      message:text
    })
  });

  input.value="";
}

// ======================
// LOAD (SMART UPDATE)
// ======================
async function load(){
  const res = await fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"get",
      channel:current,
      nick
    })
  });

  const data = await res.json();

  const oldLen = tabs[current]?.msgs?.length || 0;
  tabs[current].msgs = data.messages;

  // unread logic if not active tab
  if(current !== getActiveTab()){
    if(data.messages.length > oldLen){
      tabs[current].unread += (data.messages.length - oldLen);
      updateBadge(current);
    }
  }

  render();
}

// ======================
// RENDER
// ======================
function render(){
  const box=document.getElementById("messages");
  box.innerHTML="";

  (tabs[current]?.msgs || []).forEach(m=>{
    const div=document.createElement("div");

    if(m.type==="system"){
      div.className="system";
      div.textContent="*** "+m.msg;
    }
    else if(m.type==="me"){
      div.className="me";
      div.textContent="* "+m.nick+" "+m.msg;
    }
    else {
      const mention = m.msg.includes(nick);
      div.className = mention ? "mention" : "msg-line";
      div.innerHTML=`<span class="nick">&lt;${m.nick}&gt;</span> ${m.msg}`;
    }

    box.appendChild(div);
  });

  box.scrollTop=box.scrollHeight;
}

// ======================
// BADGE UPDATE
// ======================
function updateBadge(name){
  const tab=document.getElementById("tab_"+name);
  if(!tab) return;

  const badge=tab.querySelector(".badge");
  const count=tabs[name]?.unread || 0;

  if(count>0){
    badge.style.display="inline-block";
    badge.textContent=count;
  } else {
    badge.style.display="none";
  }
}

// ======================
// UTIL
// ======================
function getActiveTab(){
  return current;
}

function addSystem(msg){
  if(!tabs[current]) return;
  tabs[current].msgs.push({type:"system",msg});
  render();
}

</script>

</body>
</html>
