<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stick Brawler Weapons</title>

<style>
body {
    margin: 0;
    background: #111;
    color: white;
    text-align: center;
    font-family: Arial;
}
canvas {
    background: #222;
    display: block;
    margin: auto;
    border: 2px solid #00bcd4;
}
</style>
</head>
<body>

<h2>Stick Brawler</h2>
<p>A/D Move | W Jump | F Attack | E Pick Up</p>

<canvas id="game" width="900" height="400"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let keys = {};
document.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
document.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

const gravity = 0.6;
const ground = 300;
const worldWidth = 3000;

let cameraX = 0;

class Fighter {
    constructor(x, color) {
        this.x = x;
        this.y = ground;
        this.vy = 0;
        this.hp = 100;
        this.color = color;
        this.attackCooldown = 0;
        this.hitFlash = 0;
        this.weapon = null;
    }

    draw() {
        let dx = this.x - cameraX;
        ctx.strokeStyle = this.hitFlash ? "red" : this.color;

        // stick
        ctx.beginPath();
        ctx.arc(dx, this.y - 50, 10, 0, Math.PI*2);
        ctx.moveTo(dx, this.y - 40);
        ctx.lineTo(dx, this.y);
        ctx.stroke();

        // weapon
        if (this.weapon) {
            ctx.strokeStyle = "cyan";
            ctx.beginPath();
            ctx.moveTo(dx, this.y - 30);
            ctx.lineTo(dx + 20, this.y - 30);
            ctx.stroke();
        }

        // HP bar
        ctx.fillStyle = "red";
        ctx.fillRect(dx - 25, this.y - 70, 50, 5);
        ctx.fillStyle = "lime";
        ctx.fillRect(dx - 25, this.y - 70, 50 * (this.hp/100), 5);
    }

    update() {
        this.vy += gravity;
        this.y += this.vy;

        if (this.y > ground) {
            this.y = ground;
            this.vy = 0;
        }

        if (this.attackCooldown > 0) this.attackCooldown--;
        if (this.hitFlash > 0) this.hitFlash--;
    }

    attack(target, heavy=false) {
        if (this.attackCooldown > 0) return;

        let range = this.weapon ? 90 : (heavy ? 80 : 50);
        let damage = this.weapon ? 12 : (heavy ? 10 : 3);

        if (Math.abs(this.x - target.x) < range) {
            target.hp -= damage;
            target.hitFlash = 5;
        }

        this.attackCooldown = heavy ? 40 : 15;
    }
}

class Pickup {
    constructor(x, type) {
        this.x = x;
        this.y = ground;
        this.type = type;
    }

    draw() {
        let dx = this.x - cameraX;
        ctx.fillStyle = this.type === "health" ? "lime" : "cyan";
        ctx.fillRect(dx - 10, this.y - 10, 20, 20);
    }
}

const player = new Fighter(100, "white");
let enemies = [];
let pickups = [];

let attackHold = 0;
let nextWaveX = 600;

function spawnWave(x) {
    for (let i = 0; i < 3; i++) {
        enemies.push(new Fighter(x + i*60, ["orange","yellow","red"][i%3]));
    }
}

function update() {
    // movement
    if (keys["a"]) player.x -= 4;
    if (keys["d"]) player.x += 4;

    player.x = Math.max(0, Math.min(worldWidth, player.x));

    if (keys["w"] && player.y === ground) player.vy = -12;

    // attack
    if (keys["f"]) attackHold++;
    else if (attackHold > 0) {
        let heavy = attackHold > 20;
        enemies.forEach(e => e.hp > 0 && player.attack(e, heavy));
        attackHold = 0;
    }

    // pickup (E)
    if (keys["e"]) {
        pickups.forEach((p, i) => {
            if (Math.abs(player.x - p.x) < 40) {
                if (p.type === "health") {
                    player.hp = Math.min(100, player.hp + 25);
                } else {
                    player.weapon = p.type;
                }
                pickups.splice(i,1);
            }
        });
    }

    // camera
    cameraX = Math.max(0, Math.min(worldWidth - canvas.width, player.x - 450));

    // spawn waves
    if (player.x > nextWaveX) {
        spawnWave(nextWaveX + 200);
        nextWaveX += 500;
    }

    // enemy AI + drops
    enemies.forEach(e => {
        if (e.hp <= 0) {
            if (!e.dropped) {
                if (Math.random() < 0.5) {
                    pickups.push(new Pickup(e.x, Math.random() < 0.5 ? "health" : "bat"));
                }
                e.dropped = true;
            }
            return;
        }

        if (e.x > player.x) e.x -= 2;
        else e.x += 2;

        if (Math.abs(e.x - player.x) < 50 && e.attackCooldown === 0) {
            player.hp -= 2;
            player.hitFlash = 5;
            e.attackCooldown = 30;
        }

        e.update();
    });

    player.update();
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // ground
    ctx.fillStyle = "#444";
    ctx.fillRect(-cameraX, ground + 20, worldWidth, 5);

    player.draw();

    enemies.forEach(e => e.hp > 0 && e.draw());
    pickups.forEach(p => p.draw());

    ctx.fillStyle = "white";
    ctx.fillText("HP: " + Math.floor(player.hp), 20, 20);

    if (player.hp <= 0) endGame("You Lose");
    if (player.x >= worldWidth - 50) endGame("Level Cleared");
}

function endGame(text) {
    ctx.fillStyle = "white";
    ctx.font = "40px Arial";
    ctx.fillText(text, 300, 200);
    cancelAnimationFrame(loop);
}

let loop;
function gameLoop() {
    update();
    draw();
    loop = requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
