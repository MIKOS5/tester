<!DOCTYPE html>
<html>
<head>
  <title>Simple IRC Chat</title>
  <style>
    body {
      margin:0;
      background:black;
      color:#00ff99;
      font-family: monospace;
    }

    #login {
      position:fixed;
      inset:0;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
    }

    #chat {
      display:none;
      padding:10px;
    }

    #messages {
      height:85vh;
      overflow-y:auto;
    }

    input {
      width:100%;
      padding:10px;
      background:black;
      color:#00ff99;
      border:1px solid #00ff99;
    }
  </style>
</head>
<body>

<div id="login">
  <input id="nick" placeholder="nickname">
  <button onclick="enter()">Enter Chat</button>
</div>

<div id="chat">
  <div id="messages"></div>
  <input id="msg" placeholder="message..." onkeydown="if(event.key==='Enter')send()">
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbyGqdSRP9n1O8Mr53B65hkl2P103xSAdVmKsqKf7MbZvg1KzB_3Z2VoFTTPPoI-vWSY/exec";

let nick = "";

async function enter() {
  nick = document.getElementById("nick").value.trim();
  if (!nick) return;

  document.getElementById("login").style.display="none";
  document.getElementById("chat").style.display="block";

  load();
  setInterval(load, 2500);
}

async function send() {
  const msg = document.getElementById("msg");

  await fetch(API, {
    method:"POST",
    body: JSON.stringify({
      action:"send",
      nick,
      message: msg.value
    })
  });

  msg.value="";
  load();
}

async function load() {
  const res = await fetch(API, {
    method:"POST",
    body: JSON.stringify({
      action:"get"
    })
  });

  const data = await res.json();

  const box = document.getElementById("messages");
  box.innerHTML = "";

  data.messages.forEach(m=>{
    const d = document.createElement("div");
    d.textContent = m;
    box.appendChild(d);
  });

  box.scrollTop = box.scrollHeight;
}
</script>

</body>
</html>
