<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stick Brawler FIXED</title>

<style>
body {
    margin: 0;
    background: #111;
    color: white;
    font-family: Arial;
    text-align: center;
}
canvas {
    background: #222;
    display: block;
    margin: auto;
    border: 2px solid #00bcd4;
}
</style>
</head>
<body>

<h2>Stick Brawler (Fixed Weapons)</h2>
<p>A/D move | W jump | F attack | E pickup</p>

<canvas id="game" width="900" height="400"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let keys = {};
document.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
document.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

const gravity = 0.6;
const ground = 300;
const worldWidth = 3000;

let cameraX = 0;

class Player {
    constructor() {
        this.x = 100;
        this.y = ground;
        this.vy = 0;
        this.hp = 100;
        this.maxHP = 100;

        this.weapon = null;

        this.attackCooldown = 0;
        this.hitFlash = 0;
    }

    draw() {
        let dx = this.x - cameraX;

        ctx.strokeStyle = this.hitFlash ? "red" : "white";

        ctx.beginPath();
        ctx.arc(dx, this.y - 50, 10, 0, Math.PI * 2);
        ctx.moveTo(dx, this.y - 40);
        ctx.lineTo(dx, this.y);
        ctx.stroke();

        // weapon visual
        if (this.weapon) {
            ctx.strokeStyle = "cyan";
            ctx.beginPath();
            ctx.moveTo(dx + 10, this.y - 30);
            ctx.lineTo(dx + 40, this.y - 30);
            ctx.stroke();
        }

        // HP bar
        ctx.fillStyle = "red";
        ctx.fillRect(dx - 25, this.y - 70, 50, 5);
        ctx.fillStyle = "lime";
        ctx.fillRect(dx - 25, this.y - 70, 50 * (this.hp / this.maxHP), 5);
    }

    update() {
        this.vy += gravity;
        this.y += this.vy;

        if (this.y > ground) {
            this.y = ground;
            this.vy = 0;
        }

        if (this.attackCooldown > 0) this.attackCooldown--;
        if (this.hitFlash > 0) this.hitFlash--;
    }

    attack(enemy, heavy=false) {
        if (this.attackCooldown > 0) return;

        let range = this.weapon ? 90 : 50;
        let dmg = this.weapon ? 10 : 3;

        if (heavy) {
            range += 30;
            dmg += 5;
        }

        if (Math.abs(this.x - enemy.x) < range) {
            enemy.hp -= dmg;
            enemy.hitFlash = 5;
        }

        this.attackCooldown = heavy ? 35 : 15;
    }
}

class Enemy {
    constructor(x) {
        this.x = x;
        this.y = ground;
        this.vy = 0;
        this.hp = 60;
        this.hitFlash = 0;
        this.attackCooldown = 0;
    }

    draw() {
        let dx = this.x - cameraX;

        ctx.strokeStyle = this.hitFlash ? "red" : "orange";
        ctx.beginPath();
        ctx.arc(dx, this.y - 50, 10, 0, Math.PI * 2);
        ctx.moveTo(dx, this.y - 40);
        ctx.lineTo(dx, this.y);
        ctx.stroke();
    }

    update() {
        this.vy += gravity;
        this.y += this.vy;

        if (this.y > ground) {
            this.y = ground;
            this.vy = 0;
        }

        if (this.attackCooldown > 0) this.attackCooldown--;
        if (this.hitFlash > 0) this.hitFlash--;
    }
}

class Pickup {
    constructor(x, type) {
        this.x = x;
        this.y = ground;
        this.type = type; // "weapon" or "health"
    }

    draw() {
        let dx = this.x - cameraX;
        ctx.fillStyle = this.type === "weapon" ? "cyan" : "lime";
        ctx.fillRect(dx - 10, this.y - 10, 20, 20);
    }
}

// GAME STATE
const player = new Player();
let enemies = [];
let pickups = [];

let attackHold = false;
let holdFrames = 0;

// spawn enemies + weapons
function spawnWave(x) {
    enemies.push(new Enemy(x));
    enemies.push(new Enemy(x + 80));

    pickups.push(new Pickup(x + 40, "weapon"));
    pickups.push(new Pickup(x + 120, "health"));
}

spawnWave(500);

// INPUT FIX (IMPORTANT)
document.addEventListener("keydown", e => {
    if (e.key.toLowerCase() === "f") {
        attackHold = true;
    }
});

document.addEventListener("keyup", e => {
    if (e.key.toLowerCase() === "f") {
        let heavy = holdFrames > 20;

        enemies.forEach(e => {
            if (e.hp > 0) player.attack(e, heavy);
        });

        holdFrames = 0;
        attackHold = false;
    }
});

function update() {
    // movement
    if (keys["a"]) player.x -= 4;
    if (keys["d"]) player.x += 4;

    if (keys["w"] && player.y === ground) {
        player.vy = -12;
    }

    // pickup (E)
    if (keys["e"]) {
        pickups.forEach((p, i) => {
            if (Math.abs(player.x - p.x) < 40) {
                if (p.type === "weapon") {
                    player.weapon = true;
                }
                if (p.type === "health") {
                    player.hp = Math.min(player.maxHP, player.hp + 25);
                }
                pickups.splice(i, 1);
            }
        });
    }

    // hold attack tracking
    if (attackHold) holdFrames++;

    // enemies AI
    enemies.forEach(e => {
        if (e.hp <= 0) return;

        if (e.x > player.x) e.x -= 2;
        else e.x += 2;

        if (Math.abs(e.x - player.x) < 50 && e.attackCooldown === 0) {
            player.hp -= 2;
            player.hitFlash = 5;
            e.attackCooldown = 30;
        }

        e.update();
    });

    player.update();

    // camera follow
    cameraX = Math.max(0, player.x - 450);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // ground
    ctx.fillStyle = "#444";
    ctx.fillRect(-cameraX, ground + 20, worldWidth, 5);

    player.draw();
    enemies.forEach(e => e.hp > 0 && e.draw());
    pickups.forEach(p => p.draw());

    ctx.fillStyle = "white";
    ctx.fillText("HP: " + player.hp, 20, 20);
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
