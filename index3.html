<!DOCTYPE html>
<html>
<head>
  <title>IRC Chat</title>
  <style>
    body {
      margin:0;
      background:black;
      color:#00ff99;
      font-family: monospace;
      display:flex;
      height:100vh;
    }

    #login {
      position:absolute;
      inset:0;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      background:black;
    }

    #chat {
      display:none;
      width:100%;
    }

    #messages {
      height:90vh;
      overflow-y:auto;
      padding:10px;
    }

    input {
      width:100%;
      padding:10px;
      background:black;
      color:#00ff99;
      border:1px solid #00ff99;
    }
  </style>
</head>
<body>

<div id="login">
  <input id="nickInput" placeholder="Enter nick">
  <button onclick="enterIRC()">Enter IRC</button>
</div>

<div id="chat">
  <div id="messages"></div>
  <input id="msgInput" placeholder="message..." onkeydown="if(event.key==='Enter')send()">
</div>

<script>
const API = "https://script.google.com/macros/s/AKfycbz79MM52HPC6wFsQyAix8fPBx59wtUcrXzigwxJ97g0gz-cDqK_Yv84Jp5I_C_M_6tT/exec";

let nick = "";
let channel = "#general";

async function enterIRC() {
  const n = document.getElementById("nickInput").value;

  const res = await fetch(API, {
    method:"POST",
    body: JSON.stringify({ action:"checkNick", nick:n })
  });

  const data = await res.json();
  if (data.exists) return alert("Nick taken");

  await fetch(API, {
    method:"POST",
    body: JSON.stringify({ action:"register", nick:n })
  });

  nick = n;
  document.getElementById("login").style.display="none";
  document.getElementById("chat").style.display="block";

  load();
  setInterval(load, 2500);
}

async function send() {
  const input = document.getElementById("msgInput");

  await fetch(API, {
    method:"POST",
    body: JSON.stringify({
      action:"send",
      nick,
      channel,
      message: input.value
    })
  });

  input.value="";
  load();
}

async function load() {
  const res = await fetch(API, {
    method:"POST",
    body: JSON.stringify({
      action:"get",
      channel
    })
  });

  const data = await res.json();

  const box = document.getElementById("messages");
  box.innerHTML="";

  data.messages.forEach(m=>{
    const d = document.createElement("div");
    d.textContent = m;
    box.appendChild(d);
  });

  box.scrollTop = box.scrollHeight;
}
</script>

</body>
</html>
