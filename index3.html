<!DOCTYPE html>
<html>
<head>
  <title>IRC Chat Upgrade</title>

  <style>
    body {
      margin:0;
      background:black;
      color:#00ff99;
      font-family: monospace;
    }

    #login {
      position:fixed;
      inset:0;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      background:black;
    }

    #chat {
      display:none;
      padding:10px;
    }

    #messages {
      height:85vh;
      overflow-y:auto;
      border:1px solid #00ff99;
      padding:10px;
    }

    input {
      width:100%;
      padding:10px;
      background:black;
      color:#00ff99;
      border:1px solid #00ff99;
      font-family: monospace;
      outline:none;
    }

    button {
      margin-top:10px;
      padding:8px 12px;
      background:black;
      color:#00ff99;
      border:1px solid #00ff99;
      cursor:pointer;
    }

    button:hover {
      background:#003322;
    }

    .system {
      color:#888;
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div>Enter Nickname</div>
  <input id="nick" placeholder="nick">
  <button onclick="enter()">Enter IRC</button>
</div>

<!-- CHAT -->
<div id="chat">
  <div id="messages"></div>
  <input id="msg" placeholder="message..." onkeydown="if(event.key==='Enter') send()">
</div>

<script>

const API = "https://script.google.com/macros/library/d/1va95b65clPM2ji669InvK7hWqpd6c4oK4hzvmZUHi0WSETG6fdYaYtuj/7";

let nick = "";

// =========================
// ENTER CHAT
// =========================
async function enter() {
  nick = document.getElementById("nick").value.trim();
  if (!nick) return;

  document.getElementById("login").style.display = "none";
  document.getElementById("chat").style.display = "block";

  // system join message
  await fetch(API, {
    method: "POST",
    body: JSON.stringify({
      action: "system",
      message: `${nick} has joined the channel`
    })
  });

  load();
  setInterval(load, 2000);
}

// =========================
// SEND MESSAGE
// =========================
async function send() {
  const msg = document.getElementById("msg");

  if (!msg.value.trim()) return;

  await fetch(API, {
    method: "POST",
    body: JSON.stringify({
      action: "send",
      nick,
      message: msg.value
    })
  });

  msg.value = "";
  load();
}

// =========================
// LOAD MESSAGES
// =========================
async function load() {
  const res = await fetch(API, {
    method: "POST",
    body: JSON.stringify({
      action: "get"
    })
  });

  const data = await res.json();

  const box = document.getElementById("messages");
  box.innerHTML = "";

  data.messages.forEach(m => {
    const div = document.createElement("div");

    if (m.startsWith("***")) {
      div.className = "system";
    }

    div.textContent = m;
    box.appendChild(div);
  });

  box.scrollTop = box.scrollHeight;
}

</script>

</body>
</html>
