<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Style Chat Room</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      display: flex;
      height: 100vh;
    }

    .sidebar {
      width: 220px;
      background: #161b22;
      padding: 10px;
      border-right: 1px solid #30363d;
    }

    .sidebar h2 {
      font-size: 16px;
      margin-bottom: 10px;
    }

    .room {
      padding: 8px;
      margin: 5px 0;
      background: #21262d;
      border-radius: 5px;
      cursor: pointer;
    }

    .chat {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 10px;
      background: #161b22;
      border-bottom: 1px solid #30363d;
    }

    .messages {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
    }

    .msg {
      margin-bottom: 10px;
      padding: 8px;
      background: #21262d;
      border-radius: 6px;
    }

    .input-area {
      display: flex;
      padding: 10px;
      border-top: 1px solid #30363d;
      background: #161b22;
    }

    input {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 5px;
      background: #0d1117;
      color: #c9d1d9;
      outline: none;
    }

    button {
      margin-left: 10px;
      padding: 10px 15px;
      border: none;
      background: #238636;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #2ea043;
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <h2>Rooms</h2>
    <div class="room" onclick="switchRoom('General')"># General</div>
    <div class="room" onclick="switchRoom('Dev')"># Dev</div>
    <div class="room" onclick="switchRoom('Random')"># Random</div>
  </div>

  <div class="chat">
    <div class="header" id="roomTitle"># General</div>
    <div class="messages" id="messages"></div>

    <div class="input-area">
      <input id="input" placeholder="Type a message..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    let currentRoom = "General";

    const storageKey = () => "chat_" + currentRoom;

    function loadMessages() {
      const box = document.getElementById("messages");
      box.innerHTML = "";
      const data = JSON.parse(localStorage.getItem(storageKey()) || "[]");
      data.forEach(m => {
        const div = document.createElement("div");
        div.className = "msg";
        div.textContent = m;
        box.appendChild(div);
      });
      box.scrollTop = box.scrollHeight;
    }

    function sendMessage() {
      const input = document.getElementById("input");
      const text = input.value.trim();
      if (!text) return;

      const data = JSON.parse(localStorage.getItem(storageKey()) || "[]");
      data.push("User: " + text);
      localStorage.setItem(storageKey(), JSON.stringify(data));

      input.value = "";
      loadMessages();
    }

    function switchRoom(room) {
      currentRoom = room;
      document.getElementById("roomTitle").textContent = "# " + room;
      loadMessages();
    }

    loadMessages();
  </script>

</body>
</html>
