<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sheets IRC Network</title>

<style>
  body {
    margin: 0;
    background: #000;
    color: #00ff99;
    font-family: monospace;
    height: 100vh;
    display: flex;
    overflow: hidden;
  }

  /* LOGIN */
  #login {
    position: fixed;
    inset: 0;
    background: black;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
  }

  #login input {
    padding: 10px;
    background: black;
    border: 1px solid #00ff99;
    color: #00ff99;
    width: 200px;
    text-align: center;
    outline: none;
  }

  #login button {
    margin-top: 10px;
    padding: 8px 14px;
    background: black;
    border: 1px solid #00ff99;
    color: #00ff99;
    cursor: pointer;
  }

  /* APP */
  #app {
    display: none;
    width: 100%;
    height: 100%;
  }

  /* USERS */
  #users {
    width: 170px;
    border-right: 1px solid #00ff99;
    padding: 10px;
    overflow-y: auto;
  }

  #users h3 {
    margin: 0 0 10px;
  }

  .user {
    padding: 2px 0;
    color: #00ff99;
  }

  /* CHAT */
  #chat {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  #header {
    padding: 8px 10px;
    border-bottom: 1px solid #00ff99;
    background: #000;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
  }

  /* INPUT */
  #inputBar {
    display: flex;
    border-top: 1px solid #00ff99;
  }

  #msg {
    flex: 1;
    padding: 10px;
    background: black;
    border: none;
    color: #00ff99;
    outline: none;
  }

  button.send {
    background: black;
    border-left: 1px solid #00ff99;
    color: #00ff99;
    padding: 10px 15px;
    cursor: pointer;
  }

  /* MESSAGE STYLES */
  .system { color: #888; }
  .me { color: #ffcc00; }
  .msg-line { color: #ddd; }
  .nick { color: #00ff99; }

  /* INPUT HINT */
  #hint {
    font-size: 12px;
    color: #555;
    padding: 4px 10px;
  }
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div>Enter Nickname</div>
  <input id="nick" placeholder="nick"/>
  <button onclick="enter()">Enter IRC</button>
</div>

<!-- APP -->
<div id="app">

  <!-- USERS -->
  <div id="users">
    <h3>Online</h3>
    <div id="userList"></div>
  </div>

  <!-- CHAT -->
  <div id="chat">
    <div id="header">#general</div>

    <div id="messages"></div>

    <div id="hint">Commands: /nick /join /me /help /channels</div>

    <div id="inputBar">
      <input id="msg" placeholder="type message..." onkeydown="if(event.key==='Enter') send()"/>
      <button class="send" onclick="send()">Send</button>
    </div>
  </div>

</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbyGqdSRP9n1O8Mr53B65hkl2P103xSAdVmKsqKf7MbZvg1KzB_3Z2VoFTTPPoI-vWSY/exec";

let nick = "";
let channel = "#general";
let autoScroll = true;

// --------------------
// ENTER
// --------------------
async function enter() {
  nick = document.getElementById("nick").value.trim();
  if (!nick) return;

  document.getElementById("login").style.display = "none";
  document.getElementById("app").style.display = "flex";

  await join(channel);

  load();
  who();

  setInterval(load, 2000);
  setInterval(who, 4000);
}

// --------------------
// JOIN CHANNEL
// --------------------
async function join(ch) {
  channel = ch;
  document.getElementById("header").textContent = ch;

  await fetch(API, {
    method: "POST",
    body: JSON.stringify({
      action: "join",
      nick,
      channel
    })
  });
}

// --------------------
// SEND + COMMANDS
// --------------------
async function send() {
  const input = document.getElementById("msg");
  const text = input.value.trim();
  if (!text) return;

  // HELP
  if (text === "/help") {
    addSystem("Commands: /nick /join /me /channels");
    input.value = "";
    return;
  }

  // CHANNEL LIST (simple UI output)
  if (text === "/channels") {
    addSystem("Use /join #channel-name");
    input.value = "";
    return;
  }

  // JOIN
  if (text.startsWith("/join ")) {
    await join(text.split(" ")[1]);
    input.value = "";
    return;
  }

  // NICK
  if (text.startsWith("/nick ")) {
    nick = text.split(" ")[1];
    addSystem("You are now " + nick);
    input.value = "";
    return;
  }

  // ME
  if (text.startsWith("/me ")) {
    await fetch(API, {
      method: "POST",
      body: JSON.stringify({
        action: "me",
        nick,
        channel,
        message: text.substring(4)
      })
    });

    input.value = "";
    load();
    return;
  }

  // NORMAL MESSAGE
  await fetch(API, {
    method: "POST",
    body: JSON.stringify({
      action: "send",
      nick,
      channel,
      message: text
    })
  });

  input.value = "";
  load();
}

// --------------------
// LOAD MESSAGES
// --------------------
async function load() {
  const res = await fetch(API, {
    method: "POST",
    body: JSON.stringify({
      action: "get",
      channel
    })
  });

  const data = await res.json();

  const box = document.getElementById("messages");

  const nearBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 50;

  box.innerHTML = "";

  data.messages.forEach(m => {
    const div = document.createElement("div");

    if (m.type === "system") {
      div.className = "system";
      div.textContent = "*** " + m.msg;
    }
    else if (m.type === "me") {
      div.className = "me";
      div.textContent = `* ${m.nick} ${m.msg}`;
    }
    else {
      div.className = "msg-line";
      div.innerHTML = `<span class="nick">&lt;${m.nick}&gt;</span> ${m.msg}`;
    }

    box.appendChild(div);
  });

  if (nearBottom) box.scrollTop = box.scrollHeight;
}

// --------------------
// USERS
// --------------------
async function who() {
  const res = await fetch(API, {
    method: "POST",
    body: JSON.stringify({
      action: "who",
      channel
    })
  });

  const data = await res.json();

  const list = document.getElementById("userList");
  list.innerHTML = "";

  data.users.forEach(u => {
    const div = document.createElement("div");
    div.className = "user";
    div.textContent = u;
    list.appendChild(div);
  });
}

// --------------------
// SYSTEM MESSAGE LOCAL
// --------------------
function addSystem(msg) {
  const box = document.getElementById("messages");
  const div = document.createElement("div");
  div.className = "system";
  div.textContent = "*** " + msg;
  box.appendChild(div);
}

</script>

</body>
</html>
