<!DOCTYPE html>
<html>
<head>
  <title>IRC Chat (Sheets Backend)</title>

  <style>
    body {
      margin: 0;
      background: black;
      color: #00ff99;
      font-family: monospace;
    }

    #login {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: black;
    }

    #chat {
      display: none;
      padding: 10px;
    }

    #messages {
      height: 85vh;
      overflow-y: auto;
      border: 1px solid #00ff99;
      padding: 10px;
      margin-bottom: 10px;
    }

    input {
      width: 100%;
      padding: 10px;
      background: black;
      color: #00ff99;
      border: 1px solid #00ff99;
      font-family: monospace;
      outline: none;
    }

    button {
      margin-top: 10px;
      padding: 8px 12px;
      background: black;
      color: #00ff99;
      border: 1px solid #00ff99;
      cursor: pointer;
    }

    button:hover {
      background: #003322;
    }

    .system {
      color: #888;
    }
  </style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div>Enter Nickname</div>
  <input id="nick" placeholder="nick">
  <button onclick="enter()">Enter IRC</button>
</div>

<!-- CHAT -->
<div id="chat">
  <div id="messages"></div>
  <input id="msg" placeholder="message..." onkeydown="if(event.key==='Enter') send()">
</div>

<script>

// 🔴 YOUR UPDATED GOOGLE APPS SCRIPT URL
const API = "https://script.google.com/macros/s/AKfycbyGqdSRP9n1O8Mr53B65hkl2P103xSAdVmKsqKf7MbZvg1KzB_3Z2VoFTTPPoI-vWSY/exec";

let nick = "";

// =========================
// ENTER IRC
// =========================
async function enter() {
  nick = document.getElementById("nick").value.trim();
  if (!nick) return;

  document.getElementById("login").style.display = "none";
  document.getElementById("chat").style.display = "block";

  await systemMsg(`${nick} joined the chat`);

  load();
  setInterval(load, 2000);
}

// =========================
// SYSTEM MESSAGE
// =========================
async function systemMsg(msg) {
  await fetch(API, {
    method: "POST",
    body: JSON.stringify({
      action: "system",
      message: msg
    })
  });
}

// =========================
// SEND MESSAGE
// =========================
async function send() {
  const input = document.getElementById("msg");
  const text = input.value.trim();
  if (!text) return;

  await fetch(API, {
    method: "POST",
    body: JSON.stringify({
      action: "send",
      nick,
      message: text
    })
  });

  input.value = "";
  load();
}

// =========================
// LOAD MESSAGES
// =========================
async function load() {
  const res = await fetch(API, {
    method: "POST",
    body: JSON.stringify({
      action: "get"
    })
  });

  const data = await res.json();

  const box = document.getElementById("messages");
  box.innerHTML = "";

  data.messages.forEach(m => {
    const div = document.createElement("div");

    if (m.startsWith("***")) {
      div.className = "system";
    }

    div.textContent = m;
    box.appendChild(div);
  });

  box.scrollTop = box.scrollHeight;
}

</script>

</body>
</html>
