<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Sheets IRC Network</title>

<style>
  body {
    margin: 0;
    background: #000;
    color: #00ff99;
    font-family: monospace;
    height: 100vh;
    display: flex;
    overflow: hidden;
  }

  /* LOGIN */
  #login {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
  }

  #login input, #login button {
    padding: 12px;
    width: 220px;
    margin-top: 10px;
    background: black;
    border: 1px solid #00ff99;
    color: #00ff99;
    font-size: 16px;
  }

  /* APP */
  #app {
    display: none;
    width: 100%;
    height: 100%;
  }

  /* SIDEBAR */
  #sidebar {
    width: 220px;
    border-right: 1px solid #00ff99;
    padding: 10px;
    overflow-y: auto;
  }

  .hidden {
    display: none;
  }

  h3 {
    margin: 10px 0;
    font-size: 13px;
  }

  .user, .channel {
    padding: 5px 0;
    font-size: 14px;
  }

  .channel {
    color: #ffcc00;
    cursor: pointer;
  }

  /* CHAT */
  #chat {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  #header {
    padding: 10px;
    border-bottom: 1px solid #00ff99;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  #menuBtn {
    display: none;
    cursor: pointer;
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
  }

  #inputBar {
    display: flex;
    border-top: 1px solid #00ff99;
  }

  #msg {
    flex: 1;
    padding: 12px;
    background: black;
    border: none;
    color: #00ff99;
    font-size: 16px;
  }

  button.send {
    padding: 12px;
    background: black;
    border-left: 1px solid #00ff99;
    color: #00ff99;
    font-size: 16px;
  }

  .system { color: #888; }
  .me { color: #ffcc00; }
  .msg-line { color: #ddd; }

  .nick { color: #00ff99; }

  #hint {
    font-size: 11px;
    color: #555;
    padding: 5px;
  }

  /* 📱 MOBILE MODE */
  @media (max-width: 700px) {

    #sidebar {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      background: black;
      z-index: 10;
      transform: translateX(-100%);
      transition: transform 0.3s;
    }

    #sidebar.open {
      transform: translateX(0);
    }

    #menuBtn {
      display: block;
      font-size: 18px;
    }

    #header {
      font-size: 14px;
    }

    #messages {
      font-size: 14px;
    }
  }

</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div>Enter Nickname</div>
  <input id="nick" placeholder="nick"/>
  <button onclick="enter()">Enter IRC</button>
</div>

<!-- APP -->
<div id="app">

  <div id="sidebar">
    <h3>Online</h3>
    <div id="userList"></div>

    <h3>Channels</h3>
    <div id="channelList"></div>
  </div>

  <div id="chat">
    <div id="header">
      <span id="menuBtn" onclick="toggleMenu()">☰</span>
      <span id="channelName">#general</span>
    </div>

    <div id="messages"></div>

    <div id="hint">/nick /join /create /op /kick /ban</div>

    <div id="inputBar">
      <input id="msg" placeholder="message..." onkeydown="if(event.key==='Enter') send()"/>
      <button class="send" onclick="send()">Send</button>
    </div>
  </div>

</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbyGqdSRP9n1O8Mr53B65hkl2P103xSAdVmKsqKf7MbZvg1KzB_3Z2VoFTTPPoI-vWSY/exec";

let nick = "";
let channel = "#general";

// ENTER
async function enter() {
  nick = document.getElementById("nick").value.trim();
  if (!nick) return;

  document.getElementById("login").style.display = "none";
  document.getElementById("app").style.display = "flex";

  await join(channel);

  load();
  who();
  loadChannels();

  setInterval(load, 2000);
  setInterval(who, 4000);
  setInterval(loadChannels, 5000);
}

// MENU
function toggleMenu() {
  document.getElementById("sidebar").classList.toggle("open");
}

// JOIN
async function join(ch) {
  channel = ch;
  document.getElementById("channelName").textContent = ch;

  await fetch(API, {
    method: "POST",
    body: JSON.stringify({
      action: "join",
      nick,
      channel
    })
  });

  document.getElementById("sidebar").classList.remove("open");
}

// SEND (same commands as before)
async function send() {
  const input = document.getElementById("msg");
  const text = input.value.trim();
  if (!text) return;

  await fetch(API, {
    method: "POST",
    body: JSON.stringify({
      action: "send",
      nick,
      channel,
      message: text
    })
  });

  input.value = "";
  load();
}

// LOAD
async function load() {
  const res = await fetch(API, {
    method: "POST",
    body: JSON.stringify({ action: "get", channel })
  });

  const data = await res.json();

  const box = document.getElementById("messages");
  box.innerHTML = "";

  data.messages.forEach(m => {
    const div = document.createElement("div");

    if (m.type === "system") {
      div.className = "system";
      div.textContent = "*** " + m.msg;
    }
    else if (m.type === "me") {
      div.className = "me";
      div.textContent = "* " + m.nick + " " + m.msg;
    }
    else {
      div.className = "msg-line";
      div.innerHTML = `<span class="nick">&lt;${m.nick}&gt;</span> ${m.msg}`;
    }

    box.appendChild(div);
  });

  box.scrollTop = box.scrollHeight;
}

// USERS
async function who() {
  const res = await fetch(API, {
    method: "POST",
    body: JSON.stringify({ action: "who", channel })
  });

  const data = await res.json();

  const box = document.getElementById("userList");
  box.innerHTML = "";

  data.users.forEach(u => {
    const div = document.createElement("div");
    div.className = "user";
    div.textContent = u;
    box.appendChild(div);
  });
}

// CHANNELS
async function loadChannels() {
  const res = await fetch(API, {
    method: "POST",
    body: JSON.stringify({ action: "channels" })
  });

  const data = await res.json();

  const box = document.getElementById("channelList");
  box.innerHTML = "";

  data.channels.forEach(ch => {
    const div = document.createElement("div");
    div.className = "channel";
    div.textContent = ch;
    div.onclick = () => join(ch);
    box.appendChild(div);
  });
}

</script>

</body>
</html>
