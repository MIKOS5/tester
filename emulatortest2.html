<html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"> <title>OBVYRIS Emulator</title> <style> /* ========================================================= BASE ========================================================= */ html, body{ margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; color:#fff; font-family:Arial,sans-serif; touch-action:none; } #game{ position:absolute; inset:0; width:100%; height:100%; background:#000; touch-action:none; } #game canvas{ image-rendering:auto; max-width:100%; max-height:100%; touch-action:none; } /* ========================================================= LOADING ========================================================= */ #loading{ position:absolute; inset:0; z-index:900; display:flex; align-items:center; justify-content:center; background:#000; color:#fff; font-size:18px; text-align:center; } #loading.hidden{ display:none; } #loadingText{ padding:20px; } /* ========================================================= STATUS ========================================================= */ #status{ position:absolute; top:0; left:0; right:0; z-index:1000; padding:8px 12px; background:rgba(0,0,0,.72); color:#fff; font-size:12px; pointer-events:none; transition:.3s; } #status.hidden{ opacity:0; } /* ========================================================= ERROR ========================================================= */ #error{ position:absolute; inset:0; z-index:2000; display:none; align-items:center; justify-content:center; background:#000; color:#fff; padding:30px; text-align:center; white-space:pre-wrap; } /* ========================================================= CUSTOM EMULATOR TOOLBAR BUTTONS ========================================================= */ #obvyrisToolbarButtons{ position:fixed; right:8px; bottom:8px; z-index:100001; display:flex; align-items:center; gap:5px; pointer-events:none; } .obvyris-toolbar-button{ width:38px; height:38px; border:1px solid rgba(255,255,255,.18); border-radius:9px; background:rgba(8,15,25,.86); color:#fff; display:flex; align-items:center; justify-content:center; font-size:17px; cursor:pointer; box-sizing:border-box; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); box-shadow: 0 3px 12px rgba(0,0,0,.45); transition: background .15s, transform .15s, opacity .15s; pointer-events:auto; touch-action:manipulation; -webkit-tap-highlight-color:transparent; } .obvyris-toolbar-button:hover{ background:rgba(39,147,255,.72); } .obvyris-toolbar-button:active{ transform:scale(.92); } .obvyris-toolbar-button.active{ background:rgba(39,147,255,.8); } #obvyrisChatUnread{ position:absolute; top:-5px; right:70px; min-width:15px; height:15px; padding:0 3px; border-radius:20px; background:#ff3b30; color:#fff; font-size:9px; font-weight:bold; display:none; align-items:center; justify-content:center; pointer-events:none; } /* ========================================================= GAME CHAT ========================================================= */ #gameChat{ position:fixed; right:12px; bottom:58px; width:min(340px,calc(100vw - 24px)); height:min(430px,calc(100vh - 100px)); z-index:100000; display:flex; flex-direction:column; overflow:hidden; border:1px solid rgba(255,255,255,.16); border-radius:18px; background:rgba(5,12,22,.72); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); box-shadow: 0 15px 45px rgba(0,0,0,.55); opacity:0; transform: translateY(12px) scale(.97); pointer-events:none; transition: opacity .18s ease, transform .18s ease; } #gameChat.open{ opacity:1; transform: translateY(0) scale(1); pointer-events:auto; } /* ========================================================= CHAT HEADER ========================================================= */ #gameChatHeader{ min-height:48px; display:flex; align-items:center; justify-content:space-between; padding: 0 10px 0 14px; background:rgba(5,12,22,.55); border-bottom: 1px solid rgba(255,255,255,.12); flex-shrink:0; } #gameChatTitle{ min-width:0; } #gameChatName{ font-size:14px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } #gameChatRoom{ margin-top:2px; color:rgba(255,255,255,.55); font-size:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } #gameChatClose{ width:34px; height:34px; border:0; border-radius:10px; background:rgba(255,255,255,.08); color:#fff; font-size:17px; cursor:pointer; touch-action:manipulation; } /* ========================================================= CHAT MESSAGES ========================================================= */ #gameChatMessages{ flex:1; min-height:0; overflow-y:auto; padding:10px; scrollbar-width:thin; scrollbar-color: rgba(255,255,255,.25) transparent; } #gameChatMessages::-webkit-scrollbar{ width:5px; } #gameChatMessages::-webkit-scrollbar-track{ background:transparent; } #gameChatMessages::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.2); border-radius:10px; } .game-chat-message{ margin-bottom:7px; padding: 7px 9px; border-radius:10px; background:rgba(0,0,0,.32); border: 1px solid rgba(255,255,255,.06); font-size:12px; line-height:1.35; word-break:break-word; } .game-chat-name{ color:#4da3ff; font-weight:800; margin-right:4px; } .game-chat-system{ color:rgba(255,255,255,.5); font-style:italic; text-align:center; } /* ========================================================= CHAT INPUT ========================================================= */ #gameChatInputBar{ display:flex; gap:5px; padding:8px; background:rgba(5,12,22,.55); border-top: 1px solid rgba(255,255,255,.1); flex-shrink:0; } #gameChatNameInput{ width:58px; flex-shrink:0; } #gameChatMessageInput{ flex:1; min-width:0; } #gameChatInputBar input{ height:38px; box-sizing:border-box; padding: 0 9px; border: 1px solid rgba(255,255,255,.16); border-radius:9px; outline:none; background:rgba(0,0,0,.38); color:#fff; font-size:14px; touch-action:manipulation; } #gameChatInputBar input::placeholder{ color:rgba(255,255,255,.45); } #gameChatSend{ width:42px; height:38px; flex-shrink:0; border:0; border-radius:9px; background:rgba(39,147,255,.72); color:#fff; font-size:15px; cursor:pointer; touch-action:manipulation; } #gameChatSend:active{ transform:scale(.95); } /* ========================================================= MOBILE ========================================================= */ @media(max-width:600px){ #obvyrisToolbarButtons{ right:7px; bottom:7px; gap:4px; } .obvyris-toolbar-button{ width:36px; height:36px; font-size:16px; } #gameChat{ right:8px; bottom:52px; width:calc(100vw - 16px); height:min( 390px, calc(100vh - 75px) ); border-radius:16px; } #gameChatInputBar input{ height:42px; } #gameChatSend{ height:42px; } } /* ========================================================= TOUCH ========================================================= */ button, input{ touch-action:manipulation; } /* ========================================================= EMULATORJS VIRTUAL GAMEPAD ========================================================= */ #ejs_virtualGamepad_left, #ejs_virtualGamepad_right{ touch-action:none !important; z-index:50000 !important; } /* Prevent touches in the virtual controller zones from leaking into EmulatorJS's toolbar/menu. This addresses the mobile behavior where touching an empty virtual-gamepad area can trigger the bottom menu. */ #ejs_virtualGamepad_left *, #ejs_virtualGamepad_right *{ touch-action:none !important; } /* ========================================================= KEEP CUSTOM OBVYRIS UI ABOVE GAMEPAD ========================================================= */ #gameChat, #obvyrisToolbarButtons{ touch-action:manipulation; } /* ========================================================= HIDE ANY OLD FLOATING CHAT BUTTON ========================================================= */ #gameChatButton{ display:none !important; } </style> </head> <body> <!-- ======================================================= EMULATOR ======================================================= --> <div id="game"></div> <!-- ======================================================= LOADING ======================================================= --> <div id="loading">

</div> <script> "use strict"; /* ========================================================= URL PARAMETERS ========================================================= */ const params = new URLSearchParams(location.search); const originalRom = params.get("rom"); const requestedCore = ( params.get("core") || "nes" ).toLowerCase(); const title = params.get("title") || "OBVYRIS GAME"; const gameID = params.get("gameid") || params.get("gameId") || ""; const chatStation = params.get("station") || ( gameID ? "game-" + gameID : "" ); /* ========================================================= LOG PARAMETERS ========================================================= */ console.log( "[OBVYRIS EMULATOR] Game ID:", gameID ); console.log( "[OBVYRIS EMULATOR] Chat Station:", chatStation ); console.log( "[OBVYRIS EMULATOR] Requested Core:", requestedCore ); console.log( "[OBVYRIS EMULATOR] Title:", title ); console.log( "[OBVYRIS EMULATOR] ROM:", originalRom ); /* ========================================================= CORE MAP ========================================================= */ const CORE_MAP = { nes: "nes", snes: "snes", gba: "mgba", gbc: "gambatte", genesis: "genesis_plus_gx", megadrive: "genesis_plus_gx", sega_genesis: "genesis_plus_gx", genesis_plus_gx: "genesis_plus_gx" }; const core = CORE_MAP[requestedCore] || requestedCore; console.log( "[OBVYRIS EMULATOR] EmulatorJS Core:", core ); /* ========================================================= DOM ========================================================= */ const loading = document.getElementById("loading"); const loadingText = document.getElementById("loadingText"); const errorBox = document.getElementById("error"); const status = document.getElementById("status"); /* ========================================================= LOG ========================================================= */ function log(message){ console.log( "[OBVYRIS EMULATOR]", message ); status.textContent = message; } /* ========================================================= LOADING ========================================================= */ function setLoading(message){ loadingText.textContent = message; console.log( "[OBVYRIS EMULATOR]", message ); } /* ========================================================= ERROR ========================================================= */ function fail(message){ console.error( "[OBVYRIS EMULATOR]", message ); loading.style.display = "none"; errorBox.style.display = "flex"; errorBox.textContent = "Emulator Error\n\n" + message; } /* ========================================================= ROM CHECK ========================================================= */ if(!originalRom){ fail( "No ROM was supplied.\n\n" + "Use:\n" + "?gameid=baseball-japan" + "&core=nes" + "&title=Baseball" + "&rom=ROM_URL" ); throw new Error( "Missing ROM" ); } /* ========================================================= CHAT CHECK ========================================================= */ if(!chatStation){ console.warn( "[OBVYRIS EMULATOR] " + "No chat station available." ); } /* ========================================================= ROM PROXY ========================================================= */ const PROXY_BASE = "https://obvyris-rom-proxy.vercel.app/api/rom"; const proxyURL = PROXY_BASE + "?url=" + encodeURIComponent( originalRom ); console.log( "[OBVYRIS EMULATOR] Proxy ROM:", proxyURL ); /* ========================================================= DOWNLOAD ROM ========================================================= */ async function downloadROM(){ try{ setLoading( "Downloading ROM..." ); log( "Fetching ROM..." ); const response = await fetch( proxyURL, { method:"GET", mode:"cors", cache:"no-store" } ); console.log( "[OBVYRIS EMULATOR] Proxy response:", response.status, response.statusText ); if(!response.ok){ let text = ""; try{ text = await response.text(); }catch(e){} throw new Error( "Proxy returned HTTP " + response.status + "\n" + text ); } setLoading( "Reading ROM..." ); const buffer = await response.arrayBuffer(); console.log( "[OBVYRIS EMULATOR] ROM downloaded:", buffer.byteLength, "bytes" ); if( !buffer || buffer.byteLength < 16 ){ throw new Error( "ROM data is empty or too small." ); } /* ================================================= NES HEADER ================================================= */ if(core === "nes"){ const bytes = new Uint8Array( buffer ); const validNES = bytes.length >= 4 && bytes[0] === 0x4E && bytes[1] === 0x45 && bytes[2] === 0x53 && bytes[3] === 0x1A; console.log( "[OBVYRIS EMULATOR] NES header:", validNES ? "VALID" : "INVALID" ); if(!validNES){ throw new Error( "The downloaded file is " + "not a valid NES ROM.\n\n" + "First bytes: " + Array.from( bytes.slice(0,8) ) .map( x => x .toString(16) .padStart(2,"0") ) .join(" ") ); } } /* ================================================= LOCAL BLOB ================================================= */ const blob = new Blob( [ buffer ], { type: "application/octet-stream" } ); const blobURL = URL.createObjectURL( blob ); console.log( "[OBVYRIS EMULATOR] Local ROM Blob:", blobURL ); return blobURL; }catch(error){ console.error( "[OBVYRIS EMULATOR] ROM download error:", error ); throw error; } } /* ========================================================= MOBILE DEVICE DETECTION ========================================================= */ function isTouchDevice(){ return ( "ontouchstart" in window || navigator.maxTouchPoints > 0 || navigator.msMaxTouchPoints > 0 ); } /* ========================================================= MOBILE EMULATORJS CONTROLS ========================================================= */ function fixMobileEmulatorControls(){ if(!isTouchDevice()){ return; } console.log( "[OBVYRIS EMULATOR] " + "Touch device detected" ); let attempts = 0; const maxAttempts = 180; const timer = setInterval( function(){ attempts++; const leftContainer = document.querySelector( "#ejs_virtualGamepad_left" ); const rightContainer = document.querySelector( "#ejs_virtualGamepad_right" ); let found = false; /* ========================================= LEFT GAMEPAD ========================================= */ if(leftContainer){ found = true; if( !leftContainer.dataset .obvyrisTouchFixed ){ leftContainer.dataset .obvyrisTouchFixed = "true"; leftContainer.addEventListener( "touchstart", function(event){ event.preventDefault(); }, { passive:false } ); leftContainer.addEventListener( "touchmove", function(event){ event.preventDefault(); }, { passive:false } ); console.log( "[OBVYRIS EMULATOR] " + "Left virtual gamepad protected" ); } } /* ========================================= RIGHT GAMEPAD ========================================= */ if(rightContainer){ found = true; if( !rightContainer.dataset .obvyrisTouchFixed ){ rightContainer.dataset .obvyrisTouchFixed = "true"; rightContainer.addEventListener( "touchstart", function(event){ event.preventDefault(); }, { passive:false } ); rightContainer.addEventListener( "touchmove", function(event){ event.preventDefault(); }, { passive:false } ); console.log( "[OBVYRIS EMULATOR] " + "Right virtual gamepad protected" ); } } if( found && attempts >= 25 ){ clearInterval( timer ); } if( attempts >= maxAttempts ){ clearInterval( timer ); } }, 100 ); } /* ========================================================= TOOLBAR PLACEMENT ========================================================= */ function positionObvyrisToolbar(){ const controls = document.getElementById( "obvyrisToolbarButtons" ); if(!controls){ return; } /* EmulatorJS changes its toolbar dynamically. We keep the Obvyris controls at the same bottom-right toolbar location so they remain next to the EmulatorJS fullscreen/close controls. */ controls.style.display = "flex"; controls.style.visibility = "visible"; } /* ========================================================= FULLSCREEN ========================================================= */ async function toggleFullscreen(){ try{ if( document.fullscreenElement || document.webkitFullscreenElement ){ if( document.exitFullscreen ){ await document.exitFullscreen(); }else if( document.webkitExitFullscreen ){ document.webkitExitFullscreen(); } return; } const target = document.documentElement; if( target.requestFullscreen ){ await target.requestFullscreen(); }else if( target.webkitRequestFullscreen ){ target.webkitRequestFullscreen(); }else{ console.warn( "[OBVYRIS EMULATOR] " + "Fullscreen not supported." ); } }catch(error){ console.warn( "[OBVYRIS EMULATOR] " + "Fullscreen failed:", error ); } } /* ========================================================= UPDATE FULLSCREEN ICON ========================================================= */ function updateFullscreenButton(){ const button = document.getElementById( "obvyrisFullscreenButton" ); if(!button){ return; } const fullscreen = !!( document.fullscreenElement || document.webkitFullscreenElement ); if(fullscreen){ button.textContent = "⛶"; button.title = "Exit Fullscreen"; button.setAttribute( "aria-label", "Exit Fullscreen" ); button.classList.add( "active" ); }else{ button.textContent = "⛶"; button.title = "Fullscreen"; button.setAttribute( "aria-label", "Fullscreen" ); button.classList.remove( "active" ); } } document.addEventListener( "fullscreenchange", updateFullscreenButton ); document.addEventListener( "webkitfullscreenchange", updateFullscreenButton ); /* ========================================================= START EMULATORJS ========================================================= */ function startEmulator(blobURL){ return new Promise( (resolve,reject) => { try{ setLoading( "Preparing EmulatorJS..." ); /* ========================================= EMULATORJS CONFIGURATION ========================================= */ window.EJS_player = "#game"; window.EJS_core = core; window.EJS_gameUrl = blobURL; window.EJS_gameName = title; window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/"; window.EJS_startOnLoaded = true; window.EJS_disableAutoLang = true; window.EJS_virtualGamepad = isTouchDevice(); window.EJS_color = "#2793ff"; window.EJS_backgroundColor = "#000000"; window.EJS_gameID = "obvyris-" + ( gameID || "game" ); console.log( "[OBVYRIS EMULATOR] EJS_gameID:", window.EJS_gameID ); console.log( "[OBVYRIS EMULATOR] " + "Virtual Gamepad:", window.EJS_virtualGamepad ? "ENABLED" : "DISABLED" ); /* ========================================= GAME START ========================================= */ window.EJS_onGameStart = function(){ console.log( "[OBVYRIS EMULATOR] " + "GAME STARTED" ); loading.classList.add( "hidden" ); status.classList.add( "hidden" ); fixMobileEmulatorControls(); positionObvyrisToolbar(); resolve(); }; /* ========================================= LOAD ========================================= */ window.EJS_onLoad = function(){ console.log( "[OBVYRIS EMULATOR] " + "EmulatorJS loaded" ); fixMobileEmulatorControls(); positionObvyrisToolbar(); }; /* ========================================= SAVE ========================================= */ window.EJS_onSaveState = function(){ console.log( "[OBVYRIS EMULATOR] " + "Save state" ); }; /* ========================================= LOAD STATE ========================================= */ window.EJS_onLoadState = function(){ console.log( "[OBVYRIS EMULATOR] " + "Load state" ); }; /* ========================================= LOAD SCRIPT ========================================= */ setLoading( "Loading EmulatorJS..." ); const script = document.createElement( "script" ); script.src = "https://cdn.emulatorjs.org/stable/data/loader.js"; script.async = true; script.onload = function(){ console.log( "[OBVYRIS EMULATOR] " + "EmulatorJS loader loaded" ); setLoading( "Starting " + requestedCore.toUpperCase() + "..." ); fixMobileEmulatorControls(); positionObvyrisToolbar(); let attempts = 0; const maxAttempts = 250; const checkCanvas = setInterval( function(){ attempts++; const canvas = document.querySelector( "#game canvas" ); const virtualGamepad = document.querySelector( "#ejs_virtualGamepad_left," + "#ejs_virtualGamepad_right" ); if(canvas){ console.log( "[OBVYRIS EMULATOR] " + "Canvas detected" ); } if( virtualGamepad ){ fixMobileEmulatorControls(); } positionObvyrisToolbar(); if( canvas && ( !isTouchDevice() || virtualGamepad ) ){ clearInterval( checkCanvas ); } if( attempts >= maxAttempts ){ clearInterval( checkCanvas ); } }, 100 ); }; script.onerror = function(){ reject( new Error( "EmulatorJS loader " + "could not be loaded." ) ); }; document.head.appendChild( script ); }catch(error){ reject( error ); } } ); } /* ========================================================= MAIN ========================================================= */ async function main(){ try{ console.log( "[OBVYRIS EMULATOR] " + "Starting game:", gameID ); console.log( "[OBVYRIS EMULATOR] " + "Chat station:", chatStation ); const blobURL = await downloadROM(); await startEmulator( blobURL ); console.log( "[OBVYRIS EMULATOR]", title, "running" ); }catch(error){ console.error( "[OBVYRIS EMULATOR] FATAL:", error ); fail( error && error.message ? error.message : String(error) ); } } /* ========================================================= GLOBAL ERRORS ========================================================= */ window.addEventListener( "error", function(event){ console.error( "[OBVYRIS EMULATOR] Window error:", event.error || event.message ); } ); window.addEventListener( "unhandledrejection", function(event){ console.error( "[OBVYRIS EMULATOR] Promise error:", event.reason ); } ); /* ========================================================= GAME CHAT ENGINE ========================================================= */ const CHAT_API = "https://script.google.com/macros/s/AKfycbzin84qDcZ9L1q4pTBtHZGKJSTDcZ_wnmgWmnmgPgf1jrc1nRprzbEBixKMSHcdkxiZBg/exec"; let gameChatOpen = false; let gameChatRefreshTimer = null; let gameChatLastHash = ""; let gameChatLastCount = 0; let gameChatSending = false; const GAME_CHAT_STATION = chatStation; const GAME_CHAT_NAME = title; /* ========================================================= CHAT DOM ========================================================= */ const gameChat = document.getElementById( "gameChat" ); const gameChatButton = document.getElementById( "obvyrisChatButton" ); const gameChatMessages = document.getElementById( "gameChatMessages" ); const gameChatRoom = document.getElementById( "gameChatRoom" ); const gameChatNameInput = document.getElementById( "gameChatNameInput" ); const gameChatMessageInput = document.getElementById( "gameChatMessageInput" ); const gameChatUnread = document.getElementById( "obvyrisChatUnread" ); /* ========================================================= CHAT ROOM LABEL ========================================================= */ if(GAME_CHAT_STATION){ gameChatRoom.textContent = GAME_CHAT_STATION; }else{ gameChatRoom.textContent = "No game room"; } /* ========================================================= TOGGLE CHAT ========================================================= */ function toggleGameChat(){ if(!GAME_CHAT_STATION){ console.error( "[OBVYRIS EMULATOR] " + "No chat station available." ); return; } gameChatOpen = !gameChatOpen; if(gameChatOpen){ openGameChat(); }else{ closeGameChat(); } } /* ========================================================= OPEN CHAT ========================================================= */ function openGameChat(){ if(!GAME_CHAT_STATION){ return; } gameChatOpen = true; gameChat.classList.add( "open" ); gameChatButton.classList.add( "active" ); gameChatUnread.style.display = "none"; gameChatUnread.textContent = "0"; loadGameChat(); clearInterval( gameChatRefreshTimer ); gameChatRefreshTimer = setInterval( loadGameChat, 2500 ); setTimeout( function(){ gameChatMessageInput.focus(); }, 100 ); } /* ========================================================= CLOSE CHAT ========================================================= */ function closeGameChat(){ gameChatOpen = false; gameChat.classList.remove( "open" ); gameChatButton.classList.remove( "active" ); clearInterval( gameChatRefreshTimer ); gameChatRefreshTimer = null; } /* ========================================================= LOAD CHAT ========================================================= */ async function loadGameChat(){ if(!GAME_CHAT_STATION){ return; } try{ const response = await fetch( CHAT_API, { method:"POST", body: JSON.stringify({ action:"get", station: GAME_CHAT_STATION }) } ); if(!response.ok){ throw new Error( "Chat HTTP " + response.status ); } const data = await response.json(); if(!Array.isArray(data)){ return; } const hash = JSON.stringify(data); if( hash === gameChatLastHash ){ return; } if( !gameChatOpen && gameChatLastCount > 0 && data.length > gameChatLastCount ){ const difference = data.length - gameChatLastCount; gameChatUnread.textContent = difference > 9 ? "9+" : difference; gameChatUnread.style.display = "flex"; } gameChatLastHash = hash; gameChatLastCount = data.length; renderGameChat( data ); }catch(error){ console.warn( "[OBVYRIS CHAT] Load failed:", error ); } } /* ========================================================= RENDER CHAT ========================================================= */ function renderGameChat(data){ if(!data.length){ gameChatMessages.innerHTML = ` <div class="game-chat-message game-chat-system"> No messages yet. Start the conversation. </div> `; return; } const oldScroll = gameChatMessages.scrollTop; const wasNearBottom = gameChatMessages.scrollHeight - gameChatMessages.scrollTop - gameChatMessages.clientHeight < 80; let html = ""; for( let i = 0; i < data.length; i++ ){ const m = data[i]; if(!m){ continue; } const name = escapeHTML( m.name || "Anon" ); const message = escapeHTML( m.message || "" ); if( name.toLowerCase() === "system" ){ html += ` <div class="game-chat-message game-chat-system"> ${message} </div> `; continue; } if( m.message && m.message.startsWith( "[GIF]" ) ){ const gifURL = escapeAttribute( m.message.replace( "[GIF]", "" ) ); html += ` <div class="game-chat-message"> <span class="game-chat-name"> ${name}: </span> <img src="${gifURL}" style=" max-width:220px; max-height:160px; display:block; margin-top:5px; border-radius:8px; " > </div> `; }else{ html += ` <div class="game-chat-message"> <span class="game-chat-name"> ${name}: </span> ${message} </div> `; } } gameChatMessages.innerHTML = html; if(wasNearBottom){ gameChatMessages.scrollTop = gameChatMessages.scrollHeight; }else{ gameChatMessages.scrollTop = oldScroll; } } /* ========================================================= SEND CHAT ========================================================= */ async function sendGameChat(){ if(gameChatSending){ return; } if(!GAME_CHAT_STATION){ return; } const name = gameChatNameInput.value.trim() || "Anon"; const message = gameChatMessageInput.value.trim(); if(!message){ return; } gameChatSending = true; const sendButton = document.getElementById( "gameChatSend" ); sendButton.disabled = true; try{ await fetch( CHAT_API, { method:"POST", body: JSON.stringify({ action: "send", station: GAME_CHAT_STATION, stationName: GAME_CHAT_NAME, name: name, message: message }) } ); gameChatMessageInput.value = ""; await loadGameChat(); gameChatMessageInput.focus(); }catch(error){ console.error( "[OBVYRIS CHAT] Send failed:", error ); } setTimeout( function(){ gameChatSending = false; sendButton.disabled = false; }, 700 ); } /* ========================================================= ENTER TO SEND ========================================================= */ gameChatMessageInput.addEventListener( "keydown", function(event){ if( event.key === "Enter" ){ event.preventDefault(); sendGameChat(); } } ); /* ========================================================= HTML ESCAPING ========================================================= */ function escapeHTML(value){ return String(value) .replace( /&/g, "&amp;" ) .replace( /</g, "&lt;" ) .replace( />/g, "&gt;" ) .replace( /"/g, "&quot;" ) .replace( /'/g, "&#039;" ); } function escapeAttribute(value){ return String(value) .replace( /&/g, "&amp;" ) .replace( /"/g, "&quot;" ) .replace( /</g, "&lt;" ) .replace( />/g, "&gt;" ); } /* ========================================================= CHAT INITIALIZATION ========================================================= */ console.log( "[OBVYRIS CHAT] " + "Game chat initialized" ); console.log( "[OBVYRIS CHAT] Game ID:", gameID ); console.log( "[OBVYRIS CHAT] Station:", GAME_CHAT_STATION ); console.log( "[OBVYRIS CHAT] Game:", GAME_CHAT_NAME ); /* ========================================================= TOOLBAR INITIALIZATION ========================================================= */ positionObvyrisToolbar(); updateFullscreenButton(); /* ========================================================= START ========================================================= */ main(); </script> </body> </html>
