<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>OBVYRIS Emulator</title>

<style>

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
}

/* =========================================================
   EMULATOR
   ========================================================= */

#game{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    background:#000;
}

#game canvas{
    image-rendering:auto;
    max-width:100%;
    max-height:100%;
}

/* =========================================================
   LOADING
   ========================================================= */

#loading{
    position:absolute;
    inset:0;
    z-index:900;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
    color:#fff;
    font-size:18px;
    text-align:center;
}

#loading.hidden{
    display:none;
}

#loadingText{
    padding:20px;
}

/* =========================================================
   STATUS
   ========================================================= */

#status{
    position:absolute;
    top:0;
    left:0;
    right:0;
    z-index:1000;
    padding:8px 12px;
    background:rgba(0,0,0,.72);
    color:#fff;
    font-size:12px;
    pointer-events:none;
    transition:.3s;
}

#status.hidden{
    opacity:0;
}

/* =========================================================
   ERROR
   ========================================================= */

#error{
    position:absolute;
    inset:0;
    z-index:2000;
    display:none;
    align-items:center;
    justify-content:center;
    background:#000;
    color:#fff;
    padding:30px;
    text-align:center;
    white-space:pre-wrap;
}

/* =========================================================
   GAME CHAT BUTTON
   ========================================================= */

#gameChatButton{
    position:fixed;
    right:58px;
    bottom:605px;
    width:25px;
    height:25px;
    z-index:100000;

    border:1px solid rgba(255,255,255,.06);
    border-radius:50%;

    background:rgba(0,0,0,.08);

    color:rgba(255,255,255,.22);

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:19px;
    cursor:pointer;

    backdrop-filter:blur(2px);
    -webkit-backdrop-filter:blur(2px);

    box-shadow:none;

    opacity:.35;

    transition:
        opacity .15s,
        background .15s,
        transform .15s;
}

#gameChatButton:hover{
    opacity:.75;
    background:rgba(39,147,255,.18);
}

#gameChatButton:active{
    opacity:.9;
    transform:scale(.92);
}

#gameChatButton.chat-open{
    opacity:.8;
    background:rgba(39,147,255,.25);
}

/* =========================================================
   UNREAD INDICATOR
   ========================================================= */

#gameChatUnread{
    position:absolute;
    right:-1px;
    top:-1px;
    min-width:15px;
    height:15px;
    padding:0 3px;
    border-radius:20px;
    background:#ff3b30;
    color:#fff;
    font-size:8px;
    font-weight:bold;
    display:none;
    align-items:center;
    justify-content:center;
}

/* =========================================================
   GAME CHAT WINDOW
   ========================================================= */

#gameChat{
    position:fixed;
    right:5px;
    bottom:340px;
    width:min(220px,calc(100vw - 36px));
    height:min(300px,calc(100vh - 120px));
    z-index:99999;

    display:flex;
    flex-direction:column;

    overflow:hidden;

    border:1px solid rgba(255,255,255,.16);
    border-radius:18px;

    background:rgba(5,12,22,.46);

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);

    box-shadow:0 15px 45px rgba(0,0,0,.5);

    opacity:0;
    transform:translateY(12px) scale(.97);

    pointer-events:none;

    transition:
        opacity .18s ease,
        transform .18s ease;
}

#gameChat.open{
    opacity:1;
    transform:translateY(0) scale(1);
    pointer-events:auto;
}

/* =========================================================
   CHAT HEADER
   ========================================================= */

#gameChatHeader{
    min-height:28px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 10px 0 14px;

    background:rgba(5,12,22,.45);

    border-bottom:1px solid rgba(255,255,255,.12);

    flex-shrink:0;
}

#gameChatTitle{
    min-width:0;
}

#gameChatName{
    font-size:10px;
    font-weight:800;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

#gameChatRoom{
    margin-top:2px;

    color:rgba(255,255,255,.55);

    font-size:7px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

#gameChatClose{
    width:34px;
    height:34px;

    border:0;
    border-radius:10px;

    background:rgba(255,255,255,.08);

    color:#fff;

    font-size:10px;

    cursor:pointer;
}

/* =========================================================
   CHAT MESSAGES
   ========================================================= */

#gameChatMessages{
    flex:1;
    min-height:0;

    overflow-y:auto;

    padding:10px;

    scrollbar-width:thin;

    scrollbar-color:
        rgba(255,255,255,.25)
        transparent;
}

#gameChatMessages::-webkit-scrollbar{
    width:5px;
}

#gameChatMessages::-webkit-scrollbar-track{
    background:transparent;
}

#gameChatMessages::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,.2);
    border-radius:10px;
}

.game-chat-message{
    margin-bottom:7px;

    padding:7px 9px;

    border-radius:10px;

    background:rgba(0,0,0,.32);

    border:1px solid rgba(255,255,255,.06);

    font-size:10px;
    line-height:1.35;

    word-break:break-word;
}

.game-chat-name{
    color:#4da3ff;

    font-weight:800;

    margin-right:4px;
}

.game-chat-system{
    color:rgba(255,255,255,.5);

    font-style:italic;

    text-align:center;
}

.game-chat-gif{
    max-width:100%;
    max-height:160px;

    display:block;

    margin-top:5px;

    border-radius:8px;

    object-fit:contain;
}

/* =========================================================
   GIF PICKER
   ========================================================= */

#gameGifPicker{
    position:absolute;

    left:6px;
    right:6px;

    bottom:51px;

    height:190px;

    z-index:20;

    display:none;

    flex-direction:column;

    overflow:hidden;

    border:1px solid rgba(255,255,255,.14);

    border-radius:12px;

    background:rgba(5,12,22,.94);

    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);

    box-shadow:
        0 12px 35px rgba(0,0,0,.55);
}

#gameGifPicker.open{
    display:flex;
}

/* =========================================================
   GIF SEARCH
   ========================================================= */

#gameGifSearchBar{
    display:flex;

    gap:5px;

    padding:7px;

    flex-shrink:0;

    border-bottom:
        1px solid
        rgba(255,255,255,.1);
}

#gameGifSearch{
    flex:1;

    min-width:0;

    height:28px;

    box-sizing:border-box;

    padding:
        0 9px;

    border:
        1px solid
        rgba(255,255,255,.15);

    border-radius:8px;

    outline:none;

    background:
        rgba(0,0,0,.45);

    color:#fff;

    font-size:10px;
}

#gameGifSearch::placeholder{
    color:
        rgba(255,255,255,.4);
}

#gameGifSearchButton{
    width:34px;
    height:28px;

    border:0;

    border-radius:8px;

    background:
        rgba(39,147,255,.72);

    color:#fff;

    cursor:pointer;

    font-size:12px;
}

/* =========================================================
   GIF RESULTS
   ========================================================= */

#gameGifResults{
    flex:1;

    min-height:0;

    overflow-y:auto;

    padding:6px;

    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:5px;

    scrollbar-width:thin;

    scrollbar-color:
        rgba(255,255,255,.2)
        transparent;
}

#gameGifResults::-webkit-scrollbar{
    width:4px;
}

#gameGifResults::-webkit-scrollbar-track{
    background:transparent;
}

#gameGifResults::-webkit-scrollbar-thumb{
    background:
        rgba(255,255,255,.2);

    border-radius:10px;
}

.game-gif-result{
    position:relative;

    width:100%;

    aspect-ratio:1/1;

    overflow:hidden;

    border:0;

    border-radius:7px;

    padding:0;

    background:#111;

    cursor:pointer;
}

.game-gif-result img{
    width:100%;
    height:100%;

    display:block;

    object-fit:cover;
}

.game-gif-result:hover{
    outline:
        1px solid
        rgba(39,147,255,.8);
}

.game-gif-loading{
    grid-column:
        1 / -1;

    display:flex;

    align-items:center;

    justify-content:center;

    min-height:80px;

    color:
        rgba(255,255,255,.55);

    font-size:10px;
}

.game-gif-empty{
    grid-column:
        1 / -1;

    display:flex;

    align-items:center;

    justify-content:center;

    min-height:80px;

    color:
        rgba(255,255,255,.45);

    font-size:10px;

    text-align:center;
}

/* =========================================================
   GIF BUTTON
   ========================================================= */

#gameChatGif{
    width:34px;
    height:28px;

    flex-shrink:0;

    border:1px solid
        rgba(255,255,255,.14);

    border-radius:9px;

    background:
        rgba(255,255,255,.06);

    color:
        rgba(255,255,255,.8);

    font-size:9px;

    font-weight:bold;

    cursor:pointer;
}

#gameChatGif:hover{
    background:
        rgba(39,147,255,.18);

    border-color:
        rgba(39,147,255,.35);
}

#gameChatGif.active{
    background:
        rgba(39,147,255,.3);

    border-color:
        rgba(39,147,255,.55);
}

/* =========================================================
   CHAT INPUT
   ========================================================= */

#gameChatInputBar{
    position:relative;

    display:flex;

    gap:5px;

    padding:8px;

    background:
        rgba(5,12,22,.48);

    border-top:
        1px solid
        rgba(255,255,255,.1);

    flex-shrink:0;
}

#gameChatNameInput{
    width:58px;

    flex-shrink:0;
}

#gameChatMessageInput{
    flex:1;

    min-width:0;
}

#gameChatInputBar input{
    height:28px;

    box-sizing:border-box;

    padding:
        0 9px;

    border:
        1px solid
        rgba(255,255,255,.16);

    border-radius:9px;

    outline:none;

    background:
        rgba(0,0,0,.38);

    color:#fff;

    font-size:10px;
}

#gameChatInputBar input::placeholder{
    color:
        rgba(255,255,255,.45);
}

#gameChatSend{
    width:42px;
    height:28px;

    flex-shrink:0;

    border:0;

    border-radius:9px;

    background:
        rgba(39,147,255,.72);

    color:#fff;

    font-size:15px;

    cursor:pointer;
}

#gameChatSend:active{
    transform:scale(.95);
}

#gameChatSend:disabled{
    opacity:.5;
}

/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:600px){

    #gameChatButton{
        right:12px;
        bottom:12px;

        width:44px;
        height:44px;

        font-size:19px;
    }

    #gameChat{
        right:10px;
        bottom:64px;

        width:
            calc(100vw - 20px);

        height:
            min(
                390px,
                calc(100vh - 90px)
            );

        border-radius:16px;
    }

    #gameChatInputBar input{
        height:42px;
    }

    #gameChatSend{
        height:42px;
    }

    #gameChatGif{
        height:42px;
        width:40px;
    }

    #gameGifPicker{
        bottom:59px;
        height:220px;
    }

    #gameGifResults{
        grid-template-columns:
            repeat(3,1fr);
    }

}

/* =========================================================
   TOUCH
   ========================================================= */

button,
input{
    touch-action:manipulation;
}

</style>

</head>

<body>

<div id="game"></div>


<div id="loading">

    <div>

        <div id="loadingText">
            Loading ROM...
        </div>

    </div>

</div>


<div id="status"></div>


<div id="error"></div>


<!-- =======================================================
     GAME CHAT BUTTON
     ======================================================= -->

<button
    id="gameChatButton"
    type="button"
    onclick="toggleGameChat()"
    aria-label="Game Chat"
>

    💬

    <span id="gameChatUnread">
        0
    </span>

</button>


<!-- =======================================================
     GAME CHAT
     ======================================================= -->

<div id="gameChat">

    <div id="gameChatHeader">

        <div id="gameChatTitle">

            <div id="gameChatName">
                💬 Game Chat
            </div>

            <div id="gameChatRoom">
                Loading room...
            </div>

        </div>

        <button
            id="gameChatClose"
            type="button"
            onclick="closeGameChat()"
        >
            ✕
        </button>

    </div>


    <div id="gameChatMessages"></div>


    <div id="gameChatInputBar">

        <!-- =================================================
             GIPHY PICKER
             ================================================= -->

        <div id="gameGifPicker">

            <div id="gameGifSearchBar">

                <input
                    id="gameGifSearch"
                    type="text"
                    maxlength="80"
                    placeholder="Search GIFs..."
                    autocomplete="off"
                >

                <button
                    id="gameGifSearchButton"
                    type="button"
                    onclick="searchGiphy()"
                >
                    🔍
                </button>

            </div>

            <div id="gameGifResults">

                <div class="game-gif-empty">

                    Search GIPHY

                </div>

            </div>

        </div>


        <input
            id="gameChatNameInput"
            maxlength="10"
            placeholder="Name"
            autocomplete="off"
        >


        <input
            id="gameChatMessageInput"
            maxlength="120"
            placeholder="Chat..."
            autocomplete="off"
        >


        <button
            id="gameChatGif"
            type="button"
            onclick="toggleGifPicker()"
            aria-label="GIF"
        >
            GIF
        </button>


        <button
            id="gameChatSend"
            type="button"
            onclick="sendGameChat()"
        >
            ➤
        </button>

    </div>

</div>


<script>

"use strict";


/* =========================================================
   URL PARAMETERS
   ========================================================= */

const params =
    new URLSearchParams(
        location.search
    );


const originalRom =
    params.get("rom");


const requestedCore =
    (
        params.get("core") ||
        "nes"
    ).toLowerCase();


const title =
    params.get("title") ||
    "OBVYRIS GAME";


const gameID =
    params.get("gameid") ||
    "";


const chatStation =
    params.get("station") ||
    (
        gameID
            ? "game-" + gameID
            : ""
    );


/* =========================================================
   URL LOGGING
   ========================================================= */

console.log(
    "[OBVYRIS EMULATOR] Game ID:",
    gameID
);

console.log(
    "[OBVYRIS EMULATOR] Chat Station:",
    chatStation
);

console.log(
    "[OBVYRIS EMULATOR] Requested Core:",
    requestedCore
);

console.log(
    "[OBVYRIS EMULATOR] Title:",
    title
);

console.log(
    "[OBVYRIS EMULATOR] ROM:",
    originalRom
);


/* =========================================================
   CORE MAP
   ========================================================= */

const CORE_MAP = {

    nes:
        "nes",

    snes:
        "snes",

    gba:
        "mgba",

    gbc:
        "gambatte",

    genesis:
        "genesis_plus_gx",

    megadrive:
        "genesis_plus_gx",

    sega_genesis:
        "genesis_plus_gx",

    genesis_plus_gx:
        "genesis_plus_gx"

};


const core =
    CORE_MAP[requestedCore] ||
    requestedCore;


console.log(
    "[OBVYRIS EMULATOR] EmulatorJS Core:",
    core
);


/* =========================================================
   DOM
   ========================================================= */

const loading =
    document.getElementById(
        "loading"
    );


const loadingText =
    document.getElementById(
        "loadingText"
    );


const errorBox =
    document.getElementById(
        "error"
    );


const status =
    document.getElementById(
        "status"
    );


/* =========================================================
   LOG
   ========================================================= */

function log(message){

    console.log(
        "[OBVYRIS EMULATOR]",
        message
    );

    status.textContent =
        message;

}


/* =========================================================
   LOADING
   ========================================================= */

function setLoading(message){

    loadingText.textContent =
        message;

    console.log(
        "[OBVYRIS EMULATOR]",
        message
    );

}


/* =========================================================
   ERROR
   ========================================================= */

function fail(message){

    console.error(
        "[OBVYRIS EMULATOR]",
        message
    );

    loading.style.display =
        "none";

    errorBox.style.display =
        "flex";

    errorBox.textContent =
        "Emulator Error\n\n" +
        message;

}


/* =========================================================
   ROM CHECK
   ========================================================= */

if(!originalRom){

    fail(

        "No ROM was supplied.\n\n" +

        "Use:\n" +

        "?gameid=zelda" +

        "&core=nes" +

        "&title=The%20Legend%20of%20Zelda" +

        "&rom=ROM_URL"

    );

    throw new Error(
        "Missing ROM"
    );

}


if(!gameID){

    console.warn(
        "[OBVYRIS EMULATOR] No Game ID supplied."
    );

}


/* =========================================================
   ROM PROXY
   ========================================================= */

const PROXY_BASE = "https://project-akfea.vercel.app/api/rom";


const proxyURL =
    PROXY_BASE +
    "?url=" +
    encodeURIComponent(
        originalRom
    );


console.log(
    "[OBVYRIS EMULATOR] Proxy ROM:",
    proxyURL
);


/* =========================================================
   DOWNLOAD ROM
   ========================================================= */

async function downloadROM(){

    try{

        setLoading(
            "Downloading ROM..."
        );

        log(
            "Fetching ROM..."
        );


        const response =
            await fetch(
                proxyURL,
                {
                    method:"GET",
                    mode:"cors",
                    cache:"no-store"
                }
            );


        console.log(
            "[OBVYRIS EMULATOR] Proxy response:",
            response.status,
            response.statusText
        );


        if(!response.ok){

            let text = "";

            try{

                text =
                    await response.text();

            }catch(e){}


            throw new Error(

                "Proxy returned HTTP " +
                response.status +
                "\n" +
                text

            );

        }


        setLoading(
            "Reading ROM..."
        );


        const buffer =
            await response.arrayBuffer();


        console.log(
            "[OBVYRIS EMULATOR] ROM downloaded:",
            buffer.byteLength,
            "bytes"
        );


        if(
            !buffer ||
            buffer.byteLength < 16
        ){

            throw new Error(
                "ROM data is empty or too small."
            );

        }


        /* =================================================
           NES HEADER
           ================================================= */

        if(core === "nes"){

            const bytes =
                new Uint8Array(
                    buffer
                );


            const validNES =
                bytes.length >= 4 &&
                bytes[0] === 0x4E &&
                bytes[1] === 0x45 &&
                bytes[2] === 0x53 &&
                bytes[3] === 0x1A;


            console.log(
                "[OBVYRIS EMULATOR] NES header:",
                validNES
                    ? "VALID"
                    : "INVALID"
            );


            if(!validNES){

                throw new Error(

                    "The downloaded file is not a valid NES ROM.\n\n" +

                    "First bytes: " +

                    Array.from(
                        bytes.slice(0,8)
                    )
                    .map(
                        x =>
                            x.toString(16)
                             .padStart(2,"0")
                    )
                    .join(" ")

                );

            }

        }


        /* =================================================
           LOCAL BLOB
           ================================================= */

        const blob =
            new Blob(
                [buffer],
                {
                    type:
                        "application/octet-stream"
                }
            );


        const blobURL =
            URL.createObjectURL(
                blob
            );


        console.log(
            "[OBVYRIS EMULATOR] Local ROM Blob:",
            blobURL
        );


        return blobURL;


    }catch(error){

        console.error(
            "[OBVYRIS EMULATOR] ROM download error:",
            error
        );

        throw error;

    }

}


/* =========================================================
   EMULATORJS
   ========================================================= */

function startEmulator(blobURL){

    return new Promise(
        (resolve,reject)=>{

            try{

                setLoading(
                    "Preparing EmulatorJS..."
                );


                window.EJS_player =
                    "#game";


                window.EJS_core =
                    core;


                window.EJS_gameUrl =
                    blobURL;


                window.EJS_gameName =
                    title;


                window.EJS_pathtodata =
                    "https://cdn.emulatorjs.org/stable/data/";


                window.EJS_startOnLoaded =
                    true;


                window.EJS_disableAutoLang =
                    true;


                window.EJS_color =
                    "#2793ff";


                window.EJS_backgroundColor =
                    "#000000";


                /* =================================================
                   EMULATOR GAME ID
                   ================================================= */

                window.EJS_gameID =
                    "obvyris-" +
                    (
                        gameID ||
                        "game"
                    );


                console.log(
                    "[OBVYRIS EMULATOR] EJS_gameID:",
                    window.EJS_gameID
                );


                /* =================================================
                   GAME START
                   ================================================= */

                window.EJS_onGameStart =
                    function(){

                        console.log(
                            "[OBVYRIS EMULATOR] GAME STARTED"
                        );


                        loading.classList.add(
                            "hidden"
                        );


                        status.classList.add(
                            "hidden"
                        );


                        resolve();

                    };


                /* =================================================
                   LOAD
                   ================================================= */

                window.EJS_onLoad =
                    function(){

                        console.log(
                            "[OBVYRIS EMULATOR] EmulatorJS loaded"
                        );

                    };


                /* =================================================
                   SAVE
                   ================================================= */

                window.EJS_onSaveState =
                    function(){

                        console.log(
                            "[OBVYRIS EMULATOR] Save state"
                        );

                    };


                /* =================================================
                   LOAD STATE
                   ================================================= */

                window.EJS_onLoadState =
                    function(){

                        console.log(
                            "[OBVYRIS EMULATOR] Load state"
                        );

                    };


                /* =================================================
                   LOAD SCRIPT
                   ================================================= */

                setLoading(
                    "Loading EmulatorJS..."
                );


                const script =
                    document.createElement(
                        "script"
                    );


                script.src =
                    "https://cdn.emulatorjs.org/stable/data/loader.js";


                script.async =
                    true;


                script.onload =
                    function(){

                        console.log(
                            "[OBVYRIS EMULATOR] EmulatorJS loader loaded"
                        );


                        setLoading(
                            "Starting " +
                            requestedCore.toUpperCase() +
                            "..."
                        );


                        let attempts =
                            0;


                        const maxAttempts =
                            200;


                        const checkCanvas =
                            setInterval(
                                function(){

                                    attempts++;


                                    const canvas =
                                        document.querySelector(
                                            "#game canvas"
                                        );


                                    if(canvas){

                                        clearInterval(
                                            checkCanvas
                                        );


                                        console.log(
                                            "[OBVYRIS EMULATOR] Canvas detected"
                                        );


                                        return;

                                    }


                                    if(
                                        attempts >=
                                        maxAttempts
                                    ){

                                        clearInterval(
                                            checkCanvas
                                        );


                                        console.warn(
                                            "[OBVYRIS EMULATOR] Canvas not detected"
                                        );

                                    }

                                },
                                100
                            );

                    };


                script.onerror =
                    function(){

                        reject(
                            new Error(
                                "EmulatorJS loader could not be loaded."
                            )
                        );

                    };


                document.head.appendChild(
                    script
                );


            }catch(error){

                reject(
                    error
                );

            }

        }
    );

}

/* =========================================================
   LOAD CHAT
   ========================================================= */

async function loadGameChat(){

    if(!GAME_CHAT_STATION){

        return;

    }


    try{

        const response =
            await fetch(
                CHAT_API,
                {

                    method:"POST",

                    body:
                        JSON.stringify({

                            action:
                                "get",

                            station:
                                GAME_CHAT_STATION

                        })

                }
            );


        if(!response.ok){

            throw new Error(
                "Chat HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        if(!Array.isArray(data)){

            return;

        }


        const hash =
            JSON.stringify(
                data
            );


        if(
            hash ===
            gameChatLastHash
        ){

            return;

        }


        if(
            !gameChatOpen &&
            gameChatLastCount > 0 &&
            data.length >
            gameChatLastCount
        ){

            const difference =
                data.length -
                gameChatLastCount;


            gameChatUnread.textContent =
                difference > 9
                    ? "9+"
                    : difference;


            gameChatUnread.style.display =
                "flex";

        }


        gameChatLastHash =
            hash;


        gameChatLastCount =
            data.length;


        renderGameChat(
            data
        );


    }catch(error){

        console.warn(
            "[OBVYRIS CHAT] Load failed:",
            error
        );

    }

}


/* =========================================================
   RENDER CHAT
   ========================================================= */

function renderGameChat(data){

    if(!data.length){

        gameChatMessages.innerHTML = `

            <div class="game-chat-message game-chat-system">

                No messages yet.
                Start the conversation.

            </div>

        `;

        return;

    }


    const oldScroll =
        gameChatMessages.scrollTop;


    const wasNearBottom =
        gameChatMessages.scrollHeight -
        gameChatMessages.scrollTop -
        gameChatMessages.clientHeight <
        80;


    let html =
        "";


    for(
        let i = 0;
        i < data.length;
        i++
    ){

        const m =
            data[i];


        if(!m){

            continue;

        }


        const name =
            escapeHTML(
                m.name ||
                "Anon"
            );


        const message =
            escapeHTML(
                m.message ||
                ""
            );


        if(
            name.toLowerCase() ===
            "system"
        ){

            html += `

                <div class="game-chat-message game-chat-system">

                    ${message}

                </div>

            `;

            continue;

        }


        /* =================================================
           GIF MESSAGE
           ================================================= */

        if(
            m.message &&
            m.message.startsWith(
                "[GIF]"
            )
        ){

            const gifURL =
                escapeAttribute(
                    m.message.replace(
                        "[GIF]",
                        ""
                    )
                    .trim()
                );


            html += `

                <div class="game-chat-message">

                    <span class="game-chat-name">

                        ${name}:

                    </span>

                    <img
                        class="game-chat-gif"
                        src="${gifURL}"
                        loading="lazy"
                        alt="GIF"
                        onerror="this.style.display='none'"
                    >

                </div>

            `;


        }else{

            html += `

                <div class="game-chat-message">

                    <span class="game-chat-name">

                        ${name}:

                    </span>

                    ${message}

                </div>

            `;

        }

    }


    gameChatMessages.innerHTML =
        html;


    if(wasNearBottom){

        gameChatMessages.scrollTop =
            gameChatMessages.scrollHeight;

    }else{

        gameChatMessages.scrollTop =
            oldScroll;

    }

}

async function loadTrendingGiphy(){

    if(
        !GIPHY_API_KEY ||
        GIPHY_API_KEY ===
        "YOUR_GIPHY_API_KEY"
    ){

        gameGifResults.innerHTML = `

            <div class="game-gif-empty">

                Add your GIPHY API key
                to enable GIF search.

            </div>

        `;

        return;

    }


    gameGifResults.innerHTML = `

        <div class="game-gif-loading">

            Loading GIFs...

        </div>

    `;


    try{

        const url =
            GIPHY_TRENDING_URL +
            "?api_key=" +
            encodeURIComponent(
                GIPHY_API_KEY
            ) +
            "&limit=" +
            GIPHY_LIMIT +
            "&rating=pg-13";


        const response =
            await fetch(
                url
            );


        if(!response.ok){

            throw new Error(
                "GIPHY HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        renderGiphyResults(
            data.data || []
        );


        gameGifResults.dataset.loaded =
            "true";


    }catch(error){

        console.error(
            "[OBVYRIS GIPHY] Trending failed:",
            error
        );


        gameGifResults.innerHTML = `

            <div class="game-gif-empty">

                Unable to load GIPHY.

            </div>

        `;

    }

}


/* =========================================================

   ========================================================= */

async function searchGiphy(){

    if(giphySearching){

        return;

    }


    const query =
        gameGifSearch.value.trim();


    if(!query){

        loadTrendingGiphy();

        return;

    }


    if(
        !GIPHY_API_KEY ||
        GIPHY_API_KEY ===
        "YOUR_GIPHY_API_KEY"
    ){

        gameGifResults.innerHTML = `

            <div class="game-gif-empty">

                Add your GIPHY API key
                to enable GIF search.

            </div>

        `;

        return;

    }


    giphySearching =
        true;


    gameGifResults.innerHTML = `

        <div class="game-gif-loading">

            Searching GIPHY...

        </div>

    `;


    try{

        const url =
            GIPHY_SEARCH_URL +
            "?api_key=" +
            encodeURIComponent(
                GIPHY_API_KEY
            ) +
            "&q=" +
            encodeURIComponent(
                query
            ) +
            "&limit=" +
            GIPHY_LIMIT +
            "&rating=pg-13" +
            "&lang=en";


        console.log(
            "[OBVYRIS GIPHY] Search:",
            query
        );


        const response =
            await fetch(
                url
            );


        if(!response.ok){

            throw new Error(
                "GIPHY HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        renderGiphyResults(
            data.data || []
        );


    }catch(error){

        console.error(
            "[OBVYRIS GIPHY] Search failed:",
            error
        );


        gameGifResults.innerHTML = `

            <div class="game-gif-empty">

                GIPHY search failed.

            </div>

        `;

    }


    giphySearching =
        false;

}


/* =========================================================
   RENDER GIPHY RESULTS
   ========================================================= */

function renderGiphyResults(gifs){

    gameGifResults.innerHTML =
        "";


    if(
        !gifs ||
        !gifs.length
    ){

        gameGifResults.innerHTML = `

            <div class="game-gif-empty">

                No GIFs found.

            </div>

        `;

        return;

    }


    for(
        let i = 0;
        i < gifs.length;
        i++
    ){

        const gif =
            gifs[i];


        if(!gif){

            continue;

        }


        const images =
            gif.images || {};


        const preview =
            images.fixed_width_small ||
            images.fixed_width ||
            images.downsized_small ||
            images.original;


        const original =
            images.original ||
            images.downsized ||
            images.fixed_width;


        if(
            !preview ||
            !original ||
            !original.url
        ){

            continue;

        }


        const button =
            document.createElement(
                "button"
            );


        button.type =
            "button";


        button.className =
            "game-gif-result";


        button.title =
            gif.title ||
            "Send GIF";


        const img =
            document.createElement(
                "img"
            );


        img.src =
            preview.url;


        img.alt =
            gif.title ||
            "GIF";


        img.loading =
            "lazy";


        button.appendChild(
            img
        );


        button.addEventListener(
            "click",
            function(){

                sendGiphyGIF(
                    original.url
                );

            }
        );


        gameGifResults.appendChild(
            button
        );

    }

}

/* =========================================================
   HTML ESCAPING
   ========================================================= */

function escapeHTML(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        );

}
