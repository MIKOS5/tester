<title>OBVYRIS Emulator</title> <style> /* ========================================================= BASE ========================================================= */ html, body{ margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; color:#fff; font-family:Arial,sans-serif; touch-action:none; } body{ position:fixed; inset:0; } /* ========================================================= EMULATOR ========================================================= */ #game{ position:absolute; inset:0; width:100%; height:100%; background:#000; touch-action:none; } #game canvas{ image-rendering:auto; max-width:100%; max-height:100%; touch-action:none; } /* ========================================================= TOP TOOLBAR ========================================================= */ #obvyrisToolbar{ position:fixed; top:10px; right:10px; z-index:1000000; display:flex; align-items:center; gap:6px; padding:5px; border:1px solid rgba(255,255,255,.14); border-radius:13px; background:rgba(5,12,22,.58); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); box-shadow: 0 8px 28px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06); touch-action:manipulation; } .obvyrisToolbarButton{ width:38px; height:38px; display:flex; align-items:center; justify-content:center; padding:0; border:1px solid rgba(255,255,255,.10); border-radius:9px; background:rgba(255,255,255,.07); color:#fff; font-size:17px; line-height:1; cursor:pointer; user-select:none; -webkit-user-select:none; touch-action:manipulation; transition: background .15s ease, transform .12s ease, border-color .15s ease; } .obvyrisToolbarButton:hover{ background:rgba(39,147,255,.38); border-color:rgba(39,147,255,.55); } .obvyrisToolbarButton:active{ transform:scale(.90); } #obvyrisChatToolbarButton.chat-open{ background:rgba(39,147,255,.55); border-color:rgba(39,147,255,.75); } #obvyrisCloseButton:hover{ background:rgba(255,59,48,.48); border-color:rgba(255,59,48,.65); } /* ========================================================= TOOLBAR UNREAD ========================================================= */ #toolbarUnread{ position:absolute; top:-4px; right:75px; min-width:15px; height:15px; padding:0 3px; display:none; align-items:center; justify-content:center; border-radius:20px; background:#ff3b30; color:#fff; font-size:9px; font-weight:bold; pointer-events:none; } /* ========================================================= LOADING ========================================================= */ #loading{ position:absolute; inset:0; z-index:900000; display:flex; align-items:center; justify-content:center; background:#000; color:#fff; font-size:18px; text-align:center; } #loading.hidden{ display:none; } #loadingText{ padding:20px; } /* ========================================================= STATUS ========================================================= */ #status{ position:absolute; top:0; left:0; right:0; z-index:999000; padding:8px 12px; background:rgba(0,0,0,.72); color:#fff; font-size:12px; pointer-events:none; transition:.3s; } #status.hidden{ opacity:0; } /* ========================================================= ERROR ========================================================= */ #error{ position:absolute; inset:0; z-index:2000000; display:none; align-items:center; justify-content:center; background:#000; color:#fff; padding:30px; text-align:center; white-space:pre-wrap; } /* ========================================================= GAME CHAT ========================================================= */ #gameChat{ position:fixed; top:62px; right:10px; width:min(340px,calc(100vw - 20px)); height:min(430px,calc(100vh - 82px)); z-index:999999; display:flex; flex-direction:column; overflow:hidden; border:1px solid rgba(255,255,255,.16); border-radius:18px; background:rgba(5,12,22,.72); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); box-shadow: 0 15px 45px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.05); opacity:0; transform: translateY(-8px) scale(.97); pointer-events:none; transition: opacity .18s ease, transform .18s ease; touch-action:auto; } #gameChat.open{ opacity:1; transform: translateY(0) scale(1); pointer-events:auto; } /* ========================================================= CHAT HEADER ========================================================= */ #gameChatHeader{ min-height:50px; display:flex; align-items:center; justify-content:space-between; padding:0 10px 0 14px; background:rgba(5,12,22,.52); border-bottom: 1px solid rgba(255,255,255,.12); flex-shrink:0; } #gameChatTitle{ min-width:0; } #gameChatName{ font-size:14px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } #gameChatRoom{ margin-top:2px; color:rgba(255,255,255,.55); font-size:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } #gameChatClose{ width:34px; height:34px; border:0; border-radius:9px; background:rgba(255,255,255,.08); color:#fff; font-size:17px; cursor:pointer; touch-action:manipulation; } /* ========================================================= CHAT MESSAGES ========================================================= */ #gameChatMessages{ flex:1; min-height:0; overflow-y:auto; padding:10px; scrollbar-width:thin; scrollbar-color: rgba(255,255,255,.25) transparent; touch-action:pan-y; } #gameChatMessages::-webkit-scrollbar{ width:5px; } #gameChatMessages::-webkit-scrollbar-track{ background:transparent; } #gameChatMessages::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.2); border-radius:10px; } .game-chat-message{ margin-bottom:7px; padding:7px 9px; border-radius:10px; background:rgba(0,0,0,.32); border: 1px solid rgba(255,255,255,.06); font-size:12px; line-height:1.35; word-break:break-word; } .game-chat-name{ color:#4da3ff; font-weight:800; margin-right:4px; } .game-chat-system{ color:rgba(255,255,255,.5); font-style:italic; text-align:center; } /* ========================================================= CHAT INPUT ========================================================= */ #gameChatInputBar{ display:flex; gap:5px; padding:8px; background:rgba(5,12,22,.58); border-top: 1px solid rgba(255,255,255,.1); flex-shrink:0; touch-action:manipulation; } #gameChatNameInput{ width:58px; flex-shrink:0; } #gameChatMessageInput{ flex:1; min-width:0; } #gameChatInputBar input{ height:38px; box-sizing:border-box; padding:0 9px; border: 1px solid rgba(255,255,255,.16); border-radius:9px; outline:none; background:rgba(0,0,0,.38); color:#fff; font-size:14px; touch-action:manipulation; } #gameChatInputBar input::placeholder{ color:rgba(255,255,255,.45); } #gameChatSend{ width:42px; height:38px; flex-shrink:0; border:0; border-radius:9px; background:rgba(39,147,255,.72); color:#fff; font-size:15px; cursor:pointer; touch-action:manipulation; } #gameChatSend:active{ transform:scale(.95); } /* ========================================================= FULLSCREEN MODE ========================================================= */ body.obvyris-fullscreen #obvyrisToolbar{ top:8px; right:8px; } /* ========================================================= MOBILE ========================================================= */ @media(max-width:600px){ #obvyrisToolbar{ top:8px; right:8px; gap:5px; padding:4px; border-radius:12px; } .obvyrisToolbarButton{ width:36px; height:36px; font-size:16px; } #gameChat{ top:56px; right:8px; width:calc(100vw - 16px); height:min( 390px, calc(100vh - 70px) ); border-radius:16px; } #gameChatInputBar input{ height:42px; } #gameChatSend{ height:42px; } } /* ========================================================= IMPORTANT: NO CUSTOM VIRTUAL CONTROLLER ========================================================= */ /* EmulatorJS virtual gamepad is intentionally NOT enabled. This prevents the Android behavior where: - the controller is enabled automatically - EmulatorJS toolbar disappears - the user must manually activate the controller - touchscreen controls interfere with toolbar gestures EmulatorJS itself remains responsible for the game surface. */ button, input{ touch-action:manipulation; } </style> </head> <body> <!-- ======================================================= EMULATOR ======================================================= --> <div id="game"></div> <!-- ======================================================= OBVYRIS TOP TOOLBAR ======================================================= --> <div id="obvyrisToolbar">

</div>
</div> <script> "use strict"; /* ========================================================= URL PARAMETERS ========================================================= */ const params = new URLSearchParams(location.search); const originalRom = params.get("rom"); const requestedCore = (params.get("core") || "nes").toLowerCase(); const title = params.get("title") || "OBVYRIS GAME"; const gameID = params.get("gameid") || params.get("gameId") || ""; const chatStation = params.get("station") || (gameID ? "game-" + gameID : ""); /* ========================================================= LOG PARAMETERS ========================================================= */ console.log( "[OBVYRIS EMULATOR] Game ID:", gameID ); console.log( "[OBVYRIS EMULATOR] Chat Station:", chatStation ); console.log( "[OBVYRIS EMULATOR] Requested Core:", requestedCore ); console.log( "[OBVYRIS EMULATOR] Title:", title ); console.log( "[OBVYRIS EMULATOR] ROM:", originalRom ); /* ========================================================= CORE MAP ========================================================= */ const CORE_MAP = { nes: "nes", snes: "snes", gba: "mgba", gbc: "gambatte", genesis: "genesis_plus_gx", megadrive: "genesis_plus_gx", sega_genesis: "genesis_plus_gx", genesis_plus_gx: "genesis_plus_gx" }; const core = CORE_MAP[requestedCore] || requestedCore; console.log( "[OBVYRIS EMULATOR] EmulatorJS Core:", core ); /* ========================================================= DOM ========================================================= */ const loading = document.getElementById("loading"); const loadingText = document.getElementById("loadingText"); const errorBox = document.getElementById("error"); const status = document.getElementById("status"); const toolbar = document.getElementById("obvyrisToolbar"); const chatToolbarButton = document.getElementById( "obvyrisChatToolbarButton" ); const fullscreenButton = document.getElementById( "obvyrisFullscreenButton" ); const closeButton = document.getElementById( "obvyrisCloseButton" ); const toolbarUnread = document.getElementById( "toolbarUnread" ); /* ========================================================= LOG ========================================================= */ function log(message){ console.log( "[OBVYRIS EMULATOR]", message ); status.textContent = message; } /* ========================================================= LOADING ========================================================= */ function setLoading(message){ loadingText.textContent = message; console.log( "[OBVYRIS EMULATOR]", message ); } /* ========================================================= ERROR ========================================================= */ function fail(message){ console.error( "[OBVYRIS EMULATOR]", message ); loading.style.display = "none"; errorBox.style.display = "flex"; errorBox.textContent = "Emulator Error\n\n" + message; } /* ========================================================= ROM CHECK ========================================================= */ if(!originalRom){ fail( "No ROM was supplied.\n\n" + "Use:\n" + "?gameid=zelda" + "&core=nes" + "&title=The%20Legend%20of%20Zelda" + "&rom=ROM_URL" ); throw new Error( "Missing ROM" ); } /* ========================================================= CHAT CHECK ========================================================= */ if(!chatStation){ console.warn( "[OBVYRIS EMULATOR] " + "No chat station available." ); } /* ========================================================= ROM PROXY ========================================================= */ const PROXY_BASE = "https://obvyris-rom-proxy.vercel.app/api/rom"; const proxyURL = PROXY_BASE + "?url=" + encodeURIComponent( originalRom ); console.log( "[OBVYRIS EMULATOR] Proxy ROM:", proxyURL ); /* ========================================================= DOWNLOAD ROM ========================================================= */ async function downloadROM(){ try{ setLoading( "Downloading ROM..." ); log( "Fetching ROM..." ); const response = await fetch( proxyURL, { method:"GET", mode:"cors", cache:"no-store" } ); console.log( "[OBVYRIS EMULATOR] " + "Proxy response:", response.status, response.statusText ); if(!response.ok){ let text = ""; try{ text = await response.text(); }catch(e){} throw new Error( "Proxy returned HTTP " + response.status + "\n" + text ); } setLoading( "Reading ROM..." ); const buffer = await response.arrayBuffer(); console.log( "[OBVYRIS EMULATOR] " + "ROM downloaded:", buffer.byteLength, "bytes" ); if( !buffer || buffer.byteLength < 16 ){ throw new Error( "ROM data is empty " + "or too small." ); } /* ================================================= NES HEADER ================================================= */ if(core === "nes"){ const bytes = new Uint8Array( buffer ); const validNES = bytes.length >= 4 && bytes[0] === 0x4E && bytes[1] === 0x45 && bytes[2] === 0x53 && bytes[3] === 0x1A; console.log( "[OBVYRIS EMULATOR] " + "NES header:", validNES ? "VALID" : "INVALID" ); if(!validNES){ throw new Error( "The downloaded file " + "is not a valid NES ROM.\n\n" + "First bytes: " + Array.from( bytes.slice(0,8) ) .map( x => x .toString(16) .padStart( 2, "0" ) ) .join(" ") ); } } /* ================================================= LOCAL BLOB ================================================= */ const blob = new Blob( [buffer], { type: "application/octet-stream" } ); const blobURL = URL.createObjectURL( blob ); console.log( "[OBVYRIS EMULATOR] " + "Local ROM Blob:", blobURL ); return blobURL; }catch(error){ console.error( "[OBVYRIS EMULATOR] " + "ROM download error:", error ); throw error; } } /* ========================================================= DEVICE DETECTION ========================================================= */ function isTouchDevice(){ return ( "ontouchstart" in window || navigator.maxTouchPoints > 0 || navigator.msMaxTouchPoints > 0 ); } /* ========================================================= IMPORTANT ANDROID FIX ========================================================= */ /* DO NOT enable: window.EJS_virtualGamepad = true; That was causing EmulatorJS to automatically activate the virtual controller and interfere with its toolbar. We deliberately leave the EmulatorJS virtual controller disabled. Android can therefore use the normal EmulatorJS toolbar and touchscreen behavior without the virtual controller being forced on at startup. */ function configureMobileControls(){ if(isTouchDevice()){ console.log( "[OBVYRIS EMULATOR] " + "Touch device detected" ); console.log( "[OBVYRIS EMULATOR] " + "Virtual controller intentionally disabled" ); }else{ console.log( "[OBVYRIS EMULATOR] " + "Desktop device detected" ); } } /* ========================================================= START EMULATORJS ========================================================= */ function startEmulator(blobURL){ return new Promise( (resolve,reject)=>{ try{ setLoading( "Preparing EmulatorJS..." ); /* ========================================= EMULATORJS CONFIGURATION ========================================= */ window.EJS_player = "#game"; window.EJS_core = core; window.EJS_gameUrl = blobURL; window.EJS_gameName = title; window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/"; window.EJS_startOnLoaded = true; window.EJS_disableAutoLang = true; /* IMPORTANT: Virtual controller is NOT enabled automatically. */ window.EJS_virtualGamepad = false; window.EJS_color = "#2793ff"; window.EJS_backgroundColor = "#000000"; /* ========================================= UNIQUE GAME ID ========================================= */ window.EJS_gameID = "obvyris-" + ( gameID || "game" ); console.log( "[OBVYRIS EMULATOR] " + "EJS_gameID:", window.EJS_gameID ); console.log( "[OBVYRIS EMULATOR] " + "Virtual Gamepad: DISABLED" ); /* ========================================= GAME START ========================================= */ window.EJS_onGameStart = function(){ console.log( "[OBVYRIS EMULATOR] " + "GAME STARTED" ); loading.classList.add( "hidden" ); status.classList.add( "hidden" ); configureMobileControls(); resolve(); }; /* ========================================= LOAD ========================================= */ window.EJS_onLoad = function(){ console.log( "[OBVYRIS EMULATOR] " + "EmulatorJS loaded" ); configureMobileControls(); }; /* ========================================= SAVE ========================================= */ window.EJS_onSaveState = function(){ console.log( "[OBVYRIS EMULATOR] " + "Save state" ); }; /* ========================================= LOAD STATE ========================================= */ window.EJS_onLoadState = function(){ console.log( "[OBVYRIS EMULATOR] " + "Load state" ); }; /* ========================================= LOAD SCRIPT ========================================= */ setLoading( "Loading EmulatorJS..." ); const script = document.createElement( "script" ); script.src = "https://cdn.emulatorjs.org/stable/data/loader.js"; script.async = true; script.onload = function(){ console.log( "[OBVYRIS EMULATOR] " + "EmulatorJS loader loaded" ); setLoading( "Starting " + requestedCore .toUpperCase() + "..." ); let attempts = 0; const maxAttempts = 250; const checkCanvas = setInterval( function(){ attempts++; const canvas = document.querySelector( "#game canvas" ); if(canvas){ console.log( "[OBVYRIS EMULATOR] " + "Canvas detected" ); clearInterval( checkCanvas ); } if( attempts >= maxAttempts ){ clearInterval( checkCanvas ); console.warn( "[OBVYRIS EMULATOR] " + "Canvas detection timeout" ); } }, 100 ); }; script.onerror = function(){ reject( new Error( "EmulatorJS loader " + "could not be loaded." ) ); }; document.head.appendChild( script ); }catch(error){ reject(error); } } ); } /* ========================================================= MAIN ========================================================= */ async function main(){ try{ console.log( "[OBVYRIS EMULATOR] " + "Starting game:", gameID ); console.log( "[OBVYRIS EMULATOR] " + "Chat station:", chatStation ); const blobURL = await downloadROM(); await startEmulator( blobURL ); console.log( "[OBVYRIS EMULATOR]", title, "running" ); }catch(error){ console.error( "[OBVYRIS EMULATOR] FATAL:", error ); fail( error && error.message ? error.message : String(error) ); } } /* ========================================================= GLOBAL ERRORS ========================================================= */ window.addEventListener( "error", function(event){ console.error( "[OBVYRIS EMULATOR] " + "Window error:", event.error || event.message ); } ); window.addEventListener( "unhandledrejection", function(event){ console.error( "[OBVYRIS EMULATOR] " + "Promise error:", event.reason ); } ); /* ========================================================= FULLSCREEN ========================================================= */ let isFullscreen = false; async function toggleFullscreen(){ try{ if(!document.fullscreenElement){ await document.documentElement .requestFullscreen(); isFullscreen = true; document.body.classList.add( "obvyris-fullscreen" ); fullscreenButton.textContent = "⛶"; fullscreenButton.title = "Exit Fullscreen"; console.log( "[OBVYRIS EMULATOR] " + "Fullscreen enabled" ); }else{ await document.exitFullscreen(); isFullscreen = false; document.body.classList.remove( "obvyris-fullscreen" ); fullscreenButton.textContent = "⛶"; fullscreenButton.title = "Fullscreen"; console.log( "[OBVYRIS EMULATOR] " + "Fullscreen disabled" ); } }catch(error){ console.warn( "[OBVYRIS EMULATOR] " + "Fullscreen failed:", error ); } } document.addEventListener( "fullscreenchange", function(){ isFullscreen = !!document.fullscreenElement; if(isFullscreen){ document.body.classList.add( "obvyris-fullscreen" ); fullscreenButton.title = "Exit Fullscreen"; }else{ document.body.classList.remove( "obvyris-fullscreen" ); fullscreenButton.title = "Fullscreen"; } } ); fullscreenButton.addEventListener( "click", function(event){ event.preventDefault(); event.stopPropagation(); toggleFullscreen(); } ); /* ========================================================= CLOSE GAME ========================================================= */ function closeGame(){ console.log( "[OBVYRIS EMULATOR] " + "Closing game" ); /* If this emulator is inside an iframe, ask the parent page to navigate back. */ try{ if( window.parent && window.parent !== window ){ try{ window.parent.postMessage( { type: "OBVYRIS_CLOSE_GAME", gameID: gameID }, "*" ); }catch(e){} } }catch(e){} /* Normal browser navigation. */ if( window.history.length > 1 ){ window.history.back(); return; } /* Last fallback. */ try{ window.close(); }catch(e){} } closeButton.addEventListener( "click", function(event){ event.preventDefault(); event.stopPropagation(); closeGame(); } ); /* ========================================================= GAME CHAT ENGINE ========================================================= */ const CHAT_API = "https://script.google.com/macros/s/AKfycbzin84qDcZ9L1q4pTBtHZGKJSTDcZ_wnmgWmnmgPgf1jrc1nRprzbEBixKMSHcdkxiZBg/exec"; let gameChatOpen = false; let gameChatRefreshTimer = null; let gameChatLastHash = ""; let gameChatLastCount = 0; let gameChatSending = false; const GAME_CHAT_STATION = chatStation; const GAME_CHAT_NAME = title; /* ========================================================= CHAT DOM ========================================================= */ const gameChat = document.getElementById( "gameChat" ); const gameChatMessages = document.getElementById( "gameChatMessages" ); const gameChatRoom = document.getElementById( "gameChatRoom" ); const gameChatNameInput = document.getElementById( "gameChatNameInput" ); const gameChatMessageInput = document.getElementById( "gameChatMessageInput" ); const gameChatSend = document.getElementById( "gameChatSend" ); const gameChatClose = document.getElementById( "gameChatClose" ); /* ========================================================= CHAT ROOM LABEL ========================================================= */ if(GAME_CHAT_STATION){ gameChatRoom.textContent = GAME_CHAT_STATION; }else{ gameChatRoom.textContent = "No game room"; } /* ========================================================= TOGGLE CHAT ========================================================= */ function toggleGameChat(){ if(!GAME_CHAT_STATION){ console.error( "[OBVYRIS EMULATOR] " + "No chat station available." ); return; } gameChatOpen = !gameChatOpen; if(gameChatOpen){ openGameChat(); }else{ closeGameChat(); } } /* ========================================================= OPEN CHAT ========================================================= */ function openGameChat(){ if(!GAME_CHAT_STATION){ return; } gameChatOpen = true; gameChat.classList.add( "open" ); chatToolbarButton.classList.add( "chat-open" ); toolbarUnread.style.display = "none"; toolbarUnread.textContent = "0"; loadGameChat(); clearInterval( gameChatRefreshTimer ); gameChatRefreshTimer = setInterval( loadGameChat, 2500 ); setTimeout( function(){ gameChatMessageInput.focus(); }, 150 ); } /* ========================================================= CLOSE CHAT ========================================================= */ function closeGameChat(){ gameChatOpen = false; gameChat.classList.remove( "open" ); chatToolbarButton.classList.remove( "chat-open" ); clearInterval( gameChatRefreshTimer ); gameChatRefreshTimer = null; } /* ========================================================= CHAT TOOLBAR BUTTON ========================================================= */ chatToolbarButton.addEventListener( "click", function(event){ event.preventDefault(); event.stopPropagation(); toggleGameChat(); } ); /* ========================================================= CHAT CLOSE ========================================================= */ gameChatClose.addEventListener( "click", function(event){ event.preventDefault(); event.stopPropagation(); closeGameChat(); } ); /* ========================================================= LOAD CHAT ========================================================= */ async function loadGameChat(){ if(!GAME_CHAT_STATION){ return; } try{ const response = await fetch( CHAT_API, { method:"POST", body:JSON.stringify({ action:"get", station: GAME_CHAT_STATION }) } ); if(!response.ok){ throw new Error( "Chat HTTP " + response.status ); } const data = await response.json(); if(!Array.isArray(data)){ return; } const hash = JSON.stringify(data); if( hash === gameChatLastHash ){ return; } /* New-message badge. */ if( !gameChatOpen && gameChatLastCount > 0 && data.length > gameChatLastCount ){ const difference = data.length - gameChatLastCount; toolbarUnread.textContent = difference > 9 ? "9+" : difference; toolbarUnread.style.display = "flex"; } gameChatLastHash = hash; gameChatLastCount = data.length; renderGameChat( data ); }catch(error){ console.warn( "[OBVYRIS CHAT] " + "Load failed:", error ); } } /* ========================================================= RENDER CHAT ========================================================= */ function renderGameChat(data){ if(!data.length){ gameChatMessages.innerHTML = '<div class="game-chat-message game-chat-system">' + 'No messages yet. Start the conversation.' + '</div>'; return; } const oldScroll = gameChatMessages.scrollTop; const wasNearBottom = gameChatMessages.scrollHeight - gameChatMessages.scrollTop - gameChatMessages.clientHeight < 80; let html = ""; for( let i = 0; i < data.length; i++ ){ const m = data[i]; if(!m){ continue; } const name = escapeHTML( m.name || "Anon" ); const message = escapeHTML( m.message || "" ); if( name.toLowerCase() === "system" ){ html += '<div class="game-chat-message game-chat-system">' + message + '</div>'; continue; } /* GIF support. */ if( m.message && m.message.startsWith("[GIF]") ){ const gifURL = escapeAttribute( m.message.replace( "[GIF]", "" ) ); html += '<div class="game-chat-message">' + '<span class="game-chat-name">' + name + ': </span>' + '<img src="' + gifURL + '" style="' + 'max-width:220px;' + 'max-height:160px;' + 'display:block;' + 'margin-top:5px;' + 'border-radius:8px;' + '">' + '</div>'; }else{ html += '<div class="game-chat-message">' + '<span class="game-chat-name">' + name + ': </span>' + message + '</div>'; } } gameChatMessages.innerHTML = html; if(wasNearBottom){ gameChatMessages.scrollTop = gameChatMessages.scrollHeight; }else{ gameChatMessages.scrollTop = oldScroll; } } /* ========================================================= SEND CHAT ========================================================= */ async function sendGameChat(){ if(gameChatSending){ return; } if(!GAME_CHAT_STATION){ return; } const name = gameChatNameInput.value.trim() || "Anon"; const message = gameChatMessageInput.value.trim(); if(!message){ return; } gameChatSending = true; gameChatSend.disabled = true; try{ await fetch( CHAT_API, { method:"POST", body:JSON.stringify({ action: "send", station: GAME_CHAT_STATION, stationName: GAME_CHAT_NAME, name: name, message: message }) } ); gameChatMessageInput.value = ""; await loadGameChat(); gameChatMessageInput.focus(); }catch(error){ console.error( "[OBVYRIS CHAT] " + "Send failed:", error ); } setTimeout( function(){ gameChatSending = false; gameChatSend.disabled = false; }, 700 ); } /* ========================================================= SEND BUTTON ========================================================= */ gameChatSend.addEventListener( "click", function(event){ event.preventDefault(); event.stopPropagation(); sendGameChat(); } ); /* ========================================================= ENTER TO SEND ========================================================= */ gameChatMessageInput.addEventListener( "keydown", function(event){ if( event.key === "Enter" ){ event.preventDefault(); sendGameChat(); } } ); /* ========================================================= HTML ESCAPING ========================================================= */ function escapeHTML(value){ return String(value) .replace( /&/g, "&amp;" ) .replace( /</g, "&lt;" ) .replace( />/g, "&gt;" ) .replace( /"/g, "&quot;" ) .replace( /'/g, "&#039;" ); } function escapeAttribute(value){ return String(value) .replace( /&/g, "&amp;" ) .replace( /"/g, "&quot;" ) .replace( /</g, "&lt;" ) .replace( />/g, "&gt;" ); } /* ========================================================= CHAT INITIALIZATION ========================================================= */ console.log( "[OBVYRIS CHAT] " + "Game chat initialized" ); console.log( "[OBVYRIS CHAT] Game ID:", gameID ); console.log( "[OBVYRIS CHAT] Station:", GAME_CHAT_STATION ); console.log( "[OBVYRIS CHAT] Game:", GAME_CHAT_NAME ); /* ========================================================= INITIALIZE MOBILE SETTINGS ========================================================= */ configureMobileControls(); /* ========================================================= START ========================================================= */ main(); </script> </body> </html>
