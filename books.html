<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Audiobook Obvyris</title>

<style>

:root{
--bg:#09111d;
--panel:#111827;
--line:#253347;
--text:white;
--muted:#93a4bb;
--blue:#2793ff;
}

body.light{
--bg:#f4f6f8;
--panel:white;
--line:#ddd;
--text:#102a43;
--muted:#627d98;
}

*{
box-sizing:border-box;
}

body{
margin:0;
height:100vh;
overflow:hidden;
font-family:Arial,sans-serif;
background:var(--bg);
color:var(--text);
}


.app{
display:flex;
height:100vh;
}


.sidebar{

width:260px;
background:var(--panel);
border-right:1px solid var(--line);
padding:20px;

}


.logo{

font-size:32px;
font-weight:900;
margin-bottom:20px;

}

.logo span{
color:var(--blue);
}


button{

background:var(--blue);
color:white;
border:0;
padding:10px 15px;
border-radius:10px;
cursor:pointer;
font-weight:bold;

}


.menu button{

width:100%;
margin-bottom:10px;

}



.main{

flex:1;
padding:20px;
overflow:auto;
padding-bottom:120px;

}



input{

width:100%;
padding:12px;
border-radius:10px;
border:1px solid var(--line);
background:var(--panel);
color:var(--text);
margin-bottom:15px;

}



.cards{

display:grid;
gap:15px;

}



.card{

display:flex;
gap:15px;
background:var(--panel);
border:1px solid var(--line);
border-radius:15px;
padding:15px;

}



.cover{

width:100px;
height:130px;
object-fit:cover;
border-radius:10px;

}



.title{

font-size:24px;
font-weight:bold;

}



.small{

color:var(--muted);
font-size:14px;

}



.player{

position:fixed;
bottom:0;
left:0;
right:0;

background:var(--panel);
border-top:1px solid var(--line);

padding:10px;

display:flex;
align-items:center;
gap:15px;

}



#coverPlayer{

width:50px;
height:50px;
border-radius:8px;

}



.progress{

flex:1;

}



@media(max-width:800px){

.app{
flex-direction:column;
}

.sidebar{

width:100%;

}

.card{

flex-direction:column;

}

.cover{

width:100%;
height:220px;

}

.player{

flex-wrap:wrap;

}

}

</style>

</head>


<body>


<div class="app">


<div class="sidebar">

<div class="logo">
Book <span>Obvyris</span>
</div>


<div class="menu">

<button onclick="loadBooks()">
📚 Books
</button>


<button onclick="loadFavorites()">
⭐ Favorites
</button>


<button onclick="toggleTheme()">
🌙 Theme
</button>


</div>

</div>



<div class="main">


<h1 id="heading">
Audiobooks
</h1>


<input 
id="search"
placeholder="🔎 Search books..."
oninput="searchBooks()"
>


<div id="list" class="cards"></div>


</div>


</div>





<div class="player">


<img id="coverPlayer"
src="https://mikos5.github.io/tester/navicon.png">


<div>

<div id="now">
Not Playing
</div>

<div id="chapter">
</div>

</div>


<button onclick="previous()">
⏮
</button>


<button onclick="playPause()">
▶️
</button>


<button onclick="next()">
⏭
</button>


<input 
id="progress"
class="progress"
type="range"
min="0"
max="100"
>


<audio id="audio"></audio>


</div>




<script>


const API =
"https://librivox.org/api/feed/audiobooks/";


let books=[];

let favorites=
JSON.parse(
localStorage.getItem("favorites")||"[]"
);


let current=null;

let chapters=[];

let chapter=0;



async function loadBooks(){


let res =
await fetch(
API+
"?format=json&extended=1&limit=50"
);


let data =
await res.json();


books=data.books||[];

render(books);

}



function render(list){


let box=
document.getElementById("list");


box.innerHTML="";


list.forEach((b,i)=>{


box.innerHTML+=`

<div class="card">


<img class="cover"
src="${b.coverart_jpg ||
'https://mikos5.github.io/tester/navicon.png'}">


<div>


<div class="title">
${b.title}
</div>


<div class="small">
${b.authors?.map(
a=>a.first_name+" "+a.last_name
).join(", ")||"Unknown"}
</div>


<br>


<button onclick="openBook(${i})">
▶ Play
</button>


<button onclick="favorite(${i})">
⭐
</button>


</div>


</div>

`;

});


}



function searchBooks(){

let q=
document
.getElementById("search")
.value
.toLowerCase();


render(
books.filter(
b=>
b.title.toLowerCase()
.includes(q)
)
);


}



function openBook(i){


current=books[i];


chapters=
current.sections||
current.parts||
[];


chapter=0;


playChapter();

}



function playChapter(){


if(!chapters[chapter])
return;


let c=
chapters[chapter];


let url=
c.listen_url||
c.url;


let audio=
document.getElementById("audio");


audio.src=url;

audio.play();


document.getElementById("now")
.innerText=current.title;


document.getElementById("chapter")
.innerText=
"Chapter "+(chapter+1);


document.getElementById("coverPlayer")
.src=
current.coverart_jpg;


}



function playPause(){

let a=
document.getElementById("audio");


a.paused?
a.play():
a.pause();

}



function next(){

if(chapter < chapters.length-1){

chapter++;
playChapter();

}

}



function previous(){

if(chapter>0){

chapter--;
playChapter();

}

}



function favorite(i){

let id=
books[i].id;


if(favorites.includes(id)){

favorites=
favorites.filter(x=>x!=id);

}else{

favorites.push(id);

}


localStorage.setItem(
"favorites",
JSON.stringify(favorites)
);


}



function loadFavorites(){

render(
books.filter(
b=>favorites.includes(b.id)
)
);

}



function toggleTheme(){

document.body.classList.toggle("light");

}



let audio=
document.getElementById("audio");


audio.addEventListener(
"timeupdate",
()=>{

if(audio.duration){

document.getElementById("progress").value=
(audio.currentTime/audio.duration)*100;

}

});


document
.getElementById("progress")
.oninput=function(){

audio.currentTime=
audio.duration*(this.value/100);

};



loadBooks();


</script>


</body>
</html>
