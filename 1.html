<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Video Obvyris</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

*{box-sizing:border-box}

body{
margin:0;
background:#111;
color:white;
font-family:Arial,Helvetica,sans-serif;
}

header{
height:60px;
background:#1b1b1b;
display:flex;
align-items:center;
padding:0 20px;
font-size:24px;
font-weight:bold;
}

#layout{
display:grid;
grid-template-columns:360px 1fr;
height:calc(100vh - 60px);
}

#sidebar{
background:#151515;
display:flex;
flex-direction:column;
overflow:hidden;
}

#search{
width:100%;
padding:14px;
background:#222;
color:white;
border:0;
font-size:16px;
outline:none;
}

#count{
padding:10px;
color:#aaa;
background:#181818;
}

#channels{
overflow:auto;
flex:1;
}

.channel{
padding:12px;
border-bottom:1px solid #292929;
cursor:pointer;
}

.channel:hover{
background:#292929;
}

.channel.active{
background:#0066ff;
}

.name{
font-weight:bold;
}

.status{
font-size:12px;
color:#7cff7c;
}


#playerArea{
display:flex;
flex-direction:column;
}

#now{
padding:15px;
background:#222;
font-size:20px;
}

video{
flex:1;
width:100%;
height:100%;
background:black;
}


@media(max-width:800px){

#layout{
grid-template-columns:1fr;
}

#sidebar{
height:300px;
}

}

</style>

</head>


<body>


<header>
📺 Video Obvyris
</header>


<div id="layout">


<div id="sidebar">

<input id="search" placeholder="Search channels">

<div id="count">
Loading channels...
</div>

<div id="channels"></div>

</div>



<div id="playerArea">

<div id="now">
Select Channel
</div>

<video id="video" controls autoplay playsinline></video>

</div>


</div>



<script>


const API =
"https://script.google.com/macros/s/AKfycbwBAaTs5v5taswwxQBJIpxW-jgG-ZbyY1zFVjN5W0bMcdFup9exPK-wquqRQIRU-Aqpow/exec?action=list";


let streams=[];
let hls=null;
let current=null;



async function loadChannels(){

try{


const res = await fetch(
API+"&t="+Date.now()
);


const data = await res.json();


console.log("API:",data);



if(!data.streams){

throw new Error("No streams returned");

}


streams=data.streams;



document.getElementById("count").innerHTML =
streams.length+" Channels";



render(streams);



if(streams.length){

play(streams[0]);

}



}catch(err){

console.error("API ERROR:",err);

document.getElementById("count").innerHTML =
"API ERROR";

}


}




function render(list){


const box=document.getElementById("channels");

box.innerHTML="";



list.forEach(stream=>{


const div=document.createElement("div");

div.className="channel";



if(current && current.id===stream.id){

div.classList.add("active");

}



div.innerHTML=`

<div class="name">
${stream.name || "Unknown"}
</div>

<div class="status">
${stream.status || ""}
</div>

`;



div.onclick=()=>{

play(stream);

};



box.appendChild(div);



});


}




function play(stream){


current=stream;


const video=document.getElementById("video");


const streamURL =
stream.source || stream.url;



console.log(
"Loading Stream:",
streamURL
);



document.getElementById("now").innerHTML =
stream.name || "Unknown";



render(streams);



if(!streamURL){

console.error(
"No URL found",
stream
);

return;

}



if(hls){

hls.destroy();

hls=null;

}



if(Hls.isSupported()){


hls=new Hls({

enableWorker:true,
lowLatencyMode:true

});



hls.loadSource(streamURL);


hls.attachMedia(video);



hls.on(
Hls.Events.MANIFEST_PARSED,
()=>{


console.log(
"STREAM READY"
);


video.play()
.catch(console.log);


});




hls.on(
Hls.Events.ERROR,
(event,data)=>{


console.error(
"HLS ERROR:",
data
);



if(data.fatal){

switch(data.type){


case Hls.ErrorTypes.NETWORK_ERROR:

console.log(
"Network retry"
);

hls.startLoad();

break;



case Hls.ErrorTypes.MEDIA_ERROR:

console.log(
"Media recovery"
);

hls.recoverMediaError();

break;



default:

hls.destroy();

break;


}

}


});



}

else if(video.canPlayType(
"application/vnd.apple.mpegurl"
)){


video.src=streamURL;

video.play();



}

else{


alert(
"HLS not supported"
);


}


}





document
.getElementById("search")
.addEventListener(
"input",
e=>{


const q=e.target.value.toLowerCase();



render(

streams.filter(s=>

(s.name||"")
.toLowerCase()
.includes(q)

)

);


});





loadChannels();


</script>


</body>
</html>
