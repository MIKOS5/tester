<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>OBVYRIS // CODE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#03070a;
    color:#dceff1;
    font-family:Inter,Arial,sans-serif;
}

/* =========================================================
   BACKGROUND
========================================================= */

body{
    background:
        radial-gradient(
            circle at 50% -20%,
            rgba(0,255,190,.10),
            transparent 38%
        ),
        radial-gradient(
            circle at 100% 100%,
            rgba(0,180,255,.06),
            transparent 35%
        ),
        #03070a;
}

body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.18;

    background-image:
        linear-gradient(
            rgba(0,255,190,.035) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0,255,190,.035) 1px,
            transparent 1px
        );

    background-size:40px 40px;

    mask-image:linear-gradient(
        to bottom,
        black,
        transparent 90%
    );
}

/* =========================================================
   TOP BAR
========================================================= */

#topbar{

    position:absolute;
    top:0;
    left:0;
    right:0;

    height:58px;

    display:flex;
    align-items:center;

    padding:0 12px;

    gap:7px;

    background:
        linear-gradient(
            180deg,
            rgba(7,18,22,.98),
            rgba(3,10,13,.98)
        );

    border-bottom:1px solid rgba(0,255,190,.18);

    box-shadow:
        0 5px 25px rgba(0,0,0,.45);

    z-index:100;
}

/* =========================================================
   BRAND
========================================================= */

.logo{

    font-family:Orbitron,sans-serif;

    font-size:14px;
    font-weight:700;

    letter-spacing:3px;

    color:#cffff6;

    white-space:nowrap;

    text-shadow:
        0 0 10px rgba(0,255,190,.35);

    margin-right:12px;
}

.logo span{
    color:#00ffb7;
}

/* =========================================================
   BUTTONS
========================================================= */

button{

    appearance:none;

    border:1px solid rgba(0,255,190,.14);

    border-radius:4px;

    padding:7px 12px;

    background:
        linear-gradient(
            180deg,
            rgba(17,34,38,.95),
            rgba(8,18,22,.95)
        );

    color:#91aeb2;

    font-family:Inter,sans-serif;

    font-size:11px;
    font-weight:600;

    letter-spacing:1px;

    cursor:pointer;

    transition:
        .15s ease;

    box-shadow:
        inset 0 0 10px rgba(0,255,190,.015);
}

button:hover{

    color:#dffff8;

    border-color:rgba(0,255,190,.4);

    background:
        linear-gradient(
            180deg,
            rgba(18,48,49,.95),
            rgba(7,27,28,.95)
        );

    box-shadow:
        0 0 12px rgba(0,255,190,.08);
}

#runBtn{

    color:#00130d;

    background:#00d99b;

    border-color:#00ffb7;

    font-family:Orbitron,sans-serif;

    font-size:10px;
    font-weight:700;

    letter-spacing:1.5px;

    box-shadow:
        0 0 14px rgba(0,255,183,.16);
}

#runBtn:hover{

    color:#00130d;

    background:#00ffb7;

    box-shadow:
        0 0 20px rgba(0,255,183,.28);
}

#themeBtn{
    margin-left:auto;
}

/* =========================================================
   MAIN
========================================================= */

#container{

    position:absolute;

    top:58px;
    bottom:0;
    left:0;
    right:0;

    display:flex;
    flex-direction:row;

    padding:8px;

    gap:0;

    background:transparent;
}

/* =========================================================
   PANELS
========================================================= */

#editorPane,
#previewPane{

    position:relative;

    width:50%;
    height:100%;

    min-width:0;
    min-height:0;
}

/* =========================================================
   PANEL HEADER
========================================================= */

#editorPane:before,
#previewPane:before{

    position:absolute;

    top:0;
    left:10px;

    height:24px;

    display:flex;
    align-items:center;

    font-family:Orbitron,sans-serif;

    font-size:8px;
    letter-spacing:2px;

    color:#4c777b;

    z-index:5;

    pointer-events:none;
}

#editorPane:before{
    content:"SOURCE // HTML";
}

#previewPane:before{
    content:"OUTPUT // LIVE";
}

/* =========================================================
   EDITOR WRAPPER
========================================================= */

#editorWrapper{

    width:100%;
    height:100%;

    overflow:hidden;

    position:relative;

    padding-top:24px;

    background:
        linear-gradient(
            180deg,
            rgba(6,17,21,.98),
            rgba(3,10,13,.98)
        );

    border:1px solid rgba(0,255,190,.15);

    border-radius:6px;

    box-shadow:
        inset 0 0 35px rgba(0,255,190,.018),
        0 10px 30px rgba(0,0,0,.35);
}

/* =========================================================
   EDITOR TOP LINE
========================================================= */

#editorWrapper:after{

    content:"";

    position:absolute;

    left:10px;
    right:10px;
    top:25px;

    height:1px;

    background:
        linear-gradient(
            90deg,
            rgba(0,255,190,.22),
            transparent
        );

    pointer-events:none;
}

/* =========================================================
   TEXTAREA
========================================================= */

#textareaCode{

    width:100%;
    height:calc(100% - 1px);

    resize:none;

    outline:none;
    border:0;

    padding:14px;

    background:
        linear-gradient(
            90deg,
            rgba(0,255,190,.018),
            transparent 80px
        ),
        #050d10;

    color:#b9d4d5;

    font-family:
        Consolas,
        "Courier New",
        monospace;

    font-size:14px;

    line-height:1.55;

    tab-size:4;

    caret-color:#00ffb7;

    scrollbar-color:
        #173437
        transparent;
}

#textareaCode::selection{
    background:rgba(0,255,190,.18);
}

/* =========================================================
   PREVIEW
========================================================= */

#previewWrapper{

    width:100%;
    height:100%;

    position:relative;

    overflow:hidden;

    background:#fff;

    border:1px solid rgba(0,255,190,.15);

    border-radius:6px;

    box-shadow:
        0 10px 30px rgba(0,0,0,.4);
}

#iframeResult{

    width:100%;
    height:100%;

    display:block;

    border:0;

    background:#fff;
}

/* =========================================================
   DIVIDER
========================================================= */

#dragbar{

    width:7px;
    height:100%;

    flex-shrink:0;

    cursor:col-resize;

    position:relative;

    background:transparent;

    z-index:20;
}

#dragbar:after{

    content:"";

    position:absolute;

    top:50%;

    left:50%;

    transform:translate(-50%,-50%);

    width:3px;
    height:70px;

    border-radius:3px;

    background:
        linear-gradient(
            180deg,
            transparent,
            #245255,
            transparent
        );

    transition:.15s ease;
}

#dragbar:hover:after{

    height:100px;

    background:
        linear-gradient(
            180deg,
            transparent,
            #00cfa0,
            transparent
        );

    box-shadow:
        0 0 12px rgba(0,255,190,.25);
}

/* =========================================================
   STATUS
========================================================= */

#status{

    position:absolute;

    bottom:15px;
    left:18px;

    padding:4px 8px;

    background:rgba(2,10,12,.9);

    border:1px solid rgba(0,255,190,.12);

    border-radius:3px;

    color:#507276;

    font-family:monospace;

    font-size:9px;

    letter-spacing:1px;

    pointer-events:none;

    z-index:50;
}

#status:before{

    content:"●";

    color:#00d99b;

    margin-right:6px;

    text-shadow:
        0 0 7px #00ffb7;
}

/* =========================================================
   VERTICAL MODE
========================================================= */

#container.vertical{

    flex-direction:column;
}

#container.vertical #editorPane{

    width:100%;
    height:50%;
}

#container.vertical #previewPane{

    width:100%;
    height:50%;
}

#container.vertical #dragbar{

    width:100%;
    height:7px;

    cursor:row-resize;
}

#container.vertical #dragbar:after{

    width:70px;
    height:3px;
}

#container.vertical #dragbar:hover:after{

    width:100px;
    height:3px;
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:768px){

    #topbar{

        height:52px;

        padding:0 7px;

        gap:4px;
    }

    #container{

        top:52px;

        padding:5px;
    }

    .logo{

        font-size:10px;
        letter-spacing:2px;

        margin-right:3px;
    }

    button{

        padding:7px 8px;

        font-size:9px;

        letter-spacing:.5px;
    }

    #runBtn{

        padding-left:9px;
        padding-right:9px;
    }

    #container{

        flex-direction:column;
    }

    #editorPane{

        width:100%;
        height:50%;
    }

    #previewPane{

        width:100%;
        height:50%;
    }

    #dragbar{

        width:100%;
        height:7px;

        cursor:row-resize;
    }

    #dragbar:after{

        width:65px;
        height:3px;
    }

    #textareaCode{

        font-size:13px;
    }

    #themeBtn{

        margin-left:0;
    }
}

/* =========================================================
   VERY SMALL SCREENS
========================================================= */

@media(max-width:430px){

    .logo{
        display:none;
    }

    #topbar{
        justify-content:flex-start;
    }

    #themeBtn{
        margin-left:auto;
    }

}

/* =========================================================
   SCANLINE EFFECT
========================================================= */

#container:after{

    content:"";

    position:absolute;

    inset:0;

    pointer-events:none;

    background:
        repeating-linear-gradient(
            0deg,
            rgba(255,255,255,.008) 0px,
            rgba(255,255,255,.008) 1px,
            transparent 1px,
            transparent 4px
        );

    opacity:.18;

    z-index:30;
}

/* =========================================================
   LIGHT MODE
========================================================= */

body.light{

    background:#dce5e6;
    color:#172426;
}

body.light #topbar{

    background:#edf4f4;

    border-bottom-color:
        rgba(0,100,90,.2);
}

body.light #container{
    background:#dce5e6;
}

body.light #editorWrapper{

    background:#fff;

    border-color:
        rgba(0,100,90,.2);
}

body.light #textareaCode{

    background:#fff;

    color:#193033;
}

body.light button{

    background:#e2ebeb;

    color:#315054;

    border-color:#b8cecf;
}

body.light #dragbar:after{

    background:
        linear-gradient(
            180deg,
            transparent,
            #78999b,
            transparent
        );
}

body.light #status{

    background:rgba(240,250,250,.9);

    color:#527276;
}

</style>
</head>

<body>

<!-- =======================================================
     TOP BAR
======================================================= -->

<div id="topbar">

    <div class="logo">
        OBVYRIS <span>//</span> CODE
    </div>

    <button
        id="runBtn"
        onclick="runCode()">
        RUN ▶
    </button>

    <button
        onclick="toggleLayout()"
        title="Change layout">
        ⇄
    </button>

    <button
        onclick="clearCode()">
        CLEAR
    </button>

    <button
        onclick="downloadCode()">
        SAVE
    </button>

    <button
        id="themeBtn"
        onclick="toggleTheme()">
        ☾
    </button>

</div>


<!-- =======================================================
     EDITOR / PREVIEW
======================================================= -->

<div id="container">

    <div id="editorPane">

        <div id="editorWrapper">

<textarea
id="textareaCode"
spellcheck="false"
autocomplete="off"><!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>OBVYRIS</title>

<style>

body{
    margin:0;
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#050b0d;

    color:#dffff8;

    font-family:Arial,sans-serif;

    text-align:center;
}

.box{
    padding:40px;
}

h1{

    font-family:Arial,sans-serif;

    letter-spacing:8px;

    color:#00ffb7;

    text-shadow:
        0 0 20px rgba(0,255,183,.5);
}

p{
    color:#79979a;
}

button{

    padding:12px 24px;

    border:1px solid #00b98a;

    background:#061714;

    color:#00ffb7;

    cursor:pointer;

    border-radius:4px;
}

button:hover{
    background:#00ffb7;
    color:#00130d;
}

</style>

</head>

<body>

<div class="box">

<h1>OBVYRIS</h1>

<p>LIVE HTML ENVIRONMENT</p>

<button onclick="testObvyris()">
TEST SYSTEM
</button>

</div>

<script>

function testObvyris(){

    alert("OBVYRIS SYSTEM ONLINE");

}

<\/script>

</body>

</html></textarea>

        </div>

    </div>


    <div id="dragbar"></div>


    <div id="previewPane">

        <div id="previewWrapper">

            <iframe
                id="iframeResult"
                title="OBVYRIS Live Preview"
                allowfullscreen>
            </iframe>

        </div>

    </div>

</div>


<div id="status">
    READY
</div>


<script>

/* =========================================================
   ELEMENTS
========================================================= */

const container =
    document.getElementById("container");

const editor =
    document.getElementById("textareaCode");

const iframe =
    document.getElementById("iframeResult");

const dragbar =
    document.getElementById("dragbar");

const status =
    document.getElementById("status");


/* =========================================================
   RUN CODE
========================================================= */

function runCode(){

    const code = editor.value;

    const doc =
        iframe.contentDocument ||
        iframe.contentWindow.document;

    doc.open();

    doc.write(code);

    doc.close();

    status.textContent =
        "OUTPUT UPDATED";

    setTimeout(function(){

        status.textContent =
            "READY";

    },1200);

}


/* =========================================================
   CTRL + ENTER
========================================================= */

editor.addEventListener(
    "keydown",
    function(event){

        if(
            event.ctrlKey &&
            event.key === "Enter"
        ){

            event.preventDefault();

            runCode();

        }

    }
);


/* =========================================================
   TAB SUPPORT
========================================================= */

editor.addEventListener(
    "keydown",
    function(event){

        if(event.key !== "Tab"){
            return;
        }

        event.preventDefault();

        const start =
            editor.selectionStart;

        const end =
            editor.selectionEnd;

        editor.value =
            editor.value.substring(
                0,
                start
            ) +
            "    " +
            editor.value.substring(
                end
            );

        editor.selectionStart =
            editor.selectionEnd =
                start + 4;

    }
);


/* =========================================================
   CLEAR
========================================================= */

function clearCode(){

    if(
        !confirm(
            "Clear the editor?"
        )
    ){
        return;
    }

    editor.value = "";

    runCode();

}


/* =========================================================
   SAVE
========================================================= */

function downloadCode(){

    const blob =
        new Blob(
            [editor.value],
            {
                type:"text/html"
            }
        );

    const url =
        URL.createObjectURL(blob);

    const link =
        document.createElement("a");

    link.href = url;

    link.download =
        "obvyris.html";

    document.body.appendChild(link);

    link.click();

    link.remove();

    URL.revokeObjectURL(url);

    status.textContent =
        "FILE SAVED";

    setTimeout(function(){

        status.textContent =
            "READY";

    },1200);

}


/* =========================================================
   LAYOUT
========================================================= */

function toggleLayout(){

    container.classList.toggle(
        "vertical"
    );

}


/* =========================================================
   THEME
========================================================= */

function toggleTheme(){

    document.body.classList.toggle(
        "light"
    );

    const light =
        document.body.classList.contains(
            "light"
        );

    localStorage.setItem(
        "obvyrisEditorTheme",
        light ? "light" : "dark"
    );

    document.getElementById(
        "themeBtn"
    ).textContent =
        light ? "☀" : "☾";

}


/* =========================================================
   RESTORE THEME
========================================================= */

if(
    localStorage.getItem(
        "obvyrisEditorTheme"
    ) === "light"
){

    document.body.classList.add(
        "light"
    );

    document.getElementById(
        "themeBtn"
    ).textContent = "☀";

}


/* =========================================================
   DRAG RESIZER
========================================================= */

let dragging = false;


function startDrag(event){

    event.preventDefault();

    dragging = true;

    document.body.style.userSelect =
        "none";

}


function moveDrag(event){

    if(!dragging){
        return;
    }

    const rect =
        container.getBoundingClientRect();

    const vertical =
        container.classList.contains(
            "vertical"
        );


    /* SIDE BY SIDE */

    if(!vertical){

        let x =
            event.clientX -
            rect.left;

        let percentage =
            (x / rect.width) * 100;

        percentage =
            Math.max(
                10,
                Math.min(
                    90,
                    percentage
                )
            );

        document.getElementById(
            "editorPane"
        ).style.width =
            percentage + "%";

        document.getElementById(
            "previewPane"
        ).style.width =
            (100 - percentage) + "%";

    }


    /* TOP / BOTTOM */

    else{

        let y =
            event.clientY -
            rect.top;

        let percentage =
            (y / rect.height) * 100;

        percentage =
            Math.max(
                10,
                Math.min(
                    90,
                    percentage
                )
            );

        document.getElementById(
            "editorPane"
        ).style.height =
            percentage + "%";

        document.getElementById(
            "previewPane"
        ).style.height =
            (100 - percentage) + "%";

    }

}


function endDrag(){

    dragging = false;

    document.body.style.userSelect =
        "";

}


/* =========================================================
   MOUSE
========================================================= */

dragbar.addEventListener(
    "mousedown",
    startDrag
);

window.addEventListener(
    "mousemove",
    moveDrag
);

window.addEventListener(
    "mouseup",
    endDrag
);


/* =========================================================
   TOUCH
========================================================= */

dragbar.addEventListener(
    "touchstart",
    function(event){

        event.preventDefault();

        dragging = true;

    },
    {
        passive:false
    }
);


window.addEventListener(
    "touchmove",
    function(event){

        if(!dragging){
            return;
        }

        event.preventDefault();

        const touch =
            event.touches[0];

        moveDrag(touch);

    },
    {
        passive:false
    }
);


window.addEventListener(
    "touchend",
    endDrag
);


/* =========================================================
   INITIALIZE
========================================================= */

window.addEventListener(
    "load",
    function(){

        runCode();

    }
);

</script>

</body>
</html>
