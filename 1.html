<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Video Obvyris</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

body{
    margin:0;
    background:#111;
    color:white;
    font-family:Arial,sans-serif;
}

header{
    background:#1b1b1b;
    padding:15px;
    font-size:24px;
    font-weight:bold;
}

#container{
    display:flex;
    height:calc(100vh - 60px);
}

#sidebar{

    width:340px;
    overflow:auto;
    background:#181818;
    border-right:1px solid #333;

}

.station{

    display:flex;
    gap:10px;
    align-items:center;
    padding:10px;
    cursor:pointer;
    border-bottom:1px solid #2d2d2d;

}

.station:hover{

    background:#2a2a2a;

}

.station img{

    width:60px;
    height:60px;
    object-fit:contain;
    background:#000;

}

.stationName{

    font-weight:bold;

}

.status{

    color:#66ff66;
    font-size:12px;

}

#player{

    flex:1;
    display:flex;
    flex-direction:column;

}

video{

    width:100%;
    height:100%;
    background:black;

}

#info{

    padding:12px;
    background:#202020;

}

</style>

</head>

<body>

<header>

Video Obvyris

</header>

<div id="container">

<div id="sidebar"></div>

<div id="player">

<div id="info">

<h2 id="title">Loading...</h2>

<div id="group"></div>

<div id="country"></div>

</div>

<video
id="video"
controls
autoplay
playsinline></video>

</div>

</div>

<script>

const API="https://script.google.com/macros/s/AKfycbwBAaTs5v5taswwxQBJIpxW-jgG-ZbyY1zFVjN5W0bMcdFup9exPK-wquqRQIRU-Aqpow/exec";

let hls;

async function loadStations(){

    const res=await fetch(API+"?action=list");

    const data=await res.json();

    const sidebar=document.getElementById("sidebar");

    sidebar.innerHTML="";

    data.streams.forEach(stream=>{

        const div=document.createElement("div");

        div.className="station";

        div.innerHTML=`

        <img src="${stream.Logo || 'https://placehold.co/60x60?text=TV'}">

        <div>

            <div class="stationName">

            ${stream.Name}

            </div>

            <div>${stream.Group || ""}</div>

            <div class="status">

            ${stream.Status}

            </div>

        </div>

        `;

        div.onclick=()=>play(stream);

        sidebar.appendChild(div);

    });

    if(data.streams.length){

        play(data.streams[0]);

    }

}

function play(stream){

    document.getElementById("title").innerText=stream.Name;

    document.getElementById("group").innerText=
    "Group: "+(stream.Group||"");

    document.getElementById("country").innerText=
    "Country: "+(stream.Country||"");

    const video=document.getElementById("video");

    if(hls){

        hls.destroy();

    }

    if(Hls.isSupported()){

        hls=new Hls();

        hls.loadSource(stream.URL);

        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED,function(){

            video.play();

        });

    }

    else if(video.canPlayType("application/vnd.apple.mpegurl")){

        video.src=stream.URL;

        video.play();

    }

}

loadStations();

</script>

</body>
</html>
