<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Video Obvyris</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    background:#111;
    color:#fff;
    font-family:Arial,sans-serif;
}
header{
    background:#1f1f1f;
    padding:15px;
    font-size:22px;
    font-weight:bold;
}
#layout{
    display:grid;
    grid-template-columns:350px 1fr;
    height:calc(100vh - 55px);
}
#sidebar{
    overflow:auto;
    border-right:1px solid #333;
}
#search{
    width:100%;
    padding:12px;
    border:none;
    outline:none;
    font-size:16px;
}
.channel{
    padding:10px;
    border-bottom:1px solid #222;
    cursor:pointer;
}
.channel:hover{
    background:#2d2d2d;
}
.channel .name{
    font-weight:bold;
}
.channel .status{
    color:#7cff7c;
    font-size:12px;
}
#playerArea{
    display:flex;
    flex-direction:column;
}
#title{
    padding:12px;
    background:#222;
    font-size:20px;
}
video{
    width:100%;
    height:100%;
    background:#000;
}
</style>
</head>

<body>

<header>Video Obvyris</header>

<div id="layout">

<div id="sidebar">
<input id="search" placeholder="Search channels...">
<div id="list"></div>
</div>

<div id="playerArea">
<div id="title">Loading...</div>
<video id="video" controls autoplay playsinline></video>
</div>

</div>

<script>

const API="https://script.google.com/macros/s/AKfycbwBAaTs5v5taswwxQBJIpxW-jgG-ZbyY1zFVjN5W0bMcdFup9exPK-wquqRQIRU-Aqpow/exec?action=list";

let streams=[];
let hls;

async function load(){

    const res=await fetch(API);
    const data=await res.json();

    streams=data.streams||[];

    render(streams);

    if(streams.length){
        play(streams[0]);
    }

}

function render(items){

    const list=document.getElementById("list");

    list.innerHTML="";

    items.forEach(stream=>{

        const div=document.createElement("div");

        div.className="channel";

        div.innerHTML=`
            <div class="name">${stream.name}</div>
            <div class="status">${stream.status}</div>
        `;

        div.onclick=()=>play(stream);

        list.appendChild(div);

    });

}

function play(stream){

    document.getElementById("title").textContent=stream.name;

    const video=document.getElementById("video");

    if(hls){
        hls.destroy();
    }

    if(Hls.isSupported()){

        hls=new Hls({
            enableWorker:true
        });

        hls.loadSource(stream.url);

        hls.attachMedia(video);

        hls.on(Hls.Events.ERROR,function(event,data){

            if(data.fatal){

                switch(data.type){

                    case Hls.ErrorTypes.NETWORK_ERROR:
                        hls.startLoad();
                        break;

                    case Hls.ErrorTypes.MEDIA_ERROR:
                        hls.recoverMediaError();
                        break;

                    default:
                        hls.destroy();
                        break;
                }

            }

        });

    }else{

        video.src=stream.url;

    }

}

document.getElementById("search").addEventListener("input",e=>{

    const q=e.target.value.toLowerCase();

    render(
        streams.filter(s=>
            (s.name||"").toLowerCase().includes(q)
        )
    );

});

load();

</script>

</body>
</html>
