<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Video Obvyris</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>

*{box-sizing:border-box}

body{
margin:0;
background:#111;
color:white;
font-family:Arial,Helvetica,sans-serif;
}

header{
height:60px;
background:#1b1b1b;
display:flex;
align-items:center;
padding:0 20px;
font-size:24px;
font-weight:bold;
}

#layout{
display:grid;
grid-template-columns:360px 1fr;
height:calc(100vh - 60px);
}

#sidebar{
background:#151515;
display:flex;
flex-direction:column;
overflow:hidden;
}

#search{
width:100%;
padding:14px;
background:#222;
color:white;
border:0;
font-size:16px;
outline:none;
}

#count{
padding:10px;
color:#aaa;
background:#181818;
}

#channels{
overflow:auto;
flex:1;
}

.channel{
padding:12px;
border-bottom:1px solid #292929;
cursor:pointer;
}

.channel:hover{
background:#292929;
}

.channel.active{
background:#0066ff;
}

.name{
font-weight:bold;
}

.status{
font-size:12px;
color:#7cff7c;
}


#playerArea{
display:flex;
flex-direction:column;
}

#now{
padding:15px;
background:#222;
font-size:20px;
}

video{
flex:1;
width:100%;
height:100%;
background:black;
}


@media(max-width:800px){

#layout{
grid-template-columns:1fr;
}

#sidebar{
height:300px;
}

}

</style>

</head>


<body>


<header>
📺 Video Obvyris
</header>


<div id="layout">


<div id="sidebar">

<input id="search" placeholder="Search channels">

<div id="count">
Loading channels...
</div>

<div id="channels"></div>

</div>



<div id="playerArea">

<div id="now">
Select Channel
</div>

<video id="video" controls autoplay playsinline></video>

</div>


</div>

<script>


const API =
"https://script.google.com/macros/s/AKfycbwBAaTs5v5taswwxQBJIpxW-jgG-ZbyY1zFVjN5W0bMcdFup9exPK-wquqRQIRU-Aqpow/exec";


let streams=[];
let hls=null;
let current=null;



async function loadChannels(){

try{


let res =
await fetch(
API+"?action=list&t="+Date.now()
);


let data =
await res.json();


console.log(data);



streams=data.streams;



document.getElementById("count").innerHTML =
streams.length+" Channels";


render(streams);



if(streams.length){

play(streams[0]);

}



}catch(e){

console.error(e);

}



}




function render(list){

let box =
document.getElementById("channels");


box.innerHTML="";


list.forEach(s=>{


let div =
document.createElement("div");


div.className="channel";



if(current && current.id===s.id){

div.classList.add("active");

}



div.innerHTML=

`
<div class="name">
${s.name}
</div>

<div class="status">
${s.status}
</div>
`;



div.onclick=()=>play(s);



box.appendChild(div);



});


}





function play(stream){


current=stream;



let video =
document.getElementById("video");



document.getElementById("now").innerHTML =
stream.name;



if(hls){

hls.destroy();

}



let url =
stream.source ||
stream.url;



console.log(
"Original:",
url
);



// USE APPS SCRIPT PROXY

let proxyURL =
API+
"?action=proxy&url="+
encodeURIComponent(url);



console.log(
"Proxy:",
proxyURL
);




if(Hls.isSupported()){


hls =
new Hls({

enableWorker:true,

xhrSetup:function(xhr){

xhr.setRequestHeader(
"Accept",
"*/*"
);

}

});



hls.loadSource(proxyURL);


hls.attachMedia(video);



hls.on(
Hls.Events.MANIFEST_PARSED,
()=>{

console.log(
"PLAYING"
);

video.play();

});


hls.on(
Hls.Events.ERROR,
(e,data)=>{

console.error(
"HLS ERROR",
data
);


});



}

else{


video.src=proxyURL;

video.play();


}



}



document
.getElementById("search")
.addEventListener(
"input",
e=>{


let q =
e.target.value.toLowerCase();


render(
streams.filter(
s=>s.name.toLowerCase().includes(q)
)
);


});



loadChannels();
</script>
  
</body>
</html>
