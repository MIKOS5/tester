<!DOCTYPE html>
<html>
<head>
<title>Video Obvyris Pluto Player</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial;
}

#channels{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
    gap:10px;
}

.card{
    background:#222;
    padding:15px;
    border-radius:8px;
    cursor:pointer;
}

.card:hover{
    background:#333;
}

video{
    width:100%;
    max-height:500px;
    background:black;
}

.status{
    margin:10px;
    color:#0f0;
}
</style>

</head>

<body>


<h1>Video Obvyris</h1>

<div class="status" id="status">
Loading channels...
</div>


<video id="video" controls autoplay></video>


<h2>Channels</h2>

<div id="channels"></div>



<script>


const API =
"https://script.google.com/macros/s/AKfycbwBAaTs5v5taswwxQBJIpxW-jgG-ZbyY1zFVjN5W0bMcdFup9exPK-wquqRQIRU-Aqpow/exec";


const video =
document.getElementById("video");


let hls;



async function loadChannels(){


    const res =
    await fetch(
        API+"?action=list&t="+Date.now()
    );


    const data =
    await res.json();



    console.log(data);



    const box =
    document.getElementById("channels");


    box.innerHTML="";


    data.streams.forEach(stream=>{


        let div =
        document.createElement("div");


        div.className="card";


        div.innerHTML=
        `
        <b>${stream.name}</b><br>
        <small>${stream.status}</small>
        `;



        div.onclick=()=>playStream(stream);


        box.appendChild(div);



    });



    document.getElementById("status").innerText =
    data.streams.length+
    " channels loaded";


}





function playStream(stream){


    console.log(
        "Playing:",
        stream.name
    );



    document.getElementById("status").innerText =
    "Loading "+stream.name;



    let proxy =
    API+
    "?action=proxy&url="+
    encodeURIComponent(
        stream.url
    )
    +"&t="+Date.now();



    console.log(proxy);



    if(hls){

        hls.destroy();

    }




    if(
        Hls.isSupported()
    ){


        hls =
        new Hls({

            enableWorker:true,

            lowLatencyMode:false,

            xhrSetup:function(xhr){

                xhr.setRequestHeader(
                    "Accept",
                    "application/vnd.apple.mpegurl,*/*"
                );

            }

        });



        hls.loadSource(proxy);


        hls.attachMedia(video);



        hls.on(
            Hls.Events.MANIFEST_PARSED,
            function(){

                video.play();

                document.getElementById("status").innerText =
                "Playing "+stream.name;

            }
        );



        hls.on(
            Hls.Events.ERROR,
            function(event,data){


                console.error(
                    "HLS ERROR",
                    data
                );


                if(data.fatal){

                    document.getElementById("status").innerText =
                    "Stream error";

                }

            }
        );


    }

    else if(
        video.canPlayType(
            "application/vnd.apple.mpegurl"
        )
    ){

        video.src=proxy;

        video.play();

    }



}





loadChannels();



</script>


</body>
</html>
