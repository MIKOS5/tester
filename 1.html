<!DOCTYPE html>
<html>
<head>

<title>Obvyris Email Creator Index</title>

<meta name="viewport" content="width=device-width,initial-scale=1">


<style>

body{

background:#070d16;
color:#d8e1ec;
font-family:Arial,Helvetica,sans-serif;
margin:15px;
font-size:14px;

}


h1{

color:#2793ff;

}


input,
select,
button{

background:#17263a;
color:white;
border:1px solid #31465f;
padding:8px;
font-size:14px;

}



input{

width:300px;

}



button{

background:#2793ff;
border:none;
cursor:pointer;

}



button:hover{

background:#55b8ff;

}



.card{

background:#101923;
border:1px solid #25384d;
padding:10px;
margin-top:8px;

}



.email{

font-size:16px;
font-weight:bold;
color:#55b8ff;

}



.count{

color:#aaa;
margin-top:5px;

}



</style>

</head>


<body>


<h1>
📧 Obvyris Email Creator Index
</h1>



<input id="search"
placeholder="Search Archive (example: music)">



<select id="type">

<option value="">
All Media
</option>

<option value="audio">
🎵 Audio
</option>

<option value="movies">
🎬 Movies
</option>

<option value="texts">
📚 Texts
</option>

<option value="software">
💾 Software
</option>

</select>



<button onclick="buildEmails()">

BUILD EMAIL ARRAY

</button>



<h3 id="status"></h3>


<div id="results"></div>




<script>


let emails={};



async function buildEmails(){


emails={};



let term =
document.getElementById("search")
.value
.trim();



let type =
document.getElementById("type")
.value;



let query =
term || "mediatype:*";



if(type){

query += " AND mediatype:" + type;

}




let url =

"https://archive.org/advancedsearch.php?q="

+ encodeURIComponent(query)

+ "&fl[]=identifier,title,creator,uploader,contributor,artist,publisher"

+ "&rows=5000"

+ "&output=json";




document.getElementById("status").innerHTML =
"Loading Archive metadata...";




let response =
await fetch(url);



let data =
await response.json();



let docs =
data.response.docs;




docs.forEach(item=>{


let fields=[];



collect(item.creator,fields);

collect(item.uploader,fields);

collect(item.contributor,fields);

collect(item.artist,fields);

collect(item.publisher,fields);





fields.forEach(value=>{


extractEmail(value);


});


});




displayEmails();


}





function collect(value,array){


if(!value)
return;



if(Array.isArray(value)){


value.forEach(v=>{

array.push(v);

});


}

else{


array.push(value);


}


}





function extractEmail(text){


if(!text)
return;



let matches =

String(text).match(

/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/gi

);



if(!matches)
return;



matches.forEach(email=>{


email=email.toLowerCase();



if(!emails[email]){

emails[email]=0;

}


emails[email]++;



});


}





function displayEmails(){



let box =
document.getElementById("results");



box.innerHTML="";



let list =
Object.keys(emails);



list.sort();



document.getElementById("status").innerHTML =

"Unique Email Addresses Found: "

+list.length;




list.forEach(email=>{


box.innerHTML += `


<div class="card">


<div class="email">

📧 ${escapeHTML(email)}

</div>


<div class="count">

Archive Records:
${emails[email]}

</div>


</div>


`;


});



}





function escapeHTML(text){


return String(text)

.replaceAll("&","&amp;")

.replaceAll("<","&lt;")

.replaceAll(">","&gt;")

.replaceAll('"',"&quot;");


}



</script>


</body>

</html>
