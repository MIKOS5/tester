<!DOCTYPE html>
<html>
<head>

<title>Obvyris Creator Index</title>

<meta name="viewport" content="width=device-width,initial-scale=1">

<style>

body{
background:#070d16;
color:#d8e1ec;
font-family:Arial,Helvetica,sans-serif;
margin:15px;
font-size:14px;
}


h1{
color:#2793ff;
}


input,
select,
button{

background:#17263a;
color:white;
border:1px solid #31465f;
padding:8px;
font-size:14px;

}


input{
width:300px;
}


button{

background:#2793ff;
border:none;
cursor:pointer;

}


button:hover{

background:#55b8ff;

}



.card{

background:#101923;
border:1px solid #25384d;
padding:10px;
margin-top:8px;

}



.creator{

font-size:16px;
font-weight:bold;
color:#55b8ff;

}


.count{

color:#aaa;
margin-top:5px;

}


</style>

</head>


<body>


<h1>
🔎 Obvyris Creator Index
</h1>


<input id="search"
placeholder="Search Archive (example: music)">


<select id="type">

<option value="">
All Media
</option>

<option value="audio">
🎵 Audio
</option>

<option value="movies">
🎬 Movies
</option>

<option value="texts">
📚 Texts
</option>

<option value="software">
💾 Software
</option>

</select>


<button onclick="buildCreators()">
BUILD CREATOR ARRAY
</button>


<h3 id="status"></h3>


<div id="results"></div>



<script>


let creators={};



async function buildCreators(){


creators={};



let term =
document.getElementById("search")
.value
.trim();



let type =
document.getElementById("type")
.value;



let query =
term || "*";



if(type){

query += " AND mediatype:" + type;

}



let url =

"https://archive.org/advancedsearch.php?q="

+ encodeURIComponent(query)

+ "&fl[]=identifier,title,creator,uploader,contributor,artist,publisher"

+ "&rows=1000"

+ "&output=json";





document.getElementById("status").innerHTML =
"Loading Archive creators...";




let response =
await fetch(url);



let data =
await response.json();



let docs =
data.response.docs;




docs.forEach(item=>{



let names=[];



addField(item.creator,names);

addField(item.uploader,names);

addField(item.contributor,names);

addField(item.artist,names);

addField(item.publisher,names);




names.forEach(name=>{

addCreator(name);

});



});




displayCreators();


}




function addField(value,array){


if(!value)
return;



if(Array.isArray(value)){


value.forEach(v=>{

array.push(v);

});


}

else{


array.push(value);


}


}






function addCreator(name){


if(!name)
return;



name=String(name).trim();



if(name.length<2)
return;



// remove quotes

name=name.replace(/^["']|["']$/g,"");



// create unique key

let key=name.toLowerCase();



if(!creators[key]){


creators[key]={

name:name,

count:0

};


}



creators[key].count++;


}





function displayCreators(){



let box =
document.getElementById("results");



box.innerHTML="";



let list =
Object.values(creators);



list.sort((a,b)=>{

return a.name.localeCompare(b.name);

});




document.getElementById("status").innerHTML =

"Unique Creators Found: "

+ list.length;





list.forEach(item=>{


box.innerHTML += `


<div class="card">


<div class="creator">

${escapeHTML(item.name)}

</div>


<div class="count">

Archive Records:
${item.count}

</div>


</div>


`;


});


}




function escapeHTML(text){


return String(text)

.replaceAll("&","&amp;")

.replaceAll("<","&lt;")

.replaceAll(">","&gt;")

.replaceAll('"',"&quot;");


}



</script>


</body>

</html>
