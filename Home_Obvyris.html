<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Chat Obvyris</title>

<link rel="icon" type="image/png" href="https://mikos5.github.io/tester/navicon.png">
<link rel="apple-touch-icon" href="https://mikos5.github.io/tester/navicon.png">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet"/>

<style>

:root{
  --bg:#09111d;
  --panel:#111827;
  --line:#253347;
  --text:#fff;
  --muted:#93a4bb;
  --blue:#2793ff;
  --blue-dark:#1869d9;
  --panel-alt:#0b1220;
}

/* LIGHT MODE */
body.light{
  --bg:#f4f6f8;
  --panel:#ffffff;
  --line:#d9e2ec;
  --text:#102a43;
  --muted:#627d98;
  --blue:#4f8ef7;
  --blue-dark:#3b82f6;
  --panel-alt:#eef3f8;
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:Inter,sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;
  height:100vh;
  overflow:hidden;
}

/* SIDEBAR */
.sidebar{
  width:340px;
  background:var(--panel);
  border-right:1px solid var(--line);
  padding:20px;
  overflow:auto;
}

.logo{
  font-family:Orbitron;
  font-size:42px;
  font-weight:900;
}

.logo span{ color:var(--blue); }

.subtitle{
  color:var(--muted);
  font-size:13px;
  margin-bottom:20px;
}

/* PLAYER STYLE CARD (USED AS STATS) */
.player{
  margin-top:10px;
  padding:16px;
  border-radius:16px;
  background:var(--panel);
  border:1px solid var(--line);
}

.now{font-weight:700;}
.meta{font-size:12px;color:var(--muted);}

.controls{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:12px;
}

button{
  border:none;
  border-radius:12px;
  padding:10px;
  background:linear-gradient(180deg,var(--blue),var(--blue-dark));
  color:white;
  font-weight:700;
  cursor:pointer;
}

/* MAIN */
.main{
  flex:1;
  padding:20px;
  overflow:auto;
}

.title{
  font-size:42px;
  font-weight:800;
  margin-bottom:15px;
}

/* ROOM CARD */
.room{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px;
  margin-bottom:10px;
  cursor:pointer;
}

.room:hover{
  border-color:var(--blue);
  background:rgba(39,147,255,0.08);
}

.room-title{
  font-weight:800;
  display:flex;
  justify-content:space-between;
}

.room-meta{
  font-size:12px;
  color:var(--muted);
  margin-top:6px;
}

.last-msg{
  margin-top:8px;
  font-size:13px;
  font-weight:600;
}

/* INPUT */
.search input{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--text);
}

/* CHAT POPUP */
.chat-popup{
  position:fixed;
  bottom:160px;
  right:20px;
  width:360px;
  height:520px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  z-index:99999;
}

.chat-popup.hidden{display:none;}

.chat-popup-header{
  padding:10px;
  font-weight:800;
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid var(--line);
  background:var(--panel-alt);
}

.chat-popup-log{
  flex:1;
  overflow-y:auto;
  padding:10px;
  font-size:13px;
}

.chat-msg{
  margin-bottom:6px;
  padding:6px;
  background:var(--panel-alt);
  border-radius:8px;
}

.chat-name{
  color:var(--blue);
  font-weight:800;
}

.chat-input{
  display:flex;
  gap:5px;
  padding:8px;
  border-top:1px solid var(--line);
}

.chat-input input{
  flex:1;
  padding:6px;
  border-radius:8px;
  border:1px solid var(--line);
  background:var(--bg);
  color:var(--text);
}

/* FLOAT BUTTON */
#chatFloatBtn{
  position:fixed;
  bottom:90px;
  right:20px;
  width:55px;
  height:55px;
  border-radius:50%;
  font-size:22px;
  z-index:99999;
}

</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

  <div class="logo">Chat <span>Obvyris</span></div>
  <div class="subtitle">Live chat rooms • stations • messages</div>

  <div class="player">
    <div class="now">Chat System</div>
    <div class="meta">Rooms • Messages • Active</div>

    <div class="controls">
      <button onclick="refreshRooms()">↻</button>
      <button onclick="showAll()">🏠</button>
      <button onclick="toggleChatPopup()">💬</button>
      <button onclick="toggleTheme()">🌙</button>
    </div>
  </div>

</div>

<!-- MAIN -->
<div class="main">

  <div class="title">Chat Rooms</div>

  <div class="search">
    <input id="searchBox" placeholder="Search rooms..." oninput="renderRooms()"/>
  </div>

  <div id="rooms"></div>

</div>

<!-- FLOAT BUTTON -->
<button id="chatFloatBtn" onclick="toggleChatPopup()">💬</button>

<!-- CHAT POPUP -->
<div id="chatPopup" class="chat-popup hidden">

  <div class="chat-popup-header">
    <span id="popupTitle">💬 Chat</span>
    <button onclick="toggleChatPopup()">✖</button>
  </div>

  <div id="popupMessages" class="chat-popup-log"></div>

  <div class="chat-input">
    <input id="popupName" placeholder="name" maxlength="10"/>
    <input id="popupMsg" placeholder="message" maxlength="120"/>
    <button onclick="sendPopupMsg()">Send</button>
  </div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbzin84qDcZ9L1q4pTBtHZGKJSTDcZ_wnmgWmnmgPgf1jrc1nRprzbEBixKMSHcdkxiZBg/exec";

let messages = [];
let activeRoom = "global";
let popupOpen = false;

/* LOAD ROOMS */
async function load(){
  const res = await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({action:"get",station:""})
  });

  messages = await res.json();
  renderRooms();
}

/* RENDER ROOMS */
function renderRooms(){

  const rooms = {};
  const q = document.getElementById("searchBox").value.toLowerCase();

  for(let m of messages){

    const id = m.station || "global";
    const text = `${m.stationName||""} ${m.name||""} ${m.message||""}`.toLowerCase();

    if(q && !text.includes(q)) continue;

    if(!rooms[id]){
      rooms[id] = {
        id,
        name: m.stationName || id,
        count:0,
        last:"",
        user:""
      };
    }

    rooms[id].count++;
    rooms[id].last = m.message;
    rooms[id].user = m.name;
  }

  const el = document.getElementById("rooms");
  el.innerHTML = Object.values(rooms).map(r=>`
    <div class="room" onclick="openRoom('${r.id}')">
      <div class="room-title">
        ${r.name}
        <span>${r.count}</span>
      </div>
      <div class="last-msg">${r.user}: ${r.last}</div>
    </div>
  `).join("");
}

/* OPEN ROOM */
function openRoom(id){
  activeRoom = id;
  toggleChatPopup();
  loadPopup();
}

/* POPUP */
function toggleChatPopup(){
  popupOpen = !popupOpen;
  document.getElementById("chatPopup")
    .classList.toggle("hidden");

  if(popupOpen) loadPopup();
}

/* LOAD CHAT */
async function loadPopup(){

  const res = await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({
      action:"get",
      station:activeRoom
    })
  });

  const data = await res.json();

  const box = document.getElementById("popupMessages");

  box.innerHTML = data.map(m=>`
    <div class="chat-msg">
      <span class="chat-name">${m.name}:</span> ${m.message}
    </div>
  `).join("");

  box.scrollTop = box.scrollHeight;
}

/* SEND */
async function sendPopupMsg(){

  const name = document.getElementById("popupName").value || "Anon";
  const msg = document.getElementById("popupMsg").value;

  if(!msg) return;

  await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({
      action:"send",
      station:activeRoom,
      stationName:activeRoom,
      name:name.slice(0,10),
      message:msg.slice(0,120)
    })
  });

  document.getElementById("popupMsg").value="";
  loadPopup();
}

/* UTIL */
function refreshRooms(){ load(); }
function showAll(){ load(); }
function toggleTheme(){ document.body.classList.toggle("light"); }

load();

</script>

</body>
</html>
