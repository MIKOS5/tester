<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Chat Rooms</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#09111d;
  color:white;
}

header{
  padding:15px;
  background:#111827;
  font-size:20px;
  font-weight:700;
  border-bottom:1px solid #253347;
}

.room{
  padding:12px;
  border-bottom:1px solid #253347;
  cursor:pointer;
  transition:.2s;
}

.room:hover{
  background:rgba(39,147,255,0.15);
}

.room b{
  color:#2793ff;
}

.small{
  font-size:12px;
  opacity:.7;
}

</style>
</head>

<body>

<header>💬 Chat Rooms</header>
<div id="rooms"></div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbzin84qDcZ9L1q4pTBtHZGKJSTDcZ_wnmgWmnmgPgf1jrc1nRprzbEBixKMSHcdkxiZBg/exec";

let messages = [];

async function load(){
  const res = await fetch(API_URL, {
    method:"POST",
    body: JSON.stringify({
      action:"get",
      station:""   // <- IMPORTANT: empty = get ALL messages
    })
  });

  const data = await res.json();
  messages = Array.isArray(data) ? data : [];

  renderRooms();
}

function renderRooms(){

  const rooms = {};

  // GROUP BY STATION ID
  for (let m of messages){

    const id = m.station || "global";

    if (!rooms[id]){
      rooms[id] = {
        id,
        count:0,
        last:m.message,
        name: guessRoomName(id, m)
      };
    }

    rooms[id].count++;
    rooms[id].last = m.message;
  }

  const el = document.getElementById("rooms");
  el.innerHTML = "";

  Object.values(rooms)
    .sort((a,b)=>b.count - a.count)
    .forEach(r => {

      el.innerHTML += `
        <div class="room" onclick="openRoom('${r.id}')">
          <b>${r.name}</b>
          <div class="small">
            ID: ${r.id}
          </div>
          <div class="small">
            ${r.count} messages • Last: ${r.last}
          </div>
        </div>
      `;
    });
}

/* ROOM NAME DETECTION */
function guessRoomName(id, msg){

  // Example mapping (YOU can expand this)
  const map = {
    "global-video": "🎬 Video Chat",
    "global": "🌐 Global Chat"
  };

  if (map[id]) return map[id];

  // fallback: prettify UUID
  if (id.includes("-")){
    return "📻 Station Chat";
  }

  return "💬 Chat Room";
}

function openRoom(id){
  // send to your video/chat page
  window.location.href = `chatroom.html?room=${encodeURIComponent(id)}`;
}

load();

</script>
</body>
</html>
