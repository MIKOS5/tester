<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obvyris Home</title>

<style>
:root{
  --bg:#09111d;
  --panel:#111827;
  --border:#253347;
  --blue:#2793ff;
  --blue-dark:#1869d9;
  --text:#fff;
  --muted:#93a4bb;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* HEADER */
.header{
  padding:20px;
  text-align:center;
  border-bottom:1px solid var(--border);
}

.title{
  font-size:28px;
  font-weight:800;
}

.subtitle{
  font-size:13px;
  color:var(--muted);
  margin-top:5px;
}

/* GRID */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  padding:20px;
}

@media(max-width:900px){
  .grid{
    grid-template-columns:1fr;
  }
}

/* CARD */
.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:14px;
  padding:15px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.card-title{
  font-size:20px;
  font-weight:800;
}

.card-sub{
  font-size:12px;
  color:var(--muted);
}

/* BUTTON */
.btn{
  padding:10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:700;
  color:white;
  background:linear-gradient(180deg,var(--blue),var(--blue-dark));
}

.btn:hover{
  filter:brightness(1.1);
}

/* CHAT PREVIEW */
.chat{
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid var(--border);
  font-size:12px;
  max-height:160px;
  overflow:auto;
}

.msg{
  margin-bottom:6px;
  opacity:0.9;
}

.name{
  color:var(--blue);
  font-weight:700;
}

/* FOOT */
.footer{
  text-align:center;
  font-size:11px;
  color:var(--muted);
  padding:10px;
}
</style>
</head>

<body>

<div class="header">
  <div class="title">🚀 Obvyris Dashboard</div>
  <div class="subtitle">Video • Radio • Live Chat Preview</div>
</div>

<div class="grid">

  <!-- VIDEO -->
  <div class="card">
    <div class="card-title">📺 Video Obvyris</div>
    <div class="card-sub">IPTV channels + live streaming</div>

    <button class="btn" onclick="openApp('video')">
      ▶ Open Video
    </button>

    <div class="chat" id="videoChat">Loading chat...</div>
  </div>

  <!-- RADIO -->
  <div class="card">
    <div class="card-title">📻 Radio Obvyris</div>
    <div class="card-sub">Live stations + genres + favorites</div>

    <button class="btn" onclick="openApp('radio')">
      ▶ Open Radio
    </button>

    <div class="chat" id="radioChat">Loading chat...</div>
  </div>

</div>

<div class="footer">
  Obvyris Hub • Unified Media System
</div>

<script>

/* chat endpoints (your existing Apps Script) */
const VIDEO_CHAT =
"https://script.google.com/macros/s/AKfycbzin84qDcZ9L1q4pTBtHZGKJSTDcZ_wnmgWmnmgPgf1jrc1nRprzbEBixKMSHcdkxiZBg/exec";

const RADIO_CHAT =
"https://script.google.com/macros/s/AKfycbzZ5MwOcYUY_bpsUKSxPd810xE8rV_Y3z2GwzPublb_4O60CP8L_lC_V2kqkCQ_JdF5/exec";


/* OPEN APP (via index99 iframe) */
function openApp(app){

  const frame = parent.document.querySelector("iframe");

  if(!frame) return;

  if(app === "video"){
    frame.src = "Video_Obvyris.html";
  }

  if(app === "radio"){
    frame.src = "Radio_Obvyris.html";
  }
}

/* LOAD CHAT PREVIEW */
async function loadChat(url, boxId){

  try{

    const res = await fetch(url,{
      method:"POST",
      body:JSON.stringify({
        action:"get",
        station:"global"
      })
    });

    const data = await res.json();

    const box = document.getElementById(boxId);
    box.innerHTML = "";

    (data || []).slice(-6).forEach(m=>{
      box.innerHTML += `
        <div class="msg">
          <span class="name">${m.name || "Anon"}:</span>
          ${m.message}
        </div>
      `;
    });

  }catch(e){
    document.getElementById(boxId).innerHTML =
      "Chat offline";
  }
}

loadChat(VIDEO_CHAT,"videoChat");
loadChat(RADIO_CHAT,"radioChat");

setInterval(()=>{
  loadChat(VIDEO_CHAT,"videoChat");
  loadChat(RADIO_CHAT,"radioChat");
},5000);

</script>

</body>
</html>
