<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Video Obvyris Radio</title>

<script src="https://www.youtube.com/iframe_api"></script>

<style>

body{
margin:0;
background:#111;
color:white;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}


.player{

background:#222;
padding:30px;
border-radius:15px;
width:360px;
text-align:center;

}


button{

background:#2793ff;
border:0;
padding:15px 30px;
border-radius:8px;
color:white;
font-size:18px;
cursor:pointer;

}


button:hover{
background:#1869d9;
}


#title{

font-size:20px;
margin-top:20px;

}


#artist,
#genre{

color:#aaa;
margin-top:5px;

}


/* HIDDEN YOUTUBE PLAYER */

#ytPlayer{

position:absolute;
width:1px;
height:1px;
overflow:hidden;
opacity:0;
pointer-events:none;

}


#status{

margin-top:15px;
color:#17c964;

}


</style>

</head>


<body>


<div class="player">


<h2>📺 Video Obvyris Radio</h2>


<div id="title">
Loading...
</div>


<div id="artist"></div>


<div id="genre"></div>


<!-- Hidden YouTube Audio Engine -->

<div id="ytPlayer"></div>


<br>


<button onclick="startRadio()">
▶ PLAY RADIO
</button>


<div id="status">
Waiting...
</div>


</div>





<script>


const API =
"https://script.google.com/macros/s/AKfycbwA1FraODA7b2LLXhJfDzvdbK9TfNtSFVqcKQl67P0WjFg4ysOIGHGyq9JyeSN9axy2/exec?action=now";



let ytPlayer = null;

let ytReady = false;

let pendingVideo = null;



// YouTube API callback

function onYouTubeIframeAPIReady(){

console.log(
"YouTube API Ready"
);

ytReady=true;


if(pendingVideo){

createPlayer(
pendingVideo.id,
pendingVideo.seek
);

}

}




async function startRadio(){


try{


let res =
await fetch(API);


let data =
await res.json();



console.log(data);



document.getElementById("title").innerHTML =
data.program || "Unknown";


document.getElementById("artist").innerHTML =
data.artist || "";


document.getElementById("genre").innerHTML =
data.genre || "";



if(!data.videoId){

alert(
"No video ID found"
);

return;

}



if(!ytReady){

pendingVideo = {

id:data.videoId,

seek:data.seek

};


return;

}



createPlayer(
data.videoId,
data.seek
);



}

catch(err){

console.error(err);

document.getElementById("status").innerHTML =
"❌ Error";

}


}




function createPlayer(id,seek){



if(ytPlayer){


ytPlayer.loadVideoById(id);


if(seek){

ytPlayer.seekTo(
Number(seek),
true
);

}


return;


}



ytPlayer =
new YT.Player(
"ytPlayer",
{


height:"1",

width:"1",


videoId:id,


playerVars:{


autoplay:1,

controls:0,

disablekb:1,

playsinline:1,

modestbranding:1,

rel:0


},


events:{



onReady:function(event){



console.log(
"Player Ready"
);



// mute allows autoplay

event.target.mute();



if(seek){

event.target.seekTo(
Number(seek),
true
);

}



event.target.playVideo();



document.getElementById("status").innerHTML =
"✅ Radio Playing";



},



onStateChange:function(event){



if(event.data === YT.PlayerState.PLAYING){

document.getElementById("status").innerHTML =
"▶ Playing";

}


if(event.data === YT.PlayerState.PAUSED){

document.getElementById("status").innerHTML =
"⏸ Paused";

}



}



}



});



}



</script>


</body>
</html>
