<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Radio Obvyris</title>

<style>

body{
margin:0;
background:#111;
color:white;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}


.player{

background:#222;
padding:30px;
border-radius:15px;
width:320px;
text-align:center;

}


button{

background:#2793ff;
border:0;
padding:15px 30px;
border-radius:8px;
color:white;
font-size:18px;
cursor:pointer;

}


#title{

font-size:20px;
margin-top:20px;

}


#genre{

color:#aaa;

}


audio{

width:100%;
margin-top:20px;

}


</style>

</head>


<body>


<div class="player">


<h2>📻 Radio Obvyris</h2>


<div id="title">
Loading...
</div>


<div id="artist"></div>


<div id="genre"></div>


<audio id="radio"
controls>
</audio>


<br><br>


<button onclick="startRadio()">
PLAY RADIO
</button>


</div>





<script>


const API = 
"https://script.google.com/macros/s/AKfycbwA1FraODA7b2LLXhJfDzvdbK9TfNtSFVqcKQl67P0WjFg4ysOIGHGyq9JyeSN9axy2/exec?action=now";



let audio =
document.getElementById("radio");





async function startRadio(){


let r =
await fetch(API);



let data =
await r.json();



console.log(data);




document.getElementById("title")
.innerHTML =
data.program;



document.getElementById("artist")
.innerHTML =
data.artist;



document.getElementById("genre")
.innerHTML =
data.genre;



/*
Future audio stream URL
*/

audio.src =
data.audio;



audio.play();



}





</script>


</body>
</html>
