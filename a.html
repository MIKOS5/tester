<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Video Obvyris Radio</title>

<script src="https://www.youtube.com/iframe_api"></script>

<style>

body{
margin:0;
background:#111;
color:white;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}


.player{

background:#222;
padding:30px;
border-radius:15px;
width:360px;
text-align:center;

}


button{

background:#2793ff;
border:0;
padding:15px 30px;
border-radius:8px;
color:white;
font-size:18px;
cursor:pointer;

}


#title{

font-size:20px;
margin-top:20px;

}


#artist,
#genre{

color:#aaa;
margin-top:5px;

}


#status{

margin-top:15px;
color:#17c964;

}


/*
YouTube engine
kept alive but not visible
*/

#ytWrapper{

position:fixed;
left:-9999px;
top:-9999px;
width:200px;
height:120px;

}


#ytPlayer{

width:200px;
height:120px;

}


</style>

</head>


<body>


<div class="player">


<h2>📻 Video Obvyris Radio</h2>


<div id="title">
Loading...
</div>


<div id="artist"></div>


<div id="genre"></div>


<div id="ytWrapper">

<div id="ytPlayer"></div>

</div>


<br>


<button onclick="startRadio()">
▶ PLAY RADIO
</button>


<div id="status">
Waiting...
</div>


</div>





<script>


const API =
"https://script.google.com/macros/s/AKfycbwA1FraODA7b2LLXhJfDzvdbK9TfNtSFVqcKQl67P0WjFg4ysOIGHGyq9JyeSN9axy2/exec?action=now";


let ytPlayer=null;

let ytLoaded=false;

let pending=null;



function onYouTubeIframeAPIReady(){

console.log("YouTube Ready");

ytLoaded=true;


if(pending){

createPlayer(
pending.id,
pending.seek
);

}

}



async function startRadio(){


try{


const res =
await fetch(API);


const data =
await res.json();


console.log(data);



document.getElementById("title").innerHTML =
data.program || "Unknown";


document.getElementById("artist").innerHTML =
data.artist || "";


document.getElementById("genre").innerHTML =
data.genre || "";



if(!data.videoId){

alert("No video ID");

return;

}



if(!ytLoaded){

pending={
id:data.videoId,
seek:data.seek
};

return;

}



createPlayer(
data.videoId,
data.seek
);



}

catch(e){

console.error(e);

document.getElementById("status").innerHTML =
"❌ Error";

}

}





function createPlayer(id,seek){



if(ytPlayer){


ytPlayer.loadVideoById(id);


if(seek){

ytPlayer.seekTo(
Number(seek),
true
);

}


return;

}



ytPlayer =
new YT.Player(
"ytPlayer",
{

height:"120",

width:"200",

videoId:id,


playerVars:{


autoplay:1,

controls:0,

disablekb:1,

playsinline:1,

rel:0,

modestbranding:1


},


events:{


onReady:function(e){


console.log("YT player ready");



if(seek){

e.target.seekTo(
Number(seek),
true
);

}



e.target.playVideo();



document.getElementById("status").innerHTML =
"▶ Playing Audio";


},



onStateChange:function(e){


if(e.data === YT.PlayerState.PLAYING){

document.getElementById("status").innerHTML =
"▶ Playing Audio";

}


if(e.data === YT.PlayerState.PAUSED){

document.getElementById("status").innerHTML =
"⏸ Paused";

}


}



}

});



}


</script>


</body>
</html>
