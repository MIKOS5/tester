<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Radio Obvyris Test</title>

<style>

body{
margin:0;
background:#111;
color:white;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}


.player{

background:#222;
padding:30px;
border-radius:15px;
width:320px;
text-align:center;

}


button{

background:#2793ff;
border:0;
padding:15px 30px;
border-radius:8px;
color:white;
font-size:18px;
cursor:pointer;

}


button:hover{
background:#1869d9;
}


#title{

font-size:20px;
margin-top:20px;

}


#artist,
#genre{

color:#aaa;
margin-top:5px;

}


#status{

margin-top:15px;
font-size:13px;
color:#17c964;

}


audio{

width:100%;
margin-top:20px;

}


#debug{

margin-top:20px;
font-size:11px;
text-align:left;
background:#000;
padding:10px;
border-radius:8px;
max-height:200px;
overflow:auto;
color:#0f0;

}


</style>

</head>


<body>


<div class="player">


<h2>📻 Radio Obvyris</h2>


<div id="title">
Loading...
</div>


<div id="artist"></div>


<div id="genre"></div>


<audio id="radio" controls></audio>


<br><br>


<button onclick="startRadio()">
▶ PLAY RADIO
</button>


<div id="status">
Waiting...
</div>


<div id="debug">
Debug output...
</div>


</div>





<script>


const API = 
"https://script.google.com/macros/s/AKfycbwA1FraODA7b2LLXhJfDzvdbK9TfNtSFVqcKQl67P0WjFg4ysOIGHGyq9JyeSN9axy2/exec?action=now";



const audio =
document.getElementById("radio");



function debug(msg){

console.log(msg);

document.getElementById("debug").innerHTML +=
"<br>" + msg;

}



async function startRadio(){


document.getElementById("status").innerHTML =
"Connecting...";


document.getElementById("debug").innerHTML =
"";



try{


let response =
await fetch(API);



debug(
"HTTP STATUS: " + response.status
);



let raw =
await response.text();



debug(
"RAW RESPONSE:"
);



debug(
raw
);



let data =
JSON.parse(raw);



console.log("DATA:",data);



document.getElementById("title").innerHTML =
data.program ||
"Unknown Program";



document.getElementById("artist").innerHTML =
data.artist ||
"";


document.getElementById("genre").innerHTML =
data.genre ||
"";





let stream =

data.audio ||

data.url ||

data.url_resolved ||

data.stream ||

data.streamUrl;



debug(
"STREAM:"
);



debug(
stream || "NO STREAM FOUND"
);



if(!stream){


document.getElementById("status").innerHTML =
"❌ No stream returned";


return;


}





audio.src = stream;


audio.load();



await audio.play();



document.getElementById("status").innerHTML =
"✅ Playing";



}


catch(err){


console.error(err);


debug(
"ERROR: " + err
);


document.getElementById("status").innerHTML =
"❌ Error";


}



}



</script>


</body>
</html>
