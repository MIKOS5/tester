<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Video Obvyris Radio Test</title>

<script src="https://www.youtube.com/iframe_api"></script>

<style>

body{
margin:0;
background:#111;
color:white;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.player{
background:#222;
padding:30px;
border-radius:15px;
width:360px;
text-align:center;
}

button{
background:#2793ff;
border:0;
padding:15px 30px;
border-radius:8px;
color:white;
font-size:18px;
cursor:pointer;
}

#title{
font-size:20px;
margin-top:20px;
}

#artist,#genre{
color:#aaa;
margin-top:5px;
}

#ytPlayer{
margin-top:20px;
}

#status{
margin-top:15px;
color:#17c964;
}

</style>

</head>

<body>


<div class="player">


<h2>📺 Video Obvyris</h2>


<div id="title">
Loading...
</div>


<div id="artist"></div>


<div id="genre"></div>


<div id="ytPlayer"></div>


<br>


<button onclick="startRadio()">
▶ PLAY
</button>


<div id="status">
Waiting...
</div>


</div>



<script>


const API =
"https://script.google.com/macros/s/AKfycbwA1FraODA7b2LLXhJfDzvdbK9TfNtSFVqcKQl67P0WjFg4ysOIGHGyq9JyeSN9axy2/exec?action=now";



let ytPlayer;

let currentVideo="";



function onYouTubeIframeAPIReady(){

console.log("YouTube API Ready");

}




async function startRadio(){


try{


let res =
await fetch(API);



let data =
await res.json();



console.log(data);



document.getElementById("title").innerHTML =
data.program || "";

document.getElementById("artist").innerHTML =
data.artist || "";

document.getElementById("genre").innerHTML =
data.genre || "";



let videoId =
data.videoId;



if(!videoId){

alert("No YouTube video ID");

return;

}



loadVideo(videoId,data.seek);



}

catch(e){

console.error(e);

document.getElementById("status").innerHTML =
"❌ Error";

}


}




function loadVideo(id,seek){


currentVideo=id;



if(!ytPlayer){


ytPlayer =
new YT.Player(
"ytPlayer",
{

height:"200",
width:"350",

videoId:id,


playerVars:{

autoplay:1,

controls:1,

playsinline:1

},


events:{


onReady:function(event){


if(seek){

event.target.seekTo(
Number(seek),
true
);

}


event.target.playVideo();


document.getElementById("status").innerHTML =
"✅ Playing";


}


}


});


}

else{


ytPlayer.loadVideoById(id);


if(seek){

ytPlayer.seekTo(
Number(seek),
true
);

}


}



}


</script>


</body>
</html>
