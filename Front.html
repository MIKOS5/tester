<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gear Store</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;
padding:20px;

font-family:Inter,Arial,sans-serif;

background:#0f172a;

color:white;

}


/* Header */

.store-header{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:20px;

background:rgba(255,255,255,.05);

border:1px solid rgba(255,255,255,.08);

border-radius:18px;

padding:20px;

}


.store-header h1{

margin:0;

font-size:26px;

}


.store-header p{

margin:6px 0 0;

color:#94a3b8;

}



.count-badge{

background:#2563eb;

padding:10px 16px;

border-radius:999px;

font-weight:bold;

}



/* Controls */

.controls{

display:flex;

gap:10px;

flex-wrap:wrap;

margin-bottom:20px;

}


#searchInput{

flex:1;

min-width:220px;

background:#1e293b;

border:1px solid rgba(255,255,255,.1);

border-radius:12px;

padding:13px 16px;

color:white;

font-size:14px;

outline:none;

}



#searchInput:focus{

border-color:#2563eb;

}



button{

background:#2563eb;

border:none;

color:white;

padding:10px 14px;

border-radius:10px;

font-weight:600;

cursor:pointer;

transition:.2s;

}


button:hover{

background:#3b82f6;

transform:translateY(-2px);

}



/* Grid */

.products{

display:grid;

grid-template-columns:

repeat(auto-fill,minmax(270px,1fr));

gap:18px;

}



/* Card */


.card{

background:#111827;

border-radius:18px;

border:1px solid rgba(255,255,255,.08);

overflow:hidden;

box-shadow:0 15px 35px rgba(0,0,0,.3);

transition:.25s;

}


.card:hover{

transform:translateY(-5px);

}



.card-content{

padding:18px;

}



.product-img{

width:100%;

height:170px;

object-fit:cover;

background:#020617;

}



.card h3{

margin:0 0 12px;

color:#60a5fa;

font-size:19px;

}



.info{

color:#cbd5e1;

font-size:14px;

line-height:1.5;

}



.price{

font-size:24px;

font-weight:700;

color:#22c55e;

margin:15px 0;

}



.stock{

display:inline-block;

background:#166534;

padding:6px 10px;

border-radius:8px;

font-size:13px;

font-weight:bold;

}


.out{

background:#991b1b;

}



.promo{

background:#dc2626;

padding:8px;

border-radius:8px;

text-align:center;

font-weight:bold;

margin-top:12px;

}



/* Buttons */


.card-buttons{

display:flex;

gap:10px;

margin-top:18px;

}


.card-buttons a{

text-decoration:none;

text-align:center;

padding:11px;

border-radius:10px;

font-weight:bold;

color:white;

}



.google-btn{

flex:1;

background:#2563eb;

}



.fb-btn{

background:#1877f2;

padding-left:18px!important;

padding-right:18px!important;

}



#status{

text-align:center;

padding:25px;

color:#94a3b8;

}



/* Mobile */


@media(max-width:700px){


body{

padding:12px;

}


.store-header{

flex-direction:column;

align-items:flex-start;

gap:15px;

}


.controls{

flex-direction:column;

}


button{

width:100%;

}


}

</style>

</head>


<body>



<div class="store-header">

<div>

<h1>🏷️ Gear Store</h1>

<p>Used & restored equipment marketplace</p>

</div>


<div class="count-badge" id="count">

0 Items

</div>


</div>




<div class="controls">


<input 
id="searchInput"
placeholder="Search gear..."
>



<button onclick="sortProducts('name','asc')">
A-Z
</button>


<button onclick="sortProducts('price','asc')">
Price ↑
</button>


<button onclick="sortProducts('price','desc')">
Price ↓
</button>


<button onclick="sortProducts('stock','desc')">
Stock
</button>


</div>



<div id="status">
Loading inventory...
</div>



<div id="productsContainer" class="products"></div>




<script>


const csvFilePath =
'https://script.google.com/macros/s/AKfycbw2ygas7GeNtrOUSVo2L8xMe3pHHyYZmHS936xmude6D70z6byyFnIaQtd1aOqSPl-ueg/exec';



let products=[];



function csvSplit(row){

let result=[];

let current="";

let quote=false;


for(let c of row){

if(c=='"'){

quote=!quote;

}

else if(c=="," && !quote){

result.push(current);

current="";

}

else{

current+=c;

}

}


result.push(current);

return result;

}




function parseCSV(data){


products=[];


data.split(/\r?\n/).slice(1).forEach(row=>{


if(!row.trim()) return;


let c=csvSplit(row);


products.push({

itemName:(c[1]||"Unnamed Item").replace(/"/g,""),

category:c[2]||"",

brand:c[3]||"",

model:c[4]||"",

condition:c[6]||"",

description:c[7]||"",

stock:Number(c[16])||0,

promo:c[19]||"",

weight:c[20]||"",

price:Number(c[22])||0,

image:c[29]||""

});


});


displayProducts(products);


}




function displayProducts(list){


let container=
document.getElementById("productsContainer");


container.innerHTML="";


document.getElementById("count").innerHTML=
list.length+" Items";



list.forEach(p=>{


let card=document.createElement("div");

card.className="card";



card.innerHTML=

`

${p.image ?

`<img class="product-img" src="${p.image}" onerror="this.style.display='none'">`

:

""

}


<div class="card-content">


<h3>${p.itemName}</h3>


<div class="info">

<b>Category:</b> ${p.category}<br>

<b>Brand:</b> ${p.brand}<br>

<b>Model:</b> ${p.model}<br>

<b>Condition:</b> ${p.condition}

</div>



<p>

${p.description || "No description available"}

</p>



<div class="price">

${p.price ? "$"+p.price.toFixed(2) : "Contact"}

</div>



<span class="stock ${p.stock?'':'out'}">

${p.stock ? "In Stock: "+p.stock : "Out of Stock"}

</span>



${p.promo ?

`<div class="promo">${p.promo}</div>`

:

""

}



<div class="card-buttons">


<a class="google-btn"
target="_blank"
href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(p.itemName)}">

🔍 Images

</a>


<a class="fb-btn"
target="_blank"
href="https://www.facebook.com/marketplace/la/search/?query=${encodeURIComponent(p.itemName)}">

F

</a>


</div>


</div>

`;



container.appendChild(card);


});


document.getElementById("status").style.display="none";


}




function sortProducts(type,order){


let sorted=[...products];


if(type==="name")

sorted.sort((a,b)=>

order==="asc"?

a.itemName.localeCompare(b.itemName):

b.itemName.localeCompare(a.itemName)

);



if(type==="price")

sorted.sort((a,b)=>

order==="asc"?

a.price-b.price:

b.price-a.price

);



if(type==="stock")

sorted.sort((a,b)=>b.stock-a.stock);



displayProducts(sorted);


}




document
.getElementById("searchInput")
.addEventListener("input",function(){


let s=this.value.toLowerCase();


displayProducts(

products.filter(p=>

p.itemName.toLowerCase().includes(s)||

p.brand.toLowerCase().includes(s)||

p.category.toLowerCase().includes(s)

)

);


});




fetch(csvFilePath)

.then(r=>r.text())

.then(parseCSV)

.catch(()=>{

document.getElementById("status").innerHTML=
"❌ Failed loading store";

});


</script>


</body>

</html>
