<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gear Store</title>


<style>

*{
box-sizing:border-box;
}


body{

margin:0;
padding:20px;

font-family:Inter,Arial,sans-serif;

background:#0f172a;

color:white;

}


/* Title */


.page-title{

margin-bottom:20px;

}


.page-title h1{

margin:0;

font-size:26px;

}


.page-title p{

margin-top:6px;

color:#94a3b8;

}



/* Controls */


.controls{

display:flex;

gap:10px;

flex-wrap:wrap;

margin-bottom:20px;

}



button,
.action-btn{


background:#2563eb;

border:none;

color:white;

padding:10px 15px;

border-radius:10px;

cursor:pointer;

font-weight:600;

transition:.2s;

}


button:hover,
.action-btn:hover{

background:#3b82f6;

transform:translateY(-2px);

}



#searchInput{

flex:1;

min-width:220px;

padding:12px 15px;

background:#1e293b;

border:1px solid rgba(255,255,255,.1);

border-radius:12px;

color:white;

outline:none;

font-size:14px;

}



#searchInput:focus{

border-color:#2563eb;

box-shadow:0 0 15px rgba(37,99,235,.4);

}



/* Product grid */


.products{

display:grid;

grid-template-columns:

repeat(auto-fill,minmax(250px,1fr));

gap:18px;

}



/* Cards */


.card{

background:#111827;

border-radius:18px;

padding:18px;

border:1px solid rgba(255,255,255,.08);

box-shadow:

0 15px 35px rgba(0,0,0,.3);

transition:.25s;

}



.card:hover{

transform:translateY(-5px);

box-shadow:

0 20px 45px rgba(0,0,0,.45);

}



.card h3{

margin:0 0 12px;

font-size:18px;

color:#60a5fa;

}



.card p{

margin:7px 0;

font-size:14px;

color:#d1d5db;

}



.price{

font-size:22px !important;

font-weight:700;

color:#22c55e !important;

margin-top:15px !important;

}



.stock{

color:#facc15 !important;

font-weight:bold;

}



.promo{

background:#dc2626;

padding:6px;

border-radius:8px;

text-align:center;

font-weight:bold;

color:white !important;

}



/* Images */


.product-img{

width:100%;

height:150px;

object-fit:cover;

border-radius:12px;

margin-bottom:12px;

}



/* Buttons */


.card-buttons{

display:flex;

gap:8px;

margin-top:15px;

}



.google-btn{

flex:1;

text-align:center;

text-decoration:none;

background:#2563eb;

color:white;

padding:10px;

border-radius:10px;

font-size:14px;

font-weight:600;

}



.fb-btn{

background:#1877f2;

color:white;

text-decoration:none;

padding:10px 15px;

border-radius:10px;

font-weight:bold;

}



#status{

text-align:center;

padding:20px;

color:#94a3b8;

}



@media(max-width:600px){

body{

padding:12px;

}

.controls{

flex-direction:column;

}

}

</style>

</head>


<body>


<div class="page-title">

<h1>🏷️ Gear Store</h1>

<p>Available used and restored equipment</p>

</div>



<div class="controls">


<input 
id="searchInput"
placeholder="Search products..."
>


<button onclick="sortProducts('name','asc')">
Name ↑
</button>


<button onclick="sortProducts('name','desc')">
Name ↓
</button>


<button onclick="sortProducts('price','asc')">
Price ↑
</button>


<button onclick="sortProducts('price','desc')">
Price ↓
</button>


<button onclick="sortProducts('stock','desc')">
Stock
</button>


</div>



<div id="status">
Loading products...
</div>



<div id="productsContainer" class="products"></div>



<script>


const csvFilePath =
'https://script.google.com/macros/s/AKfycbw2ygas7GeNtrOUSVo2L8xMe3pHHyYZmHS936xmude6D70z6byyFnIaQtd1aOqSPl-ueg/exec';


let products=[];



function csvSplit(row){

let result=[];

let current="";

let quotes=false;


for(let char of row){

if(char=='"'){

quotes=!quotes;

}

else if(char=="," && !quotes){

result.push(current);

current="";

}

else{

current+=char;

}

}


result.push(current);

return result;

}





function parseCSV(data){


let rows=data.split(/\r?\n/);


products=[];



rows.slice(1).forEach(row=>{


if(!row.trim()) return;


let c=csvSplit(row);


products.push({

itemName:c[1]||"Unnamed",

category:c[2]||"",

brand:c[3]||"",

model:c[4]||"",

condition:c[6]||"",

description:c[7]||"",

stock:parseInt(c[16])||0,

promo:c[19]||"",

weight:c[20]||"",

price:parseFloat(c[22])||0,

image:c[29]||""

});


});


displayProducts(products);

document.getElementById("status").style.display="none";


}





function displayProducts(list){


let container=
document.getElementById("productsContainer");


container.innerHTML="";



list.forEach(p=>{


let card=document.createElement("div");

card.className="card";



card.innerHTML=`

${p.image ?
`<img class="product-img" src="${p.image}">`
:""}


<h3>${p.itemName}</h3>


<p><b>Category:</b> ${p.category}</p>

<p><b>Brand:</b> ${p.brand}</p>

<p><b>Model:</b> ${p.model}</p>

<p><b>Condition:</b> ${p.condition}</p>


<p>${p.description}</p>


<p class="price">

${p.price ?
"$"+p.price.toFixed(2)
:
"Contact"}

</p>


${p.promo ?
`<p class="promo">${p.promo}</p>`
:
""}


${p.stock ?
`<p class="stock">Stock: ${p.stock}</p>`
:
""}


${p.weight ?
`<p>Weight: ${p.weight} lbs</p>`
:
""}


<div class="card-buttons">


<a class="google-btn"
target="_blank"
href="https://www.google.com/search?tbm=isch&q=${encodeURIComponent(p.itemName)}">

🔍 Images

</a>


<a class="fb-btn"
target="_blank"
href="https://www.facebook.com/marketplace/la/search/?query=${encodeURIComponent(p.itemName)}">

F

</a>


</div>

`;


container.appendChild(card);


});


}




function sortProducts(type,order){


let sorted=[...products];


if(type==="name"){

sorted.sort((a,b)=>
order==="asc"
?
a.itemName.localeCompare(b.itemName)
:
b.itemName.localeCompare(a.itemName)
);

}


if(type==="price"){

sorted.sort((a,b)=>
order==="asc"
?
a.price-b.price
:
b.price-a.price
);

}


if(type==="stock"){

sorted.sort((a,b)=>b.stock-a.stock);

}


displayProducts(sorted);


}




document
.getElementById("searchInput")
.addEventListener("input",function(){


let text=this.value.toLowerCase();


displayProducts(

products.filter(p=>

p.itemName.toLowerCase().includes(text) ||

p.brand.toLowerCase().includes(text) ||

p.category.toLowerCase().includes(text)

)

);


});





fetch(csvFilePath)

.then(r=>r.text())

.then(parseCSV)

.catch(e=>{

document.getElementById("status").innerHTML=
"❌ Failed loading store";

console.error(e);

});


</script>


</body>

</html>
