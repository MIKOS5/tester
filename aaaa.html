<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>OBVYRIS — NES Emulator Test</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#05080d;
  color:#dce8f2;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

body{
  display:flex;
  flex-direction:column;
}

#header{
  height:58px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  padding:0 18px;
  background:#09111a;
  border-bottom:1px solid #263746;
}

.logo{
  font-size:21px;
  font-weight:bold;
  letter-spacing:3px;
  color:#ffffff;
}

.status{
  margin-left:auto;
  font-size:12px;
  color:#7f9aad;
}

#main{
  flex:1;
  min-height:0;
  position:relative;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:15px;
}

#game{
  width:100%;
  height:100%;
  max-width:1200px;
  max-height:calc(100vh - 100px);
  background:#000;
  position:relative;
}

#diagnostics{
  position:absolute;
  left:15px;
  bottom:15px;
  z-index:10000;
  width:min(520px,calc(100% - 30px));
  max-height:180px;
  overflow:auto;
  background:rgba(5,8,13,.94);
  border:1px solid #263746;
  padding:10px;
  font-family:monospace;
  font-size:11px;
  color:#9fb5c5;
}

.diag-title{
  color:#fff;
  font-weight:bold;
  margin-bottom:6px;
}

.good{
  color:#6ee7a0;
}

.bad{
  color:#ff7272;
}

.warn{
  color:#ffd166;
}

#romInfo{
  position:absolute;
  top:10px;
  left:15px;
  z-index:10000;
  background:rgba(5,8,13,.9);
  border:1px solid #263746;
  padding:8px 11px;
  font-size:11px;
  color:#91a8b8;
}
</style>

</head>

<body>

<div id="header">
  <div class="logo">OBVYRIS</div>
  <div class="status" id="status">INITIALIZING...</div>
</div>

<div id="main">

  <div id="game"></div>

  <div id="romInfo">
    ROM: Legend of Zelda.nes<br>
    CORE: NES
  </div>

  <div id="diagnostics">
    <div class="diag-title">OBVYRIS EMULATOR DIAGNOSTICS</div>
    <div id="logs"></div>
  </div>

</div>

<script>

/* =========================================================
   OBVYRIS EMULATOR CONFIG
   ========================================================= */

const ROM_URL =
  "https://archive.org/download/nes-emulator_202404/Legend%20of%20Zelda.nes";

const CORE = "nes";

const EMULATOR_DATA =
  "https://cdn.emulatorjs.org/latest/data/";


/* =========================================================
   DIAGNOSTICS
   ========================================================= */

const logs = document.getElementById("logs");
const status = document.getElementById("status");

function log(message,type=""){

  const row = document.createElement("div");

  if(type){
    row.className = type;
  }

  const time =
    new Date().toLocaleTimeString();

  row.textContent =
    "[" + time + "] " + message;

  logs.appendChild(row);

  logs.scrollTop =
    logs.scrollHeight;

  console.log(
    "[OBVYRIS]",
    message
  );
}

function setStatus(text,type=""){

  status.textContent = text;

  status.className =
    "status " + type;
}


/* =========================================================
   GLOBAL ERROR CAPTURE
   ========================================================= */

window.addEventListener(
  "error",
  function(event){

    log(
      "JAVASCRIPT ERROR: " +
      event.message,
      "bad"
    );

    setStatus(
      "JAVASCRIPT ERROR",
      "bad"
    );
  }
);

window.addEventListener(
  "unhandledrejection",
  function(event){

    log(
      "PROMISE ERROR: " +
      event.reason,
      "bad"
    );

    setStatus(
      "EMULATOR ERROR",
      "bad"
    );
  }
);


/* =========================================================
   EMULATORJS CALLBACKS
   ========================================================= */

window.EJS_onGameStart = function(){

  log(
    "Emulator reported GAME START.",
    "good"
  );

  setStatus(
    "RUNNING",
    "good"
  );
};


window.EJS_onGameExit = function(){

  log(
    "Emulator reported GAME EXIT.",
    "bad"
  );

  setStatus(
    "EMULATOR EXITED",
    "bad"
  );
};


window.EJS_onLoad = function(){

  log(
    "EmulatorJS loader finished.",
    "good"
  );

  setStatus(
    "LOADED",
    "good"
  );
};


/* =========================================================
   EMULATORJS SETTINGS
   ========================================================= */

EJS_player = "#game";

EJS_core = CORE;

EJS_gameUrl = ROM_URL;

EJS_pathtodata = EMULATOR_DATA;


/*
 Optional settings
*/

EJS_startOnLoaded = true;

EJS_backgroundColor = "#000000";

EJS_volume = 0.8;


/* =========================================================
   STARTUP LOG
   ========================================================= */

log(
  "Starting OBVYRIS EmulatorJS test..."
);

log(
  "Core: " + CORE
);

log(
  "ROM: " + ROM_URL
);

log(
  "Emulator data: " + EMULATOR_DATA
);

log(
  "Browser: " + navigator.userAgent
);


/* =========================================================
   ROM URL TEST
   ========================================================= */

fetch(
  ROM_URL,
  {
    method:"GET"
  }
)
.then(function(response){

  log(
    "ROM HTTP status: " +
    response.status +
    " " +
    response.statusText,
    response.ok ? "good" : "bad"
  );

  if(!response.ok){

    throw new Error(
      "ROM returned HTTP " +
      response.status
    );
  }

  const length =
    response.headers.get(
      "content-length"
    );

  if(length){

    log(
      "ROM size: " +
      Number(length).toLocaleString() +
      " bytes",
      "good"
    );
  }

  log(
    "ROM URL is reachable.",
    "good"
  );

})
.catch(function(error){

  log(
    "ROM FETCH FAILED: " +
    error.message,
    "bad"
  );

  log(
    "This may be a CORS or remote-server issue.",
    "warn"
  );
});


/* =========================================================
   LOAD EMULATORJS
   ========================================================= */

log(
  "Loading EmulatorJS..."
);

const script =
  document.createElement("script");

script.src =
  EMULATOR_DATA + "loader.js";

script.onload =
  function(){

    log(
      "EmulatorJS loader.js loaded.",
      "good"
    );

    setStatus(
      "STARTING EMULATOR",
      "warn"
    );
  };

script.onerror =
  function(){

    log(
      "FAILED TO LOAD EmulatorJS loader.js.",
      "bad"
    );

    setStatus(
      "LOADER FAILED",
      "bad"
    );
  };

document.body.appendChild(
  script
);

</script>

</body>
</html>
