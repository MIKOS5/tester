<!DOCTYPE html>

<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>OBVYRIS ARCHIVE // DIGITAL LIBRARY</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

*{
box-sizing:border-box;
}

body{
margin:0;
padding-top:34px;
background:
radial-gradient(circle at top,#38215f,#05060b 65%);
color:#d9eaff;
font-family:'Orbitron',sans-serif;
min-height:100vh;
}

/* DEBUG BAR */

#debug{
position:fixed;
top:0;
left:0;
right:0;
z-index:100000;
height:34px;
display:flex;
align-items:center;
justify-content:center;
padding:0 15px;
background:rgba(0,0,0,.92);
border-bottom:1px solid #651fff;
color:#7cff7c;
font-size:12px;
box-shadow:0 2px 12px black;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

/* HEADER */

.header{
padding:55px 20px 40px;
text-align:center;
background:rgba(0,0,0,.55);
border-bottom:1px solid #555;
}

.logo{
font-size:45px;
font-weight:900;
color:white;
text-shadow:
0 0 10px #8a2be2,
0 0 40px #8a2be2;
}

.subtitle{
margin-top:15px;
color:#9aa;
font-size:13px;
letter-spacing:1px;
}

/* CONTROLS */

.controls{
position:sticky;
top:34px;
z-index:5000;
background:rgba(5,6,11,.96);
padding:15px;
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
box-shadow:0 5px 20px black;
border-bottom:1px solid #32105f;
}

input,
select{
background:#100b1d;
border:1px solid #6941a5;
border-radius:9px;
padding:12px;
color:white;
font-family:inherit;
outline:none;
}

#search{
width:min(500px,90vw);
}

button{
background:#651fff;
border:none;
padding:12px 20px;
border-radius:10px;
color:white;
cursor:pointer;
font-family:inherit;
font-weight:bold;
}

button:hover{
background:#a855ff;
}

button.secondary{
background:#211532;
border:1px solid #814cff;
}

button.secondary:hover{
background:#352052;
}

/* ARCHIVE */

.archive{
max-width:1450px;
margin:auto;
padding:40px 25px 80px;
}

.archive-status{
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:10px;
margin-bottom:25px;
color:#aaa;
font-size:12px;
}

.source-count{
color:#7cff7c;
}

/* GRID */

.grid{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(290px,1fr));
gap:25px;
}

/* BOOK CARD */

.card{
background:
linear-gradient(
145deg,
rgba(255,255,255,.12),
rgba(0,0,0,.85)
);
border:1px solid #566;
border-radius:18px;
padding:20px;
position:relative;
overflow:hidden;
transition:.3s;
min-height:410px;
display:flex;
flex-direction:column;
}

.card:hover{
transform:translateY(-8px);
border-color:#b26cff;
box-shadow:0 0 30px #7b2cff;
}

.card:before{
content:"";
position:absolute;
right:-50px;
top:-50px;
width:150px;
height:150px;
background:#8a2be2;
filter:blur(60px);
opacity:.45;
pointer-events:none;
}

/* COVER */

.cover{
width:145px;
height:210px;
margin:0 auto 20px;
border-radius:7px;
overflow:hidden;
background:
linear-gradient(145deg,#21133b,#08080d);
border:1px solid #6941a5;
box-shadow:0 0 20px rgba(138,43,226,.4);
display:flex;
align-items:center;
justify-content:center;
position:relative;
z-index:2;
}

.cover img{
width:100%;
height:100%;
object-fit:cover;
}

.no-cover{
font-size:11px;
text-align:center;
color:#777;
padding:15px;
}

/* CARD TEXT */

.source{
font-size:10px;
color:#8fff8f;
letter-spacing:1px;
}

.title{
font-size:19px;
font-weight:bold;
color:white;
margin:10px 0;
line-height:1.35;
}

.author{
font-size:12px;
color:#a8a8ff;
margin-bottom:10px;
}

.meta{
font-family:Arial,sans-serif;
font-size:12px;
color:#999;
line-height:1.5;
}

.description{
font-family:Arial,sans-serif;
font-size:13px;
line-height:1.5;
color:#bbb;
margin-top:10px;
display:-webkit-box;
-webkit-line-clamp:4;
-webkit-box-orient:vertical;
overflow:hidden;
}

.tags{
margin-top:auto;
padding-top:15px;
}

.tag{
display:inline-block;
background:#24153f;
border:1px solid #814cff;
padding:5px 10px;
border-radius:20px;
font-size:9px;
margin:3px;
}

.book-button{
margin-top:15px;
width:100%;
position:relative;
z-index:2;
}

/* LOADING */

.loading{
grid-column:1/-1;
text-align:center;
padding:80px 20px;
color:#7cff7c;
}

.spinner{
width:40px;
height:40px;
border:3px solid #32105f;
border-top:3px solid #a855ff;
border-radius:50%;
animation:spin 1s linear infinite;
margin:0 auto 20px;
}

@keyframes spin{
to{transform:rotate(360deg);}
}

/* EMPTY */

.empty{
grid-column:1/-1;
text-align:center;
padding:70px;
color:#777;
}

/* READER */

#reader{
display:none;
max-width:1050px;
margin:40px auto 80px;
padding:45px;
background:
linear-gradient(
180deg,
rgba(20,20,35,.96),
rgba(8,8,15,.98)
);
border-radius:24px;
border:1px solid #555;
box-shadow:
0 0 40px black,
0 0 30px #32105f;
}

.reader-top{
display:flex;
gap:25px;
align-items:flex-start;
margin-bottom:35px;
}

.reader-cover{
width:150px;
min-width:150px;
height:220px;
border-radius:8px;
overflow:hidden;
border:1px solid #814cff;
background:#100b1d;
}

.reader-cover img{
width:100%;
height:100%;
object-fit:cover;
}

.reader-info h1{
margin:0 0 15px;
color:white;
font-size:30px;
}

.reader-info p{
font-family:Arial,sans-serif;
color:#aaa;
line-height:1.6;
}

.reader-source{
color:#7cff7c;
font-size:11px;
margin-bottom:10px;
}

.reader-actions{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:20px;
}

.reader-content{
border-top:1px solid #27384d;
padding-top:30px;
}

.reader-content h2{
color:#2793ff;
}

.reader-content p{
font-family:Georgia,serif;
font-size:19px;
line-height:1.9;
color:#ddd;
}

/* TOP BUTTON */

#topButton{
position:fixed;
right:25px;
bottom:25px;
z-index:9999;
width:55px;
height:55px;
border-radius:50%;
background:#651fff;
color:white;
font-size:24px;
font-weight:bold;
display:none;
align-items:center;
justify-content:center;
cursor:pointer;
box-shadow:0 0 20px #8a2be2;
border:1px solid #b26cff;
}

#topButton:hover{
background:#a855ff;
transform:translateY(-5px);
}

/* FOOTER */

.footer{
text-align:center;
padding:40px;
color:#666;
font-size:11px;
letter-spacing:1px;
}

/* MOBILE */

@media(max-width:700px){

.logo{
font-size:30px;
}

.header{
padding:40px 15px 30px;
}

.archive{
padding:25px 15px 60px;
}

.reader-top{
flex-direction:column;
}

.reader-cover{
margin:auto;
}

#reader{
margin:20px 10px 50px;
padding:25px;
}

.reader-info{
text-align:center;
}

.reader-actions{
justify-content:center;
}

}

</style>

</head>

<body>

<div id="debug">
LIBRARY SYSTEM INITIALIZING...
</div>

<header class="header">

<div class="logo">
OBVYRIS ARCHIVE
</div>

<div class="subtitle">
DIGITAL LIBRARY // OPEN KNOWLEDGE MEMORY DATABASE
</div>

</header>

<div class="controls">

<input
id="search"
type="search"
placeholder="Search books, authors, subjects..."
onkeydown="if(event.key==='Enter') searchBooks()">

<button onclick="searchBooks()">
SEARCH
</button>

<button
class="secondary"
onclick="randomBooks()">
RANDOM </button>

<select id="sourceFilter" onchange="renderBooks()">
<option value="all">ALL SOURCES</option>
<option value="openlibrary">OPEN LIBRARY</option>
<option value="gutenberg">PROJECT GUTENBERG</option>
</select>

</div>

<main class="archive">

<div class="archive-status">

<div>
ARCHIVE RESULTS:
<span
id="resultCount"
class="source-count">
0
</span>
</div>

<div>
SOURCES:
OPEN LIBRARY + PROJECT GUTENBERG
</div>

</div>

<div
id="books"
class="grid">

<div class="loading">
<div class="spinner"></div>
CONNECTING TO DIGITAL ARCHIVES...
</div>

</div>

</main>

<section id="reader">

<div class="reader-top">

<div class="reader-cover">
<img id="readerCover" alt="">
</div>

<div class="reader-info">

<div
id="readerSource"
class="reader-source">
</div>

<h1 id="readerTitle">
</h1>

<p id="readerAuthor">
</p>

<p id="readerDescription">
</p>

<div class="reader-actions">

<button id="readerOpen">
OPEN SOURCE
</button>

<button
class="secondary"
onclick="closeReader()">
CLOSE </button>

</div>

</div>

</div>

<div class="reader-content">

<h2>
ARCHIVE RECORD
</h2>

<p id="readerMeta">
</p>

</div>

</section>

<footer class="footer">

OBVYRIS ARCHIVE // DIGITAL LIBRARY ACCESS<br>
OPEN LIBRARY + PROJECT GUTENBERG

</footer>

<button
id="topButton"
onclick="scrollTopArchive()">
⬆ </button>

<script>

/*
=================================================
OBVYRIS DIGITAL LIBRARY
OPEN LIBRARY + PROJECT GUTENBERG
=================================================
*/

const OPEN_LIBRARY_API =
"https://openlibrary.org/search.json";

const GUTENBERG_API =
"https://gutendex.com/books/";

let books = [];


/*
=================================================
DEBUG
=================================================
*/

function debug(message){

document.getElementById("debug").innerHTML =
message;

}


/*
=================================================
OPEN LIBRARY
=================================================
*/

async function searchOpenLibrary(query){

try{

const url =
OPEN_LIBRARY_API +
"?q=" +
encodeURIComponent(query) +
"&limit=20";

const response =
await fetch(url);

if(!response.ok)
throw new Error("Open Library HTTP error");

const data =
await response.json();

return data.docs.map(book => {

let cover =
book.cover_i
?
"https://covers.openlibrary.org/b/id/"
+
book.cover_i
+
"-M.jpg"
:
null;

return {

source:"openlibrary",

title:book.title || "Unknown Title",

author:
book.author_name
?
book.author_name.join(", ")
:
"Unknown Author",

year:
book.first_publish_year || "Unknown",

cover:cover,

description:
book.first_sentence
?
Array.isArray(book.first_sentence)
?
book.first_sentence[0]
:
book.first_sentence
:
"",

subjects:
book.subject
?
book.subject.slice(0,5)
:
[],

id:book.key,

url:
book.key
?
"https://openlibrary.org"
+
book.key
:
"https://openlibrary.org/"

};

});

}
catch(error){

console.error(
"OPEN LIBRARY ERROR",
error
);

return [];

}

}


/*
=================================================
PROJECT GUTENBERG
=================================================
*/

async function searchGutenberg(query){

try{

const url =
GUTENBERG_API +
"?search=" +
encodeURIComponent(query) +
"&page=1";

const response =
await fetch(url);

if(!response.ok)
throw new Error("Gutendex HTTP error");

const data =
await response.json();

return data.results.map(book => {

let cover =
book.formats &&
book.formats["image/jpeg"]
?
book.formats["image/jpeg"]
:
null;

let readUrl =
book.formats &&
(
book.formats["text/html"]
||
book.formats["text/html; charset=utf-8"]
);

let epub =
book.formats &&
book.formats["application/epub+zip"];

let author =
book.authors &&
book.authors.length
?
book.authors
.map(a => a.name)
.join(", ")
:
"Unknown Author";

return {

source:"gutenberg",

title:book.title || "Unknown Title",

author:author,

year:
book.copyright === false
?
"Public Domain"
:
"Unknown",

cover:cover,

description:"Project Gutenberg public-domain ebook.",

subjects:
book.subjects
?
book.subjects.slice(0,5)
:
[],

id:book.id,

url:
readUrl ||
epub ||
"https://www.gutenberg.org/"

};

});

}
catch(error){

console.error(
"GUTENBERG ERROR",
error
);

return [];

}

}


/*
=================================================
SEARCH BOTH
=================================================
*/

async function searchBooks(){

const query =
document.getElementById("search").value.trim();

if(!query){

randomBooks();

return;

}

debug(
"SEARCHING OPEN LIBRARY + PROJECT GUTENBERG..."
);

showLoading();

const [
openLibraryResults,
gutenbergResults
] =
await Promise.all([

searchOpenLibrary(query),

searchGutenberg(query)

]);

books = mergeBooks(
openLibraryResults,
gutenbergResults
);

renderBooks();

debug(
"ARCHIVE ONLINE // "
+
books.length
+
" RECORDS LOADED"
);

}


/*
=================================================
MERGE
=================================================
*/

function mergeBooks(openLibrary,gutenberg){

return [
...openLibrary,
...gutenberg
];

}


/*
=================================================
RANDOM
=================================================
*/

async function randomBooks(){

debug(
"GENERATING RANDOM ARCHIVE QUERY..."
);

const subjects = [

"science fiction",
"horror",
"mystery",
"adventure",
"history",
"fantasy",
"philosophy",
"poetry",
"ghost",
"western",
"romance",
"technology"

];

const subject =
subjects[
Math.floor(
Math.random()*subjects.length
)
];

document.getElementById("search").value =
subject;

await searchBooks();

}


/*
=================================================
RENDER
=================================================
*/

function renderBooks(){

const container =
document.getElementById("books");

const filter =
document.getElementById("sourceFilter").value;

let filtered =
books.filter(book => {

if(filter==="all")
return true;

return book.source===filter;

});

document.getElementById("resultCount")
.innerHTML =
filtered.length;

if(!filtered.length){

container.innerHTML = `
<div class="empty">

NO ARCHIVE RECORDS FOUND

</div>
`;

return;

}

container.innerHTML =
filtered
.map((book,index) =>
createCard(book,index)
)
.join("");

}


/*
=================================================
CARD
=================================================
*/

function createCard(book,index){

const sourceName =
book.source==="openlibrary"
?
"OPEN LIBRARY"
:
"PROJECT GUTENBERG";

const sourceClass =
book.source;

const cover =
book.cover
?
`
<img
src="${escapeHTML(book.cover)}"
alt="Book cover"
loading="lazy"
onerror="this.parentElement.innerHTML='<div class=&quot;no-cover&quot;>NO COVER AVAILABLE</div>'">
`
:
`
<div class="no-cover">
NO COVER AVAILABLE
</div>
`;

const subjects =
(book.subjects || [])
.slice(0,4)
.map(subject =>
`
<span class="tag">
${escapeHTML(subject)}
</span>
`
)
.join("");

return `

<article class="card">

<div class="cover">

${cover}

</div>

<div class="source">

${sourceName}

</div>

<div class="title">

${escapeHTML(book.title)}

</div>

<div class="author">

${escapeHTML(book.author)}

</div>

<div class="meta">

YEAR: ${escapeHTML(String(book.year))}

</div>

<div class="description">

${escapeHTML(book.description || "No description available.")}

</div>

<div class="tags">

${subjects}

</div>

<button
class="book-button"
onclick="openBook(${index})">

VIEW ARCHIVE RECORD

</button>

</article>

`;

}


/*
=================================================
OPEN RECORD
=================================================
*/

function openBook(index){

const filter =
document.getElementById("sourceFilter").value;

const filtered =
books.filter(book => {

if(filter==="all")
return true;

return book.source===filter;

});

const book =
filtered[index];

if(!book)
return;

document.getElementById("reader")
.style.display="block";

document.getElementById("readerTitle")
.innerHTML =
escapeHTML(book.title);

document.getElementById("readerAuthor")
innerHTML =
"<strong>AUTHOR:</strong> "
+
escapeHTML(book.author);

document.getElementById("readerDescription")
.innerHTML =
escapeHTML(
book.description ||
"No description available."
);

document.getElementById("readerSource")
.innerHTML =
book.source==="openlibrary"
?
"OPEN LIBRARY // ARCHIVE RECORD"
:
"PROJECT GUTENBERG // PUBLIC DOMAIN RECORD";

document.getElementById("readerMeta")
.innerHTML =
"PUBLICATION: "
+
escapeHTML(String(book.year))
+
"<br><br>"
+
"SOURCE ID: "
+
escapeHTML(String(book.id))
+
"<br><br>"
+
"SUBJECTS: "
+
escapeHTML(
(book.subjects || []).join(" // ")
);

const cover =
document.getElementById("readerCover");

if(book.cover){

cover.src =
book.cover;

cover.style.display =
"block";

}
else{

cover.style.display =
"none";

}

document.getElementById("readerOpen")
onclick =
function(){

window.open(
book.url,
"_blank"
);

};

document.getElementById("reader")
.scrollIntoView({
behavior:"smooth",
block:"start"
});

debug(
"ACCESSING ARCHIVE RECORD // "
+
book.title
);

}


/*
=================================================
CLOSE READER
=================================================
*/

function closeReader(){

document.getElementById("reader")
.style.display="none";

debug(
"ARCHIVE BROWSER READY"
);

}


/*
=================================================
LOADING
=================================================
*/

function showLoading(){

document.getElementById("books")
.innerHTML = `

<div class="loading">

<div class="spinner"></div>

SEARCHING DIGITAL ARCHIVES...

</div>

`;

}


/*
=================================================
ESCAPE HTML
=================================================
*/

function escapeHTML(value){

return String(value ?? "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/*
=================================================
TOP BUTTON
=================================================
*/

const topButton =
document.getElementById("topButton");

window.addEventListener(
"scroll",
()=>{

if(window.scrollY > 500){

topButton.style.display="flex";

}
else{

topButton.style.display="none";

}

});

function scrollTopArchive(){

window.scrollTo({

top:0,

behavior:"smooth"

});

}


/*
=================================================
INITIAL LOAD
=================================================
*/

randomBooks();

</script>

</body>
</html>
