<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>OBVYRIS ARCHIVE // DIGITAL LIBRARY</title>

<style>

@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

*{
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
margin:0;
padding-top:34px;
background:
radial-gradient(circle at top,#38215f,#05060b 65%);
color:#d9eaff;
font-family:'Orbitron',sans-serif;
}

/* DEBUG */

#debug{
position:fixed;
top:0;
left:0;
right:0;
z-index:100000;
height:34px;
display:flex;
align-items:center;
justify-content:center;
padding:0 15px;
background:rgba(0,0,0,.94);
border-bottom:1px solid #651fff;
color:#7cff7c;
font-size:12px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
box-shadow:0 2px 12px black;
}

/* HEADER */

.header{
padding:50px 20px 40px;
text-align:center;
background:rgba(0,0,0,.55);
border-bottom:1px solid #555;
}

.logo{
font-size:45px;
font-weight:900;
color:white;
text-shadow:
0 0 10px #8a2be2,
0 0 40px #8a2be2;
}

.subtitle{
margin-top:15px;
color:#9aa;
font-size:12px;
letter-spacing:1px;
}

/* SEARCH */

.controls{
position:sticky;
top:34px;
z-index:5000;
background:rgba(5,6,11,.96);
padding:15px;
display:flex;
justify-content:center;
gap:10px;
flex-wrap:wrap;
box-shadow:0 5px 20px black;
border-bottom:1px solid #32105f;
}

input,
select{
background:#100b1d;
border:1px solid #6941a5;
border-radius:9px;
padding:12px;
color:white;
font-family:inherit;
outline:none;
}

#search{
width:min(500px,90vw);
}

button{
background:#651fff;
border:none;
padding:12px 20px;
border-radius:10px;
color:white;
cursor:pointer;
font-family:inherit;
font-weight:bold;
}

button:hover{
background:#a855ff;
}

.secondary{
background:#211532;
border:1px solid #814cff;
}

.secondary:hover{
background:#352052;
}

/* ARCHIVE */

.archive{
max-width:1450px;
margin:auto;
padding:40px 25px 80px;
}

.status{
display:flex;
justify-content:space-between;
flex-wrap:wrap;
gap:10px;
margin-bottom:25px;
font-size:11px;
color:#888;
}

#count{
color:#7cff7c;
}

/* GRID */

.grid{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(290px,1fr));
gap:25px;
}

/* CARD */

.card{
background:
linear-gradient(
145deg,
rgba(255,255,255,.12),
rgba(0,0,0,.85)
);
border:1px solid #566;
border-radius:18px;
padding:20px;
position:relative;
overflow:hidden;
transition:.3s;
min-height:460px;
display:flex;
flex-direction:column;
}

.card:hover{
transform:translateY(-8px);
border-color:#b26cff;
box-shadow:0 0 30px #7b2cff;
}

.card:before{
content:"";
position:absolute;
right:-50px;
top:-50px;
width:150px;
height:150px;
background:#8a2be2;
filter:blur(60px);
opacity:.45;
pointer-events:none;
}

/* COVER */

.cover{
width:145px;
height:210px;
margin:0 auto 20px;
background:#100b1d;
border:1px solid #6941a5;
border-radius:7px;
overflow:hidden;
display:flex;
align-items:center;
justify-content:center;
box-shadow:0 0 20px rgba(138,43,226,.4);
color:#777;
font-size:10px;
text-align:center;
}

.cover img{
width:100%;
height:100%;
object-fit:cover;
}

/* TEXT */

.source{
font-size:10px;
color:#8fff8f;
letter-spacing:1px;
}

.title{
font-size:19px;
font-weight:bold;
color:white;
margin:10px 0;
line-height:1.35;
}

.author{
font-size:12px;
color:#a8a8ff;
margin-bottom:10px;
}

.description{
font-family:Arial,sans-serif;
font-size:13px;
line-height:1.5;
color:#aaa;

display:-webkit-box;
-webkit-line-clamp:4;
-webkit-box-orient:vertical;

overflow:hidden;
}

.meta{
margin-top:auto;
padding-top:15px;
font-size:10px;
color:#777;
}

.card-actions{
display:flex;
gap:8px;
margin-top:15px;
position:relative;
z-index:2;
}

.card-actions button{
flex:1;
padding:11px 7px;
font-size:10px;
}

.read-button{
background:#651fff;
}

.source-button{
background:#211532;
border:1px solid #814cff;
}

.source-button:hover{
background:#352052;
}

/* READER */

#reader{
display:none;

max-width:1250px;

margin:40px auto 80px;

padding:45px;

background:
linear-gradient(
180deg,
rgba(20,20,35,.98),
rgba(8,8,15,.99)
);

border-radius:24px;

border:1px solid #555;

box-shadow:
0 0 40px black,
0 0 30px #32105f;
}

.readerHeader{
border-bottom:1px solid #27384d;
padding-bottom:30px;
margin-bottom:30px;
}

.readerSource{
font-size:11px;
color:#7cff7c;
margin-bottom:10px;
}

.readerTitle{
font-size:34px;
color:white;
margin-bottom:10px;
line-height:1.3;
}

.readerAuthor{
color:#a8a8ff;
font-size:13px;
}

.readerControls{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:25px;
}

/* BOOK LAYOUT */

.bookLayout{
display:grid;
grid-template-columns:230px 1fr;
gap:30px;
}

/* CHAPTER MENU */

.chapterMenu{
background:rgba(0,0,0,.45);
border:1px solid #32105f;
border-radius:15px;
padding:20px;
height:max-content;
position:sticky;
top:100px;
max-height:70vh;
overflow:auto;
}

.chapterMenu h3{
font-size:13px;
color:#2793ff;
margin-top:0;
}

.chapterButton{
display:block;
width:100%;
margin:6px 0;
padding:10px;

background:#160d2b;

border:1px solid #32105f;

border-radius:8px;

color:#aaa;

font-family:inherit;

font-size:10px;

text-align:left;

cursor:pointer;
}

.chapterButton:hover{
background:#32105f;
color:white;
border-color:#814cff;
}

/* BOOK CONTENT */

.bookContent{
background:rgba(255,255,255,.025);
border-radius:15px;
padding:35px 45px;
min-height:500px;
overflow:hidden;
}

.bookContent h1,
.bookContent h2,
.bookContent h3,
.bookContent h4,
.bookContent h5,
.bookContent h6{
color:#2793ff;
scroll-margin-top:100px;
}

.bookContent p{
font-family:
Georgia,
'Times New Roman',
serif;

font-size:19px;
line-height:1.9;

color:#ddd;

margin:0 0 1.4em;
}

.bookContent img{
max-width:100%;
height:auto;
display:block;
margin:20px auto;
}

.bookContent a{
color:#8d72ff;
}

.bookContent pre{
white-space:pre-wrap;
font-family:Georgia,'Times New Roman',serif;
font-size:18px;
line-height:1.8;
color:#ddd;
}

/* NOTICE */

.readerNotice{
background:rgba(101,31,255,.08);
border:1px solid #32105f;
border-radius:12px;
padding:15px;
margin-bottom:25px;

font-family:Arial,sans-serif;

font-size:13px;

line-height:1.6;

color:#aaa;
}

/* LOADING */

.loading{
grid-column:1/-1;
text-align:center;
padding:80px 20px;
color:#7cff7c;
}

.spinner{
width:40px;
height:40px;

border:3px solid #32105f;

border-top:3px solid #a855ff;

border-radius:50%;

animation:spin 1s linear infinite;

margin:0 auto 20px;
}

@keyframes spin{
to{
transform:rotate(360deg);
}
}

/* ERROR */

.errorBox{
padding:30px;
background:rgba(255,0,0,.05);
border:1px solid #572020;
border-radius:15px;
color:#aaa;

font-family:Arial,sans-serif;

line-height:1.6;
}

.errorBox h2{
color:#ff7777;
}

/* TOP */

#topButton{
position:fixed;

right:25px;
bottom:25px;

z-index:9999;

width:55px;
height:55px;

border-radius:50%;

background:#651fff;

color:white;

font-size:24px;

display:none;

align-items:center;
justify-content:center;

cursor:pointer;

box-shadow:0 0 20px #8a2be2;
}

/* FOOTER */

.footer{
text-align:center;
padding:40px;
color:#666;
font-size:10px;
}

/* MOBILE */

@media(max-width:800px){

.logo{
font-size:30px;
}

.bookLayout{
grid-template-columns:1fr;
}

.chapterMenu{
position:relative;
top:auto;
max-height:300px;
}

.bookContent{
padding:25px 20px;
}

.bookContent p{
font-size:17px;
}

#reader{
margin:20px 10px 60px;
padding:25px;
}

.card-actions{
flex-direction:column;
}

.readerTitle{
font-size:26px;
}

}

</style>

</head>

<body>

<div id="debug">
LIBRARY SYSTEM INITIALIZING...
</div>

<div class="header">

<div class="logo">
OBVYRIS ARCHIVE
</div>

<div class="subtitle">
DIGITAL LIBRARY // OPEN KNOWLEDGE MEMORY DATABASE
</div>

</div>

<div class="controls">

<input
id="search"
placeholder="Search books, authors, subjects..."
onkeydown="
if(event.key==='Enter')
searchBooks();
">

<button onclick="searchBooks()">
SEARCH
</button>

<button
class="secondary"
onclick="randomSearch()">
RANDOM
</button>

<select
id="source"
onchange="renderBooks()">

<option value="all">
ALL SOURCES
</option>

<option value="openlibrary">
OPEN LIBRARY
</option>

<option value="gutenberg">
PROJECT GUTENBERG
</option>

</select>

</div>

<div class="archive">

<div class="status">

<div>
ARCHIVE RECORDS:
<span id="count">0</span>
</div>

<div>
OPEN LIBRARY + PROJECT GUTENBERG
</div>

</div>

<div
id="books"
class="grid">

<div class="loading">

<div class="spinner"></div>

CONNECTING TO DIGITAL ARCHIVES...

</div>

</div>

</div>

<!-- READER -->

<section id="reader">

<div class="readerHeader">

<div
id="readerSource"
class="readerSource">
</div>

<div
id="readerTitle"
class="readerTitle">
</div>

<div
id="readerAuthor"
class="readerAuthor">
</div>

<div class="readerControls">

<button onclick="closeReader()">
CLOSE READER
</button>

<button
id="readerSourceButton"
class="secondary">
SOURCE
</button>

</div>

</div>

<div
id="readerNotice"
class="readerNotice"
style="display:none">
</div>

<div class="bookLayout">

<div
id="chapterMenu"
class="chapterMenu">

<h3>
BOOK NAVIGATION
</h3>

<div id="chapters">
</div>

</div>

<div
id="bookContent"
class="bookContent">

</div>

</div>

</section>

<div class="footer">

OBVYRIS ARCHIVE // DIGITAL LIBRARY<br>
OPEN LIBRARY + PROJECT GUTENBERG

</div>

<button
id="topButton"
onclick="window.scrollTo({top:0,behavior:'smooth'});">

⬆

</button>

<script>

/*
====================================================
OBVYRIS HYBRID DIGITAL LIBRARY
====================================================

OPEN LIBRARY
+
PROJECT GUTENBERG

GUTENBERG BOOKS ARE RETRIEVED THROUGH
THE OBVYRIS GOOGLE APPS SCRIPT PROXY.

====================================================
*/


/* ==================================================
OBVYRIS GOOGLE APPS SCRIPT
================================================== */

const API_BASE =
"https://script.google.com/macros/s/AKfycbwR9_-IIcd6yiJuQsrF9uDexBLTbYLw6sw2NlnFEGIlj83a6mY-K3x_F1czdIw3SEjX/exec";


/* ==================================================
EXTERNAL SOURCES
================================================== */

const OPEN_LIBRARY =
"https://openlibrary.org/search.json";

const GUTENDEX =
"https://gutendex.com/books/";


/* ==================================================
VARIABLES
================================================== */

let books=[];

let currentBook=null;

let currentLanding="";


/* ==================================================
DEBUG
================================================== */

function debug(message){

const element =
document.getElementById("debug");

if(element){

element.innerText=message;

}

}


/* ==================================================
SEARCH BOTH SOURCES
================================================== */

async function searchBooks(){

const query =
document
.getElementById("search")
.value
.trim();


if(!query){

await randomSearch();

return;

}


debug(
"SEARCHING OPEN LIBRARY + PROJECT GUTENBERG..."
);


showLoading();


try{

const results =
await Promise.all([
searchOpenLibrary(query),
searchGutenberg(query)
]);


books=[
...results[0],
...results[1]
];


renderBooks();


debug(
"ARCHIVE ONLINE // "+
books.length+
" RECORDS LOADED"
);


}
catch(error){

console.error(error);

books=[];

renderBooks();

debug(
"ARCHIVE SEARCH ERROR"
);

}

}


/* ==================================================
OPEN LIBRARY
================================================== */

async function searchOpenLibrary(query){

try{

const response =
await fetch(
OPEN_LIBRARY+
"?q="+
encodeURIComponent(query)+
"&limit=20"
);


if(!response.ok){

throw new Error(
"Open Library HTTP "+
response.status
);

}


const data =
await response.json();


return (
data.docs || []
).map(book=>({

source:"openlibrary",

title:
book.title ||
"Unknown Title",

author:
book.author_name
?
book.author_name.join(", ")
:
"Unknown Author",

year:
book.first_publish_year ||
"Unknown",

cover:
book.cover_i
?
"https://covers.openlibrary.org/b/id/"+
book.cover_i+
"-M.jpg"
:
null,

description:
book.first_sentence
?
Array.isArray(book.first_sentence)
?
book.first_sentence[0]
:
book.first_sentence
:
"Open Library catalog record.",

url:
book.key
?
"https://openlibrary.org"+
book.key
:
"https://openlibrary.org/",

id:
book.key,

subjects:
book.subject
?
book.subject.slice(0,6)
:
[]

}));


}
catch(error){

console.error(
"OPEN LIBRARY ERROR",
error
);

return[];

}

}


/* ==================================================
PROJECT GUTENBERG / GUTENDEX
================================================== */

async function searchGutenberg(query){

try{

const response =
await fetch(
GUTENDEX+
"?search="+
encodeURIComponent(query)+
"&mime_type=text/html"
);


if(!response.ok){

throw new Error(
"Gutendex HTTP "+
response.status
);

}


const data =
await response.json();


return (
data.results || []
).map(book=>{

const formats =
book.formats ||
{};


const html =
findFormat(
formats,
[
"text/html; charset=utf-8",
"text/html"
]
);


const text =
findFormat(
formats,
[
"text/plain; charset=utf-8",
"text/plain; charset=us-ascii",
"text/plain"
]
);


const epub =
findFormat(
formats,
[
"application/epub+zip"
]
);


const cover =
findFormat(
formats,
[
"image/jpeg"
]
);


return{

source:
"gutenberg",

title:
book.title ||
"Unknown Title",

author:
book.authors &&
book.authors.length
?
book.authors
.map(a=>a.name)
.join(", ")
:
"Unknown Author",

year:
book.copyright===false
?
"PUBLIC DOMAIN"
:
"SEE LICENSE",

cover:cover,

description:
book.summaries &&
book.summaries.length
?
book.summaries[0]
:
"Project Gutenberg ebook.",

id:
book.id,

landing:
"https://www.gutenberg.org/ebooks/"+
book.id,

html:html,

text:text,

epub:epub,

subjects:
book.subjects ||
[],

downloadCount:
book.download_count ||
0

};

});

}
catch(error){

console.error(
"GUTENBERG ERROR",
error
);

return[];

}


/* ==================================================
FIND FORMAT
================================================== */

function findFormat(formats,types){

for(
const type of types
){

if(
formats[type]
){

return formats[type];

}

}

return null;

}


/* ==================================================
RENDER BOOKS
================================================== */

function renderBooks(){

const container =
document.getElementById("books");


const source =
document
.getElementById("source")
.value;


const filtered =
books.filter(book=>{

if(source==="all"){

return true;

}

return book.source===source;

});


document
.getElementById("count")
.innerText =
filtered.length;


if(!filtered.length){

container.innerHTML = `

<div class="loading">

NO ARCHIVE RECORDS FOUND

</div>

`;

return;

}


container.innerHTML =
filtered
.map(
(book,index)=>
createCard(book,index)
)
.join("");

}


/* ==================================================
CREATE CARD
================================================== */

function createCard(book,index){

const sourceName =
book.source==="gutenberg"
?
"PROJECT GUTENBERG"
:
"OPEN LIBRARY";


const cover =
book.cover
?
`
<img
src="${escapeHTML(book.cover)}"
loading="lazy"
alt="Book cover"
onerror="this.style.display='none';">
`
:
`
<span>
NO COVER
</span>
`;


/* GUTENBERG */

if(
book.source==="gutenberg"
){

return `

<article class="card">

<div class="cover">

${cover}

</div>

<div class="source">

${sourceName}

</div>

<div class="title">

${escapeHTML(book.title)}

</div>

<div class="author">

${escapeHTML(book.author)}

</div>

<div class="description">

${escapeHTML(
book.description || ""
)}

</div>

<div class="meta">

GUTENBERG ID:
${escapeHTML(String(book.id))}

<br><br>

DOWNLOADS:
${escapeHTML(
String(book.downloadCount)
)}

</div>

<div class="card-actions">

<button
class="read-button"
onclick="openBook(${index})">

READ IN OBVYRIS

</button>

<button
class="source-button"
onclick="openSource(${index})">

SOURCE

</button>

</div>

</article>

`;

}


/* OPEN LIBRARY */

return `

<article class="card">

<div class="cover">

${cover}

</div>

<div class="source">

OPEN LIBRARY

</div>

<div class="title">

${escapeHTML(book.title)}

</div>

<div class="author">

${escapeHTML(book.author)}

</div>

<div class="description">

${escapeHTML(
book.description || ""
)}

</div>

<div class="meta">

YEAR:
${escapeHTML(String(book.year))}

</div>

<div class="card-actions">

<button
class="read-button"
onclick="openBook(${index})">

VIEW RECORD

</button>

<button
class="source-button"
onclick="openSource(${index})">

SOURCE

</button>

</div>

</article>

`;

}


/* ==================================================
GET FILTERED BOOK
================================================== */

function getFilteredBook(index){

const source =
document
.getElementById("source")
.value;


const filtered =
books.filter(book=>{

if(source==="all"){

return true;

}

return book.source===source;

});


return filtered[index];

}


/* ==================================================
OPEN SOURCE
================================================== */

function openSource(index){

const book =
getFilteredBook(index);


if(!book){

return;

}


const url =
book.source==="gutenberg"
?
book.landing
:
book.url;


window.open(
url,
"_blank",
"noopener"
);

}


/* ==================================================
OPEN BOOK
================================================== */

function openBook(index){

const book =
getFilteredBook(index);


if(!book){

return;

}


currentBook=book;


const reader =
document.getElementById("reader");


reader.style.display="block";


reader.scrollIntoView({
behavior:"smooth",
block:"start"
});


document
.getElementById("readerTitle")
.innerText =
book.title;


document
.getElementById("readerAuthor")
.innerText =
"AUTHOR // "+
book.author;


document
.getElementById("readerSourceButton")
onclick =
function(){

openCurrentSource();

};


if(
book.source==="gutenberg"
){

currentLanding =
book.landing;


document
.getElementById("readerSource")
.innerText =
"GUTENBERG // BOOK "+
book.id;


loadGutenbergBook(book);

}
else{

currentLanding =
book.url;


document
.getElementById("readerSource")
.innerText =
"OPEN LIBRARY // ARCHIVE RECORD";


document
.getElementById("readerNotice")
.style.display =
"none";


document
.getElementById("chapterMenu")
.innerHTML = `

<h3>
BOOK NAVIGATION
</h3>

<div style="
color:#777;
font-size:10px;
line-height:1.6;
">

CATALOG RECORD ONLY

</div>

`;


document
.getElementById("bookContent")
.innerHTML = `

<h2>
OPEN LIBRARY RECORD
</h2>

<p>

This is an Open Library catalog record.

</p>

<p>

Available editions, borrowing information,
and Internet Archive availability can be
accessed through the source record.

</p>

`;

}

}


/* ==================================================
OPEN CURRENT SOURCE
================================================== */

function openCurrentSource(){

if(!currentBook){

return;

}


const url =
currentBook.source==="gutenberg"
?
currentBook.landing
:
currentBook.url;


window.open(
url,
"_blank",
"noopener"
);

}


/* ==================================================
LOAD GUTENBERG BOOK THROUGH OBVYRIS PROXY
================================================== */

async function loadGutenbergBook(book){

debug(
"ACCESSING GUTENBERG BOOK "+
book.id+
" // OBVYRIS PROXY"
);


const notice =
document
.getElementById("readerNotice");


notice.style.display =
"block";


notice.innerHTML =

"OBVYRIS READER // PROJECT GUTENBERG<br>"+
"BOOK ID: "+
escapeHTML(String(book.id))+
"<br>"+
"RETRIEVING ACTUAL BOOK HTML...";


document
.getElementById("bookContent")
.innerHTML = `

<div class="loading">

<div class="spinner"></div>

LOADING BOOK FROM GUTENBERG...

</div>

`;


document
.getElementById("chapters")
innerHTML =
"<div style='color:#7cff7c;font-size:10px'>"+
"ACCESSING ARCHIVE..."+
"</div>";


try{

const response =
await fetch(
API_BASE+
"?action=gutenberg&id="+
encodeURIComponent(book.id)
);


if(!response.ok){

throw new Error(
"Proxy HTTP "+
response.status
);

}


const data =
await response.json();


if(
data.status!=="success" ||
!data.html
){

throw new Error(
"Gutenberg book was not returned"
);

}


parseGutenbergHTML(
data.html,
{
...book,
html:data.url
}
);


debug(
"BOOK LOADED // GUTENBERG "+
book.id+
" // OBVYRIS READER ONLINE"
);

}
catch(error){

console.error(
"GUTENBERG ERROR",
error
);


showGutenbergFailure(
book,
error.message
);

}

}

/* ==================================================
PARSE GUTENBERG HTML
================================================== */

function parseGutenbergHTML(html,book){

const parser =
new DOMParser();


const doc =
parser.parseFromString(
html,
"text/html"
);


/* REMOVE ACTIVE CONTENT */

doc
.querySelectorAll(
"script,style,noscript"
)
.forEach(
element =>
element.remove()
);


/* REMOVE COMMON GUTENBERG WRAPPERS */

doc
.querySelectorAll(
"#pg-header,#pg-footer,.pg-boilerplate"
)
.forEach(
element =>
element.remove()
);


const body =
doc.body;


if(!body){

throw new Error(
"NO BOOK BODY FOUND"
);

}


const reader =
document
.getElementById("bookContent");


reader.innerHTML="";


const chapterContainer =
document
.getElementById("chapters");


chapterContainer.innerHTML="";


/* FIND HEADINGS */

const headings =
[
...body.querySelectorAll(
"h1,h2,h3,h4,h5,h6"
)
];


let chapterCount=0;


headings.forEach(
heading=>{

const text =
heading.innerText
.trim();


if(!text){

return;

}


if(text.length>180){

return;

}


chapterCount++;


const id =
"obvyris-chapter-"+
chapterCount;


heading.id=id;


const button =
document
.createElement("button");


button.className =
"chapterButton";


button.innerText =
text;


button.onclick =
()=>{

document
.getElementById(id)
.scrollIntoView({
behavior:"smooth",
block:"start"
});

};


chapterContainer
.appendChild(button);

});


if(!chapterCount){

chapterContainer.innerHTML = `

<div style="
color:#777;
font-family:Arial;
font-size:12px;
line-height:1.5;
">

No chapter headings detected.

</div>

`;

}


/* COPY BOOK */

const children =
[
...body.children
];


children.forEach(
element=>{

if(
element.tagName==="NAV"
){

return;

}


if(
!element.innerText &&
!element.querySelector("img")
){

return;

}


const clone =
element.cloneNode(true);


/* REMOVE ACTIVE CONTENT */

clone
.querySelectorAll(
"script,style,noscript"
)
.forEach(
el =>
el.remove()
);


/* SAFE LINKS */

clone
.querySelectorAll("a")
.forEach(
link=>{

const href =
link.getAttribute("href");


if(
href &&
href.startsWith("#")
){

link.removeAttribute("target");

}
else{

link.target="_blank";

link.rel=
"noopener noreferrer";

}

});


/* FIX IMAGES */

clone
.querySelectorAll("img")
.forEach(
img=>{

const src =
img.getAttribute("src");


if(
src &&
!src.startsWith("http")
){

try{

img.src =
new URL(
src,
book.html
).href;

}
catch(error){

console.warn(
"IMAGE URL ERROR",
error
);

}

}

});


reader
.appendChild(clone);

});


if(
!reader.innerHTML.trim()
){

reader.innerHTML = `

<h2>
BOOK CONTENT EMPTY
</h2>

<p>

The Gutenberg HTML edition was found,
but no readable body content was detected.

</p>

`;

}

}

/* ==================================================
ESCAPE HTML
================================================== */

function escapeHTML(value){

return String(
value ?? ""
)

.replace(
/&/g,
"&amp;"
)

.replace(
/</g,
"&lt;"
)

.replace(
/>/g,
"&gt;"
)

.replace(
/"/g,
"&quot;"
)

.replace(
/'/g,
"&#039;"
);

}
