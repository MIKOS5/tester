<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Obvyris NES Test</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #070b12;
    color: #e8edf5;
    font-family: Arial, sans-serif;
}

body {
    display: flex;
    flex-direction: column;
}

.header {
    height: 64px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    padding: 0 20px;
    border-bottom: 1px solid #1d2938;
    background: #0b111b;
}

.logo {
    font-size: 21px;
    font-weight: 800;
    letter-spacing: 3px;
}

.status {
    margin-left: auto;
    font-size: 12px;
    color: #8d9aae;
}

.game-wrap {
    flex: 1;
    min-height: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px;
}

#game {
    width: 100%;
    height: 100%;
    max-width: 1200px;
    max-height: 800px;
}

.info {
    height: 42px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-top: 1px solid #1d2938;
    background: #0b111b;
    color: #758298;
    font-size: 12px;
}
</style>

<script>
/*
    EmulatorJS configuration
*/

EJS_player = "#game";

/* NES system */
EJS_core = "nes";

/*
    Test ROM
*/
EJS_gameUrl =
    "https://archive.org/download/nes-emulator_202404/Legend%20of%20Zelda.nes";

/*
    EmulatorJS data files
*/
EJS_pathtodata =
    "https://cdn.emulatorjs.org/latest/data/";

/*
    Optional settings
*/
EJS_startOnLoaded = true;
EJS_color = "#00d4ff";
</script>

</head>

<body>

<header class="header">
    <div class="logo">OBVYRIS</div>
    <div class="status">NES EMULATOR TEST</div>
</header>

<main class="game-wrap">
    <div id="game"></div>
</main>

<footer class="info">
    EmulatorJS • NES Test • Internet Archive ROM URL
</footer>

<script src="https://cdn.emulatorjs.org/latest/data/loader.js"></script>

</body>
</html>
