<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>
OBVYRIS ARCHIVE // DIGITAL LIBRARY
</title>

<style>

@import url(
'https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap'
);

*{
box-sizing:border-box;
}

body{

margin:0;

padding-top:34px;

background:
radial-gradient(
circle at top,
#38215f,
#05060b 65%
);

color:#d9eaff;

font-family:
'Orbitron',
sans-serif;

}

/* DEBUG */

#debug{

position:fixed;

top:0;
left:0;
right:0;

z-index:100000;

height:34px;

display:flex;

align-items:center;
justify-content:center;

padding:0 15px;

background:
rgba(0,0,0,.94);

border-bottom:
1px solid #651fff;

color:#7cff7c;

font-size:12px;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

box-shadow:
0 2px 12px black;

}

/* HEADER */

.header{

padding:
50px 20px 40px;

text-align:center;

background:
rgba(0,0,0,.55);

border-bottom:
1px solid #555;

}

.logo{

font-size:45px;

font-weight:900;

color:white;

text-shadow:

0 0 10px #8a2be2,
0 0 40px #8a2be2;

}

.subtitle{

margin-top:15px;

color:#9aa;

font-size:12px;

letter-spacing:1px;

}

/* SEARCH */

.controls{

position:sticky;

top:34px;

z-index:5000;

background:
rgba(5,6,11,.96);

padding:15px;

display:flex;

justify-content:center;

gap:10px;

flex-wrap:wrap;

box-shadow:
0 5px 20px black;

border-bottom:
1px solid #32105f;

}

input,
select{

background:#100b1d;

border:
1px solid #6941a5;

border-radius:9px;

padding:12px;

color:white;

font-family:inherit;

outline:none;

}

#search{

width:
min(500px,90vw);

}

button{

background:#651fff;

border:none;

padding:12px 20px;

border-radius:10px;

color:white;

cursor:pointer;

font-family:inherit;

font-weight:bold;

}

button:hover{

background:#a855ff;

}

.secondary{

background:#211532;

border:
1px solid #814cff;

}

/* ARCHIVE */

.archive{

max-width:1450px;

margin:auto;

padding:40px 25px 80px;

}

.status{

display:flex;

justify-content:space-between;

flex-wrap:wrap;

gap:10px;

margin-bottom:25px;

font-size:11px;

color:#888;

}

#count{

color:#7cff7c;

}

/* BOOK GRID */

.grid{

display:grid;

grid-template-columns:
repeat(
auto-fit,
minmax(290px,1fr)
);

gap:25px;

}

/* CARD */

.card{

background:

linear-gradient(
145deg,
rgba(255,255,255,.12),
rgba(0,0,0,.85)
);

border:
1px solid #566;

border-radius:18px;

padding:20px;

position:relative;

overflow:hidden;

transition:.3s;

min-height:440px;

display:flex;

flex-direction:column;

}

.card:hover{

transform:
translateY(-8px);

border-color:#b26cff;

box-shadow:
0 0 30px #7b2cff;

}

.card:before{

content:"";

position:absolute;

right:-50px;
top:-50px;

width:150px;
height:150px;

background:#8a2be2;

filter:blur(60px);

opacity:.45;

pointer-events:none;

}

/* COVER */

.cover{

width:145px;
height:210px;

margin:
0 auto 20px;

background:
#100b1d;

border:
1px solid #6941a5;

border-radius:7px;

overflow:hidden;

display:flex;

align-items:center;
justify-content:center;

box-shadow:
0 0 20px
rgba(138,43,226,.4);

}

.cover img{

width:100%;
height:100%;

object-fit:cover;

}

/* CARD TEXT */

.source{

font-size:10px;

color:#8fff8f;

letter-spacing:1px;

}

.title{

font-size:19px;

font-weight:bold;

color:white;

margin:10px 0;

line-height:1.35;

}

.author{

font-size:12px;

color:#a8a8ff;

margin-bottom:10px;

}

.description{

font-family:Arial,sans-serif;

font-size:13px;

line-height:1.5;

color:#aaa;

display:
-webkit-box;

-webkit-line-clamp:4;

-webkit-box-orient:vertical;

overflow:hidden;

}

.meta{

margin-top:auto;

padding-top:15px;

font-size:10px;

color:#777;

}

.card button{

margin-top:15px;

width:100%;

position:relative;

z-index:2;

}

/* READER */

#reader{

display:none;

max-width:1200px;

margin:
40px auto 80px;

padding:45px;

background:

linear-gradient(
180deg,
rgba(20,20,35,.98),
rgba(8,8,15,.99)
);

border-radius:24px;

border:
1px solid #555;

box-shadow:

0 0 40px black,
0 0 30px #32105f;

}

.readerHeader{

border-bottom:
1px solid #27384d;

padding-bottom:30px;

margin-bottom:30px;

}

.readerSource{

font-size:11px;

color:#7cff7c;

margin-bottom:10px;

}

.readerTitle{

font-size:34px;

color:white;

margin-bottom:10px;

}

.readerAuthor{

color:#a8a8ff;

font-size:13px;

}

.readerControls{

display:flex;

gap:10px;

flex-wrap:wrap;

margin-top:25px;

}

/* BOOK LAYOUT */

.bookLayout{

display:grid;

grid-template-columns:
230px 1fr;

gap:30px;

}

/* CHAPTERS */

.chapterMenu{

background:
rgba(0,0,0,.45);

border:
1px solid #32105f;

border-radius:15px;

padding:20px;

height:max-content;

position:sticky;

top:100px;

}

.chapterMenu h3{

font-size:13px;

color:#2793ff;

}

.chapterButton{

display:block;

width:100%;

margin:6px 0;

padding:10px;

background:
#160d2b;

border:
1px solid #32105f;

border-radius:8px;

color:#aaa;

font-family:inherit;

font-size:10px;

text-align:left;

cursor:pointer;

}

.chapterButton:hover{

background:#32105f;

color:white;

border-color:#814cff;

}

/* BOOK */

.bookContent{

background:
rgba(255,255,255,.025);

border-radius:15px;

padding:
35px 45px;

min-height:500px;

}

.bookContent h1,
.bookContent h2,
.bookContent h3{

color:#2793ff;

}

.bookContent p{

font-family:
Georgia,
'Times New Roman',
serif;

font-size:19px;

line-height:1.9;

color:#ddd;

margin:
0 0 1.4em;

}

.bookContent img{

max-width:100%;

height:auto;

}

.bookContent a{

color:#8d72ff;

}

/* LOADING */

.loading{

grid-column:
1/-1;

text-align:center;

padding:80px 20px;

color:#7cff7c;

}

.spinner{

width:40px;

height:40px;

border:
3px solid #32105f;

border-top:
3px solid #a855ff;

border-radius:50%;

animation:
spin 1s linear infinite;

margin:
0 auto 20px;

}

@keyframes spin{

to{
transform:rotate(360deg);
}

}

/* TOP */

#topButton{

position:fixed;

right:25px;

bottom:25px;

z-index:9999;

width:55px;
height:55px;

border-radius:50%;

background:#651fff;

color:white;

font-size:24px;

display:none;

align-items:center;
justify-content:center;

cursor:pointer;

box-shadow:
0 0 20px #8a2be2;

}

/* FOOTER */

.footer{

text-align:center;

padding:40px;

color:#666;

font-size:10px;

}

/* MOBILE */

@media(max-width:800px){

.logo{
font-size:30px;
}

.bookLayout{

grid-template-columns:1fr;

}

.chapterMenu{

position:relative;

top:auto;

}

.bookContent{

padding:25px 20px;

}

.bookContent p{

font-size:17px;

}

#reader{

margin:
20px 10px 60px;

padding:25px;

}

}

</style>

</head>

<body>

<div id="debug">
LIBRARY SYSTEM INITIALIZING...
</div>

<div class="header">

<div class="logo">
OBVYRIS ARCHIVE
</div>

<div class="subtitle">
DIGITAL LIBRARY // OPEN KNOWLEDGE MEMORY DATABASE
</div>

</div>

<div class="controls">

<input
id="search"
placeholder="Search books, authors, subjects..."
onkeydown="
if(event.key==='Enter')
searchBooks();
">

<button onclick="searchBooks()">
SEARCH
</button>

<button
class="secondary"
onclick="randomSearch()">
RANDOM </button>

<select
id="source"
onchange="renderBooks()">

<option value="all">
ALL SOURCES
</option>

<option value="openlibrary">
OPEN LIBRARY
</option>

<option value="gutenberg">
PROJECT GUTENBERG
</option>

</select>

</div>

<div class="archive">

<div class="status">

<div>
ARCHIVE RECORDS:
<span id="count">0</span>
</div>

<div>
OPEN LIBRARY + PROJECT GUTENBERG
</div>

</div>

<div
id="books"
class="grid">

</div>

</div>

<!-- READER -->

<section id="reader">

<div class="readerHeader">

<div
id="readerSource"
class="readerSource">
</div>

<div
id="readerTitle"
class="readerTitle">
</div>

<div
id="readerAuthor"
class="readerAuthor">
</div>

<div class="readerControls">

<button onclick="closeReader()">
CLOSE READER
</button>

<button
class="secondary"
onclick="window.open(currentLanding,'_blank')">
GUTENBERG SOURCE </button>

</div>

</div>

<div class="bookLayout">

<div
id="chapterMenu"
class="chapterMenu">

<h3>
BOOK NAVIGATION
</h3>

<div id="chapters">
Loading...
</div>

</div>

<div
id="bookContent"
class="bookContent">

<div class="loading">

<div class="spinner"></div>

LOADING BOOK...

</div>

</div>

</div>

</section>

<div class="footer">

OBVYRIS ARCHIVE // DIGITAL LIBRARY<br>
OPEN LIBRARY + PROJECT GUTENBERG

</div>

<button
id="topButton"
onclick="window.scrollTo({top:0,behavior:'smooth'})">
⬆ </button>

<script>

/*
================================================
OBVYRIS HYBRID LIBRARY
================================================
*/

const OPEN_LIBRARY =
"https://openlibrary.org/search.json";

const GUTENDEX =
"https://gutendex.com/books/";

let books=[];

let currentLanding="";

let currentBook=null;


/*
================================================
DEBUG
================================================
*/

function debug(text){

document
.getElementById("debug")
.innerText=text;

}


/*
================================================
SEARCH
================================================
*/

async function searchBooks(){

const query=
document
.getElementById("search")
.value
.trim();

if(!query){

randomSearch();

return;

}

debug(
"SEARCHING OPEN LIBRARY + GUTENBERG..."
);

showLoading();

const results=
await Promise.all([

searchOpenLibrary(query),

searchGutenberg(query)

]);

books=[
...results[0],
...results[1]
];

renderBooks();

debug(
"ARCHIVE ONLINE // "
+
books.length+
" RECORDS"
);

}


/*
================================================
OPEN LIBRARY SEARCH
================================================
*/

async function searchOpenLibrary(query){

try{

const response=
await fetch(

OPEN_LIBRARY+
"?q="+
encodeURIComponent(query)+
"&limit=20"

);

const data=
await response.json();

return data.docs.map(book=>({

source:
"openlibrary",

title:
book.title ||
"Unknown Title",

author:
book.author_name
?
book.author_name.join(", ")
:
"Unknown Author",

year:
book.first_publish_year ||
"Unknown",

cover:
book.cover_i
?
"https://covers.openlibrary.org/b/id/"+
book.cover_i+
"-M.jpg"
:
null,

description:
book.first_sentence
?
Array.isArray(book.first_sentence)
?
book.first_sentence[0]
:
book.first_sentence
:
"",

url:
book.key
?
"https://openlibrary.org"+
book.key
:
"https://openlibrary.org/",

id:
book.key

}));

}
catch(e){

console.error(e);

return[];

}

}


/*
================================================
GUTENBERG SEARCH
================================================
*/

async function searchGutenberg(query){

try{

const response=
await fetch(

GUTENDEX+
"?search="+
encodeURIComponent(query)

);

const data=
await response.json();

return data.results.map(book=>{

const formats=
book.formats||
{};

const html=
findFormat(
formats,
[
"text/html; charset=utf-8",
"text/html"
]
);

const text=
findFormat(
formats,
[
"text/plain; charset=utf-8",
"text/plain; charset=us-ascii",
"text/plain"
]
);

const epub=
findFormat(
formats,
[
"application/epub+zip"
]
);

return{

source:
"gutenberg",

title:
book.title,

author:
book.authors &&
book.authors.length
?
book.authors
.map(a=>a.name)
.join(", ")
:
"Unknown Author",

year:
book.copyright===false
?
"PUBLIC DOMAIN"
:
"SEE LICENSE",

cover:
formats["image/jpeg"]||
null,

description:
book.summaries &&
book.summaries.length
?
book.summaries[0]
:
"Project Gutenberg ebook.",

id:
book.id,

landing:
"https://www.gutenberg.org/ebooks/"+
book.id,

html:html,

text:text,

epub:epub,

subjects:
book.subjects||[]

};

});

}
catch(e){

console.error(e);

return[];

}

}


/*
================================================
FIND FORMAT
================================================
*/

function findFormat(formats,types){

for(const type of types){

if(formats[type])
return formats[type];

}

return null;

}


/*
================================================
RENDER
================================================
*/

function renderBooks(){

const container=
document.getElementById("books");

const source=
document.getElementById("source")
.value;

const filtered=
books.filter(book=>{

if(source==="all")
return true;

return book.source===source;

});

document
.getElementById("count")
.innerText=
filtered.length;

if(!filtered.length){

container.innerHTML=`

<div class="loading">

NO ARCHIVE RECORDS FOUND

</div>

`;

return;

}

container.innerHTML=
filtered
.map((book,index)=>card(book,index))
.join("");

}


/*
================================================
CARD
================================================
*/

function card(book,index){

const source=
book.source===
"gutenberg"
?
"PROJECT GUTENBERG"
:
"OPEN LIBRARY";

const cover=
book.cover
?
`
<img
src="${escapeHTML(book.cover)}"
loading="lazy"
onerror="
this.style.display='none'
">
`
:
"";

return`

<article class="card">

<div class="cover">

${cover}

${!book.cover
?
"<span>NO COVER</span>"
:
""}

</div>

<div class="source">
${source}
</div>

<div class="title">
${escapeHTML(book.title)}
</div>

<div class="author">
${escapeHTML(book.author)}
</div>

<div class="description">
${escapeHTML(book.description||"")}
</div>

<div class="meta">

YEAR:
${escapeHTML(book.year)}

</div>

<button
onclick="openBook(${index})">

${book.source==="gutenberg"
?
"READ BOOK"
:
"VIEW RECORD"}

</button>

</article>

`;

}


/*
================================================
OPEN BOOK
================================================
*/

function openBook(index){

const source=
document
.getElementById("source")
.value;

const filtered=
books.filter(book=>{

if(source==="all")
return true;

return book.source===source;

});

const book=
filtered[index];

if(!book)
return;

currentBook=book;

document
.getElementById("reader")
.style.display="block";

document
.getElementById("reader")
.scrollIntoView({
behavior:"smooth"
});

document
.getElementById("readerTitle")
.innerText=
book.title;

document
.getElementById("readerAuthor")
.innerText=
"AUTHOR // "+book.author;

if(book.source==="gutenberg"){

currentLanding=
book.landing;

document
.getElementById("readerSource")
.innerText=
"GUTENBERG // BOOK "+
book.id;

loadGutenbergBook(book);

}
else{

currentLanding=
book.url;

document
.getElementById("readerSource")
.innerText=
"OPEN LIBRARY // ARCHIVE RECORD";

document
.getElementById("bookContent")
innerHTML=`

<h2>
OPEN LIBRARY RECORD
</h2>

<p>
This record is catalog information from Open Library.
</p>

<p>
Use the source link to access available editions,
borrow information, and Internet Archive availability.
</p>

`;

document
.getElementById("chapters")
innerHTML=
"<div style='color:#777'>NO CHAPTER DATA</div>";

}

}


/*
================================================
LOAD GUTENBERG BOOK
================================================
*/

async function loadGutenbergBook(book){

debug(
"ACCESSING GUTENBERG BOOK "+
book.id+
"..."
);

document
.getElementById("bookContent")
.innerHTML=`

<div class="loading">

<div class="spinner"></div>

RETRIEVING BOOK TEXT...

</div>

`;

try{

if(!book.html){

throw new Error(
"No HTML format available"
);

}

const response=
await fetch(book.html);

if(!response.ok){

throw new Error(
"Unable to retrieve HTML"
);

}

const html=
await response.text();

parseGutenbergHTML(html);

debug(
"BOOK LOADED // GUTENBERG "+
book.id
);

}
catch(error){

console.error(
"GUTENBERG BOOK ERROR",
error
);

document
.getElementById("bookContent")
.innerHTML=`

<h2>
BOOK FILE UNAVAILABLE
</h2>

<p>

The browser could not directly retrieve
the Gutenberg HTML file.

</p>

<p>

The canonical Project Gutenberg
book page is available below.

</p>

<button
onclick="
window.open(
'${book.landing}',
'_blank'
)">

OPEN GUTENBERG BOOK

</button>

`;

document
.getElementById("chapters")
innerHTML=
"<div style='color:#777'>SOURCE PAGE AVAILABLE</div>";

debug(
"GUTENBERG FILE ACCESS FAILED"
);

}

}


/*
================================================
PARSE GUTENBERG HTML
================================================
*/

function parseGutenbergHTML(html){

const parser=
new DOMParser();

const doc=
parser.parseFromString(
html,
"text/html"
);


/*
REMOVE UNWANTED ELEMENTS
*/

doc
.querySelectorAll(
"script,style,noscript"
)
.forEach(el=>
el.remove()
);


/*
FIND BODY
*/

const body=
doc.body;

if(!body){

throw new Error(
"No document body"
);

}


/*
CREATE SAFE READER
*/

const reader=
document
.getElementById("bookContent");

reader.innerHTML="";


/*
FIND HEADINGS
*/

const headings=
[
...body.querySelectorAll(
"h1,h2,h3,h4"
)
];


/*
CREATE CHAPTER NAVIGATION
*/

const chapterContainer=
document
.getElementById("chapters");

chapterContainer.innerHTML="";


let chapterCount=0;


/*
PROCESS HEADINGS
*/

headings.forEach((heading)=>{

const text=
heading.innerText
.trim();

if(!text)
return;


/*
IGNORE FRONT MATTER
*/

if(
text.length>150
)
return;


chapterCount++;

const id=
"chapter-"+chapterCount;

heading.id=id;

const button=
document
.createElement("button");

button.className=
"chapterButton";

button.innerText=
text;

button.onclick=
()=>{

document
.getElementById(id)
.scrollIntoView({
behavior:"smooth",
block:"start"
});

};

chapterContainer
.appendChild(button);

});


/*
COPY CONTENT
*/

const elements=
[
...body.children
];

elements.forEach(el=>{

/*
REMOVE PG NAVIGATION
*/

if(
el.tagName==="NAV" ||
el.id==="pg-header" ||
el.id==="pg-footer"
)
return;


/*
SKIP EMPTY ELEMENTS
*/

if(
!el.innerText &&
!el.querySelector("img")
)
return;


/*
CLONE
*/

const clone=
el.cloneNode(true);


/*
REMOVE EXTERNAL SCRIPTS
*/

clone
.querySelectorAll(
"script,style"
)
.forEach(x=>
x.remove()
);


/*
REMOVE LINKS THAT POINT
TO PG INTERNAL FILES
*/

clone
.querySelectorAll("a")
.forEach(a=>{

a.target="_blank";

});


reader
.appendChild(clone);

});


if(!reader.innerHTML.trim()){

reader.innerHTML=`

<h2>
BOOK CONTENT EMPTY
</h2>

<p>
Open the original Gutenberg record.
</p>

`;

}


}


/*
================================================
RANDOM
================================================
*/

async function randomSearch(){

const subjects=[

"dracula",
"ghost",
"horror",
"mystery",
"adventure",
"science fiction",
"western",
"pirates",
"poetry",
"philosophy",
"history",
"fantasy"

];

const query=
subjects[
Math.floor(
Math.random()*
subjects.length
)
];

document
.getElementById("search")
.value=query;

await searchBooks();

}


/*
================================================
LOADING
================================================
*/

function showLoading(){

document
.getElementById("books")
.innerHTML=`

<div class="loading">

<div class="spinner"></div>

SEARCHING DIGITAL ARCHIVES...

</div>

`;

}


/*
================================================
CLOSE
================================================
*/

function closeReader(){

document
.getElementById("reader")
.style.display="none";

window.scrollTo({

top:0,

behavior:"smooth"

});

debug(
"ARCHIVE BROWSER READY"
);

}


/*
================================================
ESCAPE
================================================
*/

function escapeHTML(value){

return String(
value??""
)

.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/*
================================================
TOP BUTTON
================================================
*/

const topButton=
document
.getElementById("topButton");

window.addEventListener(
"scroll",
()=>{

if(window.scrollY>500)

topButton.style.display="flex";

else

topButton.style.display="none";

});


/*
================================================
START
================================================
*/

randomSearch();

</script>

</body>

</html>
