<!DOCTYPE html>
<html>
<head>
<title>Universal API Structure Tester</title>

<style>

body{
    background:#111;
    color:white;
    font-family:Arial;
    padding:20px;
}

button{
    padding:10px;
    margin:5px;
    cursor:pointer;
}

input{
    width:80%;
    padding:10px;
    background:#222;
    color:white;
    border:1px solid #555;
}

.card{
    background:#222;
    padding:15px;
    margin:10px 0;
    border-radius:8px;
}

.good{
    color:#00ff88;
}

.bad{
    color:#ff5555;
}

pre{
    background:#000;
    padding:10px;
    overflow:auto;
    max-height:500px;
}

</style>

</head>


<body>


<h1>Universal API Structure Tester</h1>


<h3>API URL</h3>


<input id="apiURL"
placeholder="Enter JSON API URL">


<button onclick="runAPI()">
Run API Test
</button>


<button onclick="copyResults()">
Copy Results
</button>



<div id="output"></div>



<script>


let results=[];




async function runAPI(){


let apiURL=
document.getElementById("apiURL").value.trim();


if(!apiURL){

alert("Enter API URL");

return;

}


document.getElementById("output").innerHTML="";

results=[];


await testAPI(apiURL);


alert("Finished");


}





async function testAPI(apiURL){


let proxy=
"https://api.allorigins.win/raw?url="
+
encodeURIComponent(apiURL);



let box=document.createElement("div");

box.className="card";


document
.getElementById("output")
.appendChild(box);



box.innerHTML=`

<h3>
${apiURL}
</h3>

<p>
Loading...
</p>

`;



try{


let response=
await fetch(proxy);



if(!response.ok){


box.innerHTML=`

<h3>
${apiURL}
</h3>

<p class="bad">

FAILED HTTP ${response.status}

</p>

`;

return;

}



let json=
await response.json();



let paths=[];


scan(
json,
"",
paths
);



let unique=[
...new Set(paths)
];



let id=results.length;



results.push({

url:apiURL,

keys:unique.length,

paths:unique,

json:json

});





box.innerHTML=`

<h3>
API Result
</h3>


<p class="good">

SUCCESS

</p>


<p>

Keys Found:

<b>${unique.length}</b>

</p>


<button onclick="showJSON(${id})">
Show JSON
</button>


<button onclick="showPaths(${id})">
Show Paths
</button>


`;



}

catch(e){


box.innerHTML=`

<p class="bad">

ERROR:

${e.message}

</p>

`;

}



}







function scan(obj,path,list){


if(obj===null)
return;



if(Array.isArray(obj)){


list.push(path+"[]");


if(obj.length){

scan(
obj[0],
path+"[]",
list
);

}


return;

}





if(typeof obj==="object"){


for(let key in obj){


let newPath=
path+"."+key;


list.push(newPath);


scan(
obj[key],
newPath,
list
);


}


}



}







function showJSON(id){


let data=
results[id];


let w=
window.open();



w.document.write(

"<pre>"+
JSON.stringify(
data.json,
null,
2
)+
"</pre>"

);


}





function showPaths(id){


let data=
results[id];


let w=
window.open();



w.document.write(

"<pre>"+
data.paths.join("\n")
+
"</pre>"

);


}





function copyResults(){


navigator.clipboard.writeText(

JSON.stringify(
results,
null,
2
)

);


alert(
"Copied JSON"
);


}



</script>


</body>
</html>
