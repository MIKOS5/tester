<!DOCTYPE html>
<html>
<head>

<title>Universal API Explorer</title>

<style>

body{
    background:#111;
    color:#eee;
    font-family:Arial, sans-serif;
    padding:20px;
}


input{
    width:80%;
    padding:12px;
    background:#222;
    color:white;
    border:1px solid #555;
    border-radius:5px;
}


button{
    padding:10px 15px;
    margin:5px;
    cursor:pointer;
    background:#333;
    color:white;
    border:1px solid #666;
    border-radius:5px;
}


button:hover{
    background:#555;
}


.card{

    background:#222;
    padding:15px;
    margin:15px 0;
    border-radius:10px;

}


.good{
    color:#00ff88;
}


.bad{
    color:#ff5555;
}


pre{

background:#000;
padding:15px;
overflow:auto;
max-height:500px;

}


table{

border-collapse:collapse;
width:100%;

}


td,th{

border:1px solid #555;
padding:8px;

}


#search{

width:300px;

}


</style>


</head>


<body>


<h1>🌐 Universal API Explorer</h1>


<p>
Paste any JSON API:
</p>


<input id="url"
placeholder="https://api.example.com/data"
value="https://jsonplaceholder.typicode.com/posts">


<button onclick="runAPI()">
Run API
</button>



<button onclick="copyJSON()">
Copy JSON
</button>


<button onclick="downloadJSON()">
Download
</button>


<br><br>


<input id="search"
placeholder="Search JSON..."
onkeyup="searchJSON()">



<div id="output"></div>



<script>


let apiData=null;



async function runAPI(){


let url=
document.getElementById("url").value;



let output=
document.getElementById("output");


output.innerHTML=
`
<div class="card">
Loading...
</div>
`;



try{


let response;


try{

response=
await fetch(url);

}
catch{

let proxy=
"https://api.allorigins.win/raw?url="
+
encodeURIComponent(url);


response=
await fetch(proxy);

}



if(!response.ok){

throw new Error(
"HTTP "+response.status
);

}



let text=
await response.text();


apiData=
JSON.parse(text);



displayResults();



}

catch(e){


output.innerHTML=
`
<div class="card bad">

<h2>Failed</h2>

<pre>${e.message}</pre>

</div>
`;

}


}





function displayResults(){


let output=
document.getElementById("output");



let paths=[];


scan(
apiData,
"",
paths
);



let rows=
Array.isArray(apiData)
?
apiData
:
[];



output.innerHTML=
`

<div class="card">

<h2 class="good">
SUCCESS
</h2>


<p>
Type:
<b>
${Array.isArray(apiData)?"Array":"Object"}
</b>
</p>


<p>
Keys Found:
<b>${paths.length}</b>
</p>


<p>
Records:
<b>${rows.length}</b>
</p>


</div>



<div class="card">

<h2>
Structure
</h2>


<pre>
${paths.join("\n")}
</pre>


</div>



<div class="card">

<h2>
Table Preview
</h2>

${makeTable(rows)}

</div>



<div class="card">

<h2>
Raw JSON
</h2>


<pre id="json">
${JSON.stringify(apiData,null,2)}
</pre>


</div>



<div class="card">

<h2>
JavaScript Fetch Example
</h2>


<pre>

fetch("${document.getElementById("url").value}")
.then(r=>r.json())
.then(data=>{
    console.log(data);
});

</pre>


</div>


`;



}





function scan(obj,path,list){


if(obj===null)
return;



if(Array.isArray(obj)){


list.push(
path+"[]"
);


if(obj.length){

scan(
obj[0],
path+"[]",
list
);

}


return;

}



if(typeof obj==="object"){


for(let k in obj){


let p=
path+"."+k;


list.push(p);


scan(
obj[k],
p,
list
);


}


}



}





function makeTable(data){


if(!Array.isArray(data)
|| data.length===0)

return "No array data";



let keys=
Object.keys(data[0]);



let html="<table><tr>";



keys.forEach(k=>{

html+=
"<th>"+k+"</th>";

});


html+="</tr>";



data.slice(0,20).forEach(row=>{


html+="<tr>";


keys.forEach(k=>{


let value=
row[k];


if(typeof value==="object")

value=
JSON.stringify(value);



html+=
"<td>"+value+"</td>";


});


html+="</tr>";


});


html+="</table>";



return html;


}






function copyJSON(){


if(!apiData)return;


navigator.clipboard.writeText(

JSON.stringify(
apiData,
null,
2
)

);


alert(
"Copied"
);


}






function downloadJSON(){


if(!apiData)return;


let blob=
new Blob(

[
JSON.stringify(
apiData,
null,
2
)
],

{
type:"application/json"
}

);



let a=
document.createElement("a");


a.href=
URL.createObjectURL(blob);


a.download=
"api-data.json";


a.click();


}






function searchJSON(){


let term=
document.getElementById("search").value
.toLowerCase();


let box=
document.getElementById("json");


if(!apiData || !box)
return;



let text=
JSON.stringify(
apiData,
null,
2
);



if(term){

let lines=
text.split("\n")
.filter(x=>
x.toLowerCase()
.includes(term)
);


box.innerHTML=
lines.join("\n");


}

else{


box.innerHTML=
text;


}



}


</script>


</body>
</html>
