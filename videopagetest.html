<script>

const STREAM_API =
"https://script.google.com/macros/s/AKfycbynB1gx8xRVH4cNtulKZv3Kr5CUyV7rATcZgyCJ73JStoxOw0meB6vqCV3AkIAUMkqZ/exec";

const STATION_API =
"https://script.google.com/macros/s/AKfycbyasf7oke6ZAhjgD-j2HGcR9bBysso2M9RuUuOgXZUQ7UkQ6CAOMV4PfGM3ViLUz6bygg/exec";

const video = document.getElementById("video");
video.volume = 1;
document.getElementById("volumeSlider").value = 100;
const youtubePlayer =
document.getElementById("youtubePlayer");


function isYouTube(url){

    return url.includes("youtube.com") ||
           url.includes("youtu.be");

}


function getYouTubeID(url){

    try{

        let u = new URL(url);

        if(u.hostname.includes("youtu.be")){
            return u.pathname.substring(1);
        }

        return u.searchParams.get("v");

    }
    catch(e){

        return null;

    }

}


function playYouTube(url){

    const id=getYouTubeID(url);

    if(!id){
        console.log("Invalid YouTube URL");
        return;
    }


    video.style.display="none";

    youtubePlayer.style.display="block";


    youtubePlayer.src =
    "https://www.youtube.com/embed/"
    + id +
    "?autoplay=1" +
    "&controls=0" +
    "&modestbranding=1" +
    "&rel=0" +
    "&disablekb=1" +
    "&iv_load_policy=3";

}


function hideYouTube(){

    youtubePlayer.src="";

    youtubePlayer.style.display="none";

    video.style.display="block";

}
   
let list=[];
let filtered=[];
let index=0;

let currentSource="";

let currentStationURL = "";
let stationWatcher = null;
let stationMode = false;
let streamList=[];
let renderIndex=0;
const CHUNK=120;

/* CHAT API */
const API_URL = "https://script.google.com/macros/s/AKfycbzin84qDcZ9L1q4pTBtHZGKJSTDcZ_wnmgWmnmgPgf1jrc1nRprzbEBixKMSHcdkxiZBg/exec";

let chatOpen=false;
let chatData=[];

/* ROOM ID (video stream based) */
function getRoom(){

  const stream = filtered[index];

  return stream?.url || "global-video";

}

/* TOGGLE CHAT */
function toggleChat(){
  const box=document.getElementById("chatPopup");
  chatOpen=!chatOpen;
  box.classList.toggle("hidden");
  if(chatOpen) loadChat();
}

/* LOAD CHAT */
async function loadChat(){
  const res=await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({
      action:"get",
      station:getRoom()
    })
  });

  const data=await res.json();
  chatData=Array.isArray(data)?data:[];
  renderChat();

  const title = document.querySelector(".chat-popup-header span");
  title.innerText = "💬 " + (document.getElementById("now").innerText || getRoom());
}

/* SEND CHAT */
async function sendChat(){
  let name=document.getElementById("chatName").value||"Anon";
  let msg=document.getElementById("chatMsg").value;

  if(!msg) return;

  name=name.trim().slice(0,8);
  msg=msg.trim().slice(0,100);

  document.getElementById("chatMsg").value="";

  const station = getRoom();
  const stationName = document.getElementById("now").innerText || station;

  await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({
      action:"send",
      station,
      stationName,   // ✅ THIS is what you were missing
      name,
      message:msg
    })
  });

  loadChat();
}

/* RENDER CHAT */
function renderChat(){
  const box=document.getElementById("chatLog");
  box.innerHTML="";

  const welcome={
    system:true,
    name:"System",
    message:`Chat for ${getRoom()}`
  };

  [welcome,...chatData].forEach(m=>{
    box.innerHTML+=`
      <div class="chat-msg" style="${m.system?"opacity:0.6;text-align:center;":""}">
        <span class="chat-name">${m.system?"":m.name+": "}</span>
        ${m.message}
      </div>
    `;
  });

  box.scrollTop=box.scrollHeight;
}

/* AUTO REFRESH */
setInterval(()=>{
  if(chatOpen && document.visibilityState==="visible"){
    loadChat();
  }
},3000);

/* =========================
   ORIGINAL VIDEO CODE (UNCHANGED)
========================= */

async function load(){

    document.getElementById("list").innerHTML =
    `<div class="card">Connecting to Video API...</div>`;


    try {

        console.log("API:", STREAM_API);


        const response = await fetch(STREAM_API, {
            method:"GET",
            redirect:"follow"
        });


        console.log("HTTP STATUS:", response.status);


        const text = await response.text();


        console.log("RAW API:", text.substring(0,500));


        const data = JSON.parse(text);


        console.log("JSON DATA:", data);



        if(!data.streams){
            throw new Error("No streams array found");
        }



        streamList = data.streams
        .filter(s=>{

            return (
                s.status &&
                s.status.toUpperCase()==="ONLINE" &&
                s.url
            );

        })
        .map(s=>({

    name:String(s.name || "Unknown"),

    group:String(s.group || "Other"),

    country:String(s.country || "Unknown"),

    language:String(s.language || "Unknown"),

    url:String(s.url || ""),

    logo:String(s.logo || "")

}))
.filter(s=>s.url);



        streamList.sort((a,b)=>
    String(a.name || "")
    .localeCompare(
        String(b.name || "")
    )
);



        list=[...streamList];


        console.log(
            "ONLINE CHANNELS:",
            list.length
        );


        buildGroups();

buildCountries();

buildLanguages();

filtered=[...list];

render(true);



        document.getElementById("now").innerText =
        list.length+" Channels Loaded";


    }
    catch(err){

        console.error(
            "VIDEO API ERROR:",
            err
        );


        document.getElementById("list").innerHTML =
        `
        <div class="card">
        ❌ API ERROR<br>
        ${err.message}
        </div>
        `;

    }

}


function setVolume(value){

    video.volume = value / 100;

    if(video.volume === 0){

        video.muted = true;

    }else{

        video.muted = false;

    }

    document.getElementById("muteBtn").innerText =
        video.muted ? "🔇" : "🔊";

}
   
function buildLanguages(){

    const languageSet = new Set();

    list.forEach(s=>{

        if(s.language && s.language !== "Unknown"){

            languageSet.add(s.language.trim());

        }

    });

    const languages=[...languageSet].sort();

    const box=document.getElementById("languageList");

    box.innerHTML="";

    const all=document.createElement("div");

    all.className="group";
    all.textContent="🗣️ All Languages";

    all.onclick=()=>{

        filtered=[...list];
        render(true);

    };

    box.appendChild(all);

    languages.forEach(language=>{

        const d=document.createElement("div");

        d.className="group";
        d.textContent="🗣️ "+language;

        d.onclick=()=>{

            filtered=list.filter(s=>
                s.language === language
            );

            render(true);

        };

        box.appendChild(d);

    });

}

function toggleMute(){

    const video = document.getElementById("video");
    const btn = document.getElementById("muteBtn");

    video.muted = !video.muted;

    btn.innerText = video.muted ? "🔇" : "🔊";

}
   
function buildGroups(){

    const groupSet = new Set();

    list.forEach(s=>{

        s.group
        .split(";")
        .forEach(g=>{
            groupSet.add(g.trim());
        });

    });


    const groups=[...groupSet].sort((a,b)=>
    String(a).localeCompare(String(b))
);


    const box=document.getElementById("groupList");

    box.innerHTML="";


    const all=document.createElement("div");

    all.className="group";

    all.textContent="📺 All Channels";

    all.onclick=()=>{

        filtered=[...list];

        render(true);

    };

    box.appendChild(all);



    groups.forEach(g=>{

        const d=document.createElement("div");

        d.className="group";

        d.textContent="📂 "+g;


        d.onclick=()=>{


            filtered=list.filter(s=>

                s.group
                .split(";")
                .map(x=>x.trim())
                .includes(g)

            );


            filtered.sort((a,b)=>
                a.name.localeCompare(b.name)
            );

function playMedia(url){
  const v=document.getElementById("video");

  v.pause();
  v.removeAttribute("src");
  v.load();

  if(window.Hls && Hls.isSupported()){

    if(window.hls){
      window.hls.destroy();
    }

    window.hls = new Hls({
      enableWorker:true,

      // buffer settings
      maxBufferLength:30,
      maxMaxBufferLength:60,
      maxBufferSize:60 * 1000 * 1000,

      // faster recovery
      liveSyncDurationCount:3,
      liveMaxLatencyDurationCount:5,

      // reduce stalls
      fragLoadingTimeOut:20000,
      manifestLoadingTimeOut:20000,
      levelLoadingTimeOut:20000
    });


    window.hls.on(Hls.Events.ERROR,(event,data)=>{

      console.log("HLS ERROR:",data);

      if(data.fatal){

        switch(data.type){

          case Hls.ErrorTypes.NETWORK_ERROR:
            console.log("Retrying network...");
            window.hls.startLoad();
            break;


          case Hls.ErrorTypes.MEDIA_ERROR:
            console.log("Recovering media...");
            window.hls.recoverMediaError();
            break;


          default:
            window.hls.destroy();
            break;
        }

      }

    });


    window.hls.loadSource(url);
    window.hls.attachMedia(v);


    window.hls.on(Hls.Events.MANIFEST_PARSED,()=>{
      v.play().catch(e=>console.log(e));
    });


  }else{

    // Safari native HLS
    v.src=url;
    v.play();

  }
}

function play(i){

    // Exit station mode
    stationMode=false;

    // Stop Video Obvyris TV watcher
    if(stationWatcher){
        clearInterval(stationWatcher);
        stationWatcher=null;
    }

    currentStationURL = "";

    video.controls=true;

    document.getElementById("playBtn").disabled=false;

    index = i;

    const s = filtered[i];

    if(!s) return;


    // Update station name
    document.getElementById("now").innerText = s.name;


    // Update station logo
    const activeLogo = document.getElementById("activeLogo");

    if(s.logo && s.logo.trim() !== ""){

        activeLogo.src = s.logo;

    }else{

        activeLogo.src =
        "https://mikos5.github.io/tester/navicon.png";

    }


    // Fallback logo
    activeLogo.onerror = function(){

        this.src =
        "https://mikos5.github.io/tester/navicon.png";

    };


    // Start live stream
    playMedia(s.url);


    // Refresh chat for new station
    if(chatOpen){

        loadChat();

    }

}
   
function next(){
  index=(index+1)%filtered.length;
  play(index);
}

function prev(){
  index=(index-1+filtered.length)%filtered.length;
  play(index);
}

function buildCountries(){

    const countrySet = new Set();

    list.forEach(s=>{

        if(s.country && s.country !== "Unknown"){

            countrySet.add(
                s.country.trim()
            );

        }

    });


    const countries=[...countrySet].sort((a,b)=>
        a.localeCompare(b)
    );


    const box=document.getElementById("countryList");

    box.innerHTML="";


    const all=document.createElement("div");

    all.className="group";

    all.textContent="🌎 All Countries";

    all.onclick=()=>{

        filtered=[...list];

        render(true);

    };

    box.appendChild(all);



    countries.forEach(country=>{

        const d=document.createElement("div");

        d.className="group";

        d.textContent="🌎 "+country;


        d.onclick=()=>{


            filtered=list.filter(s=>

                s.country === country

            );


            filtered.sort((a,b)=>
                a.name.localeCompare(b.name)
            );


            render(true);

        };


        box.appendChild(d);


    });


}
