<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>Obvyris Emulator</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

body{
    font-family:Arial,Helvetica,sans-serif;
}

#game{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    background:#000;
}

#loading{
    position:absolute;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:#000;
    color:#718096;
    font-size:13px;
    text-align:center;
    padding:20px;
}

#loading strong{
    color:#e8edf5;
    font-size:18px;
    margin-bottom:8px;
}

#loadingStatus{
    color:#52657a;
    font-size:10px;
    margin-top:8px;
    max-width:90%;
    word-break:break-word;
}

#error{
    position:absolute;
    inset:0;
    z-index:200;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    padding:30px;
    background:#000;
    color:#8190a3;
}

#error.show{
    display:flex;
}

#error strong{
    color:#ff6868;
    font-size:18px;
    margin-bottom:12px;
}

#error p{
    max-width:700px;
    font-size:12px;
    line-height:1.6;
    word-break:break-word;
}

</style>

</head>

<body>

<div id="game"></div>

<div id="loading">

    <strong id="loadingTitle">
        OBVYRIS
    </strong>

    <span id="loadingText">
        Loading emulator...
    </span>

    <span id="loadingStatus"></span>

</div>

<div id="error">

    <strong>
        Emulator Error
    </strong>

    <p id="errorText"></p>

</div>


<script>

/*******************************************************
 * READ PARAMETERS
 *******************************************************/

const params =
    new URLSearchParams(
        window.location.search
    );

const rom =
    params.get("rom") || "";

const core =
    params.get("core") || "nes";

const title =
    params.get("title") ||
    "Obvyris Emulator";


console.log(
    "[OBVYRIS EMULATOR] ==============================="
);

console.log(
    "[OBVYRIS EMULATOR] Emulator page loaded"
);

console.log(
    "[OBVYRIS EMULATOR] Title:",
    title
);

console.log(
    "[OBVYRIS EMULATOR] Core:",
    core
);

console.log(
    "[OBVYRIS EMULATOR] Original ROM:",
    rom
);


/*******************************************************
 * VALIDATE
 *******************************************************/

if(!rom){

    showError(
        "No ROM URL was supplied."
    );

}else{

    startEmulator();

}


/*******************************************************
 * START EMULATOR
 *******************************************************/

function startEmulator(){

    console.log(
        "[OBVYRIS EMULATOR] Starting EmulatorJS"
    );


    /***************************************************
     * VERCEL ROM PROXY
     ***************************************************/

    const proxyBase =
        "https://project-fhuxk-wggmxhpo0-abc-1947.vercel.app/api/rom";


    const proxyURL =
        proxyBase +
        "?url=" +
        encodeURIComponent(rom);


    console.log(
        "[OBVYRIS EMULATOR] Proxy ROM:",
        proxyURL
    );


    /***************************************************
     * UI
     ***************************************************/

    document.getElementById(
        "loadingTitle"
    ).textContent =
        title;

    document.getElementById(
        "loadingText"
    ).textContent =
        "Loading EmulatorJS...";

    document.getElementById(
        "loadingStatus"
    ).textContent =
        "Preparing ROM";


    /***************************************************
     * EMULATORJS CONFIG
     ***************************************************/

    window.EJS_player =
        "#game";

    window.EJS_core =
        core;

    /*
     * IMPORTANT:
     *
     * EmulatorJS receives the Vercel proxy URL,
     * NOT the Archive.org URL.
     */

    window.EJS_gameUrl =
        proxyURL;

    window.EJS_gameName =
        title;

    window.EJS_pathtodata =
        "https://cdn.emulatorjs.org/stable/data/";

    window.EJS_startOnLoaded =
        true;

    window.EJS_threads =
        false;

    window.EJS_color =
        "#48bfff";


    console.log(
        "[OBVYRIS EMULATOR] EJS_player:",
        window.EJS_player
    );

    console.log(
        "[OBVYRIS EMULATOR] EJS_core:",
        window.EJS_core
    );

    console.log(
        "[OBVYRIS EMULATOR] EJS_gameUrl:",
        window.EJS_gameUrl
    );

    console.log(
        "[OBVYRIS EMULATOR] EJS_gameName:",
        window.EJS_gameName
    );

    console.log(
        "[OBVYRIS EMULATOR] EJS_pathtodata:",
        window.EJS_pathtodata
    );


    /***************************************************
     * LOAD EMULATORJS
     ***************************************************/

    console.log(
        "[OBVYRIS EMULATOR] Loading EmulatorJS loader..."
    );


    const script =
        document.createElement("script");


    script.src =
        "https://cdn.emulatorjs.org/stable/data/loader.js";


    script.onload =
        function(){

            console.log(
                "[OBVYRIS EMULATOR] EmulatorJS loader loaded"
            );

            document.getElementById(
                "loadingText"
            ).textContent =
                "EmulatorJS loaded";

            document.getElementById(
                "loadingStatus"
            ).textContent =
                "Starting " +
                core.toUpperCase();

        };


    script.onerror =
        function(){

            console.error(
                "[OBVYRIS EMULATOR] EmulatorJS loader failed"
            );

            showError(
                "EmulatorJS could not be loaded."
            );

        };


    document.body.appendChild(
        script
    );

}


/*******************************************************
 * ERROR
 *******************************************************/

function showError(message){

    console.error(
        "[OBVYRIS EMULATOR] ERROR:",
        message
    );

    document.getElementById(
        "loading"
    ).style.display =
        "none";

    document.getElementById(
        "errorText"
    ).textContent =
        message;

    document.getElementById(
        "error"
    ).classList.add(
        "show"
    );

}


/*******************************************************
 * DEBUG
 *******************************************************/

window.addEventListener(
    "error",
    function(event){

        console.error(
            "[OBVYRIS EMULATOR ERROR]",
            event.message,
            event.error
        );

    }
);


window.addEventListener(
    "unhandledrejection",
    function(event){

        console.error(
            "[OBVYRIS EMULATOR PROMISE ERROR]",
            event.reason
        );

    }
);


window.addEventListener(
    "load",
    function(){

        console.log(
            "[OBVYRIS EMULATOR] Window loaded"
        );

        console.log(
            "[OBVYRIS EMULATOR] Final ROM:",
            rom
        );

        console.log(
            "[OBVYRIS EMULATOR] Final proxy:",
            rom
            ?
            "https://project-fhuxk-wggmxhpo0-abc-1947.vercel.app/api/rom?url=" +
            encodeURIComponent(rom)
            :
            ""
        );

    }
);

</script>

</body>

</html>
