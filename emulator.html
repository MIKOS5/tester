<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>OBVYRIS Emulator</title>

<style>
html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
}

#game{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    background:#000;
}

#status{
    position:absolute;
    top:0;
    left:0;
    right:0;
    z-index:1000;
    padding:10px 14px;
    background:rgba(0,0,0,.9);
    color:#fff;
    font-size:14px;
    pointer-events:none;
}

#status.hidden{
    display:none;
}

#loading{
    position:absolute;
    inset:0;
    z-index:900;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
    color:#fff;
    font-size:18px;
    text-align:center;
}

#error{
    position:absolute;
    inset:0;
    z-index:2000;
    display:none;
    align-items:center;
    justify-content:center;
    background:#000;
    color:#fff;
    padding:30px;
    text-align:center;
    white-space:pre-wrap;
}

canvas{
    image-rendering:auto;
    max-width:100%;
    max-height:100%;
}

*{
    touch-action:none;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="loading">
    <div>
        <div id="loadingText">Loading ROM...</div>
    </div>
</div>

<div id="status"></div>

<div id="error"></div>

<script>
"use strict";

console.log("[OBVYRIS EMULATOR] ===============================");
console.log("[OBVYRIS EMULATOR] Emulator page loaded");


/* =========================================================
   URL PARAMETERS
========================================================= */

const params = new URLSearchParams(location.search);

const originalRom = params.get("rom");

const requestedCore =
    (params.get("core") || "nes").toLowerCase();

const title =
    params.get("title") || "OBVYRIS GAME";


/* =========================================================
   EMULATORJS CORE MAP
=========================================================

   This allows your Games sheet to continue using:

       genesis

   while EmulatorJS receives:

       genesis_plus_gx
========================================================= */

const CORE_MAP = {

    /* Nintendo */
    nes: "nes",
    snes: "snes",

    /* Sega */
    genesis: "genesis_plus_gx",
    megadrive: "genesis_plus_gx",
    sega_genesis: "genesis_plus_gx",

    /* Allow already-correct EmulatorJS value */
    genesis_plus_gx: "genesis_plus_gx"
};


const core =
    CORE_MAP[requestedCore] || requestedCore;


console.log(
    "[OBVYRIS EMULATOR] Requested Core:",
    requestedCore
);

console.log(
    "[OBVYRIS EMULATOR] EmulatorJS Core:",
    core
);

console.log(
    "[OBVYRIS EMULATOR] Title:",
    title
);

console.log(
    "[OBVYRIS EMULATOR] Original ROM:",
    originalRom
);


/* =========================================================
   DOM
========================================================= */

const loading =
    document.getElementById("loading");

const loadingText =
    document.getElementById("loadingText");

const errorBox =
    document.getElementById("error");

const status =
    document.getElementById("status");


/* =========================================================
   LOGGING
========================================================= */

function log(message){

    console.log(
        "[OBVYRIS EMULATOR]",
        message
    );

    status.textContent = message;
}


/* =========================================================
   ERROR
========================================================= */

function fail(message){

    console.error(
        "[OBVYRIS EMULATOR]",
        message
    );

    loading.style.display = "none";

    errorBox.style.display = "flex";

    errorBox.textContent =
        "Emulator Error\n\n" + message;
}


/* =========================================================
   LOADING MESSAGE
========================================================= */

function setLoading(message){

    loadingText.textContent = message;

    console.log(
        "[OBVYRIS EMULATOR]",
        message
    );
}


/* =========================================================
   ROM CHECK
========================================================= */

if(!originalRom){

    fail("No ROM was supplied.");

    throw new Error(
        "Missing ROM"
    );
}


/* =========================================================
   VERCEL ROM PROXY
========================================================= */

const PROXY_BASE = "https://project-43vbn-avskjovnk-abc-1947.vercel.app/api/rom";


const proxyURL =
    PROXY_BASE +
    "?url=" +
    encodeURIComponent(originalRom);


console.log(
    "[OBVYRIS EMULATOR] Proxy ROM:",
    proxyURL
);


/* =========================================================
   DOWNLOAD ROM
========================================================= */

async function downloadROM(){

    try{

        setLoading(
            "Downloading ROM..."
        );

        log(
            "Fetching ROM through Vercel proxy..."
        );


        const response =
            await fetch(
                proxyURL,
                {
                    method:"GET",
                    mode:"cors",
                    cache:"no-store"
                }
            );


        console.log(
            "[OBVYRIS EMULATOR] Proxy response:",
            response.status,
            response.statusText
        );


        if(!response.ok){

            let text = "";

            try{

                text =
                    await response.text();

            }catch(e){}


            throw new Error(
                "Proxy returned HTTP " +
                response.status +
                "\n" +
                text
            );
        }


        setLoading(
            "Reading ROM..."
        );


        const buffer =
            await response.arrayBuffer();


        console.log(
            "[OBVYRIS EMULATOR] ROM downloaded:",
            buffer.byteLength,
            "bytes"
        );


        if(
            !buffer ||
            buffer.byteLength < 16
        ){

            throw new Error(
                "ROM data is empty or too small."
            );
        }


        /* =================================================
           NES HEADER CHECK
        ================================================= */

        if(core === "nes"){

            const bytes =
                new Uint8Array(buffer);


            const validNES =
                bytes.length >= 4 &&
                bytes[0] === 0x4E &&
                bytes[1] === 0x45 &&
                bytes[2] === 0x53 &&
                bytes[3] === 0x1A;


            console.log(
                "[OBVYRIS EMULATOR] NES header:",
                validNES
                    ? "VALID"
                    : "INVALID"
            );


            if(!validNES){

                throw new Error(
                    "The downloaded file is not a valid NES ROM.\n" +
                    "First bytes: " +
                    Array.from(
                        bytes.slice(0,8)
                    )
                    .map(
                        x =>
                        x.toString(16)
                        .padStart(2,"0")
                    )
                    .join(" ")
                );
            }
        }


        /* =================================================
           GENESIS INFORMATION
        ================================================= */

        if(core === "genesis_plus_gx"){

            console.log(
                "[OBVYRIS EMULATOR] Genesis ROM detected"
            );

            console.log(
                "[OBVYRIS EMULATOR] Genesis ROM size:",
                buffer.byteLength,
                "bytes"
            );
        }


        /* =================================================
           CREATE LOCAL BLOB
        ================================================= */

        const blob =
            new Blob(
                [buffer],
                {
                    type:
                    "application/octet-stream"
                }
            );


        const blobURL =
            URL.createObjectURL(blob);


        console.log(
            "[OBVYRIS EMULATOR] Local ROM Blob:",
            blobURL
        );


        return blobURL;


    }catch(error){

        console.error(
            "[OBVYRIS EMULATOR] ROM download error:",
            error
        );

        throw error;
    }
}


/* =========================================================
   START EMULATORJS
========================================================= */

function startEmulator(blobURL){

    return new Promise(
        (resolve,reject)=>{

            try{

                setLoading(
                    "Preparing EmulatorJS..."
                );

                log(
                    "Creating EmulatorJS..."
                );


                /* =================================================
                   EMULATORJS GLOBAL CONFIGURATION
                ================================================= */

                window.EJS_player =
                    "#game";


                window.EJS_core =
                    core;


                window.EJS_gameUrl =
                    blobURL;


                window.EJS_gameName =
                    title;


                window.EJS_pathtodata =
                    "https://cdn.emulatorjs.org/stable/data/";


                window.EJS_startOnLoaded =
                    true;


                window.EJS_disableAutoLang =
                    true;


                window.EJS_color =
                    "#111111";


                window.EJS_backgroundColor =
                    "#000000";


                window.EJS_gameID =
                    "obvyris-" +
                    Date.now();


                /* =================================================
                   DEBUG INFORMATION
                ================================================= */

                console.log(
                    "[OBVYRIS EMULATOR] EJS_player:",
                    window.EJS_player
                );

                console.log(
                    "[OBVYRIS EMULATOR] EJS_core:",
                    window.EJS_core
                );

                console.log(
                    "[OBVYRIS EMULATOR] EJS_gameUrl:",
                    window.EJS_gameUrl
                );

                console.log(
                    "[OBVYRIS EMULATOR] EJS_pathtodata:",
                    window.EJS_pathtodata
                );


                /* =================================================
                   GAME START EVENT
                ================================================= */

                window.EJS_onGameStart =
                    function(){

                        console.log(
                            "[OBVYRIS EMULATOR] GAME STARTED"
                        );


                        loading.style.display =
                            "none";


                        status.classList.add(
                            "hidden"
                        );


                        resolve();
                    };


                /* =================================================
                   LOAD EVENT
                ================================================= */

                window.EJS_onLoad =
                    function(){

                        console.log(
                            "[OBVYRIS EMULATOR] EmulatorJS loaded"
                        );
                    };


                /* =================================================
                   SAVE STATE
                ================================================= */

                window.EJS_onSaveState =
                    function(){

                        console.log(
                            "[OBVYRIS EMULATOR] Save state"
                        );
                    };


                /* =================================================
                   LOAD STATE
                ================================================= */

                window.EJS_onLoadState =
                    function(){

                        console.log(
                            "[OBVYRIS EMULATOR] Load state"
                        );
                    };


                /* =================================================
                   LOAD EMULATORJS
                ================================================= */

                setLoading(
                    "Loading EmulatorJS..."
                );


                console.log(
                    "[OBVYRIS EMULATOR] Loading EmulatorJS loader..."
                );


                const script =
                    document.createElement(
                        "script"
                    );


                script.src =
                    "https://cdn.emulatorjs.org/stable/data/loader.js";


                script.async =
                    true;


                script.onload =
                    function(){

                        console.log(
                            "[OBVYRIS EMULATOR] EmulatorJS loader loaded"
                        );


                        setLoading(
                            "Starting " +
                            requestedCore.toUpperCase() +
                            "..."
                        );


                        /*
                         * EmulatorJS starts automatically.
                         *
                         * We wait for the canvas instead
                         * of assuming it exists immediately.
                         */

                        let attempts = 0;

                        const maxAttempts = 150;


                        const checkCanvas =
                            setInterval(
                                function(){

                                    attempts++;


                                    const canvas =
                                        document.querySelector(
                                            "#game canvas"
                                        );


                                    if(canvas){

                                        clearInterval(
                                            checkCanvas
                                        );


                                        console.log(
                                            "[OBVYRIS EMULATOR] Canvas detected:",
                                            canvas.width,
                                            "x",
                                            canvas.height
                                        );


                                        /*
                                         * Do not hide loading here.
                                         *
                                         * EJS_onGameStart will
                                         * hide it when the actual
                                         * emulator starts.
                                         */


                                        return;
                                    }


                                    if(
                                        attempts >=
                                        maxAttempts
                                    ){

                                        clearInterval(
                                            checkCanvas
                                        );


                                        console.warn(
                                            "[OBVYRIS EMULATOR] Canvas was not detected after waiting."
                                        );

                                    }

                                },
                                100
                            );
                    };


                script.onerror =
                    function(){

                        reject(
                            new Error(
                                "EmulatorJS loader could not be loaded."
                            )
                        );
                    };


                document.head.appendChild(
                    script
                );


            }catch(error){

                reject(error);
            }
        }
    );
}


/* =========================================================
   MAIN
========================================================= */

async function main(){

    try{

        console.log(
            "[OBVYRIS EMULATOR] Starting",
            requestedCore.toUpperCase() +
            "...",
            "using EmulatorJS core:",
            core
        );


        const blobURL =
            await downloadROM();


        console.log(
            "[OBVYRIS EMULATOR] Emulator ROM URL:",
            blobURL
        );


        await startEmulator(
            blobURL
        );


        console.log(
            "[OBVYRIS EMULATOR]",
            title,
            "— EmulatorJS running"
        );


    }catch(error){

        console.error(
            "[OBVYRIS EMULATOR] FATAL:",
            error
        );


        fail(
            error &&
            error.message
                ? error.message
                : String(error)
        );
    }
}


/* =========================================================
   GLOBAL ERROR HANDLERS
========================================================= */

window.addEventListener(
    "error",
    function(event){

        console.error(
            "[OBVYRIS EMULATOR] Window error:",
            event.error ||
            event.message
        );
    }
);


window.addEventListener(
    "unhandledrejection",
    function(event){

        console.error(
            "[OBVYRIS EMULATOR] Promise error:",
            event.reason
        );
    }
);


/* =========================================================
   START
========================================================= */

main();

</script>

</body>
</html>
