<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>OBVYRIS Emulator</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
}

#game {
    width: 100%;
    height: 100%;
    position: relative;
    background: #000;
}

#loading {
    position: absolute;
    inset: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #05080d;
    color: #fff;
    text-align: center;
}

.loadingBox {
    width: min(90%, 500px);
    padding: 30px;
}

.loadingTitle {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 15px;
}

#status {
    color: #8fa5b5;
    font-size: 14px;
    line-height: 1.6;
    word-break: break-word;
}

#error {
    display: none;
    margin-top: 20px;
    padding: 15px;
    background: #241015;
    border: 1px solid #71313d;
    color: #ffb8c0;
    border-radius: 6px;
    text-align: left;
    white-space: pre-wrap;
}

#retry {
    display: none;
    margin-top: 15px;
    padding: 10px 18px;
    border: 0;
    border-radius: 5px;
    background: #fff;
    color: #000;
    cursor: pointer;
    font-weight: bold;
}

#game iframe,
#game canvas {
    max-width: 100%;
    max-height: 100%;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="loading">
    <div class="loadingBox">
        <div class="loadingTitle" id="title">OBVYRIS EMULATOR</div>
        <div id="status">Loading...</div>

        <div id="error"></div>

        <button id="retry" onclick="location.reload()">
            RETRY
        </button>
    </div>
</div>

<script>

console.log("[OBVYRIS EMULATOR] ===============================");
console.log("[OBVYRIS EMULATOR] Emulator page loaded");

const params = new URLSearchParams(location.search);

const originalRom = params.get("rom");
const core = (params.get("core") || "nes").toLowerCase();
const gameTitle = params.get("title") || "OBVYRIS GAME";

console.log("[OBVYRIS EMULATOR] Title:", gameTitle);
console.log("[OBVYRIS EMULATOR] Core:", core);
console.log("[OBVYRIS EMULATOR] Original ROM:", originalRom);

document.title = gameTitle + " — OBVYRIS";

document.getElementById("title").textContent = gameTitle;

const statusElement = document.getElementById("status");
const errorElement = document.getElementById("error");
const retryButton = document.getElementById("retry");

const PROXY_BASE =
    "https://obvyris-rom-proxy.vercel.app/api/rom";

let romBlobUrl = null;

function status(text) {
    console.log("[OBVYRIS EMULATOR]", text);
    statusElement.textContent = text;
}

function showError(text) {

    console.error("[OBVYRIS EMULATOR]", text);

    statusElement.textContent = "Emulator failed to start.";

    errorElement.style.display = "block";
    errorElement.textContent = text;

    retryButton.style.display = "inline-block";
}

function getProxyUrl(url) {

    return PROXY_BASE + "?url=" + encodeURIComponent(url);

}

async function loadRom() {

    if (!originalRom) {
        throw new Error("No ROM URL was supplied.");
    }

    const proxyUrl = getProxyUrl(originalRom);

    console.log("[OBVYRIS EMULATOR] Proxy ROM:", proxyUrl);

    status("Downloading ROM...");

    console.log("[OBVYRIS EMULATOR] Fetching ROM through Vercel proxy...");

    const response = await fetch(proxyUrl, {
        method: "GET",
        mode: "cors",
        cache: "no-store"
    });

    console.log(
        "[OBVYRIS EMULATOR] Proxy response:",
        response.status,
        response.statusText
    );

    if (!response.ok) {
        throw new Error(
            "ROM proxy returned HTTP " +
            response.status +
            " " +
            response.statusText
        );
    }

    status("Reading ROM...");

    const buffer = await response.arrayBuffer();

    console.log(
        "[OBVYRIS EMULATOR] ROM downloaded:",
        buffer.byteLength,
        "bytes"
    );

    if (!buffer || buffer.byteLength < 16) {
        throw new Error(
            "ROM download was empty or too small: " +
            buffer.byteLength +
            " bytes"
        );
    }

    status("Preparing emulator...");

    const blob = new Blob(
        [buffer],
        {
            type: "application/octet-stream"
        }
    );

    romBlobUrl = URL.createObjectURL(blob);

    console.log(
        "[OBVYRIS EMULATOR] Local ROM Blob:",
        romBlobUrl
    );

    return romBlobUrl;
}

function loadEmulatorJS() {

    return new Promise((resolve, reject) => {

        status("Loading EmulatorJS...");

        console.log(
            "[OBVYRIS EMULATOR] Loading EmulatorJS loader..."
        );

        const script = document.createElement("script");

        script.src =
            "https://cdn.emulatorjs.org/stable/data/loader.js";

        script.onload = () => {

            console.log(
                "[OBVYRIS EMULATOR] EmulatorJS loader loaded"
            );

            resolve();

        };

        script.onerror = () => {

            reject(
                new Error(
                    "EmulatorJS loader could not be loaded."
                )
            );

        };

        document.head.appendChild(script);

    });

}

async function startEmulator() {

    try {

        status("Starting " + core.toUpperCase() + "...");

        const romUrl = await loadRom();

        console.log(
            "[OBVYRIS EMULATOR] Emulator ROM URL:",
            romUrl
        );

        /*
         * EmulatorJS configuration.
         *
         * IMPORTANT:
         * The ROM is now a local Blob URL.
         * EmulatorJS no longer needs to directly fetch
         * archive.org or the Vercel proxy.
         */

        window.EJS_player = "#game";

        window.EJS_core = core;

        window.EJS_gameUrl = romUrl;

        window.EJS_gameName = gameTitle;

        window.EJS_pathtodata =
            "https://cdn.emulatorjs.org/stable/data/";

        window.EJS_startOnLoaded = true;

        window.EJS_color = "#000000";

        window.EJS_backgroundColor = "#000000";

        window.EJS_disableDatabases = true;

        window.EJS_biosUrl = "";

        console.log(
            "[OBVYRIS EMULATOR] EJS_player:",
            window.EJS_player
        );

        console.log(
            "[OBVYRIS EMULATOR] EJS_core:",
            window.EJS_core
        );

        console.log(
            "[OBVYRIS EMULATOR] EJS_gameUrl:",
            window.EJS_gameUrl
        );

        console.log(
            "[OBVYRIS EMULATOR] EJS_gameName:",
            window.EJS_gameName
        );

        console.log(
            "[OBVYRIS EMULATOR] EJS_pathtodata:",
            window.EJS_pathtodata
        );

        status(
            "Starting " +
            core.toUpperCase() +
            "..."
        );

        await loadEmulatorJS();

        console.log(
            "[OBVYRIS EMULATOR] EmulatorJS ready"
        );

        status(
            gameTitle +
            " — EmulatorJS running"
        );

    } catch (error) {

        console.error(
            "[OBVYRIS EMULATOR] ERROR:",
            error
        );

        showError(
            error && error.message
                ? error.message
                : String(error)
        );

    }

}

window.addEventListener("beforeunload", () => {

    if (romBlobUrl) {
        URL.revokeObjectURL(romBlobUrl);
    }

});

startEmulator();

</script>

</body>
</html>
