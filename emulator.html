<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>Obvyris Emulator</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

body{
    font-family:Arial,Helvetica,sans-serif;
}

#game{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    background:#000;
}

#loading{
    position:absolute;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:#000;
    color:#718096;
    font-size:13px;
}

#loading strong{
    color:#e8edf5;
    font-size:18px;
    margin-bottom:8px;
}

#loadingStatus{
    margin-top:6px;
    color:#627185;
    font-size:11px;
}

#error{
    position:absolute;
    inset:0;
    z-index:200;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    padding:30px;
    background:#000;
    color:#8190a3;
}

#error.show{
    display:flex;
}

#error strong{
    color:#ff6868;
    font-size:18px;
    margin-bottom:12px;
}

#error p{
    max-width:700px;
    font-size:12px;
    line-height:1.6;
    word-break:break-word;
}

</style>

</head>

<body>

<div id="game"></div>

<div id="loading">

    <strong id="loadingTitle">
        OBVYRIS
    </strong>

    <span id="loadingMain">
        Loading emulator...
    </span>

    <span id="loadingStatus"></span>

</div>

<div id="error">

    <strong>
        Emulator Error
    </strong>

    <p id="errorText"></p>

</div>


<script>

/*******************************************************
 * PARAMETERS
 *******************************************************/

const params =
    new URLSearchParams(
        window.location.search
    );

const rom =
    params.get("rom") || "";

const core =
    params.get("core") || "nes";

const title =
    params.get("title") ||
    "Obvyris Emulator";


/*******************************************************
 * LOGGING
 *******************************************************/

console.log(
    "[OBVYRIS EMULATOR] ==============================="
);

console.log(
    "[OBVYRIS EMULATOR] Emulator page loaded"
);

console.log(
    "[OBVYRIS EMULATOR] Title:",
    title
);

console.log(
    "[OBVYRIS EMULATOR] Core:",
    core
);

console.log(
    "[OBVYRIS EMULATOR] ROM:",
    rom
);

console.log(
    "[OBVYRIS EMULATOR] Page URL:",
    window.location.href
);

console.log(
    "[OBVYRIS EMULATOR] ==============================="
);


/*******************************************************
 * UI
 *******************************************************/

document.getElementById(
    "loadingTitle"
).textContent = title;


/*******************************************************
 * VALIDATE
 *******************************************************/

if(!rom){

    showError(
        "No ROM URL was supplied."
    );

}else{

    loadROM();

}


/*******************************************************
 * DOWNLOAD ROM FIRST
 *
 * This is the important change.
 *
 * EmulatorJS previously received:
 *
 *     https://archive.org/...
 *
 * directly.
 *
 * Now we fetch the ROM first and create a
 * local Blob URL.
 *******************************************************/

async function loadROM(){

    setLoading(
        "Downloading ROM...",
        "Connecting to ROM source..."
    );

    console.log(
        "[OBVYRIS EMULATOR] Fetching ROM:",
        rom
    );

    try{

        const response =
            await fetch(
                rom,
                {
                    method:"GET",
                    mode:"cors",
                    cache:"no-store"
                }
            );

        console.log(
            "[OBVYRIS EMULATOR] ROM response:",
            response.status,
            response.statusText
        );


        if(!response.ok){

            throw new Error(
                "ROM request returned HTTP "+
                response.status
            );

        }


        setLoading(
            "Downloading ROM...",
            "Receiving ROM data..."
        );


        const buffer =
            await response.arrayBuffer();


        console.log(
            "[OBVYRIS EMULATOR] ROM bytes:",
            buffer.byteLength
        );


        if(!buffer.byteLength){

            throw new Error(
                "ROM response was empty."
            );

        }


        /*
         * Create a local object URL.
         */

        const blob =
            new Blob(
                [buffer],
                {
                    type:"application/octet-stream"
                }
            );


        const localROM =
            URL.createObjectURL(blob);


        console.log(
            "[OBVYRIS EMULATOR] Local ROM:",
            localROM
        );


        setLoading(
            "ROM loaded",
            "Starting "+core.toUpperCase()+"..."
        );


        startEmulator(
            localROM
        );


    }catch(error){

        console.error(
            "[OBVYRIS EMULATOR] ROM fetch failed:",
            error
        );

        showError(
            "The ROM could not be downloaded.\n\n"+
            error.message+
            "\n\nROM:\n"+
            rom
        );

    }

}


/*******************************************************
 * START EMULATORJS
 *******************************************************/

function startEmulator(localROM){

    console.log(
        "[OBVYRIS EMULATOR] Starting EmulatorJS"
    );


    /*
     * EmulatorJS configuration.
     */

    window.EJS_player =
        "#game";


    window.EJS_core =
        core;


    /*
     * IMPORTANT:
     *
     * EmulatorJS receives the LOCAL Blob URL,
     * not archive.org.
     */

    window.EJS_gameUrl =
        localROM;


    window.EJS_gameName =
        title;


    window.EJS_pathtodata =
        "https://cdn.emulatorjs.org/stable/data/";


    window.EJS_startOnLoaded =
        true;


    window.EJS_threads =
        false;


    window.EJS_color =
        "#48bfff";


    console.log(
        "[OBVYRIS EMULATOR] EJS_player:",
        window.EJS_player
    );

    console.log(
        "[OBVYRIS EMULATOR] EJS_core:",
        window.EJS_core
    );

    console.log(
        "[OBVYRIS EMULATOR] EJS_gameUrl:",
        window.EJS_gameUrl
    );

    console.log(
        "[OBVYRIS EMULATOR] EJS_gameName:",
        window.EJS_gameName
    );

    console.log(
        "[OBVYRIS EMULATOR] EJS_pathtodata:",
        window.EJS_pathtodata
    );


    /***************************************************
     * LOAD EMULATORJS
     ***************************************************/

    console.log(
        "[OBVYRIS EMULATOR] Loading EmulatorJS loader..."
    );


    const script =
        document.createElement("script");


    script.src =
        "https://cdn.emulatorjs.org/stable/data/loader.js";


    script.onload =
        function(){

            console.log(
                "[OBVYRIS EMULATOR] EmulatorJS loader loaded"
            );

        };


    script.onerror =
        function(){

            console.error(
                "[OBVYRIS EMULATOR] EmulatorJS loader failed"
            );

            showError(
                "EmulatorJS could not be loaded."
            );

        };


    document.body.appendChild(
        script
    );

}


/*******************************************************
 * LOADING UI
 *******************************************************/

function setLoading(
    main,
    status
){

    const loading =
        document.getElementById(
            "loading"
        );

    if(loading){

        loading.style.display =
            "flex";

    }


    document.getElementById(
        "loadingMain"
    ).textContent =
        main || "";


    document.getElementById(
        "loadingStatus"
    ).textContent =
        status || "";

}


/*******************************************************
 * ERROR
 *******************************************************/

function showError(message){

    console.error(
        "[OBVYRIS EMULATOR] ERROR:",
        message
    );


    document.getElementById(
        "loading"
    ).style.display =
        "none";


    document.getElementById(
        "errorText"
    ).textContent =
        message;


    document.getElementById(
        "error"
    ).classList.add(
        "show"
    );

}


/*******************************************************
 * PAGE EVENTS
 *******************************************************/

window.addEventListener(
    "load",
    function(){

        console.log(
            "[OBVYRIS EMULATOR] Window loaded"
        );

    }
);


window.addEventListener(
    "error",
    function(event){

        console.error(
            "[OBVYRIS EMULATOR ERROR]",
            event.message,
            event.error
        );

    }
);


window.addEventListener(
    "unhandledrejection",
    function(event){

        console.error(
            "[OBVYRIS EMULATOR PROMISE ERROR]",
            event.reason
        );

    }
);

</script>

</body>
</html>
