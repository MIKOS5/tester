<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>Obvyris Emulator</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{

    margin:0;
    padding:0;

    width:100%;
    height:100%;

    overflow:hidden;

    background:#000;
}

body{

    color:#fff;

    font-family:
        Arial,
        Helvetica,
        sans-serif;
}

#game{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    background:#000;
}

#loading{

    position:absolute;

    inset:0;

    display:flex;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    background:#000;

    color:#8fa0b4;

    z-index:10;

    font-size:13px;
}

#loading strong{

    color:#e8edf5;

    font-size:18px;

    margin-bottom:8px;
}

#error{

    position:absolute;

    inset:0;

    display:none;

    align-items:center;

    justify-content:center;

    flex-direction:column;

    text-align:center;

    padding:30px;

    background:#000;

    color:#8fa0b4;

    z-index:20;
}

#error.show{

    display:flex;
}

#error strong{

    color:#ff7070;

    font-size:18px;

    margin-bottom:10px;
}

#error p{

    max-width:700px;

    line-height:1.6;

    font-size:12px;

    word-break:break-word;
}

</style>

</head>

<body>

<div id="game"></div>

<div id="loading">

    <strong id="loadingTitle">
        OBVYRIS
    </strong>

    <span>
        Loading emulator...
    </span>

</div>

<div id="error">

    <strong>
        Emulator Error
    </strong>

    <p id="errorText"></p>

</div>


<script>

/*******************************************************
 * OBVYRIS EMULATOR
 *******************************************************/

(function(){

    const params =
        new URLSearchParams(
            window.location.search
        );

    /*
     * URLSearchParams automatically decodes the
     * query parameter.
     */

    const rom =
        params.get("rom") || "";

    const core =
        params.get("core") || "nes";

    const title =
        params.get("title") ||
        "Obvyris Emulator";


    console.log(
        "[OBVYRIS EMULATOR] Starting"
    );

    console.log(
        "[OBVYRIS EMULATOR] Core:",
        core
    );

    console.log(
        "[OBVYRIS EMULATOR] ROM:",
        rom
    );

    console.log(
        "[OBVYRIS EMULATOR] Title:",
        title
    );


    document.getElementById(
        "loadingTitle"
    ).textContent =
        title;


    /***************************************************
     * VALIDATION
     ***************************************************/

    if(!rom){

        showError(
            "No ROM URL was supplied."
        );

        return;
    }


    /***************************************************
     * EMULATORJS CONFIG
     ***************************************************/

    window.EJS_player =
        "#game";

    window.EJS_core =
        core;

    window.EJS_gameUrl =
        rom;

    window.EJS_gameName =
        title;

    window.EJS_pathtodata =
        "https://cdn.emulatorjs.org/stable/data/";

    window.EJS_startOnLoaded =
        true;

    window.EJS_color =
        "#48bfff";


    /*
     * Keep threading disabled.
     *
     * GitHub Pages does not provide the required
     * COOP / COEP headers for SharedArrayBuffer.
     */

    window.EJS_threads =
        false;


    /*
     * Debug mode.
     */

    window.EJS_DEBUG_XX =
        true;


    /***************************************************
     * LOAD EMULATORJS
     ***************************************************/

    const script =
        document.createElement("script");

    script.src =
        "https://cdn.emulatorjs.org/stable/data/loader.js";

    script.async = false;


    script.onload =
        function(){

            console.log(
                "[OBVYRIS EMULATOR] EmulatorJS loader loaded"
            );

            setTimeout(
                function(){

                    const loading =
                        document.getElementById(
                            "loading"
                        );

                    if(loading){

                        loading.style.display =
                            "none";

                    }

                },
                1200
            );

        };


    script.onerror =
        function(){

            console.error(
                "[OBVYRIS EMULATOR] EmulatorJS loader failed"
            );

            showError(
                "EmulatorJS could not be loaded. Check the EmulatorJS CDN connection."
            );

        };


    document.body.appendChild(
        script
    );


    /***************************************************
     * GLOBAL ERROR HANDLER
     ***************************************************/

    window.addEventListener(
        "error",
        function(event){

            console.error(
                "[OBVYRIS EMULATOR] Error:",
                event.error ||
                event.message
            );

        }
    );


    /***************************************************
     * UNHANDLED PROMISE ERRORS
     ***************************************************/

    window.addEventListener(
        "unhandledrejection",
        function(event){

            console.error(
                "[OBVYRIS EMULATOR] Promise error:",
                event.reason
            );

        }
    );


    /***************************************************
     * ERROR DISPLAY
     ***************************************************/

    function showError(message){

        document.getElementById(
            "loading"
        ).style.display =
            "none";

        document.getElementById(
            "errorText"
        ).textContent =
            message;

        document.getElementById(
            "error"
        ).classList.add(
            "show"
        );

    }

})();

</script>

</body>

</html>
