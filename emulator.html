<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>Obvyris Emulator</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

body{
    font-family:Arial,Helvetica,sans-serif;
}

#game{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    background:#000;
}

#loading{
    position:absolute;
    inset:0;
    z-index:100;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:#000;
    color:#718096;
    font-size:13px;
}

#loading strong{
    color:#e8edf5;
    font-size:18px;
    margin-bottom:8px;
}

#error{
    position:absolute;
    inset:0;
    z-index:200;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    padding:30px;
    background:#000;
    color:#8190a3;
}

#error.show{
    display:flex;
}

#error strong{
    color:#ff6868;
    font-size:18px;
    margin-bottom:12px;
}

#error p{
    max-width:700px;
    font-size:12px;
    line-height:1.6;
    word-break:break-word;
}

</style>

</head>

<body>

<div id="game"></div>

<div id="loading">

    <strong id="loadingTitle">
        OBVYRIS
    </strong>

    <span>
        Loading emulator...
    </span>

</div>

<div id="error">

    <strong>
        Emulator Error
    </strong>

    <p id="errorText"></p>

</div>


<script>

/*******************************************************
 * READ PARAMETERS
 *******************************************************/

const params =
    new URLSearchParams(
        window.location.search
    );

const rom =
    params.get("rom") || "";

const core =
    params.get("core") || "nes";

const title =
    params.get("title") ||
    "Obvyris Emulator";


console.log(
    "[OBVYRIS EMULATOR] ======================="
);

console.log(
    "[OBVYRIS EMULATOR] Title:",
    title
);

console.log(
    "[OBVYRIS EMULATOR] Core:",
    core
);

console.log(
    "[OBVYRIS EMULATOR] ROM:",
    rom
);

console.log(
    "[OBVYRIS EMULATOR] ======================="
);


/*******************************************************
 * SHOW TITLE
 *******************************************************/

document.getElementById(
    "loadingTitle"
).textContent = title;


/*******************************************************
 * VALIDATE
 *******************************************************/

if(!rom){

    showError(
        "No ROM URL was supplied."
    );

}else{

    startEmulator();

}


/*******************************************************
 * START EMULATORJS
 *******************************************************/

function startEmulator(){

    /*
     * EmulatorJS configuration.
     */

    window.EJS_player =
        "#game";

    window.EJS_core =
        core;

    window.EJS_gameUrl =
        rom;

    window.EJS_gameName =
        title;

    window.EJS_pathtodata =
        "https://cdn.emulatorjs.org/stable/data/";

    window.EJS_startOnLoaded =
        true;

    window.EJS_color =
        "#48bfff";

    /*
     * Do not use threaded mode.
     * GitHub Pages does not provide the required
     * cross-origin isolation headers.
     */

    window.EJS_threads =
        false;


    console.log(
        "[OBVYRIS EMULATOR] EJS_gameUrl:",
        window.EJS_gameUrl
    );


    /***************************************************
     * LOAD EMULATORJS
     ***************************************************/

    const script =
        document.createElement("script");

    script.src =
        "https://cdn.emulatorjs.org/stable/data/loader.js";

    script.onload =
        function(){

            console.log(
                "[OBVYRIS EMULATOR] EmulatorJS loader loaded"
            );

            setTimeout(
                function(){

                    const loading =
                        document.getElementById(
                            "loading"
                        );

                    if(loading){

                        loading.style.display =
                            "none";

                    }

                },
                1500
            );

        };


    script.onerror =
        function(){

            console.error(
                "[OBVYRIS EMULATOR] EmulatorJS loader failed"
            );

            showError(
                "EmulatorJS could not be loaded."
            );

        };


    document.body.appendChild(
        script
    );

}


/*******************************************************
 * ERROR
 *******************************************************/

function showError(message){

    document.getElementById(
        "loading"
    ).style.display =
        "none";

    document.getElementById(
        "errorText"
    ).textContent =
        message;

    document.getElementById(
        "error"
    ).classList.add(
        "show"
    );

}


/*******************************************************
 * DEBUG
 *******************************************************/

window.addEventListener(
    "error",
    function(event){

        console.error(
            "[OBVYRIS EMULATOR ERROR]",
            event.message,
            event.error
        );

    }
);


window.addEventListener(
    "unhandledrejection",
    function(event){

        console.error(
            "[OBVYRIS EMULATOR PROMISE ERROR]",
            event.reason
        );

    }
);

</script>

</body>

</html>
