<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>OBVYRIS Emulator</title>

<style>

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
}

#game{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    background:#000;
}

/* ================================
   STATUS
================================ */

#status{
    position:absolute;
    top:0;
    left:0;
    right:0;
    z-index:1000;

    padding:10px 14px;

    background:rgba(0,0,0,.85);

    color:#fff;

    font-size:13px;

    pointer-events:none;
}

#status.hidden{
    display:none;
}

/* ================================
   LOADING
================================ */

#loading{
    position:absolute;
    inset:0;

    z-index:900;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#000;

    color:#fff;

    font-size:18px;

    text-align:center;
}

/* ================================
   ERROR
================================ */

#error{
    position:absolute;
    inset:0;

    z-index:2000;

    display:none;

    align-items:center;
    justify-content:center;

    background:#000;

    color:#fff;

    padding:30px;

    text-align:center;

    white-space:pre-wrap;
}

/* ================================
   GAME CHAT BUTTON
================================ */

#gameChatButton{

    position:fixed;

    right:15px;
    bottom:15px;

    z-index:10000;

    width:58px;
    height:58px;

    border:none;
    border-radius:50%;

    background:#2793ff;

    color:#fff;

    font-size:24px;

    cursor:pointer;

    box-shadow:
        0 4px 20px rgba(0,0,0,.5);
}

/* ================================
   GAME CHAT
================================ */

#gameChat{

    position:fixed;

    right:15px;
    bottom:85px;

    width:min(420px,calc(100vw - 30px));

    height:min(600px,calc(100vh - 110px));

    z-index:9999;

    display:flex;

    flex-direction:column;

    background:#111827;

    border:1px solid #253347;

    border-radius:16px;

    overflow:hidden;

    box-shadow:
        0 20px 60px rgba(0,0,0,.65);
}

#gameChat.hidden{
    display:none;
}

/* ================================
   CHAT HEADER
================================ */

.game-chat-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:12px 14px;

    background:#0b1220;

    border-bottom:1px solid #253347;
}

.game-chat-title{

    font-weight:800;

    font-size:14px;
}

.game-chat-subtitle{

    margin-top:3px;

    color:#93a4bb;

    font-size:11px;
}

.game-chat-close{

    border:none;

    background:transparent;

    color:#fff;

    font-size:20px;

    cursor:pointer;
}

/* ================================
   CHAT LOG
================================ */

#gameChatMessages{

    flex:1;

    overflow-y:auto;

    padding:12px;

    font-size:13px;
}

.game-chat-msg{

    margin-bottom:8px;

    padding:8px 10px;

    border-radius:10px;

    background:#0b1220;

    border:1px solid #1d2a3b;

    line-height:1.4;
}

.game-chat-name{

    color:#2793ff;

    font-weight:800;

    margin-right:5px;
}

/* ================================
   CHAT INPUT
================================ */

.game-chat-input{

    display:flex;

    gap:6px;

    padding:8px;

    background:#111827;

    border-top:1px solid #253347;
}

.game-chat-input input{

    min-width:0;

    border:1px solid #253347;

    border-radius:9px;

    background:#09111d;

    color:#fff;

    padding:10px;

    font-size:16px;
}

#gameChatName{

    width:65px;

    flex:0 0 65px;
}

#gameChatMessage{

    flex:1;
}

.game-chat-input button{

    border:none;

    border-radius:9px;

    padding:10px 12px;

    background:#2793ff;

    color:#fff;

    font-weight:700;

    cursor:pointer;
}

/* ================================
   MOBILE
================================ */

@media(max-width:600px){

    #gameChat{

        right:0;
        bottom:0;

        width:100%;
        height:100dvh;

        border-radius:0;
    }

    #gameChatButton{

        right:12px;
        bottom:12px;
    }

}

/* ================================
   EMULATOR
================================ */

canvas{

    image-rendering:auto;

    max-width:100%;
    max-height:100%;
}

*{
    touch-action:none;
}

#gameChat,
#gameChat input,
#gameChat button,
#gameChatMessages{

    touch-action:auto;
}

</style>

</head>

<body>

<div id="game"></div>

<div id="loading">

    <div>

        <div id="loadingText">
            Loading ROM...
        </div>

    </div>

</div>

<div id="status"></div>

<div id="error"></div>


<!-- ================================
     GAME CHAT BUTTON
================================ -->

<button
    id="gameChatButton"
    onclick="toggleGameChat()"
>
    💬
</button>


<!-- ================================
     GAME CHAT
================================ -->

<div
    id="gameChat"
    class="hidden"
>

    <div class="game-chat-header">

        <div>

            <div
                id="gameChatTitle"
                class="game-chat-title"
            >
                Game Chat
            </div>

            <div
                id="gameChatSubtitle"
                class="game-chat-subtitle"
            >
                Loading...
            </div>

        </div>

        <button
            class="game-chat-close"
            onclick="toggleGameChat()"
        >
            ✕
        </button>

    </div>


    <div id="gameChatMessages"></div>


    <div class="game-chat-input">

        <input
            id="gameChatName"
            placeholder="name"
            maxlength="10"
        >

        <input
            id="gameChatMessage"
            placeholder="message"
            maxlength="120"
        >

        <button
            onclick="sendGameChatMessage()"
        >
            Send
        </button>

    </div>

</div>


<script>

"use strict";


/* =========================================================
   IMPORTANT GLOBAL STATE
   These MUST be declared before any chat functions.
========================================================= */

let gameChatOpen = false;

let gameChatTimer = null;

let gameChatLastHash = "";

let gameChatLastSend = 0;

const GAME_CHAT_COOLDOWN = 1500;


/* =========================================================
   URL PARAMETERS
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );


/*
    Example:

    emulatortest.html
        ?gameid=baseball-japan
        &rom=https%3A%2F%2Farchive.org%2F...
        &core=nes
        &title=Baseball%20Japan
*/

const gameId =
    params.get("gameid") ||
    "obvyris-game";


const originalRom =
    params.get("rom");


const requestedCore =
    (
        params.get("core") ||
        "nes"
    ).toLowerCase();


const title =
    params.get("title") ||
    "OBVYRIS GAME";


/* =========================================================
   CHAT API
========================================================= */

const CHAT_API =
    "https://script.google.com/macros/s/AKfycbzin84qDcZ9L1q4pTBtHZGKJSTDcZ_wnmgWmnmgPgf1jrc1nRprzbEBixKMSHcdkxiZBg/exec";


/* =========================================================
   CORE MAP
========================================================= */

const CORE_MAP = {

    nes:
        "nes",

    snes:
        "snes",

    genesis:
        "genesis_plus_gx",

    megadrive:
        "genesis_plus_gx",

    sega_genesis:
        "genesis_plus_gx",

    genesis_plus_gx:
        "genesis_plus_gx"

};


const core =
    CORE_MAP[requestedCore] ||
    requestedCore;


/* =========================================================
   DOM
========================================================= */

const loading =
    document.getElementById("loading");


const loadingText =
    document.getElementById("loadingText");


const errorBox =
    document.getElementById("error");


const status =
    document.getElementById("status");


/* =========================================================
   LOGGING
========================================================= */

function log(message){

    console.log(
        "[OBVYRIS EMULATOR]",
        message
    );

    status.textContent =
        message;
}


/* =========================================================
   ERROR
========================================================= */

function fail(message){

    console.error(
        "[OBVYRIS EMULATOR]",
        message
    );

    loading.style.display =
        "none";

    errorBox.style.display =
        "flex";

    errorBox.textContent =
        "Emulator Error\n\n" +
        message;
}


/* =========================================================
   LOADING
========================================================= */

function setLoading(message){

    loadingText.textContent =
        message;

    console.log(
        "[OBVYRIS EMULATOR]",
        message
    );
}


/* =========================================================
   DEBUG
========================================================= */

console.log(
    "[OBVYRIS EMULATOR] Game ID:",
    gameId
);

console.log(
    "[OBVYRIS EMULATOR] Requested Core:",
    requestedCore
);

console.log(
    "[OBVYRIS EMULATOR] EmulatorJS Core:",
    core
);

console.log(
    "[OBVYRIS EMULATOR] Title:",
    title
);

console.log(
    "[OBVYRIS EMULATOR] ROM:",
    originalRom
);


/* =========================================================
   CHAT ROOM ID
=========================================================

   IMPORTANT:

   The game ID IS the chat room ID.

   Example:

   gameid = baseball-japan

   Chat station = baseball-japan

   Every player opening that game
   joins the exact same room.
========================================================= */

const gameChatRoom =
    gameId;


/* =========================================================
   INITIALIZE CHAT UI
========================================================= */

document.getElementById(
    "gameChatTitle"
).textContent =
    "💬 " + title;


document.getElementById(
    "gameChatSubtitle"
).textContent =
    "Game Chat • " + gameId;


/* =========================================================
   TOGGLE CHAT
========================================================= */

function toggleGameChat(){

    const chat =
        document.getElementById(
            "gameChat"
        );


    gameChatOpen =
        !gameChatOpen;


    if(gameChatOpen){

        chat.classList.remove(
            "hidden"
        );


        loadGameChat();


        clearInterval(
            gameChatTimer
        );


        gameChatTimer =
            setInterval(
                loadGameChat,
                2000
            );


    }else{

        chat.classList.add(
            "hidden"
        );


        clearInterval(
            gameChatTimer
        );

    }

}


/* =========================================================
   LOAD GAME CHAT
========================================================= */

async function loadGameChat(){

    if(!gameChatOpen){
        return;
    }


    try{

        const response =
            await fetch(
                CHAT_API,
                {
                    method:"POST",

                    body:
                        JSON.stringify({

                            action:"get",

                            station:
                                gameChatRoom

                        })
                }
            );


        if(!response.ok){

            throw new Error(
                "Chat HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        if(!Array.isArray(data)){
            return;
        }


        const hash =
            JSON.stringify(data);


        if(hash === gameChatLastHash){
            return;
        }


        gameChatLastHash =
            hash;


        renderGameChat(
            data
        );


    }catch(error){

        console.error(
            "[OBVYRIS GAME CHAT]",
            error
        );

    }

}


/* =========================================================
   RENDER GAME CHAT
========================================================= */

function renderGameChat(data){

    const container =
        document.getElementById(
            "gameChatMessages"
        );


    if(!data.length){

        container.innerHTML = `
            <div style="
                text-align:center;
                color:#93a4bb;
                padding:30px;
            ">
                No messages yet.<br>
                Start the conversation.
            </div>
        `;

        return;
    }


    container.innerHTML =
        data.map(
            message => {

                const name =
                    escapeHTML(
                        message.name ||
                        "Anon"
                    );


                const text =
                    escapeHTML(
                        message.message ||
                        ""
                    );


                return `

                    <div class="game-chat-msg">

                        <span class="game-chat-name">
                            ${name}:
                        </span>

                        ${text}

                    </div>

                `;

            }
        ).join("");


    container.scrollTop =
        container.scrollHeight;

}


/* =========================================================
   SEND GAME CHAT
========================================================= */

async function sendGameChatMessage(){

    const now =
        Date.now();


    if(
        now -
        gameChatLastSend
        <
        GAME_CHAT_COOLDOWN
    ){

        return;

    }


    const name =
        document.getElementById(
            "gameChatName"
        ).value.trim()
        ||
        "Anon";


    const input =
        document.getElementById(
            "gameChatMessage"
        );


    const message =
        input.value.trim();


    if(!message){
        return;
    }


    gameChatLastSend =
        now;


    const sendButton =
        document.querySelector(
            ".game-chat-input button"
        );


    sendButton.disabled =
        true;


    try{

        await fetch(
            CHAT_API,
            {

                method:"POST",

                body:
                    JSON.stringify({

                        action:"send",

                        /*
                         * THIS IS THE IMPORTANT PART
                         *
                         * The game ID becomes
                         * the chat station.
                         */

                        station:
                            gameChatRoom,

                        stationName:
                            title,

                        name:
                            name,

                        message:
                            message

                    })

            }
        );


        input.value = "";


        await loadGameChat();


    }catch(error){

        console.error(
            "[OBVYRIS GAME CHAT]",
            error
        );

    }


    setTimeout(
        () => {

            sendButton.disabled =
                false;

        },
        GAME_CHAT_COOLDOWN
    );

}


/* =========================================================
   ENTER TO SEND
========================================================= */

document
    .getElementById(
        "gameChatMessage"
    )
    .addEventListener(
        "keydown",
        function(event){

            if(
                event.key === "Enter"
            ){

                event.preventDefault();

                sendGameChatMessage();

            }

        }
    );


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHTML(value){

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   ROM REQUIRED
========================================================= */

if(!originalRom){

    fail(
        "No ROM was supplied.\n\n" +

        "Open the emulator with:\n\n" +

        "?gameid=GAME-ID" +
        "&rom=ROM-URL" +
        "&core=nes" +
        "&title=GAME-TITLE"
    );

}else{


    /* =====================================================
       ROM PROXY
    ===================================================== */

    const PROXY_BASE =
        "https://obvyris-rom-proxy.vercel.app/api/rom";


    const proxyURL =
        PROXY_BASE +
        "?url=" +
        encodeURIComponent(
            originalRom
        );


    /* =====================================================
       DOWNLOAD ROM
    ===================================================== */

    async function downloadROM(){

        setLoading(
            "Downloading ROM..."
        );


        log(
            "Fetching ROM through proxy..."
        );


        const response =
            await fetch(
                proxyURL,
                {
                    method:"GET",
                    mode:"cors",
                    cache:"no-store"
                }
            );


        if(!response.ok){

            let text = "";

            try{

                text =
                    await response.text();

            }catch(e){}


            throw new Error(
                "Proxy returned HTTP " +
                response.status +
                "\n" +
                text
            );

        }


        setLoading(
            "Reading ROM..."
        );


        const buffer =
            await response.arrayBuffer();


        console.log(
            "[OBVYRIS EMULATOR] ROM size:",
            buffer.byteLength
        );


        if(
            !buffer ||
            buffer.byteLength < 16
        ){

            throw new Error(
                "ROM data is empty or too small."
            );

        }


        /* ===============================================
           NES HEADER
        =============================================== */

        if(core === "nes"){

            const bytes =
                new Uint8Array(
                    buffer
                );


            const validNES =
                bytes.length >= 4 &&

                bytes[0] === 0x4E &&
                bytes[1] === 0x45 &&
                bytes[2] === 0x53 &&
                bytes[3] === 0x1A;


            if(!validNES){

                throw new Error(
                    "Downloaded file is not a valid NES ROM."
                );

            }

        }


        const blob =
            new Blob(
                [buffer],
                {
                    type:
                        "application/octet-stream"
                }
            );


        return URL.createObjectURL(
            blob
        );

    }


    /* =====================================================
       START EMULATORJS
    ===================================================== */

    function startEmulator(
        blobURL
    ){

        return new Promise(
            (resolve,reject) => {

                try{

                    setLoading(
                        "Preparing EmulatorJS..."
                    );


                    window.EJS_player =
                        "#game";


                    window.EJS_core =
                        core;


                    window.EJS_gameUrl =
                        blobURL;


                    window.EJS_gameName =
                        title;


                    window.EJS_pathtodata =
                        "https://cdn.emulatorjs.org/stable/data/";


                    window.EJS_startOnLoaded =
                        true;


                    window.EJS_disableAutoLang =
                        true;


                    window.EJS_color =
                        "#111111";


                    window.EJS_backgroundColor =
                        "#000000";


                    /*
                     * Use actual game ID.
                     */

                    window.EJS_gameID =
                        "obvyris-" +
                        gameId;


                    window.EJS_onGameStart =
                        function(){

                            console.log(
                                "[OBVYRIS EMULATOR] GAME STARTED"
                            );


                            loading.style.display =
                                "none";


                            status.classList.add(
                                "hidden"
                            );

                        };


                    window.EJS_onLoad =
                        function(){

                            console.log(
                                "[OBVYRIS EMULATOR] EmulatorJS loaded"
                            );

                        };


                    setLoading(
                        "Loading EmulatorJS..."
                    );


                    const script =
                        document.createElement(
                            "script"
                        );


                    script.src =
                        "https://cdn.emulatorjs.org/stable/data/loader.js";


                    script.async =
                        true;


                    script.onload =
                        function(){

                            console.log(
                                "[OBVYRIS EMULATOR] EmulatorJS loader loaded"
                            );


                            setLoading(
                                "Starting " +
                                requestedCore.toUpperCase() +
                                "..."
                            );

                        };


                    script.onerror =
                        function(){

                            reject(
                                new Error(
                                    "EmulatorJS loader could not be loaded."
                                )
                            );

                        };


                    document.head.appendChild(
                        script
                    );


                }catch(error){

                    reject(error);

                }

            }
        );

    }


    /* =====================================================
       MAIN
    ===================================================== */

    async function main(){

        try{

            console.log(
                "[OBVYRIS EMULATOR] Starting..."
            );


            console.log(
                "[OBVYRIS EMULATOR] Game ID:",
                gameId
            );


            console.log(
                "[OBVYRIS EMULATOR] Chat Room:",
                gameChatRoom
            );


            const blobURL =
                await downloadROM();


            await startEmulator(
                blobURL
            );


        }catch(error){

            console.error(
                "[OBVYRIS EMULATOR] FATAL:",
                error
            );


            fail(
                error &&
                error.message
                    ? error.message
                    : String(error)
            );

        }

    }


    main();

}


/* =========================================================
   GLOBAL ERRORS
========================================================= */

window.addEventListener(
    "error",
    function(event){

        console.error(
            "[OBVYRIS EMULATOR] Window error:",
            event.error ||
            event.message
        );

    }
);


window.addEventListener(
    "unhandledrejection",
    function(event){

        console.error(
            "[OBVYRIS EMULATOR] Promise error:",
            event.reason
        );

    }
);

</script>

</body>
</html>
