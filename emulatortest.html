<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"
>

<title>Games Obvyris</title>

<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@700;900&display=swap"
  rel="stylesheet"
>

<style>

:root{
  --bg:#070d16;
  --panel:#101927;
  --panel2:#0b1320;
  --line:#26364b;
  --text:#ffffff;
  --muted:#91a3ba;
  --blue:#2793ff;
  --blue2:#1869d9;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,sans-serif;
  overflow:hidden;
}

body{
  display:flex;
  flex-direction:column;
}

/* =========================
   HEADER
========================= */

.header{
  height:60px;
  flex:none;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 14px;

  background:var(--panel);
  border-bottom:1px solid var(--line);
}

.logo{
  font-family:Orbitron;
  font-weight:900;
  font-size:18px;
}

.logo span{
  color:var(--blue);
}

.game-title{
  font-size:13px;
  color:var(--muted);

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;

  max-width:50vw;
}

/* =========================
   MAIN
========================= */

.main{
  flex:1;
  display:flex;
  flex-direction:column;
  min-height:0;
}

/* =========================
   EMULATOR
========================= */

.emulator-wrap{
  flex:1;
  min-height:0;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#000;

  position:relative;
  overflow:hidden;
}

#game{
  width:100%;
  height:100%;
  border:none;
  background:#000;
}

#game canvas{
  max-width:100%;
  max-height:100%;
}

/* Emulator loading */

.emulator-loading{
  position:absolute;
  inset:0;

  display:flex;
  align-items:center;
  justify-content:center;

  flex-direction:column;

  background:#000;

  z-index:20;
}

.emulator-loading.hidden{
  display:none;
}

.emulator-loading strong{
  font-family:Orbitron;
  font-size:20px;
  margin-bottom:10px;
}

.emulator-loading span{
  color:var(--muted);
  font-size:13px;
}

/* =========================
   BOTTOM BAR
========================= */

.bottom-bar{
  height:58px;
  flex:none;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:8px 12px;

  background:var(--panel);
  border-top:1px solid var(--line);
}

.game-info{
  min-width:0;
}

.game-name{
  font-weight:800;
  font-size:13px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.game-id{
  font-size:11px;
  color:var(--muted);
}

button{
  border:none;
  border-radius:10px;

  padding:10px 14px;

  background:linear-gradient(
    180deg,
    var(--blue),
    var(--blue2)
  );

  color:white;

  font-weight:800;
  cursor:pointer;
}

button:active{
  transform:scale(.97);
}

button:disabled{
  opacity:.5;
}

/* =========================
   CHAT BUTTON
========================= */

#chatButton{
  position:fixed;

  right:16px;
  bottom:74px;

  width:56px;
  height:56px;

  border-radius:50%;

  font-size:22px;

  z-index:1000;

  box-shadow:0 5px 25px rgba(0,0,0,.5);
}

/* =========================
   CHAT WINDOW
========================= */

.chat{
  position:fixed;

  right:16px;
  bottom:140px;

  width:min(420px,calc(100vw - 24px));
  height:min(600px,75vh);

  display:flex;
  flex-direction:column;

  background:var(--panel);

  border:1px solid var(--line);
  border-radius:18px;

  overflow:hidden;

  z-index:2000;

  box-shadow:0 20px 60px rgba(0,0,0,.6);
}

.chat.hidden{
  display:none;
}

/* =========================
   CHAT HEADER
========================= */

.chat-header{
  height:52px;
  flex:none;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:8px 12px;

  background:var(--panel2);
  border-bottom:1px solid var(--line);
}

.chat-room{
  min-width:0;
}

.chat-room-title{
  font-weight:800;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chat-room-sub{
  color:var(--muted);
  font-size:10px;
}

/* =========================
   MESSAGES
========================= */

.messages{
  flex:1;
  min-height:0;

  overflow-y:auto;

  padding:10px;
}

.message{
  padding:8px 10px;

  margin-bottom:7px;

  border-radius:10px;

  background:var(--panel2);

  font-size:13px;

  word-break:break-word;
}

.message-name{
  color:var(--blue);
  font-weight:800;
  margin-right:5px;
}

/* =========================
   SYSTEM MESSAGE
========================= */

.system-message{
  border:1px solid var(--blue);

  background:rgba(39,147,255,.08);

  color:var(--muted);
}

/* =========================
   CHAT INPUT
========================= */

.chat-input{
  flex:none;

  display:flex;
  gap:6px;

  padding:8px;

  border-top:1px solid var(--line);

  background:var(--panel);
}

.chat-input input{
  min-width:0;

  border:1px solid var(--line);

  border-radius:9px;

  background:var(--bg);
  color:white;

  padding:10px;

  font-size:16px;
}

#name{
  width:75px;
  flex:none;
}

#message{
  flex:1;
}

/* =========================
   CHAT FULLSCREEN
========================= */

.chat.fullscreen{
  inset:0;

  width:100%;
  height:100%;

  border-radius:0;

  top:0;
  right:0;
  bottom:0;
  left:0;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px){

  .chat{
    left:6px;
    right:6px;

    bottom:70px;

    width:auto;

    height:70vh;

    border-radius:16px;
  }

  #chatButton{
    bottom:66px;
  }

  .game-title{
    max-width:40vw;
  }

  .chat-input input{
    min-height:44px;
  }

  .chat-input button{
    min-height:44px;
  }

}

/* =========================
   EMULATOR FULLSCREEN
========================= */

.emulator-wrap:fullscreen{
  width:100vw;
  height:100vh;
}

</style>

</head>

<body>

<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">

  <div class="logo">
    Games <span>Obvyris</span>
  </div>

  <div
    id="gameTitle"
    class="game-title"
  >
    Loading game...
  </div>

</div>


<!-- =====================================================
     MAIN
===================================================== -->

<div class="main">

  <div
    id="emulatorWrap"
    class="emulator-wrap"
  >

    <div
      id="game"
    ></div>

    <div
      id="emulatorLoading"
      class="emulator-loading"
    >

      <strong>
        OBVYRIS EMULATOR
      </strong>

      <span id="loadingText">
        Loading Baseball (Japan)...
      </span>

    </div>

  </div>


  <!-- =========================
       BOTTOM BAR
  ========================= -->

  <div class="bottom-bar">

    <div class="game-info">

      <div
        id="bottomGameName"
        class="game-name"
      >
        Baseball (Japan)
      </div>

      <div
        id="bottomGameId"
        class="game-id"
      >
        GAME ID: baseball-japan
      </div>

    </div>

    <button
      onclick="toggleEmulatorFullscreen()"
    >
      ⛶
    </button>

  </div>

</div>


<!-- =====================================================
     CHAT BUTTON
===================================================== -->

<button
  id="chatButton"
  onclick="toggleChat()"
>
  💬
</button>


<!-- =====================================================
     CHAT WINDOW
===================================================== -->

<div
  id="chat"
  class="chat hidden"
>

  <div class="chat-header">

    <div class="chat-room">

      <div
        id="chatRoomTitle"
        class="chat-room-title"
      >
        🎮 Baseball (Japan)
      </div>

      <div
        id="chatRoomSub"
        class="chat-room-sub"
      >
        Game ID: baseball-japan
      </div>

    </div>

    <div
      style="display:flex;gap:5px;"
    >

      <button
        onclick="toggleChatFullscreen()"
      >
        ⛶
      </button>

      <button
        onclick="toggleChat()"
      >
        ✖
      </button>

    </div>

  </div>


  <div
    id="messages"
    class="messages"
  ></div>


  <div class="chat-input">

    <input
      id="name"
      placeholder="Name"
      maxlength="10"
      autocomplete="off"
    >

    <input
      id="message"
      placeholder="Message"
      maxlength="120"
      autocomplete="off"
    >

    <button
      id="sendButton"
      onclick="sendMessage()"
    >
      Send
    </button>

  </div>

</div>


<script>

/* =====================================================
   CONFIG
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbzin84qDcZ9L1q4pTBtHZGKJSTDcZ_wnmgWmnmgPgf1jrc1nRprzbEBixKMSHcdkxiZBg/exec";


/* =====================================================
   TEST GAME
===================================================== */

const TEST_GAME = {

  id:
    "baseball-japan",

  name:
    "Baseball (Japan)",

  platform:
    "nes",

  rom:
    "https://archive.org/download/BaseballJapan/Baseball%20%28Japan%29.zip/Baseball%20%28Japan%29.nes"

};


/* =====================================================
   URL OVERRIDE
=====================================================

   Later you can launch:

   Game_Emulator.html
   ?gameid=123
   &name=Zelda
   &rom=https://...

===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );


const GAME_ID =
  params.get("gameid") ||
  TEST_GAME.id;


const GAME_NAME =
  params.get("name") ||
  TEST_GAME.name;


const ROM_URL =
  params.get("rom") ||
  TEST_GAME.rom;


/* =====================================================
   CHAT ROOM
===================================================== */

const CHAT_ROOM =
  "game-" + GAME_ID;


/* =====================================================
   STATE
===================================================== */

let lastChatHash = "";

let chatTimer = null;

let lastSendTime = 0;

const SEND_COOLDOWN = 1500;


/* =====================================================
   INITIALIZE
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    initializeGameUI();

    initializeChat();

    initializeEmulator();

  }
);


/* =====================================================
   GAME UI
===================================================== */

function initializeGameUI(){

  document.title =
    GAME_NAME +
    " — Games Obvyris";

  document.getElementById(
    "gameTitle"
  ).textContent =
    GAME_NAME;

  document.getElementById(
    "bottomGameName"
  ).textContent =
    GAME_NAME;

  document.getElementById(
    "bottomGameId"
  ).textContent =
    "GAME ID: " +
    GAME_ID;

  document.getElementById(
    "chatRoomTitle"
  ).textContent =
    "🎮 " +
    GAME_NAME;

  document.getElementById(
    "chatRoomSub"
  ).textContent =
    "Game ID: " +
    GAME_ID;

}


/* =====================================================
   EMULATORJS
===================================================== */

function initializeEmulator(){

  /*
   * EmulatorJS configuration
   */

  window.EJS_player =
    "#game";

  window.EJS_core =
    "nes";

  window.EJS_gameName =
    GAME_NAME;

  window.EJS_gameUrl =
    ROM_URL;

  window.EJS_pathtodata =
    "https://cdn.emulatorjs.org/stable/data/";

  window.EJS_startOnLoaded =
    true;

  window.EJS_backgroundColor =
    "#000000";

  window.EJS_color =
    "#2793ff";

  window.EJS_language =
    "en-US";

  window.EJS_volume =
    1;


  /*
   * Load EmulatorJS
   */

  const script =
    document.createElement(
      "script"
    );

  script.src =
    "https://cdn.emulatorjs.org/stable/data/loader.js";

  script.onload =
    () => {

      console.log(
        "EmulatorJS loaded"
      );

      document
        .getElementById(
          "loadingText"
        )
        .textContent =
        "Starting Baseball (Japan)...";

    };


  script.onerror =
    () => {

      document
        .getElementById(
          "loadingText"
        )
        .textContent =
        "EmulatorJS failed to load.";

    };


  document
    .body
    .appendChild(script);

}


/* =====================================================
   CHAT
===================================================== */

function initializeChat(){

  loadMessages();

  chatTimer =
    setInterval(
      loadMessages,
      2000
    );

}


/* =====================================================
   OPEN / CLOSE CHAT
===================================================== */

function toggleChat(){

  const chat =
    document.getElementById(
      "chat"
    );

  chat.classList.toggle(
    "hidden"
  );


  if(
    !chat.classList.contains(
      "hidden"
    )
  ){

    loadMessages();

    setTimeout(
      () => {

        document
          .getElementById(
            "message"
          )
          .focus();

      },
      100
    );

  }

}


/* =====================================================
   LOAD MESSAGES
===================================================== */

async function loadMessages(){

  try{

    const response =
      await fetch(
        API_URL,
        {

          method:"POST",

          body:JSON.stringify({

            action:
              "get",

            station:
              CHAT_ROOM

          })

        }
      );


    if(!response.ok){

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    if(!Array.isArray(data)){

      return;

    }


    const hash =
      JSON.stringify(data);


    if(hash === lastChatHash){

      return;

    }


    lastChatHash =
      hash;


    renderMessages(
      data
    );

  }
  catch(error){

    console.error(
      "Chat load failed:",
      error
    );

  }

}


/* =====================================================
   RENDER MESSAGES
===================================================== */

function renderMessages(data){

  const box =
    document.getElementById(
      "messages"
    );


  if(!data.length){

    box.innerHTML = `

      <div
        class="message system-message"
      >

        🎮 No messages yet.

        <br>

        Start the discussion
        for this game.

      </div>

    `;

    return;

  }


  box.innerHTML =
    data
      .map(
        msg => {

          return `

            <div class="message">

              <span class="message-name">

                ${escapeHTML(
                  msg.name ||
                  "Anon"
                )}:

              </span>

              ${escapeHTML(
                msg.message ||
                ""
              )}

            </div>

          `;

        }
      )
      .join("");


  box.scrollTop =
    box.scrollHeight;

}


/* =====================================================
   SEND MESSAGE
===================================================== */

async function sendMessage(){

  const now =
    Date.now();


  if(
    now -
    lastSendTime <
    SEND_COOLDOWN
  ){

    return;

  }


  const name =
    document
      .getElementById(
        "name"
      )
      .value
      .trim() ||
    "Anon";


  const input =
    document.getElementById(
      "message"
    );


  const message =
    input.value.trim();


  if(!message){

    return;

  }


  lastSendTime =
    now;


  const button =
    document.getElementById(
      "sendButton"
    );


  button.disabled =
    true;


  try{

    await fetch(
      API_URL,
      {

        method:"POST",

        body:JSON.stringify({

          action:
            "send",

          station:
            CHAT_ROOM,

          stationName:
            GAME_NAME,

          name:
            name,

          message:
            message,

          source:
            "games"

        })

      }
    );


    input.value =
      "";


    lastChatHash =
      "";


    await loadMessages();

  }
  catch(error){

    console.error(
      "Message send failed:",
      error
    );

  }


  setTimeout(
    () => {

      button.disabled =
        false;

    },
    SEND_COOLDOWN
  );

}


/* =====================================================
   ENTER TO SEND
===================================================== */

document
  .getElementById(
    "message"
  )
  .addEventListener(
    "keydown",
    event => {

      if(
        event.key ===
        "Enter"
      ){

        event.preventDefault();

        sendMessage();

      }

    }
  );


/* =====================================================
   EMULATOR FULLSCREEN
===================================================== */

function toggleEmulatorFullscreen(){

  const emulator =
    document.getElementById(
      "emulatorWrap"
    );


  if(
    !document.fullscreenElement
  ){

    if(
      emulator.requestFullscreen
    ){

      emulator.requestFullscreen();

    }

  }
  else{

    if(
      document.exitFullscreen
    ){

      document.exitFullscreen();

    }

  }

}


/* =====================================================
   CHAT FULLSCREEN
===================================================== */

function toggleChatFullscreen(){

  document
    .getElementById(
      "chat"
    )
    .classList
    .toggle(
      "fullscreen"
    );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =====================================================
   DEBUG
===================================================== */

console.log(
  "GAME ID:",
  GAME_ID
);

console.log(
  "GAME NAME:",
  GAME_NAME
);

console.log(
  "ROM:",
  ROM_URL
);

console.log(
  "CHAT ROOM:",
  CHAT_ROOM
);

</script>

</body>
</html>
