<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>OBVYRIS Emulator</title>

<style>

html,
body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
    color:#fff;
    font-family:Arial,sans-serif;
}

/* =========================================================
   EMULATOR
   ========================================================= */

#game{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    background:#000;
}

#game canvas{
    image-rendering:auto;
    max-width:100%;
    max-height:100%;
}

/* =========================================================
   LOADING
   ========================================================= */

#loading{
    position:absolute;
    inset:0;
    z-index:900;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#000;
    color:#fff;
    font-size:18px;
    text-align:center;
}

#loading.hidden{
    display:none;
}

#loadingText{
    padding:20px;
}

/* =========================================================
   STATUS
   ========================================================= */

#status{
    position:absolute;
    top:0;
    left:0;
    right:0;
    z-index:1000;
    padding:8px 12px;
    background:rgba(0,0,0,.72);
    color:#fff;
    font-size:12px;
    pointer-events:none;
    transition:.3s;
}

#status.hidden{
    opacity:0;
}

/* =========================================================
   ERROR
   ========================================================= */

#error{
    position:absolute;
    inset:0;
    z-index:2000;
    display:none;
    align-items:center;
    justify-content:center;
    background:#000;
    color:#fff;
    padding:30px;
    text-align:center;
    white-space:pre-wrap;
}

/* =========================================================
   GAME CHAT BUTTON
   ========================================================= */

#gameChatButton{
    position:fixed;
    right:18px;
    bottom:18px;
    width:48px;
    height:48px;
    z-index:100000;
    border:1px solid rgba(255,255,255,.25);
    border-radius:50%;
    background:rgba(10,18,30,.45);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:21px;
    cursor:pointer;
    backdrop-filter:blur(5px);
    -webkit-backdrop-filter:blur(5px);
    box-shadow:0 4px 16px rgba(0,0,0,.35);
    transition:
        transform .15s,
        background .15s,
        opacity .15s;
}

#gameChatButton:hover{
    background:rgba(39,147,255,.65);
}

#gameChatButton:active{
    transform:scale(.92);
}

#gameChatButton.chat-open{
    background:rgba(39,147,255,.7);
}

/* =========================================================
   UNREAD INDICATOR
   ========================================================= */

#gameChatUnread{
    position:absolute;
    right:-2px;
    top:-2px;
    min-width:16px;
    height:16px;
    padding:0 3px;
    border-radius:20px;
    background:#ff3b30;
    color:#fff;
    font-size:10px;
    font-weight:bold;
    display:none;
    align-items:center;
    justify-content:center;
}

/* =========================================================
   GAME CHAT WINDOW
   ========================================================= */

#gameChat{
    position:fixed;
    right:18px;
    bottom:76px;
    width:min(340px,calc(100vw - 36px));
    height:min(430px,calc(100vh - 120px));
    z-index:99999;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    border:1px solid rgba(255,255,255,.16);
    border-radius:18px;
    background:rgba(5,12,22,.46);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
    box-shadow:0 15px 45px rgba(0,0,0,.5);
    opacity:0;
    transform:translateY(12px) scale(.97);
    pointer-events:none;
    transition:
        opacity .18s ease,
        transform .18s ease;
}

#gameChat.open{
    opacity:1;
    transform:translateY(0) scale(1);
    pointer-events:auto;
}

/* =========================================================
   CHAT HEADER
   ========================================================= */

#gameChatHeader{
    min-height:48px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 10px 0 14px;
    background:rgba(5,12,22,.45);
    border-bottom:1px solid rgba(255,255,255,.12);
    flex-shrink:0;
}

#gameChatTitle{
    min-width:0;
}

#gameChatName{
    font-size:14px;
    font-weight:800;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

#gameChatRoom{
    margin-top:2px;
    color:rgba(255,255,255,.55);
    font-size:10px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

#gameChatClose{
    width:34px;
    height:34px;
    border:0;
    border-radius:10px;
    background:rgba(255,255,255,.08);
    color:#fff;
    font-size:17px;
    cursor:pointer;
}

/* =========================================================
   CHAT MESSAGES
   ========================================================= */

#gameChatMessages{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:10px;
    scrollbar-width:thin;
    scrollbar-color:
        rgba(255,255,255,.25)
        transparent;
}

#gameChatMessages::-webkit-scrollbar{
    width:5px;
}

#gameChatMessages::-webkit-scrollbar-track{
    background:transparent;
}

#gameChatMessages::-webkit-scrollbar-thumb{
    background:rgba(255,255,255,.2);
    border-radius:10px;
}

.game-chat-message{
    margin-bottom:7px;
    padding:7px 9px;
    border-radius:10px;
    background:rgba(0,0,0,.32);
    border:1px solid rgba(255,255,255,.06);
    font-size:12px;
    line-height:1.35;
    word-break:break-word;
}

.game-chat-name{
    color:#4da3ff;
    font-weight:800;
    margin-right:4px;
}

.game-chat-system{
    color:rgba(255,255,255,.5);
    font-style:italic;
    text-align:center;
}

/* =========================================================
   CHAT INPUT
   ========================================================= */

#gameChatInputBar{
    display:flex;
    gap:5px;
    padding:8px;
    background:rgba(5,12,22,.48);
    border-top:1px solid rgba(255,255,255,.1);
    flex-shrink:0;
}

#gameChatNameInput{
    width:58px;
    flex-shrink:0;
}

#gameChatMessageInput{
    flex:1;
    min-width:0;
}

#gameChatInputBar input{
    height:38px;
    box-sizing:border-box;
    padding:0 9px;
    border:1px solid rgba(255,255,255,.16);
    border-radius:9px;
    outline:none;
    background:rgba(0,0,0,.38);
    color:#fff;
    font-size:14px;
}

#gameChatInputBar input::placeholder{
    color:rgba(255,255,255,.45);
}

#gameChatSend{
    width:42px;
    height:38px;
    flex-shrink:0;
    border:0;
    border-radius:9px;
    background:rgba(39,147,255,.72);
    color:#fff;
    font-size:15px;
    cursor:pointer;
}

#gameChatSend:active{
    transform:scale(.95);
}

#gameChatSend:disabled{
    opacity:.5;
}

/* =========================================================
   MOBILE
   ========================================================= */

@media(max-width:600px){

    #gameChatButton{
        right:12px;
        bottom:12px;
        width:44px;
        height:44px;
        font-size:19px;
    }

    #gameChat{
        right:10px;
        bottom:64px;
        width:calc(100vw - 20px);
        height:min(390px,calc(100vh - 90px));
        border-radius:16px;
    }

    #gameChatInputBar input{
        height:42px;
    }

    #gameChatSend{
        height:42px;
    }

}

/* =========================================================
   TOUCH
   ========================================================= */

button,
input{
    touch-action:manipulation;
}

</style>

</head>

<body>

<div id="game"></div>

<div id="loading">

    <div>

        <div id="loadingText">
            Loading ROM...
        </div>

    </div>

</div>

<div id="status"></div>

<div id="error"></div>

<!-- =======================================================
     GAME CHAT BUTTON
     ======================================================= -->

<button
    id="gameChatButton"
    type="button"
    onclick="toggleGameChat()"
    aria-label="Game Chat"
>

    💬

    <span id="gameChatUnread">
        0
    </span>

</button>

<!-- =======================================================
     GAME CHAT
     ======================================================= -->

<div id="gameChat">

    <div id="gameChatHeader">

        <div id="gameChatTitle">

            <div id="gameChatName">
                💬 Game Chat
            </div>

            <div id="gameChatRoom">
                Loading room...
            </div>

        </div>

        <button
            id="gameChatClose"
            type="button"
            onclick="closeGameChat()"
        >
            ✕
        </button>

    </div>

    <div id="gameChatMessages"></div>

    <div id="gameChatInputBar">

        <input
            id="gameChatNameInput"
            maxlength="10"
            placeholder="Name"
            autocomplete="off"
        >

        <input
            id="gameChatMessageInput"
            maxlength="120"
            placeholder="Chat..."
            autocomplete="off"
        >

        <button
            id="gameChatSend"
            type="button"
            onclick="sendGameChat()"
        >
            ➤
        </button>

    </div>

</div>

<script>

"use strict";

/* =========================================================
   URL PARAMETERS
   ========================================================= */

const params =
    new URLSearchParams(location.search);

const originalRom =
    params.get("rom");

const requestedCore =
    (params.get("core") || "nes").toLowerCase();

const title =
    params.get("title") || "OBVYRIS GAME";

const gameID =
    params.get("gameid") || "";

const chatStation =
    params.get("station") ||
    (gameID ? "game-" + gameID : "");


/* =========================================================
   URL LOGGING
   ========================================================= */

console.log(
    "[OBVYRIS EMULATOR] Game ID:",
    gameID
);

console.log(
    "[OBVYRIS EMULATOR] Chat Station:",
    chatStation
);

console.log(
    "[OBVYRIS EMULATOR] Requested Core:",
    requestedCore
);

console.log(
    "[OBVYRIS EMULATOR] Title:",
    title
);

console.log(
    "[OBVYRIS EMULATOR] ROM:",
    originalRom
);


/* =========================================================
   CORE MAP
   ========================================================= */

const CORE_MAP = {

    nes:
        "nes",

    snes:
        "snes",

    gba:
        "mgba",

    gbc:
        "gambatte",

    genesis:
        "genesis_plus_gx",

    megadrive:
        "genesis_plus_gx",

    sega_genesis:
        "genesis_plus_gx",

    genesis_plus_gx:
        "genesis_plus_gx"

};

const core =
    CORE_MAP[requestedCore] ||
    requestedCore;

console.log(
    "[OBVYRIS EMULATOR] EmulatorJS Core:",
    core
);


/* =========================================================
   DOM
   ========================================================= */

const loading =
    document.getElementById("loading");

const loadingText =
    document.getElementById("loadingText");

const errorBox =
    document.getElementById("error");

const status =
    document.getElementById("status");


/* =========================================================
   LOG
   ========================================================= */

function log(message){

    console.log(
        "[OBVYRIS EMULATOR]",
        message
    );

    status.textContent =
        message;

}


/* =========================================================
   LOADING
   ========================================================= */

function setLoading(message){

    loadingText.textContent =
        message;

    console.log(
        "[OBVYRIS EMULATOR]",
        message
    );

}


/* =========================================================
   ERROR
   ========================================================= */

function fail(message){

    console.error(
        "[OBVYRIS EMULATOR]",
        message
    );

    loading.style.display =
        "none";

    errorBox.style.display =
        "flex";

    errorBox.textContent =
        "Emulator Error\n\n" +
        message;

}


/* =========================================================
   ROM CHECK
   ========================================================= */

if(!originalRom){

    fail(

        "No ROM was supplied.\n\n" +

        "Use:\n" +

        "?gameid=zelda" +

        "&core=nes" +

        "&title=The%20Legend%20of%20Zelda" +

        "&rom=ROM_URL"

    );

    throw new Error(
        "Missing ROM"
    );

}

if(!gameID){

    console.warn(
        "[OBVYRIS EMULATOR] No Game ID supplied."
    );

}


/* =========================================================
   ROM PROXY
   ========================================================= */

const PROXY_BASE =
    "https://obvyris-rom-proxy.vercel.app/api/rom";

const proxyURL =
    PROXY_BASE +
    "?url=" +
    encodeURIComponent(
        originalRom
    );

console.log(
    "[OBVYRIS EMULATOR] Proxy ROM:",
    proxyURL
);


/* =========================================================
   DOWNLOAD ROM
   ========================================================= */

async function downloadROM(){

    try{

        setLoading(
            "Downloading ROM..."
        );

        log(
            "Fetching ROM..."
        );

        const response =
            await fetch(
                proxyURL,
                {
                    method:"GET",
                    mode:"cors",
                    cache:"no-store"
                }
            );

        console.log(
            "[OBVYRIS EMULATOR] Proxy response:",
            response.status,
            response.statusText
        );

        if(!response.ok){

            let text = "";

            try{

                text =
                    await response.text();

            }catch(e){}

            throw new Error(

                "Proxy returned HTTP " +
                response.status +
                "\n" +
                text

            );

        }

        setLoading(
            "Reading ROM..."
        );

        const buffer =
            await response.arrayBuffer();

        console.log(
            "[OBVYRIS EMULATOR] ROM downloaded:",
            buffer.byteLength,
            "bytes"
        );

        if(
            !buffer ||
            buffer.byteLength < 16
        ){

            throw new Error(
                "ROM data is empty or too small."
            );

        }


        /* =================================================
           NES HEADER
           ================================================= */

        if(core === "nes"){

            const bytes =
                new Uint8Array(
                    buffer
                );

            const validNES =
                bytes.length >= 4 &&
                bytes[0] === 0x4E &&
                bytes[1] === 0x45 &&
                bytes[2] === 0x53 &&
                bytes[3] === 0x1A;

            console.log(
                "[OBVYRIS EMULATOR] NES header:",
                validNES
                    ? "VALID"
                    : "INVALID"
            );

            if(!validNES){

                throw new Error(

                    "The downloaded file is not a valid NES ROM.\n\n" +

                    "First bytes: " +

                    Array.from(
                        bytes.slice(0,8)
                    )
                    .map(
                        x =>
                            x.toString(16)
                             .padStart(2,"0")
                    )
                    .join(" ")

                );

            }

        }


        /* =================================================
           LOCAL BLOB
           ================================================= */

        const blob =
            new Blob(
                [buffer],
                {
                    type:
                        "application/octet-stream"
                }
            );

        const blobURL =
            URL.createObjectURL(
                blob
            );

        console.log(
            "[OBVYRIS EMULATOR] Local ROM Blob:",
            blobURL
        );

        return blobURL;

    }catch(error){

        console.error(
            "[OBVYRIS EMULATOR] ROM download error:",
            error
        );

        throw error;

    }

}


/* =========================================================
   EMULATORJS
   ========================================================= */

function startEmulator(blobURL){

    return new Promise(
        (resolve,reject)=>{

            try{

                setLoading(
                    "Preparing EmulatorJS..."
                );

                window.EJS_player =
                    "#game";

                window.EJS_core =
                    core;

                window.EJS_gameUrl =
                    blobURL;

                window.EJS_gameName =
                    title;

                window.EJS_pathtodata =
                    "https://cdn.emulatorjs.org/stable/data/";

                window.EJS_startOnLoaded =
                    true;

                window.EJS_disableAutoLang =
                    true;

                window.EJS_color =
                    "#2793ff";

                window.EJS_backgroundColor =
                    "#000000";


                /* =================================================
                   EMULATOR GAME ID
                   ================================================= */

                window.EJS_gameID =
                    "obvyris-" +
                    (gameID || "game");

                console.log(
                    "[OBVYRIS EMULATOR] EJS_gameID:",
                    window.EJS_gameID
                );


                /* =================================================
                   GAME START
                   ================================================= */

                window.EJS_onGameStart =
                    function(){

                        console.log(
                            "[OBVYRIS EMULATOR] GAME STARTED"
                        );

                        loading.classList.add(
                            "hidden"
                        );

                        status.classList.add(
                            "hidden"
                        );

                        resolve();

                    };


                /* =================================================
                   LOAD
                   ================================================= */

                window.EJS_onLoad =
                    function(){

                        console.log(
                            "[OBVYRIS EMULATOR] EmulatorJS loaded"
                        );

                    };


                /* =================================================
                   SAVE
                   ================================================= */

                window.EJS_onSaveState =
                    function(){

                        console.log(
                            "[OBVYRIS EMULATOR] Save state"
                        );

                    };


                /* =================================================
                   LOAD STATE
                   ================================================= */

                window.EJS_onLoadState =
                    function(){

                        console.log(
                            "[OBVYRIS EMULATOR] Load state"
                        );

                    };


                /* =================================================
                   LOAD SCRIPT
                   ================================================= */

                setLoading(
                    "Loading EmulatorJS..."
                );

                const script =
                    document.createElement(
                        "script"
                    );

                script.src =
                    "https://cdn.emulatorjs.org/stable/data/loader.js";

                script.async =
                    true;

                script.onload =
                    function(){

                        console.log(
                            "[OBVYRIS EMULATOR] EmulatorJS loader loaded"
                        );

                        setLoading(
                            "Starting " +
                            requestedCore.toUpperCase() +
                            "..."
                        );

                        let attempts =
                            0;

                        const maxAttempts =
                            200;

                        const checkCanvas =
                            setInterval(
                                function(){

                                    attempts++;

                                    const canvas =
                                        document.querySelector(
                                            "#game canvas"
                                        );

                                    if(canvas){

                                        clearInterval(
                                            checkCanvas
                                        );

                                        console.log(
                                            "[OBVYRIS EMULATOR] Canvas detected"
                                        );

                                        return;

                                    }

                                    if(
                                        attempts >=
                                        maxAttempts
                                    ){

                                        clearInterval(
                                            checkCanvas
                                        );

                                        console.warn(
                                            "[OBVYRIS EMULATOR] Canvas not detected"
                                        );

                                    }

                                },
                                100
                            );

                    };


                script.onerror =
                    function(){

                        reject(
                            new Error(
                                "EmulatorJS loader could not be loaded."
                            )
                        );

                    };


                document.head.appendChild(
                    script
                );

            }catch(error){

                reject(
                    error
                );

            }

        }
    );

}


/* =========================================================
   MAIN
   ========================================================= */

async function main(){

    try{

        console.log(
            "[OBVYRIS EMULATOR] Starting game:",
            gameID
        );

        const blobURL =
            await downloadROM();

        await startEmulator(
            blobURL
        );

        console.log(
            "[OBVYRIS EMULATOR]",
            title,
            "running"
        );

    }catch(error){

        console.error(
            "[OBVYRIS EMULATOR] FATAL:",
            error
        );

        fail(
            error &&
            error.message
                ? error.message
                : String(error)
        );

    }

}


/* =========================================================
   GLOBAL ERRORS
   ========================================================= */

window.addEventListener(
    "error",
    function(event){

        console.error(
            "[OBVYRIS EMULATOR] Window error:",
            event.error ||
            event.message
        );

    }
);

window.addEventListener(
    "unhandledrejection",
    function(event){

        console.error(
            "[OBVYRIS EMULATOR] Promise error:",
            event.reason
        );

    }
);


/* =========================================================
   =========================================================
   GAME CHAT ENGINE
   =========================================================
   ========================================================= */

/* Same backend used by Chat Obvyris. */

const CHAT_API =
    "https://script.google.com/macros/s/AKfycbzin84qDcZ9L1q4pTBtHZGKJSTDcZ_wnmgWmnmgPgf1jrc1nRprzbEBixKMSHcdkxiZBg/exec";


/* =========================================================
   CHAT STATE
   ========================================================= */

let gameChatOpen =
    false;

let gameChatRefreshTimer =
    null;

let gameChatLastHash =
    "";

let gameChatLastCount =
    0;

let gameChatSending =
    false;


/* =========================================================
   CHAT STATION
   ========================================================= */

/*
 * IMPORTANT:
 *
 * The chat room now comes from chatStation.
 *
 * URL:
 *
 * ?gameid=zelda
 *
 * becomes:
 *
 * game-zelda
 *
 * But:
 *
 * ?gameid=zelda&station=custom-room
 *
 * becomes:
 *
 * custom-room
 */

const GAME_CHAT_STATION =
    chatStation;

const GAME_CHAT_NAME =
    title;


console.log(
    "[OBVYRIS CHAT] Station:",
    GAME_CHAT_STATION
);

console.log(
    "[OBVYRIS CHAT] Game ID:",
    gameID
);

console.log(
    "[OBVYRIS CHAT] Game:",
    GAME_CHAT_NAME
);


/* =========================================================
   CHAT DOM
   ========================================================= */

const gameChat =
    document.getElementById(
        "gameChat"
    );

const gameChatButton =
    document.getElementById(
        "gameChatButton"
    );

const gameChatMessages =
    document.getElementById(
        "gameChatMessages"
    );

const gameChatRoom =
    document.getElementById(
        "gameChatRoom"
    );

const gameChatNameInput =
    document.getElementById(
        "gameChatNameInput"
    );

const gameChatMessageInput =
    document.getElementById(
        "gameChatMessageInput"
    );

const gameChatUnread =
    document.getElementById(
        "gameChatUnread"
    );


/* =========================================================
   CHAT ROOM LABEL
   ========================================================= */

if(chatStation){

    gameChatRoom.textContent =
        GAME_CHAT_NAME;

}else{

    gameChatRoom.textContent =
        "No chat room";

}


/* =========================================================
   TOGGLE CHAT
   ========================================================= */

function toggleGameChat(){

    gameChatOpen =
        !gameChatOpen;

    if(gameChatOpen){

        openGameChat();

    }else{

        closeGameChat();

    }

}


/* =========================================================
   OPEN CHAT
   ========================================================= */

function openGameChat(){

    if(!chatStation){

        console.error(
            "[OBVYRIS EMULATOR] No chat station available."
        );

        return;

    }

    console.log(
        "[OBVYRIS EMULATOR] Opening chat:",
        chatStation
    );

    gameChatOpen =
        true;

    gameChat.classList.add(
        "open"
    );

    gameChatButton.classList.add(
        "chat-open"
    );

    gameChatUnread.style.display =
        "none";

    gameChatUnread.textContent =
        "0";

    loadGameChat();

    clearInterval(
        gameChatRefreshTimer
    );

    gameChatRefreshTimer =
        setInterval(
            loadGameChat,
            2500
        );

    setTimeout(
        function(){

            gameChatMessageInput.focus();

        },
        100
    );

}


/* =========================================================
   CLOSE CHAT
   ========================================================= */

function closeGameChat(){

    gameChatOpen =
        false;

    gameChat.classList.remove(
        "open"
    );

    gameChatButton.classList.remove(
        "chat-open"
    );

    clearInterval(
        gameChatRefreshTimer
    );

    gameChatRefreshTimer =
        null;

}


/* =========================================================
   LOAD CHAT
   ========================================================= */

async function loadGameChat(){

    if(!GAME_CHAT_STATION){

        return;

    }

    try{

        const response =
            await fetch(
                CHAT_API,
                {
                    method:"POST",

                    body:
                        JSON.stringify({

                            action:
                                "get",

                            station:
                                GAME_CHAT_STATION

                        })

                }
            );

        if(!response.ok){

            throw new Error(
                "Chat HTTP " +
                response.status
            );

        }

        const data =
            await response.json();

        if(!Array.isArray(data)){

            return;

        }

        const hash =
            JSON.stringify(
                data
            );


        /* Nothing changed. */

        if(
            hash ===
            gameChatLastHash
        ){

            return;

        }


        /* New messages while closed. */

        if(
            !gameChatOpen &&
            gameChatLastCount > 0 &&
            data.length >
            gameChatLastCount
        ){

            const difference =
                data.length -
                gameChatLastCount;

            gameChatUnread.textContent =
                difference > 9
                    ? "9+"
                    : difference;

            gameChatUnread.style.display =
                "flex";

        }


        gameChatLastHash =
            hash;

        gameChatLastCount =
            data.length;

        renderGameChat(
            data
        );

    }catch(error){

        console.warn(
            "[OBVYRIS CHAT] Load failed:",
            error
        );

    }

}


/* =========================================================
   RENDER CHAT
   ========================================================= */

function renderGameChat(data){

    if(!data.length){

        gameChatMessages.innerHTML = `

            <div class="game-chat-message game-chat-system">

                No messages yet.
                Start the conversation.

            </div>

        `;

        return;

    }


    const oldScroll =
        gameChatMessages.scrollTop;

    const wasNearBottom =
        gameChatMessages.scrollHeight -
        gameChatMessages.scrollTop -
        gameChatMessages.clientHeight <
        80;


    let html =
        "";


    for(
        let i = 0;
        i < data.length;
        i++
    ){

        const m =
            data[i];

        if(!m){

            continue;

        }


        const name =
            escapeHTML(
                m.name ||
                "Anon"
            );

        const message =
            escapeHTML(
                m.message ||
                ""
            );


        /* =================================================
           SYSTEM MESSAGE
           ================================================= */

        if(
            name.toLowerCase() ===
            "system"
        ){

            html += `

                <div class="game-chat-message game-chat-system">

                    ${message}

                </div>

            `;

            continue;

        }


        /* =================================================
           GIF
           ================================================= */

        if(
            m.message &&
            m.message.startsWith(
                "[GIF]"
            )
        ){

            const gifURL =
                escapeAttribute(
                    m.message.replace(
                        "[GIF]",
                        ""
                    )
                );

            html += `

                <div class="game-chat-message">

                    <span class="game-chat-name">

                        ${name}:

                    </span>

                    <img
                        src="${gifURL}"
                        style="
                            max-width:220px;
                            max-height:160px;
                            display:block;
                            margin-top:5px;
                            border-radius:8px;
                        "
                    >

                </div>

            `;

        }else{

            html += `

                <div class="game-chat-message">

                    <span class="game-chat-name">

                        ${name}:

                    </span>

                    ${message}

                </div>

            `;

        }

    }


    gameChatMessages.innerHTML =
        html;


    /* =================================================
       SCROLL
       ================================================= */

    if(wasNearBottom){

        gameChatMessages.scrollTop =
            gameChatMessages.scrollHeight;

    }else{

        gameChatMessages.scrollTop =
            oldScroll;

    }

}


/* =========================================================
   SEND CHAT
   ========================================================= */

async function sendGameChat(){

    if(gameChatSending){

        return;

    }


    if(!GAME_CHAT_STATION){

        console.error(
            "[OBVYRIS CHAT] No station available."
        );

        return;

    }


    const name =
        gameChatNameInput.value.trim() ||
        "Anon";

    const message =
        gameChatMessageInput.value.trim();


    if(!message){

        return;

    }


    gameChatSending =
        true;


    const sendButton =
        document.getElementById(
            "gameChatSend"
        );

    sendButton.disabled =
        true;


    try{

        await fetch(
            CHAT_API,
            {

                method:"POST",

                body:
                    JSON.stringify({

                        action:
                            "send",

                        station:
                            GAME_CHAT_STATION,

                        stationName:
                            GAME_CHAT_NAME,

                        name:
                            name,

                        message:
                            message

                    })

            }
        );


        gameChatMessageInput.value =
            "";


        await loadGameChat();


        gameChatMessageInput.focus();


    }catch(error){

        console.error(
            "[OBVYRIS CHAT] Send failed:",
            error
        );

    }


    setTimeout(
        function(){

            gameChatSending =
                false;

            sendButton.disabled =
                false;

        },
        700
    );

}


/* =========================================================
   ENTER TO SEND
   ========================================================= */

gameChatMessageInput.addEventListener(
    "keydown",
    function(event){

        if(
            event.key ===
            "Enter"
        ){

            event.preventDefault();

            sendGameChat();

        }

    }
);


/* =========================================================
   HTML ESCAPING
   ========================================================= */

function escapeHTML(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        );

}
