<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AQL Inspection Engine</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f172a;
  color: white;
}

.container {
  display: grid;
  grid-template-columns: 260px 1fr;
  height: 100vh;
}

.sidebar {
  background: #111827;
  padding: 12px;
}

.sidebar button {
  width: 100%;
  padding: 10px;
  margin-bottom: 8px;
  background: #334155;
  color: white;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.content {
  padding: 20px;
  overflow-y: auto;
}

.card {
  background: #1e293b;
  padding: 16px;
  border-radius: 10px;
  margin-bottom: 12px;
}

.title {
  font-size: 20px;
  font-weight: bold;
}

.sub {
  font-size: 12px;
  color: #94a3b8;
}

input, select {
  width: 100%;
  padding: 10px;
  margin-top: 6px;
  margin-bottom: 10px;
  background: #0f172a;
  border: 1px solid #334155;
  color: white;
  border-radius: 6px;
}

.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

button.action {
  width: 100%;
  padding: 12px;
  background: #22c55e;
  border: none;
  border-radius: 6px;
  font-weight: bold;
  cursor: pointer;
}

button.action:disabled {
  background: #14532d;
  cursor: not-allowed;
}

.pass {
  background: #16a34a;
  padding: 12px;
  border-radius: 8px;
}

.fail {
  background: #ef4444;
  padding: 12px;
  border-radius: 8px;
}

.warn {
  background: #f59e0b;
  padding: 12px;
  border-radius: 8px;
  color: black;
}

.small {
  font-size: 12px;
  color: #94a3b8;
}

.history {
  font-size: 12px;
  margin-top: 8px;
}

.history-item {
  padding: 8px;
  border: 1px solid #334155;
  margin-top: 6px;
  border-radius: 6px;
}

.debug {
  font-size: 11px;
  background: #0f172a;
  border: 1px dashed #334155;
  padding: 8px;
  margin-top: 10px;
  color: #94a3b8;
}
</style>
</head>

<body>

<div class="container">

<div class="sidebar">
  <button>Home</button>
  <button>Inspection</button>
  <button>Dashboard</button>
  <button>Reports</button>
</div>

<div class="content">

  <div class="card">
    <div class="title">AQL Inspection Engine</div>
    <div class="sub">Stable production frontend (fixed rule matching + validation)</div>
  </div>

  <div class="card">

    <label>Inspector</label>
    <input id="inspector">

    <div class="row">
      <div>
        <label>Brand ID</label>
        <input id="brand">
      </div>
      <div>
        <label>Merchant ID</label>
        <input id="merchant">
      </div>
    </div>

    <label>Product ID</label>
    <input id="product">

    <div class="row">
      <div>
        <label>AQL Level</label>
        <select id="level">
          <option value="I">Level I</option>
          <option value="II" selected>Level II</option>
          <option value="III">Level III</option>
        </select>
      </div>

      <div>
        <label>AQL Value</label>
        <input id="aql" value="2.5">
      </div>
    </div>

    <label>Lot Size</label>
    <input id="lot" type="number">

    <div class="row">
      <div>
        <label>Critical</label>
        <input id="critical" type="number" value="0">
      </div>
      <div>
        <label>Major</label>
        <input id="major" type="number" value="0">
      </div>
    </div>

    <label>Minor</label>
    <input id="minor" type="number" value="0">

    <button class="action" id="runBtn" onclick="run()">RUN INSPECTION</button>

    <div id="result"></div>
    <div id="debug"></div>

  </div>

  <div class="card">
    <div class="title">History</div>
    <div id="history"></div>
  </div>

</div>
</div>

<script>
const API = "YOUR_APPS_SCRIPT_URL";

let history = JSON.parse(localStorage.getItem("aql_history") || "[]");

function val(id){ return document.getElementById(id).value; }

function normLevel(v){
  return String(v).toUpperCase().replace("LEVEL","").replace(/\s+/g,"").trim();
}

function show(el, html){ document.getElementById(el).innerHTML = html; }

function saveHistory(item){
  history.unshift(item);
  history = history.slice(0, 10);
  localStorage.setItem("aql_history", JSON.stringify(history));
}

function renderHistory(){
  show("history",
    history.map(h =>
      `<div class="history-item">
        <b>${h.decision}</b> - ${h.id}<br>
        <span class="small">${h.time}</span>
      </div>`
    ).join("")
  );
}

async function run(){

  const btn = document.getElementById("runBtn");
  btn.disabled = true;
  btn.innerText = "Running...";

  const payload = {
    action: "createInspection",
    inspector: val("inspector"),
    brand_id: val("brand"),
    merchant_id: val("merchant"),
    product_id: val("product"),
    inspection_level: normLevel(val("level")),
    aql_value: parseFloat(val("aql")) || 0,
    lot_size: parseInt(val("lot")) || 0,
    critical_count: parseInt(val("critical")) || 0,
    major_count: parseInt(val("major")) || 0,
    minor_count: parseInt(val("minor")) || 0
  };

  try {

    const res = await fetch(API, {
      method: "POST",
      body: JSON.stringify(payload)
    });

    const data = await res.json();

    if(!data.aql_result){
      show("result", `<div class="warn">API ERROR: ${JSON.stringify(data)}</div>`);
      return;
    }

    const r = data.aql_result;

    show("result", `
      <div class="${r.decision === "PASS" ? "pass" : "fail"}">
        <b>${r.decision}</b><br>
        ID: ${data.inspection_id}<br>
        Sample: ${r.sampleSize}<br>
        Defects: ${r.defects}<br>
        Accept: ${r.accept}<br>
        Reject: ${r.reject}<br>
        <div class="small">${r.reason}</div>
      </div>
    `);

    show("debug", `
      <div class="debug">
        Level Sent: ${payload.inspection_level}<br>
        AQL Sent: ${payload.aql_value}<br>
        Lot: ${payload.lot_size}<br>
      </div>
    `);

    saveHistory({
      id: data.inspection_id,
      decision: r.decision,
      time: new Date().toLocaleString()
    });

    renderHistory();

  } catch(err){
    show("result", `<div class="fail">ERROR: ${err.message}</div>`);
  }

  btn.disabled = false;
  btn.innerText = "RUN INSPECTION";
}

renderHistory();
</script>

</body>
</html>
