<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AQL Inspection Engine</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f172a;
  color: white;
}

.container {
  display: grid;
  grid-template-columns: 240px 1fr;
  height: 100vh;
}

.sidebar {
  background: #111827;
  padding: 10px;
}

.sidebar button {
  width: 100%;
  margin-bottom: 10px;
  padding: 10px;
  background: #334155;
  color: white;
  border: 0;
  border-radius: 6px;
  cursor: pointer;
}

.content {
  padding: 20px;
  overflow-y: auto;
}

.card {
  background: #1e293b;
  padding: 15px;
  margin-bottom: 15px;
  border-radius: 10px;
}

input, select {
  width: 100%;
  padding: 10px;
  margin: 6px 0;
  background: #0f172a;
  border: 1px solid #334155;
  color: white;
  border-radius: 6px;
}

.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

button.run {
  width: 100%;
  padding: 12px;
  background: #22c55e;
  border: none;
  font-weight: bold;
  cursor: pointer;
  border-radius: 6px;
}

.pass { background: #16a34a; padding: 10px; border-radius: 8px; }
.fail { background: #ef4444; padding: 10px; border-radius: 8px; }

.small { font-size: 12px; color: #94a3b8; }
</style>
</head>

<body>

<div class="container">

<div class="sidebar">
  <button>Home</button>
  <button>Inspection</button>
  <button>Dashboard</button>
  <button>Reports</button>
</div>

<div class="content">

  <div class="card">
    <h2>AQL Inspection Engine</h2>
    <div class="small">Production-safe frontend (JSON guarded + fallback safe parsing)</div>
  </div>

  <div class="card">

    <label>Inspector</label>
    <input id="inspector">

    <div class="row">
      <div>
        <label>Brand ID</label>
        <input id="brand">
      </div>
      <div>
        <label>Merchant ID</label>
        <input id="merchant">
      </div>
    </div>

    <label>Product ID</label>
    <input id="product">

    <div class="row">
      <div>
        <label>AQL Level</label>
        <select id="level">
          <option>I</option>
          <option selected>II</option>
          <option>III</option>
        </select>
      </div>

      <div>
        <label>AQL Value</label>
        <input id="aql" value="2.5">
      </div>
    </div>

    <label>Lot Size</label>
    <input id="lot" type="number">

    <div class="row">
      <div><label>Critical</label><input id="c" type="number" value="0"></div>
      <div><label>Major</label><input id="m" type="number" value="0"></div>
    </div>

    <label>Minor</label>
    <input id="mi" type="number" value="0">

    <button class="run" onclick="run()">RUN INSPECTION</button>

  </div>

  <div class="card">
    <h3>Result</h3>
    <div id="out"></div>
  </div>

</div>
</div>

<script>

/* ================= SAFE API CALL ================= */
async function api(action, payload) {

  const url = "YOUR_SCRIPT_URL_HERE"; // IMPORTANT

  const res = await fetch(url + "?action=" + action, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });

  const text = await res.text();

  // 🔥 HANDLE HTML ERROR (your current issue)
  if (text.trim().startsWith("<")) {
    throw new Error("Server returned HTML instead of JSON (Apps Script error)");
  }

  try {
    return JSON.parse(text);
  } catch (e) {
    throw new Error("Invalid JSON response: " + text);
  }
}

/* ================= RUN INSPECTION ================= */
async function run() {

  const out = document.getElementById("out");
  out.innerHTML = "Running...";

  const payload = {
    inspector: val("inspector"),
    brand_id: val("brand"),
    merchant_id: val("merchant"),
    product_id: val("product"),
    inspection_level: val("level"),
    aql_value: parseFloat(val("aql")),
    lot_size: parseInt(val("lot")),
    critical_count: parseInt(val("c")),
    major_count: parseInt(val("m")),
    minor_count: parseInt(val("mi"))
  };

  try {

    const data = await api("createInspection", payload);

    const r = data.aql_result;

    out.innerHTML = `
      <div class="${r.decision === "PASS" ? "pass" : "fail"}">
        <b>${r.decision}</b><br>
        Sample: ${r.sampleSize}<br>
        Defects: ${r.defects}<br>
        Accept: ${r.accept}<br>
        Reject: ${r.reject}<br>
        <div class="small">${r.reason}</div>
      </div>
    `;

  } catch (err) {
    out.innerHTML = `<div class="fail">${err.message}</div>`;
  }
}

/* ================= HELPERS ================= */
function val(id) {
  return document.getElementById(id).value;
}

</script>

</body>
</html>
