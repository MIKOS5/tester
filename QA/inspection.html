<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AQL Inspection Engine</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0f172a;
  color: white;
}

.container {
  display: grid;
  grid-template-columns: 240px 1fr;
  height: 100vh;
}

.sidebar {
  background: #111827;
  padding: 10px;
}

.sidebar button {
  width: 100%;
  margin-bottom: 10px;
  padding: 10px;
  background: #334155;
  border: none;
  color: white;
  border-radius: 6px;
}

.content {
  padding: 20px;
  overflow-y: auto;
}

.card {
  background: #1e293b;
  padding: 16px;
  border-radius: 10px;
  margin-bottom: 12px;
}

input, select {
  width: 100%;
  padding: 10px;
  margin: 6px 0;
  background: #0f172a;
  border: 1px solid #334155;
  color: white;
  border-radius: 6px;
}

.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

button.run {
  width: 100%;
  padding: 12px;
  background: #22c55e;
  border: none;
  font-weight: bold;
  border-radius: 6px;
  cursor: pointer;
}

.pass { background: #16a34a; padding: 10px; border-radius: 8px; }
.fail { background: #ef4444; padding: 10px; border-radius: 8px; }
.warn { background: #f59e0b; padding: 10px; border-radius: 8px; color: black; }

.small { font-size: 12px; color: #94a3b8; }
</style>
</head>

<body>

<div class="container">

<div class="sidebar">
  <button>Home</button>
  <button>Inspection</button>
  <button>Dashboard</button>
  <button>Reports</button>
</div>

<div class="content">

  <div class="card">
    <h2>AQL Engine</h2>
    <div class="small">Safe frontend (HTML-proof API parser)</div>
  </div>

  <div class="card">

    <input id="inspector" placeholder="Inspector">

    <div class="row">
      <input id="brand" placeholder="Brand ID">
      <input id="merchant" placeholder="Merchant ID">
    </div>

    <input id="product" placeholder="Product ID">

    <div class="row">
      <select id="level">
        <option value="I">Level I</option>
        <option value="II" selected>Level II</option>
        <option value="III">Level III</option>
      </select>

      <input id="aql" value="2.5">
    </div>

    <input id="lot" type="number" placeholder="Lot Size">

    <div class="row">
      <input id="critical" type="number" value="0">
      <input id="major" type="number" value="0">
    </div>

    <input id="minor" type="number" value="0">

    <button class="run" onclick="run()">RUN INSPECTION</button>

  </div>

  <div class="card">
    <div id="result"></div>
  </div>

</div>
</div>

<script>

const API = "YOUR_APPS_SCRIPT_URL_HERE";

/* ================= SAFE FETCH ================= */
async function safeFetch(payload) {

  const res = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "text/plain" },
    body: JSON.stringify(payload)
  });

  const text = await res.text();

  // 🔥 HARD GUARD: prevents "<html>" crash
  if (!text || text.trim().startsWith("<")) {
    console.error("BAD RESPONSE:", text);
    throw new Error("Backend returned HTML (deployment or permission issue)");
  }

  try {
    return JSON.parse(text);
  } catch (e) {
    console.error("INVALID JSON:", text);
    throw new Error("Invalid JSON response from backend");
  }
}

/* ================= RUN ================= */
async function run() {

  const out = document.getElementById("result");
  out.innerHTML = "Running...";

  const payload = {
    action: "createInspection",
    inspector: val("inspector"),
    brand_id: val("brand"),
    merchant_id: val("merchant"),
    product_id: val("product"),
    inspection_level: norm(val("level")),
    aql_value: parseFloat(val("aql")) || 0,
    lot_size: parseInt(val("lot")) || 0,
    critical_count: parseInt(val("critical")) || 0,
    major_count: parseInt(val("major")) || 0,
    minor_count: parseInt(val("minor")) || 0
  };

  try {

    const data = await safeFetch(payload);

    if (!data.aql_result) {
      out.innerHTML = `<div class="warn">${JSON.stringify(data)}</div>`;
      return;
    }

    const r = data.aql_result;

    out.innerHTML = `
      <div class="${r.decision === "PASS" ? "pass" : "fail"}">
        <b>${r.decision}</b><br>
        Sample: ${r.sampleSize}<br>
        Defects: ${r.defects}<br>
        Accept: ${r.accept}<br>
        Reject: ${r.reject}<br>
        <div class="small">${r.reason}</div>
      </div>
    `;

  } catch (err) {
    out.innerHTML = `<div class="fail">${err.message}</div>`;
  }
}

/* ================= HELPERS ================= */
function val(id){ return document.getElementById(id).value; }

function norm(v){
  return String(v).toUpperCase().replace("LEVEL","").replace(/\s+/g,"").trim();
}

</script>

</body>
</html>
