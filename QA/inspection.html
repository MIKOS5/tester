<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>QA AQL Inspection</title>

<style>
/* ===================== BASE ===================== */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: #fff;
}

header {
  background: #1e293b;
  padding: 16px;
  font-size: 18px;
  font-weight: bold;
  position: sticky;
  top: 0;
}

/* ===================== LAYOUT ===================== */
.container {
  display: grid;
  grid-template-columns: 260px 1fr;
  height: 100vh;
}

.sidebar {
  background: #111827;
  padding: 10px;
}

.sidebar button {
  width: 100%;
  padding: 10px;
  margin-bottom: 10px;
  background: #334155;
  color: white;
  border: none;
  cursor: pointer;
  border-radius: 6px;
}

.sidebar button:hover {
  background: #475569;
}

.content {
  padding: 20px;
  overflow-y: auto;
}

/* ===================== CARDS ===================== */
.card {
  background: #1e293b;
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 12px;
}

.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

/* ===================== INPUTS ===================== */
input, select {
  width: 100%;
  padding: 10px;
  margin-top: 6px;
  margin-bottom: 10px;
  background: #0f172a;
  color: white;
  border: 1px solid #334155;
  border-radius: 6px;
}

label {
  font-size: 12px;
  color: #94a3b8;
}

/* ===================== BUTTONS ===================== */
button.action {
  width: 100%;
  padding: 12px;
  background: #22c55e;
  border: none;
  color: white;
  font-weight: bold;
  border-radius: 6px;
  cursor: pointer;
}

button.action:hover {
  background: #16a34a;
}

button.secondary {
  background: #334155;
  margin-top: 10px;
}

/* ===================== RESULT ===================== */
.pass {
  background: #16a34a;
  padding: 12px;
  border-radius: 8px;
}

.fail {
  background: #ef4444;
  padding: 12px;
  border-radius: 8px;
}

.small {
  font-size: 12px;
  color: #94a3b8;
}

.loading {
  color: #facc15;
}
</style>
</head>

<body>

<header>
QA AQL Inspection System — Production Mode
</header>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">
  <button onclick="loadInspection()">New Inspection</button>
  <button onclick="loadDashboard()">Dashboard</button>
  <button onclick="loadData()">Data View</button>
</div>

<!-- MAIN -->
<div class="content" id="app"></div>

</div>

<script>

const API_BASE =
"https://script.google.com/macros/s/AKfycbzcjIipaNkV_TbzV7XswF8J-JvO6PJX6cDkV3rk-I1INVMF71ZYk41OyQXJtoXgUGHziw/exec";

/* ===================== INSPECTION PAGE ===================== */
function loadInspection() {
  document.getElementById("app").innerHTML = `
    <div class="card">
      <h2>New Inspection</h2>
      <div class="small">Fill out inspection details and run AQL engine</div>
    </div>

    <div class="card">
      <label>Inspector</label>
      <input id="inspector" placeholder="Name">

      <div class="grid">
        <div>
          <label>Brand ID</label>
          <input id="brand">
        </div>
        <div>
          <label>Merchant ID</label>
          <input id="merchant">
        </div>
      </div>

      <label>Product ID</label>
      <input id="product">

      <div class="grid">
        <div>
          <label>AQL Level</label>
          <select id="inspectionLevel">
            <option value="I">Level I</option>
            <option value="II" selected>Level II</option>
            <option value="III">Level III</option>
          </select>
        </div>

        <div>
          <label>AQL Value</label>
          <input id="aqlValue" placeholder="2.5">
        </div>
      </div>
    </div>

    <div class="card">
      <label>Lot Size</label>
      <input id="lot" type="number">

      <div class="grid">
        <div>
          <label>Critical</label>
          <input id="critical" type="number" value="0">
        </div>
        <div>
          <label>Major</label>
          <input id="major" type="number" value="0">
        </div>
        <div>
          <label>Minor</label>
          <input id="minor" type="number" value="0">
        </div>
      </div>

      <button class="action" onclick="submitInspection()">
        RUN AQL INSPECTION
      </button>

      <div id="result"></div>
    </div>
  `;
}

/* ===================== SUBMIT ===================== */
async function submitInspection() {

  const resultBox = document.getElementById("result");

  resultBox.innerHTML = `<div class="loading">Processing AQL Engine...</div>`;

  try {

    const payload = {
      inspector: val("inspector"),
      brand_id: val("brand"),
      merchant_id: val("merchant"),
      product_id: val("product"),

      inspection_level: val("inspectionLevel"),
      aql_value: parseFloat(val("aqlValue")) || 0,

      lot_size: parseInt(val("lot")) || 0,
      critical_count: parseInt(val("critical")) || 0,
      major_count: parseInt(val("major")) || 0,
      minor_count: parseInt(val("minor")) || 0
    };

    const res = await fetch(API_BASE + "?action=createInspection", {
      method: "POST",
      body: JSON.stringify(payload)
    });

    const data = await res.json();
    const r = data.aql_result;

    resultBox.innerHTML = `
      <div class="${r.decision === 'PASS' ? 'pass' : 'fail'}">

        <h2>${r.decision}</h2>

        <p><b>Inspection ID:</b> ${data.inspection_id}</p>
        <p><b>Sample Size:</b> ${r.sampleSize}</p>
        <p><b>Total Defects:</b> ${r.defects}</p>
        <p><b>Accept Limit:</b> ${r.accept}</p>
        <p><b>Reject Limit:</b> ${r.reject}</p>

        <p class="small">${r.reason}</p>
      </div>
    `;

  } catch (err) {
    resultBox.innerHTML = `
      <div class="fail">
        ERROR: ${err.message}
      </div>
    `;
  }
}

/* ===================== HELPERS ===================== */
function val(id) {
  return document.getElementById(id).value;
}

/* ===================== DASHBOARD ===================== */
function loadDashboard() {
  document.getElementById("app").innerHTML = `
    <div class="card">
      <h2>Dashboard</h2>
      <p class="small">Next step: connect getDashboard() API + charts</p>
    </div>
  `;
}

/* ===================== DATA ===================== */
function loadData() {
  document.getElementById("app").innerHTML = `
    <div class="card">
      <h2>Data View</h2>
      <button class="action" onclick="loadBrands()">Load Brands</button>
      <div id="data"></div>
    </div>
  `;
}

async function loadBrands() {
  const res = await fetch(API_BASE + "?action=getBrands");
  const data = await res.json();

  let html = "<div class='card'><h3>Brands</h3>";

  data.forEach(b => {
    html += `<div class="card">${b.brand_id} — ${b.brand_name}</div>`;
  });

  html += "</div>";

  document.getElementById("data").innerHTML = html;
}

/* ===================== INIT ===================== */
loadInspection();

</script>

</body>
</html>
