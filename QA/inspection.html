<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AQL Inspection Engine</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: #fff;
}

.container {
  display: grid;
  grid-template-columns: 240px 1fr;
  height: 100vh;
}

.sidebar {
  background: #111827;
  padding: 12px;
}

.sidebar button {
  width: 100%;
  padding: 10px;
  margin-bottom: 8px;
  background: #334155;
  border: 0;
  color: #fff;
  border-radius: 6px;
  cursor: pointer;
}

.content {
  padding: 20px;
  overflow-y: auto;
}

.card {
  background: #1e293b;
  padding: 16px;
  border-radius: 10px;
  margin-bottom: 12px;
}

h1 {
  font-size: 20px;
  margin: 0;
}

small { color: #94a3b8; }

input, select {
  width: 100%;
  padding: 10px;
  margin-top: 6px;
  margin-bottom: 10px;
  background: #0f172a;
  border: 1px solid #334155;
  color: #fff;
  border-radius: 6px;
}

.row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

button.run {
  width: 100%;
  padding: 12px;
  background: #22c55e;
  border: 0;
  border-radius: 6px;
  font-weight: bold;
  cursor: pointer;
}

.pass { background: #16a34a; padding: 12px; border-radius: 8px; }
.fail { background: #ef4444; padding: 12px; border-radius: 8px; }
.warn { background: #f59e0b; padding: 12px; border-radius: 8px; color: #000; }

.debug {
  font-size: 12px;
  color: #94a3b8;
  border-top: 1px solid #334155;
  margin-top: 10px;
  padding-top: 10px;
}

.history {
  font-size: 12px;
}
</style>
</head>

<body>

<div class="container">

<div class="sidebar">
  <button>Home</button>
  <button>Inspection</button>
  <button>Dashboard</button>
  <button>Reports</button>
</div>

<div class="content">

  <div class="card">
    <h1>AQL Inspection Engine</h1>
    <small>Stable production-safe API frontend</small>
  </div>

  <div class="card">

    <label>Inspector</label>
    <input id="inspector">

    <div class="row">
      <div>
        <label>Brand ID</label>
        <input id="brand">
      </div>
      <div>
        <label>Merchant ID</label>
        <input id="merchant">
      </div>
    </div>

    <label>Product ID</label>
    <input id="product">

    <div class="row">
      <div>
        <label>Level</label>
        <select id="level">
          <option value="I">I</option>
          <option value="II" selected>II</option>
          <option value="III">III</option>
        </select>
      </div>
      <div>
        <label>AQL</label>
        <input id="aql" value="2.5">
      </div>
    </div>

    <label>Lot Size</label>
    <input id="lot" type="number">

    <div class="row">
      <div>
        <label>Critical</label>
        <input id="critical" type="number" value="0">
      </div>
      <div>
        <label>Major</label>
        <input id="major" type="number" value="0">
      </div>
    </div>

    <label>Minor</label>
    <input id="minor" type="number" value="0">

    <button class="run" onclick="run()">RUN INSPECTION</button>

    <div id="result"></div>
    <div id="debug"></div>

  </div>

</div>
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbzcjIipaNkV_TbzV7XswF8J-JvO6PJX6cDkV3rk-I1INVMF71ZYk41OyQXJtoXgUGHziw/exec";

function v(id){ return document.getElementById(id).value; }

function safeParse(text){
  try { return JSON.parse(text); }
  catch { return null; }
}

async function api(payload){

  const res = await fetch(API_URL, {
    method: "POST",
    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },
    body: JSON.stringify(payload)
  });

  const text = await res.text();

  // detect HTML error response
  if(text.trim().startsWith("<")){
    throw new Error("Server returned HTML (Apps Script error)");
  }

  const json = safeParse(text);

  if(!json){
    throw new Error("Invalid JSON response: " + text.slice(0,100));
  }

  return json;
}

async function run(){

  const payload = {
    action: "createInspection",
    inspector: v("inspector"),
    brand_id: v("brand"),
    merchant_id: v("merchant"),
    product_id: v("product"),
    inspection_level: v("level"),
    aql_value: parseFloat(v("aql")) || 0,
    lot_size: parseInt(v("lot")) || 0,
    critical_count: parseInt(v("critical")) || 0,
    major_count: parseInt(v("major")) || 0,
    minor_count: parseInt(v("minor")) || 0
  };

  document.getElementById("result").innerHTML =
    `<div class="warn">Running...</div>`;

  try {

    const data = await api(payload);

    if(!data.aql_result){
      document.getElementById("result").innerHTML =
        `<div class="warn">API ERROR: ${JSON.stringify(data)}</div>`;
      return;
    }

    const r = data.aql_result;

    document.getElementById("result").innerHTML = `
      <div class="${r.decision === "PASS" ? "pass" : "fail"}">
        <b>${r.decision}</b><br>
        ID: ${data.inspection_id}<br>
        Sample: ${r.sampleSize}<br>
        Defects: ${r.defects}<br>
        Accept: ${r.accept}<br>
        Reject: ${r.reject}<br>
        <small>${r.reason}</small>
      </div>
    `;

    document.getElementById("debug").innerHTML = `
      <div class="debug">
        Lot: ${payload.lot_size}<br>
        Level: ${payload.inspection_level}<br>
        AQL: ${payload.aql_value}
      </div>
    `;

  } catch(err){
    document.getElementById("result").innerHTML =
      `<div class="fail">${err.message}</div>`;
  }
}

</script>

</body>
</html>
