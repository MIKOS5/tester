<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>QA AQL Inspection</title>

  <link rel="stylesheet" href="css/style.css">

  <style>
    /* Page-specific enhancements */
    .page-title {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .subtitle {
      font-size: 12px;
      color: #94a3b8;
      margin-bottom: 15px;
    }

    .section-title {
      font-size: 14px;
      margin: 10px 0;
      color: #cbd5e1;
    }

    .result-box {
      margin-top: 15px;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
    }

    .badge.pass { background: #16a34a; }
    .badge.fail { background: #ef4444; }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .full {
      grid-column: 1 / -1;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <a href="QAhome.html"><button>Home</button></a>
    <a href="inspection.html"><button class="active">Inspection</button></a>
    <a href="dashboard.html"><button>Dashboard</button></a>
    <a href="reports.html"><button>Reports</button></a>

    <hr style="border:1px solid #334155; margin:10px 0;" />

    <a href="data.html"><button>Data</button></a>
    <a href="brands.html"><button>Brands</button></a>
    <a href="merchants.html"><button>Merchants</button></a>
    <a href="products.html"><button>Products</button></a>

    <hr style="border:1px solid #334155; margin:10px 0;" />

    <a href="settings.html"><button>Settings</button></a>
  </div>

  <!-- CONTENT -->
  <div class="content">

    <div class="card">
      <div class="page-title">AQL Inspection Engine</div>
      <div class="subtitle">Production-grade inspection workflow connected to Google Sheets API</div>
    </div>

    <!-- FORM -->
    <div class="card">

      <div class="section-title">Inspector Info</div>

      <label>Inspector Name</label>
      <input id="inspector" placeholder="John Doe">

      <div class="row">
        <div>
          <label>Brand ID</label>
          <input id="brand">
        </div>

        <div>
          <label>Merchant ID</label>
          <input id="merchant">
        </div>
      </div>

      <label>Product ID</label>
      <input id="product">

      <div class="section-title">Inspection Settings</div>

      <div class="row">
        <div>
          <label>AQL Level</label>
          <select id="inspectionLevel">
            <option value="I">Level I</option>
            <option value="II" selected>Level II</option>
            <option value="III">Level III</option>
          </select>
        </div>

        <div>
          <label>AQL Value</label>
          <input id="aqlValue" placeholder="2.5">
        </div>
      </div>

      <label>Lot Size</label>
      <input id="lot" type="number">

      <div class="section-title">Defect Counts</div>

      <div class="row">
        <div>
          <label>Critical</label>
          <input id="critical" type="number" value="0">
        </div>

        <div>
          <label>Major</label>
          <input id="major" type="number" value="0">
        </div>

        <div class="full">
          <label>Minor</label>
          <input id="minor" type="number" value="0">
        </div>
      </div>

      <button class="action" onclick="submitInspection()">
        RUN AQL INSPECTION
      </button>

      <div id="result" class="result-box"></div>

    </div>
  </div>
</div>

<script src="js/api.js"></script>

<script>
async function submitInspection() {
  const resultBox = document.getElementById("result");

  resultBox.innerHTML = `<div class="loading">Running AQL Engine...</div>`;

  try {
    const payload = {
      inspector: val("inspector"),
      brand_id: val("brand"),
      merchant_id: val("merchant"),
      product_id: val("product"),
      inspection_level: val("inspectionLevel"),
      aql_value: parseFloat(val("aqlValue")) || 0,
      lot_size: parseInt(val("lot")) || 0,
      critical_count: parseInt(val("critical")) || 0,
      major_count: parseInt(val("major")) || 0,
      minor_count: parseInt(val("minor")) || 0
    };

    const data = await api("createInspection", payload);
    const r = data.aql_result;

    resultBox.innerHTML = `
      <div class="${r.decision === 'PASS' ? 'pass' : 'fail'}">

        <div style="display:flex; justify-content:space-between; align-items:center;">
          <h2 style="margin:0;">${r.decision}</h2>
          <span class="badge ${r.decision.toLowerCase()}">${r.decision}</span>
        </div>

        <hr style="border:1px solid #334155; margin:10px 0;" />

        <p><b>Inspection ID:</b> ${data.inspection_id}</p>
        <p><b>Sample Size:</b> ${r.sampleSize}</p>
        <p><b>Total Defects:</b> ${r.defects}</p>
        <p><b>Accept Limit:</b> ${r.accept}</p>
        <p><b>Reject Limit:</b> ${r.reject}</p>

        <p class="small">${r.reason}</p>
      </div>
    `;

  } catch (err) {
    resultBox.innerHTML = `
      <div class="fail">
        <b>API ERROR</b><br>
        ${err.message}
      </div>
    `;
  }
}

function val(id) {
  return document.getElementById(id).value;
}
</script>

</body>
</html>
