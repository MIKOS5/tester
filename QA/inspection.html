<div class="card">
  <h2>Inspectors</h2>
  <p class="small">Manage inspection staff, activity, and assignments</p>

  <input
    id="searchInspector"
    placeholder="Search inspectors..."
    oninput="filterInspectors()"
    style="margin-top:10px;"
  />
</div>

<div class="card">

  <div class="table-wrap">
    <table id="inspectorsTable">
      <thead>
        <tr>
          <th>Name</th>
          <th>ID</th>
          <th>Brand</th>
          <th>Status</th>
          <th>Last Inspection</th>
          <th>Actions</th>
        </tr>
      </thead>

      <tbody id="inspectorsBody">
        <!-- filled by JS -->
      </tbody>
    </table>
  </div>

  <div id="emptyState" class="small" style="display:none; margin-top:10px;">
    No inspectors found.
  </div>

</div>
