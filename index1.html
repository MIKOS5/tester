<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Buggsie Baking Co.</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Google Font for handwritten feel -->
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Open Sans', sans-serif;
      background: #fdfdfd;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .logo-container {
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background-color: #40cfcf; /* turquoise */
      border: 10px solid #f5d742; /* yellow border */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 20px rgba(0,0,0,0.1);
    }

    .logo-text {
      font-family: 'Pacifico', cursive;
      font-size: 42px;
      color: white;
      margin: 0;
      line-height: 1;
    }

    .sub-text {
      margin-top: 10px;
      font-size: 16px;
      letter-spacing: 2px;
      color: white;
      text-transform: uppercase;
      font-weight: 600;
    }

    .tagline {
      margin-top: 25px;
      font-size: 18px;
      color: #444;
      text-align: center;
      max-width: 400px;
    }
  </style>
</head>
<body>

  <div class="logo-container">
    <h1 class="logo-text">buggsie</h1>
    <div class="sub-text">Baking Co.</div>
  </div>

  <div class="tagline">
    Fresh, small-batch baked goods made with love. Simple, playful, and always delicious.
  </div>

</body>
</html>
