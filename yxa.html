<!DOCTYPE html>
<html>
<head>

<title>Video Obvyris Music</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

*{
box-sizing:border-box;
}


body{

margin:0;
background:#080808;
color:white;
font-family:
Arial,
Helvetica,
sans-serif;

}



header{

padding:20px;
background:#111;
font-size:28px;
font-weight:bold;
letter-spacing:3px;
border-bottom:1px solid #333;

}



.controls{

padding:15px;
background:#151515;
display:flex;
gap:10px;
flex-wrap:wrap;

}



input{

background:#222;
color:white;
border:1px solid #444;
padding:12px;
border-radius:6px;
width:300px;

}



button{

background:#e50914;
color:white;
border:0;
padding:12px 20px;
border-radius:6px;
cursor:pointer;

}



.player{

background:#000;
padding:20px;
text-align:center;

}



iframe{

width:90%;
height:500px;
border:0;

}




.info{

padding:20px;
background:#111;

}



.info h2{

margin-top:0;

}



.grid{

padding:20px;

display:grid;

grid-template-columns:
repeat(
auto-fill,
minmax(260px,1fr)
);

gap:20px;

}




.card{

background:#151515;

border-radius:10px;

overflow:hidden;

cursor:pointer;

transition:.2s;

border:1px solid #222;

}



.card:hover{

transform:scale(1.04);

border-color:#e50914;

}



.card img{

width:100%;

height:160px;

object-fit:cover;

}



.card h3{

padding:10px;

margin:0;

font-size:18px;

}



.card p{

margin:8px 10px;

color:#aaa;

font-size:13px;

}



.badge{

background:#e50914;

padding:5px;

border-radius:5px;

color:white;

}



.loading{

text-align:center;

padding:30px;

font-size:20px;

}


</style>

</head>



<body>


<header>

🎵 VIDEO OBVYRIS MUSIC

</header>



<div class="controls">


<input 
id="search"
placeholder="Search artist, song, channel..."
>


<button onclick="searchVideos()">
Search
</button>


<button onclick="loadVideos()">
Reload
</button>


</div>




<div class="player">


<iframe

id="player"

allow=
"autoplay; encrypted-media"

allowfullscreen>

</iframe>


</div>




<div class="info">


<h2 id="title">

Select a music video

</h2>



<div id="details">

</div>



<p id="description">

</p>


</div>




<div 
id="videos"
class="grid">

<div class="loading">

Loading videos...

</div>

</div>





<script>


const API_URL =

"https://script.google.com/macros/s/AKfycbwA1FraODA7b2LLXhJfDzvdbK9TfNtSFVqcKQl67P0WjFg4ysOIGHGyq9JyeSN9axy2/exec";



let library=[];





async function loadVideos(){


try{


let response =

await fetch(

API_URL+

"?action=all&limit=500"

);



let data =

await response.json();



console.log(data);



library =

data.videos || [];



displayVideos(
library
);



if(library.length){

playVideo(
library[0]
);

}



}

catch(error){

console.error(error);


document
.getElementById("videos")
.innerHTML =

"API ERROR";


}


}







function displayVideos(list){


let box =

document
.getElementById(
"videos"
);



box.innerHTML="";



list.forEach(video=>{


let card =

document.createElement(
"div"
);



card.className="card";



card.onclick=()=>{

playVideo(video);

};



card.innerHTML=`

<img src="${video["Thumbnail"]}">


<h3>

${video["Title"]}

</h3>



<p>

<span class="badge">

${video["Artist"]}

</span>

</p>



<p>

📺 ${video["Channel"]}

</p>


<p>

👁 
${Number(video["Views"]).toLocaleString()}

</p>


<p>

👍 
${Number(video["Likes"]).toLocaleString()}

</p>


<p>

⏱ 
${video["Duration"]}

</p>


`;



box.appendChild(card);



});


}








function playVideo(video){


let id =

video["Video ID"];



document

.getElementById(
"player"
)

.src =

"https://www.youtube.com/embed/"

+

id

+

"?autoplay=1";





document

.getElementById(
"title"
)

.innerHTML =

video["Title"];






document

.getElementById(
"details"
)

.innerHTML =

`

<b>Artist:</b>
${video["Artist"]}

<br>

<b>Channel:</b>
${video["Channel"]}

<br>

<b>Published:</b>
${video["Published"]}

<br>

<b>Duration:</b>
${video["Duration"]}

<br>

<b>Views:</b>
${Number(video["Views"]).toLocaleString()}

<br>

<b>Likes:</b>
${Number(video["Likes"]).toLocaleString()}

<br>

<a href="${video["URL"]}" target="_blank">

Open YouTube

</a>

`;





document

.getElementById(
"description"
)

.innerText =

video["Description"] || "";



window.scrollTo({

top:0,

behavior:"smooth"

});


}








function searchVideos(){


let q =

document

.getElementById(
"search"
)

.value

.toLowerCase();



let results =

library.filter(video=>{


return (


String(video["Artist"])

.toLowerCase()

.includes(q)



||


String(video["Title"])

.toLowerCase()

.includes(q)



||


String(video["Channel"])

.toLowerCase()

.includes(q)



);


});



displayVideos(
results
);


}






loadVideos();


</script>



</body>

</html>
