<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<style>
body {
  margin: 0;
  font-family: system-ui;
  background: #0b0f14;
  color: white;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

header {
  padding: 12px;
  background: #111827;
  font-weight: bold;
}

#chat {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
}

.msg {
  margin: 6px 0;
  padding: 10px;
  background: #1f2937;
  border-radius: 8px;
}

.name {
  color: #4cc9f0;
  font-weight: bold;
}

.inputBar {
  display: flex;
  gap: 6px;
  padding: 10px;
  background: #111827;
}

input {
  padding: 10px;
  border: none;
  border-radius: 6px;
  outline: none;
}

#name { width: 120px; }
#msg { flex: 1; }

button {
  padding: 10px 14px;
  background: #4cc9f0;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}
</style>
</head>

<body>

<header>💬 Live Chat</header>

<div id="chat"></div>

<div class="inputBar">
  <input id="name" placeholder="name">
  <input id="msg" placeholder="message">
  <button onclick="send()">Send</button>
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbzX9UkAd64skxZoOtdIBnDkzDQMCBtodK98gBVWqZzmYYuSqYRJgZxx0rCqkBY8QRa17A/exec";

/**
 * LOAD MESSAGES
 */
async function loadMessages() {
  const res = await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({ action: "get" })
  });

  const data = await res.json();
  render(data);
}

/**
 * RENDER
 */
function render(data) {
  const chat = document.getElementById("chat");
  chat.innerHTML = "";

  data.forEach(m => {
    const time = new Date(m.time).toLocaleTimeString();

    chat.innerHTML += `
      <div class="msg">
        <span class="name">${m.name}</span> (${time})<br/>
        ${m.message}
      </div>
    `;
  });

  chat.scrollTop = chat.scrollHeight;
}

/**
 * SEND MESSAGE
 */
async function send() {
  const name = document.getElementById("name").value || "Anon";
  const msg = document.getElementById("msg").value;

  if (!msg) return;

  await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "send",
      name,
      message: msg
    })
  });

  document.getElementById("msg").value = "";
  loadMessages();
}

setInterval(loadMessages, 2000);
loadMessages();

</script>

</body>
</html>
