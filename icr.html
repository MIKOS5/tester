<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <style>
    body {
      margin: 0;
      font-family: system-ui;
      background: #0b0f14;
      color: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    header {
      padding: 12px;
      background: #111827;
      display: flex;
      justify-content: space-between;
      font-weight: bold;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .msg {
      margin: 6px 0;
      padding: 8px;
      background: #1f2937;
      border-radius: 8px;
    }

    .name {
      color: #4cc9f0;
      font-weight: bold;
    }

    .inputBar {
      display: flex;
      gap: 6px;
      padding: 10px;
      background: #111827;
    }

    input {
      padding: 10px;
      border: none;
      border-radius: 6px;
      outline: none;
    }

    #name { width: 120px; }
    #msg { flex: 1; }

    button {
      padding: 10px 14px;
      background: #4cc9f0;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header>
  <div>💬 Chat Pro</div>
  <div id="status">connecting...</div>
</header>

<div id="chat"></div>

<div class="inputBar">
  <input id="name" placeholder="name">
  <input id="msg" placeholder="message">
  <button onclick="send()">Send</button>
</div>

<script>
const chat = document.getElementById("chat");

/**
 * LOAD MESSAGES
 */
function loadMessages() {
  google.script.run
    .withSuccessHandler(render)
    .withFailureHandler(err => {
      console.log("LOAD ERROR", err);
    })
    .getMessages();
}

/**
 * RENDER CHAT
 */
function render(data) {
  chat.innerHTML = "";

  data.forEach(row => {
    const time = new Date(row[0]).toLocaleTimeString();
    const name = row[1];
    const msg = row[2];

    chat.innerHTML += `
      <div class="msg">
        <span class="name">${name}</span>
        <span>(${time})</span><br/>
        ${msg}
      </div>
    `;
  });

  chat.scrollTop = chat.scrollHeight;
}

/**
 * SEND MESSAGE
 */
function send() {
  const name = document.getElementById("name").value || "Anon";
  const msg = document.getElementById("msg").value;

  if (!msg) return;

  google.script.run
    .withSuccessHandler(() => {
      document.getElementById("msg").value = "";
      loadMessages();
    })
    .withFailureHandler(err => {
      console.log("SEND ERROR", err);
    })
    .postMessage(name, msg);
}

/**
 * ENTER KEY SUPPORT
 */
document.getElementById("msg").addEventListener("keydown", e => {
  if (e.key === "Enter") send();
});

/**
 * INIT
 */
loadMessages();
setInterval(loadMessages, 1500);
</script>

</body>
</html>
