<!DOCTYPE html> <html lang="en"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width,initial-scale=1"> <title>Obvyris Games — ROM Test</title> <style> *{ box-sizing:border-box; } html, body{ margin:0; width:100%; height:100%; background:#05080d; color:#e8edf5; font-family:Arial,Helvetica,sans-serif; overflow:hidden; } #app{ width:100%; height:100%; display:flex; flex-direction:column; } #header{ height:58px; min-height:58px; display:flex; align-items:center; padding:0 16px; background:#0b121c; border-bottom:1px solid #1d2b3b; } .logo{ font-size:17px; font-weight:900; letter-spacing:3px; } .title{ margin-left:14px; color:#74859a; font-size:11px; } #status{ margin-left:auto; color:#718298; font-size:11px; } #player{ position:relative; flex:1; min-height:0; width:100%; background:#000; } #game{ position:absolute; inset:0; width:100%; height:100%; } #message{ position:absolute; inset:0; z-index:10; display:flex; align-items:center; justify-content:center; background:#05080d; padding:30px; } #message.hidden{ display:none; } .message-box{ width:min(700px,95vw); border:1px solid #223247; background:#0b131e; border-radius:10px; padding:24px; } .message-title{ font-size:16px; font-weight:700; margin-bottom:10px; } .message-text{ color:#8190a3; font-size:12px; line-height:1.6; white-space:pre-wrap; } #log{ margin-top:15px; max-height:220px; overflow:auto; padding:12px; border:1px solid #1d2b3b; border-radius:7px; background:#05090f; color:#64778c; font-family:monospace; font-size:10px; line-height:1.5; white-space:pre-wrap; } #controls{ position:absolute; z-index:20; right:12px; top:12px; display:flex; gap:6px; } button{ border:1px solid #26384c; background:#101925; color:#9aa9bb; border-radius:6px; padding:8px 11px; cursor:pointer; font-size:10px; } button:hover{ background:#182536; color:white; } </style> </head> <body> <div id="app">
<header id="header">


    <div class="logo">
        OBVYRIS
    </div>


    <div class="title">
        DIRECT ROM TEST // THE LEGEND OF ZELDA
    </div>


    <div id="status">
        Preparing...
    </div>


</header>


<main id="player">


    <div id="game"></div>


    <div id="controls">


        <button onclick="start()">
            RESTART
        </button>


        <button onclick="openDirectROM()">
            DIRECT ROM
        </button>


    </div>


    <div id="message">


        <div class="message-box">


            <div
                id="messageTitle"
                class="message-title"
            >
                Preparing Game...
            </div>


            <div
                id="messageText"
                class="message-text"
            >
                Downloading ROM from Archive.org
            </div>


            <div
                id="log"
            ></div>


        </div>


    </div>


</main>
</div> <script> /* ========================================================= OBVYRIS DIRECT ROM TEST ========================================================= This test intentionally DOES NOT use the Google Apps Script backend. ROM source: https://archive.org/download/nes-emulator_202404/Legend%20of%20Zelda.nes Flow: Archive.org ↓ fetch() ↓ ArrayBuffer ↓ Blob ↓ local blob URL ↓ EmulatorJS ↓ NES core ↓ Zelda ========================================================= */ const ROM_URL = "https://archive.org/download/nes-emulator_202404/Legend%20of%20Zelda.nes"; const GAME_TITLE = "The Legend of Zelda"; const CORE = "nes"; let romBlobURL = null; let emulatorScript = null; /* ========================================================= ELEMENTS ========================================================= */ const gameContainer = document.getElementById("game"); const message = document.getElementById("message"); const messageTitle = document.getElementById("messageTitle"); const messageText = document.getElementById("messageText"); const logBox = document.getElementById("log"); const status = document.getElementById("status"); /* ========================================================= LOGGING ========================================================= */ function log(text){ console.log( "[OBVYRIS]", text ); logBox.textContent += "[OBVYRIS] " + text + "\n"; logBox.scrollTop = logBox.scrollHeight; } /* ========================================================= STATUS ========================================================= */ function setStatus(text){ status.textContent = text; } /* ========================================================= MESSAGE ========================================================= */ function showMessage( title, text ){ messageTitle.textContent = title; messageText.textContent = text; message.classList.remove( "hidden" ); } function hideMessage(){ message.classList.add( "hidden" ); } /* ========================================================= CLEANUP ========================================================= */ function cleanup(){ /* * Remove EmulatorJS scripts. */ document .querySelectorAll( "script[data-obvyris]" ) .forEach( function(script){ script.remove(); } ); emulatorScript = null; /* * Remove previous emulator. */ gameContainer.innerHTML = ""; /* * Remove old blob URL. */ if(romBlobURL){ try{ URL.revokeObjectURL( romBlobURL ); }catch(e){} romBlobURL = null; } /* * Remove EmulatorJS globals. */ const globals = [ "EJS_player", "EJS_core", "EJS_gameUrl", "EJS_gameName", "EJS_pathtodata", "EJS_startOnLoaded", "EJS_color", "EJS_language", "EJS_volume" ]; globals.forEach( function(name){ try{ delete window[name]; }catch(e){ window[name] = undefined; } } ); } /* ========================================================= DOWNLOAD ROM ========================================================= */ async function downloadROM(){ log( "Downloading ROM:" ); log( ROM_URL ); setStatus( "Downloading ROM..." ); showMessage( "Downloading ROM...", "Retrieving The Legend of Zelda directly from Archive.org." ); let response; try{ response = await fetch( ROM_URL + "?obvyris=" + Date.now(), { method:"GET", mode:"cors", cache:"no-store" } ); }catch(error){ log( "FETCH ERROR: " + error.message ); throw new Error( "Browser could not fetch the Archive.org ROM.\n\n" + error.message ); } log( "HTTP status: " + response.status ); log( "Content-Type: " + ( response.headers.get( "content-type" ) || "unknown" ) ); if(!response.ok){ throw new Error( "Archive.org returned HTTP " + response.status ); } const buffer = await response.arrayBuffer(); log( "Downloaded bytes: " + buffer.byteLength ); if(!buffer.byteLength){ throw new Error( "The downloaded ROM is empty." ); } return buffer; } /* ========================================================= VALIDATE NES ROM ========================================================= */ function validateNES(buffer){ log( "Validating NES header..." ); if(buffer.byteLength < 16){ throw new Error( "ROM is smaller than the required NES header." ); } const bytes = new Uint8Array( buffer, 0, 16 ); const header = String.fromCharCode( bytes[0], bytes[1], bytes[2], bytes[3] ); log( "NES header: " + header ); if(header !== "NES\u001a"){ throw new Error( "Invalid NES ROM header.\n\n" + "Expected NES + 0x1A." ); } log( "Valid NES ROM." ); const prgBanks = bytes[4]; const chrBanks = bytes[5]; log( "PRG banks: " + prgBanks ); log( "CHR banks: " + chrBanks ); log( "ROM size: " + buffer.byteLength + " bytes" ); } /* ========================================================= CREATE LOCAL ROM URL ========================================================= */ function createROMBlob(buffer){ log( "Creating browser-local ROM Blob..." ); const blob = new Blob( [ buffer ], { type: "application/octet-stream" } ); romBlobURL = URL.createObjectURL( blob ); log( "Local ROM URL created." ); log( romBlobURL ); log( "Blob size: " + blob.size + " bytes" ); return romBlobURL; } /* ========================================================= START EMULATORJS ========================================================= */ function startEmulator( localROM ){ log( "Starting EmulatorJS..." ); setStatus( "Starting EmulatorJS..." ); showMessage( "Starting Emulator...", "Loading the NES emulator." ); /* * Clean player. */ gameContainer.innerHTML = ""; /* * EmulatorJS configuration. */ window.EJS_player = "#game"; window.EJS_core = CORE; window.EJS_gameUrl = localROM; window.EJS_gameName = GAME_TITLE; window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/"; window.EJS_startOnLoaded = true; window.EJS_color = "#48bfff"; window.EJS_language = "en-US"; window.EJS_volume = 0.8; log( "Core: " + CORE ); log( "ROM: " + localROM ); log( "Data path:" ); log( window.EJS_pathtodata ); /* * Load EmulatorJS. */ emulatorScript = document.createElement( "script" ); emulatorScript.src = "https://cdn.emulatorjs.org/stable/data/loader.js"; emulatorScript.dataset.obvyris = "emulator"; emulatorScript.onload = function(){ log( "EmulatorJS loader loaded." ); setStatus( "Emulator loaded" ); }; emulatorScript.onerror = function(){ log( "EmulatorJS loader FAILED." ); setStatus( "EmulatorJS error" ); showMessage( "EmulatorJS Failed", "The EmulatorJS loader could not be loaded." ); }; document.body.appendChild( emulatorScript ); } /* ========================================================= MAIN START ========================================================= */ async function start(){ cleanup(); logBox.textContent = ""; log( "==============================" ); log( "OBVYRIS DIRECT ROM TEST" ); log( "==============================" ); log( "Game: " + GAME_TITLE ); log( "Core: " + CORE ); log( "Source:" ); log( ROM_URL ); try{ const buffer = await downloadROM(); validateNES( buffer ); const localROM = createROMBlob( buffer ); /* * Small delay gives the browser time to * finish creating the Blob URL before * EmulatorJS starts. */ await new Promise( function(resolve){ setTimeout( resolve, 100 ); } ); startEmulator( localROM ); }catch(error){ console.error( "[OBVYRIS] GAME FAILED", error ); log( "ERROR: " + error.message ); setStatus( "Game failed" ); showMessage( "Game Could Not Start", error.message ); } } /* ========================================================= DIRECT ROM BUTTON ========================================================= */ function openDirectROM(){ window.open( ROM_URL, "_blank" ); } /* ========================================================= START AUTOMATICALLY ========================================================= */ window.addEventListener( "load", function(){ setTimeout( start, 300 ); } ); </script> </body> </html>
