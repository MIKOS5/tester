<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Obvyris ROM Player</title>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    background:#05080d;
    color:#e8edf5;
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
}

body{
    display:flex;
    flex-direction:column;
}

#topbar{
    height:54px;
    min-height:54px;
    display:flex;
    align-items:center;
    gap:12px;
    padding:0 14px;
    background:#0b111a;
    border-bottom:1px solid #1c2a3a;
}

.logo{
    font-size:15px;
    font-weight:900;
    letter-spacing:3px;
}

.game-title{
    color:#8b9aae;
    font-size:11px;
}

#status{
    margin-left:auto;
    color:#68798c;
    font-size:10px;
}

#status.online{
    color:#4bd982;
}

#status.error{
    color:#ef6666;
}

#player{
    flex:1;
    min-height:0;
    width:100%;
    position:relative;
    background:#000;
}

#game{
    width:100%;
    height:100%;
    min-height:0;
}

#message{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    padding:30px;
    text-align:center;
    background:#05080d;
}

#message.hidden{
    display:none;
}

.message-title{
    color:#e8edf5;
    font-size:18px;
    font-weight:700;
    margin-bottom:10px;
}

.message-text{
    max-width:800px;
    color:#75869a;
    font-size:12px;
    line-height:1.6;
    white-space:pre-wrap;
}

.debug{
    width:min(900px,95vw);
    max-height:220px;
    margin-top:15px;
    padding:12px;
    overflow:auto;
    text-align:left;
    white-space:pre-wrap;
    word-break:break-word;
    background:#080d14;
    border:1px solid #1d2c3d;
    border-radius:7px;
    color:#687a8f;
    font-family:monospace;
    font-size:10px;
}

#loading{
    position:absolute;
    inset:0;
    z-index:20;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:#05080d;
}

#loading.hidden{
    display:none;
}

.spinner{
    width:30px;
    height:30px;
    border:3px solid #1b2a3b;
    border-top-color:#48bfff;
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin-bottom:15px;
}

.loading-text{
    color:#7890a5;
    font-size:11px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}
</style>
</head>

<body>

<div id="topbar">

    <div class="logo">
        OBVYRIS
    </div>

    <div
        id="gameTitle"
        class="game-title"
    >
        Preparing Game...
    </div>

    <div
        id="status"
    >
        Connecting...
    </div>

</div>

<div id="player">

    <div id="game"></div>

    <div id="loading">

        <div class="spinner"></div>

        <div
            id="loadingText"
            class="loading-text"
        >
            Preparing ROM...
        </div>

    </div>

    <div
        id="message"
        class="hidden"
    >

        <div
            id="messageTitle"
            class="message-title"
        >
            Game could not be started
        </div>

        <div
            id="messageText"
            class="message-text"
        ></div>

        <div
            id="debug"
            class="debug"
        ></div>

    </div>

</div>


<script>

/* =====================================================
   OBVYRIS ROM PLAYER
   ===================================================== */


/*
 * YOUR GOOGLE APPS SCRIPT
 */

const API_URL =
    "https://script.google.com/macros/s/AKfycbxDYk9W7QQLEn_FbyFu261mL0bQELvIh7TEMwFIYXwaCTWG4pqOjwfEtLbKZSgI2eNO/exec";


/*
 * GAME TO RUN
 *
 * This is the only game parameter needed.
 */

const GAME_ID =
    "zelda-nes";


/*
 * EmulatorJS
 */

const EJS_DATA =
    "https://cdn.emulatorjs.org/stable/data/";


/*
 * State
 */

let romBlobURL = null;
let emulatorFrame = null;


/* =====================================================
   DOM
   ===================================================== */

const statusEl =
    document.getElementById(
        "status"
    );

const titleEl =
    document.getElementById(
        "gameTitle"
    );

const loadingEl =
    document.getElementById(
        "loading"
    );

const loadingTextEl =
    document.getElementById(
        "loadingText"
    );

const messageEl =
    document.getElementById(
        "message"
    );

const messageTitleEl =
    document.getElementById(
        "messageTitle"
    );

const messageTextEl =
    document.getElementById(
        "messageText"
    );

const debugEl =
    document.getElementById(
        "debug"
    );


/* =====================================================
   STATUS
   ===================================================== */

function setStatus(
    text,
    type
){

    statusEl.textContent =
        text;

    statusEl.className =
        "";

    if(type){
        statusEl.classList.add(
            type
        );
    }

}


/* =====================================================
   LOADING
   ===================================================== */

function setLoading(
    text
){

    loadingTextEl.textContent =
        text;

    loadingEl.classList.remove(
        "hidden"
    );

}


function hideLoading(){

    loadingEl.classList.add(
        "hidden"
    );

}


/* =====================================================
   ERROR
   ===================================================== */

function showError(
    title,
    text,
    debug
){

    hideLoading();

    setStatus(
        "Error",
        "error"
    );

    messageTitleEl.textContent =
        title;

    messageTextEl.textContent =
        text || "";

    debugEl.textContent =
        debug
            ? typeof debug === "string"
                ? debug
                : JSON.stringify(
                    debug,
                    null,
                    2
                )
            : "";

    messageEl.classList.remove(
        "hidden"
    );

}


/* =====================================================
   BASE64 → UINT8ARRAY
   ===================================================== */

function base64ToBytes(
    base64
){

    console.log(
        "[OBVYRIS] Base64 length:",
        base64.length
    );


    /*
     * Remove accidental whitespace.
     */

    base64 =
        String(base64)
            .replace(
                /\s/g,
                ""
            );


    /*
     * Decode Base64.
     */

    let binary;

    try{

        binary =
            atob(
                base64
            );

    }catch(error){

        throw new Error(
            "Invalid Base64 ROM data."
        );

    }


    console.log(
        "[OBVYRIS] Decoded binary length:",
        binary.length
    );


    const bytes =
        new Uint8Array(
            binary.length
        );


    for(
        let i = 0;
        i < binary.length;
        i++
    ){

        bytes[i] =
            binary.charCodeAt(i);

    }


    return bytes;

}


/* =====================================================
   ROM VALIDATION
   ===================================================== */

function validateROM(
    bytes,
    game
){

    if(
        !bytes ||
        !bytes.length
    ){

        throw new Error(
            "ROM contains zero bytes."
        );

    }


    console.log(
        "[OBVYRIS] ROM size:",
        bytes.length,
        "bytes"
    );


    /*
     * NES validation.
     *
     * NES ROMs normally begin:
     *
     * 4E 45 53 1A
     *
     * "NES" + 0x1A
     */

    if(
        String(
            game.platform || ""
        ).toLowerCase() ===
        "nes"
    ){

        if(
            bytes.length >= 4
        ){

            const header =
                String.fromCharCode(
                    bytes[0],
                    bytes[1],
                    bytes[2]
                );


            console.log(
                "[OBVYRIS] NES header:",
                header,
                bytes[3]
            );


            if(
                header !== "NES" ||
                bytes[3] !== 0x1A
            ){

                console.warn(
                    "[OBVYRIS] ROM does not have standard NES header."
                );

            }else{

                console.log(
                    "[OBVYRIS] Valid NES ROM header."
                );

            }

        }

    }

}


/* =====================================================
   GET ROM FROM BACKEND
   ===================================================== */

async function getROM(){

    const url =
        API_URL +
        "?action=rom" +
        "&game=" +
        encodeURIComponent(
            GAME_ID
        ) +
        "&ts=" +
        Date.now();


    console.log(
        "[OBVYRIS] ========================="
    );

    console.log(
        "[OBVYRIS] Requesting ROM"
    );

    console.log(
        "[OBVYRIS] Game ID:",
        GAME_ID
    );

    console.log(
        "[OBVYRIS] API:",
        url
    );

    console.log(
        "[OBVYRIS] ========================="
    );


    setLoading(
        "Retrieving cached ROM..."
    );


    setStatus(
        "Loading ROM..."
    );


    let response;

    try{

        response =
            await fetch(
                url,
                {
                    method:"GET",
                    cache:"no-store"
                }
            );

    }catch(error){

        throw new Error(
            "Could not connect to the Games API."
        );

    }


    console.log(
        "[OBVYRIS] HTTP:",
        response.status
    );


    if(!response.ok){

        throw new Error(
            "ROM API returned HTTP " +
            response.status
        );

    }


    let json;

    try{

        json =
            await response.json();

    }catch(error){

        throw new Error(
            "ROM API did not return valid JSON."
        );

    }


    console.log(
        "[OBVYRIS] ROM API:",
        json
    );


    if(!json.success){

        throw new Error(
            json.error ||
            json.message ||
            "ROM API returned success=false."
        );

    }


    if(
        !json.romBase64
    ){

        throw new Error(
            "Backend did not return romBase64."
        );

    }


    return json;

}


/* =====================================================
   CREATE LOCAL ROM BLOB
   ===================================================== */

function createROMBlob(
    json
){

    setLoading(
        "Preparing ROM..."
    );


    const bytes =
        base64ToBytes(
            json.romBase64
        );


    validateROM(
        bytes,
        {
            platform:
                json.platform
        }
    );


    /*
     * IMPORTANT:
     *
     * application/octet-stream
     *
     * keeps the ROM binary.
     */

    const blob =
        new Blob(
            [bytes],
            {
                type:
                    json.mimeType ||
                    "application/octet-stream"
            }
        );


    romBlobURL =
        URL.createObjectURL(
            blob
        );


    console.log(
        "[OBVYRIS] Local ROM URL:",
        romBlobURL
    );


    console.log(
        "[OBVYRIS] Blob size:",
        blob.size
    );


    return romBlobURL;

}


/* =====================================================
   CREATE EMULATOR IFRAME
   ===================================================== */

function createEmulatorFrame(
    json,
    romURL
){

    setLoading(
        "Starting EmulatorJS..."
    );


    /*
     * Destroy old iframe.
     */

    if(emulatorFrame){

        emulatorFrame.remove();

        emulatorFrame =
            null;

    }


    /*
     * Clear player.
     */

    document.getElementById(
        "game"
    ).innerHTML =
        "";


    /*
     * Create isolated iframe.
     */

    emulatorFrame =
        document.createElement(
            "iframe"
        );


    emulatorFrame.style.width =
        "100%";

    emulatorFrame.style.height =
        "100%";

    emulatorFrame.style.border =
        "0";

    emulatorFrame.style.display =
        "block";

    emulatorFrame.style.background =
        "#000";


    emulatorFrame.setAttribute(
        "allow",
        "autoplay; fullscreen; gamepad"
    );


    emulatorFrame.setAttribute(
        "allowfullscreen",
        ""
    );


    document.getElementById(
        "game"
    ).appendChild(
        emulatorFrame
    );


    /*
     * Build isolated EmulatorJS page.
     */

    const frameDocument =
        emulatorFrame.contentDocument ||
        emulatorFrame.contentWindow.document;


    frameDocument.open();


    frameDocument.write(
`
<!DOCTYPE html>

<html>

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<style>

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

#game{
    width:100%;
    height:100%;
}

</style>

</head>

<body>

<div id="game"></div>

<script>

/*
 * EmulatorJS configuration
 */

window.EJS_player =
    "#game";

window.EJS_core =
    ${JSON.stringify(
        json.emulatorCore ||
        json.core ||
        "nes"
    )};

window.EJS_gameUrl =
    ${JSON.stringify(
        romURL
    )};

window.EJS_gameName =
    ${JSON.stringify(
        json.title ||
        "Obvyris Game"
    )};

window.EJS_pathtodata =
    ${JSON.stringify(
        EJS_DATA
    )};

window.EJS_startOnLoaded =
    true;

window.EJS_language =
    "en-US";

window.EJS_volume =
    0.8;

window.EJS_color =
    "#48bfff";

console.log(
    "[OBVYRIS FRAME] EmulatorJS configuration:",
    {
        core:window.EJS_core,
        gameUrl:window.EJS_gameUrl,
        gameName:window.EJS_gameName,
        data:window.EJS_pathtodata
    }
);

<\/script>

<script
    src="${EJS_DATA}loader.js"
><\/script>

</body>

</html>
`
    );


    frameDocument.close();


    /*
     * Give EmulatorJS time to initialize.
     */

    setTimeout(
        function(){

            hideLoading();

            setStatus(
                "Emulator Running",
                "online"
            );

        },
        2500
    );

}


/* =====================================================
   START
   ===================================================== */

async function start(){

    try{

        setStatus(
            "Connecting..."
        );


        titleEl.textContent =
            "Preparing Game...";


        /*
         * 1.
         * Get ROM from Apps Script.
         */

        const json =
            await getROM();


        /*
         * Update title.
         */

        titleEl.textContent =
            json.title ||
            GAME_ID;


        /*
         * 2.
         * Create local Blob URL.
         */

        const romURL =
            createROMBlob(
                json
            );


        /*
         * 3.
         * Run EmulatorJS.
         */

        createEmulatorFrame(
            json,
            romURL
        );


    }catch(error){

        console.error(
            "[OBVYRIS] ROM PLAYER ERROR:",
            error
        );


        showError(
            "Game could not be started",
            error.message ||
            String(error),
            {
                Game:
                    GAME_ID,

                API:
                    API_URL,

                Error:
                    error.message ||
                    String(error)
            }
        );

    }

}


/* =====================================================
   CLEANUP
   ===================================================== */

window.addEventListener(
    "beforeunload",
    function(){

        if(
            romBlobURL
        ){

            URL.revokeObjectURL(
                romBlobURL
            );

        }

    }
);


/* =====================================================
   START PLAYER
   ===================================================== */

start();

</script>

</body>
</html>
