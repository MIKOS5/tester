<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>RADIO OS v2</title>

<style>
/* =========================
   GLOBAL DESKTOP UI (BIGGER)
========================= */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0f14;
  color: #ffffff;
  display: flex;
  height: 100vh;
  font-size: 20px; /* ⬆ base font bigger */
}

/* =========================
   LEFT WIDGET BAR
========================= */
.sidebar {
  width: 200px; /* ⬆ wider panel */
  background: #111826;
  padding: 18px;
  box-sizing: border-box;
  border-right: 1px solid #1f2a3a;
}

.sidebar h2 {
  font-size: 22px; /* ⬆ title bigger */
  margin-bottom: 12px;
}

input, select, button {
  width: 100%;
  padding: 10px;      /* ⬆ bigger touch targets */
  margin-top: 10px;
  border-radius: 8px;
  border: none;
  font-size: 10px;    /* ⬆ input text bigger */
}

button {
  background: #1e88e5;
  color: white;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  background: #1565c0;
}

/* =========================
   MAIN AREA
========================= */
.main {
  flex: 1;
  padding: 24px;
  overflow: auto;
}

.topbar {
  display: flex;
  gap: 12px;
  margin-bottom: 14px;
}

.smallbtn {
  width: auto;
  padding: 10px 14px;
  font-size: 14px;
}

/* TABLE (BIG IMPROVEMENT) */
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 12px;
  font-size: 15px; /* ⬆ table readability */
}

th, td {
  padding: 14px; /* ⬆ row spacing */
  border-bottom: 1px solid #1f2a3a;
  text-align: left;
}

tr:hover {
  background: #182233;
  cursor: pointer;
}

/* PLAYER */
audio {
  width: 100%;
  margin-top: 18px;
}

/* STATUS */
.status {
  margin-top: 12px;
  color: #aaa;
  font-size: 14px;
}
</style>
</head>

<body>

<!-- ================= SIDEBAR ================= -->
<div class="sidebar">

  <h2>📻 RADIO OS v1</h2>

  <input id="genre" placeholder="Genre (rock, jazz, pop)" />

  <button onclick="applyFilter()">Apply Genre</button>

  <button onclick="nextPage()">Next 50 ➜</button>
  <button onclick="prevPage()">⬅ Prev 50</button>

  <hr>

  <button onclick="loadFavorites()">⭐ Load Favorites</button>

  <div class="status" id="status">Loading...</div>
</div>

<!-- ================= MAIN ================= -->
<div class="main">

  <div class="topbar">
    <button class="smallbtn" onclick="loadStations()">🔄 Refresh Stations</button>
    <button class="smallbtn" onclick="showStations()">📻 Stations</button>
    <button class="smallbtn" onclick="showFavs()">⭐ Favorites</button>
  </div>

  <h3 id="viewTitle">Stations</h3>

  <!-- TABLE -->
  <table id="table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Country</th>
        <th>Genre</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <audio id="player" controls autoplay></audio>

</div>

<script>

/* =========================
   CONFIG
========================= */
const API = "https://all.api.radio-browser.info/json/stations/search";
const SHEET_API = "https://script.google.com/macros/s/AKfycbzZ5MwOcYUY_bpsUKSxPd810xE8rV_Y3z2GwzPublb_4O60CP8L_lC_V2kqkCQ_JdF5/exec";

let stations = [];
let favorites = [];
let page = 0;
let currentGenre = "";
let mode = "stations";
const limit = 50;

/* =========================
   LOAD STATIONS
========================= */
async function loadStations() {
  mode = "stations";

  const offset = page * limit;
  let url = `${API}?countrycode=US&limit=${limit}&offset=${offset}&hidebroken=true`;

  if (currentGenre) url += `&tag=${encodeURIComponent(currentGenre)}`;

  setStatus("Loading stations...");

  const res = await fetch(url);
  stations = await res.json();

  renderTable(stations, "stations");
}

/* =========================
   FAVORITES (FIXED API HANDLING)
========================= */
async function loadFavorites() {
  setStatus("Loading favorites...");

  const res = await fetch(SHEET_API + "?action=get");
  const text = await res.text();

  let data = [];

  try {
    const json = JSON.parse(text);
    data = json.data || json;
  } catch (e) {
    data = parseTSV(text);
  }

  favorites = data;

  mode = "favorites";
  renderTable(favorites, "favorites");

  setStatus(`Loaded ${favorites.length} favorites`);
}

/* =========================
   SAVE FAVORITE
========================= */
async function saveFavorite(index) {
  const s = stations[index];
  if (!s) return;

  await fetch(SHEET_API, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      action: "save",
      id: s.stationuuid,
      name: s.name,
      url: s.url_resolved || s.url,
      country: s.country,
      genre: currentGenre || "all",
      time: new Date().toISOString()
    })
  });

  setStatus("⭐ Saved");
}

/* =========================
   TABLE RENDER
========================= */
function renderTable(list, type) {
  const tbody = document.querySelector("#table tbody");
  tbody.innerHTML = "";

  if (!list || !list.length) {
    setStatus("No data found");
    return;
  }

  list.forEach((s, i) => {
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${s.name || ""}</td>
      <td>${s.country || ""}</td>
      <td>${s.genre || s.tags || ""}</td>
      <td>
        <button onclick="play(${i})">▶</button>
        ${type === "stations"
          ? `<button onclick="saveFavorite(${i})">⭐</button>`
          : ""
        }
      </td>
    `;

    tbody.appendChild(tr);
  });
}

/* =========================
   PLAY ENGINE (FIXED)
========================= */
function play(i) {
  const item = (mode === "stations") ? stations[i] : favorites[i];
  if (!item) return;

  const player = document.getElementById("player");
  player.src = item.url_resolved || item.url;
  player.play();
}

/* =========================
   FILTER + PAGINATION
========================= */
function applyFilter() {
  currentGenre = document.getElementById("genre").value.trim();
  page = 0;
  loadStations();
}

function nextPage() {
  page++;
  loadStations();
}

function prevPage() {
  if (page > 0) page--;
  loadStations();
}

/* =========================
   VIEW SWITCH
========================= */
function showStations() {
  loadStations();
}

function showFavs() {
  loadFavorites();
}

/* =========================
   HELPERS
========================= */
function setStatus(msg) {
  document.getElementById("status").textContent = msg;
}

function parseTSV(text) {
  return text.trim().split("\n").map(l => {
    const p = l.split("\t");
    return {
      id: p[0],
      name: p[1],
      url: p[2],
      country: p[3],
      genre: p[4],
      time: p[5]
    };
  });
}

/* =========================
   INIT
========================= */
loadStations();

</script>

</body>
</html>
