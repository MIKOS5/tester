<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>you shouldn't be here</title>
<style>
body {
  margin:0;
  overflow:hidden;
  background:black;
  color:#0f0;
  font-family: monospace;
}

#terminal {
  position:absolute;
  width:100%;
  height:100%;
  padding:10px;
  overflow:hidden;
}

.glitch {
  animation: glitch 0.1s infinite;
}

@keyframes glitch {
  0% { transform: translate(2px,-2px); }
  50% { transform: translate(-2px,2px); }
  100% { transform: translate(2px,2px); }
}

.shadow {
  position:absolute;
  width:100px;
  height:200px;
  background:rgba(0,0,0,0.9);
  filter: blur(10px);
}

</style>
</head>
<body>
<div id="terminal"></div>

<script>
const terminal = document.getElementById("terminal");

function typeLine(text, speed=15) {
  let i = 0;
  const line = document.createElement("div");
  terminal.appendChild(line);

  const interval = setInterval(() => {
    line.textContent += text[i];
    i++;
    if (i >= text.length) clearInterval(interval);
  }, speed);
}

// ===== CREEPY MESSAGES =====
const msgs = [
  "...",
  "why are you still here",
  "this page isn't real",
  "close it",
  "you missed it",
  "look behind you",
  "it saw you",
  "don't move"
];

setInterval(()=>{
  typeLine(msgs[Math.floor(Math.random()*msgs.length)]);
},1800);

// ===== WHISPERS =====
let enabled = false;
document.addEventListener("click", ()=> enabled = true);

function whisper(text) {
  const u = new SpeechSynthesisUtterance(text);
  u.volume = 0.15;
  u.rate = 0.7 + Math.random()*0.4;
  u.pitch = 0.3 + Math.random()*0.4;
  speechSynthesis.speak(u);
}

const whispers = [
  "he's here",
  "don't turn around",
  "i'm in your room",
  "you left something open",
  "i can see you",
  "stay quiet"
];

setInterval(()=>{
  if(!enabled) return;
  whisper(whispers[Math.floor(Math.random()*whispers.length)]);
},3500);

// ===== SHADOW FIGURES =====
function spawnShadow() {
  const s = document.createElement("div");
  s.className = "shadow";
  s.style.top = Math.random()*window.innerHeight+"px";
  s.style.left = Math.random()*window.innerWidth+"px";
  document.body.appendChild(s);

  setTimeout(()=>{
    s.remove();
  }, 800);
}

setInterval(spawnShadow, 2000);

// ===== RANDOM SCREAM FLASH =====
setInterval(()=>{
  if(Math.random() < 0.15) {
    document.body.style.background = "white";
    setTimeout(()=> document.body.style.background="black", 100);
  }
}, 2000);

// ===== TEXT THAT FOLLOWS CURSOR =====
const follower = document.createElement("div");
follower.style.position = "absolute";
follower.style.color = "red";
follower.textContent = "RUN";
document.body.appendChild(follower);

document.addEventListener("mousemove", e=>{
  follower.style.top = (e.clientY+15)+"px";
  follower.style.left = (e.clientX+15)+"px";
});

// ===== PAGE DISTORTION =====
setInterval(()=>{
  document.body.style.transform = `scale(${1 + Math.random()*0.05}) rotate(${Math.random()*2-1}deg)`;
}, 400);

// ===== FAKE TAKEOVER =====
setTimeout(()=>{
  terminal.innerHTML = "";
  typeLine("ACCESS GRANTED");
  setTimeout(()=> typeLine("camera enabled"),1000);
  setTimeout(()=> typeLine("just kidding... or am I"),2000);
}, 12000);

</script>
</body>
</html>
