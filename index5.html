<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>📻RADIOWAVE📻</title>

<style>
/* =========================
   GLOBAL MOBILE-FIRST UI
========================= */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0f14;
  color: #fff;
  font-size: 16px;
}

/* =========================
   TOP CONTROLS (ANDROID FRIENDLY)
========================= */
.sidebar {
  padding: 12px;
  background: #111826;
  border-bottom: 1px solid #1f2a3a;
}

h2 {
  margin: 6px 0 10px;
  font-size: 20px;
}

/* INPUTS */
input, select, button {
  width: 100%;
  padding: 14px;
  margin-top: 10px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
}

/* BIG TOUCH BUTTONS */
button {
  background: #1e88e5;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(0.98);
}

/* =========================
   MAIN LIST (CARD STYLE)
========================= */
.main {
  padding: 12px;
  padding-bottom: 120px; /* space for player */
}

.card {
  background: #121a28;
  padding: 12px;
  margin-bottom: 10px;
  border-radius: 12px;
  border: 1px solid #1f2a3a;
}

.card-title {
  font-size: 16px;
  font-weight: bold;
  margin-bottom: 6px;
}

.card-meta {
  font-size: 13px;
  color: #aaa;
  margin-bottom: 10px;
}

/* ACTION ROW */
.actions {
  display: flex;
  gap: 10px;
}

.actions button {
  flex: 1;
  padding: 12px;
  font-size: 14px;
}

/* =========================
   TOP BAR
========================= */
.topbar {
  display: flex;
  gap: 8px;
  padding: 10px 0;
}

.smallbtn {
  flex: 1;
  padding: 10px;
  font-size: 13px;
}

/* =========================
   FIXED PLAYER (ANDROID STYLE)
========================= */
.player-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #0f1722;
  border-top: 1px solid #1f2a3a;
  padding: 10px;
}

audio {
  width: 100%;
}

/* STATUS */
.status {
  font-size: 12px;
  color: #aaa;
  margin-top: 8px;
}
</style>
</head>

<body>

<!-- ================= SIDEBAR ================= -->
<div class="sidebar">
  <h2>RADIOWAVE</h2>

  <input id="genre" placeholder="Genre (rock, jazz, pop)" />

  <button onclick="applyFilter()">Apply Genre</button>

  <div class="topbar">
    <button class="smallbtn" onclick="loadStations()">Refresh</button>
    <button class="smallbtn" onclick="loadFavorites()">Favorites</button>
  </div>

  <div class="status" id="status">Loading...</div>
</div>

<!-- ================= MAIN ================= -->
<div class="main">

  <div id="list"></div>

</div>

<!-- ================= PLAYER ================= -->
<div class="player-bar">
  <audio id="player" controls autoplay></audio>
</div>

<script>

const API = "https://all.api.radio-browser.info/json/stations/search";
const SHEET_API = "https://script.google.com/macros/s/AKfycbzZ5MwOcYUY_bpsUKSxPd810xE8rV_Y3z2GwzPublb_4O60CP8L_lC_V2kqkCQ_JdF5/exec";

let stations = [];
let favorites = [];
let mode = "stations";
let currentGenre = "";
let page = 0;
const limit = 30;

/* =========================
   LOAD STATIONS
========================= */
async function loadStations() {
  mode = "stations";

  let url = `${API}?countrycode=US&limit=${limit}&offset=${page * limit}&hidebroken=true`;
  if (currentGenre) url += `&tag=${encodeURIComponent(currentGenre)}`;

  setStatus("Loading stations...");

  const res = await fetch(url);
  stations = await res.json();

  render(stations);
}

/* =========================
   FAVORITES
========================= */
async function loadFavorites() {
  setStatus("Loading favorites...");

  const res = await fetch(SHEET_API + "?action=get");
  const data = await res.json().catch(() => []);

  favorites = data.data || data;

  mode = "favorites";
  render(favorites);

  setStatus(`Favorites: ${favorites.length}`);
}

/* =========================
   SAVE
========================= */
async function saveFavorite(i) {
  const s = stations[i];
  if (!s) return;

  await fetch(SHEET_API, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      action: "save",
      id: s.stationuuid,
      name: s.name,
      url: s.url_resolved || s.url,
      country: s.country,
      genre: currentGenre || "all",
      time: new Date().toISOString()
    })
  });

  setStatus("⭐ Saved");
}

/* =========================
   RENDER CARDS (ANDROID UI)
========================= */
function render(list) {
  const el = document.getElementById("list");
  el.innerHTML = "";

  list.forEach((s, i) => {
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div class="card-title">${s.name || "Unknown"}</div>
      <div class="card-meta">
        ${s.country || ""} • ${s.genre || s.tags || ""}
      </div>
      <div class="actions">
        <button onclick="play(${i})">▶ Play</button>
        ${mode === "stations"
          ? `<button onclick="saveFavorite(${i})">⭐ Save</button>`
          : ""
        }
      </div>
    `;

    el.appendChild(div);
  });
}

/* =========================
   PLAY
========================= */
function play(i) {
  const item = (mode === "stations") ? stations[i] : favorites[i];
  if (!item) return;

  const player = document.getElementById("player");
  player.src = item.url_resolved || item.url;
  player.play();
}

/* =========================
   FILTER
========================= */
function applyFilter() {
  currentGenre = document.getElementById("genre").value.trim();
  page = 0;
  loadStations();
}

/* =========================
   STATUS
========================= */
function setStatus(t) {
  document.getElementById("status").textContent = t;
}

/* INIT */
loadStations();

</script>

</body>
</html>
