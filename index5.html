<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>locating...</title>
<style>
body { margin:0; overflow:hidden; background:black; color:#0f0; font-family: monospace; }
#terminal { position:absolute; width:100%; height:100%; padding:20px; }
#map { position:absolute; bottom:10px; right:10px; width:320px; height:220px; border:2px solid red; }
.red { color:red; }
</style>
</head>
<body>
<div id="terminal"></div>
<iframe id="map"></iframe>

<script>
const terminal = document.getElementById("terminal");
const map = document.getElementById("map");

function typeLine(text, speed=18) {
  let i = 0;
  const line = document.createElement("div");
  terminal.appendChild(line);
  const interval = setInterval(() => {
    line.textContent += text[i];
    i++;
    if (i >= text.length) clearInterval(interval);
  }, speed);
}

function updateMap(lat, lon, zoom=0.01) {
  map.src = `https://www.openstreetmap.org/export/embed.html?bbox=${lon-zoom}%2C${lat-zoom}%2C${lon+zoom}%2C${lat+zoom}&layer=mapnik&marker=${lat}%2C${lon}`;
}

// ===== START =====
typeLine("initializing...");
setTimeout(()=> typeLine("requesting location permission..."),1500);

// ===== REAL LOCATION ATTEMPT =====
setTimeout(()=>{
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(pos => {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;

      typeLine("permission granted");
      typeLine("coordinates acquired");
      typeLine(`lat: ${lat.toFixed(5)}`);
      typeLine(`lon: ${lon.toFixed(5)}`);

      updateMap(lat, lon);

      // fake enhancement
      setTimeout(()=>{
        typeLine("refining accuracy...");
      },2000);

      setTimeout(()=>{
        typeLine("accuracy: < 5 meters");
      },4000);

      setTimeout(()=>{
        const warn = document.createElement("div");
        warn.className = "red";
        warn.textContent = "location locked";
        terminal.appendChild(warn);
      },6000);

    }, err => {
      typeLine("permission denied");
      fallbackFake();
    });
  } else {
    fallbackFake();
  }
},3000);

// ===== FALLBACK FAKE =====
function fallbackFake() {
  typeLine("switching to network trace...");

  let lat = 34.05 + (Math.random()-0.5);
  let lon = -118.25 + (Math.random()-0.5);

  updateMap(lat, lon, 0.5);

  setTimeout(()=>{
    typeLine("approximate location acquired");
    typeLine(`lat: ${lat.toFixed(5)}`);
    typeLine(`lon: ${lon.toFixed(5)}`);
  },2000);
}

// ===== WHISPERS =====
let enabled=false;
document.addEventListener("click",()=>enabled=true);

function whisper(text){
  const u=new SpeechSynthesisUtterance(text);
  u.volume=0.2;
  u.rate=0.6;
  u.pitch=0.4;
  speechSynthesis.speak(u);
}

setInterval(()=>{
  if(!enabled) return;
  whisper("we see you...");
},5000);

</script>
</body>
</html>
