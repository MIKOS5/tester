<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Radio👋Wave</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0f14;
  color: #fff;
  display: flex;
  height: 100vh;
}

/* SIDEBAR */
.sidebar {
  width: 260px;
  background: #111826;
  padding: 16px;
  box-sizing: border-box;
  border-right: 1px solid #1f2a3a;
}

h2 { margin: 0 0 10px; }

input, button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
  border: none;
  font-size: 14px;
}

button {
  background: #1e88e5;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #1565c0;
}

/* RADIO PLAYER */
.radio-player {
  margin-top: 15px;
  padding: 10px;
  background: #0f1722;
  border: 1px solid #1f2a3a;
  border-radius: 10px;
}

.now-playing {
  font-size: 12px;
  color: #aaa;
  margin-bottom: 8px;
}

#npName {
  font-size: 14px;
  font-weight: bold;
  color: #fff;
}

#npMeta {
  font-size: 12px;
  color: #aaa;
}

.controls {
  display: flex;
  gap: 6px;
  margin-top: 10px;
}

.controls button {
  flex: 1;
  padding: 8px;
  font-size: 14px;
}

/* MAIN */
.main {
  flex: 1;
  padding: 16px;
  overflow: auto;
}

/* TABLE */
table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  padding: 12px;
  border-bottom: 1px solid #1f2a3a;
}

tr:hover {
  background: #182233;
}

/* CARDS */
.card {
  background: #121a28;
  padding: 12px;
  margin-bottom: 10px;
  border-radius: 10px;
  border: 1px solid #1f2a3a;
}

.card-title {
  font-weight: bold;
}

.card-meta {
  font-size: 12px;
  color: #aaa;
  margin: 6px 0;
}

/* STATUS */
.status {
  font-size: 12px;
  color: #aaa;
  margin-top: 10px;
}

#genre {
  width: 90%;
}
  
/* MOBILE */
@media (max-width: 768px) {
  body { flex-direction: column; }

  .sidebar {
    width: 100%;
    border-right: none;
    border-bottom: 1px solid #1f2a3a;
  }

  table { display: none; }
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>📻 RADIOWAVE</h2>

  <input id="genre" placeholder="Genre filter" />
  <button onclick="applyFilter()">Stations / Apply Genre</button>

  <button onclick="prevPage()">⬅ Prev 50</button>
  <button onclick="nextPage()">Next 50 ➜</button>

  <button onclick="loadStations()">Refresh</button>
  <button onclick="loadFavorites()">Favorites</button>

  <div class="status" id="status">Loading...</div>

  <!-- PLAYER -->
  <div class="radio-player">

    <div class="now-playing">
      <div id="npName">Not playing</div>
      <div id="npMeta">Select a station</div>
    </div>

    <audio id="player"></audio>

    <div class="controls">
      <button onclick="prevStation()">⏮</button>
      <button onclick="togglePlay()">▶</button>
      <button onclick="nextStation()">⏭</button>
      <button onclick="toggleFavCurrent()">⭐</button>
    </div>

  </div>
</div>

<!-- MAIN -->
<div class="main">

  <table id="table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Country</th>
        <th>Genre</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div id="mobileList"></div>

</div>

<script>

const API = "https://all.api.radio-browser.info/json/stations/search";
const SHEET_API = "https://script.google.com/macros/s/AKfycbzZ5MwOcYUY_bpsUKSxPd810xE8rV_Y3z2GwzPublb_4O60CP8L_lC_V2kqkCQ_JdF5/exec";

let stations = [];
let favorites = [];
let favoriteIds = new Set();

let mode = "stations";
let page = 0;
const limit = 50;

let currentList = [];
let currentIndex = -1;
let isPlaying = false;

/* LOAD STATIONS */
async function loadStations() {
  mode = "stations";
  setStatus("Loading stations...");

  const offset = page * limit;

  const res = await fetch(
    `${API}?countrycode=US&limit=${limit}&offset=${offset}&hidebroken=true`
  );

  stations = await res.json();
  currentList = stations;

  render();
}

/* FAVORITES */
async function loadFavorites() {
  setStatus("Loading favorites...");

  const res = await fetch(SHEET_API + "?action=get");
  const data = await res.json().catch(()=>[]);

  favorites = data.data || data;

  // FIXED: consistent ID mapping
  favoriteIds = new Set(favorites.map(f => f.id || f.stationuuid));

  mode = "favorites";
  currentList = favorites;

  render();

  setStatus(`Favorites: ${favorites.length}`);
}

/* PLAY */
/* PLAY */
function playStation(id) {

  // FIX:
  // stations use stationuuid
  // favorites use id
  const item = currentList.find(s =>
    s.stationuuid === id || s.id === id
  );

  if (!item) {
    console.log("Station not found:", id);
    return;
  }

  currentIndex = currentList.findIndex(s =>
    s.stationuuid === id || s.id === id
  );

  const player = document.getElementById("player");

  player.src =
    item.url_resolved ||
    item.url ||
    "";

  player.play();

  isPlaying = true;

  updateNowPlaying();

  setStatus("▶ Playing: " + (item.name || "Unknown"));
}

/* NOW PLAYING */
function updateNowPlaying() {
  const item = currentList[currentIndex];
  if (!item) return;

  document.getElementById("npName").textContent = item.name || "Unknown";
  document.getElementById("npMeta").textContent =
    (item.country || "") + " • " + (item.tags || "");
}

/* PLAY TOGGLE */
function togglePlay() {
  const player = document.getElementById("player");

  if (!player.src) return;

  if (isPlaying) {
    player.pause();
    isPlaying = false;
  } else {
    player.play();
    isPlaying = true;
  }
}

/* NEXT / PREV */
function nextStation() {
  if (!currentList.length) return;
  currentIndex = (currentIndex + 1) % currentList.length;
  playStation(currentList[currentIndex].stationuuid);
}

function prevStation() {
  if (!currentList.length) return;
  currentIndex = (currentIndex - 1 + currentList.length) % currentList.length;
  playStation(currentList[currentIndex].stationuuid);
}

/* ⭐ FAVORITE */
async function toggleFavorite(s) {
  if (!s || !s.stationuuid) return;

  const exists = favoriteIds.has(s.stationuuid);

  if (!exists) {
    await fetch(SHEET_API, {
      method: "POST",
      body: new URLSearchParams({
        action: "save",
        id: s.stationuuid,
        name: s.name || "",
        url: s.url_resolved || s.url || "",
        country: s.country || "",
        genre: s.tags || "all",
        time: new Date().toISOString()
      })
    });

    favoriteIds.add(s.stationuuid);
    setStatus("⭐ Saved");
  } else {
    setStatus("Already saved");
  }

  render();
}

/* CURRENT FAVORITE */
function toggleFavCurrent() {
  const item = currentList[currentIndex];
  if (!item) return;
  toggleFavorite(item);
}

/* PAGINATION */
function nextPage() {
  page++;
  loadStations();
}

function prevPage() {
  if (page > 0) page--;
  loadStations();
}

/* FILTER */
function applyFilter() {
  const g = document.getElementById("genre").value.toLowerCase();
  stations = stations.filter(s =>
    (s.tags || "").toLowerCase().includes(g)
  );
  currentList = stations;
  render();
}

/* RENDER */
function render() {
  renderTable();
  renderMobile();
}

/* TABLE (FIXED BUTTONS) */
function renderTable() {
  const tbody = document.querySelector("#table tbody");
  tbody.innerHTML = "";

  currentList.forEach(s => {
    const isFav = favoriteIds.has(s.stationuuid);

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${s.name || ""}</td>
      <td>${s.country || ""}</td>
      <td>${s.tags || ""}</td>
      <td>
        <button onclick="playStation('${s.stationuuid || s.id}')">▶</button>
        <button onclick="toggleFavorite(currentList.find(x => x.stationuuid==='${s.stationuuid}'))">
          ${isFav ? "⭐" : "☆"}
        </button>
      </td>
    `;

    tbody.appendChild(tr);
  });
}

/* MOBILE */
function renderMobile() {
  const el = document.getElementById("mobileList");
  el.innerHTML = "";

  currentList.forEach(s => {
    const isFav = favoriteIds.has(s.stationuuid);

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div class="card-title">${s.name || ""}</div>
      <div class="card-meta">${s.country || ""} • ${s.tags || ""}</div>
      <button onclick="playStation('${s.stationuuid}')">▶ Play</button>
      <button onclick="toggleFavorite(currentList.find(x => x.stationuuid==='${s.stationuuid}'))">
        ${isFav ? "⭐ Favorited" : "☆ Favorite"}
      </button>
    `;

    el.appendChild(div);
  });
}

/* STATUS */
function setStatus(t) {
  document.getElementById("status").textContent = t;
}

/* INIT */
loadStations();

</script>

</body>
</html>
