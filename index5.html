<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>it knows</title>
<style>
body {
  margin:0;
  overflow:hidden;
  background:black;
  color:#0f0;
  font-family: monospace;
}

#terminal {
  position:absolute;
  width:100%;
  height:100%;
  padding:10px;
}

.face {
  position:absolute;
  width:200px;
  opacity:0;
}

</style>
</head>
<body>
<div id="terminal"></div>

<script>
const terminal = document.getElementById("terminal");

function typeLine(text, speed=15) {
  let i = 0;
  const line = document.createElement("div");
  terminal.appendChild(line);

  const interval = setInterval(() => {
    line.textContent += text[i];
    i++;
    if (i >= text.length) clearInterval(interval);
  }, speed);
}

// ===== WHISPERS WITH DIRECTION =====
let audioEnabled = false;
document.addEventListener("click", ()=> audioEnabled = true);

function whisper(text, panValue=0) {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const utter = new SpeechSynthesisUtterance(text);

  const synth = window.speechSynthesis;
  utter.volume = 0.2;
  utter.rate = 0.6 + Math.random()*0.4;
  utter.pitch = 0.3 + Math.random()*0.3;

  synth.speak(utter);
}

const whispers = [
  "i am behind you",
  "don't turn around",
  "you hear that",
  "stay still",
  "it sees you",
  "closer now"
];

setInterval(()=>{
  if(!audioEnabled) return;
  whisper(whispers[Math.floor(Math.random()*whispers.length)]);
}, 3000);

// ===== SILENCE THEN JUMP WHISPER =====
setInterval(()=>{
  if(!audioEnabled) return;
  speechSynthesis.cancel();
  setTimeout(()=>{
    whisper("HEY...",0);
  },2000);
},15000);

// ===== RARE FACE FLASH =====
function flashFace() {
  const img = document.createElement("img");
  img.src = "https://i.imgur.com/8yKXsgF.png"; // creepy face
  img.className = "face";
  img.style.top = Math.random()*window.innerHeight+"px";
  img.style.left = Math.random()*window.innerWidth+"px";
  document.body.appendChild(img);

  img.style.opacity = 1;
  setTimeout(()=> img.remove(), 100);
}

setInterval(()=>{
  if(Math.random() < 0.1) flashFace();
}, 2000);

// ===== TEXT REACTS TO MOUSE =====
document.addEventListener("mousemove", e=>{
  if(Math.random() < 0.02) {
    typeLine("stop moving");
  }
});

// ===== TERMINAL MESSAGES =====
const msgs = [
  "you opened it",
  "it noticed",
  "too late now",
  "stay quiet",
  "don't look away"
];

setInterval(()=>{
  typeLine(msgs[Math.floor(Math.random()*msgs.length)]);
}, 2000);

// ===== FULL SILENCE EVENT =====
setTimeout(()=>{
  speechSynthesis.cancel();
  terminal.innerHTML = "";
}, 20000);

</script>
</body>
</html>
