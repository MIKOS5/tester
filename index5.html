<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>📻 RadioWave Pro (Offline)</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>

<style>

/* ===== YOUR CSS UNCHANGED ===== */
:root{
  --bg:#09111d;
  --panel:#111827;
  --panel2:#182233;
  --line:#253347;
  --text:#ffffff;
  --muted:#93a4bb;
  --blue:#2793ff;
  --blue2:#1869d9;
  --green:#17c964;
  --shadow:0 10px 30px rgba(0,0,0,.35);
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:Inter,sans-serif;
  background: radial-gradient(circle at top,#17263f,#09111d 45%);
  color:white;
  display:flex;
  height:100vh;
  overflow:hidden;
}

/* keep ALL your existing CSS exactly as-is */
</style>

</head>

<body>

<div class="sidebar">

  <div class="logo">📻 Radio<span>Wave</span></div>
  <div class="subtitle">Offline JSON Radio Player</div>

  <input id="genre" class="search" placeholder="Search genre..." />

  <button class="main-btn" onclick="applyFilter()">🔎 Search</button>

  <div class="grid-buttons">
    <button onclick="prevPage()">⬅ Prev</button>
    <button onclick="nextPage()">Next ➜</button>
    <button onclick="loadStations()">🔄 Reload</button>
    <button onclick="loadFavorites()">⭐ Favorites</button>
  </div>

  <div class="radio-player">

    <div class="player-header">
      <div class="station-icon">📻</div>

      <div>
        <div id="npName">Not Playing</div>
        <div id="npMeta">Select a station</div>

        <div class="live">
          <div class="live-dot"></div>
          LIVE RADIO
        </div>
      </div>
    </div>

    <audio id="player"></audio>

    <div class="controls">
      <button onclick="prevStation()">⏮</button>
      <button id="playBtn" onclick="togglePlay()">▶</button>
      <button onclick="nextStation()">⏭</button>
      <button onclick="toggleFavCurrent()">⭐</button>
    </div>

    <div class="volume">
      <label>Volume</label>
      <input type="range" min="0" max="1" step="0.01"
        onchange="setVolume(this.value)"/>
    </div>

  </div>

  <div class="status" id="status">Loading...</div>

</div>

<div class="main">

  <div class="topbar">
    <div>
      <div class="page-title">United States Radio</div>
      <div class="count" id="count">0 stations</div>
    </div>

    <div class="page-box" id="pageInfo">Page 1</div>
  </div>

  <div class="table-wrap">
    <table id="table">
      <thead>
        <tr>
          <th>Station</th>
          <th>Country</th>
          <th>Genre</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div id="mobileList"></div>

</div>

<script>

/* =========================
   OFFLINE STORAGE KEYS
========================= */

const CACHE_KEY = "radiowave_stations_v1";
const FAV_KEY   = "radiowave_favorites_v1";

/* =========================
   API (OPTIONAL ONLY FOR FIRST LOAD)
========================= */

const API =
"https://all.api.radio-browser.info/json/stations/search";

/* =========================
   STATE
========================= */

let stations = [];
let allStations = [];
let favorites = [];
let favoriteIds = new Set();
let currentList = [];
let currentIndex = -1;
let page = 0;
const limit = 50;
let isPlaying = false;

/* =========================
   JSON STORAGE HELPERS
========================= */

function saveJSON(key, data){
  localStorage.setItem(key, JSON.stringify(data));
}

function loadJSON(key){
  try{
    return JSON.parse(localStorage.getItem(key));
  }catch(e){
    return null;
  }
}

/* =========================
   STATIONS (ONLINE + OFFLINE CACHE)
========================= */

async function loadStations(){

  setStatus("Loading stations...");

  try{

    const res = await fetch(
      `${API}?countrycode=US&limit=${limit}&offset=${page*limit}&hidebroken=true`
    );

    const data = await res.json();

    stations = data;
    allStations = [...data];
    currentList = data;

    saveJSON(CACHE_KEY, data);

    render();
    setStatus("Stations loaded (online)");

  }catch(err){

    const cache = loadJSON(CACHE_KEY);

    if(cache){

      stations = cache;
      allStations = [...cache];
      currentList = cache;

      render();

      setStatus("Offline mode (cached stations)");

    } else {

      setStatus("No stations available offline");

    }
  }
}

/* =========================
   FAVORITES (FULL OFFLINE JSON)
========================= */

function loadFavorites(){

  const data = loadJSON(FAV_KEY) || [];

  favorites = data;

  favoriteIds = new Set(
    favorites.map(f => f.id)
  );

  currentList = favorites;

  render();

  setStatus(`Loaded ${favorites.length} favorites`);
}

function saveFavorite(s){

  const id = s.stationuuid || s.id;
  if(!id) return;

  const exists = favoriteIds.has(id);
  if(exists){
    setStatus("Already in favorites");
    return;
  }

  favorites.push({
    id,
    name: s.name || "",
    url: s.url_resolved || s.url || "",
    country: s.country || "",
    tags: s.tags || ""
  });

  favoriteIds.add(id);

  saveJSON(FAV_KEY, favorites);

  setStatus("⭐ Saved offline");
  render();
}

/* =========================
   PLAYER
========================= */

function playStation(id){

  const item = currentList.find(s =>
    (s.stationuuid || s.id) === id
  );

  if(!item) return;

  currentIndex = currentList.findIndex(s =>
    (s.stationuuid || s.id) === id
  );

  const player = document.getElementById("player");

  player.src = item.url_resolved || item.url || "";
  player.play();

  isPlaying = true;
  document.getElementById("playBtn").textContent = "⏸";

  updateNowPlaying();
}

function updateNowPlaying(){

  const item = currentList[currentIndex];
  if(!item) return;

  document.getElementById("npName").textContent = item.name || "Unknown";
  document.getElementById("npMeta").textContent =
    `${item.country || ""} • ${item.tags || ""}`;
}

/* =========================
   CONTROLS
========================= */

function togglePlay(){

  const p = document.getElementById("player");
  const b = document.getElementById("playBtn");

  if(!p.src) return;

  if(isPlaying){
    p.pause();
    isPlaying = false;
    b.textContent = "▶";
  } else {
    p.play();
    isPlaying = true;
    b.textContent = "⏸";
  }
}

function nextStation(){
  if(!currentList.length) return;
  currentIndex = (currentIndex + 1) % currentList.length;
  playStation(currentList[currentIndex].stationuuid || currentList[currentIndex].id);
}

function prevStation(){
  if(!currentList.length) return;
  currentIndex = (currentIndex - 1 + currentList.length) % currentList.length;
  playStation(currentList[currentIndex].stationuuid || currentList[currentIndex].id);
}

function toggleFavCurrent(){
  const item = currentList[currentIndex];
  if(item) saveFavorite(item);
}

function setVolume(v){
  document.getElementById("player").volume = v;
}

/* =========================
   FILTER
========================= */

function applyFilter(){

  const g = document.getElementById("genre").value.toLowerCase();

  currentList = !g
    ? [...allStations]
    : allStations.filter(s =>
        (s.tags || "").toLowerCase().includes(g)
      );

  render();
}

/* =========================
   PAGING
========================= */

function nextPage(){ page++; loadStations(); }
function prevPage(){ if(page>0) page--; loadStations(); }

/* =========================
   RENDER
========================= */

function render(){

  const tbody = document.querySelector("#table tbody");
  tbody.innerHTML = "";

  currentList.forEach(s => {

    const id = s.stationuuid || s.id;

    tbody.innerHTML += `
      <tr>
        <td>${s.name || "Unknown"}</td>
        <td>${s.country || ""}</td>
        <td>${s.tags || ""}</td>
        <td>
          <button onclick="playStation('${id}')">▶</button>
          <button onclick='saveFavorite(${JSON.stringify(s)})'>⭐</button>
        </td>
      </tr>
    `;
  });

  document.getElementById("count").textContent =
    `${currentList.length} stations`;

}

/* =========================
   STATUS
========================= */

function setStatus(t){
  document.getElementById("status").textContent = t;
}

/* =========================
   INIT
========================= */

loadStations();

</script>

</body>
</html>
