<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>📻RADIOWAVE📻</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0f14;
  color: #fff;
  display: flex;
  height: 100vh;
}

/* SIDEBAR */
.sidebar {
  width: 240px;
  background: #111826;
  padding: 16px;
  box-sizing: border-box;
  border-right: 1px solid #1f2a3a;
}

h2 { margin: 0 0 10px; }

input, button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
  border: none;
  font-size: 14px;
}

button {
  background: #1e88e5;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #1565c0;
}

/* MAIN */
.main {
  flex: 1;
  padding: 16px;
  overflow: auto;
}

.topbar {
  display: flex;
  gap: 10px;
  margin-bottom: 10px;
}

.smallbtn {
  flex: 1;
  padding: 10px;
  font-size: 13px;
}

/* TABLE */
table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  padding: 12px;
  border-bottom: 1px solid #1f2a3a;
}

tr:hover {
  background: #182233;
}

/* MOBILE CARDS */
.card {
  background: #121a28;
  padding: 12px;
  margin-bottom: 10px;
  border-radius: 10px;
  border: 1px solid #1f2a3a;
}

.card.active {
  border: 2px solid #1e88e5;
}

.card-title {
  font-weight: bold;
}

.card-meta {
  font-size: 12px;
  color: #aaa;
  margin: 6px 0;
}

/* PLAYER */
.player-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #0f1722;
  border-top: 1px solid #1f2a3a;
  padding: 10px;
}

audio {
  width: 100%;
}

/* STATUS */
.status {
  font-size: 12px;
  color: #aaa;
  margin-top: 10px;
}

/* RESPONSIVE */
@media (max-width: 768px) {
  body { flex-direction: column; }

  .sidebar {
    width: 100%;
    border-right: none;
    border-bottom: 1px solid #1f2a3a;
  }

  table { display: none; }
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>RADIOWAVE</h2>

  <input id="genre" placeholder="Genre filter" />
  <button onclick="applyFilter()">Apply Genre</button>

  <button onclick="prevPage()">⬅ Prev 50</button>
  <button onclick="nextPage()">Next 50 ➜</button>

  <button onclick="loadStations()">Refresh</button>
  <button onclick="loadFavorites()">Favorites</button>

  <div class="status" id="status">Loading...</div>

  <!-- 🎧 RADIO PLAYER DOCK -->
  <div class="radio-player">
    
    <div class="now-playing">
      <div id="npName">Not playing</div>
      <div id="npMeta">Select a station</div>
    </div>

    <audio id="player"></audio>

    <div class="controls">
      <button onclick="prevStation()">⏮</button>
      <button onclick="togglePlay()" id="playBtn">▶</button>
      <button onclick="nextStation()">⏭</button>
      <button onclick="toggleFavCurrent()">⭐</button>
    </div>

  </div>
</div>

<!-- MAIN -->
<div class="main">

  <div class="topbar">
    <button class="smallbtn" onclick="loadStations()">Stations</button>
    <button class="smallbtn" onclick="loadFavorites()">Favs</button>
  </div>

  <table id="table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Country</th>
        <th>Genre</th>
        <th>Play / Fav</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div id="mobileList"></div>

</div>

<!-- PLAYER -->
<div class="player-bar">
  <audio id="player" controls autoplay></audio>
</div>

<script>

const API = "https://all.api.radio-browser.info/json/stations/search";
const SHEET_API = "https://script.google.com/macros/s/AKfycbzZ5MwOcYUY_bpsUKSxPd810xE8rV_Y3z2GwzPublb_4O60CP8L_lC_V2kqkCQ_JdF5/exec";

let stations = [];
let favorites = [];
let favoriteIds = new Set();

let mode = "stations";
let activeStationId = null;

let page = 0;
const limit = 50;

/* LOAD STATIONS */
async function loadStations() {
  mode = "stations";
  setStatus("Loading stations...");

  const offset = page * limit;

  const res = await fetch(
    `${API}?countrycode=US&limit=${limit}&offset=${offset}&hidebroken=true`
  );

  stations = await res.json();
  activeStationId = null;

  render();
}

/* FAVORITES */
async function loadFavorites() {
  setStatus("Loading favorites...");

  const res = await fetch(SHEET_API + "?action=get");
  const data = await res.json().catch(()=>[]);

  favorites = data.data || data;
  favoriteIds = new Set(favorites.map(f => f.stationuuid));

  mode = "favorites";
  render();

  setStatus(`Favorites: ${favorites.length}`);
}

/* PLAY */
function playStation(id) {
  const list = mode === "stations" ? stations : favorites;
  const item = list.find(s => s.stationuuid === id);

  if (!item) return;

  activeStationId = id;

  const player = document.getElementById("player");
  player.src = item.url_resolved || item.url;
  player.play();

  render();
}

/* ⭐ FAVORITE TOGGLE */
async function toggleFavorite(s) {
  const exists = favoriteIds.has(s.stationuuid);

  if (!exists) {
    await fetch(SHEET_API, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({
        action: "save",
        id: s.stationuuid,
        name: s.name,
        url: s.url_resolved || s.url,
        country: s.country,
        genre: s.tags || "all",
        time: new Date().toISOString()
      })
    });

    favoriteIds.add(s.stationuuid);
    setStatus("⭐ Added to favorites");
  } else {
    setStatus("Already in favorites");
  }

  render();
}

/* PAGINATION */
function nextPage() {
  page++;
  loadStations();
}

function prevPage() {
  if (page > 0) {
    page--;
    loadStations();
  }
}

/* FILTER */
function applyFilter() {
  const g = document.getElementById("genre").value.toLowerCase();
  stations = stations.filter(s =>
    (s.tags || "").toLowerCase().includes(g)
  );
  render();
}

/* RENDER */
function render() {
  renderTable();
  renderMobile();
}

/* TABLE */
function renderTable() {
  const tbody = document.querySelector("#table tbody");
  tbody.innerHTML = "";

  const list = mode === "stations" ? stations : favorites;

  list.forEach(s => {
    const isFav = favoriteIds.has(s.stationuuid);

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${s.name || ""}</td>
      <td>${s.country || ""}</td>
      <td>${s.tags || ""}</td>
      <td>
        <button onclick="playStation('${s.stationuuid}')">▶</button>
        <button onclick='toggleFavorite(${JSON.stringify(s)})'>
          ${isFav ? "⭐" : "☆"}
        </button>
      </td>
    `;

    tbody.appendChild(tr);
  });
}

/* MOBILE */
function renderMobile() {
  const el = document.getElementById("mobileList");
  el.innerHTML = "";

  const list = mode === "stations" ? stations : favorites;

  list.forEach(s => {
    const isFav = favoriteIds.has(s.stationuuid);

    const div = document.createElement("div");
    div.className = "card" + (s.stationuuid === activeStationId ? " active" : "");

    div.innerHTML = `
      <div class="card-title">${s.name || ""}</div>
      <div class="card-meta">${s.country || ""} • ${s.tags || ""}</div>
      <button onclick="playStation('${s.stationuuid}')">▶ Play</button>
      <button onclick='toggleFavorite(${JSON.stringify(s)})'>
        ${isFav ? "⭐ Favorited" : "☆ Favorite"}
      </button>
    `;

    el.appendChild(div);
  });
}

/* STATUS */
function setStatus(t) {
  document.getElementById("status").textContent = t;
}

/* INIT */
loadStations();

</script>

</body>
</html>
