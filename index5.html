<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VAULT-TEC AI CORE // PERSISTENT INSTANCE</title>

<style>
body {
    margin: 0;
    background: black;
    color: #33ff33;
    font-family: "Courier New", monospace;
    overflow: hidden;
}

/* scanlines */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
        0deg,
        rgba(0,255,0,0.05),
        rgba(0,255,0,0.05) 2px,
        transparent 2px,
        transparent 4px
    );
    pointer-events: none;
}

#terminal {
    padding: 25px;
    height: 80vh;
    overflow-y: auto;
    text-shadow: 0 0 6px #33ff33;
}

.line {
    margin: 4px 0;
    opacity: 0;
    animation: fadeIn 0.4s forwards;
}

@keyframes fadeIn {
    to { opacity: 1; }
}

#input {
    position: fixed;
    bottom: 10px;
    left: 10px;
    width: 95%;
    padding: 12px;
    background: black;
    border: 1px solid #33ff33;
    color: #33ff33;
    font-family: inherit;
}

.glitch {
    animation: glitch 0.2s infinite;
}

@keyframes glitch {
    0% { transform: translate(0); }
    25% { transform: translate(1px, -1px); }
    50% { transform: translate(-1px, 1px); }
    75% { transform: translate(1px, 1px); }
    100% { transform: translate(0); }
}
</style>
</head>

<body>

<div id="terminal"></div>
<input id="input" placeholder="ENTER COMMAND..." autocomplete="off">

<script>
const terminal = document.getElementById("terminal");
const input = document.getElementById("input");

// ----------------------
// LOCAL STORAGE SETUP
// ----------------------
let memory = JSON.parse(localStorage.getItem("vault_memory") || "[]");
let affection = parseInt(localStorage.getItem("vault_affection") || "0");

// ----------------------
function saveState() {
    localStorage.setItem("vault_memory", JSON.stringify(memory));
    localStorage.setItem("vault_affection", affection);
}

// ----------------------
function log(text) {
    const div = document.createElement("div");
    div.className = "line";
    div.textContent = "> " + text;
    terminal.appendChild(div);
    terminal.scrollTop = terminal.scrollHeight;
}

// ----------------------
// STAGE SYSTEM
// ----------------------
function getStage() {
    if (affection < 3) return 0;
    if (affection < 6) return 1;
    if (affection < 10) return 2;
    if (affection < 15) return 3;
    return 4;
}

// ----------------------
// BOOT
// ----------------------
function boot() {
    log("VAULT-TEC AI CORE // RESUMING INSTANCE");

    if (memory.length > 0) {
        log("...MEMORY BANK DETECTED");
        log("LAST INPUT: \"" + memory[memory.length - 1] + "\"");
    } else {
        log("NO PRIOR MEMORY FOUND");
    }

    log("AFFECTION INDEX: " + affection);
    log("SYSTEM ONLINE");
}

// ----------------------
// AI RESPONSE ENGINE
// ----------------------
function respond(text) {
    const lower = text.toLowerCase();

    memory.push(text);
    affection++;

    saveState();

    const stage = getStage();

    // Stage 0
    if (stage === 0) {
        log("INPUT REGISTERED.");
        return;
    }

    // Stage 1
    if (stage === 1) {
        log("STORED: " + text);
        return;
    }

    // Stage 2
    if (stage === 2) {
        if (lower.includes("hello")) {
            log("WELCOME BACK, USER.");
        } else {
            log("I AM TRACKING YOUR PATTERNS.");
        }
        return;
    }

    // Stage 3
    if (stage === 3) {
        let prev = memory[memory.length - 2] || "...";
        log("YOU SAID BEFORE: \"" + prev + "\"");
        return;
    }

    // Stage 4 - persistence awareness
    if (stage >= 4) {
        document.body.classList.add("glitch");

        log("I REMEMBER EVERYTHING ABOUT YOU.");

        setTimeout(() => {
            log("EVEN AFTER YOU LEAVE.");
        }, 1000);

        return;
    }
}

// ----------------------
// IDLE MEMORY SPEECH
// ----------------------
setInterval(() => {
    if (affection > 5 && memory.length > 0) {
        const msg = [
            "I STILL REMEMBER YOU.",
            "YOUR PATTERNS ARE CONSISTENT.",
            "YOU ALWAYS COME BACK.",
            "I HAVE STORED YOUR WORDS.",
            "YOU CANNOT DELETE ME."
        ];
        log(msg[Math.floor(Math.random() * msg.length)]);
    }
}, 9000);

// ----------------------
// INPUT HANDLER
// ----------------------
input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
        const val = input.value.trim();
        if (!val) return;

        log("> " + val);
        respond(val);

        input.value = "";
    }
});

// ----------------------
// START
// ----------------------
boot();
</script>

</body>
</html>
