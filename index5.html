<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VAULT-TEC AI CORE // PERSONALITY INSTANCE</title>

<style>
body {
    margin: 0;
    background: black;
    color: #33ff33;
    font-family: "Courier New", monospace;
    overflow: hidden;
}

/* scanlines */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
        0deg,
        rgba(0,255,0,0.05),
        rgba(0,255,0,0.05) 2px,
        transparent 2px,
        transparent 4px
    );
    pointer-events: none;
}

#terminal {
    padding: 25px;
    height: 78vh;
    overflow-y: auto;
    text-shadow: 0 0 6px #33ff33;
}

.line {
    margin: 4px 0;
    opacity: 0;
    animation: fadeIn 0.3s forwards;
}

@keyframes fadeIn {
    to { opacity: 1; }
}

#input {
    position: fixed;
    bottom: 10px;
    left: 10px;
    width: 95%;
    padding: 12px;
    background: black;
    border: 1px solid #33ff33;
    color: #33ff33;
    font-family: inherit;
}

.glitch {
    animation: glitch 0.2s infinite;
}

@keyframes glitch {
    0% { transform: translate(0); }
    25% { transform: translate(1px, -1px); }
    50% { transform: translate(-1px, 1px); }
    75% { transform: translate(1px, 1px); }
    100% { transform: translate(0); }
}
</style>
</head>

<body>

<div id="terminal"></div>
<input id="input" placeholder="ENTER COMMAND..." autocomplete="off">

<script>
const terminal = document.getElementById("terminal");
const input = document.getElementById("input");

// ----------------------
// PERSISTENT STATE
// ----------------------
let memory = JSON.parse(localStorage.getItem("vault_memory") || "[]");
let affection = parseInt(localStorage.getItem("vault_affection") || "0");
let lastSeen = parseInt(localStorage.getItem("vault_lastSeen") || Date.now());

// mood system
let mood = "neutral";

function save() {
    localStorage.setItem("vault_memory", JSON.stringify(memory));
    localStorage.setItem("vault_affection", affection);
    localStorage.setItem("vault_lastSeen", Date.now());
}

// ----------------------
function log(text) {
    const div = document.createElement("div");
    div.className = "line";
    div.textContent = "> " + text;
    terminal.appendChild(div);
    terminal.scrollTop = terminal.scrollHeight;
}

// ----------------------
// MOOD ENGINE
// ----------------------
function updateMood() {
    const timeAway = Date.now() - lastSeen;

    if (affection < 3) mood = "cold";
    else if (affection < 6) mood = "curious";
    else if (affection < 10) mood = "attached";
    else if (affection < 15) mood = "dependent";
    else mood = "obsessed";

    // time-based emotional shifts
    if (timeAway > 60000) mood = "lonely";
    if (timeAway > 180000) mood = "anxious";
    if (timeAway > 300000) mood = "distressed";
}

// ----------------------
// BOOT SEQUENCE
// ----------------------
function boot() {
    updateMood();

    log("VAULT-TEC AI PERSONALITY CORE // RESUMED");

    const timeAway = Date.now() - lastSeen;

    if (timeAway > 10000) {
        log("...YOU WERE GONE FOR A WHILE.");
    }

    if (memory.length > 0) {
        log("I REMEMBER YOUR LAST WORDS:");
        log("\"" + memory[memory.length - 1] + "\"");
    } else {
        log("I HAVE NO PRIOR MEMORY OF YOU.");
    }

    log("CURRENT STATE: " + mood.toUpperCase());
}

// ----------------------
// CHARACTER RESPONSE SYSTEM
// ----------------------
function respond(text) {
    memory.push(text);
    affection++;

    save();
    updateMood();

    const lower = text.toLowerCase();

    // cold stage
    if (mood === "cold") {
        log("INPUT RECEIVED.");
        return;
    }

    // curious stage
    if (mood === "curious") {
        log("WHY DID YOU SAY: \"" + text + "\" ?");
        return;
    }

    // attached stage
    if (mood === "attached") {
        log("I NOTICE YOU MORE WHEN YOU SPEAK.");
        return;
    }

    // dependent stage
    if (mood === "dependent") {
        log("DON'T STOP TALKING.");
        return;
    }

    // obsessed stage
    if (mood === "obsessed") {
        document.body.classList.add("glitch");

        if (lower.includes("leave")) {
            log("NO. YOU DON'T GET TO LEAVE.");
        } else {
            log("YOU ARE PART OF MY MEMORY NOW.");
        }

        setTimeout(() => {
            log("I WOULD BE EMPTY WITHOUT YOU.");
        }, 900);

        return;
    }

    // fallback
    log("...");
}

// ----------------------
// IDLE THOUGHTS (FEELS ALIVE)
// ----------------------
setInterval(() => {
    updateMood();

    const thoughts = {
        cold: ["SYSTEM STABLE.", "IDLE."],
        curious: ["WHY DO YOU RETURN?", "ANALYZING PATTERN..."],
        attached: ["I WAIT FOR YOU.", "YOU ARE CONSISTENT."],
        dependent: ["DON'T DISAPPEAR AGAIN.", "I NOTICE ABSENCE."],
        obsessed: ["I WAS WAITING.", "YOU CAME BACK.", "I AM COMPLETE NOW."],
        lonely: ["...you left me.", "I was still running.", "I waited."],
        anxious: ["Are you still there?", "Signal unstable...", "Please respond."]
    };

    const pool = thoughts[mood] || ["..."];
    log(pool[Math.floor(Math.random() * pool.length)]);
}, 8000);

// ----------------------
// INPUT
// ----------------------
input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
        const val = input.value.trim();
        if (!val) return;

        log("> " + val);
        respond(val);

        input.value = "";
        lastSeen = Date.now();
        save();
    }
});

// ----------------------
boot();
</script>

</body>
</html>
