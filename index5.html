<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>we know where you are</title>
<style>
body {
  margin:0;
  overflow:hidden;
  background:black;
  color:#0f0;
  font-family: monospace;
}

#terminal {
  position:absolute;
  width:100%;
  height:100%;
  padding:20px;
}

#map {
  position:absolute;
  bottom:10px;
  right:10px;
  width:300px;
  height:200px;
  border:2px solid red;
}

.red { color:red; }
</style>
</head>
<body>
<div id="terminal"></div>
<iframe id="map"></iframe>

<script>
const terminal = document.getElementById("terminal");
const map = document.getElementById("map");

function typeLine(text, speed=20) {
  let i = 0;
  const line = document.createElement("div");
  terminal.appendChild(line);

  const interval = setInterval(() => {
    line.textContent += text[i];
    i++;
    if (i >= text.length) clearInterval(interval);
  }, speed);
}

function rand(min,max){return Math.random()*(max-min)+min}

// ===== FAKE COORDINATES =====
const coords = {
  lat: rand(-90,90).toFixed(5),
  lon: rand(-180,180).toFixed(5)
};

// ===== MAP (USING OPENSTREETMAP EMBED) =====
map.src = `https://www.openstreetmap.org/export/embed.html?bbox=${coords.lon-0.01}%2C${coords.lat-0.01}%2C${coords.lon+0.01}%2C${coords.lat+0.01}&layer=mapnik&marker=${coords.lat}%2C${coords.lon}`;

// ===== FAKE SCAN =====
setTimeout(()=> typeLine("initializing location trace..."),1000);
setTimeout(()=> typeLine("bypassing vpn..."),2500);
setTimeout(()=> typeLine("locking coordinates..."),4000);

setTimeout(()=> typeLine(`latitude: ${coords.lat}`),5500);
setTimeout(()=> typeLine(`longitude: ${coords.lon}`),7000);

setTimeout(()=> typeLine("rendering satellite view..."),8500);

// ===== EXTRA FAKE DETAILS =====
setTimeout(()=> typeLine("accuracy: 3 meters"),10000);
setTimeout(()=> typeLine("signal strength: strong"),11500);

setTimeout(()=>{
  const warn = document.createElement("div");
  warn.className = "red";
  warn.textContent = "this isn't your location... but what if it was";
  terminal.appendChild(warn);
},13000);

// ===== WHISPER =====
let enabled=false;
document.addEventListener("click",()=>enabled=true);

function whisper(text){
  const u=new SpeechSynthesisUtterance(text);
  u.volume=0.2;
  u.rate=0.7;
  u.pitch=0.4;
  speechSynthesis.speak(u);
}

setInterval(()=>{
  if(!enabled) return;
  whisper("we found you...");
},6000);

</script>
</body>
</html>
