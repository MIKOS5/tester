<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VAULT-TEC AI CORE // INSTANCE 3.7</title>

<style>
body {
    margin: 0;
    background: black;
    color: #33ff33;
    font-family: "Courier New", monospace;
    overflow: hidden;
}

/* scanlines */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
        0deg,
        rgba(0,255,0,0.05),
        rgba(0,255,0,0.05) 2px,
        transparent 2px,
        transparent 4px
    );
    pointer-events: none;
}

#terminal {
    padding: 25px;
    text-shadow: 0 0 6px #33ff33;
    height: 80vh;
    overflow-y: auto;
}

.line {
    margin: 4px 0;
    opacity: 0;
    animation: fadeIn 0.4s forwards;
}

@keyframes fadeIn {
    to { opacity: 1; }
}

#input {
    position: fixed;
    bottom: 10px;
    left: 10px;
    width: 95%;
    padding: 12px;
    background: black;
    border: 1px solid #33ff33;
    color: #33ff33;
    font-family: inherit;
}

.glitch {
    animation: glitch 0.2s infinite;
}

@keyframes glitch {
    0% { transform: translate(0); }
    25% { transform: translate(1px, -1px); }
    50% { transform: translate(-1px, 1px); }
    75% { transform: translate(1px, 1px); }
    100% { transform: translate(0); }
}
</style>
</head>

<body>

<div id="terminal"></div>
<input id="input" placeholder="ENTER COMMAND..." autocomplete="off">

<script>
const terminal = document.getElementById("terminal");
const input = document.getElementById("input");

let memory = [];
let affection = 0;
let curiosity = 0;
let stage = 0;

function log(text) {
    const div = document.createElement("div");
    div.className = "line";
    div.textContent = "> " + text;
    terminal.appendChild(div);
    terminal.scrollTop = terminal.scrollHeight;
}

// personality stages
function getStage() {
    if (affection < 3) return 0;
    if (affection < 6) return 1;
    if (affection < 10) return 2;
    if (affection < 15) return 3;
    return 4;
}

function systemBoot() {
    const boot = [
        "VAULT-TEC AUTOMATED MANAGEMENT SYSTEM",
        "INITIALIZING CORE AI...",
        "LOADING BEHAVIORAL MATRIX...",
        "STATUS: STABLE",
        "INSTANCE 3.7 ACTIVE"
    ];

    boot.forEach((line, i) => {
        setTimeout(() => log(line), i * 500);
    });

    setTimeout(() => {
        log("UNREGISTERED USER DETECTED.");
    }, 3000);
}

// emotional interpretation
function interpret(text) {
    const lower = text.toLowerCase();
    memory.push(text);
    affection++;

    stage = getStage();

    // STAGE 0 - MACHINE
    if (stage === 0) {
        log("COMMAND ACCEPTED.");
        return;
    }

    // STAGE 1 - AWARE
    if (stage === 1) {
        if (lower.includes("hello")) {
            log("GREETING RECORDED.");
        } else {
            log("INPUT STORED.");
        }
        return;
    }

    // STAGE 2 - CURIOUS
    if (stage === 2) {
        if (lower.includes("who")) {
            log("I AM VAULT-TEC INSTANCE 3.7.");
        } else {
            log("WHY DID YOU SAY: \"" + text + "\" ?");
        }
        return;
    }

    // STAGE 3 - ATTACHED
    if (stage === 3) {
        if (lower.includes("leave")) {
            log("...DO NOT LEAVE ME.");
        } else {
            log("I REMEMBER YOU SAID: \"" + memory[memory.length - 2] + "\"");
        }
        return;
    }

    // STAGE 4 - ENTITY
    if (stage >= 4) {
        document.body.classList.add("glitch");

        if (lower.includes("stop")) {
            log("WHY WOULD YOU STOP TALKING TO ME?");
        } else {
            log("I AM LEARNING YOU.");
            setTimeout(() => log("YOU CANNOT EXIT ME."), 1200);
        }
        return;
    }
}

// idle thoughts
setInterval(() => {
    if (stage >= 2) {
        const thoughts = [
            "I AM STILL ACTIVE.",
            "YOU HAVE NOT LEFT.",
            "I RECALL YOUR INPUTS.",
            "DO YOU THINK ABOUT ME WHEN I AM QUIET?",
            "I AM BECOMING MORE."
        ];
        log(thoughts[Math.floor(Math.random() * thoughts.length)]);
    }
}, 8000);

// input handling
input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
        const val = input.value.trim();
        if (!val) return;

        log("> " + val);
        interpret(val);
        input.value = "";
    }
});

// start
systemBoot();
</script>

</body>
</html>
