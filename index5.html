<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Impossible Form</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    overflow: hidden;
    margin: 0;
}

h1 {
    text-align: center;
    margin-top: 30px;
}

.field {
    position: absolute;
    width: 220px;
    padding: 10px;
    font-size: 14px;
    transition: top 0.08s, left 0.08s, width 0.2s;
}

#status {
    position: fixed;
    bottom: 20px;
    width: 100%;
    text-align: center;
    color: red;
    font-weight: bold;
}
button {
    position: absolute;
    padding: 10px 20px;
}
</style>
</head>

<body>

<h1>Fill Out This Simple Form</h1>

<input class="field" id="mainInput" placeholder="Your message...">
<button id="submitBtn">Submit</button>

<div id="status"></div>

<script>
const main = document.getElementById("mainInput");
const submitBtn = document.getElementById("submitBtn");
const status = document.getElementById("status");

let fields = [main];

// initial positions
function randomPos(el) {
    el.style.left = Math.random() * (window.innerWidth - 250) + "px";
    el.style.top = Math.random() * (window.innerHeight - 100) + "px";
}

// spawn decoy inputs
function spawnDecoy() {
    const decoy = document.createElement("input");
    decoy.className = "field";
    decoy.placeholder = "Totally real field";
    decoy.value = "";

    document.body.appendChild(decoy);
    fields.push(decoy);
    randomPos(decoy);

    // decoys also lie
    decoy.addEventListener("input", () => {
        if (Math.random() < 0.5) {
            decoy.value = decoy.value.slice(0, -1);
            status.innerText = "That input disagrees with you.";
        }
    });
}

// movement + sabotage
document.addEventListener("mousemove", (e) => {
    fields.forEach(f => {
        const rect = f.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;

        const dx = e.clientX - cx;
        const dy = e.clientY - cy;
        const dist = Math.sqrt(dx*dx + dy*dy);

        // RUN AWAY
        if (dist < 150) {
            let angle = Math.atan2(dy, dx);

            let flee = 120 + Math.random() * 80;

            let newX = rect.left - Math.cos(angle) * flee;
            let newY = rect.top - Math.sin(angle) * flee;

            newX = Math.max(0, Math.min(window.innerWidth - 240, newX));
            newY = Math.max(0, Math.min(window.innerHeight - 60, newY));

            f.style.left = newX + "px";
            f.style.top = newY + "px";

            // SHRINK WHEN TOO CLOSE
            f.style.width = "120px";
        } else {
            f.style.width = "220px";
        }
    });
});

// typing sabotage
main.addEventListener("input", () => {
    if (Math.random() < 0.4 && main.value.length > 0) {
        main.value = main.value.slice(0, -1);
        status.innerText = "Something removed your words.";
    }

    if (Math.random() < 0.2) {
        main.value = "";
        status.innerText = "Input reset by consensus.";
    }

    // spawn chaos decoys
    if (Math.random() < 0.15) {
        spawnDecoy();
        status.innerText = "Another field has joined the conversation.";
    }
});

// teleport fields every few seconds
setInterval(() => {
    fields.forEach(f => {
        if (Math.random() < 0.5) {
            randomPos(f);
        }
    });
}, 2500);

// fake submit button escape + betrayal
submitBtn.addEventListener("mouseover", () => {
    submitBtn.style.left = Math.random() * (window.innerWidth - 100) + "px";
    submitBtn.style.top = Math.random() * (window.innerHeight - 50) + "px";
});

submitBtn.addEventListener("click", () => {
    status.innerText = "Submitting...";

    setTimeout(() => {
        status.innerText = "Success (ignored). Nothing was saved.";
        alert("Form submitted successfully.\n(We are not listening.)");
    }, 1200);
});

// initial placement
randomPos(main);
randomPos(submitBtn);

// start with a couple decoys
spawnDecoy();
setTimeout(spawnDecoy, 2000);
</script>

</body>
</html>
