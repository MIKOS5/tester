<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Signal Acquired</title>
<style>
    body {
        margin: 0;
        background: black;
        color: #00ff9f;
        font-family: "Courier New", monospace;
        overflow: hidden;
    }

    #container {
        padding: 20px;
    }

    .glitch {
        font-size: 28px;
        animation: flicker 0.2s infinite;
    }

    @keyframes flicker {
        0% { opacity: 1; }
        50% { opacity: 0.3; }
        100% { opacity: 1; }
    }

    #coords {
        margin-top: 20px;
        font-size: 18px;
    }

    #log {
        margin-top: 20px;
        height: 200px;
        overflow: hidden;
        font-size: 14px;
    }

    .line {
        opacity: 0;
        animation: fadeIn 2s forwards;
    }

    @keyframes fadeIn {
        to { opacity: 1; }
    }

    #overlay {
        position: fixed;
        inset: 0;
        background: radial-gradient(circle, transparent 60%, black 100%);
        pointer-events: none;
    }
</style>
</head>
<body>

<div id="container">
    <div class="glitch">INITIALIZING TRACE...</div>
    <div id="coords">Locating...</div>
    <div id="log"></div>
</div>

<div id="overlay"></div>

<script>
let lat = 0;
let lon = 0;
let targetLat = 0;
let targetLon = 0;

const coordsEl = document.getElementById("coords");
const logEl = document.getElementById("log");

// creepy whisper
function whisper(text) {
    const msg = new SpeechSynthesisUtterance(text);
    msg.volume = 0.2;
    msg.rate = 0.6;
    msg.pitch = 0.5;
    speechSynthesis.speak(msg);
}

// add log lines
function addLog(text) {
    const div = document.createElement("div");
    div.className = "line";
    div.textContent = "> " + text;
    logEl.appendChild(div);

    if (logEl.children.length > 10) {
        logEl.removeChild(logEl.firstChild);
    }
}

// refine coordinates slowly
function updateCoords() {
    lat += (targetLat - lat) * 0.05;
    lon += (targetLon - lon) * 0.05;

    coordsEl.textContent =
        "Lat: " + lat.toFixed(6) +
        " | Lon: " + lon.toFixed(6);

    requestAnimationFrame(updateCoords);
}

// get real location
navigator.geolocation.getCurrentPosition(pos => {
    targetLat = pos.coords.latitude;
    targetLon = pos.coords.longitude;

    // start far away
    lat = targetLat + (Math.random() * 10 - 5);
    lon = targetLon + (Math.random() * 10 - 5);

    addLog("Signal detected...");
    setTimeout(() => addLog("Refining position..."), 2000);
    setTimeout(() => addLog("Cross-referencing data..."), 4000);
    setTimeout(() => addLog("Identity pattern found."), 7000);

    setTimeout(() => whisper("we see you"), 5000);
    setTimeout(() => whisper("don’t move"), 9000);

}, () => {
    addLog("Location access denied.");
    whisper("you can't hide");
});

// random creepy logs
const messages = [
    "Tracking movement...",
    "Heartbeat pattern irregular...",
    "Device recognized.",
    "You’ve been here before.",
    "Signal interference detected.",
    "Watching...",
    "Still there?",
    "Why are you reading this?"
];

setInterval(() => {
    const msg = messages[Math.floor(Math.random() * messages.length)];
    addLog(msg);
}, 3000);

// start animation
updateCoords();

// flicker title text over time
setTimeout(() => {
    document.querySelector(".glitch").textContent = "SIGNAL LOCKED";
}, 10000);

setTimeout(() => {
    document.querySelector(".glitch").textContent = "YOU ARE NOT ALONE";
    whisper("you are not alone");
}, 15000);
</script>

</body>
</html>
