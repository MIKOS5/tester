<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tracking...</title>
<style>
body { margin:0; overflow:hidden; background:black; color:#0f0; font-family: monospace; }
#terminal { position:absolute; width:100%; height:100%; padding:20px; }
#map { position:absolute; bottom:10px; right:10px; width:300px; height:200px; border:2px solid red; }
.red { color:red; }
</style>
</head>
<body>
<div id="terminal"></div>
<iframe id="map"></iframe>

<script>
const terminal = document.getElementById("terminal");
const map = document.getElementById("map");

function typeLine(text, speed=20) {
  let i = 0;
  const line = document.createElement("div");
  terminal.appendChild(line);
  const interval = setInterval(() => {
    line.textContent += text[i];
    i++;
    if (i >= text.length) clearInterval(interval);
  }, speed);
}

function rand(min,max){return Math.random()*(max-min)+min}

// ===== START WITH WIDE RANDOM LOCATION =====
let targetLat = rand(-90,90);
let targetLon = rand(-180,180);

let currentLat = targetLat + rand(-1,1);
let currentLon = targetLon + rand(-1,1);

function updateMap() {
  map.src = `https://www.openstreetmap.org/export/embed.html?bbox=${currentLon-0.01}%2C${currentLat-0.01}%2C${currentLon+0.01}%2C${currentLat+0.01}&layer=mapnik&marker=${currentLat}%2C${currentLon}`;
}

function refineCoords() {
  currentLat += (targetLat - currentLat) * 0.2;
  currentLon += (targetLon - currentLon) * 0.2;

  currentLat += rand(-0.001,0.001);
  currentLon += rand(-0.001,0.001);

  updateMap();

  typeLine(`lat: ${currentLat.toFixed(5)} | lon: ${currentLon.toFixed(5)}`);
}

// ===== SEQUENCE =====
typeLine("initializing trace...");
setTimeout(()=> typeLine("scanning network..."),1500);
setTimeout(()=> typeLine("signal acquired..."),3000);
setTimeout(()=> typeLine("refining location..."),4500);

// start refining loop
setTimeout(()=>{
  setInterval(refineCoords, 2000);
},5000);

// ===== FINAL LOCK =====
setTimeout(()=>{
  typeLine("lock achieved");
  const warn = document.createElement("div");
  warn.className = "red";
  warn.textContent = "we see you";
  terminal.appendChild(warn);
},20000);

// ===== WHISPER =====
let enabled=false;
document.addEventListener("click",()=>enabled=true);

function whisper(text){
  const u=new SpeechSynthesisUtterance(text);
  u.volume=0.2;
  u.rate=0.6;
  u.pitch=0.4;
  speechSynthesis.speak(u);
}

setInterval(()=>{
  if(!enabled) return;
  whisper("locking on...");
},5000);

updateMap();
</script>
</body>
</html>
