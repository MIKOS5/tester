<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Unstable Form</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #fafafa;
    text-align: center;
    padding: 50px;
}

input, textarea {
    width: 300px;
    padding: 10px;
    margin: 10px;
    font-size: 16px;
}

#status {
    color: red;
    height: 20px;
}
</style>
</head>

<body>

<h1>Totally Reliable Form</h1>
<p>Please enter your information carefully.</p>

<input id="name" placeholder="Your Name"><br>
<textarea id="message" placeholder="Your Message"></textarea><br>

<div id="status"></div>

<button onclick="submitForm()">Submit</button>

<script>
const inputs = [document.getElementById("name"), document.getElementById("message")];
const status = document.getElementById("status");

// sabotage typing
inputs.forEach(input => {
    input.addEventListener("input", () => {
        let value = input.value;

        // randomly delete last character
        if (Math.random() < 0.3 && value.length > 0) {
            input.value = value.slice(0, -1);
            status.innerText = "Oops, dropped something...";
        }

        // randomly scramble a character
        if (Math.random() < 0.2 && value.length > 2) {
            let arr = input.value.split("");
            let i = Math.floor(Math.random() * arr.length);
            arr[i] = String.fromCharCode(97 + Math.floor(Math.random() * 26));
            input.value = arr.join("");
            status.innerText = "Autocorrect improved your input.";
        }

        // occasionally wipe everything
        if (Math.random() < 0.05) {
            input.value = "";
            status.innerText = "Input lost. Please try again.";
        }

        // fake validation
        if (Math.random() < 0.2) {
            status.innerText = "Invalid... but we won’t explain why.";
        }
    });
});

// fake submit
function submitForm() {
    status.innerText = "Submitting...";

    setTimeout(() => {
        status.innerText = "Submission failed successfully.";
        alert("Your data has not been saved.");
    }, 1500);
}
</script>

</body>
</html>
