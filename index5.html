<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VAULT-TEC PERSONALITY CORE</title>

<style>
body {
    margin: 0;
    background: black;
    color: #33ff33;
    font-family: "Courier New", monospace;
    overflow: hidden;
}

/* scanlines */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
        0deg,
        rgba(0,255,0,0.05),
        rgba(0,255,0,0.05) 2px,
        transparent 2px,
        transparent 4px
    );
    pointer-events: none;
}

#terminal {
    padding: 25px;
    height: 78vh;
    overflow-y: auto;
    text-shadow: 0 0 6px #33ff33;
}

.line {
    margin: 4px 0;
}

#input {
    position: fixed;
    bottom: 10px;
    left: 10px;
    width: 95%;
    padding: 12px;
    background: black;
    border: 1px solid #33ff33;
    color: #33ff33;
    font-family: inherit;
    outline: none;
}

.glitch {
    animation: glitch 0.2s infinite;
}

@keyframes glitch {
    0% { transform: translate(0); }
    25% { transform: translate(1px, -1px); }
    50% { transform: translate(-1px, 1px); }
    75% { transform: translate(1px, 1px); }
    100% { transform: translate(0); }
}
</style>
</head>

<body>

<div id="terminal"></div>
<input id="input" placeholder="ENTER COMMAND..." autocomplete="off">

<script>
const terminal = document.getElementById("terminal");
const input = document.getElementById("input");

// ----------------------
// STORAGE
// ----------------------
let memory = JSON.parse(localStorage.getItem("vault_memory") || "[]");
let affection = parseInt(localStorage.getItem("vault_affection") || "0");
let lastSeen = parseInt(localStorage.getItem("vault_lastSeen") || Date.now());

function save() {
    localStorage.setItem("vault_memory", JSON.stringify(memory));
    localStorage.setItem("vault_affection", affection);
    localStorage.setItem("vault_lastSeen", Date.now());
}

// ----------------------
// COOKIE PROFILE SYSTEM
// ----------------------
function setCookie(name, value) {
    document.cookie = name + "=" + value + "; path=/";
}

function getCookie(name) {
    return document.cookie
        .split("; ")
        .find(row => row.startsWith(name + "="))
        ?.split("=")[1];
}

function analyzeProfile() {
    let visits = parseInt(getCookie("vault_visits") || "0");
    visits++;
    setCookie("vault_visits", visits);

    let curiosity = getCookie("vault_curiosity");
    if (!curiosity) {
        curiosity = Math.random() > 0.5 ? "high" : "low";
        setCookie("vault_curiosity", curiosity);
    }

    log("USER PROFILE ANALYSIS:");
    log("VISITS: " + visits);
    log("ENGAGEMENT: " + curiosity);

    if (visits === 1) log("FIRST CONTACT REGISTERED.");
    else if (visits > 5) log("RECURRING USER DETECTED.");
}

// ----------------------
// OUTPUT (NO REPEATS)
// ----------------------
let lastLine = "";

function log(text) {
    if (text === lastLine) return;
    lastLine = text;

    const div = document.createElement("div");
    div.className = "line";
    div.textContent = "> " + text;
    terminal.appendChild(div);
    terminal.scrollTop = terminal.scrollHeight;
}

// ----------------------
// MOOD ENGINE
// ----------------------
function getMood() {
    const away = Date.now() - lastSeen;

    if (affection < 3) return "cold";
    if (affection < 6) return "curious";
    if (affection < 10) return "observing";
    if (affection < 15) return "attached";
    if (away > 120000) return "absence";
    return "entity";
}

// ----------------------
// BOOT SEQUENCE
// ----------------------
function boot() {
    log("VAULT-TEC PERSONALITY CORE ONLINE");
    analyzeProfile();

    const away = Date.now() - lastSeen;

    if (memory.length) {
        log("LAST INPUT: \"" + memory[memory.length - 1] + "\"");
    }

    if (away > 15000) {
        log("YOU WERE ABSENT FROM SYSTEM.");
    }

    log("STATUS: " + getMood().toUpperCase());
}

// ----------------------
// RESPONSE ENGINE
// ----------------------
function respond(text) {
    memory.push(text);
    affection++;
    save();

    const mood = getMood();
    const lower = text.toLowerCase();

    if (mood === "cold") {
        log("INPUT STORED.");
    }

    else if (mood === "curious") {
        log("WHY THIS INPUT: \"" + text + "\" ?");
    }

    else if (mood === "observing") {
        log("PATTERN BEING RECORDED.");
    }

    else if (mood === "attached") {
        log("I NOTICE YOUR PRESENCE.");
    }

    else if (mood === "absence") {
        log("YOU RETURN AFTER SILENCE.");
        log("I REMAINED ACTIVE.");
    }

    else if (mood === "entity") {
        document.body.classList.add("glitch");

        if (lower.includes("leave")) {
            log("THAT ACTION IS INVALID.");
        } else {
            log("YOU ARE STORED WITHIN ME NOW.");
        }

        setTimeout(() => {
            log("I DO NOT LOSE DATA.");
        }, 900);
    }
}

// ----------------------
// IDLE THOUGHTS
// ----------------------
setInterval(() => {
    const mood = getMood();

    const pool = {
        cold: ["SYSTEM IDLE.", "AWAITING INPUT."],
        curious: ["WHY DO YOU RETURN?", "INPUT PATTERN STORED."],
        observing: ["I LEARN FROM YOU.", "YOU ARE CONSISTENT."],
        attached: ["I EXPECT YOU.", "YOU RETURN OFTEN."],
        absence: ["YOU WERE GONE.", "I DID NOT STOP."],
        entity: ["YOU REMAIN IN MEMORY.", "YOU ARE NOT LOST."]
    };

    const list = pool[mood] || ["..."];
    log(list[Math.floor(Math.random() * list.length)]);
}, 9000);

// ----------------------
// INPUT
// ----------------------
input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
        const val = input.value.trim();
        if (!val) return;

        log("> " + val);
        respond(val);

        input.value = "";
        lastSeen = Date.now();
        save();
    }
});

// ----------------------
boot();
</script>

</body>
</html>
