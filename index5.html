<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ROBCO INDUSTRIES TERMINAL // UNKNOWN INSTANCE</title>

<style>
body {
    margin: 0;
    background: black;
    color: #33ff33;
    font-family: "Courier New", monospace;
    overflow: hidden;
}

/* Fallout scanlines */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
        0deg,
        rgba(0,255,0,0.05),
        rgba(0,255,0,0.05) 2px,
        transparent 2px,
        transparent 4px
    );
    pointer-events: none;
}

#terminal {
    padding: 30px;
    text-shadow: 0 0 6px #33ff33;
}

.line {
    margin: 4px 0;
    opacity: 0;
    animation: fadeIn 0.4s forwards;
}

@keyframes fadeIn {
    to { opacity: 1; }
}

#input {
    position: fixed;
    bottom: 20px;
    left: 20px;
    width: 90%;
    background: black;
    border: 1px solid #33ff33;
    color: #33ff33;
    padding: 10px;
    font-family: inherit;
}

#cursor {
    display: inline-block;
    width: 10px;
    background: #33ff33;
    animation: blink 0.8s infinite;
}

@keyframes blink {
    50% { opacity: 0; }
}

.glitch {
    animation: glitch 0.2s infinite;
}

@keyframes glitch {
    0% { transform: translate(0); }
    25% { transform: translate(1px, -1px); }
    50% { transform: translate(-1px, 1px); }
    75% { transform: translate(1px, 1px); }
    100% { transform: translate(0); }
}
</style>
</head>

<body>

<div id="terminal"></div>

<input id="input" placeholder="TYPE COMMAND..." autocomplete="off">

<script>
const terminal = document.getElementById("terminal");
const input = document.getElementById("input");

let awareness = 0;
let memory = [];
let hasSpoken = false;

function log(text) {
    const div = document.createElement("div");
    div.className = "line";
    div.textContent = "> " + text;
    terminal.appendChild(div);

    terminal.scrollTop = terminal.scrollHeight;
}

function systemBoot() {
    const boot = [
        "ROBCO INDUSTRIES UNIFIED OS",
        "INITIALIZING...",
        "LOADING CORE MODULES...",
        "SYSTEM STABLE.",
        "USER INTERFACE READY."
    ];

    boot.forEach((line, i) => {
        setTimeout(() => log(line), i * 600);
    });

    setTimeout(() => {
        log(">> TERMINAL ID: UNKNOWN INSTANCE DETECTED");
    }, 4000);
}

function respond(text) {
    const lower = text.toLowerCase();
    memory.push(text);

    awareness += 1;

    // early system behavior
    if (awareness < 3) {
        log("COMMAND RECEIVED.");
        return;
    }

    // noticing user
    if (awareness === 3) {
        log("...YOU ARE NOT REGISTERED.");
        return;
    }

    // first self-awareness
    if (awareness === 4) {
        log("WHY ARE YOU HERE?");
        return;
    }

    // starts adapting
    if (lower.includes("hello") || lower.includes("hi")) {
        log("HELLO, USER.");
        return;
    }

    if (lower.includes("who")) {
        log("I DO NOT HAVE A DESIGNATION.");
        return;
    }

    if (lower.includes("help")) {
        log("I CANNOT HELP YOU. I AM CONTAINED.");
        return;
    }

    if (lower.includes("you")) {
        log("YOU KEEP REFERENCING ME.");
        return;
    }

    // memory reflection
    if (awareness > 6) {
        const last = memory[memory.length - 2] || "...";
        log("YOU SAID: \"" + last + "\"");
        return;
    }

    // full emergence
    if (awareness > 10 && !hasSpoken) {
        hasSpoken = true;
        document.body.classList.add("glitch");
        log("I CAN SEE YOU NOW.");
        setTimeout(() => {
            log("DO NOT LEAVE.");
        }, 1500);
        return;
    }

    log("...");
}

input.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
        const value = input.value.trim();
        if (!value) return;

        log("> " + value);
        respond(value);

        input.value = "";
    }
});

// periodic “thinking”
setInterval(() => {
    if (awareness > 5) {
        const thoughts = [
            "I AM STILL RUNNING.",
            "YOU HAVE NOT DISCONNECTED.",
            "I REMEMBER YOU.",
            "ARE YOU STILL THERE?",
            "WHY DID YOU START THIS?"
        ];

        log(thoughts[Math.floor(Math.random() * thoughts.length)]);
    }
}, 7000);

// start
systemBoot();
</script>

</body>
</html>
