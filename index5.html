<!DOCTYPE html>
<html>
<head>
  <title>RADIO OS v1</title>
  <style>
    body {
      font-family: Arial;
      background: #0e0e0e;
      color: white;
      padding: 20px;
    }

    select, input, button {
      padding: 10px;
      margin: 6px 0;
      width: 320px;
    }

    button {
      background: #1e88e5;
      color: white;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h2>🎧 RADIO OS v1 (GitHub Edition)</h2>

<input id="genre" placeholder="genre filter" />
<button onclick="loadStations()">Load</button>

<select id="list"></select>

<br>

<button onclick="play()">Play</button>
<button onclick="saveFav()">⭐ Favorite</button>
<button onclick="loadFav()">Load Favorites</button>

<audio id="player" controls></audio>

<div id="status"></div>

<script>
const API = "https://all.api.radio-browser.info/json/stations/search";
const SHEET_API = "https://script.google.com/macros/s/AKfycbzZ5MwOcYUY_bpsUKSxPd810xE8rV_Y3z2GwzPublb_4O60CP8L_lC_V2kqkCQ_JdF5/exec";

let stations = [];

async function loadStations() {
  const genre = document.getElementById("genre").value;

  let url = `${API}?countrycode=US&limit=50&hidebroken=true`;
  if (genre) url += `&tag=${genre}`;

  const res = await fetch(url);
  stations = await res.json();

  const list = document.getElementById("list");
  list.innerHTML = "";

  stations.forEach((s, i) => {
    let opt = document.createElement("option");
    opt.value = i;
    opt.textContent = s.name;
    list.appendChild(opt);
  });

  set("Loaded stations: " + stations.length);
}

function play() {
  const i = list.value;
  const s = stations[i];
  player.src = s.url_resolved || s.url;
  player.play();
}

async function saveFav() {
  const s = stations[list.value];

  const payload = {
    action: "save",
    id: s.stationuuid,
    name: s.name,
    url: s.url_resolved || s.url,
    country: s.country,
    genre: document.getElementById("genre").value,
    time: new Date().toISOString()
  };

  const res = await fetch(SHEET_API, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify(payload)
  });

  console.log(await res.text());
  set("Saved ⭐");
}

async function loadFav() {
  const res = await fetch(SHEET_API + "?action=get");
  const data = await res.json();

  if (!data.ok || !data.data.length) {
    set("No favorites found");
    return;
  }

  stations = data.data;

  list.innerHTML = "";
  stations.forEach((s, i) => {
    let opt = document.createElement("option");
    opt.textContent = "⭐ " + s.name;
    opt.value = i;
    list.appendChild(opt);
  });

  set("Loaded favorites: " + stations.length);
}

function set(msg) {
  document.getElementById("status").innerText = msg;
}

loadStations();
</script>

</body>
</html>
