<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>???</title>
<style>
body {
  margin: 0;
  font-family: Comic Sans MS, cursive;
  background: linear-gradient(270deg, red, blue, lime, purple);
  background-size: 800% 800%;
  animation: bgShift 10s infinite alternate;
  overflow: hidden;
}

@keyframes bgShift {
  0% {background-position: 0% 50%;}
  100% {background-position: 100% 50%;}
}

.marquee {
  position: absolute;
  white-space: nowrap;
  font-size: 2rem;
  animation: scroll 5s linear infinite;
}

@keyframes scroll {
  from { transform: translateX(100vw); }
  to { transform: translateX(-100%); }
}

button {
  position: absolute;
  padding: 15px;
  font-size: 1.2rem;
  cursor: pointer;
}

#weirdBox {
  position: absolute;
  width: 100px;
  height: 100px;
  background: yellow;
  animation: spin 2s infinite linear;
}

@keyframes spin {
  from { transform: rotate(0deg) scale(1); }
  to { transform: rotate(360deg) scale(1.5); }
}

img {
  position: absolute;
  width: 120px;
  animation: float 6s infinite ease-in-out;
}

@keyframes float {
  0% { transform: translateY(0px); }
  50% { transform: translateY(-40px); }
  100% { transform: translateY(0px); }
}

</style>
</head>
<body>

<div class="marquee">WELCOME TO THE VOID 👁️ CLICK EVERYTHING 👁️</div>

<div id="weirdBox"></div>

<button onclick="spawnMadness()">DO NOT CLICK</button>

<script>
const sounds = [
  'https://www.soundjay.com/button/beep-07.wav',
  'https://www.soundjay.com/button/beep-10.wav'
];

function randomPos(el) {
  el.style.top = Math.random() * window.innerHeight + 'px';
  el.style.left = Math.random() * window.innerWidth + 'px';
}

setInterval(() => {
  const box = document.getElementById('weirdBox');
  randomPos(box);
}, 800);

function spawnMadness() {
  document.body.style.transform = 'rotate(' + (Math.random()*360) + 'deg)';

  for (let i = 0; i < 10; i++) {
    const img = document.createElement('img');
    img.src = 'https://placekitten.com/' + (100 + i) + '/' + (100 + i);
    randomPos(img);
    document.body.appendChild(img);
  }

  const audio = new Audio(sounds[Math.floor(Math.random()*sounds.length)]);
  audio.play();

  document.title = Math.random().toString(36).substring(2);
}

setInterval(() => {
  document.body.style.filter = `hue-rotate(${Math.random()*360}deg)`;
}, 500);

setInterval(() => {
  const text = document.createElement('div');
  text.textContent = ['WHY', 'HELLO', 'RUN', 'ERROR', '???'][Math.floor(Math.random()*5)];
  text.style.position = 'absolute';
  text.style.fontSize = Math.random()*40 + 'px';
  text.style.color = 'white';
  randomPos(text);
  document.body.appendChild(text);
}, 700);
</script>

</body>
</html>
