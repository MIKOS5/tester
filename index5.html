<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Completely Useless Website</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    text-align: center;
    padding: 40px;
}

h1 {
    font-size: 32px;
}

button {
    padding: 10px 20px;
    margin: 10px;
    cursor: pointer;
}

#progress {
    width: 80%;
    height: 25px;
    background: #ccc;
    margin: 20px auto;
    position: relative;
}

#bar {
    height: 100%;
    width: 100%;
    background: limegreen;
}

#searchResult {
    margin-top: 15px;
    font-style: italic;
}
</style>
</head>

<body>

<h1>Welcome to the Opposite of Useful</h1>

<p>Everything here works... just not how you want.</p>

<!-- BUTTON THAT DOESN'T HELP -->
<button onclick="doNothing()">Do Something Important</button>

<!-- SEARCH THAT AVOIDS ANSWER -->
<div>
    <input type="text" id="searchBox" placeholder="Search anything...">
    <button onclick="fakeSearch()">Search</button>
    <div id="searchResult"></div>
</div>

<!-- PROGRESS BAR THAT GOES BACKWARDS -->
<div id="progress">
    <div id="bar"></div>
</div>

<!-- APOLOGY BUTTON -->
<button onclick="apologize()">Fix Everything</button>

<script>
// useless button
function doNothing() {
    alert("Done. (Nothing happened)");
}

// fake search
function fakeSearch() {
    const input = document.getElementById("searchBox").value;
    const responses = [
        "Instead of '" + input + "', have you tried not knowing?",
        "No results found. But emotionally, maybe yes.",
        "We deliberately avoided searching for that.",
        "Result hidden for your convenience.",
        "You were close. But also very far."
    ];

    document.getElementById("searchResult").innerText =
        responses[Math.floor(Math.random() * responses.length)];
}

// backwards progress bar
let width = 100;
setInterval(() => {
    width -= Math.random() * 5;

    if (width < 0) width = 100;

    document.getElementById("bar").style.width = width + "%";
}, 500);

// apology button
function apologize() {
    alert("We’re sorry.\n\nWe will not improve.");
}
</script>

</body>
</html>
