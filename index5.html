<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Internet Archive Browser</title>

<style>

body{
background:#070d16;
color:#d8e1ec;
font-family:Arial;
padding:20px;
}

.card{
background:#111827;
padding:15px;
margin:15px 0;
border-radius:10px;
border:1px solid #263244;
}

a{
color:#4da3ff;
}

input{
width:100%;
padding:12px;
background:#111;
color:white;
border:1px solid #444;
}

</style>

</head>

<body>

<h1>Archive Files</h1>

<input id="search" placeholder="Search">

<div id="output">
Loading...
</div>


<script>


const IDENTIFIER =
"s-7-ep-41-beavis-butthead-are-dead";


const API =
"https://archive.org/metadata/" + IDENTIFIER;


let files=[];


fetch(API)

.then(r=>r.json())

.then(data=>{


files=data.files.map(f=>{


return {

name:f.name,

format:f.format,

size:f.size,

length:f.length,

width:f.width,

height:f.height,

md5:f.md5,

sha1:f.sha1,

url:
"https://archive.org/download/"
+
IDENTIFIER
+
"/"
+
f.name
.split("/")
.map(encodeURIComponent)
.join("/")


};


});


display(files);


})

.catch(err=>{

document.getElementById("output").innerHTML=
"ERROR: "+err;

});



function display(list){


let html="";


list.forEach(f=>{


html+=`

<div class="card">

<h3>${f.name}</h3>

<p>
<b>Format:</b> ${f.format||""}<br>
<b>Size:</b> ${formatBytes(f.size)}<br>
<b>Duration:</b> ${f.length||""}<br>
<b>Resolution:</b>
${f.width||""} x ${f.height||""}<br>
</p>

<p>
<a href="${f.url}" target="_blank">
Open File
</a>
</p>


</div>

`;

});


document.getElementById("output").innerHTML=html;


}



document.getElementById("search")
.oninput=function(){


let q=this.value.toLowerCase();


display(
files.filter(x=>
x.name.toLowerCase().includes(q)
)
);


}



function formatBytes(bytes){

if(!bytes)return "";

let sizes=[
"Bytes",
"KB",
"MB",
"GB"
];

let i=Math.floor(
Math.log(bytes)/Math.log(1024)
);


return(
(bytes/Math.pow(1024,i))
.toFixed(2)
+" "+sizes[i]
);

}


</script>

</body>
</html>
