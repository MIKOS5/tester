<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cat-in-a-Box Growth Simulator™</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: #f7f2e8;
    padding: 40px;
}

#box {
    width: 200px;
    height: 200px;
    margin: 30px auto;
    background: #d9b38c;
    border: 4px solid #8b5a2b;
    position: relative;
    overflow: hidden;
}

#cat {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    font-size: 20px;
    transition: 0.5s;
}

#progressContainer {
    width: 60%;
    margin: 20px auto;
    background: #ddd;
    height: 20px;
}

#progress {
    width: 0%;
    height: 100%;
    background: green;
}

button {
    padding: 10px 20px;
    margin-top: 10px;
    cursor: pointer;
}

#log {
    margin-top: 20px;
    font-size: 14px;
    color: #444;
    min-height: 40px;
}
</style>
</head>

<body>

<h1>🐱 Cat-in-a-Box Growth Simulator™</h1>
<p>Grow your cat responsibly. Do not overwater.</p>

<div id="box">
    <div id="cat">🐱</div>
</div>

<div id="progressContainer">
    <div id="progress"></div>
</div>

<button onclick="waterCat()">Water Cat</button>
<button onclick="talkToCat()">Talk to Cat</button>

<div id="log">Awaiting cultivation input...</div>

<script>
let growth = 0;
const progress = document.getElementById("progress");
const cat = document.getElementById("cat");
const log = document.getElementById("log");

function update() {
    progress.style.width = growth + "%";

    if (growth < 20) {
        cat.textContent = "🥚";
        log.textContent = "A mysterious presence is forming...";
    } else if (growth < 50) {
        cat.textContent = "🐈";
        log.textContent = "It is stirring in the soil...";
    } else if (growth < 80) {
        cat.textContent = "🐈‍⬛";
        log.textContent = "The cat is becoming aware of you.";
    } else {
        cat.textContent = "😺";
        log.textContent = "It is fully grown. It watches back.";
    }
}

function waterCat() {
    growth += Math.random() * 12;

    if (growth > 100) growth = 100;

    log.textContent = "You watered the cat. It seems uncertain.";
    update();
}

function talkToCat() {
    const messages = [
        "The cat does not understand words, but appreciates effort.",
        "It purrs in a language you cannot hear.",
        "Silence is also communication.",
        "The cat remembers this interaction."
    ];

    log.textContent = messages[Math.floor(Math.random() * messages.length)];
}

setInterval(() => {
    // passive growth (or decay…)
    growth += (Math.random() - 0.3) * 5;

    if (growth < 0) growth = 0;
    if (growth > 100) growth = 100;

    update();
}, 2000);

update();
</script>

</body>
</html>
