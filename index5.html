<!DOCTYPE html>
<html>
<head>
  <title>RADIO OS HYBRID</title>

  <style>
    body {
      font-family: Arial;
      background: #0b0b0b;
      color: white;
      padding: 20px;
    }

    h1 { color: #1e88e5; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    th, td {
      border: 1px solid #333;
      padding: 8px;
      font-size: 13px;
    }

    th { background: #1e88e5; }

    tr:hover {
      background: #222;
      cursor: pointer;
    }

    input, select, button {
      padding: 8px;
      margin-top: 6px;
      width: 100%;
      border: none;
      border-radius: 6px;
    }

    button {
      background: #1e88e5;
      color: white;
      cursor: pointer;
    }

    button:hover { background: #1565c0; }

    .status {
      margin-top: 10px;
      color: #aaa;
      font-size: 12px;
    }
  </style>
</head>

<body>

<h1>🎧 RADIO OS HYBRID</h1>

<div class="grid">

  <!-- =======================
       STATIONS PANEL
  ======================== -->
  <div>
    <h3>📡 Stations</h3>

    <input id="genre" placeholder="genre filter (rock, jazz...)" />

    <button onclick="loadStations()">Load Stations</button>

    <select id="stationList"></select>

    <button onclick="playStation()">▶ Play Station</button>
    <button onclick="saveFavorite()">⭐ Save Favorite</button>

    <audio id="player" controls style="width:100%;margin-top:10px;"></audio>

    <div class="status" id="stationStatus"></div>
  </div>

  <!-- =======================
       FAVORITES PANEL
  ======================== -->
  <div>
    <h3>⭐ Favorites (Sheets)</h3>

    <button onclick="loadFavorites()">🔄 Load Favorites</button>

    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Country</th>
          <th>Genre</th>
        </tr>
      </thead>
      <tbody id="favTable"></tbody>
    </table>

    <div class="status" id="favStatus"></div>
  </div>

</div>

<!-- =========================
🎧 FLOATING WIDGET (SIMPLE)
========================= -->

<div id="widget" style="
position:fixed;
bottom:20px;
right:20px;
background:#111;
padding:10px;
border-radius:10px;
width:250px;
box-shadow:0 0 20px rgba(0,0,0,0.5);
">

  <b>🎧 Quick Player</b>

  <button onclick="loadStations()">Reload Stations</button>
  <button onclick="loadFavorites()">Load Fav</button>

</div>

<script>

const API = "https://all.api.radio-browser.info/json/stations/search";
const SHEET_API = "https://script.google.com/macros/s/AKfycbzZ5MwOcYUY_bpsUKSxPd810xE8rV_Y3z2GwzPublb_4O60CP8L_lC_V2kqkCQ_JdF5/exec";

let stations = [];

// =========================
// LOAD STATIONS (RESTORED)
// =========================
async function loadStations() {
  const genre = document.getElementById("genre").value;

  let url = `${API}?countrycode=US&limit=50&hidebroken=true`;
  if (genre) url += `&tag=${genre}`;

  setStationStatus("Loading stations...");

  const res = await fetch(url);
  stations = await res.json();

  const list = document.getElementById("stationList");
  list.innerHTML = "";

  stations.forEach((s, i) => {
    let opt = document.createElement("option");
    opt.value = i;
    opt.textContent = s.name;
    list.appendChild(opt);
  });

  setStationStatus(`Loaded ${stations.length} stations`);
}

// =========================
// PLAY STATION
// =========================
function playStation() {
  const s = stations[stationList.value];
  if (!s) return;

  player.src = s.url_resolved || s.url;
  player.play();
}

// =========================
// SAVE FAVORITE
// =========================
async function saveFavorite() {
  const s = stations[stationList.value];

  await fetch(SHEET_API, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      action: "save",
      id: s.stationuuid,
      name: s.name,
      url: s.url_resolved || s.url,
      country: s.country,
      genre: document.getElementById("genre").value,
      time: new Date().toISOString()
    })
  });

  setFavStatus("⭐ Saved!");
}

// =========================
// LOAD FAVORITES TABLE
// =========================
async function loadFavorites() {
  setFavStatus("Loading...");

  const res = await fetch(SHEET_API + "?action=get");
  const data = await res.json();

  const table = document.getElementById("favTable");
  table.innerHTML = "";

  if (!data.ok || !data.data.length) {
    setFavStatus("No favorites found");
    return;
  }

  data.data.forEach(row => {
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${row.name}</td>
      <td>${row.country}</td>
      <td>${row.genre}</td>
    `;

    tr.onclick = () => {
      // PLAY FAVORITE DIRECTLY
      player.src = row.url;
      player.play();
    };

    table.appendChild(tr);
  });

  setFavStatus(`Loaded ${data.data.length} favorites`);
}

// =========================
// STATUS HELPERS
// =========================
function setStationStatus(t) {
  document.getElementById("stationStatus").innerText = t;
}

function setFavStatus(t) {
  document.getElementById("favStatus").innerText = t;
}

// INIT
loadStations();
loadFavorites();

</script>

</body>
</html>
