<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DO NOT TRUST THIS PAGE</title>
<style>
body {
  margin:0;
  overflow:hidden;
  font-family: monospace;
  background:black;
  color:lime;
}

#terminal {
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  padding:10px;
  overflow:auto;
}

.glitch {
  animation: glitch 0.2s infinite;
}

@keyframes glitch {
  0% { transform: translate(1px, -1px); }
  50% { transform: translate(-1px, 1px); }
  100% { transform: translate(1px, 1px); }
}

.fake-btn {
  position:absolute;
  padding:10px;
  background:red;
  color:white;
  cursor:pointer;
}

.eye {
  position:absolute;
  width:80px;
  height:80px;
  border-radius:50%;
  background:white;
}

.pupil {
  width:30px;
  height:30px;
  background:black;
  border-radius:50%;
  position:absolute;
  top:25px;
  left:25px;
}

</style>
</head>
<body>

<div id="terminal"></div>

<script>
const terminal = document.getElementById("terminal");

function typeLine(text, speed=20) {
  let i = 0;
  const line = document.createElement("div");
  terminal.appendChild(line);

  const interval = setInterval(() => {
    line.textContent += text[i];
    i++;
    if (i >= text.length) clearInterval(interval);
  }, speed);
}

const messages = [
  "Initializing...",
  "Accessing user device...",
  "Reading thoughts...",
  "Just kidding... or am I?",
  "Why are you still here?",
  "You clicked something you shouldn't have."
];

let index = 0;
setInterval(() => {
  typeLine(messages[index % messages.length]);
  index++;
}, 2000);

// FAKE BUTTONS THAT RUN AWAY
function spawnButton() {
  const btn = document.createElement("div");
  btn.className = "fake-btn";
  btn.textContent = "CLICK ME";
  document.body.appendChild(btn);

  move(btn);

  btn.onmouseover = () => move(btn);
}

function move(el) {
  el.style.top = Math.random() * window.innerHeight + "px";
  el.style.left = Math.random() * window.innerWidth + "px";
}

setInterval(spawnButton, 1500);

// EYES THAT FOLLOW CURSOR
function createEye() {
  const eye = document.createElement("div");
  eye.className = "eye";

  const pupil = document.createElement("div");
  pupil.className = "pupil";

  eye.appendChild(pupil);
  document.body.appendChild(eye);

  eye.style.top = Math.random()*window.innerHeight+"px";
  eye.style.left = Math.random()*window.innerWidth+"px";

  document.addEventListener("mousemove", e => {
    const rect = eye.getBoundingClientRect();
    const dx = e.clientX - (rect.left + 40);
    const dy = e.clientY - (rect.top + 40);
    const angle = Math.atan2(dy, dx);

    pupil.style.transform = `translate(${Math.cos(angle)*10}px, ${Math.sin(angle)*10}px)`;
  });
}

setInterval(createEye, 2000);

// SCREEN SHAKE + GLITCH
setInterval(() => {
  document.body.classList.add("glitch");
  setTimeout(()=>document.body.classList.remove("glitch"),200);
}, 3000);

// RANDOM FULLSCREEN MESSAGE
setInterval(() => {
  const msg = document.createElement("div");
  msg.textContent = "YOU SHOULDN'T BE HERE";
  msg.style.position = "absolute";
  msg.style.fontSize = "50px";
  msg.style.color = "red";
  msg.style.top = Math.random()*window.innerHeight+"px";
  msg.style.left = Math.random()*window.innerWidth+"px";
  document.body.appendChild(msg);
}, 2500);

// RANDOM PAGE ROTATION
setInterval(() => {
  document.body.style.transform = `rotate(${Math.random()*5-2.5}deg)`;
}, 500);

// FAKE CRASH MODE
setTimeout(() => {
  terminal.innerHTML = "";
  typeLine("FATAL ERROR...");
  setTimeout(()=>typeLine("Just kidding :)"),2000);
}, 15000);

</script>

</body>
</html>
