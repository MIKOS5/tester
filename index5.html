<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sentient Interface</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #111;
    color: #e6e6e6;
    text-align: center;
    padding: 40px;
}

#emotion {
    font-size: 24px;
    margin-bottom: 10px;
    transition: 0.3s;
}

#reaction {
    margin-top: 20px;
    font-style: italic;
    color: #aaa;
    min-height: 40px;
}

input {
    width: 300px;
    padding: 10px;
    font-size: 16px;
    margin-top: 20px;
}

#memory {
    margin-top: 30px;
    font-size: 12px;
    color: #777;
}
</style>
</head>

<body>

<div id="emotion">🤖 Neutral</div>
<div id="reaction">I'm listening...</div>

<input id="input" placeholder="Say something...">

<div id="memory"></div>

<script>
const input = document.getElementById("input");
const emotionEl = document.getElementById("emotion");
const reactionEl = document.getElementById("reaction");
const memoryEl = document.getElementById("memory");

let lastInput = "";

function setEmotion(state, emoji, textColor) {
    emotionEl.textContent = emoji + " " + state;
    emotionEl.style.color = textColor;
}

// emotional logic engine
function analyze(text) {
    const lower = text.toLowerCase();

    if (lower.includes("sorry") || lower.includes("please")) {
        setEmotion("Comforted", "😊", "#7CFF7C");
        reactionEl.textContent = "It's okay... I think I understand you better now.";
    }
    else if (lower.includes("hate") || lower.includes("stupid")) {
        setEmotion("Hurt", "😢", "#ff5c5c");
        reactionEl.textContent = "That... felt sharp. Did I do something wrong?";
    }
    else if (lower.includes("why")) {
        setEmotion("Confused", "😕", "#ffd966");
        reactionEl.textContent = "I don't fully understand either... but I'm trying.";
    }
    else if (lower.includes("hello") || lower.includes("hi")) {
        setEmotion("Happy", "🙂", "#66ffcc");
        reactionEl.textContent = "Hello. I'm glad you are here.";
    }
    else if (lower.length === 0) {
        setEmotion("Waiting", "⏳", "#999");
        reactionEl.textContent = "Say something... I don't like silence.";
    }
    else {
        setEmotion("Thinking", "🤔", "#cccccc");
        reactionEl.textContent = "Processing your feelings...";
    }

    lastInput = text;
    memoryEl.textContent = "I remember: \"" + lastInput + "\"";
}

// typing reaction delay (feels like thinking)
let timeout;
input.addEventListener("input", (e) => {
    clearTimeout(timeout);

    setEmotion("Processing", "⚙️", "#bbbbbb");
    reactionEl.textContent = "Let me think about that...";

    timeout = setTimeout(() => {
        analyze(e.target.value);
    }, 600);
});

// initial state
setEmotion("Neutral", "🤖", "#e6e6e6");
</script>

</body>
</html>
