<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>📻 RadioWave Pro (Offline Fixed)x</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>

<style>

:root{
  --bg:#09111d;
  --line:#253347;
  --text:#fff;
  --muted:#93a4bb;
  --blue:#2793ff;
  --blue2:#1869d9;
  --green:#17c964;
  --shadow:0 10px 30px rgba(0,0,0,.35);
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:Inter,sans-serif;
  background:radial-gradient(circle at top,#17263f,#09111d 45%);
  color:white;
  display:flex;
  height:100vh;
  overflow:hidden;
}

/* SIDEBAR */
.sidebar{
  width:330px;
  background:rgba(17,24,39,.92);
  backdrop-filter:blur(16px);
  border-right:1px solid var(--line);
  padding:22px;
  overflow:auto;
  box-shadow:var(--shadow);
}

.logo{font-size:32px;font-weight:800;}
.logo span{color:var(--blue);}
.subtitle{color:var(--muted);font-size:13px;margin-bottom:20px;}

.search{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:1px solid #1e293b;
  background:#0e1725;
  color:white;
}

/* BUTTONS */
button{
  border:none;
  border-radius:12px;
  padding:12px;
  font-weight:700;
  cursor:pointer;
  color:white;
  background:linear-gradient(180deg,var(--blue),var(--blue2));
}

button:hover{transform:translateY(-1px);}

.main-btn{width:100%;margin-top:10px;}

.grid-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:12px;
}

/* PLAYER */
.radio-player{
  margin-top:20px;
  padding:16px;
  border-radius:18px;
  background:linear-gradient(180deg,#182233,#121926);
  border:1px solid var(--line);
}

.station-icon{
  width:55px;
  height:55px;
  border-radius:14px;
  background:linear-gradient(135deg,var(--blue),#6a5cff);
  display:flex;
  align-items:center;
  justify-content:center;
}

.controls{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:14px;
}

/* MAIN */
.main{
  flex:1;
  padding:24px;
  overflow:auto;
}

.page-title{
  font-size:30px;
  font-weight:800;
}

/* TABLE */
.table-wrap{
  border-radius:18px;
  overflow:hidden;
  border:1px solid var(--line);
  background:rgba(17,24,39,.92);
}

th{
  text-align:left;
  padding:16px;
  font-size:12px;
  color:#8eb5ff;
  background:#0f1725;
}

td{
  padding:16px;
  border-top:1px solid #1d2938;
}

/* MOBILE */
#mobileList{display:none;}

.card{
  background:rgba(17,24,39,.94);
  padding:16px;
  border-radius:16px;
  margin-bottom:12px;
  border:1px solid var(--line);
}

.card-buttons{
  display:flex;
  gap:10px;
  margin-top:10px;
}

.status{
  margin-top:12px;
  color:var(--muted);
  font-size:13px;
}

@media(max-width:900px){
  body{flex-direction:column;}
  .sidebar{width:100%;}
  .table-wrap{display:none;}
  #mobileList{display:block;}
}

</style>
</head>

<body>

<div class="sidebar">

  <div class="logo">📻 Radio<span>Wave</span></div>
  <div class="subtitle">Offline Fixed Version</div>

  <input id="genre" class="search" placeholder="Search genre..." />

  <button class="main-btn" onclick="applyFilter()">🔎 Search</button>

  <div class="grid-buttons">
    <button onclick="prevPage()">⬅ Prev</button>
    <button onclick="nextPage()">Next ➜</button>
    <button onclick="loadStations()">🔄 Refresh</button>
    <button onclick="loadFavorites()">⭐ Favorites</button>
  </div>

  <div class="radio-player">

    <div style="display:flex;gap:10px;align-items:center;">
      <div class="station-icon">📻</div>
      <div>
        <div id="npName">Not Playing</div>
        <div id="npMeta">Select station</div>
      </div>
    </div>

    <audio id="player"></audio>

    <div class="controls">
      <button onclick="prevStation()">⏮</button>
      <button id="playBtn" onclick="togglePlay()">▶</button>
      <button onclick="nextStation()">⏭</button>
      <button onclick="toggleFavCurrent()">⭐</button>
    </div>

  </div>

  <div class="status" id="status">Loading...</div>

</div>

<div class="main">

  <div class="page-title">US Radio</div>
  <div id="count" class="status"></div>

  <div class="table-wrap">
    <table id="table">
      <thead>
        <tr>
          <th>Station</th>
          <th>Country</th>
          <th>Genre</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div id="mobileList"></div>

</div>

<script>

const API = "https://all.api.radio-browser.info/json/stations/search";

/* STATE */
let stations = [];
let allStations = [];
let currentList = [];
let currentIndex = -1;

let page = 0;
const limit = 50;

let favorites = [];
let favoriteIds = new Set();
let isPlaying = false;

/* ================= FAVORITES ================= */

function saveFavorites(){
  localStorage.setItem("radio_favorites", JSON.stringify(favorites));
}

function loadFavorites(){

  const data = localStorage.getItem("radio_favorites");

  favorites = data ? JSON.parse(data) : [];

  favoriteIds = new Set(
    favorites.map(f => f.stationuuid)
  );

  currentList = favorites;

  render();
  setStatus(`Loaded ${favorites.length} favorites`);
}

function toggleFavorite(s){

  const id = s.stationuuid;
  if(!id) return;

  if(favoriteIds.has(id)){
    setStatus("Already in favorites");
    return;
  }

  const clean = {
    stationuuid: s.stationuuid,
    name: s.name,
    country: s.country,
    tags: s.tags,
    url: s.url,
    url_resolved: s.url_resolved
  };

  favorites.push(clean);
  favoriteIds.add(id);

  saveFavorites();

  setStatus("⭐ Saved offline");
  render();
}

function toggleFavCurrent(){
  const item = currentList[currentIndex];
  if(item) toggleFavorite(item);
}

function clearFavorites(){
  favorites = [];
  favoriteIds = new Set();
  saveFavorites();
  render();
  setStatus("Favorites cleared");
}

/* ================= STATIONS ================= */

async function loadStations(){

  setStatus("Loading stations...");

  try{

    const res = await fetch(
      `${API}?countrycode=US&limit=${limit}&offset=${page*limit}&hidebroken=true`
    );

    const data = await res.json();

    stations = data;
    allStations = data;
    currentList = stations;

    render();

    setStatus(`Loaded ${stations.length} stations (Page ${page+1})`);

  }catch(err){
    setStatus("Failed loading stations");
  }
}

/* ================= PLAYER ================= */

function playStation(id){

  const item = currentList.find(s =>
    s.stationuuid === id
  );

  if(!item) return;

  currentIndex = currentList.indexOf(item);

  const player = document.getElementById("player");

  player.src = item.url_resolved || item.url;
  player.play();

  isPlaying = true;
  document.getElementById("playBtn").textContent = "⏸";

  document.getElementById("npName").textContent = item.name;
  document.getElementById("npMeta").textContent =
    `${item.country || ""} • ${item.tags || ""}`;
}

/* controls */
function togglePlay(){
  const p = document.getElementById("player");

  if(!p.src) return;

  if(isPlaying){
    p.pause();
    isPlaying = false;
    document.getElementById("playBtn").textContent = "▶";
  }else{
    p.play();
    isPlaying = true;
    document.getElementById("playBtn").textContent = "⏸";
  }
}

function nextStation(){
  if(!currentList.length) return;
  currentIndex = (currentIndex + 1) % currentList.length;
  playStation(currentList[currentIndex].stationuuid);
}

function prevStation(){
  if(!currentList.length) return;
  currentIndex = (currentIndex - 1 + currentList.length) % currentList.length;
  playStation(currentList[currentIndex].stationuuid);
}

/* ================= PAGINATION FIX ================= */

function nextPage(){
  page++;
  loadStations();
}

function prevPage(){
  if(page > 0){
    page--;
    loadStations();
  }
}

/* ================= FILTER ================= */

function applyFilter(){

  const g = document.getElementById("genre").value.toLowerCase();

  if(!g){
    currentList = allStations;
  }else{
    currentList = allStations.filter(s =>
      (s.tags || "").toLowerCase().includes(g)
    );
  }

  render();
}

/* ================= RENDER ================= */

function render(){

  const tbody = document.querySelector("#table tbody");
  tbody.innerHTML = "";

  currentList.forEach(s => {

    const id = s.stationuuid;
    const fav = favoriteIds.has(id);

    tbody.innerHTML += `
      <tr>
        <td>${s.name}</td>
        <td>${s.country || ""}</td>
        <td>${s.tags || ""}</td>
        <td>
          <button onclick="playStation('${id}')">▶</button>
          <button onclick='toggleFavorite(${JSON.stringify(s)})'>
            ${fav ? "⭐" : "☆"}
          </button>
        </td>
      </tr>
    `;
  });

  document.getElementById("count").textContent =
    `${currentList.length} stations`;

  document.getElementById("pageInfo").textContent =
    `Page ${page + 1}`;
}

/* STATUS */
function setStatus(t){
  document.getElementById("status").textContent = t;
}

/* INIT */
loadStations();
loadFavorites();

</script>

</body>
</html>
