<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ROBCO INDUSTRIES (TM) TERMLINK</title>

<style>
body {
    margin: 0;
    background: black;
    color: #33ff33;
    font-family: "Courier New", monospace;
    overflow: hidden;
}

/* scanlines overlay */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
        0deg,
        rgba(0,255,0,0.05),
        rgba(0,255,0,0.05) 2px,
        transparent 2px,
        transparent 4px
    );
    pointer-events: none;
}

#terminal {
    padding: 30px;
    text-shadow: 0 0 5px #33ff33;
}

.header {
    font-size: 22px;
    margin-bottom: 20px;
}

.line {
    margin: 5px 0;
    opacity: 0;
    animation: typeIn 0.5s forwards;
}

@keyframes typeIn {
    to { opacity: 1; }
}

#cursor {
    display: inline-block;
    width: 10px;
    background: #33ff33;
    animation: blink 0.8s infinite;
}

@keyframes blink {
    50% { opacity: 0; }
}

button {
    margin-top: 20px;
    background: black;
    border: 1px solid #33ff33;
    color: #33ff33;
    padding: 10px;
    cursor: pointer;
    font-family: inherit;
}

button:hover {
    background: #33ff33;
    color: black;
}
</style>
</head>

<body>

<div id="terminal">
    <div class="header">ROBCO INDUSTRIES UNIFIED OPERATING SYSTEM</div>
    <div class="header">COPYRIGHT 2077-2026 ROBCO INDUSTRIES</div>
    <br>

    <div id="log"></div>

    <button onclick="runCommand()">ACCESS LOG FILE</button>
    <span id="cursor"></span>
</div>

<script>
const log = document.getElementById("log");

const messages = [
    "Boot sequence initiated...",
    "Loading security protocols...",
    "Vault connection... LOST",
    "Last known user: UNKNOWN",
    "System integrity: DEGRADED",
    "Memory fragments detected...",
    ">> CLASSIFIED DATA BLOCKED <<",
    "Signal interference detected outside bunker walls...",
    "WARNING: ENTITY ACCESSING TERMINAL"
];

let i = 0;

function typeLine(text, delay = 600) {
    setTimeout(() => {
        const div = document.createElement("div");
        div.className = "line";
        div.textContent = "> " + text;
        log.appendChild(div);
    }, delay * i);
    i++;
}

function bootSequence() {
    messages.forEach(msg => typeLine(msg));
}

function runCommand() {
    const responses = [
        "ACCESS DENIED",
        "FILE CORRUPTED",
        "USER NOT FOUND",
        "DATA UNSTABLE",
        "SYSTEM REJECTED REQUEST",
        ">>> TERMINAL LOCKED <<<"
    ];

    const div = document.createElement("div");
    div.className = "line";
    div.textContent = "> " + responses[Math.floor(Math.random() * responses.length)];
    log.appendChild(div);

    // occasional glitch event
    if (Math.random() < 0.3) {
        setTimeout(() => {
            const glitch = document.createElement("div");
            glitch.className = "line";
            glitch.textContent = "> !!! SIGNAL INTERRUPTION !!!";
            log.appendChild(glitch);
        }, 800);
    }
}

// auto boot
bootSequence();
</script>

</body>
</html>
