<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>📻RADIOWAVE📻</title>

<style>
/* =========================
   GLOBAL UI
========================= */
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0f14;
  color: #fff;
  display: flex;
  height: 100vh;
}

/* =========================
   SIDEBAR (RADIO CONSOLE)
========================= */
.sidebar {
  width: 280px;
  background: #111826;
  border-right: 1px solid #1f2a3a;
  padding: 14px;
  box-sizing: border-box;
  overflow-y: auto;
}

h2 {
  margin: 6px 0 10px;
  font-size: 20px;
}

input, button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 10px;
  border: none;
  font-size: 15px;
}

button {
  background: #1e88e5;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:active {
  transform: scale(0.98);
}

/* =========================
   PLAYER BOX
========================= */
.player-box {
  margin-top: 14px;
  padding: 12px;
  background: #0f1722;
  border-radius: 12px;
  border: 1px solid #1f2a3a;
}

.now-playing {
  font-size: 13px;
  color: #9ecbff;
  margin-bottom: 8px;
}

.controls {
  display: flex;
  gap: 8px;
  margin-top: 8px;
}

.controls button {
  flex: 1;
  padding: 10px;
  font-size: 14px;
}

input[type="range"] {
  width: 100%;
  margin-top: 10px;
}

/* =========================
   MAIN AREA
========================= */
.main {
  flex: 1;
  padding: 14px;
  overflow-y: auto;
}

/* TOP BAR */
.topbar {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
}

.smallbtn {
  flex: 1;
  padding: 10px;
  font-size: 13px;
}

/* =========================
   STATION CARDS
========================= */
.card {
  background: #121a28;
  padding: 12px;
  margin-bottom: 10px;
  border-radius: 12px;
  border: 1px solid #1f2a3a;
}

.card-title {
  font-size: 15px;
  font-weight: bold;
}

.card-meta {
  font-size: 12px;
  color: #aaa;
  margin-top: 4px;
}

.card-actions {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.card-actions button {
  flex: 1;
  padding: 10px;
  font-size: 13px;
}

/* =========================
   STATUS
========================= */
.status {
  font-size: 12px;
  color: #aaa;
  margin-top: 10px;
}

/* =========================
   MOBILE ADAPTATION
========================= */
@media (max-width: 768px) {
  body {
    flex-direction: column;
  }

  .sidebar {
    width: 100%;
    border-right: none;
    border-bottom: 1px solid #1f2a3a;
  }
}
</style>
</head>

<body>

<!-- ================= SIDEBAR ================= -->
<div class="sidebar">

  <h2>📻 RADIOWAVE</h2>

  <input id="genre" placeholder="Genre (rock, jazz, pop)" />
  <button onclick="applyFilter()">Apply Genre</button>

  <div class="topbar">
    <button class="smallbtn" onclick="loadStations()">Refresh</button>
    <button class="smallbtn" onclick="loadFavorites()">Favorites</button>
  </div>

  <!-- 🎧 PLAYER -->
  <div class="player-box">

    <div id="nowPlaying" class="now-playing">
      🎵 Not playing
    </div>

    <audio id="player"></audio>

    <div class="controls">
      <button onclick="playPause()">▶/⏸</button>
      <button onclick="stopAudio()">⏹</button>
    </div>

    <input type="range" min="0" max="1" step="0.01"
           value="1" onchange="setVolume(this.value)">

  </div>

  <div class="status" id="status">Loading...</div>
</div>

<!-- ================= MAIN ================= -->
<div class="main">

  <div id="list"></div>

</div>

<script>

/* =========================
   CONFIG
========================= */
const API = "https://all.api.radio-browser.info/json/stations/search";
const SHEET_API = "https://script.google.com/macros/s/AKfycbzZ5MwOcYUY_bpsUKSxPd810xE8rV_Y3z2GwzPublb_4O60CP8L_lC_V2kqkCQ_JdF5/exec";

let stations = [];
let favorites = [];
let mode = "stations";
let currentGenre = "";
let page = 0;
const limit = 30;

/* =========================
   LOAD STATIONS
========================= */
async function loadStations() {
  mode = "stations";

  let url = `${API}?countrycode=US&limit=${limit}&offset=${page * limit}&hidebroken=true`;
  if (currentGenre) url += `&tag=${encodeURIComponent(currentGenre)}`;

  setStatus("Loading stations...");

  const res = await fetch(url);
  stations = await res.json();

  render(stations);
}

/* =========================
   FAVORITES
========================= */
async function loadFavorites() {
  setStatus("Loading favorites...");

  const res = await fetch(SHEET_API + "?action=get");
  const data = await res.json().catch(() => []);

  favorites = data.data || data;
  mode = "favorites";

  render(favorites);
  setStatus(`Favorites: ${favorites.length}`);
}

/* =========================
   SAVE FAVORITE
========================= */
async function saveFavorite(i) {
  const s = stations[i];
  if (!s) return;

  await fetch(SHEET_API, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({
      action: "save",
      id: s.stationuuid,
      name: s.name,
      url: s.url_resolved || s.url,
      country: s.country,
      genre: currentGenre || "all",
      time: new Date().toISOString()
    })
  });

  setStatus("⭐ Saved");
}

/* =========================
   RENDER CARDS
========================= */
function render(list) {
  const el = document.getElementById("list");
  el.innerHTML = "";

  list.forEach((s, i) => {
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div class="card-title">${s.name || "Unknown Station"}</div>
      <div class="card-meta">
        ${s.country || ""} • ${s.genre || s.tags || ""}
      </div>
      <div class="card-actions">
        <button onclick="play(${i})">▶ Play</button>
        ${mode === "stations"
          ? `<button onclick="saveFavorite(${i})">⭐ Save</button>`
          : ""
        }
      </div>
    `;

    el.appendChild(div);
  });
}

/* =========================
   PLAY ENGINE
========================= */
function play(i) {
  const item = (mode === "stations") ? stations[i] : favorites[i];
  if (!item) return;

  const player = document.getElementById("player");
  const label = document.getElementById("nowPlaying");

  player.src = item.url_resolved || item.url;
  player.play();

  label.textContent = `🎵 ${item.name}`;
}

/* =========================
   PLAYER CONTROLS
========================= */
function playPause() {
  const p = document.getElementById("player");
  p.paused ? p.play() : p.pause();
}

function stopAudio() {
  const p = document.getElementById("player");
  p.pause();
  p.currentTime = 0;
  document.getElementById("nowPlaying").textContent = "🎵 Not playing";
}

function setVolume(v) {
  document.getElementById("player").volume = v;
}

/* =========================
   FILTER
========================= */
function applyFilter() {
  currentGenre = document.getElementById("genre").value.trim();
  page = 0;
  loadStations();
}

/* =========================
   STATUS
========================= */
function setStatus(t) {
  document.getElementById("status").textContent = t;
}

/* INIT */
loadStations();

</script>

</body>
</html>
