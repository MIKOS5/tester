<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>📻RADIOWAVE</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0f14;
  color: #fff;
  display: flex;
  height: 100vh;
}

/* ================= SIDEBAR ================= */
.sidebar {
  width: 240px;
  background: #111826;
  padding: 16px;
  box-sizing: border-box;
  border-right: 1px solid #1f2a3a;
}

h2 {
  margin: 0 0 10px;
}

input, button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
  border: none;
  font-size: 14px;
}

button {
  background: #1e88e5;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #1565c0;
}

/* ================= MAIN ================= */
.main {
  flex: 1;
  padding: 16px;
  overflow: auto;
}

/* TOP BAR */
.topbar {
  display: flex;
  gap: 10px;
  margin-bottom: 10px;
}

.smallbtn {
  flex: 1;
  padding: 10px;
  font-size: 13px;
}

/* ================= TABLE MODE (DESKTOP) ================= */
table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  padding: 12px;
  border-bottom: 1px solid #1f2a3a;
}

tr:hover {
  background: #182233;
}

/* ================= CARD MODE (MOBILE) ================= */
.card {
  background: #121a28;
  padding: 12px;
  margin-bottom: 10px;
  border-radius: 10px;
  border: 1px solid #1f2a3a;
}

.card.active {
  border: 2px solid #1e88e5;
}

.card-title {
  font-weight: bold;
}

.card-meta {
  font-size: 12px;
  color: #aaa;
  margin: 6px 0;
}

/* PLAYER */
.player-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #0f1722;
  border-top: 1px solid #1f2a3a;
  padding: 10px;
}

audio {
  width: 100%;
}

/* STATUS */
.status {
  font-size: 12px;
  color: #aaa;
  margin-top: 10px;
}

/* ================= RESPONSIVE SWITCH ================= */
@media (max-width: 768px) {
  body {
    flex-direction: column;
  }

  .sidebar {
    width: 100%;
    border-right: none;
    border-bottom: 1px solid #1f2a3a;
  }

  table {
    display: none; /* hide table on mobile */
  }

  #mobileList {
    display: block;
  }
}

@media (min-width: 769px) {
  #mobileList {
    display: none;
  }
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>RADIOWAVE</h2>

  <input id="search" placeholder="Search stations..." oninput="filterList()" />
  <input id="genre" placeholder="Genre filter" />

  <button onclick="applyFilter()">Apply Genre</button>
  <button onclick="loadStations()">Refresh</button>
  <button onclick="loadFavorites()">Favorites</button>

  <div class="status" id="status">Loading...</div>
</div>

<!-- MAIN -->
<div class="main">

  <div class="topbar">
    <button class="smallbtn" onclick="loadStations()">Stations</button>
    <button class="smallbtn" onclick="loadFavorites()">Favs</button>
  </div>

  <!-- DESKTOP TABLE -->
  <table id="table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Country</th>
        <th>Genre</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <!-- MOBILE CARDS -->
  <div id="mobileList"></div>

</div>

<!-- PLAYER -->
<div class="player-bar">
  <audio id="player" controls autoplay></audio>
</div>

<script>

const API = "https://all.api.radio-browser.info/json/stations/search";
const SHEET_API = "https://script.google.com/macros/s/AKfycbzZ5MwOcYUY_bpsUKSxPd810xE8rV_Y3z2GwzPublb_4O60CP8L_lC_V2kqkCQ_JdF5/exec";

let stations = [];
let favorites = [];
let mode = "stations";
let activeIndex = -1;

/* ================= LOAD ================= */
async function loadStations() {
  mode = "stations";
  setStatus("Loading stations...");

  const res = await fetch(`${API}?countrycode=US&limit=50&hidebroken=true`);
  stations = await res.json();

  render();
}

/* ================= FAVORITES ================= */
async function loadFavorites() {
  setStatus("Loading favorites...");

  const res = await fetch(SHEET_API + "?action=get");
  const data = await res.json().catch(()=>[]);
  favorites = data.data || data;

  mode = "favorites";
  render();

  setStatus(`Favorites: ${favorites.length}`);
}

/* ================= PLAY ================= */
function play(i) {
  const list = mode === "stations" ? stations : favorites;
  const item = list[i];

  if (!item) return;

  activeIndex = i;

  const player = document.getElementById("player");
  player.src = item.url_resolved || item.url;
  player.play();

  render(); // refresh highlight
}

/* ================= FILTER ================= */
function applyFilter() {
  const g = document.getElementById("genre").value.trim().toLowerCase();
  stations = stations.filter(s =>
    (s.tags || "").toLowerCase().includes(g)
  );
  render();
}

/* ================= SEARCH ================= */
function filterList() {
  const q = document.getElementById("search").value.toLowerCase();

  const list = mode === "stations" ? stations : favorites;

  const filtered = list.filter(s =>
    (s.name || "").toLowerCase().includes(q)
  );

  render(filtered);
}

/* ================= RENDER ================= */
function render(customList = null) {
  const list = customList || (mode === "stations" ? stations : favorites);

  renderTable(list);
  renderMobile(list);
}

/* TABLE */
function renderTable(list) {
  const tbody = document.querySelector("#table tbody");
  tbody.innerHTML = "";

  list.forEach((s, i) => {
    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${s.name || ""}</td>
      <td>${s.country || ""}</td>
      <td>${s.tags || ""}</td>
      <td><button onclick="play(${i})">▶</button></td>
    `;

    tbody.appendChild(tr);
  });
}

/* MOBILE CARDS */
function renderMobile(list) {
  const el = document.getElementById("mobileList");
  el.innerHTML = "";

  list.forEach((s, i) => {
    const div = document.createElement("div");
    div.className = "card" + (i === activeIndex ? " active" : "");

    div.innerHTML = `
      <div class="card-title">${s.name}</div>
      <div class="card-meta">${s.country || ""} • ${s.tags || ""}</div>
      <button onclick="play(${i})">▶ Play</button>
    `;

    el.appendChild(div);
  });
}

/* STATUS */
function setStatus(t) {
  document.getElementById("status").textContent = t;
}

/* INIT */
loadStations();

</script>

</body>
</html>
