<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Awesome Homepage 1999</title>

<style>
body {
    background: url('https://i.imgur.com/3ZQ3Z9v.png');
    font-family: "Comic Sans MS", cursive;
    text-align: center;
    color: yellow;
}

/* flashing text */
.flash {
    animation: flash 0.5s infinite;
    font-size: 28px;
}

@keyframes flash {
    0% { color: yellow; }
    50% { color: red; }
    100% { color: blue; }
}

.box {
    background: black;
    border: 5px dashed lime;
    margin: 20px auto;
    width: 70%;
    padding: 20px;
}

marquee {
    font-size: 20px;
    color: cyan;
}

button {
    padding: 10px;
    margin-top: 10px;
    font-family: Comic Sans MS;
}

#counter {
    font-size: 18px;
    color: white;
}
</style>
</head>

<body>

<div class="flash">WELCOME TO MY HOMEPAGE!!!!</div>

<marquee behavior="alternate">🔥 BEST SITE ON THE INTERNET 🔥 UNDER CONSTRUCTION 🚧</marquee>

<div class="box">
    <h2>About Me</h2>
    <p>Hello!!! I like computers and cats and cool web stuff!!!</p>
</div>

<div class="box">
    <h2>My Guestbook</h2>
    <p>Leave a message (it will be lost forever)</p>
    <button onclick="alert('Thanks for signing my guestbook!!!')">Sign Guestbook</button>
</div>

<div class="box">
    <h2>Visitor Counter</h2>
    <div id="counter">Visitors: 000001</div>
</div>

<div class="box">
    <h2>UNDER CONSTRUCTION</h2>
    <img src="https://media.giphy.com/media/3o7aD2saalBwwftBIY/giphy.gif" width="120">
</div>

<script>
let count = 1;

setInterval(() => {
    count++;
    document.getElementById("counter").innerText =
        "Visitors: " + String(count).padStart(6, "0");
}, 1000);
</script>

</body>
</html>
