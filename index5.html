<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Internet Archive XML File Browser</title>

<style>

body{
    background:#070d16;
    color:#d8e1ec;
    font-family:Arial,Helvetica,sans-serif;
    padding:20px;
}

h1{
    color:#2793ff;
}

input{
    width:100%;
    padding:12px;
    margin-bottom:20px;
    background:#111827;
    color:white;
    border:1px solid #333;
    border-radius:6px;
}

.card{
    background:#111827;
    border:1px solid #243044;
    border-radius:10px;
    padding:15px;
    margin-bottom:15px;
}

.title{
    color:#4da3ff;
    font-size:18px;
    font-weight:bold;
}

a{
    color:#5bc0ff;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
}

td{
    padding:5px;
    border-bottom:1px solid #263244;
}

.label{
    color:#8fa8c7;
    width:120px;
}

</style>

</head>

<body>

<h1>Internet Archive File Browser</h1>

<input id="search" placeholder="Search files...">

<div id="output">
Loading XML...
</div>


<script>

const XML_URL =
"https://dn720409.ca.archive.org/0/items/s-7-ep-41-beavis-butthead-are-dead/s-7-ep-41-beavis-butthead-are-dead_files.xml";


const BASE_URL =
"https://dn720409.ca.archive.org/0/items/s-7-ep-41-beavis-butthead-are-dead/";


let files=[];


fetch(XML_URL)
.then(r=>r.text())
.then(xml=>{


let parser=new DOMParser();

let doc=parser.parseFromString(xml,"text/xml");


let nodes=doc.querySelectorAll("file");


files=[...nodes].map(file=>{

let data={};

for(let attr of file.attributes){
    data[attr.name]=attr.value;
}


for(let child of file.children){

    data[child.tagName]=child.textContent;

}


data.url =
BASE_URL +
data.name.split("/")
.map(encodeURIComponent)
.join("/");


return data;

});


display(files);


});


function display(list){

let html="";


list.forEach(f=>{


html+=`

<div class="card">


<div class="title">
${f.name}
</div>


<table>

<tr>
<td class="label">Source</td>
<td>${f.source||""}</td>
</tr>

<tr>
<td class="label">Format</td>
<td>${f.format||""}</td>
</tr>


<tr>
<td class="label">Size</td>
<td>${formatBytes(f.size)}</td>
</tr>


<tr>
<td class="label">Duration</td>
<td>${f.length||""} seconds</td>
</tr>


<tr>
<td class="label">Resolution</td>
<td>${f.width||""} x ${f.height||""}</td>
</tr>


<tr>
<td class="label">MD5</td>
<td>${f.md5||""}</td>
</tr>


<tr>
<td class="label">SHA1</td>
<td>${f.sha1||""}</td>
</tr>


<tr>
<td class="label">CRC32</td>
<td>${f.crc32||""}</td>
</tr>


<tr>
<td class="label">URL</td>
<td>
<a href="${f.url}" target="_blank">
Open File
</a>
</td>
</tr>


</table>


</div>


`;

});


document.getElementById("output").innerHTML=html;


}


document.getElementById("search")
.addEventListener("input",e=>{

let q=e.target.value.toLowerCase();

display(
files.filter(x=>
x.name.toLowerCase().includes(q)
)
);

});


function formatBytes(bytes){

if(!bytes)return "";

let sizes=[
"Bytes",
"KB",
"MB",
"GB"
];

let i=Math.floor(
Math.log(bytes)/Math.log(1024)
);


return(
(bytes/Math.pow(1024,i))
.toFixed(2)
+" "+sizes[i]
);

}


</script>

</body>
</html>
