<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Untouchable Input</title>

<style>
body {
    font-family: Arial, sans-serif;
    height: 100vh;
    margin: 0;
    background: #f5f5f5;
    overflow: hidden;
}

h1 {
    text-align: center;
    margin-top: 40px;
}

#inputBox {
    position: absolute;
    width: 250px;
    padding: 10px;
    font-size: 16px;
    top: 200px;
    left: 50%;
    transform: translateX(-50%);
    transition: top 0.1s, left 0.1s;
}

#hint {
    text-align: center;
    margin-top: 20px;
    color: #666;
}
</style>
</head>

<body>

<h1>Try to click the input</h1>
<p id="hint">It doesn’t want to be found.</p>

<input id="inputBox" placeholder="Type here...">

<script>
const input = document.getElementById("inputBox");

let pos = {
    x: window.innerWidth / 2,
    y: 200
};

// update position
function moveInput(x, y) {
    input.style.left = x + "px";
    input.style.top = y + "px";
    pos.x = x;
    pos.y = y;
}

// distance check
document.addEventListener("mousemove", (e) => {
    const rect = input.getBoundingClientRect();

    const inputCenterX = rect.left + rect.width / 2;
    const inputCenterY = rect.top + rect.height / 2;

    const dx = e.clientX - inputCenterX;
    const dy = e.clientY - inputCenterY;

    const distance = Math.sqrt(dx * dx + dy * dy);

    // if mouse gets close, flee
    if (distance < 120) {
        let angle = Math.atan2(dy, dx);

        let fleeDistance = 80 + Math.random() * 60;

        let newX = pos.x - Math.cos(angle) * fleeDistance;
        let newY = pos.y - Math.sin(angle) * fleeDistance;

        // keep inside screen bounds
        newX = Math.max(0, Math.min(window.innerWidth - 260, newX));
        newY = Math.max(0, Math.min(window.innerHeight - 50, newY));

        moveInput(newX, newY);
    }
});

// also randomly jumps on its own
setInterval(() => {
    let newX = Math.random() * (window.innerWidth - 260);
    let newY = Math.random() * (window.innerHeight - 100);

    moveInput(newX, newY);
}, 2500);
</script>

</body>
</html>
