<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>📻 RadioWave Pro</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>

<style>
/* (UNCHANGED — your full CSS stays exactly the same) */
:root{
  --bg:#09111d;
  --panel:#111827;
  --panel2:#182233;
  --line:#253347;
  --text:#ffffff;
  --muted:#93a4bb;
  --blue:#2793ff;
  --blue2:#1869d9;
  --green:#17c964;
  --shadow: 0 10px 30px rgba(0,0,0,.35);
}

*{ box-sizing:border-box; }

body{
  margin:0;
  font-family:Inter,sans-serif;
  background: radial-gradient(circle at top,#17263f,#09111d 45%);
  color:white;
  display:flex;
  height:100vh;
  overflow:hidden;
}

/* --- keep ALL your existing CSS exactly as-is --- */
</style>
</head>

<body>

<div class="sidebar">

  <div class="logo">📻 Radio<span>Wave</span></div>
  <div class="subtitle">Live streaming radio dashboard</div>

  <input id="genre" class="search" placeholder="Search by genre..."/>

  <button class="main-btn" onclick="applyFilter()">🔎 Search Stations</button>

  <div class="grid-buttons">
    <button onclick="prevPage()">⬅ Prev</button>
    <button onclick="nextPage()">Next ➜</button>
    <button onclick="loadStations()">🔄 Refresh</button>
    <button onclick="loadFavorites()">⭐ Favorites</button>
  </div>

  <div class="radio-player">
    <div class="player-header">
      <div class="station-icon">📻</div>

      <div>
        <div id="npName">Not Playing</div>
        <div id="npMeta">Select a station</div>

        <div class="live">
          <div class="live-dot"></div>
          LIVE RADIO
        </div>
      </div>
    </div>

    <audio id="player"></audio>

    <div class="controls">
      <button onclick="prevStation()">⏮</button>
      <button id="playBtn" onclick="togglePlay()">▶</button>
      <button onclick="nextStation()">⏭</button>
      <button onclick="toggleFavCurrent()">⭐</button>
    </div>

    <div class="volume">
      <label>Volume</label>
      <input type="range" min="0" max="1" step="0.01" value="1"
        onchange="setVolume(this.value)"/>
    </div>
  </div>

  <div class="status" id="status">Loading stations...</div>
</div>

<div class="main">

  <div class="topbar">
    <div>
      <div class="page-title">United States Radio</div>
      <div class="count" id="count">0 stations loaded</div>
    </div>

    <div class="page-box" id="pageInfo">Page 1</div>
  </div>

  <div class="table-wrap">
    <table id="table">
      <thead>
        <tr>
          <th>Station</th>
          <th>Country</th>
          <th>Genre</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div id="mobileList"></div>
</div>

<script>

/* =========================
   API
========================= */

const API =
"https://all.api.radio-browser.info/json/stations/search";

const SHEET_API =
"https://script.google.com/macros/s/AKfycbzZ5MwOcYUY_bpsUKSxPd810xE8rV_Y3z2GwzPublb_4O60CP8L_lC_V2kqkCQ_JdF5/exec";

/* =========================
   OFFLINE JSON CACHE (NEW)
========================= */

const CACHE_KEY = "radiowave_offline_stations_v1";

/* =========================
   STATE
========================= */

let stations = [];
let allStations = [];
let favorites = [];
let favoriteIds = new Set();
let currentList = [];
let currentIndex = -1;
let page = 0;
const limit = 50;
let isPlaying = false;

/* =========================
   SAVE CACHE (NEW)
========================= */

function saveCache(data){
  try {
    localStorage.setItem(CACHE_KEY, JSON.stringify(data));
  } catch(e){}
}

/* =========================
   LOAD CACHE (NEW)
========================= */

function loadCache(){
  try {
    const raw = localStorage.getItem(CACHE_KEY);
    if(!raw) return null;
    return JSON.parse(raw);
  } catch(e){
    return null;
  }
}

/* =========================
   LOAD STATIONS (UPDATED ONLY ADD CACHE)
========================= */

async function loadStations(){

  setStatus("Loading stations...");

  try{

    const offset = page * limit;

    const res =
      await fetch(
        `${API}?countrycode=US&limit=${limit}&offset=${offset}&hidebroken=true`
      );

    const data = await res.json();

    stations = data;
    allStations = [...data];
    currentList = stations;

    /* ✅ SAVE OFFLINE CACHE */
    saveCache(data);

    render();

    setStatus(`Loaded ${stations.length} stations`);

  }catch(err){

    /* ✅ OFFLINE FALLBACK */
    const cached = loadCache();

    if(cached && cached.length){

      stations = cached;
      allStations = [...cached];
      currentList = cached;

      render();

      setStatus("⚠ Offline mode (cached stations)");

    } else {

      setStatus("Failed loading stations (no cache)");

    }

  }
}

/* =========================
   FAVORITES (UNCHANGED)
========================= */

async function loadFavorites(){

  setStatus("Loading favorites...");

  try{

    const res = await fetch(SHEET_API + "?action=get");

    const data = await res.json().catch(()=>[]);

    favorites = data.data || data;

    favoriteIds = new Set(
      favorites.map(f => f.id || f.stationuuid)
    );

    currentList = favorites;

    render();

    setStatus(`Loaded ${favorites.length} favorites`);

  }catch(err){
    setStatus("Failed loading favorites");
  }
}

/* =========================
   PLAY (UNCHANGED)
========================= */

function playStation(id){

  const item =
    currentList.find(s =>
      s.stationuuid === id || s.id === id
    );

  if(!item) return;

  currentIndex =
    currentList.findIndex(s =>
      s.stationuuid === id || s.id === id
    );

  const player = document.getElementById("player");

  player.src = item.url_resolved || item.url || "";
  player.play();

  isPlaying = true;

  document.getElementById("playBtn").textContent = "⏸";

  player.onerror = () => setStatus("❌ Stream unavailable");
  player.onplaying = () => setStatus("🎵 Live radio playing");

  updateNowPlaying();
}

/* =========================
   REMAINING CODE (UNCHANGED)
   (all your functions stay exactly the same)
========================= */

/* keep everything below exactly as you already had */
function updateNowPlaying(){ const item=currentList[currentIndex]; if(!item)return;
document.getElementById("npName").textContent=item.name||"Unknown";
document.getElementById("npMeta").textContent=`${item.country||""} • ${item.tags||"Radio"}`; }

function togglePlay(){ const p=document.getElementById("player");
const b=document.getElementById("playBtn"); if(!p.src)return;
if(isPlaying){p.pause();isPlaying=false;b.textContent="▶";setStatus("Paused");}
else{p.play();isPlaying=true;b.textContent="⏸";setStatus("Playing");}}

function nextStation(){ if(!currentList.length)return;
currentIndex=(currentIndex+1)%currentList.length;
playStation(currentList[currentIndex].stationuuid||currentList[currentIndex].id); }

function prevStation(){ if(!currentList.length)return;
currentIndex=(currentIndex-1+currentList.length)%currentList.length;
playStation(currentList[currentIndex].stationuuid||currentList[currentIndex].id); }

async function toggleFavorite(s){
const id=s.stationuuid||s.id;if(!id)return;
if(favoriteIds.has(id)){setStatus("Already saved");return;}

await fetch(SHEET_API,{
method:"POST",
body:new URLSearchParams({
action:"save",
id,
name:s.name||"",
url:s.url_resolved||s.url||"",
country:s.country||"",
genre:s.tags||"",
time:new Date().toISOString()
})
});

favoriteIds.add(id);
setStatus("⭐ Added to favorites");
render();
}

function toggleFavCurrent(){
const item=currentList[currentIndex];
if(item)toggleFavorite(item);
}

function applyFilter(){
const g=document.getElementById("genre").value.toLowerCase();

stations = !g ? [...allStations]
: allStations.filter(s=>(s.tags||"").toLowerCase().includes(g));

currentList=stations;
render();
setStatus(`Found ${stations.length} stations`);
}

function nextPage(){page++;loadStations();}
function prevPage(){if(page>0)page--;loadStations();}

function setVolume(v){
document.getElementById("player").volume=v;
}

function render(){
renderTable();renderMobile();

document.getElementById("count").textContent =
`${currentList.length} stations loaded`;

document.getElementById("pageInfo").textContent =
`Page ${page+1}`;
}

function renderTable(){ /* unchanged */ 
const tbody=document.querySelector("#table tbody");
tbody.innerHTML="";
currentList.forEach(s=>{
const id=s.stationuuid||s.id;
const tr=document.createElement("tr");
tr.innerHTML=`
<td><div class="station">${s.name||"Unknown"}</div></td>
<td>${s.country||""}</td>
<td><div class="tags">${s.tags||"Radio"}</div></td>
<td><button onclick="playStation('${id}')">▶ Play</button></td>`;
tbody.appendChild(tr);
});
}

function renderMobile(){ /* unchanged */ 
const el=document.getElementById("mobileList");
el.innerHTML="";
currentList.forEach(s=>{
const id=s.stationuuid||s.id;
const div=document.createElement("div");
div.className="card";
div.innerHTML=`
<div class="card-title">${s.name||"Unknown"}</div>
<div class="card-meta">${s.country||""}</div>
<button onclick="playStation('${id}')">▶ Play</button>`;
el.appendChild(div);
});
}

function setStatus(t){
document.getElementById("status").textContent=t;
}

document.getElementById("genre")
.addEventListener("keydown",e=>{
if(e.key==="Enter")applyFilter();
});

loadStations();

</script>

</body>
</html>
