<!DOCTYPE html>
<html>
<head>
  <title>RADIO OS - Live Favorites</title>

  <style>
    body {
      font-family: Arial;
      background: #0b0b0b;
      color: white;
      padding: 20px;
    }

    h2 {
      color: #1e88e5;
    }

    #list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 10px;
      margin-top: 20px;
    }

    .card {
      background: #151515;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
      border: 1px solid #222;
    }

    .card:hover {
      transform: scale(1.02);
      border-color: #1e88e5;
    }

    .name {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .meta {
      font-size: 12px;
      opacity: 0.7;
    }

    audio {
      width: 100%;
      margin-top: 15px;
    }

    #status {
      margin-top: 10px;
      font-size: 12px;
      opacity: 0.7;
    }
  </style>
</head>

<body>

<h2>⭐ RADIO OS - LIVE FAVORITES</h2>

<div id="status">Loading...</div>

<div id="list"></div>

<audio id="player" controls autoplay></audio>

<script>
const SHEET_API =
  "https://script.google.com/macros/s/AKfycbzZ5MwOcYUY_bpsUKSxPd810xE8rV_Y3z2GwzPublb_4O60CP8L_lC_V2kqkCQ_JdF5/exec";

let favorites = [];

// 🔄 LIVE REFRESH LOOP
async function loadFavorites() {
  try {
    const res = await fetch(SHEET_API + "?action=get");
    const data = await res.json();

    if (!data.ok) {
      setStatus("Backend error or no data");
      return;
    }

    favorites = data.data || [];

    render();
    setStatus("Live sync: " + favorites.length + " favorites");

  } catch (err) {
    console.log(err);
    setStatus("Failed to load sheet");
  }
}

function render() {
  const list = document.getElementById("list");
  list.innerHTML = "";

  favorites.forEach((f, i) => {
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div class="name">${f.name}</div>
      <div class="meta">🌍 ${f.country || "unknown"}</div>
      <div class="meta">🎵 ${f.genre || "unknown"}</div>
    `;

    div.onclick = () => play(f.url);

    list.appendChild(div);
  });
}

function play(url) {
  const player = document.getElementById("player");
  player.src = url;
  player.play();
}

function setStatus(t) {
  document.getElementById("status").innerText = t;
}

// 🔁 AUTO REFRESH EVERY 5 SECONDS
setInterval(loadFavorites, 5000);

// FIRST LOAD
loadFavorites();
</script>

</body>
</html>
