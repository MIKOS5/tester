<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>we know you</title>
<style>
body {
  margin:0;
  overflow:hidden;
  background:black;
  color:#0f0;
  font-family: monospace;
}

#terminal {
  position:absolute;
  width:100%;
  height:100%;
  padding:20px;
}

.red { color:red; }

</style>
</head>
<body>
<div id="terminal"></div>

<script>
const terminal = document.getElementById("terminal");

function typeLine(text, speed=20) {
  let i = 0;
  const line = document.createElement("div");
  terminal.appendChild(line);

  const interval = setInterval(() => {
    line.textContent += text[i];
    i++;
    if (i >= text.length) clearInterval(interval);
  }, speed);
}

// ===== SAFE FAKE PERSONAL DATA GENERATOR =====
function fakeIP() {
  return `${rand(10,255)}.${rand(0,255)}.${rand(0,255)}.${rand(0,255)}`;
}

function fakeLocation() {
  const cities = ["Los Angeles", "Chicago", "Houston", "Miami", "Seattle"];
  return cities[Math.floor(Math.random()*cities.length)];
}

function fakeName() {
  const first = ["Alex","Jordan","Taylor","Morgan","Casey"];
  const last = ["Smith","Johnson","Reyes","Carter","Lee"];
  return first[Math.floor(Math.random()*first.length)] + " " + last[Math.floor(Math.random()*last.length)];
}

function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min}

const profile = {
  name: fakeName(),
  ip: fakeIP(),
  location: fakeLocation(),
  device: navigator.userAgent,
  time: new Date().toLocaleTimeString()
};

// ===== DISPLAY FAKE "PERSONAL" INFO =====
setTimeout(()=>{
  typeLine("scanning...");
},1000);

setTimeout(()=>{
  typeLine("collecting user data...");
},2500);

setTimeout(()=>{
  typeLine("name: " + profile.name);
},4000);

setTimeout(()=>{
  typeLine("ip address: " + profile.ip);
},5500);

setTimeout(()=>{
  typeLine("location: " + profile.location);
},7000);

setTimeout(()=>{
  typeLine("device: " + profile.device.substring(0,60) + "...");
},8500);

setTimeout(()=>{
  typeLine("last activity: " + profile.time);
},10000);

setTimeout(()=>{
  const warn = document.createElement("div");
  warn.className = "red";
  warn.textContent = "this is not real... but it feels real, doesn't it?";
  terminal.appendChild(warn);
},12000);

// ===== WHISPER =====
let enabled=false;
document.addEventListener("click",()=>enabled=true);

function whisper(text){
  const u=new SpeechSynthesisUtterance(text);
  u.volume=0.2;
  u.rate=0.7;
  u.pitch=0.4;
  speechSynthesis.speak(u);
}

setInterval(()=>{
  if(!enabled) return;
  whisper("we're watching...");
},6000);

</script>
</body>
</html>
