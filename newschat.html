<style>

:root{
  --bg:#09111d;
  --panel:#111827;
  --line:#253347;
  --text:#fff;
  --muted:#93a4bb;
  --blue:#2793ff;
  --blue-dark:#1869d9;
  --panel-alt:#0b1220;
}

body.light{
  --bg:#f4f6f8;
  --panel:#ffffff;
  --line:#d9e2ec;
  --text:#102a43;
  --muted:#627d98;
  --blue:#4f8ef7;
  --blue-dark:#3b82f6;
  --panel-alt:#eef3f8;
}

html {
  touch-action: manipulation;
}

input, textarea, select {
  font-size: 16px !important;
  transform: translateZ(0);
}
  
html, body {
  height: 100%;
  overflow: hidden;
}

/* STOP iOS / Android auto zoom on inputs */
input, textarea {
  font-size: 16px !important;
}

/* ✅ BASE MOBILE/TAP FIXES (GLOBAL) */
button, input {
  font-size: 16px; /* prevents iOS zoom + improves readability */
}

.room, button {
  -webkit-tap-highlight-color: transparent;
}

.room {
  touch-action: manipulation;
}
  
*{box-sizing:border-box;}

body{
  margin:0;
  font-family:Inter,sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;
  height:100dvh;
  overflow: hidden;
}

.main, .sidebar {
  -webkit-overflow-scrolling: touch;
}

/* SIDEBAR */
.sidebar{
  width:340px;
  background:var(--panel);
  border-right:1px solid var(--line);
  padding:20px;
  overflow:auto;
}

.logo{
  font-family:Orbitron;
  font-size:22px;
  font-weight:900;
}

.logo span{ color:var(--blue); }

.subtitle{
  color:var(--muted);
  font-size:13px;
  margin-bottom:20px;
}

.player{
  margin-top:10px;
  padding:16px;
  border-radius:16px;
  background:var(--panel);
  border:1px solid var(--line);
}

.controls{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:12px;
}

button{
  border:none;
  border-radius:12px;
  padding:10px;
  background:linear-gradient(180deg,var(--blue),var(--blue-dark));
  color:white;
  font-weight:700;
  cursor:pointer;
}

/* MAIN */
.main{
  flex:1;
  padding:20px;
  overflow:auto;
}

.title{
  font-size:42px;
  font-weight:800;
  margin-bottom:15px;
}

/* NEWS */
.news-grid{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding-bottom:10px;
  scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
}

.room.active {
  border-left: 5px solid var(--blue);
}
  
.news-card{
  min-width:280px;
  flex:0 0 auto;
  scroll-snap-align:start;
}

.news-card:hover{
  border-color:var(--blue);
}

.news-grid::-webkit-scrollbar{
  height:6px;
}

.news-grid::-webkit-scrollbar-thumb{
  background:var(--line);
  border-radius:10px;
}
  
.news-title{
  font-weight:800;
  font-size:14px;
}

.news-desc{
  font-size:12px;
  color:var(--muted);
  margin-top:6px;
}

  
/* ROOMS */
.room{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px;
  margin-bottom:10px;
  cursor:pointer;
}

.room:hover{
  border-color:var(--blue);
}

.room-title{
  font-weight:800;
  display:flex;
  justify-content:space-between;
}

.room-meta{
  font-size:12px;
  color:var(--muted);
}

.last-msg{
  margin-top:8px;
  font-size:13px;
  font-weight:600;
}

/* CHAT */
.chat-popup{
  position:fixed;
  bottom:160px;
  right:20px;
  width: min(90vw, 600px);
  height: min(85vh, 700px);
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  z-index:99999;
}

.chat-popup.hidden{display:none;}

.chat-popup-header{
  padding:10px;
  font-weight:800;
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid var(--line);
  background:var(--panel-alt);
}

.chat-popup-log{
  flex:1;
  overflow-y:auto;
  padding:10px;
  font-size:13px;
}

.chat-msg{
  margin-bottom:6px;
  padding:6px;
  background:var(--panel-alt);
  border-radius:8px;
}

.chat-name{
  color:var(--blue);
  font-weight:800;
}

.chat-input{
  display:flex;
  gap:5px;
  padding:8px;
  border-top:1px solid var(--line);
}

.chat-input input{
  flex:1;
  padding:6px;
  border-radius:8px;
  border:1px solid var(--line);
  background:var(--bg);
  color:var(--text);
}

#chatFloatBtn{
  position:fixed;
  bottom:90px;
  right:20px;
  width:55px;
  height:55px;
  border-radius:50%;
}

/* FULLSCREEN CHAT MODE */
.chat-popup.fullscreen {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;

  width: 100%;
  height: calc(var(--vh, 1vh) * 100);

  border-radius: 0;
  z-index: 99999999;

  display: flex;
  flex-direction: column;

  /* IMPORTANT: remove transform usage */
  transform: none !important;
}

/* =========================
   FULLSCREEN MOBILE CHAT MODE
   ========================= */
.chat-popup.fullscreen {
  font-size: 18px; /* base scale up */
}

/* bigger messages like SMS */
.chat-popup.fullscreen .chat-msg {
  font-size: 20px;
  padding: 14px;
  border-radius: 14px;
  margin-bottom: 10px;
  line-height: 1.4;
}

/* name larger */
.chat-popup.fullscreen .chat-name {
  font-size: 20px;
}

/* input bar bigger + fixed like app */
.chat-popup.fullscreen .chat-input {
  position: sticky;
  bottom: 0;
  background: var(--panel);
  padding: 12px;
  gap: 8px;
}

/* input fields bigger touch targets */
.chat-popup.fullscreen .chat-input input {
  font-size: 18px;
  min-height: 48px;
  padding: 10px;
}

/* buttons bigger like Android chat apps */
.chat-popup.fullscreen .chat-input button {
  min-width: 48px;
  min-height: 48px;
  font-size: 18px;
}

/* message area padding so it doesn't hide behind keyboard */
.chat-popup.fullscreen .chat-popup-log {
  padding-bottom: 160px;
}

/* smoother bubbles like messaging apps */
.chat-popup.fullscreen .chat-msg {
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(6px);
}
/* NEW SORT BAR */
.room-tools{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin:10px 0;
}

.room-tools input{
  width:100%;
  flex:none;
  padding:8px;
  border-radius:10px;
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--text);
}

.room-tools select{
  width:100%;
  flex:none;
  padding:8px;
  border-radius:10px;
  border:1px solid var(--line);
  background:var(--panel);
  color:var(--text);
}

.room-group-title{
  margin:15px 0 8px;
  font-weight:800;
  font-size:14px;
  color:var(--muted);
}


@media (max-width:768px){
  .room-tools input{
    flex:1;
    width:auto;
  }
}

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbzin84qDcZ9L1q4pTBtHZGKJSTDcZ_wnmgWmnmgPgf1jrc1nRprzbEBixKMSHcdkxiZBg/exec";
const NEWS_API = "https://script.google.com/macros/s/AKfycbzin84qDcZ9L1q4pTBtHZGKJSTDcZ_wnmgWmnmgPgf1jrc1nRprzbEBixKMSHcdkxiZBg/exec";
const GIPHY_API_KEY = "Jj5LhUt9MgP8OQYtxGukhQVwZuR6YJ4j";

const blockedDomains = ["news.google.com", "facebook.com", "twitter.com"];
  
let messages = [];
let newsData = [];
let activeRoom = "global";
let activeRoomName = "";
let lastSendTime = 0;
const SEND_COOLDOWN_MS = 1500; // 1.5 seconds
let autoScroll = true;
let activeCategory = "news";
let popupRefreshTimer = null;
let lastPopupHash = "";

/* ---------------- NEWS ---------------- */
let emojiPickerBuilt = false;


function toggleEmojiPicker(){

    const picker = document.getElementById("emojiPicker");

    if(picker.style.display === "block"){
        picker.style.display = "none";
        return;
    }

    picker.style.display = "block";

    if(emojiPickerBuilt) return;

    const el = new EmojiMart.Picker({

        theme: document.body.classList.contains("light") ? "light" : "dark",

        onEmojiSelect(e){

            popupMsg.value += e.native;

            popupMsg.focus();

        }

    });

    picker.appendChild(el);

    emojiPickerBuilt = true;

}
  
async function loadNews(){
  try {
    const res = await fetch(API_URL,{
      method:"POST",
      body:JSON.stringify({
        action:"get",
        source:"news"
      })
    });

    const data = await res.json();

    newsData = data.filter(m => m.source === "news" || m.stationName);

  } catch(e){
    console.error("News load failed:", e);
  }
}
  
function slugify(text){
  return text.toLowerCase().replace(/[^a-z0-9]+/g,'-').slice(0,40);
}

function extractUrl(text){
  const match = text.match(/https?:\/\/[^\s|]+/);
  return match ? match[0] : null;
}

function setCategory(cat){
    activeCategory = cat;
    load();      // reload correct sheet(s)
}
  
function openNewsRoom(article){

  const topic = slugify(article.title);

  activeRoom = topic;
  activeRoomName = article.title;

  fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({
      action:"send",
      station:topic,
      stationName:article.title,
      name:"NewsBot",
      message:article.description || "Breaking news"
    })
  });

  openRoom(topic);

}


async function discussNews(id, title){

  if (!id) return;

  const safeId = id.trim();

  // ensure backend writes SAME structure as table
  await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({
      action:"send",
      station:safeId,
      stationName:title,   // 👈 critical
      name:"NewsBot",
      message:"📰 Discussion started"
    })
  });

  await load();

  // 🔥 force identical behavior as table click
  const room = messages.find(m => m.station === safeId);

  activeRoom = safeId;
  activeRoomName = room?.stationName || title || safeId;

  toggleChatPopup();
  loadPopup();
}
  
/* ---------------- ROOMS ---------------- */

async function load(){

  const res = await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({
      action:"get",
      station:"",
      source:activeCategory === "all" ? "all" : activeCategory
    })
  });

  messages = await res.json();
  renderRooms();
}


function renderRoom(r){

  const active = r.id === activeRoom ? "active" : "";

  return `
    <div class="room ${active}" onclick="openRoom('${r.id}')">
      <div class="room-title">
        ${r.name}
        <span>${r.count}</span>
      </div>
      <div class="last-msg">
        ${r.user} ${r.last}
      </div>
    </div>
  `;
}


function renderRooms() {
  const rooms = {};
  const q = document.getElementById("searchBox").value.toLowerCase();
  const sort = document.getElementById("sortBox").value;

  for (let m of messages) {
    if (!m || !m.station) continue;

    const id = m.station.trim();
    if (!id || id === "undefined") continue;

    const text = `${m.stationName || ""}`.toLowerCase();

    if (q && !text.includes(q)) continue;

    if (!rooms[id]) {
      rooms[id] = {
        id,
        name: m.stationName || id,
        count: 0,
        last: "",
        user: "",
        source: (m.source || "chat").toLowerCase()
      };
    }

    rooms[id].count++;
  }

  let list = Object.values(rooms);

  if (sort === "name") {
    list.sort((a, b) => a.name.localeCompare(b.name));
  } else {
    list.sort((a, b) => b.count - a.count);
  }

  // =========================
  // GROUPS (NOW 3 SOURCES)
  // =========================
  const chatRooms = [];
const teamRooms = [];
const newsRooms = [];

for (const r of list) {
  const srcs = r.sources || new Set();

  if (srcs.has("news")) {
    newsRooms.push(r);
  } 
  else if (srcs.has("teams")) {
    teamRooms.push(r);
  } 
  else {
    chatRooms.push(r);
  }
}

  document.getElementById("rooms").innerHTML = `
    <div class="room-group-title">Rooms</div>
    ${chatRooms.map(renderRoom).join("")}
  `;
}
/* ---------------- CHAT ---------------- */

function openRoom(id){

  activeRoom = id;
  lastPopupHash = "";

  const room = messages.find(m => m.station === id);
  activeRoomName = room?.stationName || id;

  const isTeams = room?.source === "teams";

  document.getElementById("popupTitle").textContent =
      isTeams ? `🏈 ${activeRoomName}` : `💬 ${activeRoomName}`;

  renderRooms();   // <-- ADD THIS

  toggleChatPopup();
}

function toggleChatPopup() {

  const popup = document.getElementById("chatPopup");

  popup.classList.toggle("hidden");

  if (!popup.classList.contains("hidden")) {

    loadPopup();

    // refresh every 2 seconds
    clearInterval(popupRefreshTimer);

    popupRefreshTimer = setInterval(() => {

      loadPopup();

    }, 2000);

  } else {

    clearInterval(popupRefreshTimer);

  }

}

async function loadPopup(){

  if (document.getElementById("chatPopup").classList.contains("hidden")) {
    return;
  }

  const res = await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({
      action:"get",
      station:activeRoom
    })
  });

  const data = await res.json();

  if (!data.length) return;

  // Only update the DOM if something changed
  const hash = JSON.stringify(data);

  if (hash === lastPopupHash) {
    return;
  }

  lastPopupHash = hash;

  // ======================
  // 📌 PINNED HEADER
  // ======================

  const headerMsg = data[0];
  const chatMsgs = data.slice(1);

  const headerUrl = extractUrl(headerMsg.message);

  const headerClean = headerUrl
      ? headerMsg.message.replace(headerUrl,"").replace("|","").trim()
      : headerMsg.message;

  let html = "";

  html += `
    <div class="chat-msg" style="border:2px solid var(--blue);background:var(--panel);">
      <div class="chat-name">📌 ${headerMsg.name} (Pinned)</div>

      ${headerClean}

      ${headerUrl ? `
        <div style="margin-top:6px;">
          <a href="#" onclick="openPreview('${encodeURIComponent(headerUrl)}')">
            🔗 View Source
          </a>
        </div>
      ` : ""}
    </div>
  `;

  // ======================
  // 💬 CHAT MESSAGES
  // ======================

  html += chatMsgs.map(m => {

    const url = extractUrl(m.message);

    const cleanText = url
      ? m.message.replace(url,"").replace("|","").trim()
      : m.message;

    let body = "";

    if (m.message.startsWith("[GIF]")) {

      body = `
        <img
          src="${m.message.replace("[GIF]","")}"
          style="
            max-width:260px;
            border-radius:10px;
            display:block;
            margin-top:6px;
          ">
      `;

    } else {

      body = cleanText;

    }

    return `
      <div class="chat-msg">

        <span class="chat-name">${m.name}:</span>

        ${body}

        ${url && !m.message.startsWith("[GIF]") ? `
          <div style="margin-top:6px;">
            <a href="#"
onclick="openPreview('${encodeURIComponent(url)}')"
onmouseenter="showHoverPreview('${url}', event)"
onmouseleave="hideHoverPreview()">
🔗 View Source
</a>
          </div>
        ` : ""}

      </div>
    `;

  }).join("");

  const chat = document.getElementById("popupMessages");

chat.innerHTML = joypixels.toImage(html);

smartScroll();
}

async function sendPopupMsg(){
  const now = Date.now();

  // 🚫 cooldown check
  if (now - lastSendTime < SEND_COOLDOWN_MS) {
    return;
  }

  const name = popupName.value || "Anon";
  const msg = popupMsg.value;
  if(!msg) return;

  lastSendTime = now;

  // 🔒 disable send button immediately (prevents double click spam)
  setSendDisabled(true);

  await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({
      action:"send",
      station:activeRoom,
      stationName:activeRoomName,
      name:name,
      message:msg
    })
  });

  popupMsg.value="";
  document.getElementById("emojiPicker").style.display = "none";

  loadPopup();

  // 🔓 re-enable after cooldown delay
  setTimeout(() => {
    setSendDisabled(false);
  }, SEND_COOLDOWN_MS);
}

/* ---------------- UTIL ---------------- */
function setSendDisabled(state){
  const btn = document.querySelector(".chat-input button[onclick='sendPopupMsg()']");
  if (btn) btn.disabled = state;
}

function scrollToBottom(){
  const chatLog = document.getElementById("popupMessages");

  chatLog.scrollTop = chatLog.scrollHeight;

  autoScroll = true;

  document.getElementById("scrollBottomBtn").style.display = "none";
}
  
function createRoom(){

  const name = prompt("Room name?");
  if(!name) return;

  const id = slugify(name);

  activeRoom = id;
  activeRoomName = name;

  fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({
      action:"send",
      station:id,
      stationName:name,
      name:"System",
      message:"Room created"
    })
  });

  load().then(() => {
    openRoom(id);   // 👈 auto-open after refresh
  });

}

function smartScroll() {
  const chat = document.getElementById("popupMessages");

  const atBottom =
    chat.scrollHeight - chat.scrollTop - chat.clientHeight < 80;

  if (atBottom) {
    chat.scrollTo({
      top: chat.scrollHeight,
      behavior: "smooth"
    });
  }
}

function toggleChatFullscreen() {
  const popup = document.getElementById("chatPopup");
  popup.classList.toggle("fullscreen");

  if (navigator.vibrate) navigator.vibrate(10);
}
  
function openPreview(url){
  const decoded = decodeURIComponent(url);

  const frame = document.getElementById("previewFrame");
  const modal = document.getElementById("linkPreview");

  modal.classList.remove("hidden");

  let finished = false;

  // reset iframe
  frame.src = "about:blank";

  // HARD fallback timer (primary safety net)
  const timeout = setTimeout(() => {
    if (finished) return;
    finished = true;

    closePreview();
    window.open(decoded, "_blank");
  }, 1500);

  // iframe load attempt
  frame.onload = () => {
    if (finished) return;

    try {
      // try to detect "empty / blocked" pages
      const doc = frame.contentWindow?.location?.href;

      // if still blank or about:blank → treat as failure
      if (!doc || doc === "about:blank") {
        throw new Error("blocked or empty iframe");
      }

      finished = true;
      clearTimeout(timeout);
    } catch (e) {
      finished = true;
      clearTimeout(timeout);
      closePreview();
      window.open(decoded, "_blank");
    }
  };

  frame.src = decoded;
}

function adjustForKeyboard() {
  const popup = document.getElementById("chatPopup");

}
  
function closePreview(){

let hoverTimer;

function showHoverPreview(url, event){

  clearTimeout(hoverTimer);

  hoverTimer = setTimeout(()=>{

    const box = document.getElementById("hoverPreview");

    box.innerHTML = `
      <iframe src="${url}"></iframe>
    `;

    box.style.display = "block";

    let x = event.clientX + 20;
    let y = event.clientY + 20;

    // keep inside screen
    if(x + 350 > window.innerWidth){
      x = window.innerWidth - 370;
    }

    if(y + 220 > window.innerHeight){
      y = window.innerHeight - 240;
    }

    box.style.left = x + "px";
    box.style.top = y + "px";

  },500);

}


function hideHoverPreview(){

  clearTimeout(hoverTimer);

  const box = document.getElementById("hoverPreview");

  box.style.display="none";
  box.innerHTML="";

}
