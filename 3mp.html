<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>
Obvyris Archive MP3 Engine
</title>


<style>

*{
box-sizing:border-box;
}


body{

background:#070d16;
color:#d8e1ec;
font-family:Arial,Helvetica,sans-serif;
margin:10px;
padding-bottom:130px;

}


h1{

color:#2793ff;
font-size:26px;

}


/* SEARCH */

.controls{

background:#101923;
border:1px solid #26384f;
padding:12px;
border-radius:8px;

display:flex;
gap:10px;
flex-wrap:wrap;

}


input,button,select{

background:#17263a;
color:white;

border:1px solid #31465f;

padding:10px;

border-radius:6px;

font-size:15px;

}


input{

width:320px;

}


button{

background:#2793ff;
cursor:pointer;

}


button:hover{

background:#55b5ff;

}



/* TABLE */

.table{

margin-top:15px;

border:1px solid #26384f;

border-radius:8px;

overflow:hidden;

}



.header,
.track{


display:grid;

grid-template-columns:

40px
40px
minmax(260px,2fr)
180px
220px
80px
80px
90px
90px;


align-items:center;

gap:8px;

padding:10px;

}


.header{

background:#152235;

color:#65c9ff;

font-weight:bold;

}



.track{

background:#101923;

border-top:1px solid #26384f;

font-size:14px;

}



.track:hover{

background:#1b3048;

}



.song{

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

color:#55b8ff;

font-weight:bold;

}



.meta{

color:#aab8c8;

}



.smallbtn{

padding:6px 10px;

font-size:13px;

}



/* QUEUE */

#queue{

position:fixed;

right:10px;

top:80px;

width:280px;

max-height:70vh;

overflow:auto;

background:#101923;

border:1px solid #26384f;

border-radius:8px;

padding:10px;

display:none;

}



.queueItem{

padding:8px;

border-bottom:1px solid #26384f;

font-size:13px;

cursor:pointer;

}



.queueItem:hover{

background:#1b3048;

}



/* PLAYER */

#playerBar{

position:fixed;

bottom:0;
left:0;
right:0;

background:#101923;

border-top:1px solid #26384f;

padding:10px;

z-index:9999;

}



#now{

color:#55b8ff;
font-weight:bold;

}


audio{

width:100%;

}



/* MOBILE */

@media(max-width:700px){


.header{

display:none;

}



.track{


display:grid;

grid-template-columns:

35px
35px
1fr;


}


.track div:nth-child(n+4){

display:none;

}


input{

width:100%;

}


.controls button{

width:100%;

}



}



</style>


</head>


<body>



<h1>

🎵 Obvyris Archive MP3 Engine

</h1>



<div class="controls">


<input id="search"
placeholder="Search MP3, artist, album...">


<button onclick="searchMP3()">

SEARCH

</button>


<button onclick="toggleQueue()">

QUEUE

</button>


</div>



<div id="status">

Ready

</div>



<div class="table">


<div class="header">


<div>
☐
</div>


<div>
▶
</div>


<div>
Song
</div>


<div>
Artist
</div>


<div>
Album
</div>


<div>
Time
</div>


<div>
Size
</div>


<div>
Queue
</div>


<div>
Download
</div>



</div>



<div id="results">


</div>


</div>





<div id="queue">


<h3>
Queue
</h3>


<div id="queueList">

</div>


<button onclick="clearQueue()">

Clear

</button>


</div>





<div id="playerBar">


<div id="now">

No Track Playing

</div>


<audio id="audio" controls></audio>


<button onclick="previousTrack()">
◀
</button>


<button onclick="nextTrack()">
▶
</button>


</div>







<script>


let tracks=[];


let queue=[];


let queueIndex=0;



/*
 SAMPLE DATA

 Replace this with Internet Archive API results

*/


tracks=[

{

name:"Train Kept A Rolling.mp3",

artist:"Led Zeppelin",

album:"Evolution Is Timing",

time:"8:31",

size:"19 MB",

url:"song.mp3"

},


{

name:"Dazed And Confused.mp3",

artist:"Led Zeppelin",

album:"Evolution Is Timing",

time:"14:08",

size:"31 MB",

url:"song2.mp3"

}

];



renderTracks();



function renderTracks(){


let box=document.getElementById("results");

box.innerHTML="";


tracks.forEach((t,i)=>{


box.innerHTML += `


<div class="track">


<div>

<input type="checkbox">

</div>


<div>

<button class="smallbtn"
onclick="play(${i})">

▶

</button>

</div>



<div class="song">

${t.name}

</div>


<div class="meta">

${t.artist}

</div>


<div class="meta">

${t.album}

</div>


<div>

${t.time}

</div>


<div>

${t.size}

</div>


<div>

<button class="smallbtn"
onclick="addQueue(${i})">

➕

</button>

</div>


<div>

<a href="${t.url}" download>

⬇

</a>

</div>


</div>


`;

});


}




function play(i){


let t=tracks[i];


let audio=document.getElementById("audio");


audio.src=t.url;


audio.play();



document.getElementById("now").innerHTML=

"🎵 "+t.name;


}




function addQueue(i){


queue.push(tracks[i]);


renderQueue();

}



function renderQueue(){


let box=document.getElementById("queueList");


box.innerHTML="";


queue.forEach((t,i)=>{


box.innerHTML+=`

<div class="queueItem"
onclick="playQueue(${i})">

${i+1}. ${t.name}

</div>

`;

});


}



function playQueue(i){

queueIndex=i;

let t=queue[i];


let index=
tracks.indexOf(t);


play(index);

}



function nextTrack(){

if(queue.length){

queueIndex++;

if(queueIndex>=queue.length)
queueIndex=0;


playQueue(queueIndex);

}

}



function previousTrack(){

if(queue.length){

queueIndex--;

if(queueIndex<0)
queueIndex=queue.length-1;


playQueue(queueIndex);

}

}



function clearQueue(){

queue=[];

renderQueue();

}



function toggleQueue(){

let q=document.getElementById("queue");


q.style.display=

q.style.display=="block"
?"none"
:"block";

}



function searchMP3(){

let text=
document.getElementById("search").value.toLowerCase();


tracks =
tracks.filter(t=>

(t.name+t.artist+t.album)
.toLowerCase()
.includes(text)

);


renderTracks();

}


</script>


</body>

</html>
