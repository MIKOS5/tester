<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>
Obvyris Archive MP3 Engine
</title>


<style>


*{
box-sizing:border-box;
}



body{

margin:10px;

background:#070d16;

color:#d8e1ec;

font-family:

Arial,
Helvetica,
sans-serif;

font-size:15px;

padding-bottom:170px;

}



/* HEADER */


h1{

color:#2793ff;

font-size:26px;

margin:5px 0 15px;

}



/* SEARCH */


.controls{


background:#101923;

border:1px solid #26384f;

border-radius:10px;

padding:12px;


display:flex;

gap:10px;

flex-wrap:wrap;


}



input,
select,
button{


background:#17263a;

color:white;

border:1px solid #31465f;

border-radius:6px;

padding:10px 14px;

font-size:15px;

}



input{

width:320px;

}



button{


background:#2793ff;

cursor:pointer;

font-weight:bold;

}



button:hover{

background:#55b5ff;

}




#status{

margin-top:12px;

color:#9aaabd;

}



/* RESULT TABLE */


.musicTable{


margin-top:15px;

border:1px solid #26384f;

border-radius:10px;

overflow:hidden;

}




.tableHeader{


display:grid;


grid-template-columns:

40px
45px
minmax(250px,2fr)
170px
220px
80px
80px
80px
90px;


background:#142338;


padding:12px;

color:#65c9ff;

font-weight:bold;

align-items:center;


}




.trackRow{


display:grid;


grid-template-columns:

40px
45px
minmax(250px,2fr)
170px
220px
80px
80px
80px
90px;



padding:10px 12px;


background:#101923;


border-top:1px solid #26384f;


align-items:center;


}



.trackRow:hover{


background:#182b43;


}




.songTitle{


color:#55b8ff;

font-weight:bold;


white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;


}




.artist,
.album,
.size,
.duration{


color:#b5c3d5;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;


}




.smallButton{


padding:6px 10px;

font-size:13px;

}



a{

color:#65c9ff;

text-decoration:none;

}



a:hover{

text-decoration:underline;

}



/* CHECKBOX */


input[type="checkbox"]{


width:18px;

height:18px;


}



/* QUEUE PANEL */


#queuePanel{


position:fixed;


right:15px;

top:80px;


width:330px;


max-height:70vh;


overflow:auto;


background:#101923;


border:1px solid #26384f;


border-radius:10px;


padding:12px;


display:none;


z-index:9000;


}




.queueTitle{


font-size:18px;

color:#55b8ff;

font-weight:bold;

margin-bottom:10px;


}




.queueItem{


padding:10px;


border-bottom:1px solid #26384f;

cursor:pointer;


}



.queueItem:hover{


background:#182b43;


}




/* PLAYER */


#playerBar{


position:fixed;


bottom:0;

left:0;

right:0;


background:#101923;


border-top:1px solid #26384f;


padding:12px;


z-index:9999;


}




#nowPlaying{


color:#55b8ff;

font-weight:bold;

font-size:16px;


}




#playerControls{


display:flex;

gap:8px;

margin-top:8px;

flex-wrap:wrap;


}



audio{


width:100%;

height:40px;


}





/* MOBILE */


@media(max-width:700px){



body{

margin:5px;

font-size:16px;

}



h1{

font-size:22px;

text-align:center;

}



.controls{


display:block;

}



.controls input,
.controls select,
.controls button{


width:100%;

margin-bottom:10px;


height:55px;

font-size:18px;


}





.tableHeader{


display:none;


}




.trackRow{


display:grid;


grid-template-columns:

35px
40px
1fr;


gap:8px;


padding:12px;



}



.trackRow > div:nth-child(n+4){


display:none;


}



.songTitle{


font-size:16px;


}



#queuePanel{


left:10px;

right:10px;

width:auto;


}



}



</style>

</head>


<body>



<h1>

🎵 Obvyris Archive MP3 Engine

</h1>



<div class="controls">


<input 
id="search"
placeholder="Search songs, artists, albums...">



<input
id="artist"
placeholder="Artist">



<select id="sort">


<option value="relevance">

Relevance

</option>


<option value="downloads desc">

Most Popular

</option>


<option value="date desc">

Newest

</option>


<option value="titleSorter asc">

Title A-Z

</option>


</select>



<button onclick="searchMP3()">

🔎 SEARCH MP3

</button>



<button onclick="toggleQueue()">

📂 QUEUE

</button>


</div>




<div id="status">

Ready

</div>





<div class="musicTable">



<div class="tableHeader">


<div>
☐
</div>


<div>
▶
</div>


<div>
Song
</div>


<div>
Artist
</div>


<div>
Album
</div>


<div>
Time
</div>


<div>
Size
</div>


<div>
Queue
</div>


<div>
Download
</div>



</div>



<div id="results">

</div>



</div>





<!-- QUEUE -->

<div id="queuePanel">


<div class="queueTitle">

🎵 Playback Queue

</div>


<div id="queueList">

</div>


<button onclick="clearQueue()">

Clear Queue

</button>


</div>





<!-- PLAYER -->


<div id="playerBar">


<div id="nowPlaying">

No Track Playing

</div>



<audio id="audio" controls></audio>



<div id="playerControls">


<button onclick="previousTrack()">

◀ Previous

</button>



<button onclick="togglePlay()">

▶ / ⏸

</button>



<button onclick="nextTrack()">

Next ▶

</button>



<button onclick="shuffleQueue()">

🔀 Shuffle

</button>


</div>


</div>



<script>

// =====================================
// DIRECT MP3 FILE SEARCH
// =====================================


let tracks = [];

let currentPage = 0;

let pageSize = 100;


// =====================================
// DIRECT MP3 FILENAME SEARCH
// =====================================

async function searchMP3(){

let search =
document.getElementById("search").value.trim();


let artist =
document.getElementById("artist").value.trim();



let query =
"format:MP3";



if(search){

query +=
' AND title:("' + search + '")';

}



if(artist){

query +=
' AND creator:("' + artist + '")';

}



let url =

"https://archive.org/advancedsearch.php?q="

+
encodeURIComponent(query)

+

"&fl[]=identifier,title,creator,format,collection"

+

"&rows=200"

+

"&output=json";




document.getElementById("status").innerHTML =
"Searching MP3 index...";



let response =
await fetch(url);



let data =
await response.json();



tracks=[];



data.response.docs.forEach(item=>{


tracks.push({


name:item.title || "Unknown",


artist:item.creator || "Unknown",


album:item.collection || "Archive",


identifier:item.identifier,


url:

"https://archive.org/download/"

+
item.identifier



});


});



document.getElementById("status").innerHTML =

"Found "
+
tracks.length
+
" MP3 records";



renderTracks();


}

function formatSize(bytes){


if(!bytes)
return "";


bytes=parseInt(bytes);


let sizes=[
"B",
"KB",
"MB",
"GB"
];


let i =
Math.floor(
Math.log(bytes) /
Math.log(1024)
);



return (

bytes /
Math.pow(1024,i)

).toFixed(1)
+
" "
+
sizes[i];


}


function playTrack(index){

if(!tracks[index])
return;


playURL(tracks[index]);

}
  
// =====================================
// PLAYER + QUEUE ENGINE
// =====================================


let queue = [];

let currentTrack = 0;

let repeatMode = false;

let shuffleMode = false;



const audio =
document.getElementById("audio");




// LOAD SAVED QUEUE


window.onload=function(){


let saved =
localStorage.getItem(
"obvyrisQueue"
);



if(saved){


queue =
JSON.parse(saved);


renderQueue();


}


};





// ADD TRACK TO QUEUE


function addQueue(index){


let track =
tracks[index];


if(!track)
return;



queue.push(track);



saveQueue();


renderQueue();



document.getElementById("status").innerHTML =

"Added to queue: "

+
track.name;



}





// SAVE QUEUE


function saveQueue(){


localStorage.setItem(

"obvyrisQueue",

JSON.stringify(queue)

);


}





// DISPLAY QUEUE


function renderQueue(){



let box =
document.getElementById("queueList");



box.innerHTML="";



queue.forEach((track,index)=>{


box.innerHTML += `


<div class="queueItem">


${index+1}.

${escapeHTML(track.name)}


<br>


<button

class="smallButton"

onclick="playQueue(${index})">

▶ Play

</button>



<button

class="smallButton"

onclick="removeQueue(${index})">

❌

</button>



</div>


`;



});


}




// PLAY FROM QUEUE


function playQueue(index){


if(!queue[index])
return;



currentTrack=index;



playURL(queue[index]);



}





// PLAY URL


function playURL(track){



audio.src =
track.url;



audio.play();



document.getElementById(
"nowPlaying"
).innerHTML =


"🎵 "
+
track.name
+
"<br>"
+
track.artist;



}





// NEXT


function nextTrack(){


if(queue.length===0)
return;



if(shuffleMode){


currentTrack =
Math.floor(
Math.random()
*
queue.length
);



}

else{


currentTrack++;



if(currentTrack >= queue.length){


if(repeatMode){


currentTrack=0;


}

else{


currentTrack =
queue.length-1;


return;


}


}



}



playQueue(currentTrack);



}




// PREVIOUS


function previousTrack(){



if(queue.length===0)
return;



currentTrack--;



if(currentTrack<0)

currentTrack =
queue.length-1;



playQueue(currentTrack);



}





// REMOVE QUEUE ITEM


function removeQueue(index){


queue.splice(index,1);


saveQueue();


renderQueue();


}





// CLEAR QUEUE


function clearQueue(){


queue=[];


saveQueue();


renderQueue();



}




// TOGGLE PLAY


function togglePlay(){



if(audio.paused){


audio.play();


}

else{


audio.pause();


}


}





// AUTO NEXT WHEN FINISHED


audio.onended=function(){


nextTrack();


};






// SHUFFLE


function shuffleQueue(){



queue.sort(()=>Math.random()-0.5);



saveQueue();


renderQueue();



}




// TOGGLE QUEUE PANEL


function toggleQueue(){



let panel =
document.getElementById(
"queuePanel"
);



if(panel.style.display==="block"){


panel.style.display="none";


}

else{


panel.style.display="block";


}



}





// EXPORT PLAYLIST


function exportPlaylist(){


let data =
JSON.stringify(
queue,
null,
2
);



let blob =
new Blob(
[data],
{
type:"application/json"
}
);



let url =
URL.createObjectURL(blob);



let a =
document.createElement("a");


a.href=url;


a.download=
"obvyris-playlist.json";


a.click();



}





// IMPORT PLAYLIST


function importPlaylist(file){


let reader =
new FileReader();



reader.onload=function(e){


queue =
JSON.parse(
e.target.result
);



saveQueue();


renderQueue();


};



reader.readAsText(file);



}
  
</script>


</body>

</html>
