<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Obvyris Games</title>

<style>

body{
    background:#111;
    color:white;
    font-family:Arial, sans-serif;
    margin:0;
    padding:20px;
}

h1{
    text-align:center;
}

#games{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
}

.game{
    background:#222;
    width:250px;
    padding:15px;
    border-radius:12px;
    box-shadow:0 0 10px #000;
}

.game img{
    width:100%;
    height:160px;
    object-fit:cover;
    border-radius:8px;
}

.game h2{
    margin:10px 0;
}

.game p{
    color:#ccc;
}

button{
    width:100%;
    padding:12px;
    border:0;
    border-radius:8px;
    background:#008cff;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#00aaff;
}

#error{
    color:red;
    text-align:center;
}

</style>

</head>


<body>


<h1>🎮 Obvyris Games</h1>


<div id="games">
Loading...
</div>

<div id="error"></div>



<script>


const API = 
"https://script.google.com/macros/s/AKfycbz_NGVTztTuc81a5_1K839CTu1V4bcc9IWXkqlNBYSJN8WSqSUbH2YP8xjqZPE3c7fzNg/exec";



function showGames(data){


console.log("Games API:",data);


const container =
document.getElementById("games");


if(!data.games){

container.innerHTML="No games found";

return;

}



container.innerHTML="";



data.games.forEach(game=>{


if(game.Status !== "Active")
return;



container.innerHTML += `

<div class="game">


<img src="${game.Image}" 
onerror="this.style.display='none'">


<h2>${game.Name}</h2>


<p>
<b>Category:</b> ${game.Category}
</p>


<p>
${game.Description}
</p>


<button onclick="playGame('${game.URL}')">
PLAY
</button>


</div>

`;


});


}



function playGame(url){

window.location.href=url;

}



// JSONP LOAD

const script=document.createElement("script");

script.src =
API + "?callback=showGames";


script.onerror=function(){

document.getElementById("error").innerHTML =
"API ERROR - Unable to load games";

};


document.body.appendChild(script);



</script>


</body>
</html>
