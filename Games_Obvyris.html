<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Games Obvyris</title>

<link rel="icon" href="https://mikos5.github.io/tester/navicon.png">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">


<style>


:root{

--bg:#09111d;
--panel:#111827;
--border:#253347;

--blue:#2793ff;
--blue-dark:#1869d9;

--text:#fff;
--muted:#93a4bb;

}



*{
box-sizing:border-box;
}



body{

margin:0;

height:100vh;

display:flex;

overflow:hidden;

background:var(--bg);

color:var(--text);

font-family:Inter,Arial;

}



/* SIDEBAR */


#sidebar{

width:180px;

height:100vh;

background:var(--panel);

border-right:1px solid var(--border);

display:flex;

flex-direction:column;

overflow-y:auto;

flex-shrink:0;

}



.brand{

padding:12px;

cursor:pointer;

}



.logo{

font-family:Orbitron;

font-size:22px;

font-weight:900;

}



.logo span{

color:var(--blue);

}



.subtitle{

font-size:11px;

color:var(--muted);

}



.group{

margin:6px;

padding:10px;

border-radius:10px;

background:var(--bg);

border:1px solid var(--border);

cursor:pointer;

font-size:13px;

}



.group:hover{

border-color:var(--blue);

background:#132238;

}



/* APP MENU */


.app-menu{

display:none;

position:absolute;

top:70px;

left:15px;

width:230px;

background:var(--panel);

border:1px solid var(--border);

border-radius:14px;

z-index:999;

overflow:hidden;

}



.app-menu.open{

display:block;

}



.app-menu div{

padding:14px;

cursor:pointer;

font-weight:700;

}



.app-menu div:hover{

background:var(--blue);

}





/* MAIN */


#main{

flex:1;

height:100vh;

overflow:auto;

padding:20px;

}



/* SEARCH */


#search{

width:100%;

padding:12px;

background:var(--panel);

border:1px solid var(--border);

border-radius:10px;

color:white;

margin-bottom:20px;

outline:none;

}



#search::placeholder{

color:var(--muted);

}



/* HEADER */


h1{

font-family:Orbitron;

margin-top:0;

}





/* GAMES */


#games{

display:grid;

grid-template-columns:
repeat(auto-fill,minmax(230px,1fr));

gap:18px;

}




.game{

background:var(--panel);

border:1px solid var(--border);

border-radius:14px;

overflow:hidden;

transition:.2s;

}



.game:hover{

transform:translateY(-5px);

border-color:var(--blue);

}



.game img{

width:100%;

height:150px;

object-fit:cover;

background:#000;

}




.info{

padding:14px;

}



.game h2{

font-family:Orbitron;

font-size:18px;

margin:0 0 8px;

}



.game p{

color:var(--muted);

font-size:14px;

}



button{

width:100%;

padding:11px;

border:0;

border-radius:10px;

background:
linear-gradient(
180deg,
var(--blue),
var(--blue-dark)
);

color:white;

font-weight:800;

cursor:pointer;

}



button:hover{

filter:brightness(1.15);

}





#error{

color:red;

}





/* MOBILE */


@media(max-width:700px){


#sidebar{

width:70px;

}


.logo{

font-size:15px;

}


.subtitle,
.group{

font-size:0;

}


.group{

height:40px;

}


#main{

padding:12px;

}


#games{

grid-template-columns:
repeat(2,1fr);

}


}



</style>


</head>


<body>



<div id="sidebar">


<div class="brand" onclick="toggleMenu()">


<div class="logo">

Games <span>Obvyris</span>

</div>


<div class="subtitle">

Game Library

</div>


</div>



<div id="appMenu" class="app-menu">


<div onclick="go('index99.html')">
🏠 Obvyris Home
</div>


<div onclick="go('Video_Obvyris.html')">
📺 Video Obvyris
</div>


<div onclick="go('Radio_Obvyris.html')">
📻 Radio Obvyris
</div>


<div onclick="go('newschat.html')">
💬 Chat Obvyris
</div>


</div>




<div class="group">
🎮 Games
</div>


<div class="group">
⭐ Favorites
</div>


<div class="group">
🕹 Categories
</div>



</div>






<div id="main">


<h1>
🎮 Game Library
</h1>



<input id="search"
placeholder="Search games..."
oninput="filterGames()">



<div id="games">

Loading...

</div>



<div id="error"></div>


</div>






<script>


const API =
"https://script.google.com/macros/s/AKfycbz_NGVTztTuc81a5_1K839CTu1V4bcc9IWXkqlNBYSJN8WSqSUbH2YP8xjqZPE3c7fzNg/exec";



let allGames=[];



function showGames(data){


console.log(data);


allGames=data.games || [];


renderGames(allGames);


}



function renderGames(games){


const container=
document.getElementById("games");


container.innerHTML="";


games.forEach(game=>{


if(game.Status!=="Active")
return;



container.innerHTML += `


<div class="game">


<img src="${game.Image}"
onerror="this.src='https://mikos5.github.io/tester/navicon.png'">


<div class="info">


<h2>
${game.Name}
</h2>


<p>
🎮 ${game.Category}
<br>
🕹 ${game.Type}
</p>


<p>
${game.Description}
</p>


<button onclick="playGame('${game.URL}')">

PLAY

</button>


</div>


</div>


`;



});


}



function filterGames(){


let q=document
.getElementById("search")
.value
.toLowerCase();



renderGames(
allGames.filter(g=>

g.Name.toLowerCase().includes(q)
||
g.Category.toLowerCase().includes(q)

)

);


}



function playGame(url){

window.location.href=url;

}



function toggleMenu(){

document
.getElementById("appMenu")
.classList.toggle("open");

}



function go(page){

location.href="./"+page;

}




const script=document.createElement("script");

script.src=
API+"?callback=showGames";


script.onerror=function(){

document.getElementById("error").innerHTML=
"API ERROR";

};


document.body.appendChild(script);



</script>


</body>
</html>
