<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#09111d">

<title>Games Obvyris</title>

<link rel="icon" href="https://mikos5.github.io/tester/navicon.png">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">


<style>

:root{

--bg:#09111d;
--panel:#111827;
--border:#253347;

--blue:#2793ff;
--blue-dark:#1869d9;

--text:#fff;
--muted:#93a4bb;

}


*{

box-sizing:border-box;

}


html,body{

width:100%;

height:100%;

overscroll-behavior:none;

-webkit-tap-highlight-color:transparent;

}


body{

margin:0;

height:100vh;

display:flex;

overflow:hidden;

background:var(--bg);

color:var(--text);

font-family:Inter,Arial;

}


/* SIDEBAR */

#sidebar{

width:180px;

height:100vh;

background:var(--panel);

border-right:1px solid var(--border);

display:flex;

flex-direction:column;

overflow-y:auto;

flex-shrink:0;

}


.brand{

padding:12px;

cursor:pointer;

}


.logo{

font-family:Orbitron;

font-size:22px;

font-weight:900;

}


.logo span{

color:var(--blue);

}


.subtitle{

font-size:11px;

color:var(--muted);

}


/* SIDEBAR BUTTONS */

.group{

margin:6px;

padding:10px;

border-radius:10px;

background:var(--bg);

border:1px solid var(--border);

cursor:pointer;

font-size:13px;

touch-action:manipulation;

}


.group:hover{

border-color:var(--blue);

background:#132238;

}



/* APP MENU */

.app-menu{

display:none;

position:absolute;

top:70px;

left:15px;

width:230px;

background:var(--panel);

border:1px solid var(--border);

border-radius:14px;

z-index:999;

overflow:hidden;

}


.app-menu.open{

display:block;

}


.app-menu div{

padding:14px;

cursor:pointer;

font-weight:700;

}


.app-menu div:hover{

background:var(--blue);

}



/* MAIN */

#main{

flex:1;

min-width:0;

height:100vh;

overflow:auto;

padding:20px;

-webkit-overflow-scrolling:touch;

}



/* SEARCH */

#search{

width:100%;

padding:12px;

background:var(--panel);

border:1px solid var(--border);

border-radius:10px;

color:white;

margin-bottom:20px;

outline:none;

}


#search::placeholder{

color:var(--muted);

}



/* HEADER */

h1{

font-family:Orbitron;

margin-top:0;

}



/* GAMES */

#games{

display:grid;

grid-template-columns:repeat(auto-fill,minmax(230px,1fr));

gap:18px;

}


.game{

background:var(--panel);

border:1px solid var(--border);

border-radius:14px;

overflow:hidden;

transition:.2s;

touch-action:manipulation;

}


.game:hover{

transform:translateY(-5px);

border-color:var(--blue);

}


.game img{

width:100%;

height:150px;

object-fit:cover;

background:#000;

user-select:none;

-webkit-user-drag:none;

}


.info{

padding:14px;

}


.game h2{

font-family:Orbitron;

font-size:18px;

margin:0 0 8px;

}


.game p{

color:var(--muted);

font-size:14px;

}



/* BUTTONS */

button{

width:100%;

padding:11px;

border:0;

border-radius:10px;

background:linear-gradient(180deg,var(--blue),var(--blue-dark));

color:white;

font-weight:800;

cursor:pointer;

touch-action:manipulation;

}


button:hover{

filter:brightness(1.15);

}


#error{

color:red;

}



/* GAME PLAYER */

#gamePlayer{

display:none;

position:fixed;

top:50%;

left:50%;

transform:translate(-50%,-50%);

width:80vw;

height:80vh;

background:#000;

border:2px solid var(--blue);

border-radius:15px;

z-index:5000;

box-shadow:0 0 40px #000;

resize:both;

overflow:hidden;

min-width:320px;

min-height:240px;

}


.playerHeader{

height:45px;

background:var(--panel);

display:flex;

align-items:center;

justify-content:space-between;

padding:8px 12px;

font-family:Orbitron;

}


.playerHeader button{

width:auto;

padding:6px 10px;

margin-left:5px;

}


#gameFrame{

width:100%;

height:calc(100% - 45px);

border:0;

background:black;

}



/* FULLSCREEN */

#gamePlayer:fullscreen{

width:100vw;

height:100vh;

border:0;

border-radius:0;

}



/* ANDROID MOBILE FIX */

@media(max-width:700px){


#sidebar{

position:fixed;

left:0;

top:0;

width:72px;

height:100vh;

z-index:1000;

background:var(--panel);

display:flex;

flex-direction:column;

align-items:center;

overflow-y:auto;

}



#main{

position:relative;

margin-left:72px;

width:calc(100% - 72px);

height:100vh;

padding:12px;

overflow-y:auto;

-webkit-overflow-scrolling:touch;

}



.logo{

font-size:12px;

line-height:1.2;

text-align:center;

}


.subtitle{

display:none;

}



/* FIXED ICON SIDEBAR BUTTONS */

.group{

width:56px;

height:50px;

margin:6px auto;

padding:0;

font-size:0;

display:flex;

align-items:center;

justify-content:center;

background:var(--bg);

border:1px solid var(--border);

border-radius:10px;

position:relative;

overflow:hidden;

}


.group::before{

position:absolute;

left:50%;

top:50%;

transform:translate(-50%,-50%);

font-size:25px;

line-height:1;

}


.group:nth-of-type(1)::before{

content:"🎮";

}


.group:nth-of-type(2)::before{

content:"⭐";

}


.group:nth-of-type(3)::before{

content:"🕹";

}



.app-menu{

left:75px;

top:70px;

width:230px;

}



/* MOBILE GAMES */

#games{

grid-template-columns:repeat(2,minmax(140px,1fr));

gap:10px;

}


.game img{

height:110px;

}


.game h2{

font-size:14px;

}


.game p{

font-size:12px;

}


button{

padding:12px;

font-size:14px;

}



/* PLAYER */

#gamePlayer{

width:95vw;

height:85vh;

}


.playerHeader{

height:50px;

}


}
</style>

</head>


<body>



<div id="sidebar">


<div class="brand" onclick="toggleMenu()">


<div class="logo">

Games <span>Obvyris</span>

</div>


<div class="subtitle">

Game Library

</div>


</div>



<div id="appMenu" class="app-menu">
    <div onclick="navigateApp('index99.html')">
        🏠 Home
    </div>

    <div onclick="navigateApp('Radio_Obvyris.html')">
        📻 Radio Obvyris
    </div>
  
    <div onclick="navigateApp('Video_Obvyris.html')">
        📺 Video Obvyris
    </div>
  
    <div onclick="navigateApp('newschat.html')">
        💬 Chat Obvyris
    </div>

    <div onclick="navigateApp('news.html')">
        📰 News Obvyris
    </div>

</div>





<div class="group">
🎮 Games
</div>


<div class="group">
⭐ Favorites
</div>


<div class="group">
🕹 Categories
</div>



</div>






<div id="main">


<h1>
🎮 Game Library
</h1>



<input id="search"
placeholder="Search games..."
oninput="filterGames()">



<div id="games">

Loading...

</div>



<div id="error"></div>


</div>



<div id="gamePlayer">

<div class="playerHeader">

<span id="playerTitle">
Game Player
</span>

<div>
<button onclick="reloadGame()">🔄</button>
<button onclick="fullscreenGame()">⛶</button>
<button onclick="closeGame()">✖</button>
</div>

</div>


<iframe 
id="gameFrame"
allowfullscreen>
</iframe>


</div>


<script>


const API =
"https://script.google.com/macros/s/AKfycbz_NGVTztTuc81a5_1K839CTu1V4bcc9IWXkqlNBYSJN8WSqSUbH2YP8xjqZPE3c7fzNg/exec";



let allGames=[];



function showGames(data){


console.log(data);


allGames=data.games || [];


renderGames(allGames);


}



function renderGames(games){


const container=
document.getElementById("games");


container.innerHTML="";


games.forEach(game=>{


if(game.Status!=="Active")
return;



container.innerHTML += `


<div class="game">


<img src="${game.Image}"
onerror="this.src='https://mikos5.github.io/tester/navicon.png'">


<div class="info">


<h2>
${game.Name}
</h2>


<p>
🎮 ${game.Category}
<br>
🕹 ${game.Type}
</p>


<p>
${game.Description}
</p>


<button onclick="playGame('${game.URL}','${game.Name}')">

PLAY

</button>


</div>


</div>


`;



});


}



function filterGames(){


let q=document
.getElementById("search")
.value
.toLowerCase();



renderGames(
allGames.filter(g=>

g.Name.toLowerCase().includes(q)
||
g.Category.toLowerCase().includes(q)

)

);


}


function playGame(url,name){


document.getElementById("gamePlayer").style.display="block";


document.getElementById("gameFrame").src=url;


document.getElementById("playerTitle").innerHTML=
name || "Game Player";


}



function toggleMenu(){

document
.getElementById("appMenu")
.classList.toggle("open");

}



function go(page){

location.href="./"+page;

}




const script=document.createElement("script");

script.src=
API+"?callback=showGames";


script.onerror=function(){

document.getElementById("error").innerHTML=
"API ERROR";

};


document.body.appendChild(script);

function closeGame(){

document.getElementById("gamePlayer").style.display="none";

document.getElementById("gameFrame").src="";

}



function reloadGame(){

let frame=document.getElementById("gameFrame");

frame.src=frame.src;

}



function fullscreenGame(){

let player=document.getElementById("gamePlayer");


if(player.requestFullscreen){

player.requestFullscreen();

}
else if(player.webkitRequestFullscreen){

player.webkitRequestFullscreen();

}

}

window.addEventListener("popstate",()=>{

let player=document.getElementById("gamePlayer");

if(player.style.display==="block"){

closeGame();

}

});

function navigateApp(page){

window.location.href = page;

}
</script>


</body>
</html>
