<!DOCTYPE html>
<html>
<head>

<title>Obvyris Games</title>

<style>

body{
background:#111;
color:white;
font-family:Arial;
}

.game{
background:#222;
padding:15px;
margin:15px;
border-radius:10px;
width:250px;
display:inline-block;
}

.game img{
width:100%;
height:150px;
object-fit:cover;
border-radius:8px;
}

button{
background:#00aaff;
border:0;
padding:10px;
color:white;
cursor:pointer;
}

</style>

</head>


<body>


<h1>Obvyris Games</h1>


<div id="games">
Loading...
</div>



<script>

const API =
"https://script.google.com/macros/s/YOUR_ID/exec";


function loadGames(){


const callback="showGames";


window[callback]=function(data){


console.log(data);


let box=document.getElementById("games");


box.innerHTML="";


data.games.forEach(game=>{


if(game.Status!="Active")
return;


box.innerHTML += `

<div class="game">


<img src="${game.Image}">


<h2>${game.Name}</h2>


<p>${game.Category}</p>

<p>${game.Description}</p>


<button onclick="playGame('${game.URL}')">
Play
</button>


</div>

`;


});


};



let script=document.createElement("script");

script.src =
API +
"?callback="+callback;


document.body.appendChild(script);



}



function playGame(url){

window.location.href=url;

}


loadGames();


</script>


</body>
</html>
