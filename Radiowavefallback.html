<style>

:root{
  --bg:#09111d;
  --panel:#111827;
  --line:#253347;
  --text:#fff;
  --muted:#93a4bb;

  --blue:#2793ff;
  --blue-dark:#1869d9;

  --green:#17c964;
  --green-dark:#0ea85a;

  --button-dark:#444;
  --button-dark2:#222;

  --panel-alt:#0b1220;
}

/* 🌙 LIGHT MODE */
body.light{
  --bg:#f4f6f8;
  --panel:#ffffff;

  --line:#d9e2ec;

  --text:#102a43;
  --muted:#627d98;

  --blue:#4f8ef7;
  --blue-dark:#3b82f6;

  --green:#16a34a;
  --green-dark:#15803d;

  --button-dark:#e9eef5;
  --button-dark2:#dbe4ef;

  --panel-alt:#eef3f8;
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:Inter,sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;
  height:100vh;
  overflow:hidden;

  transition: background 0.3s, color 0.3s;
}

/* SIDEBAR */
.sidebar{
  width:340px;
  background:var(--panel);
  border-right:1px solid var(--line);
  padding:20px;
  overflow:auto;
}

.logo{
  font-family:'Orbitron', sans-serif;
  font-size:42px;
  font-weight:900;
  letter-spacing:2px;
  text-transform:uppercase;
  text-shadow:0 0 8px rgba(39,147,255,.35);
}

.logo span{
  color:var(--blue);
}

.subtitle{
  color:var(--muted);
  font-size:13px;
  margin-bottom:20px;
}

/* GENRES */
.genre-grid{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  max-height:2000px;
  overflow:hidden;
  transition: max-height 0.3s ease, opacity 0.2s ease;
}

.genre:hover{
  transform:translateY(-1px);
  border-color:var(--blue);
  background:rgba(39,147,255,0.12);
}

.genre:hover{
  border-color:var(--blue);
  transform:translateY(-2px);
}

.genre.active{
  background:var(--blue);
  color:white;
  border-color:var(--blue-dark);
  box-shadow:0 4px 14px rgba(39,147,255,0.35);
}

/* PLAYER */
.player{
  margin-top:20px;
  padding:16px;
  border-radius:20px;
  background:var(--panel);
  border:1px solid var(--line);
}

.now{font-weight:700;}
.meta{font-size:12px;color:var(--muted);}

.controls{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:12px;
}

button{
  border:none;
  border-radius:12px;
  padding:10px;
  background:linear-gradient(180deg,
    var(--blue),
    var(--blue-dark));
  color:var(--text);
  font-weight:700;
  cursor:pointer;
}

.controls button {
  font-size: 30px;   /* 👈 emoji + text size */
  padding: 12px;
}
  
/* MAIN */
.main{
  flex:1;
  padding:20px;
  overflow:auto;
}

.title{
  font-size:46px;
  font-weight:800;
  margin-bottom:10px;
}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px;
  margin-bottom:10px;
}

.station{
  font-weight:700;
  font-size:22px; /* <-- change this */
}
.small{font-size:12px;color:var(--muted);}

.row{
  display:flex;
  gap:10px;
  margin-top:10px;
}

/* FAVORITE BUTTON */
.fav-btn{
  background:linear-gradient(
    180deg,
    var(--button-dark),
    var(--button-dark2)
  );
}

.fav-btn.saved{
  background:linear-gradient(
    180deg,
    var(--green),
    var(--green-dark)
  );
}

/* MOBILE */
@media(max-width:900px){
  body{flex-direction:column;height:auto;}
  .sidebar{width:100%;}
}

::-webkit-scrollbar{
  width:10px;
}

::-webkit-scrollbar-track{
  background:transparent;
}

::-webkit-scrollbar-thumb{
  background:rgba(39,147,255,.7);
  border-radius:999px;
  backdrop-filter:blur(10px);
}

::-webkit-scrollbar-thumb:hover{
  background:rgba(39,147,255,1);
}

.dropdown {
  position: relative;
  user-select: none;
}

.dropdown-menu {
  display: none;
  position: absolute;
  left: 0;
  top: 100%;
  width: 100%;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  z-index: 999;
  overflow: hidden;
}

.dropdown-menu div {
  padding: 10px;
  cursor: pointer;
  font-weight: 600;
}

.dropdown-menu div:hover {
  background:var(--blue);
}

/* show on hover */
.dropdown:hover .dropdown-menu {
  display: block;
}

.genre-section {
  margin-top: 10px;
}

/* header bar */
.genre{
  padding:8px 10px;        /* smaller padding */
  border-radius:12px;      /* slightly tighter */
  font-size:13px;          /* smaller text */
  background:var(--panel);
  border:1px solid var(--line);
  text-align:center;
  cursor:pointer;
  font-weight:700;
  transition:.15s;
  line-height:1.2;
}

/* collapse animation */
.genre-grid {
  display: grid;
  grid-template-columns: repeat(10, minmax(0, 1fr));
  gap: 6px;

  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--panel);

  max-height: 2000px;
  overflow: hidden;
  transition: max-height 0.3s ease, opacity 0.2s ease;
}

/* collapsed state */
.genre-grid.collapsed {
  max-height: 0;
  opacity: 0;
  pointer-events: none;
  padding-top: 0;
  padding-bottom: 0;
  border: 0;
}

/* responsive columns */
@media (max-width: 1400px) {
  .genre-grid {
    grid-template-columns: repeat(6, 1fr);
  }
}

@media (max-width: 1000px) {
  .genre-grid {
    grid-template-columns: repeat(4, 1fr);
  }
}

@media (max-width: 700px) {
  .genre-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

/* ACTION GRID */
.action-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
  margin-top: 12px;
  margin-bottom: 10px;
}

.action-grid .genre{
    min-height:50px;
    font-size:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0 12px;
}

/* CHAT */
.chat-box {
  margin-top: 15px;
  border: 1px solid var(--line);
  border-radius: 16px;
  overflow: hidden;
  background: var(--panel);
}

.chat-header{
  padding:10px;
  font-weight:800;
  background:var(--panel-alt);
  border-bottom:1px solid var(--line);
}

.chat-log{
  height:180px;
  overflow-y:auto;
  padding:10px;
  font-size:12px;
}

.chat-msg{
  margin-bottom:6px;
  padding:6px;
  background:var(--panel-alt);
  border-radius:8px;
}

.chat-name{
  color:var(--blue);
  font-weight:800;
}

.chat-input{
  display:flex;
  gap:5px;
  padding:8px;
  border-top:1px solid var(--line);
}

.chat-input{
  display:flex;
  gap:5px;
}

.chat-input input{
  padding:6px;
  border-radius:8px;
  border:1px solid var(--line);
  background:var(--bg);
  color:var(--text);
}

.chat-popup .chat-input{
  display:flex;
  gap:5px;
  padding:8px;
  border-top:1px solid var(--line);
  background: var(--panel);
}

.chat-popup .chat-input input{
  padding:6px;
  border-radius:8px;
  border:1px solid var(--line);
  background:var(--bg);
  color:var(--text);
}
  
#chatName{
  width:70px;
  flex:0 0 auto;
}

#chatMsg,
#chatMsgPopup {

}

  bottom: 20px;
  right: 20px;
  z-index: 9999;

  padding: 12px 14px;

  background: linear-gradient(180deg, var(--blue), var(--blue-dark));

  font-weight: 800;

}

.brand{

    transition:.2s;

.brand:hover{

.brand:active{

#chatFloatBtn{

  right: 20px;

  height: 55px;

  z-index: 99999;
  box-shadow: 0 10px 25px rgba(0,0,0,.4);
}

.chat-popup{
  position: fixed;
  bottom: 160px;
  right: 20px;
  width: 35vw;
  height: 70vh;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;

  flex-direction: column;
  overflow: hidden;
  z-index: 99999;
  box-shadow: 0 20px 40px rgba(0,0,0,.5);
}

.chat-popup.hidden{
  display: none;
}

.chat-popup-header{
  display:flex;
  justify-content: space-between;
  align-items:center;
  padding:10px;
  background: var(--panel-alt);

  border-bottom: 1px solid var(--line);
}

.chat-popup-log{
  flex:1;
  overflow-y:auto;
  padding:10px;

}

.chat-popup .chat-input{
  padding:8px;
  border-top:1px solid var(--line);
}
  
#backToTop.show{
  opacity: 1;
  pointer-events: auto;
}
</style>
</head>

  "
>

<div style="display:flex;gap:10px;margin-bottom:15px;">
  <button onclick="prevPage()">⬅ Prev</button>
  <button onclick="nextPage()">Next ➡</button>
</div>

</div>

<script>

let currentGenre = "";
let filterMode = false;
let current = [];
let index = 0;
let favorites = new Set();
let page = 0;
const PAGE_SIZE = 500;
let currentCountry = "United States";
let playingIndex = null;
let stationStarted = false;
let metadataAbort = null;
let liveModeEnabled = false;
  
/* API */
const RADIO =
"https://all.api.radio-browser.info/json/stations/search";

const SHEET =
"https://script.google.com/macros/s/AKfycbzZ5MwOcYUY_bpsUKSxPd810xE8rV_Y3z2GwzPublb_4O60CP8L_lC_V2kqkCQ_JdF5/exec";

  
const GENRES = [
  { id:"50s", label:"📻 50s Hits" },
  { id:"60s", label:"🎙 60s Hits" },
  { id:"70s", label:"✌️ 70s Hits" },
  { id:"80s", label:"📼 80s Hits" },
  { id:"90s", label:"💿 90s Hits" },
  { id:"2000s", label:"📀 2000s Hits" },

  { id:"acoustic", label:"🎸 Acoustic" },
  { id:"afrobeats", label:"🌍 Afrobeats" },
  { id:"ambient", label:"🌫 Ambient" },
  { id:"alternative", label:"🎸 Alternative" },
  { id:"anime", label:"🌸 Anime Music" },

  { id:"blues", label:"🎺 Blues" },
  { id:"bollywood", label:"🎬 Bollywood" },
  { id:"bluegrass", label:"🪕 Bluegrass" },

  { id:"celtic", label:"☘️ Celtic" },

  { id:"classical", label:"🎻 Classical" },
  { id:"comedy", label:"😂 Comedy" },
  { id:"country", label:"🤠 Country" },

  { id:"disco", label:"🪩 Disco" },
  { id:"drum and bass", label:"🥁 Drum & Bass" },
  { id:"dubstep", label:"💥 Dubstep" },

  { id:"edm", label:"⚡ EDM" },
  { id:"electronic", label:"🎛 Electronic" },
  { id:"experimental", label:"🧪 Experimental" },

  { id:"folk", label:"🪕 Folk" },
  { id:"funk", label:"🕺 Funk" },

  { id:"gospel", label:"🙏 Gospel" },
  { id:"grunge", label:"☔ Grunge" },

  { id:"hardstyle", label:"⚙️ Hardstyle" },
  { id:"hip hop", label:"🔥 Hip Hop" },
  { id:"holiday", label:"🎄 Holiday" },
  { id:"house", label:"🏠 House" },
  { id:"hits", label:"⭐ Hits" },

  { id:"indie", label:"🎧 Indie" },

  { id:"jazz", label:"🎷 Jazz" },
  { id:"jpop", label:"🇯🇵 J-Pop" },

  { id:"kids", label:"🧒 Kids" },
  { id:"kpop", label:"🇰🇷 K-Pop" },

  { id:"latin", label:"💃 Latin" },
  { id:"lofi", label:"🌙 Lo-Fi" },

  { id:"meditation", label:"🧘 Meditation" },
  { id:"metal", label:"🤘 Metal" },

  { id:"news", label:"📰 News" },
  { id:"oldies", label:"📻 Oldies" },

  { id:"pop", label:"🎤 Pop" },
  { id:"podcast", label:"🎧 Podcasts" },
  { id:"punk", label:"🤟 Punk" },

  { id:"rnb", label:"🎶 R&B" },
  { id:"reggae", label:"🌴 Reggae" },
  { id:"rock", label:"🎸 Rock" },

  { id:"soul", label:"💖 Soul" },
  { id:"soundtracks", label:"🎬 Soundtracks" },
  { id:"sports", label:"🏈 Sports Talk" },
  { id:"study", label:"📚 Study Beats" },

  { id:"video game", label:"🎮 Video Game Music" },

  { id:"workout", label:"💪 Workout" },
  { id:"world", label:"🌐 World Music" }
];

  function renderGenres(){

  const grid = document.getElementById("genreGrid");

  grid.innerHTML = GENRES.map(g => `
    <div class="genre" data-id="${g.id}">
      ${g.label}
    </div>
  `).join("");

  // prevent duplicate listeners
  if (!grid.dataset.bound) {
    grid.dataset.bound = "true";

    grid.addEventListener("click", (e) => {
      const item = e.target.closest(".genre");
      if (!item) return;

      const id = item.dataset.id;
      if (!id) return;

      document.querySelectorAll(".genre")
        .forEach(x => x.classList.remove("active"));

      item.classList.add("active");

      page = 0;
      currentGenre = id;
      load(id);
    });
  }

  // actions panel
  const actions = document.getElementById("actionGrid");

  actions.innerHTML = `
    <div class="genre" onclick="loadArtist()">🎤 Artist</div>
    <div class="genre" onclick="loadFavorites()">⭐ Favorites</div>
    <div class="genre" onclick="loadMISC()">📻 Misc</div>
    <div class="genre" onclick="loadUndiscovered()">🕵️ Undiscovered</div>
    <div class="genre" onclick="loadInternational()">🌎 Mexico</div>
    <div class="genre" onclick="loadInternational2()">🌍 International</div>
    <div class="genre" onclick="toggleLive()">
  📺 Live TV Mode
</div>
  `;
}
/* =========================
   🔥 FIXED GENRE FUNCTION
========================= */
function getGenre(s){
  return (s.tags?.trim())
    || (s.genre?.trim())
    || "Genre not listed - Radio";
}

/* LOAD */
async function load(g){

  currentGenre = g || "";
  filterMode = !!g;

  let url =
    `${RADIO}?hidebroken=true&order=clickcount&reverse=true`;

  // COUNTRY FILTER
  if(currentCountry){
    url += `&country=${encodeURIComponent(currentCountry)}`;
  }

  // GENRE MODE (FULL FILTER LOAD)
  if(g){
    url += `&tag=${encodeURIComponent(g)}`;

    // IMPORTANT: no pagination in genre mode
    page = 0;
  }

  // ALL STATIONS MODE (pagination ON)
  if(!g){
    url += `&limit=${PAGE_SIZE}&offset=${page * PAGE_SIZE}`;
  }

  const res = await fetch(url);
  current = (await res.json()).map(normalize);

  render();

  setTitle(
    `${currentCountry || "All Countries"} • ${g || "All Stations"}`
  );
}

async function loadCountries(){
  const res = await fetch("https://all.api.radio-browser.info/json/countries");
  const data = await res.json();

  const select = document.getElementById("countryFilter");

  // keep "All Countries" first
  select.innerHTML = `
    <option value="">🌎 All Countries</option>
  `;

  // sort alphabetically
  data.sort((a,b) => a.name.localeCompare(b.name));

  for (let c of data){
    const opt = document.createElement("option");
    opt.value = c.name;
    opt.textContent = `${c.name} (${c.stationcount})`;
    select.appendChild(opt);
  }

  // ✅ set default AFTER loop
  select.value = currentCountry;
}
  
/* FAVORITES LOAD */
async function loadFavorites(){

  const res = await fetch(SHEET + "?action=get");
  const data = await res.json().catch(()=>[]);

  const list = (data.data || data).map(normalize);

  current = list;
  favorites = new Set(list.map(s => s.id));

  render();
  setTitle("⭐ Favorites");
}

async function loadUndiscovered(){

  const res = await fetch(SHEET + "?action=undiscovered");
  const data = await res.json().catch(()=>[]);

  current = (data.data || []).map(normalize);

  render();
  setTitle("🕵️ Undiscovered");
}

async function loadInternational2(){

  try {
    const res = await fetch(SHEET + "?action=international2");

    const data = await res.json();

    console.log("International2 response:", data);

    current = (data.data || []).map(normalize);

    render();
    setTitle("🌍 International");

  } catch (err) {
    console.error("International2 failed:", err);
    current = [];
    render();
    setTitle("🌍 International (error)");
  }
}
  
/* FAVORITE TOGGLE */
async function fav(s){

  const id = s.stationuuid || s.id;
  if(!id) return;

  const exists = favorites.has(id);

  if(exists){

    await fetch(SHEET,{
      method:"POST",
      body:new URLSearchParams({
        action:"delete",
        id:id
      })
    });

    favorites.delete(id);
    setTitle("Removed ⭐");
    render();
    return;
  }

  await fetch(SHEET,{
    method:"POST",
    body:new URLSearchParams({
      action:"save",
      id:id,
      name:s.name || "",
      url:s.url_resolved || s.url || "",
      country:s.country || "",
      genre:getGenre(s),
      time:new Date().toISOString()
    })
  });

  favorites.add(id);
  setTitle("Saved ⭐");
  render();

async function listenNowPlaying(streamUrl, callback){

    if(metadataAbort)
        metadataAbort.abort();

    metadataAbort = new AbortController();

    try{

        const response = await fetch(streamUrl,{
            headers:{
                "Icy-MetaData":"1"
            },
            signal:metadataAbort.signal
        });

        const metaInt =
            parseInt(response.headers.get("icy-metaint"));

        if(!metaInt)
            return;

        const reader = response.body.getReader();

        const decoder = new TextDecoder();

        while(true){

            // Skip audio bytes

            let remaining = metaInt;

            while(remaining>0){

                const {value,done}=await reader.read();

                if(done) return;

                remaining-=value.length;
            }

            // Metadata length

            const lenChunk=await reader.read();

            if(lenChunk.done) return;

            const metaLength=lenChunk.value[0]*16;

            if(metaLength===0)
                continue;

            let meta=new Uint8Array(metaLength);

            let offset=0;

            while(offset<metaLength){

                const chunk=await reader.read();

                if(chunk.done) return;

                meta.set(chunk.value.slice(0,metaLength-offset),offset);

                offset+=Math.min(
                    chunk.value.length,
                    metaLength-offset
                );
            }

            const text=decoder.decode(meta);

            const match=text.match(
                /StreamTitle='([^']*)'/
            );

            if(match){

                callback(match[1]);

            }

        }

    }catch(e){

        console.log("metadata stopped");

    }

}

document.addEventListener("keydown", (e) => {

  const tag = document.activeElement.tagName.toLowerCase();
  const isTyping = tag === "input" || tag === "textarea" || tag === "select";

  // Don't interfere while typing (except Esc and /)
  if (isTyping && e.key !== "Escape") return;

  switch (e.key.toLowerCase()) {

    // Playback
    case " ":
      e.preventDefault();
      toggle();
      break;

    case "arrowright":
    case "n":
      next();
      break;

    case "arrowleft":
    case "p":
      prev();
      break;

    // Search
    case "/":
    case "s":
      e.preventDefault();
      document.getElementById("searchBox").focus();
      break;

    // Favorites
    case "f":
      loadFavorites();
      break;

    // Escape
    case "escape":
      document.getElementById("searchBox").value = "";
      document.getElementById("searchBox").blur();
      render();
      break;

    // UI
    case "g":
      toggleGenres();
      break;

    case "a":
      showAll();
      break;

    case "m":
      loadMISC();
      break;

    case "i":
      loadInternational();
      break;

    case "c":
      document.getElementById("countryFilter").focus();
      break;

    case "home":
      scrollToTop();
      break;

    case "pagedown":
      nextPage();
      break;

    case "pageup":
      prevPage();
      break;

    // Help
    case "?":
      e.preventDefault();
      showKeyboardHelp();
      break;
  }
});

const LIVE_API = "https://script.google.com/macros/s/AKfycbyasf7oke6ZAhjgD-j2HGcR9bBysso2M9RuUuOgXZUQ7UkQ6CAOMV4PfGM3ViLUz6bygg/exec";

const livePlayer = document.getElementById("livePlayer");

let liveStations = [];
let liveIndex = 0;
let liveOffset = 0;
let liveCurrent = null;

livePlayer.controls = false;
livePlayer.disablePictureInPicture = true;

livePlayer.addEventListener("pause", () => livePlayer.play());

async function loadLiveStream() {
  try {
    const res = await fetch(LIVE_API);
    const data = await res.json();

    liveStations = data.stations || [];
    liveIndex = data.index || 0;
    liveOffset = data.offset || 0;

    playLive(liveIndex, liveOffset);
  } catch (e) {
    console.log("Live load failed", e);
  }
}

function playLive(i, offset = 0) {
  liveCurrent = liveStations[i];
  if (!liveCurrent) return;

  document.getElementById("liveTitle").innerText =
    `${liveCurrent.title || "LIVE"} • STREAM`;

  livePlayer.src = liveCurrent.url;

  livePlayer.onloadedmetadata = () => {
    try {
      livePlayer.currentTime = (liveCurrent.start || 0) + offset;
      livePlayer.play();
    } catch(e) {}
  };

  livePlayer.onended = () => nextLive();

  // enforce loop boundary
  setInterval(() => {
    if (!liveCurrent) return;
    if (livePlayer.currentTime >= liveCurrent.end) {
      nextLive();
    }
  }, 500);
}

function nextLive() {
  liveIndex = (liveIndex + 1) % liveStations.length;
  playLive(liveIndex, 0);
}

// auto sync with server every 15s
setInterval(loadLiveStream, 15000);

loadLiveStream();
