<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Sports Obvyris</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">


<style>

*{
box-sizing:border-box;
}


body{

margin:0;
background:#050505;
color:white;
font-family:Arial,Helvetica,sans-serif;

}



header{

background:
linear-gradient(135deg,#111,#050505);

padding:30px;

text-align:center;

font-family:Orbitron;

font-size:36px;

font-weight:900;

letter-spacing:5px;

border-bottom:1px solid #333;

}



.dashboard{

max-width:1300px;

margin:auto;

padding:20px;

}



.topbar{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(200px,1fr));

gap:15px;

margin-bottom:20px;

}



.summary{

background:#151515;

border:1px solid #333;

border-radius:16px;

padding:20px;

text-align:center;

}



.summary h3{

margin:0;

font-family:Orbitron;

color:#aaa;

font-size:13px;

}



.summary span{

display:block;

font-size:28px;

font-weight:bold;

margin-top:10px;

}




.controls{

display:flex;

flex-wrap:wrap;

gap:10px;

justify-content:center;

margin-bottom:25px;

}



button{

background:#151515;

border:1px solid #444;

color:white;

padding:12px 20px;

border-radius:25px;

cursor:pointer;

font-weight:bold;

}



button:hover{

background:#333;

}



input{

background:#111;

border:1px solid #444;

color:white;

padding:12px;

border-radius:20px;

width:250px;

}




.game{

background:#101010;

border:1px solid #333;

border-radius:22px;

padding:25px;

margin-bottom:25px;

box-shadow:
0 0 20px rgba(0,0,0,.5);

}



.status{

display:inline-block;

padding:8px 18px;

border-radius:30px;

font-weight:bold;

margin-bottom:15px;

}



.final{

background:#087f23;

}



.live{

background:#c62828;

animation:pulse 1s infinite;

}



.post{

background:#555;

}



.scheduled{

background:#1565c0;

}



@keyframes pulse{

50%{

opacity:.5;

}

}



.gameinfo{

color:#888;

margin-bottom:20px;

}




.matchup{

display:grid;

grid-template-columns:1fr 150px 1fr;

align-items:center;

text-align:center;

}



.team{

font-size:24px;

font-weight:900;

}



.code{

font-size:13px;

color:#999;

margin-top:5px;

}



.record{

font-size:13px;

color:#aaa;

margin-top:8px;

}



.score{

font-family:Orbitron;

font-size:45px;

line-height:1.2;

}




.divider{

height:1px;

background:#333;

margin:25px 0;

}





.section{

font-family:Orbitron;

font-size:16px;

color:#aaa;

margin-bottom:15px;

}




.grid{

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(180px,1fr));

gap:15px;

}



.card{

background:#1a1a1a;

border-radius:14px;

padding:18px;

text-align:center;

}



.label{

font-size:12px;

color:#888;

}



.value{

font-size:20px;

font-weight:bold;

margin-top:8px;

}



.win{

color:#00ff66;

}



.loss{

color:#ff5555;

}




.table{

width:100%;

border-collapse:collapse;

}



.table td,
.table th{

padding:12px;

border-bottom:1px solid #333;

text-align:center;

}




.links a{

color:#00aaff;

font-weight:bold;

margin-right:15px;

text-decoration:none;

}



@media(max-width:700px){


header{

font-size:24px;

}


.matchup{

grid-template-columns:
1fr 80px 1fr;

}



.team{

font-size:16px;

}



.score{

font-size:30px;

}


}



</style>

</head>


<body>


<header>

⚾ SPORTS OBVYRIS

</header>



<div class="dashboard">



<div class="topbar">


<div class="summary">

<h3>SPORT</h3>

<span id="sport">
--
</span>

</div>


<div class="summary">

<h3>GAMES</h3>

<span id="count">
--
</span>

</div>


<div class="summary">

<h3>UPDATED</h3>

<span id="updated">
--
</span>

</div>



<div class="summary">

<h3>STATUS</h3>

<span id="statusCount">
--
</span>

</div>


</div>





<div class="controls">


<input id="search"
placeholder="Search team..."
onkeyup="searchGames()">



<button onclick="filterGames('ALL')">
ALL
</button>


<button onclick="filterGames('Final')">
FINAL
</button>


<button onclick="filterGames('In Progress')">
LIVE
</button>


<button onclick="filterGames('Postponed')">
POSTPONED
</button>


</div>




<div id="games"></div>



</div>



<script>


const SPORTS_API =
"https://script.google.com/macros/s/AKfycbx8S_l2TEHWwWAvpZSAR9CywTYVzp21kEZL8btVHKKKm8ucTVBRyZQb8IvpKfCDLLIG/exec";



let games=[];

let current="ALL";



async function loadSports(){


let res =
await fetch(SPORTS_API);


let data =
await res.json();



games=data.games;



document.getElementById("sport").innerHTML=data.sport;

document.getElementById("count").innerHTML=data.count;

document.getElementById("updated").innerHTML=data.updated;



let live =
games.filter(x=>x.Status==="In Progress").length;


let final =
games.filter(x=>x.Status==="Final").length;


let post =
games.filter(x=>x.Status==="Postponed").length;


document.getElementById("statusCount").innerHTML=

`
🔴 ${live}
<br>
✅ ${final}
<br>
⏸ ${post}
`;



render();


}

function render(){


let list=[...games];



if(current!=="ALL"){

list=list.filter(
g=>g.Status===current
);

}



let search =
document.getElementById("search").value.toLowerCase();



if(search){

list=list.filter(g=>

g.AwayTeam.toLowerCase().includes(search) ||

g.HomeTeam.toLowerCase().includes(search) ||

g.AwayCode.toLowerCase().includes(search) ||

g.HomeCode.toLowerCase().includes(search)

);

}



let html="";



list.forEach(g=>{



let cls="";



if(g.Status==="Final")
cls="final";


else if(g.Status==="In Progress")
cls="live";


else if(g.Status==="Postponed")
cls="post";


else
cls="scheduled";




let awayRecord =
(g.AwayWins!=="" && g.AwayWins!=null)
?
`${g.AwayWins}-${g.AwayLosses}`
:
"-";



let homeRecord =
(g.HomeWins!=="" && g.HomeWins!=null)
?
`${g.HomeWins}-${g.HomeLosses}`
:
"-";






html+=`


<div class="game">



<div class="status ${cls}">

${g.Status}

</div>




<div class="gameinfo">

📅 ${new Date(g.Date).toLocaleDateString()}

&nbsp; | &nbsp;

🏟 ${g.Venue || "-"}

</div>





<div class="matchup">



<div class="team">


${g.AwayTeam}


<div class="code">

${g.AwayCode}

</div>


<div class="record">

Record:
${awayRecord}

</div>


</div>






<div class="score">

${g.AwayScore}

<br>

-

<br>

${g.HomeScore}

</div>







<div class="team">


${g.HomeTeam}


<div class="code">

${g.HomeCode}

</div>


<div class="record">

Record:
${homeRecord}

</div>



</div>



</div>







<div class="divider"></div>







<div class="section">

🏆 RESULT

</div>





<div class="grid">



<div class="card">

<div class="label">
WINNER
</div>


<div class="value win">

${g.Winner || "-"}

</div>

</div>





<div class="card">

<div class="label">
LOSER
</div>


<div class="value loss">

${g.Loser || "-"}

</div>


</div>





<div class="card">

<div class="label">
EVENT ID
</div>


<div class="value">

${g.EventID}

</div>


</div>



</div>









<div class="divider"></div>





<div class="section">

📊 BOX SCORE

</div>






<table class="table">


<tr>

<th></th>

<th>${g.AwayCode}</th>

<th>${g.HomeCode}</th>

</tr>



<tr>

<td>
RUNS
</td>


<td>
${g.AwayScore ?? "-"}
</td>


<td>
${g.HomeScore ?? "-"}
</td>


</tr>




<tr>

<td>
HITS
</td>


<td>
${g.AwayHits || "-"}
</td>


<td>
${g.HomeHits || "-"}
</td>


</tr>





<tr>

<td>
ERRORS
</td>


<td>
${g.AwayErrors || "-"}
</td>


<td>
${g.HomeErrors || "-"}
</td>


</tr>


</table>










<div class="divider"></div>







<div class="section">

⚾ PITCHING DECISIONS

</div>






<div class="grid">



<div class="card">

<div class="label">

WIN PITCHER

</div>


<div class="value">

${g.WinPitcher || "-"}

</div>

</div>





<div class="card">

<div class="label">

LOSS PITCHER

</div>


<div class="value">

${g.LossPitcher || "-"}

</div>

</div>





<div class="card">

<div class="label">

SAVE

</div>


<div class="value">

${g.Save || "-"}

</div>

</div>



</div>









<div class="divider"></div>







<div class="section">

🏟 GAME INFORMATION

</div>







<div class="grid">



<div class="card">

<div class="label">

LOCATION

</div>


<div class="value">

${g.City || "-"}, 

${g.State || "-"}

</div>


</div>







<div class="card">

<div class="label">

ATTENDANCE

</div>


<div class="value">

${g.Attendance || "-"}

</div>


</div>







<div class="card">

<div class="label">

BROADCAST

</div>


<div class="value">

${g.Broadcast || "-"}

</div>


</div>



</div>










<div class="divider"></div>






<div class="links">


${g.GameLink ?

`

<a href="${g.GameLink}" target="_blank">

🏟 GAME CENTER

</a>

`

:""}





${g.BoxscoreLink ?

`

<a href="${g.BoxscoreLink}" target="_blank">

📊 BOX SCORE

</a>

`

:""}





${g.PlayByPlay ?

`

<a href="${g.PlayByPlay}" target="_blank">

📖 PLAY BY PLAY

</a>

`

:""}



</div>







</div>



`;



});





document.getElementById("games").innerHTML =
html || 
"<h2>No games found</h2>";



}






function filterGames(type){


current=type;

render();


}







function searchGames(){

render();

}







loadSports();


setInterval(loadSports,60000);



</script>


</body>

</html>
