<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Sports Obvyris</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

<style>

body{
    margin:0;
    background:#050505;
    color:white;
    font-family:Arial, sans-serif;
}

header{
    background:#111;
    padding:20px;
    text-align:center;
    font-family:Orbitron;
    font-size:28px;
    font-weight:900;
    letter-spacing:2px;
}

#updated{
    text-align:center;
    color:#aaa;
    margin:10px;
}


.container{
    padding:15px;
}


.game{

    background:#151515;
    border-radius:15px;
    padding:18px;
    margin-bottom:15px;
    border:1px solid #333;

}


.teams{

    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:20px;
    font-weight:bold;

}


.score{

    font-size:32px;
    font-family:Orbitron;

}


.status{

    display:inline-block;
    padding:5px 12px;
    border-radius:20px;
    background:#333;
    margin:10px 0;

}


.final{
    background:#008000;
}

.live{
    background:red;
}

.post{
    background:#666;
}



.info{

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
    gap:10px;
    margin-top:15px;

}


.box{

    background:#222;
    padding:10px;
    border-radius:8px;

}


.label{

    color:#aaa;
    font-size:12px;

}


.pitchers{

    margin-top:15px;
    background:#111;
    padding:12px;
    border-radius:10px;

}



a{

color:#00aaff;
text-decoration:none;

}


</style>

</head>


<body>


<header>
⚾ SPORTS OBVYRIS
</header>


<div id="updated"></div>


<div class="container" id="games">

Loading Sports...

</div>



<script>


const SPORTS_API =
"https://script.google.com/macros/s/AKfycbx8S_l2TEHWwWAvpZSAR9CywTYVzp21kEZL8btVHKKKm8ucTVBRyZQb8IvpKfCDLLIG/exec";



async function loadSports(){


try{


const res = await fetch(SPORTS_API);


const data = await res.json();



document.getElementById("updated").innerHTML =
`
${data.sport} |
Updated ${data.updated}
|
Games ${data.count}
`;



let html="";



data.games.forEach(g=>{


let statusClass="";


if(g.Status==="Final")
statusClass="final";

else if(g.Status==="In Progress")
statusClass="live";

else if(g.Status==="Postponed")
statusClass="post";



html += `


<div class="game">


<div class="status ${statusClass}">
${g.Status}
</div>



<div class="teams">


<div>
${g.AwayTeam}
<br>
<small>${g.AwayCode}</small>
</div>


<div class="score">
${g.AwayScore}
-
${g.HomeScore}
</div>


<div>
${g.HomeTeam}
<br>
<small>${g.HomeCode}</small>
</div>


</div>



<div class="info">


<div class="box">

<div class="label">
WINNER
</div>

${g.Winner || "-"}

</div>


<div class="box">

<div class="label">
LOSER
</div>

${g.Loser || "-"}

</div>



<div class="box">

<div class="label">
VENUE
</div>

${g.Venue || "-"}

<br>

${g.City || ""}, ${g.State || ""}

</div>



<div class="box">

<div class="label">
ATTENDANCE
</div>

${g.Attendance || "-"}

</div>



<div class="box">

<div class="label">
BROADCAST
</div>

${g.Broadcast || "-"}

</div>



<div class="box">

<div class="label">
TEAM HITS
</div>

${g.AwayHits || 0}
-
${g.HomeHits || 0}

</div>



<div class="box">

<div class="label">
ERRORS
</div>

${g.AwayErrors || 0}
-
${g.HomeErrors || 0}

</div>


<div class="box">

<div class="label">
RECORD
</div>

${g.AwayWins || 0}-${g.AwayLosses || 0}
<br>
${g.HomeWins || 0}-${g.HomeLosses || 0}

</div>



</div>





<div class="pitchers">


<b>⚾ Pitching Decisions</b>


<br><br>


🏆 Win:
${g.WinPitcher || "-"}


<br>


❌ Loss:
${g.LossPitcher || "-"}


<br>


💾 Save:
${g.Save || "-"}


</div>





<br>


${g.GameLink ?
`
<a href="${g.GameLink}" target="_blank">
Game Center
</a>
`
:""}


&nbsp;


${g.BoxscoreLink ?
`
<a href="${g.BoxscoreLink}" target="_blank">
Box Score
</a>
`
:""}


&nbsp;


${g.PlayByPlay ?
`
<a href="${g.PlayByPlay}" target="_blank">
Play By Play
</a>
`
:""}



</div>


`;



});



document.getElementById("games").innerHTML=html;



}

catch(err){

console.log(err);

document.getElementById("games").innerHTML =
"Unable to load sports data";

}


}



loadSports();


setInterval(loadSports,60000);



</script>


</body>
</html>
