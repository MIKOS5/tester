<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Sports Obvyris</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">


<style>


body{

margin:0;
background:#050505;
color:white;
font-family:Arial, sans-serif;

}


header{

background:#111;
padding:22px;
text-align:center;
font-family:Orbitron;
font-size:30px;
font-weight:900;
letter-spacing:3px;

}



#updated{

text-align:center;
color:#aaa;
padding:10px;

}



.container{

max-width:1100px;
margin:auto;
padding:15px;

}



.game{

background:#121212;
border:1px solid #333;
border-radius:18px;
padding:22px;
margin-bottom:25px;

box-shadow:
0 0 15px rgba(0,0,0,.6);

}



.status{

display:inline-block;
padding:6px 15px;
border-radius:20px;
background:#555;
font-weight:bold;
margin-bottom:20px;

}


.final{

background:#087f23;

}


.live{

background:#c62828;

}


.post{

background:#555;

}



.matchup{

display:grid;
grid-template-columns:1fr 120px 1fr;
align-items:center;
text-align:center;

}



.team{

font-size:22px;
font-weight:bold;

}



.code{

font-size:14px;
color:#888;
margin-top:5px;

}



.score{

font-family:Orbitron;
font-size:38px;
line-height:1.1;

}




.divider{

height:1px;
background:#333;
margin:25px 0;

}




.section-title{

font-family:Orbitron;
font-size:16px;
color:#aaa;
margin-bottom:12px;

}




.result{

font-size:17px;
line-height:30px;

}



.stats{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:12px;

}




.stat{

background:#1d1d1d;
padding:15px;
border-radius:12px;
text-align:center;

}



.stat-title{

color:#aaa;
font-size:12px;

}



.value{

font-size:18px;
font-weight:bold;
margin-top:8px;

}



.info{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:12px;

}



.box{

background:#1b1b1b;
padding:15px;
border-radius:12px;

}



a{

color:#00aaff;
text-decoration:none;
font-weight:bold;

}



small{

color:#999;

}



@media(max-width:600px){


.matchup{

grid-template-columns:1fr 80px 1fr;

}


.team{

font-size:16px;

}


.score{

font-size:28px;

}


}



</style>


</head>


<body>



<header>

⚾ SPORTS OBVYRIS

</header>



<div id="updated">

Loading...

</div>



<div class="container" id="games"></div>





<script>


const SPORTS_API =
"https://script.google.com/macros/s/AKfycbx8S_l2TEHWwWAvpZSAR9CywTYVzp21kEZL8btVHKKKm8ucTVBRyZQb8IvpKfCDLLIG/exec";





async function loadSports(){


try{


const response =
await fetch(SPORTS_API);



const data =
await response.json();



document.getElementById("updated").innerHTML =

`
${data.sport}
 |
 Updated ${data.updated}
 |
 ${data.count} Games
`;





let html="";





data.games.forEach(g=>{



let statusClass="";


if(g.Status==="Final")
statusClass="final";


if(g.Status==="In Progress")
statusClass="live";


if(g.Status==="Postponed")
statusClass="post";





html += `



<div class="game">



<div class="status ${statusClass}">
${g.Status}
</div>





<div class="matchup">



<div class="team">

${g.AwayTeam}

<div class="code">

${g.AwayCode}

</div>

</div>





<div class="score">

${g.AwayScore}

<br>

-

<br>

${g.HomeScore}

</div>





<div class="team">

${g.HomeTeam}

<div class="code">

${g.HomeCode}

</div>

</div>





</div>






<div class="divider"></div>





<div class="section-title">

CURRENT / FINAL RESULT

</div>





<div class="result">


🏆 Winner:
<b>${g.Winner || "-"}</b>


<br>


❌ Loser:
<b>${g.Loser || "-"}</b>


</div>







<div class="divider"></div>






<div class="section-title">

PITCHING DECISIONS

</div>






<div class="stats">





<div class="stat">

<div class="stat-title">
WIN PITCHER
</div>

<div class="value">
${g.WinPitcher || "-"}
</div>

</div>





<div class="stat">

<div class="stat-title">
LOSS PITCHER
</div>

<div class="value">
${g.LossPitcher || "-"}
</div>

</div>





<div class="stat">

<div class="stat-title">
SAVE
</div>

<div class="value">
${g.Save || "-"}
</div>

</div>



</div>









<div class="divider"></div>





<div class="section-title">

TEAM STATS

</div>






<div class="stats">





<div class="stat">

<div class="stat-title">
HITS
</div>


<div class="value">

${g.AwayHits || 0}
-
${g.HomeHits || 0}

</div>


</div>







<div class="stat">

<div class="stat-title">
ERRORS
</div>


<div class="value">

${g.AwayErrors || 0}
-
${g.HomeErrors || 0}

</div>


</div>






<div class="stat">

<div class="stat-title">
TEAM RECORD
</div>


<div class="value">


${g.AwayWins || 0}-${g.AwayLosses || 0}


<br>


${g.HomeWins || 0}-${g.HomeLosses || 0}



</div>


</div>





</div>







<div class="divider"></div>








<div class="section-title">

GAME INFORMATION

</div>






<div class="info">





<div class="box">

<b>Venue</b>

<br>

${g.Venue || "-"}

</div>





<div class="box">

<b>Location</b>

<br>

${g.City || ""}, ${g.State || ""}

</div>





<div class="box">

<b>Attendance</b>

<br>

${g.Attendance || "-"}

</div>





<div class="box">

<b>Broadcast</b>

<br>

${g.Broadcast || "-"}

</div>





</div>









<div class="divider"></div>







<div>


${g.GameLink ?

`
<a href="${g.GameLink}" target="_blank">
🏟 Game Center
</a>
`

:""}



&nbsp;&nbsp;



${g.BoxscoreLink ?

`
<a href="${g.BoxscoreLink}" target="_blank">
📊 Box Score
</a>
`

:""}



&nbsp;&nbsp;



${g.PlayByPlay ?

`
<a href="${g.PlayByPlay}" target="_blank">
📖 Play By Play
</a>
`

:""}



</div>






</div>



`;




});






document.getElementById("games").innerHTML=html;




}

catch(error){


console.log(error);


document.getElementById("games").innerHTML=

"Unable to load sports data";


}



}





loadSports();



setInterval(loadSports,60000);



</script>



</body>

</html>
