<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Sports Obvyris</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">


<style>

body{
margin:0;
background:#050505;
color:white;
font-family:Arial;
}


header{

background:#111;
padding:25px;
text-align:center;
font-family:Orbitron;
font-size:32px;
font-weight:900;
letter-spacing:4px;

}


#top{

text-align:center;
padding:15px;
color:#aaa;

}



.controls{

text-align:center;
padding:10px;

}


button{

background:#222;
color:white;
border:1px solid #444;
padding:10px 18px;
border-radius:20px;
cursor:pointer;

}



.container{

max-width:1200px;
margin:auto;
padding:15px;

}




.game{

background:#101010;
border-radius:20px;
padding:22px;
margin-bottom:25px;
border:1px solid #333;

}




.status{

display:inline-block;
padding:7px 15px;
border-radius:20px;
font-weight:bold;

}


.final{
background:#087f23;
}


.live{

background:#c62828;

}


.post{

background:#555;

}



.date{

color:#888;
margin-bottom:15px;

}



.matchup{

display:grid;
grid-template-columns:1fr 120px 1fr;
align-items:center;
text-align:center;

}



.team{

font-size:22px;
font-weight:bold;

}



.code{

color:#888;

}



.score{

font-family:Orbitron;
font-size:38px;

}



.winner{

color:#00ff66;

}




.grid{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:12px;
margin-top:15px;

}



.card{

background:#1b1b1b;
padding:15px;
border-radius:12px;
text-align:center;

}



.label{

font-size:12px;
color:#999;

}


.value{

font-size:18px;
font-weight:bold;
margin-top:8px;

}



.links a{

color:#00aaff;
margin-right:15px;

}



.divider{

height:1px;
background:#333;
margin:20px 0;

}



@media(max-width:600px){

.matchup{

grid-template-columns:1fr 70px 1fr;

}

.team{

font-size:16px;

}


.score{

font-size:28px;

}

}


</style>

</head>


<body>


<header>
⚾ SPORTS OBVYRIS
</header>



<div id="top">

Loading...

</div>



<div class="controls">

<button onclick="filterGames('ALL')">
ALL
</button>

<button onclick="filterGames('Final')">
FINAL
</button>

<button onclick="filterGames('In Progress')">
LIVE
</button>

<button onclick="filterGames('Postponed')">
POSTPONED
</button>


</div>



<div class="container" id="games"></div>




<script>



const SPORTS_API =
"https://script.google.com/macros/s/AKfycbx8S_l2TEHWwWAvpZSAR9CywTYVzp21kEZL8btVHKKKm8ucTVBRyZQb8IvpKfCDLLIG/exec";



let allGames=[];



async function loadSports(){


const res =
await fetch(SPORTS_API);


const data =
await res.json();



allGames=data.games;



document.getElementById("top").innerHTML=

`
${data.sport}
 |
 Updated ${data.updated}
 |
 ${data.count} Games
`;



renderGames(allGames);


}




function renderGames(games){


let html="";


games.forEach(g=>{



let cls="";


if(g.Status==="Final")
cls="final";

if(g.Status==="In Progress")
cls="live";

if(g.Status==="Postponed")
cls="post";



html+=`


<div class="game">



<div class="status ${cls}">
${g.Status}
</div>


<div class="date">

${new Date(g.Date).toLocaleDateString()}

 |
 ${g.Venue}

</div>





<div class="matchup">


<div class="team">

${g.AwayTeam}

<div class="code">
${g.AwayCode}
</div>


<div>
${g.AwayWins || "-"} -
${g.AwayLosses || "-"}
</div>

</div>





<div class="score">

${g.AwayScore}

<br>

-

<br>

${g.HomeScore}

</div>





<div class="team">

${g.HomeTeam}

<div class="code">
${g.HomeCode}
</div>


<div>

${g.HomeWins || "-"} -
${g.HomeLosses || "-"}

</div>

</div>


</div>




<div class="divider"></div>



<div class="grid">



<div class="card">

<div class="label">
WINNER
</div>

<div class="value winner">
${g.Winner || "-"}
</div>

</div>



<div class="card">

<div class="label">
LOSER
</div>

<div class="value">
${g.Loser || "-"}
</div>

</div>



<div class="card">

<div class="label">
ATTENDANCE
</div>

<div class="value">
${g.Attendance || "-"}
</div>

</div>



<div class="card">

<div class="label">
BROADCAST
</div>

<div class="value">
${g.Broadcast || "-"}
</div>

</div>


</div>




<div class="divider"></div>




<h3>
⚾ Pitching
</h3>



<div class="grid">


<div class="card">

<div class="label">
WIN
</div>

<div class="value">
${g.WinPitcher || "-"}
</div>

</div>



<div class="card">

<div class="label">
LOSS
</div>

<div class="value">
${g.LossPitcher || "-"}
</div>

</div>



<div class="card">

<div class="label">
SAVE
</div>

<div class="value">
${g.Save || "-"}
</div>

</div>


</div>





<div class="divider"></div>




<h3>
📊 Team Stats
</h3>


<div class="grid">


<div class="card">

<div class="label">
HITS
</div>

<div class="value">

${g.AwayHits || "-"}
 -
${g.HomeHits || "-"}

</div>

</div>



<div class="card">

<div class="label">
ERRORS
</div>

<div class="value">

${g.AwayErrors || "-"}
 -
${g.HomeErrors || "-"}

</div>

</div>


</div>





<div class="divider"></div>




<div>

📍
${g.City},
${g.State}

</div>



<br>


<div class="links">


<a href="${g.GameLink}" target="_blank">
🏟 Game
</a>


<a href="${g.BoxscoreLink}" target="_blank">
📊 Box
</a>


<a href="${g.PlayByPlay}" target="_blank">
📖 Play
</a>



</div>



</div>



`;



});



document.getElementById("games").innerHTML=html;


}




function filterGames(status){


if(status==="ALL"){

renderGames(allGames);
return;

}


renderGames(
allGames.filter(
g=>g.Status===status
)
);


}




loadSports();


setInterval(loadSports,60000);



</script>


</body>

</html>
