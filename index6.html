<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>📻 Hybrid Radio Browser</title>

<link href="https://fonts.googleapis.com/css2?family=Tahoma:wght@400;700&display=swap" rel="stylesheet"/>

<style>

:root{
  --bg:#070b12;
  --panel:#0e1624;
  --border:#223552;
  --blue:#3aa0ff;
  --text:#e7f0ff;
  --muted:#93a7c2;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Tahoma, sans-serif;
  background:linear-gradient(180deg,#05070c,#0b111c);
  color:var(--text);
}

/* MAIN */
.main{
  padding:12px;
  padding-bottom:120px;
}

/* TABLE */
.table{
  border:2px inset #223552;
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  font-size:11px;
  text-align:left;
  padding:10px;
  background:#0c1a2c;
  color:#7fbaff;
}

td{
  padding:10px;
  font-size:12px;
  border-bottom:1px solid #1a2a40;
}

tr:hover{
  background:#101c2e;
}

tr.active{
  background:#13243a !important;
  box-shadow:inset 3px 0 0 #3aa0ff;
}

/* LOADING */
#loading{
  padding:10px;
  text-align:center;
  color:#93a7c2;
}

/* ================= DOCK PLAYER ================= */
.dock-player{
  position:fixed;
  bottom:0;
  left:0;
  right:0;

  height:95px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:10px;

  background:linear-gradient(180deg,#0a1322,#050a12);
  border-top:2px solid #223552;
}

/* LEFT */
.dock-left{
  width:30%;
}

#ledStatus{
  font-size:11px;
  font-weight:700;
  color:#ffcc66;
}

#npName{
  font-size:13px;
  font-weight:700;
  color:#6ec0ff;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

#npMeta{
  font-size:11px;
  color:#93a7c2;
}

/* CENTER */
.dock-center{
  width:40%;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
}

.cd{
  width:46px;
  height:46px;
  border-radius:50%;
  background:radial-gradient(circle,#111,#333,#000);
  border:2px solid #2b3f5f;
}

.cd.playing{
  animation:spin 2.5s linear infinite;
}

@keyframes spin{
  from{transform:rotate(0);}
  to{transform:rotate(360deg);}
}

/* EQ */
.eq{
  display:flex;
  align-items:flex-end;
  height:35px;
  gap:3px;
}

.bar{
  width:4px;
  background:#3aa0ff;
  height:6px;
  animation:eq 1s infinite ease-in-out;
}

.bar:nth-child(2){animation-delay:.1s}
.bar:nth-child(3){animation-delay:.2s}
.bar:nth-child(4){animation-delay:.3s}
.bar:nth-child(5){animation-delay:.4s}
.bar:nth-child(6){animation-delay:.5s}
.bar:nth-child(7){animation-delay:.6s}
.bar:nth-child(8){animation-delay:.7s}

@keyframes eq{
  0%{height:6px;opacity:.4}
  50%{height:30px;opacity:1}
  100%{height:10px;opacity:.6}
}

/* RIGHT CONTROLS */
.dock-right{
  width:30%;
  display:flex;
  justify-content:flex-end;
  gap:6px;
}

button{
  font-size:12px;
  font-weight:700;
  padding:8px 10px;
  border:1px solid #0f2c55;
  background:linear-gradient(180deg,#2e77d3,#1a4f99);
  color:white;
  cursor:pointer;
}

button:active{
  transform:translateY(1px);
}

.dock-right button{
  width:42px;
  height:42px;
}

</style>
</head>

<body>

<div class="main">

  <div id="loading">Loading stations...</div>

  <div class="table">
    <table>
      <thead>
        <tr>
          <th>Station</th>
          <th>Genre</th>
          <th>Play</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

</div>

<!-- DOCK PLAYER -->
<div class="dock-player">

  <div class="dock-left">
    <div id="ledStatus">STOPPED</div>
    <div id="npName">NO STATION</div>
    <div id="npMeta">Ready</div>
  </div>

  <div class="dock-center">
    <div class="cd" id="cdDisc"></div>

    <div class="eq">
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div>
    </div>
  </div>

  <div class="dock-right">
    <button onclick="prevStation()">⏮</button>
    <button onclick="togglePlay()" id="playBtn">▶</button>
    <button onclick="nextStation()">⏭</button>
    <button onclick="toggleFavCurrent()">★</button>
  </div>

  <audio id="player"></audio>

</div>

<script>

const API="https://all.api.radio-browser.info/json/stations/search";

let currentList=[];
let page=0;
let limit=50;
let loading=false;
let currentIndex=-1;
let isPlaying=false;

/* VISUALS */
function setLed(t,color="#ffcc66"){
  const el=document.getElementById("ledStatus");
  el.innerText=t;
  el.style.color=color;
}

function startVisuals(){
  document.getElementById("cdDisc").classList.add("playing");
  setLed("PLAYING","#3cff8f");
}

function stopVisuals(){
  document.getElementById("cdDisc").classList.remove("playing");
  setLed("STOPPED","#ff6666");
}

/* LOAD */
async function loadStations(){
  if(loading) return;
  loading=true;

  const res=await fetch(`${API}?countrycode=US&limit=${limit}&offset=${page*limit}&hidebroken=true`);
  const data=await res.json();

  currentList=[...currentList,...data];

  render();

  page++;
  loading=false;

  document.getElementById("loading").innerText="";
}

/* PLAY */
function playStation(id){

  const item=currentList.find(s=>s.stationuuid===id);
  if(!item)return;

  currentIndex=currentList.findIndex(s=>s.stationuuid===id);

  document.querySelectorAll("tr").forEach(r=>r.classList.remove("active"));

  const rows=[...document.querySelectorAll("tr")];
  const row=rows.find(r=>r.innerText.includes(item.name));
  if(row) row.classList.add("active");

  const p=document.getElementById("player");
  p.src=item.url_resolved||item.url;
  p.play();

  document.getElementById("npName").innerText=item.name;
  document.getElementById("npMeta").innerText=item.tags||"Radio station";

  isPlaying=true;
  startVisuals();
}

/* CONTROLS */
function togglePlay(){
  const p=document.getElementById("player");
  const btn=document.getElementById("playBtn");

  if(!p.src)return;

  if(isPlaying){
    p.pause();
    isPlaying=false;
    btn.innerText="▶";
    stopVisuals();
  }else{
    p.play();
    isPlaying=true;
    btn.innerText="⏸";
    startVisuals();
  }
}

function nextStation(){
  currentIndex=(currentIndex+1)%currentList.length;
  playStation(currentList[currentIndex].stationuuid);
}

function prevStation(){
  currentIndex=(currentIndex-1+currentList.length)%currentList.length;
  playStation(currentList[currentIndex].stationuuid);
}

/* RENDER */
function render(){
  const tbody=document.querySelector("tbody");
  tbody.innerHTML="";

  currentList.forEach(s=>{
    tbody.innerHTML+=`
      <tr onclick="playStation('${s.stationuuid}')">
        <td>${s.name}</td>
        <td>${s.tags||""}</td>
        <td>▶</td>
      </tr>
    `;
  });
}

/* INFINITE SCROLL */
window.addEventListener("scroll",()=>{
  if(window.innerHeight + window.scrollY >= document.body.offsetHeight - 250){
    loadStations();
  }
});

/* INIT */
loadStations();

</script>

</body>
</html>
