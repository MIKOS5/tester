<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Obvyris Game Wrapper Test</title>

<style>

*{
box-sizing:border-box;
}

html,
body{
margin:0;
width:100%;
height:100%;
background:#070d16;
color:#fff;
font-family:Arial,Helvetica,sans-serif;
overflow:hidden;
}

#app{
width:100%;
height:100%;
display:flex;
flex-direction:column;
}

#top{
height:48px;
background:#111827;
border-bottom:1px solid #253347;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 12px;
flex-shrink:0;
}

#title{
font-weight:bold;
}

#status{
font-size:12px;
color:#55e6a5;
}

#gameArea{
position:relative;
flex:1;
min-height:0;
background:#000;
overflow:hidden;
}

#gameWrapper{
position:absolute;
inset:0;
background:#000;
}

#gameFrame{
width:100%;
height:100%;
border:0;
display:block;
}

#diagnostics{
position:absolute;
top:8px;
left:8px;
z-index:100;

background:rgba(0,0,0,.8);

border:1px solid #2793ff;

border-radius:8px;

padding:8px;

font-family:monospace;

font-size:11px;

line-height:1.5;

pointer-events:none;
}

#keyboard{
position:absolute;

left:0;
right:0;
bottom:0;

display:none;

padding:8px;

background:rgba(17,24,39,.97);

border-top:2px solid #2793ff;

z-index:200;
}

#keyboard.open{
display:block;
}

.row{
display:flex;
justify-content:center;
gap:4px;
margin-bottom:4px;
}

.key{

height:38px;

min-width:40px;

padding:0 10px;

border:1px solid #34445a;

border-radius:6px;

background:#1b2738;

color:#fff;

font-weight:bold;

font-size:13px;

touch-action:none;

user-select:none;
}

.key.down{

background:#2793ff;

border-color:#fff;

transform:scale(.96);
}

.space{
width:180px;
}

#controls{

height:46px;

display:flex;

align-items:center;

gap:6px;

padding:6px;

background:#111827;

border-top:1px solid #253347;

flex-shrink:0;
}

#controls button{

height:34px;

background:#1b2738;

border:1px solid #34445a;

border-radius:6px;

color:#fff;

padding:0 12px;

font-weight:bold;

cursor:pointer;
}

#controls button:hover{

background:#2793ff;

}

</style>

</head>

<body>

<div id="app">

<div id="top">

<div id="title">
Obvyris Game Wrapper Test
</div>

<div id="status">
LOADING
</div>

</div>

<div id="gameArea">

<div id="gameWrapper">

<iframe
id="gameFrame"
src="https://html5.gamemonetize.co/7o8qtn59e5ejushl2s6bp52nbcgiu44x/"
allow="autoplay; fullscreen; pointer-lock"
allowfullscreen>
</iframe>

</div>

<div id="diagnostics">

INPUT LAYER<br>

W: <span id="wState">UP</span><br>
A: <span id="aState">UP</span><br>
S: <span id="sState">UP</span><br>
D: <span id="dState">UP</span><br>
SPACE: <span id="spaceState">UP</span><br>

Last: <span id="lastKey">---</span>

</div>

<div id="keyboard">

<div class="row">

<button class="key" data-key="w">W</button>

</div>

<div class="row">

<button class="key" data-key="a">A</button>

<button class="key" data-key="s">S</button>

<button class="key" data-key="d">D</button>

</div>

<div class="row">

<button class="key" data-key=" ">SPACE</button>

</div>

<div class="row">

<button class="key" data-key="ArrowLeft">←</button>

<button class="key" data-key="ArrowUp">↑</button>

<button class="key" data-key="ArrowDown">↓</button>

<button class="key" data-key="ArrowRight">→</button>

</div>

</div>

</div>

<div id="controls">

<button onclick="toggleKeyboard()">
⌨ Keyboard
</button>

<button onclick="focusGame()">
Focus
</button>

<button onclick="fullscreenGame()">
Fullscreen
</button>

<button onclick="reloadGame()">
Reload
</button>

</div>

</div>

<script>


const frame =
document.getElementById("gameFrame");

const keyboard =
document.getElementById("keyboard");

const status =
document.getElementById("status");


const keysDown =
new Set();


/* =========================
   KEYBOARD TOGGLE
========================= */

function toggleKeyboard(){

keyboard.classList.toggle("open");

}


/* =========================
   GAME FOCUS
========================= */

function focusGame(){

try{

frame.focus();

frame.contentWindow.focus();

status.textContent =
"FOCUS REQUESTED";

}catch(error){

status.textContent =
"FOCUS ERROR";

}

}


/* =========================
   FULLSCREEN
========================= */

function fullscreenGame(){

const gameArea =
document.getElementById("gameArea");

if(gameArea.requestFullscreen){

gameArea.requestFullscreen();

}

else if(gameArea.webkitRequestFullscreen){

gameArea.webkitRequestFullscreen();

}

}


/* =========================
   RELOAD
========================= */

function reloadGame(){

frame.src =
frame.src;

status.textContent =
"RELOADING";

keysDown.clear();

updateDiagnostics();

}


/* =========================
   KEY DOWN
========================= */

function pressKey(key){

if(keysDown.has(key)){

return;

}

keysDown.add(key);

updateDiagnostics();

sendToGame(
"keydown",
key
);

}


/* =========================
   KEY UP
========================= */

function releaseKey(key){

if(!keysDown.has(key)){

return;

}

keysDown.delete(key);

updateDiagnostics();

sendToGame(
"keyup",
key
);

}


/* =========================
   SEND TO GAME
========================= */

function sendToGame(
action,
key
){

status.textContent =
action.toUpperCase()+" "+key;


/*
    Primary bridge.
*/

try{

frame.contentWindow.postMessage({

type:"OBVYRIS_KEY",

action:action,

key:key,

code:getCode(key),

timestamp:Date.now()

},"*");

}catch(error){}


/*
    Secondary bridge.

    Send the same information
    using a second message name
    so a future wrapper can
    listen to either protocol.
*/

try{

frame.contentWindow.postMessage({

type:"gameKeyboard",

action:action,

key:key,

code:getCode(key)

},"*");

}catch(error){}

}


/* =========================
   KEY CODE
========================= */

function getCode(key){

if(key===" "){
return "Space";
}

if(
key==="ArrowUp" ||
key==="ArrowDown" ||
key==="ArrowLeft" ||
key==="ArrowRight"
){

return key;

}

if(key.length===1){

if(/[a-z]/i.test(key)){

return "Key"+key.toUpperCase();

}

if(/[0-9]/.test(key)){

return "Digit"+key;

}

}

return key;

}


/* =========================
   VIRTUAL KEYBOARD
========================= */

document
.querySelectorAll(".key")
.forEach(function(button){

const key =
button.dataset.key;


button.addEventListener(
"pointerdown",
function(event){

event.preventDefault();

button.classList.add("down");

pressKey(key);

}
);


button.addEventListener(
"pointerup",
function(event){

event.preventDefault();

button.classList.remove("down");

releaseKey(key);

}
);


button.addEventListener(
"pointercancel",
function(){

button.classList.remove("down");

releaseKey(key);

}
);


button.addEventListener(
"pointerleave",
function(event){

if(event.buttons){

return;

}

button.classList.remove("down");

releaseKey(key);

}
);

});


/* =========================
   PHYSICAL KEYBOARD
========================= */

document.addEventListener(
"keydown",
function(event){

if(
event.ctrlKey ||
event.altKey ||
event.metaKey
){

return;

}

if(
event.key==="w" ||
event.key==="W" ||
event.key==="a" ||
event.key==="A" ||
event.key==="s" ||
event.key==="S" ||
event.key==="d" ||
event.key==="D" ||
event.key===" "
){

event.preventDefault();

}

pressKey(
normalizeKey(event.key)
);

}
);


document.addEventListener(
"keyup",
function(event){

releaseKey(
normalizeKey(event.key)
);

}
);


/* =========================
   NORMALIZE
========================= */

function normalizeKey(key){

if(
key==="W" ||
key==="A" ||
key==="S" ||
key==="D"
){

return key.toLowerCase();

}

return key;

}


/* =========================
   DIAGNOSTICS
========================= */

function updateDiagnostics(){

const states={

w:document.getElementById("wState"),

a:document.getElementById("aState"),

s:document.getElementById("sState"),

d:document.getElementById("dState"),

" ":document.getElementById("spaceState")

};


Object.keys(states)
.forEach(function(key){

const down =
keysDown.has(key);

states[key].textContent =
down ? "DOWN" : "UP";

});


const last =
Array.from(keysDown);

document.getElementById(
"lastKey"
).textContent =
last.length
?last.join(", ")
:"---";

}


/* =========================
   GAME LOAD
========================= */

frame.addEventListener(
"load",
function(){

status.textContent =
"GAME LOADED";

});


/* =========================
   POINTER LOCK
========================= */

document.addEventListener(
"pointerlockchange",
function(){

if(document.pointerLockElement){

status.textContent =
"POINTER LOCK ACTIVE";

}

});


/* =========================
   MESSAGE MONITOR
========================= */

window.addEventListener(
"message",
function(event){

if(!event.data){

return;

}

if(
event.data.type ===
"OBVYRIS_KEY"
){

status.textContent =
"GAME ACK: "+
event.data.key;

}

});


/* =========================
   RELEASE ALL KEYS
========================= */

window.addEventListener(
"blur",
function(){

keysDown.forEach(function(key){

sendToGame(
"keyup",
key
);

});

keysDown.clear();

updateDiagnostics();

});


</script>

</body>

</html>
