<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>xx📻 Hybrid Radio Browser</title>

<style>

body{
  margin:0;
  font-family:Tahoma, sans-serif;
  background:#0b111c;
  color:#e7f0ff;
}

/* MODE BAR */
.mode-bar{
  display:flex;
  gap:6px;
  padding:10px;
}

.mode-bar button{
  flex:1;
  padding:10px;
  font-weight:700;
  cursor:pointer;
  border:1px solid #1b2d45;
  background:#0e1624;
  color:#e7f0ff;
}

.mode-active{
  background:linear-gradient(180deg,#3aa0ff,#1a5fbf) !important;
}

/* TABLE */
.table{
  border-top:2px solid #223552;
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  font-size:11px;
  text-align:left;
  padding:10px;
  background:#0c1a2c;
  color:#7fbaff;
}

td{
  padding:10px;
  font-size:12px;
  border-bottom:1px solid #1a2a40;
}

tr:hover{background:#101c2e}
tr.active{background:#13243a; box-shadow:inset 3px 0 0 #3aa0ff}

/* BUTTONS */
button{
  font-size:12px;
  font-weight:700;
  padding:8px 10px;
  border:1px solid #0f2c55;
  background:linear-gradient(180deg,#2e77d3,#1a4f99);
  color:white;
  cursor:pointer;
}

/* DOCK PLAYER */
.dock-player{
  position:fixed;
  bottom:0;
  left:0;
  right:0;

  height:95px;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:10px;

  background:#050a12;
  border-top:2px solid #223552;
}

.dock-left{width:30%}

#ledStatus{
  font-size:11px;
  font-weight:700;
  color:#ffcc66;
}

#npName{
  font-size:13px;
  font-weight:700;
  color:#6ec0ff;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

#npMeta{
  font-size:11px;
  color:#93a7c2;
}

.dock-center{
  width:40%;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
}

.cd{
  width:46px;
  height:46px;
  border-radius:50%;
  background:radial-gradient(circle,#111,#333,#000);
  border:2px solid #2b3f5f;
}

.cd.playing{
  animation:spin 2.5s linear infinite;
}

@keyframes spin{
  from{transform:rotate(0)}
  to{transform:rotate(360deg)}
}

.eq{
  display:flex;
  align-items:flex-end;
  height:35px;
  gap:3px;
}

.bar{
  width:4px;
  background:#3aa0ff;
  height:6px;
  animation:eq 1s infinite ease-in-out;
}

@keyframes eq{
  0%{height:6px}
  50%{height:30px}
  100%{height:10px}
}

.dock-right{
  width:30%;
  display:flex;
  justify-content:flex-end;
  gap:6px;
}

.dock-right button{
  width:42px;
  height:42px;
}

/* MAIN */
.main{
  padding-bottom:120px;
}

#loading{
  padding:10px;
  text-align:center;
  color:#93a7c2;
}

</style>
</head>

<body>

<div class="main">

  <!-- MODE SWITCH -->
  <div class="mode-bar">
    <button onclick="setMode('stations')" id="btnStations">📻 Stations</button>
    <button onclick="setMode('favorites')" id="btnFavs">⭐ Favorites</button>
  </div>

  <div id="loading">Loading stations...</div>

  <div class="table">
    <table>
      <thead>
        <tr>
          <th>Station</th>
          <th>Genre</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

</div>

<!-- DOCK PLAYER -->
<div class="dock-player">

  <div class="dock-left">
    <div id="ledStatus">STOPPED</div>
    <div id="npName">NO STATION</div>
    <div id="npMeta">Ready</div>
  </div>

  <div class="dock-center">
    <div class="cd" id="cdDisc"></div>

    <div class="eq">
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div><div class="bar"></div>
      <div class="bar"></div><div class="bar"></div>
    </div>
  </div>

  <div class="dock-right">
    <button onclick="prevStation()">⏮</button>
    <button onclick="togglePlay()" id="playBtn">▶</button>
    <button onclick="nextStation()">⏭</button>
    <button onclick="toggleFavCurrent()">★</button>
  </div>

  <audio id="player"></audio>

</div>

<script>

const API="https://all.api.radio-browser.info/json/stations/search";

let currentList=[];
let favorites=[];
let favoriteIds=new Set();

let mode="stations";

let page=0;
let limit=50;
let loading=false;

let currentIndex=-1;
let isPlaying=false;

/* FAVORITES */
function loadFavorites(){
  const d=localStorage.getItem("favStations");
  favorites = d ? JSON.parse(d) : [];
  favoriteIds = new Set(favorites.map(f=>f.stationuuid));
}

function saveFavorites(){
  localStorage.setItem("favStations", JSON.stringify(favorites));
}

function toggleFavorite(s){

  const id=s.stationuuid;

  if(favoriteIds.has(id)){
    favorites = favorites.filter(f=>f.stationuuid!==id);
    favoriteIds.delete(id);
  }else{
    favorites.push(s);
    favoriteIds.add(id);
  }

  saveFavorites();
  render();
}

function toggleFavCurrent(){
  const p=document.getElementById("player");
  if(!p.src) return;

  const item=currentList.find(s=>(s.url_resolved||s.url)===p.src);
  if(item) toggleFavorite(item);
}

/* MODE */
function setMode(m){
  mode=m;

  document.getElementById("btnStations").classList.remove("mode-active");
  document.getElementById("btnFavs").classList.remove("mode-active");

  if(m==="stations"){
    document.getElementById("btnStations").classList.add("mode-active");
  }else{
    document.getElementById("btnFavs").classList.add("mode-active");
  }

  render();
}

/* LOAD */
async function loadStations(){
  if(loading) return;
  loading=true;

  const res=await fetch(`${API}?countrycode=US&limit=${limit}&offset=${page*limit}&hidebroken=true`);
  const data=await res.json();

  currentList=[...currentList,...data];

  page++;
  loading=false;

  document.getElementById("loading").innerText="";
  render();
}

/* PLAY */
function playStation(id){

  const item=currentList.find(s=>s.stationuuid===id);
  if(!item)return;

  currentIndex=currentList.findIndex(s=>s.stationuuid===id);

  document.querySelectorAll("tr").forEach(r=>r.classList.remove("active"));

  const rows=[...document.querySelectorAll("tr")];
  const row=rows.find(r=>r.innerText.includes(item.name));
  if(row) row.classList.add("active");

  const p=document.getElementById("player");
  p.src=item.url_resolved||item.url;
  p.play();

  document.getElementById("npName").innerText=item.name;
  document.getElementById("npMeta").innerText=item.tags||"Radio station";

  isPlaying=true;
  startVisuals();
}

/* CONTROLS */
function togglePlay(){
  const p=document.getElementById("player");
  const btn=document.getElementById("playBtn");

  if(!p.src) return;

  if(isPlaying){
    p.pause();
    isPlaying=false;
    btn.innerText="▶";
    stopVisuals();
  }else{
    p.play();
    isPlaying=true;
    btn.innerText="⏸";
    startVisuals();
  }
}

function nextStation(){
  currentIndex=(currentIndex+1)%currentList.length;
  playStation(currentList[currentIndex].stationuuid);
}

function prevStation(){
  currentIndex=(currentIndex-1+currentList.length)%currentList.length;
  playStation(currentList[currentIndex].stationuuid);
}

/* VISUALS */
function startVisuals(){
  document.getElementById("cdDisc").classList.add("playing");
  document.getElementById("ledStatus").innerText="PLAYING";
  document.getElementById("ledStatus").style.color="#3cff8f";
}

function stopVisuals(){
  document.getElementById("cdDisc").classList.remove("playing");
  document.getElementById("ledStatus").innerText="STOPPED";
  document.getElementById("ledStatus").style.color="#ff6666";
}

/* RENDER */
function render(){

  const tbody=document.querySelector("tbody");
  tbody.innerHTML="";

  let list = mode==="favorites" ? favorites : currentList;

  list.forEach(s=>{

    const fav = favoriteIds.has(s.stationuuid);

    tbody.innerHTML+=`
      <tr onclick="playStation('${s.stationuuid}')">
        <td>${s.name}</td>
        <td>${s.tags||""}</td>
        <td>
          <button onclick="event.stopPropagation(); playStation('${s.stationuuid}')">▶</button>
          <button onclick="event.stopPropagation(); toggleFavorite(${JSON.stringify(s)})">
            ${fav ? "⭐" : "☆"}
          </button>
        </td>
      </tr>
    `;
  });
}

/* INFINITE SCROLL */
window.addEventListener("scroll",()=>{
  if(mode!=="stations") return;

  if(window.innerHeight + window.scrollY >= document.body.offsetHeight - 250){
    loadStations();
  }
});

/* INIT */
loadFavorites();
setMode("stations");
loadStations();

</script>

</body>
</html>
