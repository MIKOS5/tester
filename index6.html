<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<meta
name="mobile-web-app-capable"
content="yes">

<title>Obvyris Android Game Input Test</title>

<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,
body{

margin:0;

width:100%;
height:100%;

overflow:hidden;

background:#000;

touch-action:none;

}

body{

font-family:Arial,Helvetica,sans-serif;

}

#game{

position:fixed;

inset:0;

width:100%;
height:100%;

border:0;

background:#000;

}

#top{

position:fixed;

top:env(safe-area-inset-top);

left:0;

right:0;

height:46px;

z-index:20;

display:flex;

align-items:center;

justify-content:space-between;

padding:6px 10px;

background:rgba(9,17,29,.88);

border-bottom:1px solid #253347;

color:#fff;

font-size:12px;

pointer-events:none;

}

#title{

font-weight:bold;

}

#status{

font-family:monospace;

color:#55e6a5;

}


/* =========================
   INPUT TEST
========================= */

#testPanel{

position:fixed;

top:55px;

right:8px;

z-index:30;

background:rgba(0,0,0,.78);

border:1px solid #2793ff;

border-radius:8px;

padding:7px;

color:#fff;

font:10px monospace;

pointer-events:none;

}


/* =========================
   CONTROLS
========================= */

#controls{

position:fixed;

left:0;

right:0;

bottom:env(safe-area-inset-bottom);

height:145px;

z-index:50;

pointer-events:none;

}

.key{

position:absolute;

display:flex;

align-items:center;

justify-content:center;

background:rgba(25,39,56,.82);

border:2px solid rgba(255,255,255,.45);

border-radius:12px;

color:#fff;

font-size:20px;

font-weight:bold;

user-select:none;

-webkit-user-select:none;

touch-action:none;

pointer-events:auto;

box-shadow:0 3px 8px rgba(0,0,0,.4);

}

.key.down{

background:#2793ff;

border-color:#fff;

transform:scale(.94);

}


/* D-PAD */

#left{

left:18px;

bottom:58px;

width:58px;

height:58px;

}

#right{

left:138px;

bottom:58px;

width:58px;

height:58px;

}

#up{

left:78px;

bottom:118px;

width:58px;

height:58px;

}

#down{

left:78px;

bottom:0;

width:58px;

height:58px;

}


/* WASD */

#wa{

right:150px;

bottom:58px;

width:58px;

height:58px;

}

#ww{

right:90px;

bottom:118px;

width:58px;

height:58px;

}

#ws{

right:90px;

bottom:0;

width:58px;

height:58px;

}

#wd{

right:30px;

bottom:58px;

width:58px;

height:58px;

}


/* SPACE */

#space{

right:30px;

bottom:125px;

width:150px;

height:42px;

font-size:14px;

}


/* =========================
   TOP BUTTONS
========================= */

#buttons{

position:fixed;

top:55px;

left:8px;

z-index:40;

display:flex;

gap:5px;

}

#buttons button{

height:34px;

padding:0 10px;

border:1px solid #34445a;

border-radius:7px;

background:rgba(17,24,39,.9);

color:#fff;

font-weight:bold;

}

</style>

</head>

<body>

<iframe

id="game"

src="https://html5.gamemonetize.co/7o8qtn59e5ejushl2s6bp52nbcgiu44x/"

allow="autoplay; fullscreen; pointer-lock"

allowfullscreen>

</iframe>

<div id="top">

<div id="title">
OBVYRIS INPUT TEST
</div>

<div id="status">
READY
</div>

</div>

<div id="buttons">

<button onclick="focusGame()">
FOCUS
</button>

<button onclick="reloadGame()">
RELOAD
</button>

<button onclick="hideControls()">
HIDE
</button>

</div>

<div id="testPanel">

W <span id="tw">UP</span><br>
A <span id="ta">UP</span><br>
S <span id="ts">UP</span><br>
D <span id="td">UP</span><br>
SPACE <span id="tspace">UP</span><br>
LAST <span id="last">---</span>

</div>

<div id="controls">

<button
id="left"
class="key"
data-key="ArrowLeft">
← </button>

<button
id="right"
class="key"
data-key="ArrowRight">
→ </button>

<button
id="up"
class="key"
data-key="ArrowUp">
↑ </button>

<button
id="down"
class="key"
data-key="ArrowDown">
↓ </button>

<button
id="wa"
class="key"
data-key="a">
A </button>

<button
id="ww"
class="key"
data-key="w">
W </button>

<button
id="ws"
class="key"
data-key="s">
S </button>

<button
id="wd"
class="key"
data-key="d">
D </button>

<button
id="space"
class="key"
data-key=" ">
SPACE </button>

</div>

<script>


const game =
document.getElementById("game");


const controls =
document.getElementById("controls");


const status =
document.getElementById("status");


const held =
new Set();


/* =========================
   FOCUS
========================= */

function focusGame(){

game.focus();

try{

game.contentWindow.focus();

}catch(e){}

status.textContent =
"FOCUS";

}


/* =========================
   RELOAD
========================= */

function reloadGame(){

game.src =
game.src;

held.clear();

update();

status.textContent =
"RELOAD";

}


/* =========================
   HIDE
========================= */

function hideControls(){

controls.style.display =
"none";

}


/* =========================
   SEND MESSAGE
========================= */

function sendMessage(
action,
key
){

try{

game.contentWindow.postMessage({

type:"OBVYRIS_KEY",

action:action,

key:key,

code:getCode(key)

},"*");

}catch(e){}

}


/* =========================
   CODE
========================= */

function getCode(key){

if(key===" "){
return "Space";
}

if(
key==="ArrowUp" ||
key==="ArrowDown" ||
key==="ArrowLeft" ||
key==="ArrowRight"
){

return key;

}

if(
key.length===1 &&
/[a-z]/i.test(key)
){

return "Key"+
key.toUpperCase();

}

return key;

}


/* =========================
   PRESS
========================= */

function press(key){

if(held.has(key)){
return;
}

held.add(key);

sendMessage(
"keydown",
key
);

update();

status.textContent =
"DOWN "+key;

}


/* =========================
   RELEASE
========================= */

function release(key){

held.delete(key);

sendMessage(
"keyup",
key
);

update();

status.textContent =
"UP "+key;

}


/* =========================
   VIRTUAL TOUCH
========================= */

document
.querySelectorAll(".key")
.forEach(function(button){

const key =
button.dataset.key;


button.addEventListener(
"pointerdown",
function(event){

event.preventDefault();

button.setPointerCapture(
event.pointerId
);

button.classList.add(
"down"
);

press(key);

}
);


button.addEventListener(
"pointerup",
function(event){

event.preventDefault();

button.classList.remove(
"down"
);

release(key);

}
);


button.addEventListener(
"pointercancel",
function(){

button.classList.remove(
"down"
);

release(key);

}
);


button.addEventListener(
"lostpointercapture",
function(){

button.classList.remove(
"down"
);

release(key);

}
);

});


/* =========================
   PHYSICAL KEYBOARD
========================= */

document.addEventListener(
"keydown",
function(event){

const key =
normalize(event.key);

if(!key){
return;
}

press(key);

}
);


document.addEventListener(
"keyup",
function(event){

const key =
normalize(event.key);

if(!key){
return;
}

release(key);

}
);


function normalize(key){

if(
key==="w" ||
key==="W"
){
return "w";
}

if(
key==="a" ||
key==="A"
){
return "a";
}

if(
key==="s" ||
key==="S"
){
return "s";
}

if(
key==="d" ||
key==="D"
){
return "d";
}

if(
key===" "
){
return " ";
}

if(
key==="ArrowUp" ||
key==="ArrowDown" ||
key==="ArrowLeft" ||
key==="ArrowRight"
){

return key;

}

return null;

}


/* =========================
   STATUS
========================= */

function update(){

document.getElementById(
"tw"
).textContent =
held.has("w")
?"DOWN"
:"UP";

document.getElementById(
"ta"
).textContent =
held.has("a")
?"DOWN"
:"UP";

document.getElementById(
"ts"
).textContent =
held.has("s")
?"DOWN"
:"UP";

document.getElementById(
"td"
).textContent =
held.has("d")
?"DOWN"
:"UP";

document.getElementById(
"tspace"
).textContent =
held.has(" ")
?"DOWN"
:"UP";

document.getElementById(
"last"
).textContent =
Array.from(held).join(",") ||
"---";

}


/* =========================
   GAME LOAD
========================= */

game.addEventListener(
"load",
function(){

status.textContent =
"GAME LOADED";

focusGame();

}
);


/* =========================
   GAME RESPONSE
========================= */

window.addEventListener(
"message",
function(event){

if(!event.data){
return;
}

if(
event.data.type ===
"OBVYRIS_KEY"
){

status.textContent =
"ACK "+event.data.key;

}

}
);


/* =========================
   CLEAR KEYS
========================= */

window.addEventListener(
"blur",
function(){

held.forEach(
function(key){

sendMessage(
"keyup",
key
);

});

held.clear();

update();

});


</script>

</body>

</html>
