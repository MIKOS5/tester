<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>📻 RadioWave Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>

<style>

:root{
  --bg:#09111d;
  --panel:#111827;
  --line:#253347;
  --muted:#93a4bb;
  --blue:#2793ff;
  --blue2:#1869d9;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Inter,sans-serif;
  background:radial-gradient(circle at top,#17263f,#09111d 45%);
  color:#fff;
  display:flex;
  height:100vh;
  overflow:hidden;
}

/* SIDEBAR */
.sidebar{
  width:340px;
  background:rgba(17,24,39,.92);
  backdrop-filter:blur(16px);
  border-right:1px solid var(--line);
  padding:20px;
  overflow:auto;
}

.logo{font-size:30px;font-weight:800}
.logo span{color:var(--blue)}

.search{
  width:100%;
  margin-top:12px;
  padding:12px;
  border-radius:14px;
  border:1px solid #1e293b;
  background:#0e1725;
  color:#fff;
}

button{
  border:none;
  border-radius:12px;
  padding:10px 12px;
  cursor:pointer;
  font-weight:700;
  color:#fff;
  background:linear-gradient(180deg,var(--blue),var(--blue2));
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:10px;
}

/* PLAYER */
.player{
  margin-top:18px;
  padding:16px;
  border-radius:20px;
  background:linear-gradient(180deg,#182233,#121926);
  border:1px solid #263246;
}

#npName{font-weight:700}
#npMeta{font-size:12px;color:var(--muted)}

.controls{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:12px;
}

/* MAIN */
.main{
  flex:1;
  padding:20px;
  overflow:auto;
}

.topbar{
  display:flex;
  justify-content:space-between;
}

.title{font-size:28px;font-weight:800}

.pagebox{
  padding:10px 14px;
  border:1px solid var(--line);
  border-radius:14px;
  color:var(--muted);
}

/* TABLE */
.table{
  margin-top:20px;
  border-radius:20px;
  overflow:visible;
  border:1px solid var(--line);
}

table{
  width:100%;
  border-collapse:collapse;
  background:rgba(17,24,39,.92);
}

th{
  text-align:left;
  padding:14px;
  background:#0f1725;
  color:#8eb5ff;
  font-size:12px;
}

td{
  padding:14px;
  border-top:1px solid #1d2938;
}

tr:hover{background:#182233}

/* GENRE */
.genre-wrap{position:relative;display:inline-block}

.genre-btn{
  padding:7px 10px;
  font-size:12px;
  border-radius:10px;
  background:#182233;
  border:1px solid #263246;
}

.genre-popup{
  display:none;
  position:absolute;
  top:35px;
  left:0;
  width:240px;
  background:#0f1725;
  border:1px solid #263246;
  padding:10px;
  border-radius:12px;
  font-size:12px;
  color:#93a4bb;
  z-index:9999;
  box-shadow:0 10px 30px rgba(0,0,0,.5);
}

.genre-wrap.active .genre-popup{
  display:block;
}

</style>
</head>

<body>

<div class="sidebar">

  <div class="logo">📻 Radio<span>Wave</span></div>

  <input id="genre" class="search" placeholder="Search genre..."/>

  <button onclick="applyFilter()">Search</button>

  <div class="grid">
    <button onclick="prevPage()">Prev</button>
    <button onclick="nextPage()">Next</button>
    <button onclick="loadStations()">Refresh</button>
    <button onclick="loadFavorites()">Favs</button>
  </div>

  <div class="player">

    <div id="npName">Not Playing</div>
    <div id="npMeta">Select station</div>

    <audio id="player"></audio>

    <div class="controls">
      <button onclick="prevStation()">⏮</button>
      <button onclick="togglePlay()" id="playBtn">▶</button>
      <button onclick="nextStation()">⏭</button>

      <!-- FIXED ⭐ BUTTON -->
      <button onclick="toggleFavCurrent()">⭐</button>
    </div>

  </div>

  <div id="status" style="margin-top:10px;color:#93a4bb">Loading...</div>

</div>

<div class="main">

  <div class="topbar">
    <div>
      <div class="title">US Radio</div>
      <div id="count"></div>
    </div>
    <div class="pagebox" id="pageInfo"></div>
  </div>

  <div class="table">
    <table>
      <thead>
        <tr>
          <th>Station</th>
          <th>Genre</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

</div>

<script>

const API="https://all.api.radio-browser.info/json/stations/search";

let stations=[],allStations=[],currentList=[];
let favorites=[],favoriteIds=new Set();
let page=0,currentIndex=-1;
const limit=50;
let isPlaying=false;

/* FAVORITES */
function saveFav(){
  localStorage.setItem("radioFav",JSON.stringify(favorites));
}
function loadFav(){
  const d=localStorage.getItem("radioFav");
  favorites=d?JSON.parse(d):[];
  favoriteIds=new Set(favorites.map(f=>f.stationuuid));
}

/* LOAD */
async function loadStations(){
  setStatus("Loading...");
  const res=await fetch(`${API}?countrycode=US&limit=${limit}&offset=${page*limit}&hidebroken=true`);
  const data=await res.json();
  stations=data;
  allStations=[...data];
  currentList=stations;
  render();
  setStatus("Loaded "+stations.length);
}

/* FAVORITE TOGGLE */
function toggleFavorite(s){

  const id=s.stationuuid;
  const exists=favoriteIds.has(id);

  if(exists){
    favorites=favorites.filter(f=>f.stationuuid!==id);
    favoriteIds.delete(id);
    setStatus("Removed ⭐");
  }else{
    favorites.push(s);
    favoriteIds.add(id);
    setStatus("Saved ⭐");
  }

  saveFav();
  render();
}

/* FIXED PLAYER FAVORITE BUTTON */
function toggleFavCurrent(){

  const p=document.getElementById("player");
  if(!p.src) return;

  const item=currentList.find(s =>
    (s.url_resolved||s.url) === p.src
  );

  if(!item) return;

  toggleFavorite(item);
}

/* LOAD FAVORITES */
function loadFavorites(){
  currentList=[...favorites];
  page=0;
  render();
}

/* PLAY */
function playStation(id){

  const item=currentList.find(s=>s.stationuuid===id);
  if(!item)return;

  currentIndex=currentList.findIndex(s=>s.stationuuid===id);

  const p=document.getElementById("player");
  p.src=item.url_resolved||item.url;
  p.play();

  isPlaying=true;
  document.getElementById("playBtn").textContent="⏸";

  document.getElementById("npName").textContent=item.name;
  document.getElementById("npMeta").textContent=item.tags||"Radio";
}

/* NEXT / PREV FIXED */
function nextStation(){
  if(!currentList.length)return;
  if(currentIndex<0)currentIndex=0;
  currentIndex=(currentIndex+1)%currentList.length;
  playStation(currentList[currentIndex].stationuuid);
}

function prevStation(){
  if(!currentList.length)return;
  if(currentIndex<0)currentIndex=0;
  currentIndex=(currentIndex-1+currentList.length)%currentList.length;
  playStation(currentList[currentIndex].stationuuid);
}

/* PLAY */
function togglePlay(){
  const p=document.getElementById("player");
  if(!p.src)return;

  if(isPlaying){
    p.pause();
    isPlaying=false;
    document.getElementById("playBtn").textContent="▶";
  }else{
    p.play();
    isPlaying=true;
    document.getElementById("playBtn").textContent="⏸";
  }
}

/* FILTER */
function applyFilter(){
  const v=document.getElementById("genre").value.toLowerCase();
  currentList=allStations.filter(s=>(s.tags||"").toLowerCase().includes(v));
  page=0;
  render();
}

/* PAGINATION */
function nextPage(){page++;loadStations();}
function prevPage(){if(page>0)page--;loadStations();}

/* GENRE POPUP */
function toggleGenre(el){
  document.querySelectorAll(".genre-wrap").forEach(g=>{
    if(g!==el.parentElement)g.classList.remove("active");
  });
  el.parentElement.classList.toggle("active");
}

document.addEventListener("click",e=>{
  if(!e.target.closest(".genre-wrap")){
    document.querySelectorAll(".genre-wrap").forEach(g=>g.classList.remove("active"));
  }
});

/* RENDER */
function render(){

  const tbody=document.querySelector("tbody");
  tbody.innerHTML="";

  currentList.forEach(s=>{

    const fav=favoriteIds.has(s.stationuuid);

    tbody.innerHTML+=`
      <tr>
        <td>${s.name}</td>

        <td>
          <div class="genre-wrap">
            <button class="genre-btn" onclick="toggleGenre(this)">Genre ▾</button>
            <div class="genre-popup">${s.tags||"No data"}</div>
          </div>
        </td>

        <td>
          <button onclick="playStation('${s.stationuuid}')">Play</button>
          <button onclick='toggleFavorite(${JSON.stringify(s)})'>
            ${fav?"⭐":"☆"}
          </button>
        </td>
      </tr>
    `;
  });

  document.getElementById("count").innerText=currentList.length+" stations";
  document.getElementById("pageInfo").innerText="Page "+(page+1);
}

/* STATUS */
function setStatus(t){
  document.getElementById("status").innerText=t;
}

/* INIT */
loadFav();
loadStations();

</script>

</body>
</html>
