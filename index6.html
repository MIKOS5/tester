<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="theme-color" content="#09111d">

<title>Obvyris Universal Android Game Keyboard Test</title>

<style>

*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,
body{

margin:0;

width:100%;
height:100%;

background:#070d16;

color:#fff;

font-family:Arial,Helvetica,sans-serif;

overflow:hidden;

touch-action:none;

}

body{

display:flex;

flex-direction:column;

}


/* =========================
   HEADER
========================= */

#header{

height:46px;

background:#111827;

border-bottom:1px solid #253347;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 10px;

flex-shrink:0;

}

#title{

font-weight:bold;

font-size:14px;

}

#status{

font-family:monospace;

font-size:10px;

color:#55e6a5;

}


/* =========================
   GAME
========================= */

#gameArea{

position:relative;

flex:1;

min-height:0;

background:#000;

overflow:hidden;

}

#gameFrame{

position:absolute;

inset:0;

width:100%;

height:100%;

border:0;

background:#000;

}


/* =========================
   DIAGNOSTICS
========================= */

#diagnostics{

position:absolute;

top:6px;

left:6px;

z-index:100;

width:255px;

max-height:180px;

overflow:auto;

padding:7px;

background:rgba(0,0,0,.82);

border:1px solid #2793ff;

border-radius:8px;

font-family:monospace;

font-size:9px;

line-height:1.45;

pointer-events:none;

}

.diagTitle{

color:#2793ff;

font-weight:bold;

}

.good{

color:#55e6a5;

}

.warn{

color:#ffd34d;

}

.bad{

color:#ff6868;

}


/* =========================
   KEYBOARD
========================= */

#keyboard{

position:absolute;

left:0;

right:0;

bottom:0;

z-index:200;

background:rgba(9,17,29,.97);

border-top:2px solid #2793ff;

padding:5px 4px 8px;

display:flex;

flex-direction:column;

gap:4px;

}


/* =========================
   ROW
========================= */

.keyRow{

display:flex;

justify-content:center;

gap:3px;

width:100%;

}


/* =========================
   KEYS
========================= */

.key{

flex:1;

min-width:0;

height:38px;

padding:0 2px;

border:1px solid #34445a;

border-radius:6px;

background:#1b2738;

color:#fff;

font-size:13px;

font-weight:800;

touch-action:none;

user-select:none;

-webkit-user-select:none;

}

.key.down{

background:#2793ff;

border-color:#fff;

transform:scale(.96);

}


/* =========================
   SPECIAL KEYS
========================= */

.keyWide{

flex:2;

}

.keyExtraWide{

flex:4;

}

.keyShift{

flex:1.6;

}

.keySpace{

flex:5;

}

.keySmall{

flex:1.2;

}


/* =========================
   TOOLBAR
========================= */

#toolbar{

height:42px;

display:flex;

gap:4px;

align-items:center;

padding:4px;

background:#111827;

border-top:1px solid #253347;

flex-shrink:0;

overflow-x:auto;

}

#toolbar button{

height:32px;

white-space:nowrap;

padding:0 9px;

border:1px solid #34445a;

border-radius:6px;

background:#1b2738;

color:#fff;

font-weight:bold;

font-size:11px;

}

#toolbar button:active{

background:#2793ff;

}


/* =========================
   NATIVE ANDROID INPUT
========================= */

#nativeInput{

position:fixed;

left:-1000px;

top:-1000px;

width:1px;

height:1px;

opacity:.01;

font-size:16px;

}

</style>

</head>

<body>

<div id="header">

<div id="title">
OBVYRIS UNIVERSAL KEYBOARD TEST
</div>

<div id="status">
READY
</div>

</div>

<div id="gameArea">

<iframe
id="gameFrame"
src="https://html5.gamemonetize.co/7o8qtn59e5ejushl2s6bp52nbcgiu44x/"
allow="autoplay; fullscreen; pointer-lock"
allowfullscreen>
</iframe>

<div id="diagnostics">

<div class="diagTitle">
INPUT DIAGNOSTICS
</div>

Physical / Virtual:

<span id="diagKey">---</span>

<br>

Held:

<span id="diagHeld">---</span>

<br><br>

METHODS

<br>

postMessage: <span id="diagPost">---</span>

<br>

Parent KeyboardEvent: <span id="diagParent">---</span>

<br>

Iframe Event: <span id="diagIframe">---</span>

<br>

Iframe Focus: <span id="diagFocus">---</span>

<br>

Native Android: <span id="diagNative">---</span>

<br>

Text:

<span id="diagText">---</span>

</div>

</div>

<div id="keyboard">

<!-- NUMBER ROW -->

<div class="keyRow">

<button class="key" data-key="1">1</button>

<button class="key" data-key="2">2</button>

<button class="key" data-key="3">3</button>

<button class="key" data-key="4">4</button>

<button class="key" data-key="5">5</button>

<button class="key" data-key="6">6</button>

<button class="key" data-key="7">7</button>

<button class="key" data-key="8">8</button>

<button class="key" data-key="9">9</button>

<button class="key" data-key="0">0</button>

</div>

<!-- QWERTY -->

<div class="keyRow">

<button class="key" data-key="q">Q</button>

<button class="key" data-key="w">W</button>

<button class="key" data-key="e">E</button>

<button class="key" data-key="r">R</button>

<button class="key" data-key="t">T</button>

<button class="key" data-key="y">Y</button>

<button class="key" data-key="u">U</button>

<button class="key" data-key="i">I</button>

<button class="key" data-key="o">O</button>

<button class="key" data-key="p">P</button>

</div>

<!-- ASDF -->

<div class="keyRow">

<button class="key keySmall" data-key="a">A</button>

<button class="key" data-key="s">S</button>

<button class="key" data-key="d">D</button>

<button class="key" data-key="f">F</button>

<button class="key" data-key="g">G</button>

<button class="key" data-key="h">H</button>

<button class="key" data-key="j">J</button>

<button class="key" data-key="k">K</button>

<button class="key" data-key="l">L</button>

</div>

<!-- ZXCV -->

<div class="keyRow">

<button
class="key keyShift"
data-key="Shift">
SHIFT </button>

<button class="key" data-key="z">Z</button>

<button class="key" data-key="x">X</button>

<button class="key" data-key="c">C</button>

<button class="key" data-key="v">V</button>

<button class="key" data-key="b">B</button>

<button class="key" data-key="n">N</button>

<button class="key" data-key="m">M</button>

<button
class="key keySmall"
data-key="Backspace">
⌫ </button>

</div>

<!-- SPACE / ENTER -->

<div class="keyRow">

<button
class="key keySpace"
data-key=" ">
SPACE </button>

<button
class="key keyWide"
data-key="Enter">
ENTER </button>

</div>

<!-- ARROWS -->

<div class="keyRow">

<button
class="key"
data-key="ArrowLeft">
← </button>

<button
class="key"
data-key="ArrowUp">
↑ </button>

<button
class="key"
data-key="ArrowDown">
↓ </button>

<button
class="key"
data-key="ArrowRight">
→ </button>

</div>

</div>

<div id="toolbar">

<button onclick="focusGame()">
FOCUS
</button>

<button onclick="nativeKeyboard()">
ANDROID INPUT
</button>

<button onclick="sendTestText()">
TEST TEXT
</button>

<button onclick="clearNative()">
CLEAR
</button>

<button onclick="reloadGame()">
RELOAD
</button>

</div>

<input
id="nativeInput"
type="text"
autocomplete="off"
autocorrect="off"
autocapitalize="none"
spellcheck="false">

<script>


/* =========================
   REFERENCES
========================= */

const frame =
document.getElementById("gameFrame");

const nativeInput =
document.getElementById("nativeInput");

const held =
new Set();

let shiftDown=false;


/* =========================
   STATUS
========================= */

function setStatus(text){

document.getElementById(
"status"
).textContent=text;

}


/* =========================
   DIAGNOSTICS
========================= */

function diag(id,text){

document.getElementById(
id
).textContent=text;

}


/* =========================
   LOG KEY
========================= */

function showKey(key){

diag(
"diagKey",
key
);

diag(
"diagHeld",
Array.from(held).join(" ") || "---"
);

}


/* =========================
   CODE
========================= */

function getCode(key){

if(key===" "){
return "Space";
}

if(
key==="ArrowLeft" ||
key==="ArrowRight" ||
key==="ArrowUp" ||
key==="ArrowDown"
){

return key;

}

if(key==="Shift"){
return "ShiftLeft";
}

if(key==="Backspace"){
return "Backspace";
}

if(key==="Enter"){
return "Enter";
}

if(
key.length===1 &&
/[a-z]/i.test(key)
){

return "Key"+
key.toUpperCase();

}

if(
key.length===1 &&
/[0-9]/.test(key)
){

return "Digit"+key;

}

return key;

}


/* =========================
   KEYCODE
========================= */

function getKeyCode(key){

const map={

Backspace:8,

Enter:13,

Shift:16,

" ":32,

ArrowLeft:37,

ArrowUp:38,

ArrowRight:39,

ArrowDown:40

};

if(map[key]){
return map[key];
}

if(
key.length===1 &&
/[a-z]/i.test(key)
){

return key.toUpperCase()
.charCodeAt(0);

}

if(
key.length===1 &&
/[0-9]/.test(key)
){

return key.charCodeAt(0);

}

return 0;

}


/* =========================
   POSTMESSAGE TEST
========================= */

function sendPostMessage(
action,
key
){

try{

frame.contentWindow.postMessage({

type:"OBVYRIS_KEY",

action:action,

key:key,

code:getCode(key),

keyCode:getKeyCode(key)

},"*");

diag(
"diagPost",
"FIRED"
);

}catch(error){

diag(
"diagPost",
"ERROR"
);

}

}


/* =========================
   PARENT EVENT TEST
========================= */

function sendParentEvent(
action,
key
){

const event =
new KeyboardEvent(
action,
{

key:key,

code:getCode(key),

keyCode:getKeyCode(key),

which:getKeyCode(key),

bubbles:true,

cancelable:true

}
);

document.dispatchEvent(
event
);

diag(
"diagParent",
"FIRED"
);

}


/* =========================
   IFRAME ELEMENT TEST
========================= */

function sendIframeEvent(
action,
key
){

try{

const event =
new KeyboardEvent(
action,
{

key:key,

code:getCode(key),

keyCode:getKeyCode(key),

which:getKeyCode(key),

bubbles:true,

cancelable:true

}
);

frame.dispatchEvent(
event
);

diag(
"diagIframe",
"FIRED"
);

}catch(error){

diag(
"diagIframe",
"BLOCKED"
);

}

}


/* =========================
   FOCUS TEST
========================= */

function focusGame(){

try{

frame.focus();

diag(
"diagFocus",
"FRAME FOCUS"
);

}catch(error){

diag(
"diagFocus",
"ERROR"
);

}

try{

frame.contentWindow.focus();

diag(
"diagFocus",
"WINDOW FOCUS"

);

}catch(error){}

setStatus(
"GAME FOCUSED"
);

}


/* =========================
   UNIVERSAL KEY DOWN
========================= */

function keyDown(key){

if(
held.has(key)
){

return;

}

held.add(key);

if(key==="Shift"){

shiftDown=true;

}

showKey(key);

setStatus(
"DOWN "+key
);


/*
    Method 1
*/

sendPostMessage(
"keydown",
key
);


/*
    Method 2
*/

sendParentEvent(
"keydown",
key
);


/*
    Method 3
*/

sendIframeEvent(
"keydown",
key
);


/*
    Method 4
*/

focusGame();


/*
    Native Android
    input synchronization.
*/

syncNativeKey(
key
);

}


/* =========================
   UNIVERSAL KEY UP
========================= */

function keyUp(key){

held.delete(key);

if(key==="Shift"){

shiftDown=false;

}

showKey(key);

setStatus(
"UP "+key
);


/*
    Method 1
*/

sendPostMessage(
"keyup",
key
);


/*
    Method 2
*/

sendParentEvent(
"keyup",
key
);


/*
    Method 3
*/

sendIframeEvent(
"keyup",
key
);

}


/* =========================
   VIRTUAL KEYBOARD
========================= */

document
.querySelectorAll(".key")
.forEach(function(button){

const key =
button.dataset.key;


button.addEventListener(
"pointerdown",
function(event){

event.preventDefault();

button.setPointerCapture(
event.pointerId
);

button.classList.add(
"down"
);

keyDown(key);

}
);


button.addEventListener(
"pointerup",
function(event){

event.preventDefault();

button.classList.remove(
"down"
);

keyUp(key);

}
);


button.addEventListener(
"pointercancel",
function(){

button.classList.remove(
"down"
);

keyUp(key);

}
);


button.addEventListener(
"lostpointercapture",
function(){

button.classList.remove(
"down"
);

keyUp(key);

}
);

});


/* =========================
   PHYSICAL KEYBOARD
========================= */

document.addEventListener(
"keydown",
function(event){

if(
event.ctrlKey ||
event.altKey ||
event.metaKey
){

return;

}

const key =
normalizeKey(
event.key
);

if(!key){
return;
}

event.preventDefault();

keyDown(key);

}
);


document.addEventListener(
"keyup",
function(event){

const key =
normalizeKey(
event.key
);

if(!key){
return;
}

keyUp(key);

}
);


/* =========================
   NORMALIZE
========================= */

function normalizeKey(key){

if(
key.length===1
){

if(
/[a-z]/i.test(key)
){

return key.toLowerCase();

}

return key;

}

if(
key==="Shift" ||
key==="Backspace" ||
key==="Enter" ||
key==="ArrowUp" ||
key==="ArrowDown" ||
key==="ArrowLeft" ||
key==="ArrowRight"
){

return key;

}

return null;

}


/* =========================
   ANDROID NATIVE INPUT
========================= */

function nativeKeyboard(){

nativeInput.focus();

try{

nativeInput.click();

}catch(error){}

diag(
"diagNative",
"FOCUSED"
);

setStatus(
"ANDROID INPUT ACTIVE"
);

}


/* =========================
   INPUT EVENT
========================= */

nativeInput.addEventListener(
"input",
function(){

const value =
nativeInput.value;

diag(
"diagNative",
"INPUT"
);

diag(
"diagText",
value
);


/*
    Send the text through
    every available bridge.
*/

try{

frame.contentWindow.postMessage({

type:"OBVYRIS_TEXT",

text:value,

value:value

},"*");

}catch(error){}

});


/* =========================
   BEFORE INPUT
========================= */

nativeInput.addEventListener(
"beforeinput",
function(event){

diag(
"diagNative",
"BEFOREINPUT"
);

if(event.data){

try{

frame.contentWindow.postMessage({

type:"OBVYRIS_TEXT_INPUT",

text:event.data,

inputType:event.inputType

},"*");

}catch(error){}

}

});


/* =========================
   TEST TEXT
========================= */

function sendTestText(){

nativeInput.value =
"OBVYRIS";

nativeInput.dispatchEvent(
new Event(
"input",
{
bubbles:true
}
)
);

diag(
"diagText",
"OBVYRIS"
);

setStatus(
"TEST TEXT SENT"
);

}


/* =========================
   CLEAR
========================= */

function clearNative(){

nativeInput.value="";

diag(
"diagText",
"---"
);

}


/* =========================
   NATIVE KEY SYNC
========================= */

function syncNativeKey(key){

if(
key.length!==1
){

return;

}

if(
document.activeElement ===
nativeInput
){

return;

}

}


/* =========================
   GAME LOAD
========================= */

frame.addEventListener(
"load",
function(){

setStatus(
"GAME LOADED"
);

focusGame();

});


/* =========================
   GAME MESSAGE
========================= */

window.addEventListener(
"message",
function(event){

if(!event.data){
return;
}

if(
event.data.type ===
"OBVYRIS_KEY_ACK"
){

diag(
"diagPost",
"GAME ACK"
);

}

if(
event.data.type ===
"OBVYRIS_TEXT_ACK"
){

diag(
"diagText",
"GAME ACK"
);

}

});


/* =========================
   RELEASE ALL
========================= */

window.addEventListener(
"blur",
function(){

Array.from(held)
.forEach(function(key){

keyUp(key);

});

});


</script>

</body>

</html>
