<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>📀 MusicMatch Radio Jukebox</title>

<link href="https://fonts.googleapis.com/css2?family=Tahoma:wght@400;700&display=swap" rel="stylesheet"/>

<style>

:root{
  --bg:#070b12;
  --panel:#0e1624;
  --panel2:#0a111d;
  --border:#263a55;
  --blue:#3aa0ff;
  --blue2:#1a5fbf;
  --text:#e7f0ff;
  --muted:#93a7c2;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Tahoma, sans-serif;
  background:linear-gradient(180deg,#05070c,#0b111c);
  color:var(--text);
  height:100vh;
  display:flex;
  overflow:hidden;
}

/* ================= LEFT LIBRARY ================= */
.sidebar{
  width:330px;
  background:linear-gradient(180deg,var(--panel),var(--panel2));
  border-right:2px solid var(--border);
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

/* LOGO */
.logo{
  text-align:center;
  font-weight:700;
  padding:10px;
  border:1px solid var(--border);
  background:#0b1524;
  letter-spacing:1px;
}
.logo span{color:var(--blue)}

/* INPUT */
.search{
  padding:10px;
  background:#0b1422;
  border:1px inset var(--border);
  color:white;
  outline:none;
}

/* BUTTONS */
button{
  font-family:Tahoma;
  font-size:12px;
  font-weight:700;
  padding:8px 10px;
  border:1px solid #0f2c55;
  background:linear-gradient(180deg,#2e77d3,#1a4f99);
  color:white;
  cursor:pointer;
}
button:active{
  transform:translateY(1px);
}

/* GRID CONTROLS */
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}

/* ================= PLAYER ================= */
.player{
  margin-top:10px;
  padding:12px;
  background:linear-gradient(180deg,#0a1322,#070d18);
  border:2px inset #223552;
  position:relative;
}

/* LED TOP BAR */
.player::before{
  content:"● MUSICMATCH RADIO";
  font-size:10px;
  color:#3cff8f;
  position:absolute;
  top:-10px;
  left:10px;
  background:#070d18;
  padding:2px 6px;
  border:1px solid #1c2f4a;
}

/* DISPLAY SCREEN */
#npName{
  background:#050a12;
  border:1px inset #1d2d45;
  padding:10px;
  font-weight:700;
  font-size:13px;
  color:#6ec0ff;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  text-shadow:0 0 8px rgba(80,160,255,.25);
}

#npMeta{
  margin-top:6px;
  font-size:11px;
  color:var(--muted);
}

/* AUDIO */
audio{
  width:100%;
  margin-top:10px;
  filter:brightness(.9);
}

/* CONTROLS */
.controls{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  margin-top:10px;
}

.controls button{
  padding:10px 0;
  border-radius:4px;
  background:linear-gradient(180deg,#2c63a8,#163a6d);
  border:1px solid #0b2442;
}

.controls button:last-child{
  background:linear-gradient(180deg,#caa200,#8a6a00);
}

/* STATUS */
#status{
  font-size:11px;
  color:var(--muted);
}

/* ================= MAIN ================= */
.main{
  flex:1;
  padding:12px;
  overflow:auto;
}

/* HEADER */
.topbar{
  display:flex;
  justify-content:space-between;
  padding:10px;
  background:#0b1524;
  border:1px solid var(--border);
}

.title{
  font-weight:700;
}

/* TABLE */
.table{
  margin-top:10px;
  border:2px inset #223552;
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  font-size:11px;
  text-align:left;
  padding:10px;
  background:#0c1a2c;
  color:#7fbaff;
  border-bottom:1px solid var(--border);
}

td{
  padding:10px;
  font-size:12px;
  border-bottom:1px solid #1a2a40;
}

tr:hover{
  background:#101c2e;
}

.genre-btn{
  font-size:11px;
  padding:6px 8px;
  background:#14263f;
  border:1px solid var(--border);
}

.genre-popup{
  display:none;
  position:absolute;
  background:#0b1524;
  border:1px solid var(--border);
  padding:8px;
  width:200px;
  font-size:11px;
}

.genre-wrap{position:relative}

.genre-wrap.active .genre-popup{
  display:block;
}

</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

  <div class="logo">📀 MUSICMATCH <span>RADIO</span></div>

  <input id="genre" class="search" placeholder="Search genre or station"/>

  <button onclick="applyFilter()">SEARCH</button>

  <div class="grid">
    <button onclick="prevPage()">Prev</button>
    <button onclick="nextPage()">Next</button>
    <button onclick="loadStations()">Refresh</button>
    <button onclick="loadFavorites()">Favs</button>
  </div>

  <!-- PLAYER -->
  <div class="player">

    <div id="npName">▶ NO STATION SELECTED</div>
    <div id="npMeta">MusicMatch-style radio jukebox</div>

    <audio id="player" controls></audio>

    <div class="controls">
      <button onclick="prevStation()">⏮</button>
      <button onclick="togglePlay()">▶/⏸</button>
      <button onclick="nextStation()">⏭</button>
      <button onclick="toggleFavCurrent()">★</button>
    </div>

  </div>

  <div id="status">Loading...</div>

</div>

<!-- MAIN -->
<div class="main">

  <div class="topbar">
    <div class="title">RADIO LIBRARY (US)</div>
    <div id="pageInfo"></div>
  </div>

  <div class="table">
    <table>
      <thead>
        <tr>
          <th>Station</th>
          <th>Genre</th>
          <th>Play</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

</div>

<script>

const API="https://all.api.radio-browser.info/json/stations/search";

let allStations=[],currentList=[];
let favorites=[],favoriteIds=new Set();
let page=0,currentIndex=-1;
const limit=50;
let isPlaying=false;

/* LOAD FAVS */
function loadFav(){
  const d=localStorage.getItem("radioFav");
  favorites=d?JSON.parse(d):[];
  favoriteIds=new Set(favorites.map(f=>f.stationuuid));
}
function saveFav(){
  localStorage.setItem("radioFav",JSON.stringify(favorites));
}

/* LOAD */
async function loadStations(){
  setStatus("Loading...");
  const res=await fetch(`${API}?countrycode=US&limit=${limit}&offset=${page*limit}&hidebroken=true`);
  const data=await res.json();
  allStations=data;
  currentList=data;
  render();
  setStatus("Ready");
}

/* FAVORITE */
function toggleFavorite(s){
  const id=s.stationuuid;
  if(favoriteIds.has(id)){
    favorites=favorites.filter(f=>f.stationuuid!==id);
    favoriteIds.delete(id);
  }else{
    favorites.push(s);
    favoriteIds.add(id);
  }
  saveFav();
  render();
}

function toggleFavCurrent(){
  const p=document.getElementById("player");
  const item=currentList.find(s=>(s.url_resolved||s.url)===p.src);
  if(item) toggleFavorite(item);
}

/* PLAY */
function playStation(id){
  const item=currentList.find(s=>s.stationuuid===id);
  if(!item)return;

  currentIndex=currentList.findIndex(s=>s.stationuuid===id);

  const p=document.getElementById("player");
  p.src=item.url_resolved||item.url;
  p.play();

  isPlaying=true;
  document.getElementById("npName").innerText=item.name;
  document.getElementById("npMeta").innerText=item.tags||"Radio station";
}

/* NEXT / PREV */
function nextStation(){
  currentIndex=(currentIndex+1)%currentList.length;
  playStation(currentList[currentIndex].stationuuid);
}
function prevStation(){
  currentIndex=(currentIndex-1+currentList.length)%currentList.length;
  playStation(currentList[currentIndex].stationuuid);
}

/* PLAY TOGGLE */
function togglePlay(){
  const p=document.getElementById("player");
  if(!p.src)return;
  if(isPlaying){p.pause();isPlaying=false;}
  else{p.play();isPlaying=true;}
}

/* FILTER */
function applyFilter(){
  const v=document.getElementById("genre").value.toLowerCase();
  currentList=allStations.filter(s=>(s.tags||"").toLowerCase().includes(v));
  render();
}

/* RENDER */
function render(){
  const tbody=document.querySelector("tbody");
  tbody.innerHTML="";

  currentList.forEach(s=>{
    const fav=favoriteIds.has(s.stationuuid);

    tbody.innerHTML+=`
      <tr>
        <td>${s.name}</td>
        <td>${s.tags||"Unknown"}</td>
        <td>
          <button onclick="playStation('${s.stationuuid}')">PLAY</button>
          <button onclick='toggleFavorite(${JSON.stringify(s)})'>
            ${fav?"★":"☆"}
          </button>
        </td>
      </tr>
    `;
  });

  document.getElementById("pageInfo").innerText="Page "+(page+1);
}

/* STATUS */
function setStatus(t){
  document.getElementById("status").innerText=t;
}

/* INIT */
loadFav();
loadStations();

</script>

</body>
</html>
