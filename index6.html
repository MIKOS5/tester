<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Obvyris Game Controller Test</title>

<style>

*{
box-sizing:border-box;
}

html,
body{
margin:0;
width:100%;
height:100%;
background:#080d14;
color:#fff;
font-family:Arial,Helvetica,sans-serif;
}

body{
display:flex;
flex-direction:column;
overflow:hidden;
}

#header{
height:52px;
background:#111827;
border-bottom:1px solid #253347;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 12px;
flex-shrink:0;
}

#title{
font-weight:bold;
}

#status{
font-family:monospace;
font-size:12px;
color:#55e6a5;
}

#gameWindow{
flex:1;
display:flex;
align-items:center;
justify-content:center;
padding:20px;
text-align:center;
}

#message{
max-width:600px;
color:#93a4bb;
line-height:1.6;
}

#message strong{
color:#fff;
}

#keyboard{
background:#111827;
border-top:2px solid #2793ff;
padding:8px;
display:none;
}

#keyboard.open{
display:block;
}

.row{
display:flex;
justify-content:center;
gap:5px;
margin-bottom:5px;
}

.key{
width:46px;
height:40px;
border:1px solid #34445a;
border-radius:7px;
background:#1b2738;
color:#fff;
font-weight:bold;
font-size:13px;
touch-action:none;
user-select:none;
}

.key:active,
.key.down{
background:#2793ff;
border-color:#fff;
}

.space{
width:180px;
}

#controls{
height:48px;
background:#111827;
border-top:1px solid #253347;
display:flex;
align-items:center;
gap:6px;
padding:6px;
flex-shrink:0;
}

#controls button{
height:34px;
background:#1b2738;
border:1px solid #34445a;
border-radius:6px;
color:#fff;
font-weight:bold;
padding:0 12px;
cursor:pointer;
}

#controls button:hover{
background:#2793ff;
}

#log{
position:fixed;
top:62px;
right:10px;
width:220px;
max-height:180px;
overflow:auto;
background:rgba(0,0,0,.8);
border:1px solid #253347;
border-radius:8px;
padding:8px;
font-family:monospace;
font-size:10px;
color:#93a4bb;
}

</style>

</head>

<body>

<div id="header">

<div id="title">
Obvyris Game Controller
</div>

<div id="status">
CONTROLLER READY
</div>

</div>

<div id="gameWindow">

<div id="message">

<strong>Game Controller Test</strong>

<br><br>

Click <strong>OPEN GAME</strong>.

<br><br>

The actual GameMonetize game will open
in its own browser window.

<br><br>

Keep this controller window open.

Use the physical keyboard or the
virtual keyboard below.

</div>

</div>

<div id="log"></div>

<div id="keyboard">

<div class="row">

<button class="key"
data-key="w">
W </button>

</div>

<div class="row">

<button class="key"
data-key="a">
A </button>

<button class="key"
data-key="s">
S </button>

<button class="key"
data-key="d">
D </button>

</div>

<div class="row">

<button class="key space"
data-key=" ">
SPACE </button>

</div>

<div class="row">

<button class="key"
data-key="ArrowLeft">
← </button>

<button class="key"
data-key="ArrowUp">
↑ </button>

<button class="key"
data-key="ArrowDown">
↓ </button>

<button class="key"
data-key="ArrowRight">
→ </button>

</div>

</div>

<div id="controls">

<button onclick="openGame()">
OPEN GAME
</button>

<button onclick="toggleKeyboard()">
⌨ KEYBOARD
</button>

<button onclick="focusGame()">
FOCUS GAME
</button>

<button onclick="closeGame()">
CLOSE GAME
</button>

</div>

<script>


const GAME_URL =
"https://html5.gamemonetize.co/7o8qtn59e5ejushl2s6bp52nbcgiu44x/";


let gameWindow =
null;


const heldKeys =
new Set();


/* =========================
   LOG
========================= */

function log(text){

const box =
document.getElementById("log");

const line =
document.createElement("div");

line.textContent =
new Date().toLocaleTimeString()+
"  "+
text;

box.prepend(line);

while(box.children.length>20){

box.removeChild(
box.lastChild
);

}

}


/* =========================
   STATUS
========================= */

function status(text){

document.getElementById(
"status"
).textContent=text;

}


/* =========================
   OPEN GAME
========================= */

function openGame(){

gameWindow =
window.open(
GAME_URL,
"ObvyrisGame",
"width=1280,height=720,resizable=yes"
);

if(!gameWindow){

status("POPUP BLOCKED");

log(
"Browser blocked popup"
);

return;

}

status(
"GAME WINDOW OPEN"
);

log(
"Game window opened"
);

}


/* =========================
   CLOSE GAME
========================= */

function closeGame(){

if(
gameWindow &&
!gameWindow.closed
){

gameWindow.close();

}

gameWindow=null;

status(
"GAME CLOSED"
);

}


/* =========================
   FOCUS
========================= */

function focusGame(){

if(
gameWindow &&
!gameWindow.closed
){

gameWindow.focus();

status(
"GAME FOCUSED"
);

log(
"Focus requested"
);

}else{

status(
"GAME NOT OPEN"
);

}

}


/* =========================
   KEYBOARD
========================= */

function toggleKeyboard(){

document
.getElementById("keyboard")
.classList
.toggle("open");

}


/* =========================
   NORMALIZE
========================= */

function normalizeKey(key){

if(
key==="W" ||
key==="A" ||
key==="S" ||
key==="D"
){

return key.toLowerCase();

}

return key;

}


/* =========================
   KEY DOWN
========================= */

function keyDown(key){

key=
normalizeKey(key);

if(
heldKeys.has(key)
){

return;

}

heldKeys.add(key);

status(
"KEY DOWN: "+key
);

log(
"keydown "+key
);


/*
    Focus the game window.

    This is the closest ordinary
    web-page JavaScript can get
    to browser-level keyboard input.
*/

if(
gameWindow &&
!gameWindow.closed
){

gameWindow.focus();

}

}


/* =========================
   KEY UP
========================= */

function keyUp(key){

key=
normalizeKey(key);

heldKeys.delete(key);

status(
"KEY UP: "+key
);

log(
"keyup "+key
);

}


/* =========================
   VIRTUAL BUTTONS
========================= */

document
.querySelectorAll(".key")
.forEach(function(button){

const key =
button.dataset.key;


button.addEventListener(
"pointerdown",
function(event){

event.preventDefault();

button.classList.add(
"down"
);

keyDown(key);

}
);


button.addEventListener(
"pointerup",
function(event){

event.preventDefault();

button.classList.remove(
"down"
);

keyUp(key);

}
);


button.addEventListener(
"pointercancel",
function(){

button.classList.remove(
"down"
);

keyUp(key);

}
);


button.addEventListener(
"pointerleave",
function(){

if(
!button.matches(":active")
){

button.classList.remove(
"down"
);

keyUp(key);

}

}
);

});


/* =========================
   PHYSICAL KEYBOARD
========================= */

document.addEventListener(
"keydown",
function(event){

if(
event.ctrlKey ||
event.altKey ||
event.metaKey
){

return;

}


const allowed=[

"w",
"a",
"s",
"d",
"W",
"A",
"S",
"D",
" ",
"ArrowUp",
"ArrowDown",
"ArrowLeft",
"ArrowRight"

];


if(
allowed.includes(event.key)
){

event.preventDefault();

keyDown(
event.key
);

}

});


document.addEventListener(
"keyup",
function(event){

keyUp(
event.key
);

});


/* =========================
   CLEAR HELD KEYS
========================= */

window.addEventListener(
"blur",
function(){

heldKeys.forEach(
function(key){

keyUp(key);

});

});


/* =========================
   PAGE VISIBILITY
========================= */

document.addEventListener(
"visibilitychange",
function(){

if(
document.visibilityState==="visible"
){

status(
"CONTROLLER ACTIVE"
);

}

});


</script>

</body>

</html>
