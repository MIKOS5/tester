<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Obvyris Game Keyboard Test</title>

<style>

*{
box-sizing:border-box;
}

html,body{
margin:0;
width:100%;
height:100%;
background:#080d14;
color:#fff;
font-family:Arial,sans-serif;
overflow:hidden;
}

#app{
width:100%;
height:100%;
display:flex;
flex-direction:column;
}

#header{
height:50px;
background:#111827;
border-bottom:1px solid #253347;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 12px;
flex-shrink:0;
}

#title{
font-weight:bold;
}

#status{
font-size:12px;
color:#6ee7b7;
}

#gameLayer{
position:relative;
flex:1;
min-height:0;
background:#000;
}

#gameWrapper{
position:absolute;
inset:0;
background:#000;
}

#gameFrame{
width:100%;
height:100%;
border:0;
display:block;
}

#keyboard{
display:none;
position:absolute;
left:0;
right:0;
bottom:0;
padding:8px;
background:rgba(17,24,39,.97);
border-top:2px solid #2793ff;
z-index:50;
}

#keyboard.open{
display:block;
}

.row{
display:flex;
justify-content:center;
gap:4px;
margin-bottom:4px;
}

.key{
width:42px;
height:38px;
border:1px solid #34445a;
border-radius:6px;
background:#1b2738;
color:#fff;
font-weight:bold;
font-size:13px;
cursor:pointer;
touch-action:manipulation;
user-select:none;
}

.key:active{
background:#2793ff;
transform:scale(.95);
}

.wide{
width:180px;
}

.control{
width:auto;
padding:0 12px;
}

#bottom{
height:45px;
background:#111827;
border-top:1px solid #253347;
display:flex;
align-items:center;
gap:6px;
padding:6px;
flex-shrink:0;
}

#bottom button{
height:32px;
background:#1b2738;
border:1px solid #34445a;
border-radius:6px;
color:#fff;
padding:0 12px;
font-weight:bold;
cursor:pointer;
}

#bottom button:hover{
background:#2793ff;
}

</style>

</head>

<body>

<div id="app">

<div id="header">

<div id="title">
Keyboard Layer Test
</div>

<div id="status">
READY
</div>

</div>

<div id="gameLayer">

<div id="gameWrapper">

<iframe
id="gameFrame"
src="https://html5.gamemonetize.co/7o8qtn59e5ejushl2s6bp52nbcgiu44x/"
allowfullscreen>
</iframe>

</div>

<div id="keyboard">

<div class="row">

<button class="key" data-key="1">1</button> <button class="key" data-key="2">2</button> <button class="key" data-key="3">3</button> <button class="key" data-key="4">4</button> <button class="key" data-key="5">5</button> <button class="key" data-key="6">6</button> <button class="key" data-key="7">7</button> <button class="key" data-key="8">8</button> <button class="key" data-key="9">9</button> <button class="key" data-key="0">0</button>

</div>

<div class="row">

<button class="key" data-key="q">Q</button> <button class="key" data-key="w">W</button> <button class="key" data-key="e">E</button> <button class="key" data-key="r">R</button> <button class="key" data-key="t">T</button> <button class="key" data-key="y">Y</button> <button class="key" data-key="u">U</button> <button class="key" data-key="i">I</button> <button class="key" data-key="o">O</button> <button class="key" data-key="p">P</button>

</div>

<div class="row">

<button class="key" data-key="a">A</button> <button class="key" data-key="s">S</button> <button class="key" data-key="d">D</button> <button class="key" data-key="f">F</button> <button class="key" data-key="g">G</button> <button class="key" data-key="h">H</button> <button class="key" data-key="j">J</button> <button class="key" data-key="k">K</button> <button class="key" data-key="l">L</button>

</div>

<div class="row">

<button class="key" data-key="z">Z</button> <button class="key" data-key="x">X</button> <button class="key" data-key="c">C</button> <button class="key" data-key="v">V</button> <button class="key" data-key="b">B</button> <button class="key" data-key="n">N</button> <button class="key" data-key="m">M</button>

</div>

<div class="row">

<button class="key wide" data-key=" ">SPACE</button>

<button class="key" data-key="Backspace">⌫</button>

<button class="key" data-key="Enter">ENTER</button>

</div>

<div class="row">

<button class="key" data-key="ArrowLeft">←</button> <button class="key" data-key="ArrowUp">↑</button> <button class="key" data-key="ArrowDown">↓</button> <button class="key" data-key="ArrowRight">→</button>

</div>

</div>

</div>

<div id="bottom">

<button onclick="toggleKeyboard()">
⌨ Keyboard
</button>

<button onclick="focusGame()">
Focus Game
</button>

<button onclick="reloadGame()">
Reload
</button>

</div>

</div>

<script>

const frame =
document.getElementById("gameFrame");

const keyboard =
document.getElementById("keyboard");

const status =
document.getElementById("status");


/* =========================
   KEYBOARD TOGGLE
========================= */

function toggleKeyboard(){

keyboard.classList.toggle("open");

}


/* =========================
   FOCUS GAME
========================= */

function focusGame(){

try{

frame.focus();

frame.contentWindow.focus();

status.textContent="GAME FOCUSED";

}catch(e){

status.textContent="FOCUS FAILED";

}

}


/* =========================
   RELOAD
========================= */

function reloadGame(){

frame.src=frame.src;

status.textContent="GAME RELOADED";

}


/* =========================
   SEND KEY
========================= */

function sendKey(key){

status.textContent="KEY: "+key;


/*
    METHOD 1

    Tell the wrapper/game
    that a key was requested.
*/

try{

frame.contentWindow.postMessage({

type:"gameKeyboard",

action:"keydown",

key:key

},"*");

}catch(e){}


/*
    METHOD 2

    Send a normal keyboard
    event to THIS page.

    This lets us test the
    keyboard layer independently.
*/

const code =
getCode(key);

const event =
new KeyboardEvent(
"keydown",
{
key:key,
code:code,
keyCode:keyCode(key),
which:keyCode(key),
bubbles:true,
cancelable:true
}
);

document.dispatchEvent(event);


/*
    Send keyup shortly after.
*/

setTimeout(function(){

try{

frame.contentWindow.postMessage({

type:"gameKeyboard",

action:"keyup",

key:key

},"*");

}catch(e){}

const upEvent =
new KeyboardEvent(
"keyup",
{
key:key,
code:code,
keyCode:keyCode(key),
which:keyCode(key),
bubbles:true,
cancelable:true
}
);

document.dispatchEvent(upEvent);

},80);

}


/* =========================
   KEY CODES
========================= */

function getCode(key){

if(key===" ") return "Space";

if(key==="ArrowLeft") return "ArrowLeft";
if(key==="ArrowRight") return "ArrowRight";
if(key==="ArrowUp") return "ArrowUp";
if(key==="ArrowDown") return "ArrowDown";

if(key==="Enter") return "Enter";

if(key==="Backspace") return "Backspace";

if(/^[a-z]$/i.test(key)){
return "Key"+key.toUpperCase();
}

if(/^[0-9]$/.test(key)){
return "Digit"+key;
}

return key;

}


function keyCode(key){

const codes={

"ArrowLeft":37,
"ArrowUp":38,
"ArrowRight":39,
"ArrowDown":40,

"Enter":13,
"Backspace":8,
" ":32

};

if(codes[key]){
return codes[key];
}

if(/^[a-z]$/i.test(key)){
return key.toUpperCase().charCodeAt(0);
}

if(/^[0-9]$/.test(key)){
return key.charCodeAt(0);
}

return 0;

}


/* =========================
   VIRTUAL BUTTONS
========================= */

document
.querySelectorAll(".key")
.forEach(function(button){

button.addEventListener(
"pointerdown",
function(event){

event.preventDefault();

const key =
button.dataset.key;

sendKey(key);

}
);

});


/* =========================
   PHYSICAL KEYBOARD
========================= */

document.addEventListener(
"keydown",
function(event){

/*
    Don't intercept browser
    shortcuts unnecessarily.
*/

if(
event.ctrlKey ||
event.altKey ||
event.metaKey
){

return;

}

status.textContent =
"PHYSICAL: "+event.key;


/*
    Forward physical keyboard
    input through the same
    wrapper bridge.
*/

try{

frame.contentWindow.postMessage({

type:"gameKeyboard",

action:"keydown",

key:event.key

},"*");

}catch(e){}

}
);


/* =========================
   MESSAGE MONITOR
========================= */

window.addEventListener(
"message",
function(event){

if(!event.data) return;

if(
event.data.type === "gameKeyboard"
){

status.textContent =
"GAME MESSAGE: "+
event.data.key;

}

}
);


/* =========================
   FRAME LOAD
========================= */

frame.addEventListener(
"load",
function(){

status.textContent="GAME LOADED";

}
);

</script>

</body>
</html>
