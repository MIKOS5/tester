<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>📀 MusicMatch Radio Jukebox</title>

<link href="https://fonts.googleapis.com/css2?family=Tahoma:wght@400;700&display=swap" rel="stylesheet"/>

<style>

:root{
  --bg:#070b12;
  --panel:#0e1624;
  --panel2:#0a111d;
  --border:#263a55;
  --blue:#3aa0ff;
  --text:#e7f0ff;
  --muted:#93a7c2;
}

*{box-sizing:border-box}

body{
  margin:0;
  font-family:Tahoma, sans-serif;
  background:linear-gradient(180deg,#05070c,#0b111c);
  color:var(--text);
  height:100vh;
  display:flex;
  overflow:hidden;
}

/* SIDEBAR */
.sidebar{
  width:330px;
  background:linear-gradient(180deg,var(--panel),var(--panel2));
  border-right:2px solid var(--border);
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.logo{
  text-align:center;
  font-weight:700;
  padding:10px;
  border:1px solid var(--border);
  background:#0b1524;
}
.logo span{color:var(--blue)}

.search{
  padding:10px;
  background:#0b1422;
  border:1px inset var(--border);
  color:white;
  outline:none;
}

button{
  font-size:12px;
  font-weight:700;
  padding:8px 10px;
  border:1px solid #0f2c55;
  background:linear-gradient(180deg,#2e77d3,#1a4f99);
  color:white;
  cursor:pointer;
}
button:active{transform:translateY(1px)}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}

/* PLAYER */
.player{
  margin-top:10px;
  padding:12px;
  background:linear-gradient(180deg,#0a1322,#070d18);
  border:2px inset #223552;
  position:relative;
}

.player::before{
  content:"● MUSICMATCH RADIO";
  position:absolute;
  top:-10px;
  left:10px;
  font-size:10px;
  color:#3cff8f;
  background:#070d18;
  padding:2px 6px;
  border:1px solid #1c2f4a;
}

#ledStatus{
  font-size:11px;
  font-weight:700;
  color:#ffcc66;
  margin-bottom:6px;
}

#npName{
  background:#050a12;
  border:1px inset #1d2d45;
  padding:10px;
  font-weight:700;
  font-size:13px;
  color:#6ec0ff;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

#npMeta{
  margin-top:6px;
  font-size:11px;
  color:var(--muted);
}

/* VISUAL AREA */
.visual-wrap{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:10px 0;
  gap:10px;
}

/* CD */
.cd{
  width:52px;
  height:52px;
  border-radius:50%;
  background:radial-gradient(circle,#111 10%,#333 25%,#111 45%,#000 100%);
  border:2px solid #2b3f5f;
}

.cd.playing{
  animation:spin 2.5s linear infinite;
}

@keyframes spin{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}

/* EQ */
.eq{
  display:flex;
  align-items:flex-end;
  height:40px;
  gap:3px;
  width:100%;
  background:#050a12;
  border:1px inset #22324a;
  padding:0 5px;
}

.bar{
  width:4px;
  background:#3aa0ff;
  height:6px;
  animation:eq 1s infinite ease-in-out;
}

.bar:nth-child(2){animation-delay:.1s}
.bar:nth-child(3){animation-delay:.2s}
.bar:nth-child(4){animation-delay:.3s}
.bar:nth-child(5){animation-delay:.4s}
.bar:nth-child(6){animation-delay:.5s}
.bar:nth-child(7){animation-delay:.6s}
.bar:nth-child(8){animation-delay:.7s}

@keyframes eq{
  0%{height:6px;opacity:.4}
  50%{height:32px;opacity:1}
  100%{height:10px;opacity:.6}
}

.eq.paused .bar{
  animation-play-state:paused;
  opacity:.3;
}

/* CONTROLS */
.controls{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:6px;
  margin-top:10px;
}

.controls button{
  padding:10px 0;
}

/* MAIN */
.main{
  flex:1;
  padding:12px;
  overflow:auto;
}

.topbar{
  display:flex;
  justify-content:space-between;
  padding:10px;
  background:#0b1524;
  border:1px solid var(--border);
}

.table{
  margin-top:10px;
  border:2px inset #223552;
}

table{
  width:100%;
  border-collapse:collapse;
}

th{
  font-size:11px;
  text-align:left;
  padding:10px;
  background:#0c1a2c;
  color:#7fbaff;
}

td{
  padding:10px;
  font-size:12px;
  border-bottom:1px solid #1a2a40;
}

tr:hover{background:#101c2e}

</style>
</head>

<body>

<div class="sidebar">

  <div class="logo">📀 MUSICMATCH <span>RADIO</span></div>

  <input id="genre" class="search" placeholder="Search station"/>

  <button onclick="applyFilter()">SEARCH</button>

  <div class="grid">
    <button onclick="prevPage()">Prev</button>
    <button onclick="nextPage()">Next</button>
    <button onclick="loadStations()">Refresh</button>
    <button onclick="loadFavorites()">Favs</button>
  </div>

  <!-- PLAYER -->
  <div class="player">

    <div id="ledStatus">STOPPED</div>

    <div id="npName">▶ NO STATION SELECTED</div>
    <div id="npMeta">Ready</div>

    <div class="visual-wrap">
      <div class="cd" id="cdDisc"></div>

      <div class="eq">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div>
      </div>
    </div>

    <audio id="player" controls></audio>

    <div class="controls">
      <button onclick="prevStation()">⏮</button>
      <button onclick="togglePlay()">▶/⏸</button>
      <button onclick="nextStation()">⏭</button>
      <button onclick="toggleFavCurrent()">★</button>
    </div>

  </div>

</div>

<div class="main">

  <div class="topbar">
    <div>RADIO LIBRARY</div>
    <div id="pageInfo"></div>
  </div>

  <div class="table">
    <table>
      <thead>
        <tr>
          <th>Station</th>
          <th>Genre</th>
          <th>Play</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

</div>

<script>

const API="https://all.api.radio-browser.info/json/stations/search";

let allStations=[],currentList=[];
let favorites=[],favoriteIds=new Set();
let currentIndex=-1;
let isPlaying=false;

function setLed(t,color="#ffcc66"){
  const el=document.getElementById("ledStatus");
  el.innerText=t;
  el.style.color=color;
}

function startVisuals(){
  document.getElementById("cdDisc").classList.add("playing");
  document.querySelector(".eq").classList.remove("paused");
  setLed("PLAYING","#3cff8f");
}

function stopVisuals(){
  document.getElementById("cdDisc").classList.remove("playing");
  document.querySelector(".eq").classList.add("paused");
  setLed("STOPPED","#ff6666");
}

/* LOAD */
async function loadStations(){
  const res=await fetch(`${API}?countrycode=US&limit=50&hidebroken=true`);
  const data=await res.json();
  allStations=data;
  currentList=data;
  render();
}

function playStation(id){
  const item=currentList.find(s=>s.stationuuid===id);
  if(!item)return;

  currentIndex=currentList.findIndex(s=>s.stationuuid===id);

  const p=document.getElementById("player");
  p.src=item.url_resolved||item.url;
  p.play();

  isPlaying=true;

  document.getElementById("npName").innerText=item.name;
  document.getElementById("npMeta").innerText=item.tags||"Radio";

  startVisuals();
}

function togglePlay(){
  const p=document.getElementById("player");
  if(!p.src)return;

  if(isPlaying){
    p.pause();
    isPlaying=false;
    stopVisuals();
  }else{
    p.play();
    isPlaying=true;
    startVisuals();
  }
}

function nextStation(){
  currentIndex=(currentIndex+1)%currentList.length;
  playStation(currentList[currentIndex].stationuuid);
}

function prevStation(){
  currentIndex=(currentIndex-1+currentList.length)%currentList.length;
  playStation(currentList[currentIndex].stationuuid);
}

function render(){
  const tbody=document.querySelector("tbody");
  tbody.innerHTML="";

  currentList.forEach(s=>{
    tbody.innerHTML+=`
      <tr>
        <td>${s.name}</td>
        <td>${s.tags||""}</td>
        <td><button onclick="playStation('${s.stationuuid}')">PLAY</button></td>
      </tr>
    `;
  });

  document.getElementById("pageInfo").innerText="Stations: "+currentList.length;
}

loadStations();

</script>

</body>
</html>
