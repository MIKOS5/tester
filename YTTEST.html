<!DOCTYPE html>
<html>
<head>

<title>Video Obvyris Music</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<style>

body{
    margin:0;
    background:#080808;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}


header{

background:#111;
padding:20px;
font-size:28px;
font-weight:bold;
letter-spacing:2px;

}


.controls{

padding:15px;
background:#151515;
display:flex;
gap:10px;
flex-wrap:wrap;

}


input,button{

padding:12px;
border-radius:6px;
border:none;

}


input{

width:300px;

}


button{

background:#e50914;
color:white;
cursor:pointer;

}


.main{

display:flex;
flex-direction:column;
}


.player{

background:#000;
padding:20px;
text-align:center;

}


iframe{

width:90%;
height:500px;
border:none;

}



.info{

padding:20px;
background:#111;

}


.grid{

display:grid;
grid-template-columns:
repeat(auto-fill,minmax(260px,1fr));

gap:20px;
padding:20px;

}



.card{

background:#151515;
border-radius:10px;
overflow:hidden;
cursor:pointer;
transition:.2s;

}


.card:hover{

transform:scale(1.03);

}


.card img{

width:100%;
height:150px;
object-fit:cover;

}


.card h3{

margin:10px;
font-size:18px;

}


.card p{

margin:8px;
color:#aaa;
font-size:13px;

}


.badge{

display:inline-block;
background:#e50914;
padding:5px 8px;
border-radius:5px;
font-size:12px;

}


</style>

</head>


<body>


<header>

🎵 Video Obvyris Music

</header>



<div class="controls">

<input 
id="search"
placeholder="Search artist or song..."
>


<button onclick="loadVideos()">
Refresh
</button>


<button onclick="searchVideos()">
Search
</button>


</div>



<div class="player">


<iframe
id="player"
allowfullscreen>
</iframe>


</div>



<div class="info">

<h2 id="title">
Select a music video
</h2>

<p id="details"></p>

<p id="description"></p>

</div>



<div class="grid" id="videos">

</div>





<script>


const API_URL = 
"https://script.google.com/macros/s/AKfycbwA1FraODA7b2LLXhJfDzvdbK9TfNtSFVqcKQl67P0WjFg4ysOIGHGyq9JyeSN9axy2/exec";



let library=[];



async function loadVideos(){


let res =
await fetch(
API_URL+
"?action=all&limit=500"
);


let data =
await res.json();


library =
data.videos;


displayVideos(
library
);


}



function searchVideos(){


let q =
document
.getElementById("search")
.value
.toLowerCase();



let results =
library.filter(v=>{


return (

String(v.Artist)
.toLowerCase()
.includes(q)

||

String(v.Title)
.toLowerCase()
.includes(q)

||

String(v.Channel)
.toLowerCase()
.includes(q)

);


});



displayVideos(results);


}




function displayVideos(list){


let box =
document
.getElementById("videos");


box.innerHTML="";



list.forEach(v=>{


let card =
document.createElement("div");


card.className="card";



card.onclick=()=>playVideo(v);



card.innerHTML=`

<img src="${v.Thumbnail}">


<h3>
${v.Title}
</h3>


<p>
<span class="badge">
${v.Artist}
</span>
</p>


<p>
Channel:
${v.Channel}
</p>


<p>
Views:
${Number(v.Views).toLocaleString()}
</p>


<p>
Duration:
${v.Duration}
</p>


<p>
Published:
${new Date(v.Published).getFullYear()}
</p>


`;



box.appendChild(card);



});


}





function playVideo(v){


let id =
v["Video ID"];



document
.getElementById("player")
.src =
"https://www.youtube.com/embed/"
+
id
+
"?autoplay=1";



document
.getElementById("title")
.innerHTML =
v.Title;



document
.getElementById("details")
.innerHTML =

`
<b>${v.Artist}</b><br>

${v.Channel}<br>

Views:
${Number(v.Views).toLocaleString()}
<br>

Likes:
${Number(v.Likes).toLocaleString()}
<br>

Duration:
${v.Duration}

`;



document
.getElementById("description")
.innerHTML =
v.Description || "";



window.scrollTo(
{
top:0,
behavior:"smooth"
}
);


}





loadVideos();


</script>


</body>
</html>
