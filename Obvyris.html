<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Radio Obvyris</title>

<style>
:root{
  --bg:#0b1220;
  --panel:#111827;
  --line:#253347;
  --text:#ffffff;
  --muted:#93a4bb;
  --accent:#2793ff;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100vh;
  display:flex;
  overflow:hidden;
}

/* SIDEBAR */
.sidebar{
  width:220px;
  background:var(--panel);
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column;
  padding:12px;
  overflow:auto;
}

.brand{
  font-size:20px;
  font-weight:800;
  padding:10px;
  text-align:center;
  margin-bottom:10px;
  border-bottom:1px solid var(--line);
}

.nav{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.nav a{
  text-decoration:none;
  color:var(--text);
  background:#1b2436;
  padding:10px;
  border-radius:10px;
  font-weight:600;
  transition:.2s;
}

.nav a:hover{
  background:var(--accent);
  transform:translateX(4px);
}

/* MAIN */
.main{
  flex:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* HEADER */
header{
  height:55px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--panel);
  border-bottom:1px solid var(--line);
  font-weight:700;
  letter-spacing:1px;
}

/* IFRAME */
iframe{
  flex:1;
  border:none;
  width:100%;
  background:white;
}

/* PLAYER BAR */
.player-bar{
  height:90px;
  background:var(--panel);
  border-top:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:10px;
}

/* PLAYER */
#player{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  width:100%;
}

#player button{
  padding:10px 14px;
  border:none;
  border-radius:10px;
  background:var(--accent);
  color:white;
  font-weight:700;
  cursor:pointer;
}

#npName{
  font-weight:700;
}

#npMeta{
  font-size:12px;
  opacity:.7;
}

.controls{
  display:flex;
  gap:10px;
  margin-top:10px;
}
</style>

</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

  <div class="brand">Radio Obvyris</div>

  <div class="nav">
    <a href="stations.html" target="contentFrame">📻 Stations</a>
    <a href="stations.html" target="contentFrame">⭐ Favorites</a>
    <a href="stations.html" target="contentFrame">🎤 Artists</a>
    <a href="stations.html" target="contentFrame">☁ Mood</a>
    <a href="stations.html" target="contentFrame">📻 Misc</a>
    <a href="stations.html" target="contentFrame">🌎 International</a>
    <a href="stations.html" target="contentFrame">💬 Chat</a>
  </div>

</div>

<!-- MAIN -->
<div class="main">

  <header>RADIO OBVYRIS</header>

  <!-- APP -->
  <iframe name="contentFrame" src="stations.html"></iframe>

  <!-- PLAYER (OWNED BY INDEX) -->
  <div class="player-bar">

    <div id="player">

      <div id="npName">Not Playing</div>
      <div id="npMeta">Select a station</div>

      <audio id="audio"></audio>

      <div class="controls">
        <button onclick="prev()">⏮</button>
        <button onclick="toggle()">▶ / ⏸</button>
        <button onclick="next()">⏭</button>
      </div>

    </div>

  </div>

</div>

<script>
/* =========================
   PLAYER STATE (INDEX OWNS THIS)
========================= */

let current = [];
let filtered = [];
let index = 0;

/* RECEIVE LIST FROM IFRAME */
function setStationList(list){
  current = list || [];
  filtered = list || [];
}

/* PLAY */
function playFiltered(i){

  const list = filtered.length ? filtered : current;
  const s = list[i];
  if(!s) return;

  index = i;

  const audio = document.getElementById("audio");

  audio.src = s.url_resolved || s.url;
  audio.play();

  document.getElementById("npName").innerText = s.name;
  document.getElementById("npMeta").innerText =
    `${s.genre || ""} • ${s.country || ""}`;
}

/* CONTROLS */
function toggle(){
  const audio = document.getElementById("audio");
  audio.paused ? audio.play() : audio.pause();
}

function next(){
  const list = filtered.length ? filtered : current;
  index = (index + 1) % list.length;
  playFiltered(index);
}

function prev(){
  const list = filtered.length ? filtered : current;
  index = (index - 1 + list.length) % list.length;
  playFiltered(index);
}
</script>

</body>
</html>
