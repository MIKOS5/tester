<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Radio Obvyris</title>

<style>
:root{
  --bg:#0b1220;
  --panel:#111827;
  --line:#253347;
  --text:#ffffff;
  --muted:#93a4bb;
  --accent:#2793ff;
}

/* RESET */
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial, sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100vh;
  display:flex;
  overflow:hidden;
}

/* SIDEBAR */
.sidebar{
  width:220px;
  background:var(--panel);
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column;
  padding:12px;
  overflow:auto;
}

.brand{
  font-size:20px;
  font-weight:800;
  padding:10px;
  text-align:center;
  margin-bottom:10px;
  border-bottom:1px solid var(--line);
}

.nav{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.nav a{
  text-decoration:none;
  color:var(--text);
  background:#1b2436;
  padding:10px;
  border-radius:10px;
  font-weight:600;
  transition:.2s;
}

.nav a:hover{
  background:var(--accent);
  transform:translateX(4px);
}

/* MAIN AREA */
.main{
  flex:1;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

/* HEADER */
header{
  height:55px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--panel);
  border-bottom:1px solid var(--line);
  font-weight:700;
  letter-spacing:1px;
}

#player {
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  width:100%;
}

#player button{
  padding:10px 14px;
  border:none;
  border-radius:10px;
  background:var(--accent);
  color:white;
  font-weight:700;
  cursor:pointer;
}
  
/* IFRAME */
iframe{
  flex:1;
  border:none;
  width:100%;
  background:white;
}

/* PLAYER BAR (PLACEHOLDER FOR NOW) */
.player-bar{
  height:90px;
  background:var(--panel);
  border-top:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:10px;
}

/* FUTURE PLAYER CONTENT AREA */
.player-placeholder{
  color:var(--muted);
  font-size:14px;
  text-align:center;
}
</style>

</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

  <div class="brand">
    Radio Obvyris
  </div>

  <div class="nav">
    <a href="stations.html" target="contentFrame">📻 Stations</a>

    <!-- reserved for future pages (optional) -->
    <a href="stations.html" target="contentFrame">⭐ Favorites (same page for now)</a>
    <a href="stations.html" target="contentFrame">🎤 Artists</a>
    <a href="stations.html" target="contentFrame">☁ Mood</a>
    <a href="stations.html" target="contentFrame">📻 Misc</a>
    <a href="stations.html" target="contentFrame">🌎 International</a>
    <a href="stations.html" target="contentFrame">💬 Chat</a>
  </div>

</div>

<!-- MAIN -->
<div class="main">

  <header>
    RADIO OBVYRIS
  </header>

  <!-- APP CONTENT -->
  <iframe name="contentFrame" src="stations.html"></iframe>

  <!-- PLAYER AREA (DO NOT MOVE LOGIC YET) -->
  <div class="player-bar">
    <div class="player-placeholder">
      <div id="player">
  <div id="npName" style="font-weight:700;">Not Playing</div>
  <div id="npMeta" style="font-size:12px; opacity:.7;">Select a station</div>

  <audio id="audio"></audio>

  <div style="display:flex; gap:10px; margin-top:10px;">
    <button onclick="parent.prev()">⏮</button>
    <button onclick="parent.toggle()">▶ / ⏸</button>
    <button onclick="parent.next()">⏭</button>
    <button onclick="parent.toggleTheme()">🌙</button>
  </div>
</div>
    </div>
  </div>

</div>

</body>
</html>
