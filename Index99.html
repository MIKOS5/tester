<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Outline Home</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2793ff">

<link rel="apple-touch-icon" href="https://mikos5.github.io/tester/navicon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet"/>

<style>

:root{
  --bg:#09111d;
  --panel:#111827;
  --border:#253347;
  --blue:#2793ff;
  --blue-dark:#1869d9;
  --text:#ffffff;
  --muted:#93a4bb;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Inter, sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* HEADER */
header{
  text-align:center;
  padding:30px 20px 10px;
}

.logo{
  width:90px;
  height:90px;
  border-radius:18px;
  box-shadow:0 0 25px rgba(39,147,255,.35);
}

.title{
  font-family:Orbitron, sans-serif;
  font-size:34px;
  font-weight:900;
  margin-top:10px;
  letter-spacing:2px;
}

.title span{
  color:var(--blue);
}

.subtitle{
  color:var(--muted);
  font-size:13px;
  margin-top:5px;
}

/* MAIN GRID */
.container{
  max-width:900px;
  margin:0 auto;
  padding:20px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:16px;
}

/* CARDS */
.card{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:16px;
  padding:18px;
  cursor:pointer;
  transition:.2s;
  text-align:left;
}

.card:hover{
  transform:translateY(-3px);
  border-color:var(--blue);
  box-shadow:0 10px 25px rgba(0,0,0,.35);
}

.card h2{
  margin:0;
  font-size:20px;
}

.card p{
  margin:8px 0 0;
  font-size:12px;
  color:var(--muted);
}

.icon{
  font-size:28px;
  margin-bottom:10px;
}

/* FOOTER */
footer{
  text-align:center;
  padding:20px;
  color:var(--muted);
  font-size:12px;
}

button{
  margin-top:12px;
  width:100%;
  padding:10px;
  border:none;
  border-radius:10px;
  background:linear-gradient(180deg,var(--blue),var(--blue-dark));
  color:white;
  font-weight:700;
  cursor:pointer;
}

</style>
</head>

<body>

<header>
  <img class="logo" src="https://mikos5.github.io/tester/navicon.png" alt="Obvyris Logo">

  <div class="title">Obvyris <span>Hub</span></div>
  <div class="subtitle">Your live media dashboard</div>
</header>

<div class="container">

  <!-- VIDEO -->
  <div class="card" onclick="openApp('video')">
    <div class="icon">📺</div>
    <h2>Video</h2>
    <p>Live IPTV channels & streaming</p>
    <button>Open Video</button>
  </div>

  <!-- RADIO -->
  <div class="card" onclick="openApp('radio')">
    <div class="icon">📻</div>
    <h2>Radio</h2>
    <p>Stations, genres & favorites</p>
    <button>Open Radio</button>
  </div>

  <!-- OPTIONAL FUTURE SLOT -->
  <div class="card" onclick="openApp('chat')">
    <div class="icon">💬</div>
    <h2>Chat</h2>
    <p>Live community chat (coming soon)</p>
    <button>Open Chat</button>
  </div>

</div>

<footer>
  Obvyris Hub • Dark Media System
</footer>



<script>
function openApp(app){

  if(app === "video"){
    window.location.href = "Video_Obvyris.html";
  }
  else if(app === "radio"){
    window.location.href = "Radio_Obvyris.html";
  }
  else if(app === "chat"){
    window.location.href = "Home_Obvyris.html";
  }

}
</script>
  

<script>
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js")
    .then(() => console.log("Service Worker Registered"));
}
</script>
</body>
</html>
