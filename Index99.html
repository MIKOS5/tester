<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Obvyris Hub</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  height: 100vh;
  display: flex;
  overflow: hidden;
}

/* SIDEBAR */
.sidebar {
  width: 220px;
  background: #111827;
  color: white;
  display: flex;
  flex-direction: column;
  padding: 15px;
  border-right: 1px solid #253347;
}

.sidebar h2 {
  margin: 0 0 15px 0;
  font-size: 18px;
}

.btn {
  padding: 10px;
  margin-bottom: 10px;
  background: linear-gradient(180deg, #2793ff, #1869d9);
  border-radius: 10px;
  cursor: pointer;
  font-weight: bold;
  text-align: center;
  color: white;
  user-select: none;
  transition: 0.15s;
}

.btn:hover {
  filter: brightness(1.1);
  transform: translateX(3px);
}

/* MAIN */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
}

header {
  background: #111827;
  color: white;
  padding: 12px;
  border-bottom: 1px solid #253347;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header h1 {
  font-size: 16px;
  margin: 0;
}

iframe {
  flex: 1;
  border: none;
  width: 100%;
  background: #000;
}

/* MOBILE */
@media (max-width: 800px) {
  body {
    flex-direction: column;
  }

  .sidebar {
    width: 100%;
    flex-direction: row;
    overflow-x: auto;
  }

  .btn {
    flex: 1;
    margin-right: 10px;
    white-space: nowrap;
  }
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
  <h2>🚀 Obvyris</h2>

  <div class="btn" onclick="go('Home_Obvyris.html')">🏠 Home</div>
  <div class="btn" onclick="go('Video_Obvyris.html')">📺 Video</div>
  <div class="btn" onclick="go('Radio_Obvyris.html')">📻 Radio</div>
</div>

<!-- MAIN -->
<div class="main">

  <header>
    <h1 id="title">Home</h1>
    <div>Index99 Launcher</div>
  </header>

  <iframe id="frame" src="Home.html"></iframe>

</div>

<script>

const frame = document.getElementById("frame");
const title = document.getElementById("title");

function go(page){

  frame.src = page;

  if(page.includes("Home")) title.innerText = "Home";
  if(page.includes("Video")) title.innerText = "Video Obvyris";
  if(page.includes("Radio")) title.innerText = "Radio Obvyris";
}

/* optional: deep link support */
const params = new URLSearchParams(window.location.search);
const app = params.get("app");

if(app === "video") go("Video_Obvyris.html");
if(app === "radio") go("Radio_Obvyris.html");

</script>

</body>
</html>
