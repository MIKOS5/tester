<script>

let items=[];


async function loadArchive(){


let url =
"https://archive.org/advancedsearch.php?q=mediatype:audio&fl[]=identifier,title,description,collection,creator,date&rows=50&output=json";


try{


let res = await fetch(url);


let data = await res.json();


items = data.response.docs.map(x=>{


return {

title:x.title || "",

description:x.description || "",

collection:Array.isArray(x.collection)
? x.collection.join(", ")
: x.collection || "",

creator:x.creator || "",

date:x.date || "",

link:
"https://archive.org/details/"+x.identifier,

audio:
"https://archive.org/download/"+x.identifier+"/"

};


});


display(items);



}
catch(e){

console.log(e);

document.getElementById("count").innerHTML =
"LOAD ERROR";

}



}



function searchArchive(){


let q =
document
.getElementById("search")
.value
.toLowerCase();


let collection =
document
.getElementById("collection")
.value;



let result =
items.filter(x=>{


let text =
(
x.title+
x.description+
x.creator+
x.collection
)
.toLowerCase();



return text.includes(q);



});


display(result);



}




function display(data){


document.getElementById("count").innerHTML =
data.length+" Results";


let box =
document.getElementById("results");


box.innerHTML="";



data.forEach(x=>{


box.innerHTML += `


<div class="card">


<div class="info">


<div class="title">
${x.title}
</div>


<div>
Artist:
${x.creator}
</div>


<div>
Collection:
${x.collection}
</div>


<div>
Date:
${x.date}
</div>


<br>


<a href="${x.link}" target="_blank">
Open Archive
</a>


</div>


</div>


`;


});


}



loadArchive();


</script>
