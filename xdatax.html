<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Archive Audio Search Engine</title>

<style>

body{
    background:#09111d;
    color:white;
    font-family:Arial, sans-serif;
    padding:20px;
}

h1{
    color:#2793ff;
}

.searchbox{
    background:#111c2d;
    padding:20px;
    border-radius:12px;
}

input,select,button{
    padding:12px;
    margin:5px;
    border-radius:8px;
    border:none;
}

input{
    width:60%;
}

button{
    background:#2793ff;
    color:white;
    cursor:pointer;
}


.card{

    background:#142235;
    margin:15px 0;
    padding:15px;
    border-radius:12px;

    display:flex;
    gap:15px;

}


.card img{

width:120px;
height:120px;
object-fit:cover;
border-radius:10px;

}


.info{

flex:1;

}


.title{

font-size:20px;
font-weight:bold;
color:#4db1ff;

}


.small{

font-size:13px;
color:#aaa;

}


audio{

width:100%;

}


a{

color:#70c5ff;

}



</style>

</head>


<body>


<h1>📻 Archive.org Media Search Engine</h1>


<div class="searchbox">


<input id="search"
placeholder="Search title, artist, keyword, collection...">


<select id="type">

<option value="">All Media</option>
<option value="audio">Audio</option>
<option value="video">Video</option>

</select>


<select id="collection">

<option value="">All Collections</option>

</select>


<button onclick="searchArchive()">
Search
</button>


</div>


<h2 id="count">
Loading...
</h2>


<div id="results"></div>



<script>


const RSS =
"https://archive.org/services/collection-rss.php?mediatype=audio";


let items=[];



async function loadRSS(){


try{


let response =
await fetch(
"https://api.allorigins.win/raw?url="+
encodeURIComponent(RSS)
);


let text =
await response.text();


let xml =
new DOMParser()
.parseFromString(text,"text/xml");


let entries =
xml.querySelectorAll("item");


entries.forEach(item=>{


let description =
item.querySelector("description")?.textContent || "";


let media =
item.querySelector("media\\:content,enclosure");


let img =
description.match(/src="([^"]+)/);


let category =
item.querySelector("category")?.textContent || "";


let keywords =
item.querySelector("media\\:keywords")?.textContent || "";


let link =
item.querySelector("link")?.textContent || "";


let title =
item.querySelector("title")?.textContent || "";


let pub =
item.querySelector("pubDate")?.textContent || "";



items.push({

title:title,

description:description,

category:category,

keywords:keywords,

link:link,

date:pub,

url:media?.getAttribute("url") || "",

img:img ? img[1] : 
"https://archive.org/images/glogo.png"


});


});



buildCollections();

display(items);


}
catch(e){

document.getElementById("count").innerHTML=
"RSS Load Error";

console.log(e);

}


}



function buildCollections(){


let select =
document.getElementById("collection");


let cats =
[...new Set(
items.map(x=>x.category)
)];


cats.forEach(c=>{


let option =
document.createElement("option");

option.value=c;

option.textContent=c;


select.appendChild(option);


});


}





function searchArchive(){


let q =
document
.getElementById("search")
.value
.toLowerCase();


let type =
document
.getElementById("type")
.value;


let collection =
document
.getElementById("collection")
.value;



let filtered =
items.filter(x=>{


let text =
(
x.title+
x.description+
x.keywords+
x.category+
x.link
)
.toLowerCase();



let match =
text.includes(q);



let mediaMatch=true;


if(type=="audio")
mediaMatch =
x.url.includes(".mp3");


if(type=="video")
mediaMatch =
x.url.includes("MPEG4") ||
x.url.includes(".mp4");



let collectionMatch=true;


if(collection)
collectionMatch =
x.category==collection;



return match &&
mediaMatch &&
collectionMatch;


});



display(filtered);


}







function display(data){


document.getElementById("count").innerHTML=
data.length+" Results";


let box =
document.getElementById("results");


box.innerHTML="";



data.forEach(x=>{


box.innerHTML += `


<div class="card">


<img src="${x.img}">


<div class="info">


<div class="title">
${x.title}
</div>


<div class="small">
${x.category}
</div>


<div class="small">
${x.date}
</div>


<p>
${x.keywords}
</p>


<a href="${x.link}" target="_blank">
Open Archive Page
</a>


<br><br>


<audio controls preload="none">

<source src="${x.url}" type="audio/mpeg">

</audio>


</div>


</div>


`;



});


}



loadRSS();


</script>


</body>
</html>
