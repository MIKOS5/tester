<script>
const RSS_BASE =
    "https://archive.org/services/collection-rss.php?mediatype=";

let currentMedia = "audio";
let archiveData = [];
let filteredData = [];
let currentItem = null;

/* ===========================
   INIT
=========================== */

window.addEventListener("DOMContentLoaded",()=>{

    initCategories();

    document.getElementById("searchBox")
        .addEventListener("input",filterResults);

    document.getElementById("sortBox")
        .addEventListener("change",filterResults);

    loadRSS(currentMedia);

});

/* ===========================
   CATEGORY BUTTONS
=========================== */

function initCategories(){

    document.querySelectorAll(".cat").forEach(btn=>{

        btn.onclick=()=>{

            document.querySelectorAll(".cat")
                .forEach(c=>c.classList.remove("active"));

            btn.classList.add("active");

            currentMedia = btn.dataset.type;

            document.getElementById("mediaTypeLabel")
                .textContent = btn.textContent.trim();

            loadRSS(currentMedia);

        };

    });

}

/* ===========================
   LOAD RSS
=========================== */

async function loadRSS(media){

    document.getElementById("results").innerHTML =
        "<div style='padding:20px;'>Loading Archive...</div>";

    try{

        const response = await fetch(
            RSS_BASE + encodeURIComponent(media)
        );

        const xml = await response.text();

        parseRSS(xml);

    }

    catch(err){

        console.error(err);

        document.getElementById("results").innerHTML=
        "<div style='padding:20px;'>Unable to load Archive RSS.</div>";

    }

}

/* ===========================
   PARSE RSS
=========================== */

function parseRSS(xml){

    const parser = new DOMParser();

    const doc = parser.parseFromString(xml,"text/xml");

    const items = [...doc.querySelectorAll("item")];

    archiveData=[];

    items.forEach(item=>{

        archiveData.push({

            title:
                getNode(item,"title"),

            description:
                stripHTML(getNode(item,"description")),

            creator:
                getNode(item,"creator") ||
                getNode(item,"author") ||
                "Unknown",

            pubDate:
                getNode(item,"pubDate"),

            link:
                getNode(item,"link"),

            category:
                getNode(item,"category"),

            guid:
                getNode(item,"guid"),

            enclosure:
                item.querySelector("enclosure")?.getAttribute("url") || ""

        });

    });

    document.getElementById("recordCount").textContent =
        archiveData.length;

    buildTicker();

    filterResults();

}

/* ===========================
   FILTER
=========================== */

function filterResults(){

    const q =
        document.getElementById("searchBox")
        .value
        .toLowerCase();

    filteredData = archiveData.filter(item=>{

        return (

            item.title.toLowerCase().includes(q)

            ||

            item.description.toLowerCase().includes(q)

            ||

            item.creator.toLowerCase().includes(q)

            ||

            item.category.toLowerCase().includes(q)

        );

    });

    sortResults();

}

/* ===========================
   SORT
=========================== */

function sortResults(){

    const mode =
        document.getElementById("sortBox").value;

    if(mode==="title"){

        filteredData.sort((a,b)=>
            a.title.localeCompare(b.title));

    }

    if(mode==="newest"){

        filteredData.sort((a,b)=>
            new Date(b.pubDate)-new Date(a.pubDate));

    }

    if(mode==="oldest"){

        filteredData.sort((a,b)=>
            new Date(a.pubDate)-new Date(b.pubDate));

    }

    renderCards();

}

/* ===========================
   CARDS
=========================== */

function renderCards(){

    document.getElementById("filteredCount").textContent =
        filteredData.length;

    const html = filteredData.map(item=>`

<div class="card" onclick="openItem('${escapeQuotes(item.guid)}')">

<div class="cardTitle">

${item.title}

</div>

<div class="cardMeta">

👤 ${item.creator}

</div>

<div class="cardDesc">

${truncate(item.description,220)}

</div>

<div class="tags">

<div class="tag">

${currentMedia}

</div>

<div class="tag">

${formatDate(item.pubDate)}

</div>

</div>

<button class="openBtn">

Open Details

</button>

</div>

`).join("");

    document.getElementById("results").innerHTML =

        html ||

        "<div style='padding:25px;'>No results found.</div>";

}

/* ===========================
   POPUP
=========================== */

function openItem(guid){

    currentItem =
        archiveData.find(a=>a.guid===guid);

    if(!currentItem) return;

    popupTitle.textContent =
        currentItem.title;

    popupDescription.textContent =
        currentItem.description || "-";

    popupCreator.textContent =
        currentItem.creator;

    popupDate.textContent =
        formatDate(currentItem.pubDate);

    popupMedia.textContent =
        currentMedia;

    popupLink.innerHTML =
        `<a href="${currentItem.link}"
            target="_blank">
            ${currentItem.link}
        </a>`;

    openArchiveBtn.onclick=()=>{

        window.open(currentItem.link,"_blank");

    };

    downloadBtn.onclick=()=>{

        if(currentItem.enclosure){

            window.open(
                currentItem.enclosure,
                "_blank"
            );

        }
        else{

            window.open(
                currentItem.link,
                "_blank"
            );

        }

    };

    popup.classList.remove("hidden");

}

function closePopup(){

    popup.classList.add("hidden");

}

/* ===========================
   TICKER
=========================== */

function buildTicker(){

    let html="";

    archiveData.slice(0,25).forEach(item=>{

        html+=`

<span class="tick">

📦 ${item.title}

</span>

`;

    });

    ticker.innerHTML = html + html;

}

/* ===========================
   RANDOM
=========================== */

function randomItem(){

    if(!archiveData.length) return;

    const item =
        archiveData[
            Math.floor(
                Math.random()*archiveData.length
            )
        ];

    openItem(item.guid);

}

/* ===========================
   REFRESH
=========================== */

function refreshArchive(){

    loadRSS(currentMedia);

}

/* ===========================
   CLEAR
=========================== */

function clearSearch(){

    searchBox.value="";

    filterResults();

}

/* ===========================
   THEME
=========================== */

function toggleTheme(){

    document.body.classList.toggle("light");

}

/* ===========================
   HELPERS
=========================== */

function getNode(parent,name){

    return parent.querySelector(name)?.textContent.trim() || "";

}

function truncate(text,len){

    if(text.length<=len) return text;

    return text.substring(0,len)+"...";

}

function stripHTML(html){

    const div=document.createElement("div");

    div.innerHTML=html;

    return div.textContent || div.innerText || "";

}

function formatDate(date){

    if(!date) return "";

    return new Date(date)
        .toLocaleDateString();

}

function escapeQuotes(str){

    return String(str)
        .replace(/'/g,"\\'");

}

/************************************************
 INTERNET ARCHIVE DATABASE ENGINE
************************************************/

// Uses the Archive Advanced Search API instead
// of RSS. Much faster and searches the database.

const SEARCH_API =
"https://archive.org/advancedsearch.php";

/************************************************
 SETTINGS
************************************************/

const ROWS = 100;

let page = 1;

/************************************************
 SEARCH
************************************************/

async function loadRSS(media){

    currentMedia = media;

    document.getElementById("results").innerHTML =
        "<div style='padding:30px;font-size:18px;'>Loading Archive Database...</div>";

    try{

        const query =
            `(mediatype:${media})`;

        const url =
            SEARCH_API +
            "?q=" + encodeURIComponent(query) +

            "&fl[]=identifier" +
            "&fl[]=title" +
            "&fl[]=creator" +
            "&fl[]=description" +
            "&fl[]=mediatype" +
            "&fl[]=publicdate" +
            "&fl[]=downloads" +
            "&fl[]=subject" +

            "&rows=" + ROWS +

            "&page=" + page +

            "&sort[]=downloads desc" +

            "&output=json";

        const res = await fetch(url);

        const json = await res.json();

        archiveData = [];

        json.response.docs.forEach(doc=>{

            archiveData.push({

                guid:
                    doc.identifier,

                identifier:
                    doc.identifier,

                title:
                    doc.title || "Untitled",

                creator:
                    Array.isArray(doc.creator)
                        ? doc.creator.join(", ")
                        : (doc.creator || "Unknown"),

                description:
                    Array.isArray(doc.description)
                        ? doc.description[0]
                        : (doc.description || ""),

                category:
                    Array.isArray(doc.subject)
                        ? doc.subject.join(", ")
                        : (doc.subject || ""),

                pubDate:
                    doc.publicdate || "",

                downloads:
                    doc.downloads || 0,

                media:
                    doc.mediatype,

                enclosure:
                    "",

                link:
                    "https://archive.org/details/" +
                    doc.identifier

            });

        });

        recordCount.textContent =
            archiveData.length;

        buildTicker();

        filterResults();

    }

    catch(err){

        console.error(err);

        results.innerHTML =
        "<div style='padding:25px;'>Unable to connect to Archive.org.</div>";

    }

}

/************************************************
 SEARCH WHILE TYPING
************************************************/

searchBox.addEventListener("keyup",()=>{

    filterResults();

});

/************************************************
 BETTER SORTING
************************************************/

function sortResults(){

    const mode =
        sortBox.value;

    switch(mode){

        case "title":

            filteredData.sort((a,b)=>

                a.title.localeCompare(b.title)

            );

            break;

        case "newest":

            filteredData.sort((a,b)=>

                new Date(b.pubDate)-

            );

            break;

        case "oldest":

            filteredData.sort((a,b)=>

                new Date(a.pubDate)-
                new Date(b.pubDate)

            );

            break;

    }

    renderCards();

}

/************************************************
 CARD RENDERER

function renderCards(){

    filteredCount.textContent =
        filteredData.length;

    results.innerHTML = filteredData.map(item=>`

<div class="card" onclick="openItem('${item.guid}')">

<div class="cardTitle">

${item.title}

</div>

<div class="cardMeta">

👤 ${item.creator}

</div>

<div class="cardMeta">

⬇ ${Number(item.downloads).toLocaleString()} Downloads

</div>

${truncate(item.description,180)}

</div>

${item.media}

</div>

<div class="tag">

${formatDate(item.pubDate)}

</div>

</div>

<button class="openBtn">

Open Archive

</button>

</div>

`).join("");

}

/************************************************
 POPUP

function openItem(id){

    currentItem =

    if(!currentItem) return;

    popupTitle.textContent =

    popupDescription.textContent =

    popupCreator.textContent =

        </a>`;

    openArchiveBtn.onclick=()=>{

        );

    };

    downloadBtn.onclick=()=>{

        window.open(
            currentItem.link,
            "_blank"
        );

    };

    popup.classList.remove("hidden");

}

/************************************************
 TICKER
************************************************/

function buildTicker(){

    let html="";

    archiveData.slice(0,40).forEach(item=>{

        html+=`

<span class="tick">

📦 ${item.title}

</span>

`;

    });

    ticker.innerHTML =
        html + html;

}

/************************************************
 RANDOM
************************************************/

function randomItem(){

    if(!archiveData.length) return;

    const item =
        archiveData[
            Math.floor(
                Math.random()*

            )
        ];

}

        page--;

        await loadRSS(currentMedia);

    }

}
