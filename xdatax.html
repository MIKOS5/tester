<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Obvyris Archive Radio Search</title>


<style>

body{

background:#09111d;
color:white;
font-family:Arial,Helvetica,sans-serif;
padding:20px;

}


h1{

color:#2793ff;

}


.searchbox{

background:#142235;
padding:20px;
border-radius:15px;

}


input{

width:70%;
padding:14px;
font-size:16px;
border-radius:8px;
border:0;

}


button{

padding:14px 20px;
border:0;
border-radius:8px;
background:#2793ff;
color:white;
font-weight:bold;
cursor:pointer;

}



#count{

color:#70c5ff;

}



.card{

background:#111c2d;
margin-top:15px;
padding:18px;
border-radius:15px;

}


.title{

font-size:20px;
font-weight:bold;
color:#4db1ff;

}


.info{

margin-top:8px;
color:#ddd;

}


.small{

font-size:13px;
color:#aaa;

}


a{

color:#6ecbff;

}


.loading{

font-size:20px;
color:#aaa;

}


</style>


</head>


<body>


<h1>
📻 Obvyris Archive Radio Search
</h1>



<div class="searchbox">


<input 
id="search"
placeholder="Search music, artist, genre, year..."
onkeypress="if(event.key==='Enter')searchArchive()">


<button onclick="searchArchive()">
SEARCH
</button>


</div>



<h2 id="count">
Loading Archive.org...
</h2>



<div id="results"></div>



<script>


let items=[];



function cleanText(value){


if(Array.isArray(value)){

return value.join(" ");

}


return value || "";


}




async function loadArchive(){



let url =

"https://archive.org/advancedsearch.php?q=mediatype:audio&fl[]=identifier,title,description,collection,creator,date&rows=100&output=json";



try{


let response =
await fetch(url);



let data =
await response.json();



items =
data.response.docs.map(x=>{


return {


identifier:
x.identifier || "",


title:
cleanText(x.title),


description:
cleanText(x.description),


collection:
cleanText(x.collection),


creator:
cleanText(x.creator),


date:
cleanText(x.date),


link:
"https://archive.org/details/"+x.identifier


};


});



display(items);



}

catch(error){


document.getElementById("count").innerHTML =
"ERROR LOADING DATA";


console.log(error);


}



}





function searchArchive(){


let q =

document
.getElementById("search")
.value
.toLowerCase()
.trim();



if(q===""){

display(items);

return;

}



let results =


items.filter(x=>{


let text =


(
x.title+
x.description+
x.collection+
x.creator+
x.date+
x.identifier

)
.toLowerCase();



return text.includes(q);



});



display(results);



}







function display(data){



document
.getElementById("count")
.innerHTML =

data.length+" Results";



let box =
document.getElementById("results");



box.innerHTML="";



data.forEach(x=>{


box.innerHTML += `


<div class="card">


<div class="title">

${x.title}

</div>



<div class="info">

🎤 ${x.creator}

</div>



<div class="info">

📂 ${x.collection}

</div>



<div class="info">

📅 ${x.date}

</div>



<p class="small">

${x.description.substring(0,300)}

</p>



<a href="${x.link}" target="_blank">

Open Archive.org

</a>


</div>


`;



});



}





loadArchive();



</script>



</body>

</html>
