.genre-grid {

function getGenre(s){

/* LOAD */
async function load(g){

  currentGenre = g || "";
  filterMode = !!g;

  let url =
    `${RADIO}?hidebroken=true&order=clickcount&reverse=true`;

  // COUNTRY FILTER
  if(currentCountry){
    url += `&country=${encodeURIComponent(currentCountry)}`;
  }

  // GENRE MODE (FULL FILTER LOAD)
  if(g){
    url += `&tag=${encodeURIComponent(g)}`;

    // IMPORTANT: no pagination in genre mode
    page = 0;
  }

  // ALL STATIONS MODE (pagination ON)
  if(!g){
    url += `&limit=${PAGE_SIZE}&offset=${page * PAGE_SIZE}`;
  }

  const res = await fetch(url);
  current = (await res.json()).map(normalize);

  render();

  setTitle(
    `${currentCountry || "All Countries"} • ${g || "All Stations"}`
  );
}

async function loadCountries(){
  const res = await fetch("https://all.api.radio-browser.info/json/countries");
  const data = await res.json();

  const select = document.getElementById("countryFilter");

  // keep "All Countries" first
  select.innerHTML = `
    <option value="">🌎 All Countries</option>
  `;

  // sort alphabetically
  data.sort((a,b) => a.name.localeCompare(b.name));

  for (let c of data){
    const opt = document.createElement("option");
    opt.value = c.name;
    opt.textContent = `${c.name} (${c.stationcount})`;
    select.appendChild(opt);
  }

  // ✅ set default AFTER loop
  select.value = currentCountry;
}

async function fav(s){

  const id = s.stationuuid || s.id;
  if(!id) return;

  const exists = favorites.has(id);

  if(exists){

    await fetch(SHEET,{
      method:"POST",
      body:new URLSearchParams({
        action:"delete",
        id:id
      })
    });

    favorites.delete(id);
    setTitle("Removed ⭐");
    render();
    return;
  }

  await fetch(SHEET,{
    method:"POST",
    body:new URLSearchParams({
      action:"save",
      id:id,
      name:s.name || "",
      url:s.url_resolved || s.url || "",
      country:s.country || "",
      genre:getGenre(s),
      time:new Date().toISOString()
    })
  });

  favorites.add(id);
  setTitle("Saved ⭐");
  render();
}

async function listenNowPlaying(streamUrl, callback){

    if(metadataAbort)
        metadataAbort.abort();

    metadataAbort = new AbortController();

    try{

        const response = await fetch(streamUrl,{
            headers:{
                "Icy-MetaData":"1"
            },
            signal:metadataAbort.signal
        });

        const metaInt =
            parseInt(response.headers.get("icy-metaint"));

        if(!metaInt)
            return;

        const reader = response.body.getReader();

        const decoder = new TextDecoder();

        while(true){

            // Skip audio bytes

            let remaining = metaInt;

            while(remaining>0){

                const {value,done}=await reader.read();

                if(done) return;

                remaining-=value.length;
            }

            // Metadata length

            const lenChunk=await reader.read();

            if(lenChunk.done) return;

            const metaLength=lenChunk.value[0]*16;

            if(metaLength===0)
                continue;

            let meta=new Uint8Array(metaLength);

            let offset=0;

            while(offset<metaLength){

                const chunk=await reader.read();

                if(chunk.done) return;

                meta.set(chunk.value.slice(0,metaLength-offset),offset);

                offset+=Math.min(
                    chunk.value.length,
                    metaLength-offset
                );
            }

            const text=decoder.decode(meta);

            const match=text.match(
                /StreamTitle='([^']*)'/
            );

            if(match){

                callback(match[1]);

            }

        }

    }catch(e){

        console.log("metadata stopped");

    }

}

function playMedia(url) {
  const audio = document.getElementById("audio");
  const video = document.getElementById("video");

  const isVideo =
    url.includes(".mp4") ||
    url.includes(".m3u8") ||
    url.includes("youtube");

  if (isVideo) {
    // stop audio completely
    audio.pause();
    audio.src = "";

    // start video
    video.style.display = "block";
    video.src = url;
    video.play();

  } else {
    // stop video completely
    video.pause();
    video.src = "";
    video.style.display = "none";

    // start audio
    audio.style.display = "block";
    audio.src = url;
    audio.play();
  }
}

        currentBook.title;

}

async function play(i){

  index = i;

  const s = current[i];
  const url = s.url_resolved || s.url;

  playMedia(url);

  document.getElementById("npName").innerText = s.name;
  document.getElementById("npMeta").innerText = "Loading track...";

  // stop previous metadata listener
  if (metadataAbort) {
    metadataAbort.abort();
  }

  listenNowPlaying(s.url, (title) => {
    document.getElementById("npMeta").innerText =
      `${title} • ${s.country || ""}`;
  });

  stationStarted = true;
  loadPopupChat();
}

  if(!s) return;

  index = i;
  window.activeList = list;

  const url = s.url_resolved || s.url;

  playMedia(url);

  document.getElementById("npName").innerText = s.name;
  document.getElementById("npMeta").innerText =
    `${getGenre(s)} • ${s.country || ""}`;

  // reset old button
  if (playingIndex !== null &&
      document.getElementById(`playBtn-${playingIndex}`)) {
    document.getElementById(`playBtn-${playingIndex}`).innerText = "▶ Play";
  }

  playingIndex = i;

  const btn = document.getElementById(`playBtn-${i}`);
  if (btn) btn.innerText = "⏸ Pause";

  stationStarted = true;
  loadPopupChat();
}
  
/* CONTROLS */
function toggle() {
  const a = document.getElementById("audio");
  const v = document.getElementById("video");

  const isVideoVisible = v.style.display !== "none" && v.src;

  // 🎬 VIDEO MODE
  if (isVideoVisible) {
    if (v.paused) {
      v.play();
    } else {
      v.pause();
    }

    return;
  }

  // 🔊 AUDIO MODE
  if (a.paused) {
    a.play();

    if (playingIndex !== null) {
      const btn = document.getElementById(`playBtn-${playingIndex}`);
      if (btn) btn.innerText = "⏸ Pause";
    }

  } else {
    a.pause();

    if (playingIndex !== null) {
      const btn = document.getElementById(`playBtn-${playingIndex}`);
      if (btn) btn.innerText = "▶ Play";
    }
  }
}

function next(){

    if(currentBook){

        if(chapter < chapters.length-1){

            chapter++;
            playBookChapter();

        }

        return;
    }

    const list=getActiveList();

    index=(index+1)%list.length;

    playFiltered(index);
}

function prev(){

    if(currentBook){

        if(chapter>0){

            chapter--;
            playBookChapter();

        }

        return;
    }

    const list=getActiveList();

    index=(index-1+list.length)%list.length;

    playFiltered(index);
}

function render(){

  const el = document.getElementById("list");
  el.innerHTML = "";

  const q =
    document.getElementById("searchBox")?.value
      .toLowerCase()
      .trim() || "";

  let filtered = [];

  for (let s of current) {

    const text = `
      ${s.name || ""}
      ${getGenre(s)}
      ${s.country || ""}
    `.toLowerCase();

    if (q && !text.includes(q)) continue;

    filtered.push(s);
  }

  window.filtered = filtered;

  filtered.forEach((s,i)=>{

    const id = s.stationuuid || s.id;
    const isFav = favorites.has(id);

    el.innerHTML += `
      <div class="card">
        <div class="station">${s.name}</div>

        <div class="small">${getGenre(s)} • ${s.country || ""}</div>

        <div class="row">
          <button id="playBtn-${i}" onclick="playFiltered(${i})">▶ Play</button>

            onclick="favFiltered(${i})">

          </button>
          <button onclick="shareFiltered(${i})">🔗 Share</button>
        </div>
      </div>
    `;
  });
}

document.addEventListener("keydown", (e) => {

  const tag = document.activeElement.tagName.toLowerCase();
  const isTyping = tag === "input" || tag === "textarea" || tag === "select";

  // Don't interfere while typing (except Esc and /)
  if (isTyping && e.key !== "Escape") return;

  switch (e.key.toLowerCase()) {

    // Playback
    case " ":
      e.preventDefault();
      toggle();
      break;

    case "arrowright":
    case "n":
      next();
      break;

    case "arrowleft":
    case "p":
      prev();
      break;

    // Search
    case "/":
    case "s":
      e.preventDefault();
      document.getElementById("searchBox").focus();
      break;

    // Favorites
    case "f":
      loadFavorites();
      break;

    // Escape
    case "escape":
      document.getElementById("searchBox").value = "";
      document.getElementById("searchBox").blur();
      render();
      break;

    // UI
    case "g":
      toggleGenres();
      break;

    case "a":
      showAll();
      break;

    case "m":
      loadMISC();
      break;

    case "i":
      loadInternational();
      break;

    case "c":
      document.getElementById("countryFilter").focus();
      break;

    case "home":
      scrollToTop();
      break;

    case "pagedown":
      nextPage();
      break;

    case "pageup":
      prevPage();
      break;

    // Help
    case "?":
      e.preventDefault();
      showKeyboardHelp();
      break;
  }
});

function playYoutubeRadio(data){

    console.log("Starting YouTube:", data);


    if(!data.videoId){

        console.log("No YouTube video");
        return;

    }


    if(!ytLoaded){

        ytPending = {
            videoId:data.videoId,
            seek:data.seek || 0
        };

        return;

    }


    createYoutubePlayer(
        data.videoId,
        data.seek
    );

}

function createYoutubePlayer(id,seek){


    if(ytPlayer){

        ytPlayer.loadVideoById(id);

        if(seek){

            ytPlayer.seekTo(
                Number(seek),
                true
            );

        }

        return;
    }



    ytPlayer = new YT.Player(
        "ytPlayer",
        {

        height:"120",
        width:"200",

        videoId:id,


        playerVars:{
    autoplay:1,
    controls:0,
    disablekb:1,
    playsinline:1,
    rel:0,
    modestbranding:1,
    enablejsapi:1,
    origin:"https://mikos5.github.io"
}


        events:{

            onReady:function(e){

                if(seek){

                    e.target.seekTo(
                        Number(seek),
                        true
                    );

                }


                e.target.playVideo();

            },


            onStateChange:function(e){

                console.log(
                    "YT state:",
                    e.data
                );

            }

        }

        }
    );

}
