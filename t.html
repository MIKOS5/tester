<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Video Stream</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0f17;
  color: white;
  display: flex;
  height: 100vh;
}

/* LEFT PLAYER */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
}

video, audio {
  width: 100%;
  background: black;
}

#playerBar {
  background: #0f172a;
  padding: 10px;
}

button {
  padding: 8px;
  margin-right: 5px;
  cursor: pointer;
}

/* RIGHT SIDEBAR */
#sidebar {
  width: 320px;
  background: #111827;
  display: flex;
  flex-direction: column;
  border-left: 1px solid #222;
}

#search {
  padding: 10px;
  border: none;
  outline: none;
  background: #0f172a;
  color: white;
}

#list {
  flex: 1;
  overflow-y: auto;
}

.card {
  padding: 10px;
  border-bottom: 1px solid #222;
  cursor: pointer;
}

.card:hover {
  background: #1f2937;
}

/* CHAT POPUP */
#chatPopup {
  position: fixed;
  bottom: 0;
  right: 0;
  width: 320px;
  height: 400px;
  background: #111827;
  border-top: 1px solid #333;
  border-left: 1px solid #333;
  display: flex;
  flex-direction: column;
  z-index: 9999;
}

.hidden {
  display: none;
}

.chat-header {
  padding: 10px;
  background: #0f172a;
  display: flex;
  justify-content: space-between;
  font-weight: bold;
}

#chatLogPopup {
  flex: 1;
  overflow-y: auto;
  padding: 6px;
  font-size: 12px;
}

.chat-input {
  display: flex;
  gap: 5px;
  padding: 6px;
  border-top: 1px solid #333;
}

.chat-input input {
  border: none;
  outline: none;
  padding: 6px;
  background: #0b0f17;
  color: white;
}

#chatNamePopup { width: 70px; }
#chatMsgPopup { flex: 1; }
</style>
</head>

<body>

<!-- MAIN PLAYER -->
<div id="main">

  <video id="video" controls playsinline></video>
  <audio id="audio" controls></audio>

  <div id="playerBar">
    <div id="now">No station</div>
    <button onclick="prev()">⏮</button>
    <button onclick="toggle()">▶/⏸</button>
    <button onclick="next()">⏭</button>
  </div>

</div>

<!-- SIDEBAR -->
<div id="sidebar">
  <input id="search" placeholder="Search stations..." />
  <div id="list"></div>
</div>

<!-- CHAT POPUP -->
<div id="chatPopup" class="hidden">

  <div class="chat-header">
    <span>💬 Chat</span>
    <button onclick="toggleChatPopup()">✖</button>
  </div>

  <div id="chatLogPopup"></div>

  <div class="chat-input">
    <input id="chatNamePopup" placeholder="name" maxlength="8">
    <input id="chatMsgPopup" placeholder="message" maxlength="100">
    <button onclick="sendPopupMessage()">Send</button>
  </div>

</div>

<script>

const PLAYLIST = "https://iptv-org.github.io/iptv/index.m3u";
const API_URL = "https://script.google.com/macros/s/AKfycbzin84qDcZ9L1q4pTBtHZGKJSTDcZ_wnmgWmnmgPgf1jrc1nRprzbEBixKMSHcdkxiZBg/exec";

let list = [];
let filtered = [];
let index = 0;

/* INFINITE SCROLL */
let renderIndex = 0;
const CHUNK = 80;

/* CHAT */
let chatOpen = false;
let chatData = [];
let currentChatStationId = null;

/* LOAD IPTV */
async function load() {
  const res = await fetch(PLAYLIST);
  const text = await res.text();
  list = parseM3U(text);
  render(true);
}

/* PARSE M3U */
function parseM3U(text) {
  const lines = text.split("\n");
  const out = [];
  let item = null;

  for (let l of lines) {
    if (l.startsWith("#EXTINF")) {
      item = { name: l.split(",").pop() };
    } else if (item && l.startsWith("http")) {
      item.url = l.trim();
      out.push(item);
      item = null;
    }
  }
  return out;
}

/* RENDER (INFINITE SAFE) */
function render(reset = true) {
  const el = document.getElementById("list");

  const q = (document.getElementById("search").value || "").toLowerCase();

  filtered = list.filter(s =>
    s.name.toLowerCase().includes(q)
  );

  if (reset) {
    el.innerHTML = "";
    renderIndex = 0;
  }

  const slice = filtered.slice(renderIndex, renderIndex + CHUNK);

  slice.forEach((s, i) => {
    const realIndex = renderIndex + i;
    el.innerHTML += `
      <div class="card" onclick="play(${realIndex})">
        ${s.name}
      </div>
    `;
  });

  renderIndex += CHUNK;
}

/* SCROLL LOAD */
document.getElementById("list").addEventListener("scroll", (e) => {
  const el = e.target;
  if (el.scrollTop + el.clientHeight >= el.scrollHeight - 100) {
    render(false);
  }
});

/* SEARCH */
document.getElementById("search").addEventListener("input", () => {
  render(true);
});

/* PLAY MEDIA */
function playMedia(url) {
  const v = document.getElementById("video");
  const a = document.getElementById("audio");

  const isVideo = url.includes(".mp4") || url.includes(".m3u8");

  if (isVideo) {
    a.pause(); a.src = "";
    v.style.display = "block";
    a.style.display = "none";
    v.src = url;
    v.play();
  } else {
    v.pause(); v.src = "";
    a.style.display = "block";
    v.style.display = "none";
    a.src = url;
    a.play();
  }
}

/* PLAY */
function play(i) {
  index = i;
  const s = filtered[i];
  if (!s) return;

  document.getElementById("now").innerText = s.name;
  playMedia(s.url);
  loadPopupChat();
}

/* CONTROLS */
function next() {
  index = (index + 1) % filtered.length;
  play(index);
}

function prev() {
  index = (index - 1 + filtered.length) % filtered.length;
  play(index);
}

function toggle() {
  const v = document.getElementById("video");
  const a = document.getElementById("audio");

  if (v.style.display !== "none") {
    v.paused ? v.play() : v.pause();
  } else {
    a.paused ? a.play() : a.pause();
  }
}

/* CHAT TOGGLE */
function toggleChatPopup() {
  const box = document.getElementById("chatPopup");
  chatOpen = !chatOpen;
  box.classList.toggle("hidden");

  if (chatOpen) loadPopupChat();
}

/* GET STATION */
function getStationId() {
  return filtered?.[index]?.name || "global";
}

/* LOAD CHAT */
async function loadPopupChat() {
  const stationId = getStationId();

  if (currentChatStationId !== stationId) {
    currentChatStationId = stationId;
    chatData = [];
  }

  const res = await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "get",
      station: stationId
    })
  });

  const data = await res.json();
  const msgs = Array.isArray(data) ? data : [];

  chatData = [
    { system: true, name: "System", message: `Chat: ${stationId}` },
    ...msgs
  ];

  renderPopupChat();
}

/* RENDER CHAT */
function renderPopupChat() {
  const box = document.getElementById("chatLogPopup");
  box.innerHTML = "";

  chatData.forEach(m => {
    box.innerHTML += `
      <div style="${m.system ? "opacity:.6;text-align:center;" : ""}">
        ${m.system ? "" : `<b>${m.name}:</b>`}
        ${m.message}
      </div>
    `;
  });

  box.scrollTop = box.scrollHeight;
}

/* SEND CHAT */
async function sendPopupMessage() {
  let name = document.getElementById("chatNamePopup").value || "Anon";
  let msg = document.getElementById("chatMsgPopup").value;

  if (!msg.trim()) return;

  await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({
      action: "send",
      station: getStationId(),
      name: name.trim().slice(0,8),
      message: msg.trim().slice(0,100)
    })
  });

  document.getElementById("chatMsgPopup").value = "";
  loadPopupChat();
}

/* AUTO CHAT REFRESH */
setInterval(() => {
  if (chatOpen && document.visibilityState === "visible") {
    loadPopupChat();
  }
}, 3000);

/* START */
load();

</script>
</body>
</html>
