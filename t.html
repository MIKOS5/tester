<!DOCTYPE html>
<html>
<head>
<title>News API Test</title>

<style>

body{
font-family:Arial;
background:#111;
color:white;
padding:20px;
}

.card{

background:#222;
border:1px solid #555;
border-radius:12px;
padding:15px;
margin:15px 0;

}

img{

max-width:400px;
border-radius:10px;

}

button{

padding:10px;
font-size:18px;

}

pre{

background:#000;
padding:15px;
overflow:auto;

}

</style>

</head>


<body>


<h1>📰 News API Test</h1>


<button onclick="loadNews()">
Load News
</button>


<h2>Raw API Response</h2>

<pre id="raw">
Waiting...
</pre>



<h2>Rendered News</h2>

<div id="news"></div>



<script>


const API_URL =
"https://script.google.com/macros/s/AKfycbzin84qDcZ9L1q4pTBtHZGKJSTDcZ_wnmgWmnmgPgf1jrc1nRprzbEBixKMSHcdkxiZBg/exec";




async function loadNews(){


const res = await fetch(API_URL,{

method:"POST",

body:JSON.stringify({

action:"get",

source:"news"

})

});



const data = await res.json();



document.getElementById("raw").textContent =
JSON.stringify(data,null,2);



let html="";



data.forEach(n=>{


html += `


<div class="card">


<h2>
${n.stationName}
</h2>


<p>
Time: ${n.time}
</p>


<p>
Name: ${n.name}
</p>


<p>
Type: ${n.type}
</p>


<p>
Source: ${n.source}
</p>



${n.image ? `

<img src="${n.image}"
onerror="this.outerHTML='IMAGE FAILED'">

`
:
"<p>NO IMAGE</p>"
}



<p>

${n.details}

</p>



<p>

${n.message}

</p>




${n.link ? `

<a href="${n.link}" target="_blank">

<button>
📰 Article
</button>

</a>

`
:
""
}



${n.sourceLink ? `

<a href="${n.sourceLink}" target="_blank">

<button>
🔗 Source
</button>

</a>

`
:
""
}



</div>


`;


});



document.getElementById("news").innerHTML=html;



}


</script>


</body>
</html>
