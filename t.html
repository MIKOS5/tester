<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>IPTV Stream Pro</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body{
  margin:0;
  display:flex;
  height:100vh;
  font-family:Arial;
  background:#0b0f17;
  color:#fff;
}

/* LEFT SIDEBAR FILTERS */
#sidebar{
  width:260px;
  background:#111827;
  border-right:1px solid #222;
  display:flex;
  flex-direction:column;
}

/* GROUP LIST */
#groupList{
  flex:1;
  overflow:auto;
  padding:8px;
}

.group{
  padding:8px;
  margin-bottom:6px;
  background:#0b0f17;
  border:1px solid #222;
  border-radius:8px;
  cursor:pointer;
  font-size:12px;
}

.group:hover{
  background:#1f2937;
}

/* MAIN AREA */
#main{
  flex:1;
  display:flex;
  flex-direction:column;
}

/* VIDEO */
video{
  width:100%;
  background:black;
  max-height:65vh;
}

/* TOP BAR */
#bar{
  background:#111827;
  padding:10px;
  display:flex;
  gap:10px;
  align-items:center;
}

/* SEARCH */
#search{
  width:100%;
  padding:10px;
  border:none;
  outline:none;
  background:#0f172a;
  color:#fff;
  border-bottom:1px solid #222;
}

/* LIST */
#list{
  flex:1;
  overflow:auto;
}

.card{
  padding:10px;
  border-bottom:1px solid #222;
  cursor:pointer;
}
.card:hover{
  background:#1f2937;
}
</style>
</head>

<body>

<!-- LEFT SIDEBAR -->
<div id="sidebar">
  <input id="search" placeholder="Search..." oninput="applyFilters()"/>
  <div id="groupList"></div>
</div>

<!-- MAIN -->
<div id="main">

  <video id="video" controls playsinline></video>

  <div id="bar">
    <div id="now">Loading...</div>
    <button onclick="prev()">⏮</button>
    <button onclick="toggle()">⏯</button>
    <button onclick="next()">⏭</button>
  </div>

  <div id="list"></div>

</div>

<script>

const PLAYLIST="https://iptv-org.github.io/iptv/index.m3u";

let list=[],filtered=[],index=0;
let renderIndex=0;
const CHUNK=120;

/* LOAD */
async function load(){
  const r=await fetch(PLAYLIST);
  const t=await r.text();

  list=parseM3U(t);

  buildGroups();
  applyFilters();
}

/* PARSE */
function parseM3U(t){
  const lines=t.split("\n");
  let out=[],item=null;

  for(let l of lines){
    if(l.startsWith("#EXTINF")){
      item={
        name:l.split(",").pop(),
        group:(l.match(/group-title="([^"]+)"/)||[])[1]||"Other"
      };
    }
    else if(item && l.startsWith("http")){
      item.url=l.trim();
      out.push(item);
      item=null;
    }
  }
  return out;
}

/* GROUP SIDEBAR */
function buildGroups(){
  const set=new Set();
  list.forEach(s=>set.add(s.group));

  const box=document.getElementById("groupList");
  box.innerHTML="";

  const all=document.createElement("div");
  all.className="group";
  all.textContent="📺 All Channels";
  all.onclick=()=>{
    filtered=list;
    render(true);
  };
  box.appendChild(all);

  [...set].sort().forEach(g=>{
    const d=document.createElement("div");
    d.className="group";
    d.textContent=g;

    d.onclick=()=>{
      filtered=list.filter(x=>x.group===g);
      render(true);
    };

    box.appendChild(d);
  });
}

/* SEARCH FILTER */
function applyFilters(){
  const q=document.getElementById("search").value.toLowerCase();

  filtered=list.filter(s=>
    s.name.toLowerCase().includes(q)
  );

  render(true);
}

/* RENDER */
function render(reset){
  const el=document.getElementById("list");

  if(reset){
    el.innerHTML="";
    renderIndex=0;
  }

  const slice=filtered.slice(renderIndex,renderIndex+CHUNK);

  slice.forEach((s,i)=>{
    const real=renderIndex+i;

    el.innerHTML+=`
      <div class="card" onclick="play(${real})">
        <b>${s.name}</b><br/>
        <small>${s.group}</small>
      </div>
    `;
  });

  renderIndex+=CHUNK;
}

/* INFINITE SCROLL */
document.getElementById("list").onscroll=(e)=>{
  if(e.target.scrollTop+e.target.clientHeight>=e.target.scrollHeight-100){
    render(false);
  }
};

/* HLS PLAY */
function playMedia(url){
  const v=document.getElementById("video");

  if(window.Hls && Hls.isSupported()){
    if(window.hls) window.hls.destroy();

    window.hls=new Hls();
    window.hls.loadSource(url);
    window.hls.attachMedia(v);
    v.play();
  }else{
    v.src=url;
    v.play();
  }
}

/* PLAY */
function play(i){
  index=i;
  const s=filtered[i];
  if(!s) return;

  document.getElementById("now").innerText=s.name;
  playMedia(s.url);
}

/* CONTROLS */
function next(){
  index=(index+1)%filtered.length;
  play(index);
}

function prev(){
  index=(index-1+filtered.length)%filtered.length;
  play(index);
}

function toggle(){
  const v=document.getElementById("video");
  v.paused?v.play():v.pause();
}

/* START */
load();

</script>
</body>
</html>
