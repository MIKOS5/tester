<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Video Stream</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0f17;
  color: white;
  display: flex;
  height: 100vh;
}

#sidebar {
  width: 320px;
  background: #111827;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

#search {
  padding: 10px;
  border: none;
  outline: none;
  background: #0f172a;
  color: white;
}

#list {
  overflow-y: auto;
  flex: 1;
}

.card {
  padding: 10px;
  border-bottom: 1px solid #222;
  cursor: pointer;
}

.card:hover {
  background: #1f2937;
}

#main {
  flex: 1;
  display: flex;
  flex-direction: column;
}

video, audio {
  width: 100%;
  background: black;
}

#playerBar {
  background: #0f172a;
  padding: 10px;
}

button {
  padding: 8px;
  margin-right: 5px;
  cursor: pointer;
}

#chat {
  position: fixed;
  right: 0;
  bottom: 0;
  width: 300px;
  background: #111827;
  border-top: 1px solid #333;
  border-left: 1px solid #333;
}

#chatLog {
  height: 180px;
  overflow-y: auto;
  font-size: 12px;
  padding: 5px;
}

#chatInput {
  display: flex;
}

#chatInput input {
  border: none;
  padding: 6px;
  outline: none;
}

#chatMsg { flex: 1; }
</style>
</head>

<body>

<div id="sidebar">
  <input id="search" placeholder="Search..." />

  <div id="list"></div>
</div>

<div id="main">
  <video id="video" controls playsinline></video>
  <audio id="audio" controls></audio>

  <div id="playerBar">
    <div id="now">No station</div>
    <button onclick="prev()">⏮</button>
    <button onclick="toggle()">▶/⏸</button>
    <button onclick="next()">⏭</button>
  </div>
</div>

<!-- CHAT -->
<div id="chat">
  <div id="chatLog"></div>
  <div id="chatInput">
    <input id="chatName" placeholder="name" maxlength="8" style="width:70px;">
    <input id="chatMsg" placeholder="message" maxlength="120">
    <button onclick="sendChat()">Send</button>
  </div>
</div>

<script>
const PLAYLIST = "https://iptv-org.github.io/iptv/index.m3u";
const API_URL = "https://script.google.com/macros/s/AKfycbzin84qDcZ9L1q4pTBtHZGKJSTDcZ_wnmgWmnmgPgf1jrc1nRprzbEBixKMSHcdkxiZBg/exec";

let list = [];
let filtered = [];
let index = 0;

/* INFINITE SCROLL */
let renderIndex = 0;
const CHUNK = 80;

/* LOAD IPTV */
async function load() {
  const res = await fetch(PLAYLIST);
  const text = await res.text();
  list = parseM3U(text);
  render(true);
}

/* PARSER */
function parseM3U(text) {
  const lines = text.split("\n");
  const out = [];
  let item = null;

  for (let l of lines) {
    if (l.startsWith("#EXTINF")) {
      item = { name: l.split(",").pop() };
    } else if (item && l.startsWith("http")) {
      item.url = l.trim();
      out.push(item);
      item = null;
    }
  }
  return out;
}

/* RENDER (INFINITE SAFE) */
function render(reset = true) {
  const el = document.getElementById("list");

  const q = (document.getElementById("search").value || "").toLowerCase();

  filtered = list.filter(s =>
    s.name.toLowerCase().includes(q)
  );

  if (reset) {
    el.innerHTML = "";
    renderIndex = 0;
  }

  const slice = filtered.slice(renderIndex, renderIndex + CHUNK);

  slice.forEach((s, i) => {
    const realIndex = renderIndex + i;

    el.innerHTML += `
      <div class="card" onclick="play(${realIndex})">
        ${s.name}
      </div>
    `;
  });

  renderIndex += CHUNK;
}

/* SCROLL LOAD */
document.getElementById("list").addEventListener("scroll", (e) => {
  const el = e.target;
  if (el.scrollTop + el.clientHeight >= el.scrollHeight - 120) {
    render(false);
  }
});

/* SEARCH (debounced) */
let t;
document.getElementById("search").addEventListener("input", () => {
  clearTimeout(t);
  t = setTimeout(() => render(true), 200);
});

/* MEDIA SWITCH */
function playMedia(url) {
  const v = document.getElementById("video");
  const a = document.getElementById("audio");

  const isVideo = url.includes(".m3u8") || url.includes(".mp4");

  if (isVideo) {
    a.pause(); a.src = "";
    v.style.display = "block";
    a.style.display = "none";
    v.src = url;
    v.play();
  } else {
    v.pause(); v.src = "";
    a.style.display = "block";
    v.style.display = "none";
    a.src = url;
    a.play();
  }
}

/* PLAY */
function play(i) {
  index = i;
  const s = filtered[i];
  if (!s) return;

  document.getElementById("now").innerText = s.name;
  playMedia(s.url);
  loadChat();
}

/* CONTROLS */
function next() {
  index = (index + 1) % filtered.length;
  play(index);
}

function prev() {
  index = (index - 1 + filtered.length) % filtered.length;
  play(index);
}

function toggle() {
  const v = document.getElementById("video");
  const a = document.getElementById("audio");

  if (v.style.display !== "none") {
    v.paused ? v.play() : v.pause();
  } else {
    a.paused ? a.play() : a.pause();
  }
}

/* CHAT */
async function loadChat() {
  const station = getStation();

  const res = await fetch(API_URL, {
    method: "POST",
    body: JSON.stringify({ action:"get", station })
  });

  const data = await res.json();
  renderChat(Array.isArray(data) ? data : []);
}

async function sendChat() {
  const name = document.getElementById("chatName").value || "Anon";
  const msg = document.getElementById("chatMsg").value;
  if (!msg) return;

  await fetch(API_URL, {
    method:"POST",
    body: JSON.stringify({
      action:"send",
      station: getStation(),
      name,
      message: msg
    })
  });

  document.getElementById("chatMsg").value = "";
  loadChat();
}

function renderChat(msgs) {
  const box = document.getElementById("chatLog");
  box.innerHTML = msgs.map(m =>
    `<div><b>${m.name}:</b> ${m.message}</div>`
  ).join("");
  box.scrollTop = box.scrollHeight;
}

function getStation() {
  return filtered[index]?.name || "global";
}

/* START */
load();
</script>

</body>
</html>
