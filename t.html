<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Video Stream</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b0f17;
  color:#fff;
  display:flex;
  height:100vh;
}

/* LEFT PLAYER */
#main{
  flex:1;
  display:flex;
  flex-direction:column;
}

video{
  width:100%;
  background:black;
  max-height:70vh;
}

#bar{
  background:#111827;
  padding:10px;
  display:flex;
  gap:10px;
  align-items:center;
}

/* RIGHT SIDEBAR */
#sidebar{
  width:320px;
  display:flex;
  flex-direction:column;
  background:#111827;
  border-left:1px solid #222;
}

#search{
  padding:10px;
  border:none;
  outline:none;
  background:#0f172a;
  color:#fff;
}

#list{
  flex:1;
  overflow:auto;
}

.card{
  padding:10px;
  border-bottom:1px solid #222;
  cursor:pointer;
}
.card:hover{background:#1f2937}

/* CHAT */
#chatPopup{
  position:fixed;
  right:0;
  bottom:0;
  width:320px;
  height:400px;
  background:#111827;
  display:flex;
  flex-direction:column;
  border:1px solid #333;
  z-index:9999;
}
.hidden{display:none}

#chatLogPopup{
  flex:1;
  overflow:auto;
  padding:8px;
  font-size:12px;
}

.chat-input{
  display:flex;
  gap:5px;
  padding:6px;
  border-top:1px solid #333;
}

.chat-input input{
  background:#0b0f17;
  color:#fff;
  border:none;
  padding:6px;
}

#chatNamePopup{width:70px}
#chatMsgPopup{flex:1}
</style>
</head>

<body>

<!-- MAIN -->
<div id="main">

  <video id="video" controls autoplay playsinline></video>

  <div id="bar">
    <div id="now">Loading...</div>
    <button onclick="prev()">⏮</button>
    <button onclick="toggle()">⏯</button>
    <button onclick="next()">⏭</button>
    <button onclick="toggleChat()">💬</button>
  </div>

</div>

<!-- RIGHT SIDEBAR -->
<div id="sidebar">
  <input id="search" placeholder="Search..." />
  <div id="list"></div>
</div>

<!-- CHAT -->
<div id="chatPopup" class="hidden">

  <div style="padding:10px;background:#0f172a;display:flex;justify-content:space-between;">
    <b>Chat</b>
    <button onclick="toggleChat()">✖</button>
  </div>

  <div id="chatLogPopup"></div>

  <div class="chat-input">
    <input id="chatNamePopup" placeholder="name" maxlength="8"/>
    <input id="chatMsgPopup" placeholder="msg" maxlength="100"/>
    <button onclick="sendChat()">Send</button>
  </div>

</div>

<script>

const PLAYLIST="https://iptv-org.github.io/iptv/index.m3u";
const API_URL="https://script.google.com/macros/s/AKfycbzin84qDcZ9L1q4pTBtHZGKJSTDcZ_wnmgWmnmgPgf1jrc1nRprzbEBixKMSHcdkxiZBg/exec";

let list=[],filtered=[],index=0;
let renderIndex=0;
const CHUNK=80;

/* LOAD M3U */
async function load(){
  const r=await fetch(PLAYLIST);
  const t=await r.text();
  list=parseM3U(t);
  render(true);
}

/* PARSE */
function parseM3U(t){
  const lines=t.split("\n");
  let out=[],item=null;

  for(let l of lines){
    if(l.startsWith("#EXTINF")){
      item={name:l.split(",").pop()};
    }
    else if(item && l.startsWith("http")){
      item.url=l.trim();
      out.push(item);
      item=null;
    }
  }
  return out;
}

/* RENDER (INFINITE SAFE) */
function render(reset){
  const el=document.getElementById("list");

  const q=(document.getElementById("search").value||"").toLowerCase();

  filtered=list.filter(s=>s.name.toLowerCase().includes(q));

  if(reset){
    el.innerHTML="";
    renderIndex=0;
  }

  const slice=filtered.slice(renderIndex,renderIndex+CHUNK);

  slice.forEach((s,i)=>{
    const real=renderIndex+i;
    el.innerHTML+=`
      <div class="card" onclick="play(${real})">
        ${s.name}
      </div>`;
  });

  renderIndex+=CHUNK;
}

/* SCROLL */
document.getElementById("list").onscroll=(e)=>{
  if(e.target.scrollTop+e.target.clientHeight>=e.target.scrollHeight-100){
    render(false);
  }
};

document.getElementById("search").oninput=()=>render(true);

/* SINGLE PLAYER (FIXED IPTV) */
function playMedia(url){
  const video=document.getElementById("video");

  if(video.canPlayType("application/vnd.apple.mpegurl")){
    video.src=url;
  }
  else if(window.Hls && Hls.isSupported()){
    if(window.hls) window.hls.destroy();

    window.hls=new Hls();
    window.hls.loadSource(url);
    window.hls.attachMedia(video);
  }
  else{
    video.src=url;
  }

  video.play();
}

/* PLAY */
function play(i){
  index=i;
  const s=filtered[i];
  if(!s) return;

  document.getElementById("now").innerText=s.name;
  playMedia(s.url);

  loadChat();
}

/* CONTROLS */
function next(){
  index=(index+1)%filtered.length;
  play(index);
}

function prev(){
  index=(index-1+filtered.length)%filtered.length;
  play(index);
}

function toggle(){
  const v=document.getElementById("video");
  v.paused?v.play():v.pause();
}

/* CHAT */
let chatOpen=false;
let chatData=[];

function toggleChat(){
  chatOpen=!chatOpen;
  document.getElementById("chatPopup").classList.toggle("hidden");
  if(chatOpen) loadChat();
}

function getStationId(){
  return filtered[index]?.name||"global";
}

/* LOAD CHAT */
async function loadChat(){
  const id=getStationId();

  const res=await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({action:"get",station:id})
  });

  const data=await res.json();
  chatData=Array.isArray(data)?data:[];

  renderChat();
}

function renderChat(){
  const box=document.getElementById("chatLogPopup");
  box.innerHTML="";

  chatData.forEach(m=>{
    box.innerHTML+=`
      <div>
        <b>${m.name||""}</b> ${m.message||""}
      </div>`;
  });

  box.scrollTop=box.scrollHeight;
}

/* SEND */
async function sendChat(){
  let name=document.getElementById("chatNamePopup").value||"Anon";
  let msg=document.getElementById("chatMsgPopup").value;
  if(!msg.trim()) return;

  await fetch(API_URL,{
    method:"POST",
    body:JSON.stringify({
      action:"send",
      station:getStationId(),
      name:name.slice(0,8),
      message:msg.slice(0,100)
    })
  });

  document.getElementById("chatMsgPopup").value="";
  loadChat();
}

/* START */
load();

</script>
</body>
</html>
