<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>IPTV Stream Pro Fixed</title>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<style>
body{
  margin:0;
  display:flex;
  height:100vh;
  font-family:Arial;
  background:#0b0f17;
  color:#fff;
}

/* PLAYER */
#main{
  flex:1;
  display:flex;
  flex-direction:column;
}

video{
  width:100%;
  background:black;
  max-height:70vh;
}

/* BAR */
#bar{
  background:#111827;
  padding:10px;
  display:flex;
  gap:10px;
}

/* SIDEBAR */
#sidebar{
  width:320px;
  display:flex;
  flex-direction:column;
  border-left:1px solid #222;
  background:#111827;
}

/* FILTERS */
#filters{
  display:flex;
  gap:8px;
  padding:10px;
  background:#0f172a;
  align-items:center;
}

input{
  flex:1;
  padding:8px;
  border-radius:6px;
  border:1px solid #333;
  background:#0b0f17;
  color:#fff;
}

/* DROPDOWN */
.dropdown{
  position:relative;
}

.dropbtn{
  padding:6px 10px;
  font-size:12px;
  background:#1f2937;
  color:#fff;
  border:1px solid #333;
  border-radius:8px;
  cursor:pointer;
}

.dropdown-menu{
  position:absolute;
  top:100%;
  right:0;
  margin-top:6px;
  width:320px;
  max-height:260px;
  overflow:auto;
  background:#111827;
  border:1px solid #333;
  border-radius:10px;
  display:none;
  padding:8px;

  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:6px;
}

.dropdown:hover .dropdown-menu{
  display:grid;
}

.dropdown-menu div{
  font-size:11px;
  padding:6px;
  background:#0b0f17;
  border-radius:6px;
  cursor:pointer;
  text-align:center;
}

.dropdown-menu div:hover{
  background:#2793ff;
}

/* LIST */
#list{
  flex:1;
  overflow:auto;
}

.card{
  padding:10px;
  border-bottom:1px solid #222;
  cursor:pointer;
}
.card:hover{background:#1f2937}
</style>
</head>

<body>

<div id="main">
  <video id="video" controls playsinline></video>

  <div id="bar">
    <div id="now">Loading...</div>
    <button onclick="prev()">⏮</button>
    <button onclick="toggle()">⏯</button>
    <button onclick="next()">⏭</button>
  </div>
</div>

<div id="sidebar">

  <div id="filters">

    <div class="dropdown">
      <button class="dropbtn">📂 Groups</button>
      <div class="dropdown-menu" id="groupMenu"></div>
    </div>

    <input id="search" placeholder="Search..." oninput="applyFilters()"/>

  </div>

  <div id="list"></div>

</div>

<script>

const PLAYLIST="https://iptv-org.github.io/iptv/index.m3u";

let list=[],filtered=[],index=0;
let renderIndex=0;
const CHUNK=120;

/* LOAD */
async function load(){
  const r=await fetch(PLAYLIST);
  const t=await r.text();

  list=parseM3U(t);

  buildGroups();
  applyFilters();
}

/* PARSE */
function parseM3U(t){
  const lines=t.split("\n");
  let out=[],item=null;

  for(let l of lines){
    if(l.startsWith("#EXTINF")){
      item={
        name:l.split(",").pop(),
        group:(l.match(/group-title="([^"]+)"/)||[])[1]||"Other"
      };
    }
    else if(item && l.startsWith("http")){
      item.url=l.trim();
      out.push(item);
      item=null;
    }
  }
  return out;
}

/* GROUPS */
function buildGroups(){
  const set=new Set();

  list.forEach(s=>set.add(s.group));

  const menu=document.getElementById("groupMenu");
  menu.innerHTML="";

  [...set].sort().forEach(g=>{
    const d=document.createElement("div");
    d.textContent=g;
    d.onclick=()=>{
      filtered=list.filter(x=>x.group===g);
      render(true);
    };
    menu.appendChild(d);
  });
}

/* FILTER */
function applyFilters(){
  const q=document.getElementById("search").value.toLowerCase();

  filtered=list.filter(s=>
    s.name.toLowerCase().includes(q)
  );

  render(true);
}

/* RENDER SAFE */
function render(reset){
  const el=document.getElementById("list");

  if(reset){
    el.innerHTML="";
    renderIndex=0;
  }

  const slice=filtered.slice(renderIndex,renderIndex+CHUNK);

  slice.forEach((s,i)=>{
    const real=renderIndex+i;

    el.innerHTML+=`
      <div class="card" onclick="play(${real})">
        <b>${s.name}</b><br/>
        <small>${s.group}</small>
      </div>
    `;
  });

  renderIndex+=CHUNK;
}

/* SCROLL SAFE */
document.getElementById("list").onscroll=(e)=>{
  if(e.target.scrollTop+e.target.clientHeight>=e.target.scrollHeight-100){
    render(false);
  }
};

/* FIXED HLS PLAY */
function playMedia(url){
  const v=document.getElementById("video");

  if(window.Hls && Hls.isSupported()){

    if(window.hls) window.hls.destroy();

    window.hls=new Hls({
      enableWorker:true,
      lowLatencyMode:true
    });

    window.hls.loadSource(url);
    window.hls.attachMedia(v);

    window.hls.on(Hls.Events.MANIFEST_PARSED,()=>{
      v.play();
    });

  }else{
    v.src=url;
    v.play();
  }
}

/* PLAY */
function play(i){
  index=i;
  const s=filtered[i];
  if(!s) return;

  document.getElementById("now").innerText=s.name;
  playMedia(s.url);
}

/* CONTROLS */
function next(){
  index=(index+1)%filtered.length;
  play(index);
}

function prev(){
  index=(index-1+filtered.length)%filtered.length;
  play(index);
}

function toggle(){
  const v=document.getElementById("video");
  v.paused?v.play():v.pause();
}

/* START */
load();

</script>
</body>
</html>
