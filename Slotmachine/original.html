import sys
import asyncio
import platform
import json
from pathlib import Path



async def custom_site():

    import embed


    # Obvyris background
    platform.document.body.style.background = "#09111d"


    platform.window.transfer.hidden = True
    platform.window.canvas.style.visibility = "visible"



    bundle = "slotmachine"


    appdir = Path(f"/data/data/{bundle}")

    appdir.mkdir()



    if platform.window.location.host.find('.itch.zone')>0:

        import zipfile

        async with platform.fopen(
            "slotmachine.apk",
            "rb"
        ) as archive:

            with zipfile.ZipFile(archive) as zip_ref:

                zip_ref.extractall(
                    appdir.as_posix()
                )


    else:

        import tarfile


        async with platform.fopen(
            "slotmachine.tar.gz",
            "rb"
        ) as archive:


            tar = tarfile.open(
                fileobj=archive,
                mode="r:gz"
            )


            tar.extractall(
                path=appdir.as_posix(),
                filter='tar'
            )


            tar.close()



    platform.run_main(
        PyConfig,
        loaderhome=appdir / "assets",
        loadermain=None
    )



    while embed.counter()<0:

        await asyncio.sleep(.1)



    main = appdir / "assets" / "main.py"



    if not platform.window.MM.UME:


        __import__(__name__).__file__ = main


        msg = (
            "Ready to start!\n"
            "Please click/touch page"
        )


        platform.window.infobox.innerText = msg



        while not platform.window.MM.UME:

            await asyncio.sleep(.1)




    await TopLevel_async_handler.start_toplevel(
        platform.shell,
        console=window.python.config.debug
    )



    __import__(__name__).__file__ = main



    def ui_callback(pkg):

        platform.window.infobox.innerText = (
            f"Loading {pkg}"
        )



    await shell.source(
        main,
        callback=ui_callback
    )



    platform.window.infobox.style.display = "none"


    platform.window.config.gui_divider = 1

    platform.window.window_resize()


    print(
        "Game Obvyris loaded"
    )


    shell.interactive()



asyncio.run(custom_site())

function show_infobox() {

    infobox.style.display = "block";

    const w = infobox.offsetWidth;
    const h = infobox.offsetHeight;

    const left =
        (window.innerWidth - w) / 2;

    const top =
        (window.innerHeight - h) / 2;


    infobox.style.left = left + "px";
    infobox.style.top = top + "px";

}
