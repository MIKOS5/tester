<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gear Inventory</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    font-family:"Inter",Arial,sans-serif;
    background:#0f172a;
    color:white;
}


/* Top area */

.inventory-header{
    margin-bottom:20px;
}

.inventory-header h1{
    margin:0;
    font-size:26px;
}

.inventory-header p{
    margin-top:6px;
    color:#94a3b8;
}


/* Search */

.search-box{
    display:flex;
    margin-bottom:20px;
}

#searchInput{

    width:100%;
    padding:14px 18px;

    background:#1e293b;
    color:white;

    border:1px solid rgba(255,255,255,.1);
    border-radius:14px;

    font-size:15px;

    outline:none;

}


#searchInput:focus{

    border-color:#2563eb;
    box-shadow:0 0 15px rgba(37,99,235,.4);

}


/* Inventory */

#inventoryList{
    display:flex;
    flex-direction:column;
    gap:12px;
}


.item-row{

    background:#111827;

    border:1px solid rgba(255,255,255,.08);

    border-radius:16px;

    overflow:hidden;

    box-shadow:0 10px 25px rgba(0,0,0,.25);

}



/* Item header */

.item-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:16px 18px;

    background:linear-gradient(
        135deg,
        #1e293b,
        #172554
    );

    cursor:pointer;

}


.item-header span{

    font-weight:600;
    font-size:16px;

}


.item-header:hover{

    background:#1e40af;

}



/* Button */

.expand-button{

    background:#2563eb;

    border:none;

    color:white;

    padding:8px 14px;

    border-radius:10px;

    cursor:pointer;

    font-weight:600;

    transition:.2s;

}


.expand-button:hover{

    transform:scale(1.05);

    background:#3b82f6;

}



/* Details */


.item-details{

    display:none;

    padding:18px;

    background:#0b1220;

}


.detail-row{

    padding:8px 0;

    border-bottom:1px solid rgba(255,255,255,.06);

    display:flex;

    gap:10px;

    flex-wrap:wrap;

}


.detail-row:last-child{

    border-bottom:none;

}


.key{

    color:#60a5fa;

    font-weight:700;

    min-width:180px;

}


.value{

    color:#e5e7eb;

    flex:1;

}



/* Loading */

#status{

    color:#94a3b8;

    padding:20px;

    text-align:center;

}



/* Mobile */

@media(max-width:600px){

body{

    padding:12px;

}


.key{

    min-width:100%;

}


.item-header{

    padding:14px;

}


}

</style>

</head>


<body>


<div class="inventory-header">

<h1>📦 Gear Inventory</h1>

<p>Browse, search, and manage restored equipment</p>

</div>



<div class="search-box">

<input 
type="text"
id="searchInput"
placeholder="Search inventory..."
>

</div>



<div id="status">
Loading inventory...
</div>


<div id="inventoryList"></div>



<script>


const csvFilePath =
'https://script.google.com/macros/s/AKfycbw2ygas7GeNtrOUSVo2L8xMe3pHHyYZmHS936xmude6D70z6byyFnIaQtd1aOqSPl-ueg/exec';



const headers=[

"Timestamp",
"Item Name",
"Category",
"Brand",
"Model/Series",
"SKU/Item Number",
"Condition",
"Description",
"Purchase Date",
"Source",
"Purchase Price",
"Unique ID",
"Restoration Costs",
"Restoration Date",
"Technician/Restorer",
"Notes on Modifications or Repairs",
"Stock Level",
"Location",
"Date",
"Promo",
"Weight",
"Notes",
"Selling Price",
"Date Sold",
"Sales Channel",
"Customer Name/ID",
"Transaction ID",
"Payment Method",
"Special Notes"

];



// Better CSV parser
function parseCSVRow(row){

let result=[];
let current="";
let insideQuotes=false;


for(let char of row){

if(char=='"'){

insideQuotes=!insideQuotes;

}

else if(char==',' && !insideQuotes){

result.push(current);
current="";

}

else{

current+=char;

}

}

result.push(current);

return result;

}



function parseCSV(data){


const rows=data.split(/\r?\n/);

const list=document.getElementById("inventoryList");

const status=document.getElementById("status");


list.innerHTML="";


rows.slice(1).forEach(row=>{


const cols=parseCSVRow(row);


if(cols.length>1){


let itemName=
(cols[1]||"Unnamed Item")
.replace(/"/g,'')
.trim();



const item=document.createElement("div");

item.className="item-row";



const header=document.createElement("div");

header.className="item-header";


header.innerHTML=

`

<span>${itemName}</span>

<button class="expand-button">
Expand ▼
</button>

`;



const details=document.createElement("div");

details.className="item-details";



cols.forEach((cell,index)=>{


if(headers[index]){


details.innerHTML+=

`

<div class="detail-row">

<div class="key">
${headers[index]}
</div>

<div class="value">
${cell.replace(/"/g,'').trim()}
</div>

</div>

`;

}


});



header.querySelector("button")
.onclick=()=>{


const open=
details.style.display==="block";


details.style.display=
open ? "none":"block";


header.querySelector("button")
.textContent=
open ? "Expand ▼":"Collapse ▲";


};



item.appendChild(header);

item.appendChild(details);


list.appendChild(item);


}



});


status.style.display="none";


}



// Search

document
.getElementById("searchInput")
.addEventListener("input",function(){


let filter=
this.value.toLowerCase();


document
.querySelectorAll(".item-row")
.forEach(row=>{


let name=
row.querySelector(".item-header span")
.textContent
.toLowerCase();


row.style.display=
name.includes(filter)
?
""
:
"none";


});


});





fetch(csvFilePath)

.then(r=>r.text())

.then(data=>parseCSV(data))

.catch(err=>{

document.getElementById("status").innerHTML=
"❌ Failed loading inventory";

console.error(err);

});


</script>


</body>
</html>
