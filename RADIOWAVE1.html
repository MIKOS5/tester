<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>📻 MISC Stations</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"/>

<style>

:root{
  --bg:#09111d;
  --panel:#111827;
  --line:#253347;
  --text:#fff;
  --muted:#93a4bb;
  --blue:#2793ff;
  --green:#17c964;
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:Inter,sans-serif;
  background:radial-gradient(circle at top,#17263f,#09111d 45%);
  color:white;
  display:flex;
  height:100vh;
  overflow:hidden;
}

/* SIDEBAR */
.sidebar{
  width:340px;
  background:rgba(17,24,39,.95);
  border-right:1px solid var(--line);
  padding:20px;
  overflow:auto;
}

.logo{
  font-size:28px;
  font-weight:800;
}
.logo span{color:var(--blue);}

.subtitle{
  color:var(--muted);
  font-size:13px;
  margin-bottom:20px;
}

/* GENRES */
.genre-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.genre{
  padding:12px;
  border-radius:14px;
  background:#0e1725;
  border:1px solid #1e293b;
  text-align:center;
  cursor:pointer;
  font-weight:700;
  transition:.15s;
}

.genre:hover{
  border-color:var(--blue);
  transform:translateY(-2px);
}

.genre.active{
  background:var(--blue);
}

/* PLAYER */
.player{
  margin-top:20px;
  padding:16px;
  border-radius:20px;
  background:#121a2a;
  border:1px solid var(--line);
}

.now{font-weight:700;}
.meta{font-size:12px;color:var(--muted);}

.controls{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:12px;
}

button{
  border:none;
  border-radius:12px;
  padding:10px;
  background:linear-gradient(180deg,#2793ff,#1869d9);
  color:white;
  font-weight:700;
  cursor:pointer;
}

/* MAIN */
.main{
  flex:1;
  padding:20px;
  overflow:auto;
}

.title{
  font-size:26px;
  font-weight:800;
  margin-bottom:10px;
}

.card{
  background:rgba(17,24,39,.95);
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px;
  margin-bottom:10px;
}

.station{font-weight:700;}
.small{font-size:12px;color:var(--muted);}

.row{
  display:flex;
  gap:10px;
  margin-top:10px;
}

/* FAVORITE BUTTON */
.fav-btn{
  background:linear-gradient(180deg,#444,#222);
}

.fav-btn.saved{
  background:linear-gradient(180deg,#17c964,#0ea85a);
}

/* MOBILE */
@media(max-width:900px){
  body{flex-direction:column;height:auto;}
  .sidebar{width:100%;}
}

</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

  <div class="logo">📻 MISC <span>Stations</span></div>
  <div class="subtitle">Live radio • genres • favorites</div>

  <div class="genre-grid">
    <div class="genre" onclick="setGenre('rock')">🎸 Rock</div>
    <div class="genre" onclick="setGenre('pop')">🎤 Pop</div>
    <div class="genre" onclick="setGenre('jazz')">🎷 Jazz</div>
    <div class="genre" onclick="setGenre('hip hop')">🔥 Hip Hop</div>
    <div class="genre" onclick="setGenre('electronic')">🎛 Electronic</div>
    <div class="genre" onclick="setGenre('classical')">🎻 Classical</div>
    <div class="genre" onclick="setGenre('country')">🤠 Country</div>
    <div class="genre" onclick="loadFavorites()">⭐ Favorites</div>
  </div>

  <div class="player">

    <div class="now" id="npName">Not Playing</div>
    <div class="meta" id="npMeta">Select station</div>

    <audio id="audio"></audio>

    <div class="controls">
      <button onclick="prev()">⏮</button>
      <button onclick="toggle()">▶</button>
      <button onclick="next()">⏭</button>
      <button onclick="favCurrent()">⭐</button>
    </div>

  </div>

</div>

<!-- MAIN -->
<div class="main">

  <div class="title" id="title">Stations</div>

  <div id="list"></div>

</div>

<script>

/* API */
const RADIO =
"https://all.api.radio-browser.info/json/stations/search";

const SHEET =
"https://script.google.com/macros/s/AKfycbzZ5MwOcYUY_bpsUKSxPd810xE8rV_Y3z2GwzPublb_4O60CP8L_lC_V2kqkCQ_JdF5/exec";

/* STATE */
let current=[];
let index=0;
let favorites=new Set();

/* =========================
   🔥 FIXED GENRE FUNCTION
========================= */
function getGenre(s){
  return (s.tags?.trim())
    || (s.genre?.trim())
    || "Radio";
}

/* LOAD */
async function load(g=""){

  let url =
    `${RADIO}?limit=500&hidebroken=true&countrycode=US`;

  if(g){
    url += `&tag=${encodeURIComponent(g)}`;
  }

  const res = await fetch(url);
  current = await res.json();

  render();
  setTitle(g || "US Stations");
}

/* FAVORITES LOAD */
async function loadFavorites(){

  const res = await fetch(SHEET + "?action=get");
  const data = await res.json().catch(()=>[]);

  const list = data.data || data;

  current = list;

  favorites = new Set(
    list.map(s => s.stationuuid || s.id)
  );

  render();
  setTitle("⭐ Favorites");
}

/* FAVORITE TOGGLE */
async function fav(s){

  const id = s.stationuuid || s.id;
  if(!id) return;

  const exists = favorites.has(id);

  if(exists){

    await fetch(SHEET,{
      method:"POST",
      body:new URLSearchParams({
        action:"delete",
        id:id
      })
    });

    favorites.delete(id);
    setTitle("Removed ⭐");
    render();
    return;
  }

  await fetch(SHEET,{
    method:"POST",
    body:new URLSearchParams({
      action:"save",
      id:id,
      name:s.name || "",
      url:s.url_resolved || s.url || "",
      country:s.country || "",
      genre:getGenre(s),
      time:new Date().toISOString()
    })
  });

  favorites.add(id);
  setTitle("Saved ⭐");
  render();
}

/* PLAY */
function play(i){

  index = i;

  const s = current[i];

  const audio = document.getElementById("audio");

  audio.src = s.url_resolved || s.url;
  audio.play();

  document.getElementById("npName").innerText = s.name;

  document.getElementById("npMeta").innerText =
    `${s.country || ""} • ${getGenre(s)}`;
}

/* CONTROLS */
function toggle(){
  const a = document.getElementById("audio");
  if(a.paused) a.play();
  else a.pause();
}

function next(){
  index = (index + 1) % current.length;
  play(index);
}

function prev(){
  index = (index - 1 + current.length) % current.length;
  play(index);
}

/* CURRENT FAVORITE */
function favCurrent(){
  const s = current[index];
  if(!s) return;
  fav(s);
}

/* RENDER */
function render(){

  const el = document.getElementById("list");
  el.innerHTML = "";

  current.forEach((s,i)=>{

    const id = s.stationuuid || s.id;
    const isFav = favorites.has(id);

    el.innerHTML += `
      <div class="card">
        <div class="station">${s.name}</div>

        <!-- ✅ FIXED GENRE DISPLAY -->
        <div class="small">${getGenre(s)} • ${s.country || ""}</div>

        <div class="row">
          <button onclick="play(${i})">▶ Play</button>

          <button class="fav-btn ${isFav ? "saved" : ""}"
            onclick='fav(${JSON.stringify(s)})'>
            ${isFav ? "⭐ Saved" : "☆ Favorite"}
          </button>

        </div>
      </div>
    `;
  });
}

/* GENRE */
function setGenre(g){

  document.querySelectorAll(".genre")
    .forEach(x => x.classList.remove("active"));

  event.target.classList.add("active");

  load(g);
}

/* TITLE */
function setTitle(t){
  document.getElementById("title").innerText = t;
}

/* INIT */
load();

</script>

</body>
</html>
