<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>📻 RadioWave Pro</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>

<style>

:root{
  --bg:#09111d;
  --panel:#111827;
  --panel2:#182233;
  --line:#253347;
  --text:#ffffff;
  --muted:#93a4bb;
  --blue:#2793ff;
  --blue2:#1869d9;
  --green:#17c964;
  --shadow:0 10px 30px rgba(0,0,0,.35);
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:Inter,sans-serif;
  background:radial-gradient(circle at top,#17263f,#09111d 45%);
  color:white;
  display:flex;
  height:100vh;
  overflow:hidden;
}

/* SIDEBAR */
.sidebar{
  width:330px;
  background:rgba(17,24,39,.92);
  backdrop-filter:blur(16px);
  border-right:1px solid var(--line);
  padding:22px;
  overflow:auto;
  box-shadow:var(--shadow);
}

.logo{font-size:32px;font-weight:800;letter-spacing:-1px;}
.logo span{color:var(--blue);}
.subtitle{color:var(--muted);font-size:13px;margin:4px 0 24px;}

.search{
  width:100%;
  border:none;
  outline:none;
  background:#0e1725;
  color:white;
  padding:14px;
  border-radius:16px;
  border:1px solid #1e293b;
}

button{
  border:none;
  border-radius:14px;
  padding:13px 14px;
  color:white;
  font-weight:700;
  cursor:pointer;
  background:linear-gradient(180deg,var(--blue),var(--blue2));
  box-shadow:0 5px 18px rgba(0,0,0,.25);
}

.main-btn{width:100%;margin-top:12px;}

.grid-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:12px;
}

/* PLAYER */
.radio-player{
  margin-top:24px;
  padding:18px;
  border-radius:24px;
  background:linear-gradient(180deg,#182233,#121926);
  border:1px solid #263246;
  box-shadow:var(--shadow);
  position:relative;
  overflow:hidden;
}

/* 🎧 VISUALIZER GLOW BACKGROUND */
.radio-player::before{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(circle at center, rgba(39,147,255,.25), transparent 70%);
  animation:pulseBG 3s infinite;
  pointer-events:none;
}

@keyframes pulseBG{
  0%{transform:scale(1);opacity:.5;}
  50%{transform:scale(1.2);opacity:.8;}
  100%{transform:scale(1);opacity:.5;}
}

/* 🎧 CANVAS VISUALIZER */
#visualizer{
  width:100%;
  height:60px;
  display:block;
  margin-top:12px;
  border-radius:12px;
  background:rgba(0,0,0,.25);
}

.player-header{
  display:flex;
  align-items:center;
  gap:14px;
}

.station-icon{
  width:60px;height:60px;
  border-radius:18px;
  background:linear-gradient(135deg,var(--blue),#6857ff);
  display:flex;align-items:center;justify-content:center;
  font-size:28px;
}

#npName{font-size:16px;font-weight:700;}
#npMeta{font-size:12px;color:var(--muted);}

.live{
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:10px;
  color:var(--green);
  font-size:12px;
  font-weight:700;
}

.live-dot{
  width:8px;height:8px;
  border-radius:50%;
  background:var(--green);
  animation:pulse 1.5s infinite;
}

@keyframes pulse{
  0%{transform:scale(1);opacity:1;}
  50%{transform:scale(1.7);opacity:.5;}
  100%{transform:scale(1);opacity:1;}
}

.controls{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-top:18px;
}

.volume{margin-top:18px;}
.volume label{color:var(--muted);font-size:12px;}

.main{flex:1;padding:24px;overflow:auto;}

.table-wrap{
  border-radius:26px;
  border:1px solid var(--line);
  background:rgba(17,24,39,.92);
  box-shadow:var(--shadow);
}

table{width:100%;border-collapse:collapse;}
th{background:#0f1725;color:#8eb5ff;padding:18px;font-size:12px;text-transform:uppercase;}
td{padding:18px;border-top:1px solid #1d2938;}

.tags{color:var(--muted);font-size:13px;}

</style>
</head>

<body>

<div class="sidebar">

  <div class="logo">📻 Radio<span>Wave</span></div>
  <div class="subtitle">Live streaming radio dashboard</div>

  <input id="genre" class="search" placeholder="Search by genre..." />

  <button class="main-btn" onclick="applyFilter()">🔎 Search Stations</button>

  <div class="grid-buttons">
    <button onclick="prevPage()">⬅ Prev</button>
    <button onclick="nextPage()">Next ➜</button>
    <button onclick="loadStations()">🔄 Refresh</button>
    <button onclick="loadFavorites()">⭐ Favorites</button>
  </div>

  <!-- PLAYER -->
  <div class="radio-player">

    <div class="player-header">
      <div class="station-icon">📻</div>
      <div>
        <div id="npName">Not Playing</div>
        <div id="npMeta">Select a station</div>
        <div class="live"><div class="live-dot"></div>LIVE RADIO</div>
      </div>
    </div>

    <audio id="player"></audio>

    <!-- 🎧 VISUALIZER ADDED -->
    <canvas id="visualizer"></canvas>

    <div class="controls">
      <button onclick="prevStation()">⏮</button>
      <button id="playBtn" onclick="togglePlay()">▶</button>
      <button onclick="nextStation()">⏭</button>
      <button onclick="toggleFavCurrent()">⭐</button>
    </div>

    <div class="volume">
      <label>Volume</label>
      <input type="range" min="0" max="1" step="0.01" value="1"
        onchange="setVolume(this.value)" />
    </div>

  </div>

</div>

<div class="main">
  <h2>United States Radio</h2>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Station</th>
          <th>Genre</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</div>

<script>

/* =========================
   AUDIO VISUALIZER
========================= */

let audioCtx;
let analyser;
let source;
let dataArray;
let canvas, ctx;

function initVisualizer(){

  const audio = document.getElementById("player");
  canvas = document.getElementById("visualizer");
  ctx = canvas.getContext("2d");

  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  analyser = audioCtx.createAnalyser();

  source = audioCtx.createMediaElementSource(audio);
  source.connect(analyser);
  analyser.connect(audioCtx.destination);

  analyser.fftSize = 64;
  dataArray = new Uint8Array(analyser.frequencyBinCount);

  draw();
}

function draw(){

  requestAnimationFrame(draw);

  if(!analyser) return;

  analyser.getByteFrequencyData(dataArray);

  ctx.clearRect(0,0,canvas.width,canvas.height);

  const barWidth = (canvas.width / dataArray.length);

  let x = 0;

  for(let i=0;i<dataArray.length;i++){

    let barHeight = dataArray[i] / 2;

    ctx.fillStyle = "#2793ff";
    ctx.fillRect(x, canvas.height - barHeight, barWidth - 2, barHeight);

    x += barWidth;
  }
}

/* INIT ON FIRST PLAY */
let visualizerReady = false;

function ensureVisualizer(){
  if(!visualizerReady){
    initVisualizer();
    visualizerReady = true;
  }
}

/* =========================
   ORIGINAL LOGIC (UNCHANGED CORE)
========================= */

const API="https://all.api.radio-browser.info/json/stations/search";
let stations=[],allStations=[],currentList=[],currentIndex=-1,page=0;
const limit=50;
let isPlaying=false;

async function loadStations(){
  const res=await fetch(`${API}?countrycode=US&limit=${limit}&offset=${page*limit}&hidebroken=true`);
  const data=await res.json();
  stations=data;
  allStations=[...data];
  currentList=stations;
  render();
}

function playStation(id){

  ensureVisualizer(); // 🎧 HOOK

  const item=currentList.find(s=>s.stationuuid===id||s.id===id);
  currentIndex=currentList.findIndex(s=>s.stationuuid===id||s.id===id);

  const player=document.getElementById("player");
  player.src=item.url_resolved||item.url||"";
  player.play();

  isPlaying=true;
  document.getElementById("playBtn").textContent="⏸";

  document.getElementById("npName").textContent=item.name;
  document.getElementById("npMeta").textContent=item.tags||"Radio";
}

function togglePlay(){
  const p=document.getElementById("player");
  if(isPlaying){p.pause();isPlaying=false;}
  else{p.play();isPlaying=true;}
}

function setVolume(v){
  document.getElementById("player").volume=v;
}

function render(){
  const t=document.getElementById("tableBody");
  t.innerHTML="";
  currentList.forEach(s=>{
    const id=s.stationuuid||s.id;
    t.innerHTML+=`
      <tr>
        <td>${s.name}</td>
        <td>${s.tags||"Radio"}</td>
        <td><button onclick="playStation('${id}')">▶</button></td>
      </tr>`;
  });
}

loadStations();

</script>

</body>
</html>
