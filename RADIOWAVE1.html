<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>📻 RadioWave Pro</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"/>

<style>

:root{
  --bg:#09111d;
  --panel:#111827;
  --line:#253347;
  --text:#fff;
  --muted:#93a4bb;
  --blue:#2793ff;
  --green:#17c964;
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:Inter,sans-serif;
  background:radial-gradient(circle at top,#17263f,#09111d 45%);
  color:white;
  display:flex;
  height:100vh;
  overflow:hidden;
}

/* SIDEBAR */
.sidebar{
  width:340px;
  background:rgba(17,24,39,.95);
  border-right:1px solid var(--line);
  padding:20px;
  overflow:auto;
}

.logo{font-size:28px;font-weight:800;}
.logo span{color:var(--blue);}
.subtitle{color:var(--muted);font-size:13px;margin-bottom:20px;}

/* GENRES */
.genre-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:10px;
}

.genre{
  padding:12px;
  border-radius:14px;
  background:#0e1725;
  border:1px solid #1e293b;
  text-align:center;
  cursor:pointer;
  font-weight:700;
  transition:.15s;
}

.genre:hover{
  border-color:var(--blue);
  transform:translateY(-2px);
}

.genre.active{
  background:var(--blue);
}

/* PLAYER */
.player{
  margin-top:20px;
  padding:16px;
  border-radius:20px;
  background:#121a2a;
  border:1px solid var(--line);
}

.now{
  font-weight:700;
}

.meta{
  font-size:12px;
  color:var(--muted);
}

.controls{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:12px;
}

button{
  border:none;
  border-radius:12px;
  padding:10px;
  background:linear-gradient(180deg,#2793ff,#1869d9);
  color:white;
  font-weight:700;
  cursor:pointer;
}

/* MAIN */
.main{
  flex:1;
  padding:20px;
  overflow:auto;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.title{font-size:26px;font-weight:800;}

.card{
  background:rgba(17,24,39,.95);
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px;
  margin-bottom:10px;
}

.station{
  font-weight:700;
}

.small{
  font-size:12px;
  color:var(--muted);
}

.row{
  display:flex;
  gap:10px;
  margin-top:10px;
}

/* MOBILE */
@media(max-width:900px){
  body{flex-direction:column;height:auto;}
  .sidebar{width:100%;}
}

</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

  <div class="logo">📻 Radio<span>Wave</span></div>
  <div class="subtitle">Spotify-style radio streaming</div>

  <div class="genre-grid">
    <div class="genre" onclick="setGenre('rock')">🎸 Rock</div>
    <div class="genre" onclick="setGenre('pop')">🎤 Pop</div>
    <div class="genre" onclick="setGenre('jazz')">🎷 Jazz</div>
    <div class="genre" onclick="setGenre('hip hop')">🔥 Hip Hop</div>
    <div class="genre" onclick="setGenre('electronic')">🎛 Electronic</div>
    <div class="genre" onclick="setGenre('classical')">🎻 Classical</div>
    <div class="genre" onclick="setGenre('country')">🤠 Country</div>
    <div class="genre" onclick="loadTrending()">📈 Trending</div>
  </div>

  <div class="player">

    <div class="now" id="npName">Not Playing</div>
    <div class="meta" id="npMeta">Select a station</div>

    <audio id="audio"></audio>

    <div class="controls">
      <button onclick="prev()">⏮</button>
      <button onclick="toggle()">▶</button>
      <button onclick="next()">⏭</button>
      <button onclick="fav()">⭐</button>
    </div>

  </div>

</div>

<!-- MAIN -->
<div class="main">

  <div class="top">
    <div class="title" id="title">Stations</div>
  </div>

  <div id="list"></div>

</div>

<script>

/* APIs */
const RADIO =
"https://all.api.radio-browser.info/json/stations/search";

const SHEET =
"https://script.google.com/macros/s/AKfycbzZ5MwOcYUY_bpsUKSxPd810xE8rV_Y3z2GwzPublb_4O60CP8L_lC_V2kqkCQ_JdF5/exec";

/* STATE */
let stations=[];
let current=[];
let index=0;
let genre="";
let playing=false;
let favorites=new Set();

/* LOAD */
async function load(g=""){

  genre=g;

  let url=
  `${RADIO}?limit=60&hidebroken=true`;

  if(g){
    url+=`&tag=${encodeURIComponent(g)}`;
  }else{
    url+=`&countrycode=US`;
  }

  const res=await fetch(url);
  const data=await res.json();

  stations=data;
  current=data;

  render();
  setTitle(g||"US Stations");
}

/* TRENDING */
async function loadTrending(){

  const res=await fetch(
    `${RADIO}?order=votes&reverse=true&limit=60`
  );

  stations=await res.json();
  current=stations;

  render();
  setTitle("Trending");
}

/* RENDER */
function render(){

  const el=document.getElementById("list");
  el.innerHTML="";

  current.forEach((s,i)=>{

    el.innerHTML+=`
    <div class="card">
      <div class="station">${s.name}</div>
      <div class="small">
        ${(s.tags||"Radio")} • ${s.country||""}
      </div>

      <div class="row">
        <button onclick="play(${i})">▶ Play</button>
        <button onclick="save('${s.stationuuid}')">⭐</button>
      </div>
    </div>
    `;
  });

}

/* PLAY */
function play(i){

  index=i;

  const s=current[i];

  const audio=document.getElementById("audio");

  audio.src=s.url_resolved||s.url;
  audio.play();

  playing=true;

  document.getElementById("npName").innerText=s.name;
  document.getElementById("npMeta").innerText=
    `${s.country||""} • ${s.tags||"Radio"}`;

}

/* CONTROLS */
function toggle(){
  const a=document.getElementById("audio");

  if(!a.src) return;

  if(playing){
    a.pause();
    playing=false;
  }else{
    a.play();
    playing=true;
  }
}

function next(){
  index=(index+1)%current.length;
  play(index);
}

function prev(){
  index=(index-1+current.length)%current.length;
  play(index);
}

/* FAVORITES */
async function save(id){

  await fetch(SHEET,{
    method:"POST",
    body:new URLSearchParams({
      action:"save",
      id
    })
  });

}

/* GENRE UI */
function setGenre(g){

  document.querySelectorAll(".genre")
  .forEach(x=>x.classList.remove("active"));

  event.target.classList.add("active");

  load(g);
}

/* INIT */
load();

</script>

</body>
</html>
