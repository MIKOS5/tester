<!DOCTYPE html>
<html lang="en">
<head>

<style>
/* ====== ALL YOUR CSS UNCHANGED ====== */
:root{
  --bg:#09111d;
  --panel:#111827;
  --panel2:#182233;
  --line:#253347;
  --text:#ffffff;
  --muted:#93a4bb;
  --blue:#2793ff;
  --blue2:#1869d9;
  --green:#17c964;
  --shadow:0 10px 30px rgba(0,0,0,.35);
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:Inter,sans-serif;
  background:radial-gradient(circle at top,#17263f,#09111d 45%);
  color:white;
  display:flex;
  height:100vh;
  overflow:hidden;
}

/* (ALL YOUR CSS REMAINS EXACTLY THE SAME — omitted for brevity in chat view but unchanged in use) */

</head>

<body>

<div class="sidebar">

  <div class="logo">📻 Radio<span>Wave</span></div>

  <div class="subtitle">Live streaming radio dashboard</div>

  <input id="genre" class="search" placeholder="Search by genre..."/>

  <button class="main-btn" onclick="applyFilter()">🔎 Search Stations</button>

  <div class="grid-buttons">
    <button onclick="prevPage()">⬅ Prev</button>
    <button onclick="nextPage()">Next ➜</button>
    <button onclick="loadStations()">🔄 Refresh</button>
    <button onclick="loadFavorites()">⭐ Favorites</button>
  </div>

  <div class="radio-player">
    <div class="player-header">
      <div class="station-icon">📻</div>
      <div>
        <div id="npName">Not Playing</div>
        <div id="npMeta">Select a station</div>
        <div class="live"><div class="live-dot"></div> LIVE RADIO</div>
      </div>
    </div>

    <audio id="player"></audio>

    <div class="controls">
      <button onclick="prevStation()">⏮</button>
      <button id="playBtn" onclick="togglePlay()">▶</button>
      <button onclick="nextStation()">⏭</button>
      <button onclick="toggleFavCurrent()">⭐</button>
    </div>

    <div class="volume">
      <label>Volume</label>
      <input type="range" min="0" max="1" step="0.01" value="1"
        onchange="setVolume(this.value)"/>
    </div>
  </div>

  <div class="status" id="status">Loading stations...</div>

</div>

<div class="main">

  <div class="topbar">
    <div>
      <div class="page-title">United States Radio</div>
      <div class="count" id="count">0 stations loaded</div>
    </div>

    <div class="page-box" id="pageInfo">Page 1</div>
  </div>

  <div class="table-wrap">
    <table id="table">
      <thead>
        <tr>
          <th>Station</th>
          <th>Genre</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div id="mobileList"></div>

</div>

<script>

/* =========================
   EVERYTHING ELSE UNCHANGED
========================= */

const API = "https://all.api.radio-browser.info/json/stations/search";
const SHEET_API = "https://script.google.com/macros/s/AKfycbzZ5MwOcYUY_bpsUKSxPd810xE8rV_Y3z2GwzPublb_4O60CP8L_lC_V2kqkCQ_JdF5/exec";

let stations = [];
let allStations = [];
let favorites = [];
let favoriteIds = new Set();
let currentList = [];
let currentIndex = -1;
let page = 0;
const limit = 50;
let isPlaying = false;

/* ===== ONLY CHANGE IS GENRE DISPLAY BELOW ===== */

function getGenre(s){
  return ((s.genre || s.tags) && (s.genre || s.tags).trim())
    ? (s.genre || s.tags)
    : "Unknown Genre";
}

/* =========================
   TABLE
========================= */

function renderTable(){

  const tbody = document.querySelector("#table tbody");
  tbody.innerHTML = "";

  currentList.forEach(s => {

    const id = s.stationuuid || s.id;
    const isFav = favoriteIds.has(id);

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>
        <div class="station">${s.name || "Unknown"}</div>
      </td>

      <td>
        <div class="tags">
          ${getGenre(s)}
        </div>
      </td>

      <td>
        <div class="actions">
          <button class="small-btn" onclick="playStation('${id}')">▶ Play</button>
          <button class="small-btn" onclick='toggleFavorite(${JSON.stringify(s)})'>
            ${isFav ? "⭐ Saved" : "☆ Favorite"}
          </button>
        </div>
      </td>
    `;

    tbody.appendChild(tr);
  });
}

/* =========================
   MOBILE
========================= */

function renderMobile(){

  const el = document.getElementById("mobileList");
  el.innerHTML = "";

  currentList.forEach(s => {

    const id = s.stationuuid || s.id;
    const isFav = favoriteIds.has(id);

    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <div class="card-title">${s.name || "Unknown"}</div>

      <div class="card-meta">
        ${getGenre(s)}
      </div>

      <div class="card-buttons">
        <button onclick="playStation('${id}')">▶ Play</button>
        <button onclick='toggleFavorite(${JSON.stringify(s)})'>
          ${isFav ? "⭐ Saved" : "☆ Favorite"}
        </button>
      </div>
    `;

    el.appendChild(div);
  });
}

function toggleFavCurrent(){ /* unchanged */ }
function applyFilter(){ /* unchanged */ }
function nextPage(){ /* unchanged */ }
function prevPage(){ /* unchanged */ }
function setVolume(v){ /* unchanged */ }
function setStatus(t){ document.getElementById("status").textContent = t; }

document.getElementById("genre").addEventListener("keydown", e=>{
  if(e.key==="Enter") applyFilter();
});

loadStations();

</script>

</body>
</html>
