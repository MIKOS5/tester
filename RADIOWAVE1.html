<head>

<style>

/* (YOUR EXISTING CSS — unchanged) */

:root{
  --bg:#09111d;
  --panel:#111827;

/* KEEP ALL YOUR ORIGINAL CSS HERE (UNCHANGED) */

/* =========================
   VISUALIZER OVERLAY (NEW)
========================= */

#visualizer{
  position:fixed;
  inset:0;
  background:radial-gradient(circle at center,#0b1220,#05070d);
  display:none;
  flex-direction:column;

</style>
</head>

<body>

<!-- =========================
   VISUALIZER PAGE (NEW)
========================= -->

<div id="visualizer">

  <div class="viz-topbar">

    <button class="viz-btn" onclick="toggleVisualizer()">
      ⬅ Exit Visual Mode
    </button>

    <div style="color:#93a4bb;font-weight:700;">
      🎧 Now Playing Visualizer
    </div>

  </div>

  <canvas id="vizCanvas"></canvas>

</div>

<!-- =========================
   SIDEBAR (UNCHANGED)
========================= -->

<div class="sidebar">

  <div class="logo">📻 Radio<span>Wave</span></div>
  <div class="subtitle">Live streaming radio dashboard</div>

  <input id="genre" class="search" placeholder="Search by genre..."/>

  <button class="main-btn" onclick="applyFilter()">🔎 Search Stations</button>

  <div class="grid-buttons">
    <button onclick="prevPage()">⬅ Prev</button>
    <button onclick="nextPage()">Next ➜</button>
    <button onclick="loadStations()">🔄 Refresh</button>
    <button onclick="loadFavorites()">⭐ Favorites</button>
  </div>

  <!-- PLAYER -->
  <div class="radio-player">

    <div class="player-header">
      <div class="station-icon">📻</div>

      <div>
        <div id="npName">Not Playing</div>
        <div id="npMeta">Select a station</div>

        <div class="live">
          <div class="live-dot"></div>
          LIVE RADIO
        </div>
      </div>
    </div>

    <audio id="player"></audio>

    <div class="controls">

      <button onclick="prevStation()">⏮</button>

      <button id="playBtn" onclick="togglePlay()">▶</button>

      <!-- NEW BUTTON -->
      <button onclick="toggleVisualizer()">🎧</button>

      <button onclick="nextStation()">⏭</button>

      <button onclick="toggleFavCurrent()">⭐</button>

    </div>

    <div class="volume">
      <label>Volume</label>
      <input type="range" min="0" max="1" step="0.01" value="1"
        onchange="setVolume(this.value)"/>
    </div>

  </div>

  <div class="status" id="status">Loading stations...</div>

</div>

<!-- =========================
   MAIN (UNCHANGED)
========================= -->

<div class="main">

  <div class="topbar">

    <div>
      <div class="page-title">United States Radio</div>
      <div class="count" id="count">0 stations loaded</div>
    </div>

    <div class="page-box" id="pageInfo">Page 1</div>

  </div>

  <div class="table-wrap">
    <table id="table">
      <thead>
        <tr>
          <th>Station</th>
          <th>Genre</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>
  </div>

  <div id="mobileList"></div>

</div>

<script>

/* =========================
   VISUALIZER ENGINE (NEW)
========================= */

let audioCtx;
let analyser;
let source;
let dataArray;
let vizCanvas = document.getElementById("vizCanvas");
let ctx = vizCanvas.getContext("2d");
let vizRunning = false;

function initAudioAnalyser(){

  const audio = document.getElementById("player");

  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;

    source = audioCtx.createMediaElementSource(audio);
    source.connect(analyser);
    analyser.connect(audioCtx.destination);

    dataArray = new Uint8Array(analyser.frequencyBinCount);
  }
}

function drawVisualizer(){

  if(!vizRunning) return;

  requestAnimationFrame(drawVisualizer);

  analyser.getByteFrequencyData(dataArray);

  ctx.clearRect(0,0,vizCanvas.width,vizCanvas.height);

  const width = vizCanvas.width;
  const height = vizCanvas.height;

  const barWidth = (width / dataArray.length) * 2;

  let x = 0;

  for(let i=0;i<dataArray.length;i++){

    let barHeight = dataArray[i];

    ctx.fillStyle = "rgba(39,147,255,0.8)";
    ctx.fillRect(x, height - barHeight, barWidth, barHeight);

    x += barWidth + 2;
  }
}

function resizeViz(){
  vizCanvas.width = window.innerWidth;
  vizCanvas.height = window.innerHeight;
}

window.addEventListener("resize", resizeViz);
resizeViz();

function toggleVisualizer(){

  const viz = document.getElementById("visualizer");

  if(!viz.classList.contains("active")){
    viz.classList.add("active");

    initAudioAnalyser();

    vizRunning = true;
    drawVisualizer();

  }else{
    viz.classList.remove("active");
    vizRunning = false;
  }
}

/* =========================
   YOUR ORIGINAL JS (UNCHANGED)
========================= */

/* (KEEP ALL YOUR ORIGINAL JS BELOW EXACTLY AS YOU HAD IT) */

const API = "https://all.api.radio-browser.info/json/stations/search";
const SHEET_API = "https://script.google.com/macros/s/AKfycbzZ5MwOcYUY_bpsUKSxPd810xE8rV_Y3z2GwzPublb_4O60CP8L_lC_V2kqkCQ_JdF5/exec";

let stations = [];
let allStations = [];
let favorites = [];
let favoriteIds = new Set();
let currentList = [];
let currentIndex = -1;
let page = 0;
const limit = 50;
let isPlaying = false;

/* KEEP ALL YOUR EXISTING FUNCTIONS BELOW EXACTLY SAME */
loadStations();

</script>

</body>
</html>
