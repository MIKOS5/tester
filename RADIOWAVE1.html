<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>xRadiowave</title>

<link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#2793ff">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Radiowave">

<link rel="icon" type="image/png" href="https://mikos5.github.io/tester/navicon.png">
<link rel="apple-touch-icon" href="https://mikos5.github.io/tester/navicon.png">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet"/>

<style>

:root{
  --bg:#09111d;
  --panel:#111827;
  --line:#253347;
  --text:#fff;
  --muted:#93a4bb;
  --blue:#2793ff;
  --green:#17c964;
}

/* 🌙 LIGHT MODE */
body.light{
  --bg:#ecd900;          /* vault beige / aged paper */
  --panel:#7EA3CF;       /* slightly warm white panels */
  --line:#d9caa3;        /* retro metal divider */
  --text:#f5c542;        /* dark terminal text (brown-black) */
  --muted:#7a6a55;       /* faded ink text */

  --blue:#f5c542;        /* Vault-Tec yellow (primary accent) */
  --green:#3ddc97;       /* CRT green (kept for "success") */

  --danger:#d64545;      /* warning red (optional use) */
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:Inter,sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;
  height:100vh;
  overflow:hidden;

  transition: background 0.3s, color 0.3s;
}

/* SIDEBAR */
.sidebar{
  width:340px;
  background:var(--panel);
  border-right:1px solid var(--line);
  padding:20px;
  overflow:auto;
}

.logo{
  font-size:28px;
  font-weight:800;
}
.logo span{color:var(--blue);}

.subtitle{
  color:var(--muted);
  font-size:13px;
  margin-bottom:20px;
}

/* GENRES */
.genre-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.genre{
  padding:12px;
  border-radius:14px;
  background:var(--panel);
  border:1px solid var(--line);
  text-align:center;
  cursor:pointer;
  font-weight:700;
  transition:.15s;
}

.genre:hover{
  border-color:var(--blue);
  transform:translateY(-2px);
}

.genre.active{
  background:var(--blue);
}

/* PLAYER */
.player{
  margin-top:20px;
  padding:16px;
  border-radius:20px;
  background:var(--panel);
  border:1px solid var(--line);
}

.now{font-weight:700;}
.meta{font-size:12px;color:var(--muted);}

.controls{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:12px;
}

button{
  border:none;
  border-radius:12px;
  padding:10px;
  background:linear-gradient(180deg,#2793ff,#1869d9);
  color:var(--text);
  font-weight:700;
  cursor:pointer;
}

/* MAIN */
.main{
  flex:1;
  padding:20px;
  overflow:auto;
}

.title{
  font-size:46px;
  font-weight:800;
  margin-bottom:10px;
}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:14px;
  margin-bottom:10px;
}

.station{
  font-weight:700;
  font-size:22px; /* <-- change this */
}
.small{font-size:12px;color:var(--muted);}

.row{
  display:flex;
  gap:10px;
  margin-top:10px;
}

/* FAVORITE BUTTON */
.fav-btn{
  background:linear-gradient(180deg,#444,#222);
}

.fav-btn.saved{
  background:linear-gradient(180deg,#17c964,#0ea85a);
}

/* MOBILE */
@media(max-width:900px){
  body{flex-direction:column;height:auto;}
  .sidebar{width:100%;}
}

::-webkit-scrollbar{
  width:10px;
}

::-webkit-scrollbar-track{
  background:transparent;
}

::-webkit-scrollbar-thumb{
  background:rgba(39,147,255,.7);
  border-radius:999px;
  backdrop-filter:blur(10px);
}

::-webkit-scrollbar-thumb:hover{
  background:rgba(39,147,255,1);
}

.dropdown {
  position: relative;
  user-select: none;
}

.dropdown-menu {
  display: none;
  position: absolute;
  left: 0;
  top: 100%;
  width: 100%;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  z-index: 999;
  overflow: hidden;
}

.dropdown-menu div {
  padding: 10px;
  cursor: pointer;
  font-weight: 600;
}

.dropdown-menu div:hover {
  background: #2793ff;
}

/* show on hover */
.dropdown:hover .dropdown-menu {
  display: block;
}

.genre-section {
  margin-top: 10px;
}

/* header bar */
.genre-header {
  padding: 12px;
  border-radius: 12px;
  background: var(--panel);
  border: 1px solid var(--line);
  font-weight: 800;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}

/* collapse animation */
.genre-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  max-height: 2000px;
  overflow: hidden;
  transition: max-height 0.3s ease, opacity 0.2s ease;
}

/* collapsed state */
.genre-grid.collapsed {
  max-height: 0;
  opacity: 0;
  pointer-events: none;
}

.action-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
  margin-top:12px;
}

.action-grid .genre{
  background:#0b1220;
  border:1px solid var(--line);
}

.action-grid{
  margin-bottom: 10px;
}

#backToTop{
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 9999;

  padding: 12px 14px;
  border-radius: 999px;

  background: linear-gradient(180deg,#2793ff,#1869d9);
  color: white;
  border: none;
  cursor: pointer;

  font-weight: 800;
  box-shadow: 0 10px 25px rgba(0,0,0,.4);

  opacity: 0;
  pointer-events: none;
  transition: 0.2s ease;
}

#backToTop.show{
  opacity: 1;
  pointer-events: auto;
}
</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">

  <div class="logo">📻Radio <span>Stations</span></div>
  <div class="subtitle">Live radio • genres • favorites</div>
  <div class="player">

    <div class="now" id="npName">Not Playing</div>
    <div class="meta" id="npMeta">Select station</div>

    <audio id="audio"></audio>

    <div class="controls">
      <button onclick="prev()">⏮</button>
      <button onclick="toggle()">▶</button>
      <button onclick="next()">⏭</button>
      <button onclick="favCurrent()">⭐</button>
    </div>

  </div>
  <div class="action-grid" id="actionGrid"></div>

<div class="action-grid">
  <div class="genre" onclick="toggleTheme()">🌙 Night / ☀️ Light</div>
</div>

<!-- GENRES SECTION -->
<div class="genre-section">

  <div class="genre-header" onclick="toggleGenres()">
    🎚 Genres <span id="genreArrow">▼</span>
  </div>

  <div class="genre-grid collapsed" id="genreGrid"></div>

</div>

</div>

<!-- MAIN -->
<div class="main">

  <div class="title" id="title">Stations</div>
  <div style="display:flex;gap:10px;margin-bottom:15px;">

  <select
    id="countryFilter"
    onchange="changeCountry()"
    style="
      padding:12px;
      border-radius:12px;
      background:var(--panel);
      color:var(--text);
      border:1px solid #253347;
    "
  >
    <option value="United States">🇺🇸 United States</option>
    <option value="Canada">🇨🇦 Canada</option>
    <option value="United Kingdom">🇬🇧 United Kingdom</option>
    <option value="Australia">🇦🇺 Australia</option>
    <option value="">🌎 All Countries</option>
  </select>

</div>
  <input
  type="text"
  id="searchBox"
  placeholder="🔎 Search stations..."
  oninput="render()"
  style="
    width:100%;
    padding:12px;
    margin-bottom:15px;
    border-radius:12px;
    border:1px solid var(--line);
    background:var(--panel);
    color:var(--text);
    font-size:16px;
  "
>

<div style="display:flex;gap:10px;margin-bottom:15px;">
  <button onclick="prevPage()">⬅ Prev</button>
  <button onclick="nextPage()">Next ➡</button>
</div>

  <div id="list"></div>

</div>

<script>

let currentGenre = "";
let filterMode = false;
let current = [];
let index = 0;
let favorites = new Set();
let page = 0;
const PAGE_SIZE = 500;
let currentCountry = "United States";
  
/* API */
const RADIO =
"https://all.api.radio-browser.info/json/stations/search";

const SHEET =
"https://script.google.com/macros/s/AKfycbzZ5MwOcYUY_bpsUKSxPd810xE8rV_Y3z2GwzPublb_4O60CP8L_lC_V2kqkCQ_JdF5/exec";


const GENRES = [
  { id:"50s", label:"📻 50s Hits" },
  { id:"60s", label:"🎙 60s Hits" },
  { id:"70s", label:"✌️ 70s Hits" },
  { id:"80s", label:"📼 80s Hits" },
  { id:"90s", label:"💿 90s Hits" },
  { id:"2000s", label:"📀 2000s Hits" },

  { id:"acoustic", label:"🎸 Acoustic" },
  { id:"afrobeats", label:"🌍 Afrobeats" },
  { id:"ambient", label:"🌫 Ambient" },
  { id:"alternative", label:"🎸 Alternative" },
  { id:"anime", label:"🌸 Anime Music" },

  { id:"blues", label:"🎺 Blues" },
  { id:"bollywood", label:"🎬 Bollywood" },
  { id:"bluegrass", label:"🪕 Bluegrass" },

  { id:"celtic", label:"☘️ Celtic" },
  { id:"chillout", label:"😌 Chillout" },
  { id:"christian", label:"✝️ Christian" },
  { id:"classical", label:"🎻 Classical" },
  { id:"comedy", label:"😂 Comedy" },
  { id:"country", label:"🤠 Country" },

  { id:"disco", label:"🪩 Disco" },
  { id:"drum and bass", label:"🥁 Drum & Bass" },
  { id:"dubstep", label:"💥 Dubstep" },

  { id:"edm", label:"⚡ EDM" },
  { id:"electronic", label:"🎛 Electronic" },
  { id:"experimental", label:"🧪 Experimental" },

  { id:"folk", label:"🪕 Folk" },
  { id:"funk", label:"🕺 Funk" },

  { id:"gospel", label:"🙏 Gospel" },
  { id:"grunge", label:"☔ Grunge" },

  { id:"hardstyle", label:"⚙️ Hardstyle" },
  { id:"hip hop", label:"🔥 Hip Hop" },
  { id:"holiday", label:"🎄 Holiday" },
  { id:"house", label:"🏠 House" },
  { id:"hits", label:"⭐ Hits" },

  { id:"indie", label:"🎧 Indie" },

  { id:"jazz", label:"🎷 Jazz" },
  { id:"jpop", label:"🇯🇵 J-Pop" },

  { id:"kids", label:"🧒 Kids" },
  { id:"kpop", label:"🇰🇷 K-Pop" },

  { id:"latin", label:"💃 Latin" },
  { id:"lofi", label:"🌙 Lo-Fi" },

  { id:"meditation", label:"🧘 Meditation" },
  { id:"metal", label:"🤘 Metal" },

  { id:"news", label:"📰 News" },
  { id:"oldies", label:"📻 Oldies" },

  { id:"pop", label:"🎤 Pop" },
  { id:"podcast", label:"🎧 Podcasts" },
  { id:"punk", label:"🤟 Punk" },

  { id:"rnb", label:"🎶 R&B" },
  { id:"reggae", label:"🌴 Reggae" },
  { id:"rock", label:"🎸 Rock" },

  { id:"soul", label:"💖 Soul" },
  { id:"soundtracks", label:"🎬 Soundtracks" },
  { id:"sports", label:"🏈 Sports Talk" },
  { id:"study", label:"📚 Study Beats" },
  { id:"swing", label:"🎷 Swing" },
  { id:"sleep", label:"😴 Sleep Music" },

  { id:"talk", label:"🎙 Talk Radio" },
  { id:"techno", label:"🔊 Techno" },
  { id:"top 40", label:"🔥 Top 40" },
  { id:"trance", label:"🌌 Trance" },

  { id:"video game", label:"🎮 Video Game Music" },

  { id:"workout", label:"💪 Workout" },
  { id:"world", label:"🌐 World Music" }
];

  function renderGenres(){

  const grid = document.getElementById("genreGrid");

  grid.innerHTML = GENRES.map(g => `
    <div class="genre" data-id="${g.id}">
      ${g.label}
    </div>
  `).join("");

  // prevent duplicate listeners
  if (!grid.dataset.bound) {
    grid.dataset.bound = "true";

    grid.addEventListener("click", (e) => {
      const item = e.target.closest(".genre");
      if (!item) return;

      const id = item.dataset.id;
      if (!id) return;

      document.querySelectorAll(".genre")
        .forEach(x => x.classList.remove("active"));

      item.classList.add("active");

      page = 0;
      currentGenre = id;
      load(id);
    });
  }

  // actions panel
  const actions = document.getElementById("actionGrid");

  actions.innerHTML = `
    <div class="genre" onclick="showAll()">📻 Show All</div>
    <div class="genre" onclick="loadFavorites()">⭐ Favorites</div>
    <div class="genre" onclick="loadMISC()">📻 MISC</div>
    <div class="genre" onclick="loadInternational()">🌎 International</div>
  `;
}
/* =========================
   🔥 FIXED GENRE FUNCTION
========================= */
function getGenre(s){
  return (s.tags?.trim())
    || (s.genre?.trim())
    || "Genre not listed - Radio";
}

/* LOAD */
async function load(g){

  currentGenre = g || "";
  filterMode = !!g;

  let url =
    `${RADIO}?hidebroken=true&order=clickcount&reverse=true`;

  // COUNTRY FILTER
  if(currentCountry){
    url += `&country=${encodeURIComponent(currentCountry)}`;
  }

  // GENRE MODE (FULL FILTER LOAD)
  if(g){
    url += `&tag=${encodeURIComponent(g)}`;

    // IMPORTANT: no pagination in genre mode
    page = 0;
  }

  // ALL STATIONS MODE (pagination ON)
  if(!g){
    url += `&limit=${PAGE_SIZE}&offset=${page * PAGE_SIZE}`;
  }

  const res = await fetch(url);
  current = (await res.json()).map(normalize);

  render();

  setTitle(
    `${currentCountry || "All Countries"} • ${g || "All Stations"}`
  );
}

async function loadCountries(){
  const res = await fetch("https://all.api.radio-browser.info/json/countries");
  const data = await res.json();

  const select = document.getElementById("countryFilter");

  // keep "All Countries" first
  select.innerHTML = `
    <option value="">🌎 All Countries</option>
  `;

  // sort alphabetically
  data.sort((a,b) => a.name.localeCompare(b.name));

  for (let c of data){
    const opt = document.createElement("option");
    opt.value = c.name;
    opt.textContent = `${c.name} (${c.stationcount})`;
    select.appendChild(opt);
  }

  // ✅ set default AFTER loop
  select.value = currentCountry;
}
  
/* FAVORITES LOAD */
async function loadFavorites(){

  const res = await fetch(SHEET + "?action=get");
  const data = await res.json().catch(()=>[]);

  const list = (data.data || data).map(normalize);

  current = list;
  favorites = new Set(list.map(s => s.id));

  render();
  setTitle("⭐ Favorites");
}

/* FAVORITE TOGGLE */
async function fav(s){

  const id = s.stationuuid || s.id;
  if(!id) return;

  const exists = favorites.has(id);

  if(exists){

    await fetch(SHEET,{
      method:"POST",
      body:new URLSearchParams({
        action:"delete",
        id:id
      })
    });

    favorites.delete(id);
    setTitle("Removed ⭐");
    render();
    return;
  }

  await fetch(SHEET,{
    method:"POST",
    body:new URLSearchParams({
      action:"save",
      id:id,
      name:s.name || "",
      url:s.url_resolved || s.url || "",
      country:s.country || "",
      genre:getGenre(s),
      time:new Date().toISOString()
    })
  });

  favorites.add(id);
  setTitle("Saved ⭐");
  render();
}
  
async function loadMISC(){

  const res = await fetch(SHEET + "?action=misc");
  const data = await res.json().catch(()=>[]);

  current = (data.data || []).map(normalize);

  render();
  setTitle("📻 MISC");
}

async function loadInternational(){

  const res = await fetch(SHEET + "?action=international");
  const data = await res.json().catch(()=>[]);

  current = (data.data || []).map(normalize);

  render();
  setTitle("🌎 International");
}

async function getNowPlaying(station) {
  try {
    const res = await fetch(
      `https://tester-nenh.onrender.com/nowplaying?url=${encodeURIComponent(station.url)}`
    );

    return await res.json();
  } catch (e) {
    return {
      nowPlaying: "Unavailable",
      source: "error"
    };
  }
}
/* PLAY */
async function play(i){

  index = i;

  const s = current[i];
  const audio = document.getElementById("audio");

  audio.src = s.url_resolved || s.url;
  audio.play();

  document.getElementById("npName").innerText = s.name;

  // default state first (instant UI response)
  document.getElementById("npMeta").innerText =
    `${s.country || ""} • Loading...`;

  // fetch real now playing (async upgrade layer)
  const meta = await getNowPlaying(s);

  document.getElementById("npMeta").innerText =
    `${meta.nowPlaying || "Live Radio"} • ${s.country || ""}`;
}

function playFiltered(i){

  const s = window.filtered[i];
  if(!s) return;

  const audio = document.getElementById("audio");

  audio.src = s.url_resolved || s.url;
  audio.play();

  document.getElementById("npName").innerText = s.name;

  document.getElementById("npMeta").innerText =
    `${s.country || ""} • ${getGenre(s)}`;
}
  
/* CONTROLS */
function toggle(){
  const a = document.getElementById("audio");
  if(a.paused) a.play();
  else a.pause();
}

function next(){
  index = (index + 1) % current.length;
  play(index);
}

function prev(){
  index = (index - 1 + current.length) % current.length;
  play(index);
}

function normalize(s){
  return {
    id: s.stationuuid || s.id,
    name: s.name || "Unknown",
    url: s.url_resolved || s.url,
    country: s.country || "",
    genre: s.tags || s.genre || "Radio"
  };
}

let genresOpen = false;

function toggleGenres(){
  const grid = document.getElementById("genreGrid");
  const arrow = document.getElementById("genreArrow");

  genresOpen = !genresOpen;

  if(genresOpen){
    grid.classList.remove("collapsed");
    arrow.innerText = "▲";
  } else {
    grid.classList.add("collapsed");
    arrow.innerText = "▼";
  }
}
  
/* CURRENT FAVORITE */
function favCurrent(){
  const s = current[index];
  if(!s) return;
  fav(s);
}

function scrollToTop(){
  document.querySelector(".main").scrollTo({
    top: 0,
    behavior: "smooth"
  });
}
  
/* RENDER */
function render(){

  const el = document.getElementById("list");
  el.innerHTML = "";

  const q =
    document.getElementById("searchBox")?.value
      .toLowerCase()
      .trim() || "";

  let filtered = [];

  for (let s of current) {

    const text = `
      ${s.name || ""}
      ${getGenre(s)}
      ${s.country || ""}
    `.toLowerCase();

    if (q && !text.includes(q)) continue;

    filtered.push(s);
  }

  window.filtered = filtered;

  filtered.forEach((s,i)=>{

    const id = s.stationuuid || s.id;
    const isFav = favorites.has(id);

    el.innerHTML += `
      <div class="card">
        <div class="station">${s.name}</div>

        <div class="small">${getGenre(s)} • ${s.country || ""}</div>

        <div class="row">
          <button onclick="playFiltered(${i})">▶ Play</button>
          <button onclick="showAll()">📻 Show All</button>
          <button class="fav-btn ${isFav ? "saved" : ""}"
            onclick="favFiltered(${i})">
            ${isFav ? "⭐ Saved" : "☆ Favorite"}
          </button>
        </div>
      </div>
    `;
  });
}

function favFiltered(i){
  fav(window.filtered[i]);
}

function showAll() {

  page = 0;
  currentGenre = "";
  filterMode = false;

  document.querySelectorAll(".genre")
    .forEach(x => x.classList.remove("active"));

  load();
}

/* GENRE */
function setGenre(g){

  document.querySelectorAll(".genre")
    .forEach(x => x.classList.remove("active"));

  event.target.classList.add("active");

  load(g);
}

/* TITLE */
function setTitle(t){
  document.getElementById("title").innerText = t;
}

function changeCountry(){

  currentCountry =
    document.getElementById("countryFilter").value;

  page = 0;

  load();
}
  
function nextPage(){
  if(filterMode){
    // in genre mode, just reload same genre (no paging)
    load(currentGenre);
  } else {
    page++;
    load();
  }
}

function prevPage(){
  if(filterMode){
    load(currentGenre);
  } else if(page > 0){
    page--;
    load();
  }
}

function toggleTheme(){
  document.body.classList.toggle("light");
}
/* INIT */
renderGenres();
loadCountries();   // ✅ add this
load();

document.querySelector(".main").addEventListener("scroll", () => {
  const btn = document.getElementById("backToTop");

  if (document.querySelector(".main").scrollTop > 300) {
    btn.classList.add("show");
  } else {
    btn.classList.remove("show");
  }
});

document.addEventListener("keydown", (e) => {

  const tag = document.activeElement.tagName.toLowerCase();
  const isTyping = tag === "input" || tag === "textarea" || tag === "select";

  // don't interfere while typing (except Esc and /)
  if (isTyping && e.key !== "Escape") return;

  switch (e.key.toLowerCase()) {

    // playback
    case " ":
      e.preventDefault();
      toggle();
      break;

    case "arrowright":
    case "n":
      next();
      break;

    case "arrowleft":
    case "p":
      prev();
      break;

    // favorite
    case "f":
  if (e.shiftKey) {
    loadFavorites();   // open favorites list
  } else {
    favCurrent();      // toggle current station favorite
  }
  break;

    // search focus
    case "/":
      e.preventDefault();
      document.getElementById("searchBox").focus();
      break;

    case "escape":
      document.getElementById("searchBox").value = "";
      document.getElementById("searchBox").blur();
      render();
      break;

    // UI toggles
    case "g":
      toggleGenres();
      break;

    case "a":
      showAll();
      break;

    case "m":
      loadMISC();
      break;

    case "i":
      loadInternational();
      break;

    case "c":
      document.getElementById("countryFilter").focus();
      break;

    case "home":
      scrollToTop();
      break;

    case "pagedown":
      nextPage();
      break;

    case "pageup":
      prevPage();
      break;
  }
});
  
</script>

<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .then(() => console.log("PWA Ready"))
      .catch(err => console.error(err));
  });
}
</script>
<button id="backToTop" onclick="scrollToTop()">⬆ Top</button>
</body>
</html>
