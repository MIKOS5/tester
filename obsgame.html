<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Obvyris Signal</title>

<style>

body{
margin:0;
background:#050b14;
color:white;
font-family:Arial,Helvetica,sans-serif;
overflow:hidden;
}

#game{
display:block;
margin:auto;
background:radial-gradient(circle,#12243b,#050b14);
}

#hud{
position:absolute;
top:10px;
left:10px;
font-size:18px;
z-index:2;
}

#title{
position:absolute;
top:10px;
width:100%;
text-align:center;
font-size:28px;
letter-spacing:5px;
color:#27a8ff;
text-shadow:0 0 15px #27a8ff;
}

.controls{
position:absolute;
bottom:20px;
width:100%;
text-align:center;
}

button{
width:60px;
height:60px;
margin:5px;
border-radius:50%;
border:1px solid #27a8ff;
background:#08192b;
color:white;
font-size:25px;
}

</style>
</head>


<body>


<div id="title">
OBVYRIS SIGNAL
</div>


<div id="hud">
Signal Recovered: <span id="score">0</span>
</div>


<canvas id="game"></canvas>


<div class="controls">

<button onclick="move(0,-1)">▲</button><br>

<button onclick="move(-1,0)">◀</button>
<button onclick="move(0,1)">▼</button>
<button onclick="move(1,0)">▶</button>

</div>


<script>


const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");


canvas.width=innerWidth;
canvas.height=innerHeight;



// SOUND SYSTEM

const sounds={

ship:new Audio(
"https://dn711305.ca.archive.org/0/items/galaxy-sound-effects/ship.mp3"
),

good:new Audio(
"https://dn711305.ca.archive.org/0/items/galaxy-sound-effects/good.mp3"
),

error:new Audio(
"https://dn711305.ca.archive.org/0/items/galaxy-sound-effects/error.mp3"
),

explosion:new Audio(
"https://dn711305.ca.archive.org/0/items/galaxy-sound-effects/explosion.mp3"
),

select:new Audio(
"https://dn711305.ca.archive.org/0/items/galaxy-sound-effects/select.mp3"
)

};


sounds.ship.loop=true;
sounds.ship.volume=.25;



document.body.onclick=()=>{

sounds.select.play();

sounds.ship.play();

};



// PLAYER

let player={

x:canvas.width/2,
y:canvas.height/2,
size:32,
speed:5

};


let keys={};


document.addEventListener("keydown",e=>{

keys[e.key]=true;

});


document.addEventListener("keyup",e=>{

keys[e.key]=false;

});



// PACKETS

let packets=[];


function spawnPacket(){

packets.push({

x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
size:8,
pulse:0

});

}



for(let i=0;i<20;i++)
spawnPacket();




// NODES

let nodes=[

{
name:"Radio",
img:"radio_icon_cutout.png",
x:150,
y:200
},

{
name:"Video",
img:"video_icon_cutout.png",
x:canvas.width-180,
y:200
},

{
name:"Chat",
img:"chat_icon_cutout.png",
x:canvas.width/2,
y:canvas.height-200
},

{
name:"News",
img:"news_icon.png",
x:200,
y:canvas.height-200
},

{
name:"Archive",
img:"archive_icon.png",
x:canvas.width-200,
y:canvas.height-200
}

];



let images={};



let shipImg=new Image();
shipImg.src="Oship.png";



nodes.forEach(n=>{

let img=new Image();

img.src=n.img;

images[n.img]=img;

});




// MOBILE BUTTON

function move(dx,dy){

player.x+=dx*player.speed*5;
player.y+=dy*player.speed*5;

}



// KEEP SHIP ON MAP

function bounds(){

player.x=Math.max(
0,
Math.min(canvas.width,player.x)
);

player.y=Math.max(
0,
Math.min(canvas.height,player.y)
);

}



// GAME LOOP


function update(){



if(keys["ArrowUp"]||keys["w"])
player.y-=player.speed;


if(keys["ArrowDown"]||keys["s"])
player.y+=player.speed;


if(keys["ArrowLeft"]||keys["a"])
player.x-=player.speed;


if(keys["ArrowRight"]||keys["d"])
player.x+=player.speed;



bounds();



// collect signals

packets.forEach((p,i)=>{


let d=Math.hypot(
player.x-p.x,
player.y-p.y
);


if(d<35){


packets.splice(i,1);


document.getElementById("score").innerHTML++;

sounds.good.currentTime=0;
sounds.good.play();


spawnPacket();


}


});


draw();


requestAnimationFrame(update);

}




function draw(){


ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);



// CONNECTIONS

nodes.forEach(n=>{


ctx.strokeStyle="#16395b";

ctx.beginPath();

ctx.moveTo(
canvas.width/2,
canvas.height/2
);

ctx.lineTo(
n.x,
n.y
);

ctx.stroke();


});




// NODES

nodes.forEach(n=>{


ctx.shadowBlur=20;
ctx.shadowColor="#27a8ff";


let img=images[n.img];


if(img.complete){

ctx.drawImage(
img,
n.x-35,
n.y-35,
70,
70
);

}


ctx.shadowBlur=0;


});



// SIGNAL PACKETS


packets.forEach(p=>{


p.pulse+=.1;


ctx.fillStyle="#27a8ff";


ctx.beginPath();

ctx.arc(
p.x,
p.y,
p.size+Math.sin(p.pulse)*3,
0,
Math.PI*2
);


ctx.fill();



});



// ENGINE TRAIL


ctx.strokeStyle="#27a8ff";

ctx.beginPath();

ctx.moveTo(
player.x,
player.y+35
);

ctx.lineTo(
player.x,
player.y+55
);

ctx.stroke();



// SHIP


if(shipImg.complete){

ctx.drawImage(
shipImg,
player.x-32,
player.y-32,
64,
64
);

}



}



update();


</script>


</body>
</html>
