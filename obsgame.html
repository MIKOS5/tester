<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Obvyris Signal</title>

<style>

body{
margin:0;
background:#050b14;
color:white;
font-family:Arial,Helvetica,sans-serif;
overflow:hidden;
}

#game{
display:block;
margin:auto;
background:radial-gradient(circle,#12243b,#050b14);
}

#title{
position:absolute;
top:10px;
width:100%;
text-align:center;
font-size:28px;
letter-spacing:5px;
color:#27a8ff;
text-shadow:0 0 15px #27a8ff;
}

#hud{
position:absolute;
top:50px;
left:15px;
font-size:18px;
z-index:2;
line-height:25px;
}

.controls{
position:absolute;
bottom:20px;
width:100%;
text-align:center;
}

button{
width:60px;
height:60px;
margin:5px;
border-radius:50%;
border:1px solid #27a8ff;
background:#08192b;
color:white;
font-size:25px;
}

#joystick{
position:absolute;
left:40px;
bottom:40px;
width:120px;
height:120px;
border-radius:50%;
border:2px solid rgba(39,168,255,.4);
background:rgba(8,25,43,.4);
display:none;
}

#stick{
position:absolute;
left:35px;
top:35px;
width:50px;
height:50px;
border-radius:50%;
background:#27a8ff;
box-shadow:0 0 20px #27a8ff;
}

#startScreen{

position:absolute;
top:0;
left:0;
width:100%;
height:100%;

background:#050b14;

display:flex;
flex-direction:column;
align-items:center;
justify-content:center;

z-index:10;

text-align:center;

}


#startScreen img{

width:150px;

filter:
drop-shadow(0 0 20px #27a8ff);

}


#startScreen h1{

font-size:40px;
letter-spacing:8px;
color:#27a8ff;

}


#startScreen p{

font-size:18px;
color:#ddd;

}


#startButton{

width:220px;
height:70px;

font-size:24px;

border-radius:15px;

background:#08192b;

color:white;

border:2px solid #27a8ff;

box-shadow:
0 0 20px #27a8ff;

cursor:pointer;

}
  
</style>
</head>


<body>


<div id="title">
OBVYRIS SIGNAL
</div>

<div id="startScreen">

<img src="R512.png">

<h1>OBVYRIS SIGNAL</h1>

<p>Maintain the network. Restore failing signals.</p>

<button id="startButton">
START SIGNAL
</button>

</div>
  
<div id="hud">
<div>Rank: <span id="rank">1</span></div>
<div>Energy: <span id="energy">0</span></div>
<div>XP: <span id="xp">0</span>/100</div>
<div>Recovered: <span id="score">0</span></div>
</div>


<canvas id="game"></canvas>

<div id="joystick">
<div id="stick"></div>
</div>
  
<script>


const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

canvas.width=innerWidth;
canvas.height=innerHeight;

let gameStarted=false;

// SOUND

const sounds={

ship:new Audio(
"https://dn711305.ca.archive.org/0/items/galaxy-sound-effects/ship.mp3"
),

good:new Audio(
"https://dn711305.ca.archive.org/0/items/galaxy-sound-effects/good.mp3"
),

error:new Audio(
"https://dn711305.ca.archive.org/0/items/galaxy-sound-effects/error.mp3"
)

};


sounds.ship.loop=true;
sounds.ship.volume=.2;



document.body.onclick=()=>{

sounds.ship.play();

};




// PLAYER

let player={

x:canvas.width/2,
y:canvas.height/2,
speed:5

};



let score=0;
let energy=0;
let xp=0;

let rank=
Number(localStorage.getItem("obvyrisRank")) || 1;



let keys={};


document.addEventListener("keydown",e=>{
keys[e.key]=true;
});


document.addEventListener("keyup",e=>{
keys[e.key]=false;
});




// SHIP IMAGE


let shipImg=new Image();

shipImg.src="Oship.png";



// TOUCH JOYSTICK

let joystick=document.getElementById("joystick");
let stick=document.getElementById("stick");

let touchActive=false;

let joyX=0;
let joyY=0;


canvas.addEventListener(
"touchstart",
function(e){

joystick.style.display="block";

touchActive=true;

moveJoystick(e.touches[0]);

},
{passive:false}
);



canvas.addEventListener(
"touchmove",
function(e){

e.preventDefault();

moveJoystick(e.touches[0]);

},
{passive:false}
);



canvas.addEventListener(
"touchend",
function(){

touchActive=false;

joyX=0;
joyY=0;

stick.style.left="35px";
stick.style.top="35px";

}
);



function moveJoystick(t){


let rect=canvas.getBoundingClientRect();


let x=t.clientX;
let y=t.clientY;



let cx=rect.width/2;
let cy=rect.height/2;



joyX=(x-cx)/200;
joyY=(y-cy)/200;



joyX=Math.max(-1,Math.min(1,joyX));
joyY=Math.max(-1,Math.min(1,joyY));



stick.style.left=
35+(joyX*30)+"px";


stick.style.top=
35+(joyY*30)+"px";


}
  
// STATIONS


let stations=[

{
name:"Radio",
img:"radio_icon_cutout.png",
x:150,
y:200,
power:100
},

{
name:"Video",
img:"video_icon_cutout.png",
x:canvas.width-180,
y:200,
power:100
},

{
name:"Chat",
img:"chat_icon_cutout.png",
x:canvas.width/2,
y:canvas.height-180,
power:100
},

{
name:"News",
img:"news_icon.png",
x:200,
y:canvas.height-180,
power:100
},

{
name:"Archive",
img:"archive_icon.png",
x:canvas.width-200,
y:canvas.height-180,
power:100
}

];



let images={};


stations.forEach(s=>{

let img=new Image();

img.src=s.img;

images[s.img]=img;

});




// PACKETS


let packets=[];


function spawnPacket(){

packets.push({

x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
size:8

});

}


// Starting signal packets
for(let i=0;i<10;i++)
spawnPacket();


// Dynamic packet timer

let packetTimer=0;





// DOCKING SYSTEM


let dockedStation=null;

const DOCK_RANGE=90;


function checkDocking(){


dockedStation=null;


stations.forEach(s=>{


let distance=Math.hypot(
player.x-s.x,
player.y-s.y
);


if(distance<DOCK_RANGE){

dockedStation=s;

}

});



if(dockedStation && energy>0){


if(dockedStation.power<100){


dockedStation.power+=0.15;


if(dockedStation.power>100)
dockedStation.power=100;



energy-=0.2;


xp+=1;



// Dynamic signal decay
// Faster every rank

let decayChance = 0.01 + (rank * 0.002);


if(Math.random() < decayChance){


let s =
stations[
Math.floor(Math.random()*stations.length)
];


// amount lost increases with rank

let decayAmount = 
1 + Math.floor(rank / 5);


s.power -= decayAmount;


if(s.power < 0)
s.power = 0;


}


}



}



}






function move(x,y){

player.x+=x*30;
player.y+=y*30;

}




function stationColor(power){


if(power>=70)
return "#27a8ff";


if(power>=30)
return "orange";


return "red";


}




function update(){



// movement


if(keys["ArrowUp"]||keys["w"])
player.y-=player.speed;


if(keys["ArrowDown"]||keys["s"])
player.y+=player.speed;


if(keys["ArrowLeft"]||keys["a"])
player.x-=player.speed;


if(keys["ArrowRight"]||keys["d"])
player.x+=player.speed;





// boundaries

player.x=Math.max(
0,
Math.min(canvas.width,player.x)
);

player.y=Math.max(
0,
Math.min(canvas.height,player.y)
);





// decay

let decayChance =
0.005 + (rank * 0.001);


if(Math.random()<decayChance){


let s=
stations[
Math.floor(Math.random()*stations.length)
];


s.power-=1;


}





// collect packets


packets.forEach((p,i)=>{


let d=Math.hypot(
player.x-p.x,
player.y-p.y
);


if(d<35){


packets.splice(i,1);


energy+=5;
xp+=10;
score++;


spawnPacket();


sounds.good.currentTime=0;
sounds.good.play();


}



});




// docking repair

checkDocking();

// signal packet generation
// harder as rank increases

packetTimer++;


let spawnDelay =
300 + (rank * 50);


if(packetTimer > spawnDelay){


packetTimer=0;


// fewer packets at higher levels

if(packets.length < Math.max(3,15-rank)){


spawnPacket();


}

}



// level up


if(xp>=100){


rank++;

xp=0;


localStorage.setItem(
"obvyrisRank",
rank
);


}






// game over


stations.forEach(s=>{


if(s.power<=0){


sounds.error.play();


alert(
"OBVYRIS SIGNAL LOST\n\n"+
s.name+" has failed."
);


location.reload();


}


});



updateHUD();

draw();


requestAnimationFrame(update);

}





function updateHUD(){


document.getElementById("rank").innerHTML=rank;

document.getElementById("energy").innerHTML=Math.floor(energy);

document.getElementById("xp").innerHTML=Math.floor(xp);

document.getElementById("score").innerHTML=score;


}






function draw(){


ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);




// connections


stations.forEach(s=>{


ctx.strokeStyle="#16395b";


ctx.beginPath();

ctx.moveTo(
canvas.width/2,
canvas.height/2
);

ctx.lineTo(
s.x,
s.y
);

ctx.stroke();



});





// stations


stations.forEach(s=>{


ctx.shadowBlur=25;

ctx.shadowColor=
stationColor(s.power);



let img=images[s.img];


if(img.complete){

ctx.drawImage(
img,
s.x-35,
s.y-35,
70,
70
);

}


ctx.shadowBlur=0;



ctx.fillStyle=
stationColor(s.power);


ctx.fillText(
s.name+" "+Math.floor(s.power)+"%",
s.x-40,
s.y+55
);




// power bar


ctx.fillStyle="#111";

ctx.fillRect(
s.x-40,
s.y+65,
80,
8
);


ctx.fillStyle=
stationColor(s.power);


ctx.fillRect(
s.x-40,
s.y+65,
80*(s.power/100),
8
);



});




// repair beam


if(dockedStation){


ctx.strokeStyle="#27a8ff";

ctx.lineWidth=3;


ctx.beginPath();

ctx.moveTo(
player.x,
player.y
);


ctx.lineTo(
dockedStation.x,
dockedStation.y
);


ctx.stroke();



ctx.fillStyle="#27a8ff";

ctx.fillText(
"REPAIRING "+dockedStation.name,
player.x-50,
player.y-45
);


}





// packets


packets.forEach(p=>{


ctx.fillStyle="#27a8ff";


ctx.beginPath();

ctx.arc(
p.x,
p.y,
p.size,
0,
Math.PI*2
);


ctx.fill();


});




// ship


if(shipImg.complete){

ctx.drawImage(
shipImg,
player.x-32,
player.y-32,
64,
64
);

}


}



document.getElementById("startButton").onclick=function(){


gameStarted=true;


document.getElementById("startScreen").style.display="none";


// start engine

sounds.ship.play();


// startup sound

sounds.good.currentTime=0;
sounds.good.play();


update();


};


</script>

</body>
</html>
