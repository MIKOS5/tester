<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Obvyris Signal</title>

<style>

body{
margin:0;
background:#050b14;
color:white;
font-family:Arial,Helvetica,sans-serif;
overflow:hidden;
}

#game{
display:block;
margin:auto;
background:radial-gradient(circle,#12243b,#050b14);
}

#hud{
position:absolute;
top:10px;
left:10px;
font-size:18px;
z-index:2;
}

#title{
position:absolute;
top:10px;
width:100%;
text-align:center;
font-size:28px;
letter-spacing:5px;
color:#27a8ff;
text-shadow:0 0 15px #27a8ff;
}

.controls{
position:absolute;
bottom:20px;
width:100%;
text-align:center;
}

button{
width:60px;
height:60px;
margin:5px;
border-radius:50%;
border:1px solid #27a8ff;
background:#08192b;
color:white;
font-size:25px;
}

</style>
</head>


<body>


<div id="title">
OBVYRIS SIGNAL
</div>


<div id="hud">
Signal Recovered: <span id="score">0</span>
</div>


<canvas id="game"></canvas>


<div class="controls">

<button onclick="move(0,-1)">▲</button><br>

<button onclick="move(-1,0)">◀</button>
<button onclick="move(0,1)">▼</button>
<button onclick="move(1,0)">▶</button>

</div>


<script>


const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

canvas.width=innerWidth;
canvas.height=innerHeight;


// SOUND

const sounds={

ship:new Audio(
"https://dn711305.ca.archive.org/0/items/galaxy-sound-effects/ship.mp3"
),

good:new Audio(
"https://dn711305.ca.archive.org/0/items/galaxy-sound-effects/good.mp3"
),

error:new Audio(
"https://dn711305.ca.archive.org/0/items/galaxy-sound-effects/error.mp3"
)

};


sounds.ship.loop=true;
sounds.ship.volume=.25;



let player={

x:canvas.width/2,
y:canvas.height/2,
speed:5,
size:32

};



let score=0;
let energy=0;
let xp=0;
let rank=1;


let keys={};


document.addEventListener("keydown",e=>{
keys[e.key]=true;
});


document.addEventListener("keyup",e=>{
keys[e.key]=false;
});



// SHIP

let shipImg=new Image();
shipImg.src="Oship.png";



// STATIONS


let stations=[

{
name:"Radio",
img:"radio_icon_cutout.png",
x:150,
y:200,
power:100
},

{
name:"Video",
img:"video_icon_cutout.png",
x:canvas.width-180,
y:200,
power:100
},

{
name:"Chat",
img:"chat_icon_cutout.png",
x:canvas.width/2,
y:canvas.height-180,
power:100
},

{
name:"News",
img:"news_icon.png",
x:200,
y:canvas.height-180,
power:100
},

{
name:"Archive",
img:"archive_icon.png",
x:canvas.width-200,
y:canvas.height-180,
power:100
}

];


let images={};


stations.forEach(s=>{

let img=new Image();

img.src=s.img;

images[s.img]=img;

});



// SIGNAL PACKETS

let packets=[];


function spawnPacket(){

packets.push({

x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
size:8

});

}


for(let i=0;i<30;i++)
spawnPacket();




// TOUCH

function move(x,y){

player.x+=x*30;
player.y+=y*30;

}




// REPAIR

function repairStation(station){


station.power+=10;

if(station.power>100)
station.power=100;


energy-=10;


sounds.good.currentTime=0;
sounds.good.play();


}



// UPDATE


function update(){



if(keys["ArrowUp"]||keys["w"])
player.y-=player.speed;


if(keys["ArrowDown"]||keys["s"])
player.y+=player.speed;


if(keys["ArrowLeft"]||keys["a"])
player.x-=player.speed;


if(keys["ArrowRight"]||keys["d"])
player.x+=player.speed;




// signal decay


if(Math.random()<0.01){


let target=
stations[
Math.floor(
Math.random()*stations.length
)
];


target.power-=1;


}




// collect packets


packets.forEach((p,i)=>{


let d=Math.hypot(
player.x-p.x,
player.y-p.y
);



if(d<35){


packets.splice(i,1);


energy+=5;
xp+=10;
score++;


spawnPacket();


sounds.good.currentTime=0;
sounds.good.play();



}



});



// upgrade


if(xp>=100){


rank++;

xp=0;


}



// check game over


stations.forEach(s=>{


if(s.power<=0){


sounds.error.play();


alert(
"OBVYRIS NETWORK FAILURE\n"+
s.name+" Signal Lost"
);


location.reload();


}



});



draw();


requestAnimationFrame(update);


}





function stationColor(power){


if(power>70)
return "#27a8ff";


if(power>30)
return "orange";


return "red";


}





function draw(){


ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);



// HUD

ctx.fillStyle="white";
ctx.font="18px Arial";


ctx.fillText(
"Rank: "+rank+
"  Energy: "+energy+
"  XP: "+xp+"/100",
20,
40
);



// network


stations.forEach(s=>{


ctx.strokeStyle="#16395b";

ctx.beginPath();

ctx.moveTo(
canvas.width/2,
canvas.height/2
);

ctx.lineTo(
s.x,
s.y
);

ctx.stroke();



ctx.shadowBlur=20;
ctx.shadowColor=stationColor(s.power);



let img=images[s.img];


if(img.complete){

ctx.drawImage(
img,
s.x-35,
s.y-35,
70,
70
);

}



ctx.shadowBlur=0;



ctx.fillStyle=stationColor(s.power);

ctx.font="16px Arial";


ctx.fillText(
s.name+
" "+
Math.floor(s.power)+"%",
s.x-40,
s.y+55
);



});



// packets


packets.forEach(p=>{


ctx.fillStyle="#27a8ff";


ctx.beginPath();

ctx.arc(
p.x,
p.y,
p.size,
0,
Math.PI*2
);


ctx.fill();



});




// ship


if(shipImg.complete){

ctx.drawImage(
shipImg,
player.x-32,
player.y-32,
64,
64
);


}


}



update();
</script>


</body>
</html>
