<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
>

<title>Obvyris — Off World</title>

<meta name="theme-color" content="#02050a">

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#010308;
    color:#d9efff;
    font-family:Arial,Helvetica,sans-serif;
}

button{
    font:inherit;
}


/* =========================================================
   SPACE
========================================================= */

#space{

    position:fixed;
    inset:0;
    overflow:hidden;

    background:
        radial-gradient(
            ellipse at center,
            #071522 0%,
            #020810 45%,
            #010308 100%
        );

}


#spaceCanvas{

    position:absolute;
    inset:0;
    width:100%;
    height:100%;

}


/* =========================================================
   NEBULA
========================================================= */

.nebula{

    position:absolute;

    width:80vw;
    height:60vw;

    max-width:1100px;
    max-height:800px;

    border-radius:50%;

    opacity:0;

    filter:blur(35px);

    pointer-events:none;

    transition:
        opacity 4s ease;

}


#nebula1{

    left:-20%;
    top:10%;

    background:
        radial-gradient(
            ellipse,
            rgba(35,120,190,.22),
            rgba(20,50,120,.12),
            transparent 70%
        );

}


#nebula2{

    right:-25%;
    bottom:0;

    background:
        radial-gradient(
            ellipse,
            rgba(110,50,180,.18),
            rgba(40,20,100,.1),
            transparent 70%
        );

}


/* =========================================================
   PLANETS
========================================================= */

.planet{

    position:absolute;

    border-radius:50%;

    pointer-events:none;

    opacity:0;

    transform:
        translate(-50%,-50%)
        scale(.2);

    transition:
        opacity 2s ease;

}


#planet{

    width:180px;
    height:180px;

    left:72%;
    top:48%;

    background:

        radial-gradient(
            circle at 32% 28%,
            #d9f6ff 0%,
            #6a9eaf 18%,
            #214e60 45%,
            #081a25 78%,
            #02060a 100%
        );

    box-shadow:

        -30px -15px 45px
        rgba(100,210,255,.16),

        30px 20px 50px
        rgba(0,0,0,.9);

}


#planet::after{

    content:"";

    position:absolute;

    inset:-12px;

    border-radius:50%;

    border:
        1px solid
        rgba(100,210,255,.12);

}


/* =========================================================
   DISTANT PLANET
========================================================= */

#smallPlanet{

    width:70px;
    height:70px;

    left:25%;
    top:30%;

    background:

        radial-gradient(
            circle at 35% 30%,
            #e9c9a0,
            #8d6c4e 35%,
            #32261f 70%,
            #050608
        );

    box-shadow:
        0 0 35px
        rgba(220,160,100,.12);

}


/* =========================================================
   ASTEROID
========================================================= */

.asteroid{

    position:absolute;

    width:18px;
    height:14px;

    border-radius:
        48% 52% 45% 55%;

    background:
        linear-gradient(
            135deg,
            #78828a,
            #2b3237
        );

    box-shadow:
        -8px 4px 12px
        rgba(0,0,0,.8);

    opacity:0;

    pointer-events:none;

}


/* =========================================================
   COCKPIT
========================================================= */

#cockpit{

    position:fixed;

    inset:0;

    pointer-events:none;

}


/* =========================================================
   WINDOW FRAME
========================================================= */

.windowFrame{

    position:absolute;

    inset:0;

    border:
        20px solid
        rgba(7,13,20,.95);

    box-shadow:

        inset 0 0 70px
        rgba(0,0,0,.9),

        inset 0 0 15px
        rgba(90,170,220,.12);

}


.windowFrame::before{

    content:"";

    position:absolute;

    inset:0;

    border:
        1px solid
        rgba(130,200,240,.18);

}


.windowReflection{

    position:absolute;

    inset:0;

    background:

        linear-gradient(
            115deg,
            transparent 35%,
            rgba(255,255,255,.025) 42%,
            transparent 48%
        );

    opacity:.6;

}


/* =========================================================
   COCKPIT STRUCTURE
========================================================= */

.cockpitTop{

    position:absolute;

    left:0;
    right:0;
    top:0;

    height:80px;

    background:
        linear-gradient(
            180deg,
            rgba(3,8,14,.95),
            rgba(3,8,14,.55),
            transparent
        );

}


.cockpitBottom{

    position:absolute;

    left:0;
    right:0;
    bottom:0;

    height:105px;

    background:
        linear-gradient(
            0deg,
            rgba(3,8,14,.98),
            rgba(3,8,14,.75),
            transparent
        );

}


/* =========================================================
   SHIP LIGHTS
========================================================= */

.shipLight{

    position:absolute;

    width:5px;
    height:5px;

    border-radius:50%;

    background:#56d7ff;

    box-shadow:
        0 0 12px
        rgba(80,210,255,.8);

}


.shipLight.l1{

    left:8%;
    bottom:55px;

}


.shipLight.l2{

    left:18%;
    bottom:55px;

}


.shipLight.l3{

    right:18%;
    bottom:55px;

}


.shipLight.l4{

    right:8%;
    bottom:55px;

}


/* =========================================================
   TOP HUD
========================================================= */

.topHud{

    position:absolute;

    left:40px;
    right:40px;
    top:25px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    font-size:10px;

    letter-spacing:2px;

    color:#79b5d4;

}


.logo{

    color:#7bd6ff;

    font-weight:900;

    letter-spacing:5px;

    text-shadow:
        0 0 15px
        rgba(70,190,255,.5);

}


.travelStatus{

    display:flex;

    align-items:center;

    gap:8px;

}


.statusDot{

    width:7px;
    height:7px;

    border-radius:50%;

    background:#49e3a0;

    box-shadow:
        0 0 10px
        #49e3a0;

}


/* =========================================================
   LOCATION HUD
========================================================= */

.locationHud{

    position:absolute;

    left:45px;
    top:105px;

    color:#74b6d7;

    font-size:9px;

    line-height:1.8;

    letter-spacing:2px;

    text-shadow:
        0 0 8px
        rgba(50,160,220,.4);

}


.rightHud{

    position:absolute;

    right:45px;
    top:105px;

    text-align:right;

    color:#74b6d7;

    font-size:9px;

    line-height:1.8;

    letter-spacing:2px;

}


/* =========================================================
   CENTER MESSAGE
========================================================= */

#eventMessage{

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    width:
        min(650px,80vw);

    text-align:center;

    opacity:0;

    transition:
        opacity 1s ease;

}


#eventTitle{

    font-size:
        clamp(
            20px,
            3vw,
            38px
        );

    font-weight:900;

    letter-spacing:6px;

    color:#dff7ff;

    text-shadow:
        0 0 25px
        rgba(80,200,255,.7);

}


#eventSub{

    margin-top:12px;

    font-size:10px;

    letter-spacing:3px;

    color:#79a8be;

}


/* =========================================================
   SHIP COMPUTER PANEL
========================================================= */

#computer{

    position:absolute;

    left:50%;

    bottom:22px;

    transform:
        translateX(-50%)
        translateY(130%);

    width:
        min(600px,85vw);

    padding:12px 16px;

    background:
        rgba(4,14,22,.92);

    border:
        1px solid
        rgba(70,170,220,.35);

    box-shadow:
        0 0 25px
        rgba(0,0,0,.7);

    transition:
        transform .5s ease;

    pointer-events:auto;

}


#computer.open{

    transform:
        translateX(-50%)
        translateY(0);

}


.computerHeader{

    display:flex;

    justify-content:space-between;

    align-items:center;

    color:#68cfff;

    font-size:10px;

    letter-spacing:2px;

}


.computerData{

    margin-top:10px;

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:8px;

}


.dataBox{

    padding:8px;

    border:
        1px solid
        rgba(80,140,180,.16);

    background:
        rgba(10,25,35,.7);

}


.dataLabel{

    color:#66859a;

    font-size:8px;

    letter-spacing:1px;

}


.dataValue{

    margin-top:4px;

    color:#d8f3ff;

    font-size:11px;

}


/* =========================================================
   CONTROLS
========================================================= */

.controls{

    position:absolute;

    right:35px;

    bottom:25px;

    display:flex;

    gap:8px;

    pointer-events:auto;

}


.controlButton{

    padding:
        9px 13px;

    border:
        1px solid
        rgba(90,170,215,.3);

    background:
        rgba(4,13,20,.8);

    color:#9ed6ef;

    font-size:9px;

    letter-spacing:1px;

    border-radius:4px;

    cursor:pointer;

}


.controlButton:hover{

    border-color:
        rgba(100,210,255,.7);

    color:white;

}


/* =========================================================
   HYPERSPACE
========================================================= */

#hyperspace{

    position:absolute;

    inset:0;

    opacity:0;

    pointer-events:none;

    background:
        radial-gradient(
            ellipse at center,
            transparent 0%,
            rgba(20,120,200,.08) 30%,
            rgba(0,0,0,.85) 100%
        );

    transition:
        opacity .3s ease;

}


#hyperspace.active{

    opacity:1;

}


.hyperLine{

    position:absolute;

    left:50%;
    top:50%;

    width:2px;

    height:100px;

    transform-origin:
        center bottom;

    background:
        linear-gradient(
            transparent,
            rgba(150,230,255,.9)
        );

}


/* =========================================================
   SCREEN FLASH
========================================================= */

#flash{

    position:absolute;

    inset:0;

    background:white;

    opacity:0;

    pointer-events:none;

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px){

    .windowFrame{

        border-width:10px;

    }


    .topHud{

        left:20px;
        right:20px;

        top:18px;

    }


    .locationHud{

        left:22px;
        top:75px;

    }


    .rightHud{

        right:22px;
        top:75px;

    }


    .cockpitBottom{

        height:80px;

    }


    .controls{

        left:50%;

        right:auto;

        transform:
            translateX(-50%);

        bottom:18px;

        white-space:nowrap;

    }


    .computerData{

        grid-template-columns:
            repeat(2,1fr);

    }

}

</style>

</head>

<body>


<div id="space">

    <canvas id="spaceCanvas"></canvas>

    <div
        class="nebula"
        id="nebula1"
    ></div>

    <div
        class="nebula"
        id="nebula2"
    ></div>


    <div
        class="planet"
        id="planet"
    ></div>


    <div
        class="planet"
        id="smallPlanet"
    ></div>


    <div
        class="asteroid"
        id="asteroid"
    ></div>


    <div id="hyperspace"></div>

    <div id="flash"></div>


    <div id="cockpit">


        <div class="windowFrame"></div>

        <div class="windowReflection"></div>

        <div class="cockpitTop"></div>

        <div class="cockpitBottom"></div>


        <div class="shipLight l1"></div>
        <div class="shipLight l2"></div>
        <div class="shipLight l3"></div>
        <div class="shipLight l4"></div>


        <div class="topHud">

            <div class="logo">
                OBVYRIS
            </div>


            <div class="travelStatus">

                <span class="statusDot"></span>

                OFF WORLD

            </div>

        </div>


        <div class="locationHud">

            FLIGHT STATUS<br>

            <span id="flightStatus">
                CRUISING
            </span>

            <br><br>

            VECTOR<br>

            <span id="vector">
                042.7
            </span>

        </div>


        <div class="rightHud">

            EXTERNAL VIEW<br>

            ACTIVE

            <br><br>

            DISTANCE FROM EARTH<br>

            <span id="distance">
                4.82 AU
            </span>

        </div>


        <div id="eventMessage">

            <div id="eventTitle">
                YOU ARE OFF WORLD
            </div>

            <div id="eventSub">
                OBVYRIS TRANSPORT SYSTEM
            </div>

        </div>


        <div id="computer">

            <div class="computerHeader">

                <span>
                    SHIP COMPUTER
                </span>

                <span>
                    ONLINE
                </span>

            </div>


            <div class="computerData">


                <div class="dataBox">

                    <div class="dataLabel">
                        POWER
                    </div>

                    <div class="dataValue">
                        94%
                    </div>

                </div>


                <div class="dataBox">

                    <div class="dataLabel">
                        HULL
                    </div>

                    <div class="dataValue">
                        100%
                    </div>

                </div>


                <div class="dataBox">

                    <div class="dataLabel">
                        VELOCITY
                    </div>

                    <div
                        class="dataValue"
                        id="velocity"
                    >
                        18.4 AU/h
                    </div>

                </div>


                <div class="dataBox">

                    <div class="dataLabel">
                        SIGNAL
                    </div>

                    <div class="dataValue">
                        82%
                    </div>

                </div>


            </div>

        </div>


        <div class="controls">

            <button
                class="controlButton"
                type="button"
                onclick="toggleComputer()"
            >
                SHIP COMPUTER
            </button>


            <button
                class="controlButton"
                type="button"
                onclick="returnToHub()"
            >
                RETURN TO HUB
            </button>

        </div>


    </div>

</div>


<script>

/* =========================================================
   CANVAS STARFIELD
========================================================= */

const canvas =
    document.getElementById(
        "spaceCanvas"
    );

const ctx =
    canvas.getContext("2d");

let width =
    window.innerWidth;

let height =
    window.innerHeight;


function resize(){

    width =
        window.innerWidth;

    height =
        window.innerHeight;

    canvas.width =
        width *
        devicePixelRatio;

    canvas.height =
        height *
        devicePixelRatio;

    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";

    ctx.setTransform(
        devicePixelRatio,
        0,
        0,
        devicePixelRatio,
        0,
        0
    );

}


resize();

window.addEventListener(
    "resize",
    resize
);


/* =========================================================
   STAR OBJECTS
========================================================= */

const stars = [];

const STAR_COUNT =
    window.innerWidth < 700
    ? 180
    : 420;


function createStar(){

    return {

        x:
            (Math.random() - .5)
            * width,

        y:
            (Math.random() - .5)
            * height,

        z:
            Math.random()
            * width,

        pz:0,

        size:
            Math.random()
            * 1.5
            + .2

    };

}


for(
    let i = 0;
    i < STAR_COUNT;
    i++
){

    const star =
        createStar();

    star.pz =
        star.z;

    stars.push(
        star
    );

}


/* =========================================================
   TRAVEL SPEED
========================================================= */

let travelSpeed =
    1.7;

let hyperspaceMode =
    false;


function drawStars(){

    ctx.fillStyle =
        "rgba(1,4,8,.35)";

    ctx.fillRect(
        0,
        0,
        width,
        height
    );


    const cx =
        width / 2;

    const cy =
        height / 2;


    for(
        const star of stars
    ){

        star.pz =
            star.z;

        star.z -=
            travelSpeed;


        if(star.z <= 1){

            star.x =
                (Math.random() - .5)
                * width;

            star.y =
                (Math.random() - .5)
                * height;

            star.z =
                width;

            star.pz =
                star.z;

        }


        const sx =
            cx +
            star.x /
            star.z *
            width;


        const sy =
            cy +
            star.y /
            star.z *
            width;


        const px =
            cx +
            star.x /
            star.pz *
            width;


        const py =
            cy +
            star.y /
            star.pz *
            width;


        const size =
            Math.max(
                .3,
                (
                    1 -
                    star.z /
                    width
                ) * 2.2
            ) *
            star.size;


        if(
            sx < -50 ||
            sx > width + 50 ||
            sy < -50 ||
            sy > height + 50
        ){

            continue;

        }


        ctx.beginPath();

        ctx.moveTo(
            px,
            py
        );

        ctx.lineTo(
            sx,
            sy
        );


        ctx.strokeStyle =
            hyperspaceMode
            ? "rgba(150,225,255,.9)"
            : "rgba(190,225,245,.75)";


        ctx.lineWidth =
            hyperspaceMode
            ? size * 2
            : size;


        ctx.stroke();

    }


    requestAnimationFrame(
        drawStars
    );

}


drawStars();


/* =========================================================
   UI ELEMENTS
========================================================= */

const eventMessage =
    document.getElementById(
        "eventMessage"
    );

const eventTitle =
    document.getElementById(
        "eventTitle"
    );

const eventSub =
    document.getElementById(
        "eventSub"
    );


function showMessage(
    title,
    subtitle,
    duration = 3500
){

    eventTitle.textContent =
        title;

    eventSub.textContent =
        subtitle;

    eventMessage.style.opacity =
        "1";


    setTimeout(
        function(){

            eventMessage.style.opacity =
                "0";

        },
        duration
    );

}


/* =========================================================
   NAVIGATION DATA
========================================================= */

const flightStatus =
    document.getElementById(
        "flightStatus"
    );

const vector =
    document.getElementById(
        "vector"
    );

const distance =
    document.getElementById(
        "distance"
    );


let distanceValue =
    4.82;


setInterval(
    function(){

        vector.textContent =
            (
                40 +
                Math.random() * 8
            ).toFixed(1);


        if(!hyperspaceMode){

            distanceValue +=
                .005;

            distance.textContent =
                distanceValue.toFixed(2)
                + " AU";

        }

    },
    2000
);


/* =========================================================
   COMPUTER
========================================================= */

function toggleComputer(){

    document
        .getElementById(
            "computer"
        )
        .classList.toggle(
            "open"
        );

}


function returnToHub(){

    window.location.href =
        "index.html";

}


/* =========================================================
   PLANET ENCOUNTER
========================================================= */

function planetEncounter(){

    const planet =
        document.getElementById(
            "planet"
        );


    planet.style.opacity =
        "1";

    planet.style.transform =
        "translate(-50%,-50%) scale(1)";


    showMessage(
        "PLANETARY BODY DETECTED",
        "UNKNOWN CLASSIFICATION"
    );


    flightStatus.textContent =
        "OBSERVING";


    setTimeout(
        function(){

            planet.style.opacity =
                "0";

            planet.style.transform =
                "translate(-50%,-50%) scale(.2)";

            flightStatus.textContent =
                "CRUISING";

        },
        9000
    );

}


/* =========================================================
   NEBULA ENCOUNTER
========================================================= */

function nebulaEncounter(){

    const n1 =
        document.getElementById(
            "nebula1"
        );

    const n2 =
        document.getElementById(
            "nebula2"
        );


    n1.style.opacity =
        ".9";

    n2.style.opacity =
        ".65";


    showMessage(
        "ENTERING NEBULA",
        "EXTERNAL VISIBILITY REDUCED"
    );


    flightStatus.textContent =
        "NEBULA TRANSIT";


    setTimeout(
        function(){

            n1.style.opacity =
                "0";

            n2.style.opacity =
                "0";

            flightStatus.textContent =
                "CRUISING";

        },
        11000
    );

}


/* =========================================================
   ASTEROID ENCOUNTER
========================================================= */

function asteroidEncounter(){

    const asteroid =
        document.getElementById(
            "asteroid"
        );


    asteroid.style.opacity =
        "1";


    const startY =
        20 +
        Math.random() *
        60;


    asteroid.style.top =
        startY + "%";

    asteroid.style.left =
        "-50px";


    asteroid.animate(

        [

            {
                transform:
                    "translate(0,0) rotate(0deg)"
            },

            {
                transform:
                    "translate(" +
                    (
                        window.innerWidth +
                        150
                    ) +
                    "px,120px) rotate(360deg)"
            }

        ],

        {

            duration:
                1800 +
                Math.random() *
                1500,

            easing:
                "linear"

        }

    );


    showMessage(
        "PROXIMITY ALERT",
        "OBJECT PASSING SHIP"
        ,
        1800
    );


    setTimeout(
        function(){

            asteroid.style.opacity =
                "0";

        },
        3500
    );

}


/* =========================================================
   UNKNOWN SIGNAL
========================================================= */

function signalEncounter(){

    showMessage(
        "UNKNOWN TRANSMISSION",
        "SIGNAL SOURCE UNRESOLVED",
        5000
    );


    flightStatus.textContent =
        "SIGNAL LOCK";


    setTimeout(
        function(){

            flightStatus.textContent =
                "CRUISING";

        },
        5500
    );

}


/* =========================================================
   HYPERSPACE
========================================================= */

function hyperspaceJump(){

    if(hyperspaceMode){

        return;

    }


    hyperspaceMode =
        true;


    const overlay =
        document.getElementById(
            "hyperspace"
        );


    overlay.classList.add(
        "active"
    );


    flightStatus.textContent =
        "FTL DRIVE";


    showMessage(
        "FTL DRIVE ENGAGED",
        "PREPARE FOR TRANSIT",
        3000
    );


    travelSpeed =
        18;


    setTimeout(
        function(){

            flightStatus.textContent =
                "HYPERSPACE";

        },
        1000
    );


    setTimeout(
        function(){

            const flash =
                document.getElementById(
                    "flash"
                );


            flash.style.opacity =
                ".9";


            setTimeout(
                function(){

                    flash.style.opacity =
                        "0";

                },
                120
            );


            travelSpeed =
                2;


            overlay.classList.remove(
                "active"
            );


            hyperspaceMode =
                false;


            flightStatus.textContent =
                "CRUISING";


            showMessage(
                "TRANSIT COMPLETE",
                "NEW SECTOR REACHED",
                3500
            );


        },
        5500
    );

}


/* =========================================================
   RANDOM JOURNEY EVENTS
========================================================= */

const events = [

    planetEncounter,

    nebulaEncounter,

    asteroidEncounter,

    signalEncounter,

    hyperspaceJump

];


function randomEvent(){

    if(
        hyperspaceMode
    ){

        return;

    }


    const event =
        events[
            Math.floor(
                Math.random() *
                events.length
            )
        ];


    event();

}


/*
First arrival message.
*/

setTimeout(
    function(){

        showMessage(
            "YOU ARE OFF WORLD",
            "OBVYRIS TRANSPORT SYSTEM",
            5000
        );

    },
    1000
);


/*
Events occur at irregular intervals.
*/

function scheduleEvent(){

    const delay =
        12000 +
        Math.random() *
        22000;


    setTimeout(
        function(){

            randomEvent();

            scheduleEvent();

        },
        delay
    );

}


scheduleEvent();


/* =========================================================
   OCCASIONAL COMPUTER PULSES
========================================================= */

setInterval(
    function(){

        if(
            !document
                .getElementById(
                    "computer"
                )
                .classList.contains(
                    "open"
                )
        ){

            return;

        }


        const velocity =
            document.getElementById(
                "velocity"
            );


        if(velocity){

            velocity.textContent =
                (
                    16 +
                    Math.random() * 5
                ).toFixed(1)
                + " AU/h";

        }

    },
    1500
);


/* =========================================================
   SHIP VIBRATION
========================================================= */

setInterval(
    function(){

        if(
            Math.random() < .15
        ){

            document
                .getElementById(
                    "cockpit"
                )
                .animate(

                    [

                        {
                            transform:
                                "translate(0,0)"
                        },

                        {
                            transform:
                                "translate(1px,-1px)"
                        },

                        {
                            transform:
                                "translate(-1px,1px)"
                        },

                        {
                            transform:
                                "translate(0,0)"
                        }

                    ],

                    {

                        duration:180,

                        easing:"linear"

                    }

                );

        }

    },
    3000
);

</script>
