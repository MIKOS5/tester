<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales POS — Gear Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;padding:20px;font-family:Inter,sans-serif;background:#0f172a;color:white;min-height:100vh}
.top{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:end;margin-bottom:18px}
.top h1{margin:0;font-size:28px;letter-spacing:-.02em}.top p{color:#94a3b8;font-size:13px;margin-top:6px}
.stats{display:flex;gap:12px;flex-wrap:wrap}
.stat{background:#111827;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px 16px;min-width:140px}
.stat .l{font-size:11px;text-transform:uppercase;color:#94a3b8;font-weight:600}.stat .v{font-size:20px;font-weight:800;margin-top:4px}
.layout{display:grid;grid-template-columns:380px 1fr;gap:16px} @media(max-width:1000px){.layout{grid-template-columns:1fr}}
.card{background:#111827;border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:18px;box-shadow:0 20px 40px rgba(0,0,0,.3)}
label{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#94a3b8;font-weight:600;margin-bottom:6px;display:block}
input,select,textarea{width:100%;padding:12px 14px;background:#1e293b;border:1px solid rgba(255,255,255,.1);border-radius:12px;color:white;font-size:14px;outline:none}
input:focus,select:focus,textarea:focus{border-color:#2563eb;box-shadow:0 0 0 4px rgba(37,99,235,.2)}
.search-box{position:relative;margin-bottom:12px}
#scanInput{padding-left:44px;font-size:16px;font-weight:600;letter-spacing:.02em}
.list{max-height:60vh;overflow:auto;display:flex;flex-direction:column;gap:8px}
.item-row{display:flex;gap:10px;padding:10px 12px;background:#0b1220;border:1px solid rgba(255,255,255,.06);border-radius:12px;cursor:pointer;transition:.15s}
.item-row:hover{border-color:#2563eb;background:#172554}.item-row.selected{border-color:#22c55e;background:rgba(34,197,94,.1)}
.item-row .name{font-weight:700;font-size:13px;color:white;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.item-row .meta{font-size:11px;color:#94a3b8}
.badge{padding:3px 8px;border-radius:999px;font-size:11px;font-weight:600;background:rgba(255,255,255,.1)}.badge.green{background:#166534;color:#bbf7d0}.badge.blue{background:rgba(37,99,235,.2);color:#bfdbfe}
.detail-title{font-size:22px;font-weight:800;color:#60a5fa;line-height:1.2;margin:0 0 8px}
.profit-box{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;background:#0b1220;border:1px dashed rgba(255,255,255,.15);border-radius:12px;padding:14px;margin:14px 0}
.profit-box .k{font-size:11px;color:#94a3b8;text-transform:uppercase;font-weight:600}.profit-box .vv{font-size:18px;font-weight:800;margin-top:2px}
.profit-pos{color:#22c55e}.profit-neg{color:#ef4444}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px} @media(max-width:600px){.grid2{grid-template-columns:1fr}}
.btn{padding:13px 18px;border-radius:12px;border:none;font-weight:800;cursor:pointer;transition:.2s}
.btn-primary{background:#22c55e;color:white;width:100%}.btn-primary:hover{background:#16a34a;transform:translateY(-1px)}
.btn-ghost{background:rgba(255,255,255,.06);color:#cbd5e1;border:1px solid rgba(255,255,255,.1)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#22c55e;color:white;padding:12px 20px;border-radius:999px;font-weight:700;display:none;z-index:200}.toast.show{display:block}.toast.err{background:#dc2626}
.scan-hint{font-size:11px;color:#64748b;margin-top:8px;text-align:center}
</style>
</head>
<body>
<div class="top">
<div><h1>💰 Sales POS</h1><p>Scan Unique ID (GH-...) or search name → sell → profit auto-calculated</p></div>
<div class="stats"><div class="stat"><div class="l">Today Sold</div><div class="v" id="statToday">0</div></div><div class="stat"><div class="l">Today Profit</div><div class="v" id="statProfit" style="color:#22c55e">$0.00</div></div><div class="stat"><div class="l">Inventory Value</div><div class="v" id="statValue">$0</div></div></div>
</div>

<div class="layout">
<div class="card">
<label>Scan / Search (Unique ID, SKU, Name)</label>
<div class="search-box"><span style="position:absolute;left:14px;top:50%;transform:translateY(-50%)">🔎</span><input id="scanInput" placeholder="GH-B9B981BD or Line 6 or 232332" autofocus></div>
<div class="list" id="itemList"><div style="text-align:center;color:#475569;padding:30px">Loading inventory...</div></div>
<div class="scan-hint">Tip: USB barcode scanner works like keyboard → auto-searches</div>
</div>

<div class="card" id="detailCard" style="opacity:.5;pointer-events:none">
<div style="display:flex;justify-content:space-between;gap:12px;align-items:start"><div><div class="detail-title" id="dName">Select an item</div><div id="dMeta" style="font-size:12px;color:#94a3b8">—</div></div><div id="dBadge"></div></div>

<div class="profit-box">
<div><div class="k">Bought For</div><div class="vv" id="pBought">$0.00</div></div>
<div><div class="k">Restoration</div><div class="vv" id="pRestore">$0.00</div></div>
<div><div class="k">Profit</div><div class="vv profit-pos" id="pProfit">$0.00</div></div>
</div>

<form id="saleForm">
<div class="grid2">
<div><label>Selling Price *</label><input type="number" step="0.01" id="sellingPrice" name="Selling Price" required placeholder="250.00"></div>
<div><label>Date Sold *</label><input type="date" id="dateSold" name="Date Sold" required></div>
<div><label>Sales Channel *</label><select id="channel" name="Sales Channel" required><option value="">Select...</option><option>【entity-eBay¦canonical_name=eBay】</option><option>【entity-Reverb.com¦canonical_name=Reverb.com】</option><option>Facebook Marketplace</option><option>In-Person</option><option>Sam Ash</option><option>【entity-Guitar Center¦canonical_name=Guitar Center】</option><option>【entity-OfferUp¦canonical_name=OfferUp】</option><option>Other</option></select></div>
<div><label>Payment Method *</label><select id="payMethod" name="Payment Method" required><option value="">Select...</option><option>Cash</option><option>Card</option><option>【entity-PayPal¦canonical_name=PayPal】</option><option>【entity-Venmo¦canonical_name=Venmo】</option><option>Zelle</option><option>Other</option></select></div>
<div><label>Customer Name / ID</label><input id="customer" name="Customer Name/ID" placeholder="John - FB buyer"></div>
<div><label>Transaction ID</label><input id="txn" name="Transaction ID" placeholder="【entity-eBay¦canonical_name=eBay】 123 / 【entity-PayPal¦canonical_name=PayPal】 ..."></div>
</div>
<label style="margin-top:12px">Special Notes (shipping, fees)</label><textarea id="sNotes" name="Special Notes" rows="2" placeholder="【entity-eBay¦canonical_name=eBay】 fees 13%, shipped UPS..."></textarea>

<div style="display:flex;gap:10px;margin-top:16px"><button type="button" class="btn btn-ghost" style="flex:1" onclick="clearSale()">Clear</button><button type="submit" class="btn btn-primary" id="sellBtn" style="flex:2">💸 Mark as Sold →</button></div>
</form>

<div id="receipt" style="display:none;margin-top:16px;background:#052e16;border:1px solid #166534;border-radius:12px;padding:14px;font-size:12px"></div>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbzDCfZokdDHryVxtuVOuvTb6XUfnMR66_8Xwym3QzaSWgKooI0865_JPtTi0hJ_GDQr/exec";
var allItems=[], selected=null;

function todayISO(){ var d=new Date(); return d.toISOString().slice(0,10); }
document.getElementById("dateSold").value=todayISO();

async function loadAll(){
  var res=await fetch(API_URL+"?action=read");
  var json=await res.json();
  allItems=json.data||[];
  var totalValue=allItems.reduce((s,p)=>s+(Number(p["Purchase Price"])||0),0);
  document.getElementById("statValue").textContent="$"+totalValue.toFixed(0);
  renderList(allItems.slice(0,50));
}
function renderList(list){
  var c=document.getElementById("itemList"); c.innerHTML="";
  if(!list.length){ c.innerHTML='<div style="text-align:center;color:#475569;padding:20px">No matches</div>'; return; }
  list.forEach(function(item){
    var row=document.createElement("div"); row.className="item-row"+(selected && selected["Unique ID"]===item["Unique ID"]?" selected":"");
    row.innerHTML='<div style="flex:1;min-width:0"><div class="name">'+(item["Item Name"]||"")+'</div><div class="meta">'+(item["Brand"]||"")+' • '+(item["SKU/Item Number"]||"")+' • <span style="color:#60a5fa">'+(item["Unique ID"]||"")+'</span></div></div><div style="text-align:right"><div class="badge green">$'+(Number(item["Purchase Price"])||0).toFixed(0)+'</div><div class="meta" style="margin-top:4px">Stock: '+(item["Stock Level"]||0)+'</div></div>';
    row.onclick=function(){ pickItem(item); };
    c.appendChild(row);
  });
}
function pickItem(item){
  selected=item;
  document.getElementById("detailCard").style.opacity="1";
  document.getElementById("detailCard").style.pointerEvents="auto";
  document.getElementById("dName").textContent=item["Item Name"]||"";
  document.getElementById("dMeta").textContent=(item["Brand"]||"")+" • "+(item["Model/Series"]||"")+" • "+(item["Category"]||"").split("//").pop();
  document.getElementById("dBadge").innerHTML='<span class="badge blue">'+(item["Condition"]||"")+'</span> <span class="badge">SKU: '+(item["SKU/Item Number"]||"")+'</span>';
  var bought=Number(item["Purchase Price"])||0;
  var restore=Number(item["Restoration Costs"])||0;
  document.getElementById("pBought").textContent="$"+bought.toFixed(2);
  document.getElementById("pRestore").textContent="$"+restore.toFixed(2);
  var sellInput=document.getElementById("sellingPrice");
  if(!sellInput.value) sellInput.value=(bought*1.6).toFixed(2);
  calcProfit();
  renderList(filtered());
}

function calcProfit(){
  if(!selected) return;
  var bought=Number(selected["Purchase Price"])||0;
  var restore=Number(selected["Restoration Costs"])||0;
  var sell=Number(document.getElementById("sellingPrice").value)||0;
  var profit=sell - bought - restore;
  var el=document.getElementById("pProfit");
  el.textContent=(profit>=0?"+":"")+"$"+profit.toFixed(2);
  el.className="vv "+(profit>=0?"profit-pos":"profit-neg");
}

function filtered(){
  var q=document.getElementById("scanInput").value.toLowerCase().trim();
  if(!q) return allItems.slice(0,50);
  return allItems.filter(function(o){
    return JSON.stringify(o).toLowerCase().indexOf(q)>-1;
  }).slice(0,50);
}

document.getElementById("scanInput").addEventListener("input",function(){
  renderList(filtered());
  // auto-select if exact Unique ID match
  var q=this.value.trim();
  var exact=allItems.find(function(x){ return String(x["Unique ID"]).toLowerCase()===q.toLowerCase(); });
  if(exact) pickItem(exact);
});
document.getElementById("sellingPrice").addEventListener("input",calcProfit);

function clearSale(){
  selected=null;
  document.getElementById("detailCard").style.opacity=".5";
  document.getElementById("detailCard").style.pointerEvents="none";
  document.getElementById("saleForm").reset();
  document.getElementById("dateSold").value=todayISO();
  document.getElementById("receipt").style.display="none";
  document.getElementById("scanInput").value="";
  document.getElementById("scanInput").focus();
  renderList(allItems.slice(0,50));
}

document.getElementById("saleForm").addEventListener("submit",async function(e){
  e.preventDefault();
  if(!selected){ showToast("Select an item first",true); return; }
  var btn=document.getElementById("sellBtn"); btn.disabled=true; btn.textContent="Processing...";
  var payload={
    action:"update",
    "Unique ID": selected["Unique ID"],
    "Selling Price": document.getElementById("sellingPrice").value,
    "Date Sold": document.getElementById("dateSold").value,
    "Sales Channel": document.getElementById("channel").value,
    "Payment Method": document.getElementById("payMethod").value,
    "Customer Name/ID": document.getElementById("customer").value,
    "Transaction ID": document.getElementById("txn").value,
    "Special Notes": document.getElementById("sNotes").value,
    "Stock Level": Math.max(0, (Number(selected["Stock Level"])||1)-1)
  };
  try{
    var res=await fetch(API_URL+"?action=update",{method:"POST",body:JSON.stringify(payload),headers:{"Content-Type":"text/plain;charset=utf-8"}});
    var j=await res.json();
    if(!j.ok) throw new Error(j.error||"Failed");
    var sell=Number(payload["Selling Price"])||0;
    var bought=Number(selected["Purchase Price"])||0;
    var restore=Number(selected["Restoration Costs"])||0;
    var profit=sell-bought-restore;
    document.getElementById("receipt").style.display="block";
    document.getElementById("receipt").innerHTML='<b style="color:#22c55e">✓ Sold!</b><br><br><b>'+selected["Item Name"]+'</b><br>'+selected["Unique ID"]+'<br><br>Bought: $'+bought.toFixed(2)+' + Restore $'+restore.toFixed(2)+'<br>Sold: $'+sell.toFixed(2)+' via '+payload["Sales Channel"]+'<br><b style="color:'+(profit>=0?'#22c55e':'#ef4444')+'">Profit: $'+profit.toFixed(2)+'</b><br><br>Stock left: '+payload["Stock Level"];
    // update local
    Object.assign(selected, payload);
    showToast("Sold! Profit $"+profit.toFixed(2)+" ✓");
    loadAll();
  }catch(err){
    showToast("Error: "+err.message,true);
  }finally{ btn.disabled=false; btn.textContent="💸 Mark as Sold →"; }
});

function showToast(msg,isErr){
  var t=document.getElementById("toast"); t.textContent=msg; t.classList.toggle("err",!!isErr); t.classList.add("show"); setTimeout(function(){ t.classList.remove("show"); },3500);
}

loadAll();
</script>
</body>
</html>
