<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Obvyris Storyteller</title>


<style>

body{

background:#09111d;
color:white;
font-family:Arial,sans-serif;
padding:20px;

}



.storybook{

max-width:900px;
margin:auto;

background:#101c2c;

border-radius:20px;

padding:30px;

box-shadow:0 0 30px #000;

}



h1{

text-align:center;

color:#2793ff;

}



#story{

font-size:20px;

line-height:1.8;

}



.chapter{

margin-bottom:70px;

padding-bottom:40px;

border-bottom:1px solid #27384d;

animation:fadeIn .5s;

}



.chapter h2{

color:#2793ff;

}



.chapter-date{

color:#8aa5c4;

margin-bottom:20px;

}



.chapter-text{

font-size:20px;

line-height:1.8;

}



@keyframes fadeIn{

from{

opacity:0;

transform:translateY(20px);

}

to{

opacity:1;

transform:translateY(0);

}

}



.controls{

display:flex;

gap:10px;

justify-content:center;

margin-top:25px;

flex-wrap:wrap;

}



button{

background:#2793ff;

color:white;

border:none;

padding:12px 20px;

border-radius:10px;

cursor:pointer;

}



button:hover{

opacity:.8;

}



#debug{

margin-top:20px;

padding:10px;

background:#050b12;

border-radius:10px;

font-size:14px;

color:#7cff7c;

}



input{

width:200px;

}

.speaking-word{

background:#2793ff;
color:white;

padding:2px 5px;

border-radius:5px;

box-shadow:0 0 10px #2793ff;

}
  
</style>

</head>



<body>
<div class="controls">


<button onclick="speakStory()">

🔊 Read Story

</button>


<button onclick="pauseStory()">

⏸ Pause

</button>


<button onclick="stopStory()">

⏹ Stop

</button>
</div>
<div class="storybook">


<h1>
📖 Obvyris Storyteller
</h1>


<hr>


<div id="story">

Loading chapters...

</div>


<div id="debug">

Voice debug waiting...

</div>




<label>

Speed

<input 
id="speed"
type="range"
min="0.5"
max="2"
step="0.1"
value="1">

</label>


</div>


</div>



<script>


const API_BASE =

"https://script.google.com/macros/s/AKfycbzVxbM_g8K6mzstGdFt2F0u7NctZ1Qpg8APXGdSSS-l50SqVO4u5QXwzFzKWxQbGMoaBg/exec";



const STORY_API =

API_BASE+"?action=story";



const VOICE_API =

API_BASE+"?action=voices";





let chapters=[];

let loadedChapters=0;

let loading=false;

let currentStory="";

let voiceSettings={};

let browserVoices=[];





// =================================
// LOAD BROWSER VOICES
// =================================


function loadBrowserVoices(){


browserVoices =
speechSynthesis.getVoices();


console.log(

"VOICES",

browserVoices.map(v=>v.name)

);


}



loadBrowserVoices();



speechSynthesis.onvoiceschanged=function(){

loadBrowserVoices();

};





function waitForVoices(){


return new Promise(resolve=>{


let attempts=0;


let timer=setInterval(()=>{


loadBrowserVoices();


attempts++;


if(
browserVoices.length ||
attempts>30
){


clearInterval(timer);

resolve();


}


},100);



});


}







// =================================
// LOAD VOICE SETTINGS
// =================================


async function loadVoiceSettings(){


try{


let r =
await fetch(VOICE_API);



let data =
await r.json();



console.log(
"VOICE API",
data
);



if(data.status==="success"){


voiceSettings=data.voices;


}



}

catch(e){

console.error(e);

}


}








// =================================
// LOAD ALL STORIES
// =================================


async function loadStory(){


try{


let r =
await fetch(STORY_API);



let data =
await r.json();



console.log(
"STORY API",
data
);



if(data.status==="success"){


chapters =
data.chapters;



document.getElementById("story").innerHTML="";



loadNextChapter();


}



}

catch(e){

console.error(
"STORY ERROR",
e
);

}


}







// =================================
// INFINITE SCROLL
// =================================


function loadNextChapter(){


if(
loading ||
loadedChapters >= chapters.length
)

return;



loading=true;



let chapter =
chapters[loadedChapters];



let div =
document.createElement("div");


div.className="chapter";



div.innerHTML=`

<h2>

📖 Chapter ${chapter.chapter}

</h2>


<div class="chapter-date">

📅 ${
new Date(chapter.timestamp)
.toLocaleDateString()

}

</div>


<div class="chapter-text">

${formatStory(chapter.story)}

</div>

`;



document
.getElementById("story")
.appendChild(div);



loadedChapters++;



loading=false;


}






window.addEventListener(
"scroll",
()=>{


if(

window.innerHeight +
window.scrollY >=
document.body.offsetHeight-500

){


loadNextChapter();


}


});






// =================================
// FORMAT STORY
// =================================


function formatStory(text){


let html = text;


// Escape HTML

html = html
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;");



// Wrap words first

html = html.replace(
/([A-Za-z0-9',!?]+)/g,
'<span class="word">$1</span>'
);



// Add chapter title

html = html.replace(
/^# (.*)$/gm,
"<h2>$1</h2>"
);



// Add character tags LAST

html = html.replace(
/\[(.*?)\]/g,
"<b>[$1]</b>"
);



// Line breaks

html = html.replace(
/\n/g,
"<br>"
);


return html;

}

function clearWordHighlight(){

document
.querySelectorAll(".speaking-word")
.forEach(el=>{

el.classList.remove(
"speaking-word"
);

});


}




function highlightWord(word){


clearWordHighlight();


let words =
document.querySelectorAll(".word");



for(let w of words){


if(
w.innerText.toLowerCase()
.replace(/[.,!?]/g,"")

===

word.toLowerCase()
.replace(/[.,!?]/g,"")

){


w.classList.add(
"speaking-word"
);


w.scrollIntoView({

behavior:"smooth",

block:"center"

});


break;


}


}



}
  
// =================================
// SELECT VOICE
// =================================


function selectVoice(character){


let data =
voiceSettings[character];


console.log(
"SELECTING",
character,
data
);



if(!data){

return browserVoices[0];

}





// EXACT VOICE MATCH


if(data.voice){


let wanted =
data.voice.toLowerCase();



let found =
browserVoices.find(v=>

v.name
.toLowerCase()
.includes(wanted)

);



if(found){

return found;

}


}






// TYPE MATCHING


let type =
data.type;



if(
type==="Female Narrator" ||
type==="Female"
){


return browserVoices.find(v=>

v.name.includes("Zira") ||

v.name.includes("Google UK English Female") ||

v.name.includes("Samantha")

)

||

browserVoices[0];


}







if(type==="Robot"){


return browserVoices.find(v=>

v.name.includes("David")

)

||

browserVoices[0];


}







if(type==="High"){


return browserVoices.find(v=>

v.name.includes("Zira") ||

v.name.includes("Samantha")

)

||

browserVoices[0];


}







if(type==="Deep male"){


return browserVoices.find(v=>

v.name.includes("Mark") ||

v.name.includes("David")

)

||

browserVoices[0];


}








if(type==="Computer"){


return browserVoices.find(v=>

v.name.includes("Google") ||

v.name.includes("Microsoft")

)

||

browserVoices[0];


}





return browserVoices[0];


}









// =================================
// READ ENTIRE BOOK
// =================================


async function speakStory(){


speechSynthesis.cancel();



await waitForVoices();



let fullStory="";



chapters.forEach(chapter=>{


fullStory +=

chapter.story +

"\n\n";



});



currentStory =
fullStory;



let lines =
currentStory.split("\n");



speakLine(

lines,

0,

"Narrator"

);



}








// =================================
// SPEAK LINE
// =================================


function speakLine(
lines,
index,
currentCharacter
){



if(index>=lines.length){


document.getElementById("debug").innerHTML=

"Finished reading book 📖";


return;


}





let line =
lines[index].trim();



if(line===""){


speakLine(

lines,

index+1,

currentCharacter

);


return;


}






let tag =
line.match(/\[(.*?)\]/);



if(tag){


currentCharacter =
tag[1];



speakLine(

lines,

index+1,

currentCharacter

);



return;


}







let data =
voiceSettings[currentCharacter];



let settings =
data?.settings ||

{

pitch:1,

rate:1,

volume:1

};






let voice =
selectVoice(currentCharacter);






let utterance =
new SpeechSynthesisUtterance(line);
utterance.onboundary=function(event){


if(event.name==="word"){


let spoken =
line
.substring(
event.charIndex
)
.split(" ")[0];



highlightWord(spoken);


}


};



utterance.voice =
voice;



utterance.pitch =
settings.pitch;



utterance.rate =

settings.rate *

Number(

document
.getElementById("speed")
.value

);



utterance.volume =
settings.volume;






document
.getElementById("debug")
.innerHTML=

`

Speaking: ${currentCharacter}<br>

Type: ${data?.type || "Default"}<br>

Voice: ${voice?.name || "None"}<br>

Pitch: ${utterance.pitch}<br>

Rate: ${utterance.rate}

`;







console.log(

"PLAY",

{

character:currentCharacter,

voice:voice?.name,

text:line

}

);







utterance.onerror=function(e){


console.error(
"TTS ERROR",
e
);


};







utterance.onend=function(){


speakLine(

lines,

index+1,

currentCharacter

);



};







speechSynthesis.speak(
utterance
);



}









// =================================
// CONTROLS
// =================================


function pauseStory(){


speechSynthesis.pause();


}





function stopStory(){


speechSynthesis.cancel();


}









// =================================
// START APP
// =================================


loadVoiceSettings();

loadStory();


</script>


</body>

</html>
