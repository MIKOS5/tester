<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Radio Obvyris - YouTube Player</title>

<style>
body {
  font-family: Arial;
  background: #0b1220;
  color: white;
  padding-bottom: 340px;
}

.item {
  background: #111827;
  border: 1px solid #2b3a55;
  padding: 10px;
  margin: 8px 0;
  cursor: pointer;
  border-radius: 8px;
}

.item:hover {
  background: #1f2937;
}

#player {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 320px;
  background: #000;
  border-top: 2px solid #334155;
}

#controls {
  padding: 6px;
  display: flex;
  gap: 10px;
}
button {
  padding: 5px 10px;
}
</style>
</head>

<body>

<h2>Hybrid YouTube Player (Full Songs)</h2>

<div id="status">Loading...</div>
<div id="list"></div>

<div id="player">
  <div id="nowPlaying" style="padding:6px;">Nothing playing</div>

  <iframe id="yt"
    width="100%"
    height="250"
    frameborder="0"
    allow="autoplay; encrypted-media"
    allowfullscreen></iframe>

  <div id="controls">
    <button onclick="prev()">⏮ Prev</button>
    <button onclick="next()">⏭ Next</button>
    <button onclick="shuffle()">🔀 Shuffle</button>
  </div>
</div>

<script>

const API_URL = "https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnQk8-f99-lPKOSOgwC18MsANHA7qEeJHqCenDCtj_XvulLjTyVJEhVAD1T4MMS9zwhHmRZ2PRyyR1PT7qd0MzXNT23c9_miaR9tbbrEHXccKOqpgvtUguaxgi-EOjMpgpVfp5dAy17jWi5vra2xFCCeaBIgqPsYtLatATGEPsozUlsaZ-PAIQ5-sE1A2bRX7bWBCvdG0AE1RCMJBPUHQXOEpRtZHf3smTl0PRqbFt7eGeVcE_SHrVAAkIiIWFgtFr9ZN9_Isk8wc4684b-UL2voWvEePNNQx2vexl3i-pa0q8DqRFlCjoSjm_QxVnw6Ntpp_MkSQo2i3zHp462T5OaYFO1_ul2TXwjrrg1xDKdAByVWW4w&lib=MXc-WCITJINqWdf85Co8mUx0G2u6XM1aZ";

const YT_KEY = "AIzaSyClZO1lSAK5RHQ6x0CtQtTrQDxqdlwY_i0";

let list = [];
let queue = [];
let index = 0;

async function loadData() {
  const res = await fetch(API_URL);
  const data = await res.json();

  list = Array.isArray(data) ? data : data.data || [];

  document.getElementById("status").innerText =
    "Loaded: " + list.length;

  render(list);
}

function render(items) {
  const container = document.getElementById("list");
  container.innerHTML = "";

  items.forEach((item, i) => {
    const div = document.createElement("div");
    div.className = "item";

    const title = item.title || item.name;
    const artist = item.artist?.name || item.artist;

    div.innerHTML = `<b>${title}</b><br>${artist}`;

    div.onclick = () => {
      queue = items;
      index = i;
      play(index);
    };

    container.appendChild(div);
  });
}

async function play(i) {
  const item = queue[i];
  if (!item) return;

  const title = item.title || item.name;
  const artist = item.artist?.name || item.artist;

  document.getElementById("nowPlaying").innerText =
    `Playing: ${title} - ${artist}`;

  const query = encodeURIComponent(title + " " + artist);

  const url =
    `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=1&q=${query}&key=${YT_KEY}`;

  const res = await fetch(url);
  const data = await res.json();

  const videoId = data.items?.[0]?.id?.videoId;

  if (!videoId) {
    next();
    return;
  }

  document.getElementById("yt").src =
    `https://www.youtube.com/embed/${videoId}?autoplay=1`;

  // auto-next after delay fallback (since iframe doesn't give end event reliably)
  setTimeout(() => {
    next();
  }, 180000); // 3 min fallback
}

function next() {
  index++;
  if (index >= queue.length) index = 0;
  play(index);
}

function prev() {
  index--;
  if (index < 0) index = queue.length - 1;
  play(index);
}

function shuffle() {
  queue = queue.sort(() => Math.random() - 0.5);
  index = 0;
  play(index);
}

loadData();

</script>

</body>
</html>
