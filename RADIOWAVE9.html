<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Deezer API Test</title>

<style>
body {
  font-family: Arial;
  background: #0b1220;
  color: #fff;
  padding: 20px;
}

input, button {
  padding: 10px;
  font-size: 16px;
}

button {
  cursor: pointer;
}

#status {
  margin-top: 10px;
  color: #9ca3af;
}

.item {
  background: #111827;
  padding: 10px;
  margin: 10px 0;
  border-radius: 8px;
}

pre {
  white-space: pre-wrap;
  word-break: break-word;
  background: #0f172a;
  padding: 10px;
  border-radius: 6px;
  overflow-x: auto;
}

img {
  width: 60px;
  height: 60px;
  border-radius: 6px;
}
</style>
</head>

<body>

<h2>Deezer Search Test</h2>

<input id="q" value="alice in chains" />
<button onclick="search()">Search</button>

<div id="status"></div>
<div id="results"></div>

<script>
async function search() {
  const q = document.getElementById("q").value;
  const results = document.getElementById("results");
  const status = document.getElementById("status");

  results.innerHTML = "";
  status.innerText = "Loading...";

  try {
    const url = `https://api.deezer.com/search?q=${encodeURIComponent(q)}`;

    const res = await fetch(url);
    const data = await res.json();

    console.log("FULL RESPONSE:", data);

    if (!data || !data.data) {
      status.innerText = "No data returned.";
      return;
    }

    status.innerText = `Found ${data.data.length} results`;

    data.data.forEach((track, i) => {
      const div = document.createElement("div");
      div.className = "item";

      div.innerHTML = `
        <strong>${i + 1}. ${track.title}</strong><br>
        Artist: ${track.artist?.name || "N/A"}<br>
        Album: ${track.album?.title || "N/A"}<br>
        <img src="${track.album?.cover_small || ''}" /><br><br>

        <details>
          <summary>RAW DATA</summary>
          <pre>${JSON.stringify(track, null, 2)}</pre>
        </details>
      `;

      results.appendChild(div);
    });

  } catch (err) {
    console.error(err);
    status.innerText = "Error loading API (check console)";
  }
}
</script>

</body>
</html>
