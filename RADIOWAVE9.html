<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>API Test Loader</title>

<style>
body {
  font-family: Arial;
  background: #0b1220;
  color: white;
  padding: 20px;
}

.item {
  background: #111827;
  border: 1px solid #2b3a55;
  padding: 10px;
  margin: 10px 0;
  border-radius: 8px;
}

pre {
  background: #000;
  padding: 10px;
  overflow: auto;
}
</style>
</head>

<body>

<h2>Deezer / GAS API Auto Load Test</h2>

<div id="status">Loading...</div>

<h3>Raw JSON</h3>
<pre id="raw"></pre>

<h3>List Output</h3>
<div id="list"></div>

<script>

const API_URL = "https://script.googleusercontent.com/macros/echo?user_content_key=AUkAhnQk8-f99-lPKOSOgwC18MsANHA7qEeJHqCenDCtj_XvulLjTyVJEhVAD1T4MMS9zwhHmRZ2PRyyR1PT7qd0MzXNT23c9_miaR9tbbrEHXccKOqpgvtUguaxgi-EOjMpgpVfp5dAy17jWi5vra2xFCCeaBIgqPsYtLatATGEPsozUlsaZ-PAIQ5-sE1A2bRX7bWBCvdG0AE1RCMJBPUHQXOEpRtZHf3smTl0PRqbFt7eGeVcE_SHrVAAkIiIWFgtFr9ZN9_Isk8wc4684b-UL2voWvEePNNQx2vexl3i-pa0q8DqRFlCjoSjm_QxVnw6Ntpp_MkSQo2i3zHp462T5OaYFO1_ul2TXwjrrg1xDKdAByVWW4w&lib=MXc-WCITJINqWdf85Co8mUx0G2u6XM1aZ";

async function loadData() {
  try {
    const res = await fetch(API_URL);
    const data = await res.json();

    document.getElementById("status").innerText =
      "Loaded: " + (Array.isArray(data) ? data.length : 1) + " items";

    document.getElementById("raw").textContent =
      JSON.stringify(data, null, 2);

    // normalize to array
    const list = Array.isArray(data) ? data : [data];

    renderList(list);

  } catch (err) {
    document.getElementById("status").innerText =
      "Failed to load API: " + err.message;
    console.error(err);
  }
}

function renderList(items) {
  const container = document.getElementById("list");
  container.innerHTML = "";

  items.forEach((item, i) => {
    const div = document.createElement("div");
    div.className = "item";

    let html = `<b>#${i}</b><br><br>`;

    // show ALL fields dynamically
    for (let key in item) {
      html += `<b>${key}:</b> ${item[key]}<br>`;
    }

    div.innerHTML = html;
    container.appendChild(div);
  });
}

loadData();

</script>

</body>
</html>
