<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>IPTV Player</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b1220;
  color: white;
  display: flex;
  height: 100vh;
}

#sidebar {
  width: 320px;
  background: #111827;
  overflow-y: auto;
  border-right: 1px solid #222;
}

#sidebar h2 {
  margin: 10px;
  font-size: 16px;
}

#search {
  width: 90%;
  margin: 10px;
  padding: 8px;
  border-radius: 6px;
  border: none;
}

.channel {
  padding: 10px;
  border-bottom: 1px solid #222;
  cursor: pointer;
}

.channel:hover {
  background: #1f2937;
}

#main {
  flex: 1;
  display: flex;
  flex-direction: column;
}

video {
  width: 100%;
  height: 70%;
  background: black;
}

#nowPlaying {
  padding: 10px;
  background: #111827;
}
</style>
</head>

<body>

<div id="sidebar">
  <h2>IPTV Channels</h2>
  <input id="search" placeholder="Search..." />
  <div id="list"></div>
</div>

<div id="main">
  <video id="video" controls autoplay></video>
  <div id="nowPlaying">Select a channel</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script>
let channels = [];

const listEl = document.getElementById("list");
const searchEl = document.getElementById("search");
const video = document.getElementById("video");
const nowPlaying = document.getElementById("nowPlaying");

// Load M3U
fetch("https://iptv-org.github.io/iptv/index.m3u")
  .then(r => r.text())
  .then(parseM3U)
  .then(data => {
    channels = data;
    renderList(channels);
  });

// Parse M3U
function parseM3U(data) {
  const lines = data.split("\n");
  const result = [];

  let name = "";
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i].trim();

    if (line.startsWith("#EXTINF")) {
      const parts = line.split(",");
      name = parts.slice(1).join(",");
    } 
    else if (line && !line.startsWith("#")) {
      result.push({
        name,
        url: line
      });
    }
  }
  return result;
}

// Render list
function renderList(data) {
  listEl.innerHTML = "";

  data.slice(0, 500).forEach((ch, i) => {
    const div = document.createElement("div");
    div.className = "channel";
    div.textContent = ch.name;

    div.onclick = () => playStream(ch);

    listEl.appendChild(div);
  });
}

// Play stream
function playStream(ch) {
  nowPlaying.textContent = ch.name;

  if (ch.url.endsWith(".m3u8")) {
    if (Hls.isSupported()) {
      const hls = new Hls();
      hls.loadSource(ch.url);
      hls.attachMedia(video);
    } else {
      video.src = ch.url;
    }
  } else {
    video.src = ch.url;
  }

  video.play().catch(() => {});
}

// Search filter
searchEl.addEventListener("input", () => {
  const q = searchEl.value.toLowerCase();
  const filtered = channels.filter(c =>
    c.name.toLowerCase().includes(q)
  );
  renderList(filtered);
});
</script>

</body>
</html>
