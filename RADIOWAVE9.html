<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Deezer Auto List</title>

<style>
body {
  font-family: Arial;
  background: #0b1220;
  color: #fff;
  padding: 20px;
}

.item {
  background: #111827;
  margin: 10px 0;
  padding: 10px;
  border-radius: 8px;
}

pre {
  background: #0f172a;
  padding: 10px;
  overflow-x: auto;
  border-radius: 6px;
  white-space: pre-wrap;
}
</style>
</head>

<body>

<h2>Deezer API Auto Load</h2>
<div id="status">Loading...</div>
<div id="list"></div>

<script>
const API_URL =
"https://script.google.com/macros/s/AKfycbz0jQF_he2_yb1CG-PTUSfPiGZTqS_HTYf404RD1yTUaaEjd9OYgOidCuCBWeB8Yf3yKA/exec" +
encodeURIComponent("https://api.deezer.com/search?q=alice%20in%20chains");
async function load() {
  const status = document.getElementById("status");
  const list = document.getElementById("list");

  try {
    const res = await fetch(API_URL);
    const json = await res.json();

    console.log("FULL API:", json);

    const arr = json.data || [];

    status.innerText = `Loaded ${arr.length} items`;

    // convert to simple array structure
    const simplified = arr.map(track => ({
      title: track.title,
      artist: track.artist?.name,
      album: track.album?.title,
      preview: track.preview,
      cover: track.album?.cover_small,
      raw: track
    }));

    console.log("SIMPLIFIED ARRAY:", simplified);

    simplified.forEach((item, i) => {
      const div = document.createElement("div");
      div.className = "item";

      div.innerHTML = `
        <strong>${i + 1}. ${item.title}</strong><br>
        Artist: ${item.artist}<br>
        Album: ${item.album}<br>
        Preview: ${item.preview ? "Available" : "None"}<br>

        <details>
          <summary>RAW OBJECT</summary>
          <pre>${JSON.stringify(item.raw, null, 2)}</pre>
        </details>
      `;

      list.appendChild(div);
    });

  } catch (err) {
    console.error(err);
    status.innerText = "Failed to load API (likely CORS issue)";
  }
}

load();
</script>

</body>
</html>
