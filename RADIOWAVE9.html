<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>YouTube Only Player</title>

<style>
body {
  font-family: Arial;
  background: #0b1220;
  color: white;
  padding-bottom: 340px;
}

.item {
  background: #111827;
  border: 1px solid #2b3a55;
  padding: 10px;
  margin: 8px 0;
  cursor: pointer;
  border-radius: 8px;
}

.item:hover {
  background: #1f2937;
}

#player {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 320px;
  background: black;
  border-top: 2px solid #334155;
}

#controls {
  padding: 6px;
  display: flex;
  gap: 10px;
}
button {
  padding: 6px 10px;
}
</style>
</head>

<body>

<h2>YouTube Music Player (No JSON)</h2>

<div id="status">Ready</div>
<div id="list"></div>

<div id="player">
  <div id="nowPlaying" style="padding:6px;">Nothing playing</div>

  <iframe id="yt"
    width="100%"
    height="250"
    frameborder="0"
    allow="autoplay; encrypted-media"
    allowfullscreen></iframe>

  <div id="controls">
    <button onclick="prev()">⏮ Prev</button>
    <button onclick="next()">⏭ Next</button>
    <button onclick="shuffle()">🔀 Shuffle</button>
  </div>
</div>

<script>

const YT_KEY = "AIzaSyClZO1lSAK5RHQ6x0CtQtTrQDxqdlwY_i0";

// 🔥 YOUR BUILT-IN PLAYLIST (edit this anytime)
const songs = [
  "Alice In Chains Rooster",
  "Alice In Chains Man in the Box",
  "Nirvana Smells Like Teen Spirit",
  "Soundgarden Black Hole Sun",
  "Pearl Jam Even Flow",
  "Metallica Enter Sandman"
];

let index = 0;

function render() {
  const list = document.getElementById("list");
  list.innerHTML = "";

  songs.forEach((s, i) => {
    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `<b>${s}</b>`;

    div.onclick = () => {
      index = i;
      play(i);
    };

    list.appendChild(div);
  });
}

async function play(i) {
  const query = songs[i];

  document.getElementById("nowPlaying").innerText =
    "Playing: " + query;

  const url =
    `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=1&q=${encodeURIComponent(query)}&key=${YT_KEY}`;

  const res = await fetch(url);
  const data = await res.json();

  const videoId = data.items?.[0]?.id?.videoId;

  if (!videoId) return;

  document.getElementById("yt").src =
    `https://www.youtube.com/embed/${videoId}?autoplay=1`;

}

function next() {
  index = (index + 1) % songs.length;
  play(index);
}

function prev() {
  index = (index - 1 + songs.length) % songs.length;
  play(index);
}

function shuffle() {
  index = Math.floor(Math.random() * songs.length);
  play(index);
}

render();

</script>

</body>
</html>
